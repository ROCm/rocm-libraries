# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directory: "/"
    schedule:
      interval: "daily"
      # Wait a week before adopting newly released action versions.
    cooldown:
      default-days: 7
      exclude:
        - "ROCm/rocm-security-gh*"
    groups:
      rocm-security-gh:
        patterns: ["ROCm/rocm-security-gh*"]
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "projects/hipcub/docs/sphinx" # Location of package manifests
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    groups:
      hipcub-docs-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

