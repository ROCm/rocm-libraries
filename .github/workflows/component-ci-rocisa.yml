name: "Component CI: rocISA"

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
      linux_runner:
        type: string
        required: true
      windows_runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ${{ inputs.linux_runner }}
    container:
      image: ${{ inputs.docker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-linux
        with:
          amdgpu_family: gfx94X-dcgpu

      - name: Test pip install
        uses: ./.github/actions/pip-install-test
        with:
          package_path: projects/hipblaslt/tensilelite/rocisa
          test_path: test

  # The bare `pip install` above builds neither plugin flavour, so the HelloWorldPass
  # integration tests skip there and prove nothing. These two configurations build the
  # plugin paths explicitly and run the same suite with ROCISA_PLUGIN_TEST_MODE set,
  # which turns "prerequisite not built" skips into failures — so a build that quietly
  # stops producing a plugin shows up as red instead of as a skip.
  linux-plugin:
    name: Linux (stinkytofu ${{ matrix.config }})
    runs-on: ${{ inputs.linux_runner }}
    container:
      image: ${{ inputs.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shared stinkytofu: both the dlopen plugin and the compiled-in plugin exist.
          # CMAKE_DISABLE_FIND_PACKAGE_stinkytofu pins rocisa to the monorepo sibling
          # source build (rocisa prefers find_package when a stinkytofu is installed),
          # so STINKYTOFU_BUILD_EXAMPLES/BUILD_SHARED_LIBS below actually take effect
          # instead of being silently ignored by an already-installed stinkytofu.
          - config: shared
            cmake_args: >-
              -DCMAKE_DISABLE_FIND_PACKAGE_stinkytofu=ON
              -DSTINKYTOFU_BUILD_EXAMPLES=ON
              -DROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN=ON
          # Static stinkytofu: only the compiled-in plugin can exist. STINKYTOFU_BUILD_EXAMPLES
          # stays ON deliberately — it is what makes the "no dlopen'able plugin" assertion
          # meaningful, since a build that came out shared despite BUILD_SHARED_LIBS=OFF
          # would then produce one and fail the assertion.
          - config: static
            cmake_args: >-
              -DCMAKE_DISABLE_FIND_PACKAGE_stinkytofu=ON
              -DBUILD_SHARED_LIBS=OFF
              -DSTINKYTOFU_BUILD_EXAMPLES=ON
              -DROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN=ON
    env:
      ROCISA_PLUGIN_TEST_MODE: ${{ matrix.config }}
      # scikit-build-core appends CMAKE_ARGS to the cmake.args in rocisa's pyproject.toml,
      # so this configures the build without the pip-install-test action needing to know
      # anything about it. Job-level env reaches that action's steps.
      CMAKE_ARGS: ${{ matrix.cmake_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-linux
        with:
          amdgpu_family: gfx94X-dcgpu

      - name: Test pip install
        uses: ./.github/actions/pip-install-test
        with:
          package_path: projects/hipblaslt/tensilelite/rocisa
          test_path: test

  windows:
    name: Windows
    runs-on: ${{ inputs.windows_runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-windows
        with:
          amdgpu_family: gfx1151

      - name: Test pip install
        uses: ./.github/actions/pip-install-test
        with:
          package_path: projects/hipblaslt/tensilelite/rocisa
          test_path: test
