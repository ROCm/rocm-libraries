name: "pre-commit checks"
on:
  pull_request:
    branches:
      - develop

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0 # 0 fetches all commit history for --from-ref/--to-ref to function

      - name: Get changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
          
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit


      - name: Run pre-commit checks
        run: |
          echo "================================================"
          echo "Running pre-commit checks on changed files..."
          echo "================================================"
          echo ""

          # mapfile is a bash builtin that reads lines from stdin into an array
          mapfile -t FILTERED_FILES <<< "${{ steps.changed-files.outputs.files }}"

          if ! pre-commit run --show-diff-on-failure --files "${FILTERED_FILES[@]}"; then
            echo ""
            echo "================================================"
            echo "❌ Pre-commit checks FAILED"
            echo "================================================"
            echo ""
            echo "To apply auto-fixes locally:"
            echo -n "  pre-commit run --files "
            printf "%q " "${FILTERED_FILES[@]}"
            echo ""
            echo "Or install pre-commit hooks to run automatically on commits:"
            echo "To exclude files from checks, see CONTRIBUTING.md:"
            echo "  https://github.com/ROCm/rocm-libraries/blob/develop/CONTRIBUTING.md#opting-a-project-into-pre-commit-checks"
            echo ""
            exit 1
          fi

          echo ""
          echo "================================================"
          echo "✅ All pre-commit checks passed"
          echo "================================================"
