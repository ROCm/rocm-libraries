name: Host validation standalone CI

on:
  pull_request:
    paths:
      - "shared/host-validation/**"
      - ".github/workflows/host-validation-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "shared/host-validation/**"
      - ".github/workflows/host-validation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLIS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev ninja-build
          python -m pip install --upgrade pip
          python -m pip install ml_dtypes nanobind numpy

      - name: Configure
        run: |
          cmake -S shared/host-validation \
            -B "${RUNNER_TEMP}/host-validation-build" \
            -G Ninja \
            -DHOST_VALIDATION_BUILD_TESTING=ON \
            -DHOST_VALIDATION_BUILD_PYTHON=ON \
            -DHOST_VALIDATION_BUILD_BLAS_BACKEND=ON \
            -DHOST_VALIDATION_BUILD_MX_BACKEND=ON \
            -DHOST_VALIDATION_BUILD_BENCHMARKS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and test
        run: |
          cmake --build "${RUNNER_TEMP}/host-validation-build" --parallel 2
          ctest \
            --test-dir "${RUNNER_TEMP}/host-validation-build" \
            --output-on-failure

      - name: Install and test package consumers
        run: |
          cmake --install "${RUNNER_TEMP}/host-validation-build" \
            --prefix "${RUNNER_TEMP}/host-validation-install"
          for header in \
            reference_gemm \
            reference_epilogue \
            reference_reduction \
            reference_axpby \
            reference_common \
            reference_softmax \
            reference_layer_norm; do
            test ! -e \
              "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/${header}.hpp"
          done
          test ! -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/data_generation.hpp"
          test ! -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/structured_sparsity.hpp"
          test ! -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/tensor_views.hpp"
          test ! -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/comparison.hpp"
          test ! -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail/comparison_impl.hpp"
          test ! -d \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/detail"
          test -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/typed_comparison.hpp"
          test -e \
            "${RUNNER_TEMP}/host-validation-install/include/roc/host_validation/amd_gpu_layout/mx.hpp"
          test -e \
            "${RUNNER_TEMP}/host-validation-install/share/doc/ROCHostValidation/LICENSE.md"
          cmake -S shared/host-validation/tests/package \
            -B "${RUNNER_TEMP}/host-validation-package-test" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/host-validation-install"
          cmake --build "${RUNNER_TEMP}/host-validation-package-test" --parallel 2
          cmake -S shared/host-validation/tests/package/core_only \
            -B "${RUNNER_TEMP}/host-validation-core-package-test" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/host-validation-install" \
            -DCMAKE_DISABLE_FIND_PACKAGE_BLAS=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE
          cmake --build "${RUNNER_TEMP}/host-validation-core-package-test" --parallel 2
          "${RUNNER_TEMP}/host-validation-core-package-test/host-validation-core-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-operations-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-comparison-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-typed-comparison-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-tiled-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-blas-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-mx-package-test"
          "${RUNNER_TEMP}/host-validation-package-test/host-validation-amd-gpu-layout-package-test"
          PYTHONPATH="$(find "${RUNNER_TEMP}/host-validation-install" \
            -type d -path '*/site-packages' -print -quit)" \
            python -c "import roc_host_validation"

      - name: Test AMD GPU layout module without OpenMP
        run: |
          cmake -S shared/host-validation \
            -B "${RUNNER_TEMP}/host-validation-no-layout-openmp" \
            -G Ninja \
            -DHOST_VALIDATION_BUILD_TESTING=ON \
            -DHOST_VALIDATION_BUILD_PYTHON=OFF \
            -DHOST_VALIDATION_BUILD_MX_BACKEND=OFF \
            -DHOST_VALIDATION_AMD_GPU_LAYOUT_ENABLE_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/host-validation-no-layout-openmp" \
            --target host-validation-amd-gpu-layout-tests \
            --parallel 2
          ctest \
            --test-dir "${RUNNER_TEMP}/host-validation-no-layout-openmp" \
            --tests-regex "^(PreSwizzle|host-validation-amd-gpu-layout-boundary)" \
            --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev ninja-build

      - name: Configure, build, and test with sanitizers
        run: |
          cmake -S shared/host-validation \
            -B "${RUNNER_TEMP}/host-validation-sanitizers" \
            -G Ninja \
            -DHOST_VALIDATION_BUILD_TESTING=ON \
            -DHOST_VALIDATION_BUILD_PYTHON=OFF \
            -DHOST_VALIDATION_BUILD_BLAS_BACKEND=ON \
            -DHOST_VALIDATION_BUILD_MX_BACKEND=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "${RUNNER_TEMP}/host-validation-sanitizers" --parallel 2
          ctest \
            --test-dir "${RUNNER_TEMP}/host-validation-sanitizers" \
            --output-on-failure
