name: HostNumerics standalone CI

on:
  pull_request:
    paths:
      - "shared/hostnumerics/**"
      - ".github/scripts/validate_hostnumerics_install.py"
      - ".github/workflows/hostnumerics-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "shared/hostnumerics/**"
      - ".github/scripts/validate_hostnumerics_install.py"
      - ".github/workflows/hostnumerics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit makes an in-flight validation run for the same ref obsolete.
  group: hostnumerics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep nested CPU-library worker pools bounded independently of build parallelism.
  BLIS_NUM_THREADS: "2"
  GOTO_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  VECLIB_MAXIMUM_THREADS: "2"

jobs:
  standalone:
    name: Python ${{ matrix.python }}, tests ${{ matrix.testing }}, ${{ matrix.generator }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "ON"
            testing: "ON"
            generator: "Ninja Multi-Config"
            blas: "ON"
          - python: "OFF"
            testing: "OFF"
            generator: "Ninja"
            blas: "OFF"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/scripts
            shared/hostnumerics

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.python == 'ON'
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev ninja-build

      - name: Install Python dependencies
        if: matrix.python == 'ON'
        run: python -m pip install ml_dtypes nanobind==3.0.1 numpy

      - name: Configure
        run: |
          if [[ "${{ matrix.python }}" == ON ]]; then
            python_options=("-DPython_EXECUTABLE=$(command -v python)")
          else
            python_options=(-DCMAKE_DISABLE_FIND_PACKAGE_Python=TRUE
                            -DCMAKE_DISABLE_FIND_PACKAGE_nanobind=TRUE)
          fi
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-build" \
            -G "${{ matrix.generator }}" \
            -DHOSTNUMERICS_BUILD_TESTING=${{ matrix.testing }} \
            -DHOSTNUMERICS_BUILD_PYTHON=${{ matrix.python }} \
            -DHOSTNUMERICS_BUILD_BLAS_BACKEND=${{ matrix.blas }} \
            -DHOSTNUMERICS_BUILD_BENCHMARKS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            "${python_options[@]}"

      - name: Build
        run: |
          cmake --build "${RUNNER_TEMP}/hostnumerics-build" \
            --config Release --parallel "$(nproc)"

      - name: Test
        if: matrix.testing == 'ON'
        run: |
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-build" \
            -C Release --no-tests=error --output-on-failure

      - name: Check tests are disabled
        if: matrix.testing == 'OFF'
        run: test ! -e "${RUNNER_TEMP}/hostnumerics-build/CTestTestfile.cmake"

      - name: Install and test package consumers
        run: |
          cmake --install "${RUNNER_TEMP}/hostnumerics-build" \
            --config Release \
            --prefix "${RUNNER_TEMP}/hostnumerics-install"
          python .github/scripts/validate_hostnumerics_install.py \
            --source-dir shared/hostnumerics \
            --build-dir "${RUNNER_TEMP}/hostnumerics-build" \
            --install-prefix "${RUNNER_TEMP}/hostnumerics-install"
          cmake -S shared/hostnumerics/tests/package \
            -B "${RUNNER_TEMP}/hostnumerics-package-test" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/hostnumerics-install"
          cmake --build "${RUNNER_TEMP}/hostnumerics-package-test" --parallel "$(nproc)"
          cmake -S shared/hostnumerics/tests/package/core_only \
            -B "${RUNNER_TEMP}/hostnumerics-core-package-test" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/hostnumerics-install" \
            -DCMAKE_DISABLE_FIND_PACKAGE_BLAS=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE
          cmake --build "${RUNNER_TEMP}/hostnumerics-core-package-test" --parallel "$(nproc)"
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-package-test" \
            --no-tests=error --output-on-failure

      - name: Test installed Python package
        if: matrix.python == 'ON'
        run: |
          PYTHONPATH="$(find "${RUNNER_TEMP}/hostnumerics-install" \
            -type d -path '*/site-packages' -print -quit)" \
            python -c "import hostnumerics; print(hostnumerics.__version__)"

      - name: Test embedded defaults
        if: matrix.python == 'OFF' && matrix.testing == 'OFF'
        run: |
          cmake -S shared/hostnumerics/tests/embedded \
            -B "${RUNNER_TEMP}/hostnumerics-embedded-test" \
            -G Ninja
          cmake --build "${RUNNER_TEMP}/hostnumerics-embedded-test" --parallel "$(nproc)"
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-embedded-test" \
            --no-tests=error --output-on-failure

      - name: Test AMD GPU layout module without OpenMP
        if: matrix.testing == 'ON'
        run: |
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-no-layout-openmp" \
            -G Ninja \
            -DHOSTNUMERICS_BUILD_TESTING=ON \
            -DHOSTNUMERICS_BUILD_PYTHON=OFF \
            -DHOSTNUMERICS_AMD_GPU_LAYOUT_ENABLE_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/hostnumerics-no-layout-openmp" \
            --target hostnumerics-amd-gpu-layout-tests \
            --parallel "$(nproc)"
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-no-layout-openmp" \
            --tests-regex "^(PreSwizzle|hostnumerics-amd-gpu-layout-boundary)" \
            --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/scripts
            shared/hostnumerics

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev ninja-build

      - name: Configure, build, and test with sanitizers
        run: |
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-sanitizers" \
            -G Ninja \
            -DHOSTNUMERICS_BUILD_TESTING=ON \
            -DHOSTNUMERICS_BUILD_PYTHON=OFF \
            -DHOSTNUMERICS_BUILD_BLAS_BACKEND=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "${RUNNER_TEMP}/hostnumerics-sanitizers" --parallel "$(nproc)"
          ctest \
            --test-dir "${RUNNER_TEMP}/hostnumerics-sanitizers" \
            --exclude-regex '^hostnumerics-package-components$' \
            --output-on-failure
