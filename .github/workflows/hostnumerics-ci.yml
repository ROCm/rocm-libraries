name: HostNumerics standalone CI

on:
  pull_request:
    paths:
      - "shared/hostnumerics/**"
      - ".github/workflows/hostnumerics-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "shared/hostnumerics/**"
      - ".github/workflows/hostnumerics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostnumerics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: GCC, Python ${{ matrix.python }}, tests ${{ matrix.testing }}, ${{ matrix.generator }}, GTest ${{ matrix.gtest }}
    runs-on: ubuntu-24.04
    env:
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "ON"
            testing: "ON"
            generator: "Ninja Multi-Config"
            gtest: "installed"
            fetch: "OFF"
          - python: "OFF"
            testing: "OFF"
            generator: "Ninja"
            gtest: "fetched"
            fetch: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: shared/hostnumerics
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.python == 'ON'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: matrix.python == 'ON'
        run: python -m pip install nanobind==3.0.1 numpy

      - name: Install GoogleTest
        if: matrix.gtest == 'installed'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtest-dev

      - name: Configure and build
        run: |
          if [[ "${{ matrix.python }}" == ON ]]; then
            python_options=("-DPython_EXECUTABLE=$(command -v python)")
          else
            python_options=(-DCMAKE_DISABLE_FIND_PACKAGE_Python=TRUE
                            -DCMAKE_DISABLE_FIND_PACKAGE_nanobind=TRUE)
          fi
          gtest_options=()
          if [[ "${{ matrix.testing }}" == ON ]]; then
            gtest_options=(-DHOSTNUMERICS_ENABLE_FETCH=${{ matrix.fetch }})
          fi
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-build" \
            -G "${{ matrix.generator }}" \
            -DHOSTNUMERICS_BUILD_TESTING=${{ matrix.testing }} \
            -DHOSTNUMERICS_BUILD_PYTHON=${{ matrix.python }} \
            -DCMAKE_BUILD_TYPE=Release \
            "${python_options[@]}" "${gtest_options[@]}"
          cmake --build "${RUNNER_TEMP}/hostnumerics-build" \
            --config Release --parallel "$(nproc)"

      - name: Test
        if: matrix.testing == 'ON'
        run: |
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-build" \
            -C Release --no-tests=error --output-on-failure

      - name: Check tests are disabled
        if: matrix.testing == 'OFF'
        run: test ! -e "${RUNNER_TEMP}/hostnumerics-build/CTestTestfile.cmake"

      - name: Test installed package
        run: |
          cmake --install "${RUNNER_TEMP}/hostnumerics-build" \
            --config Release \
            --prefix "${RUNNER_TEMP}/hostnumerics-install"
          cmake -S shared/hostnumerics/tests/package \
            -B "${RUNNER_TEMP}/hostnumerics-package-test" \
            -G Ninja \
            -DHOSTNUMERICS_SOURCE_DIR="${GITHUB_WORKSPACE}/shared/hostnumerics" \
            -DHOSTNUMERICS_ENABLE_FETCH=${{ matrix.fetch }} \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/hostnumerics-install"
          cmake --build "${RUNNER_TEMP}/hostnumerics-package-test" --parallel "$(nproc)"
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-package-test" \
            --no-tests=error --output-on-failure

      - name: Test installed Python package
        if: matrix.python == 'ON'
        run: |
          PYTHONPATH="$(find "${RUNNER_TEMP}/hostnumerics-install" \
            -type d -path '*/site-packages' -print -quit)" \
            python -c "import hostnumerics; print(hostnumerics.__version__)"

      - name: Test embedded defaults
        if: matrix.python == 'OFF' && matrix.testing == 'OFF'
        run: |
          cmake -S shared/hostnumerics/tests/embedded \
            -B "${RUNNER_TEMP}/hostnumerics-embedded-test" \
            -DHOSTNUMERICS_SOURCE_DIR="${GITHUB_WORKSPACE}/shared/hostnumerics" \
            -G Ninja
          cmake --build "${RUNNER_TEMP}/hostnumerics-embedded-test" --parallel "$(nproc)"
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-embedded-test" \
            --no-tests=error --output-on-failure

  windows:
    name: Windows, MSVC, native C++
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: shared/hostnumerics
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Keep this initial Windows job focused on native MSVC and CMake package
      # coverage. Linux already tests the Python bindings and installed import;
      # Windows binding builds and installed imports can follow separately.
      - name: Configure
        run: >-
          cmake -S shared/hostnumerics
          -B "${{ runner.temp }}/hostnumerics-windows"
          -G Ninja
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -DHOSTNUMERICS_BUILD_TESTING=ON
          -DHOSTNUMERICS_BUILD_PYTHON=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Python=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_nanobind=TRUE

      - name: Build
        run: cmake --build "${{ runner.temp }}/hostnumerics-windows" --parallel 4

      - name: Test native C++
        run: >-
          ctest --test-dir "${{ runner.temp }}/hostnumerics-windows"
          --no-tests=error --output-on-failure

      - name: Install
        run: >-
          cmake --install "${{ runner.temp }}/hostnumerics-windows"
          --prefix "${{ runner.temp }}/hostnumerics-windows-install"

      - name: Configure installed-package consumer
        run: >-
          cmake -S shared/hostnumerics/tests/package
          -B "${{ runner.temp }}/hostnumerics-windows-package-test"
          -G Ninja
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -DHOSTNUMERICS_SOURCE_DIR:PATH="${{ github.workspace }}/shared/hostnumerics"
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/hostnumerics-windows-install"

      - name: Build installed-package consumer
        run: >-
          cmake --build "${{ runner.temp }}/hostnumerics-windows-package-test"
          --parallel 4

      - name: Test installed-package consumer
        run: >-
          ctest --test-dir "${{ runner.temp }}/hostnumerics-windows-package-test"
          --no-tests=error --output-on-failure

  sanitizers:
    name: Clang, ASan and UBSan
    runs-on: ubuntu-24.04
    env:
      # Match the Clang and sanitizer runtime packages installed below.
      CXX: clang++-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: shared/hostnumerics
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libclang-rt-18-dev ninja-build

      - name: Install Python dependencies
        run: python -m pip install nanobind==3.0.1 numpy

      - name: Configure and build
        run: |
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-sanitizers" \
            -G Ninja \
            -DHOSTNUMERICS_BUILD_TESTING=ON \
            -DHOSTNUMERICS_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "${RUNNER_TEMP}/hostnumerics-sanitizers" --parallel "$(nproc)"

      - name: Test
        run: |
          # Python tests run below with the matching ASan runtime preloaded.
          ctest --test-dir "${RUNNER_TEMP}/hostnumerics-sanitizers" \
            --exclude-regex '^hostnumerics-python-.*$' \
            --no-tests=error --output-on-failure

      - name: Test Python with sanitizers
        env:
          # CPython owns process-lifetime allocations; retain bounds/UB checks.
          ASAN_OPTIONS: detect_leaks=0
          PYTHONMALLOC: malloc
          PYTHONPATH: ${{ runner.temp }}/hostnumerics-sanitizers/python/Debug
        run: |
          cxx_compiler="$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' \
            "${RUNNER_TEMP}/hostnumerics-sanitizers/CMakeCache.txt")"
          asan_runtime="$("$cxx_compiler" -print-file-name=libclang_rt.asan-x86_64.so)"
          test -f "$asan_runtime"
          LD_PRELOAD="$asan_runtime" \
            python -m unittest discover \
              -s shared/hostnumerics/python/tests -p 'test_*.py' -v

  # Keep CPU-only analysis on the same sparse checkout and Ubuntu runner as the
  # standalone tests; the shared clang-tidy workflow currently installs ROCm.
  clang-tidy:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: shared/hostnumerics
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-tidy-18 ninja-build

      - name: Install Python dependencies
        run: python -m pip install nanobind==3.0.1 numpy

      - name: Configure and build
        run: |
          cmake -S shared/hostnumerics \
            -B "${RUNNER_TEMP}/hostnumerics-clang-tidy" \
            -G Ninja \
            -DHOSTNUMERICS_BUILD_TESTING=ON \
            -DHOSTNUMERICS_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "${RUNNER_TEMP}/hostnumerics-clang-tidy" --parallel "$(nproc)"

      - name: Analyze HostNumerics sources, tests, and Python bindings
        run: |
          run-clang-tidy-18 \
            -p "${RUNNER_TEMP}/hostnumerics-clang-tidy" \
            -clang-tidy-binary clang-tidy-18 \
            -config-file shared/hostnumerics/.clang-tidy \
            -j "$(nproc)" '(^|/)shared/hostnumerics/'
