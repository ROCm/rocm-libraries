#
# Run a gated shape queue under rocjitsu CPU emulation, reusing an
# existing TheRock artifact set. The minimum emulator ref is checked below.

name: TheRock rocjitsu tensilelite test Linux

on:
  workflow_call:
    inputs:
      therock_ref:
        type: string
        required: true
      build_runs_on:
        type: string
        required: true
      amdgpu_families:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: true
      strategy:
        type: string
        default: "shape"
      workers:
        type: string
        default: "96"
      reference_workers:
        type: string
        default: "16"
      dispatch_threads:
        type: string
        default: "1"
      allocations:
        type: string
        default: "48:1,32:2,16:4"
      max_work:
        type: string
        default: "68719476736"
      per_job_seconds:
        type: string
        default: "600"
      case_filter:
        type: string
        default: ""
      job_minutes:
        type: number
        default: 35
      suite_seconds:
        type: string
        default: "1200"

permissions:
  contents: read

jobs:
  rocjitsu-tensilelite-linux:
    name: rocjitsu tensilelite (${{ inputs.amdgpu_families }})
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: ${{ inputs.job_minutes }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      OUTPUT_ARTIFACTS_DIR: ./build
      ROCM_PATH: ${{ github.workspace }}/build
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      SCRIPTS_DIR: ${{ github.workspace }}/rocm-libraries/.github/scripts
      REPORT_DIR: ${{ github.workspace }}/rocjitsu-tensilelite-reports
      SUITE_TIMEOUT_SECONDS: ${{ inputs.suite_seconds }}
      STRATEGY: ${{ inputs.strategy }}
      REQUESTED_WORKERS: ${{ inputs.workers }}
      REQUESTED_REFERENCE_WORKERS: ${{ inputs.reference_workers }}
      REQUESTED_DISPATCH_THREADS: ${{ inputs.dispatch_threads }}
      REQUESTED_ALLOCATIONS: ${{ inputs.allocations }}
      CASE_FILTER: ${{ inputs.case_filter }}
      MAX_WORK: ${{ inputs.max_work }}
      PER_JOB_SECONDS: ${{ inputs.per_job_seconds }}
      # Mirage otherwise creates a Tokio pool sized to the whole host per job.
      TOKIO_WORKER_THREADS: "1"
      # Oldest rocm-systems commit this lane passes with (it has #13534, the lost
      # engine wakeup behind the hipMemcpy hangs, and #13538, the aliased TDM
      # operand behind the gsuaad hang). If therock_ref's rocjitsu predates it,
      # the job builds rocjitsu at this commit instead; empty always uses TheRock's.
      ROCJITSU_MIN_REF: f52ec1d75506bbde7510257e25141e7e3c3db68d
    steps:
      - name: Validate experiment inputs
        run: |
          [[ "${ARTIFACT_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::artifact_run_id must identify an existing run"; exit 1; }
          [[ -n "${CASE_FILTER}" ]] || { echo "::error::case_filter must explicitly select the workload"; exit 1; }
          [[ "${SUITE_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]] || { echo "::error::suite_seconds must be an integer"; exit 1; }
          (( SUITE_TIMEOUT_SECONDS > 0 && SUITE_TIMEOUT_SECONDS <= 19800 )) || { echo "::error::suite_seconds must be 1..19800"; exit 1; }
          [[ "${MAX_WORK}" =~ ^[0-9]+$ ]] && (( MAX_WORK > 0 )) || { echo "::error::max_work must be a positive integer"; exit 1; }
          [[ "${PER_JOB_SECONDS}" =~ ^[0-9]+$ ]] && (( PER_JOB_SECONDS > 0 && PER_JOB_SECONDS <= SUITE_TIMEOUT_SECONDS )) || { echo "::error::per_job_seconds must be 1..suite_seconds"; exit 1; }
          [[ "${STRATEGY}" =~ ^(shape|reference|paired|safety|matrix|allocation|partition)$ ]] || { echo "::error::invalid strategy"; exit 1; }
          trials=1
          [[ "${STRATEGY}" != paired && "${STRATEGY}" != safety ]] || trials=2
          [[ "${STRATEGY}" != matrix && "${STRATEGY}" != partition ]] || trials=3
          if [[ "${STRATEGY}" == allocation ]]; then
            IFS=',' read -ra pairs <<< "${REQUESTED_ALLOCATIONS}"
            trials=${#pairs[@]}
            (( trials >= 2 )) || { echo "::error::allocation requires at least two pairs"; exit 1; }
            for pair in "${pairs[@]}"; do
              [[ "${pair}" =~ ^[1-9][0-9]*:[124]$ ]] || { echo "::error::allocations must be workers:dispatch pairs with dispatch 1, 2 or 4"; exit 1; }
              count=${pair%:*}
              width=${pair#*:}
              (( count * width <= $(nproc) )) || { echo "::error::allocation exceeds host CPU count"; exit 1; }
            done
          fi
          (( trials * SUITE_TIMEOUT_SECONDS <= 1500 )) || { echo "::error::trial execution limits must total at most 1500 seconds"; exit 1; }
          [[ "${REQUESTED_DISPATCH_THREADS}" =~ ^[124]$ ]] || { echo "::error::dispatch_threads must be 1, 2 or 4"; exit 1; }

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: ./.github/actions/setup_test_environment
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: --blas --tests --rocjitsu --mirage

      - name: Install TensileLite test requirements
        run: |
          python ./build_tools/install_additional_requirements.py \
            --requirements-files "${ROCM_PATH}/share/hipblaslt/tensilelite/requirements-test.txt"

      - name: Validate rocjitsu harness
        run: |
          python -m unittest discover -v -s "${SCRIPTS_DIR}/tests" -p 'rocjitsu*_test.py'

      - name: Choose rocjitsu source
        id: rocjitsu-source
        if: ${{ env.ROCJITSU_MIN_REF != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The TheRock checkout records the rocm-systems commit its rocjitsu is built from.
          pinned="$(git ls-tree HEAD rocm-systems | awk '{print $3}')"
          status="$(python - "${ROCJITSU_MIN_REF}" "${pinned}" <<'PY'
          import json, os, sys, urllib.request
          base, head = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/ROCm/rocm-systems/compare/{base}...{head}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          try:
              print(json.load(urllib.request.urlopen(request, timeout=60))["status"])
          except (OSError, ValueError, KeyError) as error:
              print(f"unknown ({error})")
          PY
          )"
          echo "TheRock rocm-systems ${pinned:-not found} vs ${ROCJITSU_MIN_REF}: ${status}"
          case "${status}" in
            ahead|identical) echo "Using TheRock's rocjitsu" ;;
            *) echo "ref=${ROCJITSU_MIN_REF}" >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Checkout rocm-systems for rocjitsu
        if: ${{ steps.rocjitsu-source.outputs.ref != '' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ROCm/rocm-systems
          ref: ${{ steps.rocjitsu-source.outputs.ref }}
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu
            shared/machine-readable-isa/isa
          sparse-checkout-cone-mode: true

      # mirage loads ROCJITSU_LIB instead of the artifact's librocjitsu.so. The
      # options match TheRock's build: LTO and x86-64-v3 measured within 2%.
      - name: Build rocjitsu
        if: ${{ steps.rocjitsu-source.outputs.ref != '' }}
        run: |
          set -euo pipefail
          # The image provides C++ build tools; rocjitsu vendors its DRM headers.
          build_dir="${GITHUB_WORKSPACE}/rocjitsu-build"
          cmake -S rocm-systems/emulation/rocjitsu -B "${build_dir}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DROCM_PATH="${ROCM_PATH}" -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DCMAKE_CXX_FLAGS="-Wno-error=unknown-warning-option -Wno-error=nested-anon-types"
          cmake --build "${build_dir}" --parallel "$(nproc)" --target rocjitsu_shared
          {
            echo "ROCJITSU_LIB=${build_dir}/librocjitsu.so"
            echo "ROCJITSU_CONFIG_DIR=${GITHUB_WORKSPACE}/rocm-systems/emulation/rocjitsu/configs"
          } >> "${GITHUB_ENV}"

      - name: Configure rocjitsu emulation
        run: |
          set -euo pipefail
          case "${AMDGPU_FAMILIES}" in
            gfx94*)  target=gfx942;  profile=mi300x; config=gfx942_cdna3_kmd.json ;;
            gfx950*) target=gfx950;  profile=mi350x; config=gfx950_mi355x_kmd.json ;;
            gfx125*) target=gfx1250; profile=mi450x; config=gfx1250_mi455x.json ;;
            *) echo "::error::Unsupported rocjitsu family: ${AMDGPU_FAMILIES}"; exit 1 ;;
          esac
          tensilelite_root="${ROCM_PATH}/share/hipblaslt/tensilelite"
          client="${ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
          rocjitsu_lib="${ROCJITSU_LIB:-${ROCM_PATH}/lib/librocjitsu.so}"
          config="${ROCJITSU_CONFIG_DIR:-${ROCM_PATH}/share/rocjitsu/configs}/${config}"
          for required in "${ROCM_PATH}/bin/mirage" "${rocjitsu_lib}" \
              "${config}" "${tensilelite_root}" "${tensilelite_root}/pytest.ini" "${client}"; do
            [[ -e "${required}" ]] || { echo "::error::Missing from artifacts: ${required}"; exit 1; }
          done

          # Each queue task owns its emulator. Generation and references stay
          # serial while the experiment varies clients and dispatch width.
          cores="$(nproc)"
          workers="${REQUESTED_WORKERS}"
          [[ "${workers}" =~ ^[0-9]+$ ]] || { echo "::error::workers must be an integer"; exit 1; }
          [[ "${REQUESTED_REFERENCE_WORKERS}" =~ ^[0-9]+$ ]] && (( REQUESTED_REFERENCE_WORKERS > 0 && REQUESTED_REFERENCE_WORKERS <= cores )) || { echo "::error::reference_workers must be 1..host CPU count"; exit 1; }
          [[ "${REQUESTED_DISPATCH_THREADS}" =~ ^[0-9]+$ ]] || { echo "::error::dispatch_threads must be an integer"; exit 1; }
          (( workers > 0 )) || workers=$(( cores < 16 ? cores : 16 ))
          (( workers <= cores )) || { echo "::error::workers exceeds host CPU count"; exit 1; }
          budget="${REQUESTED_DISPATCH_THREADS}"
          mkdir -p "${REPORT_DIR}/junit"
          cp "${config}" "${REPORT_DIR}/artifact-config.json"
          python - "${config}" \
              "${REPORT_DIR}/rocjitsu-config.json" "${budget}" "${REQUESTED_DISPATCH_THREADS}" <<'PY'
          import json, sys
          source, destination, budget, dispatch = sys.argv[1:]
          config = json.load(open(source))
          config["cpu_thread_budget"] = int(budget)
          # With more than one engine thread, a StreamK ready flag is sometimes
          # left set after the kernel (caught by the Synchronizer check), so pin
          # one even when a larger runner's budget would allocate two.
          config["num_threads"] = 1
          if int(dispatch):
              config["cpu_dispatch_threads"] = int(dispatch)
              config["async_helper_threads"] = 0
          json.dump(config, open(destination, "w"), indent=2)
          PY

          # The compiler runtime is flat or under a host-triple directory.
          llvm_lib="${ROCM_PATH}/lib/llvm/lib"
          for candidate in "${llvm_lib}" "${llvm_lib}/$(uname -m)-unknown-linux-gnu"; do
            [[ -e "${candidate}/libomp.so" ]] && llvm_lib_path="${llvm_lib}:${candidate}" && break
          done
          [[ -n "${llvm_lib_path:-}" ]] || { echo "::error::libomp.so not found under ${llvm_lib}"; exit 1; }

          {
            echo "ROCJITSU_TARGET=${target}"
            echo "MIRAGE_PROFILE=${profile}"
            echo "PYTEST_WORKERS=${workers}"
            # The CPU reference explicitly requests threads; enforce the limit.
            echo "OMP_NUM_THREADS=1"
            echo "OMP_THREAD_LIMIT=1"
            echo "OPENBLAS_NUM_THREADS=1"
            echo "MKL_NUM_THREADS=1"
            echo "TENSILELITE_ROOT=${tensilelite_root}"
            echo "TENSILELITE_CLIENT=${client}"
            echo "ROCJITSU_EFFECTIVE_LIB=${rocjitsu_lib}"
            echo "LD_LIBRARY_PATH=${ROCM_PATH}/lib:${ROCM_PATH}/lib/rocm_sysdeps/lib:${llvm_lib_path}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
            echo "PYTHONPATH=${SCRIPTS_DIR}:${tensilelite_root}${PYTHONPATH:+:${PYTHONPATH}}"
          } >> "${GITHUB_ENV}"
          echo "${ROCM_PATH}/bin" >> "${GITHUB_PATH}"
          echo "${ROCM_PATH}/lib/llvm/bin" >> "${GITHUB_PATH}"

          echo "target=${target} profile=${profile} config=${config}"
          echo "host_cores=${cores} queue_workers=${workers} cpu_thread_budget=${budget} omp_thread_limit=1"
          grep MemTotal /proc/meminfo
          "${ROCM_PATH}/bin/mirage" --version
          echo "rocjitsu library: ${rocjitsu_lib}"
          grep -a -oE 'git (revision|commit): [^[:cntrl:]]+' "${rocjitsu_lib}" | sort -u || true
          python -c 'import sys; print(sys.version)'
          # The test venv has no pip, so list packages through importlib.
          python - > "${REPORT_DIR}/python-packages.txt" <<'PY'
          from importlib.metadata import distributions
          print("\n".join(sorted(f"{d.metadata['Name']}=={d.version}" for d in distributions())))
          PY

      - name: Resolve frozen calibration cohort
        if: ${{ inputs.case_filter == 'calibration16' }}
        run: |
          python - "${SCRIPTS_DIR}/rocjitsu_calibration_cohort.json" >> "${GITHUB_ENV}" <<'PYTHON'
          import json, sys
          manifest = sys.argv[1]
          cohort = json.load(open(manifest))
          print("CASE_FILTER=" + " or ".join(s["path"] for s in cohort["sources"]))
          print("COHORT_MANIFEST=" + manifest)
          PYTHON

      - name: Prepare gated shape queue
        timeout-minutes: 5
        run: |
          set -o pipefail
          cd "${REPORT_DIR}"
          mirage run --profile "${MIRAGE_PROFILE}" --in-process \
              --config "${REPORT_DIR}/rocjitsu-config.json" -- \
            python -m pytest "${TENSILELITE_ROOT}/tensilelite/Tests/common/test_config.py" \
              -c "${TENSILELITE_ROOT}/pytest.ini" \
              -p rocjitsu_shape_plan -p rocjitsu_evidence --capture=fd --collect-only -q -p no:cacheprovider \
              --rocjitsu-evidence-dir="${REPORT_DIR}/collection" \
              --rocjitsu-shape-plan="${REPORT_DIR}/shape-plan.json" \
              --rocjitsu-max-work="${MAX_WORK}" \
              -m "${ROCJITSU_TARGET}" --gpu-targets="${ROCJITSU_TARGET}" \
              -k "${CASE_FILTER}" \
            2>&1 | tee "${REPORT_DIR}/shape-plan.log"

      - name: Run audited scheduling experiment
        id: tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          python "${SCRIPTS_DIR}/rocjitsu_experiment.py" \
            --report-dir "${REPORT_DIR}" --strategy "${STRATEGY}" \
            --workers "${PYTEST_WORKERS}" --reference-workers "${REQUESTED_REFERENCE_WORKERS}" \
            --dispatch-threads "${REQUESTED_DISPATCH_THREADS}" --allocations "${REQUESTED_ALLOCATIONS}" \
            --per-job-seconds "${PER_JOB_SECONDS}" \
            --suite-seconds "${SUITE_TIMEOUT_SECONDS}" \
            2>&1 | tee "${REPORT_DIR}/experiment.log"

      - name: Check experiment completeness and record memory
        if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        run: |
          python - "${REPORT_DIR}" <<'PYTHON'
          import json, sys
          from pathlib import Path
          from rocjitsu_check_suite import memory_lines
          root = Path(sys.argv[1])
          (root / "container-memory.txt").write_text("\n".join(memory_lines(Path("/sys/fs/cgroup"))) + "\n")
          final = root / "experiment.json"
          if not final.is_file():
              sys.exit("experiment.json missing: the experiment did not finish")
          report = json.loads(final.read_text())
          if not report["complete"] or report["exit_code"]:
              sys.exit("experiment failed its completion or coverage checks")
          for strategy in report["strategies"]:
              execution = json.loads((root / strategy / "execution.json").read_text())
              if not execution["complete"] or execution["exit_code"]:
                  sys.exit(f"incomplete or failed strategy: {strategy}")
          PYTHON

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: rocjitsu-tensilelite-reports-${{ inputs.amdgpu_families }}
          path: rocjitsu-tensilelite-reports/
          if-no-files-found: ignore
