name: THROWAWAY - offline CK-loader cross-arch dbsync validation

# Temporary, disposable workflow. Validates the MIOpen change that makes
# MIOPEN_DEVICE_ARCH redirect the CK grouped-conv loader
# (GetOfflineOrCurrentDeviceName). Goal: run StaticFDBSync GPU-free for a
# DIFFERENT arch than the interposer emulates, using ONE cdna3 rocjitsu config
# + MIOPEN_DEVICE_ARCH -- no HSA_OVERRIDE, no arch-matched emulation config.
#
# Prior POC on this branch showed HSA_OVERRIDE_GFX_VERSION breaks the rocjitsu
# device (hipGetDevice fails); that path is abandoned. This run tests the
# code-change path instead.
#
# Matrix (both under the cdna3 rocjitsu config, which reports gfx942):
#   - gfx942 : MIOPEN_DEVICE_ARCH=gfx942 -> control; arch matches emulation, so
#              behavior is identical to no-change (loads gfx942 CK lib).
#   - gfx90a : MIOPEN_DEVICE_ARCH=gfx90a -> TEST; must load
#              libMIOpenCKGroupedConv_gfx90a.so and run gfx90a params against
#              gfx90a DBs, on a gfx942-emulated device.
#
# Success = gfx90a leg loads libMIOpenCKGroupedConv_gfx90a.so and runs the
# gfx90a StaticFDBSync params (no "No device" crash, params not skipped).
# Individual stale-entry failures are legitimate dbsync findings, not a failure
# of the mechanism. Delete this file / branch once validated.

on:
  push:
    branches:
      - users/jlichtne/throwaway-hsa-override-dbsync-poc

jobs:
  offline-ckloader-dbsync:
    name: "offline CK-loader dbsync (${{ matrix.target }})"
    timeout-minutes: 60
    container:
      image: rocm/miopen-dev:latest
    strategy:
      fail-fast: false
      matrix:
        target: [gfx942, gfx90a]
    runs-on: azure-linux-scale-rocm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            projects/miopen
            shared/ctest

      - name: Pull DVC files for rocm-libraries
        run: |
          if command -v dvc &> /dev/null; then echo "dvc detected"; else echo "Warning, dvc not detected!"; fi
          LOGNAME=github-runner dvc pull -v

      - name: Confirm no GPU present (interposer required)
        run: |
          ls -la /dev | grep -i kfd || echo "no /dev/kfd (GPU-less, as intended)"

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Build rocjitsu KMD
        run: |
          apt-get update && apt-get install -y libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j$(nproc)

      - name: Probe emulated gcnArchName (should be gfx942 for BOTH legs)
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          cat > /tmp/arch_probe.cpp <<'EOF'
          #include <hip/hip_runtime.h>
          #include <cstdio>
          int main() {
            int d = 0;
            if (hipGetDevice(&d) != hipSuccess) { printf("PROBE: hipGetDevice FAILED\n"); return 2; }
            hipDeviceProp_t p{};
            if (hipGetDeviceProperties(&p, d) != hipSuccess) { printf("PROBE: props FAILED\n"); return 3; }
            printf("PROBE: gcnArchName=%s multiProcessorCount=%d warpSize=%d\n",
                   p.gcnArchName, p.multiProcessorCount, p.warpSize);
            return 0;
          }
          EOF
          /opt/rocm/bin/hipcc /tmp/arch_probe.cpp -o /tmp/arch_probe
          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so
          set +e; out=$(LD_PRELOAD=$PRELOAD /tmp/arch_probe 2>&1); set -e
          echo "$out"
          echo "### ${{ matrix.target }} leg: emulated device probe -> \`$out\` (MIOPEN_DEVICE_ARCH will select gfx target)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure and build (${{ matrix.target }})
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/miopen -B build \
            -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
            -DCMAKE_BUILD_TYPE=release \
            -DBUILD_DEV=OFF \
            -DMIOPEN_TEST_DISCRETE=OFF \
            -DMIOPEN_USE_MLIR=ON \
            -DMIOPEN_GPU_SYNC=OFF \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DGPU_TARGETS="${{ matrix.target }}" \
            -DMIOPEN_INSTALL_GPU_DATABASES="${{ matrix.target }}"
          cmake --build build --target miopen_gtest --target miopen-generate-kernels -j$(nproc)

      - name: Show built CK grouped-conv libraries
        run: |
          echo "=== libMIOpenCKGroupedConv_*.so in build tree ==="
          find build -name 'libMIOpenCKGroupedConv_*.so' -printf '%p\n' || echo "(none found)"

      - name: Run StaticFDBSync (cdna3 rocjitsu + MIOPEN_DEVICE_ARCH=${{ matrix.target }})
        run: |
          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so
          export MIOPEN_DEVICE_ARCH=${{ matrix.target }}
          export SKIP_KDB_TESTING=1
          export MIOPEN_ENABLE_LOGGING=1
          export MIOPEN_LOG_LEVEL=6
          echo "target=${{ matrix.target }} MIOPEN_DEVICE_ARCH=$MIOPEN_DEVICE_ARCH (NO HSA override)"

          set +e
          LD_PRELOAD=$PRELOAD ./build/bin/miopen_gtest \
            --gtest_filter='*StaticFDBSync*' --gtest_color=no > dbsync.log 2>&1
          rc=$?
          set -e
          echo "miopen_gtest exit code: $rc"

          echo "### StaticFDBSync (${{ matrix.target }}) exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          echo "CK libs actually loaded:" >> "$GITHUB_STEP_SUMMARY"
          grep -aoE 'libMIOpenCKGroupedConv_[a-z0-9]+\.so' dbsync.log | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || echo "- (none)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'No device|escaping launching kernel|GetParam\(\) = |\[  PASSED  \]|\[  FAILED  \]|StaticFDBSync' dbsync.log | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "===== tail of dbsync.log ====="
          tail -80 dbsync.log
          exit 0

      - name: Upload dbsync log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbsync-log-${{ matrix.target }}
          path: dbsync.log
          if-no-files-found: ignore
