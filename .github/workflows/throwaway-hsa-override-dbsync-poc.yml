name: THROWAWAY - HSA_OVERRIDE cross-arch dbsync POC

# Temporary, disposable workflow. Tests whether HSA_OVERRIDE_GFX_VERSION
# (layered on the cdna3 rocjitsu KMD interposer, on a GPU-less runner) can
# make hipGetDeviceProperties().gcnArchName report a DIFFERENT arch, and
# thereby make StaticFDBSync validate that arch's SystemDB + load its
# arch-specific libMIOpenCKGroupedConv_<arch>.so.
#
# Why: MIOPEN_DEVICE_ARCH only reinterprets MIOpen's own arch string; it does
# NOT redirect the CK grouped-conv loader, which keys off the real
# gcnArchName (src/include/miopen/solver/ck_impl_lib_loader.hpp:60 ->
# hipGetDeviceProperties().gcnArchName). HSA_OVERRIDE_GFX_VERSION sits at the
# ROCr layer that FEEDS gcnArchName, so it can (in principle) redirect both
# the MIOpen-side name and the CK loader. This POC checks whether it actually
# propagates to gcnArchName under the rocjitsu cdna3 config -- if so, gfx90a
# GPU-free dbsync needs no new rocjitsu config and no MIOpen code change.
#
# Matrix:
#   - gfx942 / no override  -> control; reproduces the known-good #10994 path.
#   - gfx90a / 9.0.10       -> test; can a cdna3 emulation report as gfx90a?
#
# Delete this file / branch once the question is answered.

on:
  push:
    branches:
      - users/jlichtne/throwaway-hsa-override-dbsync-poc

jobs:
  hsa-override-dbsync-poc:
    name: "HSA_OVERRIDE dbsync POC (${{ matrix.target }})"
    timeout-minutes: 60
    container:
      image: rocm/miopen-dev:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gfx942
            hsa: ""        # control: no override, cdna3 config reports gfx942
          - target: gfx90a
            hsa: "9.0.10"  # test: override cdna3 emulation to report gfx90a
    runs-on: azure-linux-scale-rocm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            projects/miopen
            shared/ctest

      - name: Pull DVC files for rocm-libraries
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Confirm no GPU present (interposer required)
        run: |
          echo "=== ls /dev (expect no kfd) ==="
          ls -la /dev | grep -i kfd || echo "no /dev/kfd (GPU-less, as intended)"

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Build rocjitsu KMD
        run: |
          apt-get update && apt-get install -y libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j$(nproc)

      - name: Probe gcnArchName (decisive cheap signal)
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          cat > /tmp/arch_probe.cpp <<'EOF'
          #include <hip/hip_runtime.h>
          #include <cstdio>
          int main() {
            int d = 0;
            if (hipGetDevice(&d) != hipSuccess) { printf("PROBE: hipGetDevice FAILED\n"); return 2; }
            hipDeviceProp_t p{};
            if (hipGetDeviceProperties(&p, d) != hipSuccess) { printf("PROBE: hipGetDeviceProperties FAILED\n"); return 3; }
            printf("PROBE: gcnArchName=%s multiProcessorCount=%d warpSize=%d\n",
                   p.gcnArchName, p.multiProcessorCount, p.warpSize);
            return 0;
          }
          EOF
          /opt/rocm/bin/hipcc /tmp/arch_probe.cpp -o /tmp/arch_probe

          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so

          echo "### gcnArchName probe (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"

          echo "=== control: rocjitsu cdna3 config, NO HSA override ==="
          set +e
          out_ctrl=$(LD_PRELOAD=$PRELOAD /tmp/arch_probe 2>&1); echo "$out_ctrl"
          set -e
          echo "- control (no override): \`$out_ctrl\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${{ matrix.hsa }}" ]; then
            echo "=== test: rocjitsu cdna3 config + HSA_OVERRIDE_GFX_VERSION=${{ matrix.hsa }} ==="
            set +e
            out_test=$(HSA_OVERRIDE_GFX_VERSION=${{ matrix.hsa }} LD_PRELOAD=$PRELOAD /tmp/arch_probe 2>&1); echo "$out_test"
            set -e
            echo "- test (HSA_OVERRIDE=${{ matrix.hsa }}): \`$out_test\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure and build (${{ matrix.target }})
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/miopen -B build \
            -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
            -DCMAKE_BUILD_TYPE=release \
            -DBUILD_DEV=OFF \
            -DMIOPEN_TEST_DISCRETE=OFF \
            -DMIOPEN_USE_MLIR=ON \
            -DMIOPEN_GPU_SYNC=OFF \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DGPU_TARGETS="${{ matrix.target }}" \
            -DMIOPEN_INSTALL_GPU_DATABASES="${{ matrix.target }}"
          cmake --build build --target miopen_gtest --target miopen-generate-kernels -j$(nproc)

      - name: Show built CK grouped-conv libraries
        run: |
          echo "=== libMIOpenCKGroupedConv_*.so in build tree ==="
          find build -name 'libMIOpenCKGroupedConv_*.so' -printf '%p\n' || echo "(none found)"

      - name: Run StaticFDBSync (rocjitsu + HSA override, ${{ matrix.target }})
        run: |
          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so

          export MIOPEN_DEVICE_ARCH=${{ matrix.target }}
          export SKIP_KDB_TESTING=1
          export MIOPEN_ENABLE_LOGGING=1
          export MIOPEN_LOG_LEVEL=6
          if [ -n "${{ matrix.hsa }}" ]; then
            export HSA_OVERRIDE_GFX_VERSION=${{ matrix.hsa }}
          fi
          echo "target=${{ matrix.target }} MIOPEN_DEVICE_ARCH=$MIOPEN_DEVICE_ARCH HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-<unset>}"

          set +e
          LD_PRELOAD=$PRELOAD ./build/bin/miopen_gtest \
            --gtest_filter='*StaticFDBSync*' --gtest_color=no > dbsync.log 2>&1
          rc=$?
          set -e
          echo "miopen_gtest exit code: $rc"

          echo "### StaticFDBSync (${{ matrix.target }}) exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'gcnArchName|libMIOpenCKGroupedConv|CK grouped conv|escaping launching kernel|Raw device name|No device|\[  PASSED  \]|\[  FAILED  \]|StaticFDBSync|RUN|OK' dbsync.log | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "===== tail of full dbsync.log ====="
          tail -120 dbsync.log
          # Do not fail the job -- we want the failure signature captured, not truncated.
          exit 0

      - name: Upload dbsync log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbsync-log-${{ matrix.target }}
          path: dbsync.log
          if-no-files-found: ignore
