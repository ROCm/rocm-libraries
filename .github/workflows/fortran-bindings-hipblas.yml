# Fortran binding of hipblas: see fortran-bindings.yml.
name: Fortran bindings (hipblas)

on:
  pull_request:
    paths:
      - 'projects/hipblas/library/include/**.h'
      - 'projects/hipblas-common/library/include/**.h'
      - 'bindings/fortran/hipblas/metadata/**'
      - '.github/workflows/fortran-bindings-hipblas.yml'
      - '.github/workflows/fortran-bindings.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    uses: ./.github/workflows/fortran-bindings.yml
    with:
      project: hipblas
      libs: hipblas
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
