#
# PROTOTYPE (ALMIOPEN-1779): GPU-free MIOpen dbsync via artifact-reuse + rocjitsu.
#
# Instead of building MIOpen/CK here (container CK is frozen and can lag the SystemDBs;
# building CK per-arch is too heavy), this fetches TheRock's per-PR **source-CK** build
# artifact for one arch and runs the dbsync consistency check (StaticFDBSync) under the
# rocjitsu KMD interposer on a **CPU runner** (no GPU). dbsync is CPU-only
# (SKIP_KDB_TESTING=1, no kernel launch), so the emulated device only needs to exist and
# MIOPEN_DEVICE_ARCH selects which arch's solvers + DBs are validated.
#
# Prototype target: gfx950 -- an arch TheRock builds (so a source-CK artifact with the
# gfx950 CK plugin + DBs exists to reuse) whose dbsync currently runs NOWHERE
# (TheRock excludes it for gfx950-dcgpu, TODO rocm-libraries#2266; Jenkins excludes it via
# test_categories.yaml). If this passes it re-enables gfx950 dbsync GPU-free and is the
# template that scales to any TheRock-built arch (matrix over ARTIFACT_GROUP).
#
# The fetch depends on ROCm/TheRock's `setup_test_environment` action + the MIOpen
# component's `fetch_artifact_args` (generated by TheRock's fetch_test_configurations.py).
# Those are dispatch inputs so the prototype can be exercised without hardcoding external
# config. Get `fetch_artifact_args` + a build `artifact_run_id` from a recent develop
# TheRock CI run (the MIOpen test-component job for the chosen family).
name: "Prototype: TheRock dbsync (rocjitsu)"

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "TheRock build run id that produced the <amdgpu_families> artifact"
        type: string
        required: true
      amdgpu_families:
        description: "Artifact group / family to fetch (must be one TheRock builds), e.g. gfx950-dcgpu"
        type: string
        default: "gfx950-dcgpu"
      device_arch:
        description: "Arch to validate via MIOPEN_DEVICE_ARCH (usually matches the family), e.g. gfx950"
        type: string
        default: "gfx950"
      fetch_artifact_args:
        description: "MIOpen component fetch_artifact_args (from TheRock fetch_test_configurations.py)"
        type: string
        required: true
      therock_ref:
        description: "ROCm/TheRock ref providing setup_test_environment + build_tools"
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  dbsync-rocjitsu:
    name: "dbsync rocjitsu (${{ inputs.device_arch }})"
    runs-on: azure-linux-scale-rocm
    # Same runtime image TheRock's test-component uses for running the fetched dist, but
    # WITHOUT the GPU device mounts -- rocjitsu fakes the device, so no real GPU is needed.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      VENV_DIR: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout ROCm/TheRock (setup_test_environment action + build_tools)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries (scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Fetch TheRock artifact (source-CK build for ${{ inputs.amdgpu_families }})
        timeout-minutes: 15
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ inputs.fetch_artifact_args }}
          IS_PR_FROM_FORK: "false"

      - name: Inspect artifact (key check — CK plugin + DBs must be present)
        run: |
          set -euxo pipefail
          test -f ./build/bin/miopen_gtest
          echo "== CK grouped-conv plugins in the dist =="
          find ./build -name 'libMIOpenCKGroupedConv_*.so' -print
          echo "== ${{ inputs.device_arch }} system DBs in the dist =="
          ls -la ./build/share/miopen/db/${{ inputs.device_arch }}*.HIP.fdb.txt \
                 ./build/share/miopen/db/${{ inputs.device_arch }}*.db.txt

      - name: Build rocjitsu KMD
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y --no-install-recommends cmake g++ libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j"$(nproc)"

      - name: Run StaticFDBSync (rocjitsu, ${{ inputs.device_arch }})
        run: |
          set -euxo pipefail
          export ROCM_PATH="$(realpath ./build)"
          export LD_LIBRARY_PATH="$(realpath ./build/lib):${LD_LIBRARY_PATH:-}"
          export RJ_CONFIG="$(realpath rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json)"
          export MIOPEN_DEVICE_ARCH="${{ inputs.device_arch }}"
          LD_PRELOAD="$(realpath rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so)" \
            ./build/bin/miopen_gtest --gtest_filter='*StaticFDBSync*' --gtest_color=no
