#
# PROTOTYPE (ALMIOPEN-1779): GPU-free MIOpen dbsync via artifact-reuse + rocjitsu.
#
# Instead of building MIOpen/CK here (container CK is frozen and can lag the SystemDBs;
# building CK per-arch is too heavy), this fetches TheRock's per-PR **source-CK** build
# artifact for each arch and runs the dbsync consistency check (StaticFDBSync) under the
# rocjitsu KMD interposer on a **CPU runner** (no GPU). dbsync is CPU-only
# (SKIP_KDB_TESTING=1, no kernel launch) EXCEPT that CK grouped-conv IsApplicable makes a
# HIP device call -- so the rocjitsu config must EMULATE THE MATCHING ARCH; a mismatch
# (e.g. cdna3 config with gfx950 code objects) aborts with "invalid device function".
# MIOPEN_DEVICE_ARCH selects which arch's DBs are validated.
#
# Supported set = arches TheRock builds AND rocjitsu has a KMD config for. Today that is
# gfx942 (cdna3) and gfx950 (cdna4). Adding more (gfx90a=cdna2, gfx125X=RDNA, ...) requires
# a rocjitsu arch config in ROCm/rocm-systems first (and, for gfx90a, a TheRock build too).
#
# VALIDATED 2026-08-15 (gfx950, run 31865606916): fetch works with no AWS creds; the dist
# carries libMIOpenCKGroupedConv_gfx950.so + gfx950100 DBs; with the cdna4 config
# StaticFDBSync[gfx950] runs GPU-free end-to-end against source CK in ~25s and surfaces
# real "invalid perf config" ConvHipImplicitGemmGroupWrwXdlops entries (the stale gfx950
# grouped-wrw class PR #10043 predicted -- i.e. the #2266 material).
#
# gfx942 history: run 31890772516 (2026-08-15) STALLED at StaticFDBSync/3 (304 CU) -- ~200
# find-db lines processed in 6 HOURS before force-cancelled (vs 13s locally on real
# hardware). Root cause was never confirmed. Re-validated 2026-08-17 against a fresh
# artifact (TheRock multi_arch_ci.yml run 31972143345, rocm-libraries pinned to
# b03bb83931b) across 4 separate dispatches -- default (32-thread, the exact config that
# stalled before), 4-thread, and 1-thread -- and NONE stalled: 15-199s each, scaling
# sensibly with thread count. The original stall did not reproduce and is presumed a
# one-off (possibly tied to the specific earlier build pipeline/artifact, PR #10838's
# therock-ci.yml run, rather than anything inherent to gfx942 or rocjitsu). gfx942 dbsync
# now reliably surfaces a real, reproducible finding: the same 3
# ConvHipImplicitGemmGroupWrwXdlops/ConvHipImplicitGemm3DGroupWrwXdlops "invalid perf
# config" entries in gfx942130.db.txt regardless of CK build (old container CK, this fresh
# source CK) -- genuinely stale SystemDB entries, same class as gfx950's #2266 issue, not a
# CK-version-skew artifact. MIOPEN_DBSYNC_MAX_THREADS (db_sync.cpp) remains available as a
# diagnostic knob if a future stall needs bisecting, but is not required for gfx942 to pass.
#
# The fetch depends on ROCm/TheRock's `install_rocm_from_artifacts.py` (called directly,
# not via the `setup_test_environment` composite action -- that action has no way to pass
# `--run-github-repo`, and defaults to querying `artifact_run_id` against the CURRENT repo).
# `artifact_run_id` may be a run on ROCm/rocm-libraries (a PR's own TheRock CI, the common
# case) OR on ROCm/TheRock directly (e.g. from a `multiarch-ci-sweep`/multi_arch_ci.yml
# dispatch, e.g. to pin to a specific commit) -- set `artifact_repo` accordingly. MIOpen's
# `fetch_artifact_args` comes from TheRock's `fetch_test_configurations.py`.
name: "Prototype: TheRock dbsync (rocjitsu)"

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run id that produced the MIOpen artifacts (all families)"
        type: string
        required: true
      artifact_repo:
        description: "Repo hosting artifact_run_id -- ROCm/rocm-libraries (a PR's TheRock CI run) or ROCm/TheRock (a direct multi_arch_ci.yml dispatch)"
        type: string
        default: "ROCm/rocm-libraries"
      fetch_artifact_args:
        description: "MIOpen component fetch_artifact_args (from TheRock fetch_test_configurations.py)"
        type: string
        default: "--blas --miopen --rand --tests"
      therock_ref:
        description: "ROCm/TheRock ref providing build_tools"
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  dbsync-rocjitsu:
    name: "dbsync rocjitsu (${{ matrix.arch }})"
    runs-on: azure-linux-scale-rocm
    # Safety net: without this, a stall (see gfx942 note above) occupies the runner
    # indefinitely instead of failing fast. 20 min is generous next to gfx950's ~25s run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Supported + validated set: TheRock builds it AND rocjitsu has a matching KMD config.
        include:
          - { arch: gfx942, family: gfx94X-dcgpu, rj_config: amdgpu_cdna3_kmd.json }
          - { arch: gfx950, family: gfx950-dcgpu, rj_config: amdgpu_cdna4_kmd.json }
    # Same runtime image TheRock's test-component uses for running the fetched dist, but
    # WITHOUT GPU device mounts (rocjitsu fakes the device). --user 0: the image defaults to
    # a non-root user with no compiler; apt-get to build rocjitsu needs root.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host --user 0
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ matrix.family }}
      VENV_DIR: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout ROCm/TheRock (build_tools)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries (scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      # Calls install_rocm_from_artifacts.py directly (not via the setup_test_environment
      # composite action) so we can pass --run-github-repo -- the action has no such input
      # and defaults to querying artifact_run_id against the CURRENT repo (rocm-libraries),
      # which is wrong when artifact_repo is ROCm/TheRock.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install UV
        run: pip install uv

      - name: Create Python venv
        run: python build_tools/setup_venv.py "${VENV_DIR}" --activate-in-future-github-actions-steps --use-uv

      - name: Install test requirements
        run: |
          uv pip install -r requirements-test.txt
          uv pip freeze

      - name: Fetch artifact (source-CK build for ${{ matrix.family }}) from ${{ inputs.artifact_repo }}
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ./build_tools/install_rocm_from_artifacts.py \
            --run-id="${ARTIFACT_RUN_ID}" \
            --run-github-repo="${{ inputs.artifact_repo }}" \
            --artifact-group="${AMDGPU_FAMILIES}" \
            --output-dir="${OUTPUT_ARTIFACTS_DIR}" \
            ${{ inputs.fetch_artifact_args }}

      - name: Inspect artifact (key check — CK plugin + DBs must be present)
        run: |
          set -euxo pipefail
          test -f ./build/bin/miopen_gtest
          echo "== CK grouped-conv plugins in the dist =="
          find ./build -name 'libMIOpenCKGroupedConv_*.so' -print
          echo "== ${{ matrix.arch }} system DBs in the dist =="
          ls -la ./build/share/miopen/db/${{ matrix.arch }}*.HIP.fdb.txt \
                 ./build/share/miopen/db/${{ matrix.arch }}*.db.txt

      - name: Build rocjitsu KMD
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y --no-install-recommends cmake build-essential libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j"$(nproc)"

      - name: Run StaticFDBSync (rocjitsu, ${{ matrix.arch }})
        run: |
          set -euxo pipefail
          export ROCM_PATH="$(realpath ./build)"
          export LD_LIBRARY_PATH="$(realpath ./build/lib):${LD_LIBRARY_PATH:-}"
          export RJ_CONFIG="$(realpath rocm-systems/emulation/rocjitsu/configs/${{ matrix.rj_config }})"
          export MIOPEN_DEVICE_ARCH="${{ matrix.arch }}"
          LD_PRELOAD="$(realpath rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so)" \
            ./build/bin/miopen_gtest --gtest_filter='*StaticFDBSync*' --gtest_color=no
