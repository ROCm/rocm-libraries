#
# PROTOTYPE (ALMIOPEN-1779): GPU-free MIOpen dbsync via artifact-reuse + rocjitsu.
#
# Instead of building MIOpen/CK here (container CK is frozen and can lag the SystemDBs;
# building CK per-arch is too heavy), this fetches TheRock's per-PR **source-CK** build
# artifact for each arch and runs the dbsync consistency check (StaticFDBSync) under the
# rocjitsu KMD interposer on a **CPU runner** (no GPU). dbsync is CPU-only
# (SKIP_KDB_TESTING=1, no kernel launch) EXCEPT that CK grouped-conv IsApplicable makes a
# HIP device call -- so the rocjitsu config must EMULATE THE MATCHING ARCH; a mismatch
# (e.g. cdna3 config with gfx950 code objects) aborts with "invalid device function".
# MIOPEN_DEVICE_ARCH selects which arch's DBs are validated.
#
# Supported set = arches TheRock builds AND rocjitsu has a KMD config for AND the run
# actually completes (see gfx942 status below). Adding more (gfx90a=cdna2, gfx125X=RDNA,
# ...) requires a rocjitsu arch config in ROCm/rocm-systems first (and, for gfx90a, a
# TheRock build too).
#
# VALIDATED 2026-08-15 (gfx950, run 31865606916): fetch works with no AWS creds; the dist
# carries libMIOpenCKGroupedConv_gfx950.so + gfx950100 DBs; with the cdna4 config
# StaticFDBSync[gfx950] runs GPU-free end-to-end against source CK in ~25s and surfaces
# real "invalid perf config" ConvHipImplicitGemmGroupWrwXdlops entries (the stale gfx950
# grouped-wrw class PR #10043 predicted -- i.e. the #2266 material).
#
# gfx942 EXCLUDED from the matrix (2026-08-15, run 31890772516): with the matching cdna3
# config, StaticFDBSync/3 (gfx942, 304 CU) STALLED -- ~200/many-thousand find-db lines
# processed in 6 HOURS before the job was force-cancelled (vs 13s for the same DB locally
# on real hardware). db_sync.cpp spawns min(hardware_concurrency(), 32) threads
# (db_sync.cpp:1009-1010), each making a HIP device call per CK grouped-conv entry through
# the rocjitsu interposer; something about that concurrency (or gfx942's much larger FDB)
# stalls under rocjitsu/cdna3 specifically -- not root-caused, not a code bug in MIOpen.
# gfx942 dbsync is ALREADY covered by TheRock's real GPU test job (gfx94X-dcgpu), so this
# GPU-free path isn't needed there; not worth the CI cost until the stall is understood.
# A next diagnostic step (not attempted): re-run with the runner's CPU affinity constrained
# (e.g. taskset -c 0-3) to force fewer threads and see whether that avoids the stall.
#
# The fetch depends on ROCm/TheRock's `setup_test_environment` action + the MIOpen
# component's `fetch_artifact_args`. Both `artifact_run_id` and `fetch_artifact_args` come
# from a real TheRock CI run (one build run produces all families; only ARTIFACT_GROUP
# differs per matrix leg).
name: "Prototype: TheRock dbsync (rocjitsu)"

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "TheRock build run id that produced the MIOpen artifacts (all families)"
        type: string
        required: true
      fetch_artifact_args:
        description: "MIOpen component fetch_artifact_args (from TheRock fetch_test_configurations.py)"
        type: string
        default: "--blas --miopen --rand --tests"
      therock_ref:
        description: "ROCm/TheRock ref providing setup_test_environment + build_tools"
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  dbsync-rocjitsu:
    name: "dbsync rocjitsu (${{ matrix.arch }})"
    runs-on: azure-linux-scale-rocm
    # Safety net: without this, a stall (see gfx942 note above) occupies the runner
    # indefinitely instead of failing fast. 20 min is generous next to gfx950's ~25s run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Supported + validated set only. gfx942 deliberately excluded -- see header note
        # (stalls under rocjitsu/cdna3; also redundant with TheRock's real gfx94X GPU test).
        include:
          - { arch: gfx950, family: gfx950-dcgpu, rj_config: amdgpu_cdna4_kmd.json }
    # Same runtime image TheRock's test-component uses for running the fetched dist, but
    # WITHOUT GPU device mounts (rocjitsu fakes the device). --user 0: the image defaults to
    # a non-root user with no compiler; apt-get to build rocjitsu needs root.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host --user 0
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ matrix.family }}
      VENV_DIR: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout ROCm/TheRock (setup_test_environment action + build_tools)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries (scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Fetch TheRock artifact (source-CK build for ${{ matrix.family }})
        timeout-minutes: 15
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ matrix.family }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ inputs.fetch_artifact_args }}
          IS_PR_FROM_FORK: "false"

      - name: Inspect artifact (key check — CK plugin + DBs must be present)
        run: |
          set -euxo pipefail
          test -f ./build/bin/miopen_gtest
          echo "== CK grouped-conv plugins in the dist =="
          find ./build -name 'libMIOpenCKGroupedConv_*.so' -print
          echo "== ${{ matrix.arch }} system DBs in the dist =="
          ls -la ./build/share/miopen/db/${{ matrix.arch }}*.HIP.fdb.txt \
                 ./build/share/miopen/db/${{ matrix.arch }}*.db.txt

      - name: Build rocjitsu KMD
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y --no-install-recommends cmake build-essential libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j"$(nproc)"

      - name: Run StaticFDBSync (rocjitsu, ${{ matrix.arch }})
        run: |
          set -euxo pipefail
          export ROCM_PATH="$(realpath ./build)"
          export LD_LIBRARY_PATH="$(realpath ./build/lib):${LD_LIBRARY_PATH:-}"
          export RJ_CONFIG="$(realpath rocm-systems/emulation/rocjitsu/configs/${{ matrix.rj_config }})"
          export MIOPEN_DEVICE_ARCH="${{ matrix.arch }}"
          LD_PRELOAD="$(realpath rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so)" \
            ./build/bin/miopen_gtest --gtest_filter='*StaticFDBSync*' --gtest_color=no
