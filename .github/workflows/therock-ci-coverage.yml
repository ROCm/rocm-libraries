name: TheRock CI Linux Coverage

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      project_name:
        type: string
      cmake_target:
        type: string
      build_dir:
        type: string
      coverage_config:
        description: "Per-project coverage metadata file (test_categories_coverage.yaml)."
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      projects_to_test:
        type: string
      test_type:
        type: string
      therock_ref:
        type: string
        default: 1ced5b9abfb893303a3cfb47502acf8c8a6de8d7
      test_therock_ref:
        type: string
        default: 1ced5b9abfb893303a3cfb47502acf8c8a6de8d7

permissions:
  contents: read

jobs:
  therock-coverage-build:
    name: Build Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    runs-on: aws-linux-scale-rocm-prod
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2
      options: -v /runner/config:/home/awsconfig/
    env:
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: "Checking out repository for rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ inputs.therock_ref }}

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks ${{ contains(inputs.cmake_options, 'THEROCK_ENABLE_IREE_LIBS=ON') && '--include-iree-libs' || '' }}

      - name: Enable coverage instrumentation for sub-project
        run: |
          # TheRock does not reliably forward -D<PROJECT>_ENABLE_COVERAGE to the
          # sub-project (ROCm/TheRock#6572). Environment variables DO propagate through
          # TheRock's sub-project sandbox (only ROCM_PATH/ROCM_DIR/HIP_PATH/HIP_DIR are
          # unset), so export it for the configure + build steps; the component CMake
          # honors $ENV{<PROJECT>_ENABLE_COVERAGE} as a fallback trigger.
          echo "${{ inputs.project_name }}_ENABLE_COVERAGE=ON" >> "$GITHUB_ENV"

      - name: Configure coverage build
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          extra_cmake_options: >-
            -DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../
            -D${{ inputs.project_name }}_ENABLE_COVERAGE=ON
            -DLLVM_TOOLS_SEARCH_PREFIX=${{ github.workspace }}/TheRock/build-coverage/dist/rocm/lib/llvm
            -DLLVM_PARALLEL_LINK_JOBS=4
            ${{ inputs.cmake_options }}
          BUILD_DIR: build-coverage
        run: |
          # Override PROFILE_DIR with the container workspace path so the coverage
          # profraw path baked into the tests is valid on the test node too
          # (build and test containers share ${GITHUB_WORKSPACE}=/__w/...).
          export extra_cmake_options="${extra_cmake_options} -DPROFILE_DIR=${GITHUB_WORKSPACE}/coverage-report"
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-artifacts and therock-dist
        run: cmake --build TheRock/build-coverage --target therock-artifacts therock-dist -- -k 0

      - name: Verify coverage instrumentation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e  # diagnostic only; never fail the build
          proj="$(echo '${{ inputs.project_name }}' | tr '[:upper:]' '[:lower:]')"
          BC=TheRock/build-coverage
          nm="$(find "$BC" -type f -name llvm-nm -path '*/llvm/bin/*' 2>/dev/null | head -1)"
          echo "===== coverage self-check (${proj}) ====="
          echo "-- [1] lib${proj}.so* symbol counts (symlinks resolved) --"
          find "$BC" -name "lib${proj}.so*" 2>/dev/null | sort -u | while read -r so; do
            real="$(readlink -f "$so" 2>/dev/null || echo "$so")"
            printf '    %6s __llvm_profile  %s\n' "$("${nm}" "$real" 2>/dev/null | grep -c __llvm_profile)" "$so"
          done
          echo "-- [2] compile_commands*.json entries with -fprofile-instr-generate --"
          find "$BC" -name "compile_commands*.json" 2>/dev/null | while read -r cc; do
            n="$(grep -c "fprofile-instr-generate" "$cc" 2>/dev/null)"
            printf '    %6s  %s\n' "${n:-0}" "$cc"
          done
          echo "-- [3] ${proj} configure log: coverage/ENABLE/fprofile lines --"
          find "$BC" -iname "*${proj}*configure*.log" 2>/dev/null | while read -r lg; do
            echo "    log: $lg"
            grep -iE "coverage|ENABLE_COVERAGE|fprofile" "$lg" 2>/dev/null | head -8 | sed 's/^/       /'
          done
          echo "===== end self-check ====="

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          set +e  # best-effort diagnostics; never fail the build on reporting
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build-coverage/dist/rocm
          echo "Artifact Archives:"
          echo "------------------"
          ls -lh TheRock/build-coverage/artifacts/ 2>/dev/null
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build-coverage/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Post Build Upload
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build-coverage \
            --upload

  therock-coverage-test:
    name: Test Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    needs: [therock-coverage-build]
    if: ${{ inputs.test_runs_on != 'gfx950-dcgpu' }}
    uses: ./.github/workflows/therock-test-packages.yml
    secrets: inherit
    with:
      therock_ref: ${{ inputs.test_therock_ref }}
      projects_to_test: ${{ inputs.projects_to_test }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      test_type: ${{ inputs.test_type }}
      coverage_enabled: true
