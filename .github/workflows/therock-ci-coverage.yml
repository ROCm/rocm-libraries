name: TheRock CI Linux Coverage

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      project_name:
        type: string
      cmake_target:
        type: string
      build_dir:
        type: string
      coverage_config:
        description: "Per-project coverage metadata file (test_categories_coverage.yaml)."
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      projects_to_test:
        type: string
      test_type:
        type: string
      # TheRock revision for the BUILD stage. Pinned to a commit that exports
      # llvm-cov / llvm-profdata in the dist (a feature branch not yet on main).
      therock_ref:
        type: string
        default: 6afcd5ac5298e9a5cdb3d2c45ae7605739ad2b94
      # TheRock revision for the TEST stage. Uses a current commit (which has
      # build_tools/github_actions/cleanup_processes.sh) so the shared test flow
      # does not fail in its post-job cleanup. The build ref above lacks that
      # script, and current TheRock lacks the llvm export, so the two stages use
      # different refs until the export work lands on main.
      test_therock_ref:
        type: string
        default: 2d417fa49bc4e657bcbcf0ae549238784175f0fe

permissions:
  contents: read

jobs:
  therock-coverage-build:
    name: Build Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    runs-on: azure-linux-scale-rocm
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2
      options: -v /runner/config:/home/awsconfig/
    env:
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: "Checking out repository for rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ inputs.therock_ref }}

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks ${{ contains(inputs.cmake_options, 'THEROCK_ENABLE_IREE_LIBS=ON') && '--include-iree-libs' || '' }}

      - name: Configure coverage build
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          extra_cmake_options: >-
            -DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../
            -D${{ inputs.project_name }}_ENABLE_COVERAGE=ON
            -DLLVM_TOOLS_SEARCH_PREFIX=${{ github.workspace }}/TheRock/build-coverage/dist/rocm/lib/llvm
            ${{ inputs.cmake_options }}
          BUILD_DIR: build-coverage
        run: |
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-archives and therock-dist
        run: cmake --build TheRock/build-coverage --target therock-archives therock-dist -- -k 0

      - name: Stage coverage objects and llvm tools
        run: |
          set -euo pipefail
          # Use $GITHUB_WORKSPACE (container path) rather than the github.workspace
          # expression (host path) so the staged dir matches what upload-artifact reads.
          STAGE="${GITHUB_WORKSPACE}/coverage-objects"
          DIST="TheRock/build-coverage/dist/rocm"
          LLVM_BIN="${DIST}/lib/llvm/bin"
          LIB_NAME="lib$(echo '${{ inputs.cmake_target }}' | tr '[:upper:]' '[:lower:]')"
          mkdir -p "${STAGE}/lib" "${STAGE}/bin"
          # Instrumented shared libraries for the target component (used as llvm-cov -object).
          find "${DIST}" -type f -name "${LIB_NAME}*.so*" -exec cp -av {} "${STAGE}/lib/" \;
          # Version-matched coverage tooling, so the report job does not depend on the dist.
          cp -av "${LLVM_BIN}/llvm-profdata" "${STAGE}/bin/"
          cp -av "${LLVM_BIN}/llvm-cov" "${STAGE}/bin/"
          # The llvm tools dynamically link libLLVM plus TheRock's bundled sysdeps
          # (e.g. librocm_sysdeps_z). Stage the whole llvm lib dir and all sysdeps
          # next to the tools so the report job can run them via LD_LIBRARY_PATH.
          if [[ -d "${DIST}/lib/llvm/lib" ]]; then
            find "${DIST}/lib/llvm/lib" -maxdepth 1 -name '*.so*' -exec cp -av {} "${STAGE}/bin/" \;
          fi
          # Note: do NOT use -type f here, otherwise the SONAME symlinks (e.g.
          # librocm_sysdeps_z.so.1 -> librocm_sysdeps_z.so.1.3.2) are skipped and
          # the loader cannot resolve the dependency.
          find "${DIST}" -name 'libLLVM.so*' -exec cp -av {} "${STAGE}/bin/" \;
          find "${DIST}" -name 'librocm_sysdeps_*.so*' -exec cp -av {} "${STAGE}/bin/" \;
          # Demangler used by llvm-cov show for readable HTML.
          cp -av "${LLVM_BIN}/llvm-cxxfilt" "${STAGE}/bin/" 2>/dev/null || true

      - name: Export coverage metadata
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml || true
          # Written into the staged dir so it travels with the coverage objects.
          python3 .github/scripts/export_coverage_metadata.py \
            --build-dir TheRock/build-coverage \
            --project "${{ inputs.project_name }}" \
            --config "${{ inputs.coverage_config }}" \
            --cmake-target "${{ inputs.cmake_target }}" \
            --output "${GITHUB_WORKSPACE}/coverage-objects/coverage_metadata.json"
          cat "${GITHUB_WORKSPACE}/coverage-objects/coverage_metadata.json"

      - name: Upload coverage objects and llvm tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-objects-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
          # Relative path resolves against the container workspace, matching the staging step.
          path: coverage-objects
          if-no-files-found: error
          retention-days: 7

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build-coverage/dist/rocm
          echo "Artifact Archives:"
          echo "------------------"
          ls -lh TheRock/build-coverage/artifacts/*.tar.xz
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build-coverage/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Post Build Upload
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build-coverage \
            --upload

  # Run the standard package test flow against the coverage-instrumented build.
  # Each sharded component test uploads its llvm profraw data (see
  # therock-test-component.yml) which the report job below merges.
  therock-coverage-test:
    name: Test Coverage (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    needs: [therock-coverage-build]
    if: ${{ inputs.test_runs_on != '' }}
    uses: ./.github/workflows/therock-test-packages.yml
    secrets: inherit
    with:
      therock_ref: ${{ inputs.test_therock_ref }}
      projects_to_test: ${{ inputs.projects_to_test }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      test_type: ${{ inputs.test_type }}
      coverage: true

  # Merge the profraw files from all test shards and produce the coverage report
  # using the version-matched llvm tools staged by the build job.
  therock-coverage-report:
    name: Coverage Report (${{ inputs.project_name }} | ${{ inputs.amdgpu_families }})
    needs: [therock-coverage-test]
    if: ${{ !cancelled() && needs.therock-coverage-test.result != 'skipped' }}
    runs-on: azure-linux-scale-rocm
    # Run in the build container so the staged llvm tools (and libLLVM) have a
    # compatible base environment.
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:48492540591673fdc8d51beb89bde41e7ba13cbb528f643c0a481ba42c4058f2
    env:
      REPORT_ARTIFACT: coverage-report-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Check out the sources so llvm-cov can annotate the HTML report. The build
      # embeds absolute source paths under the workspace, so checking out here (at
      # the workspace root) makes those paths resolve.
      - name: Checkout rocm-libraries (for source annotation)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download coverage objects and llvm tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-objects-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
          path: coverage-objects

      - name: Download coverage profraw artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Scope to THIS component's profraw (projects_to_test is pinned to the
          # single coverage project) so multiple components on the same GPU
          # family don't cross-contaminate each other's reports.
          pattern: coverage-profraw-${{ inputs.amdgpu_families }}-${{ inputs.projects_to_test }}-*
          path: coverage-profraw
          merge-multiple: true

      - name: Merge profraw and generate coverage report
        shell: bash
        env:
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CMAKE_TARGET: ${{ inputs.cmake_target }}
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test }}
          BUILD_DIR: ${{ inputs.build_dir }}
          COVERAGE_CONFIG: ${{ inputs.coverage_config }}
          BUILD_THEROCK_REF: ${{ inputs.therock_ref }}
          TEST_THEROCK_REF: ${{ inputs.test_therock_ref }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OBJECTS_DIR="${GITHUB_WORKSPACE}/coverage-objects"
          PROFRAW_DIR="${GITHUB_WORKSPACE}/coverage-profraw"
          REPORT_DIR="${GITHUB_WORKSPACE}/coverage-report"
          mkdir -p "${REPORT_DIR}"
          METADATA="${OBJECTS_DIR}/coverage_metadata.json"
          PROJECT="$(echo "${CMAKE_TARGET}" | tr '[:upper:]' '[:lower:]')"

          # Version-matched llvm tools were staged next to their runtime libs by
          # the build job; run them from there via LD_LIBRARY_PATH.
          LLVM_BIN="${OBJECTS_DIR}/bin"
          export LD_LIBRARY_PATH="${LLVM_BIN}:${LD_LIBRARY_PATH:-}"
          chmod +x "${LLVM_BIN}/llvm-profdata" "${LLVM_BIN}/llvm-cov" "${LLVM_BIN}/llvm-cxxfilt" 2>/dev/null || true

          # Instrumented shared libraries to pass to llvm-cov as -object.
          mapfile -t OBJECTS < <(find "${OBJECTS_DIR}/lib" -type f -name '*.so*' 2>/dev/null | sort)
          mapfile -t PROFRAW_FILES < <(find "${PROFRAW_DIR}" -type f -name '*.profraw' 2>/dev/null | sort)

          # No coverage data to report when a build produced no profraw (e.g. a
          # GPU family whose test machines lack a matching GPU run only host-side
          # tests, or a failed/absent test shard) or no instrumented object was
          # staged. Emit a visible warning and skip the report (exit 0) rather
          # than hard-failing the whole coverage job, so families that
          # legitimately produce no data do not turn the matrix red.
          if [[ ${#PROFRAW_FILES[@]} -eq 0 || ${#OBJECTS[@]} -eq 0 ]]; then
            echo "::warning::No profraw (${#PROFRAW_FILES[@]}) or instrumented object (${#OBJECTS[@]}) for ${PROJECT_NAME} ${AMDGPU_FAMILIES}; skipping coverage report."
            exit 0
          fi

          OBJ_ARGS=()
          for o in "${OBJECTS[@]}"; do OBJ_ARGS+=(-object "${o}"); done

          IGNORE_RE="$(python3 -c "import json; print(json.load(open('${METADATA}')).get('ignore_filename_regex',''))")"
          IGNORE_ARGS=()
          if [[ -n "${IGNORE_RE}" ]]; then IGNORE_ARGS=("-ignore-filename-regex=${IGNORE_RE}"); fi

          # Merge the per-binary profraw into one profile, then emit text, HTML and
          # LCOV reports directly with the version-matched llvm tools.
          PROFDATA="${REPORT_DIR}/${PROJECT}.profdata"
          "${LLVM_BIN}/llvm-profdata" merge -sparse -o "${PROFDATA}" "${PROFRAW_FILES[@]}"
          "${LLVM_BIN}/llvm-cov" report "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            | tee "${REPORT_DIR}/code_cov_${PROJECT}.report"
          "${LLVM_BIN}/llvm-cov" show "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            -Xdemangler="${LLVM_BIN}/llvm-cxxfilt" --format=html --output-dir="${REPORT_DIR}"
          "${LLVM_BIN}/llvm-cov" export "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            --format=lcov > "${REPORT_DIR}/coverage.info"

          # Make lcov paths repo-relative so Codecov can map them to the source tree.
          sed -i "s|${GITHUB_WORKSPACE}/||g" "${REPORT_DIR}/coverage.info"

          # Collect details for the reference links file.
          mapfile -t SOURCES < <(sed -n 's|^SF:||p' "${REPORT_DIR}/coverage.info" 2>/dev/null | sort -u)
          PROFRAW_COUNT=${#PROFRAW_FILES[@]}

          # Generate the reference text file with all relevant paths and links.
          LINKS_FILE="${REPORT_DIR}/coverage-report-links.txt"
          {
            echo "${PROJECT_NAME} Code Coverage - Paths and Links"
            echo "=================================================="
            echo "Generated:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repository:       ${REPO}"
            echo "Commit:           ${COMMIT_SHA}"
            echo "Pull request:     ${GITHUB_SERVER_URL}/${REPO}/pull/${PR_NUMBER:-N/A}"
            echo "Workflow run:     ${RUN_URL}"
            echo "GPU family:       ${AMDGPU_FAMILIES}"
            echo
            echo "[Coverage config]"
            echo "  Config:  ${COVERAGE_CONFIG} -> coverage_metadata.json"
            echo "  Report:  llvm-profdata merge + llvm-cov (report/show/export), inline in this job"
            echo
            echo "[TheRock - where ${PROJECT_NAME} was packed for coverage]"
            echo "  Build TheRock ref: ${BUILD_THEROCK_REF}"
            echo "  Test  TheRock ref: ${TEST_THEROCK_REF}"
            echo "  Build dir:         ${BUILD_DIR}"
            echo
            echo "[Instrumented code - source file(s)]"
            for s in ${SOURCES[@]+"${SOURCES[@]}"}; do echo "  ${s}"; done
            echo
            echo "[Instrumented code - object(s) used by llvm-cov]"
            for o in ${OBJECTS[@]+"${OBJECTS[@]}"}; do echo "  ${o#${GITHUB_WORKSPACE}/}"; done
            echo
            echo "[Libraries used by the coverage tooling]"
            for f in $(find "${OBJECTS_DIR}/bin" -maxdepth 1 -type f | sort); do echo "  ${f#${GITHUB_WORKSPACE}/}"; done
            echo
            echo "[Tests executed against the instrumented build]"
            echo "  projects_to_test: ${PROJECTS_TO_TEST}"
            echo "  Test driver:      ctest (via .github/workflows/therock-test-component.yml)"
            echo "  profraw merged:   ${PROFRAW_COUNT} file(s)"
            echo "  Test stage:       ${RUN_URL} (job 'Test Coverage (${PROJECT_NAME} | ${AMDGPU_FAMILIES})')"
            echo
            echo "[Coverage report outputs]"
            echo "  HTML report:    coverage-report/index.html"
            echo "  Text summary:   coverage-report/code_cov_$(echo "${CMAKE_TARGET}" | tr '[:upper:]' '[:lower:]').report"
            echo "  LCOV:           coverage-report/coverage.info"
            echo "  Merged profile: coverage-report/$(echo "${CMAKE_TARGET}" | tr '[:upper:]' '[:lower:]').profdata"
            echo
            echo "[Report upload / download]"
            echo "  Artifact name:  ${REPORT_ARTIFACT}"
            echo "  Download from:   ${RUN_URL} (Artifacts section)"
            echo "  Codecov:         https://app.codecov.io/gh/${REPO}/pull/${PR_NUMBER:-} (flag: ${CMAKE_TARGET})"
          } > "${LINKS_FILE}"

          echo "----- ${LINKS_FILE} -----"
          cat "${LINKS_FILE}"

      - name: Upload coverage report
        # Only upload when the report generated successfully; an always() here
        # could publish a partial/empty report after a failure (review: reboss).
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REPORT_ARTIFACT }}
          path: coverage-report
          if-no-files-found: warn
          # Keep the shareable report around well beyond the build inputs.
          retention-days: 90

      - name: Coverage report summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### ${{ inputs.project_name }} coverage (${{ inputs.amdgpu_families }})"
            echo ""
            report_file="$(find coverage-report -maxdepth 1 -name 'code_cov_*.report' 2>/dev/null | head -1)"
            if [[ -n "${report_file}" ]]; then
              echo '```'
              tail -n 3 "${report_file}"
              echo '```'
            fi
            echo "- Report artifact: \`${REPORT_ARTIFACT}\` (download from [run artifacts](${RUN_URL}))"
            echo "- Codecov: upload is handled by the dedicated Codecov PR (users/jainprad/codecoverage_codecov_tool); this PR only produces the report artifact."
          # tee so the summary is also visible in this step's log, not only the job summary page.
          } | tee -a "${GITHUB_STEP_SUMMARY}"
