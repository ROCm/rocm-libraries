# This experimental branch reuses the registered workflow path so it can be
# dispatched by ref without adding a workflow to the default branch.
name: RocJITsu scheduling experiment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        description: "Existing rocm-libraries run providing the gfx125X artifacts"
        required: true
      workers:
        type: string
        description: "Independent shape workers; allocation mode uses the allocations input"
        default: "96"
      reference_workers:
        type: string
        description: "Whole-YAML workers for reference/paired/matrix; 16 follows the current baseline, 12 is another allocation control"
        default: "16"
      strategy:
        type: choice
        description: "Matrix compares whole-YAML and shape scheduling; allocation compares workers and dispatch widths"
        options: [shape, reference, paired, safety, matrix, allocation]
        default: shape
      dispatch_threads:
        type: string
        description: "Shape dispatch width: 1, 2 or 4; generation and references stay serial"
        default: "1"
      allocations:
        type: string
        description: "Allocation mode workers:dispatch pairs, compared on the same runner"
        default: "48:1,32:2,16:4"
      max_work:
        type: string
        description: "Maximum logical GEMM work including batch; default is 4096 cubed"
        default: "68719476736"
      per_job_seconds:
        type: string
        description: "Maximum build and execution time for one admitted shape job"
        default: "600"
      case_filter:
        type: string
        description: "Use calibration16 for the frozen 16-YAML workload, or an explicit pytest -k expression"
        required: true
      suite_seconds:
        type: string
        description: "Per-strategy limit; combined trial execution limits must total at most 1500 seconds"
        default: "1200"

permissions:
  contents: read
  actions: read

jobs:
  rocjitsu:
    uses: ./.github/workflows/therock-rocjitsu-tensilelite-linux.yml
    with:
      therock_ref: 47434387de730d51788b705e5600602dd6064997
      build_runs_on: aws-linux-scale-rocm-prod
      amdgpu_families: gfx125X-dcgpu
      artifact_run_id: ${{ inputs.artifact_run_id }}
      strategy: ${{ inputs.strategy }}
      workers: ${{ inputs.workers }}
      reference_workers: ${{ inputs.reference_workers }}
      dispatch_threads: ${{ inputs.dispatch_threads }}
      allocations: ${{ inputs.allocations }}
      max_work: ${{ inputs.max_work }}
      per_job_seconds: ${{ inputs.per_job_seconds }}
      case_filter: ${{ inputs.case_filter }}
      suite_seconds: ${{ inputs.suite_seconds }}
      job_minutes: 35
