# This experimental branch reuses the registered workflow path so it can be
# dispatched by ref without adding a workflow to the default branch.
name: RocJITsu shape queue experiment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        description: "Existing rocm-libraries run providing the gfx125X artifacts"
        required: true
      workers:
        type: string
        description: "Independent serial shape workers (at most the runner CPU count)"
        default: "96"
      dispatch_threads:
        type: string
        description: "Inclusive dispatch width; 0 uses the artifact config, 1 is serial"
        default: "1"
      max_work:
        type: string
        description: "Maximum logical GEMM work including batch; default is 4096 cubed"
        default: "68719476736"
      per_job_seconds:
        type: string
        description: "Maximum build and execution time for one admitted shape job"
        default: "600"
      case_filter:
        type: string
        description: "Required pytest -k expression defining the calibration workload"
        required: true
      suite_seconds:
        type: string
        description: "Suite execution limit, excluding setup and reporting"
        default: "1200"

permissions:
  contents: read
  actions: read

jobs:
  rocjitsu:
    uses: ./.github/workflows/therock-rocjitsu-tensilelite-linux.yml
    with:
      therock_ref: 47434387de730d51788b705e5600602dd6064997
      build_runs_on: aws-linux-scale-rocm-prod
      amdgpu_families: gfx125X-dcgpu
      artifact_run_id: ${{ inputs.artifact_run_id }}
      workers: ${{ inputs.workers }}
      dispatch_threads: ${{ inputs.dispatch_threads }}
      max_work: ${{ inputs.max_work }}
      per_job_seconds: ${{ inputs.per_job_seconds }}
      case_filter: ${{ inputs.case_filter }}
      suite_seconds: ${{ inputs.suite_seconds }}
      job_minutes: 35
