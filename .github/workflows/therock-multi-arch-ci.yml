# Multi-Arch CI for rocm-libraries
#
# This workflow replicates TheRock's multi-arch CI pipeline by calling
# TheRock's reusable workflows directly. It provides sharded, multi-stage
# builds with per-architecture testing.
#
# Key differences from therock-ci.yml:
# - Uses TheRock's multi-arch sharded build pipeline (foundation -> compiler-runtime -> math-libs)
# - Supports prebuilt stages to skip certain build stages
# - Better parallelization across GPU architectures

name: TheRock Multi-Arch CI

# TheRock ref: the resolve_therock_ref job picks one concrete ROCm/TheRock SHA
# for the whole run. On pull_request events it pins to the tip of TheRock@main
# as it existed at the PR branch's merge-base time, so the pin stays stable
# while a PR is authored and only advances when the base branch is merged/
# rebased in (see .github/scripts/resolve_therock_ref.py). Other events use the
# live tip of main. The setup job checks that ref out and re-exports it as
# needs.setup.outputs.ref; every downstream build/test/summary job consumes that
# one SHA. The `uses: ROCm/TheRock/...@main` lines below are the
# workflow-definition ref (Actions requires a literal there) and are
# deliberately separate from the build-source `ref:` inputs.

on:
  # The `labeled`/`unlabeled` types exist for the label-gated cmake flags
  # resolved by the label_flags job: adding a gated label must rebuild with the
  # flag on and removing one must rebuild with it off. Every label change
  # rebuilds, including one that changes no flag - the concurrency group below
  # cancels the in-progress run as soon as the label event creates a new one, so
  # declining to rebuild would not save that build, it would only leave the pull
  # request without one.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X (empty = skip linux)"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocprim, test:hipcub"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx120X (empty = skip windows)"
        default: ""
      windows_test_labels:
        type: string
        description: "If enabled, reduce test set on Windows to the list of labels prefixed with 'test:' ex: test:rocprim, test:hipcub"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      therock_ref_override:
        type: string
        default: ""
        description: "Optional explicit TheRock ref (branch/tag/SHA) to build against. Empty resolves the ref per event (merge-base time for PRs, live tip of main otherwise)."

permissions:
  contents: read
  actions: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci-env:
    name: Load CI Environment
    runs-on: ubuntu-24.04
    outputs:
      baseline-run-id: ${{ steps.ci-env.outputs.baseline-run-id }}
    steps:
      - name: Checkout ci-env action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions/ci-env
          sparse-checkout-cone-mode: true

      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

  configure:
    name: Configure Changed Projects
    runs-on: ubuntu-24.04
    outputs:
      changed_projects: ${{ steps.configure.outputs.changed_projects }}
      run_all_tests: ${{ steps.configure.outputs.run_all_tests }}
      skip_tests: ${{ steps.configure.outputs.skip_tests }}
    steps:
      - name: Checkout repository config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/repos-config.json
          sparse-checkout-cone-mode: false

      - name: Checkout TheRock for configure script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: eb36dd0822a5e9a53c47fae4abad0b4a978fd6f5 # 08/21/2026
          path: _therock
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Configure CI
        id: configure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 _therock/build_tools/github_actions/configure_external_repo_ci.py \
            --event-name "${{ github.event_name }}" \
            --github-repo "${{ github.repository }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --config-path ".github/repos-config.json"

  resolve_therock_ref:
    name: Resolve TheRock ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      therock_ref: ${{ steps.resolve.outputs.therock_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Install dependencies
        run: pip install requests

      # Picks one concrete TheRock SHA for the whole run. See the header comment
      # and .github/scripts/resolve_therock_ref.py for the policy. Uses the REST
      # API only, so no deep clone of this repository is required.
      - name: Resolve TheRock ref
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THEROCK_REF_OVERRIDE: ${{ inputs.therock_ref_override || '' }}
        run: python .github/scripts/resolve_therock_ref.py

  # Builds the external_repo payload handed to TheRock, adding
  # `extra_cmake_options` when this pull request carries a label listed in
  # .github/scripts/therock_multiarch_label_flags.py. With no such label the
  # payload is byte-identical to the literal this job replaced.
  #
  # Every expensive job hangs off `setup`, which needs this one, so keep it
  # dependency-free (stdlib, sparse checkout, no network): if it fails, the
  # build is skipped rather than run with an unresolved configuration.
  label_flags:
    name: Resolve label-gated cmake flags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      external_repo: ${{ steps.flags.outputs.external_repo }}
      flags_active: ${{ steps.flags.outputs.flags_active }}
      # Nothing downstream consumes these two yet. They are exposed anyway so
      # that a job wanting to report which flags are in force can name them,
      # rather than re-deriving the answer from the label set.
      flags: ${{ steps.flags.outputs.flags }}
      matched_labels: ${{ steps.flags.outputs.matched_labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Resolve label-gated cmake flags
        id: flags
        env:
          # The event payload, not a live `gh pr view`: this is the label state
          # the run was triggered for, so logs and artifacts cannot disagree
          # with it, and it needs no token and works for forks.
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EXTERNAL_REPO_REPOSITORY: ${{ github.repository }}
          EXTERNAL_REPO_REF: ${{ github.sha }}
          PREBUILT_STAGES: ${{ inputs.prebuilt_stages || '' }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '' }}
        run: python .github/scripts/therock_multiarch_label_flags.py

  # TEMPORARY DEMO JOB - do not merge. Its whole purpose is to make the label
  # gate visible from the pull request checks list: a skipped job and a running
  # job both show up there, so applying and removing the label flips this entry
  # between the two without anyone opening a run. The name states the flag
  # state rather than what the job does, because the name is the demonstration.
  demo_flag_visible:
    name: DEMO label-gated flag is ON
    needs: label_flags
    if: needs.label_flags.outputs.flags_active == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "labels matched: ${{ needs.label_flags.outputs.matched_labels }}"
          echo "flags injected: ${{ needs.label_flags.outputs.flags }}"

  setup:
    needs: [ci-env, configure, resolve_therock_ref, label_flags]
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@eb36dd0822a5e9a53c47fae4abad0b4a978fd6f5 # 08/21/2026
    with:
      build_variant: "release"
      # Limit GPU families for rocm-libraries CI
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'gfx94X,gfx950' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || 'gfx110X' }}
      linux_test_labels: ${{ inputs.linux_test_labels || '' }}
      windows_test_labels: ${{ inputs.windows_test_labels || '' }}
      # Copy all stages except math-libs and ml-libs from TheRock baseline
      # rocm-libraries only affects math-libs and ml-libs source sets
      # Note: compiler-runtime excluded due to hardcoded CMake paths (fftw3, etc.)
      # When baseline-run-id is empty, clear prebuilt_stages to force full rebuild
      #
      # Seeding is also dropped whenever a label injected a cmake flag: those
      # baseline artifacts were built with the default configuration, so reusing
      # them under a non-default one would ship a mix of both. A flag-on run
      # therefore builds every stage itself.
      #
      # The `flags_active != 'true' && (...) || ''` shape is deliberate. The
      # obvious `flags_active == 'true' && '' || (...)` cannot work: these
      # operators yield operand values, and an empty-string left operand is
      # falsy, so the true branch would fall through to the right-hand side.
      prebuilt_stages: ${{ needs.label_flags.outputs.flags_active != 'true' && (inputs.prebuilt_stages || (needs.ci-env.outputs.baseline-run-id != '' && 'runtime-tests,comm-libs,cv-libs,storage-libs,debug-tools,dctools-core,profiler-apps,media-libs,wsl-rocdxg')) || '' }}
      # Pull baseline run ID from ci-env (updated by assistant-librarian[bot] on submodule bumps)
      baseline_run_id: ${{ needs.label_flags.outputs.flags_active != 'true' && (inputs.baseline_run_id || needs.ci-env.outputs.baseline-run-id) || '' }}
      # Enable automatic stage reuse - TheRock finds commit-compatible baselines
      # and determines which stages to rebuild based on changed files.
      # Reuse is keyed on changed file paths only; cmake flags are not part of
      # the key, so a flag-on run could otherwise inherit stages built flag-off.
      # Force it off whenever a label injected a flag.
      stage_reuse_mode: ${{ needs.label_flags.outputs.flags_active == 'true' && 'dry-run' || 'reuse-stage' }}
      repository: ROCm/TheRock
      # Fixed TheRock commit, so the whole run builds against one known revision
      # instead of whatever main happens to be. setup re-exports the checked-out
      # commit as needs.setup.outputs.ref for downstream jobs.
      # TODO: After multi-arch CI is fully migrated to TheRock, remove the explicit ref here
      ref: eb36dd0822a5e9a53c47fae4abad0b4a978fd6f5  # 08/21/2026
      # Pass external repo info for stage-impact analysis. Built by label_flags
      # rather than written literally here, because it also carries the
      # `extra_cmake_options` any gated label injected. With no such label the
      # value is byte-identical to the literal it replaced.
      external_repo: ${{ needs.label_flags.outputs.external_repo }}

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [configure, setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true' &&
        needs.configure.outputs.skip_tests != 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@eb36dd0822a5e9a53c47fae4abad0b4a978fd6f5 # 08/21/2026
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty string when run_all_tests=true triggers full test run in downstream workflow
      changed_projects: ${{ needs.configure.outputs.run_all_tests == 'true' && '' || needs.configure.outputs.changed_projects }}
      repository: ROCm/TheRock
      # Concrete SHA resolved once by setup; do not re-resolve main here.
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: [configure, setup]
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true' &&
        needs.configure.outputs.skip_tests != 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_windows.yml@eb36dd0822a5e9a53c47fae4abad0b4a978fd6f5 # 08/21/2026
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty string when run_all_tests=true triggers full test run in downstream workflow
      changed_projects: ${{ needs.configure.outputs.run_all_tests == 'true' && '' || needs.configure.outputs.changed_projects }}
      repository: ROCm/TheRock
      # Concrete SHA resolved once by setup; do not re-resolve main here.
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch CI Summary
    if: always()
    needs:
      # label_flags belongs here, not just upstream of setup. When a pre-setup job
      # fails, setup and the build jobs resolve to "skipped", and the summary
      # treats "skipped" as an acceptable result -- so without this entry the
      # summary check reports green even though the run itself failed.
      - label_flags
      - setup
      - linux_build_and_test
      - windows_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          # Concrete SHA resolved once by setup; do not re-resolve main here.
          ref: ${{ needs.setup.outputs.ref }}
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
