name: Proposal 2 FFTW artifact portability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fftw-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact execution environment
        run: |
          git rev-parse HEAD
          uname -a
          cmake --version
          cc --version
          tar --version
      - name: Check current producer artifacts and bounded candidate exports
        run: python3 .github/proposal2-evaluation/fftw_probe.py
      - name: Upload all logs, original artifacts and candidate configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposal2-fftw-portability-evidence
          path: probe-evidence/
