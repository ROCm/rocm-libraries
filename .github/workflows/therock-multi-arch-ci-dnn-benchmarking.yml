# dnn-benchmarking workloads for the hipDNN providers, on GPU runners
#
# Runs the `dnn_benchmarking` test category of the MIOpen and hipBLASLt provider
# integration tests (dnn-providers/*/test_categories_integration.yaml) through
# TheRock's multi-arch pipeline: the same build, artifact and GPU-runner path as
# the other TheRock CI workflows. The suites run the graphs pulled from
# dnn-benchmarking (dnn-providers/integration-tests/workloads/) and take hours,
# so this workflow is manual only. No other workflow selects them: TheRock's
# quick, standard, comprehensive and full categories exclude them.
#
# `test_filter:dnn_benchmarking` is accepted by TheRock only at a commit that
# contains ROCm/TheRock's dnn_benchmarking test type, so this workflow pins a
# newer TheRock ref than the other TheRock workflows.

name: TheRock Multi-Arch dnn-benchmarking

# TheRock ref: pinned to ROCm/TheRock commit 06e18dd33ec8e7e986d9cc80f8d67c5380d23241.
# NOTE: update all `@<ref>` refs and `ref:` inputs together when switching.

on:
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Comma-separated Linux GPU families to build and test. ex: gfx94X, gfx950"
        default: "gfx94X"
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all'); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"

permissions:
  contents: read
  actions: read

concurrency:
  # Own group, so a long workload run is never cancelled by (or cancels) the
  # nightly run on the same commit.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@06e18dd33ec8e7e986d9cc80f8d67c5380d23241 # dnn_benchmarking test type
    with:
      build_variant: "release"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      # Only the providers that run the workloads; test_filter selects the category.
      pr_labels: "test:miopenprovider,test:hipblasltprovider,test_filter:dnn_benchmarking"
      prebuilt_stages: ${{ inputs.prebuilt_stages }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      baseline_repository: ${{ inputs.baseline_run_id != '' && github.repository || '' }}
      repository: ROCm/TheRock
      ref: 06e18dd33ec8e7e986d9cc80f8d67c5380d23241 # dnn_benchmarking test type
      external_repo: >-
        {
          "repository": "${{ github.repository }}",
          "ref": "${{ github.sha }}",
          "event_name": "${{ github.event_name }}"
        }

  log_therock_ref:
    name: Locked TheRock ref
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - name: Surface locked TheRock ref
        run: |
          RESOLVED_REF="${{ needs.setup.outputs.ref }}"
          COMMIT_URL="https://github.com/ROCm/TheRock/commit/${RESOLVED_REF}"
          echo "Locked TheRock ref for this run: ${RESOLVED_REF} (${COMMIT_URL})"
          {
            echo "### Locked TheRock ref"
            echo ""
            echo "Every build/test job in this run is locked to ROCm/TheRock commit [\`${RESOLVED_REF}\`](${COMMIT_URL})."
            echo ""
            echo "Test type: \`${{ needs.setup.outputs.test_type }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@06e18dd33ec8e7e986d9cc80f8d67c5380d23241 # dnn_benchmarking test type
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty string runs the test: labels from setup instead of changed-project selection
      changed_projects: ''
      repository: ROCm/TheRock
      ref: 06e18dd33ec8e7e986d9cc80f8d67c5380d23241 # dnn_benchmarking test type
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch dnn-benchmarking Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: 06e18dd33ec8e7e986d9cc80f8d67c5380d23241 # dnn_benchmarking test type
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
