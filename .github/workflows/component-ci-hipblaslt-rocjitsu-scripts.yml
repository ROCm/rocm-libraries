name: "Component CI: hipBLASLt rocjitsu scripts"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            projects/hipblaslt/clients/scripts/rocjitsu
            .github/scripts
          persist-credentials: false

      # The tests use stand-in benchmarks and emulators, so the GEMM workload
      # runners need no build, artifacts or GPU here.
      - name: Run unit tests
        run: python3 -B -m unittest discover -v -s projects/hipblaslt/clients/scripts/rocjitsu -p 'test_*.py'
