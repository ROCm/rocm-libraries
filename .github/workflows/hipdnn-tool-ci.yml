#
# hipDNN tool CI (ALMIOPEN-1848) — platform-agnostic reusable workflow.
#
# Invoked from therock-ci-{linux,windows}.yml after the matching therock-build
# job, so it installs the PR's OWN freshly-built ROCm by github.run_id. Tool-only
# PRs (hipDNN not rebuilt this run) fall back to the latest nightly dist tarball.
# Runs the dnn-benchmarking + dnn-convert-shapes pytest suites and a benchmark
# smoke run over the committed sample graphs (tool-health gate, not perf).
#
# UNVERIFIED on Windows: plugin lands at lib/hipdnn_plugins/engines/ as a .dll
# with deps on PATH; --tests slice ships the frontend bindings; a Windows GPU
# runner exists for the family.

name: hipDNN Tool CI

on:
  workflow_call:
    inputs:
      therock_ref:
        description: "TheRock ref to check out build_tools from (incl. pack_frontend_wheel.py)."
        type: string
        required: true
      projects_to_test:
        description: "Build matrix projects_to_test; selects run-id vs latest-nightly install mode."
        type: string
        required: true
      amdgpu_families:
        description: "TheRock artifact family (e.g. gfx94X-dcgpu, gfx110X-dgpu)."
        type: string
        required: true
      test_runs_on:
        description: "GPU test runner label."
        type: string
        required: true
      platform:
        description: '"linux" or "windows".'
        type: string
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: hipDNN benchmark smoke (${{ inputs.amdgpu_families }})
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 60
    # null (not '') is what GitHub treats as "no container": Linux runs in the
    # no_rocm container, Windows on the host VM.
    container:
      image: ${{ inputs.platform == 'linux' && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: ${{ inputs.platform == 'linux' && '--ipc host --group-add video --device /dev/kfd --device /dev/dri --group-add 993 --group-add 992 --group-add 110 --env-file /etc/podinfo/gha-gpu-isolation-settings' || null }}
    defaults:
      run:
        shell: bash
    env:
      AMDGPU_FAMILY: ${{ inputs.amdgpu_families }}
      HIPDNN_BUILT: ${{ contains(inputs.projects_to_test, 'hipdnn') }}
      RUN_GITHUB_REPO: ${{ github.repository }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      GRAPH_GLOB: projects/hipdnn/tools/dnn-benchmarking/graphs/*.json
      WARMUP: "1"
      ITERS: "1"
      VENV_DIR: ${{ github.workspace }}/.venv
      # Container runs non-root, so the default /opt/rocm is not writable.
      ROCM_PATH: ${{ github.workspace }}/therock
      # Linux .so discovery; ignored on Windows (which uses PATH instead).
      LD_LIBRARY_PATH: ${{ github.workspace }}/therock/lib
    steps:
      - name: Configure git for long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Fetch TheRock build_tools for pre-job cleanup
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          sparse-checkout: build_tools
          path: prejob

      # GPU test runners are persistent/shared, so clear stray GPU processes from
      # the previous tenant before, and ours after.
      - name: Pre-job GPU process cleanup (Windows)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Pre-job GPU process cleanup (Linux)
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout TheRock build_tools at pinned ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}
          sparse-checkout: build_tools
          path: TheRock

      # The no_rocm container's system python3 lacks python3-venv and the job runs
      # non-root, so use setup-python (ships a working ensurepip).
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Python venv + base deps
        run: |
          python -m venv "$VENV_DIR"
          if [ "$RUNNER_OS" = "Windows" ]; then VENV_BIN="$VENV_DIR/Scripts"; else VENV_BIN="$VENV_DIR/bin"; fi
          # shellcheck disable=SC1091
          source "$VENV_BIN/activate"
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_DIR" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          # boto3 + pyzstd: install_rocm_from_artifacts.py decompresses zstd slices.
          pip install boto3 pyzstd cmake ninja

      - name: Put ROCm bin on PATH for DLL discovery (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: echo "${ROCM_PATH}/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt ROCm (this run's build, or latest nightly fallback)
        run: |
          # --miopenprovider is REQUIRED: the MIOpen engine plugin ships in that
          # slice, not hipdnn_lib; without it the plugin dir is empty and the gate
          # fails with pass_combinations=0. --amdgpu-targets omitted (optional; the
          # family resolves the artifacts). Tool-only PRs have no per-slice set ->
          # --latest-release monolithic tarball (slice flags do not apply).
          if [ "${HIPDNN_BUILT}" = "true" ]; then
            python3 TheRock/build_tools/install_rocm_from_artifacts.py \
              --run-id "${ARTIFACT_RUN_ID}" \
              --run-github-repo "${RUN_GITHUB_REPO}" \
              --amdgpu-family "${AMDGPU_FAMILY}" \
              --output-dir "${ROCM_PATH}" \
              --hipdnn --miopenprovider --tests --blas --miopen
          else
            python3 TheRock/build_tools/install_rocm_from_artifacts.py \
              --latest-release \
              --amdgpu-family "${AMDGPU_FAMILY}" \
              --output-dir "${ROCM_PATH}"
          fi

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: python3 TheRock/build_tools/print_driver_gpu_info.py

      - name: Repack + install prebuilt hipdnn_frontend wheel
        run: |
          # The frontend bindings ship PREBUILT in the --tests slice; repack into a
          # wheel — do NOT compile in-job.
          PKG_DIR="${ROCM_PATH}/share/hipdnn/python/hipdnn_frontend"
          if [ ! -d "${PKG_DIR}" ]; then
            echo "::error::Prebuilt hipdnn_frontend bindings not found at ${PKG_DIR}. Ensure the TheRock hipDNN-python-wheel publishing dependency landed and the build matrix includes the --tests slice."
            exit 1
          fi
          pip install build wheel
          python3 TheRock/build_tools/github_actions/test_executable_scripts/hipdnn/pack_frontend_wheel.py \
            --pkg-dir "${PKG_DIR}" \
            --wheel-dir wheelhouse
          pip install --no-deps wheelhouse/hipdnn_frontend-*.whl

      - name: Install benchmark tool deps
        run: pip install -e "rocm-libraries/projects/hipdnn/tools/dnn-benchmarking[test]"

      - name: Run dnn-benchmarking pytest suite
        working-directory: rocm-libraries/projects/hipdnn/tools/dnn-benchmarking
        # torch is not installed, so the two pytorch-backend tests fail at COLLECTION
        # (module-top import, before the -m filter) — ignore them by path.
        run: |
          python -m pytest -ra -m "not nvidia and not slow" \
            --ignore=tests/integration/test_pytorch_benchmark.py \
            --ignore=tests/integration/test_gpu_timing_cuda.py

      - name: Run dnn-convert-shapes pytest suite
        working-directory: rocm-libraries/projects/hipdnn/tools/dnn-convert-shapes
        run: |
          pip install -e .[test]
          python -m pytest -ra

      - name: Run benchmark smoke
        working-directory: rocm-libraries
        run: |
          test -d "${ROCM_PATH}/lib/hipdnn_plugins/engines" || {
            echo "::error::plugin engine dir ${ROCM_PATH}/lib/hipdnn_plugins/engines missing — prebuilt artifact layout changed"; exit 1; }
          python -m dnn_benchmarking \
            --graph "${GRAPH_GLOB}" \
            --warmup "${WARMUP}" --iters "${ITERS}" \
            --plugin-path "${ROCM_PATH}/lib/hipdnn_plugins/engines" \
            --output results.json

      - name: Gate-check results.json
        working-directory: rocm-libraries
        run: python3 projects/hipdnn/tools/dnn-benchmarking/ci/check_results.py results.json

      - name: Post-job GPU process cleanup (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\TheRock\build_tools\github_actions\cleanup_processes.ps1'

      - name: Post-job GPU process cleanup (Linux)
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./TheRock/build_tools/github_actions/cleanup_processes.sh
