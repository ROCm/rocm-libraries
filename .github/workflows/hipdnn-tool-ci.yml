#
# hipDNN tool CI (ALMIOPEN-1848) — reusable workflow.
#
# Invoked as a job from therock-ci-linux.yml, AFTER therock-build-linux, so it
# runs inside the SAME therock-ci run that built the hipDNN artifacts. That is the
# whole point of this shape: it installs the PR's OWN freshly-built ROCm by
# `github.run_id` (install_rocm_from_artifacts --run-id) — no cross-run artifact
# resolution, no slice-aware run-id scan. hipDNN is built CONDITIONALLY
# (therock_configure_ci only builds changed subtrees), but the caller gates this
# job on the build matrix actually carrying hipDNN (projects_to_test contains
# "hipdnn") and on the gfx94X-dcgpu family, so it runs only when there are hipDNN
# artifacts in this very run to exercise.
#
# Exercises the hipDNN python tools against the prebuilt artifacts on a gfx942 GPU:
#   * dnn-benchmarking pytest suite (GPU tests run for real; CUDA/slow excluded)
#   * dnn-convert-shapes pytest suite (CPU-only)
#   * dnn_benchmarking smoke run over the committed sample graphs, gated on the
#     tool running end-to-end (non-zero exit, zero passes, or any errored
#     combination fails). It does NOT validate performance or correctness.
#
# Fork policy is owned by the caller (therock-ci): this reusable workflow never
# defines its own pull_request trigger, so untrusted fork code only reaches the
# GPU runner if the parent pipeline already admitted it.

name: hipDNN Tool CI

on:
  workflow_call:
    inputs:
      therock_ref:
        description: "TheRock ref to check out build_tools from (script version, incl. pack_frontend_wheel.py)."
        type: string
        required: true
      projects_to_test:
        description: "Build matrix projects_to_test string; the benchmark job runs only when it contains 'hipdnn'."
        type: string
        required: true
      amdgpu_families:
        description: "TheRock artifact family for install_rocm_from_artifacts.py (e.g. gfx94X-dcgpu)."
        type: string
        required: true
      test_runs_on:
        description: "GPU test runner label."
        type: string
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: hipDNN benchmark smoke (${{ inputs.amdgpu_families }})
    # Defensive self-guard; the caller already gates on the same condition.
    if: ${{ contains(inputs.projects_to_test, 'hipdnn') }}
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 60
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      AMDGPU_FAMILY: ${{ inputs.amdgpu_families }}
      AMDGPU_TARGETS: gfx942
      # The artifacts to install are THIS run's own build outputs.
      RUN_GITHUB_REPO: ${{ github.repository }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      # Committed sample graphs, NOT the DVC Workloads suite: this is a tool-health
      # smoke gate, so a handful of small graphs keeps it fast. The large DVC
      # Workloads suite is for offline perf runs, not presubmit.
      GRAPH_GLOB: projects/hipdnn/tools/dnn-benchmarking/graphs/*.json
      WARMUP: "1"
      ITERS: "1"
      VENV_DIR: ${{ github.workspace }}/.venv
      LD_LIBRARY_PATH: /opt/rocm/lib
    steps:
      - name: Fetch TheRock build_tools for pre-job cleanup
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          sparse-checkout: build_tools
          path: prejob

      - name: Pre-job GPU process cleanup
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout TheRock build_tools at pinned ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}
          sparse-checkout: build_tools
          path: TheRock

      - name: Set up Python venv + base deps
        run: |
          # The no_rocm_image container ships python3 WITHOUT the python3-venv
          # package, so `python3 -m venv` fails ("ensurepip is not available").
          # Install it first (container runs as root) so venv creation gets a
          # working ensurepip and the downstream bare `pip install` steps work.
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv "$VENV_DIR"
          # shellcheck disable=SC1091
          source "$VENV_DIR/bin/activate"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_DIR" >> "$GITHUB_ENV"
          pip install --upgrade pip
          # boto3 is needed by install_rocm_from_artifacts.py. The benchmark runs
          # over committed sample graphs, so no dvc is needed.
          pip install boto3 cmake ninja

      - name: Fetch prebuilt ROCm by run-id (this run's own build)
        run: |
          # ARTIFACT_RUN_ID is github.run_id — the therock-ci run that just built
          # hipDNN in the therock-build-linux job this job depends on. Because the
          # caller only invokes this job when the matrix built hipDNN, the hipdnn /
          # miopenprovider / tests slices are guaranteed present, so no slice-aware
          # resolver is needed.
          #
          # --miopenprovider is REQUIRED: the MIOpen engine plugin
          # (lib/hipdnn_plugins/engines/libmiopen_plugin.so) ships in the
          # miopenprovider slice, NOT hipdnn_lib. Without it the plugin dir is empty
          # and every combination is skipped -> the gate fails with
          # pass_combinations=0. --flatten (set by install_rocm_from_artifacts for
          # run-id installs) strips the ml-libs/<comp>/stage prefix so the engine
          # lands at /opt/rocm/lib/hipdnn_plugins/engines/.
          python3 TheRock/build_tools/install_rocm_from_artifacts.py \
            --run-id "${ARTIFACT_RUN_ID}" \
            --run-github-repo "${RUN_GITHUB_REPO}" \
            --amdgpu-family "${AMDGPU_FAMILY}" \
            --amdgpu-targets "${AMDGPU_TARGETS}" \
            --output-dir /opt/rocm \
            --hipdnn --miopenprovider --tests --blas --miopen
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: python3 TheRock/build_tools/print_driver_gpu_info.py

      - name: Install torch (ROCm nightly)
        run: |
          pip install --pre torch \
            --index-url "https://rocm.nightlies.amd.com/v2-staging/${AMDGPU_FAMILY}/"

      - name: Repack + install prebuilt hipdnn_frontend wheel
        run: |
          # The hipdnn_frontend Python bindings ship PREBUILT inside the --tests
          # artifact slice. install_rocm_from_artifacts.py --flatten lands the staged
          # files at /opt/rocm/share/hipdnn/python/hipdnn_frontend. Repack them into a
          # wheel with TheRock's repack script and install — do NOT compile in-job.
          # The repack script lives on the TheRock ref passed in via therock_ref.
          PKG_DIR=/opt/rocm/share/hipdnn/python/hipdnn_frontend
          if [ ! -d "${PKG_DIR}" ]; then
            echo "::error::Prebuilt hipdnn_frontend bindings not found at ${PKG_DIR}. The TheRock hipDNN-python-wheel publishing dependency (which ships the bindings into the --tests slice) is not present on this run. Ensure the publishing change has landed and the build matrix includes the --tests slice."
            exit 1
          fi
          pip install build wheel
          python3 TheRock/build_tools/github_actions/test_executable_scripts/hipdnn/pack_frontend_wheel.py \
            --pkg-dir "${PKG_DIR}" \
            --wheel-dir wheelhouse
          pip install --no-deps wheelhouse/hipdnn_frontend-*.whl

      - name: Patch torch's bundled libhipdnn_backend.so
        # torch's ROCm wheel bundles libhipdnn_backend.so in its _rocm_sdk_libraries_*
        # companion package. With RTLD_GLOBAL the frontend can bind to that stale copy
        # instead of the prebuilt-TheRock backend it was built against -> ABI mismatch
        # crash. Overwrite it with the /opt/rocm backend. Mirrors
        # dnn-benchmarking/setup.sh. Guarded so it no-ops if either path is absent.
        #
        # Stays defensive even with the prebuilt-wheel flow: the benchmark lazily
        # imports torch during timing (timing.py), so torch's bundled backend can
        # still shadow the prebuilt /opt/rocm backend via RTLD_GLOBAL.
        run: |
          WHEEL_BACKEND=$(find "$VENV_DIR" -path '*/_rocm_sdk_libraries_*/lib/libhipdnn_backend.so' 2>/dev/null | head -1)
          if [ -n "${WHEEL_BACKEND}" ] && [ -f /opt/rocm/lib/libhipdnn_backend.so ]; then
            echo "Patching ${WHEEL_BACKEND}"
            cp /opt/rocm/lib/libhipdnn_backend.so "${WHEEL_BACKEND}"
          else
            echo "No bundled backend to patch (wheel_backend='${WHEEL_BACKEND}'); skipping."
          fi

      - name: Install benchmark tool deps
        run: pip install -e rocm-libraries/projects/hipdnn/tools/dnn-benchmarking

      - name: Run dnn-benchmarking pytest suite
        working-directory: rocm-libraries/projects/hipdnn/tools/dnn-benchmarking
        # Full tool test suite on the GPU runner. GPU/amd tests run for real here;
        # they self-skip via conftest if no GPU/plugin. Profiler-marker tests mock
        # their binaries, so no rocprofv3/perf/rocprof-compute install is needed.
        # Exclude 'nvidia' (CUDA-only) and 'slow' to keep the gate fast.
        run: python -m pytest -ra -m "not nvidia and not slow"

      - name: Run dnn-convert-shapes pytest suite
        working-directory: rocm-libraries/projects/hipdnn/tools/dnn-convert-shapes
        # CPU-only shape-converter tests; pytest ships in the package's [test] extra.
        run: |
          pip install -e .[test]
          python -m pytest -ra

      - name: Run benchmark smoke
        working-directory: rocm-libraries
        # Runs over the committed sample graphs (graphs/*.json); no DVC pull. This
        # is a fast tool-health gate, not a perf run.
        run: |
          test -d /opt/rocm/lib/hipdnn_plugins/engines || {
            echo "::error::plugin engine dir /opt/rocm/lib/hipdnn_plugins/engines missing — prebuilt artifact layout changed"; exit 1; }
          python -m dnn_benchmarking \
            --graph "${GRAPH_GLOB}" \
            --warmup "${WARMUP}" --iters "${ITERS}" \
            --plugin-path /opt/rocm/lib/hipdnn_plugins/engines \
            --output results.json

      - name: Gate-check results.json
        working-directory: rocm-libraries
        run: python3 projects/hipdnn/tools/dnn-benchmarking/ci/check_results.py results.json

      - name: Emit provenance sidecar
        if: always()
        working-directory: rocm-libraries
        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          AMDGPU_FAMILY: ${{ env.AMDGPU_FAMILY }}
          AMDGPU_TARGETS: ${{ env.AMDGPU_TARGETS }}
          GRAPH_GLOB: ${{ env.GRAPH_GLOB }}
          WARMUP: ${{ env.WARMUP }}
          ITERS: ${{ env.ITERS }}
          THEROCK_REF: ${{ inputs.therock_ref }}
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          RUN_GITHUB_REPO: ${{ env.RUN_GITHUB_REPO }}
        run: python3 projects/hipdnn/tools/dnn-benchmarking/ci/emit_provenance.py provenance.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: hipdnn-benchmark-results
          path: |
            rocm-libraries/results.json
            rocm-libraries/provenance.json
            wheelhouse/*.whl
          if-no-files-found: warn

      - name: Post-job GPU process cleanup
        if: always()
        timeout-minutes: 5
        run: bash ./TheRock/build_tools/github_actions/cleanup_processes.sh
