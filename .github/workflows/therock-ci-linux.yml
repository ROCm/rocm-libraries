name: TheRock CI

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      project_to_test:
        type: string
      subtree:
        type: string
    secrets:
      app_id:
        required: false
      app_private_key:
        required: false


permissions:
  contents: read

jobs:
  therock-build-linux:
    name: Build Linux Packages
    permissions:
      contents: read
      id-token: write
    uses: ROCm/TheRock/.github/workflows/build_linux_packages.yml@users/geomin12/fix-monorepo-fork
    with:
      amdgpu_families: "gfx94X-dcgpu"
      expect_failure: false
      extra_cmake_options: "-DTHEROCK_USE_EXTERNAL_ROCM_LIBRARIES=ON -DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=rocm-libraries ${{ inputs.cmake_options }}"
      subtree: ${{ inputs.subtree }}
    secrets:
      rocm_libraries_app_id: ${{ secrets.app_id }}
      rocm_libraries_app_private_key: ${{ secrets.app_private_key }}

  therock-test-linux:
    name: "Test"
    needs: [therock-build-linux]
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      project_to_test: ${{ inputs.project_to_test }}
      amdgpu_families: "gfx94X-dcgpu"
      test_runs_on: "linux-mi300-1gpu-ossci-rocm"
      platform: "linux"
