name: TheRock CI Linux

on:
  workflow_call:
    inputs:
      therock_ref:
        type: string
        required: true
      docker_image:
        type: string
        required: true
      rocm_package_version:
        type: string
        required: true
      cmake_options:
        type: string
      projects_to_test:
        type: string
      test_type:
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      build_runs_on:
        type: string

permissions:
  contents: read

jobs:
  therock-build-linux:
    name: Build (${{ inputs.amdgpu_families }})
    runs-on: ${{ inputs.build_runs_on }}
    permissions:
      id-token: write
    container:
      image: ${{ inputs.docker_image }}
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: "Checking out repository for rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ inputs.therock_ref }}

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Patch rocm-libraries
        run: |
          # Remove patches here if they cannot be applied cleanly, and they have not been deleted from TheRock repo
          # rm ./TheRock/patches/amd-mainline/rocm-libraries/*.patch
          # git -c user.name="therockbot" -c "user.email=therockbot@amd.com" am --whitespace=nowarn ./TheRock/patches/amd-mainline/rocm-libraries/*.patch

      # safe.directory must be set before Runner health status
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./TheRock/build_tools/health_status.py

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks

      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ${{ inputs.rocm_package_version }}
          extra_cmake_options: "-DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../ ${{ inputs.cmake_options }}"
          BUILD_DIR: build
        run: |
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-artifacts and therock-dist
        run: cmake --build TheRock/build --target therock-artifacts therock-dist -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build/dist/rocm
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v
          tail -v -n +1 .ccache/compiler_check_cache/* > TheRock/build/logs/ccache_compiler_check_cache.log

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Push artifacts
        run: |
          python TheRock/build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --build-dir TheRock/build \
            --stage all

      - name: Post Build Upload
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build \
            --upload

      - name: Notify Teams Channel on Failure
        if: ${{ failure() && !github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/notify_teams.py \
            --failure-stage build \
            --log-path TheRock/build/logs \
            --webhook-urls '{"miopen":"${{ secrets.MIOPEN_CI_WEBHOOK_URL }}","hipdnn":"${{ secrets.HIPDNN_CI_WEBHOOK_URL }}"}' \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --component-name "${{ inputs.projects_to_test }}"

  therock-test-linux:
    name: Test (${{ inputs.amdgpu_families }})
    needs: [therock-build-linux]
    # TODO(TheRock#3288): Re-enable gfx950-dcgpu runners once we get more capacity
    if: ${{ inputs.amdgpu_families != 'gfx950-dcgpu' }}
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      therock_ref: ${{ inputs.therock_ref }}
      projects_to_test: ${{ inputs.projects_to_test }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "linux"
      test_type: ${{ inputs.test_type }}
    secrets: inherit

  rocjitsu-race-check-linux:
    name: rocjitsu race check (${{ inputs.amdgpu_families }})
    needs: [therock-build-linux]
    # This is a narrow post-build instrumentation job for hipBLASLt on gfx950.
    # Normal package tests cover broad functionality; this job fetches the BLAS
    # artifacts from the just-finished TheRock build and runs two small workloads
    # under rocjitsu's race detector. Keep it gated to hipblaslt + gfx950 while
    # rocjitsu packaging and runner capacity are still evolving.
    if: ${{ inputs.test_runs_on != '' && startsWith(inputs.amdgpu_families, 'gfx950') && contains(format(',{0},', inputs.projects_to_test), ',hipblaslt,') }}
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --user 0:0
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      OUTPUT_ARTIFACTS_DIR: ./build
      ROCM_PATH: ${{ github.workspace }}/build
      ROCJITSU_SOURCE_DIR: ${{ github.workspace }}/rocm-systems/emulation/rocjitsu
      ROCJITSU_BUILD_DIR: ${{ github.workspace }}/rocjitsu-build
      RACE_REPORT_DIR: ${{ github.workspace }}/race-reports
      # Per-workload timeouts are below the job timeout so the script can report
      # which workload failed and still upload race-reports on exit.
      RACE_TIMEOUT_SECONDS: "180"
      TENSILELITE_TIMEOUT_SECONDS: "420"
    steps:
      # The job needs three inputs in one workspace:
      #   1. TheRock actions/scripts to fetch the exact artifacts from this run.
      #   2. This rocm-libraries checkout for the race-check driver script.
      #   3. rocm-systems source for rocjitsu until rocjitsu is packaged as a
      #      complete runnable artifact.
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries

      - name: Checkout rocm-systems for rocjitsu
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ROCm/rocm-systems
          ref: develop
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu
            shared/machine-readable-isa/isa
          sparse-checkout-cone-mode: true

      # The base image intentionally does not contain a full ROCm install. Keep
      # the apt dependency set to ordinary host build tools; the ROCm runtime,
      # clients, and TensileLite Python tree come from TheRock artifacts below.
      - name: Install rocjitsu build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libdrm-dev \
            ninja-build

      # Pull the BLAS runtime and test payload from the current TheRock build.
      # This is what keeps the check aligned with the exact hipBLASLt and
      # TensileLite artifacts produced by the PR, rather than an image-local or
      # previously installed ROCm tree.
      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: ./.github/actions/setup_test_environment
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: --blas --tests

      # Fail early with import paths printed if the test artifact is missing
      # Python dependencies or if PYTHONPATH/LD_LIBRARY_PATH no longer match the
      # artifact layout. That makes packaging/layout regressions distinct from
      # real race-detector findings.
      - name: Verify TensileLite Python environment
        run: |
          export PYTHONPATH="${ROCM_PATH}/share/hipblaslt/tensilelite${PYTHONPATH:+:${PYTHONPATH}}"
          export LD_LIBRARY_PATH="${ROCM_PATH}/lib:${ROCM_PATH}/lib/rocm_sysdeps/lib:${ROCM_PATH}/lib/llvm/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          "${VENV_DIR}/bin/python" - <<'PY'
          import filelock
          import joblib
          import msgpack
          import numpy
          import yaml
          import Tensile
          import rocisa
          import rocisa.instruction
          print("Tensile:", Tensile.ROOT_PATH)
          print("rocisa:", rocisa.__file__)
          PY

      - name: Run rocjitsu race check
        timeout-minutes: 75
        run: bash rocm-libraries/.github/scripts/run_rocjitsu_hipblaslt_race_check.sh

      # Upload even on failure. The report directory contains the per-workload
      # stdout logs, rocjitsu sink files, race.log files, generated reduced
      # TensileLite input/output, and timing.tsv; without this artifact a failed
      # detector run is usually not actionable from the console log alone.
      - name: Upload race reports
        if: ${{ always() }}
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: rocjitsu-race-reports-${{ inputs.amdgpu_families }}
          path: race-reports/
          if-no-files-found: ignore
