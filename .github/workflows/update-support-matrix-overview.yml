name: Update support matrix overview

on:
  schedule:
    # Nightly at 03:17 UTC (off-minute to avoid the :00 stampede)
    - cron: '17 3 * * *'
  push:
    branches:
      - develop
    paths:
      - 'dnn-providers/integration-tests/integration-test-bundles/**/*.json'
      - 'dnn-providers/integration-tests/scripts/render_support_matrix.py'
      - 'dnn-providers/integration-tests/scripts/bundle_discovery.py'
  workflow_dispatch:

concurrency:
  group: update-support-matrix-overview
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    if: github.repository == 'ROCm/rocm-libraries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Regenerate overview
        run: python3 dnn-providers/integration-tests/scripts/render_support_matrix.py --overview-only

      - name: Open PR if changed
        run: |
          cd dnn-providers/integration-tests
          git add SUPPORT_MATRIX_OVERVIEW.md
          if git diff --cached --quiet; then
            echo "Overview is up to date, nothing to commit."
          else
            BRANCH="chore/update-support-matrix-overview"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git commit -m "chore: regenerate support matrix overview"
            git push --force origin "$BRANCH"
            # Create or update the PR (idempotent).
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore: regenerate support matrix overview" \
              --body "Auto-generated by the nightly support-matrix-overview workflow." \
              2>/dev/null \
            || gh pr edit "$BRANCH" --body "Auto-generated by the nightly support-matrix-overview workflow (updated $(date -u +%F))."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
