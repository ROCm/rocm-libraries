# This reusable workflow is a narrow post-build instrumentation job for
# hipBLASLt. It fetches BLAS artifacts from the just-finished TheRock build and
# runs two small workloads under rocjitsu's race detector. The workloads run
# entirely under CPU-side emulation, so the workflow uses the CPU build runner
# instead of consuming GPU test capacity.

name: TheRock rocjitsu race check Linux

on:
  workflow_call:
    inputs:
      therock_ref:
        type: string
        required: true
      build_runs_on:
        type: string
        required: true
      amdgpu_families:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rocjitsu-race-check-linux:
    name: rocjitsu race check (${{ inputs.amdgpu_families }})
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: 90
    container:
      # Use a plain Ubuntu image without ROCm preinstalled. The ROCm runtime,
      # compiler, hipBLASLt, and TensileLite all come from TheRock artifacts
      # fetched below, so this job tests the PR-produced payload.
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --user 0:0
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      OUTPUT_ARTIFACTS_DIR: ./build
      ROCM_PATH: ${{ github.workspace }}/build
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      RACE_REPORT_DIR: ${{ github.workspace }}/race-reports
      # Per-workload timeouts are below the job timeout so the script can report
      # which workload failed and still upload race-reports on exit.
      RACE_TIMEOUT_SECONDS: "180"
      TENSILELITE_TIMEOUT_SECONDS: "420"
    steps:
      # The job needs two inputs in one workspace:
      #   1. TheRock actions/scripts to fetch the exact artifacts from this run.
      #   2. This rocm-libraries checkout for the race-check driver script.
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      # Pull the BLAS runtime/test payload and the target-neutral Mirage +
      # rocjitsu artifacts from the current TheRock build.
      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: ./.github/actions/setup_test_environment
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: --blas --tests --rocjitsu --mirage

      - name: Run rocjitsu race check
        timeout-minutes: 75
        run: bash rocm-libraries/.github/scripts/run_rocjitsu_hipblaslt_race_check.sh

      # Upload even on failure. The report directory contains the per-workload
      # stdout logs, rocjitsu sink files, race.log files, generated reduced
      # TensileLite input/output, and timing.tsv; without this artifact a failed
      # detector run is usually not actionable from the console log alone.
      - name: Upload race reports
        if: ${{ always() }}
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: rocjitsu-race-reports-${{ inputs.amdgpu_families }}
          path: race-reports/
          if-no-files-found: ignore
