name: "Component CI: GEKO"

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
      linux_runner:
        type: string
        required: true
      windows_runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ${{ inputs.linux_runner }}
    container:
      image: ${{ inputs.docker_image }}
    defaults:
      run:
        shell: bash
        working-directory: projects/hipblaslt/utilities/geko
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-linux
        with:
          amdgpu_family: gfx94X-dcgpu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run GEKO coverage gate
        env:
          HIPBLASLT_PATH: ${{ github.workspace }}/projects/hipblaslt
        run: |
          python -m tox -e coverage

      - name: Test pip install
        uses: ./.github/actions/pip-install-test
        with:
          package_path: projects/hipblaslt/utilities/geko
          test_path: tests

  windows:
    name: Windows
    runs-on: ${{ inputs.windows_runner }}
    defaults:
      run:
        shell: bash
        working-directory: projects/hipblaslt/utilities/geko
    steps:
      - name: Configure git long paths
        working-directory: .
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-windows
        with:
          amdgpu_family: gfx1151

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run GEKO coverage gate
        env:
          HIPBLASLT_PATH: ${{ github.workspace }}/projects/hipblaslt
        run: |
          python -m tox -e coverage

      - name: Test pip install
        uses: ./.github/actions/pip-install-test
        with:
          package_path: projects/hipblaslt/utilities/geko
          test_path: tests
