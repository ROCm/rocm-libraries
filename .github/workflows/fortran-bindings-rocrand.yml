# Fortran binding of rocrand: see fortran-bindings.yml.
name: Fortran bindings (rocrand)

on:
  pull_request:
    paths:
      - 'projects/rocrand/library/include/**.h'
      - 'bindings/fortran/rocrand/metadata/**'
      - '.github/workflows/fortran-bindings-rocrand.yml'
      - '.github/workflows/fortran-bindings.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    uses: ./.github/workflows/fortran-bindings.yml
    with:
      project: rocrand
      libs: rocrand
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
