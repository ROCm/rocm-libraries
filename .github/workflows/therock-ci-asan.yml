name: TheRock CI ASAN

# Opt-in hipblaslt ASAN smoke build. Runs only when a PR carries the
# `ci:asan` label so we do not burn the limited gfx90a runner pool on
# every PR. Scope is intentionally narrow:
#   - gfx90a only (cheap arch, fast TensileCreateLibrary)
#   - hipblaslt only (skip rocblas/rocroller/hipblas — those have their
#     own ASAN issues we do not own)
#   - full hipblaslt-test (gfx90a is fast enough)
#   - non-blocking (continue-on-error). Promote to required after the
#     suppression list stabilizes.
#
# Configuration mirrors TheRock's `linux-release-asan` CMakePreset
# (CMakePresets.json @ pin 4e469b56) as closely as is meaningful for a
# rocm-libraries hipblaslt-only smoke run. THEROCK_SANITIZER=ASAN is the
# single source of truth for sanitizer flags; we no longer pass
# HIPBLASLT_ENABLE_ASAN=ON because that combination duplicated
# -fsanitize=address per-target on top of TheRock's global injection.
# The per-target helper (cmake/hipblaslt_target_configure_sanitizers.cmake)
# is now a no-op when THEROCK_SANITIZER is set, so callers can keep
# their existing gates without producing double flags.
#
# Arch caveat (gfx90a host-only ASAN):
# TheRock's cmake/therock_sanitizers.cmake REGEX only appends `:xnack+`
# to gfx942 and gfx950 for device-side ASAN. gfx90a is not matched, so
# this build runs HOST-side ASAN only — perfect for catching hipblaslt
# host-runtime / Tensile-init UB and leaks fast, but it does NOT
# substitute for device-side ASAN coverage on MI300/MI350. Use TheRock's
# own multi_arch_ci_asan workflow for that.
#
# The build/test infrastructure is reused verbatim from therock-ci-linux:
# the only delta is the cmake_options block and the artifact_group suffix
# which carries the "asan" marker through to ARTIFACT_GROUP at test time,
# tripping is_asan() in test/therock/test_hipblaslt.py.

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The labeled-event fires for every label add/remove; gate on the actual
  # label set so we run only when ci:asan is present. workflow_dispatch
  # bypasses the gate (manual run is always opt-in).
  check_label:
    name: "Check ci:asan label"
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:asan') }}
        run: |
          if [[ "$IS_DISPATCH" == "true" || "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: "Setup"
    needs: check_label
    if: needs.check_label.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      docker_image: ${{ steps.ci-env.outputs.docker-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

  asan:
    name: "Linux ASAN (hipblaslt | gfx90a)"
    needs: setup
    permissions:
      contents: read
      id-token: write
    # NOTE on non-blocking behavior:
    # `continue-on-error` is NOT valid on a reusable-workflow-call job
    # (it is a `runs-on` job key). Setting it here makes the workflow
    # YAML invalid — GitHub then demands `runs-on` and flags `uses`,
    # `secrets`, `with` as foreign. The non-blocking signal is delivered
    # instead by the `summary` job below, which inspects this job's
    # `result` and never re-raises a failure of its own. Promote to
    # required by flipping the summary job to fail on
    # `needs.asan.result != 'success'`.
    uses: ./.github/workflows/therock-ci-linux.yml
    secrets: inherit
    with:
      therock_ref: ${{ needs.setup.outputs.therock_ref }}
      docker_image: ${{ needs.setup.outputs.docker_image }}
      # Mirrors TheRock's linux-release-asan CMakePreset (CMakePresets.json
      # @ pin 4e469b56). The cacheVariables we replicate here are the ones
      # that matter for an hipblaslt-only smoke run:
      #
      #   THEROCK_ENABLE_BLAS=ON                  — pulls hipblaslt into the build
      #   THEROCK_SANITIZER=ASAN                  — single source of truth for
      #                                             sanitizer flags; injects
      #                                             -fsanitize=address,
      #                                             -shared-libsan, -fuse-ld=lld
      #                                             globally via TheRock's
      #                                             cmake/therock_sanitizers.cmake
      #   CMAKE_BUILD_TYPE=RelWithDebInfo         — preset default; needed so
      #                                             ASAN stack frames carry
      #                                             file:line info
      #   THEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF  — preset default; avoids
      #                                             extra link-time packaging
      #                                             work that ASAN does not need
      #
      # Preset entries deliberately NOT replicated:
      #   CMAKE_*_FLAGS_RELWITHDEBINFO="-O2 -g1" / CMAKE_*_FLAGS="-g1"
      #     TheRock uses these to bound debug-info size across many
      #     subprojects (full -g produces multi-GB binaries under ASAN).
      #     Quoting nested space-separated values through GitHub
      #     workflow_call -> env -> shell -> python -> cmake is brittle
      #     (every layer wants to re-split on whitespace). For a single-
      #     subproject (hipblaslt) build the default `-O2 -g -DNDEBUG`
      #     from RelWithDebInfo is small enough to ship to S3 and we
      #     avoid the quoting trap. Add the override back via a properly
      #     escaped env var (CFLAGS / CXXFLAGS) at the build step if size
      #     becomes a problem.
      #   amd-llvm_SANITIZER=OFF, hipcc_SANITIZER=OFF, etc.
      #     These prevent TheRock from sanitizing its compiler/tools
      #     stack. We do not build those subprojects (TheRock superbuild
      #     pulls them from cached artifacts under THEROCK_ENABLE_BLAS),
      #     so the overrides have no targets to apply to.
      #
      # We do NOT pass HIPBLASLT_ENABLE_ASAN=ON. Keeping that flag while
      # THEROCK_SANITIZER=ASAN is set duplicated -fsanitize=address per-
      # target on top of TheRock's global injection. The per-target helper
      # at projects/hipblaslt/cmake/hipblaslt_target_configure_sanitizers.cmake
      # is now a no-op when THEROCK_SANITIZER is set, so this is the
      # supported configuration.
      cmake_options: "-DTHEROCK_ENABLE_BLAS=ON -DTHEROCK_SANITIZER=ASAN -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF"
      projects_to_test: "hipblaslt"
      test_type: "full"
      amdgpu_families: "gfx90a"
      # Suffix routes artifacts into a separate S3 path so the ASAN build
      # does not collide with non-ASAN runs, and trips is_asan() at test
      # time via ARTIFACT_GROUP detection.
      artifact_group: "gfx90a-asan"
      test_runs_on: "linux-gfx90a-gpu-rocm"
      # Default azure-linux-scale-rocm pool. TheRock routes its full
      # sanitizer builds (~30 subprojects) to heavy-ramdisk because the
      # final link aggregates multi-GB working sets and the SSD-backed
      # default OOMs. We build ONE subproject (hipblaslt), so the default
      # pool is sized fine and the smaller heavy-ramdisk pool's longer
      # queue is wasted wait. Reassess if libhipblaslt.so link OOMs.
      build_runs_on: "azure-linux-scale-rocm"

  summary:
    name: "TheRock CI ASAN Summary"
    if: always()
    needs:
      - check_label
      - asan
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          GATE: ${{ needs.check_label.outputs.run }}
          ASAN: ${{ needs.asan.result }}
        run: |
          if [[ "$GATE" != "true" ]]; then
            echo "Skipped (ci:asan label not set)."
            exit 0
          fi
          echo "ASAN job result: ${ASAN}"
          # Intentionally do not fail. The asan reusable-workflow-call job
          # cannot carry `continue-on-error` itself (invalid YAML key for
          # that job type), so non-blocking semantics are delivered here:
          # this summary job always exits 0 regardless of the asan result.
          # Promote to required by changing this to:
          #   [[ "$ASAN" == "success" ]] || exit 1
