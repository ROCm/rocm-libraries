name: rocJITsu gfx950 on RDNA4 comparison
run-name: gfx950 ${{ inputs.ctest_label }} on RDNA4 DBT (wait on/off) vs native gfx950

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: Same pinned gfx950 nightly for translated and native tests
        type: string
        default: "10.2.0a20260928"
      ctest_label:
        description: Installed CTest label regex
        type: string
        default: "^quick$"
      component_filter:
        description: Empty discovers all components; otherwise comma-separated exact paths
        type: string
        default: ""
      parallel:
        description: Maximum test processes per component on both GPU types
        type: string
        default: "5"

permissions:
  contents: read
  actions: read

concurrency:
  group: rocjitsu-gfx950-rdna4-${{ github.run_id }}
  cancel-in-progress: false

env:
  ROCM_VERSION: ${{ inputs.rocm_version }}
  TEST_LABEL: ${{ inputs.ctest_label }}
  TEST_PARALLEL: ${{ inputs.parallel }}
  ROCM_SYSTEMS_REF: 1c144a5d55ea53118ad48047dfac2b9256e3bb26

jobs:
  discover:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    outputs:
      components: ${{ steps.discover.outputs.components }}
    steps:
      - name: Install discovery tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - name: Discover every matching gfx950 component
        id: discover
        env:
          COMPONENT_FILTER: ${{ inputs.component_filter }}
        run: |
          set -euo pipefail
          mkdir -p test-root discovery
          base=https://nightly.repo.amd.com/rocm/core/tarball
          # Extract only metadata; the complete test package is large.
          curl -fL --retry 3 "$base/therock-dist-linux-gfx950-dcgpu-tests-${ROCM_VERSION}.tar.gz" \
            | tar -xzf - -C test-root --wildcards --no-anchored 'CTestTestfile.cmake'
          args=(--direct --rocm-root test-root --out-dir discovery --label-regex "$TEST_LABEL" --list-components)
          if [ -n "$COMPONENT_FILTER" ]; then args+=(--component-filter "$COMPONENT_FILTER"); fi
          components="$(python3 .github/scripts/ffm_quick_rocjitsu.py "${args[@]}")"
          python3 -c 'import json,sys; x=json.loads(sys.argv[1]); assert x, "No suites selected"; print(f"Discovered {len(x)} components")' "$components"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$components" > discovery/components.json
      - uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: pilot-discovery
          path: discovery/

  build:
    name: Build rocJITsu with PRs 13749, 13750, 13751
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 90
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl git ninja-build pkg-config python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: ${{ env.ROCM_SYSTEMS_REF }}
          path: rocm-systems
          sparse-checkout: emulation/rocjitsu
      - name: Build launcher, interposer, and HSA translation hook once
        run: |
          set -euo pipefail
          cmake -S rocm-systems/emulation/rocjitsu -B rj-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DRJ_LOG_GROUPS=OFF \
            -DROCJITSU_HOST_CPU_BASELINE=x86-64
          cmake --build rj-build --target rocjitsu_bin rocjitsu_shared rocjitsu_hooks -j"$(nproc)"
          test -x rj-build/tools/rocjitsu/rocjitsu
          find rj-build -name 'librocjitsu_hooks.so' -print | grep .
          mkdir -p build-artifact
          ldd rj-build/tools/rocjitsu/rocjitsu > build-artifact/ldd.txt
          find rj-build \( -type f -o -type l \) \( -name '*.so' -o -name '*.so.*' -o -name rocjitsu \) -print0 \
            | tar --null -T - -czf build-artifact/rocjitsu-runtime.tar.gz
          cp rocm-systems/emulation/rocjitsu/configs/guest_gfx950_on_gfx1201.json build-artifact/
          printf '%s\n' "$ROCM_SYSTEMS_REF" > build-artifact/source-sha.txt
      - uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: rocjitsu-build
          path: build-artifact/

  rdna4-suites:
    name: RDNA4 DBT wait=${{ matrix.wait }} / ${{ matrix.test.component }}
    needs: [discover, build]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        wait: ["on", "off"]
        test: ${{ fromJSON(needs.discover.outputs.components) }}
    runs-on: linux-gfx120X-gpu-rocm
    timeout-minutes: 360
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host --user 0:0
        --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    defaults:
      run:
        shell: bash
    env:
      COMPONENT: ${{ matrix.test.component }}
      WAIT_CHECKING: ${{ matrix.wait }}
      PILOT_MODE: rdna4-dbt
    steps:
      - name: Install runtime tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libgfortran5 python3 python3-yaml
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rocjitsu-build
          path: build-artifact
      - name: Unpack rocJITsu runtime
        run: tar -xzf build-artifact/rocjitsu-runtime.tar.gz
      - name: Install pinned gfx950 runtime and component tests
        run: bash .github/scripts/gfx950_rdna4_pilot.sh install
      - name: Verify RDNA4 hardware and translated guest identity
        run: bash .github/scripts/gfx950_rdna4_pilot.sh preflight
      - name: Run selected quick entries through DBT
        run: bash .github/scripts/gfx950_rdna4_pilot.sh run
      - name: Upload configuration, identity, timing, and test logs
        if: always()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: pilot-rdna4-wait-${{ matrix.wait }}-${{ matrix.test.id }}
          path: parity/

  native-suites:
    name: Native gfx950 / ${{ matrix.test.component }}
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.components) }}
    runs-on: linux-gfx950-1gpu-ccs-ossci-rocm
    timeout-minutes: 360
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host --user 0:0
        --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    defaults:
      run:
        shell: bash
    env:
      COMPONENT: ${{ matrix.test.component }}
      PILOT_MODE: native-gfx950
    steps:
      - name: Install runtime tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libgfortran5 python3 python3-yaml
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - name: Install identical pinned gfx950 runtime and component tests
        run: bash .github/scripts/gfx950_rdna4_pilot.sh install
      - name: Verify native gfx950 hardware
        run: bash .github/scripts/gfx950_rdna4_pilot.sh preflight
      - name: Run matching quick entries directly on gfx950
        run: bash .github/scripts/gfx950_rdna4_pilot.sh run
      - name: Upload native hardware baseline
        if: always()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: pilot-native-gfx950-${{ matrix.test.id }}
          path: parity/

  comparison:
    name: Compare translated and native component measurements
    if: always()
    needs: [rdna4-suites, native-suites]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pilot-*
          path: measurements
      - name: Generate measured runtime comparison
        run: python3 .github/scripts/compare_gfx950_rdna4.py measurements comparison
      - uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: gfx950-rdna4-comparison
          path: comparison/
