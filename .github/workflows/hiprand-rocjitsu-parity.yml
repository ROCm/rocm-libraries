name: hipRAND rocJITsu Parity PoC

# Standalone hipRAND parity check. It does not call TheRock reusable workflows
# and it does not change therock-multi-arch-ci.yml.
#
# The pull-request label ci:rocjitsu decides whether the parity job runs.
# runs-on comes from TheRock select_build_runner(), which reads build_runners
# (therock-ci-config when CI_CONFIG_PATH is set, otherwise the in-tree
# BUILD_RUNNER_LABELS). That label is a CPU scale set, not a GPU test runner.
#
# The executed test is the single XORWOW gtest case that passed under rocJITsu
# in the feasibility spike. The full 364-case hipRAND suite is too slow for
# this job. Widen it with workflow_dispatch input gtest_filter after this
# workflow is on the default branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "projects/hiprand/**"
      - ".github/workflows/hiprand-rocjitsu-parity.yml"
      - ".github/scripts/ci_parity_runner.py"
      - ".github/scripts/parity_diff.py"
      - ".github/scripts/select_cpu_build_runner.py"
      - "baseline/hiprand-gfx942-hw.json"
  workflow_dispatch:
    inputs:
      gtest_filter:
        description: "hipRAND gtest filter. Default is the proven XORWOW case."
        type: string
        default: "hiprand_32/hiprand_api_32.hiprand_generate_test/0"
      rocm_version:
        description: "Pinned gfx94X-dcgpu nightly used for runtime and tests."
        type: string
        default: "10.2.0a20260928"

permissions:
  contents: read

concurrency:
  # Do not cancel an in-progress parity run. Label bots (for example
  # therock-pr-bot adding "Not ready to Review") emit another pull_request
  # labeled event, and cancel-in-progress was killing the CPU job at startup.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check ci:rocjitsu label
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.label.outputs.enabled }}
      build_runs_on: ${{ steps.runner.outputs.build_runs_on || steps.skipped.outputs.build_runs_on }}
    steps:
      - name: Label gate
        id: label
        run: |
          echo "enabled=${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:rocjitsu') }}" >> "$GITHUB_OUTPUT"

      - name: Checkout rocm-libraries scripts
        if: steps.label.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Load CI environment
        if: steps.label.outputs.enabled == 'true'
        id: ci-env
        uses: ./.github/actions/ci-env

      - name: Checkout TheRock
        if: steps.label.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: ${{ steps.ci-env.outputs.therock-ref }}
          path: TheRock
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Checkout CI config
        if: steps.label.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Select CPU build runner
        id: runner
        if: steps.label.outputs.enabled == 'true'
        env:
          CI_CONFIG_PATH: ci-config
        run: python3 .github/scripts/select_cpu_build_runner.py

      - name: No runner when the label is absent
        id: skipped
        if: steps.label.outputs.enabled != 'true'
        run: echo "build_runs_on=skipped" >> "$GITHUB_OUTPUT"

  hiprand-parity:
    name: hipRAND parity on CPU build runner
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ${{ needs.gate.outputs.build_runs_on }}
    timeout-minutes: 180
    # No nested container. The ubuntu:24.04 job container ignored
    # --cap-add=SYS_PTRACE (CapEff had no sys_ptrace bit), and rocminfo then
    # ran with no simulated GPU. This job uses the build-runner image itself.
    defaults:
      run:
        shell: bash
    env:
      ROCM_VERSION: ${{ github.event.inputs.rocm_version || '10.2.0a20260928' }}
      GTEST_FILTER: ${{ github.event.inputs.gtest_filter || 'hiprand_32/hiprand_api_32.hiprand_generate_test/0' }}
      BUILD_RUNS_ON: ${{ needs.gate.outputs.build_runs_on }}
      ROCM_SYSTEMS_REF: 1f44cb5afa5e6dec03d57609e5dfba43d4f31c3c
    steps:
      - name: Require docker with SYS_PTRACE
        run: |
          set -euo pipefail
          echo "host CapEff $(awk '/CapEff/ {print $2}' /proc/self/status)"
          id
          sudo -n true
          docker info >/dev/null
          cap=$(docker run --rm --cap-add=SYS_PTRACE --security-opt seccomp=unconfined ubuntu:24.04 awk '/CapEff/ {print $2}' /proc/self/status)
          echo "container CapEff ${cap}"
          python3 - "$cap" << 'PY'
          import sys
          cap = int(sys.argv[1], 16)
          if cap & (1 << 19) == 0:
              sys.exit("docker run did not grant CAP_SYS_PTRACE")
          PY

      - name: Install build tools
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git ninja-build pkg-config python3

      - name: Checkout rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github
            baseline
          sparse-checkout-cone-mode: true

      - name: Checkout rocJITsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: ${{ env.ROCM_SYSTEMS_REF }}
          path: rocm-systems
          sparse-checkout: emulation/rocjitsu
          sparse-checkout-cone-mode: true

      - name: Build rocJITsu
        run: |
          set -euo pipefail
          cmake -S rocm-systems/emulation/rocjitsu -B rj-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DRJ_LOG_GROUPS=OFF
          cmake --build rj-build --target rocjitsu_bin rocjitsu_shared -j"$(nproc)"
          test -x rj-build/tools/rocjitsu/rocjitsu

      - name: Install pinned gfx94X runtime and tests
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:-/tmp}/rocm/${ROCM_VERSION}"
          mkdir -p "$root" cache
          base="https://nightly.repo.amd.com/rocm/core/tarball"
          curl -fL --retry 3 -o "cache/rocm-${ROCM_VERSION}.tar.gz" \
            "${base}/therock-dist-linux-gfx94X-dcgpu-${ROCM_VERSION}.tar.gz"
          curl -fL --retry 3 -o "cache/tests-${ROCM_VERSION}.tar.gz" \
            "${base}/therock-dist-linux-gfx94X-dcgpu-tests-${ROCM_VERSION}.tar.gz"
          tar -xzf "cache/rocm-${ROCM_VERSION}.tar.gz" -C "$root"
          tar -xzf "cache/tests-${ROCM_VERSION}.tar.gz" -C "$root"
          test -x "$root/bin/rocminfo"
          test -x "$root/bin/test_hiprand_api"
          echo "ROCM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Confirm the simulated agent is gfx942
        run: |
          set -euo pipefail
          mkdir -p parity
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${ROCM_ROOT}:/rocm" \
            -w /work \
            -e ROCM_PATH=/rocm \
            -e LD_LIBRARY_PATH=/rocm/lib \
            ubuntu:24.04 \
            /work/rj-build/tools/rocjitsu/rocjitsu --daemon \
            --config /work/rocm-systems/emulation/rocjitsu/configs/gfx942_cdna3_kmd.json \
            -- /rocm/bin/rocminfo > parity/rocminfo.txt 2>&1
          grep -q gfx942 parity/rocminfo.txt

      - name: Run the hipRAND filter under rocJITsu
        run: |
          set -euo pipefail
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${ROCM_ROOT}:/rocm" \
            -w /work \
            -e ROCM_PATH=/rocm \
            -e LD_LIBRARY_PATH=/rocm/lib \
            ubuntu:24.04 \
            bash -lc 'apt-get update && apt-get install -y --no-install-recommends python3 && python3 /work/.github/scripts/ci_parity_runner.py --daemon --rocjitsu /work/rj-build/tools/rocjitsu/rocjitsu --config /work/rocm-systems/emulation/rocjitsu/configs/gfx942_cdna3_kmd.json --rocm-root /rocm --rocm-version "$0" --runner-label "$1" --binary /rocm/bin/test_hiprand_api --gtest-filter "$2" --out /work/parity/emu.json' \
            "$ROCM_VERSION" "$BUILD_RUNS_ON" "$GTEST_FILTER"

      - name: Diff against the hardware baseline
        if: always()
        run: |
          set -euo pipefail
          test -f parity/emu.json
          python3 .github/scripts/parity_diff.py \
            --hw baseline/hiprand-gfx942-hw.json \
            --emu parity/emu.json \
            --report parity/report.md \
            --summary-json parity/summary.json
          cat parity/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: hiprand-rocjitsu-parity
          path: parity/
