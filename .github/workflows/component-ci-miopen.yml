#
# TheRock CI builds and tests MIOpen in a single configuration (HIP backend,
# optional CK, against TheRock's full ROCm stack). This workflow covers the
# additional build configurations that MIOpen must support but TheRock CI does
# not exercise: the HIPNOGPU backend (used for offline kernel tuning without
# GPU hardware), the Tuna Fin subproject (offline tuning infrastructure), a
# no-CK UBSan debug build, and gtest binary naming convention validation.

name: "Component CI: MIOpen"

on:
  workflow_call:

permissions:
  contents: read

env:
  LLVM_PATH: /opt/rocm/llvm

jobs:
  miopen-build:
    name: ${{ matrix.name }}
    container:
      image: rocm/miopen-dev:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MIOpen Hip Debug NOCK Build-Only
            job_id: no-ck-build
            cmake_extra_flags: >-
              -DCMAKE_BUILD_TYPE=debug
              -DCMAKE_CXX_FLAGS_DEBUG='-g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined -Wno-option-ignored '
              -DBUILD_DEV=OFF
              -DMIOPEN_USE_MLIR=OFF
              -DMIOPEN_GPU_SYNC=OFF
              -DMIOPEN_USE_COMPOSABLEKERNEL=OFF
              -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install
              -DCMAKE_PREFIX_PATH=/opt/rocm
              -DGPU_TARGETS="gfx942"
            build_target: --target install

          # Builds the HIP package and runs miopen_gtest_check via rocjitsu KMD interposer
          # to validate the gtest binary and test naming conventions without a physical GPU.
          - name: MIOpen Build Hip Package
            job_id: hip-package-build
            cmake_extra_flags: >-
              -DCMAKE_BUILD_TYPE=release
              -DBUILD_DEV=OFF
              -DMIOPEN_TEST_DISCRETE=OFF
              -DMIOPEN_USE_MLIR=ON
              -DMIOPEN_GPU_SYNC=OFF
              -DCMAKE_PREFIX_PATH=/opt/rocm
              -DGPU_TARGETS="gfx942"
            build_target: --target miopen_gtest --target package

          - name: MIOpen HipNoGPU Debug Build-Only
            job_id: no-gpu-debug-build
            cmake_extra_flags: >-
              -DCMAKE_BUILD_TYPE=debug
              -DCMAKE_CXX_FLAGS_DEBUG='-g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined -Wno-option-ignored '
              -DBUILD_DEV=ON
              -DMIOPEN_USE_MLIR=OFF
              -DMIOPEN_GPU_SYNC=OFF
              -DMIOPEN_BACKEND=HIPNOGPU
              -DMIOPEN_INSTALL_CXX_HEADERS=ON
              -DCMAKE_PREFIX_PATH=/opt/rocm
            build_target: ""

          - name: MIOpen Tuna Fin Build-Only
            job_id: tuna-fin-build
            cmake_extra_flags: >-
              -DCMAKE_BUILD_TYPE=release
              -DBUILD_DEV=OFF
              -DMIOPEN_INSTALL_CXX_HEADERS=ON
              -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install
              -DMIOPEN_USE_MLIR=ON
              -DMIOPEN_GPU_SYNC=OFF
              -DMIOPEN_BACKEND=HIPNOGPU
              -DCMAKE_PREFIX_PATH=/opt/rocm
              -DGPU_TARGETS="gfx942"
            build_target: --target install --target all

    runs-on: azure-linux-scale-rocm
    steps:
      - name: Runner health status
        run: |
          echo "=== OS ==="
          head -2 /etc/os-release
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "=== Memory ==="
          free -h | grep Mem
          echo "=== Disk ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            projects/miopen
            shared/ctest

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Checkout rocjitsu
        if: matrix.job_id == 'hip-package-build'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Build rocjitsu KMD
        if: matrix.job_id == 'hip-package-build'
        run: |
          apt-get update && apt-get install -y libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j$(nproc)

      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
          -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
          ${{ matrix.cmake_extra_flags }}

      - name: Build
        run: cmake --build build ${{ matrix.build_target }} -j$(nproc)

      - name: Configure Tuna Fin
        if: matrix.job_id == 'tuna-fin-build'
        run: |
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/miopen/fin -B build-fin \
            -DCMAKE_PREFIX_PATH=$(pwd)/projects/miopen/install \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install \
            -DCMAKE_BUILD_TYPE=release

      - name: Build Tuna Fin
        if: matrix.job_id == 'tuna-fin-build'
        run: cmake --build build-fin --target install -j$(nproc)

      - name: Run miopen_gtest_check (rocjitsu)
        if: matrix.job_id == 'hip-package-build'
        run: |
          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          LD_PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so \
            ./build/bin/miopen_gtest --gtest_list_tests > test_list
          python3 projects/miopen/test/gtest/check_names.py --list test_list

  # Runs the MIOpen dbsync test (StaticFDBSync) on GPU-less runners via the rocjitsu
  # KMD interposer, spoofing the target arch with MIOPEN_DEVICE_ARCH. dbsync is a
  # CPU-only find/perf-db consistency check (SKIP_KDB_TESTING=1, no kernel launch), so
  # the emulated device only needs to exist; MIOPEN_DEVICE_ARCH selects which arch's
  # solvers + DBs are validated against the CK built into this job.
  #
  # Scoped to gfx90a on purpose. gfx90a is the only arch with no TheRock test runner, so
  # this GPU-less job is its ONLY dbsync coverage. gfx942 and gfx950 are deliberately not
  # run here: they are already dbsync-gated by TheRock's own CI, which builds CK from the
  # matching source snapshot. This job instead links the CK preinstalled in
  # rocm/miopen-dev:latest (find_package), whose CK can lag a freshly-refreshed SystemDB
  # and then reject perf configs tuned against newer CK as "invalid" (false positives).
  # Observed: the 2026-06-12 image's CK rejected 3 CK grouped-wrw perf configs from the
  # 2026-06-24 gfx942 SystemDB refresh (#8174); gfx950's DB (#8081/#9111) is newer still.
  # gfx90a's DB matches the container CK, so it is a reliable gate. (Adding gfx942/gfx950
  # here would need CK built from the matching source, which TheRock already does.)
  # Note: num_cu==0 RDNA params (gfx1100/1102/1201) also can't run under a single rocjitsu
  # config; gfx908 is excluded (currently broken).
  miopen-dbsync-rocjitsu:
    name: "MIOpen dbsync rocjitsu (${{ matrix.arch }})"
    container:
      image: rocm/miopen-dev:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [gfx90a]
    runs-on: azure-linux-scale-rocm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            projects/miopen
            shared/ctest

      - name: Pull DVC files for rocm-libraries
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Build rocjitsu KMD
        run: |
          apt-get update && apt-get install -y libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j$(nproc)

      - name: Configure and build (${{ matrix.arch }})
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/miopen -B build \
            -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
            -DCMAKE_BUILD_TYPE=release \
            -DBUILD_DEV=OFF \
            -DMIOPEN_TEST_DISCRETE=OFF \
            -DMIOPEN_USE_MLIR=ON \
            -DMIOPEN_GPU_SYNC=OFF \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DGPU_TARGETS="${{ matrix.arch }}" \
            -DMIOPEN_INSTALL_GPU_DATABASES="${{ matrix.arch }}"
          # miopen-generate-kernels (ALL) unpacks this arch's find/perf DBs into
          # build/share/miopen/db; miopen_gtest is the test binary (db_sync.cpp is
          # compiled in regardless of MIOPEN_TEST_DBSYNC).
          cmake --build build --target miopen_gtest --target miopen-generate-kernels -j$(nproc)

      - name: Run StaticFDBSync (rocjitsu, ${{ matrix.arch }})
        run: |
          export RJ_CONFIG=$(pwd)/rocm-systems/emulation/rocjitsu/configs/amdgpu_cdna3_kmd.json
          export MIOPEN_DEVICE_ARCH=${{ matrix.arch }}
          LD_PRELOAD=$(pwd)/rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so \
            ./build/bin/miopen_gtest --gtest_filter='*StaticFDBSync*' --gtest_color=no
