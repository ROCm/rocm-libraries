name: Interfaces GPU differential

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "interfaces/**"
      - "CMakeLists.txt"
      - ".github/workflows/interfaces-gpu-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  rocblas-differential:
    name: rocBLAS loader/provider differential (gfx90a)
    runs-on: linux-gfx90a-gpu-rocm
    timeout-minutes: 45
    container:
      image: rocm/dev-ubuntu-22.04@sha256:ee470651c4fd10eff861e9a3d5cbb64c26827b4d22f38aec6f74719596cfb76a
      options: >-
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    steps:
      - name: Install checkout and build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ninja-build nlohmann-json3-dev python3-pip
          python3 -m pip install --no-cache-dir "cmake==3.31.6"

      - name: Check out rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            interfaces
            projects/hipblas/library/include
            projects/hipblas-common/library/include
            projects/hipblaslt/library/include
            projects/hiprand/library/include
            projects/hipsolver/library/include
            projects/rocblas/library/include
            projects/rocrand/library/include
            projects/rocrand/library/src
            projects/rocsolver/library/include

      - name: Verify GPU visibility
        run: |
          test -e /dev/kfd
          /opt/rocm/bin/rocminfo | grep -m1 'Name:'

      - name: Configure interfaces GPU differential
        run: |
          cmake -S interfaces -B build/interfaces-gpu -GNinja \
            -DCMAKE_C_COMPILER=/opt/rocm/lib/llvm/bin/amdclang \
            -DCMAKE_CXX_COMPILER=/opt/rocm/lib/llvm/bin/amdclang++ \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DROCM_INTERFACES_BUILD_TOOLS=OFF \
            -DROCM_INTERFACES_CHECK_API_DRIFT=OFF \
            -DROCM_INTERFACES_ENABLE_GPU_TESTS=ON

      - name: Build differential target
        run: cmake --build build/interfaces-gpu --target rocblas_gpu_differential_test -j 4

      - name: Run on the assigned GPU
        run: stdbuf -oL -eL build/interfaces-gpu/tests/rocblas_gpu_differential_test
