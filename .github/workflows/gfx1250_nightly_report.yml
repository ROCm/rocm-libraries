#
# Emails a test report after every gfx1250-strict nightly
# (gfx1250_hipblaslt_tensilelite_test.yml), however the run ended: failed, timed out,
# or never picked up by a runner.
# - A separate workflow, so pull requests don't get a skipped report check.
# - On a GitHub-hosted runner, so the webhook secret never reaches the gfx1250 runner.
# - Reads only the nightly's uploaded results and the GitHub API; it never checks out
#   or runs the tested code.
# The Power Automate flow behind GFX1250_BLAS_NIGHTLY_WEBHOOK_URL sends the email.

name: gfx1250 nightly report

on:
  workflow_run:
    workflows: ["gfx1250 HW hipBLASLt + TensileLite Tests"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  actions: read  # the reported run's jobs and results, and the previous nightly's

jobs:
  report:
    name: Nightly report
    # Nightly runs only: manual runs of the test workflow don't email.
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts

      - name: Read the reported run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '
            "REPORT_RUN_ID=\(.id)", "REPORT_SHA=\(.head_sha)",
            "REPORT_REF_NAME=\(.head_branch)", "REPORT_EVENT_NAME=\(.event)"' >> "$GITHUB_ENV"
          # The test job's runner and step results; empty if it never started.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "gfx1250-strict hipBLASLt + TensileLite")' > job.json
          [ -s job.json ] || echo '{}' > job.json
          jq -r '
            {"Install the ROCm SDK (gfx1250-strict capable)": "SDK",
             "Check the runtime reports gfx1250-strict": "Strict check",
             "Build hipBLASLt from source": "Build",
             "Run hipBLASLt tests": "hipBLASLt tests",
             "Run TensileLite common tests (fresh client)": "TensileLite tests"} as $m
            | "TEST_RUNNER_NAME=\(.runner_name // "")",
              "STEPS=" + ((["Test job=\(.conclusion // "failure")"]
                + [(.steps // [])[] | select($m[.name]) | "\($m[.name])=\(.conclusion // .status)"])
                | join(", "))' job.json >> "$GITHUB_ENV"

      - name: Download the run's test results
        # Absent when the test job never got far enough to upload them; the report says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gfx1250-strict-test-results
          path: results
          run-id: ${{ env.REPORT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Send the report
        env:
          WEBHOOK_URL: ${{ secrets.GFX1250_BLAS_NIGHTLY_WEBHOOK_URL }}
          # Optional System row in the report; a secret so its value stays out of the logs.
          SYSTEM_LABEL: ${{ secrets.GFX1250_BLAS_SYSTEM_LABEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "::notice::GFX1250_BLAS_NIGHTLY_WEBHOOK_URL is not set; no report sent"; exit 0; }
          export ROCM_SDK_VERSION="$(cat results/test_results/rocm_sdk_version.txt 2>/dev/null || true)"
          python3 .github/scripts/gfx1250_nightly_report.py --results results --steps "$STEPS" --webhook-url "$WEBHOOK_URL"
