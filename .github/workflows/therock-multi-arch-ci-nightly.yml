# Multi-Arch Nightly CI for rocm-libraries
#
# This workflow runs TheRock's multi-arch CI pipeline on a nightly schedule.
# It builds and tests for gfx94X, gfx950 (Linux) and gfx1151 (Windows), and
# additionally build-only validates gfx125X (CDNA5/gfx1250) on Linux since no
# test hardware exists for that family yet (see amdgpu_family_matrix.py in
# TheRock, family key "gfx125x": test-runs-on is empty everywhere).
#
# For manual triggering with custom GPU families, use therock-multi-arch-ci.yml.

name: TheRock Multi-Arch Nightly CI

# TheRock ref: pinned to ROCm/TheRock commit 5c677058a44d6cc4a06587857cf8fca3c9abc925.

on:
  schedule:
    - cron: "0 7 * * *" # Runs nightly at 7 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
    with:
      build_variant: "release"
      # Limit GPU families for nightly CI: gfx94X, gfx950 (Linux) and gfx1151 (Windows).
      # gfx125X (CDNA5/gfx1250) is included build-only on Linux: no test hardware
      # exists for it yet, but this still catches build breaks in math-libs/stinkytofu
      # gfx1250 codegen ahead of hardware becoming available.
      linux_amdgpu_families: 'gfx94X,gfx950,gfx125X'
      windows_amdgpu_families: 'gfx1151'
      linux_test_labels: ''
      windows_test_labels: ''
      prebuilt_stages: ''
      baseline_run_id: ''
      repository: ROCm/TheRock
      ref: 5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
      external_repo: '{"repository":"${{ github.repository }}","ref":"${{ github.sha }}"}'

  log_therock_ref:
    name: Locked TheRock ref
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - name: Surface locked TheRock ref
        run: |
          RESOLVED_REF="${{ needs.setup.outputs.ref }}"
          COMMIT_URL="https://github.com/ROCm/TheRock/commit/${RESOLVED_REF}"
          echo "Locked TheRock ref for this run: ${RESOLVED_REF} (${COMMIT_URL})"
          {
            echo "### Locked TheRock ref"
            echo ""
            echo "Every build/test job in this run is locked to ROCm/TheRock commit [\`${RESOLVED_REF}\`](${COMMIT_URL})."
          } >> "$GITHUB_STEP_SUMMARY"

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty string triggers full test run in downstream workflow
      changed_projects: ''
      repository: ROCm/TheRock
      ref: 5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
    permissions:
      contents: read
      id-token: write

  linux_code_coverage_build_and_test:
    name: Linux::CodeCoverage::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [linux_build_and_test]
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_coverage_linux.yml@users/jainprad/codecoverage-workflows-therock
    secrets: inherit
    with:
      baseline_run_id: ${{ github.run_id }}
      baseline_repository: "ROCm/rocm-libraries"
      baseline_release_type: "nightly"
      amdgpu_families: "gfx94X-dcgpu"
      projects_to_test: >-
        hipblas,hipdnn
      test_type: "standard"
      repository: ROCm/TheRock
      ref: users/jainprad/codecoverage-workflows-therock
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: [setup]
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_windows.yml@5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty string triggers full test run in downstream workflow
      changed_projects: ''
      repository: ROCm/TheRock
      ref: 5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
      - windows_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: 5c677058a44d6cc4a06587857cf8fca3c9abc925 # 2026-09-21
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
