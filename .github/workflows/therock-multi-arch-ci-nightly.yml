# Multi-Arch Nightly CI for rocm-libraries
#
# This workflow runs TheRock's multi-arch CI pipeline on a nightly schedule.
# It builds and tests for gfx94X, gfx950 (Linux) and gfx1151 (Windows), and
# additionally build-only validates gfx125X (CDNA5/gfx1250) on Linux since no
# test hardware exists for that family yet (see amdgpu_family_matrix.py in
# TheRock, family key "gfx125x": test-runs-on is empty everywhere).
#
# Testing is scoped to the subtrees listed in .github/repos-config.json rather
# than to all of ROCm. A schedule run has no diff to narrow against, so TheRock
# would otherwise test every component it builds, including system components
# (hip-tests, rocrtst, rocgdb, rocprofiler-*, amdsmi, rccl, ...) that this
# repository cannot affect.
#
# For manual triggering with custom GPU families, use therock-multi-arch-ci.yml.

name: TheRock Multi-Arch Nightly CI

# TheRock ref: pinned to ROCm/TheRock commit 47434387de730d51788b705e5600602dd6064997.

on:
  schedule:
    - cron: "0 7 * * *" # Runs nightly at 7 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure Test Scope
    runs-on: ubuntu-26.04
    outputs:
      test_projects: ${{ steps.scope.outputs.test_projects }}
    steps:
      - name: Checkout CI config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: pip install pydantic requests

      - name: Collect rocm-libraries subtrees
        id: scope
        run: python .github/scripts/therock_nightly_test_scope.py

  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@47434387de730d51788b705e5600602dd6064997 # 2026-10-16
    with:
      build_variant: "release"
      # Limit GPU families for nightly CI: gfx94X, gfx950 (Linux) and gfx1151 (Windows).
      # gfx125X (CDNA5/gfx1250) is included build-only on Linux: no test hardware
      # exists for it yet, but this still catches build breaks in math-libs/stinkytofu
      # gfx1250 codegen ahead of hardware becoming available.
      linux_amdgpu_families: 'gfx94X,gfx950,gfx125X'
      windows_amdgpu_families: 'gfx1151'
      pr_labels: ''
      prebuilt_stages: ''
      baseline_run_id: ''
      repository: ROCm/TheRock
      ref: 47434387de730d51788b705e5600602dd6064997 # 2026-10-16
      # event_name tells TheRock this is a schedule/workflow_dispatch run with no
      # meaningful diff, so it always runs CI. Without it, TheRock falls back to
      # `git diff HEAD^` against a depth-1 checkout, which fails.
      external_repo: >-
        {
          "repository": "${{ github.repository }}",
          "ref": "${{ github.sha }}",
          "event_name": "${{ github.event_name }}",
          "family_overrides": {
            "gfx125x": {
              "linux": {
                "test-runs-on": "",
                "test_labels_for_family": ["test:hip-tests", "test:rocrtst"],
                "fetch-gfx-targets": ["gfx1250"]
              }
            }
          }
        }

  log_therock_ref:
    name: Locked TheRock ref
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - name: Surface locked TheRock ref
        run: |
          RESOLVED_REF="${{ needs.setup.outputs.ref }}"
          COMMIT_URL="https://github.com/ROCm/TheRock/commit/${RESOLVED_REF}"
          echo "Locked TheRock ref for this run: ${RESOLVED_REF} (${COMMIT_URL})"
          {
            echo "### Locked TheRock ref"
            echo ""
            echo "Every build/test job in this run is locked to ROCm/TheRock commit [\`${RESOLVED_REF}\`](${COMMIT_URL})."
          } >> "$GITHUB_STEP_SUMMARY"

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [configure, setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@47434387de730d51788b705e5600602dd6064997 # 2026-10-16
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Scope testing to the subtrees this repository owns (plus the consumers
      # TheRock's dependency graph pulls in). An empty string would mean "test
      # everything", which on a schedule run spends GPU runner time on ROCm
      # system components (hip-tests, rocrtst, rocgdb, rocprofiler-*, amdsmi,
      # ...) that no rocm-libraries change can affect.
      changed_projects: ${{ needs.configure.outputs.test_projects }}
      repository: ROCm/TheRock
      ref: 47434387de730d51788b705e5600602dd6064997 # 2026-10-16
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: [configure, setup]
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_windows.yml@47434387de730d51788b705e5600602dd6064997 # 2026-10-16
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # See the Linux job above: scope testing to rocm-libraries-owned subtrees.
      changed_projects: ${{ needs.configure.outputs.test_projects }}
      repository: ROCm/TheRock
      ref: 47434387de730d51788b705e5600602dd6064997 # 2026-10-16
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch CI Summary
    if: always()
    needs:
      - configure
      - setup
      - linux_build_and_test
      - windows_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: 47434387de730d51788b705e5600602dd6064997 # 2026-10-16
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
