name: hipBLASLt ASAN CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths: &host_asan_paths
      - "projects/hipblaslt/**"
      - "projects/hipsparselt/**"
      - "test/therock/test_hipblaslt.py"
      - "test/therock/test_hipsparselt.py"
      - "test/therock/lsan.supp"
      - ".github/workflows/hipblaslt-asan-ci.yml"
      - ".github/actions/ci-env/**"
  push:
    branches: [develop]
    paths: *host_asan_paths
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type passed to the test runners"
        type: choice
        options: [quick, standard, comprehensive, full]
        required: true
  schedule:
    - cron: "0 7 * * *" # Runs nightly at 7 AM UTC

env:
  TEST_TYPE: >-
    ${{ inputs.test_type ||
        ((github.event_name == 'pull_request' || github.event_name == 'push') && 'quick') ||
        'standard' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-24.04
    outputs:
      # Use the same TheRock revision as rocm-libraries' Multi-Arch CI so
      # these jobs exercise its actual math-libs build system.
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      docker_image: ${{ steps.ci-env.outputs.docker-image }}
      build_runs_on: ${{ steps.ci-env.outputs.linux-runner }}
      test_type: ${{ env.TEST_TYPE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

  build:
    name: "Build (hipBLASLt / hipSPARSELt | ${{ matrix.family }} | HOST_ASAN)"
    needs: setup
    runs-on: ${{ needs.setup.outputs.build_runs_on }}
    timeout-minutes: 600
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        family: [gfx942, gfx950]
    container:
      # ci-env pins this image by digest; zizmor cannot inspect the output.
      image: ${{ needs.setup.outputs.docker_image }} # zizmor: ignore[unpinned-images]
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: ${{ matrix.family }}
      TEATIME_FORCE_INTERACTIVE: 0
      ARTIFACT_GROUP: ${{ matrix.family }}-host-asan
      # Each build produces its own generic runtime artifacts. Keep those
      # separate across families, while allowing test-only reruns to reuse them.
      THEROCK_RUN_ID: ${{ github.run_id }}-host-asan-${{ matrix.family }}
    steps:
      - name: Checkout TheRock repository
        # TheRock is at the workspace root, so ./.github/actions/... uses its actions.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
          persist-credentials: false

      - name: "Check out rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries
          persist-credentials: false

      - name: Install python deps
        run: |
          pip install -r requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory "$PWD"
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname "$CCACHE_CONFIGPATH")" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      - name: Pull DVC files for rocm-libraries
        working-directory: rocm-libraries
        run: LOGNAME=github-runner dvc pull -v

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./build_tools/fetch_sources.py --jobs 12 --depth 1 --progress --no-include-rocm-libraries --no-include-ml-frameworks

      - name: Configure TheRock host-ASAN math-libs
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          cmake_preset: linux-release-host-asan
          extra_cmake_options: >-
            -DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=rocm-libraries
            -DTHEROCK_DIST_AMDGPU_FAMILIES=${{ matrix.family }}
            -DTHEROCK_ENABLE_ALL=OFF
            -DTHEROCK_ENABLE_BLAS=ON
            -DTHEROCK_ENABLE_SPARSE=ON
            -Drocprofiler-sdk_CMAKE_ARGS=-DROCPROFILER_BUILD_TESTS=OFF
          BUILD_DIR: build
        run: |
          python3 build_tools/github_actions/build_configure.py

      - name: Build hipSPARSELt and TheRock artifacts (HOST_ASAN)
        run: cmake --build build --target hipSPARSELt therock-artifacts -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "CCache Stats:"
          ccache -s -v
          echo "Artifacts:"
          ls build/artifacts

      - name: Configure ASAN artifact upload credentials
        uses: ./.github/actions/configure_aws_artifacts_credentials

      - name: Compress and upload TheRock artifacts
        run: |
          python build_tools/artifact_manager.py push \
            --stage all --build-dir build

  test:
    name: "Test ${{ matrix.component }} HOST_ASAN | ${{ matrix.family }} (${{ needs.setup.outputs.test_type }})"
    needs: [setup, build]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeouts[needs.setup.outputs.test_type].job || 7200 }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    strategy:
      fail-fast: false
      matrix:
        family: [gfx942, gfx950]
        component: [hipblaslt, hipsparselt]
        include:
          - family: gfx942
            runs_on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
          - family: gfx950
            runs_on: linux-gfx950-1gpu-ccs-ossci-rocm
          # Step timeouts are at least 1.5x observed runtimes. Unlisted test
          # types (comprehensive, full) use the fallbacks where these are read.
          - family: gfx942
            component: hipblaslt
            timeouts:
              quick: {step: 25, job: 45}
              standard: {step: 140, job: 160}
          - family: gfx942
            component: hipsparselt
            timeouts:
              quick: {step: 25, job: 45}
              standard: {step: 195, job: 215}
          - family: gfx950
            component: hipblaslt
            timeouts:
              quick: {step: 25, job: 45}
              standard: {step: 195, job: 215}
          - family: gfx950
            component: hipsparselt
            timeouts:
              quick: {step: 25, job: 45}
              standard: {step: 195, job: 215}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      THEROCK_DIR: ${{ github.workspace }}
      AMDGPU_FAMILIES: ${{ matrix.family }}
      ARTIFACT_GROUP: ${{ matrix.family }}-host-asan
      THEROCK_RUN_ID: ${{ github.run_id }}-host-asan-${{ matrix.family }}
      HSA_XNACK: "0"
      # Work around intermittent correctness failures with device-memory signals.
      # Remove after ROCM-34728 is fixed and default-signal repros pass HOST_ASAN.
      DEBUG_CLR_DEV_SIGNALS: "0"
      TEST_COMPONENT: ${{ matrix.component }}
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
          persist-credentials: false

      - name: Checkout rocm-libraries repository for scripts
        timeout-minutes: 30
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
          sparse-checkout: |
            .github/scripts
            test/therock
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install artifact dependencies
        run: pip install --constraint build_tools/packaging/linux/requirements.txt boto3 pyzstd

      - name: Download and install TheRock artifacts
        timeout-minutes: 5
        run: |
          # Require fresh destinations: artifact_manager treats existing archives as cached.
          mkdir "${OUTPUT_ARTIFACTS_DIR}"
          python build_tools/artifact_manager.py fetch \
            --stage all --amdgpu-families "$AMDGPU_FAMILIES" \
            --exclude-components dev,doc \
            --output-dir "$OUTPUT_ARTIFACTS_DIR" --flatten

      - name: Check test executable
        run: test -x "${THEROCK_BIN_DIR}/${TEST_COMPONENT}-test"

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          echo "Runner: ${RUNNER_NAME}"
          export PATH="${GITHUB_WORKSPACE}/build/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/lib:${LD_LIBRARY_PATH:-}"
          python3 ./build_tools/print_driver_gpu_info.py || true

      - name: Configure ASAN environment
        run: |
          python build_tools/github_actions/configure_asan_env.py \
            --artifacts-dir "${OUTPUT_ARTIFACTS_DIR}" \
            --hsa-xnack 0 \
            --lsan-suppressions rocm-libraries/test/therock/lsan.supp

      - name: Set up Python YAML converter
        run: |
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/python" -m pip install PyYAML==6.0.2
          echo "${VENV_DIR}/bin" >> "$GITHUB_PATH"

      - name: Test ${{ matrix.component }} (${{ needs.setup.outputs.test_type }})
        timeout-minutes: ${{ matrix.timeouts[needs.setup.outputs.test_type].step || 360 }}
        env:
          SHARD_INDEX: 1
          TOTAL_SHARDS: 1
          TEST_TYPE: ${{ needs.setup.outputs.test_type }}
        run: python3 "rocm-libraries/test/therock/test_${TEST_COMPONENT}.py"

  summary:
    name: "hipBLASLt ASAN CI Summary"
    # A newer PR event cancels the superseded run through the concurrency
    # group above. Do not convert that cancellation into a second red summary;
    # genuine build or test failures still reach the gate below.
    if: ${{ always() && !cancelled() }}
    # The summary accepts skipped jobs, so list setup to fail on setup errors.
    needs:
      - setup
      - build
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json "${NEEDS_JSON}"
