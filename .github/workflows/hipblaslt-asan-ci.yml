name: hipBLASLt ASAN pool diagnostic
run-name: ASAN artifact 11121290224 pool comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: ASAN startup (${{ matrix.pool }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: current
            runner: linux-gfx90a-gpu-rocm
          - pool: alternate
            runner: linux-gfx90a-1gpu-ossci-rocm
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      DIAGNOSTIC_POOL: ${{ matrix.pool }}
      ARTIFACT_RUN_ID: "36762936587"
      ARTIFACT_GROUP: gfx90a-asan
      AMDGPU_FAMILIES: gfx90a
    steps:
      - name: Checkout the artifact's TheRock revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: 3c4ec014374d4d32243334ef229093fe7b38c5b2
          persist-credentials: false

      - name: Checkout diagnostic scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries
          sparse-checkout: |
            .github/scripts/asan-pool-diagnostic
            test/therock
          persist-credentials: false

      - name: Download the existing failing build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 25
        with:
          artifact-ids: "11121290224"
          run-id: "36762936587"
          repository: ROCm/rocm-libraries
          github-token: ${{ github.token }}
          path: asan-trees
          merge-multiple: true

      - name: Assemble and fingerprint the unchanged artifact
        run: |
          mkdir -p build diagnostics
          sha256sum asan-trees/*.tar.gz | tee diagnostics/archive-sha256.txt
          tar -C build -xzf asan-trees/hipblaslt-dist.tar.gz
          if [ -f asan-trees/hipblaslt-stage.tar.gz ]; then
            tar -C build -xzf asan-trees/hipblaslt-stage.tar.gz
          fi
          test -x build/bin/hipblaslt-test
          find build -type f -print0 | sort -z | xargs -0 sha256sum > diagnostics/tree-sha256.txt
          sha256sum diagnostics/tree-sha256.txt
          git -C rocm-libraries rev-parse HEAD > diagnostics/diagnostic-revision.txt

      - name: Prepare debugger in the task directory
        timeout-minutes: 8
        continue-on-error: true
        run: |
          bash rocm-libraries/.github/scripts/asan-pool-diagnostic/prepare-debugger.sh \
            2>&1 | tee diagnostics/debugger-setup.log

      - name: Match the original ASAN environment
        run: |
          OUT="${GITHUB_WORKSPACE}/build"
          ASAN_RT_SO=$(find "$OUT/lib/llvm/lib/clang" -name 'libclang_rt.asan*.so' | sort | head -1)
          test -n "$ASAN_RT_SO"
          {
            echo "ASAN_OPTIONS=quarantine_size_mb=600"
            echo "LSAN_OPTIONS=suppressions=${GITHUB_WORKSPACE}/rocm-libraries/test/therock/lsan.supp:print_suppressions=0"
            echo "HSA_XNACK=1"
            echo "OMP_NUM_THREADS=1"
            echo "GTEST_SHARD_INDEX=0"
            echo "GTEST_TOTAL_SHARDS=1"
            echo "ASAN_SYMBOLIZER_PATH=${OUT}/lib/llvm/bin/llvm-symbolizer"
            echo "LD_LIBRARY_PATH=${OUT}/lib:$(dirname "$ASAN_RT_SO"):${LD_LIBRARY_PATH:-}"
            echo "DIAGNOSTIC_ASAN_RUNTIME=$ASAN_RT_SO"
          } >> "$GITHUB_ENV"

      - name: Run smoke suite and capture a stalled process
        timeout-minutes: 20
        env:
          DIAGNOSTIC_RUNNER: ${{ runner.name }}
        run: python3 rocm-libraries/.github/scripts/asan-pool-diagnostic/diagnose.py

      - name: Preserve diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-pool-${{ matrix.pool }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Report original smoke result
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("diagnostics/smoke-result.json").read_text())
          print(json.dumps(result, indent=2))
          raise SystemExit(0 if result["returncode"] == 0 else 1)
          PY
