#
# Opt-in lane for MIOpen built with MIOPEN_ENABLE_HIPDNN_WRAPPER=ON. Every other
# MIOpen build here leaves it OFF, the shipping configuration, so nothing on the
# default path exercises the wrapper's own gates.
#
# Kept out of component-ci-miopen.yml deliberately: that workflow is staying lean
# while MIOpen CI moves to TheRock, and this lane is scaffolding that exists only
# until the flag defaults on, so a separate file is removed in one move.
#
# Manual dispatch only. Automated flag-on coverage belongs to TheRock, which builds
# the wrapper when a run sets THEROCK_FLAG_MIOPEN_ENABLE_HIPDNN_WRAPPER=ON and then
# runs the parity harness and the wrapper ABI check against the resulting artifact.
# This lane remains the home of the one check that cannot move there: the installed
# header rename check needs a staged include tree, which the test job never fetches.
#
# The parity harness is only checked for registration here. Executing it needs a GPU,
# which no runner here has, so the doubled runs happen wherever MIOpen's ctest suite
# is run on hardware rather than being duplicated as a bespoke step.
#
# The provider plugin is not built by the first job, which configures projects/miopen alone.
# The second job builds the wrapper together with the provider and runs the plugin's binary
# check (check_public_abi.py check-plugin), which dnn-providers/miopen-provider registers
# only when it sees a MIOpen_private target. Neither job needs a GPU, so the GPU re-entry
# entry (miopen-provider-plugin-reentry-guard) is not run here.

name: "MIOpen: hipDNN wrapper flag-on"

on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch of the same ref supersedes the first; this is an expensive build
# to leave running for an answer nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flag-on:
    name: MIOpen wrapper flag-on checks
    runs-on: az-linux-scale-rocm-default-prod
    # A full release build plus miopen_gtest; well past this means a hang, not a slow build.
    timeout-minutes: 180
    container:
      image: rocm/miopen-dev:multiarch_dev_20261117
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers/miopen-provider
            projects/miopen
            shared/ctest

      - name: Pull DVC files for rocm-libraries # LOGNAME details here https://github.com/ROCm/rocm-libraries/pull/1617
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      # MIOPEN_TEST_GFX94X names the target explicitly instead of letting the test tree probe
      # for a GPU. This runner has none, and a probe that concludes so sets MIOPEN_NO_GPU,
      # which drops the parity harness the count assertion below requires.
      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
            -DMIOPEN_ENABLE_HIPDNN_WRAPPER=ON \
            -DMIOPEN_INSTALL_CXX_HEADERS=ON \
            -DCMAKE_BUILD_TYPE=release \
            -DBUILD_DEV=OFF \
            -DMIOPEN_TEST_DISCRETE=OFF \
            -DMIOPEN_USE_MLIR=ON \
            -DMIOPEN_GPU_SYNC=OFF \
            -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DGPU_TARGETS="gfx942" \
            -DMIOPEN_TEST_GFX94X=ON

      # The scripts behind the wrapper gates, including the GPU-label lookup that
      # depends on the shared test-category parser's output format. The entry only
      # exists with the wrapper on, so nothing else runs it. Needs no build, so it
      # goes before one and fails in seconds.
      - name: Wrapper script self-tests
        run: |
          ctest --test-dir build -R '^test_forwarding_parity_scripts$' --no-tests=error --output-on-failure

      - name: Build
        run: cmake --build build --target install --target miopen_gtest -j$(nproc)

      # The flag-on counterpart of the default build's public ABI gate. Beyond the
      # symbol set and SONAME it asserts that the two halves were built together
      # and that the wrapper stubs everything the implementation renamed: a missing
      # stub links fine and fails only when a caller reaches that entry point.
      # Runs through the same wrapper_abi_check ctest entry TheRock's test job uses,
      # rather than a bespoke glob-and-invoke here, so the two paths cannot drift apart.
      # --no-tests=error: ctest exits 0 when -R matches nothing, so a renamed or
      # unregistered entry would otherwise pass having checked nothing.
      - name: Wrapper ABI check
        run: |
          ctest --test-dir build -R '^wrapper_abi_check$' --no-tests=error --output-on-failure

      # The rename is a compile-time trick, so a staged header spelling an entry
      # point by its private name would hand that name to consumers as public API.
      - name: Installed header rename check
        run: |
          python3 projects/miopen/script/check_public_abi.py check-installed-headers \
            projects/miopen/install/include

      # The mirror image of the default build's zero-count assertion: with the
      # wrapper on, the parity harness has to be there.
      - name: Forwarding parity harness is registered
        run: |
          # Capture before parsing: piping into sed would make sed's exit status
          # the step's, so a ctest that failed outright would be read as a
          # well-formed empty result. An assignment from a command substitution
          # carries that command's status, so -e stops here instead.
          listing=$(ctest --test-dir build -N -L forwarding_parity)
          count=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: //p')
          echo "forwarding_parity tests registered: ${count:-<unparsed>}"
          test -n "$count" && test "$count" -gt 0 || {
            echo "expected forwarding_parity tests with MIOPEN_ENABLE_HIPDNN_WRAPPER=ON"
            printf '%s\n' "$listing"
            exit 1
          }

      # Same check as the component CI, on the full flag-on build tree.
      - name: Wrapper checks are registered for every architecture with an enabled suite
        run: |
          labels=$(python3 projects/miopen/test/gtest/forwarding_parity_gpu_labels.py \
            shared/ctest/parse_test_categories.py \
            projects/miopen/test/gtest/test_categories.yaml)
          python3 projects/miopen/test/gtest/check_wrapper_registration.py \
            --labels "$labels" \
            --ctest-dir build \
            --packaged build/test/gtest/install_CTestTestfile.cmake

  # The plugin has to bind to libMIOpen_private. The check is a ctest entry, so it only runs
  # in a configure that has the wrapper and the provider; the first job has no provider. The
  # entries read the built plugin and the stand-in plugin (built against the public library,
  # which the check must reject) without loading them, so no GPU is needed. Only the two
  # plugins are built: they pull in MIOpen_private and the wrapper but not the MIOpen tests.
  flag-on-provider:
    name: MIOpen wrapper with the hipDNN provider
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 180
    container:
      image: rocm/miopen-dev:multiarch_dev_20261117
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            shared

      - name: Pull DVC files for rocm-libraries
        run: |
          if command -v dvc &> /dev/null; then
            echo "dvc detected"
          else
            echo "Warning, dvc not detected!"
          fi
          LOGNAME=github-runner dvc pull -v

      # The preset does not enable the wrapper; the option below does. ROCM_LIBS_ENABLE_ROOT_CTEST
      # registers the provider's ctest entries in the root test list. MIOPEN_TEST_GFX94X names the
      # target for the same reason as in the first job.
      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          cmake --preset miopen-with-provider -B build \
            -DMIOPEN_ENABLE_HIPDNN_WRAPPER=ON \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DMIOPEN_TEST_DISCRETE=OFF \
            -DMIOPEN_GPU_SYNC=OFF \
            -DENABLE_CLANG_TIDY=OFF \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DPython3_EXECUTABLE=$(command -v python3) \
            -DGPU_TARGETS="gfx942" \
            -DMIOPEN_TEST_GFX94X=ON

      - name: Build the plugin and the stand-in plugin
        run: cmake --build build --target miopen_plugin miopen_plugin_public_stand_in -j$(nproc)

      # The pattern also matches when only one of the two entries exists, so the entries are
      # counted first: losing the stand-in's rejection entry would otherwise go unnoticed.
      # --no-tests=error: ctest exits 0 when -R matches nothing, which is what a configure
      # that did not enable the wrapper would give.
      - name: Plugin binary check
        run: |
          pattern='^miopen-provider-plugin-abi-check(-rejects-public-plugin)?$'
          listing=$(ctest --test-dir build -N -R "$pattern")
          count=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: //p')
          test "$count" = "2" || {
            echo "expected the plugin check and the stand-in rejection check, found ${count:-<unparsed>} entries"
            printf '%s\n' "$listing"
            exit 1
          }
          ctest --test-dir build -R "$pattern" --no-tests=error --output-on-failure
