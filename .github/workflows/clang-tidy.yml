name: hipDNN Clang Tidy

on:
  pull_request:
    paths:
      - 'projects/hipdnn/**'
      - '.github/workflows/hipdnn-tidy.yml'
  workflow_dispatch:

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rocm-libraries
        uses: actions/checkout@v4

      - name: Checkout TheRock
        uses: actions/checkout@v4
        with:
          repository: ROCm/TheRock
          path: TheRock

      - name: Show disk usage before cleanup
        run: |
          echo "=== Overall disk usage ==="
          df -h /
          echo ""
          echo "=== /usr/share contents ==="
          sudo du -sh /usr/share/* 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== /usr/local contents ==="
          sudo du -sh /usr/local/* 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== /opt contents ==="
          sudo du -sh /opt/* 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== AGENT_TOOLSDIRECTORY ($AGENT_TOOLSDIRECTORY) ==="
          sudo du -sh "$AGENT_TOOLSDIRECTORY"/* 2>/dev/null | sort -hr | head -20 || echo "Directory not found"
          echo ""
          echo "=== Docker images ==="
          sudo docker system df 2>/dev/null || echo "Docker not available"
          echo ""
          echo "=== Large directories in /home ==="
          sudo du -sh /home/*/* 2>/dev/null | sort -hr | head -10

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo docker system prune -a -f

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-venv clang-tidy-20
          python3 -m venv .venv
          . .venv/bin/activate
          pip install boto3
          pip install -r TheRock/requirements.txt

      - name: Install ROCm
        run: |
          sudo .venv/bin/python3 TheRock/build_tools/install_rocm_from_artifacts.py \
            --release 7.9.0rc20251008 \
            --amdgpu-family gfx94X-dcgpu \
            --output-dir /opt/rocm \
            --base-only

      - name: Run clang-tidy
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/hipdnn -B build -G Ninja \
            -DENABLE_CLANG_TIDY=ON \
            -DROCM_PATH=/opt/rocm \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DHIP_DNN_SKIP_TESTS=ON \
            -DHIP_PLATFORM=amd
          ninja -C build tidy
