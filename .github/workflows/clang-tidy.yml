name: clang-tidy

on:
  push:
    branches:
      - develop
      - release/therock-*
    paths:
      - 'projects/hipdnn/**/*.[ch]p?p?'
      - 'projects/hipdnn/cmake/ClangTidy.cmake'
      - 'projects/hipdnn/.clang-tidy'
      # Disabled: see https://github.com/ROCm/rocm-libraries/issues/5067
      # - 'dnn-providers/miopen-provider/**/*.[ch]p?p?'
      # - 'dnn-providers/miopen-provider/cmake/ClangTidy.cmake'
      # - 'dnn-providers/miopen-provider/.clang-tidy'
      - '.github/workflows/clang-tidy.yml'
  pull_request:
    # No paths: filter — workflow must always run so the required check is registered
    # for every PR. The clang-tidy job itself is skipped when no opted-in component
    # is affected (guarded by the setup job output).
  workflow_dispatch:

concurrency:
  # For PRs, group by PR number so a new commit cancels any in-progress run
  # for the same PR. For postsubmits, group by commit SHA (unique per commit)
  # so runs never cancel each other. The workflow name is prepended to avoid
  # conflicts between different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 2

      - name: Detect changed opted-in projects
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            # To opt in a new library: add a filter here and one ENTRIES line
            # in the build-matrix step below.
            hipdnn:
              - 'projects/hipdnn/**'
            # Disabled: see https://github.com/ROCm/rocm-libraries/issues/5067
            # miopen-provider:
            #   - 'dnn-providers/miopen-provider/**'

      - name: Build job matrix
        id: build-matrix
        run: |
          ENTRIES=()
          if [[ "${{ steps.changes.outputs.hipdnn }}" == "true" ]] \
              || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENTRIES+=('{"name":"hipdnn","src":"projects/hipdnn","build":"build-hipdnn","cmake_flags":"-DENABLE_CLANG_TIDY=ON -DROCM_PATH=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm -DENABLE_CLANG_FORMAT=OFF -DHIP_PLATFORM=amd"}')
          fi
          # To opt in a new library: uncomment or add an ENTRIES line here, and
          # add a filter above. Required fields: name, src, build, cmake_flags.
          # Optional fields: target (default: "tidy").
          # Add an "Install deps (<name>)" step in the clang-tidy job if needed.
          # Disabled: see https://github.com/ROCm/rocm-libraries/issues/5067
          # if [[ "${{ steps.changes.outputs.miopen-provider }}" == "true" ]] \
          #     || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          #   ENTRIES+=('{"name":"miopen-provider","src":"dnn-providers/miopen-provider","build":"build-miopen-provider","cmake_flags":"-DENABLE_CLANG_TIDY=ON -DROCM_PATH=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm -DENABLE_CLANG_FORMAT=OFF -DHIP_PLATFORM=amd"}')
          # fi
          if [[ ${#ENTRIES[@]} -gt 0 ]]; then
            MATRIX=$(printf '%s\n' "${ENTRIES[@]}" | jq -sc '{"include": .}')
          else
            MATRIX='{"include":[]}'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  clang-tidy:
    name: "clang-tidy"
    needs: setup
    if: needs.setup.outputs.hipdnn == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: azure-linux-scale-rocm
    steps:
      - name: Checkout rocm-libraries
        uses: actions/checkout@v6

      - name: Checkout TheRock
        uses: actions/checkout@v6
        with:
          repository: ROCm/TheRock
          path: TheRock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            python3-venv \
            lsb-release wget \
            software-properties-common \
            gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy-20 \
            clang-tools-20
          python3 -m venv .venv
          . .venv/bin/activate
          pip install boto3 cmake
          pip install -r TheRock/requirements.txt

      - name: Install ROCm
        run: |
          sudo .venv/bin/python3 TheRock/build_tools/install_rocm_from_artifacts.py \
            --latest-release \
            --amdgpu-family gfx94X-dcgpu \
            --output-dir /opt/rocm \
            --base-only

      - name: Run clang-tidy (hipDNN)
        if: needs.setup.outputs.hipdnn == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          . .venv/bin/activate
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/hipdnn -B build-hipdnn -G Ninja \
            -DENABLE_CLANG_TIDY=ON \
            -DROCM_PATH=/opt/rocm \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DENABLE_CLANG_FORMAT=OFF \
            -DHIP_PLATFORM=amd
          ninja -C build-hipdnn tidy

      # Disabled: see https://github.com/ROCm/rocm-libraries/issues/5067
      # - name: Run clang-tidy (miopen-provider)
      #   if: needs.setup.outputs.miopen-provider == 'true' || github.event_name == 'workflow_dispatch'
      #   run: |
      #     . .venv/bin/activate
      #     export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
      #     export CXX=/opt/rocm/llvm/bin/clang++
      #     cmake -S dnn-providers/miopen-provider -B build-miopen-provider -G Ninja \
      #       -DENABLE_CLANG_TIDY=ON \
      #       -DROCM_PATH=/opt/rocm \
      #       -DCMAKE_PREFIX_PATH=/opt/rocm \
      #       -DENABLE_CLANG_FORMAT=OFF \
      #       -DHIP_PLATFORM=amd
      #     ninja -C build-miopen-provider tidy

  clang_tidy_summary:
    name: "clang-tidy summary"
    if: always()
    needs:
      - setup
      - clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Output failed jobs
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "The following jobs failed: ${FAILED_JOBS}"
            exit 1
          fi
