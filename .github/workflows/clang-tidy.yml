name: clang-tidy

on:
  workflow_call:
    inputs:
      therock_ref:
        type: string
        required: true
      docker_image:
        type: string
        required: true
      clang_tidy_projects:
        type: string
        required: true
      amdgpu_families:
        type: string
        required: true
      build_runs_on:
        type: string
        required: true

permissions:
  contents: read

jobs:
  clang-tidy:
    name: clang-tidy (${{ inputs.clang_tidy_projects }} | ${{ inputs.amdgpu_families }})
    if: ${{ inputs.clang_tidy_projects != '' }}
    runs-on: ${{ inputs.build_runs_on }}
    container:
      image: ${{ inputs.docker_image }}
      options: -v /runner/config:/home/awsconfig/
    env:
      ROCM_PATH: ${{ github.workspace }}/rocm-pr
      LLVM_TOOLS_SEARCH_PREFIX: ${{ github.workspace }}/rocm-pr
    steps:
      - name: Checkout rocm-libraries
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout TheRock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          path: TheRock
          ref: ${{ inputs.therock_ref }}

      - name: Install Python dependencies
        run: pip install -r TheRock/requirements.txt

      - name: Install PR-built ROCm artifacts
        run: |
          python3 TheRock/build_tools/install_rocm_from_artifacts.py \
            --run-id "${{ github.run_id }}" \
            --run-github-repo "${{ github.repository }}" \
            --amdgpu-family "${{ inputs.amdgpu_families }}" \
            --output-dir "${ROCM_PATH}"

      - name: Verify TheRock clang tools
        run: |
          export PATH="${ROCM_PATH}/lib/llvm/bin:${ROCM_PATH}/bin:${PATH}"
          command -v clang++
          command -v clang-tidy
          command -v run-clang-tidy
          clang++ --version
          clang-tidy --version
          run-clang-tidy --help >/dev/null

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          export PATH="${ROCM_PATH}/lib/llvm/bin:${ROCM_PATH}/bin:${PATH}"
          export CMAKE_PREFIX_PATH="${ROCM_PATH}:${CMAKE_PREFIX_PATH:-}"
          export HIP_PATH="${ROCM_PATH}"

          IFS=',' read -ra TIDY_PROJECTS <<< "${{ inputs.clang_tidy_projects }}"
          for tidy_project in "${TIDY_PROJECTS[@]}"; do
            cd "${GITHUB_WORKSPACE}"
            case "${tidy_project}" in
              hipdnn)
                cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-clang-tidy/hipdnn" -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/rocm-clang.cmake" \
                  -DROCM_LIBS_ENABLE_COMPONENTS="hipdnn;hipdnn-integration-tests;miopen-provider;hipblaslt-provider;hip-kernel-provider" \
                  -DROCM_PATH="${ROCM_PATH}" \
                  -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
                  -DCMAKE_PROGRAM_PATH="${ROCM_PATH}/lib/llvm/bin" \
                  -DLLVM_TOOLS_SEARCH_PREFIX="${ROCM_PATH}" \
                  -DGPU_TARGETS=gfx942 \
                  -DENABLE_CLANG_TIDY=ON \
                  -DENABLE_CLANG_FORMAT=OFF \
                  -DHIP_PLATFORM=amd \
                  -DHIPDNN_BUILD_PYTHON_BINDINGS=ON
                cmake --build "${GITHUB_WORKSPACE}/build-clang-tidy/hipdnn" --target hipdnn-tidy
                ;;
              stinkytofu)
                python3 -m venv "${GITHUB_WORKSPACE}/.venv-stinkytofu"
                . "${GITHUB_WORKSPACE}/.venv-stinkytofu/bin/activate"
                pip install -r "${GITHUB_WORKSPACE}/shared/stinkytofu/requirements.txt"
                cd "${GITHUB_WORKSPACE}/shared/stinkytofu"
                invoke build --rocm-path "${ROCM_PATH}"
                invoke tidy
                ;;
              *)
                echo "Unknown clang-tidy project '${tidy_project}'"
                exit 1
                ;;
            esac
          done
