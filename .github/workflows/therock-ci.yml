name: TheRock CI

on:
  push:
    branches:
      - develop
      - release/therock-*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review
  workflow_dispatch:
    inputs:
      projects:
        type: string
        description: "Insert space-separated list of projects to test or 'all' to test all projects. ex: 'projects/rocprim projects/hipcub'"
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx1151"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx1151"
        default: ""
  workflow_call:

permissions:
  contents: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      docker_image: ${{ steps.ci-env.outputs.docker-image }}
      rocm_package_version: ${{ steps.rocm_package_version.outputs.rocm_package_version }}
      linux_projects: ${{ steps.linux_projects.outputs.linux_projects }}
      linux_build_runs_on: ${{ steps.linux_projects.outputs.build_runs_on }}
      windows_projects: ${{ steps.windows_projects.outputs.windows_projects }}
      windows_build_runs_on: ${{ steps.windows_projects.outputs.build_runs_on }}
      test_type: ${{ steps.linux_projects.outputs.test_type }}
      linux_package_targets: ${{ steps.configure_linux.outputs.package_targets }}
      windows_package_targets: ${{ steps.configure_windows.outputs.package_targets }}
      miopen_selected: ${{ steps.dbsync_gate.outputs.miopen_selected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 2

      # Loads shared CI constants (TheRock ref, Docker image, runner labels)
      # from the ci-env composite action so they are defined in one place.
      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ steps.ci-env.outputs.therock-ref }}

      - name: Checkout CI config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic requests

      - name: Compute package version
        id: rocm_package_version
        run: |
          python TheRock/build_tools/compute_rocm_package_version.py --release-type=dev

      - name: Set PR_LABELS variable with labels assigned to pull request
        if: ${{ github.event.pull_request }} # only set PR labels var if this is a pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "PR_LABELS=$(gh pr view ${PR_NUMBER} --json labels)" >> $GITHUB_ENV

      - name: Determine Linux projects to run
        id: linux_projects
        env:
          PROJECTS: ${{ inputs.projects }}
          PLATFORM: "linux"
          CI_CONFIG_PATH: ci-config
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          python .github/scripts/therock_configure_ci.py

      - name: Determine Windows projects to run
        id: windows_projects
        env:
          PROJECTS: ${{ inputs.projects }}
          PLATFORM: "windows"
          CI_CONFIG_PATH: ci-config
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          python .github/scripts/therock_configure_ci.py

      # linux_projects' "projects_to_test" is a comma-separated STRING per bundle (not a JSON
      # array of individual strings), e.g. "hipblas,miopen,rocblas" -- a naive
      # contains(linux_projects, 'miopen') substring check on the raw JSON would also match
      # "miopenprovider", so this parses it properly and checks "miopen" as an exact
      # comma-delimited token across all bundles. Used to gate the GPU-free rocjitsu dbsync job
      # the same way MIOpen's own Test miopen job is effectively gated.
      - name: Determine if MIOpen dbsync gate should run
        id: dbsync_gate
        env:
          LINUX_PROJECTS: ${{ steps.linux_projects.outputs.linux_projects }}
        run: |
          python3 -c "
          import json, os
          bundles = json.loads(os.environ['LINUX_PROJECTS'])
          selected = any(
              'miopen' in bundle.get('projects_to_test', '').split(',')
              for bundle in bundles
          )
          print(f'miopen_selected={str(selected).lower()}')
          " >> "$GITHUB_OUTPUT"

      - name: Fetch Linux targets for build and test
        env:
          THEROCK_PACKAGE_PLATFORM: "linux"
          AMDGPU_FAMILIES: ${{ inputs.linux_amdgpu_families || 'gfx94X, gfx950, gfx125X' }}
          CI_CONFIG_PATH: ci-config
        id: configure_linux
        run: python ./TheRock/build_tools/github_actions/fetch_package_targets.py

      - name: Fetch Windows targets for build and test
        env:
          THEROCK_PACKAGE_PLATFORM: "windows"
          AMDGPU_FAMILIES: ${{ inputs.windows_amdgpu_families || 'gfx1151' }}
          CI_CONFIG_PATH: ci-config
        id: configure_windows
        run: python ./TheRock/build_tools/github_actions/fetch_package_targets.py

  therock-ci-linux:
    name: Linux (${{ matrix.projects.projects_to_test }} | ${{ matrix.target_bundle.amdgpu_family }})
    permissions:
      contents: read
      id-token: write
    needs: setup
    if: ${{ needs.setup.outputs.linux_projects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.setup.outputs.linux_projects) }}
        target_bundle: ${{ fromJSON(needs.setup.outputs.linux_package_targets) }}
    uses: ./.github/workflows/therock-ci-linux.yml
    secrets:
      MIOPEN_CI_WEBHOOK_URL: ${{ secrets.MIOPEN_CI_WEBHOOK_URL }}
      HIPDNN_CI_WEBHOOK_URL: ${{ secrets.HIPDNN_CI_WEBHOOK_URL }}
    with:
      therock_ref: ${{ needs.setup.outputs.therock_ref }}
      docker_image: ${{ needs.setup.outputs.docker_image }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      cmake_options: ${{ matrix.projects.cmake_options }}
      projects_to_test: ${{ matrix.projects.projects_to_test }}
      test_type: ${{ needs.setup.outputs.test_type }}
      run_rocjitsu_race_check: ${{ matrix.projects.run_rocjitsu_race_check }}
      amdgpu_families: ${{ matrix.target_bundle.amdgpu_family }}
      test_runs_on: ${{ matrix.target_bundle.test_machine }}
      build_runs_on: ${{ needs.setup.outputs.linux_build_runs_on }}

  therock-ci-windows:
    name: Windows (${{ matrix.projects.projects_to_test }} | ${{ matrix.target_bundle.amdgpu_family }})
    permissions:
      contents: read
      id-token: write
    needs: setup
    if: ${{ needs.setup.outputs.windows_projects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        projects: ${{ fromJSON(needs.setup.outputs.windows_projects) }}
        target_bundle: ${{ fromJSON(needs.setup.outputs.windows_package_targets) }}
    uses: ./.github/workflows/therock-ci-windows.yml
    secrets:
      MIOPEN_CI_WEBHOOK_URL: ${{ secrets.MIOPEN_CI_WEBHOOK_URL }}
      HIPDNN_CI_WEBHOOK_URL: ${{ secrets.HIPDNN_CI_WEBHOOK_URL }}
    with:
      therock_ref: ${{ needs.setup.outputs.therock_ref }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      cmake_options: ${{ matrix.projects.cmake_options }}
      projects_to_test: ${{ matrix.projects.projects_to_test }}
      test_type: ${{ needs.setup.outputs.test_type }}
      amdgpu_families: ${{ matrix.target_bundle.amdgpu_family }}
      test_runs_on: ${{ matrix.target_bundle.test_machine }}
      build_runs_on: ${{ needs.setup.outputs.windows_build_runs_on }}

  # GPU-free MIOpen dbsync (StaticFDBSync) via the rocjitsu KMD interposer, for arches TheRock
  # builds AND rocjitsu has a functional-emulation config for (gfx942/cdna3, gfx950/cdna4 --
  # gfx90a/cdna2 has no rocjitsu config, out of scope for now). Gated the same way MIOpen's own
  # `Test miopen` job is effectively gated: needs.setup.outputs.miopen_selected (computed from
  # linux_projects' per-bundle "projects_to_test" comma-lists, see the "Determine if MIOpen
  # dbsync gate should run" step above), so this only runs when TheRock's MIOpen CI would run.
  # Self-references github.run_id for the artifact (this job runs within the same GHA run as the
  # build, no external input needed) -- see therock-dbsync-rocjitsu.yml for the standalone
  # workflow_dispatch version used for manual/diagnostic runs against a pinned commit.
  #
  # Only depends on `setup`, NOT `therock-ci-linux` -- deliberately. `therock-ci-linux` is one
  # reusable-workflow job matrixed over EVERY family/project bundle in this PR (build AND test for
  # ALL of them, not just MIOpen), so `needs: therock-ci-linux` would block this job on unrelated
  # components' test runs finishing too -- confirmed live (run 32195745347) this can stall for a
  # very long time on scarce GPU test-runner availability having nothing to do with MIOpen/dbsync.
  # Instead the fetch step below retries with a bounded budget until this run's own MIOpen build
  # artifact appears (confirmed separately, run 32194708858, that fetching too early fails with
  # "Found no artifacts matching [...] at s3://..." -- a fixed wait, not a permanent error).
  dbsync-rocjitsu:
    name: "dbsync rocjitsu (${{ matrix.arch }})"
    permissions:
      contents: read
      actions: read # read this run's job list to track the MIOpen build leg (see Fetch artifact)
    needs: setup
    if: ${{ needs.setup.outputs.miopen_selected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: gfx942, family: gfx94X-dcgpu, rj_config: amdgpu_cdna3_kmd.json }
          - { arch: gfx950, family: gfx950-dcgpu, rj_config: amdgpu_cdna4_kmd.json }
    runs-on: azure-linux-scale-rocm
    # Hard ceiling. The "Fetch artifact" step waits (build-aware) for this run's MIOpen build leg to
    # produce the artifact -- observed up to ~77 min end-to-end when the build runner queues (build
    # started 35 min after this job, ran ~40 min) -- then the KMD build + dbsync run itself (15-200s).
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host --user 0
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ matrix.family }}
      VENV_DIR: ${{ github.workspace }}/.venv
    steps:
      - name: Checkout ROCm/TheRock (build_tools)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}

      - name: Checkout rocm-libraries (scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Checkout rocjitsu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 481982dfe23e181a302006747c561e7cf43e35ba # 2026-06-04
          path: rocm-systems
          sparse-checkout: |
            emulation/rocjitsu

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install UV
        run: pip install uv

      - name: Create Python venv
        run: python build_tools/setup_venv.py "${VENV_DIR}" --activate-in-future-github-actions-steps --use-uv

      - name: Install test requirements
        run: |
          uv pip install -r requirements-test.txt
          uv pip freeze

      # install_rocm_from_artifacts.py called directly (not via the setup_test_environment
      # composite action, which has no --run-github-repo input) with --run-github-repo defaulting
      # to this repo, since ARTIFACT_RUN_ID is this same GHA run's own id.
      #
      # This job only `needs: setup`, so it starts before this run's MIOpen build has uploaded its
      # artifact. It can't `needs:` the build directly -- therock-ci-linux is one reusable-workflow
      # job that fuses build+test across ALL families/bundles, and GHA can't depend on a sub-leg of
      # it (depending on the whole thing would also block on unrelated components' GPU tests). So
      # this is BUILD-AWARE instead of a fixed wait budget: each poll tries the fetch, and if the
      # artifact isn't there yet it checks this run's MIOpen *build* leg for our family via
      # therock_dbsync_build_leg_state.py and either keeps waiting (build still queued/running),
      # fails fast (build concluded without success -> no artifact will ever appear), or errors if
      # the build succeeded but the artifact still never materializes. Bounded by the job timeout.
      #
      # Readiness is keyed on the arch-specific CK grouped-conv plugin (libMIOpenCKGroupedConv_<arch>.so),
      # NOT on miopen_gtest -- confirmed live (run 32290762766) that miopen_gtest ships in the
      # arch-INDEPENDENT miopen_test_generic artifact, which lands independently of the arch-specific
      # miopen_lib_<arch> artifact that actually carries the CK plugin + this arch's SystemDBs (the
      # things dbsync needs). Keying on miopen_gtest exited the loop too early: for gfx950 the
      # miopen_lib_gfx950 artifact existed but hadn't been fetched yet; for gfx942 it masked a build
      # failure entirely (generic gtest was present so the loop never consulted the build leg state).
      # (install_rocm_from_artifacts.py also exits 0 as soon as ANY artifact exists at the run's S3
      # prefix, so its exit code alone is not a readiness signal either.)
      - name: Fetch artifact (source-CK build for ${{ matrix.family }})
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEVICE_ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          poll_interval_seconds=60
          post_success_grace_polls=5 # tolerate brief S3 upload lag after the build leg reports success
          post_success_seen=0
          start="${SECONDS}"
          while true; do
            if python ./build_tools/install_rocm_from_artifacts.py \
                --run-id="${ARTIFACT_RUN_ID}" \
                --run-github-repo="${GH_REPO}" \
                --artifact-group="${AMDGPU_FAMILIES}" \
                --output-dir="${OUTPUT_ARTIFACTS_DIR}" \
                --blas --miopen --rand --tests \
                && find "${OUTPUT_ARTIFACTS_DIR}" -name "libMIOpenCKGroupedConv_${DEVICE_ARCH}.so" | grep -q .; then
              echo "Fetched artifact (libMIOpenCKGroupedConv_${DEVICE_ARCH}.so present) after $((SECONDS - start))s"
              break
            fi

            state="$(python3 rocm-libraries/.github/scripts/therock_dbsync_build_leg_state.py)"
            elapsed=$((SECONDS - start))
            case "${state}" in
              success)
                post_success_seen=$((post_success_seen + 1))
                if [ "${post_success_seen}" -ge "${post_success_grace_polls}" ]; then
                  echo "::error::MIOpen build leg for ${AMDGPU_FAMILIES} reported success but the ${DEVICE_ARCH} CK plugin never appeared in the fetched artifact (${elapsed}s, run ${ARTIFACT_RUN_ID})"
                  exit 1
                fi
                echo "build leg succeeded; ${DEVICE_ARCH} artifact not fetched yet (grace ${post_success_seen}/${post_success_grace_polls}, ${elapsed}s) -- retrying in ${poll_interval_seconds}s"
                ;;
              failure | cancelled | skipped)
                echo "::error::MIOpen build leg for ${AMDGPU_FAMILIES} did not succeed (state=${state}); no ${DEVICE_ARCH} artifact will be produced (${elapsed}s, run ${ARTIFACT_RUN_ID})"
                exit 1
                ;;
              *)
                # queued / in_progress / notfound (not created yet) / query-error -- keep waiting.
                echo "MIOpen build leg for ${AMDGPU_FAMILIES} not ready (state=${state}, ${elapsed}s) -- retrying in ${poll_interval_seconds}s"
                ;;
            esac
            sleep "${poll_interval_seconds}"
          done

      - name: Inspect artifact (key check — CK plugin + DBs must be present)
        run: |
          set -euxo pipefail
          test -f ./build/bin/miopen_gtest
          echo "== CK grouped-conv plugins in the dist =="
          find ./build -name 'libMIOpenCKGroupedConv_*.so' -print
          echo "== ${{ matrix.arch }} system DBs in the dist =="
          ls -la ./build/share/miopen/db/${{ matrix.arch }}*.HIP.fdb.txt \
                 ./build/share/miopen/db/${{ matrix.arch }}*.db.txt

      - name: Build rocjitsu KMD
        run: |
          set -euxo pipefail
          apt-get update && apt-get install -y --no-install-recommends cmake build-essential libdrm-dev
          cmake -S rocm-systems/emulation/rocjitsu -B rocjitsu-build -DCMAKE_BUILD_TYPE=Release
          cmake --build rocjitsu-build --target rocjitsu_kmd_shim -j"$(nproc)"

      - name: Run StaticFDBSync (rocjitsu, ${{ matrix.arch }})
        run: |
          set -euxo pipefail
          export ROCM_PATH="$(realpath ./build)"
          export LD_LIBRARY_PATH="$(realpath ./build/lib):${LD_LIBRARY_PATH:-}"
          export RJ_CONFIG="$(realpath rocm-systems/emulation/rocjitsu/configs/${{ matrix.rj_config }})"
          export MIOPEN_DEVICE_ARCH="${{ matrix.arch }}"
          LD_PRELOAD="$(realpath rocjitsu-build/lib/rocjitsu/src/rocjitsu/kmd/librocjitsu_kmd.so)" \
            ./build/bin/miopen_gtest --gtest_filter='*StaticFDBSync*' --gtest_color=no

  therock_ci_summary:
    name: TheRock CI Summary
    if: always()
    needs:
      - setup
      - therock-ci-linux
      - therock-ci-windows
      - dbsync-rocjitsu
    runs-on: ubuntu-24.04
    steps:
      - name: Output failed jobs
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "The following jobs failed: ${FAILED_JOBS}"
            exit 1
          fi
