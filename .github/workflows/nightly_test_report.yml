#
# Reusable: emails a test report for the run that calls it, through a webhook (e.g. a
# Power Automate flow that sends the email). The report lists the test job's runner
# and step results, per-suite counts and failing tests, and a per-test comparison
# with the latest earlier nightly that has results. Call it as a job after the test
# job (gfx1250_hipblaslt_tensilelite_test.yml is an example):
#
#   report:
#     needs: <test job>
#     if: ${{ always() && github.event_name == 'schedule' }}
#     permissions: {contents: read, actions: read}
#     uses: ./.github/workflows/nightly_test_report.yml
#     with: {title: ..., test_job: ..., artifact: ..., suites: ...}
#     secrets: {webhook_url: ...}
#
# Runs on a GitHub-hosted runner, so the webhook secret never reaches a self-hosted
# test runner, and reads only the run's artifact and the GitHub API.

name: Nightly test report

on:
  workflow_call:
    inputs:
      title:
        description: "Report name, shown in the subject (e.g. gfx1250-strict)"
        required: true
        type: string
      test_job:
        description: "Name of the test job whose runner and steps the report lists"
        required: true
        type: string
      artifact:
        description: "Name of the results artifact the test job uploads"
        required: true
        type: string
      suites:
        description: "One per line: LABEL=gtest:GLOB or LABEL=pytest:FILE[#N], paths inside the artifact"
        required: true
        type: string
      meta:
        description: "Optional, one per line: LABEL=VALUE metadata rows (@PATH reads PATH from the artifact)"
        type: string
        default: ""
      strip:
        description: "Optional, one per line: substrings to drop from test names in the email"
        type: string
        default: ""
    secrets:
      webhook_url:
        description: "Where to POST the report; without it the job skips with a notice"
        required: false
      system_label:
        description: "Optional System row (a secret, so its value stays out of the logs)"
        required: false

permissions:
  contents: read
  actions: read  # the test job's steps, and the previous nightly's results

jobs:
  report:
    name: Report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts

      - name: Download the test results
        id: results
        # Absent when the test job never got far enough to upload them; the report says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: results

      - name: Send the report
        env:
          WEBHOOK_URL: ${{ secrets.webhook_url }}
          SYSTEM_LABEL: ${{ secrets.system_label }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          TEST_JOB: ${{ inputs.test_job }}
          ARTIFACT: ${{ inputs.artifact }}
          SUITES: ${{ inputs.suites }}
          META: ${{ inputs.meta }}
          STRIP: ${{ inputs.strip }}
          DOWNLOADED: ${{ steps.results.outcome }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK_URL" ] || { echo "::notice::No webhook_url secret; no report sent"; exit 0; }
          args=(--results results --title "$TITLE" --artifact "$ARTIFACT" --webhook-url "$WEBHOOK_URL")
          # Each input holds one value per line.
          add() { while IFS= read -r line; do [ -z "$line" ] || args+=("$1" "$line"); done <<<"$2"; }
          add --suite "$SUITES"
          add --meta "$META"
          add --strip "$STRIP"
          [ "$DOWNLOADED" = success ] || args+=(--warn "No artifact named '$ARTIFACT' in this run")
          # The test job's runner and step results, without GitHub's own setup steps.
          job="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == $ENV.TEST_JOB)')"
          if [ -z "$job" ]; then
            args+=(--warn "No job named '$TEST_JOB' in this run")
          else
            export TEST_RUNNER_NAME="$(jq -r '.runner_name // ""' <<<"$job")"
            args+=(--steps "$(jq -r '["Test job=\(.conclusion // "failure")"]
              + [(.steps // [])[]
                 | select(.name | test("^(Set up job|Complete job|Initialize containers|Stop containers|Post )") | not)
                 | "\(.name)=\(.conclusion // .status)"] | join(", ")' <<<"$job")")
          fi
          python3 .github/scripts/nightly_test_report.py "${args[@]}"
