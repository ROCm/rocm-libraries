name: Component CI

on:
  push:
    branches:
      - develop
      - release/therock-*
  pull_request:
  workflow_dispatch:
    inputs:
      linux_build_runner:
        description: Override for the default Linux build runner
        type: string
        default: ""
      windows_build_runner:
        description: Override for the default Windows build runner
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Configure CI"
    runs-on: ubuntu-24.04
    outputs:
      stinkytofu: ${{ steps.configure.outputs.stinkytofu }}
      rocisa: ${{ steps.configure.outputs.rocisa }}
      geko: ${{ steps.configure.outputs.geko }}
      miopen: ${{ steps.configure.outputs.miopen }}
      tensilelite-coverage: ${{ steps.configure.outputs.tensilelite_coverage }}
      logic-corpus: ${{ steps.configure.outputs.hipblaslt_logic_corpus }}
      hipblaslt-rocjitsu-scripts: ${{ steps.configure.outputs.hipblaslt_rocjitsu_scripts }}
      docker-image: ${{ steps.env.outputs.docker-image }}
      linux-runner: ${{ inputs.linux_build_runner || fromJSON(steps.ci-runners.outputs.build-runners).linux.default }}
      windows-runner: ${{ inputs.windows_build_runner || fromJSON(steps.ci-runners.outputs.build-runners).windows.default }}
      therock-ref: ${{ steps.env.outputs.therock-ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github/actions/ci-env
            .github/actions/ci-runners
            .github/scripts/ci_utils.py
            .github/scripts/component_ci.py
            .github/scripts/tests/test_component_ci_paths.py
          fetch-depth: 2
      - name: Test component CI path selection
        run: python .github/scripts/tests/test_component_ci_paths.py
      - uses: ./.github/actions/ci-env
        id: env
      - uses: ./.github/actions/ci-runners
        id: ci-runners
      - name: Detect changed components
        id: configure
        run: python .github/scripts/component_ci.py

  stinkytofu:
    name: "StinkyTofu"
    needs: changes
    if: needs.changes.outputs.stinkytofu == 'true'
    uses: ./.github/workflows/component-ci-stinkytofu.yml
    with:
      docker_image: ${{ needs.changes.outputs.docker-image }}
      linux_runner: ${{ needs.changes.outputs.linux-runner }}
      windows_runner: ${{ needs.changes.outputs.windows-runner }}

  rocisa:
    name: "rocISA"
    needs: changes
    if: needs.changes.outputs.rocisa == 'true'
    uses: ./.github/workflows/component-ci-rocisa.yml
    with:
      docker_image: ${{ needs.changes.outputs.docker-image }}
      linux_runner: ${{ needs.changes.outputs.linux-runner }}
      windows_runner: ${{ needs.changes.outputs.windows-runner }}

  geko:
    name: "GEKO"
    needs: changes
    if: needs.changes.outputs.geko == 'true'
    uses: ./.github/workflows/component-ci-geko.yml
    with:
      docker_image: ${{ needs.changes.outputs.docker-image }}
      linux_runner: ${{ needs.changes.outputs.linux-runner }}
      windows_runner: ${{ needs.changes.outputs.windows-runner }}

  miopen:
    name: "MIOpen"
    needs: changes
    if: needs.changes.outputs.miopen == 'true'
    uses: ./.github/workflows/component-ci-miopen.yml
    with:
      linux_runner: ${{ needs.changes.outputs.linux-runner }}

  tensilelite-coverage:
    name: "TensileLite coverage"
    needs: changes
    if: needs.changes.outputs.tensilelite-coverage == 'true'
    uses: ./.github/workflows/component-ci-tensilelite-coverage.yml
    with:
      docker_image: ${{ needs.changes.outputs.docker-image }}
      linux_runner: ${{ needs.changes.outputs.linux-runner }}

  logic-corpus:
    name: "hipBLASLt logic corpus"
    needs: changes
    if: needs.changes.outputs.logic-corpus == 'true'
    uses: ./.github/workflows/component-ci-logic-corpus.yml

  hipblaslt-rocjitsu-scripts:
    name: "hipBLASLt rocjitsu scripts"
    needs: changes
    if: needs.changes.outputs.hipblaslt-rocjitsu-scripts == 'true'
    uses: ./.github/workflows/component-ci-hipblaslt-rocjitsu-scripts.yml

  component-ci-summary:
    name: "Component CI Summary"
    if: always()
    # changes is listed so that a Configure CI failure fails the summary instead
    # of leaving only skipped components, and so needs.changes resolves below.
    needs:
      - changes
      - stinkytofu
      - rocisa
      - geko
      - miopen
      - tensilelite-coverage
      - logic-corpus
      - hipblaslt-rocjitsu-scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.changes.outputs.therock-ref }}
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJson(needs) }}'
