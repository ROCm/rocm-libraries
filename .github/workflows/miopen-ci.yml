name: MIOpen CI

on:
  push:
    branches:
      - develop
      - release/therock-*
    paths:
      - 'projects/miopen/**'
      - '.github/workflows/miopen-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/miopen/**'
      - '.github/workflows/miopen-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# YAML anchors for steps shared across all build jobs
.miopen-health-check: &miopen-health-check
  name: Runner health status
  run: |
    echo "=== OS ==="
    head -2 /etc/os-release
    echo "=== CPU ==="
    lscpu | grep -E 'Model name|^CPU\(s\)'
    echo "=== Memory ==="
    free -h | grep Mem
    echo "=== Disk ==="
    df -h /

.miopen-checkout: &miopen-checkout
  name: Checkout repository
  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
  with:
    sparse-checkout: |
      .dvc
      .github
      cmake
      projects/miopen
      shared/ctest

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  miopen-no-ck-build:
    name: MIOpen Hip Debug NOCK Build-Only
    permissions:
      id-token: write
    container:
      image: rocm/miopen-dev:latest
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
    steps:
      - *miopen-health-check
      - *miopen-checkout

      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
          -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
          -DCMAKE_BUILD_TYPE=debug \
          -DCMAKE_CXX_FLAGS_DEBUG='-g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined -Wno-option-ignored ' \
          -DBUILD_DEV=OFF \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install \
          -DMIOPEN_USE_MLIR=OFF \
          -DMIOPEN_GPU_SYNC=OFF \
          -DMIOPEN_USE_COMPOSABLEKERNEL=OFF \
          -DCMAKE_PREFIX_PATH=/opt/rocm \
          -DGPU_TARGETS="$GPU_TARGET"

      - name: Build
        run: |
          export LLVM_PATH=/opt/rocm/llvm
          export CTEST_PARALLEL_LEVEL=4
          cmake --build build --target install -j$(nproc)

  miopen-hip-package-build:
    name: MIOpen Build Hip Package
    permissions:
      id-token: write
    container:
      image: rocm/miopen-dev:latest
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
    steps:
      - *miopen-health-check
      - *miopen-checkout

      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
          -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
          -DCMAKE_BUILD_TYPE=release \
          -DBUILD_DEV=OFF \
          -DMIOPEN_TEST_DISCRETE=OFF \
          -DMIOPEN_USE_MLIR=ON \
          -DMIOPEN_GPU_SYNC=OFF \
          -DCMAKE_PREFIX_PATH=/opt/rocm \
          -DGPU_TARGETS="$GPU_TARGET"

      - name: Build
        run: |
          export LLVM_PATH=/opt/rocm/llvm
          export CTEST_PARALLEL_LEVEL=4
          cmake --build build --target miopen_gtest --target package --target miopen_gtest_check -j$(nproc)

  miopen-no-gpu-debug-build:
    name: MIOpen HipNoGPU Debug Build-Only
    permissions:
      id-token: write
    container:
      image: rocm/miopen-dev:latest
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    runs-on: azure-linux-scale-rocm
    steps:
      - *miopen-health-check
      - *miopen-checkout

      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
          -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
          -DCMAKE_BUILD_TYPE=debug \
          -DCMAKE_CXX_FLAGS_DEBUG='-g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined -Wno-option-ignored ' \
          -DBUILD_DEV=ON \
          -DMIOPEN_USE_MLIR=OFF \
          -DMIOPEN_GPU_SYNC=OFF \
          -DMIOPEN_BACKEND=HIPNOGPU \
          -DMIOPEN_INSTALL_CXX_HEADERS=ON \
          -DCMAKE_PREFIX_PATH=/opt/rocm

      - name: Build
        run: |
          export LLVM_PATH=/opt/rocm/llvm
          export CTEST_PARALLEL_LEVEL=4
          cmake --build build -j$(nproc)

  miopen-tuna-fin-build:
    name: MIOpen Tuna Fin Build-Only
    permissions:
      id-token: write
    container:
      image: rocm/miopen-dev:latest
      options: -v /runner/config:/home/awsconfig/
    strategy:
      fail-fast: true
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
    steps:
      - *miopen-health-check
      - *miopen-checkout

      - name: Configure build
        run: |
          export PATH=/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH
          export CXX=/opt/rocm/llvm/bin/clang++
          export CXXFLAGS=-Werror
          rm -rf projects/miopen/install
          mkdir projects/miopen/install
          cmake -S projects/miopen -B build \
          -DMIOPEN_TEST_FLAGS=' --disable-verification-cache ' \
          -DCMAKE_BUILD_TYPE=release \
          -DBUILD_DEV=OFF \
          -DMIOPEN_INSTALL_CXX_HEADERS=ON \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install \
          -DMIOPEN_USE_MLIR=ON \
          -DMIOPEN_GPU_SYNC=OFF \
          -DMIOPEN_BACKEND=HIPNOGPU \
          -DCMAKE_PREFIX_PATH=/opt/rocm \
          -DGPU_TARGETS="$GPU_TARGET"

      - name: Build MIOpen
        run: |
          export LLVM_PATH=/opt/rocm/llvm
          export CTEST_PARALLEL_LEVEL=4
          cmake --build build --target install --target all -j$(nproc)

      - name: Configure Tuna Fin
        run: |
          export CXX=/opt/rocm/llvm/bin/clang++
          cmake -S projects/miopen/fin -B build-fin \
            -DCMAKE_PREFIX_PATH=$(pwd)/projects/miopen/install \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/projects/miopen/install \
            -DCMAKE_BUILD_TYPE=release

      - name: Build Tuna Fin
        run: |
          cmake --build build-fin --target install -j$(nproc)

  miopen_build_summary:
    name: MIOpen CI Summary
    if: always()
    needs:
      - miopen-no-ck-build
      - miopen-hip-package-build
      - miopen-no-gpu-debug-build
      - miopen-tuna-fin-build
    
    runs-on: ubuntu-24.04
    steps:
      - name: Report results
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "Failed jobs: ${FAILED_JOBS}"
            exit 1
          fi
