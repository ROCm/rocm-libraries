name: "Component CI: Library UID Uniqueness"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: projects/hipblaslt/tensilelite
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run Library UID uniqueness gate
        run: python -m tox -e library-uniqueness
