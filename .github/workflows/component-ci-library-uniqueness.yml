name: "Component CI: Library UID Uniqueness"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: projects/hipblaslt/tensilelite
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Logic YAML is the corpus under test. The other two directories
          # supply tox.ini, SolutionIdGen.py, and the uniqueness test.
          # Parent-directory files such as tox.ini are included with them.
          sparse-checkout: |
            projects/hipblaslt/library/src/amd_detail/rocblaslt/src/Tensile/Logic
            projects/hipblaslt/tensilelite/tensilelite/Common
            projects/hipblaslt/tensilelite/tensilelite/Tests/unit
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run Library UID uniqueness gate
        run: python -m tox -e library-uniqueness
