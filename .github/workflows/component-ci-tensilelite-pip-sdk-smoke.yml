# TensileLite with TheRock's pip-installed ROCm SDK, on a CPU runner: the newest
# nightly rocm-sdk-core plus TensileLite from this checkout. It checks that
# TensileLite selects the Python SDK and finds its tools through the
# interpreter's scripts directory. No other rocm-libraries job runs TensileLite
# with the pip SDK in the same interpreter.
#
# Component CI calls it for pull requests that touch the runtime selection; the
# daily schedule catches SDK regressions without a pull request. A failure that
# also reproduces on develop is an SDK regression: the job summary names the
# rocm-sdk-core nightly that was tested.
name: "Component CI: TensileLite pip SDK smoke"

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Daily, after the nightly SDK is published.
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  linux:
    name: Linux (CPU, newest nightly rocm-sdk-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hipblaslt/tensilelite
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install tox
        run: python -m pip install tox

      - name: Run the pip SDK smoke check
        working-directory: projects/hipblaslt/tensilelite
        run: tox -e pip-sdk-smoke
