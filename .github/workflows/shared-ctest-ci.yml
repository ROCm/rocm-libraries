name: Shared CTest CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'shared/ctest/**'
      - 'CMakeLists.txt'
      - '.github/workflows/shared-ctest-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  optional-args-regression:
    name: Optional Argument Regression
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            shared/ctest

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pyyaml

      - name: Configure optional argument regression fixture
        run: |
          cmake -S shared/ctest/tests/optional_args_scope \
            -B build/shared-ctest-optional-args-scope-test \
            -DROCM_LIBRARIES_ROOT="$PWD"
