# SCRATCH ONLY (DO NOT MERGE): self-build validation of the gfx1250 HW test.
# Builds hipBLASLt + TensileLite FROM SOURCE against the host /opt/rocm (no
# prebuilt artifact, no build_run_id) — mirrors the from-source nightly build.
# Running the tensilelite client fresh (not --prebuilt-client) fixes the
# register-width verifier skew that bit the prebuilt path.
#
# Host-context (no container): needed for /opt/rocm + amdgpu (re)bind.

name: gfx1250 HW self-build (scratch)
run-name: ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [users/aramalin/gfx1250-workflow-scratch]
  workflow_dispatch:
    inputs:
      run_hipblaslt:
        description: "Run the hipBLASLt gtest suite"
        type: boolean
        default: true
      run_tensilelite:
        description: "Run the TensileLite common tests"
        type: boolean
        default: true
      tensilelite_pytest_k:
        description: "pytest -k expression for TensileLite common tests"
        type: string
        default: ""
      hipblaslt_gtest_filter:
        description: "hipBLASLt --gtest_filter (e.g. -*MX* to exclude MXFP). Empty = run all."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gfx1250-selfbuild:
    name: gfx1250 self-build hipBLASLt + TensileLite
    if: ${{ github.event_name == 'push' || inputs.run_hipblaslt || inputs.run_tensilelite }}
    runs-on: blas-rocm-mi455-sandbox
    timeout-minutes: 360
    # Build INSIDE a container (clean, reproducible env; matches the prod test
    # container). The host /opt/rocm is mounted read-only as the ROCm toolchain,
    # and ccache persists on a host mount so repeat builds are incremental.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --user 0:0
      volumes:
        - /opt/rocm:/opt/rocm:ro
        - /scratch/ccache:/ccache
    defaults:
      run:
        shell: bash
    env:
      GFX1250_HW_XFAIL: "1"
      GTEST_PRINT_TIME: "0"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "20G"
    steps:
      - name: Checkout hipBLASLt + shared deps (sparse, this commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            projects/hipblaslt
            shared/origami
            shared/rocroller
            shared/mxdatagenerator
            shared/stinkytofu
            cmake
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build hipBLASLt from source
        env:
          CC: /opt/rocm/lib/llvm/bin/amdclang
          CXX: /opt/rocm/lib/llvm/bin/amdclang++
          CMAKE_PREFIX_PATH: /opt/rocm
        run: |
          set -o pipefail
          export PATH="/opt/rocm/lib/llvm/bin:/opt/rocm/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          apt-get update -qq && apt-get install -y -qq ccache ninja-build || true
          export Tensile_ASM_COMPILER_LAUNCHER=ccache Tensile_CXX_COMPILER_LAUNCHER=ccache
          python3 -m pip install --upgrade pip
          pip install PyYAML joblib packaging msgpack "cmake==3.31.10" invoke pytest pytest-xdist pytest-timeout
          mkdir -p test_results tensilelite_test_results
          cd projects/hipblaslt
          ./install.sh -c -j 32 -a gfx1250 --skip_rocroller 2>&1 \
            | tee "$GITHUB_WORKSPACE/test_results/hipblaslt_build.log"

      - name: Run hipBLASLt tests
        timeout-minutes: 120
        if: ${{ github.event_name == 'push' || inputs.run_hipblaslt }}
        env:
          # Push defaults to skipping the known StreamK concurrent-streams deadlock;
          # dispatch honors the input (empty = run all).
          GTEST_FILTER_ARG: ${{ github.event_name == 'push' && '-*ConcurrentStreamsDoNotDeadlock*' || inputs.hipblaslt_gtest_filter }}
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          cd projects/hipblaslt
          export LD_LIBRARY_PATH="$PWD/build/release/library:$LD_LIBRARY_PATH"
          export HIPBLASLT_TENSILE_LIBPATH="$PWD/build/release/Tensile-gfx1250v0/library/gfx1250v0"
          FILTER=()
          [ -n "$GTEST_FILTER_ARG" ] && FILTER+=(--gtest_filter="$GTEST_FILTER_ARG")
          HIPBLASLT_TEST_TIMEOUT=3600 build/release/clients/hipblaslt-test "${FILTER[@]}" 2>&1 \
            | tee "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log"

      - name: Run TensileLite common tests
        timeout-minutes: 240
        if: ${{ always() && (github.event_name == 'push' || inputs.run_tensilelite) }}
        env:
          TL_PYTEST_K: ${{ inputs.tensilelite_pytest_k }}
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          cd projects/hipblaslt/tensilelite
          K_ARG=()
          [ -n "$TL_PYTEST_K" ] && K_ARG+=(-k "$TL_PYTEST_K")
          pip install -r requirements.txt
          # Fresh-built rocisa/tensilelite (fixes the prebuilt-client verifier skew).
          invoke build-client 2>&1 | tee "$GITHUB_WORKSPACE/tensilelite_test_results/build_client.log"
          pip install -r requirements-dev.txt -e . 2>&1 | tee "$GITHUB_WORKSPACE/tensilelite_test_results/build_rocisa.log"
          # No --prebuilt-client: use the freshly built client.
          pytest -p no:cacheprovider Tensile/Tests/common \
            -m "gfx1250 and not skip-gfx1250" "${K_ARG[@]}" --timeout=5400 -n 1 -v -rfxX \
            --gpu-targets gfx1250v0 \
            --global-parameters="LibraryFormat='msgpack'" \
            --tensile-options=--cxx-compiler,/opt/rocm/lib/llvm/bin/amdclang++ 2>&1 \
            | tee "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"

      - name: Redact wall-clock timing from logs
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log" \
                   "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"; do
            [ -f "$f" ] && sed -i -E 's/ in [0-9]+(\.[0-9]+)?s\b//g; s/ \([0-9]+ ms\)//g' "$f" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfx1250-selfbuild-results
          path: |
            test_results/
            tensilelite_test_results/
          if-no-files-found: warn
