# SELF-BUILD VALIDATION (DO NOT MERGE): builds hipBLASLt + TensileLite for
# gfx1250-strict FROM SOURCE against a pinned ROCm SDK and tests them in strict
# mode, as the gfx1250 nightly does. No prebuilt artifact, no build_run_id.

name: gfx1250 HW hipBLASLt + TensileLite Tests
run-name: ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [users/aramalin/gfx1250-strict-selfbuild]
  workflow_dispatch:
    inputs:
      run_hipblaslt:
        description: "Run the hipBLASLt gtest suite"
        type: boolean
        default: true
      run_tensilelite:
        description: "Run the TensileLite common tests"
        type: boolean
        default: true
      tensilelite_pytest_k:
        description: "pytest -k expression for TensileLite common tests"
        type: string
        default: ""
      hipblaslt_gtest_filter:
        description: "hipBLASLt --gtest_filter (e.g. -*MX* to exclude MXFP). Empty = run all."
        type: string
        default: ""
      rocm_sdk_version:
        description: "Nightly ROCm SDK (rocm package) version to build and test against"
        type: string
        default: "10.2.0a20261007"
      allow_toolchain_mismatch:
        description: "Run even if the SDK's compiler differs from the one this branch's TheRock pin builds with"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gfx1250-selfbuild:
    name: gfx1250-strict self-build hipBLASLt + TensileLite
    if: ${{ github.event_name == 'push' || inputs.run_hipblaslt || inputs.run_tensilelite }}
    runs-on: blas-rocm-mi455-sandbox
    timeout-minutes: 600
    # The ROCm SDK comes from the nightly pip index, not the host /opt/rocm: it
    # must be new enough to compile and run gfx1250-strict. ccache, pip and BLIS
    # persist on host mounts so repeat builds are incremental.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --user 0:0
      volumes:
        - /scratch/ccache:/ccache
        - /scratch/pip-cache:/pip-cache
        - /scratch/blis:/blis:ro
    defaults:
      run:
        shell: bash
    env:
      # Run both suites as gfx1250-strict.
      HSA_DISABLE_GFX12_STRICT: "0"
      GTEST_PRINT_TIME: "0"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PYTHONUNBUFFERED: "1"
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "20G"
      PIP_CACHE_DIR: /pip-cache
      # awk filter for all test and build logs: drops the device banner lines, redacts
      # product names and amd.com hostnames, and blanks client CSV columns that carry hardware
      # data, are derived from the CU count or clocks, or are timing.
      # Use: awk -F, -v OFS=, "$HW_SCRUB"
      HW_SCRUB: |
        /Query[[:space:]]+device|Device[[:space:]]+ID[[:space:]]+[0-9]|PCI[[:space:]]+Chip[[:space:]]+ID|GB[[:space:]]+memory|SCLK|MCLK|compute[[:space:]]+capability|maxGridDimX|sharedMemPerBlock|maxThreadsPerBlock|warpSize/ { next }
        { gsub(/[Mm][Ii][0-9][0-9][0-9][A-Za-z]*|[A-Za-z0-9.-]+[.]amd[.]com/, "<redacted>") }
        /^run,problem-progress,/ {
          n = split("num-cus tiles-per-cu total-gran cu-gran wave-gran temp-edge clock-sys clock-soc clock-mem fan-rpm hardware-samples gfx-frequency(maximum) time-us gflops gflops-per-cu fastest-gflops peak-gflops efficiency gbps-bandwidth enqueue-time rocprof-counters", s, " ")
          for (k in fe) delete fe[k]
          for (i = 1; i <= NF; i++) for (j = 1; j <= n; j++) if ($i == s[j]) fe[NF - i] = 1
          hdr = 1
        }
        hdr && /^[0-9]+,[0-9]+\/[0-9]+,/ { for (k in fe) $(NF - k) = "" }
        { print; fflush() }
    steps:
      - name: Checkout hipBLASLt + shared deps (sparse, this commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            projects/hipblaslt
            shared/origami
            shared/rocroller
            shared/mxdatagenerator
            shared/stinkytofu
            cmake
            .github/actions/ci-env
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the ROCm SDK (gfx1250-strict capable)
        env:
          ROCM_SDK_VERSION: ${{ inputs.rocm_sdk_version || '10.2.0a20261007' }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip install --pre --index-url https://nightly.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel,device-gfx1250]==${ROCM_SDK_VERSION}"
          rocm-sdk init
          R="$(rocm-sdk path --root)"
          rocm-sdk path --bin >> "$GITHUB_PATH"
          echo "$R/lib/llvm/bin" >> "$GITHUB_PATH"
          {
            echo "ROCM_PATH=$R"
            echo "ROCM_HOME=$R"
            echo "HIP_DEVICE_LIB_PATH=$R/amdgcn/bitcode"
            echo "CMAKE_PREFIX_PATH=$R"
            echo "LD_LIBRARY_PATH=$R/lib:$R/lib/llvm/lib"
          } >> "$GITHUB_ENV"

      - name: Check the SDK compiler matches per-PR CI
        # Per-PR CI builds with the amd-llvm pinned at this branch's TheRock ref
        # (ci-env). Fail if the pip SDK was built with a different one.
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_MISMATCH: ${{ inputs.allow_toolchain_mismatch || false }}
        run: |
          set -euo pipefail
          REF="$(sed -nE '/therock-ref:/,/value:/ s/.*value: *"([0-9a-f]{40})".*/\1/p' .github/actions/ci-env/action.yml)"
          [ -n "$REF" ] || { echo "::error::no therock-ref in .github/actions/ci-env/action.yml"; exit 1; }
          python3 - "$REF" <<'EOF'
          import glob, json, os, subprocess, sys, urllib.request
          ref = sys.argv[1]
          req = urllib.request.Request(
              f"https://api.github.com/repos/ROCm/TheRock/contents/compiler/amd-llvm?ref={ref}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"})
          want = json.load(urllib.request.urlopen(req))["sha"]
          root = subprocess.run(["rocm-sdk", "path", "--root"], capture_output=True, text=True, check=True).stdout.strip()
          site = os.path.dirname(root)
          found = [p for p in [f"{root}/share/therock/therock_manifest.json",
                               *glob.glob(f"{site}/_rocm_sdk_*/share/therock/therock_manifest.json")]
                   if os.path.isfile(p)]
          if not found:
              print("::error::the ROCm SDK ships no therock_manifest.json; cannot tell which compiler built it")
              sys.exit(1)
          subs = json.load(open(found[0])).get("submodules", [])
          have = next((s.get("pin_sha", "") for s in subs if s.get("submodule_name") == "llvm-project"), "")
          if not have:
              print(f"::error::{found[0]} has no llvm-project pin_sha")
              sys.exit(1)
          print(f"TheRock {ref[:10]} pins amd-llvm {want[:10]}; SDK built with {have[:10]}")
          if have == want:
              sys.exit(0)
          out = subprocess.run([sys.executable, "-m", "pip", "index", "versions", "rocm", "--pre",
                                "--index-url", "https://nightly.repo.amd.com/rocm/whl-next/"],
                               capture_output=True, text=True).stdout
          latest = next((l.split(":", 1)[1].split(",")[0].strip() for l in out.splitlines()
                         if l.startswith("Available versions:")), "unknown")
          msg = (f"SDK compiler {have[:10]} != per-PR CI compiler {want[:10]} (TheRock {ref[:10]}). "
                 f"Newest nightly is {latest}: set rocm_sdk_version's default to a nightly built with {want[:10]}.")
          if os.environ["ALLOW_MISMATCH"] == "true":
              print(f"::warning::{msg} Continuing: allow_toolchain_mismatch is set.")
          else:
              print(f"::error::{msg}")
              sys.exit(1)
          EOF

      - name: Check the runtime reports gfx1250-strict
        # Fail before the long build if strict mode is not in effect. Uses the same
        # detection tox uses for the client target; prints arch names only.
        run: |
          ARCH="$(python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ga", "projects/hipblaslt/tensilelite/tensilelite/GpuArch.py")
          ga = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ga)
          a = ga.detect_gpu_arch()
          print(ga.cmake_gpu_target(a) if a else "")
          EOF
          )"
          [ "$ARCH" = gfx1250-strict ] \
            || { echo "::error::runtime reports '${ARCH:-no GPU}', not gfx1250-strict"; exit 1; }

      - name: Build hipBLASLt from source
        run: |
          set -o pipefail
          apt-get update -qq && apt-get install -y -qq ccache ninja-build make libopenblas-dev libmsgpack-cxx-dev zlib1g-dev libgtest-dev libgmock-dev libzstd-dev || true
          export CC="$ROCM_PATH/lib/llvm/bin/amdclang" CXX="$ROCM_PATH/lib/llvm/bin/amdclang++"
          export Tensile_ASM_COMPILER_LAUNCHER=ccache Tensile_CXX_COMPILER_LAUNCHER=ccache
          # Ninja like TheRock's build; cmake would otherwise default to Unix Makefiles.
          export CMAKE_GENERATOR=Ninja
          pip install PyYAML joblib packaging msgpack "cmake==3.31.10" invoke pytest pytest-xdist pytest-timeout tox
          mkdir -p test_results tensilelite_test_results
          cd projects/hipblaslt
          # Reuse pre-staged BLIS from the host mount (skips the per-run download);
          # an empty/absent mount falls through to install.sh's own download.
          mkdir -p build/deps && cp -a /blis build/deps/blis 2>/dev/null || true
          # Redact ROCm/compiler versions and anything HW_SCRUB catches from the console.
          ./install.sh -c -j 32 -a gfx1250-strict --skip_rocroller 2>&1 \
            | sed -E 's/[Cc]lang( version)? [0-9.]+/clang <ver>/g; s/ROCm[ -]?[0-9.]+/ROCm <ver>/g' \
            | awk -F, -v OFS=, "$HW_SCRUB"

      - name: Run hipBLASLt tests
        timeout-minutes: 120
        if: ${{ github.event_name == 'push' || inputs.run_hipblaslt }}
        env:
          GTEST_FILTER_ARG: ${{ inputs.hipblaslt_gtest_filter }}
          # StreamKMultiStream.ConcurrentStreamsDoNotDeadlock fails without it.
          HSA_HOTSWAP_DISABLE: "1"
        run: |
          set -o pipefail
          cd projects/hipblaslt
          INSTALL="$PWD/hipblaslt-install"
          export LD_LIBRARY_PATH="$INSTALL/lib:$LD_LIBRARY_PATH"
          # No HIPBLASLT_TENSILE_LIBPATH: the runtime loads library/gfx1250-strict/.
          unset HIPBLASLT_TENSILE_LIBPATH
          export HIPBLASLT_TEST_TIMEOUT=3600
          BIN=build/release/clients/hipblaslt-test
          # Must link the libhipblaslt built here (install or build tree), not the
          # SDK's copy that is also on LD_LIBRARY_PATH.
          LIB="$(ldd "$BIN" | awk '/libhipblaslt\.so/{print $3; exit}')"
          case "$LIB" in
            "$INSTALL"/*|"$PWD"/build/*) ;;
            *) echo "::error::hipblaslt-test links '${LIB:-nothing}', not the libhipblaslt built here"; exit 1 ;;
          esac
          # The strict library must exist with its code objects labelled
          # gfx1250-strict: a stale bundler leaves the label empty, and then no
          # GEMM kernel loads. Messages name no file: library file names carry
          # hardware predicates.
          CO="$(find "$INSTALL/lib/hipblaslt/library/gfx1250-strict" -name 'TensileLibrary*.co' -print -quit 2>/dev/null)"
          [ -n "$CO" ] || { echo "::error::the build produced no gfx1250-strict hipBLASLt library"; exit 1; }
          IDS="$("$ROCM_PATH/lib/llvm/bin/clang-offload-bundler" --list --type=o --input="$CO")" \
            || { echo "::error::cannot list a hipBLASLt code object with the SDK's clang-offload-bundler"; exit 1; }
          grep -q -- '-gfx1250-strict$' <<<"$IDS" \
            || { echo "::error::hipBLASLt code objects are not labelled gfx1250-strict"; exit 1; }
          FILTER=()
          [ -n "$GTEST_FILTER_ARG" ] && FILTER+=(--gtest_filter="$GTEST_FILTER_ARG")
          # Full suite in one pass.
          "$BIN" "${FILTER[@]}" 2>&1 | awk -F, -v OFS=, "$HW_SCRUB" | tee "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log"

      - name: Run TensileLite common tests (fresh client)
        timeout-minutes: 350
        if: ${{ always() && (github.event_name == 'push' || inputs.run_tensilelite) }}
        env:
          TL_PYTEST_K: ${{ inputs.tensilelite_pytest_k }}
        run: |
          set -o pipefail
          cd projects/hipblaslt/tensilelite
          K_ARG=()
          [ -n "$TL_PYTEST_K" ] && K_ARG+=(-k "$TL_PYTEST_K")
          pip install -r requirements.txt
          pip install -r requirements-dev.txt -e .
          # As the nightly: tox builds the client for the reported target
          # (gfx1250-strict here) and runs the common tests against it.
          tox -v -e py3 -- tensilelite/Tests -m common "${K_ARG[@]}" --timeout=600 -n 1 -rfxX \
            --deselect="tensilelite/Tests/common/flags/gfx942/test_build_only.py::test_compile" 2>&1 \
            | awk -F, -v OFS=, "$HW_SCRUB" | tee "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"

      - name: Redact wall-clock timing from logs
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log" \
                   "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"; do
            [ -f "$f" ] && sed -i -E 's/ in [0-9]+(\.[0-9]+)?s\b//g; s/ \([0-9]+ ms\)//g' "$f" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfx1250-strict-selfbuild-results
          path: |
            test_results/
            tensilelite_test_results/
          if-no-files-found: warn
