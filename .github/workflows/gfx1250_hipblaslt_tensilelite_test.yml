# hipBLASLt + TensileLite tests on a gfx1250 runner, run against a prebuilt ROCm
# artifact inside a container.
#
# Per-PR: runs when a PR's "TheRock Multi-Arch CI" run completes, if the PR is by a
# ROCm org member, touches hipBLASLt/TensileLite, and the build produced a
# gfx1250-strict blas artifact. Otherwise it skips. Both triggers install with the
# TheRock commit that built the artifact (the build's therock_manifest.json).
# On-demand: workflow_dispatch with the run-id of a gfx1250-strict build, no gating.
#
# Both triggers dedup by PR (by build if it maps to no PR): a newer run supersedes.
# workflow_run/dispatch runs attach to develop, not the PR, so the result is posted to
# the PR head as a commit status, from GitHub-hosted jobs so the token that can write
# it never reaches the self-hosted runner.

name: gfx1250 HW hipBLASLt + TensileLite Tests
run-name: ${{ github.event_name == 'workflow_run' && format('PR build {0} @ {1}', github.event.workflow_run.id, github.event.workflow_run.head_sha) || format('{0} @ {1}', github.ref_name, github.sha) }}

on:
  workflow_run:
    workflows: ["TheRock Multi-Arch CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "CI run-id of the PR's gfx1250-strict build"
        type: string
        required: true
      build_repo:
        description: "Repo that produced the artifact (e.g. ROCm/TheRock for validation)"
        type: string
        default: "ROCm/rocm-libraries"
      run_hipblaslt:
        description: "Run the hipBLASLt gtest suite"
        type: boolean
        default: true
      run_tensilelite:
        description: "Run the TensileLite common tests"
        type: boolean
        default: true
      tensilelite_pytest_k:
        description: "pytest -k expression for TensileLite common tests"
        type: string
        default: ""
      hipblaslt_gtest_filter:
        description: "hipBLASLt --gtest_filter (e.g. -*MX* to exclude MXFP). Empty = run all."
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  STATUS_CONTEXT: "gfx1250-strict HW / hipBLASLt + TensileLite"

jobs:
  resolve:
    name: Resolve PR build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      run: ${{ steps.r.outputs.run }}
      build_run_id: ${{ steps.r.outputs.build_run_id }}
      build_repo: ${{ steps.r.outputs.build_repo }}
      head_sha: ${{ steps.r.outputs.head_sha }}
      dedup_key: ${{ steps.r.outputs.dedup_key }}
      therock_ref: ${{ steps.r.outputs.therock_ref }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          BUILD_REPO: ${{ github.event_name == 'workflow_run' && github.repository || inputs.build_repo || github.repository }}
          PR_FROM_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$RUN_ID" ] || { echo "::error::No build run-id: provide the PR's gfx1250-strict build_run_id"; exit 1; }
          skip() { echo "::notice::Skipping: $*"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # The build's artifacts, in the bucket TheRock's s3_buckets.py picks for it.
          if [ "$BUILD_REPO" = "ROCm/TheRock" ]; then
            ARTIFACTS="https://therock-ci-artifacts.s3.amazonaws.com/${RUN_ID}-linux"
          else
            ARTIFACTS="https://therock-ci-artifacts-external.s3.amazonaws.com/${BUILD_REPO/\//-}/${RUN_ID}-linux"
          fi
          go() {
            # Install with the TheRock commit that built the artifact (the PR branch's
            # pin), from the build's own manifest.
            REF="$(curl -sf "$ARTIFACTS/manifests/therock_manifest.json" | jq -r '.the_rock_commit // empty' || true)"
            [[ "$REF" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::build $RUN_ID has no TheRock manifest; cannot tell which TheRock built it"; exit 1; }
            pending
            { echo "run=true"; echo "build_run_id=$RUN_ID"; echo "build_repo=$BUILD_REPO"; echo "dedup_key=$1"; echo "therock_ref=$REF"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Map the build to its open PR, for both triggers. Fork PRs leave
          # workflow_run.pull_requests empty, so look the PR up by the build's head SHA.
          HEAD_SHA=""; PR="$PR_FROM_EVENT"
          if [ "$BUILD_REPO" = "$REPO" ]; then
            HEAD_SHA="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)"
            [ -n "$PR" ] || PR="$(gh pr list --repo "$REPO" --state open --search "$HEAD_SHA" --json number --jq '.[0].number // empty')"
          fi
          PR_JSON=""
          [ -z "$PR" ] || PR_JSON="$(gh pr view "$PR" --repo "$REPO" --json headRefOid,labels)"
          IS_HEAD=false
          [ -n "$PR_JSON" ] && [ "$(jq -r .headRefOid <<<"$PR_JSON")" = "$HEAD_SHA" ] && IS_HEAD=true

          # One dedup key for both triggers: the PR when the build maps to one, else
          # the build. A newer run for the same PR (push or dispatch) supersedes.
          KEY="build-$RUN_ID"; [ -n "$PR" ] && KEY="pr-$PR"

          pending() {
            # Only the PR's current head carries the status; older commits don't show.
            [ "$IS_HEAD" = true ] || return 0
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=pending -f context="$STATUS_CONTEXT" \
              -f description="Queued for the gfx1250 runner" -f target_url="$RUN_URL" >/dev/null
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          }

          # A manual dispatch is a deliberate request: no gating.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            go "$KEY"
          fi

          [ -n "$PR" ] || skip "no open PR for $HEAD_SHA"
          [ "$IS_HEAD" = true ] || skip "PR #$PR has moved past $HEAD_SHA"

          # Org members only, including their forks. pr-org-label.yml sets these labels
          # from org membership; non-members never get them.
          jq -e '[.labels[].name] | any(. == "organization: ROCm" or . == "organization: streamhpc")' <<<"$PR_JSON" >/dev/null \
            || skip "PR #$PR author is not a ROCm org member"

          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | grep -qE '^(projects/hipblaslt|shared/(origami|stinkytofu|mxdatagenerator|rocroller))/' \
            || skip "PR #$PR does not touch hipBLASLt or TensileLite"

          # Needs the build's gfx1250-strict blas shard, whether it came from its own
          # gfx1250-strict stage or from gfx125X-dcgpu once TheRock folds strict into
          # that family. Stages upload artifacts only on success. PR builds without
          # strict skip rather than fail.
          curl -sf "https://therock-ci-artifacts-external.s3.amazonaws.com/?list-type=2&prefix=${REPO/\//-}/${RUN_ID}-linux/blas_lib_gfx1250-strict" \
            | grep -q "<Key>" || skip "build $RUN_ID has no gfx1250-strict blas artifact"

          # A re-run of the same build (same commit) must not restart a queued, running or
          # passed test. A failed one may be retried.
          # shellcheck disable=SC2016  # $c is a jq variable
          PREV="$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq --arg c "$STATUS_CONTEXT" '.statuses[] | select(.context == $c) | .state')"
          case "$PREV" in pending|success) skip "PR #$PR @ $HEAD_SHA already $PREV" ;; esac

          go "$KEY"

  gfx1250-tests:
    name: gfx1250 hipBLASLt + TensileLite
    needs: resolve
    if: needs.resolve.outputs.run == 'true' && (github.event_name == 'workflow_run' || inputs.run_hipblaslt || inputs.run_tensilelite)
    # Job-level so skipped resolves never cancel a running test.
    concurrency:
      group: ${{ github.workflow }}-${{ needs.resolve.outputs.dedup_key }}
      cancel-in-progress: true
    runs-on: blas-rocm-mi455-sandbox
    timeout-minutes: 360
    # Test container: no ROCm baked in, so the fetched artifact's libraries load
    # cleanly with no host /opt/rocm to shadow them. Same image + options TheRock's
    # component-test (pytest_runner) path uses.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      # GPU access: --group-add 993/992/110 are the render/video/kfd device group
      # GIDs on the ROCm runners (mirrors TheRock's _GPU_CONTAINER_OPTIONS).
      options: >-
        --ipc host
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --user 0:0
    defaults:
      run:
        shell: bash
    env:
      ROCM: ${{ github.workspace }}/rocm
      # TensileLite and HIP look up tools under ROCM_PATH first: keep them on the artifact's.
      ROCM_PATH: ${{ github.workspace }}/rocm
      LD_LIBRARY_PATH: ${{ github.workspace }}/rocm/lib:${{ github.workspace }}/rocm/lib/llvm/lib:${{ github.workspace }}/rocm/lib/rocm_sysdeps/lib
      # Run both suites as gfx1250-strict, against the gfx1250-strict artifact.
      HSA_DISABLE_GFX12_STRICT: "0"
      # awk filter for all test and build logs: drops the device banner lines, redacts
      # product names and amd.com hostnames, and blanks client CSV columns that carry hardware
      # data, are derived from the CU count or clocks, or are timing.
      # Use: awk -F, -v OFS=, "$HW_SCRUB"
      HW_SCRUB: |
        /Query[[:space:]]+device|Device[[:space:]]+ID[[:space:]]+[0-9]|PCI[[:space:]]+Chip[[:space:]]+ID|GB[[:space:]]+memory|SCLK|MCLK|compute[[:space:]]+capability|maxGridDimX|sharedMemPerBlock|maxThreadsPerBlock|warpSize/ { next }
        { gsub(/[Mm][Ii][0-9][0-9][0-9][A-Za-z]*|[A-Za-z0-9.-]+[.]amd[.]com/, "<redacted>") }
        /^run,problem-progress,/ {
          n = split("num-cus tiles-per-cu total-gran cu-gran wave-gran temp-edge clock-sys clock-soc clock-mem fan-rpm hardware-samples gfx-frequency(maximum) time-us gflops gflops-per-cu fastest-gflops peak-gflops efficiency gbps-bandwidth enqueue-time rocprof-counters", s, " ")
          for (k in fe) delete fe[k]
          for (i = 1; i <= NF; i++) for (j = 1; j <= n; j++) if ($i == s[j]) fe[NF - i] = 1
          hdr = 1
        }
        hdr && /^[0-9]+,[0-9]+\/[0-9]+,/ { for (k in fe) $(NF - k) = "" }
        { print; fflush() }
      GTEST_PRINT_TIME: "0"
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - name: Checkout TheRock (artifact install tooling)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: ${{ needs.resolve.outputs.therock_ref }}
          path: TheRock
          sparse-checkout: |
            build_tools
            cmake
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r TheRock/requirements-test.txt

      - name: Fetch prebuilt gfx1250 ROCm artifact
        id: fetch
        env:
          BUILD_RUN_ID: ${{ needs.resolve.outputs.build_run_id }}
          BUILD_REPO: ${{ needs.resolve.outputs.build_repo }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BUILD_RUN_ID" ]; then
            echo "::error::No build run-id: provide the PR's gfx1250-strict build_run_id"; exit 1
          fi
          set +e
          python TheRock/build_tools/install_rocm_from_artifacts.py \
            --run-id "$BUILD_RUN_ID" \
            --artifact-group gfx1250-strict \
            --blas --tests \
            --run-github-repo "$BUILD_REPO" \
            --output-dir "$ROCM" 2>&1 | tee fetch.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            # Fail closed: any fetch error is red, never a silent green. A narrow
            # skip for the reuse-baseline "missing artifact" case can be added once a
            # validation run reveals its exact signal.
            echo "::error::gfx1250 artifact fetch failed (RC=$RC). See fetch.log."
            {
              echo "### :x: gfx1250 artifact fetch FAILED — NOT tested"
              echo ""
              echo "Fetch for build run \`${BUILD_RUN_ID}\` failed (RC=$RC). If this was a"
              echo "reused-baseline build with no artifact under this run-id, that case gets an"
              echo "explicit narrow skip once its exact signal is confirmed — until then it is a"
              echo "red failure, never a silent green."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$RC"
          fi
          echo "$ROCM/bin" >> "$GITHUB_PATH"
          echo "$ROCM/lib/llvm/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$ROCM/lib" "$ROCM/lib/llvm/lib" "$ROCM/lib/rocm_sysdeps/lib" > /etc/ld.so.conf.d/rocm-artifact.conf
          ldconfig
          echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          echo "::group::Artifact layout"
          echo "Key binaries:"
          find "$ROCM" -type f \( -name hipblaslt-test -o -name tensilelite-client \) 2>/dev/null || true
          echo "::endgroup::"

      - name: Run hipBLASLt tests
        timeout-minutes: 120
        if: ${{ steps.fetch.outputs.artifact_ready == 'true' && (github.event_name == 'workflow_run' || inputs.run_hipblaslt) }}
        env:
          GTEST_FILTER_ARG: ${{ inputs.hipblaslt_gtest_filter }}
          # StreamKMultiStream.ConcurrentStreamsDoNotDeadlock fails without it.
          HSA_HOTSWAP_DISABLE: "1"
        run: |
          set -o pipefail  # a failing test must propagate through `| tee`, not be masked
          mkdir -p test_results
          HIPBLASLT_TEST="$(find "$ROCM" -type f -name hipblaslt-test | head -1)"
          if [ -z "$HIPBLASLT_TEST" ]; then
            echo "::error::hipblaslt-test not found in the fetched artifact"; exit 1
          fi
          echo "Using: $HIPBLASLT_TEST"
          # Must link the fetched artifact's libhipblaslt, not another copy.
          LIB="$(ldd "$HIPBLASLT_TEST" | awk '/libhipblaslt\.so/{print $3; exit}')"
          case "$LIB" in
            "$ROCM"/*) ;;
            *) echo "::error::hipblaslt-test links '${LIB:-nothing}', not the fetched artifact's libhipblaslt"; exit 1 ;;
          esac
          # The strict library must exist with its code objects labelled
          # gfx1250-strict: a stale bundler at build time leaves the label empty,
          # and then no GEMM kernel loads.
          CO="$(find "$ROCM/lib/hipblaslt/library/gfx1250-strict" -name 'TensileLibrary*.co' -print -quit 2>/dev/null)"
          [ -n "$CO" ] || { echo "::error::no gfx1250-strict hipBLASLt library; build_run_id must be a gfx1250-strict build"; exit 1; }
          IDS="$("$ROCM/lib/llvm/bin/clang-offload-bundler" --list --type=o --input="$CO")" \
            || { echo "::error::cannot list a hipBLASLt code object with the artifact's clang-offload-bundler"; exit 1; }
          grep -q -- '-gfx1250-strict$' <<<"$IDS" \
            || { echo "::error::hipBLASLt code objects are not labelled gfx1250-strict"; exit 1; }
          export HIPBLASLT_TEST_TIMEOUT=3600
          FILTER=()
          [ -n "$GTEST_FILTER_ARG" ] && FILTER+=(--gtest_filter="$GTEST_FILTER_ARG")
          # Full suite in one pass.
          "$HIPBLASLT_TEST" "${FILTER[@]}" 2>&1 | awk -F, -v OFS=, "$HW_SCRUB" | tee test_results/hipblaslt_test.log

      - name: Run TensileLite common tests
        timeout-minutes: 240
        if: ${{ always() && steps.fetch.outputs.artifact_ready == 'true' && (github.event_name == 'workflow_run' || inputs.run_tensilelite) }}
        env:
          TL_PYTEST_K: ${{ inputs.tensilelite_pytest_k }}
        run: |
          set -o pipefail  # a failing test must propagate through `| tee`, not be masked
          mkdir -p tensilelite_test_results
          export PYTHONPATH="$ROCM/share/hipblaslt/tensilelite:${PYTHONPATH:-}"
          cd "$ROCM/share/hipblaslt/tensilelite"
          K_ARG=()
          [ -n "$TL_PYTEST_K" ] && K_ARG+=(-k "$TL_PYTEST_K")
          # Common GEMM tests run against the prebuilt client. Per-test cap 5400s (90 min).
          TL_TARGET=gfx1250-strict
          # HIP device compiles through ccache.
          # Guarded: a missing ccache must never become a broken 'ccache <compiler>' call.
          if ! command -v ccache >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq ccache || echo "::warning::ccache unavailable; no kernel-assembly caching"
          fi
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR=/tmp/tl-ccache CCACHE_MAXSIZE=5G
            export Tensile_ASM_COMPILER_LAUNCHER=ccache Tensile_CXX_COMPILER_LAUNCHER=ccache
            ccache -z >/dev/null 2>&1 || true
          fi
          pytest -p no:cacheprovider tensilelite/Tests/common \
            -m common "${K_ARG[@]}" --timeout=5400 -n 1 -v -rfxX \
            --gpu-targets "$TL_TARGET" \
            --prebuilt-client="$ROCM/libexec/hipblaslt/tensilelite/tensilelite-client" \
            --global-parameters="LibraryFormat='msgpack'" \
            --tensile-options=--cxx-compiler,"$ROCM/bin/amdclang++" 2>&1 \
            | awk -F, -v OFS=, "$HW_SCRUB" | tee "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"

      - name: Redact wall-clock timing from logs
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log" \
                   "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"; do
            [ -f "$f" ] && sed -i -E 's/ in [0-9]+(\.[0-9]+)?s\b//g; s/ \([0-9]+ ms\)//g' "$f" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfx1250-test-results
          path: |
            test_results/
            tensilelite_test_results/
          if-no-files-found: warn

  report:
    name: Post PR status
    needs: [resolve, gfx1250-tests]
    # Superseded runs are cancelled; the newer run posts its own status.
    if: always() && needs.resolve.outputs.head_sha != '' && needs.gfx1250-tests.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          RESULT: ${{ needs.gfx1250-tests.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) STATE=success; DESC="hipBLASLt + TensileLite passed" ;;
            failure) STATE=failure; DESC="Tests failed" ;;
            *)       STATE=error;   DESC="Tests did not run ($RESULT)" ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$STATE" -f context="$STATUS_CONTEXT" \
            -f description="$DESC" -f target_url="$RUN_URL" >/dev/null
