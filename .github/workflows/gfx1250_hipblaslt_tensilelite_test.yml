# SELF-BUILD VALIDATION (DO NOT MERGE as-is — replaces the prebuilt on-demand
# path from #12164): builds hipBLASLt + TensileLite FROM SOURCE against the host
# /opt/rocm (no prebuilt artifact, no build_run_id) — mirrors the standalone
# nightly recipe. Running the tensilelite client fresh

name: gfx1250 HW hipBLASLt + TensileLite Tests
run-name: ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [users/aramalin/gfx1250-selfbuild-hw-test]
  workflow_dispatch:
    inputs:
      run_hipblaslt:
        description: "Run the hipBLASLt gtest suite"
        type: boolean
        default: true
      run_tensilelite:
        description: "Run the TensileLite common tests"
        type: boolean
        default: true
      tensilelite_pytest_k:
        description: "pytest -k expression for TensileLite common tests"
        type: string
        default: ""
      hipblaslt_gtest_filter:
        description: "hipBLASLt --gtest_filter (e.g. -*MX* to exclude MXFP). Empty = run all."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gfx1250-selfbuild:
    name: gfx1250 self-build hipBLASLt + TensileLite
    if: ${{ github.event_name == 'push' || inputs.run_hipblaslt || inputs.run_tensilelite }}
    runs-on: blas-rocm-mi455-sandbox
    timeout-minutes: 360
    # Build INSIDE a container (clean, reproducible env; matches the prod test
    # container). The host /opt/rocm is mounted read-only as the ROCm toolchain,
    # and ccache persists on a host mount so repeat builds are incremental.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --user 0:0
      volumes:
        - /opt/rocm:/opt/rocm:ro
        - /scratch/ccache:/ccache
        - /scratch/pip-cache:/pip-cache
        - /scratch/blis:/blis:ro
    defaults:
      run:
        shell: bash
    env:
      GFX1250_HW_XFAIL: "1"
      GTEST_PRINT_TIME: "0"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "20G"
      PIP_CACHE_DIR: /pip-cache
    steps:
      - name: Checkout hipBLASLt + shared deps (sparse, this commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: |
            projects/hipblaslt
            shared/origami
            shared/rocroller
            shared/mxdatagenerator
            shared/stinkytofu
            cmake
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build hipBLASLt from source
        env:
          CC: /opt/rocm/lib/llvm/bin/amdclang
          CXX: /opt/rocm/lib/llvm/bin/amdclang++
          CMAKE_PREFIX_PATH: /opt/rocm
        run: |
          set -o pipefail
          # Persist ROCm tools on PATH for later steps (rocm_agent_enumerator for
          # GPU-arch detect). $GITHUB_PATH prepends; a job-level env: PATH would clobber.
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/lib/llvm/bin" >> "$GITHUB_PATH"
          export PATH="/opt/rocm/lib/llvm/bin:/opt/rocm/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          apt-get update -qq && apt-get install -y -qq ccache ninja-build make libopenblas-dev || true
          export Tensile_ASM_COMPILER_LAUNCHER=ccache Tensile_CXX_COMPILER_LAUNCHER=ccache
          # Ninja like TheRock's build; cmake would otherwise default to Unix Makefiles.
          export CMAKE_GENERATOR=Ninja
          python3 -m pip install --upgrade pip
          pip install PyYAML joblib packaging msgpack "cmake==3.31.10" invoke pytest pytest-xdist pytest-timeout
          mkdir -p test_results tensilelite_test_results
          cd projects/hipblaslt
          # Reuse pre-staged BLIS from the host mount (skips the per-run download);
          # an empty/absent mount falls through to install.sh's own download.
          mkdir -p build/deps && cp -a /blis build/deps/blis 2>/dev/null || true
          # No artifact tee + redact host ROCm/compiler versions from the console.
          ./install.sh -c -j 32 -a gfx1250 --skip_rocroller 2>&1 \
            | sed -E 's/[Cc]lang( version)? [0-9.]+/clang <ver>/g; s/ROCm[ -]?[0-9.]+/ROCm <ver>/g'

      - name: Run hipBLASLt tests
        timeout-minutes: 120
        if: ${{ github.event_name == 'push' || inputs.run_hipblaslt }}
        env:
          GTEST_FILTER_ARG: ${{ inputs.hipblaslt_gtest_filter }}
          # Set on the test step, mirroring the nightly;
          # StreamKMultiStream.ConcurrentStreamsDoNotDeadlock wedges at iteration 0 without it.
          HSA_HOTSWAP_DISABLE: "1"
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          cd projects/hipblaslt
          export LD_LIBRARY_PATH="$PWD/build/release/library:/opt/rocm/lib:$LD_LIBRARY_PATH"
          export HIPBLASLT_TENSILE_LIBPATH="$PWD/build/release/Tensile-gfx1250v0/library/gfx1250v0"
          export HIPBLASLT_TEST_TIMEOUT=3600
          BIN=build/release/clients/hipblaslt-test
          LOG="$GITHUB_WORKSPACE/test_results/hipblaslt_test.log"
          # Cleanup CI logs.
          scrub() { sed -u -E '/Query[[:space:]]+device/d; /Device[[:space:]]+ID[[:space:]]+[0-9]/d; /PCI[[:space:]]+Chip[[:space:]]+ID/d; /GB[[:space:]]+memory/d; /SCLK|MCLK/d; /compute[[:space:]]+capability/d; /maxGridDimX/d; /sharedMemPerBlock/d; /maxThreadsPerBlock/d; /warpSize/d'; }
          FILTER=()
          [ -n "$GTEST_FILTER_ARG" ] && FILTER+=(--gtest_filter="$GTEST_FILTER_ARG")
          # Full suite in one pass.
          "$BIN" "${FILTER[@]}" 2>&1 | scrub | tee "$LOG"

      - name: Run TensileLite common tests (fresh client)
        timeout-minutes: 240
        if: ${{ always() && (github.event_name == 'push' || inputs.run_tensilelite) }}
        env:
          TL_PYTEST_K: ${{ inputs.tensilelite_pytest_k }}
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/opt/rocm/lib/llvm/lib:${LD_LIBRARY_PATH:-}"
          cd projects/hipblaslt/tensilelite
          K_ARG=()
          [ -n "$TL_PYTEST_K" ] && K_ARG+=(-k "$TL_PYTEST_K")
          pip install -r requirements.txt
          # Fresh-built rocisa/tensilelite.
          invoke build-client
          pip install -r requirements-dev.txt -e .
          # No --prebuilt-client: use the freshly built client.
          pytest -p no:cacheprovider Tensile/Tests/common \
            -m "gfx1250 and not skip-gfx1250" "${K_ARG[@]}" --timeout=5400 -n 1 -v -rfxX \
            --gpu-targets gfx1250v0 \
            --global-parameters="LibraryFormat='msgpack'" \
            --tensile-options=--cxx-compiler,/opt/rocm/lib/llvm/bin/amdclang++ 2>&1 \
            | tee "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"

      - name: Redact wall-clock timing from logs
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/test_results/hipblaslt_test.log" \
                   "$GITHUB_WORKSPACE/tensilelite_test_results/common_test.log"; do
            [ -f "$f" ] && sed -i -E 's/ in [0-9]+(\.[0-9]+)?s\b//g; s/ \([0-9]+ ms\)//g' "$f" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfx1250-selfbuild-results
          path: |
            test_results/
            tensilelite_test_results/
          if-no-files-found: warn
