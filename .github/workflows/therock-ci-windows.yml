name: TheRock CI Windows

on:
  workflow_call:
    inputs:
      cmake_options:
        type: string
      project_to_test:
        type: string
      test_type:
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string

permissions:
  contents: read

jobs:
  therock-build-windows:
    name: Build (${{ inputs.amdgpu_families }})
    runs-on: azure-windows-scale-rocm
    outputs:
      AMDGPU_FAMILIES: ${{ env.AMDGPU_FAMILIES }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: B:\build
      CCACHE_DIR: "${{ github.workspace }}/.container-cache/ccache"
      CCACHE_MAXSIZE: "700M"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
    steps:
      - name: Configure GitHub longpath
        run: |
          git config --global core.longpaths true

      - name: "Checking out repository for rocm-libraries"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

       # We only want to build MIOpen HEAD against CK HEAD, not applicable for other projects
      - name: Checkout composable_kernel repository
        if: ${{ contains(inputs.project_to_test, 'miopen') || contains(inputs.project_to_test, 'miopen_plugin') }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/composable_kernel"
          path: "composable_kernel"

      - name: Checkout TheRock repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          path: "TheRock"
          ref: 56d71ec3450f87a888ef56da0673ca09a6b56450 # 2026-01-27 commit

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt

      - name: Patch rocm-libraries
        run: |
          # Remove patches here if they cannot be applied cleanly, and they have not been deleted from TheRock repo
          # rm ./TheRock/patches/amd-mainline/rocm-libraries/*.patch
          # git -c user.name="therockbot" -c "user.email=therockbot@amd.com" am --whitespace=nowarn ./TheRock/patches/amd-mainline/rocm-libraries/*.patch

      - name: Install requirements
        # The first two lines removes the default commmunity feed and uses the internal proxy feed
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://10.0.167.96:8081/repository/choco-group/ --priority=1
          choco install --no-progress -y ccache
          # ninja pinned due to a bug in the 1.13.0 release:
          # https://github.com/ninja-build/ninja/issues/2616
          choco install --no-progress -y ninja --version 1.12.1
          choco install --no-progress -y strawberryperl
          echo "$PATH;C:\Strawberry\c\bin" >> $GITHUB_PATH
          choco install --no-progress -y awscli
          echo "$PATH;C:\Program Files\Amazon\AWSCLIV2" >> $GITHUB_PATH
          choco install --no-progress -y pkgconfiglite

      - uses: iterative/setup-dvc@4bdfd2b0f6f1ad7e08afadb03b1a895c352a5239 # v2.0.0
        with:
          version: '3.62.0'

      # After other installs, so MSVC get priority in the PATH.
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Runner health status
        run: |
          ccache --zero-stats
          python ./TheRock/build_tools/health_status.py

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          git config --global core.longpaths true
          python ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks

      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: "ADHOCBUILD"
          extra_cmake_options: "-DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=${{ github.workspace }} ${{ inputs.cmake_options }}"
        run: |
          # clear cache before build and after download
          ccache -z
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-dist
        run: cmake --build "${{ env.BUILD_DIR }}" --target therock-dist

      - name: Build therock-archives
        run: cmake --build "${{ env.BUILD_DIR }}" --target therock-archives

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Build dir:"
          echo "------------"
          ls -lh "${{ env.BUILD_DIR }}"
          echo "Artifact Archives:"
          echo "------------------"
          ls -lh "${{ env.BUILD_DIR }}"/artifacts/*.tar.xz
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 "${{ env.BUILD_DIR }}"/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s

      - name: "Build size report"
        if: always()
        shell: powershell
        run: |
          $fs = Get-PSDrive -PSProvider "FileSystem"
          $fsout = $fs | Select-Object -Property Name,Used,Free,Root
          $fsout | % {$_.Used/=1GB;$_.Free/=1GB;$_} | Write-Host
          get-disk | Select-object @{Name="Size(GB)";Expression={$_.Size/1GB}} | Write-Host

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external
          special-characters-workaround: true

      - name: Post Build Upload
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir ${{ env.BUILD_DIR }} \
            --upload

      - name: Extract Error Context
        if: ${{ contains(inputs.project_to_test, 'miopen') && failure() }}
        run: |
          ERROR_LOG=""
          ISSUE_TYPE="Build Failure"

          # Search for errors in build logs
          if [ -d "${{ env.BUILD_DIR }}/logs" ]; then
            # Look for common error patterns with context
            ERROR_LOG=$(grep -riE "(error|failed|fatal|exception)" "${{ env.BUILD_DIR }}/logs/" -A 3 -B 2 --max-count=5 2>/dev/null || echo "")

            # Categorize the issue type based on error patterns
            if echo "$ERROR_LOG" | grep -qiE "(test.*fail|failed.*test|assertion|gtest)"; then
              ISSUE_TYPE="Test Failure"
            elif echo "$ERROR_LOG" | grep -qiE "(docker|container|image)"; then
              ISSUE_TYPE="Docker Issue"
            elif echo "$ERROR_LOG" | grep -qiE "(compil|undefined reference|unresolved external|linker|link.*error)"; then
              ISSUE_TYPE="Compilation Issue"
            elif echo "$ERROR_LOG" | grep -qiE "(cmake|configuration)"; then
              ISSUE_TYPE="Configuration Issue"
            elif echo "$ERROR_LOG" | grep -qiE "(timeout|timed out)"; then
              ISSUE_TYPE="Timeout"
            elif echo "$ERROR_LOG" | grep -qiE "(permission|access denied)"; then
              ISSUE_TYPE="Permission Issue"
            elif echo "$ERROR_LOG" | grep -qiE "(out of memory|oom|memory)"; then
              ISSUE_TYPE="Memory Issue"
            fi
          fi

          # If no errors in log files, try to capture from recent step output
          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="Error details not found in logs. Check the GitHub Actions run for full output."
          fi

          # Format as 5 lines instead of truncating to 500 chars
          ERROR_LOG=$(echo "$ERROR_LOG" | head -n 5)

          # Save to environment file for next step
          echo "ISSUE_TYPE=$ISSUE_TYPE" >> $GITHUB_ENV
          echo "ERROR_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "$ERROR_LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Notify Microsoft Teams
        if: ${{ contains(inputs.project_to_test, 'miopen') && failure() }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_INFO=""
          if [ -n "$PR_TITLE" ]; then
            PR_INFO="\n**PR:** $PR_TITLE\n"
          fi
          ISSUE_SUMMARY="${ISSUE_TYPE:-Build Failure}"
          # Replace actual newlines with \n for JSON formatting
          ERROR_SNIPPET=$(echo "${ERROR_CONTEXT:-No error context available}" | sed ':a;N;$!ba;s/\n/\\n/g')

          curl -X POST "${{ secrets.MIOPEN_CI_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d @- <<EOF
          {
            "title": "MIOpen GitHub CI Notification",
            "text": "❌ Windows Build Failure ❌\n\n**Branch:** ${GITHUB_REF}\n${PR_INFO}\n**Issue Type:** ${ISSUE_SUMMARY}\n\n**Error Context:**\n\`\`\`\n${ERROR_SNIPPET}\n\`\`\`\n\n[View Full Run](${RUN_URL})"
          }
          EOF

  therock-test-windows:
    name: Test (${{ inputs.amdgpu_families }})
    needs: [therock-build-windows]
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      project_to_test: ${{ inputs.project_to_test }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ inputs.test_runs_on }}
      platform: "windows"
      test_type: ${{ inputs.test_type }}
    secrets: inherit
