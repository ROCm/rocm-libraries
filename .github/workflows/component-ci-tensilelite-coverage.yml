name: "Component CI: TensileLite coverage"

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
      linux_runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ${{ inputs.linux_runner }}
    container:
      image: ${{ inputs.docker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup ROCm
        uses: ./.github/actions/setup-rocm-linux
        with:
          amdgpu_family: gfx94X-dcgpu

      # TEMPORARY DIAGNOSTIC (AIHPBLAS-3877/3878): coverage-unit errors in this
      # container because rocisa's SupportedISA probe
      # (`amdclang++ -x assembler -target amdgcn-amdhsa -mcpu=<arch> -`) exits
      # nonzero here while it succeeds on a normal ROCm install, which fails the
      # characterization Solution fixtures and drags coverage below the floor.
      # This surfaces the compiler's actual stderr/exit code. Remove once known.
      - name: Diagnose SupportedISA assembler probe
        shell: bash
        run: |
          set +e
          echo "ROCM_PATH=$ROCM_PATH"
          echo "--- candidate amdclang++ locations (validateToolchain order) ---"
          CXX_PROBE=""
          for d in "$ROCM_PATH/bin" "$ROCM_PATH/lib/llvm/bin" /opt/rocm/bin /opt/rocm/lib/llvm/bin; do
            echo "[$d]"; ls -l "$d/amdclang++" 2>&1
            if [ -z "$CXX_PROBE" ] && [ -x "$d/amdclang++" ]; then CXX_PROBE="$d/amdclang++"; fi
          done
          [ -z "$CXX_PROBE" ] && CXX_PROBE="$(command -v amdclang++)"
          echo "--- resolved: $CXX_PROBE ---"
          "$CXX_PROBE" --version 2>&1 | head -3
          for arch in gfx942 gfx90a gfx950; do
            echo "=== probe $arch (stderr shown) ==="
            printf "" | "$CXX_PROBE" -x assembler -target amdgcn-amdhsa -mcpu=$arch - -o /tmp/probe_$arch.o
            echo "exit=$?"
          done
          echo "--- device libs / bitcode present? ---"
          ls -1 "$ROCM_PATH/amdgcn/bitcode" 2>&1 | head -5
          exit 0

      - name: Install tox
        shell: bash
        run: pip install tox

      # Runs the characterization + unit suite under coverage and enforces two
      # gates (AIHPBLAS-3877 / AIHPBLAS-3878): the whole-project floor
      # (fail_under in pyproject.toml, via pytest-cov) and the per-file ratchet
      # (coverage_ratchet.py, wired into the tox env's commands_post). No GPU or
      # client build is needed - coverage-unit skips the client build; the
      # compiler env below is only so rocisa builds during the tox run.
      - name: Run coverage-unit (floor + ratchet)
        shell: bash
        working-directory: projects/hipblaslt/tensilelite
        env:
          CXX: ${{ env.ROCM_PATH }}/lib/llvm/bin/amdclang++
          CC: ${{ env.ROCM_PATH }}/lib/llvm/bin/amdclang
          CMAKE_PREFIX_PATH: ${{ env.ROCM_PATH }}
          CMAKE_GENERATOR: Ninja
          LD_LIBRARY_PATH: ${{ env.ROCM_PATH }}/lib:${{ env.LD_LIBRARY_PATH }}
        run: tox -e coverage-unit

      # TEMPORARY DIAGNOSTIC (AIHPBLAS-3877/3878): reproduce the exact
      # makeIsaInfoMap path using the rocisa that tox just built in this
      # container, since the raw shell probe above succeeds yet the
      # characterization Solution fixtures still see SupportedISA=0. Uses the
      # tox venv so it exercises the same rocisa build. Never fails the job.
      - name: Diagnose makeIsaInfoMap in-process
        if: always()
        shell: bash
        working-directory: projects/hipblaslt/tensilelite
        run: |
          set +e
          PY=.tox/coverage-unit/bin/python
          [ -x "$PY" ] || { echo "no tox venv python at $PY"; exit 0; }
          PYTHONPATH="$PWD" "$PY" - <<'PYEOF'
          import subprocess
          from Tensile.Toolchain.Validators import validateToolchain
          from Tensile.Common.Architectures import SUPPORTED_ISA
          from Tensile.Common.Capabilities import makeIsaInfoMap
          cxx = validateToolchain("amdclang++")
          print("resolved cxx:", cxx, flush=True)
          m = makeIsaInfoMap(SUPPORTED_ISA, cxx)
          gfx942 = [k for k in m if tuple(k) == (9, 4, 2)]
          for k in gfx942:
              print("gfx942 SupportedISA =", m[k].asmCaps.get("SupportedISA"), flush=True)
          # Mirror rocisa's tryAssembler exactly (no -o; empty stdin) via subprocess
          for extra in ([], ["-o", "/tmp/a942.o"]):
              cmd = [cxx, "-x", "assembler", "-target", "amdgcn-amdhsa", "-mcpu=gfx942", "-"] + extra
              r = subprocess.run(cmd, input=b"", capture_output=True)
              print(f"subprocess {'with -o' if extra else 'no -o'}: rc={r.returncode} "
                    f"stderr={r.stderr.decode(errors='replace')[:400]!r}", flush=True)
          PYEOF
          echo "diag rc=$?"
          exit 0

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tensilelite-coverage
          path: |
            projects/hipblaslt/tensilelite/coverage.xml
            projects/hipblaslt/tensilelite/coverage.json
            projects/hipblaslt/tensilelite/htmlcov
          if-no-files-found: ignore
          retention-days: 7
