name: hipSOLVER ASAN CI

# ASAN build + smoke test of hipSOLVER on gfx90a. Opt-in: runs only when the
# `ci:asan` label is added to a PR (or via workflow_dispatch) — it is NOT
# triggered by changes to any component, so it never shows up as skipped jobs
# on unrelated PRs. hipBLASLt + rocBLAS + rocSOLVER are built as linked ASAN
# dependencies.
#
#   - gfx90a only (host-side ASAN; device xnack+ is gfx942/gfx950 only)
#   - per-subproject `<target>_SANITIZER=ASAN` for hipBLASLt + rocBLAS +
#     rocSOLVER + hipSOLVER
#   - quick (smoke) hipsolver-test (TEST_TYPE=quick)
#   - full ASAN checks; only HSA-runtime teardown leaks suppressed (lsan.supp)
#   - does NOT gate
#
# Note: re-applying the `ci:asan` label re-runs this; pushes alone do not.

on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: "Setup"
    if: github.event.label.name == 'ci:asan' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      docker_image: ${{ steps.ci-env.outputs.docker-image }}
      build_runs_on: ${{ steps.ci-env.outputs.linux-runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: Load CI environment
        id: ci-env
        uses: ./.github/actions/ci-env

  build:
    name: "Build (hipSOLVER | gfx90a | ASAN)"
    needs: setup
    runs-on: ${{ needs.setup.outputs.build_runs_on }}
    permissions:
      id-token: write
    container:
      image: ${{ needs.setup.outputs.docker_image }}
      options: -v /runner/config:/home/awsconfig/
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: gfx90a
      TEATIME_FORCE_INTERACTIVE: 0
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      ARTIFACT_GROUP: gfx90a-asan
    steps:
      - name: "Check out rocm-libraries"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          path: TheRock
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Install python deps
        run: pip install -r TheRock/requirements.txt
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10
      - name: Setup ccache
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"
      - name: Runner health status
        run: ./TheRock/build_tools/health_status.py
      - name: Pull DVC files for rocm-libraries
        run: |
          command -v dvc &> /dev/null && echo "dvc detected" || echo "Warning, dvc not detected!"
          LOGNAME=github-runner dvc pull -v
      - name: Fetch sources
        timeout-minutes: 30
        run: ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-rocm-libraries --no-include-ml-frameworks
      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          # Instrument hipBLASLt + rocBLAS + rocSOLVER (linked deps) + hipSOLVER;
          # rocprofiler-sdk test build disabled (needs a HIP runtime not staged here).
          extra_cmake_options: "-DTHEROCK_ROCM_LIBRARIES_SOURCE_DIR=../ -DhipBLASLt_SANITIZER=ASAN -DrocBLAS_SANITIZER=ASAN -DrocSOLVER_SANITIZER=ASAN -DhipSOLVER_SANITIZER=ASAN -Drocprofiler-sdk_CMAKE_ARGS=-DROCPROFILER_BUILD_TESTS=OFF"
          BUILD_DIR: build
        run: python3 TheRock/build_tools/github_actions/build_configure.py
      - name: Build hipSOLVER (ASAN)
        run: cmake --build TheRock/build --target hipSOLVER -- -k 0
      - name: Package hipSOLVER trees
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p upload/hipsolver
          for kind in stage dist; do
            d=$(find TheRock/build -maxdepth 6 -type d -path "*/math-libs/BLAS/hipSOLVER/${kind}" 2>/dev/null | head -1)
            if [ -n "$d" ] && [ -d "$d" ]; then
              tar -C "$d" -czf "upload/hipsolver/hipsolver-${kind}.tar.gz" . && echo "packaged hipSOLVER/${kind}"
            else
              echo "::warning::no hipSOLVER/${kind} tree found"
            fi
          done
          ccache -s -v || true
      - name: Upload hipSOLVER trees
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-trees-hipsolver
          path: upload/hipsolver/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

  test:
    name: "Test hipSOLVER ASAN (quick)"
    needs: [setup, build]
    runs-on: linux-gfx90a-gpu-rocm
    timeout-minutes: 210
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      THEROCK_DIR: ${{ github.workspace }}
      AMDGPU_FAMILIES: gfx90a
      ARTIFACT_GROUP: gfx90a-asan
      TEST_COMPONENT: hipsolver
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.therock_ref }}
      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: rocm-libraries
      - name: Download hipSOLVER ASAN trees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: asan-trees-hipsolver
          path: asan-trees
      - name: Assemble runnable tree from dist (+ stage overlay)
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ARTIFACTS_DIR}"
          tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/hipsolver-dist.tar.gz"
          if [ -f "asan-trees/hipsolver-stage.tar.gz" ]; then
            tar -C "${OUTPUT_ARTIFACTS_DIR}" -xzf "asan-trees/hipsolver-stage.tar.gz"
          fi
          test -x "${THEROCK_BIN_DIR}/hipsolver-test"
      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          export PATH="${GITHUB_WORKSPACE}/build/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/lib:${LD_LIBRARY_PATH:-}"
          timeout -k 10 120 python3 ./build_tools/print_driver_gpu_info.py || true
      - name: ASAN runtime environment
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/build"
          ASAN_RT_DIR="$(dirname "$(find "$OUT/lib/llvm/lib/clang" -name 'libclang_rt.asan-x86_64.so' | head -1)")"
          LSAN_SUPP="${GITHUB_WORKSPACE}/rocm-libraries/test/therock/lsan.supp"
          {
            echo "ASAN_OPTIONS=quarantine_size_mb=600"
            echo "LSAN_OPTIONS=suppressions=${LSAN_SUPP}:print_suppressions=0"
            echo "HSA_XNACK=1"
            echo "ASAN_SYMBOLIZER_PATH=${OUT}/lib/llvm/bin/llvm-symbolizer"
            echo "LD_LIBRARY_PATH=${OUT}/lib:${ASAN_RT_DIR}:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: Test hipSOLVER (quick)
        timeout-minutes: 180
        env:
          SHARD_INDEX: 1
          TOTAL_SHARDS: 1
          TEST_TYPE: quick
        run: |
          mkdir -p ./test_logs
          python3 rocm-libraries/test/therock/test_hipsolver.py 2>&1 | tee ./test_logs/hipsolver-test_output.log

  summary:
    name: "hipSOLVER ASAN CI Summary"
    if: always() && (github.event.label.name == 'ci:asan' || github.event_name == 'workflow_dispatch')
    needs:
      - setup
      - build
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Report (non-gating)
        env:
          SETUP: ${{ needs.setup.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          if [[ "$SETUP" == "skipped" ]]; then
            echo "Skipped (ci:asan label not set)."
            exit 0
          fi
          echo "Build (hipSOLVER ASAN): ${BUILD}"
          echo "Test  (quick):          ${TEST}"
