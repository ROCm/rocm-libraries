#
# Portable-IR parity gates for the rocKE engine, carried through to object code.
#
# WHY THIS GATE ENDS AT HSACO. The portable-IR path has two implementations of
# the same lowering -- one in Python, one in C++ -- plus a recipe VM that
# replays a recorded build and a roller that turns several recorded builds into
# one parametric recipe. The contract between them is byte-identity. Checking
# that contract on .ll alone is not enough for two reasons: the artifact that
# ships is HSACO, and identical .ll is not evidence that the .ll is compilable
# at all. Every gate below therefore runs the IR through comgr and compares the
# object code.
#
# No GPU is required: comgr compiles for the target ISA on the host, so this
# runs on an ordinary Linux runner in a few minutes.

name: rocKE Portable IR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rocke-portable-ir-ci.yml'
      - 'dnn-providers/hip-kernel-provider/rocke/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  portable-ir-parity:
    name: Portable IR parity through HSACO
    runs-on: azure-linux-scale-rocm
    env:
      ROCKE_DIR: dnn-providers/hip-kernel-provider/rocke
      # comgr arrives with the ROCm wheels. Which device extra is installed does
      # not constrain which ISA we compile for -- the gates target gfx950 and
      # gfx942 regardless -- it only has to be a real one.
      DEVICE_TARGET: gfx942
      LOG_DIR: portable-ir-logs
    steps:
      - name: Runner health status
        run: |
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "=== Memory ==="
          # Worth reading in the log: the HSACO gate sizes its per-compile
          # address-space cap to this number.
          free -h | grep Mem
          echo "=== Disk ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github
            cmake
            dnn-providers

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Install ROCm wheels
        run: |
          set -euo pipefail
          VENV_PATH="${{ runner.temp }}/rocm_wheels"
          echo "Creating Python virtual environment at $VENV_PATH"
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"

          echo "Installing ROCm wheels from multi-arch nightlies (device: $DEVICE_TARGET)"
          pip install --index-url "https://rocm.nightlies.amd.com/whl-multi-arch/" \
            "rocm[libraries,devel,device-$DEVICE_TARGET]"
          pip install --upgrade pytest

          echo "Initializing ROCm SDK"
          rocm-sdk init

          SITE_PACKAGES=$("$VENV_PATH/bin/python" -c "import site; print(site.getsitepackages()[0])")
          ROCM_SDK_PATH="$SITE_PACKAGES/_rocm_sdk_devel"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH" >> "$GITHUB_ENV"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"

      - name: Check ROCm wheel freshness
        run: |
          "$VENV_PATH/bin/python" .github/scripts/check_wheel_freshness.py \
            --max-age-days 14

      - name: Pin the comgr that will compile the IR
        run: |
          set -euo pipefail
          # Resolve comgr explicitly rather than letting the loader search. The
          # LLVM flavor the engines lower at is derived from the comgr vintage,
          # so a silent fall back to a different comgr would make every kernel
          # "differ" on the datalayout line and the failure would look like a
          # parity bug instead of a toolchain mismatch.
          # `|| true` so a no-match reaches the explicit error below instead of
          # dying under `set -e` with nothing useful in the log.
          comgr=$(ls "$ROCM_SDK_PATH"/lib/libamd_comgr.so* \
                     "$ROCM_SDK_PATH"/core-*/lib/libamd_comgr.so* 2>/dev/null \
                  | head -1 || true)
          if [[ -z "$comgr" ]]; then
            echo "::error::no libamd_comgr found under $ROCM_SDK_PATH"
            exit 1
          fi
          echo "using comgr: $comgr"
          echo "ROCKE_COMGR_LIB=$comgr" >> "$GITHUB_ENV"

      - name: Run the portable-IR gates
        run: |
          # Everything the gate does lives in the repository, not in this file:
          # the script builds the shared engine, runs the unit tests, then the
          # .ll, HSACO and rolled-HSACO gates, and owns the pinned expectations.
          # Running it locally reproduces a CI failure exactly.
          "$VENV_PATH/bin/python" \
            "$ROCKE_DIR/platform/tools/run_portable_ir_gates.py" \
            --build-root build/rocke --log-dir "$LOG_DIR"

      - name: Summary
        if: always()
        run: |
          {
            echo "## rocKE portable-IR gates"
            echo
            for f in unit_tests parity_matrix hsaco_parity roll_hsaco_parity; do
              log="$LOG_DIR/$f.log"
              [[ -f "$log" ]] || continue
              echo "### $f"
              echo '```'
              # The tail of each driver is its verdict block.
              tail -n 14 "$log"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-ir-gate-logs
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore
