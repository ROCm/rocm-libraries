name: hipBLASLt JIT CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "projects/hipblaslt/library/src/amd_detail/hipblaslt-jit-*"
      - "projects/hipblaslt/CMakeLists.txt"
      - "projects/hipblaslt/library/src/amd_detail/CMakeLists.txt"
      - "projects/hipblaslt/clients/tests/jit/**"
      - "projects/hipblaslt/tensilelite/include/Tensile/CachingLibrary.hpp"
      - "projects/hipblaslt/tensilelite/include/Tensile/ExactLogicLibrary.hpp"
      - "projects/hipblaslt/tensilelite/include/Tensile/ProviderRows.hpp"
      - "projects/hipblaslt/tensilelite/include/Tensile/Tensile.hpp"
      - "projects/hipblaslt/tensilelite/include/Tensile/ContractionSolution.hpp"
      - "projects/hipblaslt/tensilelite/include/Tensile/Serialization/**"
      - "projects/hipblaslt/tensilelite/src/ContractionSolution.cpp"
      - "projects/hipblaslt/tensilelite/Tensile/Common/GlobalParameters.py"
      - ".github/workflows/hipblaslt-jit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.ci-env.outputs.therock-ref }}
      baseline_run_id: ${{ steps.ci-env.outputs.baseline-run-id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - id: ci-env
        uses: ./.github/actions/ci-env
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: ${{ steps.ci-env.outputs.therock-ref }}
          path: TheRock
          sparse-checkout: build_tools
      - name: Select the artifact family and GPU runner of each architecture
        id: matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "TheRock/build_tools/github_actions")
          from amdgpu_family_matrix import get_all_families_for_trigger_types, select_weighted_label
          families = get_all_families_for_trigger_types(["presubmit", "postsubmit"])
          include = []
          for architecture, key in [("gfx90a", "gfx90a"), ("gfx942", "gfx94x"), ("gfx950", "gfx950")]:
              config = families[key]["linux"]
              labels = config.get("test-runs-on-labels")
              runner = select_weighted_label(labels, architecture) if labels else config["test-runs-on"]
              if not runner:
                  raise RuntimeError(f"No GPU runner configured for {architecture}")
              include.append({"architecture": architecture, "family": config["family"], "runs_on": runner})
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("matrix=" + json.dumps({"include": include}) + "\n")
          print(json.dumps(include, indent=2))
          PY

  test:
    name: JIT (${{ matrix.architecture }})
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      JIT_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Checkout source under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout shared SDK installer and GPU cleanup
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: ${{ needs.setup.outputs.therock_ref }}
          path: TheRock
          sparse-checkout: build_tools
      - name: Clean stale GPU processes
        timeout-minutes: 5
        run: bash TheRock/build_tools/github_actions/cleanup_processes.sh
      - name: Set paths inside the container
        run: |
          printf '%s\n' \
            "JIT_BUILD_DIR=$GITHUB_WORKSPACE/build/jit" \
            "JIT_DEPS_DIR=$GITHUB_WORKSPACE/build/jit-deps" \
            "VENV_DIR=$GITHUB_WORKSPACE/.venv" \
            "ROCM_PATH=$GITHUB_WORKSPACE/build/rocm-deps" >> "$GITHUB_ENV"
      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git g++ python3-dev python3-venv \
            libmsgpack-cxx-dev libomp-dev zlib1g-dev
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install -r TheRock/requirements.txt \
            -r projects/hipblaslt/tensilelite/requirements.txt
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
      - name: Install only SDK dependency artifacts
        timeout-minutes: 30
        env:
          AMDGPU_FAMILY: ${{ matrix.family }}
          SDK_RUN_ID: ${{ needs.setup.outputs.baseline_run_id }}
        run: |
          mkdir -p jit-test-logs
          # A complete release tarball or blas artifact contains prebuilt hipBLASLt.
          # Fetch only these compiler/runtime/development dependency components.
          python TheRock/build_tools/fetch_artifacts.py \
            --run-id "$SDK_RUN_ID" --run-github-repo ROCm/TheRock \
            --artifact-group "$AMDGPU_FAMILY" --amdgpu-targets "$JIT_ARCHITECTURE" \
            --output-dir "$ROCM_PATH" --flatten \
            '^(amd-llvm|base|sysdeps|core-(runtime|hip|kpack|ocl|amdsmi)|rocjitsu-hotswap|rocprofiler-sdk|host-suite-sparse)_(run|lib|dev)_' \
            2>&1 | tee jit-test-logs/sdk-dependencies.log
          echo "$ROCM_PATH/bin" >> "$GITHUB_PATH"
          echo "$ROCM_PATH/llvm/bin" >> "$GITHUB_PATH"
      - name: Stage header-only hipblas-common from this checkout
        timeout-minutes: 5
        run: |
          cmake -S projects/hipblas-common -B build/hipblas-common -G Ninja \
            -DCMAKE_CXX_COMPILER="$ROCM_PATH/bin/amdclang++" \
            -DCMAKE_PREFIX_PATH="$ROCM_PATH" -DCMAKE_INSTALL_PREFIX="$JIT_DEPS_DIR"
          cmake --install build/hipblas-common
      - name: Build for ${{ matrix.architecture }}
        timeout-minutes: 45
        run: |
          jobs="${KUBE_CPU_REQUEST:-8}"
          jobs="${jobs%.*}"
          (( jobs > 16 )) && jobs=16
          (( jobs < 1 )) && jobs=1
          # Host library only.
          cmake -S projects/hipblaslt -B "$JIT_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$ROCM_PATH/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="$ROCM_PATH/bin/amdclang++" \
            -DCMAKE_PREFIX_PATH="$JIT_DEPS_DIR;$ROCM_PATH" \
            -DPython_EXECUTABLE="$VENV_DIR/bin/python" \
            -DPython3_EXECUTABLE="$VENV_DIR/bin/python" \
            -DGPU_TARGETS="$JIT_ARCHITECTURE" \
            -DHIPBLASLT_ENABLE_JIT=ON \
            -DHIPBLASLT_ENABLE_HOST=ON -DHIPBLASLT_ENABLE_DEVICE=OFF \
            -DHIPBLASLT_ENABLE_CLIENT=OFF -DHIPBLASLT_BUILD_TESTING=ON \
            -DHIPBLASLT_ENABLE_ROCROLLER=OFF -DHIPBLASLT_ENABLE_MARKER=OFF \
            -DHIPBLASLT_ENABLE_EXTOPS=OFF -DHIPBLASLT_ENABLE_MATRIX_TRANSFORM=OFF \
            -DTENSILELITE_BUILD_TESTING=OFF -DTENSILELITE_ENABLE_CLIENT=OFF \
            2>&1 | tee jit-test-logs/configure.log
          cmake --build "$JIT_BUILD_DIR" --parallel "$jobs" 2>&1 | tee jit-test-logs/build.log
      - name: Run the JIT tests that need no GPU, with every GPU hidden
        timeout-minutes: 15
        env:
          HIP_VISIBLE_DEVICES: "-1"
          ROCR_VISIBLE_DEVICES: "-1"
        run: |
          ctest --test-dir "$JIT_BUILD_DIR/clients/tests/jit" -L jit-cpu --no-tests=error \
            --output-on-failure 2>&1 | tee jit-test-logs/ctest-cpu.log
      - name: Run the JIT tests that need a GPU
        timeout-minutes: 30
        run: |
          ctest --test-dir "$JIT_BUILD_DIR/clients/tests/jit" -L jit-gpu --no-tests=error \
            --output-on-failure 2>&1 | tee jit-test-logs/ctest-gpu.log
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: hipblaslt-jit-${{ matrix.architecture }}
          path: jit-test-logs
          if-no-files-found: warn
          retention-days: 7
      - name: Clean GPU processes
        if: ${{ always() }}
        timeout-minutes: 5
        run: bash TheRock/build_tools/github_actions/cleanup_processes.sh
