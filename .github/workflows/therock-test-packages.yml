name: TheRock Test Packages

on:
  workflow_call:
    inputs:
      therock_ref:
        type: string
        required: true
      projects_to_test:
        type: string
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      test_type:
        type: string
    secrets:
      MIOPEN_CI_WEBHOOK_URL:
        required: false
      HIPDNN_CI_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  configure_test_matrix:
    name: "Configure test matrix"
    # CPU-only job that computes the test matrix; it does not need a GPU, and
    # always runs on Linux regardless of inputs.platform. --platform is passed
    # explicitly below so fetch_test_configurations.py computes the correct
    # (possibly Windows) matrix even though this job itself runs on Linux.
    runs-on: ubuntu-24.04
    if: ${{ inputs.test_runs_on != '' }}
    outputs:
      components: ${{ steps.configure.outputs.components }}
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout CI config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: "Configuring CI options"
        env:
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test }}
          TEST_TYPE: ${{ inputs.test_type }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          CI_CONFIG_PATH: ci-config
        id: configure
        run: python ./build_tools/github_actions/fetch_test_configurations.py --platform=${{ inputs.platform }}

  test_components:
    name: 'Test ${{ matrix.components.job_name }}'
    needs: [configure_test_matrix]
    # skip tests if no test matrix to run
    if: ${{ needs.configure_test_matrix.outputs.components != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        components: ${{ fromJSON(needs.configure_test_matrix.outputs.components) }}
    uses: './.github/workflows/therock-test-component.yml'
    with:
      artifact_run_id: ${{  github.run_id }}
      therock_ref: ${{ inputs.therock_ref }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      # Per-component runner selection:
      #   1. Multi-GPU components use the multi-GPU runner
      #   2. CPU-only components use standard GitHub runners
      #   3. Per-component runner (set by fetch_test_configurations.py)
      test_runs_on: >-
        ${{
          (matrix.components.multi_gpu_runner != '' &&
            matrix.components.multi_gpu_runner) ||
          (matrix.components.linux_cpu_runner == true &&
            'aws-linux-scale-rocm-prod') ||
          matrix.components.test_runner
        }}
      platform: ${{ inputs.platform }}
      component: ${{ toJSON(matrix.components) }}
    secrets:
      MIOPEN_CI_WEBHOOK_URL: ${{ secrets.MIOPEN_CI_WEBHOOK_URL }}
      HIPDNN_CI_WEBHOOK_URL: ${{ secrets.HIPDNN_CI_WEBHOOK_URL }}
