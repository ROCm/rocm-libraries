name: hipDNN Python Wheel CI

on:
  pull_request:
    paths:
      - ".github/workflows/hipdnn-python-wheel-ci.yml"
      - "projects/hipdnn/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  linux-python-wheel:
    name: Linux Python Wheel
    runs-on: azure-linux-scale-rocm
    env:
      BUILD_DIR: build/hipdnn-python
      GPU_TARGET: gfx94X-dcgpu
      VENV_PATH: ${{ runner.temp }}/rocm_wheels
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github
            projects/hipdnn

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install ROCm wheels
        run: |
          set -euo pipefail
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"
          python -m pip install --upgrade pip
          pip install --index-url "https://rocm.nightlies.amd.com/v2/$GPU_TARGET/" "rocm[libraries,devel]"
          rocm-sdk init
          pip install build pytest

          site_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          rocm_sdk_path="$site_packages/_rocm_sdk_devel"
          echo "ROCM_SDK_PATH=$rocm_sdk_path" >> "$GITHUB_ENV"
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"

      - name: Configure frontend bindings
        run: |
          cmake -S projects/hipdnn/python/frontend_bindings \
                -B "$BUILD_DIR" \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$ROCM_SDK_PATH" \
                -DPython_EXECUTABLE="$VENV_PATH/bin/python"

      - name: Build frontend bindings
        run: cmake --build "$BUILD_DIR"

      - name: Pack frontend wheel
        run: |
          "$VENV_PATH/bin/python" projects/hipdnn/python/frontend_wheel_package/pack_frontend_wheel.py \
            --build-dir "$BUILD_DIR" \
            --wheel-dir "$BUILD_DIR/wheel_package"

      - name: Install frontend wheel
        run: |
          set -euo pipefail
          wheel=$(ls "$BUILD_DIR"/wheel_package/hipdnn_frontend-*.whl)
          "$VENV_PATH/bin/python" -m pip install --force-reinstall "$wheel"

      - name: Run frontend wheel tests
        run: |
          LD_LIBRARY_PATH="$ROCM_SDK_PATH/lib:${LD_LIBRARY_PATH:-}" \
            "$VENV_PATH/bin/python" -m pytest -q projects/hipdnn/python/frontend_wheel_package/tests

  windows-python-wheel:
    name: Windows Python Wheel
    runs-on: azure-windows-scale-rocm
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: B:\build\hipdnn-python
      GPU_TARGET: gfx1151
      VENV_PATH: B:\rocm_wheels
    steps:
      - name: Configure git longpaths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github
            projects/hipdnn

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13

      - name: Install build tools
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://10.0.167.96:8081/repository/choco-group/ --priority=1
          choco install --no-progress -y ninja --version 1.12.1

      - name: Install ROCm wheels
        run: |
          python -m venv $env:VENV_PATH
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install --index-url "https://rocm.nightlies.amd.com/v2/$env:GPU_TARGET/" "rocm[libraries,devel]"
          & (Join-Path $env:VENV_PATH "Scripts\rocm-sdk.exe") init
          & $python -m pip install build pytest

          $rocmSdkPath = (Join-Path $env:VENV_PATH "Lib\site-packages\_rocm_sdk_devel") -replace '\\', '/'
          "ROCM_SDK_PATH=$rocmSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $env:VENV_PATH "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure frontend bindings
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          cmake -S projects/hipdnn/python/frontend_bindings `
                -B $env:BUILD_DIR `
                -GNinja `
                -DCMAKE_BUILD_TYPE=Release `
                "-DCMAKE_PREFIX_PATH=$env:ROCM_SDK_PATH" `
                "-DPython_EXECUTABLE=$python"

      - name: Build frontend bindings
        run: cmake --build $env:BUILD_DIR --config Release

      - name: Pack frontend wheel
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          & $python projects/hipdnn/python/frontend_wheel_package/pack_frontend_wheel.py `
            --build-dir $env:BUILD_DIR `
            --wheel-dir (Join-Path $env:BUILD_DIR "wheel_package")

      - name: Install frontend wheel
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          $wheel = Get-ChildItem (Join-Path $env:BUILD_DIR "wheel_package\hipdnn_frontend-*.whl") | Select-Object -First 1
          if (-not $wheel) { throw "No hipdnn_frontend wheel found" }
          & $python -m pip install --force-reinstall $wheel.FullName

      - name: Run frontend wheel tests
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          $env:ROCM_PATH = $env:ROCM_SDK_PATH
          $env:PATH = "$env:ROCM_SDK_PATH/bin;$env:PATH"
          & $python -m pytest -q projects/hipdnn/python/frontend_wheel_package/tests
