name: hipBLASLt tensilelite quality

# Report-only quality + AI-friendliness measurement for the tensilelite Python
# tree (projects/hipblaslt/tensilelite/Tensile). It folds two measurements —
# function CCN / file size (lizard) and 21 AST readability signals — into one
# table and writes it to the GitHub job summary (the run's summary page,
# reachable from the PR Checks tab). It does NOT post a PR comment and does NOT
# gate: the job always succeeds.
#
# To turn it into a gate later: add `--enforce` to the run step below (the script
# then exits 1 when a metric is over its target in
# projects/hipblaslt/tensilelite/scripts/quality/quality_targets.json).
#
# hipblaslt is opted out of the repo-wide pre-commit config, so this is a
# dedicated workflow rather than part of pre-commit.yml.

on:
  pull_request:
    branches: [develop]
    paths:
      # Only Python changes affect the report (the scanner measures *.py).
      - "projects/hipblaslt/tensilelite/Tensile/**.py"
      - "projects/hipblaslt/tensilelite/scripts/quality/*.py"
      - "projects/hipblaslt/tensilelite/scripts/quality/quality_targets.json"
      - ".github/workflows/hipblaslt-tensilelite-quality.yml"
  push:
    branches: [develop]
    paths:
      - "projects/hipblaslt/tensilelite/Tensile/**.py"
      - "projects/hipblaslt/tensilelite/scripts/quality/*.py"
      - "projects/hipblaslt/tensilelite/scripts/quality/quality_targets.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install lizard
        run: pip install lizard

      - name: Quality report
        run: |
          python projects/hipblaslt/tensilelite/scripts/quality/check_quality.py --markdown \
            | tee quality-report.md >> "$GITHUB_STEP_SUMMARY"

      # Also upload the report as a machine-readable artifact (same retention as
      # the run) so downstream tooling can fetch it via the API rather than
      # scraping the job summary.
      - name: Upload quality report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tensilelite-quality-report
          path: quality-report.md
          if-no-files-found: error
