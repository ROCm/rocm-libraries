# Multi-Arch CI ASAN for rocm-libraries
#
# Phase-1 presubmit and on-demand ASAN builds. TheRock's
# configure_multi_arch_ci.py automatically selects host-asan for pull_request
# events and full asan for workflow_dispatch. Presubmit is intentionally
# label-gated by the existing ci:host-asan/ci:asan opt-in while the CPU-only
# component scope is proven in CI.
#
# For scheduled nightly runs, see therock-multi-arch-ci-asan-nightly.yml.

name: TheRock Multi-Arch CI ASAN

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocprim, test:hipcub"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      baseline_repository:
        type: string
        default: ""
        description: "Repository to query for baseline_run_id. Defaults to github.repository for workflow_dispatch."

permissions:
  contents: read
  actions: read

concurrency:
  # Only allow one run at a time for 'pull_request' events.
  # Allow multiple runs for 'push' and 'workflow_dispatch'.
  #
  # `github.workflow`: each workflow gets its own concurrency group
  # `github.head_ref`: the branch name (only defined for pull_request events)
  # `github.run_id`  : fallback, unique for each run
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure Changed Projects
    runs-on: ubuntu-24.04
    outputs:
      changed_projects: ${{ steps.configure.outputs.changed_projects }}
      test_projects: ${{ steps.configure.outputs.changed_projects }}
      run_all_tests: ${{ steps.configure.outputs.run_all_tests }}
      skip_tests: ${{ steps.configure.outputs.skip_tests }}
    steps:
      - name: Checkout repository config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/repos-config.json
          sparse-checkout-cone-mode: false

      - name: Checkout TheRock for configure script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/TheRock
          ref: 4773df5f835451fd65da39deed4bb84aaf238fb9
          path: _therock
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Configure CI
        id: configure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 _therock/build_tools/github_actions/configure_external_repo_ci.py \
            --event-name "${{ github.event_name }}" \
            --github-repo "${{ github.repository }}" \
            --base-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" \
            --head-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" \
            --config-path ".github/repos-config.json"

  setup:
    needs: configure
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@4773df5f835451fd65da39deed4bb84aaf238fb9
    with:
      build_variant: "asan"
      # Host instrumentation is architecture-independent, so presubmit builds
      # one canonical family. Manual full-ASAN keeps the broader matrix.
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || (github.event_name == 'pull_request' && 'gfx94X') || 'gfx94X,gfx950,gfx125X' }}
      linux_test_labels: ${{ inputs.linux_test_labels || '' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      baseline_repository: ${{ inputs.baseline_repository || (github.event_name == 'workflow_dispatch' && github.repository) || '' }}
      # Python/PyTorch/JAX builds are not supported with ASAN yet
      build_python_packages: false
      build_pytorch: false
      build_jax: false
      repository: ROCm/TheRock
      ref: 4773df5f835451fd65da39deed4bb84aaf238fb9
      changed_projects: ${{ needs.configure.outputs.changed_projects }}
      external_repo: '{"repository":"${{ github.repository }}","ref":"${{ github.sha }}"}'

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [configure, setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true' &&
        needs.configure.outputs.skip_tests != 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@4773df5f835451fd65da39deed4bb84aaf238fb9
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      # Empty means run all; otherwise intersect changed-project consumers with
      # the explicit Phase-1 host-ASAN admission list in TheRock.
      changed_projects: ${{ needs.configure.outputs.run_all_tests == 'true' && '' || needs.configure.outputs.test_projects }}
      repository: ROCm/TheRock
      ref: 4773df5f835451fd65da39deed4bb84aaf238fb9
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_asan_summary:
    name: Multi-Arch CI ASAN Summary
    if: always()
    needs:
      - setup
      - configure
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: 4773df5f835451fd65da39deed4bb84aaf238fb9
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
