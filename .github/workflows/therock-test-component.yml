name: Test component

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string


permissions:
  contents: read

jobs:
  test_component:
    name: 'Test ${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }} of ${{ fromJSON(inputs.component).total_shards }})'
    runs-on: ${{ inputs.test_runs_on }}
    container:
      image: ${{ inputs.platform == 'linux' && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    strategy:
      fail-fast: false
      matrix:
        # The shard array is based on "total_shards" from "fetch_test_configurations.py"
        # The test executable will shard based on the array. (ex: [1, 2, 3, 4] = four test shards)
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        if: ${{ runner.os == 'Windows' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "ROCm/TheRock"
          ref: 56d71ec3450f87a888ef56da0673ca09a6b56450 # 2026-01-27 commit

      - name: Run setup test environment workflow
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      - name: Test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
        run: |
          # Create logs directory
          mkdir -p ./test_logs

          # Run test and capture output (still display to console)
          ${{ fromJSON(inputs.component).test_script }} 2>&1 | tee ./test_logs/test_output.log

      - name: Extract Error Context
        if: ${{ contains(fromJSON(inputs.component).job_name, 'miopen') && failure() }}
        run: |
          ERROR_LOG=""
          ISSUE_TYPE="Test Failure"

          # Read from captured test output
          if [ -f "./test_logs/test_output.log" ]; then
            # Extract last 100 lines and look for failure patterns
            ERROR_LOG=$(tail -n 100 ./test_logs/test_output.log | grep -iE "(error|failed|fatal|exception|assertion)" -A 3 -B 2 | head -n 10 || echo "")
          fi

          # Categorize the issue type based on error patterns
          if [ -n "$ERROR_LOG" ]; then
            if echo "$ERROR_LOG" | grep -qiE "(test.*fail|failed.*test|assertion|gtest)"; then
              ISSUE_TYPE="Test Failure"
            elif echo "$ERROR_LOG" | grep -qiE "(timeout|timed out)"; then
              ISSUE_TYPE="Timeout"
            elif echo "$ERROR_LOG" | grep -qiE "(out of memory|oom|memory)"; then
              ISSUE_TYPE="Memory Issue"
            elif echo "$ERROR_LOG" | grep -qiE "(gpu|device|driver)"; then
              ISSUE_TYPE="GPU/Driver Issue"
            fi
          fi

          # If no errors found in log, provide basic failure info
          if [ -z "$ERROR_LOG" ]; then
            ERROR_LOG="Test failed: ${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})"
          fi

          # Format as 5 lines
          ERROR_LOG=$(echo "$ERROR_LOG" | head -n 5)

          # Save to environment file for next step
          echo "ISSUE_TYPE=$ISSUE_TYPE" >> $GITHUB_ENV
          echo "ERROR_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "$ERROR_LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: MIOpen Notify Microsoft Teams
        if: ${{ contains(fromJSON(inputs.component).job_name, 'miopen') && failure() }}
        run: |
          # Function to escape JSON strings
          json_escape() {
            echo "$1" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed 's/\t/\\t/g' | sed ':a;N;$!ba;s/\n/\\n/g'
          }

          WEBHOOK_URL="${{ secrets.MIOPEN_CI_WEBHOOK_URL }}"

          # Check if webhook URL is set
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: MIOPEN_CI_WEBHOOK_URL secret not set, skipping Teams notification"
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PR_TITLE_RAW="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_INFO=""

          if [ -n "$PR_TITLE_RAW" ]; then
            PR_TITLE=$(json_escape "$PR_TITLE_RAW")
            PR_INFO="\n**PR #${PR_NUMBER}:** ${PR_TITLE}\n"
          fi

          # Detect platform
          PLATFORM="${{ inputs.platform }}"
          if [ "$PLATFORM" = "linux" ]; then
            PLATFORM_NAME="Linux"
          else
            PLATFORM_NAME="Windows"
          fi

          ISSUE_SUMMARY=$(json_escape "${ISSUE_TYPE:-Test Failure}")
          BRANCH_REF=$(json_escape "${GITHUB_REF}")

          # Escape error context for JSON
          ERROR_SNIPPET=$(json_escape "${ERROR_CONTEXT:-No error context available}")

          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"title\":\"MIOpen GitHub CI Notification\",\"text\":\"❌ ${PLATFORM_NAME} Test Failure ❌\n\n**Branch:** ${BRANCH_REF}\n${PR_INFO}\n**Issue Type:** ${ISSUE_SUMMARY}\n\n**Error Context:**\n\`\`\`\n${ERROR_SNIPPET}\n\`\`\`\n\n[View Full Run](${RUN_URL})\"}"

      # GitHub's 'Complete job' step is unaware of launched executables
      # and will fail to clean up orphan processes.
      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        shell: powershell
        run: . '${{ github.workspace }}\build_tools\github_actions\cleanup_processes.ps1'
