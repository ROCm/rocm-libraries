name: Test component

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      therock_ref:
        type: string
        required: true
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string
      coverage_enabled:
        description: "When true, collect llvm profraw from the test run and generate a coverage report."
        type: boolean
        default: false
    secrets:
      MIOPEN_CI_WEBHOOK_URL:
        required: false
      HIPDNN_CI_WEBHOOK_URL:
        required: false


permissions:
  contents: read

jobs:
  test_component:
    name: 'Test ${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }} of ${{ fromJSON(inputs.component).total_shards }})'
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 210
    container:
      image: ${{ inputs.platform == 'linux' && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    strategy:
      fail-fast: false
      matrix:
        # The shard array is based on "total_shards" from "fetch_test_configurations.py"
        # The test executable will shard based on the array. (ex: [1, 2, 3, 4] = four test shards)
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
      TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "reboss/TheRock"
          ref: ${{ inputs.therock_ref }}
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Pre-job cleanup GPU processes on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "reboss/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Configure git for long paths on Windows
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Checkout rocm-libraries repository for scripts
        timeout-minutes: 30
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          AMDGPU_TARGETS: ${{ inputs.coverage_enabled && inputs.amdgpu_families || '' }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      # Set thread limits from KUBE_CPU_REQUEST (Kubernetes-injected) to avoid oversubscription.
      # Must be done at runtime since container env vars aren't in GitHub's env context.
      - name: Set thread limits
        run: |
          if [[ -n "${KUBE_CPU_REQUEST:-}" ]]; then
            CPU_COUNT="${KUBE_CPU_REQUEST%.*}"
            echo "OPENBLAS_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "OMP_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "Thread limits set: OPENBLAS_NUM_THREADS=${CPU_COUNT}, OMP_NUM_THREADS=${CPU_COUNT} (from KUBE_CPU_REQUEST=${KUBE_CPU_REQUEST})"
          else
            echo "KUBE_CPU_REQUEST not set, thread limits not configured"
          fi

      - name: Prepare coverage profile directory
        if: ${{ inputs.coverage_enabled }}
        run: |
          # Raw profiles are collected under ${PROFILE_DIR}/profraw. The coverage build
          # overrides PROFILE_DIR to ${GITHUB_WORKSPACE}/coverage-report (a container path
          # valid on this test node), so profraw lands in coverage-report/profraw.
          # This GITHUB_ENV value is the fallback for binaries whose ctest ENVIRONMENT
          # does not already bake LLVM_PROFILE_FILE; hipRAND overrides it per-test to the
          # same dir. Non-instrumented binaries ignore it.
          mkdir -p "${GITHUB_WORKSPACE}/coverage-report/profraw"
          echo "LLVM_PROFILE_FILE=${GITHUB_WORKSPACE}/coverage-report/profraw/${TEST_COMPONENT}-shard${{ matrix.shard }}-%p-%m.profraw" >> "${GITHUB_ENV}"

      - name: Test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
          # MIOpen resolves its packaged system databases against MIOPEN_SYSTEM_DB_PATH, which
          # CMake only bakes in for BUILD_DEV builds. Windows has no <lib>/share/miopen/db
          # fallback, so in a BUILD_DEV=Off CI build the path is empty and lookup resolves
          # relative to the ctest working directory rather than the artifact tree. Point it at
          # bin/, which is DATABASE_INSTALL_DIR on Windows and where the databases actually land.
          # Left empty elsewhere; Linux resolves correctly on its own.
          MIOPEN_SYSTEM_DB_PATH: ${{ runner.os == 'Windows' && format('{0}/build/bin', github.workspace) || '' }}
          LLVM_PROFILE_FILE: ${{ inputs.coverage_enabled && format('{0}/coverage-profraw/{1}-shard{2}-%p-%m.profraw', github.workspace, fromJSON(inputs.component).job_name, matrix.shard) || '' }}
        run: |
          # Create logs directory
          mkdir -p ./test_logs

          # Run test and capture output (still display to console)
          python ./build_tools/memory_monitor.py --phase "Test ${{ fromJSON(inputs.component).job_name }}" -- \
            bash -c '${{ fromJSON(inputs.component).test_script }}' 2>&1 | tee ./test_logs/test_output.log

      - name: Merge profraw and generate coverage report
        if: ${{ inputs.coverage_enabled }}
        shell: bash
        env:
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          PROJECT: ${{ fromJSON(inputs.component).job_name }}
          BUILD: ${{ github.workspace }}/build
          PROFRAW_DIR: ${{ github.workspace }}/coverage-report/profraw
          REPORT_DIR: ${{ github.workspace }}/coverage-report
          LLVM_BIN: ${{ github.workspace }}/build/lib/llvm/bin
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib/llvm/lib:${{ github.workspace }}/build/lib
        run: |
          set -euo pipefail
          # --- TEMP DEBUG: locate profraw files across the container ---
          echo "== profraw discovery =="
          echo "PROFRAW_DIR=${PROFRAW_DIR}"
          ls -la "${PROFRAW_DIR}" 2>/dev/null || echo "(coverage-profraw dir missing)"
          echo "-- find *.profraw under workspace, /tmp, HOME --"
          find "${GITHUB_WORKSPACE}" /tmp "${HOME}" -name '*.profraw' 2>/dev/null | head -50 || true
          _SO="${BUILD}/lib/lib${PROJECT}.so"
          echo "-- lib layout: ${BUILD}/lib/lib${PROJECT}.so* --"
          ls -la "${BUILD}/lib/lib${PROJECT}.so"* 2>/dev/null || echo "(no lib${PROJECT}.so* under ${BUILD}/lib)"
          _REAL="$(readlink -f "${_SO}" 2>/dev/null || true)"
          echo "readlink -f ${_SO} -> ${_REAL:-<dangling/unresolved>}"
          echo "-- instr check (direct symlink path) --"
          "${LLVM_BIN}/llvm-nm" "${_SO}" 2>/dev/null | grep -c "__llvm_profile" || echo "(nm failed / lib missing)"
          echo "-- instr check (readlink-resolved real file) --"
          if [ -n "${_REAL}" ] && [ -e "${_REAL}" ]; then
            echo "resolved __llvm_profile count: $("${LLVM_BIN}/llvm-nm" "${_REAL}" 2>/dev/null | grep -c "__llvm_profile" || true)"
          else
            echo "(resolved target missing)"
          fi
          echo "-- all lib${PROJECT}.so* under build (resolved symbol counts) --"
          find "${BUILD}" -name "lib${PROJECT}.so*" 2>/dev/null | while read -r f; do
            r="$(readlink -f "$f" 2>/dev/null || echo "$f")"
            echo "  $("${LLVM_BIN}/llvm-nm" "$r" 2>/dev/null | grep -c "__llvm_profile" || true) : $f -> $r"
          done || true
          echo "-- ldd of ${PROJECT} test binaries (which lib${PROJECT} is loaded) --"
          for tb in $(find "${BUILD}/bin" -type f -name "*${PROJECT}*" 2>/dev/null | head -3); do
            echo "  [$tb]"; ldd "$tb" 2>/dev/null | grep -i "${PROJECT}" || echo "    (no ${PROJECT} entry in ldd)"
          done
          echo "== end profraw discovery =="
          # --- END TEMP DEBUG ---
          mkdir -p "${REPORT_DIR}"
          OBJECT="${BUILD}/lib/lib${PROJECT}.so"
          PROFDATA="${REPORT_DIR}/${PROJECT}.profdata"

          IGNORE_RE=""
          CFG="$(find "${GITHUB_WORKSPACE}/rocm-libraries/projects/${PROJECT}" -name test_categories_coverage.yaml 2>/dev/null | head -1)"
          if [[ -n "${CFG}" ]]; then
            val="$(grep -m1 '^ignore_filename_regex:' "${CFG}" | cut -d: -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "${val}" in
              \'*\') val="${val#\'}"; val="${val%\'}" ;;
              \"*\") val="${val#\"}"; val="${val%\"}" ;;
            esac
            IGNORE_RE="${val}"
          fi
          IGNORE_ARGS=()
          if [[ -n "${IGNORE_RE}" ]]; then IGNORE_ARGS=("-ignore-filename-regex=${IGNORE_RE}"); fi

          PATHEQ="-path-equivalence=${GITHUB_WORKSPACE},${GITHUB_WORKSPACE}/rocm-libraries"

          "${LLVM_BIN}/llvm-profdata" merge -sparse -o "${PROFDATA}" ${PROFRAW_DIR}/*.profraw
          "${LLVM_BIN}/llvm-cov" report -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            | tee "${REPORT_DIR}/code_cov_${PROJECT}.report"
          "${LLVM_BIN}/llvm-cov" show -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            "${PATHEQ}" -Xdemangler="${LLVM_BIN}/llvm-cxxfilt" --format=html --output-dir="${REPORT_DIR}" || true
          "${LLVM_BIN}/llvm-cov" export -object "${OBJECT}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            --format=lcov > "${REPORT_DIR}/coverage.info"

          sed -i "s|${GITHUB_WORKSPACE}/||g" "${REPORT_DIR}/coverage.info"

          {
            echo "### ${PROJECT} coverage (${AMDGPU_FAMILIES})"
            echo ""
            echo '```'
            tail -n 3 "${REPORT_DIR}/code_cov_${PROJECT}.report"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Notify Teams Channel on Failure
        if: ${{ failure() && !github.event.pull_request.head.repo.fork }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MIOPEN_WEBHOOK_URL: ${{ secrets.MIOPEN_CI_WEBHOOK_URL }}
          HIPDNN_WEBHOOK_URL: ${{ secrets.HIPDNN_CI_WEBHOOK_URL }}
          COMPONENT_NAME: ${{ fromJSON(inputs.component).job_name }}
          JOB_NAME: "${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})"
        run: |
          python3 rocm-libraries/.github/scripts/notify_teams.py \
            --failure-stage test \
            --log-path ./test_logs/test_output.log \
            --webhook-urls "{\"miopen\":\"${MIOPEN_WEBHOOK_URL}\",\"hipdnn\":\"${HIPDNN_WEBHOOK_URL}\"}" \
            --pr-number "${PR_NUMBER}" \
            --pr-title "${PR_TITLE}" \
            --component-name "${COMPONENT_NAME}" \
            --job-name "${JOB_NAME}"

      # GitHub's 'Complete job' step is unaware of launched executables
      # and will fail to clean up orphan processes.
      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\build_tools\github_actions\cleanup_processes.ps1'

      - name: Post-job cleanup GPU processes on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./build_tools/github_actions/cleanup_processes.sh
