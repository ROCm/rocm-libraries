name: Test component

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      therock_ref:
        type: string
        required: true
      amdgpu_families:
        type: string
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string
    secrets:
      MIOPEN_CI_WEBHOOK_URL:
        required: false
      HIPDNN_CI_WEBHOOK_URL:
        required: false
      coverage:
        description: "When true, collect llvm profraw data from the test run and upload it as an artifact."
        type: boolean
        default: false


permissions:
  contents: read

jobs:
  test_component:
    name: 'Test ${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }} of ${{ fromJSON(inputs.component).total_shards }})'
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 210
    container:
      image: ${{ inputs.platform == 'linux' && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    strategy:
      fail-fast: false
      matrix:
        # The shard array is based on "total_shards" from "fetch_test_configurations.py"
        # The test executable will shard based on the array. (ex: [1, 2, 3, 4] = four test shards)
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
      TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\prejob\build_tools\github_actions\cleanup_processes.ps1'

      - name: Pre-job cleanup GPU processes on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Configure git for long paths on Windows
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - name: Checkout rocm-libraries repository for scripts
        timeout-minutes: 30
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rocm-libraries

      - name: Run setup test environment workflow
        timeout-minutes: 15
        uses: './.github/actions/setup_test_environment'
        with:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
          ARTIFACT_GROUP: ${{ inputs.amdgpu_families }}
          OUTPUT_ARTIFACTS_DIR: ${{ env.OUTPUT_ARTIFACTS_DIR }}
          VENV_DIR: ${{ env.VENV_DIR }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      # Set thread limits from KUBE_CPU_REQUEST (Kubernetes-injected) to avoid oversubscription.
      # Must be done at runtime since container env vars aren't in GitHub's env context.
      - name: Set thread limits
        run: |
          if [[ -n "${KUBE_CPU_REQUEST:-}" ]]; then
            CPU_COUNT="${KUBE_CPU_REQUEST%.*}"
            echo "OPENBLAS_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "OMP_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "Thread limits set: OPENBLAS_NUM_THREADS=${CPU_COUNT}, OMP_NUM_THREADS=${CPU_COUNT} (from KUBE_CPU_REQUEST=${KUBE_CPU_REQUEST})"
          else
            echo "KUBE_CPU_REQUEST not set, thread limits not configured"
          fi

      - name: Prepare coverage profile directory
        if: ${{ inputs.coverage }}
        run: |
          # Use $GITHUB_WORKSPACE (container path) so the dir matches what the
          # report step reads. Instrumented binaries emit one profraw file per
          # process/binary here (%p/%m); non-instrumented binaries ignore it.
          mkdir -p "${GITHUB_WORKSPACE}/coverage-profraw"
          echo "LLVM_PROFILE_FILE=${GITHUB_WORKSPACE}/coverage-profraw/${TEST_COMPONENT}-shard${{ matrix.shard }}-%p-%m.profraw" >> "${GITHUB_ENV}"
          # The coverage build's coverage-objects artifact is keyed by the
          # uppercase project name (e.g. HIPRAND); the component job name is its
          # lowercase form. Used below to fetch this component's objects/tools.
          echo "COVERAGE_PROJECT_NAME=$(echo "${TEST_COMPONENT}" | tr '[:lower:]' '[:upper:]')" >> "${GITHUB_ENV}"

      - name: Test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
          # MIOpen resolves its packaged system databases against MIOPEN_SYSTEM_DB_PATH, which
          # CMake only bakes in for BUILD_DEV builds. Windows has no <lib>/share/miopen/db
          # fallback, so in a BUILD_DEV=Off CI build the path is empty and lookup resolves
          # relative to the ctest working directory rather than the artifact tree. Point it at
          # bin/, which is DATABASE_INSTALL_DIR on Windows and where the databases actually land.
          # Left empty elsewhere; Linux resolves correctly on its own.
          MIOPEN_SYSTEM_DB_PATH: ${{ runner.os == 'Windows' && format('{0}/build/bin', github.workspace) || '' }}
        run: |
          # Create logs directory
          mkdir -p ./test_logs

          # Run test and capture output (still display to console)
          python ./build_tools/memory_monitor.py --phase "Test ${{ fromJSON(inputs.component).job_name }}" -- \
            bash -c '${{ fromJSON(inputs.component).test_script }}' 2>&1 | tee ./test_logs/test_output.log

      # Coverage report is generated on THIS test runner (tests + report on one
      # node): download the instrumented objects and version-matched llvm tools
      # staged by the coverage build, then merge the profraw the Test step just
      # produced and emit the report here. Gated on inputs.coverage, which (with
      # no status function) also implies success() - so a failed test run does
      # not download objects or publish a partial/misleading report (review:
      # reboss). Requires the component to run as a single shard.
      - name: Download coverage objects and llvm tools
        if: ${{ inputs.coverage }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-objects-${{ env.COVERAGE_PROJECT_NAME }}-${{ inputs.amdgpu_families }}
          path: coverage-objects

      - name: Merge profraw and generate coverage report
        if: ${{ inputs.coverage }}
        shell: bash
        env:
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
        run: |
          set -euo pipefail
          OBJECTS_DIR="${GITHUB_WORKSPACE}/coverage-objects"
          PROFRAW_DIR="${GITHUB_WORKSPACE}/coverage-profraw"
          REPORT_DIR="${GITHUB_WORKSPACE}/coverage-report"
          mkdir -p "${REPORT_DIR}"
          METADATA="${OBJECTS_DIR}/coverage_metadata.json"
          # Project key (lowercase) drives the report filenames; read it from the
          # metadata the build exported (fall back to the component job name).
          PROJECT="$(python3 -c "import json;print(json.load(open('${METADATA}'))['project'])" 2>/dev/null || echo "${TEST_COMPONENT}")"

          # Version-matched llvm tools were staged next to their runtime libs by
          # the coverage build; run them from there via LD_LIBRARY_PATH.
          LLVM_BIN="${OBJECTS_DIR}/bin"
          export LD_LIBRARY_PATH="${LLVM_BIN}:${LD_LIBRARY_PATH:-}"
          chmod +x "${LLVM_BIN}/llvm-profdata" "${LLVM_BIN}/llvm-cov" "${LLVM_BIN}/llvm-cxxfilt" 2>/dev/null || true

          # Instrumented shared libraries for llvm-cov -object, plus the profraw
          # the Test step just produced on this same node.
          mapfile -t OBJECTS < <(find "${OBJECTS_DIR}/lib" -type f -name '*.so*' 2>/dev/null | sort)
          mapfile -t PROFRAW_FILES < <(find "${PROFRAW_DIR}" -type f -name '*.profraw' 2>/dev/null | sort)

          # No coverage data to report (e.g. a GPU family whose test machines lack
          # a matching GPU run only host-side tests) or no instrumented object was
          # staged. Warn and skip (exit 0) rather than failing the coverage job.
          if [[ ${#PROFRAW_FILES[@]} -eq 0 || ${#OBJECTS[@]} -eq 0 ]]; then
            echo "::warning::No profraw (${#PROFRAW_FILES[@]}) or instrumented object (${#OBJECTS[@]}) for ${COVERAGE_PROJECT_NAME:-$TEST_COMPONENT} ${AMDGPU_FAMILIES}; skipping coverage report."
            exit 0
          fi

          OBJ_ARGS=()
          for o in "${OBJECTS[@]}"; do OBJ_ARGS+=(-object "${o}"); done

          IGNORE_RE="$(python3 -c "import json; print(json.load(open('${METADATA}')).get('ignore_filename_regex',''))" 2>/dev/null || echo "")"
          IGNORE_ARGS=()
          if [[ -n "${IGNORE_RE}" ]]; then IGNORE_ARGS=("-ignore-filename-regex=${IGNORE_RE}"); fi

          # The coverage build embeds source paths under its workspace root, but on
          # the test runner rocm-libraries is checked out under ./rocm-libraries;
          # remap so llvm-cov show can find the sources for HTML annotation.
          PATHEQ="-path-equivalence=${GITHUB_WORKSPACE},${GITHUB_WORKSPACE}/rocm-libraries"

          # Merge the per-binary profraw into one profile, then emit text, HTML and
          # LCOV reports directly with the version-matched llvm tools.
          PROFDATA="${REPORT_DIR}/${PROJECT}.profdata"
          "${LLVM_BIN}/llvm-profdata" merge -sparse -o "${PROFDATA}" "${PROFRAW_FILES[@]}"
          "${LLVM_BIN}/llvm-cov" report "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            | tee "${REPORT_DIR}/code_cov_${PROJECT}.report"
          "${LLVM_BIN}/llvm-cov" show "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            "${PATHEQ}" -Xdemangler="${LLVM_BIN}/llvm-cxxfilt" --format=html --output-dir="${REPORT_DIR}" || true
          "${LLVM_BIN}/llvm-cov" export "${OBJ_ARGS[@]}" -instr-profile="${PROFDATA}" ${IGNORE_ARGS[@]+"${IGNORE_ARGS[@]}"} \
            --format=lcov > "${REPORT_DIR}/coverage.info"

          # Make lcov paths repo-relative so Codecov can map them to the source tree.
          sed -i "s|${GITHUB_WORKSPACE}/||g" "${REPORT_DIR}/coverage.info"

          # Emit a short summary to the job summary and the step log.
          {
            echo "### ${COVERAGE_PROJECT_NAME:-$TEST_COMPONENT} coverage (${AMDGPU_FAMILIES})"
            echo ""
            echo '```'
            tail -n 3 "${REPORT_DIR}/code_cov_${PROJECT}.report"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        # Only upload when the report generated successfully; an always() here
        # could publish a partial/empty report after a failure (review: reboss).
        if: ${{ inputs.coverage && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ env.COVERAGE_PROJECT_NAME }}-${{ inputs.amdgpu_families }}-shard${{ matrix.shard }}
          path: coverage-report
          if-no-files-found: warn
          retention-days: 90

      - name: Notify Teams Channel on Failure
        if: ${{ failure() && !github.event.pull_request.head.repo.fork }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MIOPEN_WEBHOOK_URL: ${{ secrets.MIOPEN_CI_WEBHOOK_URL }}
          HIPDNN_WEBHOOK_URL: ${{ secrets.HIPDNN_CI_WEBHOOK_URL }}
          COMPONENT_NAME: ${{ fromJSON(inputs.component).job_name }}
          JOB_NAME: "${{ fromJSON(inputs.component).job_name }} (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})"
        run: |
          python3 rocm-libraries/.github/scripts/notify_teams.py \
            --failure-stage test \
            --log-path ./test_logs/test_output.log \
            --webhook-urls "{\"miopen\":\"${MIOPEN_WEBHOOK_URL}\",\"hipdnn\":\"${HIPDNN_WEBHOOK_URL}\"}" \
            --pr-number "${PR_NUMBER}" \
            --pr-title "${PR_TITLE}" \
            --component-name "${COMPONENT_NAME}" \
            --job-name "${JOB_NAME}"

      # GitHub's 'Complete job' step is unaware of launched executables
      # and will fail to clean up orphan processes.
      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . '${{ github.workspace }}\build_tools\github_actions\cleanup_processes.ps1'

      - name: Post-job cleanup GPU processes on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./build_tools/github_actions/cleanup_processes.sh
