#
# Lightweight CI for hipDNN + providers using the rocm-libraries superbuild
# and pre-built ROCm wheels (no TheRock source build required).

name: hipDNN Superbuild CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hipdnn-superbuild-ci.yml'
      - 'projects/hipdnn/**'
      - 'dnn-providers/**'
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  hipdnn-windows-superbuild:
    name: HipDNN Windows Superbuild
    runs-on: azure-windows-scale-rocm
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: B:\build
      HIPDNN_ARTIFACT_DIR: B:\hipdnn-artifacts
      VENV_PATH: B:\rocm_wheels
      GPU_TARGET: gfx1151
      # Multi-arch nightly device extra (rocm[...,device-<DEVICE_TARGET>]).
      DEVICE_TARGET: gfx1151
    steps:
      - name: Runner health status
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Host "=== CPU ==="
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "$($cpu.Name)  ($($cpu.NumberOfLogicalProcessors) logical cores)"
          Write-Host "=== Memory ==="
          $os = Get-CimInstance Win32_OperatingSystem
          $totalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $freeGB  = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
          Write-Host "Total: ${totalGB} GB  Free: ${freeGB} GB"
          Write-Host "=== Disk ==="
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}},
              @{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}},
              Root |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Configure git longpaths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            test

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install build tools
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://10.0.167.96:8081/repository/choco-group/ --priority=1
          choco install --no-progress -y ccache
          choco install --no-progress -y ninja --version 1.12.1

      - name: Install ROCm wheels
        shell: pwsh
        run: |
          Write-Host "Creating Python virtual environment at $env:VENV_PATH"
          python -m venv $env:VENV_PATH
          & "$env:VENV_PATH\Scripts\Activate.ps1"

          Write-Host "Installing ROCm wheels from multi-arch nightlies (device: $env:DEVICE_TARGET)"
          pip install --index-url "https://rocm.nightlies.amd.com/whl-multi-arch/" "rocm[libraries,devel,device-$env:DEVICE_TARGET]"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install ROCm wheels" }

          Write-Host "Initializing ROCm SDK"
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize ROCm SDK" }

          $RocmSdkPath = "$env:VENV_PATH\Lib\site-packages\_rocm_sdk_devel" -replace '\\', '/'
          Write-Host "ROCM_SDK_PATH=$RocmSdkPath"
          echo "ROCM_SDK_PATH=$RocmSdkPath" >> $env:GITHUB_ENV

      - name: Check ROCm wheel freshness
        shell: pwsh
        run: |
          & "$env:VENV_PATH\Scripts\python.exe" .github/scripts/check_wheel_freshness.py --max-age-days 14
          if ($LASTEXITCODE -ne 0) { throw "ROCm nightly wheels are stale" }

      - name: Configure superbuild
        run: |
          cmake --preset hipdnn-providers-all -GNinja \
            -DROCM_PATH="$ROCM_SDK_PATH" \
            -DCMAKE_PROGRAM_PATH="$ROCM_SDK_PATH/lib/llvm/bin" \
            -DGPU_TARGETS="$GPU_TARGET" \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DENABLE_CLANG_FORMAT=OFF \
            -DENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build build

      # Windows tests have a few issues where we are loading plugins and thats causing issues with super build tests
      # as they end up trying to init a gpu on a non gpu machine.  This work is ticketed to be fixed later.
      #- name: Add ROCm bin to PATH
      #  run: echo "$ROCM_SDK_PATH/bin" >> "$GITHUB_PATH"

      #- name: Run tests
      #  run: ctest --test-dir build --output-on-failure

      - name: Patch ROCm SDK with superbuild outputs
        shell: pwsh
        run: cmake --install build --prefix $env:ROCM_SDK_PATH

      - name: Package patched ROCm SDK artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:HIPDNN_ARTIFACT_DIR | Out-Null
          tar -C $env:ROCM_SDK_PATH -czf (Join-Path $env:HIPDNN_ARTIFACT_DIR 'hipdnn-rocm-sdk-windows.tar.gz') .
          if ($LASTEXITCODE -ne 0) { throw "Failed to package patched ROCm SDK" }

      - name: Upload patched ROCm SDK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hipdnn-rocm-sdk-windows-${{ env.GPU_TARGET }}
          path: ${{ env.HIPDNN_ARTIFACT_DIR }}\hipdnn-rocm-sdk-windows.tar.gz
          if-no-files-found: error
          retention-days: 3

  hipdnn-linux-superbuild:
    name: HipDNN Linux Superbuild
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
      # Multi-arch nightly device extra (rocm[...,device-<DEVICE_TARGET>]).
      DEVICE_TARGET: gfx942
      HIPDNN_ARTIFACT_DIR: /tmp/hipdnn-artifacts
    steps:
      - name: Runner health status
        run: |
          echo "=== OS ==="
          cat /etc/os-release | head -2
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "=== Memory ==="
          free -h | grep Mem
          echo "=== Disk ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            test

      - name: Set environment
        run: echo "VENV_PATH=${{ runner.temp }}/rocm_wheels" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-tidy-20 clang-tools-20

      - name: Install ROCm wheels
        run: |
          echo "Creating Python virtual environment at $VENV_PATH"
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"

          echo "Installing ROCm wheels from multi-arch nightlies (device: $DEVICE_TARGET)"
          pip install --index-url "https://rocm.nightlies.amd.com/whl-multi-arch/" "rocm[libraries,devel,device-$DEVICE_TARGET]"

          echo "Initializing ROCm SDK"
          rocm-sdk init

          SITE_PACKAGES=$("$VENV_PATH/bin/python" -c "import site; print(site.getsitepackages()[0])")
          ROCM_SDK_PATH="$SITE_PACKAGES/_rocm_sdk_devel"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH" >> "$GITHUB_ENV"

      - name: Check ROCm wheel freshness
        run: |
          "$VENV_PATH/bin/python" .github/scripts/check_wheel_freshness.py --max-age-days 14

      - name: Configure superbuild
        run: |
          cmake --preset hipdnn-providers-all -GNinja \
            -DROCM_PATH="$ROCM_SDK_PATH" \
            -DCMAKE_PROGRAM_PATH="$ROCM_SDK_PATH/lib/llvm/bin" \
            -DGPU_TARGETS="$GPU_TARGET" \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DENABLE_CLANG_FORMAT=OFF \
            -DENABLE_CLANG_TIDY=ON \
            -DCMAKE_CXX_CLANG_TIDY=/usr/bin/clang-tidy-20

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Patch ROCm SDK with superbuild outputs
        run: cmake --install build --prefix "$ROCM_SDK_PATH"

      - name: Package patched ROCm SDK artifact
        run: |
          set -euo pipefail
          mkdir -p "$HIPDNN_ARTIFACT_DIR"
          tar -C "$ROCM_SDK_PATH" -czf "$HIPDNN_ARTIFACT_DIR/hipdnn-rocm-sdk-linux.tar.gz" .

      - name: Upload patched ROCm SDK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hipdnn-rocm-sdk-linux-${{ env.GPU_TARGET }}
          path: ${{ env.HIPDNN_ARTIFACT_DIR }}/hipdnn-rocm-sdk-linux.tar.gz
          if-no-files-found: error
          retention-days: 3

  linux-python-wheel:
    name: Linux Python Wheel
    needs: hipdnn-linux-superbuild
    runs-on: azure-linux-scale-rocm
    env:
      BUILD_DIR: build/hipdnn-python
      GPU_TARGET: gfx94X-dcgpu
      ROCM_SDK_PATH: /tmp/rocm-sdk
      SUPERBUILD_ARTIFACT_DIR: /tmp/hipdnn-rocm-sdk-artifact
      VENV_PATH: /tmp/rocm_wheels
      THIRD_PARTY_DEPS_DIR: /tmp/rocm-third-party-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hipdnn/python

      - name: Download Linux patched ROCm SDK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hipdnn-rocm-sdk-linux-${{ env.GPU_TARGET }}
          path: ${{ env.SUPERBUILD_ARTIFACT_DIR }}

      - name: Extract Linux patched ROCm SDK artifact
        run: |
          set -euo pipefail
          mkdir -p "$ROCM_SDK_PATH"
          tar -C "$ROCM_SDK_PATH" -xzf "$SUPERBUILD_ARTIFACT_DIR/hipdnn-rocm-sdk-linux.tar.gz"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Python build dependencies
        run: |
          set -euo pipefail
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"
          python -m pip install --upgrade pip
          pip install build numpy pytest
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"

      - name: Download third-party dependency sources
        run: |
          set -euo pipefail
          mkdir -p "$THIRD_PARTY_DEPS_DIR"
          "$VENV_PATH/bin/python" - <<'PY'
          import hashlib
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          deps_dir = Path(os.environ["THIRD_PARTY_DEPS_DIR"])
          dependencies = {
              "nanobind-2.12.0.tar.gz": "01f1f0cd0398743c18f33d07ae36ad410bd7f4a1e90683b508504de897d6e629",
              "robin-map-1.4.1.tar.gz": "0e3f53a377fdcdc5f9fed7a4c0d4f99e82bbb64175233bd13427fef9a771f4a1",
          }
          for archive_name, expected_sha256 in dependencies.items():
              archive = deps_dir / archive_name
              urllib.request.urlretrieve(
                  f"https://rocm-third-party-deps.s3.us-east-2.amazonaws.com/{archive_name}",
                  archive,
              )
              actual_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise RuntimeError(
                      f"{archive_name} SHA256 mismatch: expected {expected_sha256}, got {actual_sha256}"
                  )
              with tarfile.open(archive, "r:gz") as tar:
                  tar.extractall(deps_dir, filter="data")
          PY
          test -d "$THIRD_PARTY_DEPS_DIR/nanobind-2.12.0"
          test -d "$THIRD_PARTY_DEPS_DIR/robin-map-1.4.1"

      - name: Configure frontend bindings
        run: |
          cmake -S projects/hipdnn/python/frontend_bindings \
                -B "$BUILD_DIR" \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$ROCM_SDK_PATH" \
                -DFETCHCONTENT_SOURCE_DIR_NANOBIND="$THIRD_PARTY_DEPS_DIR/nanobind-2.12.0" \
                -DFETCHCONTENT_SOURCE_DIR_TSL_ROBIN_MAP="$THIRD_PARTY_DEPS_DIR/robin-map-1.4.1" \
                -DPython_EXECUTABLE="$VENV_PATH/bin/python"

      - name: Build frontend bindings
        run: cmake --build "$BUILD_DIR"

      - name: Pack frontend wheel
        run: |
          "$VENV_PATH/bin/python" projects/hipdnn/python/frontend_wheel_package/pack_frontend_wheel.py \
            --build-dir "$BUILD_DIR" \
            --wheel-dir "$BUILD_DIR/wheel_package"

      - name: Install frontend wheel
        run: |
          set -euo pipefail
          wheel=$(ls "$BUILD_DIR"/wheel_package/hipdnn_frontend-*.whl)
          "$VENV_PATH/bin/python" -m pip install --force-reinstall "$wheel"

      - name: Run frontend wheel tests
        run: |
          LD_LIBRARY_PATH="$ROCM_SDK_PATH/lib:${LD_LIBRARY_PATH:-}" \
            "$VENV_PATH/bin/python" -m pytest -q projects/hipdnn/python/frontend_wheel_package/tests

  windows-python-wheel:
    name: Windows Python Wheel
    needs: hipdnn-windows-superbuild
    runs-on: azure-windows-scale-rocm
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: B:\build\hipdnn-python
      GPU_TARGET: gfx1151
      ROCM_SDK_PATH: B:\rocm-sdk
      SUPERBUILD_ARTIFACT_DIR: B:\hipdnn-rocm-sdk-artifact
      VENV_PATH: B:\rocm_wheels
      THIRD_PARTY_DEPS_DIR: B:\rocm-third-party-deps
    steps:
      - name: Configure git longpaths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            projects/hipdnn/python

      - name: Download Windows patched ROCm SDK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hipdnn-rocm-sdk-windows-${{ env.GPU_TARGET }}
          path: ${{ env.SUPERBUILD_ARTIFACT_DIR }}

      - name: Extract Windows patched ROCm SDK artifact
        run: |
          New-Item -ItemType Directory -Force $env:ROCM_SDK_PATH | Out-Null
          tar -C $env:ROCM_SDK_PATH -xzf (Join-Path $env:SUPERBUILD_ARTIFACT_DIR "hipdnn-rocm-sdk-windows.tar.gz")
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract patched ROCm SDK" }

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13

      - name: Install build tools
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://10.0.167.96:8081/repository/choco-group/ --priority=1
          choco install --no-progress -y ninja --version 1.12.1

      - name: Install Python build dependencies
        run: |
          python -m venv $env:VENV_PATH
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install build numpy pytest

          (Join-Path $env:VENV_PATH "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download third-party dependency sources
        run: |
          New-Item -ItemType Directory -Force $env:THIRD_PARTY_DEPS_DIR | Out-Null
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          $script = @'
          import hashlib
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          deps_dir = Path(os.environ["THIRD_PARTY_DEPS_DIR"])
          dependencies = {
              "nanobind-2.12.0.tar.gz": "01f1f0cd0398743c18f33d07ae36ad410bd7f4a1e90683b508504de897d6e629",
              "robin-map-1.4.1.tar.gz": "0e3f53a377fdcdc5f9fed7a4c0d4f99e82bbb64175233bd13427fef9a771f4a1",
          }
          for archive_name, expected_sha256 in dependencies.items():
              archive = deps_dir / archive_name
              urllib.request.urlretrieve(
                  f"https://rocm-third-party-deps.s3.us-east-2.amazonaws.com/{archive_name}",
                  archive,
              )
              actual_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise RuntimeError(
                      f"{archive_name} SHA256 mismatch: expected {expected_sha256}, got {actual_sha256}"
                  )
              with tarfile.open(archive, "r:gz") as tar:
                  tar.extractall(deps_dir, filter="data")
          '@
          $script | & $python
          if ($LASTEXITCODE -ne 0) { throw "Failed to download third-party dependency sources" }
          if (-not (Test-Path (Join-Path $env:THIRD_PARTY_DEPS_DIR "nanobind-2.12.0"))) { throw "nanobind source directory not found" }
          if (-not (Test-Path (Join-Path $env:THIRD_PARTY_DEPS_DIR "robin-map-1.4.1"))) { throw "robin-map source directory not found" }

      - name: Configure frontend bindings
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          cmake -S projects/hipdnn/python/frontend_bindings `
                -B $env:BUILD_DIR `
                -GNinja `
                -DCMAKE_BUILD_TYPE=Release `
                "-DCMAKE_PREFIX_PATH=$env:ROCM_SDK_PATH" `
                "-DFETCHCONTENT_SOURCE_DIR_NANOBIND=$env:THIRD_PARTY_DEPS_DIR\nanobind-2.12.0" `
                "-DFETCHCONTENT_SOURCE_DIR_TSL_ROBIN_MAP=$env:THIRD_PARTY_DEPS_DIR\robin-map-1.4.1" `
                "-DPython_EXECUTABLE=$python"

      - name: Build frontend bindings
        run: cmake --build $env:BUILD_DIR --config Release

      - name: Pack frontend wheel
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          & $python projects/hipdnn/python/frontend_wheel_package/pack_frontend_wheel.py `
            --build-dir $env:BUILD_DIR `
            --wheel-dir (Join-Path $env:BUILD_DIR "wheel_package")

      - name: Install frontend wheel
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          $wheel = Get-ChildItem (Join-Path $env:BUILD_DIR "wheel_package\hipdnn_frontend-*.whl") | Select-Object -First 1
          if (-not $wheel) { throw "No hipdnn_frontend wheel found" }
          & $python -m pip install --force-reinstall $wheel.FullName

      - name: Run frontend wheel tests
        run: |
          $python = Join-Path $env:VENV_PATH "Scripts\python.exe"
          $env:ROCM_PATH = $env:ROCM_SDK_PATH
          $env:HIP_PATH = $env:ROCM_SDK_PATH
          $env:PATH = "$env:ROCM_SDK_PATH/bin;$env:ROCM_SDK_PATH/lib;$env:PATH"
          & $python -m pytest -q projects/hipdnn/python/frontend_wheel_package/tests

  hipdnn_build_summary:
    name: hipDNN Superbuild Summary
    if: always()
    needs:
      - hipdnn-windows-superbuild
      - hipdnn-linux-superbuild
      - windows-python-wheel
      - linux-python-wheel
    runs-on: ubuntu-24.04
    steps:
      - name: Report results
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "Failed jobs: ${FAILED_JOBS}"
            exit 1
          fi
