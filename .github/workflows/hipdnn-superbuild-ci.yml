#
# Lightweight CI for hipDNN + providers using the rocm-libraries superbuild
# and pre-built ROCm wheels (no TheRock source build required).

name: hipDNN Superbuild CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hipdnn-python-wheel-ci.yml'
      - '.github/workflows/hipdnn-superbuild-ci.yml'
      - 'projects/hipdnn/**'
      - 'dnn-providers/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  hipdnn-windows-superbuild:
    name: HipDNN Windows Superbuild
    runs-on: azure-windows-scale-rocm
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: B:\build
      HIPDNN_ARTIFACT_DIR: B:\hipdnn-artifacts
      HIPDNN_INSTALL_PREFIX: B:\hipdnn-install
      VENV_PATH: B:\rocm_wheels
      GPU_TARGET: gfx1151
      # Multi-arch nightly device extra (rocm[...,device-<DEVICE_TARGET>]).
      DEVICE_TARGET: gfx1151
    steps:
      - name: Runner health status
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Host "=== CPU ==="
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "$($cpu.Name)  ($($cpu.NumberOfLogicalProcessors) logical cores)"
          Write-Host "=== Memory ==="
          $os = Get-CimInstance Win32_OperatingSystem
          $totalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $freeGB  = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
          Write-Host "Total: ${totalGB} GB  Free: ${freeGB} GB"
          Write-Host "=== Disk ==="
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}},
              @{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}},
              Root |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Configure git longpaths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            test

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install build tools
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://10.0.167.96:8081/repository/choco-group/ --priority=1
          choco install --no-progress -y ccache
          choco install --no-progress -y ninja --version 1.12.1

      - name: Install ROCm wheels
        shell: pwsh
        run: |
          Write-Host "Creating Python virtual environment at $env:VENV_PATH"
          python -m venv $env:VENV_PATH
          & "$env:VENV_PATH\Scripts\Activate.ps1"

          Write-Host "Installing ROCm wheels from multi-arch nightlies (device: $env:DEVICE_TARGET)"
          pip install --index-url "https://rocm.nightlies.amd.com/whl-multi-arch/" "rocm[libraries,devel,device-$env:DEVICE_TARGET]"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install ROCm wheels" }

          Write-Host "Initializing ROCm SDK"
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize ROCm SDK" }

          $RocmSdkPath = "$env:VENV_PATH\Lib\site-packages\_rocm_sdk_devel" -replace '\\', '/'
          Write-Host "ROCM_SDK_PATH=$RocmSdkPath"
          echo "ROCM_SDK_PATH=$RocmSdkPath" >> $env:GITHUB_ENV

      - name: Check ROCm wheel freshness
        shell: pwsh
        run: |
          & "$env:VENV_PATH\Scripts\python.exe" .github/scripts/check_wheel_freshness.py --max-age-days 14
          if ($LASTEXITCODE -ne 0) { throw "ROCm nightly wheels are stale" }

      - name: Configure superbuild
        run: |
          cmake --preset hipdnn-providers-all -GNinja \
            -DROCM_PATH="$ROCM_SDK_PATH" \
            -DCMAKE_PROGRAM_PATH="$ROCM_SDK_PATH/lib/llvm/bin" \
            -DGPU_TARGETS="$GPU_TARGET" \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DENABLE_CLANG_FORMAT=OFF \
            -DENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build build

      # Windows tests have a few issues where we are loading plugins and thats causing issues with super build tests
      # as they end up trying to init a gpu on a non gpu machine.  This work is ticketed to be fixed later.
      #- name: Add ROCm bin to PATH
      #  run: echo "$ROCM_SDK_PATH/bin" >> "$GITHUB_PATH"

      #- name: Run tests
      #  run: ctest --test-dir build --output-on-failure

      - name: Stage superbuild install output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force $env:HIPDNN_INSTALL_PREFIX -ErrorAction SilentlyContinue
          cmake --install build --prefix $env:HIPDNN_INSTALL_PREFIX

      - name: Patch ROCm SDK with selected superbuild outputs
        shell: pwsh
        run: |
          function Remove-PathIfExists($Path) {
            if (Test-Path $Path) {
              Remove-Item -Recurse -Force $Path
            }
          }

          function Copy-PathIfExists($RelativePath) {
            $source = Join-Path $env:HIPDNN_INSTALL_PREFIX $RelativePath
            if (-not (Test-Path $source)) {
              return
            }
            $destination = Join-Path $env:ROCM_SDK_PATH $RelativePath
            New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
            Copy-Item -Recurse -Force $source $destination
          }

          function Copy-ChildrenByPattern($RelativeDir, $Pattern) {
            $sourceDir = Join-Path $env:HIPDNN_INSTALL_PREFIX $RelativeDir
            if (-not (Test-Path $sourceDir)) {
              return
            }
            $destinationDir = Join-Path $env:ROCM_SDK_PATH $RelativeDir
            New-Item -ItemType Directory -Force $destinationDir | Out-Null
            Get-ChildItem -Path $sourceDir -Filter $Pattern | ForEach-Object {
              Copy-Item -Recurse -Force $_.FullName $destinationDir
            }
          }

          Remove-PathIfExists (Join-Path $env:ROCM_SDK_PATH "include\hipdnn")
          Get-ChildItem -Path (Join-Path $env:ROCM_SDK_PATH "lib\cmake") -Filter "hipdnn_*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Remove-PathIfExists (Join-Path $env:ROCM_SDK_PATH "lib\cmake\ckc")
          Get-ChildItem -Path (Join-Path $env:ROCM_SDK_PATH "lib") -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "libhipdnn*" -or
              $_.Name -like "hipdnn*.lib" -or
              $_.Name -like "librocke*" -or
              $_.Name -like "rocke*.lib" -or
              $_.Name -like "libckc*" -or
              $_.Name -like "ckc*.lib"
            } |
            Remove-Item -Force
          Get-ChildItem -Path (Join-Path $env:ROCM_SDK_PATH "bin") -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "hipdnn_backend*" -or
              $_.Name -like "hipdnn_list_engines*" -or
              $_.Name -like "rocke_core*"
            } |
            Remove-Item -Force
          $engineDir = Join-Path $env:ROCM_SDK_PATH "lib\hipdnn_plugins\engines"
          Get-ChildItem -Path $engineDir -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "*miopen_plugin*" -or
              $_.Name -like "*hipblaslt_plugin*" -or
              $_.Name -like "*hip_kernel_provider*" -or
              $_.Name -like "*rocke_client*"
            } |
            Remove-Item -Force
          Remove-PathIfExists (Join-Path $engineDir "hip_kernel_provider")

          Copy-PathIfExists "include\hipdnn"
          Copy-PathIfExists "lib\cmake\ckc"
          Copy-ChildrenByPattern "lib\cmake" "hipdnn_*"
          Copy-ChildrenByPattern "lib" "libhipdnn*"
          Copy-ChildrenByPattern "lib" "hipdnn*.lib"
          Copy-ChildrenByPattern "lib" "librocke*"
          Copy-ChildrenByPattern "lib" "rocke*.lib"
          Copy-ChildrenByPattern "lib" "libckc*"
          Copy-ChildrenByPattern "lib" "ckc*.lib"
          Copy-ChildrenByPattern "bin" "hipdnn_backend*"
          Copy-ChildrenByPattern "bin" "hipdnn_list_engines*"
          Copy-ChildrenByPattern "bin" "rocke_core*"
          Copy-ChildrenByPattern "lib\hipdnn_plugins\engines" "*miopen_plugin*"
          Copy-ChildrenByPattern "lib\hipdnn_plugins\engines" "*hipblaslt_plugin*"
          Copy-ChildrenByPattern "lib\hipdnn_plugins\engines" "*hip_kernel_provider*"
          Copy-ChildrenByPattern "lib\hipdnn_plugins\engines" "*rocke_client*"
          Copy-PathIfExists "lib\hipdnn_plugins\engines\hip_kernel_provider"

      - name: Verify patched ROCm SDK
        shell: pwsh
        run: |
          $requiredPaths = @(
            (Join-Path $env:ROCM_SDK_PATH "lib\cmake\hip\hip-config.cmake"),
            (Join-Path $env:ROCM_SDK_PATH "lib\cmake\hipdnn_backend\hipdnn_backendConfig.cmake")
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) { throw "Missing expected ROCm SDK file: $path" }
          }

          $checks = @(
            @{ Directory = "bin"; Pattern = "hipdnn_backend*" },
            @{ Directory = "lib\hipdnn_plugins\engines"; Pattern = "*miopen_plugin*" },
            @{ Directory = "lib\hipdnn_plugins\engines"; Pattern = "*hipblaslt_plugin*" },
            @{ Directory = "lib\hipdnn_plugins\engines"; Pattern = "*hip_kernel_provider*" }
          )
          foreach ($check in $checks) {
            $directory = Join-Path $env:ROCM_SDK_PATH $check.Directory
            $match = Get-ChildItem -Path $directory -Filter $check.Pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $match) { throw "Missing expected ROCm SDK file matching $($check.Pattern) in $directory" }
          }

      - name: Package patched ROCm SDK artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:HIPDNN_ARTIFACT_DIR | Out-Null
          tar -C $env:ROCM_SDK_PATH -czf (Join-Path $env:HIPDNN_ARTIFACT_DIR 'hipdnn-rocm-sdk-windows.tar.gz') .
          if ($LASTEXITCODE -ne 0) { throw "Failed to package patched ROCm SDK" }

      - name: Upload patched ROCm SDK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hipdnn-rocm-sdk-windows-${{ env.GPU_TARGET }}
          path: ${{ env.HIPDNN_ARTIFACT_DIR }}\hipdnn-rocm-sdk-windows.tar.gz
          if-no-files-found: error
          retention-days: 3

  hipdnn-linux-superbuild:
    name: HipDNN Linux Superbuild
    runs-on: azure-linux-scale-rocm
    env:
      GPU_TARGET: gfx94X-dcgpu
      # Multi-arch nightly device extra (rocm[...,device-<DEVICE_TARGET>]).
      DEVICE_TARGET: gfx942
      HIPDNN_ARTIFACT_DIR: ${{ runner.temp }}/hipdnn-artifacts
      HIPDNN_INSTALL_PREFIX: ${{ runner.temp }}/hipdnn-install
    steps:
      - name: Runner health status
        run: |
          echo "=== OS ==="
          cat /etc/os-release | head -2
          echo "=== CPU ==="
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "=== Memory ==="
          free -h | grep Mem
          echo "=== Disk ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .dvc
            .github
            cmake
            dnn-providers
            projects/hipdnn
            projects/miopen
            test

      - name: Set environment
        run: echo "VENV_PATH=${{ runner.temp }}/rocm_wheels" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-tidy-20 clang-tools-20

      - name: Install ROCm wheels
        run: |
          echo "Creating Python virtual environment at $VENV_PATH"
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"

          echo "Installing ROCm wheels from multi-arch nightlies (device: $DEVICE_TARGET)"
          pip install --index-url "https://rocm.nightlies.amd.com/whl-multi-arch/" "rocm[libraries,devel,device-$DEVICE_TARGET]"

          echo "Initializing ROCm SDK"
          rocm-sdk init

          SITE_PACKAGES=$("$VENV_PATH/bin/python" -c "import site; print(site.getsitepackages()[0])")
          ROCM_SDK_PATH="$SITE_PACKAGES/_rocm_sdk_devel"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH"
          echo "ROCM_SDK_PATH=$ROCM_SDK_PATH" >> "$GITHUB_ENV"

      - name: Check ROCm wheel freshness
        run: |
          "$VENV_PATH/bin/python" .github/scripts/check_wheel_freshness.py --max-age-days 14

      - name: Configure superbuild
        run: |
          cmake --preset hipdnn-providers-all -GNinja \
            -DROCM_PATH="$ROCM_SDK_PATH" \
            -DCMAKE_PROGRAM_PATH="$ROCM_SDK_PATH/lib/llvm/bin" \
            -DGPU_TARGETS="$GPU_TARGET" \
            -DROCM_LIBS_ENABLE_ROOT_CTEST=ON \
            -DENABLE_CLANG_FORMAT=OFF \
            -DENABLE_CLANG_TIDY=ON \
            -DCMAKE_CXX_CLANG_TIDY=/usr/bin/clang-tidy-20

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage superbuild install output
        run: rm -rf "$HIPDNN_INSTALL_PREFIX" && cmake --install build --prefix "$HIPDNN_INSTALL_PREFIX"

      - name: Patch ROCm SDK with selected superbuild outputs
        run: |
          set -euo pipefail
          shopt -s nullglob

          copy_path() {
            local relative_path="$1"
            local source_path="$HIPDNN_INSTALL_PREFIX/$relative_path"
            local destination_path="$ROCM_SDK_PATH/$relative_path"
            if [[ ! -e "$source_path" ]]; then
              return
            fi
            mkdir -p "$(dirname "$destination_path")"
            cp -a "$source_path" "$destination_path"
          }

          copy_children_by_pattern() {
            local relative_dir="$1"
            local pattern="$2"
            local source_dir="$HIPDNN_INSTALL_PREFIX/$relative_dir"
            local destination_dir="$ROCM_SDK_PATH/$relative_dir"
            if [[ ! -d "$source_dir" ]]; then
              return
            fi
            mkdir -p "$destination_dir"
            for source_path in "$source_dir"/$pattern; do
              cp -a "$source_path" "$destination_dir/"
            done
          }

          rm -rf "$ROCM_SDK_PATH/include/hipdnn"
          rm -rf "$ROCM_SDK_PATH"/lib/cmake/ckc
          rm -f "$ROCM_SDK_PATH"/lib/librocke* "$ROCM_SDK_PATH"/lib/libckc*
          rm -f "$ROCM_SDK_PATH"/bin/rocke_core*
          rm -rf "$ROCM_SDK_PATH"/lib/cmake/hipdnn_*
          rm -f "$ROCM_SDK_PATH"/lib/libhipdnn*
          rm -f "$ROCM_SDK_PATH"/bin/hipdnn_backend* "$ROCM_SDK_PATH"/bin/hipdnn_list_engines*
          rm -f "$ROCM_SDK_PATH"/lib/hipdnn_plugins/engines/*miopen_plugin*
          rm -f "$ROCM_SDK_PATH"/lib/hipdnn_plugins/engines/*hipblaslt_plugin*
          rm -f "$ROCM_SDK_PATH"/lib/hipdnn_plugins/engines/*hip_kernel_provider*
          rm -f "$ROCM_SDK_PATH"/lib/hipdnn_plugins/engines/*rocke_client*
          rm -rf "$ROCM_SDK_PATH"/lib/hipdnn_plugins/engines/hip_kernel_provider

          copy_path "include/hipdnn"
          copy_path "lib/cmake/ckc"
          copy_children_by_pattern "lib/cmake" "hipdnn_*"
          copy_children_by_pattern "lib" "libhipdnn*"
          copy_children_by_pattern "lib" "librocke*"
          copy_children_by_pattern "lib" "libckc*"
          copy_children_by_pattern "bin" "hipdnn_backend*"
          copy_children_by_pattern "bin" "hipdnn_list_engines*"
          copy_children_by_pattern "bin" "rocke_core*"
          copy_children_by_pattern "lib/hipdnn_plugins/engines" "*miopen_plugin*"
          copy_children_by_pattern "lib/hipdnn_plugins/engines" "*hipblaslt_plugin*"
          copy_children_by_pattern "lib/hipdnn_plugins/engines" "*hip_kernel_provider*"
          copy_children_by_pattern "lib/hipdnn_plugins/engines" "*rocke_client*"
          copy_path "lib/hipdnn_plugins/engines/hip_kernel_provider"

      - name: Verify patched ROCm SDK
        run: |
          set -euo pipefail
          test -f "$ROCM_SDK_PATH/lib/cmake/hip/hip-config.cmake"
          test -f "$ROCM_SDK_PATH/lib/cmake/hipdnn_backend/hipdnn_backendConfig.cmake"
          test -f "$ROCM_SDK_PATH/lib/libhipdnn_backend.so"
          test -f "$ROCM_SDK_PATH/lib/hipdnn_plugins/engines/libmiopen_plugin.so"
          test -f "$ROCM_SDK_PATH/lib/hipdnn_plugins/engines/libhipblaslt_plugin.so"
          test -f "$ROCM_SDK_PATH/lib/hipdnn_plugins/engines/libhip_kernel_provider.so"

      - name: Package patched ROCm SDK artifact
        run: |
          set -euo pipefail
          mkdir -p "$HIPDNN_ARTIFACT_DIR"
          tar -C "$ROCM_SDK_PATH" -czf "$HIPDNN_ARTIFACT_DIR/hipdnn-rocm-sdk-linux.tar.gz" .

      - name: Upload patched ROCm SDK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hipdnn-rocm-sdk-linux-${{ env.GPU_TARGET }}
          path: ${{ env.HIPDNN_ARTIFACT_DIR }}/hipdnn-rocm-sdk-linux.tar.gz
          if-no-files-found: error
          retention-days: 3

  hipdnn_build_summary:
    name: hipDNN Superbuild Summary
    if: always()
    needs:
      - hipdnn-windows-superbuild
      - hipdnn-linux-superbuild
    runs-on: ubuntu-24.04
    steps:
      - name: Report results
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "Failed jobs: ${FAILED_JOBS}"
            exit 1
          fi
