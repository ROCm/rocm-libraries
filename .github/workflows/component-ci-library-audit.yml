name: "Component CI: Library Audit"

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
      linux_runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ${{ inputs.linux_runner }}
    container:
      image: ${{ inputs.docker_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Run library audit unit tests
        working-directory: projects/hipblaslt/utilities/library_audit
        run: python -m pytest tests -q

      - name: Audit changed logic libraries
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin develop
            BASE="origin/develop"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          python3 projects/hipblaslt/utilities/library_audit/audit_hipblaslt_libraries.py \
            --hipblaslt-path projects/hipblaslt \
            --changed-since "${BASE}" \
            --report-dir "${{ github.workspace }}/hipblaslt-logic-audit-reports" \
            --no-cache \
            --workers 16

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hipblaslt-logic-library-audit
          path: hipblaslt-logic-audit-reports
          if-no-files-found: ignore
