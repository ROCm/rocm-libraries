name: "Setup ROCm (Windows)"
description: "Install ROCm SDK on Windows via TheRock artifacts"

inputs:
  amdgpu_family:
    description: "GPU family for ROCm install (e.g. gfx1151)"
    required: true
  extra_args:
    description: "Additional arguments to pass to install_rocm_from_artifacts.py"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Load CI environment
      id: ci-env
      uses: $/.github/actions/ci-env

    - name: Checkout TheRock
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ROCm/TheRock
        ref: ${{ steps.ci-env.outputs.therock-ref }}
        path: TheRock
        sparse-checkout: build_tools
        persist-credentials: false

    - name: Install ROCm dependencies
      shell: bash
      run: pip install boto3

    - name: Install ROCm
      shell: bash
      env:
        AMDGPU_FAMILY: ${{ inputs.amdgpu_family }}
        EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        # extra_args is a whitespace-separated argument list.
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        python3 TheRock/build_tools/install_rocm_from_artifacts.py \
          --latest-release \
          --amdgpu-family "${AMDGPU_FAMILY}" \
          --output-dir B:/ROCm \
          --base-only \
          "${extra_args[@]}"
        echo "ROCM_PATH=B:/ROCm" >> "$GITHUB_ENV"
