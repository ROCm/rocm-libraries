name: "CI Environment"
description: "Single source of truth for shared CI constants (TheRock ref, Docker image, runners)"

outputs:
  therock-ref:
    description: "TheRock commit hash to use"
    value: "2d0da43cdb34bc59ea309834329546d96ea730f2" # 2026-07-10 commit
  docker-image:
    description: "Docker container image for Linux builds"
    # Current TheRock build image, including Rust/Cargo for Mirage.
    value: "ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:a382085df3ba2419b58aa9051350883a0d0b732a4bc0a4ef60458f8161bb08c6"
  linux-runner:
    description: "GitHub Actions runner label for Linux jobs"
    value: "aws-linux-scale-rocm-prod"
  windows-runner:
    description: "GitHub Actions runner label for Windows jobs"
    value: "azure-windows-scale-rocm"

runs:
  using: "composite"
  steps:
    - name: Export CI environment
      shell: bash
      run: echo "CI environment loaded"
