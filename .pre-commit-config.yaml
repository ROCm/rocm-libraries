# Pre-commit (https://pre-commit.com) configuration for assorted lint checks.
#
# See https://pre-commit.com/hooks.html for more hooks.

# Top level exclusions from all hooks. Some of these could be moved into more
# specific exclusions like check-yaml and clang-format, but for large generated
# files even simple hooks like trailing-whitespace can be expensive.
#
# Note the yaml multiline literal and (?x) regex flag used here, see
# https://pre-commit.com/#regular-expressions.
exclude: |
  (?x)
    # ==========================================================================
    # Opted-out projects
    # To opt-in, remove your project from the exclusions.
    # See CONTRIBUTING.md for detailed instructions.
    #
    # Some opted-out projects are listed on the individual hooks below instead
    # of here. This top level exclude hides a file from every hook, and
    # pre-commit gives a hook no way to opt back in, so anything listed here is
    # invisible to the security gate as well.
    # ==========================================================================
    projects/composablekernel/.*|
    projects/hipblas/.*|
    projects/hipblas-common/.*|
    projects/hipcub/.*|
    projects/hipccl/.*|
    projects/hipfft/.*|
    projects/hiprand/.*|
    projects/hipsolver/.*|
    projects/hipsparselt/.*|
    projects/hiptensor/.*|
    projects/hipthreads/.*|
    projects/rocblas/.*|
    projects/rocfft/.*|
    projects/rocprim/.*|
    projects/rocsolver/.*|
    projects/rocthrust/.*|
    projects/rocwmma/.*|
    shared/mxdatagenerator/.*|
    shared/origami/.*|
    shared/rocroller/.*|
    # ==========================================================================
    # Permanent exclusions
    # ==========================================================================
    # Binary files
    projects/hipdnn/.*\.bin$|
    # Generated hipDNN FlatBuffers headers
    projects/hipdnn/flatbuffers_sdk/include/hipdnn_flatbuffers_sdk/data_objects/.*_generated\.h|
    # Generated hipDNN FlatBuffers Python bindings: flatc-hipdnn rewrites them, so a
    # formatter that touched them would fight that hook on every run.
    projects/hipdnn/tools/uhd_gen/_generated/.*|
    # Generated hip-kernel-provider FlatBuffers header
    dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/serialization/ingestor_plan_generated\.h|
    # Reference data (auto-generated). The generic hooks would fight the
    # generators: some graph JSON is written without a final newline, which
    # end-of-file-fixer would rewrite, and sweep manifests run past 1 MB, over
    # check-added-large-files' limit. The exclusion also hides the support.json
    # sidecars from the RFC 0015 hooks below; the real tree is checked instead
    # by test_render_support_matrix.py, which runs as a ctest in
    # hipdnn-superbuild-ci on every change under dnn-providers/.
    dnn-providers/integration-tests/integration-test-bundles/.*|
    # Generated files (see rocrand/tools/ _generator.cpp files)
    projects/rocrand/library/.*constants\.(cpp|h)|
    projects/rocrand/library/.*precomputed\.(cpp|h)|
    # MIOpen exclusion list
    projects/miopen/.*\.s$|
    projects/miopen/.*\.inc$|
    projects/miopen/.*\.model$|
    # Machine-generated LGBM assets: native LightGBM text models + baked
    # catalog/metadata + golden parity fixtures (large, not human-authored;
    # exceed check-added-large-files and are not lintable/end-of-file-fixable).
    # Match every lgbm_* asset under kernels/ so new metadata/model files stay
    # covered without touching this list.
    projects/miopen/src/conv/heuristics/lgbm_models/.*|
    projects/miopen/src/conv/heuristics/lgbm_pcfg_models/.*|
    projects/miopen/src/kernels/lgbm_.*\.(json|txt|bin)|
    # Machine-generated two-tower config-embedding tables (binary; exceed
    # check-added-large-files and are not lintable/end-of-file-fixable).
    projects/miopen/src/kernels/.*_kernel_config_embeddings\.bin|
    # RPP exclusion list - raw test data with no early NUL byte, which pre-commit would
    # otherwise treat as text and corrupt. Matched by extension so new data stays covered.
    projects/rpp/.*\.(bin|rgb|yuv)$


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
        # Opted out of the formatting hooks, but still scanned by the security
        # gate below. Anchored here and aliased onto the other hooks that would
        # otherwise pick these up from the top level exclude.
        exclude: &opted_out_but_scanned |
          (?x)
          projects/hipblaslt/.*|
          projects/hipsparse/.*|
          projects/rocsparse/.*|
          shared/tensile/.*|
          # Vendored AOTriton test sources, kept byte-identical to their pin
          # (tools/sdpa_conformance/aotriton/VENDOR.md, sync.py --check).
          projects/hipdnn/tools/sdpa_conformance/aotriton/vendor/.*
      - id: end-of-file-fixer
        exclude: *opted_out_but_scanned
      - id: check-yaml
        exclude: |
          (?x)
          projects/hipblaslt/.*|
          projects/hipsparse/.*|
          projects/rocsparse/.*|
          shared/tensile/.*|
          ^projects/hipdnn/\.clang-format$|
          ^projects/miopen/\.clang-format$|
          ^dnn-providers/miopen-provider/\.clang-format$|
          ^dnn-providers/hipblaslt-provider/\.clang-format$|
          ^dnn-providers/hip-kernel-provider/\.clang-format$|
          ^dnn-providers/integration-tests/\.clang-format$
      - id: check-added-large-files
        # The opted-out projects above, plus generated catalogs: the gfx950 conv AOT
        # per-dtype instance lists (tools/enumerate_conv_aot_instances.py), the
        # descriptor shards and census make_conv_aot_config.py and the
        # IngestorGenerator emit from them, and the UHD pipeline's trained model binaries
        # under a descriptor set's heuristics/. Each is regenerated, never edited by hand.
        exclude: |
          (?x)
          projects/hipblaslt/.*|
          shared/tensile/.*|
          ^projects/hipdnn/tools/IngestorGenerator/configs/gfx950_conv_fwd_aot_(fp16|bf16)\.instances\.json$|
          ^dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/descriptors/rocKE/gfx950_conv_fwd_aot/gfx950_conv_fwd_aot_(fp16|bf16)_(mem_(plain|unroll|async)|compv[34]_(plain|unroll)|direct)\.kdp\.json$|
          ^dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdAotPacks\.cpp$|
          ^dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/descriptors/.*/heuristics/.*/model\.bin$

  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3
        exclude: *opted_out_but_scanned

  # MIOpen's generated wrapper sources are formatted with this release
  # (projects/miopen/script/generate_wrapper_sources.py). A bump must regenerate
  # them in the same PR and update the pin in the miopen-wrapper-sources hooks
  # below. The generator takes another release while its output matches, so a
  # bump that changes no wrapping needs no new MIOpen CI image. MIOpen's hooks
  # skip PRs that leave projects/miopen alone, so nothing else catches a missed
  # step.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.4
    hooks:
      - id: clang-format
        name: clang-format (C/C++/ObjC)
        entry: clang-format -i -style=file
        files: '\.(c|cpp|cc|h|hpp|m|mm|cl)$|\.(h|hpp|cpp)\.in$'
        exclude: *opted_out_but_scanned

  # Blocks new unsafe yaml.load (arbitrary-object deserialization) from landing.
  # Intentionally outside the opted-out projects list: this is a security
  # regression gate, and it only inspects files a commit already touches.
  # See ROCM-26843 / SEC-00404.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (unsafe yaml.load / B506)
        args: ["-t", "B506"]
        # TODO(ROCM-26843): temporary. Drop once the pre-existing findings here
        # are converted, so the gate covers the whole repository.
        exclude: ^shared/rocroller/

  - repo: local
    hooks:
      - id: flatc-hipdnn
        name: flatc (hipDNN)
        entry: python projects/hipdnn/scripts/run_flatc.py
        language: python
        files: ^projects/hipdnn/(data_sdk|flatbuffers_sdk)/schemas/.*\.fbs$
        pass_filenames: true

      # Separate from flatc-hipdnn: the annotation it reads is invisible to flatc's
      # C++ output. Fires on the schemas (transitively, via the generator reading
      # their fields through flatc) and on the generator script itself, since a
      # change to its emitter/filter/type-walk logic can desync the checked-in
      # header just like a schema change can. Re-derives the whole header, so
      # pass_filenames is false.
      - id: cache-key-hipdnn
        name: cache key codegen (hipDNN)
        entry: python projects/hipdnn/scripts/gen_cache_key.py
        language: python
        files: ^projects/hipdnn/flatbuffers_sdk/schemas/.*\.fbs$|^projects/hipdnn/scripts/gen_cache_key\.py$|^projects/hipdnn/cmake/default_flatc_version\.txt$
        pass_filenames: false

      # Same trigger set as cache-key-hipdnn, plus the cache-key script it imports its
      # schema reader from.
      - id: node-operands-hipdnn
        name: node operand visitor codegen (hipDNN)
        entry: python projects/hipdnn/scripts/gen_node_operands.py
        language: python
        files: ^projects/hipdnn/flatbuffers_sdk/schemas/.*\.fbs$|^projects/hipdnn/scripts/gen_(cache_key|node_operands)\.py$|^projects/hipdnn/cmake/default_flatc_version\.txt$
        pass_filenames: false

      - id: verify-support-claims
        name: Verify hipDNN support-claim sidecars (RFC 0015)
        entry: python dnn-providers/integration-tests/scripts/verify_support_claims.py
        language: python
        pass_filenames: false
        files: ^dnn-providers/integration-tests/(integration-test-bundles/.*|scripts/((test_)?verify_support_claims|bundle_discovery|support_claim_schema)\.py)$

      # SUPPORT_MATRIX.md is generated, not committed (see
      # dnn-providers/integration-tests/.gitignore for why), so there is no
      # committed copy to check for staleness. Render and discard to catch
      # errors in the script itself (import, syntax) and in the sidecars it
      # reads: a malformed or orphaned sidecar, a claim on an unknown case,
      # tier copies of a case holding different graphs, a bundle not under
      # <tier>/<Op>/.
      # `--output -` rather than /dev/null so the hook works on Windows too;
      # pre-commit hides the stdout of a hook that passes.
      # Scoped with `files:` rather than always_run: CI checks out only the
      # directories a PR touches, so an always_run hook here would fail every
      # PR outside dnn-providers/integration-tests.
      # The script reads the tree through support_matrix_units.py, which uses
      # bundle_discovery.py, support_claim_schema.py and
      # migration-scripts/bundle_utils.py, so all of them count.
      - id: render-support-matrix
        name: Support matrix renders without errors (RFC 0015)
        entry: python dnn-providers/integration-tests/scripts/render_support_matrix.py --output -
        language: python
        pass_filenames: false
        files: ^dnn-providers/integration-tests/(integration-test-bundles/.*|scripts/(render_support_matrix|support_matrix_\w+|bundle_discovery|support_claim_schema)\.py|migration-scripts/bundle_utils\.py)$

      # SUPPORT_MATRIX_OVERVIEW.md is committed but refreshed on its own, not
      # with each claim change: every claim PR regenerating it made concurrent
      # claim PRs conflict on it. So, like render-support-matrix, this only
      # renders and discards, to catch errors in support_features/ and the
      # sidecars it reads. It goes through the same support_matrix_units.py
      # collection.
      - id: render-support-matrix-overview
        name: Support matrix overview renders without errors (RFC 0015)
        entry: python dnn-providers/integration-tests/scripts/support_features/feature_matrix.py --output -
        language: python
        pass_filenames: false
        files: ^dnn-providers/integration-tests/(integration-test-bundles/.*|scripts/(support_features/\w+|support_matrix_\w+|bundle_discovery|support_claim_schema)\.py|migration-scripts/bundle_utils\.py)$

      - id: gtest-format-miopen
        name: GTest naming conventions (MIOpen)
        entry: python projects/miopen/test/utils/gtest_formating_checks.py
        language: python
        files: ^projects/miopen/test/gtest/.*\.cpp$
        pass_filenames: false

      # Only the lines a change adds are checked (git diff against the
      # pre-commit from/to refs in CI, against HEAD otherwise), so the
      # existing absolute imports do not fail unrelated edits.
      - id: tensilelite-no-absolute-imports
        name: TensileLite - no new absolute tensilelite imports
        entry: python projects/hipblaslt/tensilelite/scripts/check_no_absolute_imports.py
        language: python
        files: ^projects/hipblaslt/tensilelite/tensilelite/.*\.py$
        exclude: ^projects/hipblaslt/tensilelite/tensilelite/Tests/

      # pytest 9 rejects these py.path hook arguments outright, so a conftest
      # carrying one aborts collection before any test runs.
      - id: tensilelite-no-legacy-pytest-hook-args
        name: TensileLite - no py.path pytest hook args (removed in pytest 9)
        language: pygrep
        entry: 'def pytest_\w+\([^)]*\b(path|startdir)\s*[:=,)]'
        args: [--multiline]
        files: ^projects/hipblaslt/.*conftest\.py$

      # CI checks out only the directories a PR touches, so a PR that changes
      # only .pre-commit-config.yaml or a provider file has no projects/miopen,
      # scripts included. The two checks below skip there rather than fail that
      # PR; MIOpen's component CI job, which provider changes also trigger,
      # still runs both on the full tree. The skip is Python, not bash, so the
      # hooks run on Windows too.
      #
      # What the generator below cannot replace: the few hand-written stubs in
      # wrapper.cpp, the wrapper-only functions (hipdnn_forwarding.h, their list
      # and their stubs), and the provider's hand-written declarations of the
      # GetWorkSpaceSizeRange entry points.
      - id: miopen-public-private-headers
        name: MIOpen public/private header consistency
        entry: >-
          python -c "import os, subprocess, sys;
          script = 'projects/miopen/script/check_public_abi.py';
          present = os.path.isfile(script);
          present or print('SKIP - projects/miopen is not checked out');
          sys.exit(subprocess.call([sys.executable, script, 'check-headers']) if present else 0)"
        language: python
        files: ^(projects/miopen/(include_wrapper/miopen/hipdnn_forwarding\.h|src/(private/wrapper\.cpp|convolution_api\.cpp)|test/public_abi/wrapper_only_symbols\.txt)|dnn-providers/miopen-provider/MiopenApi\.hpp)$
        pass_filenames: false

      # The wrapper's derived files are generated from include/miopen/miopen.h
      # and src/include/miopen/miopen_internal.h; this catches a hand edit or a
      # stale file. The generator prefers the release pinned for the clang-format
      # hook above, and takes another only while its output matches the committed
      # files (releases can wrap lines differently). That release is written twice
      # in this file: the clang-format hook's rev and the additional_dependencies
      # list that the two hooks below share. Bump both together; a mismatch shows
      # only when the output differs.
      - id: miopen-wrapper-sources
        name: MIOpen wrapper sources match miopen.h and miopen_internal.h
        entry: >-
          python -c "import os, subprocess, sys;
          script = 'projects/miopen/script/generate_wrapper_sources.py';
          present = os.path.isfile(script);
          present or print('SKIP - projects/miopen is not checked out');
          sys.exit(subprocess.call([sys.executable, script, '--check']) if present else 0)"
        language: python
        additional_dependencies: &miopen_clang_format ["clang-format==18.1.4"]
        files: ^(\.pre-commit-config\.yaml|projects/miopen/(\.clang-format|include/miopen/miopen\.h|include_wrapper/miopen/hipdnn_forwarding\.h|script/(generate_wrapper_sources|check_public_abi)\.py|src/include/miopen/miopen_internal\.h|src/private/(wrapper|wrapper_passthrough)\.cpp|src/private/(miopen_impl|miopen_private_rename)\.h)|dnn-providers/miopen-provider/(\.clang-format|MiopenApiPrivateRename\.hpp))$
        pass_filenames: false

      # Rewrites those files. Manual only, so it never runs in CI; run it with
      #   pre-commit run --hook-stage manual miopen-wrapper-sources-regenerate --all-files
      # to get the pinned clang-format without installing it yourself.
      - id: miopen-wrapper-sources-regenerate
        name: Regenerate MIOpen wrapper sources from miopen.h and miopen_internal.h
        entry: python projects/miopen/script/generate_wrapper_sources.py
        language: python
        additional_dependencies: *miopen_clang_format
        stages: [manual]
        pass_filenames: false

      # The checks above read C declarations with hand-rolled parsers rather
      # than a compiler. These are those parsers' own tests. They work on string
      # fixtures, apart from one test that compiles a small shared object with
      # the C compiler (it is skipped where there is none), so they run here --
      # where pre-commit provides pytest in an isolated environment -- rather
      # than in the MIOpen component CI job, which installs no Python packages.
      - id: miopen-public-private-header-check-tests
        name: MIOpen public/private header check self-tests
        entry: python -m pytest projects/miopen/script/test_check_public_abi.py projects/miopen/script/test_check_plugin_reentry.py projects/miopen/script/test_generate_wrapper_sources.py -q
        language: python
        additional_dependencies: ["pytest==8.4.2"]
        files: ^projects/miopen/script/(check_public_abi|test_check_public_abi|check_plugin_reentry|test_check_plugin_reentry|generate_wrapper_sources|test_generate_wrapper_sources)\.py$
        pass_filenames: false

      # The GPU-free dbsync runner exits 0 when it validates nothing (an unknown family, or a
      # gtest run in which every StaticFDBSync param skipped). Its self-tests feed it gtest JSON
      # fixtures and family tables a bad merge can produce, and check that each of them fails. They
      # read db_sync.cpp and the shipped system DB names, which are in the checkout whenever a file
      # under projects/miopen is part of the diff. Standard library only.
      - id: miopen-dbsync-runner-tests
        name: MIOpen GPU-free dbsync runner self-tests
        entry: python -m unittest discover -s projects/miopen/test/gtest/dbsync -p test_run_dbsync_rocjitsu.py
        language: python
        files: ^projects/miopen/test/gtest/(db_sync\.cpp|dbsync/(test_)?run_dbsync_rocjitsu\.py)$
        pass_filenames: false

      - id: kpack-pin-sync
        name: rocm_kpack pin is consistent (hipDNN)
        # The pin is the kpack-ref output of .github/actions/ci-env/action.yml.
        # Workflows read it from there. KpackPython.cmake and the dev container
        # Dockerfile cannot -- CMake does not run under Actions, and the image
        # build fetches the Dockerfile standalone into an empty context -- so
        # both carry a literal copy that this hook holds equal.
        entry: >-
          bash -c '
          set -uo pipefail;
          src=.github/actions/ci-env/action.yml;
          read_file() {
          if [ -f "$1" ]; then cat "$1";
          else git show "HEAD:$1" 2>/dev/null; fi;
          };
          pin=$(read_file "$src"
          | sed -n "/^  kpack-ref:/,/^  [a-z]/p"
          | grep -oE "[0-9a-f]{40}" | head -1);
          test -n "$pin" || { echo "kpack pin: no 40-char kpack-ref SHA in $src" >&2; exit 1; };
          check() {
          got=$(read_file "$1" | grep -oE "$2[0-9a-f]{40}" | grep -oE "[0-9a-f]{40}" | head -1);
          test -n "$got" || { echo "kpack pin: no pinned SHA in $1" >&2; exit 1; };
          test "$got" = "$pin" || { echo "kpack pin: $1 has $got, expected $pin from $src" >&2; exit 1; };
          };
          check dnn-providers/hip-kernel-provider/cmake/KpackPython.cmake
          "^set\(HIPKERNELPROVIDER_KPACK_GIT_REF \"";
          check projects/hipdnn/dockerfiles/Dockerfile.ubuntu24
          "^ARG ROCM_SYSTEMS_KPACK_REF=";
          '
        language: system
        # The source of truth, or either copy. The check always inspects the
        # full set, so this only decides when it runs.
        files: >-
          (?x)^(
            \.github/actions/ci-env/action\.yml|
            dnn-providers/hip-kernel-provider/cmake/KpackPython\.cmake|
            projects/hipdnn/dockerfiles/Dockerfile\.ubuntu24
          )$
        pass_filenames: false

      # Every S/D/C/Z declaration in a /**@{*/ group carries a copy of the
      # block before /**@{*/, so libclang and clangd see it. Fails when a copy
      # differs from that block (fix with sync_group_docs.py --write) or when
      # a preprocessor conditional separates a doc block from its declaration.
      # Reads the whole header tree, so pass_filenames is false.
      - id: hipsparse-group-docs
        name: hipSPARSE grouped documentation is in sync
        entry: python projects/hipsparse/scripts/sync_group_docs.py
        language: python
        files: ^projects/hipsparse/(library/include/.*\.h|scripts/sync_group_docs\.py)$
        pass_filenames: false

      - id: hipsparse-group-docs-tests
        name: hipSPARSE documentation script self-tests
        entry: python -m unittest discover -s projects/hipsparse/scripts -p test_*doc*.py
        language: python
        files: ^projects/hipsparse/scripts/(test_)?(sync_group_docs|audit_doc_attachment)\.py$
        pass_filenames: false

      # String fixtures, so this runs in pre-commit rather than after an
      # instrumented coverage build. A failure there would skip the upload.
      - id: rocsparse-coverage-merge-tests
        name: rocSPARSE coverage merge self-tests
        entry: python -m unittest discover -s projects/rocsparse/scripts -p test_merge_coverage_info.py
        language: python
        files: ^projects/rocsparse/scripts/(merge_coverage_info|test_merge_coverage_info)\.py$
        pass_filenames: false

      # The rocke-* hooks below set no stages, so they run at whichever hook
      # type is installed and in CI's default stage. To run the hooks when you
      # push rather than at each commit, install them with
      #   pre-commit install --hook-type pre-push
      # instead of plain pre-commit install; this moves every hook of this
      # file, not only rocKE's, to push time. CI runs them on each pull
      # request either way, but checks out only the directories the pull
      # request touches: a hook runs there only when its files are checked
      # out, so a change to this file alone runs no rocKE check in CI.
      # A rocKE hook whose tests configure the platform passes
      # --require-build-programs (rocke/platform/tests/conftest.py): such a
      # test fails, rather than skips, where cmake or ctest is missing from
      # PATH, so the hook cannot pass having checked nothing.
      # rocKE layering ratchet: platform's imports of the library packages
      # (kernels, builders, dispatch, benchmarks) may only shrink. It audits
      # the source tree, so the installed rocke_pytest CTest skips it; this
      # hook is what enforces it. AST-only: no GPU, no rocke import, no engine
      # build. --noconftest skips the rocKE conftest; no:cacheprovider keeps
      # .pytest_cache out of the tree.
      - id: rocke-library-reach
        name: rocKE platform -> library imports only shrink
        entry: python -m pytest -p no:cacheprovider --noconftest -q dnn-providers/hip-kernel-provider/rocke/platform/tests/test_library_reach.py
        language: python
        # One environment for every rocKE hook: the hooks below reuse this
        # list, so pre-commit builds and caches it once. pytest 9 runs the
        # checks; the conftest that imports rocke needs numpy, pinned to a
        # release that still supports Python 3.10, rocKE's oldest; the
        # provider's CTest categories are YAML.
        additional_dependencies: &rocke_dependencies ["pytest==9.2.0", "numpy==2.2.6", "PyYAML==6.0.4"]
        files: ^dnn-providers/hip-kernel-provider/rocke/platform/(python|tests|tools|dsl_docs|cpp)/.*\.py$
        pass_filenames: false

      # rocKE source-tree gates. Each reads the source checkout (git, the
      # provider's CTest categories, a configure of the platform, or a C++
      # source as text), which the installed test tree does not carry, so their
      # CTest entries exist in the build tree only; these hooks run them on a
      # pull request. -B and no:cacheprovider keep bytecode and .pytest_cache
      # out of the tree.
      # Every test file is assigned to a CI CTest entry or is listed, with its
      # reason, in rocke.tests.pending_lanes (rocke_pending_lanes_check). An
      # assigned file runs only in a CI job that builds rocKE. The hook also
      # runs test_gpu_work_placement.py, as rocke_pending_lanes_check does: no
      # CTest entry without the GPU lock selects a test module that marks a test
      # gpu, or that imports a GPU launch entry point and marks none. And it
      # runs test_quick_tier.py: the quick tier keeps to its rules (budget, item
      # budget, no GPU entry; rocke/TESTING.md section 5.0.3), so a new quick
      # entry fails until its time is recorded. Needs cmake, ctest and a C++
      # compiler on PATH. It reads Python, JSON, YAML and ini files, and the
      # configure reads CMake files and lists C/C++ sources and reference files;
      # no check, configure step or glob reads rocKE's documentation, so a
      # change to it alone skips the hook. It also reads the shared category
      # parser (shared/ctest/parse_ctest_categories.py) and CODEOWNERS (the
      # teams of rocKE's paths), so it takes both. CI checks out only the
      # directories a change touches, so a change to one of them alone may
      # check out no rocKE: this command runs python with the arguments after
      # the first only when that path, rocKE, is checked out, and otherwise
      # prints a SKIP line (shown with pre-commit run --verbose) and passes.
      - id: rocke-pending-lanes
        name: rocKE every test file is assigned to a CI entry or has a recorded reason
        entry: &rocke_when_checked_out >-
          python -c "import os, subprocess, sys;
          present = os.path.exists(sys.argv[1]);
          present or print('SKIP:', sys.argv[1], 'is not checked out');
          sys.exit(present
          and subprocess.call([sys.executable, '-B', *sys.argv[2:]]))"
        args:
          - dnn-providers/hip-kernel-provider/rocke
          - -m
          - pytest
          - -p
          - no:cacheprovider
          - -q
          - --require-build-programs
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_pending_lanes.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_limbo_audit.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_gpu_work_placement.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_quick_tier.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: |
          (?x)^(
            dnn-providers/hip-kernel-provider/(
              rocke/|ROCKE_ENGINE_test_categories_external\.yaml$)|
            shared/ctest/parse_ctest_categories\.py$|
            \.github/CODEOWNERS$
          )
        exclude: ^dnn-providers/hip-kernel-provider/rocke/(.*\.mdc?|(.*/)?\.clinerules)$
        pass_filenames: false
      # Runs each rocKE hook of this file that takes no file names, for a
      # change that deletes files it takes and adds or edits none, which
      # pre-commit would skip it for: deleting a test file the registry
      # records, or a file an allowlist lists, leaves a stale line that fails
      # the next change. See rocke/tools/run_hook_on_deletion.py;
      # test_run_hook_on_deletion.py holds the list to every such hook. It
      # runs on every change; one that deletes nothing costs a git diff. CI
      # checks out only the directories a change touches, so it runs through
      # the command rocke-pending-lanes defines, which runs nothing where rocKE
      # is not checked out. It is not for a change that touches nothing under hip-kernel-provider,
      # which deletes nothing under rocKE, or that only moves rocKE files
      # elsewhere (CI lists a rename by its new path).
      - id: rocke-on-deletion
        name: rocKE hooks run for a change that only deletes files they read
        entry: *rocke_when_checked_out
        args:
          - dnn-providers/hip-kernel-provider/rocke
          - dnn-providers/hip-kernel-provider/rocke/tools/run_hook_on_deletion.py
          - rocke-library-reach
          - rocke-pending-lanes
          - rocke-compliance-rules
          - rocke-no-torch
          - rocke-toolchain-pins
          - rocke-arch-table-engine-parity
          - rocke-gemm-spec-dict-binding-parity
          - rocke-emitter-pair-parity
          - rocke-emitter-pair-files
          - rocke-native-unit-tests
          - rocke-hook-checks
        language: python
        additional_dependencies: *rocke_dependencies
        always_run: true
        pass_filenames: false
      # No git-tracked file of rocKE holds a compliance hit. A hit depends only
      # on a file's text and the patterns, so rocke-compliance scans the files
      # a change adds or edits, and rocke-compliance-rules scans the whole tree
      # (rocke_compliance_pytest) when the patterns or their scanner change, so
      # a new pattern is held against every file.
      - id: rocke-compliance
        name: rocKE changed files pass the compliance patterns
        entry: python -B dnn-providers/hip-kernel-provider/rocke/tools/compliance_patterns.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/
        # The tree scan reads a tracked symlink's target; so does this one.
        types_or: [file, symlink]
      - id: rocke-compliance-rules
        name: rocKE compliance patterns hold, and the whole tree passes them
        entry: python -B -m pytest -p no:cacheprovider -q dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_compliance_patterns.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/(tools/compliance_patterns\.(py|json)|platform/tests/tools/test_compliance_patterns\.py)$
        pass_filenames: false
      # No new torch use under rocKE (rocke_no_torch_check). The check reads
      # Python files, requirements and pyproject.toml files, CMake files and
      # its allowlist; importing rocke adds ini and JSON files. A change to
      # any other file cannot change its outcome, so it skips the hook.
      - id: rocke-no-torch
        name: rocKE adds no torch use
        entry: python -B -m pytest -p no:cacheprovider -q dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_no_torch.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/.*\.(py|toml|txt|cmake|ini|json)$
        pass_filenames: false
      # No new toolchain pin in rocKE's test and library code
      # (rocke_toolchain_pins_check). The check reads Python files and its
      # allowlist; importing rocke adds ini and JSON files. A change to any
      # other file cannot change its outcome, so it skips the hook.
      - id: rocke-toolchain-pins
        name: rocKE adds no toolchain pin
        entry: python -B -m pytest -p no:cacheprovider -q dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_toolchain_pins.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/.*\.(py|txt|ini|json)$
        pass_filenames: false

      # The engines' parity checks need no build. Each fires on what can change
      # its outcome: the files whose content it compares and the modules it
      # imports beyond what import rocke loads. A break in import rocke, the
      # conftest or pytest.ini fails rocke-pending-lanes above, which runs on
      # every change to rocKE but its documentation.
      # data.cpp and arch_specs.json agree on each arch's scalar facts and GEMM
      # capabilities (rocke_arch_table_engine_parity). assets.py locates both.
      - id: rocke-arch-table-engine-parity
        name: rocKE engines' arch tables agree
        entry: python -B -m pytest -p no:cacheprovider -q dnn-providers/hip-kernel-provider/rocke/platform/tests/core/test_arch_table_engine_parity.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/platform/(tests/core/test_arch_table_engine_parity\.py|cpp/core/arch/data\.cpp|python/rocke/(assets\.py|core/arch/data/arch_specs\.json))$
        pass_filenames: false
      # Each GEMM spec dict carries every field of its spec, and the binding
      # reads exactly the keys it writes (rocke_gemm_spec_dict_binding_parity).
      # The test imports rocke.instances, whose __init__.py loads most modules
      # of instances/common; the hook takes that directory whole, so a module
      # __init__.py starts loading needs no change here.
      - id: rocke-gemm-spec-dict-binding-parity
        name: rocKE GEMM spec dicts match the engine binding
        entry: python -B -m pytest -p no:cacheprovider -q dnn-providers/hip-kernel-provider/rocke/platform/tests/core/test_gemm_spec_dict_binding_parity.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: ^dnn-providers/hip-kernel-provider/rocke/platform/(tests/core/test_gemm_spec_dict_binding_parity\.py|cpp/bindings/rocke_engine\.cpp|python/rocke/(assets\.py|core/backend\.py|instances/(__init__|common/[^/]+)\.py))$
        pass_filenames: false

      # The C emitters against their Python twins: the same HIP text
      # (rocke_optimization_barrier_hip_pair) and the same refusals, with the
      # same messages (rocke_coalesced_loader_async_refusals). Both entries run
      # a C program linked with the engine, so the runner builds those two
      # programs (C++ only: no ROCm, HIP or LLVM) and runs the two entries
      # through CTest. Needs cmake, ctest and a C++ compiler on PATH. The
      # runner configures the platform without the sibling library.
      # The pattern takes what can change the entries' outcome: the CMake files
      # the configure reads and the platform's cmake/ helpers, the engine's C++
      # sources, the build steps' generators and their inputs, the emitter
      # programs, the arch data the engine reads at run time, and the Python
      # files the entries' scripts and the runner can import (every top-level
      # module of each engine package they import from; test support and
      # scripts by name). A change to any other file, such as another test,
      # skips the hook.
      - id: rocke-emitter-pair-parity
        name: rocKE C and Python emitters agree on HIP text and refusals
        entry: python -B dnn-providers/hip-kernel-provider/rocke/platform/tools/run_build_tree_ctest.py --target rocke_optimization_barrier_emit --target rocke_coalesced_loader_async_emit --test rocke_optimization_barrier_hip_pair --test rocke_coalesced_loader_async_refusals
        language: python
        additional_dependencies: *rocke_dependencies
        files: &rocke_emitter_pair_files |
          (?x)^dnn-providers/hip-kernel-provider/rocke/platform/(
            CMakeLists\.txt|cmake/[^/]+|tests/CMakeLists\.txt|tests/cmake/[^/]+|
            tests/golden/attention_dense(_gfx950)?_spec_vectors\.json|
            cpp/(?!bindings/).+(?<!\.md)|
            tools/(gen_arch_domain_cpp|gen_cxx_keywords_cpp|run_build_tree_ctest)\.py|
            python/rocke/(
              (analysis/|benchmark/(perf/)?|core/(arch/|isa/)?|helpers/|
               instances/(common/(manifest_runner/)?)?|numeric/|runtime/)?[^/]+\.py|
              core/arch/data/[^/]+|
              tests/(__init__|ci_shard|ctest_listing|hip_identity_cases|
                hip_outcomes|host_cpus|platform_build|staged_payload|
                subprocess_launcher)\.py
            )|
            tests/core/test_optimization_barrier_cli\.py|
            tests/instances/differential/(compare_refusals|golden_store|
              python_batch_worker|run_diff)\.py|
            tests/instances/parity/(_emit_common\.py|
              (coalesced_loader_async|optimization_barrier)_emit\.(c|py))
          )$
        pass_filenames: false
      # The pattern above takes every file the configure reads, every file the
      # emitter programs compile, and every Python file the entries' scripts
      # and the runner can import, and no test module none of them can import.
      # A new import or CMake include edits a file the pattern takes, so this
      # check runs on it; rocke-hook-checks runs it when the config changes.
      # It cannot see the files a build step's command reads: the generator
      # scripts and cmake/ helpers in the pattern.
      - id: rocke-emitter-pair-files
        name: rocKE emitter pair hook takes every file its entries read
        entry: python -B -m pytest -p no:cacheprovider -q --require-build-programs dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_emitter_pair_hook_files.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: *rocke_emitter_pair_files
        pass_filenames: false

      # The platform's native C++ unit programs: the entries labelled unit,
      # plain programs that need a C++ compiler and no ROCm, HIP or LLVM, and
      # rocke_arch_data_mirror by name, which holds the engine's generic-target
      # table to arch_specs.json and runs from the build tree only. The runner
      # builds every program of the platform-only tree, in the build tree
      # rocke-emitter-pair-parity keeps, so a repeated run rebuilds only what
      # changed. Needs cmake, ctest and a C++ compiler on PATH.
      # The pattern takes what can change the entries' outcome: the CMake files
      # the configure reads and the platform's cmake/ helpers, the engine's and
      # the test programs' C++ sources, the build steps' generators and their
      # inputs, the arch data the programs read at run time, and the runner
      # with the modules it imports beyond what import rocke loads.
      # test_emitter_pair_hook_files.py holds it to what the configure reads,
      # what the programs compile and what the runner imports.
      - id: rocke-native-unit-tests
        name: rocKE native C++ unit programs pass
        entry: python -B dnn-providers/hip-kernel-provider/rocke/platform/tools/run_build_tree_ctest.py --label ^unit$ --test rocke_arch_data_mirror
        language: python
        additional_dependencies: *rocke_dependencies
        files: |
          (?x)^dnn-providers/hip-kernel-provider/rocke/platform/(
            CMakeLists\.txt|cmake/[^/]+|tests/CMakeLists\.txt|tests/cmake/[^/]+|
            tests/golden/attention_dense(_gfx950)?_spec_vectors\.json|
            cpp/(?!bindings/).+(?<!\.md)|
            tests/.+\.(c|cc|cpp|h|hpp|inc)|
            tools/(gen_arch_domain_cpp|gen_cxx_keywords_cpp|run_build_tree_ctest)\.py|
            python/rocke/core/(cxx_keywords|arch/domain)\.py|
            python/rocke/core/arch/data/[^/]+|
            python/rocke/tests/(__init__|ctest_listing|host_cpus|platform_build)\.py
          )$
        pass_filenames: false

      # The checks of the rocKE hooks themselves: the tools that read this
      # config (rocke/tools/precommit_hooks.py and run_hook_on_deletion.py),
      # the checks' tests and every module they import beyond what import rocke
      # loads (test_precommit_hooks.py holds the pattern to that), and this
      # config, whose hooks they read. In CI an edit to this config alone
      # checks out no rocKE, so this hook runs nothing for it there.
      - id: rocke-hook-checks
        name: rocKE hook tools and hook config checks pass
        entry: *rocke_when_checked_out
        args:
          - dnn-providers/hip-kernel-provider/rocke
          - -m
          - pytest
          - -p
          - no:cacheprovider
          - -q
          - --require-build-programs
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/support/test_cmake_file_api.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/support/test_import_closure.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_emitter_pair_hook_files.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_precommit_hooks.py
          - dnn-providers/hip-kernel-provider/rocke/platform/tests/tools/test_run_hook_on_deletion.py
        language: python
        additional_dependencies: *rocke_dependencies
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            dnn-providers/hip-kernel-provider/rocke/(
              tools/(precommit_hooks|run_hook_on_deletion)\.py|
              platform/python/rocke/tests/(__init__|cmake_file_api|cmake_generator|
                ctest_listing|host_cpus|import_closure|lanes|platform_build|
                provider_categories|source_modules)\.py|
              platform/tests/support/test_(cmake_file_api|import_closure)\.py|
              platform/tests/tools/test_(emitter_pair_hook_files|precommit_hooks|
                run_hook_on_deletion)\.py
            )
          )$
        pass_filenames: false

      - id: split-to-stack-tests
        name: split-to-stack skill tests
        entry: python -m pytest skills/split-to-stack/scripts/test_split_to_stack.py -q
        language: python
        additional_dependencies: ["pytest==8.4.2"]
        files: ^skills/split-to-stack/scripts/
        pass_filenames: false

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.10
    hooks:
      - id: cmake-lint
        exclude: |
          (?x)
          projects/hipblaslt/.*|
          projects/hipsparse/.*|
          projects/rocsparse/.*|
          shared/tensile/.*|
          # MIOpen CMake files have not been audited for cmake-lint compliance yet.
          ^projects/miopen/.*
      # cmake-format is disabled due to undesirable formatting.
      # We can investigate changing the configuration before re-enabling or using an alternative tool.
      # - id: cmake-format
