#
# What the rocfft C headers cannot express, beyond the defaults the generator
# derives from them: one table per C function, and a key with braces names
# several. A _64 or _spt variant without a table takes its base's. See "Fixing a
# binding" in the generator README; `gen.sh --explain <function>` shows what
# applies.

format = 1
# by-value:
#   The callback `void**` arrays are documented nullable. By reference, a variable
#   holding c_null_ptr arrives as its own non-NULL address, so a callback could
#   never be cleared.

[rocfft_cache_serialize]
buffer_len_bytes = "scalar-host"

# The buffer arrays are on the host and hold one pointer per buffer: by
# reference, a caller passes one device pointer variable, or c_null_ptr.
[rocfft_execute]
in_buffer = "by-reference"
out_buffer = "by-reference"

[rocfft_execution_info_set_load_callback]
cb_functions = "by-value"
cb_data = "by-value"

[rocfft_execution_info_set_load_callback_data]
cb_data = "by-value"

[rocfft_execution_info_set_store_callback]
cb_functions = "by-value"
cb_data = "by-value"

[rocfft_execution_info_set_store_callback_data]
cb_data = "by-value"
