#
# What the rocsparse C headers cannot express, beyond the defaults the generator
# derives from them: one table per C function, and a key with braces names
# several. A _64 or _spt variant without a table takes its base's. See "Fixing a
# binding" in the generator README; `gen.sh --explain <function>` shows what
# applies.

format = 1
# scalar-pointer-mode:
#   A *_buffer_size routine classifies the alpha/beta/threshold its compute twin
#   classifies, so the size query takes the same _typed arguments.
# nullable:
#   Arguments documented as nullable. The module procedures take them OPTIONAL and
#   pass c_null_ptr when absent (an OPTIONAL dummy in a bind(C) interface needs F2018).

