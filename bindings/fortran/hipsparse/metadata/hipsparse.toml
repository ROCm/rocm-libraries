#
# What the hipsparse C headers cannot express, beyond the defaults the generator
# derives from them: one table per C function, and a key with braces names
# several. A _64 or _spt variant without a table takes its base's. See "Fixing a
# binding" in the generator README; `gen.sh --explain <function>` shows what
# applies.

format = 1
# scalar-pointer-mode:
#   A size query classifies the alpha/beta/threshold its compute twin classifies, so
#   it takes the same _typed arguments (the pointer_mode default covers alpha and beta).

[hipsparseXbsric02_zeroPivot]
position = "scalar-pointer-mode"

["hipsparse{S,D,C,Z}bsrilu02_numericBoost"]
