flag_management:
  default_rules:
    carryforward: false # drop unused flags by default instead of carrying forward perpetually
  individual_flags: # exceptions to the default rules above, stated flag by flag
    -name: composable_kernel
      carryforward: true
    -name: hipBLAS
      carryforward: true
    -name: hipBLASLt
      carryforward: true
    -name: TensileLite-Unit
      carryforward: true
    -name: TensileLite-CPP
      carryforward: true
    -name: hipCUB
      carryforward: true
    -name: hipSPARSE
      carryforward: true
    -name: hipSPARSELt
      carryforward: true
    -name: rocBLAS
      carryforward: true
    -name: rocPRIM
      carryforward: true
    -name: rocRAND
      carryforward: true
    -name: hipRAND
      carryforward: true
    -name: hipDNN
      carryforward: true
    -name: rocRoller
      carryforward: true
    -name: rocSPARSE
      carryforward: true
    -name: rocThrust
      carryforward: true
    -name: hipFFT
      carryforward: true
    -name: rocFFT
      carryforward: true
    -name: Tensile
      carryforward: true
    -name: hipSOLVER
      carryforward: true
    -name: rocSOLVER
      carryforward: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false  # post comment even if coverage does not change
  require_base: no # post without previous or base report
  require_head: yes # must have PR or head report to post
  show_carryforward_flags: true # use carryforward for PRs

coverage:
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude # don't send status checks for unrelated projects
    project:
      default:
        enabled: false # only check flags instead of whole monorepo
      composable_kernel:
        flags: [composable_kernel]
        target: 80%
      hipBLAS:
        flags: [hipBLAS]
        target: 80%
      hipBLASLt:
        flags: [hipBLASLt]
        target: 80%
      TensileLite-Unit:
        flags: [TensileLite-Unit]
        target: 80%
      TensileLite-CPP:
        flags: [TensileLite-CPP]
        target: 80%
      hipCUB:
