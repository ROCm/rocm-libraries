flag_management:
  default_rules:
    carryforward: false # drop unused flags by default instead of carrying forward perpetually
  individual_flags: # exceptions to the default rules above, stated flag by flag
    # Each project starts from a different established coverage level. `auto`
    # compares each flag's project coverage with its matching base report instead
    # of leaving projects below a shared target permanently red.
    - name: composable_kernel
      carryforward: true
      statuses:
      - type: project
        target: auto
    - name: hipBLASLt
      carryforward: true
      statuses:
      - type: project
        target: auto
        threshold: 0.2%
