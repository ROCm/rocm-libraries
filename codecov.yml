        target: 80%
      rocBLAS:
        flags: [rocBLAS]
        target: 80%
      rocPRIM:
        flags: [rocPRIM]
        target: 80%
      rocRAND:
        flags: [rocRAND]
        target: 80%
      hipRAND:
