# rocWMMA Test Categories Configuration (CTest)
#
# Based on test_rocwmma.py from TheRock.
#
# Labels here are applied to the *installed-tree* CTestTestfile.cmake
# fragments (full / smoke / regression) by a single call to
# apply_ctest_category_labels(yaml, install_test_file) in
# projects/rocwmma/test/CMakeLists.txt, after every subdirectory has
# appended its add_test() lines. The shared parser scans those lines
# for test names and emits explicit set_tests_properties(... LABELS ...)
# entries, which is the only form ctest's script interpreter exposes
# through `--print-labels` / `-L` at install time.
#
# Test types used by TheRock (test_runner.py):
# - quick: ctest --test-dir …/rocwmma/regression with -L quick (emulation regression tree; ~12 min)
# - standard/comprehensive/full: ctest --test-dir …/rocwmma with -L <tier> -LE <tier>_exclude
#
# Tier labels are applied automatically by parse_ctest_categories.py:
#   quick         -> quick, standard, comprehensive, full so that tests in quick category will be run for all categories
#   standard      -> standard, comprehensive, full
#   comprehensive -> comprehensive, full
#   full          -> full
# The `labels:` field below is a placeholder for additional custom labels
# (e.g. "flaky", "gpu_only", "slow"). The category's own tier label is
# kept here for clarity and as an anchor for future additions.

test_categories:
  quick:
    description: "rocWMMA quick tests - regression install tree (emulation + regression_tests)"
    test_patterns:
      - "regression_tests"
      - ".* regression$"
    exclude:
      # Flaky/problematic tests excluded
      - ".*unpack_util_test.*"
      - ".*contamination_test.*"
      - ".*map_util_test.*"
      - ".* smoke"
    labels:
      - "quick"

  standard:
    description: "rocWMMA standard tests"
    test_patterns:
      # Negative lookahead excludes the smoke/regression emulation variants
      # so this tier only picks up full (non-emulation) test runs.
      - "(?!.* (?:smoke|regression)$).*"
    exclude:
      - ".*unpack_util_test.*"
      - ".*contamination_test.*"
      - ".*map_util_test.*"
      - ".* regression"
      - ".* smoke"
    labels:
      - "standard"

  comprehensive:
    description: "rocWMMA comprehensive tests"
    test_patterns:
      # Negative lookahead excludes the smoke/regression emulation variants
      # so this tier only picks up full (non-emulation) test runs.
      - "(?!.* (?:smoke|regression)$).*"
    exclude:
      - ".*unpack_util_test.*"
      - ".*contamination_test.*"
      - ".*map_util_test.*"
      - ".* regression"
      - ".* smoke"
    labels:
      - "comprehensive"

  full:
    description: "rocWMMA full test suite - includes flaky/problematic tests (unpack_util, contamination, map_util) excluded from lower tiers"
    test_patterns:
      # Negative lookahead excludes the smoke/regression emulation variants
      # added to the main install CTestTestfile — those are available via the
      # smoke/ and regression/ install subdirectories or via ffm-quick.
      # Using a lookahead instead of exclude means `ctest -L full` works
      # without needing `-LE full_exclude`.
      - "(?!.* (?:smoke|regression)$).*"
    exclude:
      - ".* regression"
      - ".* smoke"
    labels:
      - "full"

  ffm-quick:
    description: "FFM simulator tests"
    test_patterns:
      - "regression_tests"
      - "float_test"
      - "vector_test smoke"
      - "vector_util_test smoke"
      - "vector_iterator_test smoke"
      - "tuple_test smoke"
      - "pack_util_test smoke"
      - "io_traits_test smoke"
      - "io_shape_test smoke"
      - "cross_lane_ops_test smoke"
      - "fill_fragment_test smoke"
      - "transforms_test smoke"
      - "layout_test smoke"
      - "layout_traits_test smoke"
      - "load_store_matrix_sync_test smoke"
      - "gemm_PGR0_LB0_MP0_MB_NC-validate smoke"
      - "gemm_PGR0_LB0_MP0_SB_NC-validate smoke"
      - "gemm_PGR1_LB2_MP0_MB_CP_BLK-validate smoke"
      - "gemm_PGR0_LB0_MP0_MB_NC_ad_hoc-validate"
      - "gemm_PGR0_LB0_MP0_SB_NC_ad_hoc-validate"
      - "gemm_PGR1_LB2_MP0_MB_CP_ad_hoc-validate"
      - "dlrm_dot_test-validate smoke"
      - "dlrm_dot_lds_test-validate smoke"
      - "load_store_matrix_coop_sync_test shard0 smoke"
      - "contamination_test smoke"
      - "map_util_test smoke"
      - "unpack_util_test smoke"
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  category_timeouts:
    ffm-quick: 7200       # 2 hours (FFM simulator budget)
    ffm-full: 7200
