# rocSOLVER Test Categories Configuration
# Aligned with rocJenkins job types and Test Filter Standardization.
#
# rocSOLVER uses a simple two-tier naming convention:
#   checkin_* - Fast tests for precheckin validation
#   daily_*   - Comprehensive tests for nightly/extended runs

test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min) - subset of checkin tests"
    test_patterns:
      - "checkin_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Pre-checkin validation (target: < 45 min) - same as Jenkins precheckin"
    test_patterns:
      - "checkin_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive tests (target: < 7 hours) - same as Jenkins extended"
    test_patterns:
      - "daily_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete test suite - all tests including daily"
    test_patterns:
      - "checkin_*"
      - "daily_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "weekly"
      - "all"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300      # 5 minutes
    standard: 2700  # 45 minutes (matches Jenkins precheckin timeout)
    comprehensive: 25200  # 7 hours (matches Jenkins extended timeout)
    full: 28800     # 8 hours
