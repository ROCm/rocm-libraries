<line x1="577" y1="102" x2="577" y2="304" class="grid"/>
<text x="577" y="320" class="t3 s" text-anchor="middle">1500</text>
<line x1="682" y1="102" x2="682" y2="304" class="grid"/>
<text x="682" y="320" class="t3 s" text-anchor="middle">2000</text>
<text x="682" y="336" class="t3 s" text-anchor="end">us per call, lower is better</text>
<text x="250" y="125" class="t1 n" text-anchor="end">A-stationary fused</text>
