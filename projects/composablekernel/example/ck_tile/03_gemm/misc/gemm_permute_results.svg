<text x="667.32" y="221" class="t1 n halo" text-anchor="start">1890 to 1892 us</text>
<text x="776.32" y="221" class="t2 n halo" text-anchor="start">0.90x</text>
<text x="250" y="261" class="t1 n" text-anchor="end">Weight-preshuffle GEMM alone</text>
<path class="o2" stroke-width="1.5" d="M262.75 248.75h158.7a4 4 0 0 1 4 4v8.5a4 4 0 0 1 -4 4h-158.7z"/>
<text x="434.22" y="261" class="t1 n halo" text-anchor="start">782 us</text>
<text x="250" y="289" class="t1 n" text-anchor="end">CompV3 GEMM alone</text>
<path class="o2" stroke-width="1.5" d="M262.75 276.75h202.0a4 4 0 0 1 4 4v8.5a4 4 0 0 1 -4 4h-202.0z"/>
<text x="477.48" y="289" class="t1 n halo" text-anchor="start">988 us</text>
<line x1="262" y1="102" x2="262" y2="304" class="axis"/>
<text x="24" y="354" class="t3 s" text-anchor="start">Two runs, each the median of 11 interleaved, rotated samples of 20 launches; weight reorder inside every fused call.</text>
<text x="24" y="370" class="t3 s" text-anchor="start">Speedup vs the best two-kernel pair. On N(0,1) data instead of the exactly representable test data, A-stationary is 2.27x to 2.29x.</text>
