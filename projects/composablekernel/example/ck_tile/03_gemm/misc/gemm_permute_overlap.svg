<text x="24" y="270" class="t2 s" text-anchor="start">Cells name the K step served. Tile i-1 is stored in 4 K steps: 32 rows and 8 stores of 8 B per lane per step.</text>
<text x="24" y="286" class="t2 s" text-anchor="start">Each store is issued with 4 MFMAs and 8 VALU ops (sched_group_barrier). The last tile is stored after the loop.</text>
<text x="24" y="302" class="t2 s" text-anchor="start">Weight loads cross the tile boundary: k0 and k1 of tile i are issued during k10 and k11 of tile i-1.</text>
<line x1="24" y1="316" x2="836" y2="316" class="grid"/>
<text x="24" y="339" class="t1 b" text-anchor="start">Measured</text>
<text x="100" y="339" class="t2 n" text-anchor="start">687 to 689 us per call; mainloop alone about 500 us; Y write alone (memset) 347 us; only part of the store time is hidden</text>
