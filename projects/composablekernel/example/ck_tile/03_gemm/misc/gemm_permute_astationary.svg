<text x="24" y="34" class="t1 h" text-anchor="start">One workgroup of the A-stationary kernel</text>
<text x="24" y="54" class="t2 n" text-anchor="start">One workgroup per (b, 128 rows of t): 3072 workgroups, 4 waves, 96 KiB of LDS, one barrier</text>
