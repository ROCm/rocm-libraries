<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 472" width="860" height="472" role="img" aria-label="One A-stationary workgroup loads its 128 by 384 A tile into LDS once, then each of 4 waves computes 8 output tiles of 128 by 64 while the weight streams from global memory straight into the MFMA registers; the stock pipeline instead loads the same A rows in 8 workgroups and stages A and B in LDS every K step">
<rect class="bg" x="0.5" y="0.5" width="859" height="471" rx="8"/>
