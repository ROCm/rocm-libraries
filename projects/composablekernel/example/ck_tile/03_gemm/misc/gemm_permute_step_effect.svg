<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 356" width="860" height="356" role="img" aria-label="TF/s of the fused GEMM + permute kernel after each optimization step on gfx950, from 325 to 898">
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-size:15px;font-weight:600}.b{font-size:13px;font-weight:600}.n{font-size:12px}.s{font-size:11px}.x{font-size:10px}.w{fill:#ffffff}.halo{paint-order:stroke;stroke-width:4px;stroke-linejoin:round}line{stroke-width:1}.ar{stroke-width:1.5}.bg{fill:#fcfcfb;stroke:#e1e0d9}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.track{fill:#e1e0d9}.cell{fill:#fcfcfb;stroke:#c3c2b7}.halo{stroke:#fcfcfb}.ref{stroke:#898781}.plate{fill:#fcfcfb}.ar{stroke:#898781}.ah{fill:#898781}.s1{fill:#2a78d6}.o1{stroke:#2a78d6;fill:none}.s2{fill:#eb6834}.o2{stroke:#eb6834;fill:none}.s3{fill:#1baf7a}.o3{stroke:#1baf7a;fill:none}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:#2c2c2a}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.track{fill:#2c2c2a}.cell{fill:#1a1a19;stroke:#383835}.halo{stroke:#1a1a19}.ref{stroke:#898781}.plate{fill:#1a1a19}.ar{stroke:#898781}.ah{fill:#898781}.s1{fill:#3987e5}.o1{stroke:#3987e5;fill:none}.s2{fill:#d95926}.o2{stroke:#d95926;fill:none}.s3{fill:#199e70}.o3{stroke:#199e70;fill:none}}</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="355" rx="8"/>
<text x="24" y="34" class="t1 h" text-anchor="start">Effect of each step on the fused kernel</text>
<text x="24" y="54" class="t2 n" text-anchor="start">gfx950 (MI350X, 1000 W cap), trace shape, BF16; each row is the fused kernel after the step it names</text>
<text x="342" y="276" class="t3 s" text-anchor="middle">0</text>
<line x1="442" y1="88" x2="442" y2="260" class="grid"/>
<text x="442" y="276" class="t3 s" text-anchor="middle">250</text>
<line x1="542" y1="88" x2="542" y2="260" class="grid"/>
<text x="542" y="276" class="t3 s" text-anchor="middle">500</text>
<line x1="642" y1="88" x2="642" y2="260" class="grid"/>
<text x="642" y="276" class="t3 s" text-anchor="middle">750</text>
<line x1="742" y1="88" x2="742" y2="260" class="grid"/>
<text x="742" y="276" class="t3 s" text-anchor="middle">1000</text>
<text x="742" y="292" class="t3 s" text-anchor="end">TF/s</text>
<line x1="486.9" y1="84" x2="486.9" y2="260" class="ref"/>
<text x="486.927" y="78" class="t2 s" text-anchor="middle">best two-kernel pair, 1707 us</text>
<text x="330" y="111" class="t1 n" text-anchor="end">First fused kernel: 64 x 128 tile, LDS regroup</text>
<path class="s1" d="M342 98h126.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-126.0z"/>
<text x="480.007" y="111" class="t1 n halo" text-anchor="start">325 TF/s</text>
<text x="550.007" y="111" class="t2 n halo" text-anchor="start">1902.9 us</text>
<text x="330" y="139" class="t1 n" text-anchor="end">Weight reorder W to Wp, stock CShuffle, 128 x 256</text>
<path class="s1" d="M342 126h222.3a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-222.3z"/>
<text x="576.32" y="139" class="t1 n halo" text-anchor="start">566 TF/s</text>
<text x="646.32" y="139" class="t2 n halo" text-anchor="start">1093.1 us</text>
<text x="330" y="167" class="t1 n" text-anchor="end">XCD-aware tile order: library kernel (in tree)</text>
<path class="s1" d="M342 154h244.5a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-244.5z"/>
<text x="598.533" y="167" class="t1 n halo" text-anchor="start">621 TF/s</text>
<text x="668.533" y="167" class="t2 n halo" text-anchor="start">995.4 us</text>
<text x="330" y="195" class="t1 n" text-anchor="end">Weight-preshuffle mainloop, permute epilogue</text>
<path class="s1" d="M342 182h316.7a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-316.7z"/>
<text x="670.744" y="195" class="t1 n halo" text-anchor="start">802 TF/s</text>
<text x="740.744" y="195" class="t2 n halo" text-anchor="start">771.3 us</text>
<text x="330" y="223" class="t1 n" text-anchor="end">A-stationary: A in LDS once, W into registers</text>
<path class="s1" d="M342 210h327.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-327.0z"/>
<text x="681.045" y="223" class="t1 n halo" text-anchor="start">828 TF/s</text>
<text x="751.045" y="223" class="t2 n halo" text-anchor="start">747.3 us</text>
<text x="330" y="251" class="t1 n" text-anchor="end">Direct store, double-buffered accumulators (in tree)</text>
<path class="s1" d="M342 238h355.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-355.0z"/>
<text x="709.005" y="251" class="t1 n halo" text-anchor="start">898 TF/s</text>
<text x="779.005" y="251" class="t2 n halo" text-anchor="start">689.1 us</text>
<line x1="342" y1="88" x2="342" y2="260" class="axis"/>
<text x="24" y="310" class="t3 s" text-anchor="start">Rows marked (in tree) are the two kernels of this example; the other rows are earlier states and the weight-preshuffle variant is not in the tree.</text>
<text x="24" y="326" class="t3 s" text-anchor="start">Rows come from different sessions, each the median of 11 interleaved samples of 20 launches; the weight reorder is inside the timed call from the</text>
<text x="24" y="342" class="t3 s" text-anchor="start">library-kernel row on. TF/s = 618.5 GFLOP / time. First to last row: 2.76x (indicative).</text>
</svg>
