<text x="24" y="34" class="t1 h" text-anchor="start">Direct store: each lane writes 4 consecutive d, no LDS shuffle</text>
<text x="24" y="54" class="t2 n" text-anchor="start">16x16x32 MFMA, C not transposed: the repacked weight puts tile column 4*j + r in N-repeat r, MFMA column j</text>
