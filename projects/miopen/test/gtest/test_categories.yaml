  - "*/GPU_Find2Conv_*"
  - "*/GPU_FindDb_*"
  - "*/GPU_FindModeTrustVerify_*"
  # RNN family (replaces the *GRUExtra* / *lstm_extra* patterns, which matched nothing)
  - "*/GPU_GRU_*"
