# MIOpen Test Categories Configuration
# Time-based test organization for CI/CD pipeline efficiency
# This file defines test categories by execution time and criticality

test_categories:
  quick:
    description: "Fast sanity checks - Run pre-commit (target: < 5 min)"
    test_patterns:
      - "Smoke/*"
      - "*Smoke*"
      - "*ActivationDescriptor*"
      - "*TensorDescriptor*"
      - "*FinInterface*"
      - "*lib_env_var*"
      - "*TestActivation*"
      - "*Activation*Test*"
      - "*handle*"
      - "*Handle*"
      - "*tensor_api*"
      - "*tensor_test*"
      - "*VecAdd*"
      - "*log_test*"
      - "*Log*Test*"
      - "*test_errors*"
      - "*pooling2d_asymmetric*"

    exclude:
      # Excluding to check functionality
      - "Smoke/*"
      - "*Smoke*"
      
    exclude_windows:
      # Excluding the following tests if run from Windows
      - "*handle*"
      - "*Handle*"

    exclude_linux:
      # Excluding to check functionality
      - "*TestActivation*"
      - "*Activation*Test*"

    test_files:
      - "gtest/smoke_*.cpp"
      - "gtest/unit_ActivationDescriptor.cpp"
      - "gtest/unit_TensorDescriptor.cpp"
      - "gtest/unit_FinInterface.cpp"
      - "gtest/unit_lib_env_var.cpp"
      - "gtest/gtest_activation.cpp"
      - "handle_test.cpp"
      - "gtest/handle_hip_device.cpp"
      - "gtest/tensor_api.cpp"
      - "gtest/tensor_test.cpp"
      - "gtest/log.cpp"
      - "gtest/log_test.cpp"
      - "gtest/test_errors.cpp"
      - "gtest/pooling2d_asymmetric.cpp"
    
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"
      - "critical"

  standard:
    description: "Core functionality - Run on every PR (target: < 30 min)"
    test_patterns:
      # Everything from quick and additional
      - "Smoke/*"
      - "*Smoke*"
      - "*ActivationDescriptor*"
      - "*TensorDescriptor*"
      - "*TestActivation*"
      - "*VecAdd*"
      - "*Conv2d*"
      - "*conv2d*"
      - "*ConvApi*"
      - "*MIOpenTestConv*"
      - "*BN*FWD*Train*"
      - "*BN*BWD*"
      - "*BN*Infer*"
      - "*BatchNorm*"
      - "*ConvApi*"
      - "*ConvActiv*"
      - "*Pooling*"
      - "*pooling*"
      - "*TensorOp*"
      - "*tensor*op*"
      - "*unary_tensor*"
      - "*binary_tensor*"
      - "*Softmax*"
      - "*softmax*"
      - "*Dropout*"
      - "*dropout*"
      - "*Reduce*"
      - "*reduce*"
      - "*LayerNorm*"
      - "*layernorm*"
      - "*Handle*"
      - "*handle*"
      - "*Cache*"
      - "*cache*"
      
    test_files:
      # Quick tests
      - "gtest/smoke_*.cpp"
      - "gtest/unit_*.cpp"
      - "gtest/gtest_activation.cpp"
      - "handle_test.cpp"
      - "gtest/handle_hip_device.cpp"
      
      # Standard tests
      - "conv2d.cpp"
      - "conv2d_bias.cpp"
      - "gtest/miopen_conv.cpp"
      - "bn_spatial_test.cpp"
      - "bn_peract_test.cpp"
      - "gtest/bn_fwd_train.cpp"
      - "gtest/bn_bwd.cpp"
      - "gtest/bn_infer.cpp"
      - "gtest/conv_api.cpp"
      - "gtest/conv_activ_infer.cpp"
      - "pooling2d.cpp"
      - "gtest/pooling2d_asymmetric.cpp"
      - "gtest/pooling2d_wide.cpp"
      - "tensor_reorder.cpp"
      - "tensor_trans.cpp"
      - "gtest/tensor_api.cpp"
      - "gtest/unary_tensor_ops.cpp"
      - "gtest/binary_tensor_ops.cpp"
      - "gtest/soft_max.cpp"
      - "gtest/dropout.cpp"
      - "gtest/reduce.cpp"
      - "gtest/layernorm.cpp"
      - "gtest/cache.cpp"
    
    labels:
      - "standard"
      - "pr"
      - "core"
      - "essential"

