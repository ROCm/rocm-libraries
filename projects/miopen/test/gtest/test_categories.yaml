  - "Full/GPU_Softmax_FP32*"  # 24 min
  - "Full/GPU_Softmax_BFP16*"  # 13 min
  - "Full/GPU_Softmax_FP16*" # 11.5 min
  - "*GPU_GemmWrwUniversal_LargeMemory_*"  # aborts the test process on gfx1151

exclude_gpu:
  exclude_gpu_gfx120X:
    test_patterns: *gfx11_common_patterns
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx120X"

  exclude_gpu_gfx110X:
    test_patterns:
      - *gfx11_common_patterns
      - "*/GPU_MIOpenDriver*"
      - "Smoke/CPU_Handle_NONE*"
      - "Full/GPU_reduce_custom_fp32*"
      # Flaky on Windows gfx110X (ALMIOPEN-1926): intermittent CPU/GPU mismatch at rnn_seq_api.hpp:272,
      # bias-enabled cases only, a different index set on every attempt (88 of 4,316 executions failed in
      # PR #13107 runs 38815363944 and 38983909810). FP16 and Linux gfx94X passed every execution.
      - "Full/GPU_LstmMSRnn_FP32*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx110X"

  exclude_gpu_gfx115X:
  #Negative patterns for gfx1150 and gfx1151 will be covered here.
  #Add exclude_gpu_gfx1150/gfx1151 separately only if they have unique patterns.
    test_patterns:
      - *gfx11_common_patterns
      # Flaky on Windows gfx1151 (ALMIOPEN-1926), same signature as gfx110X: intermittent CPU/GPU mismatch at
      # rnn_seq_api.hpp:272, bias-enabled cases only (18 of 2,316 executions failed in PR #13107 run 39358709264).
      - "Full/GPU_LstmMSRnn_FP32*"
      # Fails on every gfx1151 host whose CU count has no shipped system db (#13416): "Db file does not exist ...
      # gfx115128.HIP.fdb.txt" / "gfx115120.HIP.fdb.txt". Windows: 5 of 5 executions on 5 hosts (PR #13107 runs 39358709264,
      # 39480689944, develop nightly 38527180317). Linux: 12 of 12 on the 20-CU strixhalo hosts in run 39740910967 (passes on
      # CS-RORDMZ hosts). Remove once the test skips missing dbs or #13680 lands.
      - "Smoke/CPU_DBSync_NONE.StaticFDBSync/9"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx115X_linux:
    test_patterns:
      # Fails on Linux gfx1151 (ALMIOPEN-2966, PR #13107 run 39358709264): "no fdeep .tn.model files found" in the system db.
      # AI heuristic models ship only for gfx908/gfx90a/gfx942/gfx950, and TheRock's Linux install keeps only the
      # runner target's db files. Passes on Windows gfx1151. Remove when ALMIOPEN-2966 makes the test skip archs without models.
      - "GPU_ConvAIModelLoad_FP32*"
      # OOM-killed on the 7.5 GB Linux gfx1151 runners strixhalo-12 and strixhalo-10 (ALMIOPEN-2964): SIGKILL / exit 137 in
      # PR #13107 runs 39358709264 and 39529845480; both pass on the 31-125 GB gfx1151 hosts. Only standard-tier cases are
      # excluded (the tier TheRock release tests run on these hosts); comprehensive/full OOM kills are not chased per case.
      # Remove when ALMIOPEN-2964 closes.
      - "CPU_PerfDb_NONE.*"
      - "GPU_BN_Spatial_FP32.MIOpen3900Regression" # 1x2048x512x512 FP32, ~2.1 GB per tensor
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx115X_windows:
    test_patterns:
      # Flaky on Windows gfx1151 (same bias-only RNN CPU/GPU mismatch as ALMIOPEN-1926): Backward Data / Forward Train /
      # Forward Inference GRU verification failed at gru_test.cpp:1985/2224/2473 for 3 of these 8 bias-enabled cases in
      # PR #13107 run 39358709264 (attempt 2); the same cases passed on the other attempt and in run 39480689944.
      - "Full/GPU_GRU_Base_FP16.TestFloat16/batchSize_17_seqLength_23_inVecLen_13_hiddenSize_67_*biasMode_1_*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx94X:
    test_patterns:
      # Flaky on gfx942 (ALMIOPEN-1926): same bias-only CPU/GPU mismatch at rnn_seq_api.hpp:272 as gfx110X/gfx115X. Jenkins
      # gfx942, 2026-08-24..10-23: 39 failures at 36 different indices in ~304k executions (1 in 5 builds with >= 1 failure),
      # including 11 of 37 develop builds after the per-index filters /1026 and /1095 landed; gfx90a: 0 in ~284k.
      # Mirrors the Jenkins family filter under MIOPEN_TEST_GFX94X.
      - "Full/GPU_LstmMSRnn_FP32*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx94X"

  exclude_gpu_gfx950:
    test_patterns:
      - "*DBSync*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx950"

execution_settings:
  default_timeout: 300  # 5 minutes per test
  timeout_multiplier: 2 # Multiplier for all timeouts (1, 1.5, 1.75, 2, etc.)
  category_timeouts:
    quick: 300          # 5 minutes
    standard: 1800      # 30 minutes
    comprehensive: 7200 # 2 hours
    ffm-quick:  7200    # 2 hours
    ffm-full:  7200     # 2 hours
    full: 14400         # 4 hours
