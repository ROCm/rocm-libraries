# MIOpen Test Categories Configuration
# Time-based test organization for CI/CD pipeline efficiency
# This file defines test categories by execution time and criticality
#
# Tiers select tests by gtest prefix. Every parameterized instantiation carries
# the tier that first runs it: Quick/ (quick), Standard/ (standard),
# Comprehensive/ (comprehensive), Full/ (full). Variant instantiations keep a
# suffix after the tier word (e.g. StandardNhwc/), hence the "<Tier>*/*"
# patterns. Tiers are cumulative: each runs its own prefix and every lower one.
# To add a test, pick its prefix; to move it, rename the prefix. Plain TEST/TEST_F
# suites have no prefix and run in no tier (test/utils/gtest_formating_checks.py
# allows them only for the hipDNN shim surface). The exclude lists below hold only
# operational exclusions (quarantines, OOM/timeout cases, option-gated families,
# suites kept out of every tier).

test_categories:
  quick:
    description: "Fast sanity checks - Run pre-commit (target: < 5 min)"
    test_patterns:
      - "Quick*/*"

    exclude_windows: [] # Placeholder to show per-platform exclude support
    exclude_linux: [] # Placeholder to show per-platform exclude support

    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Core functionality - Run on every PR (target: < 30 min)"
    test_patterns:
      - "Quick*/*"
      - "Standard*/*"

    exclude:
      # Quick-only cases. The same two lines are in comprehensive and full.
      # hipDNN shim surface: replayed by the forwarding_parity entries, kept out of
      # the tiers above quick on purpose (see test/gtest/README.md).
      - "*HipdnnShim*"
      - "Quick/GPU_UnitTestConvSolverHipImplicitGemmV4R1Fwd_BFP16.ConvHipImplicitGemmV4R1Fwd/0"

    test_files:
      # Quick tests
      - "gtest/smoke_*.cpp"
      - "gtest/unit_*.cpp"
      - "gtest/gtest_activation.cpp"
      - "handle_test.cpp"
      - "gtest/handle_hip_device.cpp"

      # Standard tests
      - "conv2d.cpp"
      - "conv2d_bias.cpp"
      - "gtest/miopen_conv.cpp"
      - "bn_spatial_test.cpp"
      - "bn_peract_test.cpp"
      - "gtest/bn_fwd_train.cpp"
      - "gtest/bn_bwd.cpp"
      - "gtest/bn_infer.cpp"
      - "gtest/conv_api.cpp"
      - "gtest/conv_activ_infer.cpp"
      - "pooling2d.cpp"
      - "gtest/pooling2d_asymmetric.cpp"
      - "gtest/pooling2d_wide.cpp"
      - "tensor_reorder.cpp"
      - "tensor_trans.cpp"
      - "gtest/tensor_api.cpp"
      - "gtest/unary_tensor_ops.cpp"
      - "gtest/binary_tensor_ops.cpp"
      - "gtest/soft_max.cpp"
      - "gtest/dropout.cpp"
      - "gtest/reduce.cpp"
      - "gtest/layernorm.cpp"
      - "gtest/cache.cpp"

    labels:
      - "standard"
      - "pr"


  comprehensive:
    description: "Extended testing - Run nightly (target: < 2 hours)"
    test_patterns:
      - "Quick*/*"
      - "Standard*/*"
      - "Comprehensive*/*"

    exclude:
      # Quick-only cases (as in standard).
      - "*HipdnnShim*"
      - "Quick/GPU_UnitTestConvSolverHipImplicitGemmV4R1Fwd_BFP16.ConvHipImplicitGemmV4R1Fwd/0"
      # Only exclude explicitly disabled tests
      - "*DISABLED*"

    test_files:
      # Quick tests
      - "gtest/smoke_*.cpp"
      - "gtest/unit_*.cpp"
      - "gtest/gtest_activation.cpp"
      - "handle_test.cpp"
      - "gtest/handle_hip_device.cpp"

      # Standard tests
      - "conv2d.cpp"
      - "conv2d_bias.cpp"
      - "gtest/miopen_conv.cpp"
      - "bn_spatial_test.cpp"
      - "bn_peract_test.cpp"
      - "gtest/bn_fwd_train.cpp"
      - "gtest/bn_bwd.cpp"
      - "gtest/bn_infer.cpp"
      - "gtest/conv_api.cpp"
      - "gtest/conv_activ_infer.cpp"
      - "pooling2d.cpp"
      - "gtest/pooling2d_asymmetric.cpp"
      - "gtest/pooling2d_wide.cpp"
      - "tensor_reorder.cpp"
      - "tensor_trans.cpp"
      - "gtest/tensor_api.cpp"
      - "gtest/unary_tensor_ops.cpp"
      - "gtest/binary_tensor_ops.cpp"
      - "gtest/soft_max.cpp"
      - "gtest/dropout.cpp"
      - "gtest/reduce.cpp"
      - "gtest/layernorm.cpp"
      - "gtest/cache.cpp"

    labels:
      - "comprehensive"
      - "nightly"

  full:
    description: "Complete test suite - (target: hours+)"
    test_patterns:
      - "Quick*/*"
      - "Standard*/*"
      - "Comprehensive*/*"
      - "Full*/*"

    test_files:
      # All test files in the suite
      - "*.cpp"
      - "gtest/*.cpp"

    exclude:
      # Quick-only cases (as in standard).
      - "*HipdnnShim*"
      - "Quick/GPU_UnitTestConvSolverHipImplicitGemmV4R1Fwd_BFP16.ConvHipImplicitGemmV4R1Fwd/0"
      # Option-gated families (MIOPEN_TEST_DEEPBENCH / MIOPEN_TEST_CONV in CMake).
      - "*DeepBench*"
      - "*MIOpenTestConv*"
