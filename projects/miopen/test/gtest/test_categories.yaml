      - "Full/GPU_Bfp8Conversion_BFP8*"
      - "Full/GPU_Fp8Conversion_FP8*"
      - "Full/GPU_HipBLASLtGEMMTestException_BFP8*"
      - "Full/GPU_HipBLASLtGEMMTestException_FP8*"
