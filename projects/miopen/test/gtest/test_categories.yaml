  - "*/GPU_TensorReorder_*"
  - "*/GPU_TensorTransform_*"
  - "*/GPU_binaryTensorOps_*"
  - "*/GPU_reference_kernel_*"
  # Unprefixed: these are plain TEST/TEST_F with no INSTANTIATE_TEST_SUITE_P,
  # so they carry no "Prefix/" and the leading "*/" above would not match them.
  - "GPU_StreamTracker_FP32*"
  - "GPU_NaiveTimeout_FP32*"
  # Added for Jenkins parity. Single-instantiation TEST/TEST_F suites, each <= ~10 s.
  # Only the dtypes Jenkins validates for HipBLASLt GEMM (FP8/BFP8/FP64/I* are left out).
  - "GPU_BN_Spatial_FP32*"
  - "GPU_CKValidatorIntegration_FP32*"
