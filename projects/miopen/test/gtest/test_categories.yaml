# MIOpen Test Categories Configuration
# Time-based test organization for CI/CD pipeline efficiency
# This file defines test categories by execution time and criticality

# Common comprehensive patterns - used by both standard and comprehensive
# Standard applies exclude list to filter out slower tests
# Comprehensive runs all patterns without exclusion
positive_patterns: &positive_patterns
  - "*Fusion*"
  - "*/GPU_BNBWD*_*"
  - "*/GPU_BNOCLBWD*_*"
  - "*/GPU_BNFWD*_*"
  - "*/GPU_BNOCLFWD*_*"
  - "*/GPU_BNInfer*_*"
  - "*/GPU_BNActivInfer_*"
  - "*/GPU_BNOCLInfer*_*"
  - "*/GPU_bn_infer*_*"
  - "*/GPU_bn_activ_infer_*"
  - "*/GPU_bn_fwd_infer_*"
  - "CPU_*"
  - "*/CPU_*"
  - "*/GPU_Cat_*"
  - "*/GPU_CTC*"
  - "*/GPU_ConvBiasActiv*"
  - "*/GPU_Conv*"
  - "*/GPU_conv*"
  - "*/GPU_UnitTestConv*"
  - "*/GPU_GetitemBwd*"
  - "*/GPU_GLU_*"
  - "*/GPU_GroupConv*"
  - "*/GPU_GroupNorm_*"
  - "*/GPU_GRUExtra_*"
  - "*/GPU_TestActivation*"
  - "*/GPU_HipBLASLtGEMMTest*"
  - "*/GPU_KernelTuningNetTestConv*"
  - "*/GPU_Kthvalue_*"
  - "*/GPU_LayerNormTest*"
  - "*/GPU_LayoutTransposeTest_*"
  - "*/GPU_Lrn*"
  - "*/GPU_lstm_extra*"
  - "*/GPU_MultiMarginLoss_*"
  - "*/GPU_ConvNonpack*"
  - "*/GPU_PerfConfig_HipImplicitGemm*"
  - "*/GPU_AsymPooling2d_*"
  - "*/GPU_WidePooling2d_*"
  - "*/GPU_PReLU_*"
  - "*/GPU_Reduce*"
  - "*/GPU_reduce_custom_*"
  - "*/GPU_regression_issue_*"
  - "*/GPU_RNNExtra_*"
  - "*/GPU_RoPE*"
  - "*/GPU_SoftMarginLoss*"
  - "*/GPU_T5LayerNormTest_*"
  - "*/GPU_Op4dTensorGenericTest_*"
  - "*/GPU_TernaryTensorOps_*"
  - "*/GPU_unaryTensorOps_*"
  - "*/GPU_TensorTrans_*"
  - "*/GPU_Transformers*"
  - "*/GPU_TunaNetTest_*"
  - "*/GPU_UnitTestActivationDescriptor_*"
  - "*/GPU_FinInterfaceTest*"
  - "*/GPU_KernelTuningNetTest*"
  - "*/GPU_Softmax*"
  - "*/GPU_Dropout*"
  - "*/GPU_MIOpenDriver*"
  - "*/GPU_HipGraphExist*"
  - "Standard/*" # include all standard tests by default



test_categories:
  quick:
    description: "Fast sanity checks - Run pre-commit (target: < 5 min)"
    test_patterns:
      # Run the entire Smoke instantiation tier. Suites are kept fast at the
      # source level (each heavy suite is split Smoke/Standard/Full).
      - "Smoke/*"
      # Also run the unprefixed CPU tests (framework / DB / solver-logic checks
      # that carry no size-tier prefix). They need no GPU and are fast.
      - "CPU_*"

    exclude:
      - "*/GPU_MIOpenDriver*"
      # ALMIOPEN-2206: HIPRTC fails to compile miopen_conv3d_depthwise_fwd.cpp
      # ('hip/hip_runtime.h' not found). Re-enable once fixed. (Only FP16 and
      # BFP16 GPU variants of this solver exist; there is no FP32 GPU variant.
      # The CPU dev-applicability check is unaffected.)
      - "Smoke/GPU_UnitTestConvSolverConvDepthwiseFwd3D_FP16*"
      - "Smoke/GPU_UnitTestConvSolverConvDepthwiseFwd3D_BFP16*"
      # Each fans out to 32 worker processes loading MIOpen, OOM-killing
      # small shared-RAM runners (e.g. gfx1151). Still run in standard/full.
      - "CPU_PerfDb_NONE.*"

    exclude_windows: [] # Placeholder to show per-platform exclude support
    exclude_linux: [] # Placeholder to show per-platform exclude support

    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Core functionality - Run on every PR (target: < 30 min)"
    test_patterns: *positive_patterns

    exclude:
      # Excluding slower tests for faster PR validation
      - "*DeepBench*"
      - "*MIOpenTestConv*"
      - "Full/GPU_Reduce_FP64*"
      # Tiered suites: the complete (Full) cross product runs only in
      # comprehensive/full. The Smoke + Standard instantiations still run here.
      - "Full/GPU_Reduce_FP32*"
      - "Full/GPU_Reduce_FP16*"
      - "Full/GPU_bn_activ_infer_*"
      - "Full/GPU_bn_fwd_infer_*"
      - "Full/GPU_TensorTrans_*"
      - "Full/GPU_ConvBiasActivInfer_*"
      - "Full/CPU_WSuperTensor_*"
      - "Full/GPU_CTC_*"
      # Only FP32 is tiered (Smoke+Standard); FP16/FP64 are Full-only and stay
      # in standard for dtype coverage.
      - "Full/GPU_TernaryTensorOps_FP32*"
      - "Full/GPU_UnitTestConvSolverFFTFwd_*"
      - "Full/GPU_UnitTestConvSolverFFTBwd_*"
      - "Full/GPU_BNOCLFWDTrainSerialRun3D_BFP16*"
      - "Full/GPU_Lrn_FP32*"
      - "Full/GPU_Lrn_FP16*"
      - "Full/GPU_BNOCLInferSerialRun3D_BFP16*"
      - "Full/GPU_BNOCLBWDSerialRun3D_BFP16*"
      - "Full/GPU_UnitTestActivationDescriptor_FP32*"
      - "Full/GPU_UnitTestActivationDescriptor_FP16*"
      - "Full/GPU_ConvGrpBiasActivInfer_BFP16*"
      - "Full/GPU_ConvGrpBiasActivInfer_FP32*"
      - "Full/GPU_ConvGrpBiasActivInfer_FP16*"
      - "Full/GPU_ConvGrpActivInfer_BFP16*"
      - "Full/GPU_ConvGrpActivInfer_FP32*"
      - "Full/GPU_ConvGrpActivInfer_FP16*"
      - "Full/GPU_ConvGrpBiasActivInfer3D_BFP16*"
      - "Full/GPU_ConvGrpBiasActivInfer3D_FP32*"
      - "Full/GPU_ConvGrpBiasActivInfer3D_FP16*"
      - "Full/GPU_ConvGrpActivInfer3D_BFP16*"
      - "Full/GPU_ConvGrpActivInfer3D_FP32*"
      - "Full/GPU_ConvGrpActivInfer3D_FP16*"
      - "Smoke/GPU_UnitTestConvSolverHipImplicitGemmV4R1Fwd_BFP16.ConvHipImplicitGemmV4R1Fwd/0"
      - "Full/GPU_MIOpenDriverConv2dTransTest*"
      - "Full/GPU_MIOpenDriverRegressionBigTensorTest_FP32"
      - "Full/GPU_UnitTestConvSolverImplicitGemmGroupFwdXdlops_LargeStride_*"
      - "Full/GPU_UnitTestConvSolverImplicitGemm3DGroupFwdXdlops_LargeStride_*"
      - "Full/GPU_UnitTestConvSolverImplicitGemmGroupBwdXdlops_LargeStride_*"
      - "Full/GPU_UnitTestConvSolverImplicitGemm3DGroupBwdXdlops_LargeStride_*"
      - "Full/GPU_UnitTestConvSolverImplicitGemmGroupWrwXdlops_LargeStride_*"
      - "Full/GPU_UnitTestConvSolverImplicitGemm3DGroupWrwXdlops_LargeStride_*"
      # Large BN tests - full suite only
      - "Full/GPU_BNCKFWDTrainLarge2D_*"
      - "Full/GPU_BNOCLFWDTrainLarge2D_*"
      - "Full/GPU_BNOCLFWDTrainLarge3D_*"
      - "Full/GPU_BNFWDTrainLarge2D_*"
      - "Full/GPU_BNCKBWDLarge2D_*"
      - "Full/GPU_BNOCLBWDLarge2D_*"
      - "Full/GPU_BNOCLBWDLarge3D_*"
      - "Full/GPU_BNBWDLarge2D_*"
      - "Full/GPU_BNBWDLarge3D_*"
      - "Full/GPU_BNCKInferLarge2D_*"
      - "Full/GPU_BNOCLInferLarge2D_*"
      - "Full/GPU_BNOCLInferLarge3D_*"
      - "Full/GPU_BNInferLarge2D_*"
      - "Full/GPU_BNOCLFWDTrainLargeFusedActivation2D_*"
      - "Full/GPU_BNFWDTrainLargeFusedActivation2D_*"
      - "Full/GPU_BNOCLBWDLargeFusedActivation2D_*"
      - "Full/GPU_BNOCLInferLargeFusedActivation2D_*"

    test_files:
      # Quick tests
      - "gtest/smoke_*.cpp"
      - "gtest/unit_*.cpp"
      - "gtest/gtest_activation.cpp"
      - "handle_test.cpp"
      - "gtest/handle_hip_device.cpp"

      # Standard tests
      - "conv2d.cpp"
      - "conv2d_bias.cpp"
      - "gtest/miopen_conv.cpp"
      - "bn_spatial_test.cpp"
      - "bn_peract_test.cpp"
      - "gtest/bn_fwd_train.cpp"
      - "gtest/bn_bwd.cpp"
      - "gtest/bn_infer.cpp"
      - "gtest/conv_api.cpp"
      - "gtest/conv_activ_infer.cpp"
      - "pooling2d.cpp"
      - "gtest/pooling2d_asymmetric.cpp"
      - "gtest/pooling2d_wide.cpp"
      - "tensor_reorder.cpp"
      - "tensor_trans.cpp"
      - "gtest/tensor_api.cpp"
      - "gtest/unary_tensor_ops.cpp"
      - "gtest/binary_tensor_ops.cpp"
      - "gtest/soft_max.cpp"
      - "gtest/dropout.cpp"
      - "gtest/reduce.cpp"
      - "gtest/layernorm.cpp"
