      - "Quick/GPU_Lrn_FP16*"                  # ~2.4 s
      - "Quick/GPU_Dropout_FP32*"              # ~2.1 s
      - "Quick/GPU_Dropout_FP16*"              # ~1.7 s
      - "Quick/GPU_reference_kernel_fwd_3d_NCDHW_BFP16_BFP16*"  # ~4.0 s (FP32/FP16 variants are fast)

    exclude_windows: [] # Placeholder to show per-platform exclude support
    exclude_linux: [] # Placeholder to show per-platform exclude support

    labels:
      - "ffm-quick"
      - "ffm-full"

# Common GPU exclusion patterns - used by multiple GPU architectures
gfx11_common_patterns: &gfx11_common_patterns
  - "Comprehensive/GPU_BNFWDTrainLargeFusedActivation2D_FP32.BnV2LargeFWD_TrainCKfp32Activation/NCHW_BNSpatial_testBNAPIV1_Dim_2_test_id_32"
  - "Comprehensive/GPU_BNFWDTrainLarge2D_FP32.BnV2LargeFWD_TrainCKfp32/NCHW_BNSpatial_testBNAPIV2_Dim_2_test_id_64"
  - "*SerialRun3D*"
  - "*gfx942*"
  - "*GPU_UnitTestConvSolverFFTFwd_FP32*"
  - "*GPU_UnitTestConvSolverFFTBwd_FP32*"
  - "*GPU_TernaryTensorOps_FP64*"
  - "*GPU_TernaryTensorOps_FP16*"
  - "*GPU_TernaryTensorOps_FP32*"
  - "*GPU_Op4dTensorGenericTest_FP32*"
  - "*GPU_UnitTestActivationDescriptor_FP16*"
  - "*GPU_UnitTestActivationDescriptor_FP32*"
  - "*CPU_TuningPolicy_NONE*"
  - "*GPU_Dropout_FP32*"
  - "*GPU_Dropout_FP16*"
  - "*GPU_GroupConv3D_BackwardData_FP16.GroupConv3D_BackwardData_half_Test*"
  - "*GPU_GroupConv3D_BackwardData_BFP16.GroupConv3D_BackwardData_bfloat16_Test*"
  - "Quick/GPU_MultiMarginLoss*"
  - "*CPU_UnitTestConvSolverImplicitGemmGroupWrwXdlopsDevApplicability_FP16.ConvHipImplicitGemmGroupWrwXdlops*"
  # Slow tests to exclude (from #3362)
  - "Standard/GPU_Softmax_FP32*"  # 24 min
  - "Standard/GPU_Softmax_BFP16*"  # 13 min
  - "Standard/GPU_Softmax_FP16*" # 11.5 min
  - "*GPU_GemmWrwUniversal_LargeMemory_*"  # aborts the test process on gfx1151

exclude_gpu:
  exclude_gpu_gfx120X:
    test_patterns:
      - *gfx11_common_patterns
      # Fails on every arch without bundled AI models (ALMIOPEN-2966): "no fdeep .tn.model files found" in the system db.
      # Linux and Windows gfx120X, 10 of 10 executions on 8 hosts: TheRock bump PR #9651 run 41113572856 (shard 3, attempts
      # 1-4) and PR #9680 run 41405101044 (issue #14874). Remove when ALMIOPEN-2966 makes the test skip archs without models.
      - "Standard/GPU_ConvAIModelLoad_FP32*"
      # Fails on gfx1201 hosts whose CU count has no shipped system db (#13416): "Db file does not exist ...
      # gfx120138.HIP.fdb.txt" on CS-RORDMZ-DT84 (TheRock PR #9651 run 41113572856 attempt 1); only gfx120140 ships, which
      # passes on the other gfx1201 hosts. Same cause as the gfx1151 entry on gfx115X. Remove with the gfx115X entry (#13416).
      - "Quick/CPU_DBSync_NONE.StaticFDBSync/gfx1201_32"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx120X"

  exclude_gpu_gfx120X_linux:
    test_patterns:
      # Both FP16 backward log-softmax cases hang after "Testing solution functions..." until the 60-min ctest timeout on the
      # Linux gfx1201 hosts CS-RORDMZ-DT87 and CS-RORDMZ-DT81 (ALMIOPEN-3130, issue #14874). channel_mode: 3 of 3 executions
      # (TheRock PR #9651 run 41113572856 attempts 1-2, PR #9680 run 41405101044). instance_mode: hung on DT87 and took 27 s
      # on DT81 (normally < 1.3 s) in PR #14882 run 41516836287. BFP16/FP32 cases pass in ~0.3 s on Linux gfx1201; both FP16
      # cases pass in < 1.3 s on Linux gfx1200 and Windows gfx1201. Remove when ALMIOPEN-3130 closes.
      - "Standard/GPU_SoftmaxFind20_FP16.*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx120X"

  exclude_gpu_gfx110X:
    test_patterns:
      - *gfx11_common_patterns
      - "*/GPU_MIOpenDriver*"
      - "Quick/CPU_Handle_NONE*"
      - "Standard/GPU_reduce_custom_fp32*"
      # Fails on every arch without bundled AI models (ALMIOPEN-2966): "no fdeep .tn.model files found" in the system db.
      # Models ship only for gfx908/gfx90a/gfx942/gfx950, and since #13680 Windows installs per-target db files like Linux
      # (PR #13107 run 40983714656, Windows gfx110X, 2 of 2 attempts). Remove when ALMIOPEN-2966 makes the test skip archs
      # without models.
      - "Standard/GPU_ConvAIModelLoad_FP32*"
      # Temporary quarantine (ROCm/rocm-libraries#15056): "layernorm.hpp(524) Error dw beyond tolerance
      # Error:0.01156, Threshold x 2: 0.001953" on Linux+Windows gfx110X and gfx1151. Suspected compiler
      # regression, gfx120X not affected. Indices are positional into LayerNormTestConfigs() in layernorm.hpp
      # (N:1 C:2048 D:0 H:4 W:32 dim:3 eps:1e-5 NHWC; /124 ELEMENTWISE_AFFINE, /127 WEIGHT_BIAS); update if configs are reordered.
      # FP32/BFP16 variants stay enabled. Remove when #15056 is fixed.
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/124"
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/127"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx110X"

  exclude_gpu_gfx115X:
  #Negative patterns for gfx1150 and gfx1151 will be covered here.
  #Add exclude_gpu_gfx1150/gfx1151 separately only if they have unique patterns.
    test_patterns:
      - *gfx11_common_patterns
      # The gfx1151 system db check, named by arch and CU count so adding a param can't move it to another arch (#16420).
      # Fails on every gfx1151 host whose CU count has no shipped system db (#13416): "Db file does not exist ...
      # gfx115128.HIP.fdb.txt" / "gfx115120.HIP.fdb.txt". Windows: 5 of 5 executions on 5 hosts (PR #13107 runs 39358709264,
      # 39480689944, develop nightly 38527180317). Linux: 12 of 12 on the 32-CU strixhalo hosts in run 39740910967. Only
      # gfx115128 dbs ship, and #13680 fixed the Windows install of those, but 32-CU hosts still have no gfx115120 db.
      # Also fails on the 40-CU hosts that load gfx115128: 658 of its find-db entries hold a workspace size the solver no
      # longer reports (524 GemmWrwUniversal, 134 ConvWinoFuryRxS<2-3>), TheRock PR #10132 run 44595703412 (#16420).
      # Remove once gfx115128 passes this check and the test skips missing dbs or a gfx115120 db ships (#13416).
      - "Quick/CPU_DBSync_NONE.StaticFDBSync/gfx1151_0"
      # Fails on every arch without bundled AI models (ALMIOPEN-2966): "no fdeep .tn.model files found" in the system db.
      # Models ship only for gfx908/gfx90a/gfx942/gfx950, and since #13680 Windows installs per-target db files like Linux.
      # Linux gfx1151: PR #13107 run 39358709264. Remove when ALMIOPEN-2966 makes the test skip archs without models.
      - "Standard/GPU_ConvAIModelLoad_FP32*"
      # Temporary quarantine (ROCm/rocm-libraries#15056): "layernorm.hpp(524) Error dw beyond tolerance
      # Error:0.01156, Threshold x 2: 0.001953" on Linux+Windows gfx110X and gfx1151. Suspected compiler
      # regression, gfx120X not affected. Indices are positional into LayerNormTestConfigs() in layernorm.hpp
      # (N:1 C:2048 D:0 H:4 W:32 dim:3 eps:1e-5 NHWC; /124 ELEMENTWISE_AFFINE, /127 WEIGHT_BIAS); update if configs are reordered.
      # FP32/BFP16 variants stay enabled. Remove when #15056 is fixed.
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/124"
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/127"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx115X_linux:
    test_patterns:
      # OOM-killed on the 7.5 GB Linux gfx1151 runners strixhalo-12 and strixhalo-10 (ALMIOPEN-2964): SIGKILL / exit 137 in
      # PR #13107 runs 39358709264 and 39529845480; both pass on the 31-125 GB gfx1151 hosts. Only standard-tier cases are
      # excluded (the tier TheRock release tests run on these hosts); comprehensive/full OOM kills are not chased per case.
      # Remove when ALMIOPEN-2964 closes.
      - "Standard/CPU_PerfDb_NONE.*"
      - "Standard/GPU_BN_SpatialRegression_FP32.MIOpen3900Regression/0" # 1x2048x512x512 FP32, ~2.1 GB per tensor
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx115X_windows:
    test_patterns:
      # Flaky on Windows gfx1151 (same bias-only RNN CPU/GPU mismatch as ALMIOPEN-1926): Backward Data / Forward Train /
      # Forward Inference GRU verification failed at gru_test.cpp:1985/2224/2473 for 3 of these 8 bias-enabled cases in
      # PR #13107 run 39358709264 (attempt 2); the same cases passed on the other attempt and in run 39480689944.
      - "Comprehensive/GPU_GRU_Base_FP16.TestFloat16/batchSize_17_seqLength_23_inVecLen_13_hiddenSize_67_*biasMode_1_*"
      # Hang in a multiprocess phase ("Waiting for test processes...") until the ctest/step timeout on Windows gfx1151
      # (ALMIOPEN-3129, issue #14874): 6 hangs on 5 hosts since 10-31 - develop nightlies 41179300934 (RamDb) and 41283494663
      # (RamDb, and PlainTextDb on 3 attempts), TheRock PR #9680 run 41405101044 (PlainTextDb). MultiFileDb_AllTests spawns
      # no processes and keeps running. Linux gfx115X already excludes Standard/CPU_PerfDb_NONE.* (ALMIOPEN-2964). Remove
      # when ALMIOPEN-3129 closes.
      - "Standard/CPU_PerfDb_NONE.RamDb_AllTests/0"
      - "Standard/CPU_PerfDb_NONE.PlainTextDb_AllTests/0"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx115X"

  exclude_gpu_gfx117X:
    test_patterns:
      # gfx1170 reproduces the FP16 backward dw tolerance failures tracked in
      # ROCm/rocm-libraries#15056. Remove when that issue is fixed.
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/124"
      - "Comprehensive/GPU_LayerNormBwdTest_FP16.LayerNormTestBw/127"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx117X"

  exclude_gpu_gfx117X_windows:
    test_patterns:
      # gfx1170: the large untiled GPU reference can hit the Windows watchdog.
      # Quarantine only the reproduced FP32 and FP16 large-memory cases.
      - "Standard/GPU_GemmWrwUniversal_LargeMemory_FP32.GemmWrwUniversal/0"
      - "Standard/GPU_GemmWrwUniversal_LargeMemory_FP16.GemmWrwUniversal/0"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx117X"

  exclude_gpu_gfx950:
    test_patterns:
      - "*DBSync*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx950"

execution_settings:
  default_timeout: 300  # 5 minutes per test
  timeout_multiplier: 2 # Multiplier for all timeouts (1, 1.5, 1.75, 2, etc.)
  category_timeouts:
    quick: 300          # 5 minutes
    standard: 1800      # 30 minutes
    comprehensive: 7200 # 2 hours
    ffm-quick:  7200    # 2 hours
    ffm-full:  7200     # 2 hours
    full: 14400         # 4 hours
