      - "Full/GPU_BNOCLFWDTrainLarge3D_*"
      - "Full/GPU_BNFWDTrainLarge2D_*"
      - "Full/GPU_BNCKBWDLarge2D_*"
      - "Full/GPU_BNOCLBWDLarge2D_*"
