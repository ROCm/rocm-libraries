---
include: hipblas_common.yaml

Definitions:
  - &transA_transB_small
    - { transA: N, transB: N }

  - &small_grouped_ex_matrix
    - { M: 32, N: 32, K: 32, lda: 32, ldb: 32, ldc: 32, ldd: 32 }

  - &single_double_real_precisions_gemm_ex
    - *single_precision_ex
    - *double_precision_ex

Tests:
  # API-focused reduced coverage: s/d real only

- name: gemm_grouped_batched_ex_bad_arg
  category: quick
  function:
    - gemm_grouped_batched_ex_bad_arg: *single_double_real_precisions_gemm_ex
  stride_x: 2 # group_count
  batch_count: 2
  transA: N
  transB: N
  M: 32
  N: 32
  K: 32
  lda: 32
  ldb: 32
  ldc: 32
  ldd: 32
  alpha: 1
  beta: 0
  api: [ FORTRAN, FORTRAN_64 ]

- name: gemm_grouped_batched_ex
  category: pre_checkin
  function:
    - gemm_grouped_batched_ex: *single_double_real_precisions_gemm_ex
  stride_x: [ 1, 2 ] # group_count
  transA_transB: *transA_transB_small
  matrix_size: *small_grouped_ex_matrix
  alpha: 1
  beta: [ 0, 1 ]
  batch_count: 2
  with_flags: [ false, true ]
  api: [ C, C_64, FORTRAN_64 ]
  backend_flags: AMD
