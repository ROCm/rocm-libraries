# HipBLAS Test Categories Configuration
# This file defines test categories for selective test execution with CTest

test_categories:
  level1:
    description: "Auxiliary functions (set/get operations, utility functions)"

    # Optional: Context for developers and AI tools
    notes: |
      Fast-running sanity checks for auxiliary functions (set/get operations,
      mode handling, matrix/vector transfers).

      Run these when:
      - Auxiliary functions change (library/src/auxiliary.cpp, library/src/handle.cpp)
      - API initialization/cleanup changes
      - Basic data movement functionality changes

      These are foundational tests that should pass before running more complex test suites.

    # Optional: Map to source code (enables test-to-code lookup)
    source_coverage:
      - "library/src/auxiliary.cpp"
      - "library/src/handle.cpp"

    # Optional: API functions tested (enables API coverage analysis)
    api_coverage:
      - "hipblasCreate"
      - "hipblasDestroy"
      - "hipblasSetPointerMode"
      - "hipblasGetPointerMode"
      - "hipblasSetVector"
      - "hipblasGetVector"
      - "hipblasSetMatrix"
      - "hipblasGetMatrix"

    # Optional: Semantic tags for classification
    feature_tags:
      - "initialization"
      - "auxiliary"
      - "fast"
      - "foundational"

    # Standard fields (unchanged from base PR)
    test_patterns:
      - "*auxiliary*"
      - "*set_get*"
      - "*auxil*"
    test_files:
      - "auxil/auxiliary_gtest.cpp"
      - "auxil/set_get_mode_gtest.cpp"
      - "auxil/set_get_matrix_vector_gtest.cpp"
    labels:
      - "auxil"
      - "level1"
      - "basic"

  level2:
    description: "BLAS Level 1 operations (vector-vector operations)"
    test_patterns:
      - "*asum*"
      - "*axpy*"
      - "*copy*"
      - "*dot*"
      - "*nrm2*"
      - "*rot*"
      - "*scal*"
      - "*swap*"
      - "*iamax*"
      - "*iamin*"
    test_files:
      - "blas1/asum_gtest.cpp"
      - "blas1/axpy_gtest.cpp"
      - "blas1/copy_gtest.cpp"
      - "blas1/dot_gtest.cpp"
      - "blas1/iamaxmin_gtest.cpp"
      - "blas1/nrm2_gtest.cpp"
      - "blas1/rot_gtest.cpp"
      - "blas1/scal_gtest.cpp"
      - "blas1/swap_gtest.cpp"
    exclude:
      - "*asum*"
      - "*dot*"
      - "*nrm2*"
      - "*scal*"
      - "*iamin*"
    labels:
      - "blas1"
      - "level2"

  level3:
    description: "BLAS Level 2 operations (matrix-vector operations)"
    test_patterns:
      - "*gbmv*"
      - "*gemv*"
      - "*ger*"
      - "*hbmv*"
      - "*hemv*"
      - "*her*"
      - "*her2*"
      - "*hpmv*"
      - "*hpr*"
      - "*hpr2*"
      - "*sbmv*"
      - "*spmv*"
      - "*spr*"
      - "*spr2*"
      - "*symv*"
      - "*syr*"
      - "*syr2*"
      - "*tbmv*"
      - "*tbsv*"
      - "*tpmv*"
      - "*tpsv*"
      - "*trmv*"
      - "*trsv*"
    test_files:
      - "blas2/gbmv_gtest.cpp"
      - "blas2/gemv_gtest.cpp"
      - "blas2/ger_gtest.cpp"
      - "blas2/hbmv_gtest.cpp"
      - "blas2/hemv_gtest.cpp"
      - "blas2/her_gtest.cpp"
      - "blas2/her2_gtest.cpp"
      - "blas2/hpmv_gtest.cpp"
      - "blas2/hpr_gtest.cpp"
      - "blas2/hpr2_gtest.cpp"
      - "blas2/sbmv_gtest.cpp"
      - "blas2/spmv_gtest.cpp"
      - "blas2/spr_gtest.cpp"
      - "blas2/spr2_gtest.cpp"
      - "blas2/symv_gtest.cpp"
      - "blas2/syr_gtest.cpp"
      - "blas2/syr2_gtest.cpp"
      - "blas2/tbmv_gtest.cpp"
      - "blas2/tbsv_gtest.cpp"
      - "blas2/tpmv_gtest.cpp"
      - "blas2/tpsv_gtest.cpp"
      - "blas2/trmv_gtest.cpp"
      - "blas2/trsv_gtest.cpp"
    exclude:
    labels:
      - "blas2"
      - "level3"

  level4:
    description: "BLAS Level 3 operations (matrix-matrix operations)"
    test_patterns:
      - "*dgmm*"
      - "*geam*"
      - "*gemm*"
      - "*hemm*"
      - "*herk*"
      - "*her2k*"
      - "*herkx*"
      - "*symm*"
      - "*syrk*"
      - "*syr2k*"
      - "*syrkx*"
      - "*trmm*"
      - "*trsm*"
      - "*trtri*"
    test_files:
      - "blas3/dgmm_gtest.cpp"
      - "blas3/geam_gtest.cpp"
      - "blas3/gemm_gtest.cpp"
      - "blas3/hemm_gtest.cpp"
      - "blas3/herk_gtest.cpp"
      - "blas3/her2k_gtest.cpp"
      - "blas3/herkx_gtest.cpp"
      - "blas3/symm_gtest.cpp"
      - "blas3/syrk_gtest.cpp"
      - "blas3/syr2k_gtest.cpp"
      - "blas3/syrkx_gtest.cpp"
      - "blas3/trmm_gtest.cpp"
      - "blas3/trsm_gtest.cpp"
      - "blas3/trtri_gtest.cpp"
    exclude:
      - "*dgmm*"
      - "*hemm*"
      - "*herk*"
      - "*trtri*"
    labels:
      - "blas3"
      - "level4"

  level5:
    description: "BLAS Extended operations (mixed precision, enhanced functionality)"
    test_patterns:
      - "*_ex*"
      - "*axpy_ex*"
      - "*dot_ex*"
      - "*nrm2_ex*"
      - "*rot_ex*"
      - "*scal_ex*"
      - "*gemm_ex*"
      - "*trsm_ex*"
    test_files:
      - "blas_ex/axpy_ex_gtest.cpp"
      - "blas_ex/dot_ex_gtest.cpp"
      - "blas_ex/nrm2_ex_gtest.cpp"
      - "blas_ex/rot_ex_gtest.cpp"
      - "blas_ex/scal_ex_gtest.cpp"
      - "blas_ex/gemm_ex_gtest.cpp"
      - "blas_ex/trsm_ex_gtest.cpp"
    exclude:
      - "*_ex*"
      - "*axpy_ex*"
    exclude_windows:
      - "*scal_ex*"
    exclude_linux:
      - "*gemm_ex*"
    labels:
      - "blas_ex"
      - "extended"
      - "level5"

  level6:
    description: "Linear algebra solver operations"
    test_patterns:
      - "*gels*"
      - "*geqrf*"
      - "*getrf*"
      - "*getri*"
      - "*getrs*"
      - "*solver*"
    test_files:
      - "solver/gels_gtest.cpp"
      - "solver/geqrf_gtest.cpp"
      - "solver/getrf_gtest.cpp"
      - "solver/getri_gtest.cpp"
      - "solver/getrs_gtest.cpp"
    labels:
      - "solver"
      - "level6"

# Test execution settings
execution_settings:
  default_timeout: 300  # 5 minutes per test
  category_timeouts:
    level1: 120      # 2 minutes for auxiliary tests
    level2: 300      # 5 minutes for BLAS1 tests
    level3: 600      # 10 minutes for BLAS2 tests
    level4: 900      # 15 minutes for BLAS3 tests (more intensive)
    level5: 600    # 10 minutes for extended BLAS tests
    level6: 1200    # 20 minutes for solver tests (most intensive)
