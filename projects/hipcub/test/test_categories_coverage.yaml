# Coverage configuration for hipCUB (header-only).
#
# Per-project coverage metadata consumed by the code-coverage CI flow (see
# .github/scripts/export_coverage_metadata.py). Kept next to this project's
# test_categories.yaml, following the repo's test_categories_*.yaml convention.
#
# hipCUB is header-only: there is no shared library to instrument, so coverage
# is collected from the instrumented test binaries. `test_binaries` entries are
# name prefixes; the export/report scripts resolve them to the built executables
# (scoped to this component's build subdir) and stage them for llvm-cov.
enabled: true
coverage_objects:
  libraries: []
  test_binaries:
    - test_hipcub_
ignore_filename_regex: '.*/test/.*|.*/benchmark/.*|.*/gtest/.*|.*/_deps/.*|.*deps.*'
llvm_profile_pattern: '%m'
test_category: quick
