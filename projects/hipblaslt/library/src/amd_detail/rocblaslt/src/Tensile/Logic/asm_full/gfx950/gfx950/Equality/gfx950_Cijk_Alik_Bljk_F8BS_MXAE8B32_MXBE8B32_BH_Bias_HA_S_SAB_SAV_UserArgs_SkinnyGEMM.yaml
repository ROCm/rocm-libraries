# Generated by a TensileLite benchmark followed by LibraryLogic (LibraryType Equality, ExactLogic)
# of the six custom kernels in tensilelite/tensilelite/CustomKernels/skinny_mxfp8, on one
# gfx950 GPU. The kernels serve a skinny extent on either free dimension, so ExactLogic covers both
# orientations: skinny n = 1..4 with m wide (m, n, 1, k, ldd = ldc = m, lda = ldb = k) and the mirrored
# skinny m = 1..4 with n wide (the m and n sizes swapped). Shape set: the decode projections listed
# by the sweep (qwen3-32b, llama3-8b, llama3-70b and additional decode projections) at skinny
# extents 1..4, plus their mirrors, minus the shapes where the generic kernels are faster. Omitted in
# both orientations: k = 1280 (wide 4096 and 8192) and k = 1536 (wide 5120), skinny 1, 2, 4 (4096x4x1280:
# 16.9 us skinny vs 7.05 us generic); 128256x8192, skinny 1, 2, 4 (about 185-195 us skinny vs about
# 165 us generic); and 5120x1x2048 (about 14.0 us skinny vs 12.7 us generic). ExactLogic was pruned
# by hand for this; regenerating it must keep those shapes out.
# LibraryType must stay Equality: Range reads the ExactLogic keys as intervals and never matches. Routing
# uses (m, n, batch, k) only; the leading-dimension entries of the keys are ignored.
