# Generated by ONE TensileLite benchmark run followed by LibraryLogic (LibraryType Equality, ExactLogic)
# of the four custom kernels in tensilelite/tensilelite/CustomKernels/skinny_mxfp8 (SolutionIndex
# 0..3 in the order of the sweep selection), on one gfx950 GPU (MI355X). All sizes were benchmarked in that
# single run with kernel (GPU) time, 20 warmups, 20 enqueues per sync, a 512 MB rotating buffer, Trig A/B data,
# MXScaleFormat 1, alpha = 1, beta = 0 (the decode case; the kernels skip C) and sampled validation (4096
# elements per problem; every size passed). The kernels serve a skinny extent on either free dimension, so
# ExactLogic covers both orientations: skinny n = 1..4 with m wide (m, n, 1, k, ldd = ldc = m, lda = ldb = k)
# and the mirrored skinny m = 1..4 with n wide (the m and n sizes swapped). Shape set: the 74 shapes of
# sweep_skinny_gemm_shapes.yaml plus their mirrors (148 sizes), minus the dropped shapes, 142 keys. Keys
# per kernel (sel0..sel3): 30, 63, 14, 35.
# Pruning rule: a shape is dropped in both orientations when, in either orientation, the first non-skinny
# heuristic solution (what hipBLASLt runs without this shard) is strictly faster than the skinny kernel.
# Measured with hipblaslt-bench on one MI355X: f8 A and B, bf16 C and D, MX scales (scaleA = scaleB = 1001),
# TN, alpha = 1, beta = 0, batch 1, 20 iterations after 10 cold iterations, 512 MiB rotating buffer, GPU timer,
# medians of 3 interleaved repetitions, skinny solution and the generic heuristic list timed in one process.
# Dropped in both orientations (3 shapes): 128256x8192, skinny 1, 2, 4: 178.0-180.8 us skinny vs 163.3-165.8
# us generic over both orientations (largest ratio 128256x4x8192: 180.5 vs 163.3 us). On the kept shapes the
# generic over skinny time ratio is 1.02 to 2.79 (median 1.59, geomean 1.63).
# The fifth kernel of the sweep selection (gemm_BM2_TN4_..._PF1) was benchmarked but won no shape and was removed.
# LibraryType must stay Equality: Range reads the ExactLogic keys as intervals and never matches. Routing
# uses (m, n, batch, k) only; the leading-dimension entries of the keys are ignored.
