#
# Human-written description of one HipKittens GEMM variant. The build does not
# read this file and does not pass it to TensileLite. write_entries.cpp describes
# this variant and writes its one-solution library entry; the backend compiles
# Template with HipFlags.
Template: gemm_tn_256x256x64_gfx950.hip
Architecture: gfx950
HipFlags: [-std=c++20, -DKITTENS_CDNA4, -DHK_FP16, -w]
# What the built kernel uses; hipblaslt-jit-hipkittens-test checks it.
Resources:
  KernargBytes: 84
  LdsBytes: 160000
  Vgprs: 238
  VgprSpills: 0
Solution:
  ProblemType:
    OperationType: GEMM
    DataType: h
    DestDataType: h
    ComputeDataType: s
    HighPrecisionAccumulate: True
    TransposeA: True
    TransposeB: False
    UseBeta: True
    Batched: True
    UseBias: 0
    Activation: False
    UseScaleAlphaVec: 0
  CustomKernel:
    name: HK_gemm_f16_TN_MT256x256x64_W2x4_gfx950_abi5
    args: [ { type: address, semantic: AddressA },
            { type: address, semantic: AddressB },
            { type: address, semantic: AddressC },
            { type: address, semantic: AddressD },
            { type: uint32, semantic: SizeFree0 },
            { type: uint32, semantic: SizeFree1 },
            { type: uint32, semantic: SizeSum },
            { type: float32, semantic: Alpha },
            { type: float32, semantic: Beta },
            { type: uint32, semantic: StrideA0 },
            { type: uint32, semantic: StrideB0 },
            { type: uint32, semantic: StrideC0 },
            { type: uint32, semantic: StrideD0 },
            { type: uint32, semantic: StrideA1 },
            { type: uint32, semantic: StrideB1 },
            { type: uint32, semantic: StrideC1 },
            { type: uint32, semantic: StrideD1 } ]
    macrotile: [256, 256, 64]
    threads: [512, 1, 1]
    grid: [TilesXY, One, Batch]
    workspaceType: None
  InternalSupportParams:
    KernArgsVersion: 0
  MatrixInstruction: [16, 16, 32, 1]
  EnableMatrixInstruction: True
  MIWaveTile: [8, 4]
  WavefrontSize: 64
  GlobalSplitU: 1
  StaggerU: 0
  # Odd numbers of 64-wide K tiles give wrong results, and the kernel has no
  # tail handling for M or N.
  AssertFree0ElementMultiple: 256
  AssertFree1ElementMultiple: 256
  AssertSummationElementMultiple: 128
