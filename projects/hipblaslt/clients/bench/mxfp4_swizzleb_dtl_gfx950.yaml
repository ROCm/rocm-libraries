# SwizzleB MXFP4 performance set for gfx950 (MI355X), 12 shapes.
#
# These are the shapes the Equality tuning file
#   library/.../Logic/asm_full/gfx950/gfx950/Equality/
#     gfx950_Cijk_Alik_Bljk_F4BS_MXA32_MXB32_STB_BH_BiasSB_HAS_SAB_SAV_UserArgs.yaml
# is tuned for.  Run with:
#
#   HIP_VISIBLE_DEVICES=<gpu> hipblaslt-bench --yaml mxfp4_swizzleb_dtl_gfx950.yaml
#
# Pin a single GPU: on a multi-GPU node other users' work perturbs the timings.
# HIP_VISIBLE_DEVICES remaps the chosen device to logical 0, which is why every
# entry below uses `device: 0`.
#
# iters is sized per shape so each entry runs for a comparable wall time, and
# cold_iters matches iters so the rotating buffer is fully cycled before timing.
# rotating: 512 plus flush: true keeps every iteration reading cold data, so the
# numbers reflect HBM-resident operands rather than an L2-warm best case.
# Dropping either one inflates the small-K shapes.
#
# Expected: ~4.4 PFLOP/s geomean across the 12 shapes on MI355X.  Per-shape
# TFLOP/s is printed in the `hipblaslt-Gflops` column; print_kernel_info also
# reports the selected solution index so a tuning miss is visible.
