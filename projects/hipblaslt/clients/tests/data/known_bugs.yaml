Known bugs:
  # ROCM-1545: TF32 matmul with INF inputs returns NaN on gfx950 (MI355)
  # gfx1250-strict is listed alongside gfx1250 because the match is an exact
  # token comparison against the name the runtime reports, and a v0 part reports
  # the revision; the defect is in silicon the revision shares.
  - { name: matmul_tf32_inf_ROCM1545, function: matmul, initialization: inf, known_bug_platforms: "gfx950, gfx1250, gfx1250-strict" }
  # ROCM-1545 (same root cause): the special-FP sweep hits it on the TF32 (xf32)
  # compute type when the input is +Inf or -Inf -- the GPU returns -nan where the
  # CPU reference is +Inf, failing check_special_value_consistency(). Only the xf32
  # Inf/-Inf cases fail; the f16/bf16/f32/f64 Inf cases and the xf32 NaN case pass,
  # so scope the quarantine to compute_type xf32_r + inf/neg_inf. REMOVE once the
  # TF32 Inf fix lands so these re-activate as an enforced consistency gate.
  - { name: matmul_special_fp_64x64, function: matmul, compute_type: c_xf32_r, initialization: inf, known_bug_platforms: "gfx950, gfx1250, gfx1250-strict" }
  - { name: matmul_special_fp_64x64, function: matmul, compute_type: c_xf32_r, initialization: neg_inf, known_bug_platforms: "gfx950, gfx1250, gfx1250-strict" }
  # ROCM-26455: bf16 matmul output-store address overflow -- an output element
  # offset > 2^31 (from an oversized output leading dimension ldc/ldd) wraps in the
  # 32-bit global-write address path and produces silent wrong results. The gate
  # matmul_size_t_output_overflow_bf16_ROCM26455 is the bit-exact reproducer
  # (FAIL-pre-fix / PASS-post-fix). It is registered here as a known failure on the
  # affected data-center arches so the reproducer can land ahead of the kernel fix.
  # REMOVE this entry once the output-store path is fixed so the case re-activates
  # as an enforced bit-exact regression gate.

  # ROCM-32050: an illegal memory access on gfx1250 in f32 NN 32768 x 32768 x 4096,
  # where C and D are exactly 4 GiB; it kills the test process there. REMOVE this
  # entry in the PR that fixes ROCM-32050. Review by 2026-11-01.
  - { name: matmul_fast_check_threshold_cd_4gib_ROCM32050, function: matmul, known_bug_platforms: "gfx1250, gfx1250-strict" }
  # gfx1250: matmul_batch_offset bf16 TN, batch_mode=1 only.
  - { function: matmul_batch_offset, a_type: bf16_r, b_type: bf16_r, c_type: bf16_r, d_type: bf16_r, transA: T, transB: N, batch_mode: 1, known_bug_platforms: gfx1250 }
  # gfx950: complex (f32_c) transpose-NT size-1 / degenerate shapes in
  # matmul_batch_complex_general_batch_edge hit kernel selection returning
  # "NO solution found". Suspected cause: the gfx950 NT complex library has only
  # a width-2 read solution (GRVWA=GRVWB=2, no width-1), so it can't serve a
  # size-1 M or N free dim.
  # REMOVE once gfx950 gets a width-1 NT complex kernel.
  - { name: matmul_batch_complex_general_batch_edge, function: matmul, transA: N, transB: T, known_bug_platforms: gfx950 }
  # ROCM-33823 (#14282): on gfx950, alpha = 0 and beta = 1 complex batched edge
  # cases leave some D elements unwritten, which now always fail since D is filled
  # with a NaN sentinel before each verified launch. REMOVE this entry in the PR that
  # fixes ROCM-33823. Review by 2026-11-16.
  - { name: matmul_batch_complex_general_batch_edge, function: matmul, alpha: 0, alphai: 0, beta: 1, betai: 0, known_bug_platforms: gfx950 }
  # AIHPBLAS-5511: gfx950 generic (non-skinny) MXFP8 subtile kernels over-read C past
  # column N when beta != 0 and N is not a multiple of 16, which faults depending on
  # allocation order. These nine shapes are not shard keys and run the generic Cijk_
  # kernels, not the skinny gemm_BM* ones.
  # REMOVE these entries once the C-load over-read fix (GlobalWriteBatch.py exec-masked
  # C load) lands. Fix: #15501. Review by 2026-12-15.
  - { name: matmul_skinny_mxfp8_tn_alpha_beta, function: matmul, M: 29584, N: 4, K: 8192, alpha: 1.5, beta: 0.5, known_bug_platforms: gfx950 }
  - { name: matmul_skinny_mxfp8_tn_alpha_beta, function: matmul, M: 4, N: 16385, K: 2304, alpha: 1.5, beta: 0.5, known_bug_platforms: gfx950 }
  - { name: matmul_skinny_mxfp8_tn_alpha_beta, function: matmul, M: 10240, N: 3, K: 9216, alpha: 1.5, beta: 0.5, known_bug_platforms: gfx950 }
  - { name: matmul_skinny_mxfp8_tn_alpha_beta, function: matmul, M: 16384, N: 2, K: 5120, alpha: 1.5, beta: 0.5, known_bug_platforms: gfx950 }
