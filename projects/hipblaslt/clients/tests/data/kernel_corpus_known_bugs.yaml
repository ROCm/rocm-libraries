# Kernels the kernel corpus tester (clients/scripts/kernel_corpus) is known to find broken.
#
# Unlike known_bugs.yaml next to this file, which removes matching client tests so they never
# run, every kernel listed here still runs on every corpus pass. A failing case that matches an
# entry is reported as known_fail with its ticket instead of failing the run. The run fails when
# an entry needs attention:
#   - every case it matches passed: the bug looks fixed, so remove the entry in the fixing PR;
#   - its review_by date has passed: renew it with a new date and a reason, or remove it.
#
# Required fields:
#   arch           gfx architecture of the library, e.g. gfx942
#   solution_name  the solution's name in the TensileLibrary file (the "name" column of the
#                  corpus); it stays the same when a retune shifts runtime indices
#   ticket         tracker key, e.g. ROCM-12345
#   added          date the entry was added, YYYY-MM-DD
#   review_by      date by which the entry must be renewed or removed, YYYY-MM-DD
#   reason         one line on what fails
# Optional fields narrow the match:
#   global_split_u  split-K value, for custom-GSU solutions that share a name
#   device          regular expression on the device name, e.g. "MI300X"
#   shape           smoke shape tag: exact, ragged, ktail or batch
#   profile         test profile, e.g. smoke

