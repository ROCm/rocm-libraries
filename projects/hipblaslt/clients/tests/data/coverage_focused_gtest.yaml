# 2. GROUPED GEMM OPERATIONS - Target lines 1295-1722
# ==============================================================================

- name: coverage_grouped_gemm_basic
  category: pre_checkin
  function: matmul
  a_type: f16_r
  b_type: f16_r
  c_type: f16_r
  d_type: f16_r
  compute_type: c_f32_r
  scale_type: f32_r
  transA: [N, T]
  transB: N
  alpha: 1.0
  beta: [0.0, 1.0]
  M: [128, 256]
  N: [128, 256]
  K: [128, 256]
  grouped_gemm: [2, 3, 5]
  batch_count: 1

- name: coverage_grouped_gemm_with_bias
