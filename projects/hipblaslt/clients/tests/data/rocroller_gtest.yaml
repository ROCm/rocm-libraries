---
include: hipblaslt_common.yaml
include: matmul_common.yaml


Tests:
- name: rocroller_predicate
  category: pre_checkin
  function:
    rocroller_predicate: *rocroller_predicate
  M: [128]
  N: [128]
  K: [96]
  transA: T
  transB: N
  alpha: 1.5
  beta: 2.0
  initialization: hpl
  unit_check: 0
  # No numerical check: this now lands on a generated MX kernel, and those fail
  # norm_check on their own, with HIPBLASLT_USE_ROCROLLER=0 and so without any
  # rocRoller routing. Restore norm_check: 1 once that is fixed.
  norm_check: 0
  gpu_arch: '950'

# A single rocRoller buffer descriptor's num_records field is 32 bits, so it cannot
# address an operand >= 4 GiB. Here input A = M*K (f8) = 65536*65536 = 4 GiB = 2^32
# bytes, which would otherwise wrap num_records and silently produce all-zero output.
# The rocRoller kernel must stay unsupported; the call is then served by the
# TensileLite fallback. Output is kept tiny (N=256) so the case allocates ~8 GiB
# (A + host copy), not 4 GiB of fp32 output.
# nightly + gfx950: large allocation, matches the matmul_*_grid_limit large-size group.
- name: rocroller_predicate_4gib_buffer
  category: nightly
  function:
    rocroller_predicate:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [65536]
  N: [256]
  K: [65536]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 0
  gpu_arch: '950'

# Block scaling routes a problem to rocRoller, which serves batch_count == 1
# only. The problem must reach the TensileLite heuristic and get a kernel
# instead of failing the call. gfx950 because gfx1250 never routes to
# rocRoller, so only here does a batched block-scaled problem reach the
# fallback. No numerical check: the generated MX kernels this lands on fail
# norm_check at batch_count 1 too, with HIPBLASLT_USE_ROCROLLER=0 and so
# without any rocRoller routing at all. That is a TensileLite defect this test
# must not be coupled to; what it asserts is that a solution is found and the
# call succeeds, which is what used to be impossible.
- name: matmul_mxf8_batched_rocroller_fallback
  category: pre_checkin
  function:
    matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
    - { a_type: f4_r, b_type: f4_r, c_type: bf16_r, d_type: bf16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  batch_count: [2, 16]
  initialization: uniform_low_precision
  unit_check: 0
  norm_check: 0
  gpu_arch: '950'

# Selection on the object (hipblaslt_ext) API sees only a Tensile problem, which does
# not record the block-scale format, so block-scaled GEMMs used to bypass rocRoller
# routing there and silently fall through to the Tensile heuristic. No other use_ext
# case in the suite carries block scales, which is why that went unnoticed. Covers
# both the create-time and setProblem forms of the object API.
#
# Asserts that such a problem resolves to a solution, runs it, and gets the right
# answer. Which kernel it resolves to differs by build -- rocRoller JIT when
# HIPBLASLT_ENABLE_ROCROLLER is on, a checked-in RR_GEMM_* otherwise -- so this pins
# the routing rather than any one kernel.
- name: rocroller_ext_block_scaled
  category: pre_checkin
  function:
    matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f16_r, d_type: f16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  use_ext: [1]
  use_ext_setproblem: [0, 1]
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

...
