---
include: hipblaslt_common.yaml
include: matmul_common.yaml


Tests:
- name: rocroller_predicate
  category: pre_checkin
  function:
    rocroller_predicate: *rocroller_predicate
  M: [128]
  N: [128]
  K: [96]
  transA: T
  transB: N
  alpha: 1.5
  beta: 2.0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

# A single rocRoller buffer descriptor's num_records field is 32 bits, so it cannot
# address an operand >= 4 GiB. Here input A = M*K (f8) = 65536*65536 = 4 GiB = 2^32
# bytes, which would otherwise wrap num_records and silently produce all-zero output.
# The kernel must instead be reported unsupported ("NO solution found!"). Output is kept
# tiny (N=256) so the case allocates ~8 GiB (A + host copy), not 4 GiB of fp32 output.
# nightly + gfx950: large allocation, matches the matmul_*_grid_limit large-size group.
- name: rocroller_predicate_4gib_buffer
  category: nightly
  function:
    rocroller_predicate:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [65536]
  N: [256]
  K: [65536]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

# rocRoller-off build only. A rocRoller-routed GEMM runs rocRoller's own pick,
# taken from the checked-in kernels, or nothing. rocRoller picks a 256x128x128
# tile for this problem and no such kernel is checked in, so neither API may
# offer another kernel instead.
- name: rocroller_pick_without_kernel_no_solution
  category: pre_checkin
  function:
    rocroller_off_matmul:
    - { a_type: bf6_r, b_type: bf8_r, c_type: f16_r, d_type: f16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [1024]
  N: [4096]
  K: [512]
  transA: T
  transB: N
  use_ext: [0, 1]
  expect_no_solution: 1
  initialization: hpl
  gpu_arch: '950'

# rocRoller-off build only. The object (hipblaslt_ext) API selects block-scaled
# GEMMs with the same walk as the C API, so this problem resolves to rocRoller's
# pick among the checked-in RR_GEMM_* kernels, runs it, and gets the right
# answer. Covers both the create-time and setProblem forms of the object API.
- name: rocroller_ext_block_scaled
  category: pre_checkin
  function:
    rocroller_off_matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f16_r, d_type: f16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  use_ext: [1]
  use_ext_setproblem: [0, 1]
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'
# rocRoller-off build only. rocRoller's first ranked tile for this problem is a
# 32x32x128 Stream-K tile, so both APIs must serve the checked-in Stream-K
# kernel for it, at the default uniform-summation-order setting, and get the
# right answer.
- name: rocroller_streamk_kernel
  category: pre_checkin
  function:
    rocroller_off_matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f16_r, d_type: f16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [128]
  N: [1024]
  K: [4096]
  transA: T
  transB: N
  use_ext: [0, 1]
  requires_streamk: 1
  expected_kernel: RR_GEMM_TN_FP8_FP8_Half_Half_Float_SA_BE8M0_32_SB_BE8M0_32_SK_WGT_32x32x128_UR_2
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

...
