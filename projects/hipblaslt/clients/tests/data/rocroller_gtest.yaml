---
include: hipblaslt_common.yaml
include: matmul_common.yaml


Tests:
# K = 96, which no workgroup tile divides, with host-pre-swizzled scales: a
# Tensile MX kernel serves it. Only pre-swizzled scales have a Tensile fallback;
# with compact scales nothing serves this shape.
- name: rocroller_predicate
  category: pre_checkin
  function:
    rocroller_predicate: *rocroller_predicate
  M: [128]
  N: [128]
  K: [96]
  transA: T
  transB: N
  alpha: 1.5
  beta: 2.0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

# A single rocRoller buffer descriptor's num_records field is 32 bits, so it cannot
# address an operand >= 4 GiB. Here input A = M*K (f8) = 65536*65536 = 4 GiB = 2^32
# bytes, which would otherwise wrap num_records and silently produce all-zero output.
# The rocRoller kernel must stay unsupported. The scales are compact, which no
# TensileLite MX kernel reads, so the answer is no solution rather than a kernel
# that returns zeros. Output is kept tiny (N=256) so the case allocates ~8 GiB
# (A + host copy), not 4 GiB of fp32 output.
# nightly + gfx950: large allocation, matches the matmul_*_grid_limit large-size group.
- name: rocroller_predicate_4gib_buffer
  category: nightly
  function:
    rocroller_predicate:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [65536]
  N: [256]
  K: [65536]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  initialization: hpl
  expect_no_solution: 1
  unit_check: 0
  norm_check: 0
  gpu_arch: '950'

# Batched MX GEMMs reach the Tensile heuristic: rocRoller serves batch_count == 1
# only. Tensile's MX kernels read host-pre-swizzled scales
# (Block_32_UE8M0_32_8_EXT = 1001), so with those the problem must get a kernel
# and the call succeed with the right answer. gfx950 because only there do the
# MX types reach these paths.
- name: matmul_mxf8_batched_rocroller_fallback
  category: pre_checkin
  function:
    matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 1001, scaleB: 1001, scale_type: f32_r }
    - { a_type: f4_r, b_type: f4_r, c_type: bf16_r, d_type: bf16_r, compute_type: c_f32_r, scaleA: 1001, scaleB: 1001, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  batch_count: [2, 16]
  initialization: uniform_low_precision
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

# The same batched problems with compact (packed, not pre-swizzled) scales have
# no kernel: rocRoller declines batch_count > 1 and no Tensile MX kernel reads
# compact scales. The answer is no solution, not a kernel that misreads them.
- name: matmul_mx_batched_packed_scales_no_solution
  category: pre_checkin
  function:
    matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f32_r, d_type: f32_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
    - { a_type: f4_r, b_type: f4_r, c_type: bf16_r, d_type: bf16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  alpha: 1
  beta: 0
  batch_count: [2, 16]
  initialization: uniform_low_precision
  expect_no_solution: 1
  unit_check: 0
  norm_check: 0
  gpu_arch: '950'

# Selection on the object (hipblaslt_ext) API sees only a Tensile problem, which does
# not record the block-scale format, so block-scaled GEMMs used to bypass rocRoller
# routing there and silently fall through to the Tensile heuristic. No other use_ext
# case in the suite carries block scales, which is why that went unnoticed. Covers
# both the create-time and setProblem forms of the object API.
#
# Asserts that such a problem resolves to a solution, runs it, and gets the right
# answer, which pins the routing rather than any one kernel. It runs on the
# rocRoller build only (rocroller_matmul): with compact scales the off build has
# no kernel to serve it.
- name: rocroller_ext_block_scaled
  category: pre_checkin
  function:
    rocroller_matmul:
    - { a_type: f8_r, b_type: f8_r, c_type: f16_r, d_type: f16_r, compute_type: c_f32_r, scaleA: 3, scaleB: 3, scale_type: f32_r }
  M: [256]
  N: [256]
  K: [256]
  transA: T
  transB: N
  use_ext: [1]
  use_ext_setproblem: [0, 1]
  alpha: 1
  beta: 0
  initialization: hpl
  unit_check: 0
  norm_check: 1
  gpu_arch: '950'

...
