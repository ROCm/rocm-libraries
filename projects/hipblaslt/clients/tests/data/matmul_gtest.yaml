###############################################################################
# fast_check side operands (AIHPBLAS-5017).
#
# D = scaleD * (alpha * diag(scaleAlpha_vector .* scaleA) * A * B * diag(scaleB)
#               + beta * scaleC * C + bias)
# is linear in the result, so fast_check folds every scale into its probe sums;
# scaleA and scaleB may each be one value or a vector (per row of D for scaleA,
# per column for scaleB). The scales and bias come from the generic integer fill
# (1 to 10), so reading the wrong one changes D. E, the pre-activation result times
# scaleE, is checked the same way. relu and clamp are checked element by element
# from the verified E; GELU, SiLU and sigmoid have no exact integer form and are
# not supported. amaxD must equal the largest |activation| over the verified
# result, and a bias gradient must equal the exact row or column sums. Each case
# here also runs unit_check on the same result.
###############################################################################

# scaleA and scaleB as one value (1) or a vector (2). On gfx942 and gfx950 the
# library offers them for fp8 inputs only, vector scales only with a 16-bit output,
# and no mix of one value and a vector; gfx90a offers neither. scaleC and scaleD
# come only with an fp8 output, which the integer scales would saturate.
# ROCM-32062: the client CPU reference scales the wrong rows of A when lda exceeds
# the rows stored, so the vector cases keep lda and ldb packed, and the
# *_lda_ROCM32062 cases, quarantined in known_bugs.yaml, keep them padded.
