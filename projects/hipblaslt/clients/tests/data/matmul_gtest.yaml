###############################################################################
# 32-bit / size_t overflow coverage (AIHPBLAS-3806).
#
# These cases catch INT32 element-index overflow (element index > 2^31 - 1) in
# the TensileLite addressing path -- the silent output-store correctness defect
# ROCM-26455, reproduced by the bf16 gate below. They are modeled after
# rocBLAS's gemm_size_t tests: M/N/K stay moderate while a leading dimension or
# batch stride is inflated so the output (or input) element index crosses 2^31.
# Full unit_check is used so both memory faults AND silent corruption are caught.
#
# Memory note: these allocate several GiB. On GPUs without enough memory the
# harness reports the allocation failure as a skip (CHECK_DEVICE_ALLOCATION),
# so the cases are safe to keep enabled; they only run for real on large-memory
# parts. Gated to the gfx9 data-center arches where the defect manifests.
###############################################################################

# Systematic element-index overflow sweep (f32), rotating the
# oversized leading dimension across A, B and the output C/D.
- name: matmul_size_t_index_overflow
  category: stress
  function:
    matmul: *single_precision
  matrix_size: *size_t_index_overflow
  transA: [ N, T ]
  transB: [ N, T ]
  alpha: 2.0
  beta: 4.0
  initialization: integer_exact
  unit_check: 1
  gpu_arch: '9(0a|42|50)'

# Same sweep in f16 and bf16 (bf16 is the precision of the ROCM-26455 defect). This sweep
# stays on rand_int rather than integer_exact: an input-side leading-dimension
# overflow needs the oversized ld multiplied by K (transA=N / transB=T), which
# requires K=2048, but integer_exact deliberately caps 16-bit at K<=512 for exact
# representability and would skip the whole sweep. The bit-exact integer_exact
# path covers the output-side defect via matmul_size_t_output_overflow_bf16_ROCM26455.
- name: matmul_size_t_index_overflow_hpa
  category: stress
  function:
    matmul:
      - *hpa_half_precision
      - *hpa_bf16_precision
  matrix_size: *size_t_index_overflow
  transA: [ N, T ]
  transB: [ N, T ]
  alpha: 2.0
  beta: 4.0
  initialization: rand_int
  unit_check: 1
  gpu_arch: '9(0a|42|50)'

# Concrete ROCM-26455 reproducer: bf16, transA=N / transB=T, with bias and
# a scaleAlpha vector (the Cijk_Ailk_Bjlk_BBS_BH_Bias_HA_S_SAV kernel family),
# driven onto an oversized output leading dimension so the output buffer index
# crosses 2^31 -> silent wrong results (a correctness defect in the output-store
# address path). When the
# output-store fix lands this case FAILs pre-fix / PASSes post-fix; until then it
# is registered in known_bugs.yaml (skipped on the affected gfx942/gfx950 arches)
# so the reproducer can land ahead of the fix -- remove that known_bugs entry to
# re-activate it as an enforced bit-exact gate. integer_exact initialization fills
# A/B/C with {0,1,2} and bias/scaleAlphaVec with small integers, keeping the whole
# epilogue integer-valued so the harness can demand a bit-exact (tol=0) match.
# K=256 stays under the 16-bit exact-representability cap.
- name: matmul_size_t_output_overflow_bf16_ROCM26455
  category: pre_checkin
  function:
    matmul: *hpa_bf16_precision
  matrix_size: *size_t_output_overflow
  transA: N
  transB: T
  alpha: 1.0
  beta: 0.0
  bias_vector: 1
  bias_type: f32_r
  scaleAlpha_vector: 1
  initialization: integer_exact
  unit_check: 1
  gpu_arch: '9(42|50)'

# Strided-batched output: inflate stride_c/stride_d so stride * bpe crosses 2^31
# for the per-batch base offset, while the per-batch compute stays at 64x64x64.
# For bf16 (bpe = 2), stride = 1073741824 (2^30) -> 2^31 bytes for batch index 1.
- name: matmul_size_t_batch_stride_overflow
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64,
        stride_a: 4096, stride_b: 4096, stride_c: 1073741824, stride_d: 1073741824 }
  batch_count: 2
  transA: N
  transB: T
  alpha: 1.0
  beta: 0.0
  initialization: integer_exact
  unit_check: 1
  gpu_arch: '9(0a|42|50)'

# ROCM-31258: hand-written custom kernels bound D and C stores with a buffer
# descriptor length (num_records) of BufferOOB. While BufferOOB was 0x80000000,
# the host admitted shapes whose checked store extent, ldd * min(MacroTile1, N)
# * 4, lies past 2 GiB, and the kernel silently dropped those stores. On gfx950,
# fp32 NN with the xf32 fast path selects such a kernel (MacroTile1 = 256):
#   M = 2097152 -> extent is exactly 0x80000000, clean even with the old value
#   M = 2097153 -> one step past it, the last element was dropped
#   M = 3000000 -> 14976 elements in the trailing rows were dropped
# The custom kernel is the heuristic's first choice for these shapes; checking
# all ~680 candidates exceeds the per-test time limit. c_equal_d leaves
# unwritten elements holding C rather than 2AB - 2C, so unit_check catches them.
# With integer_exact and K = 32 every |D| is at most 256, exact on the xf32 path.
# Each shape needs about 3.2 GiB of device memory and ~15 s end to end.
- name: matmul_integer_exact_custom_kernel_store_extent_xf32_ROCM31258
  category: pre_checkin
  function:
    matmul: *xf32_precision
  matrix_size:
    - { M: 2097152, N: 256, K: 32 }
    - { M: 2097153, N: 256, K: 32 }
    - { M: 3000000, N: 256, K: 32 }
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  c_equal_d: true
  initialization: integer_exact
  unit_check: 1
  gpu_arch: '950'

# Concrete ROCM-31230 reproducer: fp32 NN with an oversized A leading dimension, so
# lda * DepthU * bpe reaches 2^31 and the signed widen of the StaggerU global-read
# increment walks the A read descriptor backwards instead of forwards. On gfx1201 this
# FAILs pre-fix / PASSes post-fix. The failure is a memory fault at this lda, because
# the displacement is close to 2 GB and lands unmapped; at an lda near 2^32 the same
# defect displaces by only tens of bytes, stays inside mapped memory and returns
# silently wrong results instead. unit_check with integer_exact is bit-exact, so it
# gates both faces of the defect, but the shape here is the one that fits on a 16 GiB
# part -- the silent-corruption shape needs 17 GiB for A.
#
# Every supported solution is exercised, via algo_method 1 with
# requested_solution_num -1 (the matmul_heuristic_all_solutions pattern), rather than
# only the heuristic's pick. The defect is kernel-specific, so a gate that ran one
# heuristically chosen solution would stop covering it the moment a retune changed
# that choice, and it would do so silently. Pinning solution_index is the other way
# to guarantee the affected kernel runs, but indices are not stable across retunes
# either. The all-solutions cost is small here because the 8.6 GiB allocation is made
# once and reused across launches: 17 solutions at this shape, about 7 s in total
# against 4.3 s for a single one.
#
# nightly rather than pre_checkin: A is 8.6 GiB on both the host and the device and
# cannot be made smaller, and a host-side shortfall currently crashes the harness
# instead of skipping (see the get_available_host_memory note on ROCM-31230), so this
# is kept off the per-PR tier.
- name: matmul_size_t_stagger_incs_overflow_f32_ROCM31230
  category: nightly
  function:
    matmul: *single_precision
  matrix_size: *size_t_stagger_incs_overflow
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  algo_method: [1]
  requested_solution_num: -1
  initialization: integer_exact
  unit_check: 1
  gpu_arch: '1201'

###############################################################################
# fast_check: verification without a host reference GEMM.
#
# unit_check compares D against a host reference GEMM, which costs O(M*N*K) and
# copies every padded buffer to pinned host memory. On gfx942 the ldd = 1049100
# case above spends 12 s of its 14.4 s allocating pinned host memory and the
# lda = 1049100 case spends 3.8 s in the reference. fast_check (fast_check.hpp)
# instead checks every element of D with Freivalds' algorithm in O(M*K + K*N +
# M*N) host work on unpadded copies, and checks the padding on the device:
#   - A, B and C padding holds a poison value (40), so a kernel that reads
#     padding produces a wrong D;
#   - D is filled with a NaN sentinel before each solution runs, and afterwards
#     every element outside the M x N x batch region must still hold it, so an
#     out-of-bounds write fails the test, as does an element never written.
# fast_check requires integer_exact. It also models the rounding of results too
# large for a 16-bit output, so 16-bit types can use K above 256 here.
#
# Runtimes below were measured on gfx942 (MI300A) with all fast_check cases in one
# process: about 75 s for the pre_checkin cases and 260 s for the nightly cases.
# A large case run on its own can take several seconds longer, because its device
# memory is allocated fresh instead of reused.
###############################################################################

# Both checks on the same results: they must agree. Covers every transpose, both
# integer_exact alpha/beta pairs, padded leading dimensions and strided batches.
# Runtime on gfx942: 48 cases, about 48 s.
- name: matmul_fast_check_matches_unit_check
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_half_precision
      - *hpa_bf16_precision
  matrix_size: *fast_check_crosscheck_sizes
  transA_transB: *transA_transB_range
  alpha_beta: *integer_exact_alpha_beta
  batch_count: 3
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

# Both checks with the epilogue fast_check supports (bias and scaleAlpha_vector),
# and with C and D sharing memory, where D's padding must keep C's poison value.
# lda equals A's row count here; see the padded-lda case below.
# Runtime on gfx942: 8 cases, under 1 s.
- name: matmul_fast_check_matches_unit_check_epilogue
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 131, N: 67, K: 200, lda: 131, ldb: 211, ldc: 140, ldd: 151 }
    - { M: 1031, N: 517, K: 256, lda: 1031, ldb: 1033, ldc: 1031, ldd: 1100 }
  transA: N
  transB: T
  alpha_beta: *integer_exact_alpha_beta
  bias_vector: 1
  bias_type: f32_r
  scaleAlpha_vector: 1
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

# The same with a padded lda. The CPU reference applies scaleAlpha_vector to the
# wrong rows of A when lda exceeds A's row count (ROCM-32062), so unit_check
# fails a GPU result fast_check accepts. Quarantined in known_bugs.yaml.
# Runtime on gfx942: 8 cases; skipped while quarantined.
- name: matmul_fast_check_epilogue_padded_lda_ROCM32062
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size: *fast_check_crosscheck_sizes
  transA: N
  transB: T
  alpha_beta: *integer_exact_alpha_beta
  bias_vector: 1
  bias_type: f32_r
  scaleAlpha_vector: 1
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

# Runtime on gfx942: 8 cases, about 1 s.
- name: matmul_fast_check_matches_unit_check_c_equal_d
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 1031, N: 517, K: 256, lda: 1040, ldb: 1033, ldc: 1100, ldd: 1100 }
  transA_transB: *transA_transB_range
  alpha: 2.0
  beta: -2.0
  c_equal_d: true
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

# The size_t index-overflow sweep with fast_check alone, in all three precisions.
# matmul_size_t_index_overflow_hpa above must use rand_int because integer_exact
# with unit_check caps 16-bit K at 256; fast_check removes that cap.
