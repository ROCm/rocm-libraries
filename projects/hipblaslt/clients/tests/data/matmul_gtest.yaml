###############################################################################
# fast_check exactness at large K (AIHPBLAS-5016).
#
# integer_exact results stay exact only while every partial sum and every result
# fits what the accumulator holds exactly (2^24 for f32). Before any kernel runs,
# fast_check bounds both from the actual inputs, over any subset of K, the form
# split-K and Stream-K partials take, and refuses a configuration that reaches
# that limit. D's own type is the tighter limit at large K (bf16 holds integers
# exactly only up to 256), and fast_check models the rounding into D, but each
# result outside D's exact range costs a K-length dot product on the host. Two
# patterns keep results small at any K:
#   ternary:  A, B and C in {-1, 0, 1}.
#   sparse_k: each row of A is zero except at 16 K indices spread over K, plus the
#             last, so every |result| is at most 140. The kept indices move from
#             row to row: with M at least K/16 every K index is nonzero in some
#             row, so a wrong read anywhere along K still changes D.
###############################################################################

# Both patterns checked against the host reference, which also uses them.
# Runtime on gfx90a: 32 cases, about 3 s.
- name: matmul_fast_check_patterns_match_unit_check
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size: *fast_check_crosscheck_sizes
  transA_transB: *transA_transB_range
  alpha: 2.0
  beta: -2.0
  integer_exact_pattern: [ ternary, sparse_k ]
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

# K = 28672 and 32768 with 16-bit outputs, every transpose. Under ternary a
# typical |result| grows like the square root of K, about 250 here: inside f16's
# exact range (2048) but not bf16's (256), where most results would round and
# each would cost a host dot product. bf16 uses sparse_k only.
# Runtime on gfx90a: 24 cases (f16 and bf16), about 11 s.
- name: matmul_fast_check_large_k_f16
