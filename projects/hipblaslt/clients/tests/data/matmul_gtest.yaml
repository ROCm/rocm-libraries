# scales saturate. FastCheckDevice_pre_checkin.activation_is_checked_through_e
# covers the amaxD check itself.

# Bias gradients from A (BGRADA) and B (BGRADB). gfx90a has them for f16 only, and
# gfx11 and gfx12 (other than gfx125x) have none, as for the other gradient cases.
# Runtime on gfx90a: 8 cases, under 1 s.
- name: matmul_fast_check_matches_unit_check_bias_gradient
  category: pre_checkin
  function:
    matmul: *hpa_half_precision
  matrix_size:
    - { M: 131, N: 67, K: 72, lda: 263, ldb: 211, ldc: 140, ldd: 151 }
  transA: [ N, T ]
  transB: [ N, T ]
  alpha: 2.0
  beta: -2.0
  gradient: 1
  bias_vector: 1
  bias_type: f32_r
  bias_source: [ a, b ]
  initialization: integer_exact
  unit_check: 1
  fast_check: 1
  gpu_arch_exclude: '11\d\d|12[^5]\d'

# gfx942 and gfx950 offer a bf16 bias gradient only from B with B transposed, and
# none in f32.
- name: matmul_fast_check_matches_unit_check_bias_grad_bf16
  category: pre_checkin
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 131, N: 67, K: 72, lda: 263, ldb: 211, ldc: 140, ldd: 151 }
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  gradient: 1
  bias_vector: 1
  bias_type: f32_r
  bias_source: b
  initialization: integer_exact
  unit_check: 1
  fast_check: 1
  gpu_arch: '9(42|50)'

# A per-batch bias with a gap before the next batch's vector, which holds poison.
# Runtime on gfx90a: 2 cases, under 1 s.
- name: matmul_fast_check_matches_unit_check_bias_stride
  category: pre_checkin
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 131, N: 67, K: 72, lda: 131, ldb: 211, ldc: 140, ldd: 151 }
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  batch_count: 3
  bias_vector: 1
  bias_type: f32_r
  bias_stride: 200
  initialization: integer_exact
  unit_check: 1
  fast_check: 1

###############################################################################
# fast_check size thresholds and launch limits (AIHPBLAS-5018).
#
# Classes A, B and D on AIHPBLAS-4988 appear only past a size threshold: an
# element index or byte offset at 2^31 or 2^32, a buffer limit at 2 or 4 GiB,
# or a launch of 2^32 work items (2^24 tiles of 256 threads). Each sweep here
# puts one shape just below a threshold and one just above it, so a failure
# brackets the overflow. These need up to about 33 GiB of device memory, so they
# are category stress (the stress tier in test_categories.yaml, for large-memory
# runners or a weekly run), and a case skips with the amounts when the device or
# the host does not have the memory. A shape the library offers no solution for
# skips (allow_no_solution): declining a shape is a correct answer.
###############################################################################

# Element index through A's leading dimension: with K = 32 the last element of A
# sits at (K - 1) * lda + M - 1, just below or just past 2^31 and 2^32.
- name: matmul_fast_check_threshold_lda
  category: stress
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 32, lda: 69273664, ldb: 32, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 69273667, ldb: 32, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 138547330, ldb: 32, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 138547333, ldb: 32, ldc: 64, ldd: 64 }
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# The same through B's leading dimension (B transposed, so K runs along ldb).
- name: matmul_fast_check_threshold_ldb
  category: stress
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 69273664, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 69273667, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 138547330, ldc: 64, ldd: 64 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 138547333, ldc: 64, ldd: 64 }
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# And through C's and D's leading dimension: the last element of D sits at
# (N - 1) * ldd + M - 1.
- name: matmul_fast_check_threshold_ldd
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 64, ldc: 34087041, ldd: 34087041 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 64, ldc: 34087043, ldd: 34087043 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 64, ldc: 68174083, ldd: 68174083 }
    - { M: 64, N: 64, K: 32, lda: 64, ldb: 64, ldc: 68174085, ldd: 68174085 }
  transA: [ N, T ]
  transB: [ N, T ]
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# Element index through batch strides: batch 1 of A, then of B, ends just below
# 2^31 or 2^32, or starts just past 2^31 (stride x batch index).
- name: matmul_fast_check_threshold_batch_stride
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 2147479552, stride_b: 4096, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 2147483650, stride_b: 4096, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4294963200, stride_b: 4096, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4096, stride_b: 2147479552, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4096, stride_b: 2147483650, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4096, stride_b: 4294963200, stride_c: 4096, stride_d: 4096 }
  batch_count: 2
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  allow_no_solution: 1
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# ROCM-32140: batch strides of 2^32 elements or more are packed into 32-bit
# kernel arguments, so batch 1 reads or writes the wrong place and the GEMM
# returns success with a wrong D. Each operand's stride in turn starts batch 1
# just past 2^32. Quarantined in known_bugs.yaml.
- name: matmul_fast_check_threshold_batch_stride_2_32_ROCM32140
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4294967298, stride_b: 4096, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4096, stride_b: 4294967298, stride_c: 4096, stride_d: 4096 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64, stride_a: 4096, stride_b: 4096, stride_c: 4294967298, stride_d: 4294967298 }
  batch_count: 2
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  allow_no_solution: 1
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# Byte size of D around 2 GiB and 4 GiB for 4-, 2- and 1-byte outputs, with
# N = 256 and M not a multiple of 256 (the ROCM-31016 trigger), so the last
# MacroTile1 = 256 tile ends in partial rows.
- name: matmul_fast_check_threshold_d_bytes_f32
  category: stress
  function:
    matmul: *single_precision
  matrix_size:
    - { M: 2097151, N: 256, K: 48 }
    - { M: 2097153, N: 256, K: 48 }
    - { M: 4194303, N: 256, K: 48 }
    - { M: 4194305, N: 256, K: 48 }
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

- name: matmul_fast_check_threshold_d_bytes_bf16
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 4194303, N: 256, K: 48 }
    - { M: 4194305, N: 256, K: 48 }
    - { M: 8388607, N: 256, K: 48 }
    - { M: 8388609, N: 256, K: 48 }
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

- name: matmul_fast_check_threshold_d_bytes_int8
  category: stress
  function:
    matmul: *i8_precision_dst_i8
  matrix_size:
    - { M: 8388607, N: 256, K: 48 }
    - { M: 8388609, N: 256, K: 48 }
    - { M: 16777215, N: 256, K: 48 }
    - { M: 16777217, N: 256, K: 48 }
  transA: T
  transB: N
  alpha: 1.0
  beta: 0.0
  integer_exact_pattern: sparse_k
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# The 2 GiB bf16 bracket with every supported solution, since a buffer-limit
# defect is specific to a few kernels (ROCM-31016 failed 170 of 1,093).
- name: matmul_fast_check_threshold_d_bytes_all_solutions
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 4194303, N: 256, K: 48 }
    - { M: 4194305, N: 256, K: 48 }
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  algo_method: [1]
  requested_solution_num: -1
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# ROCM-31258: hand-written custom kernels on gfx950 bound D's stores at 2 GiB.
# The checked store extent ldd * min(MacroTile1, N) * 4 is exactly 2 GiB at
# M = 2097152 and past it at 2097153 and 3000000. Every supported solution,
# custom kernels included.
- name: matmul_fast_check_threshold_custom_kernel_ROCM31258
  category: stress
  function:
    matmul: *xf32_precision
  matrix_size:
    - { M: 2097152, N: 256, K: 32 }
    - { M: 2097153, N: 256, K: 32 }
    - { M: 3000000, N: 256, K: 32 }
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  algo_method: [1]
  requested_solution_num: -1
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1
  gpu_arch: '950'

# ROCM-32050: an illegal memory access on gfx1250 in f32 NN 32768 x 32768 x 4096,
# where C and D are exactly 4 GiB. One column fewer, exactly 4 GiB, and one more.
- name: matmul_fast_check_threshold_cd_4gib_ROCM32050
  category: stress
  function:
    matmul: *single_precision
  matrix_size:
    - { M: 32768, N: 32767, K: 4096 }
    - { M: 32768, N: 32768, K: 4096 }
    - { M: 32768, N: 32769, K: 4096 }
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 16
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# Launch size (ROCM-31290): 2^24 tiles of 16 x 16 is 2^32 work items at 256
# threads per tile. 65536 x 65536 is exactly 2^24 such tiles, and one more
# column of tiles goes past it. The Stream-K variant needs
# TENSILE_SOLUTION_SELECTION_METHOD=2 (see matmul_fast_check_streamk_repeat).
- name: matmul_fast_check_threshold_tiles
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 65536, N: 65536, K: 16 }
    - { M: 65536, N: 65552, K: 16 }
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  requested_solution_num: 32
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

- name: matmul_fast_check_threshold_tiles_streamk
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 65536, N: 65536, K: 16 }
    - { M: 65536, N: 65552, K: 16 }
  transA: N
  transB: N
  alpha: 2.0
  beta: 0.0
  algo_method: [1]
  requested_solution_num: -1
  requires_streamk: 1
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

# Grid limits per dimension: the batch count is a grid dimension, and 65535 is a
# common per-dimension limit. Small GEMMs at 65535 and 65537 batches.
- name: matmul_fast_check_threshold_batch_count
  category: stress
  function:
    matmul: *hpa_bf16_precision
  matrix_size:
    - { M: 16, N: 16, K: 16 }
  batch_count: [ 65535, 65537 ]
  transA: N
  transB: N
  alpha: 2.0
  beta: -2.0
  requested_solution_num: 2
  initialization: integer_exact
  allow_no_solution: 1
  unit_check: 0
  fast_check: 1

###############################################################################
# fast_check edge, bookkeeping and per-kernel configurations (AIHPBLAS-5020).
#
# Classes E, F and G on AIHPBLAS-4988 need specific configurations rather than
# big sizes: K shorter than the prefetch depth (ROCM-31105), Stream-K partials
# spread across workspace batches (GitHub PR 11962), partial tiles, mixed fp8
# formats (ROCM-31905), a particular output type selecting a different kernel
# (ROCM-32072), and shapes between a known-good and a known-bad size. Every
# solution or the heuristic's first 16 run, each launched and checked several
# times, because these defects live in particular kernels and some are
# intermittent.
###############################################################################

# K shorter than, equal to and just past common prefetch depths (PGR 1 or 2 with
# DepthU 16 to 64), so the loop runs fewer iterations than the prefetch issues.
# ROCM-31105 read past the end of K with PrefetchGL2 on gfx1250; every solution
# runs, so kernels with PrefetchGL2 on and off are both covered where they exist.
# Runtime on gfx90a: 24 cases, about 80 s.
- name: matmul_fast_check_short_k
  category: nightly
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 517, N: 263, K: 1 }
    - { M: 517, N: 263, K: 15 }
    - { M: 517, N: 263, K: 16 }
    - { M: 517, N: 263, K: 33 }
    - { M: 517, N: 263, K: 64 }
    - { M: 517, N: 263, K: 129 }
  transA: [ N, T ]
  transB: N
  alpha: 2.0
  beta: -2.0
  algo_method: [1]
  requested_solution_num: -1
  fast_check_repeat: 2
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# Partial tiles in every dimension, including driftcheck's ragged shape from
# ROCM-31901, with two strided batches.
# Runtime on gfx90a: 12 cases, about 8 s.
- name: matmul_fast_check_ragged
  category: nightly
  function:
    matmul:
      - *single_precision
      - *hpa_half_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 8191, N: 8193, K: 4097 }
    - { M: 1, N: 4099, K: 2049 }
    - { M: 4099, N: 1, K: 2049 }
    - { M: 257, N: 255, K: 3 }
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  batch_count: 2
  integer_exact_pattern: sparse_k
  requested_solution_num: 16
  fast_check_repeat: 3
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# Every output type for one input type: in ROCM-32072 a bf16 output selected a
# Stream-K + TDM kernel that failed where an f32 output at the same shape did
# not, so each output type is its own configuration.
# Runtime on gfx90a: 8 cases, about 3 s.
- name: matmul_fast_check_output_types
  category: nightly
  function:
    matmul:
      - *hpa_bf16_precision
      - *hpa_half_bf16_fp32dst_precision
      - *hpa_half_precision
      - *hpa_half_fp32dst_precision
  matrix_size:
    - { M: 8192, N: 16384, K: 512 }
    - { M: 4097, N: 3071, K: 1025 }
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  integer_exact_pattern: sparse_k
  requested_solution_num: 16
  fast_check_repeat: 3
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# Stream-K partials stored across several workspace batches, with LocalSplitU
# above 1 where the kernel uses it (GitHub PR 11962 fixed reused batch-0
# accumulators). Every Stream-K solution, several batches, ragged shapes. Needs
# TENSILE_SOLUTION_SELECTION_METHOD=2 except on gfx950.
# Runtime on gfx90a with the variable set: 4 cases, about 40 s.
- name: matmul_fast_check_streamk_batches
  category: nightly
  function:
    matmul:
      - *single_precision
      - *hpa_bf16_precision
  matrix_size:
    - { M: 1031, N: 517, K: 2049 }
    - { M: 4099, N: 2053, K: 1025 }
  batch_count: 3
  transA: N
  transB: T
  alpha: 2.0
  beta: -2.0
  integer_exact_pattern: sparse_k
  algo_method: [1]
  requested_solution_num: -1
  fast_check_repeat: 3
  requires_streamk: 1
  initialization: integer_exact
  unit_check: 0
  fast_check: 1

# Mixed fp8 formats (E4M3 x E5M2 and the reverse) are their own kernels: in
# ROCM-31905 only they failed, with a single LDS buffer and no local-read
# prefetch, at 2560 x 16384 x 2560 and 5120 x 12288 x 5120, and passed at 10240
# cubed. The sweep fills in between the known-bad and known-good sizes.
- name: matmul_fast_check_mixed_fp8_fnuz
  category: nightly
  function:
    matmul:
      - *f8bf8_fnuz_precision_dst_fp32
      - *bf8f8_fnuz_precision_dst_fp32
      - *f8bf8_fnuz_precision_dst_bf16
      - *bf8f8_fnuz_precision_dst_bf16
  matrix_size:
    - { M: 2560, N: 16384, K: 2560 }
    - { M: 5120, N: 12288, K: 5120 }
    - { M: 6144, N: 12288, K: 6144 }
    - { M: 7680, N: 10240, K: 7680 }
    - { M: 10240, N: 10240, K: 10240 }
  transA: T
  transB: N
  alpha: 2.0
  beta: -2.0
  integer_exact_pattern: sparse_k
  requested_solution_num: 16
  fast_check_repeat: 3
  initialization: integer_exact
  unit_check: 0
  fast_check: 1
  gpu_arch: '942'

- name: matmul_fast_check_mixed_fp8
  category: nightly
  function:
    matmul:
      - *f8bf8_precision_dst_fp32
      - *bf8f8_precision_dst_fp32
      - *f8bf8_precision_dst_bf16
      - *bf8f8_precision_dst_bf16
  matrix_size:
    - { M: 2560, N: 16384, K: 2560 }
    - { M: 5120, N: 12288, K: 5120 }
    - { M: 6144, N: 12288, K: 6144 }
    - { M: 7680, N: 10240, K: 7680 }
    - { M: 10240, N: 10240, K: 10240 }
  transA: T
  transB: N
  alpha: 2.0
  beta: -2.0
  integer_exact_pattern: sparse_k
  requested_solution_num: 16
  fast_check_repeat: 3
  initialization: integer_exact
  unit_check: 0
  fast_check: 1
  gpu_arch: '950'

