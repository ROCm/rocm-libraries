# Pre-commit config scoped to hipblaslt / TensileLite. Install explicitly:
#   pre-commit install --config projects/hipblaslt/.pre-commit-config.yaml
# See projects/hipblaslt/tensilelite/README.md for setup.

repos:
  - repo: local
    hooks:
      - id: tensilelite-affected-tests
        name: TensileLite affected unit + characterization tests
        entry: projects/hipblaslt/tensilelite/scripts/precommit_affected_tests.py
        language: script
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [pre-commit]

      # Blocks any new unsafe yaml.load (arbitrary-object deserialization) from
      # landing. See ROCM-26843 / SEC-00404. Bandit clears a load whose loader
      # argument is named SafeLoader or CSafeLoader, so prefer that spelling over a
      # suppression: a suppressed line stays green even if the loader is later
      # dropped. Where the loader genuinely cannot be named that (StrictTypeLoader,
      # DEFAULT_YAML_LOADER) use a bare "# nosec B506", and keep it bare, since
      # bandit reads any trailing prose as more test ids and warns once per word.
      - id: bandit-b506
        name: bandit (unsafe yaml.load / B506)
        entry: bandit
        language: python
        additional_dependencies: [bandit]
        args: ["-t", "B506"]
        types: [python]
        stages: [pre-commit]

  # Hooks below mirror the aster pre-commit config and only apply to the new
  # tensilelite tree, so existing TensileLite code is left untouched.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
        files: &newTensileliteTree ^projects/hipblaslt/tensilelite/(include|src|tests)/tensilelite/
      - id: end-of-file-fixer
        files: *newTensileliteTree
      - id: trailing-whitespace
        files: *newTensileliteTree
  - repo: https://github.com/google/yamlfmt
    rev: v0.10.0
    hooks:
      - id: yamlfmt
        files: *newTensileliteTree
  # Make docstrings PEP 257 compliant.
  - repo: https://github.com/PyCQA/docformatter
    rev: eb1df347edd128b30cd3368dddc3aa65edcfac38
    hooks:
      - id: docformatter
        # Disable wrap-summaries to avoid rewording many docstrings.
        args: ["--in-place", "--wrap-summaries=0"]
        files: *newTensileliteTree
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.6
    hooks:
      - id: clang-format
        files: *newTensileliteTree
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: *newTensileliteTree
      - id: ruff-format
        files: *newTensileliteTree
