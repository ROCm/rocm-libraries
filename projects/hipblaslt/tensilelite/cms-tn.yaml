TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  #MinimumRequiredVersion: 4.14.0
  SleepPercent: 50
  NumElementsToValidate: -1
  NumWarmups: 500
  num-benchmarks: 500
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  NewClient: 2
  CSVExportWinner: 1
  CSVMergeSameProblemID: 1
  Device: 7
  RotatingBufferSize: 512
  DeviceLDS: 163840
  MaxLDS: 163840
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # BBS TN - standard
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True

      UseBias: 1
      BiasDataTypeList: [s, b]
      UseScaleAlphaVec: 1
      Activation: true
      ActivationType: hipblaslt_all
      ActivationFuncCall: true
      #ActivationHPA: True
    - # BenchmarkProblemSizeGroup - Standard - All problem
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
           #- [16, 16,32, 1,  1, 6, 8,  2,2 ]
          - [16, 16,32, 1,  1, 4, 7,  2,2 ]
          #- [32, 32,16, 1,  1, 3, 2,  2,2 ]

          # - [16, 16,32, 1,  1, 2, 2,  2,2 ]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - ExpandPointerSwap: [0]
        - TransposeLDS: [1] #0,1
        - LDSTrInst: [0]
        - LocalReadVectorWidth: [8]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - ActivationFuncCall: [0]
        - DirectToLds: [1]
        - ClusterLocalRead: [1]
        #- LdsBlockSizePerPadA: [512]
        #- LdsBlockSizePerPadB: [1024]
        - StreamK: [3]
        - LdsPadA: [16] #[-1]
        - LdsPadB: [16] #[-1]
        - StaggerU: [0]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [2]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - SourceSwap: [1]
        - UseSgprForGRO: [0]
        - UseCustomMainLoopSchedule: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
         # - Exact: [3072, 4096, 1, 8192]
           - Exact: [2048, 3584, 1, 8192]
         # - Exact: [192, 256, 1, 64]
         # - Exact: [320, 3072, 1, 888]
        - BiasTypeArgs: ['b']

LibraryLogic:
      ScheduleName: "gfx950"
      DeviceNames: ["Device 0049"]
      ArchitectureName: "gfx950"