[tox]
# Provision the lock runner and uv without requiring a separate uv installation.
requires = tox-uv==1.36.0
envlist = py3,lint
labels =
    static = format, isort, security
    coverage = coverage

[testenv]
changedir = {toxinidir}
# Synchronize each test environment from pyproject.toml and uv.lock.
runner = uv-venv-lock-runner
# dev includes test and build, keeping the native rebuild tools installed.
dependency_groups = dev
# Add tox-specific overrides to the project's editable rocisa configuration.
# scikit-build gives skbuild.* keys priority over the unprefixed project keys;
# repeating the same key through uv would append values instead of replacing it.
uv_sync_flags =
    # Keep CMake state separate for each environment's interpreter and settings.
    # If this tree is deleted, use tox --recreate for the affected environment;
    # uv can otherwise reuse a cached editable loader pointing at the missing tree.
    --config-settings-package
    rocisa:skbuild.build-dir={envdir}/rocisa-build
setenv =
    ROCM_PATH = {env:ROCM_PATH:/opt/rocm}
    # The client's build dir has to come first. An installed ROCm also ships
    # libtensilelite-host.so.1, and that copy is msgpack-only, so it cannot read
    # the YAML libraries Tensile writes by default. Let it win and every
    # hardware config fails at once with "Failed to load solution library".
    LD_LIBRARY_PATH = {toxinidir}/build_tmp/tensilelite:{env:ROCM_PATH:/opt/rocm}/lib:{env:LD_LIBRARY_PATH:}
    TENSILE_CLIENT_STATIC = {env:TENSILE_CLIENT_STATIC:}
    TENSILELITE_CLIENT_ARGS = {env:TENSILELITE_CLIENT_ARGS:}
    TENSILE_NUM_PYTEST_WORKERS = {env:TENSILE_NUM_PYTEST_WORKERS:4}
passenv =
    ; Picks which stepping the runtime reports on a revision-0 gfx1250 part, and
    ; on ROCm 10.2 unset means the base one. That name drives both test selection
    ; (through skip-<arch>) and the client build, so dropping it here does not
    ; narrow the run -- it runs the base half of the corpus on strict silicon.
    HSA_DISABLE_GFX12_STRICT
    ; FFM variables
    HSA_MODEL_TOPOLOGY
    HSA_MODEL_TOML
    HSA_MODEL_LIB
    HSA_MODEL_NUM_THREADS
    HSA_MODEL_ARGS
    HSA_MODEL_MEMFILE
    ; These might need to be set when using FFM
    HSA_XNACK
    HSA_ENABLE_SDMA
    HSA_ENABLE_INTERRUPT
    HSA_XNACK
    LD_LIBRARY_PATH
    ; GPU visibility restrictions must reach the pytest-xdist worker
    ; processes so conftest.py's per-worker GPU assignment can account
    ; for them — otherwise it wraps around into device indices that
    ; don't exist under the restriction.
    ROCR_VISIBLE_DEVICES
    HIP_VISIBLE_DEVICES
allowlist_externals =
    mkdir
    sh
    cmake

[testenv:py3]
basepython = python3
uv_sync_flags =
    {[testenv]uv_sync_flags}
    # The first command runs rocisa/test, including test_pass_plugin.py.
    # Preserve TestHelloWorldPassIntegrationStatic's skips for
    # test_hello_world_pass_executes and test_hello_world_pass_default_greeting.
    # TODO: Before enabling these two tests, check all affected CI configurations
    # for the gfx1250 StinkyTofu backend and assembler, and measure build/test cost.
    # This flag does not enable the dynamic-plugin tests.
    --config-settings-package
    rocisa:skbuild.cmake.define.ROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN=OFF
commands =
    # Refresh native code before the rocisa tests import it.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/rocisa_tests.xml --junit-prefix=rocisa --color=yes -n {env:TENSILE_NUM_PYTEST_WORKERS:4} {toxinidir}/rocisa/test
    # The rebuild above refreshes uv's editable. Skip Invoke's pip refresh,
    # which the previous noneditable installation also bypassed.
    sh -c "ARCH=$(invoke get-gpu-arch); \
          export TENSILELITE_CLIENT_ARGS='{env:TENSILELITE_CLIENT_ARGS:} --gpu-targets '$ARCH; \
          invoke build-client --no-rebuild-rocisa --build-dir {toxinidir}/build_tmp --rocm-path \"$ROCM_PATH\" $TENSILELITE_CLIENT_ARGS || exit $?; \
          pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/python_tests.xml --junit-prefix={envname} --color=yes -n $TENSILE_NUM_PYTEST_WORKERS --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client --global-parameters CheckASMCodeSize=True {toxinidir}/tensilelite/Tests {posargs}; \
          rc=$?; test $rc -eq 5 && exit 0; exit $rc"

[testenv:unit]
description = "Runs Python unit tests quickly, skipping the client build. Assumes a build has run before."
basepython = python3
uv_sync_flags =
    {[testenv]uv_sync_flags}
    # With no test path in posargs, pytest.ini also selects rocisa/test.
    # Preserve the skips in test_pass_plugin.py::TestHelloWorldPassIntegrationStatic:
    # test_hello_world_pass_executes and test_hello_world_pass_default_greeting.
    # TODO: Before enabling these two tests, check all affected CI configurations
    # for the gfx1250 StinkyTofu backend and assembler, and measure build/test cost.
    # This flag does not enable the dynamic-plugin tests.
    --config-settings-package
    rocisa:skbuild.cmake.define.ROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN=OFF
commands =
    # Refresh native code before pytest imports rocisa in its fixtures/tests.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    pytest -v --basetemp={envtmpdir} {posargs}

[testenv:library-uniqueness]
description = "Checks SolutionUID uniqueness across shipped logic YAML files."
basepython = python3
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# This source-loaded test runs in CI without a ROCm SDK or installed TensileLite.
only_groups = test-tools
# --noconftest bypasses unrelated test fixtures that import rocisa.
commands =
    pytest -v --noconftest \
        {toxinidir}/tensilelite/Tests/unit/test_solution_uid_uniqueness.py

[testenv:comm]
description = "Runs the cross-device (comm) YAML tests. Builds the client with the SDMA transport enabled and runs pytest without xdist; the tests skip themselves unless two devices are visible."
basepython = python3
commands =
    # Refresh native code for the comm tests; Invoke leaves this install in place.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    # The rebuild above refreshes uv's editable. Skip Invoke's pip refresh,
    # which the previous noneditable installation also bypassed.
    sh -c "ARCH=$(invoke get-gpu-arch); \
          invoke build-client --no-rebuild-rocisa --build-dir {toxinidir}/build_tmp --enable-sdma --rocm-path \"$ROCM_PATH\" --gpu-targets $ARCH || exit $?; \
          pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/comm_tests.xml --junit-prefix={envname} --color=yes -m comm --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client {toxinidir}/tensilelite/Tests {posargs}; \
          rc=$?; test $rc -eq 5 && exit 0; exit $rc"


[testenv:mutation-unit]
description = "Optional, offline mutation analysis for finding characterization-test gaps. Not a CI gate; see projects/hipblaslt/skills/tensilelite-mutation-rerun/SKILL.md."
basepython = python3
commands =
    # Refresh native code before the mutation runner executes tests using rocisa.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    mutmut run --max-children {env:MUTMUT_MAX_CHILDREN:32} {posargs}
    mutmut results


[testenv:mutation-safety]
description = "Runs Docker-free regression tests for the mutation safety wrappers."
basepython = python3
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# The wrapper self-tests need pytest, without TensileLite, rocisa, or a ROCm SDK.
only_groups = test-tools
allowlist_externals = bash
commands =
    bash {toxinidir}/../skills/tensilelite-mutation-rerun/scripts/tests/run-selftests.sh


[testenv:rocisa]
description = "Runs only rocisa tests"
basepython = python3
uv_sync_flags =
    {[testenv]uv_sync_flags}
    # This suite explicitly runs rocisa/test, including test_pass_plugin.py.
    # Preserve TestHelloWorldPassIntegrationStatic's skips for
    # test_hello_world_pass_executes and test_hello_world_pass_default_greeting.
    # TODO: Before enabling these two tests, check all affected CI configurations
    # for the gfx1250 StinkyTofu backend and assembler, and measure build/test cost.
    # This flag does not enable the dynamic-plugin tests.
    --config-settings-package
    rocisa:skbuild.cmake.define.ROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN=OFF
commands =
    # Refresh the extension before running its tests; find_spec avoids a stale import.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/rocisa_tests.xml --junit-prefix=rocisa --color=yes -n 4 {toxinidir}/rocisa/test {posargs}

[testenv:lint]
basepython = python3
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# flake8 scans source without installing TensileLite or requiring a ROCm SDK.
only_groups = lint
commands = flake8 {toxinidir}/tensilelite

[testenv:security]
description = "Scan for unsafe yaml.load (B506) so no deserialization-vulnerable load lands (see ROCM-26843/SEC-00404)"
basepython = python3
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# Bandit scans source without installing TensileLite or requiring a ROCm SDK.
only_groups = lint
# Scans all of hipblaslt: YAML-loading helpers live outside tensilelite/Tensile too.
commands =
    bandit -r -t B506 --exclude "*/build/*,*/dist/*,*/_skbuild/*" {toxinidir}/..

[testenv:format]
description = "Formats code so developers don't have to"
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# Black formats source without installing TensileLite or requiring a ROCm SDK.
only_groups = lint
commands =
    black \
      --line-length=100 \
      {toxinidir}/tensilelite/Common \
      {toxinidir}/tensilelite/TensileCreateLibrary \
      {toxinidir}/tensilelite/Utilities/Decorators \
      {posargs}

[testenv:isort]
description = "Sorts import statements for less merge conflicts"
# Replace the inherited dev selection; only_groups cannot be combined with it.
dependency_groups =
# isort formats imports without installing TensileLite or requiring a ROCm SDK.
only_groups = lint
commands =
    isort \
      --profile=black \
      {toxinidir}/tensilelite/Common \
      {toxinidir}/tensilelite/TensileCreateLibrary \
      {toxinidir}/tensilelite/Utilities/Decorators \
      {posargs}

[testenv:pre_commit]
basepython = python3
commands =
    flake8 {toxinidir}/tensilelite
    # Lint needs no rebuild; refresh rocisa only before the unit tests.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    py.test -q --basetemp={envtmpdir} --color=yes {toxinidir}/tensilelite -m unit {posargs}

[testenv:coverage]
description = "Generate comprehensive code coverage for unit and common tests"
basepython = python3
setenv =
    {[testenv]setenv}
    # PYTHONPATH is required for coverage.py multiprocessing mode to track source in pytest-xdist workers
    PYTHONPATH = {toxinidir}
    COVERAGE_FILE = {toxinidir}/.coverage
commands =
    # Refresh native code for the tests; Invoke leaves this install in place.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    # The rebuild above refreshes uv's editable. Skip Invoke's pip refresh,
    # which the previous noneditable installation also bypassed.
    sh -c "ARCH=$(invoke get-gpu-arch); \
          export TENSILELITE_CLIENT_ARGS='{env:TENSILELITE_CLIENT_ARGS:} --gpu-targets '$ARCH; \
          invoke build-client --no-rebuild-rocisa --build-dir {toxinidir}/build_tmp --rocm-path \"$ROCM_PATH\" $TENSILELITE_CLIENT_ARGS"

    # Run unit tests with coverage (no report yet)
    pytest --cov=tensilelite --cov=rocisa \
           --cov-config={toxinidir}/pyproject.toml \
           --cov-report= \
           -v --basetemp={envtmpdir} \
           --junit-xml={toxinidir}/unit_tests.xml \
           --junit-prefix=unit \
           --color=yes \
           -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
           -m unit \
           {toxinidir}/tensilelite/Tests/unit

    # Run common tests with coverage (append to existing coverage data).
    sh -c "pytest --cov=tensilelite --cov=rocisa \
           --cov-config={toxinidir}/pyproject.toml \
           --cov-append \
           --cov-report=html:{toxinidir}/htmlcov \
           --cov-report=xml:{toxinidir}/coverage.xml \
           --cov-report=json:{toxinidir}/coverage.json \
           --cov-report=term-missing:skip-covered \
           -v --basetemp={envtmpdir} \
           --junit-xml={toxinidir}/common_tests.xml \
           --junit-prefix=common \
           --color=yes \
           -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
           -m common \
           --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client \
           --global-parameters CheckASMCodeSize=True \
           {toxinidir}/tensilelite/Tests/common {posargs}"

    # Generate detailed coverage report summary
    coverage report --show-missing --skip-covered

    # Print report locations
    python -c "print('\n' + '='*70); \
               print('CODE COVERAGE REPORTS GENERATED:'); \
               print('='*70); \
               print('HTML Report : htmlcov/index.html'); \
               print('XML Report  : coverage.xml'); \
               print('JSON Report : coverage.json'); \
               print('JUnit XML   : unit_tests.xml, common_tests.xml'); \
               print('='*70 + '\n')"

[testenv:coverage-cpp]
description = "Generate C++ code coverage for tensilelite-host library"
basepython = python3
# Skip installing rocisa: invoke build-coverage builds the instrumented copy
# that these tests load through PYTHONPATH below.
uv_sync_flags = --no-install-package, rocisa
setenv =
    {[testenv]setenv}
    LLVM_PROFILE_FILE = {toxinidir}/build_cov/profraw/cpp_test_%p_%m.profraw
    LD_LIBRARY_PATH = {env:LD_LIBRARY_PATH:}:{env:ROCM_PATH:/opt/rocm}/lib/llvm/lib
passenv =
    {[testenv]passenv}
allowlist_externals =
    {[testenv]allowlist_externals}
    ctest
    lcov
    genhtml
commands =

    # Build with coverage instrumentation
    sh -c "ARCH=$(invoke get-gpu-arch); \
          invoke build-coverage --build-dir {toxinidir}/build_cov --gpu-targets $ARCH"

    # Create directories
    sh -c "mkdir -p {toxinidir}/build_cov/profraw {toxinidir}/coverage_cpp"

    # Run C++ gtest tests (tensilelite-tests) for tensilelite-host coverage
    # Excluded Tests: Pre-existing failures on gfx950
    # - RangeLibraryTest MI350 gfx950: Assertion failure
    # - FP4ZeroFrequency/MXDataGenFP4Test.ZeroFrequencyWithinBounds/(2048, 514, 32, false): SEGFAULT
    # TODO: <AIHPBLAS-3506> Investigate and fix these test failures
    sh -c "export LLVM_PROFILE_FILE='{toxinidir}/build_cov/profraw/cpp_test_%p_%m.profraw'; \
          cd {toxinidir}/build_cov/tensilelite/tests && \
          ctest --output-on-failure --timeout 120 -E '(RangeLibraryTest.*MI350.*gfx950|FP4ZeroFrequency.*2048.*514.*32.*false)'; \
          echo $? > {toxinidir}/.cpp_test_exit_code"

    # Run rocisa Python tests to get coverage for rocisa C++ code
    # Excluded Test: crashes with SIGABRT in coverage-instrumented rocisa builds.
    # Assertion failure in rocisa/rocisa/src/pass/macro_inline.cpp:315 expandMacroBody().
    # TODO::Fix and remove the --deselect flag below.
    sh -c "export LLVM_PROFILE_FILE='{toxinidir}/build_cov/profraw/rocisa_%p_%m.profraw'; \
          cd {toxinidir} && \
          PYTHONPATH='{toxinidir}/build_cov/tensilelite/rocisa' python -m pytest rocisa/test -v --tb=short \
          --deselect=rocisa/test/test_macro_inline.py::test_prnd_generator \
          2>&1; \
          echo $? > {toxinidir}/.rocisa_test_exit_code"

    # Generate C++ coverage report using LLVM tools and lcov
    # Note: Excludes .hpp headers only (coverage-cpp focuses on .cpp files).
    # Gap: header-implemented code in .hpp files (templates, inline functions) won't appear in coverage.
    sh -c "PROFDATA=$(which llvm-profdata); \
          LLVM_COV=$(which llvm-cov); \
          OUT={toxinidir}/coverage_cpp; \
          \
          echo 'Merging profraw files...'; \
          $PROFDATA merge -sparse -o $OUT/cpp.profdata {toxinidir}/build_cov/profraw/*.profraw; \
          \
          echo 'Exporting to LCOV format...'; \
          ROCISA_SO=$(find {toxinidir}/build_cov -name '_rocisa*.so' | head -1); \
          $LLVM_COV export -format=lcov -instr-profile=$OUT/cpp.profdata \
              -object {toxinidir}/build_cov/tensilelite/tests/tensilelite-tests \
              -object {toxinidir}/build_cov/tensilelite/client/tensilelite-client \
              -object {toxinidir}/build_cov/tensilelite/client/cpu-gemm-driver \
              -object $ROCISA_SO \
              --ignore-filename-regex='.*/(build|_deps|site-packages)/.*' \
              --ignore-filename-regex='.*/origami/.*' \
              --ignore-filename-regex='.*/stinkytofu/.*' \
              --ignore-filename-regex='.*/tests/.*' \
              --ignore-filename-regex='.*_test\\.cpp$' \
              --ignore-filename-regex='.*\\.hpp$' \
              --ignore-filename-regex='.*/library/include/.*' \
              > $OUT/combined.lcov; \
          \
          echo 'Generating HTML report...'; \
          genhtml $OUT/combined.lcov -o $OUT/html --title 'TensileLite C++ Coverage' \
              --legend --ignore-errors source -p {toxinidir} 2>/dev/null || true; \
          \
          echo 'Generating Cobertura XML...'; \
          lcov_cobertura $OUT/combined.lcov -o $OUT/coverage.xml 2>/dev/null || true"

    # Print C++ coverage report
    sh -c "echo ''; \
           echo '======================================================================'; \
           echo 'C++ COVERAGE REPORT'; \
           echo '======================================================================'; \
           pycobertura show {toxinidir}/coverage_cpp/coverage.xml 2>/dev/null || \
               echo 'Coverage report not available'; \
           echo ''; \
           echo '======================================================================'; \
           echo 'REPORTS:'; \
           echo '  HTML Report : coverage_cpp/html/index.html'; \
           echo '  LCOV Data   : coverage_cpp/combined.lcov'; \
           echo '  Cobertura   : coverage_cpp/coverage.xml'; \
           echo '======================================================================'"

    # Print test results and check exit codes
    python -c "import sys; \
               import os; \
               cpp_rc = int(open('.cpp_test_exit_code').read().strip()); \
               rocisa_rc = int(open('.rocisa_test_exit_code').read().strip()); \
               print('\\nTest Results:'); \
               print('  C++ tests: exit_code={} - {}'.format(cpp_rc, 'PASSED' if cpp_rc == 0 else 'FAILED')); \
               print('  Rocisa tests: exit_code={} - {}'.format(rocisa_rc, 'PASSED' if rocisa_rc == 0 else 'FAILED')); \
               failed = cpp_rc != 0 or rocisa_rc != 0; \
               print('\\nOverall: {}'.format('FAILED' if failed else 'PASSED')); \
               sys.exit(1 if failed else 0)"

[testenv:coverage-unit]
description = "Generate code coverage for unit tests only (fast)"
basepython = python3
# Continue producing reports after failures, including a failed native rebuild;
# tox still returns failure. The previous installer had the same treatment.
ignore_errors = true
setenv =
    {[testenv]setenv}
    # PYTHONPATH is required for coverage.py multiprocessing mode to track source in pytest-xdist workers
    PYTHONPATH = {toxinidir}
    COVERAGE_FILE = {toxinidir}/.coverage
allowlist_externals =
    {[testenv]allowlist_externals}
    mv
commands =
    # Refresh native code before the characterization and unit tests import rocisa.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    # This lane produces ONE combined coverage number, and also splits it two
    # ways for reporting. It runs two path-based test selections:
    #   1. the characterization suite (tensilelite/Tests/unit/characterization)
    #   2. the pure unit tests: the rest of tensilelite/Tests/unit AND the
    #      pure-logic extras suite (tensilelite/Tests/extras), with the
    #      characterization subtree excluded via --ignore (characterization
    #      lives under unit/, so without --ignore this half would re-run it).
    #      The extras suite is auto-marked `extras` ("pure-logic tests that
    #      need no rocisa/toolchain"), so the pure-unit half selects
    #      `-m "unit or extras"` to fold it in; it is CPU-only and fast and its
    #      coverage (e.g. ExperimentalLibrary.py) must count toward the floors.
    # Each selection runs ONCE into its own coverage data file (.cov_char /
    # .cov_unit).
    #
    # `coverage combine` then unions the two into the authoritative dataset. A
    # line counts as covered if EITHER suite reaches it, so the whole-project
    # floor (AIHPBLAS-3877) and the per-file floors (AIHPBLAS-3878) are both
    # measured on char-OR-unit coverage. That union is what the floors protect.
    #
    # The two per-suite reports (char.json / unit.json) fall out of the same two
    # runs, so the characterization-vs-unit card can attribute each line to
    # characterization-only, unit-only, or both without a second duplicate test
    # pass. This is exactly why the pure-unit half must --ignore the
    # characterization subtree: if it re-ran the characterization tests, every
    # characterization line would also appear under "unit", the card's
    # characterization-only count (the migration debt it exists to show) would
    # collapse to ~0, and the split would be meaningless. Excluding it does NOT
    # change the combined dataset, because the combine re-adds characterization
    # from .cov_char.
    #
    # Each half passes --cov-fail-under=0 so neither half's (necessarily lower)
    # coverage trips the floor; the floor is enforced once, on the combined
    # dataset, by `coverage report` in commands_post. {posargs} is appended to
    # both halves so a local `tox -e coverage-unit -- -k <expr>` filters the
    # whole suite consistently, not just one half.
    pytest --cov=tensilelite --cov=rocisa \
           --cov-config={toxinidir}/pyproject.toml \
           --cov-report=json:{toxinidir}/char.json \
           --cov-report= --cov-fail-under=0 \
           -v --basetemp={envtmpdir} \
           --junit-xml={toxinidir}/char_tests.xml \
           --color=yes \
           -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
           -m unit \
           {toxinidir}/tensilelite/Tests/unit/characterization {posargs}
    mv {toxinidir}/.coverage {toxinidir}/.cov_char

    pytest --cov=tensilelite --cov=rocisa \
           --cov-config={toxinidir}/pyproject.toml \
           --cov-report=json:{toxinidir}/unit.json \
           --cov-report= --cov-fail-under=0 \
           -v --basetemp={envtmpdir} \
           --junit-xml={toxinidir}/unit_tests.xml \
           --color=yes \
           -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
           -m "unit or extras" \
           --ignore={toxinidir}/tensilelite/Tests/unit/characterization \
           {toxinidir}/tensilelite/Tests/unit {toxinidir}/tensilelite/Tests/extras {posargs}
    mv {toxinidir}/.coverage {toxinidir}/.cov_unit

    # Union the two halves into the authoritative combined dataset and emit the
    # reports from it. --fail-under=0 keeps report *generation* non-gating (all
    # of html/xml/json otherwise honor fail_under and would abort here before
    # coverage.json is written); the floor is enforced once by `coverage report`
    # in commands_post so the ratchet and summary card always get their inputs.
    coverage combine --rcfile={toxinidir}/pyproject.toml {toxinidir}/.cov_char {toxinidir}/.cov_unit
    coverage html --rcfile={toxinidir}/pyproject.toml --fail-under=0 -d {toxinidir}/htmlcov
    coverage xml --rcfile={toxinidir}/pyproject.toml --fail-under=0 -o {toxinidir}/coverage.xml
    coverage json --rcfile={toxinidir}/pyproject.toml --fail-under=0 -o {toxinidir}/coverage.json

commands_post =
    # Always runs, even if tests fail.
    #
    # This env MEASURES; it does not judge. Enforcement of the two floors lives
    # in [testenv:coverage-gate], which reads the artifacts produced above.
    #
    # The split exists because this env has two callers, owned by different
    # teams. The TensileLite coverage GitHub Actions job owns the floors and runs
    # coverage-gate straight after this env. The Math CI Jenkins job
    # tensilelite-unit-codecov wants only the coverage.xml it uploads to Codecov,
    # and its config lives in a repo this one cannot change, so it must not be
    # failed by a gate it does not own. Keeping the gate in a separate env means
    # a caller opts in by naming it, and cannot trip it by accident.
    #
    # --fail-under=0 keeps this table informational: it is the number Jenkins
    # reads out of its console log, and it must print whatever the value is.
    coverage report --rcfile={toxinidir}/pyproject.toml --show-missing --fail-under=0

    python -c "print('\nHTML Report: htmlcov/index.html')"

[testenv:coverage-gate]
description = "Enforce the TensileLite coverage floors against an existing coverage-unit run"
basepython = python3
# Clear the inherited dev group; uv cannot combine --group with --only-group.
dependency_groups =
# Install only the locked coverage tools, without the project or native builds.
only_groups = coverage
setenv =
    COVERAGE_FILE = {toxinidir}/.coverage
commands =
    # Both gates read the combined (char-OR-unit) dataset that coverage-unit
    # wrote. Ordering matters: tox stops at the first failing command, so a
    # whole-project miss short-circuits before the per-file check.
    #
    # Whole-project floor (AIHPBLAS-3877). fail_under lives in
    # [tool.coverage.report] in pyproject.toml, the single source of truth, so
    # this exits non-zero when the combined total drops below it.
    coverage report --rcfile={toxinidir}/pyproject.toml --show-missing

    # Per-file floors (AIHPBLAS-3878), held in coverage-baseline.json. Floors
    # move up only via a reviewed maintenance PR (coverage_ratchet.py update, the
    # "ratchet"); they are never lowered to go green.
    python {toxinidir}/tensilelite/Tests/unit/characterization/tools/coverage_ratchet.py \
           check \
           --baseline {toxinidir}/tensilelite/Tests/unit/characterization/coverage-baseline.json \
           --current {toxinidir}/coverage.json

[testenv:coverage-common]
description = "Generate code coverage for common tests only (requires prebuilt client)"
basepython = python3
setenv =
    {[testenv]setenv}
    # PYTHONPATH is required for coverage.py multiprocessing mode to track source in pytest-xdist workers
    PYTHONPATH = {toxinidir}
    COVERAGE_FILE = {toxinidir}/.coverage
commands =
    # Refresh native code for the common tests; Invoke leaves this install in place.
    python -c "import importlib.util; importlib.util.find_spec('rocisa').loader.rebuild()"
    # The rebuild above refreshes uv's editable. Skip Invoke's pip refresh,
    # which the previous noneditable installation also bypassed.
    sh -c "ARCH=$(invoke get-gpu-arch); \
          export TENSILELITE_CLIENT_ARGS='{env:TENSILELITE_CLIENT_ARGS:} --gpu-targets '$ARCH; \
          invoke build-client --no-rebuild-rocisa --build-dir {toxinidir}/build_tmp --rocm-path \"$ROCM_PATH\" $TENSILELITE_CLIENT_ARGS"

    sh -c "pytest --cov=tensilelite --cov=rocisa \
           --cov-config={toxinidir}/pyproject.toml \
           --cov-report=html:{toxinidir}/htmlcov \
           --cov-report=xml:{toxinidir}/coverage.xml \
           --cov-report=term-missing \
           -v --basetemp={envtmpdir} \
           --junit-xml={toxinidir}/common_tests.xml \
           --color=yes \
           -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
           -m common \
           --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client \
           --global-parameters CheckASMCodeSize=True \
           {toxinidir}/tensilelite/Tests/common {posargs}"

    coverage report --show-missing

    python -c "print('\nHTML Report: htmlcov/index.html')"

[flake8]
exclude = .git,build*,dist,.cache,*~
max-line-length = 132
# E/W class violations are errors/warnings reported by pycodestyle, respectively
# This mostly just leaves pyflake errors.
ignore = E, W
