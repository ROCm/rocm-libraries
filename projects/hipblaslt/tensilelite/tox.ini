[tox]
envlist = py3,lint
labels =
    static = format, isort
    coverage = coverage

[testenv]
# Some versions of Pytest versions have a bug:
# https://github.com/pytest-dev/pytest/issues/5971 which causes the whole test
# process to crash if a multiprocessing job has an exception. Fixed in 5.3.3.
deps =
    cmake
    nanobind
    setuptools
    -r{toxinidir}/requirements.txt
    pytest>=5.4.1
    pytest-xdist>=1.32.0
    filelock
    invoke
setenv =
    ROCM_PATH = {env:ROCM_PATH:/opt/rocm}
    TENSILE_CLIENT_STATIC = {env:TENSILE_CLIENT_STATIC:}
    TENSILELITE_CLIENT_ARGS = {env:TENSILELITE_CLIENT_ARGS:}
    TENSILE_NUM_PYTEST_WORKERS = {env:TENSILE_NUM_PYTEST_WORKERS:4}
passenv =
    ; FFM variables
    HSA_MODEL_TOPOLOGY
    HSA_MODEL_TOML
    HSA_MODEL_LIB
    HSA_MODEL_NUM_THREADS
    HSA_MODEL_ARGS
    HSA_MODEL_MEMFILE
    ; These might need to be set when using FFM
    HSA_XNACK
    HSA_ENABLE_SDMA
    HSA_ENABLE_INTERRUPT
    HSA_XNACK
    LD_LIBRARY_PATH
commands =
    pip install --upgrade pip
    pip install {toxinidir}/rocisa/
    pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/rocisa_tests.xml --junit-prefix=rocisa --color=yes -n {env:TENSILE_NUM_PYTEST_WORKERS:4} {toxinidir}/rocisa/test
    pip install pytest-cov
    sh -c "ARCH=$(invoke get-gpu-arch); \
          export TENSILE_ARCHITECTURE=\$ARCH; \
          export TENSILELITE_CLIENT_ARGS='{env:TENSILELITE_CLIENT_ARGS:} --gpu-targets '$ARCH; \
          invoke build-client --build-dir {toxinidir}/build_tmp $TENSILELITE_CLIENT_ARGS || exit $?; \
          pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/python_tests.xml --junit-prefix={envname} --color=yes -n $TENSILE_NUM_PYTEST_WORKERS --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client --global-parameters CheckASMCodeSize=True {posargs}; \
          rc=$?; test $rc -eq 5 && exit 0; exit $rc"
allowlist_externals =
    mkdir
    sh
    cmake

[testenv:py3]
basepython = python3

[testenv:unit]
description = "Runs Python unit tests quickly, skipping the client build. Assumes a build has run before."
basepython = python3
# This environment inherits 'deps' and 'setenv' from [testenv]
commands =
    pip install {toxinidir}/rocisa/
    pytest -v --basetemp={envtmpdir} {posargs}


[testenv:rocisa]
description = "Runs only rocisa tests"
basepython = python3
commands =
    pip install --upgrade pip
    pip install --no-build-isolation {toxinidir}/rocisa/
    pytest -v --basetemp={envtmpdir} --junit-xml={toxinidir}/rocisa_tests.xml --junit-prefix=rocisa --color=yes -n 4 {toxinidir}/rocisa/test {posargs}

[testenv:lint]
basepython = python3
deps =
    -r{toxinidir}/requirements.txt
    joblib
    flake8
commands = flake8 {toxinidir}/Tensile

[testenv:format]
description = "Formats code so developers don't have to"
skip_install = true
deps = black==24.4
commands =
    black \
      --line-length=100 \
      {toxinidir}/Tensile/Common \
      {toxinidir}/Tensile/TensileCreateLibrary \
      {toxinidir}/Tensile/Utilities/Decorators \
      {posargs}

[testenv:isort]
description = "Sorts import statements for less merge conflicts"
skip_install = true
deps = isort==5.13.2
commands =
    isort \
      --profile=black \
      {toxinidir}/Tensile/Common \
      {toxinidir}/Tensile/TensileCreateLibrary \
      {toxinidir}/Tensile/Utilities/Decorators \
      {posargs}

[testenv:pre_commit]
basepython = python3
deps =
    -r{toxinidir}/requirements.txt
    joblib
    pytest>=5.4.1
    flake8
commands =
    flake8 {toxinidir}/Tensile
    py.test -q --basetemp={envtmpdir} --color=yes {toxinidir}/Tensile -m unit {posargs}

[testenv:coverage]
description = "Generate combined Python + C++ code coverage"
basepython = python3
deps =
    {[testenv]deps}
    pytest-cov>=4.0.0
    coverage[toml]>=7.0.0
    scikit-build-core==0.10.0
    lcov_cobertura
    pycobertura
setenv =
    {[testenv]setenv}
    PYTHONPATH = {toxinidir}
    COVERAGE_FILE = {toxinidir}/.coverage
    LLVM_PROFILE_FILE = {toxinidir}/build_cov/profraw/coverage_%p_%m.profraw
passenv =
    {[testenv]passenv}
allowlist_externals =
    {[testenv]allowlist_externals}
    lcov
    genhtml
    ctest
commands =
    pip install --upgrade pip

    # Build with coverage instrumentation
    sh -c "ARCH=$(invoke get-gpu-arch); \
          invoke build-coverage --build-dir {toxinidir}/build_cov --gpu-targets $ARCH"

    # Create profraw directory
    sh -c "mkdir -p {toxinidir}/build_cov/profraw"

    # Install regular rocisa (not coverage-instrumented) for stable test runs
    # C++ coverage comes from gtest tests using the coverage-instrumented build
    pip install {toxinidir}/rocisa/

    # Run unit tests with coverage
    sh -c "pytest --cov=Tensile --cov=rocisa \
                 --cov-config={toxinidir}/pyproject.toml \
                 --cov-report= \
                 -v --basetemp={envtmpdir} \
                 -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
                 -m unit \
                 {toxinidir}/Tensile/Tests/unit {posargs}; \
          echo $? > {toxinidir}/.unit_test_exit_code"

    # Run all common tests for coverage
    sh -c "pytest --cov=Tensile --cov=rocisa \
                 --cov-config={toxinidir}/pyproject.toml \
                 --cov-append \
                 --cov-report=xml:{toxinidir}/coverage_python.xml \
                 --cov-report=term-missing:skip-covered \
                 -v --basetemp={envtmpdir} \
                 -n {env:TENSILE_NUM_PYTEST_WORKERS:4} \
                 -m common \
                 --prebuilt-client={toxinidir}/build_tmp/tensilelite/client/tensilelite-client \
                 --global-parameters CheckASMCodeSize=True \
                 {toxinidir}/Tensile/Tests/common {posargs}; \
          echo $? > {toxinidir}/.common_test_exit_code"

    # Run C++ gtest tests (tensilelite-tests) for tensilelite-host coverage
    sh -c "export LLVM_PROFILE_FILE='{toxinidir}/build_cov/profraw/cpp_test_%p_%m.profraw'; \
          cd {toxinidir}/build_cov/tensilelite/tests && \
          ctest --output-on-failure --timeout 120; \
          echo $? > {toxinidir}/.cpp_test_exit_code"

    # Merge C++ and Python coverage
    python {toxinidir}/scripts/merge_coverage.py \
           --profraw-dir {toxinidir}/build_cov/profraw \
           --cpp-objects "{toxinidir}/build_cov/tensilelite/rocisa/rocisa/_rocisa*.so" \
                         "{toxinidir}/build_cov/tensilelite/tests/tensilelite-tests" \
           --python-coverage-dir {toxinidir} \
           --source-dir {toxinidir} \
           --output-dir {toxinidir}/coverage_combined

    # Print full combined coverage report (Python + C++) using pycobertura
    sh -c "echo ''; \
           echo '======================================================================'; \
           echo 'COMBINED COVERAGE REPORT (Python + C++)'; \
           echo '======================================================================'; \
           pycobertura show {toxinidir}/coverage_combined/coverage.xml; \
           echo ''; \
           echo '======================================================================'; \
           echo 'REPORTS:'; \
           echo '  HTML Report : coverage_combined/html/index.html'; \
           echo '  LCOV Data   : coverage_combined/combined.lcov'; \
           echo '  Cobertura   : coverage_combined/coverage.xml'; \
           echo '======================================================================'"

    # Print test results and exit status
    python -c "import sys; \
               unit_rc = int(open('.unit_test_exit_code').read().strip()); \
               common_rc = int(open('.common_test_exit_code').read().strip()); \
               cpp_rc = int(open('.cpp_test_exit_code').read().strip()); \
               print(f'\nTest Results: unit={{unit_rc}}, common={{common_rc}}, cpp={{cpp_rc}}'); \
               any_failed = unit_rc not in (0,5) or common_rc not in (0,5) or cpp_rc != 0; \
               print('Some tests FAILED - check logs above' if any_failed else 'All tests PASSED'); \
               sys.exit(1 if any_failed else 0)"

[flake8]
exclude = .git,build*,dist,.cache,*~
max-line-length = 132
# E/W class violations are errors/warnings reported by pycodestyle, respectively
# This mostly just leaves pyflake errors.
ignore = E, W
