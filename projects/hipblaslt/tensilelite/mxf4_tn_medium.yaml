GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: -1
  NumElementsToValidateWinner: 0
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 2
  EnqueuesPerSync: 20
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  RotatingBufferSize: 1024
  ForceGenerateKernel: 1

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: f4
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
          #- [32, 16, 128, 1, 1, 4, 2, 2, 2]
        - DepthU: [1024]
        - HalfPLR: [0]
        - TDMInst: [3]
        - PrefetchGL2: [2]
        - ClusterDim: [[4,4]]
        - GlobalSplitU: [1]
        - TDMIterateMode: [1]
        - LDSSegmentInterleave: [1]
        - TDMSplit: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 2048, 1, 65536]
        - ActivationArgs:
          - [Enum: none]
          
