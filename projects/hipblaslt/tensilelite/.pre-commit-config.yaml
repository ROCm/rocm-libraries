# Quality + AI-friendliness report for tensilelite (Tensile/ Python tree).
#
# A single report-only check that folds two measurements together:
#   * complexity / size  — function CCN and file NLOC violator counts (lizard)
#   * AI-friendliness     — 21 AST readability signals
#
# It prints current values against the targets in
# scripts/quality/quality_targets.json and ALWAYS passes (report-only) for now,
# so it never blocks a commit while targets are still being agreed. `verbose:
# true` makes pre-commit show the report even though the hook passes.
#
# The report scans the whole Tensile/ tree (~5s), which is too slow for the
# every-commit hook stage, so it is confined to the `manual` stage: it does NOT
# run on `git commit`. CI (hipblaslt-tensilelite-quality.yml) produces the same
# report on PRs; run it locally on demand with the command below.
#
# rocm-libraries is a monorepo, so the git root is the repo root and pre-commit
# runs hooks from there. Run scoped to tensilelite with:
#
#   pre-commit run --config projects/hipblaslt/tensilelite/.pre-commit-config.yaml \
#       --hook-stage manual --all-files
#
# Refresh targets to the current measurement:
#   python projects/hipblaslt/tensilelite/scripts/quality/check_quality.py --update
#
# When ready to start blocking regressions, add `--enforce` to the entry below.
# See scripts/quality/BASELINE.md for signal definitions and thresholds.

default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: tensilelite-quality-report
        name: tensilelite quality + AI-friendliness report
        entry: python projects/hipblaslt/tensilelite/scripts/quality/check_quality.py
        language: python
        additional_dependencies: [lizard]
        pass_filenames: false
        verbose: true
        stages: [manual]
        files: ^projects/hipblaslt/tensilelite/Tensile/.*\.py$
