# MI450-MC MAF/MAB -- 10 GEMMs: 5 datatypes x {MAF, MAB}  [performance]
# MAF 4096 x 3072 x 65536 (all dtypes)
# MAB bf16/fp8: 16 x 65536 x K   |   MAB MX: 16 x 49152 x K
#   bf16/fp8 use N=65536 -- their tuned kernels (MT16x128x64 / MT16x128x128) are
#   there and beat the N=49152 pair by 8-12%. MX has no tuned N=65536 kernel yet.
# K = 8 MiB / (256 * dtype_bytes), so A+B bytes match across dtypes at a given N.
# scaleA/B: 0=none  3=B32E8 (MX, block 32)  6=B16E4M3 (NVFP4, block 16)
# No epilogue: bias_vector unset (false), alpha=1 beta=0, activation none.
#
# TIMING tuned for the BEST OBSERVABLE number: short warmup + short window measures
# near boost clock. MAF is power-limited here -- junction 44->69 C and sclk
# 2362->1587 MHz within ~2 s of sustained load, so a long window reports the
# THROTTLED steady state. Measured (MAF bf16): 20 ms -> 1.2300 PF, 200 ms -> 1.1915,
# 1000 ms -> 1.1705, 2000 ms -> 1.1678. For SUSTAINED numbers instead:
# measure_time: 1000 and drop adaptive_warmup_time. MAB moves <1% either way.


