TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  Architecture: gfx1250
  KernelTime: True
  PreciseKernelTime: False
  SleepPercent: 0
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
  NumWarmups: 50
  EnqueuesPerSync: 500
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 512
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  ExitOnFails: 0
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitSeed: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  CpuThreads: 32
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  KeepBuildTmp: False
  UseEffLike: False

BenchmarkProblems:
  -
    - # ProblemType, TN (Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

    - # N = 1, tile grid
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]  # MT16x16, 512 wg
          - [16, 16, 32, 1, 1, 1, 1, 2, 1]  # MT32x16, 256 wg
          - [16, 16, 32, 1, 1, 1, 1, 4, 1]  # MT64x16, 128 wg
          - [16, 16, 32, 1, 1, 2, 1, 4, 1]  # MT128x16, 64 wg
          - [16, 16, 32, 1, 1, 4, 1, 4, 1]  # MT256x16, 32 wg
          - [16, 16, 32, 1, 1, 8, 1, 4, 1]  # MT512x16, 16 wg
        - DepthU: [64, 128, 256]            # K = 1024, so 16 / 8 / 4 K-loops
        - PrefetchGL2: [0, 1]
        - SourceSwap: [False]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - HalfPLR: [0]
        - WorkGroupMappingXCC: [1]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [16]  # M = 8192
        - AssertFree1ElementMultiple: [1]   # N = 1
        - AssertSummationElementMultiple: [8]  # K = 1024
        - Groups:
          -
            - GlobalSplitU: [1, 2, 3, 4, 6, 8]   # 3 and 6 land wg x GSU on a multiple of 96
              GlobalSplitUAlgorithm: MultipleBuffer
              GlobalSplitUCoalesced: [False, True]
            - GlobalSplitU: [1, 2, 3, 4, 6, 8]
              GlobalSplitUAlgorithm: MultipleBufferSingleKernel
              GlobalSplitUCoalesced: [False, True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 1, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

