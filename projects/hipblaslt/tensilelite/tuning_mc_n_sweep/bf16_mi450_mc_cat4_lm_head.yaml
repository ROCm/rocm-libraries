TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  Architecture: gfx1250
  KernelTime: True
  PreciseKernelTime: False
  SleepPercent: 0
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
  NumWarmups: 50
  EnqueuesPerSync: 500
  SkipSlowSolutionRatio: 0.5
  RotatingBufferSize: 384
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  ExitOnFails: 0
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitSeed: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  CpuThreads: 32
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  KeepBuildTmp: False
  # UseEffLike: False

BenchmarkProblems:
  -
    - # ProblemType, TN (Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

    - # N = 1   (edge size: N is not a multiple of 16)
      # projection target 51.04 us. 24 solution configs.
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - StreamK: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - HalfPLR: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [8]   # M = 25256
        - AssertFree1ElementMultiple: [1]   # N = 1
        - AssertSummationElementMultiple: [8]   # K = 8192
        - Groups:
          - # macro tile x DepthU. MT0 tiles M, MT1 tiles N (25256 output features).
            - MatrixInstruction: [16, 16, 32, 1, 1, 1, 1, 4, 1]  # MT 64x16, 395 wg at GSU 1
              DepthU: [128, 256]
            - MatrixInstruction: [16, 16, 32, 1, 1, 2, 1, 4, 1]  # MT 128x16, 198 wg at GSU 1  v1 winner
              DepthU: [128, 256]
            - MatrixInstruction: [16, 16, 32, 1, 1, 4, 1, 4, 1]  # MT 256x16, 99 wg at GSU 1
              DepthU: [128, 256]
          - # split-K: 198 wg at MT1 128, GSU 1 -> target ~1-8 waves of 96
            - GlobalSplitU: [1]
            - GlobalSplitU: [2]
              GlobalSplitUAlgorithm: [MultipleBuffer]
          - # global prefetch into GL2
            - PrefetchGL2: [0]
            - PrefetchGL2: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [25256, 1, 1, 8192]
        - ActivationArgs:
          - [Enum: none]
        - BiasTypeArgs: [s]

