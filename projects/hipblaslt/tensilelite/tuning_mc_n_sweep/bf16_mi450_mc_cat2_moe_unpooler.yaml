        - ForceDisableShadowInit: [True]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - TDMSplit: [False]
        - TDMPlusLdsBuf: [-1]
        - StaggerU: [0]
        - StreamK: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - ClusterLocalRead: [0]
        - ClusterDim: [[1, 1]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - LDSSegmentInterleave: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - HalfPLR: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - AssertFree0ElementMultiple: [16]  # M = 8192
        - AssertFree1ElementMultiple: [1]   # N = 1
        - AssertSummationElementMultiple: [8]   # K = 4096
        - Groups:
          - # macro tile x DepthU. MT0 tiles M, MT1 tiles N (8192 output features).
            - MatrixInstruction: [16, 16, 32, 1, 1, 1, 1, 4, 1]  # MT 64x16, 128 wg at GSU 1
              DepthU: [128, 256]
            - MatrixInstruction: [16, 16, 32, 1, 1, 2, 1, 4, 1]  # MT 128x16, 64 wg at GSU 1  v1 winner
              DepthU: [128, 256]
            - MatrixInstruction: [16, 16, 32, 1, 1, 4, 1, 4, 1]  # MT 256x16, 32 wg at GSU 1
              DepthU: [128, 256]
          - # split-K: 64 wg at MT1 128, GSU 1 -> target ~1-8 waves of 96
            - GlobalSplitU: [1]
            - GlobalSplitU: [2, 4, 8]
              GlobalSplitUAlgorithm: [MultipleBuffer]
          - # global prefetch into GL2
            - PrefetchGL2: [0]
            - PrefetchGL2: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 1, 1, 4096]
        - ActivationArgs:
