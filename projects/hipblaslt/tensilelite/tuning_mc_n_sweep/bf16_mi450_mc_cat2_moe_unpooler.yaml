#
# LWPARCH-565 - Meta LLM GEMMs on MI450-MC (gfx1250), BF16 TN, N sweep. SECOND PASS.
# Category 2: moe unpooler  -  M x K = 8192 x 4096
#
# bf16 in/out, f32 compute, TN, batch 1, alpha 1, beta 0, lda = ldb = K, ldc = ldd = M.
# Fused: bias (f32, applied to D) + scale-alpha vector, activation requested as none, i.e.
# problem type Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs.
#
# ONE PROBLEM SIZE PER BenchmarkProblemSizeGroup - this is required, not a style choice
# ---------------------------------------------------------------------------------------
# With several sizes in one group the client aborts with "Insufficient rotating buffer size":
#   - the allocator (client/src/DataInitialization.cpp:1289) sizes the pool from
#     m_vdata[i].pristine[dataType].maxElements, i.e. the LARGEST problem in the group, and
#     reserves S_max * (ceil(buffer/S_max) - 1)   (client/src/Rotating.cpp:80-88);
#   - the check (client/src/DataInitialization.cpp:3713-3735) uses getRotatingSize() of the
#     problem actually being run, and asks for (ceil(buffer/size_p) - 1) * size_p ~= buffer.
# So any group whose smallest problem is meaningfully smaller than its largest one can fail.
# With one size per group size_p == S_max and the check passes with equality. Do not "fix" this
# by setting RotatingBufferMode 1: that path skips the check but changes what is allocated, so
# the measurement stops matching what a real run does.
#
# Sizing against the real machine
# -------------------------------
# rocminfo on this box: 8 GPU agents of 96 CUs each (4 cards x 2 NPS2 partitions), PCI DID
# 0x75c8 = MI450-MC Lyte. Tuning therefore targets 96 CUs per device, NOT the 168 active CUs
# per package in the MI450X-MC spec. The LWPARCH-565 projection is also per NPS2 partition:
# 2100 TF/s / 2 = 1050 TF/s at the 1335 MHz it assumes, and 17.1 TB/s / 2 = 8.55 TB/s, which is
# within 1% of the 8.48 TB/s implied by its own numbers.
#   workgroups = ceil(M / MT0) * ceil(N / MT1) * GlobalSplitU, target ~1-8 waves of 96.
#
# What the first pass measured (run_20261119b)
# --------------------------------------------
# Fitting the 20 winners at N <= 32:  t = 7.75 us + bytes / 8.91 TB/s
# against the projection's            t = 1.99 us + bytes / 8.48 TB/s.
# The streaming bandwidth is already there; the whole gap is per-kernel fixed cost. lm_head,
# whose 414 MB of weights amortise that cost, came in at 1.03-1.10x of target at M <= 32,
# while oproj (16.8 MB) sat at 1.8-2.1x. Edge sizes cost far more than the projection assumes:
# 255 ran 19-55% slower than 256 and 511 17-55% slower than 512 even though they share a tile
# count. Splitting every N into its own group also lets the aligned sizes use
# AssertFree1ElementMultiple 16 while 17/255/511 keep 1, which they could not do when grouped.
#
# MatrixInstruction is [16,16,32,1,1,WaveTileM,WaveTileN,WaveGroupM,WaveGroupN];
# MT0 = 16*WaveTileM*WaveGroupM, MT1 = 16*WaveTileN*WaveGroupN, WaveGroupM*WaveGroupN <= 4
# (gfx1250 has no WGP mode, so a workgroup is capped at 4 waves).
# Entries marked "v1 winner" are the macro tiles that actually won the first pass for this size.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  Architecture: gfx1250
  KernelTime: True
  PreciseKernelTime: False
  SleepPercent: 0
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
  NumWarmups: 50
  EnqueuesPerSync: 500
  SkipSlowSolutionRatio: 0.5
  RotatingBufferSize: 384
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  ExitOnFails: 0
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitSeed: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  CpuThreads: 32
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  KeepBuildTmp: False
  # UseEffLike: False

BenchmarkProblems:
  -
    - # ProblemType, TN (Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

