#
# Research workspace: BBS TN OOB representatives x parameter-group forks.
#
# ProblemType matches library logic:
#   gfx1250_Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs.yaml
# Exact sizes: 3 per OOB category from
#   hipblaslt-ZeroGPUDay workloads(BBS TN OOB exact re-tune_1027C).csv
#   (see oob_representatives.md). Format Exact: [M, N, batch, K].
#
# One BenchmarkProblems group per parameter family so forks stay within-group
# (no full cross-product). Only currently-legal values are forked; see
# parameter_combinations.md.
#
# Note: several Exact sizes are very large. Validation is capped; drop or comment
# sizes for smoke runs.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: 128
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 8
  PrintLevel: 1
  CodeObjectVersion: "4"

BenchmarkProblems:
  ##############################################################################
  # 3. LDS segment / bank conflict
  ##############################################################################
  -
    - # ProblemType: BBS TN + Bias + HA + ScaleAlphaVec + UserArgs (matches library logic)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 1
      BiasDataTypeList: [s, b]
      UseScaleAlphaVec: 1
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      # Interleave + BRotate. BRotate=1 only survives when interleave resolves to 1.
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]
        - TransposeLDS: [-1]
        - ExpandPointerSwap: [False]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
        - StoreRemapVectorWidth: [0]
        - SourceSwap: [True]
        - LDSTrInst: [False]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT 256x256 (dominant OOB winner family)
          - [16, 16, 32, 1, 1, 1, 8, 1, 2]  # MT 16x256 (M=1 / thin-M winners)
          - [16, 16, 32, 1, 1, 8, 1, 2, 1]  # MT 256x16 (N=1 / thin-N winners)
        - TDMInst: [3]
        - MXLoadInst: [TDM]
        - LDSSegmentInterleave: [-1, 0, 1]
        - LDSSegmentBRotate: [0, 1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
