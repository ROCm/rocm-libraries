#
# Research workspace index for BBS TN OOB param-group forks.
#
# Source representatives: oob_representatives.json / .md
#   (3 sizes+winning-MT per OOB category from
#    hipblaslt-ZeroGPUDay workloads(BBS TN OOB exact re-tune_1027C).csv)
#
# Runnable configs (regenerate with: python3 generate_runs.py):
#   runs/<group>/config_smoke.yaml  — 20 reps (1/category), group forks
#   runs/<group>/config.yaml        — 60 reps (3/category), group forks
#
# Each BenchmarkProblems entry is one Exact size pinned to that row's
# winning MatrixInstruction / DepthU / WorkGroup from the CSV solution
# name. Do not fork a shared MT across sizes.
#
# Winner baseline (all 60): SK3 (StreamK+StaticGrid), TDMInst=3,
# TDMIterateMode=0, SourceSwap=False, StaggerU=32, WGM=8, GSU=0,
# ClusterDim=[1,1], TransposeLDS=1, PrefetchGL2=0.
#
# Launch:  cd runs && ./run_all.sh smoke
#
# Smoke analysis (2026-11-13): runs/analysis_smoke/RESULTS_SMOKE.md
# Blanket ablation (baseline vs stacked bests):
#   python3 generate_blanket.py
#   cd runs && ./09_baseline_vs_best/run_blanket.sh smoke
