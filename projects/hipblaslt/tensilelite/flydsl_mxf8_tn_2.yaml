TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 13
  DataInitTypeB: 12
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 2
  EnqueuesPerSync: 1000
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  #SkipSlowSolutionRatio: 0.7
  RotatingBufferSize: 256


BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          #- [16, 16, 128, 1,  1,  2, 7,  2, 2]
          #- [16, 16, 128, 1,  1,  4, 7,  1, 4]
          - [16, 16, 128, 1,  1,  4, 7,  2, 2]
          #- [16, 16, 128, 1,  1,  4, 4,  2, 2]
          - [16, 16, 128, 1,  1,  8, 7,  2, 2]
          #- [16, 16, 128, 1,  1,  8, 8,  2, 2]
        - DepthU: [256,512]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]
        - HalfPLR: [0]
        - TDMIterateMode: [-1]
        #- TDMSplit: [False,True]
        #- PrefetchGL2: [0]
        - PrefetchGL2: [0,1,2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        #- StreamK: [3]
        #- WorkGroupMappingXCC: [-1]
        - GlobalSplitU: [2,4]
        - GlobalSplitUAlgorithm: [MultipleBuffer,MultipleBufferSingleKernel]
        - GlobalSplitUCoalesced: [True]
        - GlobalSplitUWorkGroupMappingRoundRobin: [True]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[1,1],[2,4],[4,4]]
        - LDSSegmentInterleave: [1]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 7168, 1, 16384]

LibraryLogic:
    ScheduleName: "gfx1250"
    DeviceNames: ["Device 73f0"]
    ArchitectureName: "gfx1250"
    LibraryType: "Equality"

LibraryClient:

