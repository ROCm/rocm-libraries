#
# Pinned single-solution extraction of the empirical top config from the
# benchmark_k1_bf16.yaml sweep at [2048, 16384, 1, 2048] on gfx950 (MI355X).
#
# Winner (SolutionIndex 0 in the 2026-10-13 sweep run, WinnerIdx 1268 of 1487
# surviving candidates): MT 256x256x64, MI 16x16x32, MIWaveTile [4,16],
# MIWaveGroup [4,1], PrefetchGlobalRead=2, RMSEpiloguePrefetchDepth=4,
# StaggerU=16, GlobalSplitU=0, DirectToLds=0, PreloadKernArgs=True.
# Measured: 157.073 us / 874998 GFlops (WinnerGFlops/WinnerTimeUS from
# 2_BenchmarkData/Cijk_Alik_Bljk_BBS_H_RMSE_UserArgs_00_CSVWinner.csv).

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 20
  NumWarmups: 20
  KernelTime: true
  NumElementsToValidate: -1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 12
  DataInitTypeC: 12
  # Native RMS epilogue is gamma-only (does not apply alpha); validate at alpha=1.
  DataInitTypeAlpha: 1
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  KeepBuildTmp: true
  RotatingBufferSize: 1024

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — PartialRMS + ResidualAdd + StoreBf16D
  # Fused path (RMSEpilogue=True). Pinned empirical winner, MT 256x256x64.
  ########################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 16, 4, 1]  # MT 256x256, MIWaveTile[4,16], MIWaveGroup[4,1]
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [0]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [16]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [True]
        - 1LDSBuffer: [0]
        - RMSEpiloguePrefetchDepth: [4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [2048, 16384, 1, 2048]
