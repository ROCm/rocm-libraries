# PartialRMS + ResidualAdd + MXFP8 DynQuant 32x1 + bf16 ResidualOut store (K1),
# MX-scaled fp8 input path. Combines MX-scaled fp8 A/B (MXBlockA=32, MXBlockB=32)
# with the two-pass PartialRMSStoreBf16D epilogue: the RMS pass writes the
# pre-quantization H+residual value as bf16 to ResidualOut, the quant pass writes
# OCP fp8 e4m3 to D. Constraints (combined PartialRMS + MXFP8 mode): DestDataType=F8,
# UseBeta=False, MXFP8Quant owns quantization (PartialRMSQuant=False),
# MT1 a multiple of 64 (MT1==128 for groups 1-2; MT1==256 for group 3),
# MT0%64==0, WG0<=2, DQuantSize0(=32) <= MT0/WG0. Realistic LLM-inference shapes.
#
# Three BenchmarkProblemSizeGroups under one ProblemType (ClientWriter enforces
# uniform MT1 per benchmark pass; sibling groups get distinct idx so results files
# don't clobber each other):
#   Group 1 (idx 00): MT1=128, small token sizes  (M=1..64)
#   Group 2 (idx 01): MT1=128, large token sizes  (M=128..2048)
#   Group 3 (idx 02): MT1=256, 8192^3 target
#
# Wave-group tile sweep (MT1=128): WG 1x1,2x1,1x2,2x2,1x4 each over
# MT0 in {64,128,192,256}, PGR in {0,1,2}. WG2x4 (8-wave: wg_m=2, wg_n=4) is
# EXCLUDED: it miscomputes the partialBuf sum-of-squares under full CPU
# validation. See PARTIALRMS_WG2X4_KNOWN_ISSUE.md. Known rejections (benchmarking):
#   MXSA overload (WG1x1, MT0>=192): [12/16,8,1,1] @ all PGR.
#   Multi-DU (DepthU=256, dataDU=128, PGR2, MT0>=192): WG2x1, WG1x2, WG2x2,
#     WG1x4, WG2x4 with MIWT_M>=6 @ PGR2.
#   VGPR overflow: [8,8,1,1] MT128x128 WG1x1 @ PGR1,2.
#
# --- Benchmark run 2026-08-31, gfx950: top config @ 8192^3 ---
# MI=[16,16,128,1,1,4,2,2,4]  MT128x128  WG 2x4  MIWT4x2  PGR2
# 1,141,170 GFlops (1141.170 TFlops). NOTE: this WG2x4 config is EXCLUDED from
# the sweep below due to the 8-wave partialBuf sum-of-squares miscompute
# (PARTIALRMS_WG2X4_KNOWN_ISSUE.md); re-add it once the root cause is fixed.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 0
  PrintLevel: 3
  KernelTime: True
  PrintSolutionRejectionReason: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1

BenchmarkProblems:

  ########################################
  # Group 1 (idx 00): MT1=128, small token sizes (M=1..64).
  # Full WG sweep: 1x1,2x1,1x2,2x2,1x4,2x4 x MT0 in {64,128,192,256} x PGR {0,1,2}.
  ########################################
  -
    - # ProblemType — MX-scaled fp8 in, OCP fp8 e4m3 out, f32 compute, residual add, bf16 ResidualOut
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True
      PartialRMSStoreBf16D: True
      PartialRMSQuant: False
      DQuantType: MXFP8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            # WG 1x1 (WG0=1, WG1=1, MIWT_N=8)
            - [16, 16, 128, 1, 1,  4,  8, 1, 1]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 1, 1]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1, 12,  8, 1, 1]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1, 16,  8, 1, 1]  # MT0=256  MT1=128
            # WG 2x1 (WG0=2, WG1=1, MIWT_N=8)
            - [16, 16, 128, 1, 1,  2,  8, 2, 1]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1,  6,  8, 2, 1]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 2, 1]  # MT0=256  MT1=128
            # WG 1x2 (WG0=1, WG1=2, MIWT_N=4)
            - [16, 16, 128, 1, 1,  4,  4, 1, 2]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  8,  4, 1, 2]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1, 12,  4, 1, 2]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1, 16,  4, 1, 2]  # MT0=256  MT1=128
            # WG 2x2 (WG0=2, WG1=2, MIWT_N=4)
            - [16, 16, 128, 1, 1,  2,  4, 2, 2]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  4,  4, 2, 2]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1,  6,  4, 2, 2]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1,  8,  4, 2, 2]  # MT0=256  MT1=128
            # WG 1x4 (WG0=1, WG1=4, MIWT_N=2)
            - [16, 16, 128, 1, 1,  4,  2, 1, 4]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  8,  2, 1, 4]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1, 12,  2, 1, 4]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1, 16,  2, 1, 4]  # MT0=256  MT1=128
            # WG 2x4 (WG0=2, WG1=4) REMOVED: 8-wave partialBuf sum-of-squares
            # miscompute under full CPU validation (PARTIALRMS_WG2X4_KNOWN_ISSUE.md).
            # WG 2x2, MT1=256 (WG0=2, WG1=2, MIWT_N=8)
            - [16, 16, 128, 1, 1,  8,  8, 2, 2]  # MT0=256  MT1=256
            # WG 2x2, MT1=256 — subtile (WG0=2, WG1=2, MIWT_N=8, MIWT_M=6)
            - [16, 16, 128, 1, 1,  6,  8, 2, 2]  # MT0=192  MT1=256
            # WG 1x4, MT1=256 — added coverage (WG0=1, WG1=4, MIWT_N=4)
            - [16, 16, 128, 1, 1, 16,  4, 1, 4]  # MT0=256  MT1=256
            # WG 2x2, MT0=320, MT1=256 — added coverage
            - [16, 16, 128, 1, 1, 10,  8, 2, 2]  # MT0=320  MT1=256
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [True]
        - PartialRMSQuant: [False]
        - PartialRMSStoreBf16D: [True]
        - DQuantType: [MXFP8]
        - DQuantSize0: [32]
        - DQuantSize1: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchAcrossPersistent: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [256]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096,  4096, 1, 4096]


LibraryLogic:
  ScheduleName: "partialrms_residual_mxfp8quant_residualout_scaled_mxfp8_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
