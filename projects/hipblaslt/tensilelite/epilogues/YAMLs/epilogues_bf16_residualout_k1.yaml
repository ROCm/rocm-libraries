# PartialRMS + ResidualAdd + bf16 ResidualOut dual-store (K1), bf16 in / bf16 out.
# Same as the pure bf16 PartialRMS variant, but with PartialRMSStoreBf16D=True: the
# fused K1 epilogue additionally writes the pre-normalization H+residual value as
# bf16 to a separate ResidualOut buffer (DQuantType=None, no fp8, no MXFP8 quant).
# D still receives the gamma-scaled bf16 output and partialBuf the per-row sum of
# squares; a second-stage kernel normalises D in place.
#
# The tile sweep lives in ONE BenchmarkProblemSizeGroup under ONE ProblemType.
# Results file is named "{ProblemType}_{sizeGroupIdx:02d}.csv".

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  ExitOnFails: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — PartialRMS + ResidualAdd (no fp8, no MXFP8 quant)
  # DepthU=64, PGR=[1,2].
  ########################################
  -
    - # ProblemType — bf16 in, bf16 out, f32 compute, residual add
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True
      PartialRMSStoreBf16D: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            # WG 1x1 (WG0=1, MT1=128)
            - [16, 16, 32, 1, 1,  4,  8, 1, 1]  # MT0=64   MT1=128
            - [16, 16, 32, 1, 1,  8,  8, 1, 1]  # MT0=128  MT1=128
            - [16, 16, 32, 1, 1, 12,  8, 1, 1]  # MT0=192  MT1=128
            - [16, 16, 32, 1, 1, 16,  8, 1, 1]  # MT0=256  MT1=128
            # WG 2x1 (WG0=2, MT1=128)
            - [16, 16, 32, 1, 1,  2,  8, 2, 1]  # MT0=64   MT1=128
            - [16, 16, 32, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128
            - [16, 16, 32, 1, 1,  6,  8, 2, 1]  # MT0=192  MT1=128
            - [16, 16, 32, 1, 1,  8,  8, 2, 1]  # MT0=256  MT1=128
            # WG 1x2 (WG0=1, WG1=2, MIWT_N=4) — added coverage
            - [16, 16, 32, 1, 1,  4,  4, 1, 2]  # MT0=64   MT1=128
            - [16, 16, 32, 1, 1,  8,  4, 1, 2]  # MT0=128  MT1=128
            - [16, 16, 32, 1, 1, 12,  4, 1, 2]  # MT0=192  MT1=128
            - [16, 16, 32, 1, 1, 16,  4, 1, 2]  # MT0=256  MT1=128
            # Larger tile (WG 2x1, MT0=320) — added coverage
            - [16, 16, 32, 1, 1, 10,  8, 2, 1]  # MT0=320  MT1=128
            # WG 2x2 (WG0=2, MT1=128)
            - [16, 16, 32, 1, 1,  2,  4, 2, 2]  # MT0=64   MT1=128
            - [16, 16, 32, 1, 1,  4,  4, 2, 2]  # MT0=128  MT1=128
            - [16, 16, 32, 1, 1,  6,  4, 2, 2]  # MT0=192  MT1=128
            - [16, 16, 32, 1, 1,  8,  4, 2, 2]  # MT0=256  MT1=128
            # WG 1x4 (WG0=1, MT1=128)
            - [16, 16, 32, 1, 1,  4,  2, 1, 4]  # MT0=64   MT1=128
            - [16, 16, 32, 1, 1,  8,  2, 1, 4]  # MT0=128  MT1=128
            - [16, 16, 32, 1, 1, 12,  2, 1, 4]  # MT0=192  MT1=128
            - [16, 16, 32, 1, 1, 16,  2, 1, 4]  # MT0=256  MT1=128
            # Larger tiles (MT0=320/384) — added coverage
            - [16, 16, 32, 1, 1, 10,  4, 2, 2]  # MT0=320  MT1=128 (WG 2x2)
            - [16, 16, 32, 1, 1, 12,  4, 2, 2]  # MT0=384  MT1=128 (WG 2x2)
            - [16, 16, 32, 1, 1, 20,  2, 1, 4]  # MT0=320  MT1=128 (WG 1x4)
            - [16, 16, 32, 1,  1, 12, 8, 2, 2]  # MT 384x256 (winner)
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [True]
        - PartialRMSStoreBf16D: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192,  8192, 1, 8192]

LibraryLogic:
  ScheduleName: "partialrms_residualadd_storebf16d_bf16_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
