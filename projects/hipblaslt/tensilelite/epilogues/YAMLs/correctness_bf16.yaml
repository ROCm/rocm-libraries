#
# Fused: bf16 PartialRMS+ResidualAdd+StoreBf16D — RMSEpilogue path.
# UseRMSEpilogue enables the fused problem type and selects the fused code path.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 20
  NumWarmups: 20
  NumElementsToValidate: -1
  ExitOnFails: 1
  PrintSolutionRejectionReason: True
  KernelTime: True
  KeepBuildTmp: True
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 12
  # The native RMS epilogue is gamma-only by design: it stores D = H*gamma directly
  # and skips GlobalWriteBatch, so it does NOT apply alpha or beta*C (GWB normally
  # does). Only alpha==1 and beta==0 configs are valid on this path; validated here
  # at alpha=1.
  DataInitTypeAlpha: 1
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 1024
  DataInitTypeRMSGamma: 1
  DataInitTypeResidual: 2

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — PartialRMS + ResidualAdd + StoreBf16D
  # Fused path (RMSEpilogue=True). Winner tile MT 384x256.
  ########################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1,  1, 12, 8, 2, 2] # MT 384x256
            - [16, 16, 32, 1, 1, 10, 10, 2, 2] # MT0=320  MT1=320
            - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT0=256  MT1=256
            - [16, 16, 32, 1, 1, 6, 6, 2, 2]   # MT0=192  256=192
            - [16, 16, 32, 1, 1, 4, 16, 4, 1]  # MT0=256 MT1=256 (pinned top config, T_M=4 interleaved)
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            # Exact: [M, N, batch, K].  For TN GEMM (TransposeA=True), SizesFree+0 == M.
            # _emitNative branches on (SizesFree+0 & 7): WIDE arm (rowExtent%8==0)
            # when the remainder is zero, NARROW arm (rowExtent%8!=0) otherwise.
            # Keep at least one WIDE and one NARROW entry to cover both code paths.
            - Exact: [640, 640, 1, 640]   # M=640, 640%8==0 -> WIDE
            - Exact: [768, 640, 1, 512]   # M=768, 768%8==0 -> WIDE
            - Exact: [521, 521, 1, 521]   # M=521, 521%8==1 -> NARROW
            - Exact: [532, 64, 1, 64]     # M=532, 532%8==4 -> NARROW

  ########################################
  # bf16 in, bf16 out — RMSEpilogue (PartialRMS + ResidualAdd + StoreBf16D)
  # CMS (UseCustomMainLoopSchedule=1), data-parallel, MT 256x256x64, gfx950.
  #
  # The CMS kernel runs the same native RMS schedule as Subtile: WIDE (M%8==0,
  # dwordx4) and NARROW (M%8!=0, scalar bf16) arms, both with row-OOB clamps, so
  # partial M and N tiles are covered below.
  ########################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      Activation: False
      SupportUserArgs: False
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]
        - DepthU: [64]
        - DirectToLds: [1]
        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [0]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - InitCIterWmma: [0]
        - LdsBlockSizePerPadA: [1024]
        - LdsBlockSizePerPadB: [1024]
        - LdsBlockSizePerPadMXSA: [0]
        - LdsBlockSizePerPadMXSB: [0]
        - LdsBlockSizePerPadMetadata: [0]
        - LdsPadA: [16]
        - LdsPadB: [16]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - LdsPadMetadata: [0]
        - LocalReadVectorWidth: [8]
        - MaxOccupancy: [40]
        - MinGRIncPerMfma: [1]
        - MXLoadInst: ["BufferLoad"]
        - MXScaleFormat: ["NoSwizzle"]
        - NonTemporalA: [1]
        - NonTemporalB: [1]
        - NonTemporalC: [4]
        - NonTemporalD: [3]
        - NumElementsPerBatchStore: [12]
        - PreloadKernArgs: [True]
        - PrefetchGlobalRead: [2]
        - RMSEpilogue: [True]
        - RMSEpiloguePrefetchDepth: [2]
        - ScheduleGROverBarrier: [0]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreSyncOpt: [1]
        - StoreVectorWidth: [8]
        - StreamK: [3]
        - StreamKAtomic: [0]
        - StreamKForceDPOnly: [1]
        - StreamKWorkStealing: [0]
        - StreamKXCCMapping: [8]
        - SwInstructionPrefetch: [1]
        - TransposeLDS: [1]
        - TransposeLDSMetadata: [1]
        - UseCustomMainLoopSchedule: [1]
        - UseSgprForGRO: [0]
        - VectorWidthA: [8]
        - VectorWidthB: [8]
        - WorkGroupMappingXCC: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [256, 256, 1, 256]    # M=256 = 1*MT0, N=256 (N%MT1==0)
            - Exact: [512, 640, 1, 512]    # M=512 = 2*MT0, N=640 (N%MT1!=0)
            - Exact: [1024, 512, 1, 512]   # M=1024 = 4*MT0, N=512
            - Exact: [264, 256, 1, 256]    # M%256!=0, M%8==0 -> WIDE, partial M tile
            - Exact: [520, 640, 1, 512]    # partial M and N tiles, WIDE
            - Exact: [521, 300, 1, 256]    # M%8==1 -> NARROW, partial tiles
            - Exact: [532, 264, 1, 512]    # M%8==4 -> NARROW, partial tiles

LibraryLogic:
  ScheduleName: "bench_fused_bf16_partialrms_residualadd"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
