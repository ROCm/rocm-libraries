#
# Fused: bf16 PartialRMS+ResidualAdd+StoreBf16D — RMSEpilogue path.
# UseRMSEpilogue enables the fused problem type and selects the fused code path.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 0
  PrintSolutionRejectionReason: True
  KernelTime: True
  KeepBuildTmp: True

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — PartialRMS + ResidualAdd + StoreBf16D
  # Fused path (RMSEpilogue=True). Winner tile MT 384x256.
  ########################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1,  1, 12, 8, 2, 2] # MT 384x256
            - [16, 16, 32, 1, 1, 10, 10, 2, 2] # MT0=320  MT1=320
            - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT0=256  MT1=256
            - [16, 16, 32, 1, 1, 6, 6, 2, 2]   # MT0=192  256=192
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [640, 640, 1, 640]
            - Exact: [768, 640, 1, 512]
            - Exact: [521, 521, 1, 521]
            - Exact: [532, 64, 1, 64]

LibraryLogic:
  ScheduleName: "bench_fused_bf16_partialrms_residualadd"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
