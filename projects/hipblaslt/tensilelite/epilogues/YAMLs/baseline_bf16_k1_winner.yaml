# No-epilogue baseline matching the winning tile of epilogues_bf16_k1_winner.yaml.
# Same GEMM main loop (bf16 TN, MT 384x256x64, MI 16x16x32, MIWaveTile [12,8],
# MIWaveGroup [2,2], WorkGroup [32,8,1], PrefetchGlobalRead=2, DepthU=64,
# StreamK=3), but a plain GEMM store: bf16 D = A*B with NO fused epilogue
# (no PartialRMS sum-of-squares, no MXFP8 dynamic quant, no residual add,
# no second bf16 ResidualOut store, no subtile store path).
#
# This isolates the epilogue overhead: any GFlops/ASM delta vs the winner is
# attributable to the fused epilogue, since the accumulation loop is identical.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  ExitOnFails: 0
  PrintSolutionRejectionReason: True
  KernelTime: True
  KeepBuildTmp: True

BenchmarkProblems:

  -
    - # ProblemType — plain bf16 GEMM, f32 compute, bf16 out (no epilogue)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1,  1, 12, 8, 2, 2]  # MT 384x256 (matches winner)
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        # Keep the compact subtile store path so the main loop and LDS layout match
        # the winner exactly; the ONLY difference is the absent RMS/quant/residual
        # epilogue math. The standard (non-subtile) store needs ~8KB more LDS and
        # overflows the gfx950 163840 B limit at MT384x256 DU64 PGR2.
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192,  8192, 1, 8192]

LibraryLogic:
  ScheduleName: "baseline_bf16_winner_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
