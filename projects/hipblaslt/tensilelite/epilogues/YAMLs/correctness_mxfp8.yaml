#
# Correctness config for the RMSEpilogue on the MXFP8 dynamic-quant path.
# Mirrors epilogues_mxfp8_k1.yaml (MX-scaled fp8 A/B in, OCP fp8 e4m3 D out,
# f32 compute, residual add, bf16 ResidualOut) but with RMSEpilogue=True, giving
# the RMSEpilogue MXFP8 code path real CPU-validated correctness coverage
# (the benchmark configs do not validate it).
#
# MXFP8 quant is derived from DestDataType=F8 + UseRMSEpilogue (block shape always 32x1).
# Constraints: DestDataType=F8, UseBeta=False, MT0%64==0, WG0<=2,
# q1(=1) < mfmaN so subColQuant holds.
#
# Two WG2x2 tiles (MT0 in {256,384}, MT1=256) and two shapes: an even N_hidden
# (SizesFree0) and an odd N_hidden that straddles the bf16 ResidualOut pair-store
# boundary, exercising the half-word OOB fallback on the MXFP8 path.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 0
  PrintLevel: 3
  KernelTime: True
  PrintSolutionRejectionReason: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1

BenchmarkProblems:

  ########################################
  # MX-scaled fp8 in, OCP fp8 e4m3 out — PartialRMS + ResidualAdd + MXFP8 + StoreBf16D.
  # Single-pass RMSEpilogue (RMSEpilogue=True). WG2x2, MT1=256.
  ########################################
  -
    - # ProblemType — MX-scaled fp8 in, OCP fp8 e4m3 out, f32 compute, residual add, bf16 ResidualOut
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 128, 1, 1,  8,  8, 2, 2]  # MT0=256 MT1=256: mmaN=8 -> two streamGroups/qi
            - [16, 16, 128, 1, 1,  6,  4, 2, 2]  # MT0=192 MT1=128: mmaN=4 -> one streamGroup/qi
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        # PGR2 is rejected for multi-DU (DepthU=256, dataDU=128) with MT0>=192, so use PGR1.
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [256]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 512, 1, 512]
            - Exact: [521, 512, 1, 512]

LibraryLogic:
  ScheduleName: "correctness_mxfp8_mega_fused_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
