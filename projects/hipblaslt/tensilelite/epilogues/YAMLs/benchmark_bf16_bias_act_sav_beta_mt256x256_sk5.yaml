#
# Pin and benchmark the production bf16 TN GEMM kernel with fused epilogue:
#   bias (M-direction), hipblaslt_all activation, ScaleAlphaVec (M-direction),
#   beta, and SupportUserArgs — tile MT 256x256x64, StreamK=5, gfx950.
#
# NOTE: The target name below was generated by an OLDER version of
# getRequiredParametersMin() that included {StreamK, StreamKForceDPOnly,
# StreamKWorkStealing, StreamKXCCMapping} but lacked the ~11 params added later
# (TileProcessingStrategy, NonTemporalGate, WorkAssignment, etc.). The current
# toolchain cannot reproduce it verbatim; an Equality library entry built today
# will carry a different kernel name for the same physical kernel.
#
# Target kernel:
#   Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs_MT256x256x64_MI16x16x1_CMS_SN_
#   LDSB0_AFC1_AG0_AGGSUA0_AGNTAB0_AFEM1_AFEM1_ASEM1_BL1_BS1_CD1_1_CLR1_CLS0_CADS0_
#   DTLA1_DTLB1_DTLM0_DTVA0_DTVB0_DTVMXSA0_DTVMXSB0_DTVSM0_DPLB0_EPS0_ELFLR0_
#   EMLLn1_FDSI0_GRPM1_GRVWA8_GRVWB8_GSU0_GSUAMB_GLS0_HPLR0_ISA950_ICIW0_IU1_K1_
#   LDSTI0_LBSPPA1024_LBSPPB1024_LBSPPMXSA0_LBSPPMXSB0_LBSPPM0_LPA16_LPB16_
#   LPMXSA0_LPMXSB0_LPM0_LRVW8_LWPMn1_MIAV0_MIWT8_8_MXLIBL_MXSFNS_MO40_MGRIPM1_
#   NTn1_NTA1_NTB1_NTC4_NTD3_NTE0_NTMXSA0_NTMXSB0_NTM0_NTWS0_NVn1_NVA0_NVB0_NVC0_
#   NVD0_NVE0_NVMXSA0_NVMXSB0_NVM0_NVWS0_NEPBS12_NLCA1_NLCB1_ONLL1_PAP0_PGL0_PGR2_
#   PLR1_PKA1_SGROB0_SIA3_SS1_SPO0_SRVW0_SSO1_SVW8_SK5_SKFTR0_SKFDPO0_SKWS0_
#   SKXCCM8_SNLL0_SIP1_SGRO0_TDMI0_TDMIM0_TDMLWS0_TDMS0_TIN0_THn1_THA0_THB0_THC0_
#   THD0_THE0_THMXSA0_THMXSB0_THM0_THWS0_TLDS1_TLDSM1_ULSGRO0_USL1_USLMX0_UDFMAC0_
#   UIOFGRO0_UPLRP0_USFGRO0_USI0_VSn1_VWA8_VWB8_WSGRA0_WSGRB0_WS64_WG32_8_1_WGMXCC1

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 20
  NumWarmups: 20
  KernelTime: true
  NumElementsToValidate: -1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  DataInitTypeD: 12
  DataInitTypeBeta: 1
  DataInitTypeAlpha: 1
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  KeepBuildTmp: true
  RotatingBufferSize: 1024

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — bias + hipblaslt_all activation + ScaleAlphaVec + beta
  # MT 256x256x64, StreamK=5, DirectToLds A+B, gfx950.
  ########################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 1
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 1
      UseScaleD: False
      Sparse: 0
      Activation: True
      ActivationType: "hipblaslt_all"
      ActivationComputeDataType: s
      SupportUserArgs: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]  # MT 256x256
        - DepthU: [64]
        - DirectToLds: [1]
        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [0]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - GlobalSplitU: [0]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - InitCIterWmma: [0]
        - LdsBlockSizePerPadA: [1024]
        - LdsBlockSizePerPadB: [1024]
        - LdsBlockSizePerPadMXSA: [0]
        - LdsBlockSizePerPadMXSB: [0]
        - LdsBlockSizePerPadMetadata: [0]
        - LdsPadA: [16]
        - LdsPadB: [16]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - LdsPadMetadata: [0]
        - LocalReadVectorWidth: [8]
        - MaxOccupancy: [40]
        - MinGRIncPerMfma: [1]
        - MXLoadInst: ["BufferLoad"]
        - MXScaleFormat: ["NoSwizzle"]
        - NonTemporalA: [1]
        - NonTemporalB: [1]
        - NonTemporalC: [4]
        - NonTemporalD: [3]
        - NumElementsPerBatchStore: [12]
        - PreloadKernArgs: [True]
        - PrefetchGlobalRead: [2]
        - ScheduleGROverBarrier: [0]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreSyncOpt: [1]
        - StoreVectorWidth: [8]
        - StreamK: [5]
        - StreamKForceDPOnly: [0]
        - StreamKWorkStealing: [0]
        - StreamKXCCMapping: [8]
        - SwInstructionPrefetch: [1]
        - TileProcessingStrategy: ["StreamK"]
        - TransposeLDS: [1]
        - TransposeLDSMetadata: [1]
        - UseSgprForGRO: [0]
        - VectorWidthA: [8]
        - VectorWidthB: [8]
        - WorkGroupMappingXCC: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [2048, 16384, 1, 2048]
        - BiasTypeArgs: ['b']

LibraryLogic:
  ScheduleName: "epilogues_bf16_bias_act_sav_beta_mt256x256_sk5"
  DeviceNames: ["Device 75a0"]
  ArchitectureName: "gfx950"
  LibraryType: "Equality"
