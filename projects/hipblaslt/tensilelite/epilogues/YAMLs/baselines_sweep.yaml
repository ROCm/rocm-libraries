          - [16, 16, 32, 1,  1, 24, 4, 1, 4]  # MT 384x256
          - [16, 16, 32, 1,  1, 32, 2, 1, 4]  # MT 512x128
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

