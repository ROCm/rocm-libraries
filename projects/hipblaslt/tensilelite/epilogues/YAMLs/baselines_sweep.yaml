          - [16, 16, 32, 1,  1, 21, 4, 1, 4]  # MT 336x256
          - [16, 16, 32, 1,  1, 23, 4, 1, 4]  # MT 368x256
          - [16, 16, 32, 1,  1, 24, 4, 1, 4]  # MT 384x256
          - [16, 16, 32, 1,  1, 32, 2, 1, 4]  # MT 512x128
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - StaggerU: [0]
