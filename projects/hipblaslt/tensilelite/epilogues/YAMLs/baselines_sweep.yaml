          - [16, 16, 32, 1,  1, 4, 16, 2, 2]  # MT 128x512
          - [16, 16, 32, 1,  1, 9, 11, 2, 2]  # MT 288x352
          - [16, 16, 32, 1,  1, 11, 9, 2, 2]  # MT 352x288
          - [16, 16, 32, 1,  1, 9, 9, 2, 2]   # MT 288x288
          - [16, 16, 32, 1,  1, 14, 4, 2, 2]  # MT 448x128
          - [16, 16, 32, 1,  1, 12, 6, 2, 2]  # MT 384x192
          - [16, 16, 32, 1,  1, 13, 5,  2, 2] # MT 416x160
          - [16, 16, 32, 1,  1, 5, 13,  2, 2] # MT 160x416
          - [16, 16, 32, 1,  1, 13, 7,  2, 2] # MT 416x224
