          - [16, 16, 32, 1,  1, 16, 6, 1, 4]  # MT 256x384
          - [16, 16, 32, 1,  1, 13, 6, 1, 4]  # MT 208x384
          - [16, 16, 32, 1,  1, 17, 5, 1, 4]  # MT 272x320
          - [16, 16, 32, 1,  1, 19, 5, 1, 4]  # MT 304x320
