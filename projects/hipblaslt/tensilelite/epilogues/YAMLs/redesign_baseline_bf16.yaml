#
# Pinned single-solution baseline for the SubtileMegaFusedEmit.py batched/
# prefetched redesign (see epilogues/docs/SUBTILE_MEGAFUSED_BATCHED_REDESIGN.md).
# Fused: bf16 PartialRMS+ResidualAdd+StoreBf16D — RMSEpilogue path.
#
# Both shapes below share the same winning tile from the full benchmark_k1_bf16.yaml
# sweep (MT512x128, MI16x16x32, MIWaveTile[16,4], MIWaveGroup[2,2], PGR2) — they
# have equal total FLOPs (M*N*K), so the same solution wins both. Pinning it here
# (rather than re-sweeping) gives a fixed, reproducible before/after benchmarking
# target for the redesign's code changes.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 20
  NumWarmups: 20
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 12
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  PreciseKernelTime: false
  Device: 0
  KeepBuildTmp: true
  RotatingBufferSize: 1024

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 16, 4, 2, 2]  # MT 512x128 (winner for both shapes below)
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [2048, 16384, 1, 2048]
            - Exact: [4096, 4096, 1, 4096]

LibraryLogic:
  ScheduleName: "epilogues_rms_bf16_redesign_baseline"
  DeviceNames: ["Device 75a0"]
  ArchitectureName: "gfx950"
  LibraryType: "Equality"
