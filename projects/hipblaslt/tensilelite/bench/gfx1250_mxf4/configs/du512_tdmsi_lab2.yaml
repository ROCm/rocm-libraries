# TDMSingleIssuer + slide-22 WAVE_SCHED: DEP_MODE=2 AND DISABLE_XDL_ARB_STALL
# (bit 2). Prior builds only set DEP_MODE=2. Best: logs/20261029-192853
# (~1.017× vs noHead2 logs/20261029-160131, 10/10 validate).
# SIG_EARLY (hideWgpBarrierBehindWmma) slower — left unwired.
# FREE-hole (placeFreeBarrierAfterWmma n=1) wired: logs/20261029-203847
# (~1.015× vs esmBit2, 10/10; noisy 4/8). n=2: 20261029-203640 ~1.00×.
# Borrow-exit + CBW-early (s_sub; s_cbranch tail, cluster wait after signal):
# logs/20261029-212851 (bias = one L-=PGR+1, no exit restore). Prior:
# 20261029-211445 ~same timing; 20261029-210340 still had wait on the exit.
# Proto-style TDMSingleIssuer advance (A/B xor+add; MX rotate only, no shared
# nop template): logs/20261029-214154 — 10/10 validate; ~flat vs slimBias
# (alt_timing 0.9997×, 4/8). A/B body 7→3 SALU; MX drops dead xor.
# Spread advances into following WMMA holes (spreadTDMSingleIssuerAdvance):
# logs/20261030-143348 — 10/10 validate; ~flat vs protoAdv (0.996×, 3/8).
# MX sc_nbuf 3→2 + bake scale buf into even/odd ds immediates (gemm_wt
# mx_sbuf=2): logs/20261030-150303 — 10/10 validate; drops mid-loop MX
# rotate; ~0.986× vs slimBias (1/8).
# Post-READY ds glue across TDM-advance SALU (spreadPostReady):
# logs/20261030-153152 — 10/10 validate; hides READY b128 burst under K=3 WMMAs.
# Wave-gated GL2 PF (w2=A, w3=B; no MX) + spread after last LR / TDM-gap:
# logs/20261102-182618 — PrefetchGL2=2; gap=24 last-LR; 10/10; ~0.987× vs dsGlue (2/8).
# GL2 PF TDM-gap 24→8 + earliest post-gap LR hole: logs/20261102-183606
# (~0.979× vs slimBias) — worse; reverted placement to last-LR.
# GL2 PF gap=8 + last-LR: logs/20261102-200508 — 10/10 on GPU3; ~0.975× vs
# dsGlue (0/8) / ~0.974× vs slimBias (1/8). Gap alone does not move last-LR PF.
# Proto cluster pretdm + CBSIG_WMMA=16 (wait before FREE; signal ~16 WMMAs
# earlier): logs/20261102-222832 — 10/10 GPU3; ~0.988× vs dsGlue (2/8) /
# ~0.993× vs slimBias (3/8).
# + CBW_SIGONLY (wave0-only cluster wait; FREE holds peers):
# logs/20261102-224841 — 10/10 GPU3; ~0.979× vs dsGlue (0/8) /
# ~0.985× vs slimBias (1/8).
# Proto fine dscnt (ordinal done-watermark; loop-head hard 0; FREE proof
# strengthens nearest fine wait to dscnt=0, not glued on barrier):
# logs/20261103-162739 — 10/10 GPU1; ~0.991× vs dsGlue (1/8) /
# ~0.990× vs slimBias (1/8).
# Proto FREE+READY: relocateFreeToLastConsumer + mergeFreeReadyBarriers with
# tensorcntExactN at FREE (typically N=0; scheduler N=1 races once hoisted).
# logs/20261103-170617 reloc-only (MERGE skipped): ~1.006× vs dsGlue.
# MERGE+tcnt_exact N=0: logs/20261103-173332 — 10/10 GPU1; ~0.856× vs dsGlue
# (0/8) / ~0.843× vs slimBias (0/8) — correct but stalls (same class as forceDrain).
# Tighten dscnt: drop MERGE FREE harden to 0 (keep fine N at last-consumer);
# fine dscnt on NGLL/NLL (no WAR-slack advance). logs/20261104-160010 — 10/10
# GPU1; hard dscnt0 18→9; ~0.895× vs dsGlue (MERGE tcnt_exact N=0 stalls).
# Proto TDM hide: MERGE off — classic FREE→TDM→cover→wait_tensorcnt 1→READY
# (latency-hidden pipeline, not a drain). logs/20261104-163327 — 10/10 GPU1;
# ~1.010× vs dsGlue (5/8) / ~1.008× vs slimBias (5/8).
# SIG_EARLY wired (hideWgpBarrierBehindWmma): drain; signal; WMMAs; wait.
# FREE-hole + READY pre-drain. logs/20261104-165639 — 10/10 GPU1; vs dsGlue 0.9991x (4/8); vs slimBias 1.0125x (7/8).
# Align arrival: CBW_SIGONLY off (all-wave cluster wait) + defer SI advances
# past READY (spreadTDM). logs/20261104-180525 — 10/10 GPU1; vs dsGlue 1.0049x (6/8); vs slimBias 0.9902x (3/8).
# Proto roles (gemm_wt mx_v7): TDM A/B on 0/2; scale TDM + GL2 PF on 1/3
# (mx_wave = pf_wave). Dual-issue A+MX on 0/2 (dedicated MX Group0/1/2) stayed
# prologue-only (2/10) through unalias/stash/iterate-rearm/tcnt0 — abandoned.
# logs/20261105-202520 — 10/10 GPU1 (all-wave wait_tensorcnt; 90 SGPRs);
# alt_timing median ~167 us (6×5w/20e) — same class as prior MX-on-PF.
# SwInstructionPrefetch:[1] wired (InstructionPrefetch.py) but left Off here:
# vs SIP=0 twin logs/20261105-213051 was ~1.002× (3/6) — noise. Proto preloop
# reorder (MT1→GL2→LR→dscnt0, logs/20261105-220052) also ~flat / slightly
# slower; reverted to classic LR→Skip→MT1→GL2.
# Absolute fastest (patched, not this generator line):
#   logs/20261023-211741-sclds4-sclds4 — hist. 155 us / 14.19 PF; GPU1 reconfirm
#   ~161.6 us / 13.61 PF. Symlinks logs/t-fastest + logs/t-mxpf.
# Best generator TDMSI keep: logs/20261105-213051 (~165–167 us / ~13.2 PF).
# Proto TDM-hide MERGE-off peak vs dsGlue: logs/20261104-163327 ~1.010× (5/8).
GlobalParameters:
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 100 #1
  NumWarmups: 100 #0
  NumElementsToValidate: 0
  PrintLevel: 3
  Device: 1
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [32, 16, 128, 1,  1, 4, 8,  2, 2]  # MT 256x256  WG 2x2  WT 4x8
          # - [16, 16, 32, 1,  1, 8, 8,  2, 2]  # MT 256x256  WG 2x2  WT 4x8
        - DepthU: [512]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        # PGR=2 + PGL=2 on DU512 ≈ proto 8×DU256 lead (slide 19).
        - PrefetchGL2: [2]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - ClusterDim: [[2, 4]]
        - LDSSegmentInterleave: [0]
        - TDMSingleIssuer: [1]
        - LRLookaheadB: [2]
        - TDMInst: [3]
        - SourceSwap: [false]
        - StaggerU: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - PreloadKernArgs: [False]
        - SwInstructionPrefetch: [0]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # - Exact: [4096, 4096, 1, 8192]
          - Exact: [4096, 4096, 1, 65536]
