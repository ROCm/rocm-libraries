# gfx1250 TN MXF4 subtile — ATT / rocprofv3 client config.
#
# Macrotile 256x256x256 (32x16 WMMA, WT 4x8, WG 2x2, DepthU=256).
# Problem 4096x4096x8192. Validation is off so rocprof only sees GEMM launches.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-stinkytofu]

GlobalParameters:
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 1
  NumWarmups: 1
  NumElementsToValidate: 0
  PrintLevel: 2
  Device: 0   # first visible GPU; run.sh sets HIP_VISIBLE_DEVICES=2
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [32, 16, 128, 1,  1, 4, 8,  2, 2]  # MT 256x256  WG 2x2  WT 4x8
        - DepthU: [256]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - StreamK: [3]
        - TDMInst: [3]
        - SourceSwap: [false]
        - StaggerU: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - PreloadKernArgs: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 4096, 1, 8192]
