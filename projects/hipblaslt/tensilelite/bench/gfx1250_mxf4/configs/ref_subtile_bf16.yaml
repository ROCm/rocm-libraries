# Reference: subtile BF16 (subtile_bf16_gfx1250_bench.yaml, single variant), MT 256x256 WG 2x2 TDM.
# Used to compare the A/B local-read lane->row mapping and LDS conflict counters.
GlobalParameters:
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 10
  NumWarmups: 10
  NumElementsToValidate: 0
  PrintLevel: 2
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]  # MT 256x256 WG 2x2
        - DepthU: [128]
        - WavefrontSize: [32]
        - PrefetchGL2: [0]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - PreloadKernArgs: [True]
        - UseSubtileImpl: [True]
        - StreamK: [0]
        - TDMInst: [3]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 4096, 1, 8192]
