# rocprofv3 Advanced Thread Trace (ATT) job.
# gfx1250: --att-perfcounters is gfx9-only; instruction-level SQTT is still collected.
jobs:
  - advanced_thread_trace: true
    kernel_include_regex: "Cijk"
    kernel_exclude_regex: ""
    truncate_kernels: true
    att_consecutive_kernels: 1
    att_target_cu: 1            # CU 0 records nothing on gfx1250 (empty .att files)
    att_shader_engine_mask: "0x1"
    att_simd_select: "0xF"
    att_buffer_size: "0x40000000"
    output_format:
      - json
      - csv
    log_level: info
