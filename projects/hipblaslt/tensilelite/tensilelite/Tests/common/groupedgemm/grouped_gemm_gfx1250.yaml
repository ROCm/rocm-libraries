# Grouped gemm with kernarg preload on gfx1250, launched with ArgType 1 (HBM arg table).
# The preload reaches past Alpha only on gfx1250 (MaxSgprPreload 32), so the gemm search
# must still wait for the reloaded args; a group needs many gemms to expose a missing wait.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintSolutionRejectionReason: True
  UseUserArgs: False

BenchmarkProblems:
  # SupportUserArgs: True, 256 gemms in one group
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      GroupedGemm: True
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - PreloadKernArgs: [True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [ [64, 64, 512], [64, 64, 512], [1], [64, 64, 256] ]

  # SupportUserArgs: False, 256 gemms in one group
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      GroupedGemm: True
      SupportUserArgs: False

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - PreloadKernArgs: [True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [ [64, 64, 512], [64, 64, 512], [1], [64, 64, 256] ]
