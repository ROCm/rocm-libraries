TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitValueActivationArgs: [0.5, -1]
  DataInitTypeGate: 3
  PruneSparseMode: 0

BenchmarkProblems:
  -
    - # ProblemType SPB NN
      OperationType: GEMM
      DataType: H
      DestDataType: H
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Sparse: 2
      UseGateResidual: True
      GateResidualDataTypeList: ['h']
      Batched: True
      Activation: True
      ActivationType: all
      UseBias: 3
      UseScaleAlphaVec: 3
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  1, 1,  1, 1 ]
          - [16, 16, 32, 1,  1,  8, 8,  2, 2 ]
        - DepthU: [32, 64]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [3]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [-1]
        - GlobalSplitU: [1, 2]
        - GlobalSplitUAlgorithm: [MultipleBuffer, MultipleBufferSingleKernel]
        - 1LDSBuffer: [-1]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [18]
        - StoreVectorWidth: [-1]
        - AssertFree0ElementMultiple: [8]
        - AssertFree1ElementMultiple: [8]
        - SourceSwap: [true]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 16] # classic format
          - Exact: [16, 16, 1, 32] # classic format
          - Exact: [16, 16, 1, 64] # classic format
          - Exact: [16, 16, 1, 72] # classic format
          - Exact: [256, 256, 1, 16] # classic format
          - Exact: [256, 256, 1, 32] # classic format
          - Exact: [256, 256, 1, 64] # classic format
          - Exact: [256, 256, 1, 72] # classic format
          - Exact: [264, 264, 1, 16] # partial tile (256+8): full + edge tiles in one launch
          - Exact: [264, 264, 1, 32] # partial tile (256+8): full + edge tiles in one launch
          - Exact: [264, 264, 1, 64] # partial tile (256+8): full + edge tiles in one launch
          - Exact: [264, 264, 1, 72] # partial tile (256+8): full + edge tiles in one launch
        - BiasTypeArgs: ['h']
        - GateTypeArgs: ['h']
        - FactorDimArgs: [0]
        - ActivationArgs:
          - [Enum: none]

