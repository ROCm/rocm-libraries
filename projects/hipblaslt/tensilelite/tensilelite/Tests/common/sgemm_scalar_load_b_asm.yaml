#
# ScalarLoadB: f32 source (MAC) kernels that read B with scalar loads into SGPRs and use it as the
# scalar operand of the FMAs. SubGroup0 is the wavefront size, so the tile-1 index is constant
# within a wave. Covers B contiguous along the summation index (TransposeB False) and along the
# tile index (TransposeB True), single and dual-issue FMAs, the cache-warming load and both
# prefetch depths. N is a multiple of MacroTile1 and K a multiple of DepthU: ScalarLoadB kernels
# have neither edge tiles along B nor a tail loop.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1250, skip-gfx1250-strict] # wave32 source kernels on gfx11

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  CMakeBuildType: Release
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: True
  PrintWinnersOnly: True

BenchmarkProblems:

  ########################################
  # TN - f32 source kernels, B from SGPRs
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: False
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - ScalarLoadB: [2, 4]
        - ScalarLoadBPrefetch: [0]
        - UseDualFMAC: [False, True]
        - GlobalReadVectorWidthA: [2]
        - GlobalReadVectorWidthB: [1]
        - VectorWidthA: [2]
        - VectorWidthB: [2]
        - LocalReadVectorWidth: [2]
        - StoreVectorWidth: [1]
        - ScheduleIterAlg: [1]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - OptNoLoadLoop: [0]
        - StaggerU: [0]
        - ThreadTile:
          - [16, 8]
        - WorkGroup:
          - [32, 16, 1]
        - DepthU: [8]
        - LdsPadA: [4]
        - NumElementsPerBatchStore: [8]
        - WorkGroupMapping: [1]
        - GlobalSplitU: [1]
        - AssertFree1ElementMultiple: [128]
        - AssertSummationElementMultiple: [8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 128, 1, 8]          # one tile, one unrolled iteration
          - Exact: [512, 128, 1, 16]
          - Exact: [1024, 384, 1, 24]
          - Exact: [1024, 384, 2, 264]         # batched
          - Exact: [1019, 384, 1, 16]          # partial tile along A

  ########################################
  # TN prefetch - f32 source kernels, B from SGPRs
