# Every tile must remain whole when the caller supplies no partials workspace.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  HybridAssignmentPolicy: [DynamicWorkQueue]
  # Timed enqueues are intentional: validate output and synchronizer reuse
  # after consecutive launches of the same kernel.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 4
  NumElementsToValidate: -1
  BoundsCheck: 1
  CheckSynchronizer: True
  ValidateAfterEnqueues: True
  KernelTime: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  CEqualD: False
  MaxWorkspaceSize: 0
  # Reuse the synchronizer across warmups and revisit every problem/solution.
  # CheckSynchronizer validates queue counters and partial-ready flags.
  NumWarmups: 4
  NumBenchmarks: 2
  SleepPercent: 0

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue, Hybrid]
        - WorkQueueStealing: [0, 1]
        - GlobalSplitU: [0]
        # MT 128x128; DepthU 16 makes K=145 and K=257 uneven splits with tails.
        - MatrixInstruction: [[32, 32, 2, 1, 1, 2, 2, 2, 2]]
        - DepthU: [16]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [-1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # Tiny grids, nonuniform queue occupancy, batched and M/N edge tiles.
          - Exact: [128, 128, 1, 512]
          - Exact: [128, 384, 3, 145]
          - Exact: [255, 257, 2, 257]
          # 16 tiles * two partials * 128*128*4 bytes = exactly 2 MiB.
          - Exact: [256, 512, 2, 145]
