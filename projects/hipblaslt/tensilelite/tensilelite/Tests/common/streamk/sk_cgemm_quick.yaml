TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50
  PrintSolutionRejectionReason: True

BenchmarkProblems:

  - # cgemm NN
    - # ProblemType
      OperationType: GEMM
      DataType: C
      DestDataType: C
      ComputeDataType: C
      UseBeta: True
      Batched: True
      TransposeA: False
      TransposeB: False
      ComplexConjugateA: False
      ComplexConjugateB: False

    - # cgemm NN - Test MatrixInstruction variants
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4, 4, 2, 2]
        - ScheduleIterAlg: [3]
        - MIArchVgpr: [false]
        - GlobalSplitU: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [16]
        - StreamK: [3]
        - StreamKFixupTreeReduction: [0, 1]
        - WorkGroupMapping: [1]
        - 1LDSBuffer: [1]
        - SourceSwap: [True]
        - TransposeLDS: [0]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 4096]
          - Exact: [129, 129, 1, 4100]

