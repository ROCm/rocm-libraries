# Alpha=0 must preserve finite bias sums and D=beta*C despite NaN in the unused input.
# Pointer-array shapes use fresh clients; correlate SK/PGR1 and DP/PGR2 without a cross-product.
TestParameters:
  streamk_schedules: [{grid: 32, reduction: tree}]
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a,
          skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950,
          skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030,
          skip-gfx1100, skip-gfx1101, skip-gfx1102,
          skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]
GlobalParameters: {Architecture: gfx1250, BatchMode: 1, SyncsPerBenchmark: 0,
  NumElementsToValidate: -1, KernelTime: false, DataInitTypeA: 4, DataInitTypeB: 3,
  DataInitTypeC: 1, DataInitTypeD: 2, DataInitTypeAlpha: 0, DataInitTypeBeta: 1,
  ForceGenerateKernel: true, CpuThreads: 8, PrintLevel: 1, NumWarmups: 1,
  NumBenchmarks: 1, EnqueuesPerSync: 1, PrintSolutionRejectionReason: true}
BenchmarkProblems:
- -
    OperationType: GEMM
    DataType: h
    DestDataType: h
    ComputeDataType: s
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Batched: true
    Gradient: true
    UseBias: 1
    SetConstStrideBias: [[2, -1]]
    BiasSrc: B
  - &pointer_array_case
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - MatrixInstruction: [[16, 16, 32, 1, 1, 1, 1, 1, 1]]
    - DepthU: [64]
    - Groups:
      - - {TileProcessingStrategy: StreamK, PrefetchGlobalRead: 1, StreamKFixupTreeReduction: 1}
        - {TileProcessingStrategy: DataParallel, PrefetchGlobalRead: 2, StreamKFixupTreeReduction: 0}
    - WorkAssignment: [StaticGrid]
    - ClusterDim: [[2, 2]]
    - TDMInst: [3]
    - WavefrontSize: [32]
    - GlobalSplitU: [0]
    - StaggerU: [0]
    - PrefetchLocalRead: [1]
    - ForceDisableShadowInit: [false]
    - ScheduleIterAlg: [0]
    - SourceSwap: [false]
    - ExpandPointerSwap: [false]
    - 1LDSBuffer: [0]
    - PrefetchAcrossPersistent: [0]
    BenchmarkFinalParameters:
    - ProblemSizes: [{Exact: [16, 16, 1, 1024]}]
    - BiasTypeArgs: [s]

  - <<: *pointer_array_case
    BenchmarkFinalParameters:
    - ProblemSizes: [{Exact: [17, 17, 2, 1031]}]
    - BiasTypeArgs: [s]

  - <<: *pointer_array_case
    BenchmarkFinalParameters:
    - ProblemSizes: [{Exact: [17, 17, 1, 31]}]
    - BiasTypeArgs: [s]

  - <<: *pointer_array_case
    BenchmarkFinalParameters:
    - ProblemSizes: [{Exact: [17, 17, 2, 0]}]
    - BiasTypeArgs: [s]
