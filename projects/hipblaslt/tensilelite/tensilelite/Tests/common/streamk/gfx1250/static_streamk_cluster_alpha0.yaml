# Alpha-zero retains beta*C through whole-block and split completion.
TestParameters:
  streamk_schedules:
    - {grid: 128, reduction: parallel}
    - {grid: 256, reduction: parallel, parameters: {DataInitTypeAlpha: 2, DataInitTypeBeta: 2}}
    - {grid: 128, reduction: whole, parameters: {MaxWorkspaceSize: 0}}
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941,
    skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030,
    skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]
GlobalParameters: {Architecture: gfx1250, SyncsPerBenchmark: 0, NumElementsToValidate: -1,
  KernelTime: false, DataInitTypeA: 3, DataInitTypeB: 3, DataInitTypeC: 3, DataInitTypeD: 2,
  DataInitTypeAlpha: 0, DataInitTypeBeta: 1, ForceGenerateKernel: true, CpuThreads: 8,
  PrintLevel: 1, NumWarmups: 1, NumBenchmarks: 1, EnqueuesPerSync: 1, PrintSolutionRejectionReason: true}
BenchmarkProblems:
- - &dense_problem {OperationType: GEMM, DataType: b, DestDataType: s, ComputeDataType: s, HighPrecisionAccumulate: true,
    TransposeA: true, TransposeB: false, UseBeta: true, Batched: true}
  - BenchmarkCommonParameters: &cluster_defaults
    - KernelLanguage: [Assembly]
    - MatrixInstruction:
      - [16, 16, 32, 1, 1, 1, 1, 2, 2]
    - DepthU: [64]
    - TileProcessingStrategy: [StreamK]
    - WorkAssignment: [StaticGrid]
    - TDMInst: [3]
    - WavefrontSize: [32]
    - WorkGroupMapping: [1]
    - GlobalSplitU: [0]
    - StaggerU: [0]
    - PrefetchGlobalRead: [1]
    - PrefetchLocalRead: [1]
    - ForceDisableShadowInit: [false]
    - ScheduleIterAlg: [4]
    - 1LDSBuffer: [0]
    - ExpandPointerSwap: [false]
    - StoreRemapVectorWidth: [0]
    - StreamKFixupTreeReduction: [0]
    - PrefetchAcrossPersistent: [0]
    ForkParameters:
    - ClusterDim:
      - [2, 1]
      - [2, 2]
    - StreamKFixupTreeReduction: [0, 1]
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [33, 65, 2, 8192]
      - Exact: [96, 96, 1, 64]
# High-register MX kernels spill the parallel split count into a VGPR.
- - {<<: *dense_problem, DataType: F4, MXBlockA: 32, MXBlockB: 32}
  - BenchmarkCommonParameters: *cluster_defaults
    ForkParameters:
    - MatrixInstruction: [[16, 16, 128, 1, 1, 4, 4, 2, 2]]
    - DepthU: [256]
    - ClusterDim: [[2, 1], [2, 2]]
    - PrefetchGlobalRead: [2]
    - ForceDisableShadowInit: [true]
    - ScheduleIterAlg: [0]
    - StreamKFixupTreeReduction: [1]
    BenchmarkFinalParameters:
    - ProblemSizes: [{Exact: [256, 512, 1, 65536]}]
