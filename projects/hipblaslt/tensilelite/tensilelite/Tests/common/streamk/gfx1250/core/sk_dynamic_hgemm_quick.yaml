TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # gfx1250 only

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  CpuThreads: 32
  KernelTime: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50

BenchmarkProblems:

  - # HGEMM NT
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # HGEMM NT - dynamic Stream-K queue, MatrixInstruction variants
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - 1LDSBuffer: [0]
        - DepthU: [ 32 ]
        - ExpandPointerSwap: [False]
        - GlobalSplitU: [0]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1,1, 1, 2]
          - [16, 16, 32, 1, 1, 1,1, 2, 1]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [True, False]
        - StoreRemapVectorWidth: [0]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue]
        - TransposeLDS: [0]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [511, 511, 1, 511]
          - Exact: [512, 512, 1, 512]
          - Exact: [513, 513, 1, 513]
          - Exact: [512, 512, 1, 4096] # large K: many queue work-items, stresses the atomic counter
          - Exact: [512, 512, 2, 128]  # batched

    - # HGEMM NT - dynamic Stream-K queue, DepthU / WorkGroupMapping / VectorWidth sweep
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - 1LDSBuffer: [0]
        # Pairwise cover of the full parameter grid, written by scripts/sparsify_fork_grid.py.
        # Every pair of values that is valid together appears in at least one row.
        - Groups:
          -
            - {DepthU: 32, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 0}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 0}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 1}
            - {DepthU: 32, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 2}
            - {DepthU: 32, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 4}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, SourceSwap: true, WorkGroupMapping: 4}
            - {DepthU: 32, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 8}
            - {DepthU: 32, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 16}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 16}
            - {DepthU: 32, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 32}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, SourceSwap: true, WorkGroupMapping: 32}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 64}
            - {DepthU: 64, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, SourceSwap: true, WorkGroupMapping: 1}
            - {DepthU: 64, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 2}
            - {DepthU: 64, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 8}
            - {DepthU: 64, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 0, SourceSwap: true, WorkGroupMapping: 64}
            - {DepthU: 32, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 0, SourceSwap: false, WorkGroupMapping: 1}
            - {DepthU: 32, GlobalReadVectorWidthA: 8, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 4, SourceSwap: false, WorkGroupMapping: 2}
            - {DepthU: 32, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, SourceSwap: false, WorkGroupMapping: 8}
            - {DepthU: 32, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, SourceSwap: false, WorkGroupMapping: 64}
            - {DepthU: 64, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 8, ScheduleIterAlg: 4, SourceSwap: false, WorkGroupMapping: 0}
            - {DepthU: 64, GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 0, SourceSwap: false, WorkGroupMapping: 4}
            - {DepthU: 64, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, SourceSwap: false, WorkGroupMapping: 16}
            - {DepthU: 64, GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 0, SourceSwap: false, WorkGroupMapping: 32}
        - ExpandPointerSwap: [False]
        - GlobalSplitU: [0]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4,4, 1,2]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue]
        - TransposeLDS: [0]
        - WavefrontSize: [32]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
