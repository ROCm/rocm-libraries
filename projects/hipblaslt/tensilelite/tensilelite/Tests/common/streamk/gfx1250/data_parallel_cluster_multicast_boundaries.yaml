# Exercise the cluster loop with shadow initialization enabled, including an
# empty summation. BF16 avoids the MX data generator, which rejects zero sizes.
# Uneven M/N tile counts leave peers that must load but not store;
# the larger batched case covers repeated blocks when the selected grid is smaller.
# Set TENSILE_PERSISTENT_FIXED_GRID=4 in the client environment to force repetition.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx1250
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  ForceGenerateKernel: True

BenchmarkProblems:
  - - &dp_problem
      OperationType: GEMM
      DataType: b
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters: &dp_defaults
        - KernelLanguage: [Assembly]
        - MatrixInstruction: [[16, 16, 32, 1, 1, 1, 1, 2, 2]]
        - DepthU: [64]
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - GlobalSplitU: [0]
        - StaggerU: [0]
        - PrefetchLocalRead: [1]
        - ForceDisableShadowInit: [False]
        - ScheduleIterAlg: [4]
        - 1LDSBuffer: [0]
        - ExpandPointerSwap: [False]
        - StoreRemapVectorWidth: [0]
      ForkParameters:
        - ClusterDim: [[4, 1], [2, 2], [1, 4]]
        - PrefetchGlobalRead: [1, 2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [96, 96, 3, 0]
          - Exact: [96, 96, 3, 64]
          - Exact: [1056, 320, 3, 1056]

    # Shared one-wave descriptor/barrier paths; PGR1 also folds increments.
    - BenchmarkCommonParameters: *dp_defaults
      ForkParameters:
        - MatrixInstruction: [[16, 16, 32, 1, 1, 1, 1, 1, 1]]
        - ClusterDim: [[2, 2]]
        - PrefetchGlobalRead: [1]
        - ForceDisableShadowInit: [true]
      BenchmarkFinalParameters: &dp_one_wave_problems
        - ProblemSizes:
          - Exact: [33, 65, 2, 1031]
          - Exact: [1056, 320, 3, 1056]
    - BenchmarkCommonParameters: *dp_defaults
      ForkParameters:
        - MatrixInstruction: [[16, 16, 32, 1, 1, 1, 1, 1, 1]]
        - ClusterDim: [[2, 2]]
        - PrefetchGlobalRead: [2]
      BenchmarkFinalParameters: *dp_one_wave_problems
    # N-only PAP retains A multicast; the host uses one block per cluster.
    - BenchmarkCommonParameters: *dp_defaults
      ForkParameters:
        - ClusterDim: [[1, 4]]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [1]
      BenchmarkFinalParameters: *dp_one_wave_problems
  # DP remap needs the two-byte final D shift and has no GSULog2BpeD register.
  - - {<<: *dp_problem, DestDataType: b}
    - BenchmarkCommonParameters: *dp_defaults
      ForkParameters:
        - ClusterDim: [[2, 2]]
        - PrefetchGlobalRead: [1]
        - ForceDisableShadowInit: [true]
        - StoreRemapVectorWidth: [4]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [33, 65, 2, 1031]
