TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50

BenchmarkProblems:

  - # SGEMM NT
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SGEMM NT - Test MatrixInstruction variants
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 64 ]
        - 1LDSBuffer: [0]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1,1, 1,2]
          - [16, 16, 4, 1, 1, 1,1, 2,1]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3, 4]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WorkGroupMapping: [1]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [511, 511, 1, 511]
          - Exact: [512, 512, 1, 512]
          - Exact: [513, 513, 1, 513]

    - # SGEMM NT - Test DepthU, WGM, VW
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 16 ]
        - 1LDSBuffer: [0]
        - ExpandPointerSwap: [False]
        # Pairwise cover of the full parameter grid, written by scripts/sparsify_fork_grid.py.
        # Every pair of values that is valid together appears in at least one row.
        - Groups:
          -
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 1, VectorWidthB: 1, WorkGroupMapping: 0}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 4, WorkGroupMapping: 0}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, VectorWidthA: 2, VectorWidthB: 2, WorkGroupMapping: 0}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 2, VectorWidthB: 1, WorkGroupMapping: 1}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 4, WorkGroupMapping: 1}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, VectorWidthA: 1, VectorWidthB: 2, WorkGroupMapping: 1}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 2, VectorWidthB: 4, WorkGroupMapping: 2}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 3, VectorWidthA: 1, VectorWidthB: 2, WorkGroupMapping: 2}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, VectorWidthA: 4, VectorWidthB: 1, WorkGroupMapping: 2}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 2, WorkGroupMapping: 4}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 3, VectorWidthA: 2, VectorWidthB: 4, WorkGroupMapping: 4}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, VectorWidthA: 1, VectorWidthB: 1, WorkGroupMapping: 4}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 3, VectorWidthA: 1, VectorWidthB: 4, WorkGroupMapping: 8}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 3, VectorWidthA: 2, VectorWidthB: 2, WorkGroupMapping: 8}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 4, VectorWidthA: 4, VectorWidthB: 1, WorkGroupMapping: 8}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 3, VectorWidthA: 1, VectorWidthB: 4, WorkGroupMapping: 16}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 2, WorkGroupMapping: 16}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 4, VectorWidthA: 2, VectorWidthB: 1, WorkGroupMapping: 16}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 1, VectorWidthB: 1, WorkGroupMapping: 32}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 4, WorkGroupMapping: 32}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 4, VectorWidthA: 2, VectorWidthB: 2, WorkGroupMapping: 32}
            - {GlobalReadVectorWidthA: 1, GlobalReadVectorWidthB: 1, ScheduleIterAlg: 3, VectorWidthA: 2, VectorWidthB: 1, WorkGroupMapping: 64}
            - {GlobalReadVectorWidthA: 2, GlobalReadVectorWidthB: 2, ScheduleIterAlg: 3, VectorWidthA: 4, VectorWidthB: 2, WorkGroupMapping: 64}
            - {GlobalReadVectorWidthA: 4, GlobalReadVectorWidthB: 4, ScheduleIterAlg: 4, VectorWidthA: 1, VectorWidthB: 4, WorkGroupMapping: 64}
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4,4, 1,2]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [511, 511, 1, 511]
          - Exact: [512, 512, 1, 512]
          - Exact: [513, 513, 1, 513]
