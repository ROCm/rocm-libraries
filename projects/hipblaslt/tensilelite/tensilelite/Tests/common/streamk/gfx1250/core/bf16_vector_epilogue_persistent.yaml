# PAP1 must keep bias/SAV scratch outside both live compute banks.
# PAP0 must synchronize vector reads before compute reuses their LDS.
# Default grid selection reproduces PAP0 at M=N=8192 and PAP1 at M=N=4352.
# Exercise short/long K tails and even/odd full-tile K iteration counts.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950,
    skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102,
    skip-gfx1200, skip-gfx1201]
GlobalParameters:
  SyncsPerBenchmark: 0
  NumBenchmarks: 20
  CEqualD: false
  DataInitValueActivationArgs: [0.0, 0.0]
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: false
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  PrintSolutionRejectionReason: true
  ForceGenerateKernel: true
BenchmarkProblems:
- - OperationType: GEMM
    DataType: b
    DestDataType: b
    ComputeDataType: s
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Batched: true
    SupportUserArgs: true
    UseBias: 1
    BiasDataTypeList: [s, b]
    UseScaleAlphaVec: 1
    Activation: true
    ActivationType: hipblaslt_all
    ActivationComputeDataType: s
  - InitialSolutionParameters: null
    BenchmarkCommonParameters: &kernel_parameters
    - KernelLanguage: [Assembly]
    - MatrixInstruction:
      - [16, 16, 32, 1, 1, 8, 8, 2, 2]
    - DepthU: [128]
    - 1LDSBuffer: [0]
    - ActivationFuncCall: [true]
    - ClusterDim:
      - [1, 1]
    - ClusterLocalRead: [0]
    - DirectToVgprA: [false]
    - DirectToVgprB: [false]
    - ExpandPointerSwap: [false]
    - GlobalSplitU: [0]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadA: [1024]
    - LdsBlockSizePerPadB: [1024]
    - LdsPadA: [8]
    - LdsPadB: [8]
    - MaxOccupancy: [40]
    - PrefetchGlobalRead: [2]
    - PrefetchLocalRead: [1]
    - ScheduleIterAlg: [4]
    - SourceSwap: [false]
    - StoreRemapVectorWidth: [0]
    - StoreVectorWidth: [8]
    - WorkAssignment: [StaticGrid]
    - SuppressNoLoadLoop: [false]
    - TDMInst: [3]
    - TDMIterateMode: [0]
    - TDMLoadWaveSync: [false]
    - TDMSplit: [false]
    - TransposeLDS: [1]
    - UseSubtileImpl: [false]
    - VectorWidthA: [4]
    - VectorWidthB: [4]
    - WavefrontSize: [32]
    - DirectToLds: [0]
    - StaggerU: [0]
    - WorkGroupMapping: [8]
    ForkParameters:
    - Groups:
      - - TileProcessingStrategy: DataParallel
          PrefetchAcrossPersistent: 0
          HalfPLR: 0
        - TileProcessingStrategy: DataParallel
          PrefetchAcrossPersistent: 0
          HalfPLR: 2
        - TileProcessingStrategy: StreamK
          PrefetchAcrossPersistent: 0
          HalfPLR: 0
        - TileProcessingStrategy: StreamK
          PrefetchAcrossPersistent: 0
          HalfPLR: 2
    BenchmarkForkParameters: null
    JoinParameters: null
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact:
          sizes: [8192, 8192, 1, 192]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 8192, 0]
          stridesD: [1, 8192, 0]
      - Exact:
          sizes: [8192, 8192, 1, 256]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 8192, 0]
          stridesD: [1, 8192, 0]
      - Exact:
          sizes: [8192, 8192, 1, 288]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 8192, 0]
          stridesD: [1, 8192, 0]
      - Exact:
          sizes: [8192, 8192, 1, 384]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 8192, 0]
          stridesD: [1, 8192, 0]
    - BiasTypeArgs: [s]
    - ActivationArgs:
      - - Enum: none
  - InitialSolutionParameters: null
    BenchmarkCommonParameters: *kernel_parameters
    ForkParameters:
    # HalfPLR + PAP is supported only by DataParallel.
    - Groups:
      - - TileProcessingStrategy: DataParallel
          PrefetchAcrossPersistent: 1
          HalfPLR: 0
        - TileProcessingStrategy: DataParallel
          PrefetchAcrossPersistent: 1
          HalfPLR: 2
        - TileProcessingStrategy: StreamK
          PrefetchAcrossPersistent: 1
          HalfPLR: 0
    BenchmarkForkParameters: null
    JoinParameters: null
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact:
          sizes: [4352, 4352, 1, 192]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 4352, 0]
          stridesD: [1, 4352, 0]
      - Exact:
          sizes: [4352, 4352, 1, 256]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 4352, 0]
          stridesD: [1, 4352, 0]
      - Exact:
          sizes: [4352, 4352, 1, 288]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 4352, 0]
          stridesD: [1, 4352, 0]
      - Exact:
          sizes: [4352, 4352, 1, 384]
          stridesA: [1, 384, 0]
          stridesB: [1, 384, 0]
          stridesC: [1, 4352, 0]
          stridesD: [1, 4352, 0]
    - BiasTypeArgs: [s]
    - ActivationArgs:
      - - Enum: none
