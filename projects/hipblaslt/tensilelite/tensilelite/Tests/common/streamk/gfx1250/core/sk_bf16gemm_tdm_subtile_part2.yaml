TestParameters:
  streamk_schedules: [{grid: 128, reduction: tree}]
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict, skip-stinkytofu] # gfx1250 only

GlobalParameters:
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  SyncsPerBenchmark: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  #######################################
  # TN - bf16 in/out, fp32 compute (BBS)
  #######################################
  -
    - # ProblemType, TN (Cijk_Alik_Bljk)
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0
    - BenchmarkCommonParameters: &subtile_cluster_defaults
        - KernelLanguage: [Assembly]
        - MatrixInstruction: [[16, 16, 32, 1, 1, 3, 3, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LDSTrInst: [true]
        - SourceSwap: [true]
        - UseSubtileImpl: [true]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - ClusterDim: [[2, 2]]
        - PrefetchAcrossPersistent: [0]
        - PrefetchLocalRead: [1]
        - ForceDisableShadowInit: [true]
        - ScheduleIterAlg: [3]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - StaggerU: [0]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - ExpandPointerSwap: [false]
        - 1LDSBuffer: [0]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
      ForkParameters:
        - PrefetchGlobalRead: [2]
        - StreamKFixupTreeReduction: [1]
      BenchmarkFinalParameters: &subtile_cluster_problems
        - ProblemSizes:
          - Exact: [97, 193, 2, 1031]
          - Exact: [384, 384, 2, 8192]
