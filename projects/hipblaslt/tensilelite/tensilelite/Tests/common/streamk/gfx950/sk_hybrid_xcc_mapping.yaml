# Both Hybrid modes must remap workgroups using their own grid argument slot.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  CpuThreads: 8
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  HybridAssignmentPolicy: [Default, DynamicWorkQueue]

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [Hybrid]
        - PersistentXCCMapping: [3, 8]
        - GlobalSplitU: [0]
        - DepthU: [16]
        - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 512]
          - Exact: [1153, 897, 1, 1031]
