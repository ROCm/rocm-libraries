#
# sk_hybrid_dynamic_parallel.yaml for HPA bf16: fp32 compute, bf16 D. The
# parallel reduction stores fp32 partials to the workspace and PostGSU writes
# the bf16 D, so the workspace element size differs from D's. Same split
# shapes: at most CUs / 4 tiles of at least 64 iterations. Uniform summation
# order is off.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  UniformSummationOrder: 0
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 8
  # alpha = 2, beta = 2, applied by PostGSU; constant bias and scaleAlphaVec.
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  DataInitTypeBias: 2
  DataInitTypeScaleAlphaVec: 2
  MaxWorkspaceSize: 134217728
  # 2 warmups and one group of 3 back-to-back launches per run, 2 runs per
  # problem.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s]
      Activation: True
      ActivationType: all
      UseScaleAlphaVec: 1
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [Hybrid]
        - GlobalSplitU: [0]
        - DepthU: [64]
        # MT 64x64.
        - MatrixInstruction: [[16, 16, 16, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
      ForkParameters:
        - WorkGroupMappingXCC: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 1 tile, long K: 1024 iterations.
          - Exact: [64, 64, 1, 65536]
          # 12 edge tiles: 256 iterations each.
          - Exact: [200, 130, 1, 16384]
          # 3 batches x 4 tiles: workspace slots span the batches.
          - Exact: [96, 96, 3, 32768]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: gelu]
