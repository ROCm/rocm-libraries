#
# StreamK DynamicWorkQueue with uniform summation order off and debug overrides
# asking for 200 tiles of 16 parts. Where that many partials do not fit the
# flag region the launch keeps every tile whole; where the problem has fewer
# tiles every tile is split. See sk_dynamic_split_overrides.yaml.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]
  client_env:
    TENSILE_STREAMK_TILES: 200
    TENSILE_STREAMK_SPLIT: 16
  # The launch summaries (TENSILE_DB=0x200000) must show the overrides applied.
  streamk_launches:
    - {tiles: 256, skTiles: 0}
    - {tiles: 12, skTiles: 12, skSplit: 16}

GlobalParameters:
  Architecture: gfx950
  NumElementsToValidate: -1
  UniformSummationOrder: 0
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 8
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 0
  SleepPercent: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
      ForkParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue]
        - GlobalSplitU: [0]
        - DepthU: [16]
        # MT 64x64.
        - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 256 tiles: 200 x 16 partials exceed the flag region, so all whole.
          - Exact: [1024, 1024, 1, 4096]
          # 12 tiles: 192 partials fit, so every tile split.
          - Exact: [200, 130, 1, 16384]
