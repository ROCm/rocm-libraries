#
# Dynamic StreamK (Hybrid, DynamicWorkQueue sub-path) with split tiles on the
# per-XCD work queues, launched several times per solution. The host splits
# every size below without env overrides. The kernel renumbers the popped
# item to a contiguous per-queue range (StreamK._contiguousQueueItem) when
# TotalItems <= SKGrid, whatever the split.
#
# Grids are for gfx950 (256 CUs, 8 queues): the MT192x160x64 kernel runs 1
# workgroup per CU, the MT64x64 kernel 3 per CU (768 slots). The host splits
# for one part per CU (256 / tiles) and grids tiles * split.
#
# - MT192x160, 48 tiles of split 5, parallel (PostGSU) reduction (the
#   1152x1152x16384 f16 case that ran slower than static);
# - MT192x160, 42 tiles of split 6, parallel reduction;
# - MT192x160, 100 tiles of split 2, arrival fixup;
# - MT64x64, 32 tiles of split 8, parallel reduction;
# - MT64x64, 128 tiles of split 2 (two batches), arrival fixup;
# - MT64x64, 6 tiles of split 42 (252 items, so a tile's parts span several
#   queues), parallel reduction;
# - WorkQueueStealing pops the next queue too, so a tile's parts can run on
#   two XCDs.
#
# Validation runs after the first group of 3 back-to-back launches per
# problem (ValidateAfterEnqueues); the Synchronizer check (on by default) catches
# queue or arrival counters left nonzero, e.g. an item popped twice or never.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 16
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # 2 warmups and one group of 3 back-to-back launches per run, 2 runs per
  # problem.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [Hybrid]
        - GlobalSplitU: [0]
        - DepthU: [64]
        # MT 192x160.
        - MatrixInstruction: [[16, 16, 16, 1, 1, 6, 5, 2, 2]]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
      ForkParameters:
        - Groups:
          - # Auto WGMXCC (resolved to NUM_XCD at launch).
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
              WorkQueueStealing: 0
            # Single-hop work stealing.
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
              WorkQueueStealing: 1
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 48 tiles of split 5, parallel reduction.
          - Exact: [1152, 1152, 1, 16384]
          # 42 tiles of split 6, parallel reduction.
          - Exact: [1152, 1120, 1, 16384]
          # 100 tiles of split 2, arrival fixup.
          - Exact: [1920, 1600, 1, 16384]

  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [Hybrid]
        - GlobalSplitU: [0]
        - DepthU: [16]
        # MT 64x64.
        - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
      ForkParameters:
        - WorkGroupMappingXCC: [-1]
        - WorkQueueStealing: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 32 tiles of split 8, parallel reduction.
          - Exact: [512, 256, 1, 8192]
          # 128 tiles of split 2, batch 2, arrival fixup.
          - Exact: [512, 512, 2, 4096]
          # 6 tiles of split 42, parallel reduction.
          - Exact: [192, 128, 1, 8192]
