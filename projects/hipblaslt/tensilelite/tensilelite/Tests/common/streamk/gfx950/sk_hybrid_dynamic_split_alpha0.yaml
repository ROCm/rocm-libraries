#
# Dynamic StreamK (SK5 Hybrid, DynamicWorkQueue sub-path) with split tiles and
# alpha = 0, beta = 2, bias, scaleAlphaVec and an activation: D must be the
# epilogue of beta*C alone.
#
# With alpha = 0 the main loop runs no iterations. On the arrival fixup the
# part that starts a tile stores it as a whole tile, and the other parts of
# the tile end the work item without writing a partial or counting in on the
# arrival counter, so no part reads a partial nobody wrote and the counters
# stay clean. The 64-tile (32 iterations) and 128-tile problems take the
# arrival fixup whichever reductions the kernel supports. Each problem is
# validated after its first launch and after a group of back-to-back launches
# whose last launch writes a rotating output buffer no earlier launch wrote,
# with the Synchronizer check after both. Both raw-rank queue regimes are
# built.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 8
  # alpha = 0, beta = 2; constant bias and scaleAlphaVec (2).
  DataInitTypeAlpha: 0
  DataInitTypeBeta: 2
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  DataInitTypeBias: 2
  DataInitTypeScaleAlphaVec: 2
  MaxWorkspaceSize: 134217728
  # 2 warmups and one group of 3 back-to-back launches per run, 2 runs per
  # problem.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s]
      Activation: True
      ActivationType: all
      UseScaleAlphaVec: 1
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [Hybrid]
        - GlobalSplitU: [0]
        - DepthU: [16]
        # MT 64x64.
        - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
      ForkParameters:
        - Groups:
          - # Auto WGMXCC (resolved to NUM_XCD at launch).
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
            # SKXCC remap with WGMXCC > 1.
            - WorkGroupMappingXCC: 8
              PersistentXCCMapping: 8
        - ActivationFuncCall: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 1 tile, long K.
          - Exact: [64, 64, 1, 65536]
          # 3 batches x 4 tiles.
          - Exact: [96, 96, 3, 32768]
          # 64 tiles of 32 iterations: split 4.
          - Exact: [512, 512, 1, 512]
          # 128 tiles: split 2.
          - Exact: [1024, 512, 1, 8192]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: gelu]
