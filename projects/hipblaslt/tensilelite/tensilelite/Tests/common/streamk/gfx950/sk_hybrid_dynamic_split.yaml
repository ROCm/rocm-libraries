#
# StreamK with the Hybrid work assignment in its dynamic sub-mode, with split
# tiles in the raw-rank queue regimes, launched several times per solution.
#
# The host splits few-tile problems the way the static grid does (two or more
# parts per tile fit the CUs; no env overrides needed), so every size below
# has SKTiles > 0 and SKSplit > 1: the partial tiles exercise the queue rank
# carried across work items (raw-rank regimes: WorkGroupMappingXCC -1, and
# PersistentXCCMapping with WorkGroupMappingXCC > 1) and batch-inclusive
# partial indexing. These kernels have both reductions and choose as the
# static path does: at most CUs / 4 tiles of at least 64 iterations take the
# parallel (PostGSU) reduction, the other problems the arrival fixup by the
# last part. Each problem is validated after its first launch and again
# after a group of back-to-back launches (ValidateAfterEnqueues) whose last
# launch writes a rotating output buffer no earlier launch wrote. The
# Synchronizer check (on by default) runs after both, so queue or arrival
# counters left nonzero fail the run, as does work a later launch skips because
# of them. The activation problem builds with ActivationFuncCall, whose call
# offsets are live across the partials path into the fixup.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 8
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # Several launches of each kernel: 2 warmups and one group of 3
  # back-to-back launches per run, 2 runs per problem, over several problems.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

.SkDynamicSplitCommon: &sk_dynamic_split_common
  - KernelLanguage: [Assembly]
  - TileProcessingStrategy: [StreamK]
  - WorkAssignment: [Hybrid]
  - GlobalSplitU: [0]
  - DepthU: [16]
  # MT 64x64.
  - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
  - GlobalReadVectorWidthA: [1]
  - GlobalReadVectorWidthB: [1]
  - LocalReadVectorWidth: [1]
  - VectorWidthA: [1]
  - VectorWidthB: [1]
  - MIArchVgpr: [False]
  - PrefetchGlobalRead: [2]
  - PrefetchLocalRead: [1]
  - 1LDSBuffer: [1]
  - ExpandPointerSwap: [False]
  - ScheduleIterAlg: [3]
  - SourceSwap: [True]
  - StoreRemapVectorWidth: [0]
  - TransposeLDS: [0]
  - WorkGroupMapping: [1]
  - StaggerU: [0]

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters: *sk_dynamic_split_common
      ForkParameters:
        # One group, one kernel per entry: the two raw-rank queue regimes.
        - Groups:
          - # Auto WGMXCC (resolved to NUM_XCD at launch).
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
            # SKXCC remap with WGMXCC > 1.
            - WorkGroupMappingXCC: 8
              PersistentXCCMapping: 8
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 1 tile, long K: parallel, 256 parts.
          - Exact: [64, 64, 1, 65536]
          # 12 edge tiles: parallel, 21 parts each.
          - Exact: [200, 130, 1, 16384]
          # 3 batches x 4 tiles: parallel, workspace slots span batches.
          - Exact: [96, 96, 3, 32768]
          # 64 tiles of 32 iterations: split 4, arrival fixup.
          - Exact: [512, 512, 1, 512]
          # Batch > 1 with one tile per batch and a very long K: 4 tiles,
          # parallel, 64 parts each, so 256 slots span the batches.
          - Exact: [32, 32, 4, 262144]
          # 128 tiles (more than CUs / 4): split 2, arrival fixup.
          - Exact: [1024, 512, 1, 8192]
          # 3 batches x 4 tiles of 63 iterations: split 6, arrival fixup,
          # partial tiles span batches.
          - Exact: [96, 96, 3, 1008]

  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: all
    - BenchmarkCommonParameters: *sk_dynamic_split_common
      ForkParameters:
        - WorkGroupMappingXCC: [-1]
        - ActivationFuncCall: [True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 65536]
          - Exact: [200, 130, 1, 16384]
          # Split 2, arrival fixup with the activation call live across it.
          - Exact: [1024, 512, 1, 8192]
        - ActivationArgs:
          - [Enum: relu]
