#
# StreamK, WorkAssignment Hybrid, dynamic sub-mode, with split tiles in both
# raw-rank queue regimes (WorkGroupMappingXCC -1; PersistentXCCMapping with
# WorkGroupMappingXCC > 1). The host splits every size below without env
# overrides, covering the queue rank across work items, the arrival counter and
# fixup, and batch-inclusive partial indexing. Validation after repeated
# launches: see sk_hybrid.yaml. ActivationFuncCall covers call offsets live
# across the partials path into the fixup.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  # The split keeps every tile's fold signature, so it runs with this on.
  UniformSummationOrder: 1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 8
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # Several launches of each kernel: 2 warmups and one group of 3
  # back-to-back launches per run, 2 runs per problem, over several problems.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

.SkDynamicSplitCommon: &sk_dynamic_split_common
  - KernelLanguage: [Assembly]
  - TileProcessingStrategy: [StreamK]
  - WorkAssignment: [Hybrid]
  - GlobalSplitU: [0]
  - DepthU: [16]
  # MT 64x64.
  - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
  - GlobalReadVectorWidthA: [1]
  - GlobalReadVectorWidthB: [1]
  - LocalReadVectorWidth: [1]
  - VectorWidthA: [1]
  - VectorWidthB: [1]
  - MIArchVgpr: [False]
  - PrefetchGlobalRead: [2]
  - PrefetchLocalRead: [1]
  - 1LDSBuffer: [1]
  - ExpandPointerSwap: [False]
  - ScheduleIterAlg: [3]
  - SourceSwap: [True]
  - StoreRemapVectorWidth: [0]
  - TransposeLDS: [0]
  - WorkGroupMapping: [1]
  - StaggerU: [0]

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters: *sk_dynamic_split_common
      ForkParameters:
        # One group, one kernel per entry: the two raw-rank queue regimes.
        - Groups:
          - # Auto WGMXCC (resolved to NUM_XCD at launch).
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
            # SKXCC remap with WGMXCC > 1.
            - WorkGroupMappingXCC: 8
              PersistentXCCMapping: 8
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 1 tile, long K: split 16.
          - Exact: [64, 64, 1, 65536]
          # 12 edge tiles: split 16.
          - Exact: [200, 130, 1, 16384]
          # 3 batches x 4 tiles: partial indices span batches.
          - Exact: [96, 96, 3, 32768]
          # 64 tiles: split 4.
          - Exact: [512, 512, 1, 512]
          # Batch > 1 with one tile per batch and a very long K: 4 tiles,
          # split 16, so 64 partial tiles span the batches.
          - Exact: [32, 32, 4, 262144]

  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: all
    - BenchmarkCommonParameters: *sk_dynamic_split_common
      ForkParameters:
        - WorkGroupMappingXCC: [-1]
        - ActivationFuncCall: [True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 65536]
          - Exact: [200, 130, 1, 16384]
        - ActivationArgs:
          - [Enum: relu]
