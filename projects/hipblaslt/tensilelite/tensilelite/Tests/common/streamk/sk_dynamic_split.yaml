#
# StreamK, WorkAssignment DynamicWorkQueue, with split tiles. The host splits
# every size below without env overrides, covering the arrival counter and
# fixup and batch-inclusive partial indexing. Validation after repeated
# launches: see sk_hybrid.yaml.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  NumElementsToValidate: -1
  # The split keeps every tile's fold signature, so it runs with this on.
  UniformSummationOrder: 1
  BoundsCheck: 0
  KernelTime: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # 3 back-to-back launches, then validation of the output and the Synchronizer.
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  ValidateAfterEnqueues: True
  RotatingBufferSize: 512
  NumWarmups: 0
  SleepPercent: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
      # Tensile builds only the ForkParameters permutations.
      ForkParameters:
        - KernelLanguage: [Assembly]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue]
        - GlobalSplitU: [0]
        - DepthU: [16]
        # MT 64x64.
        - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 1 tile, long K: split 16.
          - Exact: [64, 64, 1, 65536]
          # 12 edge tiles: split 16.
          - Exact: [200, 130, 1, 16384]
          # 3 batches x 4 tiles: partial indices span batches.
          - Exact: [96, 96, 3, 32768]
          # 4 batches x 1 tile, very long K: 64 partial tiles span the batches.
          - Exact: [32, 32, 4, 262144]
