TestParameters:
  verify_reference_reuse: true
  verify_upload_skip: true
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  Device: 0
  DataInitTypeA: 9
  DataInitTypeB: 9
  DataInitTypeC: 9
  DataInitTypeBeta: 1

# Small batched problems keep full reference recomputation cheap in the shared lanes.
# SerialDim0 inputs enter the upload-cache path. Two solutions force reuse;
# shrinking/growing extents also change batched pointers.
BenchmarkProblems:
  - - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: true
      TransposeA: true
      TransposeB: false
      UseBeta: true
      Batched: true
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 16, 1, 1, 1, 1, 2, 2]]
        - DepthU: [32]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - TransposeLDS: [0, 1]
        - GlobalSplitU: [1]
        - AssertSummationElementMultiple: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [128, 128, 2, 128]
            - Exact: [65, 67, 3, 64]
            - Exact: [129, 131, 2, 128]
