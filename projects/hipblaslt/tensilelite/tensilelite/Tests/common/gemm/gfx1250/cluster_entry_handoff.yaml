# Entry handoff after the initial cluster wait: SIA0 reuses the prefetch
# workgroup barrier; SIA4 needs an explicit join before its early loop signal.
# Loaded by unit/test_cluster_entry_handoff_codegen.py as well as common tests.
TestParameters:
  marks: [gfx1250-strict, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  DataInitTypeD: 12
  DataInitTypeScaleAlphaVec: 12
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  NumWarmups: 288
  SyncsPerBenchmark: 0
  EnqueuesPerSync: 288
  KernelTime: true
  SkipSlowSolutionRatio: 0.0

BenchmarkProblems:
- - OperationType: GEMM
    DataType: F8
    DestDataType: B
    ComputeDataType: S
    HighPrecisionAccumulate: true
    MXBlockA: 32
    MXBlockB: 32
    UseScaleAlphaVec: 1
    TransposeA: true
    TransposeB: false
    UseBeta: true
    UseBias: 1
    Activation: true
    ActivationHPA: true
    ActivationType: hipblaslt_all
    Batched: true
  - BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - WavefrontSize: [32]
    - TDMInst: [3]
    - PrefetchGlobalRead: [2]
    - PrefetchLocalRead: [1]
    - HalfPLR: [0]
    - 1LDSBuffer: [0]
    - TDMIterateMode: [0]
    - TDMSplit: [false]
    - LDSTrInst: [true]
    - ScheduleIterAlg: [0, 4]
    - InitCIterWmma: [0, 1]
    - ClusterDim: [[2, 2]]
    - ClusterLocalRead: [0]
    - GlobalSplitU: [-1]
    - TileProcessingStrategy: [DataParallel]
    - WorkAssignment: [StaticGrid]
    - PrefetchAcrossPersistent: [0]
    - DepthU: [128]
    - StaggerU: [0]
    - WorkGroupMapping: [0]
    - SourceSwap: [false]
    - Groups:
      - - MatrixInstruction: [16, 16, 128, 1, 1, 1, 4, 4, 1]
        - MatrixInstruction: [16, 16, 128, 1, 1, 2, 2, 2, 2]
        - MatrixInstruction: [16, 16, 128, 1, 1, 4, 1, 1, 4]
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [1024, 1024, 1, 1024]
      - Exact: [512, 2048, 1, 1024]
      - Exact: [2048, 512, 1, 1024]
    - BiasTypeArgs: [B]
