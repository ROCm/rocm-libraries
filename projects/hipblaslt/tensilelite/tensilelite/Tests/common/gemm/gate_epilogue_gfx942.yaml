# Triggered-gate epilogue (TriggeredGateEpilogue=1) config for gfx942: every work-group
# ends with one add on its band's ready gate. tensilelite-client supplies the gate table
# and checks every gate after the first launch (--triggered-gate-epilogue).

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # runs on gfx942 only

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: -1
  NumBenchmarks: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Device: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx942
  ISA: [[9, 4, 2]]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      TriggeredGateEpilogue: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TileProcessingStrategy: ["None"]
        - GlobalSplitU: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # M is the feature dim (contiguous in D), N the token dim; M%MT0 == 0, N%MT1 == 0.
          - Exact: [7168, 512, 1, 2048]
