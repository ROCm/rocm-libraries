# Exact-shape correctness for the eight-wave (MatrixInstruction WaveGroup 2x4)
# MT256x256 DU128 MXFP8 subtile kernel on the DUAL-PERIOD path (128-K data loop
# reusing a 256-K pre-shuffled scale epoch).  MXBlockA/B=32 + MXScaleFormat=1
# (HostPreSwizzle) engage the _DualPeriodMXFP8 gate, which auto-selects the
# 2x2 next-partition PLR schedule (no environment variables required).
#
# Problem K values straddle the data-DU (128), epoch (256) and 3*DU (384)
# boundaries (127/128/129, 255/256/257, 383/384/385) to exercise the
# phase-aware tail and epoch/phase cadence, plus a deep-K throughput shape.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 2
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  HardwareMonitor: False
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 8, 4, 2, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StaggerU: [0]
        - WorkGroupMapping: [4]
        - UseSubtileImpl: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # Single MT256x256 tile — isolate the K-loop / tail / epoch cadence.
          - Exact: [256, 256, 1, 127]   # < 1 data-DU: tail only
          - Exact: [256, 256, 1, 128]   # exactly 1 data-DU (half an epoch)
          - Exact: [256, 256, 1, 129]   # 1 data-DU + 1 tail
          - Exact: [256, 256, 1, 255]   # 1 epoch - 1
          - Exact: [256, 256, 1, 256]   # exactly 1 scale epoch
          - Exact: [256, 256, 1, 257]   # 1 epoch + 1
          - Exact: [256, 256, 1, 383]   # 1 epoch + 1 data-DU - 1
          - Exact: [256, 256, 1, 384]   # 1 epoch + 1 data-DU
          - Exact: [256, 256, 1, 385]   # 1 epoch + 1 data-DU + 1
          - Exact: [256, 256, 1, 512]   # 2 epochs
          - Exact: [256, 256, 1, 4096]  # deep K, single tile
          # Multi-tile shapes — exercise StreamK partial tiles with scales.
          - Exact: [512, 512, 1, 1024]
          - Exact: [4096, 4096, 1, 8192]
          # A tile count past the point where the runtime picks a Stream-K grid
          # rather than one workgroup per tile (576 tiles, 24x24).  Note this
          # client launches grid == tiles, so it does not itself produce a range
          # that splits a tile's K; the K-unit quantisation that makes such a
          # range safe is pinned by RowUniformityScaleEpoch in
          # clients/tests/src/row_uniformity_gtest.cpp.
          - Exact: [6144, 6144, 1, 512]
