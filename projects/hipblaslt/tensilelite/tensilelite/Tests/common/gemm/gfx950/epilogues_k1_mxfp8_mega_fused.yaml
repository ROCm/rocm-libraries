# RMSEpilogue: PartialRMS + ResidualAdd + MXFP8 DynQuant via a single
# SubtileMegaFusedEmitter. Numerics must match the flag-off path covered by
# epilogues_k1_mxfp8.yaml.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 0
  PrintLevel: 3
  KernelTime: True
  PrintSolutionRejectionReason: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1

BenchmarkProblems:

  ########################################
  # RMSEpilogue: MX-scaled fp8 in, fp8 out — representative tile sweep.
  ########################################
  -
    - # ProblemType — identical to epilogues_k1_mxfp8.yaml but with UseRMSEpilogue=True
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            # WG 2x1 (WG0=2, WG1=1, MIWT_N=8)
            - [16, 16, 128, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128
            # WG 1x2 (WG0=1, WG1=2, MIWT_N=4)
            - [16, 16, 128, 1, 1,  4,  4, 1, 2]  # MT0=64   MT1=128
            # WG 2x2 (WG0=2, WG1=2, MIWT_N=4)
            - [16, 16, 128, 1, 1,  4,  4, 2, 2]  # MT0=128  MT1=128
        - RMSEpilogue: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [256]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [768, 768, 1, 768]
            - Exact: [513, 513, 1, 544]
