#
# Regression test for the subtile MX beta epilogue reading C past column N.
# With beta != 0 and N not a multiple of the 32-wide N tile, the last wave must
# not load C beyond N. BoundsCheck 3 places C at the end of its mapping so such
# a load faults. Validation must stay on: it is the only kernel launch.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 3
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  - # FP8 TN
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  4, 1]  # MT 128x32
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1, 1, 512]
          - Exact: [1024, 2, 1, 512]
          - Exact: [1024, 3, 1, 512]
          - Exact: [1024, 4, 1, 512]
          - Exact: [1024, 17, 1, 512]
          - Exact: [1024, 16, 1, 512]   # Control: full 16-column block.
          - Exact: [1024, 32, 1, 512]   # Control: full N tile.

  - # FP4 TN
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  4, 1]  # MT 128x32
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1, 1, 512]
          - Exact: [1024, 2, 1, 512]
          - Exact: [1024, 3, 1, 512]
          - Exact: [1024, 4, 1, 512]
          - Exact: [1024, 17, 1, 512]
          - Exact: [1024, 16, 1, 512]   # Control: full 16-column block.
          - Exact: [1024, 32, 1, 512]   # Control: full N tile.
