# MXFP8 subtile skinny macrotile (16-wide, MIWaveTile==1): 16xN and Mx16 on gfx950.
#
# A 16-wide macrotile is half of the 32-row MX-scale swizzle group, so two adjacent
# workgroups share one group.  These shapes tile the 16-wide dimension across many
# workgroups (odd and even counts, partial last tile, up to 8192) and use K at exact
# scale epochs, odd half-epochs and deep K, to exercise the per-workgroup scale SRD
# base (floor(WG*MT/swizzleSize0)) and the byte-offset scale local read.
#
# DestDataType is s (float32) ON PURPOSE: the client's BFloat16 tolerance is
# 0.1*(|a|+|b|+1), which lets a ~20% error pass; float32 uses 2e-4.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # Skinny M: MT16xN (MIWaveTile[0]=1), dual-period DU128 PGR2.  Tile M across
  # workgroups and sweep K to deep values (the last N/M-tile + deep K is the
  # illegal-access regression).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      ActivationFuncCall: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 4, 1, 4]  # MT16x256
          - [16, 16, 128, 1, 1, 1, 8, 1, 4]  # MT16x512
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - UseSubtileImpl: [true]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 512, 1, 512]
          - Exact: [48, 512, 1, 512]
          - Exact: [64, 1024, 1, 1024]
          - Exact: [112, 768, 1, 768]
          - Exact: [16, 8192, 1, 8192]
          - Exact: [48, 8192, 1, 8192]
  ########################################
  # Skinny N: MTMx16 (MIWaveTile[1]=1), dual-period DU128 PGR2.  Tile N across
  # workgroups and sweep K deep.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      ActivationFuncCall: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 1, 4, 1]  # MT256x16
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - UseSubtileImpl: [true]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 16, 1, 512]
          - Exact: [512, 48, 1, 512]
          - Exact: [1024, 112, 1, 1024]
          - Exact: [8192, 16, 1, 8192]
          - Exact: [8192, 48, 1, 8192]
