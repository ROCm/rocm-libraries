TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  NumElementsToValidate: -1
  NumWarmups: 1
  NumBenchmarks: 1
  SyncsPerBenchmark: 0
  EnqueuesPerSync: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  KernelTime: True
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: True
      ActivationType: hipblaslt_all
      UseE: True
      DataTypeE: h
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 1, 2, 2]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [1]
        - 1LDSBuffer: [0]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        # 8 half elements make each E store 16 bytes (buffer_store_dwordx4).
        - StoreVectorWidth: [8]
        - ActivationFuncCall: [False, True]
        - SourceSwap: [False]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 96, 1, 128]
          - Exact: [129, 97, 1, 130]
        - ActivationArgs:
          - [Enum: Gelu]
          - [Enum: Relu]
