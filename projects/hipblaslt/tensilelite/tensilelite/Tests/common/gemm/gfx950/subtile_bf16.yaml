  ########################################
  # BF16 NN — TLU=1 on A, DU = 64, 128
  #
  # NN (TransposeA=0, TransposeB=0) makes A free-dim contiguous, so TLUA=True and A
  # takes the stacked transpose-read geometry AB_B16_TLU1_4x1 (stack 4 = 64 M-rows
  # x 32 K, 128 B LDS column) while B stays TLU=0 on the row-major layout.  bf16
  # walks a two-rung stack ladder -- see SUBTILE_STACK_SIZES_B16 in SolutionStructs/Validators/Subtile.py
  # -- so most solutions here land on that 4x1 geometry and the sweep varies what
  # sits around it: how many strips the macro tile spans, and how many waves share
  # one.  The two MT 96/160 shapes at the end of the fork fall to the 2x1 rung
  # instead; they are the shapes a stack of 4 cannot lay out at all.
  #
  # MacroTile0 = MatrixInstM * MIWaveTile[0] * MIWaveGroup[0], and a strip holds 4
  # MMA-M tiles, so the four MI shapes below split into two regimes:
  #
  #   wg [2,2] MIWT 2x2  MT  64 -- 2 M-tiles/wave: waves SHARE a strip.  The wave's
  #                                window into a shared strip is a sub-strip stride
  #                                that overlaps the m-block field the LDS XOR
  #                                permutes, so it must be folded in BEFORE the
  #                                XOR.  Adding it after gave (tile_m ^ swz) +
  #                                window and silently corrupted every wave with a
  #                                non-zero window.  This shape is the guard.
  #   wg [1,4] MIWT 4x1  MT  64 -- 1 wave per strip, the simple case.
  #   wg [2,2] MIWT 4x4  MT 128 -- 2 strips (localSubtileGrid[0] == 2), which is
  #                                what pins globalReadDoSubtile's sId0 units; with
  #                                a single strip both unit conventions agree.
  #   wg [2,2] MIWT 4x2  MT 128 -- asymmetric MIWaveTile on the same 2 strips.
  #
  # K coverage deliberately includes sizes that are NOT a multiple of DepthU.  A
  # TLU=1 operand is ineligible for the boundary DTL fixup (one GR load covers M
  # rows at a single K, so no load can straddle the K boundary), which means an NN
  # kernel reaches tailLoopBoundaryDtlLoadAB with only B eligible -- the mixed pair
  # that the both-eligible assertion used to forbid.  Without a tail K here that
  # path never executes.
  #
  # DataInitType A/B/C = 3 (Random) is required, not cosmetic: with InitMode::One
  # every permutation of A yields the same dot product, so a wrong LDS data
  # placement -- exactly what a mis-applied swizzle produces -- would validate
  # clean.  Random is position-dependent, so a misplaced element changes the result
  # with probability ~1.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 1,  2, 2]   # MT  64x32
          - [16, 16, 32, 1,  1, 1, 4,  4, 1]   # MT  64x64,
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT  64x64,  waves share a strip
          - [16, 16, 32, 1,  1, 4, 1,  1, 4]   # MT  64x64,  one wave per strip
          - [16, 16, 32, 1,  1, 2, 4,  2, 2]   # MT  64x128
          - [16, 16, 32, 1,  1, 4, 1,  2, 2]   # MT  128x32
          - [16, 16, 32, 1,  1, 4, 2,  2, 2]   # MT 128x64,  asymmetric MIWT
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128, 2 strips
          - [16, 16, 32, 1,  1, 8, 1,  2, 2]   # MT  256x32
          - [16, 16, 32, 1,  1, 8, 2,  2, 2]   # MT  256x64
          - [16, 16, 32, 1,  1, 8, 4,  2, 2]   # MT  256x128
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT  256x256
          # 6 and 10 MMA-M tiles: a partial tail on a stack of 4 (which the GR
          # emit cannot address), whole strips on a stack of 2.  These are the
          # shapes the 2x1 rung exists for, and the only ones here that take it.
          - [16, 16, 32, 1,  1, 6, 2,  1, 4]   # MT   96x128, 3 strips of 2
          - [16, 16, 32, 1,  1,10, 2,  1, 4]   # MT  160x128, 5 strips of 2

        - DepthU: [64, 128]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StaggerU: [0]
        - StreamK: [0]
        - UseSubtileImpl: [True]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - LocalReadVectorWidth: [8]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [96, 256, 1, 128]    # M edge 
          - Exact: [128, 128, 1,  64]   # one DepthU chunk at DepthU 64
          - Exact: [128, 128, 1, 128]   # exact multiple of both DepthU values
          - Exact: [128, 128, 1,  96]   # tail at DepthU 64 (64 + 32)
          - Exact: [128, 128, 1, 160]   # tail at both DepthU (2*64+32, 128+32)
          - Exact: [256, 256, 1, 384]
          - Exact: [256, 256, 1, 512]
          - Exact: [160, 128, 1, 128]   # exercises the 2x1 rung exactly
          - Exact: [160, 128, 1, 160]   # ... with a K tail at both DepthU
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT  64x64,  waves share a strip
        - DepthU: [64]
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StaggerU: [0]
        - StreamK: [0]
        - UseSubtileImpl: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]

  ########################################
  # BF16 NN — TLU=1 TAIL LOOP correctness, with emphasis on ODD K.
  # (Applies to the three BF16 NN TLU=1 tail sections that follow.)
  #
  # The BF16 NN TLU=1 section above already reaches the tail loop: its K = 96 /
  # 160 leave a 32-element remainder at DepthU 64 and 128.  What it never reaches
  # is the tail loop's bf16 BOUNDARY FIXUP.  tailLoopBoundaryDtlLoadAB opens with
  #
  #     s_and_b32     sN, s[sgprLoopCounterL], 0x1   // K_rem & 1
  #     s_cbranch_scc0 label_tailBoundarySkipAB      // K_rem even -> skip
  #
  # and every other K in the subtile_*.yaml tests is a multiple of 32, so outside
  # the sections below that branch is always taken and the ~44 instructions
  # behind it never execute.
  #
  # Why odd K is the interesting case.  B is TLU=0, so one buffer_load_dwordx4
  # covers 8 consecutive K elements.  Buffer out-of-bounds is enforced at DWORD
  # granularity and a dword holds TWO bf16, so a load straddling the K boundary
  # gets the trailing VALID element zeroed along with the invalid one.  The SRD
  # clamp and MaskK both handle everything PAST the boundary; neither can restore a
  # value hardware already destroyed.  That is what the fixup re-fetches, with a
  # single EXEC-gated 16-bit direct-to-LDS load.  When K_rem is even the boundary
  # falls on a dword edge and no valid element shares a dword with an invalid one,
  # hence the parity gate.
  #
  # A is TLU=1 and is ineligible by construction: one GR load covers M rows at a
  # single K, so no load spans a K boundary.  An NN kernel therefore reaches
  # tailLoopBoundaryDtlLoadAB with only B eligible -- the mixed pair that the
  # upstream both-eligible assertion forbids.
  #
  # Sizes are lifted from the two non-subtile BBS NN tests that already cover this
  # ground and are blocked from the subtile path only by UseSubtileImpl defaulting
  # to False:
  #
  #   common/gemm/ulsgro1.yaml      group 1 -- K = 127 / 128 / 129 / 576 / 640 with
  #                                 M/N edges at 127 / 128 / 129.
  #   common/gemm/gfx950/lds_tr.yaml group 0 -- large ragged K = 1000 / 1032 / 1037
  #                                 / 1064 / 1096 / 2053 at 512x512 and 519x519.
  #
  # Solution parameters come from the BF16 NN TLU=1 section above unchanged; only
  # MatrixInstruction is trimmed, to one shape per strip regime plus one alternate
  # wave grouping, to keep the odd-K size matrix affordable.
  #
  # DataInitType A/B/C = 3 (Random) is required, not cosmetic.  With InitMode::One
  # every permutation of A yields the same dot product, so a single element zeroed
  # at the K boundary -- exactly the failure this test exists for -- would validate
  # clean.  Random is position-dependent, so it shows up with probability ~1.
  ########################################
  ########################################
  # BF16 NN TLU=1 tail — odd K, tile-aligned M/N.
  #
  # Isolates the parity gate: at M = N = 128 every MacroTile in the fork up to
  # 128 divides the problem, so numLine == MT-1 there and the only thing varying
  # is K_rem's parity.  MT160x160 and MT320x320 are the exceptions at that size
  # -- one workgroup covers the whole problem and numLine clamps to 127 via
  # min(numToEnd, MT).  The two 320x320 sizes at the end exist to give MT320x320
  # a tile-exact problem where numLine is its own 319.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 1,  2, 2]   # MT  64x32,  1 strip
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT  64x64,  waves share a strip
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128, 2 strips
          # Same MT128x128, all four waves stacked along M.  The fixup ends in a
          # v_cmp_eq_u32 / s_ff1 / v_readlane search for the lane whose vaddr
          # matches sTarget, so which lane owns the boundary element is a
          # function of the wave grouping, not just the MacroTile.  [2,2] above
          # is also the grouping least likely to make stackM exceed
          # localMMATileGrid[0]; [4,1] is the one that does.  From lds_tr.yaml.
          - [16, 16, 32, 1,  1, 2, 8,  4, 1]   # MT 128x128, MIWaveGroup [4,1]
          # Largest MIWaveTile the bf16 TLU=1 stack can build.  Everything above
          # is MIWT <= 4x4, so the tail loop's MFMA block and its VGPR-resident
          # tile state stay small; 10x10 puts 100 tiles on a wave and sits at
          # the register-file limit, which is where an off-by-one in the tail's
          # flat tile-id layout would show up.
          #
          # Both wave groupings of 10x10 are here because they differ in the one
          # thing the tail loop cares about besides tile count -- whether waves
          # share an LDS strip:
          #
          #   MT160x160, wg [1,1]  single wave, reachable at BOTH DepthU.
          #   MT320x320, wg [2,2]  multi-wave strip, DepthU 64 ONLY.
          #
          # PGR=1 double-buffers LDS, so 320x320 at DepthU 128 wants
          # 2*(320*128*2 + 320*128*2) = 327680 B against a 163840 B cap and is
          # correctly rejected -- that row contributes 8 results, not 16.  Both
          # 160x160 at DepthU 128 and 320x320 at DepthU 64 come to 163840 B,
          # landing exactly on the cap.
          - [16, 16, 32, 1,  1, 10, 10,  1, 1] # MT 160x160, single wave
          - [16, 16, 32, 1,  1, 10, 10,  2, 2] # MT 320x320, multi-wave strip

        - DepthU: [64, 128]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StaggerU: [0]
        - StreamK: [0]
        - UseSubtileImpl: [True]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - LocalReadVectorWidth: [8]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # --- controls: the coverage the NN TLU=1 section has ------------
          - Exact: [128, 128, 1, 128]   # no tail at either DepthU
          - Exact: [128, 128, 1, 160]   # EVEN tail both DepthU -> fixup skipped
          # --- odd K: K_rem odd at both DepthU -> fixup EXECUTES --------------
          - Exact: [128, 128, 1,  63]   # rem 63 (DU64) / 63 (DU128)
          - Exact: [128, 128, 1,  65]   # rem  1 (DU64) / 65 (DU128)
          - Exact: [128, 128, 1, 127]   # rem 63 / 127  -- from ulsgro1
          - Exact: [128, 128, 1, 129]   # rem  1 /   1  -- from ulsgro1
          # --- odd K that is also not a multiple of GlobalReadVectorWidth -----
          - Exact: [128, 128, 1, 577]   # 576 + 1; ulsgro1's 576 made odd
          - Exact: [128, 128, 1, 641]   # 640 + 1; ulsgro1's 640 made odd
          # --- odd K on a FULL MT320x320 tile ---------------------------------
          # At 128x128 the MT320x320 row covers the whole problem in one
          # workgroup and ~84% of the tile is masked off, so numLine clamps to
          # 127 and the boundary element never lands on a line the 10x10 tile
          # layout actually owns.  These two make M and N tile-exact for it:
          # numLine = 319, every wave holds a full 10x10 of live tiles, and the
          # v_readlane search has to find the boundary lane in the multi-wave
          # strip rather than in the masked region.  The smaller MacroTiles in
          # the fork tile 320 unevenly (320/128 = 2.5), so they also pick up an
          # M/N-remainder workgroup here for free.
          - Exact: [320, 320, 1, 127]   # rem 63 (DU64) / 127 (DU128)
          - Exact: [320, 320, 1, 129]   # rem  1 (DU64) /   1 (DU128)

  ########################################
  # BF16 NN TLU=1 tail — odd K crossed with M/N edges.
  #
  # The fixup targets the LAST VALID line of the tile:
  #   numLine = min(Size - WG*MT, MT) - 1
  # which only differs from MT-1 when N is not a multiple of MacroTile1.  These
  # sizes are the ones that make that clamp do work.  M edges come along for the
  # ride to cover the TLU=1 operand's own partial-tile path.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 1,  2, 2]   # MT  64x32
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128

        - DepthU: [64, 128]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0]
        - ExpandPointerSwap: [False]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StaggerU: [0]
        - StreamK: [0]
        - UseSubtileImpl: [True]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - LocalReadVectorWidth: [8]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 120, 1, 127]   # N edge inside one MT1=128 tile
          - Exact: [128, 136, 1, 127]   # N edge spilling into a second tile
          - Exact: [120, 128, 1, 127]   # M edge
          - Exact: [120, 120, 1, 129]   # both edges, other odd K
          - Exact: [128, 129, 1, 129]   # N edge of 1 -- numLine = 0
          - Exact: [129, 129, 1, 129]   # from ulsgro1

  ########################################
  # BF16 NN TLU=1 tail — large ragged K, from lds_tr.yaml group 0.
  #
  # Same shape of remainder, but reached after many full DepthU iterations, so
  # the loop counter and the SRD have been stepped a long way before the tail
  # runs.  1037 and 2053 are the odd ones.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
