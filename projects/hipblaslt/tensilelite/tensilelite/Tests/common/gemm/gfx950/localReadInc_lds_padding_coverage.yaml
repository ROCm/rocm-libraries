#
# E2E coverage test for localReadInc LDS padding boundary logic.
#
# When LdsPad > 0 and LdsBlockSizePerPad > 0, localReadInc must correctly
# calculate padding adjustments when crossing LDS block boundaries in tail loops.
# The padding formula: padd = ((iui+1)*inc//ldsBSPad - iui*inc//ldsBSPad) * LdsPad * bpeDS
#
# Test strategy: Use nonzero-tail sizes (K % DepthU != 0) with InnerUnroll > 1
# to validate tail-loop padding at runtime with iui > 0. Each test exercises
# the padding formula with various LdsPad/LdsBlockSizePerPad configurations.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: 128
  BoundsCheck: 2

BenchmarkProblems:
  ########################################
  # Test 1: LdsPadA with boundary crossing + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 34]  # K=34: 34%32=2 nonzero tail

  ########################################
  # Test 2: Different LdsPad values + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [4]
        - LdsPadB: [4]
        - LdsBlockSizePerPadA: [128]
        - LdsBlockSizePerPadB: [128]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 36]  # K=36: 36%32=4 nonzero tail

  ########################################
  # Test 3: LdsPad with larger blocks + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [16]
        - LdsPadB: [16]
        - LdsBlockSizePerPadA: [512]
        - LdsBlockSizePerPadB: [512]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[4,4]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 40]  # K=40: 40%32=8 nonzero tail

  ########################################
  # Test 4: Asymmetric padding (A vs B) + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [4]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [128]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 38]  # K=38: 38%32=6 nonzero tail

  ########################################
  # Test 5: LdsPad=0 (no padding baseline)
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [0]
        - LdsPadB: [0]
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 32]

  ########################################
  # Test 6: Non-tile-multiple sizes (tail loops) + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [130, 130, 1, 34]  # K=34: 34%32=2 nonzero tail

  ########################################
  # Test 7: TransposeA with padding + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 35]  # K=35: 35%32=3 nonzero tail

  ########################################
  # Test 8: Different DepthU value + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [16]  # Different unroll depth
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 18]  # K=18: 18%16=2 nonzero tail

  ########################################
  # Test 9: Small LdsBlockSizePerPad (frequent boundaries) + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [128]  # Small block size = more frequent padding boundaries
        - LdsBlockSizePerPadB: [128]
        - InnerUnroll: [2]  # iui > 0 for tail-loop padding validation
      ForkParameters:
        - MatrixInstruction:
          - [16,16,4,1,1,1,1,1,1]
        - ThreadTile: [[2,2]]
        - WorkGroup: [[16,16,1]]
        - DepthU: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 36]  # K=36: 36%32=4 nonzero tail

  ########################################
  # Test 10: Large problem size with padding + nonzero tail + InnerUnroll>1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
