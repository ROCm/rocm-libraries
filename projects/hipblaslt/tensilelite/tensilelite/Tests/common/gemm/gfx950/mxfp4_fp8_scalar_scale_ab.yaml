########################################
# Scalar A and B scales in mixed MXFP4 x MXFP8 kernels (gfx950).
#
# The problem types omit MacDataTypeA/MacDataTypeB, so each operand's MFMA
# type comes from its own type. A scale is 2, B scale is -1 and beta is 0: a
# kernel that drops A's scale gives half the reference, and one that drops B's
# gives the reference with its sign flipped. Every element is validated.
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 21
  DataInitTypeB: 21
  DataInitTypeC: 21
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeScaleA: 2
  DataInitTypeScaleB: 17
  BoundsCheck: 2
  MXScaleFormat: 1

BenchmarkProblems:
  -
    - # MXFP4 A x MXFP8 B
      OperationType: GEMM
      DataType: F4
      DataTypeB: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      UseScaleAB: Scalar
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - DepthU: [256]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DirectToLds: [0]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [16]
        - LocalReadVectorWidth: [32]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - ClusterLocalRead: [1]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - LdsPadA: [4]
        - LdsPadB: [4]
        - WorkGroupMapping: [64]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [1024, 512, 2, 1024]
  -
    - # MXFP8 A x MXFP4 B
      OperationType: GEMM
      DataType: F4
      DataTypeA: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      UseScaleAB: Scalar
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - DepthU: [256]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DirectToLds: [0]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [32]
        - LocalReadVectorWidth: [32]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - ClusterLocalRead: [1]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - LdsPadA: [4]
        - LdsPadB: [4]
        - WorkGroupMapping: [64]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [1024, 512, 2, 1024]
