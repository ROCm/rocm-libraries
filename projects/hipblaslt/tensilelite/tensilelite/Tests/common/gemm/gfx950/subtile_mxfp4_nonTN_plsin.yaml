TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

# PostLoopStoreInNll on the non-TN layouts (NT / NN / TT).
#
# assignPostLoopStoreInNll resolves PLSIN independently of isMxf4SubtilePath, so
# these layouts carry the fused store even though the TN-only emit gate reads
# False for them. They were silently broken: the fused store's coordinate VALU is
# woven into the NGLL MFMA gaps, and the non-TN (TLU=1) global-read SRD advance
# used to draw a pool temp that the weave then aliased onto the coordinate temp,
# so coord1 picked up DepthU*bpe*strideK and D was written ~1.4GB out of bounds.
#
# Sizes must keep every free dimension a multiple of MXBlock (32): on non-TN the
# scale blocks run along a free dim, not along K. Within that, they cover full
# tiles (fused store taken), partial M, partial N, partial both (front guard
# routes to the plain NLL), a tail-loop K, and K < PGR*DepthU (the PLSIN
# coordinate-recompute branch).
.NonTnSizes: &non_tn_sizes
  - Exact: [2432, 1920, 1, 3072]   # full M and N
  - Exact: [2432, 1952, 1, 3072]   # partial N
  - Exact: [2464, 1920, 1, 3072]   # partial M
  - Exact: [2464, 1952, 1, 3072]   # partial M and N
  - Exact: [2432, 1920, 1, 2848]   # K % DepthU != 0 -> tail loop
  - Exact: [2432, 1920, 1, 256]    # numIter == 1 < PGR -> coord recompute
  - Exact: [160, 224, 1, 1024]     # single partial tile in both dims

.NonTnSolution: &non_tn_solution
  InitialSolutionParameters:
  BenchmarkCommonParameters:
    - KernelLanguage: ["Assembly"]
  ForkParameters:
    - MatrixInstruction:
      - [16, 16, 128, 1,  1, 4, 6,  2, 2]   # MT128x192
      - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
    - PostLoopStoreInNll: [false, true]
    - PrefetchGlobalRead: [2]
    - PrefetchLocalRead: [1]
    - DepthU: [256]
    - ScheduleIterAlg: [3]
    - DirectToLds: [1]
    - TileProcessingStrategy: [StreamK]
    - WorkAssignment: [StaticGrid]
    - StaggerU: [0, 32]
    - UseSubtileImpl: [true]
  BenchmarkJoinParameters:
  BenchmarkFinalParameters:
    - ProblemSizes: *non_tn_sizes

BenchmarkProblems:
  ########################################
  # NT
  ########################################
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - *non_tn_solution

  ########################################
  # NN
  ########################################
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - *non_tn_solution

  ########################################
  # TT
  ########################################
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True
    - *non_tn_solution

  ########################################
  # NT with the bias + scaleAlphaVec epilogue, which the fused-store guard folds
  # as pointer-null terms.
  ########################################
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s]
      UseScaleAlphaVec: 1
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 6,  2, 2]   # MT128x192
        - PostLoopStoreInNll: [false, true]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes: *non_tn_sizes
        - BiasTypeArgs: ['s']
