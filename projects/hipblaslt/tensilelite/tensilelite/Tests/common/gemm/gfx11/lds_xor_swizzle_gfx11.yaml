TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # LdsXorSwizzle is implemented for gfx11 WMMA

# LdsXorSwizzle (XOR LDS layout instead of row padding) on bf16/fp16 TN.
# DepthU 16..128 covers LDS rows of 32..256 B (all key shifts); 1LDSBuffer 0/1 covers the
# buffer-swap and reset paths; K remainders exercise the tail loop's base shifting.
# The BBS MT128x128x64 / 1LDSBuffer / PGR2 fork is the shipped gfx1151 solution.

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  Device: 0
  DataInitTypeA: 21
  DataInitTypeB: 21
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  BoundsCheck: 0
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # BBS TN
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # [MI_M, MI_N, MI_K, MI_B, BlockM, MIWaveTileM, MIWaveTileN, MIWaveGroupM, MIWaveGroupN]
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  4, 2,  2, 4] # MT128x128, 8 waves
          - [16, 16, 16, 1,  1,  2, 1,  2, 4] # MT64x64, 8 waves
        - WavefrontSize: [32]
        - WorkGroup:
          - [64, 4, 1]
        - DepthU: [16, 32, 64, 128]
        - 1LDSBuffer: [0, 1]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [0]
        - ClusterLocalRead: [0]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - SourceSwap: [True]
        - LdsXorSwizzle: [True]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 64]
          - Exact: [333, 257, 1, 1000]
          - Exact: [256, 512, 1, 4111]
          - Exact: [129, 127, 1, 17]
          - Exact: [1031, 1029, 1, 2049]
          - Exact: [256, 256, 2, 320]

  ########################################
  # HHS TN
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,  4, 2,  2, 4] # MT128x128, 8 waves
        - WavefrontSize: [32]
        - WorkGroup:
          - [64, 4, 1]
        - DepthU: [32, 64]
        - 1LDSBuffer: [0, 1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - ClusterLocalRead: [0]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - SourceSwap: [True]
        - LdsXorSwizzle: [True]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 64]
          - Exact: [333, 257, 1, 1000]
          - Exact: [256, 512, 1, 4111]
          - Exact: [256, 256, 2, 320]
