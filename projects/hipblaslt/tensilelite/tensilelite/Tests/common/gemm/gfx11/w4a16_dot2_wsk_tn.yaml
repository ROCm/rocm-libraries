          - Exact: [512, 4, 1, 2048]
  ########################################
  # DirectToVgprDot2A: A feeds v_dot2 from its global-read registers.
  # fp16, UnsignedBias8, symmetric, G128
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DataTypeA: i4
      MacDataTypeA: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      UseScaleAB: Block
      ScaleBlockSizesA: [128]
      Int4EncodingA: UnsignedBias8
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - ThreadTile:
          - [1, 1]
          - [2, 1]
          - [2, 4]
        - WaveSplitK: [true]
        - WavefrontSize: [32]
        - InnerUnroll: [1]
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [1]
        - TransposeLDS: [2]
        - StaggerU: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [1]
        - ScheduleLocalWrite: [1]
        - DirectToVgprDot2A: [True]
