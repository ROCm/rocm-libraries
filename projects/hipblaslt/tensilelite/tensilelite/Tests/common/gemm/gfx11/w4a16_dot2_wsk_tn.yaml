          - - WorkGroup: [[4, 1, 16]]
              DepthU: [256]
              GlobalReadVectorWidthA: [16]
              AssertSummationElementMultiple: [256]
            - WorkGroup: [[4, 1, 16]]
              DepthU: [512]
              GlobalReadVectorWidthA: [32]
              AssertSummationElementMultiple: [512]
            - WorkGroup: [[8, 1, 32]]
              DepthU: [256]
              GlobalReadVectorWidthA: [8]
              AssertSummationElementMultiple: [256]
            - WorkGroup: [[2, 1, 32]]
              DepthU: [1024]
              GlobalReadVectorWidthA: [32]
              AssertSummationElementMultiple: [1024]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 1, 1, 1024]
          - Exact: [37, 3, 1, 3072]
          - Exact: [512, 4, 1, 2048]
