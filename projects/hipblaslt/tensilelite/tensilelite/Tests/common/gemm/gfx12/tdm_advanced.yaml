# GFX1250-specific: Advanced TDM parameters
# TDMFuse: [0, 1] - TDM descriptor grouping
# TDMPlusLdsBuf: [-1, 0, 1] - Extra LDS buffer for TDM PGR2
# TDMLoadWaveSync: [0, 1, 2] - Wave synchronization for TDM loads

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # TDMFuse - descriptor grouping optimization
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - TDMInst: [3]
        - LDSTrInst: [True]  # Required for TDM
        - LDSTrInst: [True]  # Required for TDM
        - PrefetchGlobalRead: [2]
        - TDMFuse: [0, 1]  # TEST TDM descriptor grouping
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 64, 256], [128, 64, 256], [1], [128] ]

  # TDMPlusLdsBuf - extra LDS buffer for TDM PGR2
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - TDMInst: [3]
        - LDSTrInst: [True]  # Required for TDM
        - PrefetchGlobalRead: [2]
        - TDMPlusLdsBuf: [-1, 0, 1]  # TEST all modes: auto, off, force
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [64, 64, 128], [64, 64, 128], [1], [64] ]

  # TDMLoadWaveSync - wave synchronization
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - TDMInst: [3]
        - LDSTrInst: [True]  # Required for TDM
        - PrefetchGlobalRead: [2]
        - TDMLoadWaveSync: [False, True]  # TEST wave sync on/off
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [128], [128], [1], [64, 64, 128] ]

  # Combined advanced TDM features
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 2, 1]  # MIWaveGroup [2,1] for NumWaves=2 (TDMFuse needs >1)
        - DepthU: [64]
        - WavefrontSize: [32]
        - TDMInst: [3]
        - LDSTrInst: [True]  # Required for TDM
        - ScheduleIterAlg: [4]  # Required for TDMLoadWaveSync (StinkyTofu backend)
        - PrefetchGlobalRead: [2]
        - TDMPlusLdsBuf: [-1, 0]  # Combined TDM: test with/without LDS buf
        - TDMLoadWaveSync: [False, True]  # Combined TDM: test wave sync
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 128, 256], [128, 128, 256], [1], [128] ]
