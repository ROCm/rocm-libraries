TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch
GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 1
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 3
  DataInitTypeScaleAlphaVec: 3
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  ########################################
  # beta != 0: a TDMStore kernel keeps buffer_store in its beta != 0 epilogue.
  ########################################
  -
    - &problem_type_bf16 # ProblemType TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      UseBeta: True
      Batched: True
      TransposeA: True
      TransposeB: False
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [1]
        - TDMStore: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # The beta != 0 epilogue of a TDMStore kernel reads the bias and ScaleAlphaVec vectors after
  # the staged tile too.
  ########################################
  -
    - <<: *problem_type_bf16
      UseBias: 1
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [1]
        - TDMStore: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: relu]
