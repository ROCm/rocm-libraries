# f16 accumulation with one-wave (WaveTile 2x2) StreamK kernels and TDM loads (TDMInst 3), the groups of
# f16acc_streamk_gfx1250.yaml: xfail on gfx1250. On split tiles these kernels give wrong results on hardware with f32
# accumulation as well (pre-existing, not specific to f16 accumulation); the emulator's default grid gives whole tiles,
# so they run and pass there.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, xfail-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 23
  DataInitTypeB: 26
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250-strict

BenchmarkProblems:
  ########################################
  # D h
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup: StaticGrid, linear and tree fixup, DefaultWGM
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False, True]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StreamKFixupTreeReduction: [0, 1]
        - WorkGroupMapping: [1, 3, -2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 512]
          - Exact: [129, 127, 2, 1024]

    - # BenchmarkProblemSizeGroup: DynamicWorkQueue and Hybrid
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [True]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [DynamicWorkQueue, Hybrid]
        - StreamKFixupTreeReduction: [0, 1]
        - WorkGroupMapping: [1, -3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 640]
          - Exact: [129, 127, 2, 1024]

    - # BenchmarkProblemSizeGroup: SpaceFillingAlgo, one level and two levels of 2 x 2
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [True]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StreamKFixupTreeReduction: [0, 1]
        - SpaceFillingAlgo: [[2], [3, 0]]
        - SFCWGM: [[[2, 2]]]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [161, 97, 1, 512]
          - Exact: [129, 127, 2, 384]

  ########################################
  # D F8  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [True]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid, DynamicWorkQueue]
        - StreamKFixupTreeReduction: [0, 1]
        - WorkGroupMapping: [-2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 512]
          - Exact: [129, 127, 2, 1024]

  ########################################
  # D h, fp4 B
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DataTypeA: F8
      DataTypeB: F4
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False]
        - ConvertAfterDS: [True]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - StreamKFixupTreeReduction: [0, 1]
        - WorkGroupMapping: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
