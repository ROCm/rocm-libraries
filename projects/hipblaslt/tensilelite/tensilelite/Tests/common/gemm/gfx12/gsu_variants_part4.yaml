# Gap Coverage: GlobalSplitU variants
# Tests GlobalSplitUCoalesced and GlobalSplitUWorkGroupMappingRoundRobin

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250
  UniformSummationOrder: 0

BenchmarkProblems:

  # FP16 with larger GlobalSplitU values
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [2, 4, 8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 256]  # Medium
          - Exact: [256, 256, 1, 512]  # Larger
          - Exact: [512, 256, 1, 1024] # Non-square
          - Exact: [127, 129, 1, 257]  # Odd
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 64, 256], [1], [256, 256, 1024] ]
