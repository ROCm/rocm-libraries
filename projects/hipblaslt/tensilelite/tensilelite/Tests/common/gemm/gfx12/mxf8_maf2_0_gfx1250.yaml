TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  # Not validated per element: the gfx1250 FP8 block-scaled WMMA sums with a one-sided error of
  # ~2e-4 of sum(|a*b|), and with 2^±10 block scales a few outputs cancel 500-50000x, which fails
  # the client's per-element BF16 check although the data and reference are exact. hipBLASLt's
  # matmul_one_mxfp8_maf2_0 gtests check these kernels with a norm check instead.
  NumElementsToValidate: 0
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  # Maf2_0 (28) on block-scaled FP8 (MXFP8): E8M0 block scales 2^(k - 11), k ~ Binomial(21, 0.5),
  # data uniform over the finite F8 encodings (mblas pow2_binomial + uniform_native), seeded
  # per matrix and batch; MX data needs MXDataGenerator. C (BF16) is N(0,1) with beta 2.
  # BF16 output: with 2^±10 block scales the outputs reach ~1e7 (E4M3) to ~1e12 (E5M2), beyond
  # FP16/FP8 outputs.
  MXDataGenerator: True
  DataInitTypeA: 28
  DataInitTypeB: 28
  DataInitTypeC: 28
  DataInitTypeBeta: 2
  DataInitTypeD: 2
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2

BenchmarkProblems:
  #######################################
  # TN - standard, MXF8SS Block32, E8 MT256x224
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 7,  2, 2]
        - HalfPLR: [0]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 224, 1, 2048]
          - Exact: [256, 256, 1, 2048]
