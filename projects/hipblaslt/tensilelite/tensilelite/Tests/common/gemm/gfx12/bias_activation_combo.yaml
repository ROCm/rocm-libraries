# A0-compatible test: Bias + Activation combinations
# Small problem sizes with various bias/activation types

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 3
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Bias + Activation combinations
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      UseBias: 1
      Activation: True
      BiasDataTypeList: ['h', 's']
      ActivationType: hipblaslt_all

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0]
        - ScheduleIterAlg: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 2, 128]  # Batched
          - Exact: [63, 65, 1, 67]     # Odd sizes
          - Exact: [256, 128, 1, 256]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [32, 32, 128], [32, 32, 128], [1], [64] ]
        - BiasTypeArgs: ['h', 's']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
          - [Enum: gelu]
          - [Enum: sigmoid]
