# Single-wave TDM kernels (one 32-thread wave per workgroup):
#  - HalfPLR with a K tail: the tail loop and the stagger removal read the
#    global-read increments after the unrolled loop.
#  - StreamK with DepthU == MatrixInstK (no cross-iteration local-read prefetch):
#    the unrolled loop has to wait for the tensor load issued one trip earlier.
#  - ClusterDim [2, 2] StreamK HalfPLR: the increments are assembler constants.
# Loaded by unit/test_tdm_single_wave_codegen.py as well as common tests.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 0
  DataInitTypeScaleAlphaVec: 1
  KernelTime: True
  BoundsCheck: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 0
  NumBenchmarks: 1
  PrintWinnersOnly: False
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 1
      UseScaleAlphaVec: 1
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 1, 1, 1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [0]
        - HalfPLR: [0, 1]
        - DepthU: [32, 64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - SourceSwap: [false]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - ClusterDim: [[1, 1], [2, 2]]
        - StreamK: [0, 3]
        - WorkGroupMapping: [8]
        - StaggerU: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [336, 144, 4, 7712]
          - Exact: [48, 720, 1, 416]
          - Exact: [48, 720, 16, 208]
        - BiasTypeArgs: [s]
        - ActivationArgs:
          - [Enum: none]
