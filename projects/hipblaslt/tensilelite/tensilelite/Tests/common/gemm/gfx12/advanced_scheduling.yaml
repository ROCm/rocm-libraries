# Advanced Scheduling Parameters
# GlobalReadPerMfma: [0.01 ... 32.0] - Global reads per MFMA
# LocalWritePerMfma: [-1, 0.01 ... 32.0] - Local writes per MFMA
# MinGRIncPerMfma: [-1, 1, 2, ..., 9] - Min global read increments per MFMA
# ScheduleGlobalRead: [0, 1] (expand coverage)
# ScheduleLocalWrite: [0, 1] (expand coverage)

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # GlobalReadPerMfma - control global read density
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
        - GlobalReadPerMfma: [0.5, 1.0, 2.0, 4.0]  # TEST different densities
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [64, 64, 256], [64, 64, 256], [1], [64] ]

  # LocalWritePerMfma - control local write density
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
        - LocalWritePerMfma: [-1, 0.5, 1.0, 2.0]  # TEST auto and specific values
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]

  # MinGRIncPerMfma - minimum global read increments
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
        - MinGRIncPerMfma: [-1, 1, 2, 4]  # TEST auto and specific increments
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [128], [128], [1], [64, 64, 256] ]

  # ScheduleGlobalRead and ScheduleLocalWrite (expand coverage)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleGlobalRead: [0, 1]  # TEST scheduling modes
        - ScheduleLocalWrite: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256] ]
