        - TDMInst: [3]
        - ScheduleIterAlg: [4]
        - InitCIterWmma: [-1, 0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
