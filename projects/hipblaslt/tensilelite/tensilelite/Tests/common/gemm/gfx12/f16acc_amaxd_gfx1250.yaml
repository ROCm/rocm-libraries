# f16 accumulation with OutputAmaxD: the amax of the f32 epilogue values (after alpha and beta, before the conversion to
# D), kept in f32, for D h, f8 and bf16 at odd M and N edges, GSU 1 (the amax reduction needs one output tile per
# workgroup, so no split-K or StreamK). The inputs are all ones and K at most 1024, so the f16 accumulator holds K
# exactly; alpha 2, beta -1 and C TrigCos.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 1
  DataInitTypeB: 1
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  ########################################
  # D h
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      OutputAmaxD: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 64, 1, 1, 2, 2, 1, 1], [16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False, True]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 1024]
          - Exact: [128, 96, 1, 512]

  ########################################
  # D f8
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      OutputAmaxD: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 64, 1, 1, 2, 2, 1, 1], [16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False, True]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 128]
          - Exact: [128, 96, 1, 512]

  ########################################
  # D bf16
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      OutputAmaxD: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 64, 1, 1, 2, 2, 1, 1], [16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False, True]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 1024]
          - Exact: [128, 96, 1, 512]
