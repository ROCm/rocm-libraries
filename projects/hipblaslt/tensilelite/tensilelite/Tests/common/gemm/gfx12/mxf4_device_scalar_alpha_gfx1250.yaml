TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 1
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  # Deliberately non-unit: device scalar mode must ignore this inline alpha.
  DataInitTypeAlpha: 17
  # Nonzero beta*C must not be scaled again by the SingleBuffer conversion.
  DataInitTypeBeta: 1
  # Scalar: effective alpha=+2. Vector: inline alpha(-1) * vector factor(+2)=-2.
  DataInitTypeScaleAlphaVec: 2
  NumWarmups: 0
  EnqueuesPerSync: 0
  PrintWinnersOnly: False
  Architecture: gfx1250
  PrintLevel: 2
  DisableAsmComments: True

BenchmarkProblems:
  -
    - # Mode 1 (M direction) with a device per-tensor alpha.
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 1
      UseScaleAlphaVec: 1
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: f8
      DataTypeMXSB: f8

    - # Cover direct output, MultipleBuffer conversion, and MBSK reduction.
      InternalSupportParams:
        SupportDeviceScalarAlpha: True
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 1, 1, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [-1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - GlobalSplitU: [1, 2]
        - GlobalSplitUAlgorithm: ["MultipleBuffer", "MultipleBufferSingleKernel"]
        # Keep MBSK from falling back to MultipleBuffer at runtime.
        - AdaptiveGemmGSUA: [0]
        - AssertSummationElementMultiple: [16]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
          - Exact: [126, 130, 1, 256]
        - BiasTypeArgs: ['s']
        # Reuse each kernel in scalar and vector mode; keep their results separate.
        - DeviceScalarAlpha: [True, False]
  -
    - # Mode 2 (N direction) with a device per-tensor alpha.
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 2
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: f8
      DataTypeMXSB: f8

    - # Cover direct output, MultipleBuffer conversion, and MBSK reduction.
      InternalSupportParams:
        SupportDeviceScalarAlpha: True
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 1, 1, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [-1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - GlobalSplitU: [1, 2]
        - GlobalSplitUAlgorithm: ["MultipleBuffer", "MultipleBufferSingleKernel"]
        - AdaptiveGemmGSUA: [0]
        - AssertSummationElementMultiple: [16]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
        - DeviceScalarAlpha: [True, False]
  -
    - # Mode 3 (runtime-selected M/N direction) with a device per-tensor alpha.
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 3
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: f8
      DataTypeMXSB: f8

    - # Cover direct output, MultipleBuffer conversion, and MBSK reduction.
      InternalSupportParams:
        SupportDeviceScalarAlpha: True
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 1, 1, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [-1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - GlobalSplitU: [1, 2]
        - GlobalSplitUAlgorithm: ["MultipleBuffer", "MultipleBufferSingleKernel"]
        - AdaptiveGemmGSUA: [0]
        - AssertSummationElementMultiple: [16]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
        - FactorDimArgs: [0, 1]
        - DeviceScalarAlpha: [True, False]
  -
    - # SingleBuffer with FP32 workspace and a separate FP16 output conversion.
      OperationType: GEMM
      DataType: F4
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 1
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: f8
      DataTypeMXSB: f8
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      InternalSupportParams:
        SupportDeviceScalarAlpha: True
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 1, 1, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [-1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - StoreRemapVectorWidth: [0]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - GlobalSplitU: [1, 2, 4]
        - GlobalSplitUAlgorithm: [SingleBuffer]
        - AssertSummationElementMultiple: [16]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 512]
          - Exact: [126, 130, 1, 512]
        - DeviceScalarAlpha: [True]
