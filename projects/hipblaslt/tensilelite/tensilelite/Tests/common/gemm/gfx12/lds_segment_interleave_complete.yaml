# GFX1250-specific: LDSSegmentInterleave - LDS segment interleaving
# LDSSegmentInterleave: [-1, 0, 1]
#   -1 = auto (enable only where no extra LDS needed)
#    0 = off (baseline layout)
#    1 = on (enable with LDS reservation if needed)
# Avoids segment conflicts on gfx1250 dual LDS read ports

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # LDSSegmentInterleave with FP16, MIWaveGroup [2,2]
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 2, 2]  # MIWaveGroup [2,2]
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - LDSSegmentInterleave: [-1, 0, 1]  # TEST ALL MODES
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 64, 256], [128, 64, 256], [1], [128] ]

  # LDSSegmentInterleave with BF16, MIWaveGroup [4,1]
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 4, 1]  # MIWaveGroup [4,1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - LDSSegmentInterleave: [-1, 0, 1]
        - GlobalReadVectorWidthA: [8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
          - Exact: [256, 256, 1, 256]
          - Range: [ [64, 64, 128], [64], [1], [64] ]

  # LDSSegmentInterleave with FP8, MIWaveGroup [1,4]
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 1, 1, 1, 4]  # MIWaveGroup [1,4], FP8
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - LDSSegmentInterleave: [0, 1]  # Test on vs off
        - GlobalReadVectorWidthB: [8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 512, 1, 256]
          - Range: [ [128], [64, 64, 256], [1], [128] ]
