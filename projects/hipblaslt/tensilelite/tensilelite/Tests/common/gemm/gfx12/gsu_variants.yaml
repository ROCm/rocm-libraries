# Gap Coverage: GlobalSplitU variants
# Tests GlobalSplitUCoalesced and GlobalSplitUWorkGroupMappingRoundRobin

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP16 with GlobalSplitUCoalesced
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - GlobalSplitU: [2, 4]
        - GlobalSplitUCoalesced: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 256]  # Medium
          - Exact: [256, 256, 1, 512]  # Larger
          - Exact: [512, 512, 1, 1024] # Large
          - Exact: [127, 129, 1, 257]  # Odd
          - Exact: [256, 128, 1, 512]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256, 256, 1024] ]

  # BF16 with GlobalSplitUWorkGroupMappingRoundRobin
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [2, 4]
        - GlobalSplitUWorkGroupMappingRoundRobin: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 256]  # Medium
          - Exact: [256, 256, 1, 512]  # Larger
          - Exact: [384, 384, 1, 768]  # Non-power-of-2
          - Exact: [127, 129, 1, 257]  # Odd
          # === RANGE SIZES ===
          - Range: [ [128, 128, 384], [128, 128, 384], [1], [256, 256, 768] ]

  # FP16 with multiple GSU options combined
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [4]
        - GlobalSplitUCoalesced: [True]
        - GlobalSplitUWorkGroupMappingRoundRobin: [False, True]
        - GlobalSplitUAlgorithm: ["SingleBuffer", "MultipleBuffer"]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [256, 256, 1, 512]   # Medium
          - Exact: [512, 512, 1, 1024]  # Large
          - Exact: [1024, 1024, 1, 2048] # Very large
          - Exact: [255, 257, 1, 513]   # Odd
          # === RANGE SIZES ===
          - Range: [ [256, 256, 1024], [256, 256, 1024], [1], [512, 512, 2048] ]

  # FP16 with larger GlobalSplitU values
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [2, 4, 8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 256]  # Medium
          - Exact: [256, 256, 1, 512]  # Larger
          - Exact: [512, 256, 1, 1024] # Non-square
          - Exact: [127, 129, 1, 257]  # Odd
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 64, 256], [1], [256, 256, 1024] ]
