# A0-compatible test: Batched GEMM edge cases
# Various batch counts including 1, 2, 7, 16, 32

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Batched with various batch counts
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0]
        - ScheduleIterAlg: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          # Batch count variations
          - Exact: [32, 32, 1, 32]     # BatchCount = 1
          - Exact: [32, 32, 2, 32]     # BatchCount = 2
          - Exact: [64, 64, 4, 64]     # BatchCount = 4
          - Exact: [64, 64, 7, 64]     # BatchCount = 7 (prime)
          - Exact: [64, 64, 16, 64]    # BatchCount = 16
          - Exact: [64, 64, 32, 64]    # BatchCount = 32
          - Exact: [16, 16, 64, 16]    # Many batches, small tiles
          - Exact: [128, 128, 3, 128]  # Odd batch count
          # Size variations with batching
          - Exact: [63, 65, 5, 67]     # Odd sizes with prime batch
          - Exact: [127, 129, 11, 131] # Near power-of-2 with prime batch
          - Exact: [256, 128, 8, 256]  # Non-square with batch
          # === RANGE SIZES ===
          # Batch sweep from 1 to 16 step 3
          - Range: [ [64], [64], [1, 3, 16], [64] ]
          # M,N sweep with fixed batch=4
          - Range: [ [32, 32, 128], [32, 32, 128], [4], [64] ]
