TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

# LDSSegmentBRotate with MX scales: the MXSB reads must follow the rotated B columns.
# Trig init gives every scale block its own value; Random (rand_int) and One data
# generate unit scales, which cannot detect a scale read from the wrong column.
# Group 1: MXF4 32x16x128 MI with SourceSwap (MatrixInstN == wave): one MXSB ds_load per
#          vIdx; two MXSB read addresses swap the vIdx halves per SIMD pair (nV = 2 and 4).
# Group 2: MXF4 16x16x128 MI: MXSB TileSpan half-wave select flipped per SIMD pair.

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 16
  ValidationPrintValids: False
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 3
  DataInitTypeMXSA: 12
  DataInitTypeMXSB: 13
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  NumWarmups: 0
  EnqueuesPerSync: 0
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  -
    - # ProblemType, TN, MXF4 block-32 e8 scales
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup: 32x16 MI, SourceSwap -> effective MatrixInstN 32
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [32, 16, 128, 1,  1,  8, 4,  2, 2]  # MT256x256 (M/N swapped by SourceSwap)
        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - HalfPLR: [1]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]
        - LDSSegmentBRotate: [0, 1]
        - PrefetchGlobalRead: [1, 2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [8]                     # WaveTileA (coarse A)
        - VectorWidthB: [2, 1]                  # nV = WaveTileB/VWB = 2, 4
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]     # two unroll iterations
          - Exact: [264, 256, 1, 544]     # M edge + tail loop
          - Exact: [256, 256, 1, 320]     # tail loop
        - ActivationArgs:
          - [Enum: none]

    - # BenchmarkProblemSizeGroup: 16x16 MI, MXSB TileSpan
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 8,  2, 2]  # MT256x256
        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - HalfPLR: [1]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]
        - LDSSegmentBRotate: [0, 1]
        - PrefetchGlobalRead: [1, 2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [8]                     # WaveTileA (coarse A)
        - VectorWidthB: [4]                     # WaveTileB/VWB = 2: TileSpan half-wave select
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]     # two unroll iterations
          - Exact: [264, 256, 1, 544]     # M edge + tail loop
          - Exact: [256, 256, 1, 320]     # tail loop
        - ActivationArgs:
          - [Enum: none]
