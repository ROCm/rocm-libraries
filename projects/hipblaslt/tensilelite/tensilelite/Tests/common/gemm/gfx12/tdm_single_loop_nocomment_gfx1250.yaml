TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch
# One unroll iteration (K <= DepthU with tail folding, K in [DU, 2*DU) without) takes the PGR2
# one-tile escape to toPGR1; an M/N edge tile then runs the ordinary NLL behind the OptNLL dispatch,
# which relies on the escape's tensorcnt drain + barrier. The hipblaslt build disables asm comments,
# under which the barrier planner used to drop that sync, so this config disables them too.
GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 7
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 3
  DataInitTypeScaleAlphaVec: 3
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"
  DisableAsmComments: True

BenchmarkProblems:
  -
    - # ProblemType, TN, bias + scaleAlpha vector (the OOB exact-tuned BBS TN kernel)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1
      UseBias: 1
      BiasDataTypeList: [s, b]

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 4, 2, 2]
        - WorkGroup:
          - [32, 4, 1]
        - DepthU: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [0]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - LDSTrInst: [True]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [512]
        - LdsBlockSizePerPadB: [256]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - VectorWidthA: [8]
        - VectorWidthB: [4]
        - StoreVectorWidth: [8]
        - SourceSwap: [True]
        - MIArchVgpr: [True]
        - InitCIterWmma: [1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - ClusterDim:
          - [1, 1]
        - StaggerU: [32]
        - StaggerUStride: [256]
        - WorkGroupMapping: [1]
        - ActivationFuncCall: [True]
        - NonTemporalD: [3]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [336, 128, 1, 1]     # M edge (80 rows), K < DU: one folded iteration
          - Exact: [336, 128, 1, 16]
          - Exact: [336, 128, 1, 31]
          - Exact: [336, 128, 1, 32]    # K == DU: one iteration without a tail
          - Exact: [336, 128, 1, 33]
          - Exact: [384, 128, 1, 32]    # the second A wave holds no rows
          - Exact: [400, 128, 1, 1]
          - Exact: [256, 160, 1, 1]     # N edge
          - Exact: [256, 128, 1, 1]     # full tile: OptNLL
          - Exact: [336, 160, 3, 16]    # M and N edges, batched
        - BiasTypeArgs: ['b']
        - ActivationArgs:
          - [Enum: none]
