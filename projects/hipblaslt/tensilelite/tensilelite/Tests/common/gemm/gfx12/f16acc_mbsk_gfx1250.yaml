# f16 accumulation with split-K MultipleBufferSingleKernel, alpha 2 and beta -1: the slices store f16 partials and the
# last workgroup of each tile adds them in f32 in slice order and rounds once, as the MultipleBuffer reduction kernel
# does. GSU 2 and 3 with single-element stores (GSU 2 is the shortcut where slice 1 adds its own accumulators), GSU 4
# and 8 with pairs, GSU 17 over more than one round of the reduction, with both MbskPrefetchMethod forms; odd M and N,
# batch 2 and an fp4 operand. The D h rows that differ under the emulator are in f16acc_mbsk_ffm_gfx1250.yaml.
# Inputs as f16acc_brotate, so the emulator results do not change from run to run.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 23
  DataInitTypeB: 26
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

