# f16 accumulation with the GSU chosen at run time (GlobalSplitU -1): MultipleBuffer and MultipleBufferSingleKernel,
# with and without AdaptiveGemmGSUA, interleaved and coalesced slices. The single-tile sizes give the heuristic GSU 1, 2,
# 3 and 17 where the CU count allows it, the 64-tile size a GSU bounded by the CU count; no K is a multiple of DepthU.
# Inputs as f16acc_gsu. The D h rows at the larger K are in f16acc_gsu_auto_ffm_gfx1250.yaml.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 23
  DataInitTypeB: 26
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  ########################################
  # D h
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [2]
        - AssertSummationElementMultiple: [128]
        - DepthU: [256]
        - VectorWidthA: [2]
        - VectorWidthB: [2]
        - SourceSwap: [True]
        - GlobalSplitU: [-1]
        - GlobalSplitUAlgorithm: [MultipleBuffer, MultipleBufferSingleKernel]
        - AdaptiveGemmGSUA: [0, 1]
        - GlobalSplitUCoalesced: [False, True]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 640]
          - Exact: [32, 32, 1, 1664]

  ########################################
  # D F8
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [2]
        - AssertSummationElementMultiple: [128]
        - DepthU: [256]
        - VectorWidthA: [2]
        - VectorWidthB: [2]
        - SourceSwap: [True]
        - GlobalSplitU: [-1]
        - GlobalSplitUAlgorithm: [MultipleBuffer, MultipleBufferSingleKernel]
        - AdaptiveGemmGSUA: [0, 1]
        - GlobalSplitUCoalesced: [False, True]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 640]
          - Exact: [32, 32, 1, 1664]
          - Exact: [32, 32, 1, 2432]
          - Exact: [32, 32, 1, 13184]
          - Exact: [256, 256, 1, 2432]

  ########################################
  # D B
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [2]
        - AssertSummationElementMultiple: [128]
        - DepthU: [256]
        - VectorWidthA: [2]
        - VectorWidthB: [2]
        - SourceSwap: [True]
        - GlobalSplitU: [-1]
        - GlobalSplitUAlgorithm: [MultipleBuffer, MultipleBufferSingleKernel]
        - AdaptiveGemmGSUA: [0, 1]
        - GlobalSplitUCoalesced: [False, True]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 640]
          - Exact: [32, 32, 1, 1664]
          - Exact: [32, 32, 1, 2432]
          - Exact: [32, 32, 1, 13184]
          - Exact: [256, 256, 1, 2432]
