TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  # Maf2_0 (28): N(0,1) drawn in double and rounded to float, fixed-seed, per-tensor seeding;
  # C is used (beta != 0)
  DataInitTypeA: 28
  DataInitTypeB: 28
  DataInitTypeC: 28
  DataInitTypeBeta: 2
  #DataInitTypeAlpha: 0
  #DataInitTypeBeta: 1
  #PrintTensorC: 1
  #PrintTensorD: 1
  #PrintTensorRef: 1
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250

BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0
      Activation: False

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1,  1,  1, 1,  2, 2 ]
        - DepthU: [32]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [0]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - PrefetchLocalRead: [1] #
        - PrefetchGlobalRead: [2] #
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [2]
        - GlobalSplitUAlgorithm: [MultipleBufferSingleKernel]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - 1LDSBuffer: [0]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - WavefrontSize: [32]
        #- AssertFree0ElementMultiple: [ 16 ]
        #- AssertFree1ElementMultiple: [ 16 ]
        #- AssertSummationElementMultiple: [ 32 ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 2, 127]
          - Exact: [128, 128, 2, 128]
          - Exact: [129, 129, 2, 129]
          # K <= 1024: the client checks each element against 2e-4*(|a|+|b|+1), and with Gaussian
          # data a cancelling FP32 dot product fails that about 3e-5 of the time at K=4096.
          - Exact: [64, 64, 1, 1024]
