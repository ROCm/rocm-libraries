TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  Architecture: gfx1250
  NumElementsToValidate: -1
  NumWarmups: 0
  EnqueuesPerSync: 0
  SyncsPerBenchmark: 0
  DataInitTypeA: 1
  DataInitTypeB: 1
  DataInitTypeMXSA: 1
  DataInitTypeMXSB: 1
  DataInitTypeC: 1
  DataInitTypeD: 0
  # All-one inputs give D = 2*512 + 1 = 1025. Losing a GSU partial is visible.
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 1
  ValidationMaxToPrint: 4
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: F4
      DestDataType: h  # SingleBuffer uses FP32 atomics into the workspace.
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: f8
      DataTypeMXSB: f8
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 1, 1, 2, 2]]
        - DepthU: [128]
        - TDMInst: [3]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [-1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - StoreRemapVectorWidth: [0]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - GlobalSplitU: [1, 2, 4]
        - GlobalSplitUAlgorithm: [SingleBuffer]
        - AssertSummationElementMultiple: [16]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 512]
          - Exact: [126, 130, 1, 512]
