TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  # Not validated per element, as in the MXFP8 maf2_0 test: the gfx1250 FP6 block-scaled WMMA sums
  # with a small one-sided error, and heavily cancelling outputs then fail the client's per-element
  # BF16 check (seen with BF6) although the data and reference are exact.
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  # Maf1_0 (30) on block-scaled FP6 (MXFP6): every E8M0 block scale is 0.5 (0x7E) and the data
  # codes are sin (A) / cos (B) of idx = i + j*rows + b*rows*cols rounded at unit scale (E2M3
  # rounds |v| <= 0.0625 to 0); MX data needs MXDataGenerator. C (BF16) is cos(idx) with beta 2.
  # BF16 output, as in the MXFP6 maf2_0 test.
  MXDataGenerator: True
  DataInitTypeA: 30
  DataInitTypeB: 30
  DataInitTypeC: 30
  DataInitTypeBeta: 2
  DataInitTypeD: 3
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  PrintLevel: 2

BenchmarkProblems:
  #######################################
  # TN - MX F6, Block32, E8
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F6
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  1, 1,  1, 1]
          - [16, 16, 128, 1,  1,  1, 1,  2, 2]
        - DepthU: [128, 256]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - TransposeLDS: [1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - TDMInst: [3]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
          - Exact: [128, 128, 1, 512]
          - Exact: [128, 128, 4, 256] # batch=4 (wave-separated)
          - Exact: [128, 128, 1, 136] # K=136, tail=8 not multiple of MXBlock=16 or 32 -> expect rejection

  #######################################
  # TN - MX F6, Block16, E8
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F6
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
