          - Exact: [128, 128, 4, 256] # batch=4 (wave-separated)
          - Exact: [128, 128, 1, 136] # K=136, tail=8 not multiple of MXBlock=16 -> expect rejection
  #######################################
  # B6 copy of the first problem
  #######################################
