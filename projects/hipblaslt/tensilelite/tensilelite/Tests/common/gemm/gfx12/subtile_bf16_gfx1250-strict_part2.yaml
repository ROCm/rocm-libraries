TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-stinkytofu, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250-strict
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:

  -
    - # ProblemType -- large DepthU
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]  # MT 32x32   WG 1x1
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]  # MT 64x64   WG 1x1
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]  # MT 64x64   WG 2x2
        - DepthU: [256, 512, 1024]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [0, 2]
        - PrefetchGL2: [0, 1]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - TileProcessingStrategy: ["None"]
        - TDMInst: [3]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - PreloadKernArgs: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 1024]
          - Exact: [64, 64, 1, 1024]
          - Exact: [64, 64, 1, 512]
          - Exact: [64, 64, 1, 256]
          # Odd M/N
          - Exact: [33, 31, 1, 1024]
          - Exact: [63, 65, 1, 512]
          - Exact: [63, 65, 1, 1024]
          # Edge WG: waves with 0 valid rows (MT 64x64 WG 2x2, perWaveRows=16)
          - Exact: [1,  1,  1, 1024]   # wave0: 1 row, waves 1-3: 0 rows
          - Exact: [16, 17, 1, 1024]   # wave0: 16, wave1: 0-1, waves 2-3: 0
          - Exact: [48, 48, 1, 1024]   # wave0-2: 16, wave3: 0 rows
          - Exact: [49, 63, 1, 1024]   # wave0-2: 16, wave3: 1 row
          # Tail loop: K is multiple of WMMA-K(32) but not DepthU
          - Exact: [32, 32, 1, 960]
          - Exact: [64, 64, 1, 192]
          - Exact: [33, 31, 1, 960]
