        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [2]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
