        - AssertSummationElementMultiple: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]
        - VectorWidthA: [2]
        - VectorWidthB: [2]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - GlobalSplitU: [1]
        - SourceSwap: [False]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [131, 130, 1, 256]
          - Exact: [65, 33, 1, 96]

