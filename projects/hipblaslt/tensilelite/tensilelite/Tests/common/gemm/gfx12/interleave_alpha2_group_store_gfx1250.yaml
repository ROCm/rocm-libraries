TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250

BenchmarkProblems:
  #######################################
  # bf16 - TN
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  4, 4,  2, 2]
        - DepthU: [64]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1,2]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True,False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - NumElementsPerBatchStore: [0, 16]
        - GroupLoadStore: [False, True]
        - InterleaveAlpha: [0, 2]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [1023, 1023, 1, 1023]

  #######################################
  # fp8 - TN
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  4, 4,  2, 2]
        - DepthU: [128]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1,2]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True,False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - CompactLoopStore: [False,True]
        - NumElementsPerBatchStore: [0, 16]
        - GroupLoadStore: [False, True]
        - InterleaveAlpha: [0, 2]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [1023, 1023, 1, 1023]
