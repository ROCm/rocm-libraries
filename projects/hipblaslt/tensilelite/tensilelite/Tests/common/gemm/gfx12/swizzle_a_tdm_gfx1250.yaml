    - # ProblemType, TN, F4 swizzle-A, multi-wave, tail K (K % DepthU != 0, K % 64 != 0), M/N edges, batched.
      # F4 is handled as packed bytes: two F4 per byte give the F8 byte layout (BK=32B), so swzK=64
      # elements and the TDM descriptor counts bytes (K extents halved). Sub-byte needs a packed ld.
      # VW>1 (WT 2/4) exercises the 16B per-MI-tile LDS pad via TDM iterate-mode (tile > 1024B at DepthU 256).
