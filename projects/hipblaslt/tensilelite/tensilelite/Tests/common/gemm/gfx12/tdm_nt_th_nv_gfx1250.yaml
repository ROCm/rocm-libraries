TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch
GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  ########################################
  # gfx1250 TDM loads (tensor_load_to_lds) with NonTemporal scope, TemporalHint
  # and NonVolatile. MIWaveGroup [1, 1] issues one tensor_load_to_lds per tensor,
  # so per-tensor hints apply. MIWaveGroup [2, 2] is wave-separated: A and B share
  # one tensor_load_to_lds, which carries a field only when both tensors request
  # the same value (the per-tensor groups below disagree, the last group agrees).
  ########################################
  -
    - &problem_type_base # ProblemType NN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      UseBeta: True
      Batched: True
      TransposeA: False
      TransposeB: False
    - &bpsg_tdm_nt_th_nv # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - LDSTrInst: [True]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
          - [16, 16, 32, 1, 1, 1, 1, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [1]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - Groups:
          - - TemporalHintA: [1, 2, 6]
              TemporalHintB: [0, 3]
            - NonTemporalA: [1, 3]
              NonTemporalB: [0, 2]
            - NonVolatileA: [0, 1]
              NonVolatileB: [1]
            - TemporalHint: [0, 1, 5]
              NonTemporal: [0, 2]
              NonVolatile: [0, 1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [127, 129, 1, 200]
  -
    - <<: *problem_type_base # ProblemType TT
      TransposeA: True
      TransposeB: True
    - *bpsg_tdm_nt_th_nv
