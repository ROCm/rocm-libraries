# Persistent Kernel Advanced Parameters
# WorkAssignment: ["StaticGrid", "DynamicWorkQueue", "Hybrid"]
# TileProcessingStrategy: ["None", "DataParallel", "StreamK"]
# ReuseAcrossPersistent: [0, 1] - Reuse operand across persistent tiles
# PrefetchAcrossPersistent: [0, 1] - Prefetch across persistent iterations
# PersistentXCCMapping: [0, 2-8] - XCC mapping for persistent kernels
# WorkQueueStealing: [0, 1] - Work queue stealing
# StreamKFixupTreeReduction: [0, 1] - Tree reduction for StreamK fixup

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # WorkAssignment modes
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3]  # StreamK mode for persistent kernels
        - WorkAssignment: ["StaticGrid", "DynamicWorkQueue", "Hybrid"]  # TEST all modes
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [128, 128, 256], [128, 128, 256], [1], [128] ]

  # TileProcessingStrategy modes
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - TileProcessingStrategy: ["None", "DataParallel", "StreamK"]  # TEST all strategies
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
          - Exact: [256, 256, 1, 256]
          - Range: [ [64, 64, 256], [64, 64, 256], [1], [64] ]

  # ReuseAcrossPersistent
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3]  # StreamK mode for persistent kernels
        - ReuseAcrossPersistent: [0, 1]  # TEST operand reuse
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Range: [ [128], [128], [1], [64, 64, 128] ]

  # PrefetchAcrossPersistent
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3]  # StreamK mode for persistent kernels
        - PrefetchAcrossPersistent: [0, 1]  # TEST prefetch across tiles
        - PrefetchGlobalRead: [2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 128, 256], [128, 128, 256], [1], [128] ]

  # PersistentXCCMapping and WorkQueueStealing
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3]  # StreamK mode for persistent kernels
        - PersistentXCCMapping: [0, 2, 4]  # TEST XCC mapping modes
        - WorkQueueStealing: [0, 1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]

  # StreamKFixupTreeReduction
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3, 4]
        - StreamKFixupTreeReduction: [0, 1]  # TEST tree reduction
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256] ]
