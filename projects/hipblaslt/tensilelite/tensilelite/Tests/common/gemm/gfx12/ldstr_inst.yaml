# A0-compatible test: LDSTrInst (LDS Transpose Instructions) validation
# Uses LDS transpose for tile-major tensor layouts

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Test LDSTrInst with various transpose combinations
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True  # Use True with batch=1 to avoid non-batched bug

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32]
        - WavefrontSize: [32]
        - LDSTrInst: [True, False]  # Explicit comparison
        - TransposeLDS: [-1, 0, 1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0]
        - ScheduleIterAlg: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [256, 256, 1, 256]  # Large
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [97, 97, 1, 97]     # Prime
          - Exact: [64, 256, 1, 128]   # Non-square
          - Exact: [64, 64, 5, 64]     # Batched
          # === RANGE SIZES ===
          - Range: [ [32, 32, 128], [32, 32, 128], [1], [64] ]
          - Range: [ [63, 1, 65], [63, 1, 65], [1], [64] ]
