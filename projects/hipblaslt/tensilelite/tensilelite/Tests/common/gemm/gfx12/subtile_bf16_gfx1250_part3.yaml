TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-stinkytofu, skip-gfx1250-strict]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          # Large macro-tiles: DepthU restricted to 64 (LDS capacity)
          - [16, 16, 32, 1,  1, 11, 8,  2, 2]  # MT 352x256 WG 2x2
          - [16, 16, 32, 1,  1, 12, 8,  2, 2]  # MT 384x256 WG 2x2
          - [16, 16, 32, 1,  1, 10, 10,  2, 2]  # MT 320x320 WG 2x2
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [0, 2]
        - PrefetchGL2: [0, 1, 2]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - TileProcessingStrategy: [StreamK]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - PreloadKernArgs: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # Full macro-tile multiples
          - Exact: [352, 256, 1, 256]   # MT 352x256
          - Exact: [384, 256, 1, 256]   # MT 384x256
          - Exact: [320, 320, 1, 256]   # MT 320x320
          # Mult-of-32 edges
          - Exact: [352, 256, 1, 64]
          - Exact: [384, 256, 1, 128]
          - Exact: [320, 320, 1, 128]
          # Odd (non-aligned) M and N
          - Exact: [351, 257, 1, 64]
          - Exact: [383, 255, 1, 128]
          - Exact: [319, 321, 1, 64]
