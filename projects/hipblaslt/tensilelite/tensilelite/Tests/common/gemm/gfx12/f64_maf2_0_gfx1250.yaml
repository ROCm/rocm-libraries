TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  # Maf2_0 (28): N(0,1) FP64 data with fixed-seed, per-tensor seeding; C is used (beta != 0)
  DataInitTypeA: 28
  DataInitTypeB: 28
  DataInitTypeC: 28
  DataInitTypeBeta: 2
  #DataInitTypeAlpha: 0
  #DataInitTypeBeta: 1
  #PrintTensorC: 1
  #PrintTensorD: 1
  #PrintTensorRef: 1
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250

BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: d
      DestDataType: d
      ComputeDataType: d
      HighPrecisionAccumulate:  False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - ThreadTile:
          - [2, 2]
        - WorkGroup:
          - [4, 8, 1]
        - DepthU: [4]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [0]
        - StaggerU: [0]
        - ScheduleIterAlg: [4] ########SIA2 and SIA3 only support MatrixInstruction
        - TDMInst: [0]
        - PrefetchLocalRead: [1] #
        - PrefetchGlobalRead: [2] #
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [1] #
        - GlobalReadVectorWidthB: [1] #
        - 1LDSBuffer: [0]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - WavefrontSize: [32]
        #- AssertFree0ElementMultiple: [ 16 ]
        #- AssertFree1ElementMultiple: [ 16 ]
        #- AssertSummationElementMultiple: [ 32 ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 2, 127]
          - Exact: [128, 128, 2, 128]
          - Exact: [129, 129, 2, 129]
          - Exact: [64, 64, 1, 4096]
