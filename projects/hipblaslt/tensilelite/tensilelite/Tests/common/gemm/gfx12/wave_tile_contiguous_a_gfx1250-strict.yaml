# FP8, MXFP8 and MXFP4 with contiguous A rows and BRotate.
# Cover M/N edges, K tails, beta and batching.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: false
  BoundsCheck: 0
  PrintSolutionRejectionReason: true
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintWinnersOnly: false
  Architecture: gfx1250-strict
  KeepBuildTmp: true
  PrintLevel: 1
  SkipSlowSolutionRatio: 0.0
  NumBenchmarks: 1
  NumWarmups: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
