TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

# Edge-shift (d1 / B) trigger variant for logical-IR migration [G] edge-shift.
# Companion to bf16_edge_gfx1250.yaml (which triggers d0 / A). Here TransposeB=True
# => TLUB=True => tensorParametersB["rtv"]=True, and GlobalReadVectorWidthB:[2] with
# AssertFree1ElementMultiple:[1] => GuaranteeNoPartialB = (1 % 2 == 0) = False =>
# shiftVectorComponents (d1) is emitted for B. Edge problem sizes (127/129, not a
# multiple of 16) exercise the partial-vector shift on the free1 (N) dimension.
# NOTE: TDMInst must be 0 (non-TDM). The TDM load path forces GlobalReadVectorWidth=1
# (its own load vector width), which makes GuaranteeNoPartial=True and suppresses the
# shift. Non-TDM gfx1250 still goes through the logical pipeline (same as f64_gfx1250).
# GlobalReadVectorWidthA is left at -1; TransposeA=False (TLUA=True) means d0 may also
# trigger depending on the resolved GRVWA -- that is fine (extra coverage); the point
# of this file is to exercise the B-side (d1) shift that the NN yaml never reaches.

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  PrintLevel: 2
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250

BenchmarkProblems:
  #######################################
  # NT - TransposeB=True (TLUB=True => edge-shift d1 / B)
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 1
      Activation: True
      UseScaleAlphaVec: 1 #SAV
      BiasDataTypeList: ['s', 'b']
      ActivationType:  hipblaslt_all

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  2, 1,  1, 2 ]
          - [16, 16, 32, 1,  1,  4, 4,  2, 2 ]

        - DepthU: [32]
        - TransposeLDS: [-1]
        - LDSTrInst: [True, False]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [0]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - TDMInst: [0]
        - PrefetchLocalRead: [0]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [2]
        - 1LDSBuffer: [0]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - WavefrontSize: [32]
        - AssertFree0ElementMultiple: [1]
        - AssertFree1ElementMultiple: [1]
        - Groups:
          -
            - SourceSwap: True
            - StoreRemapVectorWidth: 0
          -
            - SourceSwap: False
            - StoreRemapVectorWidth: -1
            - VectorWidthA: 1
            - VectorWidthB: 1
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [129, 129, 1, 129]
        - BiasTypeArgs: ['s','b']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
