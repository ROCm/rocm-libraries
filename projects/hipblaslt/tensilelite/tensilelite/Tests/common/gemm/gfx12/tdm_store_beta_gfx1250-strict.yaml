TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch
GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 1
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 3
  DataInitTypeScaleAlphaVec: 3
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250-strict
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  ########################################
  # beta != 0, every TDMStoreInst level with AdaptiveGemm and SourceSwap 0 and 1 and
  # TDMInst 0 and 3: the TDM block loads C with tensor_load_to_lds bounded by
  # tensor_dim. The second size has a leading dimension larger than M, a multiple
  # of 8, and the next two give C and D different leading dimensions, of which
  # only one is a multiple of 8, so that the columns of C or of D do not start
  # 16-byte aligned there, as where ldd = M = 511: level 3 loads and stores those
  # tiles through the TDM block too. The last two leave one column in N, which only
  # the first wave loads and stores: at M = 511 the last tile has a WorkGroup0
  # offset, and at M = 253 the tile ends inside a store vector, so tensor_dim0
  # clips the C load mid-vector.
  ########################################
  -
    - &problem_type_bf16 # ProblemType TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      UseBeta: True
      Batched: True
      TransposeA: True
      TransposeB: False
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [0, 3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [0, 1]
        - TDMStoreInst: [1, 2, 3]
        - SourceSwap: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
          - Exact: [511, 509, 2, 128, 511, 520, 128, 128]
          - Exact: [511, 509, 2, 128, 520, 511, 128, 128]
          - Exact: [511, 257, 1, 128]
          - Exact: [253, 257, 1, 128]
  ########################################
  # The beta != 0 epilogue of a TDMStoreInst kernel reads the bias and ScaleAlphaVec vectors, which
  # the staged tile follows in LDS, too; with GlobalSplitU=-1 the K=512 size runs GSU 2.
  ########################################
  -
    - <<: *problem_type_bf16
      UseBias: 1
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1, -1]
        - TDMStoreInst: [2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
          - Exact: [255, 253, 1, 512]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: relu]
  ########################################
  # Non-atomic StreamK=3 at every level that uses the TDM block: whole tiles and the
  # tiles completed by the fixup read C in the TDM block on the paths of the level;
  # with K=1600 every workgroup stores two tiles. In the 32-batch sizes the last
  # element of a batch lies inside a store vector, so tensor_dim clips the C load
  # and the D store mid-vector, where a buffer load of C only partly in range
  # can return zero.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [8]
        - StreamK: [3]
        - TDMStoreInst: [1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [505, 509, 2, 256, 520, 520, 256, 256]
          - Exact: [505, 509, 2, 1600, 520, 520, 1600, 1600]
          - Exact: [505, 509, 32, 64, 520, 520, 64, 64]
          - Exact: [505, 257, 32, 64, 520, 520, 64, 64]
  ########################################
  # bf16 at store vector width 1 on every TDMStoreInst level, with AdaptiveGemm 0 and 1:
  # the store-width cascade has one masked block, which levels 1 and 2 store through
  # the TDM block, reading each C element back with a 2-byte DS load, and level 3 adds
  # the NonEdge path. The sizes have M-edge-only, N-edge-only, corner and interior
  # tiles and a leading dimension larger than M.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [0, 1]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # fp16 output at every TDMStoreInst level: the TDM block reads C back from the staged
  # tile with 16-byte loads, and at store vector width 1 with one ds_load_u16 or
  # ds_load_u16_d16_hi per element, the odd ones into the high half of their VGPR.
  # At width 1 levels 1 to 3 store the one masked block through the TDM block.
  ########################################
  -
    - <<: *problem_type_bf16
      DataType: h
      DestDataType: h
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1, 1]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [253, 257, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # StoreVectorWidth 4 at every level that uses the TDM block, which then stages and
  # reads back 8-byte vectors. The sizes have NonEdge, M-edge, N-edge and corner
  # workgroups and a leading dimension larger than M.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [4]
        - GlobalSplitU: [1]
        - TDMStoreInst: [1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 128]
          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # UseScaleAlphaVec 5: ScaleAlphaVec along M with the device-scalar bit, which selects the scalar
  # alpha in the vector preload; the TDM block sees the M vector, as with UseScaleAlphaVec 1.
  ########################################
  -
    - <<: *problem_type_bf16
      UseBias: 1
      UseScaleAlphaVec: 5
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: relu]
  ########################################
  # DataParallel persistent kernels (StreamK 3 with StreamKForceDPOnly): MT64x64 gives
  # 17 x 16 x 2 = 544 tiles for the 256 workgroups, so each workgroup stores several tiles through
  # the TDM block, with NonEdge, M-edge, N-edge and corner tiles and a leading dimension larger than M.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [8]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1025, 1023, 2, 128, 1040, 1040, 128, 128]
  ########################################
  # Non-atomic StreamK 4 and 5 (dynamic work queue and hybrid) with the sizes of the StreamK 3
  # group: K=256 gives whole tiles, and with K=1600 tiles are completed by the fixup.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [8]
        - StreamK: [4, 5]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [505, 509, 2, 256, 520, 520, 256, 256]
          - Exact: [505, 509, 2, 1600, 520, 520, 1600, 1600]
  ########################################
  # GlobalSplitU=-1 with SingleBuffer, MultipleBufferSingleKernel and AtomicDest, and
  # MultipleBufferSingleKernel with AdaptiveGemmGSUA 1: the GSU == 1 branch stores through the TDM
  # block, and the GSU > 1 branch keeps its buffer_store or atomics. K=128 runs GSU 1 and the
  # single-tile K=512 sizes GSU > 1. AtomicDest to bf16 D needs an even AssertFree0ElementMultiple
  # (packed atomics write element pairs), so it runs the sizes with M even.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [-1]
        - Groups:
          - - GlobalSplitUAlgorithm: [SingleBuffer, MultipleBufferSingleKernel]
              AdaptiveGemmGSUA: [0]
            - GlobalSplitUAlgorithm: [MultipleBufferSingleKernel]
              AdaptiveGemmGSUA: [1]
            - GlobalSplitUAlgorithm: [AtomicDest]
              AdaptiveGemmGSUA: [0]
              AssertFree0ElementMultiple: [2]
        - TDMStoreInst: [0, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
          - Exact: [510, 509, 2, 128, 520, 520, 128, 128]
          - Exact: [255, 253, 1, 512]
          - Exact: [254, 253, 1, 512]
  ########################################
  # ScaleCD: ScaleC and ScaleD are scalars in SGPRs, folded into beta and multiplied into
  # ValuC, so the TDM block applies them as the buffer_store path does.
  ########################################
  -
    - <<: *problem_type_bf16
      UseScaleCD: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 128]
          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # UseBias 3 and UseScaleAlphaVec 3 run at factor dim 1 (FactorDimArgs), the store tree of the
  # vectors along N in a kernel that holds the trees of both factor dims.
  ########################################
  -
    - <<: *problem_type_bf16
      UseBias: 3
      UseScaleAlphaVec: 3
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
        - BiasTypeArgs: ['s']
        - FactorDimArgs: [1]
        - ActivationArgs:
          - [Enum: relu]
  ########################################
  # Persistent spatial clusters, ClusterDim [2, 1] and [4, 1], with StreamK 3 and DataParallel
  # (StreamKForceDPOnly): a peer's next-tile multicast waits on the cluster barrier, which the workgroup
  # arrives at after its TDM store. MT64x64 gives 17 x 16 x 2 tiles: nwg0 = 17 leaves phantom peer tiles
  # for both cluster sizes, each workgroup stores several tiles, and there are M-edge, N-edge and corner tiles.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0, 1]
        - ClusterDim: [[2, 1], [4, 1]]
        - TDMStoreInst: [0, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1025, 1023, 2, 128, 1040, 1040, 128, 128]
  ########################################
  # PrefetchAcrossPersistent with StreamK 3 and DataParallel and PrefetchGlobalRead 1 and 2: the next
  # tile's loads write the main-loop buffers during the epilogue, so the staged tile lies after them.
  # MT64x64 gives each workgroup several tiles, with M-edge, N-edge and corner tiles.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0, 1]
        - PrefetchAcrossPersistent: [1]
        - StaggerU: [0]
        - TDMStoreInst: [0, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1025, 1023, 2, 128, 1040, 1040, 128, 128]
  ########################################
  # PrefetchAcrossPersistent with bias and ScaleAlphaVec: the vectors take their own region after the
  # main-loop buffers, and the staged tile follows them.
  ########################################
  -
    - <<: *problem_type_bf16
      UseBias: 1
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - PrefetchAcrossPersistent: [1]
        - StaggerU: [0]
        - Groups:
          - - StreamKForceDPOnly: [1]
              TDMStoreInst: [0, 2, 3]
            - StreamKForceDPOnly: [0]
              TDMStoreInst: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1025, 1023, 2, 128, 1040, 1040, 128, 128]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: relu]
  ########################################
  # fp32 D from bf16 inputs with fp32 accumulators: the TDM block stages D at 4 bytes per element, and at
  # store vector width 8 each 32-byte vector goes as two 16-byte DS ops; store vector width 1 has the one
  # masked block. NonEdge, M-edge, N-edge and corner workgroups and a leading dimension larger than M.
  ########################################
  -
    - <<: *problem_type_bf16
      DestDataType: s
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [1, 8]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 1, 2, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 128]
          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # fp32 D with non-atomic StreamK 3: the final stores of the tiles go through the TDM block, the partial
  # tiles keep buffer_store.
  ########################################
  -
    - <<: *problem_type_bf16
      DestDataType: s
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [8]
        - StreamK: [3]
        - TDMStoreInst: [0, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [505, 509, 2, 1600, 520, 520, 1600, 1600]
  ########################################
  # fp32 D with GlobalSplitU=-1 and bias and ScaleAlphaVec: the GSU == 1 branch stores through the TDM block,
  # the GSU > 1 partials keep buffer_store, and the staged tile follows the vectors.
  ########################################
  -
    - <<: *problem_type_bf16
      DestDataType: s
      UseBias: 1
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [-1]
        - TDMStoreInst: [0, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
          - Exact: [255, 253, 1, 512]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: relu]
  ########################################
  # fp32 D from fp32 inputs without HighPrecisionAccumulate.
  ########################################
  -
    - <<: *problem_type_bf16
      DataType: s
      DestDataType: s
      HighPrecisionAccumulate: False
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4, 4, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - TDMStoreInst: [0, 3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # StoreRemapVectorWidth 4 without SourceSwap, and the automatic width with SourceSwap, which resolves to 0, at
  # MT128x128: a TDM block stages D itself and skips the remap through LDS, while the blocks that keep buffer_store
  # still remap. NonEdge, M-edge, N-edge and corner workgroups and a leading dimension larger than M.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
