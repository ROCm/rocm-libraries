# The D h rows of f16acc_overflow_edge's kind whose f16 accumulator itself overflows: K=65536 with all-ones inputs at odd
# M and N edges, store vector width auto and 4, alpha 1 and beta 0; +inf in the kernel and in the reference. The emulator
# does not reproduce the hardware's f16-accumulation overflow (it returns +-65504 where the hardware returns +-inf), so
# the emulator lane expects these rows to fail: they are marked ffm_fail. They run on hardware like the other rows.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict, ffm_fail]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 1
  DataInitTypeB: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  ########################################
  # D h, GSU 1: IEEE overflow to inf at odd edges, store vector width auto and 4
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 64, 1, 1, 1, 1, 1, 1], [16, 16, 128, 1, 1, 1, 1, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [False, True]
        - StoreVectorWidth: [-1, 4]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [33, 31, 1, 65536]
          - Exact: [65, 17, 1, 65536]
