TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch
GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 1
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250-strict
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  ########################################
  # TDMStore stores every edge block of the beta=0 epilogue with
  # tensor_store_from_lds; the NonEdge block keeps buffer_store. The sizes have
  # M-edge workgroups with M % 8 odd, 6, 4 and 0 (one per AdaptiveGemm edge
  # block), N-edge-only workgroups and only NonEdge workgroups. The last size
  # has NonEdge, M-edge, N-edge and corner workgroups and a leading dimension
  # larger than M, so BoundsCheck also checks the gap between columns.
  # DataInitTypeBeta is global, so the beta != 0 epilogue is checked in
  # tdm_store_beta_gfx1250.yaml.
  ########################################
  -
    - &problem_type_bf16 # ProblemType TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      UseBeta: True
      Batched: True
      TransposeA: True
      TransposeB: False
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [0, 1]
        - TDMStore: [0, 1]
        - SourceSwap: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 128]
          - Exact: [511, 512, 1, 128]
          - Exact: [257, 512, 1, 128]
          - Exact: [510, 512, 1, 128]
          - Exact: [508, 512, 1, 128]
          - Exact: [504, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # SIA4 (StinkyTofu keeps the staging wait) and the D cache policy:
  # TemporalHintD -> th:, NonTemporalD -> scope:, NonVolatileD -> nv.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [1]
        - Groups:
          - - ScheduleIterAlg: [4]
              TDMStore: [0, 1]
            - TDMStore: [1]
              TemporalHintD: [3, 7]
              NonTemporalD: [2]
            - TDMStore: [1]
              TemporalHintD: [1]
              NonTemporalD: [1]
              NonVolatileD: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # fp16 output.
  ########################################
  -
    - <<: *problem_type_bf16
      DataType: h
      DestDataType: h
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [1]
        - TDMStore: [0, 1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 512, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # MacroTile0 512 over 8 waves: staging offsets above the 16-bit DS offset.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 8, 8, 1]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - GlobalSplitU: [1]
        - AdaptiveGemm: [1]
        - TDMStore: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1023, 256, 1, 128]
  ########################################
  # Non-atomic StreamK=3. Every tile, whole or completed by the fixup, is
  # stored through the same edge blocks: the problems have NonEdge, M-edge,
  # N-edge and corner tiles in two batches, and a leading dimension larger than
  # M. On 256 CUs, K=256 gives one whole tile per workgroup; with K=1600 each
  # workgroup's iterations span two tiles and every tile is completed by the fixup.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - WorkGroupMapping: [8]
        - StreamK: [3]
        - AdaptiveGemm: [1]
        - TDMStore: [1]
        - SourceSwap: [False, True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [505, 509, 2, 256, 520, 520, 256, 256]
          - Exact: [505, 509, 2, 1600, 520, 520, 1600, 1600]
