# Gap Coverage: GlobalSplitU variants
# Tests GlobalSplitUCoalesced and GlobalSplitUWorkGroupMappingRoundRobin

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250
  UniformSummationOrder: 0

BenchmarkProblems:

  # FP16 with multiple GSU options combined
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [4]
        - GlobalSplitUCoalesced: [True]
        - GlobalSplitUWorkGroupMappingRoundRobin: [False, True]
        - GlobalSplitUAlgorithm: ["SingleBuffer", "MultipleBuffer"]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [256, 256, 1, 512]   # Medium
          - Exact: [512, 512, 1, 1024]  # Large
          - Exact: [1024, 1024, 1, 2048] # Very large
          - Exact: [255, 257, 1, 513]   # Odd
          # === RANGE SIZES ===
          - Range: [ [256, 256, 1024], [256, 256, 1024], [1], [512, 512, 2048] ]
