        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
