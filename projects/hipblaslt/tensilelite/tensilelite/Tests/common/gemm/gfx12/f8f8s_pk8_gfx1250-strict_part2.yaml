TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeAlpha: 3 # alpha=random
  DataInitTypeBeta: 0  # no beta
  DataInitTypeBias: 21 # bias to verify correctness
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250-strict
  PrintSolutionRejectionReason: True
  KeepBuildTmp: True

BenchmarkProblems:

  ########################################
  # Section 3: FP8 non-SR pk8 path
  # Tests v_cvt_scalef32_pk8_fp8_f32 (no stochastic rounding)
  # with gwvw=8 (StoreVectorWidth=8)
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      SparseA: False
      Activation: False
      UseBias: 0
      SupportUserArgs: True
      Batched: True
      StochasticRounding: False

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - LDSTrInst: [True, False]
        - MatrixInstruction:
          - [16, 16, 64, 1,  1,  8, 2,  2, 2]
        - AssertFree0ElementMultiple: [2]
        - AssertFree1ElementMultiple: [1]
        - AssertSummationElementMultiple: [32]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - NumElementsPerBatchStore: [0]
        - DepthU: [64]
        - StoreVectorWidth: [8]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - ExpandPointerSwap: [False]
        - TransposeLDS: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - SourceSwap: [False]
        - ActivationFuncCall: [false]
        - 1LDSBuffer: [0]
        - StaggerU: [32]
        - StaggerUMapping: [0]
        - StaggerUStride: [256]
        - WavefrontSize: [32]
        - ConvertAfterDS: [ False ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [ 256, 256, 1, 64]

  ########################################
  # Section 4: BF8 non-SR pk8 path
  # Tests v_cvt_scalef32_pk8_bf8_f32 (no stochastic rounding)
  # with gwvw=8 (StoreVectorWidth=8)
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b8
      DestDataType: b8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      SparseA: False
      Activation: False
      UseBias: 0
      SupportUserArgs: True
      Batched: True
      StochasticRounding: False

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - LDSTrInst: [True, False]
        - MatrixInstruction:
          - [16, 16, 64, 1,  1,  8, 2,  2, 2]
        - AssertFree0ElementMultiple: [2]
        - AssertFree1ElementMultiple: [1]
        - AssertSummationElementMultiple: [32]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - NumElementsPerBatchStore: [0]
        - DepthU: [64]
        - StoreVectorWidth: [8]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - ExpandPointerSwap: [False]
        - TransposeLDS: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - SourceSwap: [False]
        - ActivationFuncCall: [false]
        - 1LDSBuffer: [0]
        - StaggerU: [32]
        - StaggerUMapping: [0]
        - StaggerUStride: [256]
        - WavefrontSize: [32]
        - ConvertAfterDS: [ False ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [ 256, 256, 1, 64]
