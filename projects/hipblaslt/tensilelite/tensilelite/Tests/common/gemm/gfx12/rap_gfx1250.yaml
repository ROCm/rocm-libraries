TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  EnqueuesPerSync: 1
  NumWarmups: 1
  KernelTime: true
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  # Alpha and Beta both 2: at 1 a dropped or mis-applied scale is invisible.
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  PrintLevel: 2

# Groups 1-13 hold A resident (ReuseAcrossPersistent 1); groups B1-B7, at the
# end, hold B resident (ReuseAcrossPersistent 2) and have their own header.
#
# Two things to know before reading a green run here.
#
# MX says nothing about batch handling. The client routes MX tensors through
# mxDataGenerator, whose batch loop advances the pointer but calls generateMXInput
# with identical arguments every time, so every batch gets byte-identical data
# (PrintTensorA: 0/16384 elements differ between batch 0 and 1, against 13984 for
# the F8/F8 problem). A kernel that reuses batch 0's A for the whole grid is
# therefore indistinguishable from a correct one in groups 1 and 2. Only group 3
# can fail on it. DataInitTypeA does not help -- SerialIdx is mapped away too.
#
# A rejected size looks like a pass. Sizes are a union across the MacroTiles in a
# group, so each tile rejects the ones that miss its RAP predicate (K beyond its
# resident block) or its ASEM multiple. Those come back as
# DID_NOT_SATISFY_ASSERTS, which leaves clientExit at 0 -- and so does a build
# that silently produced no kernel. Check the per-size verdicts, not the exit
# code. Groups 1-13 are 700 rows: 678 PASSED, 22 rejected, 0 FAILED. The 22
# rejections are the K-ceiling misses in groups 1-6; groups 7-13 should pass
# every row. No size is dead: every one of them runs on some tile. With the
# RAP 2 groups a full run is 1242 rows: 1210 PASSED, 32 rejected, 0 FAILED.

BenchmarkProblems:

  ########################################################################
  # 1. A=F8 B=F4 (MX) -- MacroTile sweep.
  #    Prefetch axes pinned so the only thing moving is the tile shape.
  #    kTiles: 64x256 -> 8, 64x512 -> 3, 128x128 -> 4.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256
          - [16, 16, 128, 1,  1,  2, 16,  2, 2] # MT 64x512
          - [16, 16, 128, 1,  1,  4,  4,  2, 2] # MT 128x128
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0,1]
        - ReuseAcrossPersistent: [0,1]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 256]    # one k-tile: the K floor
          - Exact: [64, 12288, 4, 512]
          - Exact: [64, 12288, 4, 768]    # ceiling for 64x512
          - Exact: [64, 12288, 2, 1024]
          - Exact: [64, 12288, 1, 2048]   # ceiling for 64x256
          - Exact: [128, 12288, 4, 256]
          - Exact: [128, 12288, 4, 768]
          - Exact: [128, 12288, 2, 1024]  # ceiling for 128x128
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 2. A=F8 B=F4 (MX) -- prefetch and persistence sweep at MT 64x256.
  #    PrefetchGlobalRead 1 and 2 change how many trailing k-tiles RAP has to
  #    silence, and PrefetchAcrossPersistent 0 and 1 are independent of RAP but
  #    share its persistent loop, so all four pairings are exercised.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 8
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        - PrefetchAcrossPersistent: [0,1]
        - PrefetchGlobalRead: [1,2]
        - ReuseAcrossPersistent: [0,1]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 256]    # K floor, many tiles per workgroup
          - Exact: [64, 12288, 4, 1280]
          - Exact: [64, 12288, 4, 2048]   # K ceiling
          - Exact: [64, 12288, 1, 1024]   # batch 1
          - Exact: [64, 12288, 2, 1536]   # batch 2
          # Few enough tiles that a workgroup gets one: exercises the fill copy
          # alone, with the reuse copy never entered.
          - Exact: [64, 2048, 1, 512]
          # More than one M-tile, which is what the entry guard's M-tile half is
          # for. 3 is deliberate: the CU count is even, so NumWorkGroups0 of 2
          # divides the walk stride and the M-tile never turns over, whereas 3
          # does not divide it and every tile takes the guard. Removing that half
          # of the guard fails this size and passes the 2 below it.
          - Exact: [192, 4096, 1, 512]    # nWG0=3, 48 tiles
          - Exact: [128, 6144, 1, 512]    # nWG0=2, 48 tiles
          # RAP adds no N predicate, so the store's edge path is reachable. Even
          # N only: these kernels derive GlobalReadVectorWidthB 2 and so assert
          # Free1ElementMultiple 2, which is ordinary edge machinery and nothing
          # to do with RAP -- an odd N is refused here and taken by group 3,
          # whose kernels derive 1.
          - Exact: [64, 12416, 1, 512]    # last N-tile half full
          - Exact: [64, 128, 1, 512]      # a single half-full N-tile
          # All three at once: several M-tiles, an N edge, and a batch boundary.
          - Exact: [192, 4098, 2, 512]
          # A partial M-tile, which leaves most of the resident A block holding
          # another M-tile's rows for the whole persistent walk. 130 is chosen to
          # make that as bad as it gets: the last tile holds 2 rows of 64, so 97%
          # of the block is stale, and NumWorkGroups0 3 means the guard refills
          # from a different M-tile every tile.
          - Exact: [130, 4096, 1, 512]    # 2 of 64 rows valid in the last M-tile
          - Exact: [190, 4096, 1, 512]    # 62 of 64, the other end of the range
          - Exact: [130, 4098, 2, 512]    # partial M-tile, N edge and a batch
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 3. A=F8 B=F8 -- the only group here with real batch coverage.
  #    Groups 1 and 2 cannot see a batch bug at all (see the note at the top),
  #    so this group is what exposed RAP reusing a stale A across a batch
  #    boundary, and it is what has to stay green after any change to the
  #    resident-A logic.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 9
          - [16, 16, 128, 1,  1,  4,  4,  2, 2] # MT 128x128, kTiles 4
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [1,2]
        - ReuseAcrossPersistent: [0,1]
        - PrefetchAcrossPersistent: [0,1]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 256]    # K floor
          - Exact: [64, 12288, 4, 512]
          - Exact: [64, 12288, 2, 1536]
          - Exact: [64, 12288, 1, 2304]   # ceiling for 64x256
          - Exact: [128, 12288, 4, 256]
          - Exact: [128, 12288, 2, 1024]  # ceiling for 128x128
          # The M-tile and N-edge relaxations against the one data type whose A
          # really does differ per batch, so both halves of the entry guard are
          # under load at once. MT 128x128 takes the M=192 row as an M edge.
          - Exact: [192, 4096, 2, 512]    # nWG0=3 at 64x256, batch 2
          # Odd N, which these kernels can take because they derive
          # GlobalReadVectorWidthB 1 and so assert Free1ElementMultiple 1. The
          # narrowest N edge that exists, on top of several M-tiles.
          - Exact: [128, 6145, 2, 512]
          # Both dims odd and both partial, against the one data type whose A
          # really differs per batch. The narrowest edge on each side at once.
          - Exact: [129, 6145, 2, 512]
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 4. A=F8 B=F8 at MT 64x512 -- the passing half of that tile.
  #    Split out of group 3 because PAP 1 fails here at batch > 1, at RAP 0 as
  #    well as RAP 1, which is a PAP/batch defect older than RAP. Keeping PAP 0
  #    holds on to the RAP coverage this tile does give: kTiles is 3, the
  #    smallest resident block of any tile in this file, so it is the one that
  #    exercises the k-tile floor and ceiling closest together.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 16,  2, 2] # MT 64x512, kTiles 3
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [1,2]
        - ReuseAcrossPersistent: [0,1]
        - PrefetchAcrossPersistent: [0]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # kTiles 3 caps K at 768, so these are the floor, the middle and the
          # ceiling of everything this tile can run.
          - Exact: [64, 12288, 4, 256]    # K floor
          - Exact: [64, 12288, 4, 512]
          - Exact: [64, 12288, 4, 768]    # K ceiling
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 5. A=F8 B=F4 (MX) -- K % DepthU != 0.
  #    ASEM 32 leaves a partial last k-tile, which RAP runs through the resident
  #    loop: each TDM descriptor's K dim shrinks with its address, so the clamp
  #    stops that k-tile at K. A and B step K by 256 and 128 bytes, so each wave
  #    shrinks by its own address increment. kTiles: 64x256 -> 8, 64x512 -> 3.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256
          - [16, 16, 128, 1,  1,  2, 16,  2, 2] # MT 64x512
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [32]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0,1]
        - ReuseAcrossPersistent: [0,1]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 32]     # the whole K is one partial k-tile
          - Exact: [64, 12288, 4, 288]    # the second prologue load is the partial one
          - Exact: [64, 12288, 2, 512]    # a whole number of k-tiles on a tracking kernel
          - Exact: [64, 12288, 2, 736]    # the partial k-tile is 64x512's last
          - Exact: [64, 12288, 1, 2016]   # the partial k-tile is 64x256's last
          - Exact: [192, 4096, 1, 416]    # nWG0=3, the guard refills A every tile
          - Exact: [130, 4098, 2, 288]    # M edge, N edge and a batch
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 6. A=F8 B=F8 -- K % DepthU != 0, with the batch coverage MX lacks.
  #    A partial k-tile past the first is where the K dim shrink matters:
  #    without it that k-tile reads the next row's real data instead of zeros.
  #    MX hides much of that behind the zero-padded scales of the blocks past
  #    K, so this group is the discriminating one. kTiles: 64x256 -> 9,
  #    128x128 -> 4.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 9
          - [16, 16, 128, 1,  1,  4,  4,  2, 2] # MT 128x128, kTiles 4
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [32]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [1,2]
        - ReuseAcrossPersistent: [0,1]
        - PrefetchAcrossPersistent: [0,1]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 160]    # the whole K is one partial k-tile
          - Exact: [64, 12288, 2, 480]    # the second prologue load is the partial one
          - Exact: [128, 12288, 2, 992]   # the partial k-tile is 128x128's last
          - Exact: [64, 12288, 1, 2272]   # the partial k-tile is 64x256's last
          - Exact: [192, 4096, 2, 416]    # several M-tiles and a batch
          - Exact: [129, 6145, 2, 288]    # both dims odd and partial, and a batch
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 7. A=F8 B=F8 -- WorkGroupMapping other than 1.
  #    Groups 1-6 pin WGM at 1, so the remap is the identity and the phase
  #    walk's period is NumWorkGroups0. This group is what checks that the
  #    guard, the fill and the walk agree once DefaultWGM actually moves the
  #    M-tile. F8/F8 rather than MX so a stale A across a batch is visible.
  #    WGM 8 blocks N-tiles: P = min(8, nWG1) * nWG0. WGM -4 blocks M-tiles:
  #    a period exists only when the block height divides nWG0, else the walk
  #    keeps the plain stride and the guard still has to use the remap.
  #    ASEM 32 so one size also runs a partial last k-tile through the same
  #    walk. MT 64x256, kTiles 9. 8 kernels x 4 sizes = 32 rows.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 9
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [32]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0,1]
        - ReuseAcrossPersistent: [0,1]
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        # 8: N-tile blocks, phases in M' order. -4: M-tile blocks.
        - WorkGroupMapping: [8, -4]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # nWG0=3, nWG1=16, batch 2. WGM 8 => P=24. WGM -4 => block height 3
          # divides nWG0, P=9, and the phases are not in M' order.
          - Exact: [192, 4096, 2, 512]
          # nWG0=5. WGM -4's block height 4 does not divide 5, so that kernel
          # keeps the plain stride while the guard still remaps.
          - Exact: [320, 4096, 1, 512]
          # One M-tile: the walk is the plain stride for either WGM.
          - Exact: [64, 8192, 1, 512]
          # Same grid as the first size, with a partial last k-tile.
          - Exact: [192, 4096, 2, 416]
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 8. A=F8 B=F8, 2D MX scales: MXBlock [128, 128], one E8 per 128x128 tile.
  #    At MXBlock 128 each thread splats its scale byte in place right before
  #    the first WMMA that reads it, so the fill copy has to splat every
  #    resident k-tile's scales and the reuse copy must leave them alone.
  #    MT0 64 puts two M-tiles on one scale row, and WGM 8 moves the row a
  #    tile reads. The second size group is ASEM 128, so K remainders fold.
  #    MT 64x256, kTiles 9. 2 size groups x 8 kernels x 4 sizes = 64 rows.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: [128, 128]
      MXBlockB: [128, 128]
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup, whole k-tiles
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 9
        # Required by RAP.
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        # Required by 2D scales.
        - AssertFree0ElementMultiple: [128]
        - AssertFree1ElementMultiple: [128]
        - ExpandPointerSwap: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchAcrossPersistent: [0,1]
        - ReuseAcrossPersistent: [0,1]
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1, 8]
