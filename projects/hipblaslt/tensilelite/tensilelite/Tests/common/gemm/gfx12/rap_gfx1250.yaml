  ########################################################################
  # B5. A=F8 B=F8 (MX) -- several N-tiles. The tile count is held at 48 while
  #     NumWorkGroups1 goes 1, 2, 3 (and 4 for the WGM blocks), so whether the
  #     entry guard's N-tile half is needed depends only on how the walk meets
