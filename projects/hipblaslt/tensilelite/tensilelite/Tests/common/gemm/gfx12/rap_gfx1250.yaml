  # Resident k-tiles (K ceiling = kTiles * 256):
  #   256x64: F8 x F4 16, F8 x F8 8, F8/F8 9; 512x64: 5, 3, 3; 128x128: 8, 4, 4.
  ########################################################################

  ########################################################################
  # B1. A=F8 B=F4 (MX) -- MacroTile sweep. The resident B is F4, half the
