  #     each block, and WGM 3 against NumWorkGroups1 4 leaves a short last block;
  #     a negative WGM takes the other branch of the remap.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
