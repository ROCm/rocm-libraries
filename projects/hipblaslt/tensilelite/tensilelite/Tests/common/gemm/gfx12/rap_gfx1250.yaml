  # MacroTile 512x64 runs at PrefetchAcrossPersistent 0 only. With PAP 1 it fails
  # on develop without any RAP (RAP 0, batch 1 included), the mirror of the PAP
  # defect group 4 sidesteps for 64x512; with RAP 2 it trips on other
  # sizes. The 512x64 groups below are split out for that reason.
