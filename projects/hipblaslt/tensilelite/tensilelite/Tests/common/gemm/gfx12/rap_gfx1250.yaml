          - Exact: [6144, 192, 2, 512]    # nWG1=3 with a batch boundary
          - Exact: [12288, 128, 2, 1024]  # nWG1=1 for 128x128, 2 for 256x64
          - Exact: [4097, 129, 2, 512]    # both dims odd and partial, and a batch
          - Exact: [6145, 66, 1, 768]     # 1 valid row and 2 valid columns at the edges
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # B3b. F8/F8 -- MT 512x64, kTiles 3, PrefetchAcrossPersistent 0.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      DestDataType: s
