  ########################################################################
  # RAP 2 -- groups B1 onward.
  #
  # ReuseAcrossPersistent = 2: B and its MX scales stay resident across the tiles a
  # persistent workgroup visits. The mirror of groups 1-13, for M large and N small:
  # MacroTile 256x64 and 512x64 mirror 64x256 and 64x512, 128x128 is its own
  # mirror.
  #
  # Served: any M and N, edge tiles included, and any K up to the resident block;
  # a K remainder is tail-folded into the last resident k-tile (groups B6 and B7).
  # A resident B is indexed by the N-tile and the batch, so the entry guard
  # compares both, after the same DefaultWGM remap B's address is built from, and
  # refills B through the fill copy when either changes. Group B5 holds the tile
  # count fixed and varies only NumWorkGroups1, across runtime WGMs. A partial
  # N-tile leaves the resident B block holding stale columns past N for the whole
  # walk; they only reach C columns the edge store masks, which the N-edge sizes
  # test at their worst (2 valid columns of 64).
  #
  # Both warnings at the top of this file hold here too:
  # - MX says nothing about batch handling: every batch gets byte-identical MX
  #   data, so a kernel that keeps batch 0's B for the whole grid passes groups B1,
  #   B2 and B4. Only group B3 (F8/F8) can fail on it.
  # - A rejected size looks like a pass (DID_NOT_SATISFY_ASSERTS leaves clientExit
  #   at 0). Sizes are a union across the MacroTiles in a group, so each tile
  #   rejects the N that is not its MacroTile1 and the K beyond its resident block.
  #   Check the per-size verdicts, not the exit code. These groups are 542 rows:
  #   532 PASSED, 10 rejected (K beyond MacroTile 128x128's resident block),
  #   0 FAILED.
