          - Exact: [6144, 128, 1, 512]    # nWG1=2, 48 tiles
          - Exact: [4096, 192, 1, 512]    # nWG1=3, 48 tiles
          - Exact: [3072, 256, 1, 512]    # nWG1=4, 48 tiles
          - Exact: [4096, 192, 2, 1024]   # nWG1=3 and a batch boundary
