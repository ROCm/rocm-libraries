        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
