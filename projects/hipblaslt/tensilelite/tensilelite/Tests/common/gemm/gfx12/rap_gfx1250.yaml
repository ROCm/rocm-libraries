  ########################################################################
  # B4. A=F8 B=F8 (MX) -- runtime WGM. With one N-tile every remap leaves the
  #     N-tile at 0, so these must pass for any WGM; the guard still runs the
  #     remap, and a negative WGM takes the other branch of it.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F8
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
