# f16 accumulation with split-K MultipleBufferSingleKernel on the MAF tile (four waves, MT256x256, DepthU 256, HalfPLR,
# TDM loads, LDSSegmentInterleave) with D F8 as in MAF, alpha 2 and beta -1, as f16acc_mbsk_gfx1250.yaml: GSU 2 and 4,
# both MbskPrefetchMethod forms, NumElementsPerBatchStore 0 and 16 with GroupLoadStore; 3x2 tiles with partial edges,
# and a batch of 2. For hardware: MT256x256 is slow under the emulator.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 23
  DataInitTypeB: 26
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  ########################################
  # D F8
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup: MBSK on the MAF tile (four waves, MT256x256), MbskPrefetchMethod 0 and 1
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 8, 8, 2, 2]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [-1]
        - HalfPLR: [1]
        - TDMIterateMode: [-1]
        - PrefetchGL2: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [2, 4]
        - GlobalSplitUAlgorithm: [MultipleBufferSingleKernel]
        - NumElementsPerBatchStore: [0, 16]
        - GroupLoadStore: [True]
        - MbskPrefetchMethod: [0, 1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[4,4]]
        - LDSSegmentInterleave: [1]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [520, 264, 1, 1024]
          - Exact: [512, 512, 2, 2048]