# gfx1250 swizzled-TDM (SwizzleTensorA) on the persistent kernel family: the same solutions as
# swizzle_a_tdm_gfx1250.yaml run as persistent data-parallel and as StreamK (static grid).
# The big-K / few-tile sizes make StreamK split K across workgroups (mid-tile K start and tail);
# the others walk several tiles per workgroup.
TestParameters:
  marks:
  - skip-gfx900
  - skip-gfx906
  - skip-gfx908
  - skip-gfx90a
  - skip-gfx940
  - skip-gfx941
  - skip-gfx942
  - skip-gfx950
  - skip-gfx1010
  - skip-gfx1011
  - skip-gfx1012
  - skip-gfx1030
  - skip-gfx1100
  - skip-gfx1101
  - skip-gfx1102
  - skip-gfx1200
  - skip-gfx1201
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: false
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: true
  Architecture: gfx1250
  CpuThreads: 1
  PrintLevel: 2
  CodeObjectVersion: '4'
BenchmarkProblems:
