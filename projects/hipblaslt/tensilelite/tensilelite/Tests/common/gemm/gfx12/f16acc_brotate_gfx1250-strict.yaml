# f16 accumulation with LDSSegmentBRotate on the aligned [2,2] segment interleave: SIMD pair 1 reads its B tiles
# rotated by half and swaps its packed f16 accumulator tiles back before the epilogue. B-rotate 0 and 1, StaggerU 0
# and 32, split-K MultipleBuffer, D in f16, fp8 and bf16, fp8 and fp4 inputs. K covers one unroll iteration,
# several, and a tail loop; M and N cover edge tiles.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  # Inputs are functions of each element's index: A = sin and B = |cos| (each fp4 value of a byte takes its own
  # index) keep the dot products bounded in K (sin with sin or cos grows with K and saturates fp8 D); C = cos, alpha 2,
  # beta -1. f16acc_brotate_negative_b_gfx1250.yaml swaps the A and B inputs.
  DataInitTypeA: 23
  DataInitTypeB: 26
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 0
  EnqueuesPerSync: 1
  Architecture: gfx1250-strict

BenchmarkProblems:
  ########################################
  # fp8 inputs, D f16: B-rotate off and on, StaggerU off and on
  ########################################
