TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

# Forward Bias + Activation + Aux output (E) with CompactLoopStore.
BenchmarkProblems:
  ########################################
  # NN
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      UseE: True
      UseBias: 1
      BiasDataTypeList: [s, B]
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1
      SupportUserArgs: True
    - &aux_cls_group
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 4, 2, 2]
        - DepthU: [64]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [8]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - ExpandPointerSwap: [False]
        - StoreVectorWidth: [8]
        - SourceSwap: [False]
        - ActivationFuncCall: [True]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - WavefrontSize: [32]
        - CompactLoopStore: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [768, 4096, 1, 768]
          - Exact: [767, 4095, 1, 769]
          - Exact: [129, 77, 1, 64]
          - Exact: [1000, 1031, 1, 256]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: Gelu]

  ########################################
  # NT
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseE: True
      UseBias: 1
      BiasDataTypeList: [s, B]
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1
      SupportUserArgs: True
    - *aux_cls_group

  ########################################
  # TN
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      UseE: True
      UseBias: 1
      BiasDataTypeList: [s, B]
      Activation: True
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1
      SupportUserArgs: True
    - *aux_cls_group
