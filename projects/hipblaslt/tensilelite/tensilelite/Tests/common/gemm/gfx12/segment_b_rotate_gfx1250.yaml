        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]                  # A pad interval 2048B needs iterate mode
        - HalfPLR: [1, 2, 3]                    # MT256 needs HalfPLR to fit VGPRs
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]             # tight [2,2] layout (component stride 64K..128K)
        - LDSSegmentBRotate: [0, 1]
        - PrefetchGlobalRead: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [8]                     # WaveTileA (coarse A)
        - VectorWidthB: [1, 2, 4]               # WaveTileB/VWB = 8, 4, 2 (must be even)
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
