        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]                  # A pad interval 2048B needs iterate mode
        - HalfPLR: [1, 2, 3]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]             # tight [2,2] layout
        - LDSSegmentBRotate: [0, 1]
        - PrefetchGlobalRead: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
