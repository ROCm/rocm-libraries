TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch
  # Single-kernel repro from cgemm_gfx1250.yaml (TT + conjugate A/B, MT64x64x16, PGR2, SIA4).
  # Out-of-order all-wave split barrier signal/wait in the CDNA5 scheduler gave NaN at K=64.

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  - # cgemm TT + conjugate A and B
    - {OperationType: GEMM, DataType: C, DestDataType: C, ComputeDataType: C, TransposeA: True, TransposeB: True, ComplexConjugateA: True, ComplexConjugateB: True, UseBeta: True, Batched: True}
    - BenchmarkCommonParameters: [{KernelLanguage: ["Assembly"]}]
      ForkParameters:
        - 1LDSBuffer: [0]
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 2, 2, 2, 2] #64x64
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - DepthU: [16]
        - GlobalSplitU: [1]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - WavefrontSize: [32]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [ [127,1,129], 0, [2], [63,1,64] ]
