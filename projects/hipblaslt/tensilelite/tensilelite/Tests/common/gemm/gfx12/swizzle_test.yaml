TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 4
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: f8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      SwizzleTensorA: True
      SwizzleTensorB: True

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - Groups:
          -
            - MatrixInstruction: [16, 16, 128, 1,  1,  2, 2,  2, 2]            
        - DepthU: [128]
        - PrefetchGL2: [0,1,2]
        - HalfPLR: [0] 
        - TransposeLDS: [-1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - LdsPadMetadata: [0]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - LDSTrInst: [False]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [16]
        - 1LDSBuffer: [0]
        - SourceSwap: [true]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ClusterDim: [[2,2],[4,4],[2,4]]
        # - AssertFree0ElementMultiple: [ 16 ]
        # - AssertFree1ElementMultiple: [ 16 ]
        # - AssertSummationElementMultiple: [ 32 ]
        - ExpandPointerSwap: [false]
        - GroupLoadStore: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 1024]
          # Partial M/N edge; K remains an exact number of DepthU iterations.
          - Exact: [1000, 984, 1, 1024]
          # - Exact: [512, 512, 1, 256]
          # - Exact: [2048, 1024, 1, 4096]
          # - Exact: [16, 16, 1, 256]
          # - Exact: [64, 64, 1, 255]

        - ActivationArgs:
          - [Enum: none]
