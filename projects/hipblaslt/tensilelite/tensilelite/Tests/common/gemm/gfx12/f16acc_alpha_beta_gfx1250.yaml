# f16 accumulation with alpha and beta that are not powers of two (RandomNarrow: random sign and mantissa, magnitude
# below 2) and C at the largest finite value of its type (65504 for h, 448 for f8, the bf16 maximum for bf16), so the
# epilogue's f32 fma(beta, C, alpha * acc) and the reference's rounded beta * C plus alpha * acc are compared away from
# the exact cases: GSU 1, split-K MultipleBuffer and MultipleBufferSingleKernel at GSU 2 and 3, and StreamK with the
# linear and the tree fixup. The inputs are all ones and K is 1536, so the f16 accumulator holds K exactly.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 1
  DataInitTypeB: 1
  DataInitTypeC: 18
  DataInitTypeAlpha: 16
  DataInitTypeBeta: 16
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  ########################################
  # D h
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup: GSU 1 and split-K
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction: [[16, 16, 64, 1, 1, 2, 2, 1, 1], [16, 16, 128, 1, 1, 2, 2, 1, 1]]
        - AssertFree0ElementMultiple: [1]
        - AssertSummationElementMultiple: [128]
        - DepthU: [128]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [True]
        - GlobalSplitU: [1, 2, 3]
        - GlobalSplitUAlgorithm: [MultipleBuffer, MultipleBufferSingleKernel]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - LocalReadVectorWidth: [16]
        - ScheduleIterAlg: [4]
        - TDMInst: [3]
        - TransposeLDS: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [65, 33, 1, 1536]

    - # BenchmarkProblemSizeGroup: StreamK, linear and tree fixup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
