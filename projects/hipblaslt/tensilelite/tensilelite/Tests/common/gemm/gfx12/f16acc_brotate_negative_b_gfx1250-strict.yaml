# f16acc_brotate_gfx1250.yaml with the A and B inputs swapped, so that B takes both signs through the B-rotated LDS
# reads and the fp4 decode of B: fp8 inputs with D bf16, StaggerU off and on and split-K, and fp8 x fp4 with
# SourceSwap off. M and N cover edge tiles.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  # A = |cos| and B = sin of each element's index (each fp4 value of a byte takes its own index), bounded in K for
  # the same reason as in f16acc_brotate_gfx1250.yaml; C = cos, alpha 2, beta -1.
  DataInitTypeA: 26
  DataInitTypeB: 23
  DataInitTypeC: 13
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  NumWarmups: 0
  EnqueuesPerSync: 1
  Architecture: gfx1250-strict

BenchmarkProblems:
  ########################################
  # fp8 inputs, D bf16: B-rotate, StaggerU off and on, GSU 1 and 4
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction: [[16, 16, 128, 1, 1, 4, 4, 2, 2]]
        - AssertFree0ElementMultiple: [2]
        - AssertSummationElementMultiple: [128]
        - DepthU: [256]
        - TDMInst: [3]
        - HalfPLR: [0]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]
        - LDSSegmentBRotate: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0, 32]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1, 4]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [2]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 1152]
          - Exact: [264, 256, 1, 640]
          - Exact: [256, 264, 1, 640]

  ########################################
  # fp8 x fp4, 16x16x64 WMMA, SourceSwap off, D f16
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DataTypeB: F4
      DestDataType: h
      ComputeDataType: h
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      SupportUserArgs: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction: [[16, 16, 64, 1, 1, 4, 4, 2, 2]]
        - AssertFree0ElementMultiple: [2]
        - AssertSummationElementMultiple: [128]
        - ConvertAfterDS: [True]
        - DepthU: [256]
        - TDMInst: [3]
        - HalfPLR: [0]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [1]
        - LDSSegmentBRotate: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [32]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [4]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [16]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
          - Exact: [256, 128, 2, 1152]
          - Exact: [264, 256, 1, 640]
          - Exact: [256, 264, 1, 640]
