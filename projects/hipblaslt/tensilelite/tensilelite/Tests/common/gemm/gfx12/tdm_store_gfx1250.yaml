  ########################################
  # PrefetchAcrossPersistent with StreamK 3 and DataParallel and PrefetchGlobalRead 1 and 2: the next
  # tile's loads write the main-loop buffers during the epilogue, so the staged tile lies after them.
  # MT64x64 gives each workgroup several tiles, with M-edge, N-edge and corner tiles.
  ########################################
  -
    - *problem_type_bf16
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
