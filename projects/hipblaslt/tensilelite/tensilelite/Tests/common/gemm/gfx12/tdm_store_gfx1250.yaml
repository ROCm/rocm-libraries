        - WavefrontSize: [32]
        - DepthU: [64]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0, 1]
        - PrefetchAcrossPersistent: [1]
        - StaggerU: [0]
        - TDMStoreInst: [0, 2, 3]
