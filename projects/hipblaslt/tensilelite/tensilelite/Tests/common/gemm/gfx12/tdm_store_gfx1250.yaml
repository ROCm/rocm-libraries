          - Exact: [511, 512, 1, 128]
          - Exact: [512, 509, 1, 128]
          - Exact: [511, 509, 2, 128, 520, 520, 128, 128]
  ########################################
  # ReuseAcrossPersistent with DataParallel and TDM loads, the RAP candidate: fp32 D from fp8 inputs at MT64x256,
  # PrefetchGlobalRead 1 and 2, with and without PrefetchAcrossPersistent. RAP's runtime predicate takes M at and
  # below MacroTile0 (64 and 61, the M edge), N a multiple of MacroTile1 with more tiles than workgroups (257),
