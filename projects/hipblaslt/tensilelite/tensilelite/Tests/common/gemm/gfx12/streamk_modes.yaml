# Parameter gap coverage: StreamK modes
# Valid StreamK values: [0, 3, 4, 5]
# Mode 0: Disabled
# Mode 3: Basic StreamK
# Mode 4: Two-Tile StreamK
# Mode 5: DP StreamK

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # StreamK Mode 3 (Basic StreamK)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 128]  # Small
          - Exact: [256, 256, 1, 256]  # Medium
          - Exact: [512, 512, 1, 512]  # Larger
          - Exact: [127, 129, 1, 131]  # Odd
          - Exact: [256, 128, 1, 256]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256] ]

  # StreamK Mode 4 (Two-Tile)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [4]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [128, 128, 1, 128]  # Small
          - Exact: [256, 256, 1, 256]  # Medium
          - Exact: [512, 512, 1, 512]  # Larger
          - Exact: [127, 129, 1, 131]  # Odd
          - Exact: [128, 256, 1, 256]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256] ]

  # StreamK Modes comparison (BF16)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [3, 4, 5]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [256, 256, 1, 256]  # Medium
          - Exact: [512, 512, 1, 512]  # Larger
          - Exact: [255, 257, 1, 259]  # Odd
          - Exact: [512, 256, 1, 512]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [256, 256, 512], [256, 256, 512], [1], [256] ]
