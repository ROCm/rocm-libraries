#
# PrefetchGlobalRead=2 with ExpandPointerSwap in f32 source (MAC) kernels with unscheduled global
# reads and local writes: the two unroll-loop copies alternate between two sets of G2L registers.
# K covers 1 to 4 unrolled blocks (no loop pass, odd and even loop exit) and a tail loop.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1250, skip-gfx1250-strict] # validated on gfx11

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  CMakeBuildType: Release
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: True
  PrintWinnersOnly: True

BenchmarkProblems:

  ########################################
  # NN and TN - f32 source kernels
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseDualFMAC: [False, True]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - StoreVectorWidth: [1]
        - ScheduleIterAlg: [1]
        - ScheduleGlobalRead: [0]
        - ScheduleLocalWrite: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [True]
        - ThreadTile:
          - [4, 4]
          - [8, 8]
        - WorkGroup:
          - [16, 8, 1]
        - DepthU: [16]
        - WorkGroupMapping: [1]
        - GlobalSplitU: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 16]    # one block: no loop pass, no second prefetch
          - Exact: [128, 128, 1, 32]    # two blocks: no loop pass
          - Exact: [128, 128, 1, 48]    # odd loop exit
          - Exact: [129, 131, 1, 64]    # even loop exit, partial tiles
          - Exact: [128, 128, 2, 256]   # batched
          - Exact: [128, 128, 1, 255]   # tail loop
          - Exact: [128, 128, 1, 41]    # tail loop after an odd exit

  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseDualFMAC: [False, True]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - StoreVectorWidth: [1]
        - ScheduleIterAlg: [1]
        - ScheduleGlobalRead: [0]
        - ScheduleLocalWrite: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [True]
        - ThreadTile:
          - [4, 4]
          - [8, 8]
        - WorkGroup:
          - [16, 8, 1]
        - DepthU: [16]
        - WorkGroupMapping: [1]
        - GlobalSplitU: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 16]    # one block: no loop pass, no second prefetch
          - Exact: [128, 128, 1, 32]    # two blocks: no loop pass
          - Exact: [128, 128, 1, 48]    # odd loop exit
          - Exact: [129, 131, 1, 64]    # even loop exit, partial tiles
          - Exact: [128, 128, 2, 256]   # batched
          - Exact: [128, 128, 1, 255]   # tail loop
          - Exact: [128, 128, 1, 41]    # tail loop after an odd exit
