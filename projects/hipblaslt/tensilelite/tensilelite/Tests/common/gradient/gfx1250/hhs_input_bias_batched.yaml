# Independent bias vectors with padding, checked against the batched CPU reference.
# One wave avoids depending on the later cross-wave bias-publication fix.
BenchmarkProblems:
- - Batched: true
    BiasDataTypeList:
    - s
    BiasSrc: A
    ComputeDataType: s
    DataType: h
    DestDataType: h
    Gradient: true
    HighPrecisionAccumulate: true
    OperationType: GEMM
    SetConstStrideBias:
    - - 2
      - 64
    TransposeA: true
    TransposeB: false
    UseBeta: true
    UseBias: 1
  - &id001
    BenchmarkCommonParameters:
    - KernelLanguage:
      - Assembly
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact:
        - 33
        - 49
        - 2
        - 65
      - Exact:
        - 17
        - 33
        - 2
        - 0
    - BiasTypeArgs:
      - s
    BenchmarkJoinParameters: null
    ForkParameters:
    - MatrixInstruction:
      - - 16
        - 16
        - 32
        - 1
        - 1
        - 1
        - 1
        - 1
        - 1
    - PrefetchGlobalRead:
      - 2
    - PrefetchLocalRead:
      - 1
    - ClusterLocalRead:
      - 1
    - DepthU:
      - 64
    - WavefrontSize:
      - 32
    - GlobalReadVectorWidthA:
      - -1
    - GlobalReadVectorWidthB:
      - -1
    - LocalReadVectorWidth:
      - -1
    - ScheduleIterAlg:
      - 0
    - TDMInst:
      - 3
    - ExpandPointerSwap:
      - false
    - TransposeLDS:
      - -1
    - LdsBlockSizePerPadA:
      - -1
    - LdsBlockSizePerPadB:
      - -1
    - LdsPadA:
      - -1
    - LdsPadB:
      - -1
    - 1LDSBuffer:
      - 0
    - GlobalSplitU:
      - 0
    - GlobalSplitUAlgorithm:
      - MultipleBuffer
    - SourceSwap:
      - false
    - ActivationFuncCall:
      - false
    - StoreVectorWidth:
      - -1
    - TileProcessingStrategy:
      - DataParallel
    - WorkAssignment:
      - StaticGrid
    - ClusterDim:
      - - 1
        - 1
    - PrefetchAcrossPersistent:
      - 0
    - StaggerU:
      - 0
    InitialSolutionParameters: null
- - Batched: true
    BiasDataTypeList:
    - s
    BiasSrc: B
    ComputeDataType: s
    DataType: h
    DestDataType: h
    Gradient: true
    HighPrecisionAccumulate: true
    OperationType: GEMM
    SetConstStrideBias:
    - - 2
      - 64
    TransposeA: true
    TransposeB: false
    UseBeta: true
    UseBias: 1
