# OutputPeerD: the kernel stores each D tile into the D of the other partition too, so both
# partitions hold the complete D (SplitDevices: 2, replicated D). Only gfx1250 supports it.
# It lives under comm/, so it is skipped unless two HIP devices are visible, and the
# _gfx1250 suffix keeps it to gfx1250.

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  SplitDevices: 2
  SplitDim: M

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: False
      OutputPeerD: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 2, 1, 1, 2]
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]
        - DepthU: [32]
        - TDMInst: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [1000, 512, 1, 256]
