# One GEMM split along M over the two partitions of a DPX gfx1250 (SplitDevices: 2). Batch 1 and 3.
# Kernel parameters are the validated ones of gemm/gfx12/tdm_general_batched_gfx1250.yaml.

GlobalParameters:
  PrintSolutionRejectionReason: True
  Architecture: gfx1250
  SplitDevices: 2
  SplitDim: M
  BoundsCheck: 0
  CodeObjectVersion: "4"
  CpuThreads: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  EnqueuesPerSync: 1
  KernelTime: False
  NumElementsToValidate: -1
  NumWarmups: 0
  SyncsPerBenchmark: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False

BenchmarkProblems:
  -
    - # BF16 TN, batched
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [256]
        - TDMInst: [3]
        - TileProcessingStrategy: ["None"]
        - TDMIterateMode: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        # GSU=2 deterministically exercises the pointer-array output-conversion
        # path in addition to the direct GSU=1 kernel.
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [8]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - DirectToVgprSparseMetadata: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [128, 128, 3, 512]
          - Exact: [1000, 512, 3, 256]
