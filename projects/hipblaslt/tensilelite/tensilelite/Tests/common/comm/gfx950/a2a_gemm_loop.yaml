# A2A-GEMM segment switches (FusedA2A: A2AGemm) config for gfx950.

TestParameters:
  marks: [skip-gfx1250, skip-gfx1250-strict] # gfx950-only

GlobalParameters:
  SyncsPerBenchmark: 1
  SleepPercent: 0
  NumElementsToValidate: -1
  NumBenchmarks: 1
  EnqueuesPerSync: 3
  RotatingBufferSize: 1024
  ValidateAfterEnqueues: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  Device: 0
  PrintSolutionRejectionReason: True
  Architecture: gfx950
  ISA: [[9, 5, 0]]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      FusedA2A: A2AGemm
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT 256x256
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [1]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 11264, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4352], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 8}
          # Token counts that do not fill MT1; 300 also gives fewer token blocks than peer queues.
          - Exact: {sizes: [3072, 2000, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 300, 1, 4096], world: 8}
          # 64 and 65 token blocks in one copy group: the second packing pass with one and two blocks.
          - Exact: {sizes: [1024, 16384, 1, 4096], world: 2}
          - Exact: {sizes: [512, 16640, 1, 4096], world: 2}
          # Segments of 1-4 iterations, down to fewer than PrefetchGlobalRead.
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 256], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 4}
          # Odd W, segments of 1-3 iterations and long ones.
          - Exact: {sizes: [3072, 2048, 1, 192], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 576], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 3072], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 320], world: 5}
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [64]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False, True]
        - DirectToLds: [0]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4352], world: 4}
          - Exact: {sizes: [3072, 2000, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 256], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 4}
          # Odd W, segments of 1-3 iterations and long ones.
          - Exact: {sizes: [3072, 2048, 1, 192], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 576], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 3072], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 320], world: 5}
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [64]
        - PrefetchGlobalRead: [0, 1, 2, 3]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False, True]
        - DirectToLds: [1]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2000, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 256], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 4}
          # Odd W, segments of 1-3 iterations and long ones.
          - Exact: {sizes: [3072, 2048, 1, 192], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 576], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 3072], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 320], world: 5}
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [64]
        - PrefetchGlobalRead: [2, 3]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [0, 1]
        - UnrollLoopSwapGlobalReadOrder: [1]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 256], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 4}
          # Odd W, segments of 1-3 iterations and long ones.
          - Exact: {sizes: [3072, 2048, 1, 192], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 576], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 3072], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 320], world: 5}

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [64]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [1]
        - Use64bShadowLimit: [True, False]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 384], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 4}

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT 256x256
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT 128x128
        - DepthU: [64]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2000, 1, 4096], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 2000, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 300, 1, 4096], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 128], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 256], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 2}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 4}
          - Exact: {sizes: [3072, 2048, 1, 512], world: 8}
          - Exact: {sizes: [3072, 2048, 1, 1024], world: 4}
          # Odd W, segments of 1-3 iterations and long ones.
          - Exact: {sizes: [3072, 2048, 1, 192], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 576], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 3072], world: 3}
          - Exact: {sizes: [3072, 2048, 1, 320], world: 5}

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT 256x256
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - A2ASubRounds: [1, 2, 4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # Batches of 22, 21 and 1 token blocks; groups of two sizes at W 3-8.
          - Exact: {sizes: [3072, 11264, 1, 1024], world: 2}
          - Exact: {sizes: [3072, 11264, 1, 1536], world: 3}
          - Exact: {sizes: [3072, 11264, 1, 2048], world: 4}
          - Exact: {sizes: [3072, 11264, 1, 2560], world: 5}
          - Exact: {sizes: [3072, 11264, 1, 3072], world: 6}
          - Exact: {sizes: [3072, 11264, 1, 3584], world: 7}
          - Exact: {sizes: [3072, 11264, 1, 4096], world: 8}
          # One batch of 8 blocks: groups of 3/3/2, and 4 groups of 2 for 7 queues.
          - Exact: {sizes: [8192, 2048, 1, 8192], world: 4}
          - Exact: {sizes: [8192, 2048, 1, 8192], world: 8}
          # Two batches of 16 blocks: groups of 3/3/3/3/2/2.
          - Exact: {sizes: [4096, 8192, 1, 4096], world: 8}
          # 7 blocks at odd worlds: groups of 4/3 and 2/2/2/1.
          - Exact: {sizes: [2816, 1792, 1, 1536], world: 3}
          - Exact: {sizes: [2816, 1792, 1, 2560], world: 5}
          - Exact: {sizes: [2816, 1792, 1, 3584], world: 7}
          # Fewer token blocks than peer queues.
          - Exact: {sizes: [3072, 300, 1, 3072], world: 6}
          - Exact: {sizes: [3072, 300, 1, 3584], world: 7}
          - Exact: {sizes: [3072, 300, 1, 4096], world: 8}
          # One batch of 128 blocks, 2 groups of 64: two passes per group.
          - Exact: {sizes: [512, 32768, 1, 768], world: 3}

