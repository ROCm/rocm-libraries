# split_m_shared_d_gfx950.yaml with SplitFreeRun: the two gfx950 GPUs run their launches back to
# back without a join, and no stream write follows the second device's stores into the first
# device's D. D is validated after the warmup and after the timed launches, so both must see those
# stores without one.
# Kernel parameters are those of a2a_gemm_loop.yaml without FusedA2A.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # gfx950 only

GlobalParameters:
  PrintSolutionRejectionReason: True
  Architecture: gfx950
  SplitDevices: 2
  SplitDim: M
  SplitPlacementD: Shared
  SplitFreeRun: True
  BoundsCheck: 0
  CpuThreads: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  NumBenchmarks: 1
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  KernelTime: False
  NumElementsToValidate: -1
  NumWarmups: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False

BenchmarkProblems:
  -
    - # BF16 TN, batched
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      Activation: False
      UseBias: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4, 2, 2] # MT 128x128
          - [16, 16, 32, 1, 1, 2, 2, 2, 2] # MT 64x64
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [0]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [128, 128, 3, 512]
          - Exact: [1000, 512, 3, 256]
          - Exact: [1001, 256, 1, 128]
