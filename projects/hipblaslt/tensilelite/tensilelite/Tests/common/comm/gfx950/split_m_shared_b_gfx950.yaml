# One GEMM split along M over two gfx950 GPUs (SplitDevices: 2). B is shared: both devices read
# the last device's B over peer access, and the other device validates against that device's data.
# Batch 1 and 3. Two of the sizes have an odd M, which 2 devices do not divide, with the default
# --split-align auto: for 1001 the share stays 500 (rounding it to the 256-byte boundary would move
# more than 1% of the work), for 51301 it is rounded up to 25728.
# Kernel parameters are those of a2a_gemm_loop.yaml without FusedA2A.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # gfx950 only

GlobalParameters:
  PrintSolutionRejectionReason: True
  Architecture: gfx950
  SplitDevices: 2
  SplitDim: M
  SplitPlacementB: Shared
  BoundsCheck: 0
  CpuThreads: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  NumBenchmarks: 1
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 3
  KernelTime: False
  NumElementsToValidate: -1
  NumWarmups: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False

BenchmarkProblems:
  -
    - # BF16 TN, batched
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      Activation: False
      UseBias: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4, 2, 2] # MT 128x128
          - [16, 16, 32, 1, 1, 2, 2, 2, 2] # MT 64x64
        - DepthU: [64]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ExpandPointerSwap: [False]
        - DirectToLds: [0]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [128, 128, 3, 512]
          - Exact: [1000, 512, 3, 256]
          - Exact: [1001, 256, 1, 128]
          - Exact: [51301, 128, 1, 64]
