    - PrefetchLocalRead: [1]
    - ScheduleIterAlg: [3]
    - ExpandPointerSwap: [true]
    - TransposeLDS: [1]
    - LDSTrInst: [false]
    - LocalReadVectorWidth: [8]
    - GlobalReadVectorWidthA: [8]
    - GlobalReadVectorWidthB: [8]
    - DirectToLds: [1]
    - LdsPadA: [16]
    - LdsPadB: [32]
    - LdsBlockSizePerPadA: [1024]
    - LdsBlockSizePerPadB: [1024]
    - 1LDSBuffer: [0]
    - StaggerU: [0]
    - SourceSwap: [true]
    - UseCustomMainLoopSchedule: [1]
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [256, 160, 1, 192]
