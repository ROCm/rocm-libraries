# One gfx1250 kernel through the StinkyTofu scheduler, for the StinkyTofu IR checkpoint round trip.
GlobalParameters:
  PrintSolutionRejectionReason: False
  SyncsPerBenchmark: 0
  NumElementsToValidate: 0
  KernelTime: False
  BoundsCheck: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 1
  CodeObjectVersion: "4"

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 2,  2, 2]
        - DepthU: [256]
        - WavefrontSize: [32]
        - UseSubtileImpl: [false]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - LDSTrInst: [false]
        - LDSSegmentInterleave: [0]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - StaggerU: [0]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 1024]
