# S07 SwInstructionPrefetch abs-base: gfx1250 StinkyTofu absolute-base SGPR
# reservation block in Tensile/KernelWriter.py (miss lines
# 9836-9846,9848,9854,9855,9858,9859).
#
# The abs-base block is gated on:
#   swpAbsRequested = resolveSwInstructionPrefetch(SwInstructionPrefetch,
#                        isGfx1250, isStreamK, isF64)[1]  (enableAbsolute)
#   and not kernel["StreamK"] and version == (12,5,0)
# swpAbsRequested is True for Absolute(2) on gfx1250 non-StreamK non-f64.
# PreloadKernArgs=True additionally enters the preload-guard while loop
# (lines 9837-9843) that advances the base past the kernarg preload region.
#
# Base: gfx1250 datamover.yaml. DataType F4 (non-double), StreamK off.
# Overrides: SwInstructionPrefetch: [2] (Absolute), PreloadKernArgs: [True].
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
        - SwInstructionPrefetch: [2]
        - PreloadKernArgs: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]
