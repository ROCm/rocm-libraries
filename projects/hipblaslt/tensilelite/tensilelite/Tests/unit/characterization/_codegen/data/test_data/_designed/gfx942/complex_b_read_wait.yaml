GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: C
      DestDataType: C
      ComputeDataType: C
      TransposeA: True
      TransposeB: False
      ComplexConjugateA: True
      ComplexConjugateB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 4, 1, 1, 7, 4, 2, 2]
        - DepthU: [16]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - SourceSwap: [True]
        - TransposeLDS: [1]
        - LocalReadVectorWidth: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [2]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LdsPadA: [1]
        - LdsPadB: [2]
        - LdsBlockSizePerPadA: [128]
        - LdsBlockSizePerPadB: [128]
        - 1LDSBuffer: [1]
        - GlobalSplitU: [1]
        - StaggerU: [8]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [224, 128, 1, 128]
