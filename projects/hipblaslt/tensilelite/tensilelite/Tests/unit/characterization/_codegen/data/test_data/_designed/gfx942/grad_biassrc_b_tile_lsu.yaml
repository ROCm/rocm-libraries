# Gradient + BiasSrc=B configs for gfx942 that exercise the bias-gradient write:
#   - MT 48x640 with 256 threads: two bias values per thread cover only 512 of
#     the 640, so the write takes a second pass.
#   - MT 16x16 with LocalSplitU=4: every LocalSplitU group's partial sums are
#     kept and summed.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      UseBias: 1
      BiasSrc: "B"
      Batched: True
      Gradient: True
      UseE: False
      Activation: False
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - MaxOccupancy: [40]
      ForkParameters:
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - ScheduleIterAlg: [3]
        - ExpandPointerSwap: [True]
        - GlobalSplitU: [1]
        - SourceSwap: [True]
        - StorePriorityOpt: [True]
        - Groups:
          - - MatrixInstruction: [16, 16, 16, 1, 1, 3, 10, 1, 4]
              WorkGroup: [16, 16, 1]
              DepthU: 16
            - MatrixInstruction: [16, 16, 16, 1, 1, 1, 1, 1, 1]
              WorkGroup: [16, 4, 4]
              DepthU: 64
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [640, 640, 1, 256]
        - BiasTypeArgs: ['s']
