# Minimal CPU-only code-generation input for the ForceUnrollSubIter next-loop
# local-read WAR gate in KernelWriter._makeSubIterSchedule. MIWaveTile [4, 4]
# gives sub-tiles of 2 tile elements; VectorWidth 4 makes one local read span
# both sub-tiles (deferral required), VectorWidth 2 keeps each read inside one.

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  Device: 0

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: S
      DestDataType: S
      ComputeDataType: S
      UseBeta: True
      Batched: True
      TransposeA: False
      TransposeB: False
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 4, 1, 1, 4, 4, 2, 2]
        - WorkGroup:
            - [32, 8, 1]
        - DepthU: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [1, 3]
        - ExpandPointerSwap: [False]
        - TransposeLDS: [0]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - VectorWidthA: [2, 4]
        - VectorWidthB: [2, 4]
        - GlobalReadVectorWidthA: [2]
        - GlobalReadVectorWidthB: [2]
        - LocalReadVectorWidthA: [1]
        - LocalReadVectorWidthB: [1]
        - MinGRIncPerMfma: [3]
        - BufferLoad: [True]
        - BufferStore: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [128, 128, 2, 64]
