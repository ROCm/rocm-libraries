# gfx1151 (RDNA3.5) WMMA V1 config with WMMABankDistinctC=True.
#
# DataType family: BBS (bf16-in / bf16-out / f32-compute) with HighPrecisionAccumulate.
# Architecture: gfx1151, WavefrontSize=32, MatrixInstruction=[16,16,16,1] (WMMA V1).
#
# Purpose: exercise the WMMABankDistinctC=True codegen arm in KernelWriter.py
# (allocateResources vgpr bank-distinctness hack), so a characterization test
# can inspect the emitted v_wmma instructions and confirm the A/B/C operands
# land on distinct VGPR banks (bank = vgpr % 4).
#
# MatrixInstruction [16,16,16,1, 1, 6, 2, 1, 4] -> MT96x128x64, the validated
# gfx1151 hero tile; MIWaveTile 6x2 emits many v_wmma per iteration, giving the
# bank assertion broad coverage.

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1,  1,   6, 2,  1, 4 ]   # MT96x128x64
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - ClusterLocalRead: [0]
        - ExpandPointerSwap: [False]
        - 1LDSBuffer: [0]
        - ScheduleIterAlg: [1]
        - TransposeLDS: [1]
        - LdsPadA: [8]
        - LdsPadB: [8]
        - LdsBlockSizePerPadA: [128]
        - LdsBlockSizePerPadB: [128]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - SourceSwap: [True]
        - MIArchVgpr: [True]
        - WMMABankDistinctC: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 4096, 1, 4096]
