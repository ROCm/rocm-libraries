# P2 designed MAC config for gfx90a: non-MFMA fp16 HPA (MAD_MIX) path.
#
# Target: tensilelite/Components/MAC_F16_HPA.py  FMA_F16_HPA_MAD_MIX.__call__
#
# This is the same problem and the same fork sweep as mac.yaml, with
# LocalReadVectorWidth 1 instead of 2.  That one value is what picks the path:
#
#   * LocalReadVectorWidth must equal NumDotElements(2) * InnerUnroll(1) = 2
#     for a dot kernel, and 1 for a non-dot one.  mac.yaml therefore only
#     produces solutions on an architecture where the dot2 path is taken.
#   * On gfx90a, UseDotInstruction is forced False (ISA != 9.4.2), so
#     FMA_F16_HPA_MAD_MIX is selected instead of FMA_F16_HPA_DOT2.
#
# Why the path needs its own config: no shipped logic tree reaches the mix
# class.  Its __call__ signature used to mismatch the call site in
# KernelWriterAssembly (writer, m, innerUnroll) against (writer, tPA, tPB, m,
# innerUnroll), so it raised before it could emit anything, and nothing in the
# tree selected it.  Fixing the signature made it reachable, and it then had to
# be made to work: rocisa parses a register name into a base name and a list of
# integer offsets, so the accumulator index has to reach it as a plain integer.
#
# The gfx90a run of this config is what covers that class.

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  Device: 0

BenchmarkProblems:
  ########################################
  # HHS (fp16/fp16 -> fp16, HPA) — non-MFMA MAD_MIX MAC path
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - MaxOccupancy: [40]
      ForkParameters:
        - ThreadTile:
          - [4, 4]
          - [8, 4]
          - [2, 4]
        - WorkGroup:
          - [8, 8, 1]
          - [4, 16, 1]
        - DepthU: [16]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - InnerUnroll: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - ScheduleIterAlg: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 64]
          - Exact: [128, 128, 1, 128]
