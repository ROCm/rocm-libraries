#
# An MX-F8 UseLoopModel kernel whose MXSA keeps two scale buffers and MXSB one, under a scaffold of
# two. Its drain names MXSA's second buffer through the first one's symbol, so the
# MXScaleVgprInterleave remap has to move references across blocks. SGPRs only are recoloured, so
# the VGPR symbols the interleave defines reach the assembler.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 10,  2, 2]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [-1]
        - HalfPLR: [0]
        - TDMIterateMode: [-1]
        - InitCIterWmma: [1]
        - SwInstructionPrefetch: [0]
        - PrefetchGL2: [4]
        - PrefetchGL2SAddr: [True]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - StinkyTofuRegisterAllocation: ["3,classes=s"]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [8]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[4,4]]
        - ClusterAIDMapping: [-2]
        - LDSSegmentInterleave: [1]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - NumElementsPerBatchStore: [16]
        - GroupLoadStore: [True]
        - InterleaveAlpha: [2]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
        - UseLoopModel: [True]
        - TDMSplitA: [0]
        - WmmaFactorM: [2]
        - TDMSplitB: [0]
        - WmmaFactorN: [2]
        - TDMFuse: [1]
        - WmmaInnerOrder: [2]
        - WmmaOuterOrder: [3]
        - PrefetchLocalReadA: [1]
        - PrefetchLocalReadB: [1]
        - ClusterLocalReadA: [0]
        - ClusterLocalReadB: [0]
        - VgprGroupA: [1]
        - VgprGroupB: [1]
        - VgprAllocA: [2]
        - VgprAllocB: [2]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 5120, 1, 65536]
