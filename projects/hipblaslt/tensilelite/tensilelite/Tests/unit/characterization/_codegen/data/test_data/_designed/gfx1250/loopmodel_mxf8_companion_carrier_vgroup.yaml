    - LdsPadA:
      - -1
    - LdsPadB:
      - -1
    - LdsBlockSizePerPadA:
      - -1
    - LdsBlockSizePerPadB:
      - -1
    - LdsPadMXSA:
      - -1
    - LdsPadMXSB:
      - -1
    - LdsBlockSizePerPadMXSA:
