#
# The UseLoopModel arm of mxf8_tn_maf.yaml: MXSA carries a 2-carrier ring while its
# parent A is cut by VgprGroupA=2. Taking that cut on the companion too put both
# carriers in one slot, and the wmma read the tiles the later ds_load had overwritten.
GlobalParameters:
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: false
  PruneSparseMode: 0
  MXDataGenerator: true
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Architecture: gfx1250
  KeepBuildTmp: true
  SyncsPerBenchmark: 0
BenchmarkProblems:
- - OperationType: GEMM
    DataType: F8
    DestDataType: F8
    ComputeDataType: s
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Batched: true
    Activation: false
    SupportUserArgs: true
    UseBias: 0
    MXBlockA: 32
    MXBlockB: 32
    DataTypeMXSA: e8
    DataTypeMXSB: e8
  - InitialSolutionParameters: null
    BenchmarkCommonParameters:
    - KernelLanguage:
      - Assembly
    ForkParameters:
    - UseSgprForGRO:
