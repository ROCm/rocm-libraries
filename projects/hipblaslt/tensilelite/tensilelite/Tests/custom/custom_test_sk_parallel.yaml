# A handwritten main kernel with a streamKReduce post kernel. With the grid
# pinned to 256, the sizes over 16 and 24 tiles resolve parallel reduction
# (main, then post kernel); those over 1024 and 256 tiles clamp to data
# parallel (main only). The second schedule runs beta = 0.
TestParameters:
  streamk_schedules:
    - {grid: 256, reduction: parallel, expect: {16: parallel, 24: parallel, 1024: clamp, 256: clamp}}
    - {grid: 256, reduction: parallel, parameters: {DataInitTypeBeta: 0},
       expect: {16: parallel, 24: parallel, 1024: clamp, 256: clamp}}
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # gfx950 code object

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 17
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True
  UniformSummationOrder: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: false
      TransposeB: true
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup
      CustomKernels: ["c_hip_sk_parallel_Cijk_Ailk_Bjlk_HHS_BH_MT64x64x32_gfx950"]
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 8192]
          - Exact: [200, 136, 2, 4100]
          - Exact: [2048, 2048, 1, 512]
          - Exact: [1000, 1000, 1, 256]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 0049", "Device 0050"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
