TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  UniformSummationOrder: 0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeBeta: 2
  DataInitTypeAlpha: 2
  DataInitTypeA: 3
  DataInitTypeB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True
  MXScaleFormat: 1

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0
      MXBlockA: 32
      MXBlockB: 32

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "gemm_BM2_TN4_LANES_K64_WAVES4_UP_ITERS0_PARTIAL_STEPS0_PF1_GROUP1_NUM_XCDS1_GRID_3D1_USE_BETA1"
            args: [ { type: address, semantic: AddressD },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: address, semantic: AddressMXScaleA },
                    { type: address, semantic: AddressMXScaleB },
                    { type: uint64, semantic: ConstantZero },
                    { type: address, semantic: AddressC },
                    { type: int32, semantic: StrideD0Bytes },
                    { type: int32, semantic: StrideA0Bytes },
                    { type: int32, semantic: StrideB0Bytes },
                    { type: int32, semantic: SizeFree0 },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: SizeSum },
                    { type: int32, semantic: Spk },
                    { type: int32, semantic: StrideC0Bytes },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: NumWorkGroupsX },
                    { type: int32, semantic: NumWorkGroupsY },
                    { type: int32, semantic: NumWorkGroupsZ } ]
            macrotile: [4, 4, 4096]
            threads: [256, 1, 1]
            grid: [TilesWide, TilesSkinny, Batch]
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 1, 1, 1, 1]
        - StaggerU: [0]
        - MXScaleFormat: [HostPreSwizzle]
        - AssertSizeEqual: [{2: 1}]
        - AssertStrideAEqual: [{0: 1}]
        - AssertStrideBEqual: [{0: 1}]
        - AssertStrideCEqual: [{0: 1}]
        - AssertStrideDEqual: [{0: 1}]
        - AssertStrideAMultiple: [{1: 4}]
        - AssertStrideBMultiple: [{1: 4}]
        - AssertSizeGreaterThan: [{0: 0, 1: 0, 3: 0}]
        - AssertSizeLessThan: [{0: 1048577, 1: 1073741825}]
        - AssertSummationElementMultiple: [256]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [10240, 4, 1, 5120]
          - Exact: [5120, 1, 1, 8192]
          - Exact: [4, 10240, 1, 5120]
          - Exact: [1, 5120, 1, 8192]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
