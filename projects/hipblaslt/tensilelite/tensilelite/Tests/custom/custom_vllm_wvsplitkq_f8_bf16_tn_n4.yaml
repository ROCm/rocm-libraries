TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # vLLM wvSplitKQ: gfx950 (160 KB LDS, OCP FP8)

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeScaleA: 2
  DataInitTypeScaleB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      UseScaleAB: "Scalar"
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "wvSplitKQ_vllm_f8_bf16_tn_n4_y2u1"
            args: [ { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeFree0 },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: int32, semantic: ComputeUnits },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: StrideA0 },
                    { type: int32, semantic: StrideB0 },
                    { type: address, semantic: AddressC },
                    { type: address, semantic: AddressD },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: StrideC0 },
                    { type: int32, semantic: StrideD0 },
                    { type: address, semantic: AddressScaleA },
                    { type: address, semantic: AddressScaleB } ]
            macrotile: [64, 16, 16]
            threads: [64, 16, 1]
            grid: [ComputeUnits, One, One]
            uniformSummationOrder: true
        - MatrixInstruction:
          # 9-tuple so fork conversion sets EnableMatrixInstruction and
          # WorkGroup [64, 16, 1] from waves=mi[7]*mi[8]=16 (matches threads).
          - [16, 16, 32, 1, 1, 4, 1, 4, 4]
        - StaggerU: [0]
        # Each lane loads 16 FP8 bytes of K at a time.
        - AssertSummationElementMultiple: [16]
        # n == 4 and batch == 1: n is a compile-time constant, and the kernel
        # has no batch stride arguments.
        - AssertSizeEqual: [{1: 4, 2: 1}]
        # Unit stride along K for A and B and along m for C and D; the leading
        # dimensions are kernargs.
        - AssertStrideAEqual: [{0: 1}]
        - AssertStrideBEqual: [{0: 1}]
        - AssertStrideCEqual: [{0: 1}]
        - AssertStrideDEqual: [{0: 1}]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # [m, n, batch, K] or, with leading dimensions, [m, n, batch, K, ldd, ldc, lda, ldb].
          - Exact: [9, 4, 1, 16]
          - Exact: [257, 4, 1, 528]
          # m not a multiple of the wave tile.
          - Exact: [2624, 4, 1, 6144]
          - Exact: [2625, 4, 1, 6144]
          - Exact: [6144, 4, 1, 16384]
          - Exact: [16384, 4, 1, 2048]
          # n*K at the 163840-byte LDS stage, and past it: tokens past the stage
          # are read from global memory.
          - Exact: [2048, 4, 1, 40960]
          - Exact: [2049, 4, 1, 40976]
          # Padded leading dimensions.
          - Exact: [4096, 4, 1, 2048, 4104, 4100, 2064, 2064]
          # Token rows off a 16-byte boundary: staged without LDS DMA.
          - Exact: [4096, 4, 1, 2048, 4096, 4096, 2048, 2056]
          - Exact: [2048, 4, 1, 40976, 2048, 2048, 40976, 40984]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 0049", "Device 0050"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
