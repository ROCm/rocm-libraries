TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # vLLM wvSplitK: gfx950 (160 KB LDS)

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True
  UniformSummationOrder: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "wvSplitK_vllm_bf16_tn_n1_y1u4"
            args: [ { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeFree0 },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: int32, semantic: ComputeUnits },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: StrideA0 },
                    { type: int32, semantic: StrideB0 },
                    { type: address, semantic: AddressC },
                    { type: address, semantic: AddressD },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: StrideC0 },
                    { type: int32, semantic: StrideD0 } ]
            macrotile: [64, 16, 8]
            threads: [64, 16, 1]
            grid: [ComputeUnits, One, One]
          - name: "wvSplitK_vllm_bf16_tn_n1_y1u2"
            args: [ { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeFree0 },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: int32, semantic: ComputeUnits },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: StrideA0 },
                    { type: int32, semantic: StrideB0 },
                    { type: address, semantic: AddressC },
                    { type: address, semantic: AddressD },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: StrideC0 },
                    { type: int32, semantic: StrideD0 } ]
            macrotile: [64, 16, 8]
            threads: [64, 16, 1]
            grid: [ComputeUnits, One, One]
          - name: "wvSplitK_vllm_bf16_tn_n1_y3u2"
            args: [ { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeFree0 },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: int32, semantic: ComputeUnits },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: StrideA0 },
                    { type: int32, semantic: StrideB0 },
                    { type: address, semantic: AddressC },
                    { type: address, semantic: AddressD },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: StrideC0 },
                    { type: int32, semantic: StrideD0 } ]
            macrotile: [64, 16, 8]
            threads: [64, 16, 1]
            grid: [ComputeUnits, One, One]
        - MatrixInstruction:
          # 9-tuple so fork conversion sets EnableMatrixInstruction and
          # WorkGroup [64, 16, 1] from waves=mi[7]*mi[8]=16 (matches threads).
          - [16, 16, 16, 1, 1, 4, 1, 4, 4]
        - StaggerU: [0]
        - AssertSummationElementMultiple: [8]
        # n == 1 and batch == 1: n is a compile-time constant, and the kernel has
        # no batch stride arguments.
        - AssertSizeEqual: [{1: 1, 2: 1}]
        # m > 8: with fewer rows than the wave tile the tail fixup underflows.
        - AssertSizeGreaterThan: [{0: 8}]
        # Unit stride along K for A and B and along m for C and D; the leading
        # dimensions are kernargs.
        - AssertStrideAEqual: [{0: 1}]
        - AssertStrideBEqual: [{0: 1}]
        - AssertStrideCEqual: [{0: 1}]
        - AssertStrideDEqual: [{0: 1}]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # [m, n, batch, K] or, with leading dimensions, [m, n, batch, K, ldd, ldc, lda, ldb].
          - Exact: [9, 1, 1, 8]
          - Exact: [257, 1, 1, 520]
          # m not a multiple of the wave tile: the last tile shifts down.
          - Exact: [2624, 1, 1, 6144]
          - Exact: [2625, 1, 1, 6144]
          - Exact: [6144, 1, 1, 16384]
          - Exact: [16384, 1, 1, 2048]
          # n*K past the 80K-element LDS stage: K is staged in chunks.
          - Exact: [2048, 1, 1, 83968]
          - Exact: [2049, 1, 1, 83968]
          # Padded leading dimensions.
          - Exact: [4096, 1, 1, 2048, 4104, 4100, 2056, 2056]
          # Token rows off a 16-byte boundary: staged without LDS DMA.
          - Exact: [4096, 1, 1, 2048, 4096, 4096, 2048, 2052]
          - Exact: [2048, 1, 1, 83968, 2048, 2048, 83968, 83972]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 0049", "Device 0050"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
