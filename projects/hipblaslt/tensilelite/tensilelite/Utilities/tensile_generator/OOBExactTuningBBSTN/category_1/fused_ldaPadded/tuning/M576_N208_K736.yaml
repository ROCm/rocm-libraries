# OOB BBS TN exact tuning, category 1, M=576 N=208 K=736: FUSED GEMM kernels (Bias [s, B] + ScaleAlphaVec + hipblaslt_all, ActivationFuncCall true, CompactLoopStore true = #15650 pure-gemm store pass), called as the PURE GEMM problem; lda=ldb=768 = ceil(K/128)*128, gfx1250.
# = pure_LdaPadded/tuning/M576_N208_K736.yaml converted to the fused problem type, every candidate kept with ActivationFuncCall true + CompactLoopStore true (591 pure groups -> 591 fused groups, 1 became identical and were merged; group 1 = fused winner).
# Client call = NOEPI (bias / ScaleAlphaVec null, activation none, beta 0): the problem type carries Bias + SAV, so after the Tensile build edit each ClientParameters.ini to use-bias=0, use-scaleAlphaVec=0, activation-enum-args=None, init-beta=Zero (as in the 11/27 Excel bench).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0.
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
