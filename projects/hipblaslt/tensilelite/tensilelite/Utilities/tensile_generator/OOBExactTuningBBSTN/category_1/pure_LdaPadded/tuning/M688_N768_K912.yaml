# OOB BBS TN exact tuning, category 1, M=688 N=768 K=912 (pure GEMM, lda=ldb=1024 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file).
# Candidates: 123 groups in (incl. 2 ruler(s)) -> 77 after exact de-dup and removing 10 StreamK (cat1 rule), keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (13 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->1; p 23->19; q 24->18; s 22->4; pc 52->35.
# Group 1 = public winner (logic in this category); the previous logic kernel (logic_1109a) is StreamK -> it is only a comparison ruler in the separate 2nd BenchmarkProblems section at the end.
# cat1: no StreamK candidates (Ray); the only StreamK kernel is the comparison ruler in the 2nd section.
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
