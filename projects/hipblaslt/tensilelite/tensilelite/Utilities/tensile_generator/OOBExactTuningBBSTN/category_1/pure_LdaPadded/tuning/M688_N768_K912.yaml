# OOB BBS TN exact tuning, category 1, M=688 N=768 K=912 (pure GEMM, lda=ldb=1024 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 123 groups in (incl. 2 ruler(s)) -> 77 after exact de-dup and removing 10 StreamK (cat1 rule), keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (13 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->1; p 23->19; q 24->18; s 22->4; pc 52->35. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 2 file(s) 162->149; tf21B_ 1 file(s) 9->0; tf21C_ 2 file(s) 162->99; tf22_ 3 file(s) 327->156; ff23_ 3 file(s) 326->0; r27_ 1 file(s) 1->0. Total now 481 groups.
# Group 1 = new winner (retune_1127, logic in this category), group 2 = previous winner (11/12 logic); the logic_1109a kernel is StreamK -> comparison ruler in the separate 2nd BenchmarkProblems section at the end.
# cat1: no StreamK candidates (Ray); the only StreamK kernel is the comparison ruler in the 2nd section.
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
