# OOB BBS TN exact tuning, category 1, M=832 N=896 K=16 (fused GEMM: Bias + ScaleAlphaVec, activation none, ActivationFuncCall true; lda=ldb=K, ldc=ldd=M): group 1 = winner, group 2 = previous logic kernel.
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 1000
  NumWarmups: 300
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeScaleAlphaVec: 3
  DataInitSeed: 1
  CSVExportWinner: true
  CSVMergeSameProblemID: false
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  KeepBuildTmp: false
  RotatingBufferSize: 384
  UseEffLike: false
  SyncsPerBenchmark: 1
  NumBenchmarks: 5
  CpuThreads: 32
  PrintSolutionRejectionReason: true
BenchmarkProblems:
- - OperationType: GEMM
    DataType: B
    DestDataType: B
    ComputeDataType: S
    HighPrecisionAccumulate: true
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Batched: true
    UseBias: 1
    Activation: true
    ActivationType: hipblaslt_all
    UseScaleAlphaVec: 1
    BiasDataTypeList: [s, B]
  - InitialSolutionParameters: null
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ClusterLocalRead: [0]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - GlobalReadVectorWidthA: [1]
    - GlobalReadVectorWidthB: [1]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [8]
    - LocalReadVectorWidthB: [8]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PostLoopStoreInNll: [false]
    - PrefetchGlobalRead: [2]
    - PrefetchLocalRead: [0]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - TDMInst: [3]
    - ThreadTile:
      - [1, 1]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - WavefrontSize: [32]
    - GlobalSplitUAlgorithm: [MultipleBuffer]
    - VectorWidthA: [1]
    - VectorWidthB: [4]
    - LdsBlockSizePerPadA: [256]
    - LdsBlockSizePerPadB: [256]
    - LdsPadA: [8]
    - LdsPadB: [8]
    - LDSSegmentInterleave: [0]
    - HalfPLR: [0]
    - TDMIterateMode: [0]
    - MIArchVgpr: [true]
    - AdaptiveGemm: [1]
    - ClusterDim:
      - [2, 2]
    - LDSSegmentBRotate: [0]
    - ActivationFuncCall: [true]
    - Groups:
      - - TileProcessingStrategy: None
          GlobalSplitU: 1
          MatrixInstruction: [16, 16, 32, 1, 1, 1, 4, 1, 1]
          WorkGroup: [32, 1, 1]
          DepthU: 32
          StoreVectorWidth: 1
          CompactLoopStore: false
          ClusterAIDMapping: -1
          SourceSwap: true
        - TileProcessingStrategy: StreamK
          GlobalSplitU: 0
          MatrixInstruction: [16, 16, 32, 1, 1, 1, 4, 1, 2]
          WorkGroup: [32, 1, 1]
          DepthU: 32
          StoreVectorWidth: -1
          CompactLoopStore: true
          ClusterAIDMapping: -2
          SourceSwap: false
    BenchmarkJoinParameters: null
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [832, 896, 1, 16, 832, 832, 16, 16]
    - BiasTypeArgs: [s]
    - ActivationArgs:
      - - {Enum: none}
LibraryLogic:
  ScheduleName: gfx1250
  DeviceNames: [Device 73f0]
  ArchitectureName: gfx1250
  LibraryType: Equality
