# OOB BBS TN exact tuning, category 1, M=256 N=224 K=144 (pure GEMM, lda=ldb=256 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file).
# Candidates: 86 groups in (incl. 2 ruler(s)) -> 35 after exact de-dup and removing 40 StreamK (cat1 rule). Per set in->kept (first occurrence wins): ruler 2->1; p 40->15; q 28->12; s 16->7.
# Removed parameters (not in develop Tensile): TDMStoreInst (TDMStoreInst3 x6 -> TDMSI0, duplicates of existing TDMSI0 arms dropped).
# Group 1 = current public winner (logic in this category); the previous logic kernel (logic_1109a) is StreamK -> it is only a comparison ruler in the separate 2nd BenchmarkProblems section at the end.
# cat1: no StreamK candidates (Ray); the only StreamK kernel is the comparison ruler in the 2nd section.
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
