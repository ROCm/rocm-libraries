# Candidates: 149 groups in (incl. 2 ruler(s)) -> 93 after exact de-dup and removing 15 StreamK (cat1 rule), keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (20 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->2; p 27->20; q 30->20; s 18->2; pc 72->49.
# Group 1 = public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# cat1: no StreamK candidates (Ray).
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
