# OOB BBS TN exact tuning, category 1, M=576 N=208 K=736 (pure GEMM, lda=ldb=768 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 149 groups in (incl. 2 ruler(s)) -> 93 after exact de-dup and removing 15 StreamK (cat1 rule), keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (20 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->2; p 27->20; q 30->20; s 18->2; pc 72->49. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 2 file(s) 173->157; tf21B_ 1 file(s) 115->76; tf21C_ 1 file(s) 134->78; tf22_ 3 file(s) 324->185; ff23_ 3 file(s) 323->0; r27_ 1 file(s) 3->2. Total now 591 groups.
# Group 1 = new winner (retune_1127, logic in this category), group 2 = previous winner (11/12 logic), group 3 = logic_1109a kernel (when different).
# cat1: no StreamK candidates (Ray).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
