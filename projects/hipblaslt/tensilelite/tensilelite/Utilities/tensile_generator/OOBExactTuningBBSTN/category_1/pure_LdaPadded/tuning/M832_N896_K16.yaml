# OOB BBS TN exact tuning, category 1, M=832 N=896 K=16 (pure GEMM, lda=ldb=128 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file).
# Candidates: 97 groups in (incl. 2 ruler(s)) -> 57 after exact de-dup and removing 8 StreamK (cat1 rule), keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (15 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->1; p 20->12; s 18->6; pc 57->38.
# Group 1 = public winner (logic in this category); the previous logic kernel (logic_1109a) is StreamK -> it is only a comparison ruler in the separate 2nd BenchmarkProblems section at the end.
# cat1: no StreamK candidates (Ray); the only StreamK kernel is the comparison ruler in the 2nd section.
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
