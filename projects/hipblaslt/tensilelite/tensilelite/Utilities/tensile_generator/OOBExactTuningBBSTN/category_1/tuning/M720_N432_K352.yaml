# OOB BBS TN exact tuning, category 1, M=720 N=432 K=352 (pure GEMM, lda=ldb=384 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file).
# Candidates: 66 groups in (incl. 2 ruler(s)) -> 45 after exact de-dup and removing 5 StreamK (cat1 rule). Per set in->kept (first occurrence wins): ruler 2->2; p 18->15; q 24->21; s 22->7.
# Removed parameters (not in develop Tensile): TDMStoreInst (TDMStoreInst1 x2, TDMStoreInst2 x2, TDMStoreInst3 x6 -> TDMSI0, duplicates of existing TDMSI0 arms dropped).
# Group 1 = current public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# cat1: no StreamK candidates (Ray).
# EnqueuesPerSync 1000 / NumWarmups 300 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
