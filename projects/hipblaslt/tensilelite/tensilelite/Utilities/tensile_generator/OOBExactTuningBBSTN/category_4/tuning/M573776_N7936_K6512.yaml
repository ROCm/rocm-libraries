# OOB BBS TN exact tuning, category 4, M=573776 N=7936 K=6512 (pure GEMM, lda=ldb=6528 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (12 files), t_ (3 files), s_ (4 files), d_ (1 file).
# Candidates: 94 groups in (incl. 2 ruler(s)) -> 75 after exact de-dup. Per set in->kept (first occurrence wins): ruler 2->2; p 58->57; t 12->10; s 16->4; d 6->2.
# Removed parameters (not in develop Tensile): TDMStoreInst (TDMStoreInst2 x4, TDMStoreInst3 x4 -> TDMSI0, duplicates of existing TDMSI0 arms dropped).
# Group 1 = current public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# Note: sets t_ were originally run with env TENSILE_PERSISTENT_DYNAMIC_GRID=0 (persistent grid = CU count); this yaml sets no env (default grid = production).
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
