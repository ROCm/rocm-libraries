# OOB BBS TN exact tuning, category 4, M=838752 N=5696 K=3584 (pure GEMM, lda=ldb=3584 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (8 files), q_ (1 file), t_ (3 files), s_ (2 files), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 123 groups in (incl. 2 ruler(s)) -> 105 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (1 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->2; p 71->69; q 4->4; t 20->19; s 14->3; pc 12->8. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 1 file(s) 23->23; tf21B_ 1 file(s) 8->0; tf21C_ 1 file(s) 23->20; tf22_ 1 file(s) 49->28; ff23_ 1 file(s) 58->9; r27_ 1 file(s) 5->4. Total now 189 groups.
# Group 1 = new winner (retune_1127, logic in this category), group 2 = previous winner (11/12 logic), group 3 = logic_1109a kernel (when different).
# Note: sets t_ were originally run with env TENSILE_PERSISTENT_DYNAMIC_GRID=0 (persistent grid = CU count); this yaml sets no env (default grid = production).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
