# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (2 files), t_ (1 file), s_ (1 file), b_ (1 file), e_ (1 file), f_ (1 file), g_ (1 file).
# Candidates: 219 groups in (incl. 2 ruler(s)) -> 175 after exact de-dup. Per set in->kept (first occurrence wins): ruler 2->2; p 87->85; t 56->55; s 14->3; b 25->24; e 9->6; f 9->0; g 17->0.
# Removed parameters (not in develop Tensile): TDMStoreInst (TDMStoreInst2 x4, TDMStoreInst3 x10 -> TDMSI0, duplicates of existing TDMSI0 arms dropped).
# Group 1 = current public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# Note: sets t_, f_, g_ were originally run with env TENSILE_PERSISTENT_DYNAMIC_GRID=0 (persistent grid = CU count); this yaml sets no env (default grid = production).
