# OOB BBS TN exact tuning, category 4, M=411648 N=3248 K=5008 (pure GEMM, lda=ldb=5120): group 1 = winner, group 2 = previous logic kernel.
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 400
  NumWarmups: 160
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
