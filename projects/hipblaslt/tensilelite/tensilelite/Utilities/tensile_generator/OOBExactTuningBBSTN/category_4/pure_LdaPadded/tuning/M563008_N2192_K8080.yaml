# OOB BBS TN exact tuning, category 4, M=563008 N=2192 K=8080 (pure GEMM, lda=ldb=8192 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (4 files), t_ (3 files), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file).
# Candidates: 129 groups in (incl. 2 ruler(s)) -> 112 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (0 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->2; p 58->56; t 38->38; s 16->4; pc 15->12.
# Group 1 = public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# Note: sets t_ were originally run with env TENSILE_PERSISTENT_DYNAMIC_GRID=0 (persistent grid = CU count); this yaml sets no env (default grid = production).
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
