# OOB BBS TN exact tuning, category 4, M=721520 N=6032 K=1072 (pure GEMM, lda=ldb=1152 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (4 files), t_ (3 files), s_ (1 file), b_ (1 file), e_ (1 file), f_ (1 file), g_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file).
# Candidates: 237 groups in (incl. 2 ruler(s)) -> 184 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (0 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->2; p 87->85; t 56->55; s 12->1; b 25->24; e 9->6; f 9->0; g 17->0; pc 20->11.
# Group 1 = public winner (logic in this category), group 2 = previous logic kernel (logic_1109a).
# Note: sets t_, f_, g_ were originally run with env TENSILE_PERSISTENT_DYNAMIC_GRID=0 (persistent grid = CU count); this yaml sets no env (default grid = production).
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
