# tailfold_du: tdm_store_v2 winner pinned yaml, DepthU [64, 128, 256, 512] (was [64]); see ../../README.md
# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 4096  # tailfold_du: sampled check of the new tail-folded kernels
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Single problem: m=2080, n=4496, batch=184, k=752
      # round5: hand-designed MI/CD/DepthU for this problem (see README.md); section 3/3 with ClusterDim 1_1 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round2 additionally hand-narrowed the space. Removals that say "narrowed by round2 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 87.7%]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round2
        # pruned PrefetchGL2: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.04x of problem best (< 20%); see the "# round2" note]
        # pruned PrefetchGL2: 2 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.05x of problem best (< 20%); see the "# round2" note]
        - HalfPLR: [2]  # pinned to winner (was [1, 2])  # round2
        # pruned HalfPLR: 0 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.04x of problem best (< 20%); see the "# round2" note]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [64, 128, 256, 512]  # tailfold_du: was [64]; winner DepthU 64 + larger powers of 2 <= min(512, next_pow2(K=752)) (develop tail folding)
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [true]  # round2
        # pruned SourceSwap: false [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.16x of problem best (< 20%); see the "# round2" note]
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [0, 1]  # tailfold_du: was [1]; TDMStoreInst true rejects AdaptiveGemm 1 in this build
        # pruned AdaptiveGemm: 0 [best kernel 1.24x of problem best, measured in round4]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [1]  # pinned to winner (was [0, 1])  # round2
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0]  # round2
        # pruned LDSSegmentInterleave: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[1, 1]]  # round5 section 3/3 (BASE: [[1, 1], [1, 2], [2, 2]])
        # pruned ClusterDim: 1_4 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.09x of problem best (< 20%); see the "# round2" note]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]  # round2
        # pruned StreamK: 3 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round2" note]
        - ActivationFuncCall: [false]  # pinned to winner (was [false, true])  # round2: new knob
        - TemporalHintA: [2]  # pinned to winner (was [0, 2])  # round2: new knob
        - TemporalHintB: [2]  # pinned to winner (was [0, 2])  # round2: new knob
        - WorkGroupMapping: [8]  # pinned to winner (was [1, 8])  # round2
        # pruned WorkGroupMapping: 16 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
        - StaggerU: [0]  # pinned to winner (was [0, 32])  # round2
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 2176 (M = 2080), lda = ldb = 768 (K = 752) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [2080, 4496, 184, 752, 2176, 2176, 768, 768]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
