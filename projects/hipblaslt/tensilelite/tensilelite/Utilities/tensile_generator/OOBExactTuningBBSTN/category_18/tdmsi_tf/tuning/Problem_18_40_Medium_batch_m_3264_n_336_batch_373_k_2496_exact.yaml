# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
# round2 tried: history-guided widening (see output/finetune/round2/README.md); speedup 23.9 -> 25.5 (+1.6 pt, below the 2 pt merge threshold), BASE kept. Do not retry.
# round4 merged: AdaptiveGemm [0, 1] winner, exact x1.10 vs the BASE above (round2 note kept for history).
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 2
  EnqueuesPerSync: 2
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 18/40 - Medium batch - m=3264, n=336, batch=373, k=2496 [round5 section 1/3: ClusterDim 1_2]
      # round5: hand-designed MI/CD/DepthU for this problem (see README.md); section 1/3 with ClusterDim 1_2 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        - MatrixInstruction:
          # Per-problem MI set is generated independently per shape.
          # Ranked by a batch-aware time model (grid = tiles_m*tiles_n*batch,
          # padding waste, tile traffic); best tiles + smaller-tile hedges.
          # MIWaveGroup=[1,1] is excluded (TDM swap requires NumWaves>1).
          - [16, 16, 32, 1, 1, 4, 11, 4, 1]  # MT256x176  [round5 CD[1,2]: CU gran 99.7% / CD-adj CU gran 99.7% / total gran 93.3%]
          - [16, 16, 32, 1, 1, 8, 6, 2, 2]  # MT256x192  [round5 CD[1,2]: CU gran 99.7% / CD-adj CU gran 99.7% / total gran 85.6%]
          - [16, 16, 32, 1, 1, 4, 13, 4, 1]  # MT256x208  [round5 CD[1,2]: CU gran 99.7% / CD-adj CU gran 99.7% / total gran 79.0%]
          # - [16, 16, 32, 1, 1, 15, 3, 1, 4]  # MT240x192  pruned: best kernel 1.25x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 3, 11, 4, 1]  # MT192x176  round5: pruned, best kernel with any CD = 82% of problem best  [round5 CD[1,2]: CU gran 99.1% / CD-adj CU gran 99.1% / total gran 94.6%]
          # - [16, 16, 32, 1, 1, 7, 6, 2, 2]  # MT224x192  round5: pruned, best kernel with any CD = 84% of problem best  [round5 CD[1,2]: CU gran 99.3% / CD-adj CU gran 99.3% / total gran 84.4%]
          # - [16, 16, 32, 1, 1, 2, 11, 4, 1]  # MT128x176  pruned: best kernel 1.21x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 1, 11, 4, 1]  # MT64x176  pruned: best kernel 1.43x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 4, 3, 2, 1]  # MT128x48  pruned: best kernel 1.43x of problem best (> 20% slower)
          - [16, 16, 32, 1, 1, 4, 7, 4, 1]  # MT256x112  round5: NEW tile, no line in BASE's yaml  [round5 CD[1,2]: CU gran 99.7% / CD-adj CU gran 74.8% / total gran 73.3%]
          - [16, 16, 32, 1, 1, 8, 4, 2, 2]  # MT256x128  round5: NEW tile, no line in BASE's yaml  [round5 CD[1,2]: CU gran 99.7% / CD-adj CU gran 74.8% / total gran 64.2%]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0, 1, 2]  # review section 4: biggest single-param speedup (1.05-1.42x) for bandwidth-bound sizes in cat14/15; not forked before
        - HalfPLR: [0, 1, 2]  # review section 4: OOB winner was HPLR2, never independently verified against the default (0)
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [64, 128]
        # pruned DepthU: 256 [best kernel 1.21x of problem best]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [false, true]
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [0, 1]  # round4: new knob
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0, 1]
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0, 1]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[1, 2]]  # round5 section 1/3 (BASE: [[1, 1], [2, 2], [1, 2], [4, 1]])
        # pruned ClusterDim: 4_1 [round5: best kernel with this ClusterDim = 79% of problem best]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0, 3]
        - WorkGroupMapping: [1, 8, 16]  # review section 4: cat13 winners use WGM16/32; esp. helps Small batch (small batch_count, large M*N)
        - StaggerU: [0, 32]  # review section 4: cat14 exp2 fork; thin/elongated sizes often favor SU0
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
