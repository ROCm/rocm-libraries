# round4 tried: AdaptiveGemm [0, 1] (tuned + benchmarked on GPU2): exact x1.00 vs BASE (merge rule >= x1.05),
# BASE kept. Do not retry as is.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 3
  EnqueuesPerSync: 3
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 13/40 - Medium batch - m=448, n=6464, batch=214, k=448
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round2 additionally hand-narrowed the space. Removals that say "narrowed by round2 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          # round2: history winner MT64x128 DU64 SS1 SU32 WGM1 CD1_1 (pp_old, 872k GF) vs v2 MT224x256 SS0 SU0 WGM8 (722k GF); small tiles missing in v2
          - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT64x128
          - [16, 16, 32, 1, 1, 4, 2, 1, 2]  # MT64x64
          - [16, 16, 32, 1, 1, 4, 6, 1, 2]  # MT64x192
          - [16, 16, 32, 1, 1, 4, 8, 1, 2]  # MT64x256
          - [16, 16, 32, 1, 1, 8, 2, 1, 2]  # MT128x64
          - [16, 16, 32, 1, 1, 7, 4, 1, 2]  # MT112x128
          - [16, 16, 32, 1, 1, 7, 2, 1, 2]  # MT112x64
          - [16, 16, 32, 1, 1, 7, 4, 2, 2]  # MT224x128
          - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  pruned: best kernel 2.84x of problem best
          # - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  pruned: best kernel 2.01x of problem best
          # - [16, 16, 32, 1, 1, 7, 6, 2, 2]  # MT224x192  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  pruned: best kernel 2.22x of problem best
          # - [16, 16, 32, 1, 1, 7, 2, 1, 4]  # MT112x128  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.05x of problem best (< 20%); see the "# round2" note
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round2
        # pruned PrefetchGL2: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
        # pruned PrefetchGL2: 2 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note]
        - HalfPLR: [0, 2]  # round2
        # pruned HalfPLR: 1 [best kernel 2.04x of problem best]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32, 64]  # round2
        # pruned DepthU: 128 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [false, true]  # round2
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0]  # round2
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        # pruned ScheduleGROverBarrier: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round2" note]
        - LDSSegmentInterleave: [0]  # round2
        # pruned LDSSegmentInterleave: 1 [best kernel 1.58x of problem best]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[1, 1], [2, 1], [2, 2]]  # round2
        # pruned ClusterDim: 1_4 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.16x of problem best (< 20%); see the "# round2" note]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]  # round2
        # pruned StreamK: 3 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note]
        - ActivationFuncCall: [False, True]  # round2: new knob
        - WorkGroupMapping: [1, 8]  # round2
        # pruned WorkGroupMapping: 16 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round2" note]
        - StaggerU: [0, 32]  # round2
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 448 (M = 448), lda = ldb = 448 (K = 448) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [448, 6464, 214, 448, 448, 448, 448, 448]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
