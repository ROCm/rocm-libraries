# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 20/40 - Medium batch - m=4944, n=1984, batch=484, k=672 [round5 section 1/3: ClusterDim 4_1]
      # round5: hand-designed MI/CD/DepthU for this problem (see README.md); section 1/3 with ClusterDim 4_1 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round2 additionally hand-narrowed the space. Removals that say "narrowed by round2 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          # round2: gbmnk winner MT256x224x128 (4_14 WG64_2_1) CD1_1 SS1 HPLR2 WGM8 = 1086k GF; v2 lacks this tile (nearest 0.64x); SK 0.90-0.98, SS0 0.67-0.74
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  [round5 CD[4,1]: CU gran 99.8% / CD-adj CU gran 99.8% / total gran 93.4%]
          # - [16, 16, 32, 1, 1, 4, 14, 4, 1]  # MT256x224  round5: pruned, best kernel with any CD = 85% of problem best  [round5 CD[4,1]: CU gran 99.8% / CD-adj CU gran 99.8% / total gran 94.8%]
          # - [16, 16, 32, 1, 1, 4, 11, 4, 1]  # MT256x176  round5: pruned, best kernel with any CD = 71% of problem best  [round5 CD[4,1]: CU gran 99.9% / CD-adj CU gran 99.9% / total gran 90.7%]
          # - [16, 16, 32, 1, 1, 8, 8, 1, 2]  # MT128x256  round5: pruned, best kernel with any CD = 76% of problem best  [round5 CD[4,1]: CU gran 100.0% / CD-adj CU gran 97.5% / total gran 93.5%]
          # - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  pruned: best kernel 1.36x of problem best
          # - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256  pruned: best kernel 1.35x of problem best
          # - [16, 16, 32, 1, 1, 13, 4, 1, 4]  # MT208x256  pruned: best kernel 1.44x of problem best
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: best kernel 1.47x of problem best
          # - [16, 16, 32, 1, 1, 4, 8, 2, 2]  # MT128x256  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.16x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128  pruned: best kernel 1.21x of problem best
          # - [16, 16, 32, 1, 1, 8, 2, 1, 2]  # MT128x64  pruned: best kernel 1.51x of problem best
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0, 2]  # round2
        # pruned PrefetchGL2: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round2" note]
        - HalfPLR: [1, 2]  # round2
        # pruned HalfPLR: 0 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round2" note]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [64]  # round5 section 1/3 (BASE: [64, 128])
        # pruned DepthU: 128 [narrowed by round5 to reduce tuning time; NOT measured >20% slower: best DU128 kernel in this section's retained pairs = 89% of problem best]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [true]  # round2
        # pruned SourceSwap: false [best kernel 1.35x of problem best]
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [1]  # round4: new knob
        # pruned AdaptiveGemm: 0 [best kernel 1.31x of problem best, measured in round4]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0, 1]  # round2
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0, 1]  # round2
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[4, 1]]  # round5 section 1/3 (BASE: [[1, 1], [4, 1]])
        # pruned ClusterDim: 2_2 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.09x of problem best (< 20%); see the "# round2" note]
        # pruned ClusterDim: 1_4 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.16x of problem best (< 20%); see the "# round2" note]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]  # round2
        # pruned StreamK: 3 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
        - ActivationFuncCall: [False, True]  # round2: new knob
        - TemporalHintA: [0, 2]  # round2: new knob
        - TemporalHintB: [0, 2]  # round2: new knob
        - WorkGroupMapping: [8, 16]  # round2
        # pruned WorkGroupMapping: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round2" note]
        - StaggerU: [0]  # round2
        # pruned StaggerU: 32 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 4992 (M = 4944), lda = ldb = 768 (K = 672) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [4944, 1984, 484, 672, 4992, 4992, 768, 768]
