# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
# round4 tried: AdaptiveGemm [0, 1] (tuned + benchmarked on GPU2): exact x1.02 vs BASE (merge rule >= x1.05),
# BASE kept. Do not retry as is.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 7
  EnqueuesPerSync: 7
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 19/40 - Medium batch - m=1120, n=656, batch=382, k=512 [round5 section 1/5: ClusterDim 1_1]
      # round5: hand-designed MI/CD/DepthU for this problem (see README.md); section 1/5 with ClusterDim 1_1 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        - MatrixInstruction:
          # Per-problem MI set is generated independently per shape.
          # Ranked by a batch-aware time model (grid = tiles_m*tiles_n*batch,
          # padding waste, tile traffic); best tiles + smaller-tile hedges.
          # MIWaveGroup=[1,1] is excluded (TDM swap requires NumWaves>1).
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: best kernel 1.24x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256  pruned: best kernel 1.26x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  pruned: best kernel 1.68x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 6, 7, 2, 2]  # MT192x224  pruned: best kernel 1.85x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 4, 15, 4, 1]  # MT256x240  pruned: best kernel 2.00x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 3, 15, 4, 1]  # MT192x240  pruned: best kernel 2.14x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 5, 5, 2, 2]  # MT160x160  pruned: best kernel 1.60x of problem best (> 20% slower)
          - [16, 16, 32, 1, 1, 4, 3, 2, 2]  # MT128x96  [round5 CD[1,1]: CU gran 99.0% / CD-adj CU gran 99.0% / total gran 93.9%]
          - [16, 16, 32, 1, 1, 4, 3, 1, 2]  # MT64x96  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 94.4%]
          - [16, 16, 32, 1, 1, 7, 3, 1, 2]  # MT112x96  round5: NEW tile, no line in BASE's yaml  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 97.1%]
          - [16, 16, 32, 1, 1, 4, 7, 2, 1]  # MT128x112  round5: NEW tile, no line in BASE's yaml  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 94.4%]
