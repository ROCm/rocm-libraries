# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), c_ (2 files), e_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file).
# Candidates: 524 groups in (incl. 2 ruler(s)) -> 224 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (20 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->2; p 27->25; q 4->4; s 24->6; c 367->120; e 10->7; pc 90->60.
