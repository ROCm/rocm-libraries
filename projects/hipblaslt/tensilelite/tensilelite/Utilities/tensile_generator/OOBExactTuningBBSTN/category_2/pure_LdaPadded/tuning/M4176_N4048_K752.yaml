# OOB BBS TN exact tuning, category 2, M=4176 N=4048 K=752 (pure GEMM, lda=ldb=768 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), c_ (2 files), e_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 524 groups in (incl. 2 ruler(s)) -> 224 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (20 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->2; p 27->25; q 4->4; s 24->6; c 367->120; e 10->7; pc 90->60. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 1 file(s) 103->95; tf21B_ 1 file(s) 9->0; tf21C_ 1 file(s) 103->25; tf22_ 2 file(s) 210->124; ff23_ 2 file(s) 209->0; r27_ 1 file(s) 5->4. Total now 472 groups.
# Group 1 = new winner (retune_1127, logic in this category; HalfPLR 0 -> 1 vs the retune winner, whose fused codegen fails on develop (SGPR-pool bug), pending develop SGPR-pool fix; fused NOEPI on GPU0, same flock hold as the WA kernel (f/r x2): 19.768 us vs WA 19.836 us (+0.14%, runs -0.33..+1.65%)), group 2 = previous winner (11/12 logic), group 3 = logic_1109a kernel (when different).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
