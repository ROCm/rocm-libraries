# OOB BBS TN exact tuning, category 2, M=7056 N=896 K=1248: FUSED GEMM kernels (Bias [s, B] + ScaleAlphaVec + hipblaslt_all, ActivationFuncCall true, CompactLoopStore true = #15650 pure-gemm store pass), called as the PURE GEMM problem; lda=ldb=1280 = ceil(K/128)*128, gfx1250.
# = pure_LdaPadded/tuning/M7056_N896_K1248.yaml converted to the fused problem type, every candidate kept with ActivationFuncCall true + CompactLoopStore true (340 pure groups -> 336 fused groups, 5 became identical and were merged; group 1 = fused winner).
# Client call = NOEPI (bias / ScaleAlphaVec null, activation none, beta 0): the problem type carries Bias + SAV, so after the Tensile build edit each ClientParameters.ini to use-bias=0, use-scaleAlphaVec=0, activation-enum-args=None, init-beta=Zero (as in the 11/27 Excel bench).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0.
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 400
  NumWarmups: 160
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
