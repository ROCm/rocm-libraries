# Candidates: 1461 groups in (incl. 2 ruler(s)) -> 964 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (15 CAIDM -1 cluster groups not taken; the public winner is a CAIDM -1 cluster kernel and is kept). Per set in->kept (first occurrence wins): ruler 2->2; p 174->172; q 54->54; s 15->2; a 1154->692; pc 62->42.
