# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 5/40 - Small batch - m=5280, n=7616, batch=58, k=7232
      # round5: hand-designed MI/CD/DepthU for this problem (see README.md); single section
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round2 additionally hand-narrowed the space. Removals that say "narrowed by round2 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          # round2: v2 Tensile winner MT240x256 CD2_2 SS0 (12142us) measures worse in hipblaslt (13148us) than gbmnk 256x256 CD1_1 SS1 (12616us): keep both families
          - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  [round5 CD[2,2]: CU gran 99.7% / CD-adj CU gran 99.7% / total gran 98.9%]
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  [round5 CD[2,2]: CU gran 99.7% / CD-adj CU gran 95.2% / total gran 92.7%]
          # - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.08x of problem best (< 20%); see the "# round2" note
          - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256  round5: re-enabled (BASE's yaml had it commented out: MT224x256  pruned: best kernel 1.23x of problem best)  [round5 CD[2,2]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 96.9%]
          # - [16, 16, 32, 1, 1, 4, 13, 4, 1]  # MT256x208  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.12x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 13, 4, 1, 4]  # MT208x256  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.17x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 11, 3, 1, 4]  # MT176x192  pruned: narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.19x of problem best (< 20%); see the "# round2" note
          # - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128  pruned: best kernel 1.37x of problem best
          # - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT64x128  pruned: best kernel 1.65x of problem best
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round2
        # pruned PrefetchGL2: 1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round2" note]
        # pruned PrefetchGL2: 2 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note]
        - HalfPLR: [1, 2]  # round2
        # pruned HalfPLR: 0 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.02x of problem best (< 20%); see the "# round2" note]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [128]  # round5 (BASE: [64, 128])
        # pruned DepthU: 64 [narrowed by round5 to reduce tuning time; NOT measured >20% slower: best DU64 kernel in this section's retained pairs = 92% of problem best]
        # pruned DepthU: 256 [best kernel 1.37x of problem best]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [false, true]  # round2
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [0, 1]  # round4: new knob
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0, 1]  # round2
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0, 1]  # round2
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[2, 2]]  # round5 (BASE: [[1, 1], [2, 2]])
        # pruned ClusterDim: 1_1 [round5: best kernel with this ClusterDim = 99% of problem best]
        # pruned ClusterDim: 1_4 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.06x of problem best (< 20%); see the "# round2" note]
        # pruned ClusterDim: 4_1 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.09x of problem best (< 20%); see the "# round2" note]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]  # round2
        # pruned StreamK: 3 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.05x of problem best (< 20%); see the "# round2" note]
        - ActivationFuncCall: [False, True]  # round2: new knob
        - TemporalHintA: [0, 2]  # round2: new knob
        - TemporalHintB: [0, 2]  # round2: new knob
        - WorkGroupMapping: [1, 16]  # round2
        # pruned WorkGroupMapping: 8 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round2" note]
        - StaggerU: [0]  # round2
        # pruned StaggerU: 32 [narrowed by round2 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round2" note]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 5280 (M = 5280), lda = ldb = 7232 (K = 7232) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [5280, 7616, 58, 7232, 5280, 5280, 7232, 7232]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
