# smallk_pf0: sub-round of tdm_store for the small-K problems (K <= 64, no P24); PGR [0], PLR [0]; see README.md
# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 2
  EnqueuesPerSync: 2
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 4/40 - Small batch - m=4928, n=6656, batch=40, k=16 [smallk_pf0 section 1/3: ClusterDim 1_1]
      # smallk_pf0: hand-designed MI/CD for this problem (see README.md); section 1/3 with ClusterDim 1_1 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round1 additionally hand-narrowed the space. Removals that say "narrowed by round1 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 8, 4, 1, 2]  # MT128x128 2-wave, wave tile 8x4, 39x52 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.7%]  control: tdm_store winner MT128x128 (2 waves, acc 256 VGPR)
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128 4-wave, wave tile 4x4, 39x52 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.7%]  4-wave, same MT128x128, acc 128
          # - [16, 16, 32, 1, 1, 4, 2, 2, 4]  # MT128x128 8-wave, wave tile 4x2, 39x52 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.7%]  8-wave, same MT128x128, acc 64  [pruned: best kernel 1.66x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 2, 2, 4, 4]  # MT128x128 16-wave, wave tile 2x2, 39x52 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.7%]  16-wave, same MT128x128, acc 32  [pruned: best kernel 2.06x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 4, 4, 2, 4]  # MT128x256 8-wave, wave tile 4x4, 39x26 tiles  [smallk_pf0 CD[1,1]: CU gran 99.6% / CD-adj CU gran 99.6% / total gran 98.4%]  8-wave MT128x256, acc 128  [pruned: best kernel 1.45x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 4, 4, 4, 2]  # MT256x128 8-wave, wave tile 4x4, 20x52 tiles  [smallk_pf0 CD[1,1]: CU gran 99.7% / CD-adj CU gran 99.7% / total gran 96.0%]  8-wave MT256x128, acc 128  [pruned: best kernel 1.46x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
        - PrefetchGlobalRead: [0]  # smallk_pf0: was [2] (BASE tdm_store); P24: PGR0 best by ~10% GFlops; K<=32 is one DepthU iteration
        # pruned PrefetchGlobalRead: 1 [smallk_pf0: P24 PGR1/2 best kernel 1.10x of PGR0 (0.91 / 0.91 of problem best); NOT measured on this problem]; 2 [smallk_pf0: P24 PGR1/2 best kernel 1.10x of PGR0 (0.91 / 0.91 of problem best); NOT measured on this problem]
        - PrefetchLocalRead: [0]  # smallk_pf0: was [1] (BASE tdm_store); PLR0 drops the second A/B register set -> fewer VGPR -> more waves per SIMD (P24)
        # pruned PrefetchLocalRead: 1 [smallk_pf0: extra A/B register set lowers occupancy; P24 PLR0 best; NOT measured on this problem]
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round1
        # pruned PrefetchGL2: 1 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round1" note]
        # pruned PrefetchGL2: 2 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round1" note]
        - HalfPLR: [0]  # round1
        # pruned HalfPLR: 1 [no kernel built in benchmark]
        # pruned HalfPLR: 2 [no kernel built in benchmark]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32]  # round1
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [True]  # round1
        # pruned SourceSwap: false [best kernel 1.59x of problem best, measured in tdm_store/smallk_pf0]
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [0, 1]  # round4: new knob
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # smallk_pf0: was [0, 1, 2, 3] (BASE tdm_store); PR 15133 final form is a switch (0 = buffer_store, 1 = TDM store), 2/3 are no longer valid
        # pruned TDMStoreInst: 2 [smallk_pf0: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        # pruned TDMStoreInst: 3 [smallk_pf0: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0, 1]  # round1
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0]  # round1
        # pruned LDSSegmentInterleave: 1 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round1" note]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[1, 1]]  # smallk_pf0 section 1/3: one ClusterDim per section (BASE: see tdm_store yaml)
        # pruned ClusterDim: 4_1 [best kernel 1.28x of problem best]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - TileProcessingStrategy: [None]  # smallk_pf0: was [None, DataParallel, StreamK]; P24: DP 0.86 / StreamK 0.84 of best; this problem has >= 1e4 tiles per launch
        # pruned TileProcessingStrategy: DataParallel [smallk_pf0: P24 0.86 of problem best, NOT measured on this problem]; StreamK [smallk_pf0: P24 0.84 of problem best, NOT measured on this problem]
        - WorkAssignment: [StaticGrid]
        - PrefetchAcrossPersistent: [0, 1]
        - ReuseAcrossPersistent: [0]
        - NonTemporalD: [0, 1, 2, 3]
        - WorkGroupMapping: [1, 8, 16]  # round1
        - StaggerU: [0]  # round1
        # pruned StaggerU: 32 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.14x of problem best (< 20%); see the "# round1" note]
        # pruned StaggerU: 64 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.15x of problem best (< 20%); see the "# round1" note]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 4992 (M = 4928), lda = ldb = 16 (K = 16) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [4928, 6656, 40, 16, 4992, 4992, 16, 16]
