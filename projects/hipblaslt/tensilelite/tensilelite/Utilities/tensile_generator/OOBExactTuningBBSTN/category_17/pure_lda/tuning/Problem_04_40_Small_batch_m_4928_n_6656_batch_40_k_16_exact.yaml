          # - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128  pruned
          # - [16, 16, 32, 1, 1, 8, 6, 1, 2]  # MT128x192  pruned
          # - [16, 16, 32, 1, 1, 6, 4, 2, 2]  # MT192x128  pruned
          - [16, 16, 32, 1, 1, 8, 4, 1, 4]  # MT128x256
          - [16, 16, 32, 1, 1, 8, 4, 2, 2]  # MT256x128
          # - [16, 16, 32, 1, 1, 6, 6, 2, 2]  # MT192x192  pruned
          # - [16, 16, 32, 1, 1, 8, 6, 2, 2]  # MT256x192  pruned
          # - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  pruned
          # - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256  pruned: best kernel 1.54x of problem best
          # - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  pruned: best kernel 1.73x of problem best
          # - [16, 16, 32, 1, 1, 13, 4, 1, 4]  # MT208x256  pruned: best kernel 1.79x of problem best
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: best kernel 1.65x of problem best
          # - [16, 16, 32, 1, 1, 11, 4, 1, 4]  # MT176x256  pruned: best kernel 1.42x of problem best
          # - [16, 16, 32, 1, 1, 7, 4, 2, 2]  # MT224x128  pruned: best kernel 1.26x of problem best
          # - [16, 16, 32, 1, 1, 7, 2, 1, 4]  # MT112x128  pruned
          # - [16, 16, 32, 1, 1, 7, 2, 1, 2]  # MT112x64  pruned
