        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        # pruned SourceSwap: false [round3 paired: SS1 wins 100% of 5484 pairs, SS1/SS0 median 1.39, 1.49-1.78 in groups within 20% of the best; best SS0 kernel 547k = 0.64x of the round3 best]
