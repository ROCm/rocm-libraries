        # pruned AdaptiveGemm: 0 [round3 paired: AG1/AG0 median 1.13 over 16806 pairs, AG1 wins 85%; in groups within 10% of the best 162/162 AG1 wins (ratio 1.75-2.13); every AG0 win is <= 0.66x of the round3 best]
