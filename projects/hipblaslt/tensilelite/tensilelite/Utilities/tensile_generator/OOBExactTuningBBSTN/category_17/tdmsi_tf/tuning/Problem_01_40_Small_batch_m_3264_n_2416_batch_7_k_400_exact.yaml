        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # tdm_store_v2: was [0, 1, 2, 3] (tdm_store); PR 15133 final form is a 0/1 switch
        # pruned TDMStoreInst: 2, 3 [tdm_store_v2: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [1]  # round1
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        # pruned ScheduleGROverBarrier: 0 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round1" note]
        # round3: add 0: BASE (round1) pinned LDSSI=1, which Tensile rejects unless numComp==2 and VWA==WaveTileA, so only 6 of the 13 MI tiles produced kernels; the 10/27 history kernel MT128x64 CD4_1 HPLR2 (536k GF in hipblaslt) was not reachable
        - LDSSegmentInterleave: [0, 1]  # round3
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        # pruned ClusterDim: 4_1 [round3 paired: wins 0 of 138 groups within 20% of the best, 0.915x of CD[1,1] in those groups; best kernel 733k = 0.85x of the round3 best]
