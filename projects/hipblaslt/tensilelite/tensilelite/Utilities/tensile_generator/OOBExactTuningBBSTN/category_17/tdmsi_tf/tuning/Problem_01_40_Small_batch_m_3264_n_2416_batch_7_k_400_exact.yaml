        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round1 additionally hand-narrowed the space. Removals that say "narrowed by round1 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          # round1: per-problem MI set (2-wave and 4-wave groups; no 8-wave / wt0*wt1>64)
          # - [16, 16, 32, 1, 1, 8, 8, 1, 2]  # MT128x256  round5: not used with CD1_1, best kernel with this section's CD = 81% of problem best  [round5 CD[1,1]: CU gran 88.9% / CD-adj CU gran 88.9% / total gran 82.3%]
          # - [16, 16, 32, 1, 1, 4, 8, 2, 2]  # MT128x256  pruned: round3 best kernel with this tile is 1.54x of the round3 problem best (slower than the problem best by >20%, 1.20 threshold); was added in round3 as: MT128x256 2x2 waves (alternative wave layout of the winner tile)
          # - [16, 16, 32, 1, 1, 4, 8, 1, 2]  # MT64x256  pruned: round3 best kernel with this tile is 1.82x of the round3 problem best (slower than the problem best by >20%, 1.20 threshold); was added in round3 as: MT64x256 2-wave
          # - [16, 16, 32, 1, 1, 4, 2, 1, 2]  # MT64x64  round5: pruned, best kernel with any CD = 51% of problem best  [round5 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 99.3%]
          # - [16, 16, 32, 1, 1, 8, 2, 1, 2]  # MT128x64  round5: pruned, best kernel with any CD = 67% of problem best  [round5 CD[1,1]: CU gran 96.5% / CD-adj CU gran 96.5% / total gran 94.0%]
          # - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT64x128  round5: pruned, best kernel with any CD = 60% of problem best  [round5 CD[1,1]: CU gran 98.1% / CD-adj CU gran 98.1% / total gran 97.5%]
          # - [16, 16, 32, 1, 1, 8, 4, 1, 2]  # MT128x128  round5: pruned, best kernel with any CD = 74% of problem best  [round5 CD[1,1]: CU gran 96.5% / CD-adj CU gran 96.5% / total gran 94.0%]
          # - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128  round5: pruned, best kernel with any CD = 73% of problem best  [round5 CD[1,1]: CU gran 96.5% / CD-adj CU gran 96.5% / total gran 94.0%]
          # - [16, 16, 32, 1, 1, 6, 4, 2, 2]  # MT192x128  round5: pruned, best kernel with any CD = 51% of problem best  [round5 CD[1,1]: CU gran 98.1% / CD-adj CU gran 98.1% / total gran 97.5%]
          # - [16, 16, 32, 1, 1, 8, 4, 1, 4]  # MT128x256  round5: pruned, best kernel with any CD = 76% of problem best  [round5 CD[1,1]: CU gran 88.9% / CD-adj CU gran 88.9% / total gran 82.3%]
          # - [16, 16, 32, 1, 1, 8, 4, 2, 2]  # MT256x128  round5: pruned, best kernel with any CD = 77% of problem best  [round5 CD[1,1]: CU gran 96.5% / CD-adj CU gran 96.5% / total gran 94.0%]
          # - [16, 16, 32, 1, 1, 6, 6, 2, 2]  # MT192x192  round5: pruned, best kernel with any CD = 53% of problem best  [round5 CD[1,1]: CU gran 86.3% / CD-adj CU gran 86.3% / total gran 83.6%]
          - [16, 16, 32, 1, 1, 8, 6, 2, 2]  # MT256x192  [round5 CD[1,1]: CU gran 92.4% / CD-adj CU gran 92.4% / total gran 87.7%]
          # - [16, 16, 32, 1, 1, 10, 6, 2, 2]  # MT320x192  round5: pruned, best kernel with any CD = 46% of problem best  [round5 CD[1,1]: CU gran 97.8% / CD-adj CU gran 97.8% / total gran 87.7%]
          - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  [round5 CD[1,1]: CU gran 97.8% / CD-adj CU gran 97.8% / total gran 94.0%]
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  [round5 CD[1,1]: CU gran 88.9% / CD-adj CU gran 88.9% / total gran 82.3%]
          # - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  pruned: best kernel 1.42x of problem best
          - [16, 16, 32, 1, 1, 4, 11, 4, 1]  # MT256x176  round5: re-enabled (BASE's yaml had it commented out: MT256x176  pruned: narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.01x of problem best (< 20%); see the "# round1" note)  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 95.7%]
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: best kernel 1.39x of problem best
          - [16, 16, 32, 1, 1, 15, 3, 1, 4]  # MT240x192  round5: re-enabled (BASE's yaml had it commented out: MT240x192  pruned: best kernel 1.38x of problem best)  [round5 CD[1,1]: CU gran 99.5% / CD-adj CU gran 99.5% / total gran 93.6%]
          # - [16, 16, 32, 1, 1, 7, 4, 2, 2]  # MT224x128  pruned: best kernel 1.21x of problem best
          # - [16, 16, 32, 1, 1, 7, 2, 1, 4]  # MT112x128  pruned: narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round1" note
          # - [16, 16, 32, 1, 1, 2, 7, 2, 1]  # MT64x112  pruned: narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.04x of problem best (< 20%); see the "# round1" note
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]  # OOB baseline majority (32/40); not forked
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round1
        # pruned PrefetchGL2: 1 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.03x of problem best (< 20%); see the "# round1" note]
