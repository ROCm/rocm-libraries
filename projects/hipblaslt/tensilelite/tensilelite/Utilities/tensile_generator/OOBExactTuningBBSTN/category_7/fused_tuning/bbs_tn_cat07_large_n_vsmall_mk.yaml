GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  # PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 50
  EnqueuesPerSync: 1000   # fastest size runs ~6.2 us; keeps every size >= 4 ms per sync
  SleepPercent: 50
  # PrintWinnersOnly: True
  Architecture: gfx1250
  # KeepBuildTmp: True
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 384


BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 1
      Batched: True
      UseScaleAlphaVec: 1
      Activation: True
      ActivationType: hipblaslt_all
      ActivationComputeDataType: s
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup - 7. Large N, very small M and K
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        # MIWaveGroup [1,4]: MT0 = 16*WT0 (16/32/64/112/128), MT1 = 64*WT1 (128/256/384/512)
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  1, 2,  1, 4]
          - [16, 16, 32, 1,  1,  1, 4,  1, 4]
          - [16, 16, 32, 1,  1,  1, 6,  1, 4]
          - [16, 16, 32, 1,  1,  1, 8,  1, 4]
          - [16, 16, 32, 1,  1,  2, 2,  1, 4]
          - [16, 16, 32, 1,  1,  2, 4,  1, 4]
          - [16, 16, 32, 1,  1,  2, 6,  1, 4]
          - [16, 16, 32, 1,  1,  2, 8,  1, 4]
          - [16, 16, 32, 1,  1,  4, 2,  1, 4]
          - [16, 16, 32, 1,  1,  4, 4,  1, 4]
          - [16, 16, 32, 1,  1,  4, 6,  1, 4]
          - [16, 16, 32, 1,  1,  4, 8,  1, 4]
          - [16, 16, 32, 1,  1,  7, 2,  1, 4]
          - [16, 16, 32, 1,  1,  7, 4,  1, 4]
          - [16, 16, 32, 1,  1,  7, 6,  1, 4]
          - [16, 16, 32, 1,  1,  7, 8,  1, 4]
          - [16, 16, 32, 1,  1,  8, 2,  1, 4]
          - [16, 16, 32, 1,  1,  8, 4,  1, 4]
          - [16, 16, 32, 1,  1,  8, 6,  1, 4]
          - [16, 16, 32, 1,  1,  8, 8,  1, 4]
        - DepthU: [32, 64, 128]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [-1]
        - HalfPLR: [0]
        - TDMIterateMode: [-1]
        - TDMSplit: [False]
        - PrefetchGL2: [0, 1]
        - LDSSegmentInterleave: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
