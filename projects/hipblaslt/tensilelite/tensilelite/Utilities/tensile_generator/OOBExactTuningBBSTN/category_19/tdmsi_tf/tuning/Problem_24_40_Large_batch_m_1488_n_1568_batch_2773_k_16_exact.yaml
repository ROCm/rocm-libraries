# smallk_pf0 (P24 = w8_cd22 repro on develop + PR 15133, TDMStoreInst [0, 1]); orig w8_cd22: sub-round of tdm_store for P24: ClusterDim fixed to [2, 2]; sweep of 8-wave WaveGroup x WaveTile (MI 16x16x32) + the 4-wave MT256x112 control;
# PrefetchGlobalRead [0, 1, 2], PrefetchLocalRead [0], TDMStoreInst [0, 3], SourceSwap [true] as in pf012_cd. See README.md.
# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 1/6: ClusterDim 2_2]
      # w8_cd22: hand-designed MI/CD for this problem (see README.md); section 1/6 with ClusterDim 2_2 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): round1 additionally hand-narrowed the space. Removals that say "narrowed by round1 to reduce tuning time" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          # round1: per-problem MI set (2-wave and 4-wave groups; no 8-wave / wt0*wt1>64)
          # - [16, 16, 32, 1, 1, 4, 2, 1, 2]  # MT64x64  round5: pruned, best kernel with any CD = 74% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 96.1% / total gran 91.3%]
          # - [16, 16, 32, 1, 1, 8, 2, 1, 2]  # MT128x64  w8_cd22: not used with CD2_2  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 96.1% / total gran 91.3%]
          # - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT64x128  round5: pruned, best kernel with any CD = 75% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 92.8% / total gran 84.8%]
          # - [16, 16, 32, 1, 1, 8, 4, 1, 2]  # MT128x128  w8_cd22: not used with CD2_2  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 92.8% / total gran 84.8%]
          # - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT128x128  round5: pruned, best kernel with any CD = 78% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 92.8% / total gran 84.8%]
          # - [16, 16, 32, 1, 1, 7, 2, 1, 4]  # MT112x128  round5: pruned, best kernel with any CD = 46% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 92.8% / total gran 83.0%]
          # - [16, 16, 32, 1, 1, 6, 4, 2, 2]  # MT192x128  round5: pruned, best kernel with any CD = 43% of problem best  [w8_cd22 CD[2,2]: CU gran 99.9% / CD-adj CU gran 92.8% / total gran 84.7%]
          # - [16, 16, 32, 1, 1, 8, 6, 1, 2]  # MT128x192  round5: pruned, best kernel with any CD = 69% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 90.0% / total gran 79.1%]
          # - [16, 16, 32, 1, 1, 4, 7, 2, 2]  # MT128x224  round5: pruned, best kernel with any CD = 69% of problem best  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 87.5% / total gran 84.8%]
          # - [16, 16, 32, 1, 1, 8, 4, 2, 2]  # MT256x128  w8_cd22: not used with CD2_2  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 92.8% / total gran 84.8%]
          # - [16, 16, 32, 1, 1, 8, 7, 2, 2]  # MT256x224  pruned: best kernel 1.96x of problem best
          # - [16, 16, 32, 1, 1, 6, 7, 2, 2]  # MT192x224  pruned: best kernel 2.31x of problem best
          # - [16, 16, 32, 1, 1, 7, 7, 2, 2]  # MT224x224  pruned: best kernel 2.58x of problem best
          # - [16, 16, 32, 1, 1, 4, 11, 4, 1]  # MT256x176  pruned: best kernel 2.00x of problem best
          # - [16, 16, 32, 1, 1, 4, 15, 4, 1]  # MT256x240  pruned: best kernel 2.42x of problem best
          # - [16, 16, 32, 1, 1, 8, 5, 2, 2]  # MT256x160  pruned: best kernel 1.78x of problem best
          # - [16, 16, 32, 1, 1, 2, 7, 4, 1]  # MT128x112  w8_cd22: not used with CD2_2  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 96.9%]
          # - [16, 16, 32, 1, 1, 2, 7, 2, 1]  # MT64x112  pruned: narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.12x of problem best (< 20%); see the "# round1" note
          - [16, 16, 32, 1, 1, 4, 7, 4, 1]  # MT256x112  w8_cd22: kept, best kernel with this MI and CD = 100% of problem best (pf0_tdmsi03)  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 96.9%]
          # - [16, 16, 32, 1, 1, 4, 9, 4, 1]  # MT256x144  w8_cd22: not used with CD2_2  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 91.7% / total gran 87.9%]
          # - [16, 16, 32, 1, 1, 2, 7, 8, 1]  # MT256x112  w8_cd22: 8-wave tile, unmeasured  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 96.9%]  [pruned: best kernel 1.56x of problem best within ClusterDim 2_2, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 1, 7, 8, 1]  # MT128x112  w8_cd22: 8-wave tile, unmeasured  [w8_cd22 CD[2,2]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 96.9%]  [pruned: best kernel 2.04x of problem best within ClusterDim 2_2, measured in tdm_store/smallk_pf0]
        - PrefetchGlobalRead: [0]  # w8_cd22: was [2] (BASE tdm_store); pf0_tdmsi03 had [0]. PGR changes LDS size/schedule, not VGPR -> re-tune 0/1/2
        # pruned PrefetchGlobalRead: 1 [best kernel 1.26x of problem best, measured in tdm_store/smallk_pf0]
        # pruned PrefetchGlobalRead: 2 [best kernel 1.26x of problem best, measured in tdm_store/smallk_pf0]
        - PrefetchLocalRead: [0]  # w8_cd22: was [1] (BASE tdm_store); PLR0 drops the second A/B register set -> fewer VGPR -> more waves per SIMD (k1_pgr_occupancy.html)
        # pruned PrefetchLocalRead: 1 [w8_cd22: extra A/B register set lowers occupancy; K=16 is a single DepthU iteration, not measured slower]
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0]  # round1
        # pruned PrefetchGL2: 1 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.06x of problem best (< 20%); see the "# round1" note]
        # pruned PrefetchGL2: 2 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.06x of problem best (< 20%); see the "# round1" note]
        - HalfPLR: [0]  # round1
        # pruned HalfPLR: 1 [no kernel built in benchmark]
        # pruned HalfPLR: 2 [no kernel built in benchmark]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32]  # round1
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [true]  # w8_cd22: was [false, true]
        # pruned SourceSwap: false [w8_cd22: best kernel with SourceSwap=false = 73% of problem best (median 44%), pf0_tdmsi03 benchmark]
        # round4: fork AdaptiveGemm [0, 1] for every problem: AG=1 builds the ThenN/Then1 edge-tile store blocks chosen at runtime (round3 P01: AG1/AG0 median 1.13, AG1 wins 85% of 16806 pairs); BASE never forked it for the other problems
        - AdaptiveGemm: [1]  # round4: new knob
        # pruned AdaptiveGemm: 0 [best kernel 1.32x of problem best, measured in round4]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # smallk_pf0: w8_cd22 had [0, 3]; PR 15133 final form is a 0/1 switch (3 no longer valid), so 3 -> 1
        # pruned TDMStoreInst: [2, 3] [smallk_pf0: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0]  # round1
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        # pruned ScheduleGROverBarrier: 1 [best kernel 1.26x of problem best, measured in tdm_store/smallk_pf0]
        - LDSSegmentInterleave: [0]  # round1
        # pruned LDSSegmentInterleave: 1 [best kernel 1.79x of problem best]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        - ClusterDim: [[2, 2]]  # w8_cd22 section 1/6: fixed: best ClusterDim in pf0_tdmsi03 / pf012_cd (MT256x112 = 100%) (BASE: [[1, 1], [1, 2], [2, 1], [2, 2], [4, 1]])
        # pruned ClusterDim: 1_1 [narrowed by tdm_store to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# tdm_store" note]
        # pruned ClusterDim: 4_1 [best kernel 1.32x of problem best]
        # pruned ClusterDim: 2_1 [best kernel 1.38x of problem best]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - TileProcessingStrategy: [None, DataParallel, StreamK]
        - WorkAssignment: [StaticGrid]
        - PrefetchAcrossPersistent: [0]
        # pruned PrefetchAcrossPersistent: 1 [best kernel 1.30x of problem best, measured in tdm_store/smallk_pf0]
        - ReuseAcrossPersistent: [0]
        - NonTemporalD: [0, 1, 2, 3]
        - WorkGroupMapping: [1, 8, 16]  # round1
        - StaggerU: [0]  # round1
        # pruned StaggerU: 32 [narrowed by round1 to reduce tuning time, NOT measured slower: v1 best kernel 1.00x of problem best (< 20%); see the "# round1" note]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 1536 (M = 1488), lda = ldb = 16 (K = 16) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [1488, 1568, 2773, 16, 1536, 1536, 16, 16]
    # pruned section: # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 2/6: ClusterDim 2_2]
    #   every MI tile measured >= 1.20x slower than the problem best (best 1.21x, ClusterDim 2_2), measured in tdm_store/smallk_pf0; tiles: [16,16,32,1,1,2,8,8,1] [16,16,32,1,1,4,4,4,2] [16,16,32,1,1,8,2,2,4]
    # pruned section: # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 3/6: ClusterDim 2_2]
    #   every MI tile measured >= 1.20x slower than the problem best (best 1.73x, ClusterDim 2_2), measured in tdm_store/smallk_pf0; tiles: [16,16,32,1,1,2,4,8,1] [16,16,32,1,1,4,2,4,2] [16,16,32,1,1,8,1,2,4]
    # pruned section: # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 4/6: ClusterDim 2_2]
    #   every MI tile measured >= 1.20x slower than the problem best (best 1.73x, ClusterDim 2_2), measured in tdm_store/smallk_pf0; tiles: [16,16,32,1,1,1,8,8,1] [16,16,32,1,1,2,4,4,2] [16,16,32,1,1,4,2,2,4]
    # pruned section: # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 5/6: ClusterDim 2_2]
    #   every MI tile measured >= 1.20x slower than the problem best (best 1.68x, ClusterDim 2_2), measured in tdm_store/smallk_pf0; tiles: [16,16,32,1,1,8,1,1,8]
    # pruned section: # Problem 24/40 - Large batch - m=1488, n=1568, batch=2773, k=16 [w8_cd22 section 6/6: ClusterDim 2_2]
    #   every MI tile measured >= 1.20x slower than the problem best (best 1.76x, ClusterDim 2_2), measured in tdm_store/smallk_pf0; tiles: [16,16,32,1,1,2,7,4,2]
LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
