TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 22/40 - Large batch - m=656, n=736, batch=2147, k=640
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 2, 1, 2]  # MT64x64
          - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT64x128
          - [16, 16, 32, 1, 1, 8, 2, 1, 2]  # MT128x64
          - [16, 16, 32, 1, 1, 8, 4, 1, 2]  # MT128x128
          - [16, 16, 32, 1, 1, 7, 2, 1, 4]  # MT112x128
          - [16, 16, 32, 1, 1, 6, 4, 2, 2]  # MT192x128
          - [16, 16, 32, 1, 1, 8, 6, 1, 2]  # MT128x192
          - [16, 16, 32, 1, 1, 6, 6, 2, 2]  # MT192x192
          - [16, 16, 32, 1, 1, 7, 6, 2, 2]  # MT224x192
          - [16, 16, 32, 1, 1, 8, 6, 2, 2]  # MT256x192
          - [16, 16, 32, 1, 1, 7, 8, 2, 2]  # MT224x256
          # - [16, 16, 32, 1, 1, 15, 4, 1, 4]  # MT240x256  pruned: best kernel 1.51x of problem best
          # - [16, 16, 32, 1, 1, 8, 8, 2, 2]  # MT256x256  pruned
          # - [16, 16, 32, 1, 1, 11, 4, 1, 4]  # MT176x256  pruned: best kernel 1.46x of problem best
          # - [16, 16, 32, 1, 1, 15, 3, 1, 4]  # MT240x192  pruned: best kernel 1.51x of problem best
          # - [16, 16, 32, 1, 1, 7, 4, 2, 2]  # MT224x128  pruned: best kernel 1.32x of problem best
          # - [16, 16, 32, 1, 1, 7, 2, 1, 2]  # MT112x64  pruned
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [0]
        - PrefetchGL2: [0]
        # pruned PrefetchGL2: 1
        # pruned PrefetchGL2: 2
        - HalfPLR: [0]
        # pruned HalfPLR: 1
        # pruned HalfPLR: 2
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32, 64]
        # pruned DepthU: 128 [best kernel 1.22x of problem best]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [false, true]
        - AdaptiveGemm: [0, 1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0, 1]
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]
        - LDSSegmentInterleave: [0]
        # pruned LDSSegmentInterleave: 1
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        # NOTE: known incorrect results observed with CD2_2, CD4_4 on shapes: [224, 128, 98666, 96].
        - ClusterDim: [[1, 1], [1, 2], [2, 1], [2, 2], [4, 1]]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - TileProcessingStrategy: [None, DataParallel, StreamK]
        - WorkAssignment: [StaticGrid]
        - PrefetchAcrossPersistent: [0, 1]
        - ReuseAcrossPersistent: [0]
        - WorkGroupMapping: [1, 8]
        # pruned WorkGroupMapping: 16
        - StaggerU: [0, 32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ldd = ldc = 768 (M = 656), lda = ldb = 640 (K = 640)
          # Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [656, 736, 2147, 640, 768, 768, 640, 640]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
