# smallk_pf0: sub-round of tdm_store for the small-K problems (K <= 64, no P24); PGR [0], PLR [0]; see README.md
# round5: MI x ClusterDim x DepthU hand-designed per problem (see README.md); one benchmark section per ClusterDim, every MI tile annotated with its CU / CD-adjusted CU / total granularity for that ClusterDim; every other fork is BASE.
# round4 tried: AdaptiveGemm [0, 1] (tuned + benchmarked on GPU2): exact x1.00 vs BASE (merge rule >= x1.05),
# BASE kept. Do not retry as is.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  CpuThreads: 64  # cap kernel-gen workers: -1 (=256 on this host) used >80 GB host RAM; ~0.7 GB/worker measured, 64 keeps anon+page cache < 100 GiB cgroup cap
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # per_problem_v3: epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 39/40 - Very large batch - m=4048, n=16, batch=51732, k=16 [smallk_pf0 section 1/1: ClusterDim 1_1]
      # smallk_pf0: hand-designed MI/CD for this problem (see README.md); section 1/1 with ClusterDim 1_1 only
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Pruned per problem from this problem's own benchmark/ results (measured on GPU1, 2026-11-04):
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        # EXCEPTION (this yaml): tdm_store additionally hand-narrowed the space. Removals that say "narrowed by tdm_store" were NOT measured >20% slower; the measured Nx is given for each.
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 6, 1, 2, 1]  # MT192x16 2-wave, wave tile 6x1, 22x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 95.8%]  control: tdm_store winner MT192x16 (2 waves, acc 48 VGPR)
          # - [16, 16, 32, 1, 1, 3, 1, 4, 1]  # MT192x16 4-wave, wave tile 3x1, 22x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 95.8%]  4-wave MT192x16, acc 24  [pruned: best kernel 1.59x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          - [16, 16, 32, 1, 1, 4, 1, 4, 1]  # MT256x16 4-wave, wave tile 4x1, 16x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.8%]  4-wave MT256x16, acc 32
          # - [16, 16, 32, 1, 1, 2, 1, 8, 1]  # MT256x16 8-wave, wave tile 2x1, 16x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.8%]  8-wave MT256x16, acc 16  [pruned: best kernel 1.46x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 1, 1, 8, 1]  # MT128x16 8-wave, wave tile 1x1, 32x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.8%]  8-wave MT128x16, acc 8  [pruned: best kernel 2.72x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 1, 1, 16, 1]  # MT256x16 16-wave, wave tile 1x1, 16x1 tiles  [smallk_pf0 CD[1,1]: CU gran 100.0% / CD-adj CU gran 100.0% / total gran 98.8%]  16-wave MT256x16, acc 8  [pruned: best kernel 2.84x of problem best within ClusterDim 1_1, measured in tdm_store/smallk_pf0]
          # - [16, 16, 32, 1, 1, 4, 1, 2, 1]  # MT128x16  pruned: narrowed by tdm_store to reduce tuning time, NOT measured slower: v1 best kernel 1.07x of problem best (< 20%); see the "# tdm_store" note
          # - [16, 16, 32, 1, 1, 2, 1, 2, 1]  # MT64x16  pruned: best kernel 1.34x of problem best
        - PrefetchGlobalRead: [0]  # smallk_pf0: was [2] (BASE tdm_store); P24: PGR0 best by ~10% GFlops; K<=32 is one DepthU iteration
        # pruned PrefetchGlobalRead: 1 [smallk_pf0: P24 PGR1/2 best kernel 1.10x of PGR0 (0.91 / 0.91 of problem best); NOT measured on this problem]; 2 [smallk_pf0: P24 PGR1/2 best kernel 1.10x of PGR0 (0.91 / 0.91 of problem best); NOT measured on this problem]
        - PrefetchLocalRead: [0]  # smallk_pf0: was [1] (BASE tdm_store); PLR0 drops the second A/B register set -> fewer VGPR -> more waves per SIMD (P24)
        # pruned PrefetchLocalRead: 1 [smallk_pf0: extra A/B register set lowers occupancy; P24 PLR0 best; NOT measured on this problem]
        - ClusterLocalRead: [0]  # OOB baseline majority (22/40); not forked
        - PrefetchGL2: [0, 1, 2]  # review section 4: biggest single-param speedup (1.05-1.42x) for bandwidth-bound sizes in cat14/15; not forked before
        - HalfPLR: [0]  # review section 4: OOB winner was HPLR2, never independently verified against the default (0)
        # pruned HalfPLR: 1 [no kernel built in benchmark]; 2 [no kernel built in benchmark]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [true]
        # pruned SourceSwap: false [best kernel 1.51x of problem best]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMStoreInst: [false, true]  # smallk_pf0: was [0, 1, 2, 3] (BASE tdm_store); PR 15133 final form is a switch (0 = buffer_store, 1 = TDM store), 2/3 are no longer valid
        # pruned TDMStoreInst: 2 [smallk_pf0: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        # pruned TDMStoreInst: 3 [smallk_pf0: invalid after PR 15133 (TDMStoreInst is a 0/1 switch)]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0]
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]; 1 [best kernel 1.76x of problem best]
        - LDSSegmentInterleave: [0]
        # pruned LDSSegmentInterleave: 1 [no kernel built in benchmark]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        - ClusterDim: [[1, 1]]  # smallk_pf0 section 1/1: one ClusterDim per section (BASE: see tdm_store yaml)
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]
        # pruned StreamK: 3 [best kernel 1.29x of problem best]
        - WorkGroupMapping: [1]  # review section 4: cat13 winners use WGM16/32; esp. helps Small batch (small batch_count, large M*N)
        # pruned WorkGroupMapping: 8 [best kernel 1.25x of problem best, measured in tdm_store/smallk_pf0]
        # pruned WorkGroupMapping: 16 [best kernel 1.25x of problem best, measured in tdm_store/smallk_pf0]
        - StaggerU: [0, 32]  # review section 4: cat14 exp2 fork; thin/elongated sizes often favor SU0
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # per_problem_v3: ldd = ldc = 4096 (M = 4048), lda = ldb = 16 (K = 16) from workloads.csv
          # per_problem_v3: Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [4048, 16, 51732, 16, 4096, 4096, 16, 16]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
