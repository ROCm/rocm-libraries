TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported yet
GlobalParameters:
  NumElementsToValidate: 0
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  Architecture: gfx1250
  RotatingBufferSize: 384
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # DataInitTypeBias: 0
  # DataInitTypeA: 1
  # DataInitTypeB: 2
  # DataInitTypeScaleAlphaVec: 1
  # PrintTensorA: 1
  # PrintTensorB: 1
  # PrintTensorC: 0
  # PrintTensorD: 1
  # PrintTensorRef: 1
  # GenerateSourcesAndExit: True
  KeepBuildTmp: False
  NumWarmups: 1
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 1
  NumBenchmarks: 1
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      # epilogue stripped: no bias / activation / scaleAlphaVec -> UseBias=0, UseScaleAlphaVec=0, Activation=False, ActivationType=none
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      ActivationType: none
      ActivationComputeDataType: s
      SupportUserArgs: True
      UseBias: 0
      UseScaleAlphaVec: 0
    - # Problem 39/40 - Very large batch - m=4048, n=16, batch=51732, k=16
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # a fork value / MI tile is removed only if its best kernel is >20% slower than the problem best (Nx = best kernel with that value / best overall).
        # Removed MI tiles are kept below as commented-out lines; removed values are listed in "# pruned <Param>: ..." comments; "no kernel built" = rejected/not generated.
        - MatrixInstruction:
          # Per-problem MI set is generated independently per shape.
          # Ranked by a batch-aware time model (grid = tiles_m*tiles_n*batch,
          # padding waste, tile traffic); best tiles + smaller-tile hedges.
          # MIWaveGroup=[1,1] is excluded (TDM swap requires NumWaves>1).
          # - [16, 16, 32, 1, 1, 8, 1, 2, 1]  # MT256x16  pruned: best kernel 2.05x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 7, 1, 2, 1]  # MT224x16  pruned: best kernel 1.26x of problem best (> 20% slower)
          - [16, 16, 32, 1, 1, 6, 1, 2, 1]  # MT192x16
          # - [16, 16, 32, 1, 1, 5, 1, 2, 1]  # MT160x16  pruned: best kernel 1.30x of problem best (> 20% slower)
          - [16, 16, 32, 1, 1, 4, 1, 2, 1]  # MT128x16
          # - [16, 16, 32, 1, 1, 3, 1, 2, 1]  # MT96x16  pruned: best kernel 1.37x of problem best (> 20% slower)
          - [16, 16, 32, 1, 1, 2, 1, 2, 1]  # MT64x16
          # - [16, 16, 32, 1, 1, 1, 1, 2, 1]  # MT32x16  pruned: best kernel 1.74x of problem best (> 20% slower)
          # - [16, 16, 32, 1, 1, 11, 1, 1, 2]  # MT176x32  pruned: best kernel 1.76x of problem best (> 20% slower)
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [0]
        - PrefetchGL2: [0, 1, 2]  # review section 4: biggest single-param speedup (1.05-1.42x) for bandwidth-bound sizes in cat14/15; not forked before
        - HalfPLR: [0]  # review section 4: OOB winner was HPLR2, never independently verified against the default (0)
        # pruned HalfPLR: 1 [no kernel built in benchmark]; 2 [no kernel built in benchmark]
        # DepthU inferred per problem from K scale.
        # K<=32: DU32; K<=256: 32/64/128; K<=1024: 64/128; else 64/128/256
        # (512/1024 never won in any previous run).
        - DepthU: [32]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [4]
        - TransposeLDS: [-1]
        - SourceSwap: [true]
        # pruned SourceSwap: false [best kernel 1.51x of problem best]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]  # triple LDS buffer is forced to 0 in Solution.py; -1/1 were no-op duplicates
        - ScheduleGROverBarrier: [0]
        # pruned ScheduleGROverBarrier: -1 [auto, duplicate of 0/1]; 1 [best kernel 1.76x of problem best]
        - LDSSegmentInterleave: [0]
        # pruned LDSSegmentInterleave: 1 [no kernel built in benchmark]
        # CD candidates from the batch-aware time model (A/B multicast vs round-up cost); [1,1] always kept.
        - ClusterDim: [[1, 1]]
        # pruned ClusterDim: 2_1 [best kernel 3.94x of problem best]
        # NOTE: known incorrect results observed with SK3 on shapes: [336, 144, 2108, 7776], [208, 2256, 2367, 192], [48, 720, 3028, 208].
        - StreamK: [0]
        # pruned StreamK: 3 [best kernel 1.29x of problem best]
        - WorkGroupMapping: [1, 8, 16]  # review section 4: cat13 winners use WGM16/32; esp. helps Small batch (small batch_count, large M*N)
        - StaggerU: [0, 32]  # review section 4: cat14 exp2 fork; thin/elongated sizes often favor SU0
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ldd = ldc = 4096 (M = 4048), lda = ldb = 16 (K = 16)
          # Exact = [m, n, batch, k, ldd, ldc, lda, ldb]
          - Exact: [4048, 16, 51732, 16, 4096, 4096, 16, 16]

LibraryLogic:
  ScheduleName: gfx1250
  ArchitectureName: gfx1250
  LibraryType: Equality
