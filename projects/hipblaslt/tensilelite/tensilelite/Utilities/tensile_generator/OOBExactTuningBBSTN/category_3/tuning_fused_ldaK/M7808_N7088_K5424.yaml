    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [7808, 7088, 1, 5424, 7808, 7808, 5424, 5424]
    - BiasTypeArgs: [s]
    - ActivationArgs:
      - - {Enum: none}
