    - GlobalReadVectorWidthB: [1]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [8]
    - LocalReadVectorWidthB: [8]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PostLoopStoreInNll: [false]
    - PrefetchGL2: [2]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - SuppressNoLoadLoop: [true]
    - TDMInst: [3]
    - ThreadTile:
      - [1, 1]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - WavefrontSize: [32]
    - WorkGroupMapping: [16]
    - VectorWidthB: [2]
    - LdsBlockSizePerPadA: [1024]
    - LdsBlockSizePerPadB: [512]
    - LdsPadA: [8]
    - LdsPadB: [8]
    - TDMIterateMode: [0]
    - MIArchVgpr: [true]
    - AdaptiveGemm: [1]
    - LDSSegmentBRotate: [0]
    - ActivationFuncCall: [true]
    - SourceSwap: [true]
    - VectorWidthA: [8]
    - StoreVectorWidth: [8]
    - LDSSegmentInterleave: [1]
    - HalfPLR: [1]
