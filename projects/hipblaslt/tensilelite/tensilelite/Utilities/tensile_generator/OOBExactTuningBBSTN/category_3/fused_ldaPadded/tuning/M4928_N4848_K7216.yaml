# OOB BBS TN exact tuning, category 3, M=4928 N=4848 K=7216: FUSED GEMM kernels (Bias [s, B] + ScaleAlphaVec + hipblaslt_all, ActivationFuncCall true, CompactLoopStore true = #15650 pure-gemm store pass), called as the PURE GEMM problem; lda=ldb=7296 = ceil(K/128)*128, gfx1250.
# = pure_LdaPadded/tuning/M4928_N4848_K7216.yaml converted to the fused problem type, every candidate kept with ActivationFuncCall true + CompactLoopStore true (955 pure groups -> 790 fused groups, 166 became identical and were merged; group 1 = fused winner).
# Client call = NOEPI (bias / ScaleAlphaVec null, activation none, beta 0): the problem type carries Bias + SAV, so after the Tensile build edit each ClientParameters.ini to use-bias=0, use-scaleAlphaVec=0, activation-enum-args=None, init-beta=Zero (as in the 11/27 Excel bench).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0.
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5 / RotatingBufferSize 384 / CSVMergeSameProblemID false.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 400
  NumWarmups: 160
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeScaleAlphaVec: 3
  DataInitSeed: 1
  CSVExportWinner: true
  CSVMergeSameProblemID: false
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  KeepBuildTmp: false
  RotatingBufferSize: 384
  UseEffLike: false
  SyncsPerBenchmark: 1
  NumBenchmarks: 5
  CpuThreads: 32
  PrintSolutionRejectionReason: true
