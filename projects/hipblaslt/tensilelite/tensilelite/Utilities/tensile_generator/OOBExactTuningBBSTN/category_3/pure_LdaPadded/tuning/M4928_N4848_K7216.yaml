# OOB BBS TN exact tuning, category 3, M=4928 N=4848 K=7216 (pure GEMM, lda=ldb=7296 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), q_ (1 file), s_ (1 file), d_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 150 groups in (incl. 2 ruler(s)) -> 104 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (15 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->2; p 42->40; q 21->21; s 24->6; d 6->0; pc 55->35. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 4 file(s) 550->510; tf21B_ 1 file(s) 19->9; tf21C_ 2 file(s) 268->204; tf22_ 2 file(s) 169->69; ff23_ 2 file(s) 253->59; r27_ 1 file(s) 2->0. Total now 955 groups.
# Group 1 = new winner (retune_1127, logic in this category), group 2 = previous winner (11/12 logic), group 3 = logic_1109a kernel (when different).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
