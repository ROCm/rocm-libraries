# OOB BBS TN exact tuning, category 3, M=7856 N=5120 K=7200 (pure GEMM, lda=ldb=7296 = ceil(K/128)*128), gfx1250.
# Full original candidate search for this size, merged from tune_1111/tune_1112 sets: p_ (1 file), s_ (1 file), pc_ (11/12 ClusterDim / ClusterAIDMapping / WorkGroupMapping round, 1 file); 11/21-11/27 TailFolding retune sets: tf21A_ (retune_1121 pass A/A2/A3), tf21B_ (pass B), tf21C_ (pass C), tf22_ (retune_tf1_1122 pass A), ff23_ (fixfold_1123 pass A), r27_ (retune_1127: WaveTileContiguousA x LDSSegmentInterleave, TPS None, TDMSI0 reference).
# Candidates: 175 groups in (incl. 2 ruler(s)) -> 138 after exact de-dup, keeping only ClusterAIDMapping -2 for cluster kernels of the pc_ set (13 CAIDM -1 cluster groups not taken). Per set in->kept (first occurrence wins): ruler 2->2; p 103->101; s 24->6; pc 46->29. 11/27 merge (new sets, in->kept after de-dup against everything before): tf21A_ 2 file(s) 222->203; tf21B_ 1 file(s) 40->15; tf21C_ 0 file(s) 0->0; tf22_ 1 file(s) 118->48; ff23_ 1 file(s) 117->0; r27_ 1 file(s) 5->4. Total now 408 groups.
# Group 1 = new winner (retune_1127, logic in this category), group 2 = previous winner (11/12 logic), group 3 = logic_1109a kernel (when different).
# Needs develop with TailFolding (#16312) + TDMStoreInst PR #15133 (head 4eb56fa3f5a): TDMStoreInst 1 groups use AdaptiveGemm 0; the retune-tree knobs TailFolding / TailFoldingTestOff are removed (develop folds whenever legal).
