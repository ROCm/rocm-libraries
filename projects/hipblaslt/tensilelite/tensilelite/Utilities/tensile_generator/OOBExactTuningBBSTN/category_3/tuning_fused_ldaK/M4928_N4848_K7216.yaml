# OOB BBS TN exact tuning, category 3, M=4928 N=4848 K=7216 (fused GEMM: Bias + ScaleAlphaVec, activation none, ActivationFuncCall true; lda=ldb=K, ldc=ldd=M): group 1 = winner, group 2 = previous logic kernel.
# EnqueuesPerSync 400 / NumWarmups 160 / NumBenchmarks 5.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 400
  NumWarmups: 160
  KernelTime: true
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 3
  DataInitTypeScaleAlphaVec: 3
