    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [4928, 4848, 1, 7216, 4928, 4928, 7216, 7216]
    - BiasTypeArgs: [s]
    - ActivationArgs:
      - - {Enum: none}
LibraryLogic:
  ScheduleName: gfx1250
  DeviceNames: [Device 73f0]
  ArchitectureName: gfx1250
