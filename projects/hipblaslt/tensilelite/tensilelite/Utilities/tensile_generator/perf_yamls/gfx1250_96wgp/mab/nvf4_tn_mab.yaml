# Best 96-WGP kernel for nvf4_tn_mab. Concurrent mean 6.348 TB/s, +9.53% versus the previous [2,2] winner.

GlobalParameters:
  NumElementsToValidate: 0
  NumElementsToValidateWinner: 0
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 100
  EnqueuesPerSync: 1000
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  ForceGenerateKernel: 1

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F4
      DestDataType: F8
      ComputeDataType: s
      MXBlockA: 16
      MXBlockB: 16
      DataTypeMXSA: F8
      DataTypeMXSB: F8
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 8, 1, 4]
        - ActivationFuncCall: [False]
        - AssertFree0ElementMultiple: [2]
        - AssertFree1ElementMultiple: [2]
        - AssertSummationElementMultiple: [16]
        - ClusterDim: [[1, 8]]
        - ClusterLocalRead: [0]
        - DepthU: [512]
        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [-1]
        - ExpandPointerSwap: [False]
        - ForceDisableShadowInit: [True]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitUWorkGroupMappingRoundRobin: [True]
        - InitCIterWmma: [-1]
        - LDSSegmentBRotate: [0]
        - LDSSegmentInterleave: [0]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsBlockSizePerPadMetadata: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LocalReadVectorWidth: [-1]
        - LocalReadVectorWidthA: [-1]
        - LocalReadVectorWidthB: [-1]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - MaxLDS: [-1]
        - MbskPrefetchMethod: [-1]
        - MinGRIncPerMfma: [-1]
        - PrefetchGL2: [1]
        - PrefetchGlobalRead: [2]
        - ScheduleGROverBarrier: [-1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [True]
        - StaggerU: [0]
        - StaggerUStride: [0]
        - StoreVectorWidth: [-1]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [-1]
        - ThreadTile: [[1, 1]]
        - TransposeLDS: [-1]
        - UseCustomMainLoopSchedule: [-1]
        - UseSgprForGRO: [0]
        - VectorWidthA: [-1]
        - VectorWidthB: [2]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - MIArchVgpr: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 49152, 1, 65536]
