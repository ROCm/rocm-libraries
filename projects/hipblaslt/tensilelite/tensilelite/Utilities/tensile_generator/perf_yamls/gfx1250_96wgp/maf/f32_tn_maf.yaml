# Best 96-WGP kernel for f32_tn_maf. Concurrent mean 0.088 PFLOPS. Same kernel as the previous winner.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: False
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 13
  DataInitTypeB: 12
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 2
  EnqueuesPerSync: 1000
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  SkipSlowSolutionRatio: 0
  RotatingBufferSize: 384

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: False
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4, 8, 1, 4]
        - ActivationFuncCall: [False]
        - DepthU: [32]
        - DirectToLdsMetadata: [0]
        - DtlPlusLdsBuf: [-1]
        - ExpandPointerSwap: [False]
        - ForceDisableShadowInit: [True]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [-1]
        - InitCIterWmma: [1]
        - LDSSegmentBRotate: [0]
        - LDSSegmentInterleave: [0]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsBlockSizePerPadMetadata: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LocalReadVectorWidth: [-1]
        - LocalReadVectorWidthA: [-1]
        - LocalReadVectorWidthB: [-1]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - MaxLDS: [-1]
        - MbskPrefetchMethod: [-1]
        - MinGRIncPerMfma: [-1]
        - PrefetchGL2: [1]
        - PrefetchGlobalRead: [2]
        - ScheduleGROverBarrier: [-1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [True]
        - StaggerU: [0]
        - StaggerUStride: [0]
        - StoreVectorWidth: [-1]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]
        - ThreadTile: [[1, 1]]
        - TransposeLDS: [-1]
        - UseCustomMainLoopSchedule: [-1]
        - UseSgprForGRO: [0]
        - VectorWidthA: [-1]
        - VectorWidthB: [4]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - MIArchVgpr: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 3072, 1, 65536]
