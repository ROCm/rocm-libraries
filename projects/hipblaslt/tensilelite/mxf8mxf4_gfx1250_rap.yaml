TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 1
  NumWarmups: 1
  KernelTime: true
  Architecture: gfx1250
  NumElementsToValidate: 1000
  BoundsCheck: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  PrintLevel: 2
  PrintSolutionRejectionReason: True
  # ForceGenerateKernel: True
  KeepBuildTmp: True

BenchmarkProblems:
   -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 8,  2, 2] # 64x256
          # - [16, 16, 128, 1,  1,  2, 16,  2, 2] # 64x512
        # - HalfPLR: [1] # HalfPLR doesn't support PAP
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - TDMInst: [3]
        - TDMIterateMode: [0] # [0,1]
        - ClusterDim: [[1,1]] # [[4,4]]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        # - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1] # [4,8]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        # - WorkGroupMappingXCC: [1]
        # - WorkGroupMappingXCCGroup: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - PrefetchAcrossPersistent: [0,1]
        - ReuseAcrossPersistent: [0,1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # - Exact: [5120*128, 64, 1, 1024]
          # - Exact: [5120, 64, 128, 1024]
          # - Exact: [64, 5120, 16, 768]
          # - Exact: [64, 32768, 4, 768]
          - Exact: [64, 12288, 4, 256]
          - Exact: [64, 12288, 4, 512]
          - Exact: [64, 12288, 4, 768]
          - Exact: [64, 12288, 4, 1024]
          - Exact: [64, 12288, 4, 1280]
          - Exact: [64, 12288, 4, 1536]
          - Exact: [64, 12288, 4, 1792]
          - Exact: [64, 12288, 4, 2048]
          # - Exact: [64, 655360, 1, 758] # 1280 tiles, 5 tiles/WG
          # - Exact: [64, 5120, 1, 1024]
          # - Exact: [64, 5120, 1, 1536]
          # - Exact: [64, 655360, 1, 1536] # 1280 tiles, 5 tiles/WG
          # - Exact: [64, 49664, 1, 1536]
          # - Exact: [64, 5120, 1, 1792]
          # - Exact: [64, 49152, 1, 1024]
          # - Exact: [64, 49664, 1, 1024]
          # - Exact: [64, 98304, 1, 1024]
          # - Exact: [64, 196608, 1, 1024] 
          # - Exact: [64, 393216, 1, 1024]
        - ActivationArgs:
          - [Enum: none]


