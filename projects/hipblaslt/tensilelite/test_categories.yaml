# TensileLite Test Categories Configuration
#
# NOTE: TensileLite is a *pytest*-based component. Unlike gtest/ctest components
# (which use ctest labels via shared/ctest), these tests are Python/pytest, so
# this file is consumed by TheRock's pytest_runner.py rather than CMake/ctest.
# Aligned with Test Filter Standardization (RFC0010).
#
# For the selected category, pytest_runner.py runs pytest on `test_paths`,
# filtered by the marker expression built from `pytest_markers` /
# `exclude_markers` plus GPU-arch `skip-gfxXXXX` markers (registered in
# pytest.ini), from the installed share/hipblaslt/tensilelite/ tree.
#
# The host-only suites — rocisa_tests, and the non-GPU part of Tensile/Tests/unit,
# plus the C++ tensilelite/tests gtest — run on CPU-only Component CI lanes
# (component-ci-rocisa.yml + component-ci-tensilelite-{unit,gtest,coverage}.yml),
# NOT here. So every TheRock tier below runs only the GPU-legit work: the subtile
# GPU unit tests (marker `gpu`) plus common GEMM. Subtile tests `skip` until a
# GPU runner for the target arch is available.
#
# test_paths are relative to the installed component root
# (share/hipblaslt/tensilelite/), which is the pytest working directory.

test_categories:
  # These tiers run only the GPU slice of the unit suite, so syrupy would flag the
  # un-exercised (host-only) snapshots as failures; `--snapshot-warn-unused`
  # downgrades those to warnings instead of errors.
  quick:
    description: "Subtile GPU smoke (TensileLite unit, GPU only)"
    test_paths:
      - "Tensile/Tests/unit"
    pytest_markers:
      - "gpu"
    pytest_args:
      - "--snapshot-warn-unused"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Pre-checkin (subtile GPU unit + common GEMM)"
    labels:
      - "standard"
      - "pr"
      - "precheckin"
    runs:
      - name: "unit"
        description: "TensileLite subtile GPU unit tests"
        test_paths:
          - "Tensile/Tests/unit"
        pytest_markers:
          - "gpu"
        pytest_args:
          - "--snapshot-warn-unused"
      - name: "common"
        description: "Common GEMM tests on GPU via the prebuilt client"
        test_paths:
          - "Tensile/Tests/common"
        pytest_markers:
          - "{AMDGPU_TARGETS}"
        parallel_workers: 16
        pytest_args:
          - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
          - "--global-parameters=LibraryFormat='msgpack'"
          - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"

  # standard/comprehensive/full mix two suites needing different pytest invocations
  # — subtile GPU unit (`-m gpu`) vs common GEMM (`-m <arch>` + prebuilt-client) —
  # which one `-m` expression can't express. So they use `runs:` sub-runs:
  # pytest_runner.py runs each independently and aggregates (run-all, not
  # fail-fast), one JUnit per sub-run. `{AMDGPU_TARGETS}` is substituted at runtime
  # with the concrete gfx target (from AMDGPU_TARGETS env, falling back to
  # AMDGPU_FAMILIES).
  comprehensive:
    description: "Nightly comprehensive (subtile GPU unit + common GEMM)"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"
    runs:
      - name: "unit"
        description: "TensileLite subtile GPU unit tests"
        test_paths:
          - "Tensile/Tests/unit"
        pytest_markers:
          - "gpu"
        pytest_args:
          - "--snapshot-warn-unused"
      - name: "common"
        description: "Common GEMM tests on GPU via the prebuilt client"
        test_paths:
          - "Tensile/Tests/common"
        pytest_markers:
          - "{AMDGPU_TARGETS}"
        parallel_workers: 16
        pytest_args:
          - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
          - "--global-parameters=LibraryFormat='msgpack'"
          - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"

  full:
    description: "Complete suite (subtile GPU unit + common GEMM)"
    labels:
      - "full"
      - "all"
    runs:
      - name: "unit"
        description: "TensileLite subtile GPU unit tests"
        test_paths:
          - "Tensile/Tests/unit"
        pytest_markers:
          - "gpu"
        pytest_args:
          - "--snapshot-warn-unused"
      - name: "common"
        description: "All common GEMM tests on GPU via the prebuilt client"
        test_paths:
          - "Tensile/Tests/common"
        pytest_markers:
          - "{AMDGPU_TARGETS}"
        parallel_workers: 16
        pytest_args:
          - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
          - "--global-parameters=LibraryFormat='msgpack'"
          - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"

  # Common-GEMM tests (GPU emulation). These are the only tests that
  # build/run kernels through the client, so they require the TensileLite-specific
  # conftest options passed via `pytest_args` below. {AMDGPU_TARGETS} is
  # substituted at runtime by pytest_runner.py with the concrete gfx target.
  ffm-quick:
    description: "Common GEMM tests (FFM emulation)"
    test_paths:
      - "Tensile/Tests/common"
    pytest_markers:
      - "{AMDGPU_TARGETS}"
    # These GEMM tests build/run independent kernels; run them across xdist
    # workers (overrides the global execution_settings.parallel_workers).
    parallel_workers: 16
    # Extra pytest CLI options appended verbatim for this category only.
    # `{ROCM_PATH}` is substituted with the install prefix at runtime (same as the
    # execution_settings.environment block). The `--prebuilt-client`,
    # `--global-parameters` and `--tensile-options` flags are custom options
    # registered in tensilelite's conftest.py (Tensile/Tests/conftest.py).
    pytest_args:
      - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
      - "--global-parameters=LibraryFormat='msgpack'"
      - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"
    labels:
      - "ffm-quick"

  # Arch-agnostic emulation pre-submit tests. {AMDGPU_TARGETS} is substituted
  # at runtime by pytest_runner.py with the concrete gfx target (from
  # AMDGPU_TARGETS env var, falling back to AMDGPU_FAMILIES).
  # Kernel devs opt tests in by adding `emu_fast` to
  # TestParameters.marks in individual YAML files.
  emu-fast:
    description: "Common GEMM tests for emulation pre-submits"
    test_paths:
      - "Tensile/Tests/common"
    pytest_markers:
      - "{AMDGPU_TARGETS} and emu_fast"
    parallel_workers: 16
    pytest_args:
      - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
      - "--global-parameters=LibraryFormat='msgpack'"
      - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"
    labels:
      - "emu-fast"

  # Arch-agnostic emulation nightly — runs ALL tests for the target arch.
  emu-full:
    description: "All common GEMM tests for emulation nightly"
    test_paths:
      - "Tensile/Tests/common"
    pytest_markers:
      - "{AMDGPU_TARGETS}"
    parallel_workers: 16
    pytest_args:
      - "--prebuilt-client={ROCM_PATH}/libexec/hipblaslt/tensilelite/tensilelite-client"
      - "--global-parameters=LibraryFormat='msgpack'"
      - "--tensile-options=--cxx-compiler,{ROCM_PATH}/bin/amdclang++,--gpu-targets,{AMDGPU_TARGETS}"
    labels:
      - "emu-full"

execution_settings:
  # TensileLite GPU unit tests assemble/run kernels and the legacy runner ran
  # them serially; pytest-xdist worker isolation (HIP_VISIBLE_DEVICES) is set up
  # in conftest.py, so this can be raised once parallel GPU runs are validated.
  parallel_workers: 1
  # Per-test timeout in seconds (passed to pytest-timeout as --timeout); a single
  # test exceeding this is killed. This is NOT a total job budget — the overall
  # job wall-clock limit is set by timeout_minutes in TheRock's
  # fetch_test_configurations.py.
  category_timeouts:
    quick: 300            # 5 minutes
    standard: 2700        # 45 minutes
    comprehensive: 25200  # 7 hours
    full: 28800           # 8 hours
    ffm-quick: 2700       # 45 minutes
    emu-fast: 2400        # 40 minutes
    emu-full: 28800       # 8 hours
