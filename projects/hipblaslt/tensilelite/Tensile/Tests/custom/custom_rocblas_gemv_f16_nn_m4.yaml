TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # wvSpltK: gfx942/gfx950

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: false
      TransposeB: false
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "wvSpltK_f16_nn_m4"
            args: [ { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeFree1 },
                    { type: address, semantic: AddressB },
                    { type: address, semantic: AddressA },
                    { type: int32, semantic: ComputeUnits },
                    { type: int32, semantic: SizeFree0 },
                    { type: int32, semantic: StrideB0 },
                    { type: int32, semantic: StrideA0 },
                    { type: address, semantic: AddressC },
                    { type: address, semantic: AddressD },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: StrideC0 },
                    { type: int32, semantic: StrideD0 } ]
            macrotile: [64, 16, 8]
            threads: [64, 16, 1]
            grid: [ComputeUnits, One, One]
        - MatrixInstruction:
          # 9-tuple so fork conversion sets EnableMatrixInstruction and
          # WorkGroup [64, 16, 1] from waves=mi[7]*mi[8]=16 (matches threads).
          - [16, 16, 16, 1, 1, 4, 1, 4, 4]
        - StaggerU: [0]
        - AssertSummationElementMultiple: [8]
        # batch == 1: the kernel has no batch stride arguments, so a
        # strided-batched problem would leave every batch past the first unwritten.
        - AssertSizeEqual: [{2: 1}]
        # N > 8: with fewer columns than the wave tile (3 here) the tail fixup
        # underflows. M > 0: the kernel indexes the last real row of A as M - 1.
        - AssertSizeGreaterThan: [{0: 0, 1: 8}]
        # M <= 4: M is a kernarg and tile rows past it are never stored.
        # K <= 8192, i.e. M*K <= 32768 halves for every M <= 4: A is only read
        # from LDS, so the whole activation matrix has to fit the 64 KB buffer.
        - AssertSizeLessThan: [{0: 5, 3: 8193}]
        # Unit stride along the contiguous dimension of each tensor; the leading
        # dimensions are kernargs.
        - AssertStrideAEqual: [{0: 1}]
        - AssertStrideBEqual: [{0: 1}]
        - AssertStrideCEqual: [{0: 1}]
        - AssertStrideDEqual: [{0: 1}]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # NN M<=4, K%8==0, N>8, K<=8192.
          - Exact: [4, 32, 1, 64]
          - Exact: [4, 256, 1, 128]
          - Exact: [4, 1024, 1, 256]
          - Exact: [4, 4096, 1, 4096]
          - Exact: [4, 8192, 1, 1024]
          - Exact: [4, 8192, 1, 4096]
          - Exact: [4, 13312, 1, 8192]
          - Exact: [1, 4096, 1, 4096]
          - Exact: [2, 1024, 1, 256]
          - Exact: [3, 257, 1, 520]
          - Exact: [3, 13312, 1, 8192]
          # Padded leading dimensions: [M, N, batch, K, ldd, ldc, lda, ldb].
          - Exact: [3, 4096, 1, 4096, 5, 6, 7, 4104]
          - Exact: [4, 2624, 1, 6144, 8, 8, 8, 6152]

LibraryLogic:
    ScheduleName: "aquavanjaram"
    DeviceNames: ["Device 0049", "Device 0050"]
    ArchitectureName: "gfx942"
    LibraryType: "GridBased"
