TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  ValidateMetadata: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: False
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0
      SwizzleTensorA: False
      SwizzleTensorB: False
      MXBlockA: 32
      MXBlockB: 32

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "_gemm_afp4wfp4_kernel_BLOCK_SIZE_M_256_BLOCK_SIZE_N_256_BLOCK_SIZE_K_64_GROUP_SIZE_M_8_num_warps_4_num_stages_2_waves_per_eu_0_matrix_instr_nonkdim_16_cache_modifier_NONE_NUM_KSPLIT_1"
            args: [ { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: address, semantic: AddressD },
                    { type: address, semantic: AddressMXScaleA },
                    { type: address, semantic: AddressMXScaleB },
                    { type: uint32,  semantic: SizeFree0 },
                    { type: uint32,  semantic: SizeFree1 },
                    { type: uint32,  semantic: SizeSumDiv2 },
                    { type: uint32,  semantic: StrideA0Bytes },
                    { type: uint32,  semantic: ConstantOne },
                    { type: uint32,  semantic: ConstantOne },
                    { type: uint32,  semantic: StrideB0Bytes },
                    { type: uint32,  semantic: StrideCK },
                    { type: uint32,  semantic: ConstantOne },
                    { type: uint32,  semantic: StrideD0 },
                    { type: uint32,  semantic: StrideScaleA0 },
                    { type: uint32,  semantic: ConstantOne },
                    { type: uint32,  semantic: StrideScaleB0 },
                    { type: uint32,  semantic: ConstantOne, padding: 16 } ]
            macrotile: [256, 256, 64]
            threads: [256, 1, 1]
            grid: [TilesXY, One, One]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 8, 8, 2, 2]
        - PreloadKernArgs: [False]
        - DepthU: [64]
        - AssertSummationElementMultiple: [32]
        - WorkGroupMappingXCC: [8]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 4096, 1, 8192]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 0049", "Device 0050"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
