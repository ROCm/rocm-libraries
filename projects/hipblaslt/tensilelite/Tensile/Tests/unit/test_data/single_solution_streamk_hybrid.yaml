# single_solution_streamk.yaml compiled as a Hybrid Stream-K candidate of the
# origami.gemm.persistent.v1 contract: WorkAssignment=Hybrid with
# WorkGroupMapping 0 and WorkGroupMappingXCC -1, so the runtime chooses the
# grid, reduction, hybrid mode, mapping and stagger at each launch.
# This is an explicit-YAML test recipe; it does not alter predictor defaults.
GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  PrintSolutionRejectionReason: true

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: true
      TransposeA: false
      TransposeB: false
      UseBeta: true
      Batched: true
      StridedBatched: true
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - 1LDSBuffer: [1]
        - DepthU: [64]
        - ExpandPointerSwap: [false]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - GlobalSplitU: [0]
        - MatrixInstruction: [[16, 16, 16, 1, 1, 4, 4, 2, 2]]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [true]
        - StoreRemapVectorWidth: [0]
        - StreamKAtomic: [0]
        - TileProcessingStrategy: [StreamK]
        - TransposeLDS: [0]
        - WorkAssignment: [Hybrid]
        - WorkGroupMapping: [0]
        - WorkGroupMappingXCC: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [256, 128, 1, 4096]
