# Minimal single-solution ZGEMM (DataType Z) pinned to gfx1250 so --build-only
# compiles the VALU v_fma_f64 complex path regardless of host GPU. gfx1250 has no
# f64 matrix instruction, so ZGEMM uses EnableMatrixInstruction=false (SIA0).
# Consumed by test_zgemm_gfx1250_codegen.py; under test_data/ so findConfigs() skips it.
GlobalParameters:
  ISA: [[12,5,0]]
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: z
      DestDataType: z
      ComputeDataType: z
      TransposeA: false
      TransposeB: false
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - ThreadTile: [[2,2]]
        - WorkGroup: [[8,4,1]]
        - DepthU: [16]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - GlobalSplitU: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - 1LDSBuffer: [0]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
