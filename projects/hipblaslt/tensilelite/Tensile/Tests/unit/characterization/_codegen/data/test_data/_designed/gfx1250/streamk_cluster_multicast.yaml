################################################################################
# Designed StreamK + DP cooperative multicast config for gfx1250 codegen
# characterization.
#
# Mirrors the sibling _designed/gfx1250/streamk_cluster_coop_load.yaml (MX-FP8 TN,
# StreamK=3, gfx1250 MX constraints: TDMInst=3, MXLoadInst=TDM,
# MXScaleFormat=InMemorySwizzle, WavefrontSize=32, ISA=(12,5,0),
# StreamKXCCMapping=0), but enables the DP cooperative B-multicast fast path.
# StreamKMulticast is a derived-only internal state (no YAML opt-in): StreamK=3 +
# ClusterDim != [1,1] without StreamKClusterReduction auto-enables it, so this
# config only needs to set:
#
#   - StreamKClusterReduction: [0]   -- mutually exclusive with multicast
#   - ClusterDim: [[4, 1]]           -- 1-D spatial cluster, C=4 (power of two)
#
# Under this config StreamK.py must emit the split A/B multicast masks (A per-WG
# self bit, B broadcast across the [C,1] cluster) on the DP TDM loads, gated by
# the runtime clusterMulticastValid predicate, plus the DP->SK boundary mask
# clear. See docs/design/cluster-load-component-and-streamk-multicast.md.
#
# ClusterDim is pinned to the single C=4 here because the coupled unit test
# Tensile/Tests/unit/test_streamk_multicast.py derives its states from THIS
# config (test_accepted_baseline asserts ClusterDim==[4,1]; test_broadcast_mask
# _value asserts the maskB=(1<<C)-1=0xf, C=4 encoding). The C-spread {2,4,8} is
# swept and validated in the client GEMM sibling sk_mxf8gemm_cluster_multicast.yaml on
# the FFM gfx1250 simulator instead.
#
# Coverage (mirrors the non-cluster MX-FP8 StreamK MT sweep in
# Tests/common/streamk/gfx1250/core/sk_mxf8gemm_tdm.yaml) across the multicast
# codegen surface -- MacroTile sizes x work-item (MIWaveGroup) sizes:
#   - MatrixInstruction: 4 variants ->
#       MT 32x32  (WaveTile 1x1, MIWaveGroup 2x2, 128 work-items)
#       MT 64x64  (WaveTile 2x2, MIWaveGroup 2x2, 128 work-items)
#       MT 128x128(WaveTile 4x4, MIWaveGroup 2x2, 128 work-items)
#       MT 32x16  (WaveTile 1x1, MIWaveGroup 2x1,  64 work-items) -- WI variety
#   - ClusterDim: C=4
# => 4 x 1 = 4 fork permutations.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  ########################################
  # MX-FP8 (F8 in, float32 out) TN, Batched -- StreamK DP cooperative multicast.
  ########################################
  -
    - # ProblemType: MX-F8 TN
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
          - [16, 16, 128, 1, 1, 1, 1, 2, 1]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        - StreamKClusterReduction: [0]
        - ClusterDim: [[4, 1]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 256]
