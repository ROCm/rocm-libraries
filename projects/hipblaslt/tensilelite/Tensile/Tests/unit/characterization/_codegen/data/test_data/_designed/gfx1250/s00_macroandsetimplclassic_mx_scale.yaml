################################################################################
# S00 macroAndSetImplClassic MX-scale VALU/G2L/pack RegSet macros in
# Tensile/KernelWriterAssembly.py (macroAndSet -> macroAndSetImplClassic,
# lines ~1098-1230).  Target lines hit before the guarded raise: 1146, 1150
# (MXSA not-lrvwTile pack arms) and 1186 (MXSB not-lrvwTile pack arm).
#
# REACHABILITY: macroAndSetImplClassic runs ONLY when UseSubtileImpl is False
# (KernelWriterAssembly.py:1624 `if not kernel["UseSubtileImpl"]:`). On gfx950,
# MX forces UseSubtileImpl=True (Solution.py reject), so the classic MX macro
# arms are UNREACHABLE there. gfx1250 does NOT force UseSubtileImpl for MX, so
# an F4 NN-layout kernel with UnrollMajorLDS{A,B}=0 routes MX through the classic
# macroAndSet path and reaches this cluster. The M-major MX-scale local read is
# unimplemented (localReadMX raises a guarded Exception, LocalRead.py:628) but
# only LATER in emit, after macroAndSet has already emitted the VGPR macros ->
# the cluster lines are recorded before the raise.
#
# lrvwTileMXS{A,B} = VectorWidth{A,B} when (not UnrollMajorLDSMXS* and not
# forceLrvwTile1*) (KernelWriter.py:7231-7243); F4 MacDataType <4 bytes so
# forceLrvwTile1 is False.  ForkParameters fork VectorWidthA/B in {1,2}:
#   VW=1 -> lrvwTileMXS{A,B}==1 -> NOT-lrvwTile pack arms: 1146/1150 (MXSA),
#           1186 (MXSB).
#   VW=2 -> lrvwTileMXS{A,B}>1  -> lrvwTile pack arms: 1129/1132, 1172.

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
          - [16, 16, 128, 1, 1, 2, 2, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1, 2]
        - VectorWidthB: [1, 2]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]
