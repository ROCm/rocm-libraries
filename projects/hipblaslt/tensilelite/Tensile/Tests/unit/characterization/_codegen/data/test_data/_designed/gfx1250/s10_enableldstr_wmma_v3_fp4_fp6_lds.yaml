################################################################################
# S10 enableLDSTr + HasWMMA_V3 fp4/fp6 LDS-transpose local reads (gfx1250).
#
# Target missing lines in Tensile/Components/LocalRead.py (LocalReadMFMA):
#   bpeDS == 0.5  (F4/fp4): 861,862,863,864,865,867,868,869,870,871,873,874,
#                           875,876,877,878,879,880,882,883,884,888,889,890
#   (probe-confirmed 24/40 of the enableLDSTr WMMA_V3 block)
#
# Gate (Solution.isLDSTrEnabled): unrollMajorLDS==False, LDSTrInst==True,
#   numBytes==0.5 -> HasLDSTrB64B4 ; numBytes==0.75 -> HasLDSTrB96B6 (gfx1250).
# Route through LocalReadMFMA: NN layout (TLU both True -> TransposeLDS auto 0 ->
#   UnrollMajorLDS{A,B}=0). MX plumbing (MXBlock) mirrors mx_f4_nn_umlds0.yaml.
#
# bpeDS = MacDataType.numBytes() = reg*4: F4 reg=0.125 -> 0.5 ; F6 reg=0.1875 -> 0.75.
# HalfPLR fork [0,3] exercises both the plain and getHalfPLRValuStr destVgpr arms.
#
# EMIT-EXC: this config hits the enableLDSTr WMMA_V3 lines above, then reaches
# localReadMX where the M-major MX-scale layout (UnrollMajorLDS==0, MXBlock>0)
# floors tilePerRead to 0 and raises the intended guard (LocalRead.py:628,
# commit 4ab8940). The pre-raise coverage is the point of this fixture.

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # F4 NN — bpeDS=0.5 -> LocalRead.py lines 867..890
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 2, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - HalfPLR: [0, 3]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]

  ########################################
  # F6 NN — bpeDS=0.75 -> LocalRead.py lines 892..915
  ########################################
