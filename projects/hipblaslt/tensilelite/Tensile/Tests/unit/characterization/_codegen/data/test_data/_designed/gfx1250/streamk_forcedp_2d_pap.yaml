################################################################################
# PrefetchAcrossPersistent=1 variant of streamk_forcedp_2d.yaml.
#
# ForceDPOnly 2-D DUAL-operand multicast cluster ClusterDim = [Cs, Ck] = [2, 2]
# (Cs = X-peers reuse B on M-adjacent tiles; Ck = Y-peers reuse A on N-adjacent
# tiles -- a genuine A-multicast, NOT a K-split reduction), now with PAP on.
#
# Because A IS a real multicast here (aPeers = Ck > 1), the guard refinement
# does NOT free maskA: BOTH multicast masks stay live across the PAP refresh.
# This dual-2D + PAP + FDPO=1 config already fit the SGPR budget before the
# refinement, so it must remain a real kernel (err==0) with both masks -- the
# counterpart to the factored (FDPO=0, maskA freed) config. It also guards
# against the refinement accidentally dropping a real A-multicast.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - PrefetchAcrossPersistent: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        # ForceDPOnly 2-D dual multicast: Cs=2 (B, M-adjacent) x Ck=2 (A,
        # N-adjacent). Both operands multicast -> both masks stay live under PAP.
        - ClusterDim: [[2, 2]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
