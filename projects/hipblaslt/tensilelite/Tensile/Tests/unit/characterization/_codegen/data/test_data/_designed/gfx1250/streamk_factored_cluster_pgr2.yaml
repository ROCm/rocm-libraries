################################################################################
# PrefetchGlobalRead=2 variant of streamk_factored_cluster.yaml. Companion to
# streamk_factored_cluster.yaml (PGR=1); mirrors the multicast PGR2 pairing
# (streamk_cluster_multicast.yaml -> streamk_cluster_multicast_pgr2.yaml). Same
# genuine 2-D factored cluster ClusterDim=[Cs,Ck]=[2,2] (C=4, Cs=2, Ck=2) but at
# PrefetchGlobalRead=2 with K>DepthU (512>256), so the prologue emits the second,
# double-buffered cooperative multicast prefetch load ("skipPGR2" region) on top
# of BOTH factored axes (Cs B-multicast + Ck K-split reduction) in one kernel.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
          - [16, 16, 128, 1, 1, 1, 1, 2, 1]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        # Factored cluster is the genuine 2-D shape ClusterDim = [Cs, Ck] with
        # both axes > 1 (Cs = B-multicast peers, Ck = K-split reduction peers,
        # C = Cs*Ck). Here [2,2] means C=4, Ck=2, Cs=2; the factoring is derived
        # from the shape, not a user param.
        - ClusterDim: [[2, 2]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 512]
