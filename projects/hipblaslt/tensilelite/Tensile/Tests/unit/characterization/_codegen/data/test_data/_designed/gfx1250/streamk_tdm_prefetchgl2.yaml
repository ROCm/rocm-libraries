################################################################################
# Designed StreamK + TDM + PrefetchAcrossPersistent + PrefetchGL2 config for
# gfx1250 SGPR-budget regression coverage.
#
# Cut down from Tensile/Tests/common/streamk/gfx1250/core/sk_mxf8gemm_pap_prefetchgl2.yaml
# to the 2x2 PrefetchGL2 x StreamKForceDPOnly sweep (one MatrixInstruction, one
# PrefetchGlobalRead, one ScheduleIterAlg), which is the axis that moves SGPR
# pressure. PrefetchGL2=1 + StreamKForceDPOnly=0 is the tightest corner of the
# gfx1250 MX StreamK+PAP+TDM family and sits within a couple of registers of the
# 106-SGPR cap, so it is the config that catches a regression in the TDM stagger
# wave-parity SGPR accounting.
#
# No other config under _designed/ sets PrefetchGL2, and PrefetchGL2 pins four
# extra persistent SGPRs (GL2PrefetchIncA/B/MXSA/MXSB), so this file is the only
# codegen coverage of that pressure.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  ########################################
  # MX-FP8 (F8 in, float32 out) TN, Batched, StreamK=3 + TDM + PAP + PrefetchGL2
  ########################################
  -
    - # ProblemType: MX-F8 TN
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - TDMInst: [3]
        - PrefetchAcrossPersistent: [1]
        - PrefetchGlobalRead: [1]
        - PrefetchGL2: [0, 1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - DirectToVgprSparseMetadata: [False]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0, 1]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 2048, 1, 2048]
