################################################################################
# S07 gfx1250 MX-F4 block-scale (MXBlockA & MXBlockB), NON-subtile, targeting
# the MX VGPR/SGPR allocation cluster in Tensile/KernelWriter.py
# vgprAllocationImplClassic() plus the surrounding MX macro/alloc arms.
#
# Target KernelWriter.py lines (probe hit 10/10): 7291, 7297, 8465, 8466,
# 8472, 8504, 8505, 8511, 9898, 9935.
#
# KEY REACHABILITY: the MX VGPR cluster lives in vgprAllocationImplClassic,
# the NON-subtile allocator called only when UseSubtileImpl is False. On
# gfx950, MX forces UseSubtileImpl (Solution.py reject), so the classic MX
# arms are UNREACHABLE there. gfx1250 does NOT force UseSubtileImpl for MX, so
# leaving it unset routes MX through the classic allocator and reaches the
# cluster.
#
# NN layout (TransposeA=False, TransposeB=True) -> TLU both True ->
# TransposeLDS auto 0 -> UnrollMajorLDS{A,B}=0 -> the `not UnrollMajorLDSMXS*`
# ValuPack arms fire. FP4 + UnrollMajorLDS==False requires LDSTrInst on
# gfx1250, so LDSTrInst=1. localReadMX is unimplemented for M-major MX-scale
# local read and raises a guarded Exception (LocalRead.py:628) during emit
# AFTER _initKernel VGPR allocation, so the cluster lines are already recorded.
#
# Derived from _designed/gfx1250/mx_f4_nn_umlds0.yaml (the closest valid base).

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
          - [16, 16, 128, 1, 1, 2, 2, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]
