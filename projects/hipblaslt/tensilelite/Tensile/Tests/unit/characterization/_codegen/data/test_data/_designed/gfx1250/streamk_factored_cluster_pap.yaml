################################################################################
# PrefetchAcrossPersistent=1 variant of streamk_factored_cluster.yaml.
#
# Same genuine 2-D FACTORED cluster ClusterDim = [Cs, Ck] (Cs = B-multicast
# peers, Ck = K-split reduction peers, C = Cs*Ck), now with
# PrefetchAcrossPersistent (PAP) on. PAP re-emits the TDM descriptor setup on
# every persistent-loop iteration, so the multicast mask SGPRs must stay live
# past the prologue.
#
# This is the config that PREVIOUSLY OVERFLOWED the SGPR budget: on a factored
# 2-D cluster the A operand is still per-workgroup (Ck is a K-split REDUCTION
# axis, not an A-multicast axis), so maskA is self-only. Before the guard
# refinement the self-only maskA was conservatively kept live under PAP whenever
# ClusterDim[1] > 1, pushing FDPO=0 factored kernels to sgprs=107 -> the kernel
# was replaced by an ``s_endpgm`` stub (output tensor left unwritten). The
# refined ClusterLoad.papDropsSelfOnlyMaskA now frees the self-only maskA on the
# factored path too (aPeers==1), so this fits <=106 SGPRs and emits a REAL
# kernel (err==0). See test_streamk_factored_cluster_pap_gfx1250_char.py.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
          - [16, 16, 128, 1, 1, 1, 1, 2, 1]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - PrefetchAcrossPersistent: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        # Factored cluster (both axes > 1). Cs = B-multicast, Ck = K-split
        # reduction; A stays per-workgroup (self-only maskA). Exercise the three
        # factored shapes the guard refinement must free maskA for.
        - ClusterDim: [[2, 2], [2, 4], [4, 2]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]
