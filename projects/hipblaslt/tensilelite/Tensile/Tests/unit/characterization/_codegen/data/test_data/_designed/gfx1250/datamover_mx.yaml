# Designed gfx1250 config for the single-wave MX scale TDM descriptor.
#
# The sibling datamover.yaml drives the non-wave-separated TDM path but carries
# no MX scales (DataType=F4 alone leaves MXBlockA/MXBlockB at 0), so the MXS
# arms of KernelWriterAssembly.initTDMDescriptor and the MXS descriptor build in
# KernelWriter.setupNewTile stay unexecuted there. This config adds the scales:
#
#   - MX-F6 TN data (MXBlockA=MXBlockB=32, E8 scales) with TDMInst=3, so
#     tensorParameters{A,B}["MX"] exist and each needs its own descriptor.
#   - MatrixInstruction [16,16,128,1,1,1,1,1,1] -> MIWaveGroup=[1,1], NumWaves=1,
#     the branch that builds descriptors through initTDMDescriptor instead of
#     initTDMDescriptorWaveSeparated.
#   - DepthU=128 == MatrixInstK, i.e. one scale K group per fetch. Solution.py
#     rejects single-wave MX TDM above that (the scales reaching LDS would not
#     be the ones the MFMA reads), so this is the whole accepted range.
#
# The kernel declares 117 SGPRs against a 106 max, which is why this shape was
# only ever dropped rather than emitted: it exists solely under forced scalar
# allocation (StinkyTofuRegisterAllocation=3), and the test drives that mode.
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  ########################################
  # MX-F6 TN GEMM, Block32, E8 scales, TDMInst=3, single wave
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F6
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  1, 1,  1, 1]
        - DepthU: [128]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [4]
        - InitCIterWmma: [-1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - TransposeLDS: [1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - TDMInst: [3]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
