################################################################################
# S06 designed-candidate for gfx942 KernelWriter.py AdaptiveGemmNTAB dispatch.
#
# Target: Tensile/KernelWriter.py kernelBody AdaptiveGemmNTAB!=0 branch
#   (miss lines 5894,5911,5930,5943,5951,5957,5960 among others).
#
# The default AdaptiveGemmNTAB==0 path calls _kernelBody(pack,packPre,0,0)
# once. Setting AdaptiveGemmNTAB=1 takes the else branch which builds the
# 3-way NT combo dispatch [[0,0],[0,4],[4,0]] (5894), emits the bit-extract
# SAndB32 (5911), snapshots states/pack/tPA/tPB (5930), restores per-combo
# (5943), and loops emitting each _kernelBody (5951,5960).
#
# Base: gfx942 solution.yaml BBS TN bf16 MFMA (most stable CPU emit). Fork
# reduced to a single permutation + AdaptiveGemmNTAB:[1].
GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 1, 1, 4, 1]
        - DepthU: [32]
        - GlobalSplitU: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - LocalReadVectorWidth: [8]
        - ScheduleIterAlg: [3]
        - ExpandPointerSwap: [False]
        - TransposeLDS: [1]
        - SourceSwap: [True]
        - AdaptiveGemmNTAB: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
