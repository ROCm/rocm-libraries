#
# S09 assignDerivedParameters MX-scale (MXBlock) NON-SUBTILE GRVW/GLT derivation
# in Tensile/SolutionStructs/Solution.py.
#
# gfx950 REJECTS MX without UseSubtileImpl ("gfx950 MX requires UseSubtileImpl"),
# so the non-subtile MXS branches gated on `MXBlockX and not UseSubtileImpl` are
# UNREACHABLE on gfx950. They ARE reachable on gfx1250: it keeps UseSubtileImpl
# as user-set and there is no MX-subtile reject.
#
# Base = gfx1250/mx_f4_nn_umlds0.yaml (known-valid MX-F4 NN solution that does
# not force UseSubtileImpl). NN layout -> TLUMXSA/TLUMXSB both True -> exercises
# the TLU arms plus the setGlobalLoadTileDimClassic MXSA/MXSB calls.
#
# Target lines (Solution.py): 2375, 3234, 3402, 3829, 3836, 3941, 3975, 3976,
# 3977, 4007, 4051, 4052, 4053, 4994, 5003, 5004.

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
          - [16, 16, 128, 1, 1, 2, 2, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
        - UseSubtileImpl: [False]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]
