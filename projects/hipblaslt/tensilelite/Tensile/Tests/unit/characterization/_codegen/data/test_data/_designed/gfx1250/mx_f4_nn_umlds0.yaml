# gfx1250 MX-F4 NN-layout config that derives to a VALID solution with
# UnrollMajorLDS{A,B}==0 and MXBlock{A,B}>0 (M-major LDS with per-32-K-block MX
# scales). Unlike gfx950, gfx1250 does NOT force UseSubtileImpl for MX, so the
# "No TLU=1 subtile geometry" reject (Solution.py) does not apply; NN layout ->
# TLU both True -> TransposeLDS auto 0 -> UnrollMajorLDS{A,B}=0.
#
# This layout reaches the MX-scale VGPR-macro cold branch in
# KernelWriterAssembly.py (the `if not kernel["UnrollMajorLDS*"]:` block) and
# then LocalRead.localReadMX, where the M-major MX-scale local read is
# unimplemented: one 0.25-register read covers fewer bytes than a single scale
# unit (mxUnit) so tilePerRead floors to 0. localReadMX guards this with a
# descriptive Exception; see test_mx_umlds0_char.py.
#
# FP4 on gfx1250 with UnrollMajorLDS==False requires LDSTrInst (Solution.py),
# so LDSTrInst=1 is set.

GlobalParameters:
  SyncsPerBenchmark: 0
  SleepPercent: 0
  NumElementsToValidate: 0
  NumWarmups: 0
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  Device: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      UseBias: 0
      Batched: True
      Activation: False
      SupportUserArgs: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
          - [16, 16, 128, 1, 1, 2, 2, 1, 1]
        - TDMInst: [3]
        - DepthU: [128]
        - LocalReadVectorWidth: [-1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [True]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 128]
