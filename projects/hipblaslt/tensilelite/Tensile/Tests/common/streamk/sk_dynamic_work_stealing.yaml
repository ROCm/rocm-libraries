TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # Repeated back-to-back enqueues per sync reuse the SAME (host-zeroed-once)
  # Synchronizer workspace without re-zeroing between launches. This is exactly
  # what the per-queue static auto-reset must guarantee: every counter wraps
  # back to 0 on its own so the next launch starts clean (there is no explicit
  # end-of-kernel reset anymore).
  NumWarmups: 2
  EnqueuesPerSync: 4
  # SleepPercent injects a variable per-WG delay so tiles drain unevenly across
  # queues, forcing the single-hop next-neighbor steal + sticky-home path to fire under
  # contention rather than in lockstep.
  SleepPercent: 50

# Shared SK4-dynamic fork entries (single-value) plus common benchmark params.
# StreamKWorkStealing is forked over [0, 1] so reference-vs-kernel validation
# runs for BOTH the stealing-off (must match baseline asm) and stealing-on
# paths in a single invocation.
.SkDynamicCommonFork: &sk_dynamic_common_fork
  - KernelLanguage: ["Assembly"]
  - PrefetchLocalRead: [1]
  - 1LDSBuffer: [1]
  - ExpandPointerSwap: [False]
  - GlobalSplitU: [0]
  - MIArchVgpr: [False]
  - PrefetchGlobalRead: [2]
  - ScheduleIterAlg: [3]
  - SourceSwap: [True]
  - StoreRemapVectorWidth: [0]
  - StreamK: [4]
  - StreamKWorkStealing: [0, 1]
  - TransposeLDS: [0]
  - WorkGroupMapping: [1]

.SkDynamicBpsg: &sk_dynamic_bpsg
  InitialSolutionParameters:
  BenchmarkCommonParameters: *sk_dynamic_common_fork
  BenchmarkForkParameters:
  JoinParameters:
  BenchmarkJoinParameters:
  BenchmarkFinalParameters:
    # Multiple sizes + repeated back-to-back launches exercise the per-queue
    # static auto-reset across launches that reuse the same (host-zeroed-once)
    # Synchronizer -- there is no longer an explicit kernelEnd reset.
    #   512x512  -> 16 (MT128) / 64 (MT64) tiles  : aligned (remainder 0);
    #               with the next-neighbor steal this still exercises the neighbor steal
    #               + auto-reset (the old remainder==0 skip is gone).
    #   640x640  -> 25 (MT128) / 100 (MT64) tiles : unaligned (steal fires)
    #   896x896  -> 49 (MT128) / 196 (MT64) tiles : unaligned, larger grid ->
    #               contention size (uneven drain crossed with SleepPercent)
    #   384x384x3-> 27 (MT128) / 108 (MT64) tiles : unaligned + batched (steal fires)
    - ProblemSizes:
      - Exact: [512, 512, 1, 512]
      - Exact: [640, 640, 1, 512]
      - Exact: [896, 896, 1, 512]
      - Exact: [384, 384, 3, 256]

BenchmarkProblems:

  - # SGEMM NT - StreamK=4 dynamic with single-hop work stealing
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SK4 dynamic - small MI matrix to keep kernel-object size bounded
      <<: *sk_dynamic_bpsg
      ForkParameters:
        - DepthU: [16]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidth: [1]
        - MatrixInstruction:
          - [32, 32, 2, 1, 1, 2,2, 2,2]
          - [16, 16, 4, 1, 1, 2,2, 2,2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]

  - # HGEMM NT - StreamK=4 dynamic with single-hop work stealing
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - # SK4 dynamic - small MI matrix
      <<: *sk_dynamic_bpsg
      ForkParameters:
        - DepthU: [64]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - MatrixInstruction:
          - [32, 32, 8, 1, 1, 2,2, 2,2]
          - [16, 16, 16, 1, 1, 2,2, 2,2]
        - PrefetchLocalRead: [1]
