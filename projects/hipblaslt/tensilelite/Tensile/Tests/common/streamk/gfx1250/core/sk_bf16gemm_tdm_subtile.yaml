TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # gfx1250 only

GlobalParameters:
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  SyncsPerBenchmark: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  #######################################
  # TN - bf16 in/out, fp32 compute (BBS)
  #######################################
  -
    - # ProblemType, TN (Cijk_Alik_Bljk)
      OperationType: GEMM
      DataType: B
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 3, 3,  2, 2]  # MT 96x96
          - [16, 16, 32, 1,  1, 2, 2,  4, 1]  # MT 128x32
          - [16, 16, 32, 1,  1, 2, 4,  2, 2]  # MT 64x128
          - [16, 16, 32, 1,  1, 8, 1,  2, 1]  # MT 256x16
        - DepthU: [128]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - PrefetchAcrossPersistent: [0]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - UseSubtileImpl: [True]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4, 4, 1, 7168]
          - Exact: [24, 24, 1, 28672]
          - Exact: [1536, 1536, 1, 65536]
          - Exact: [96, 96, 1, 7168]
          - Exact: [192, 192, 1, 7168]
          - Exact: [384, 384, 1, 7168]
          - Exact: [512, 512, 1, 7168]
          - Exact: [1024, 1024, 1, 7168]
        - ActivationArgs:
          - [Enum: none]
