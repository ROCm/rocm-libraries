TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, ffm_fail] # gfx1250 only

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50
  # StreamK=5 hybrid sub-paths, each problem replayed once per value:
  #   0 -> static work assignment
  #   1 -> dynamic work-queue path (exercises the global_atomic_inc_u32 queue fetch)
  StreamKHybridMode: [0, 1]

BenchmarkProblems:

  - # SGEMM NT - StreamK=5 hybrid
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SK5 hybrid - MatrixInstruction variants
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - StreamK: [5]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 64 ]
        - 1LDSBuffer: [-1]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1,1, 1,2]
          - [16, 16, 4, 1, 1, 1,1, 2,1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WorkGroupMapping: [1]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [512, 512, 1, 512]
          - Exact: [512, 512, 1, 4096] # large K: exercises the hybrid dynamic work-queue
          - Exact: [512, 512, 2, 128]  # batched

  - # HGEMM NT - StreamK=5 hybrid
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SK5 hybrid - MatrixInstruction variants
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - StreamK: [5]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 32 ]
        - 1LDSBuffer: [-1]
        - ExpandPointerSwap: [False]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1,1, 1, 2]
          - [16, 16, 32, 1, 1, 1,1, 2, 1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [512, 512, 1, 512]
          - Exact: [512, 512, 1, 4096] # large K: exercises the hybrid dynamic work-queue
          - Exact: [512, 512, 2, 128]  # batched

    - # HGEMM NT: TDMInst=3 shares LDS0 with the StreamK mailbox
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - StreamK: [5]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 32 ]
        - 1LDSBuffer: [0]
        - ExpandPointerSwap: [False]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1,1, 1, 2]
          - [16, 16, 32, 1, 1, 1,1, 2, 1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 4096] # large K: hybrid dynamic work-queue
          - Exact: [512, 512, 2, 128]  # batched
