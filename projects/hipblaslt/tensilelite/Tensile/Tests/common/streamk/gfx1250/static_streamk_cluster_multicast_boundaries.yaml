# Set TENSILE_PERSISTENT_FIXED_GRID=256 to split block K ranges between
# logical clusters, including the sixteen-peer shapes. TENSILE_DB=0x200000
# reports spatialBlocks, logicalClusters and wholeBlocksOnly for each launch.
# Ragged tiles, a K tail, batches, one iteration and K=0 exercise completion
# and multicast barrier paths. Re-run with DataInitTypeAlpha=0 for beta-only.
TestParameters:
  marks:
  - skip-gfx900
  - skip-gfx906
  - skip-gfx908
  - skip-gfx90a
  - skip-gfx940
  - skip-gfx941
  - skip-gfx942
  - skip-gfx950
  - skip-gfx1010
  - skip-gfx1011
  - skip-gfx1012
  - skip-gfx1030
  - skip-gfx1100
  - skip-gfx1101
  - skip-gfx1102
  - skip-gfx1200
  - skip-gfx1201
  - skip-gfx1250-strict
GlobalParameters:
  Architecture: gfx1250
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: false
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  ForceGenerateKernel: true
  CpuThreads: 8
  PrintLevel: 1
  NumWarmups: 1
  NumBenchmarks: 1
  EnqueuesPerSync: 1
  PrintSolutionRejectionReason: true
