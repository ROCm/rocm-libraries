################################################################################
# Factored 2-D StreamK cluster + PrefetchAcrossPersistent (FDPO=0), mxf8.
#
# PAP companion to sk_mxf8gemm_cluster_factored.yaml. This is the previously-
# OVERFLOWING path: on a factored cluster A is per-workgroup (Ck is a K-split
# REDUCTION axis, not an A-multicast axis) so maskA is self-only. Before the
# ClusterLoad.papDropsSelfOnlyMaskA refinement the self-only maskA was kept live
# under PAP whenever ClusterDim[1]>1, pushing FDPO=0 factored kernels to
# sgprs=107 -> s_endpgm stub. The refined guard frees the self-only maskA on the
# factored path (aPeers==1), so these fit <=106 SGPRs. Restricted to the smaller
# factored shapes [2,2],[2,4],[4,2] first.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]
GlobalParameters:
  SyncsPerBenchmark: 0
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  PrintSolutionRejectionReason: True
  ForceGenerateKernel: True

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    -
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
          - [16, 16, 128, 1, 1, 1, 1, 2, 1]
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - PrefetchAcrossPersistent: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        # Factored 2-D cluster: Cs>1 (B-multicast) AND Ck>1 (K-split reduction).
        # A is self-only -> maskA freed under PAP (guard refinement).
        - ClusterDim: [[2, 2], [2, 4], [4, 2]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        # Cluster-aligned zero-skip for every (ClusterDim, MacroTile) combo:
        # ClusterDimCheck ceil(M/MT0)%Cs==0 and ceil(N/MT1)%Ck==0;
        # ClusterReductionIterCheck ceil(K/DepthU)%Ck==0. M=N=1024 => ceil/MT in
        # {8,16,32,64} (divisible by Cs,Ck<=4); K in {2048,4096} => ceil(K/256)
        # in {8,16} (divisible by Ck<=4). DepthU=256.
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 2048]
          - Exact: [1024, 1024, 1, 4096]
        - ActivationArgs:
          - [Enum: none]
