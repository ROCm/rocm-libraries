#
# Regression test for a PAP LDS-bank-swap bug triggered by asymmetric
# MIWaveTile shapes (e.g. [7,4]/[4,7]); symmetric shapes are included as a
# passing control. Do not shrink ProblemSizes without re-validating -- the
# bug did not reproduce at smaller K during triage.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  PrintSolutionRejectionReason: True
  ForceGenerateKernel: True

BenchmarkProblems:
  #######################################
  # NN - TDM + PrefetchAcrossPersistent, asymmetric WaveTile
  #######################################
  -
    - # ProblemType, NN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True

    - # asymmetric WaveTile [7,4] (MT224x128x128) vs symmetric [4,4] control
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]
          - [16, 16, 32, 1, 1, 7, 4, 2, 2]
        - DepthU: [128]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - PrefetchAcrossPersistent: [1]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [false]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [false]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1536, 1536, 1, 65536]
        - ActivationArgs:
          - [Enum: none]

  #######################################
  # NT - TDM + PrefetchAcrossPersistent, asymmetric WaveTile
  #######################################
  -
    - # ProblemType, NT
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      SupportUserArgs: True

    - # asymmetric WaveTile [4,7] (MT128x224x128) vs symmetric [4,4] control
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]
          - [16, 16, 32, 1, 1, 4, 7, 2, 2]
        - DepthU: [128]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - PrefetchAcrossPersistent: [1]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 4]
        - SourceSwap: [false]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [false]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKForceDPOnly: [0]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1536, 1536, 1, 65536]
        - ActivationArgs:
          - [Enum: none]
