#
# Client-runnable StreamK workgroup-cluster-reduction test for gfx1250.
#
# MX-FP8 TN, StreamK=3 (TDMInst=3, MXLoadInst=TDM,
# MXScaleFormat=InMemorySwizzle, WavefrontSize=32, StreamKXCCMapping=0) with the
# barrier-only cluster reduction fast path:
#
#   - StreamKClusterReduction: [1]      -- intra-cluster split-barrier reduce
#   - ClusterDim: [[2,1],[4,1],[8,1]]   -- 1-D clusters, C in {2,4,8}
#
# Sizes force partial-tile reductions (K >> DepthU) and keep both nWG0 % C == 0
# (cluster selection) and itersPerTile % C == 0 (balanced split barrier). When
# itersPerTile % C != 0 the split barrier over-signals -> hang, so the
# ClusterReductionIterCheck predicate HARD-REJECTS such problems at selection
# time (itersPerTile depends on runtime K, so it cannot be a build-time reject).
# A K-tail (K % DepthU != 0) is safe as long as itersPerTile % C == 0.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  PrintSolutionRejectionReason: True
  ForceGenerateKernel: True

BenchmarkProblems:
  ########################################
  # MX-FP8 (F8 in, float32 out) TN, Batched -- StreamK cluster reduction.
  ########################################
  -
    - # ProblemType: MX-F8 TN
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      MXBlockA: 32
      MXBlockB: 32
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 2, 2]
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
          - [16, 16, 128, 1, 1, 1, 1, 2, 1]
        - DepthU: [256]
        - ClusterLocalRead: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - LdsBlockSizePerPadMXSA: [-1]
        - LdsBlockSizePerPadMXSB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [4]
        - SourceSwap: [False]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [0]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - ExpandPointerSwap: [False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - StoreVectorWidth: [-1]
        - StreamK: [3]
        - StreamKAtomic: [0]
        - StreamKXCCMapping: [0]
        - StreamKClusterReduction: [1]
        - ClusterDim: [[2, 1], [4, 1], [8, 1]]
        - StaggerU: [0]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - WorkGroupMapping: [1]
        - TDMInst: [3]
        - MXLoadInst: ["TDM"]
        - MXScaleFormat: ["InMemorySwizzle"]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 1024]   # MT32 nWG0=4  (C=2,4 admit; C=8 nWG0%8!=0); itersPerTile=4 -> C=2,4 partial-tile reduce
          - Exact: [512, 512, 1, 2048]   # MT32 nWG0=16 (C=2,4,8 admit); itersPerTile=8 -> C=2,4,8 partial-tile reduce (safe C=8)
          - Exact: [256, 256, 1, 1920]   # K-tail: itersPerTile=ceil(1920/256)=8 (8%2,4,8==0), K%256=128 tail -> tail loop inside cluster reduce (C=8 via MT32 nWG0=8)
          - Exact: [256, 256, 2, 1024]   # batched (batch=2); nWG0=8, itersPerTile=4 -> C=2,4 partial-tile reduce
        - ActivationArgs:
          - [Enum: none]
