TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # gfx1250 only

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50
  StreamKHybridMode: [0, 1]

BenchmarkProblems:

  - # SGEMM NT - StreamK=5 hybrid, ClusterDim=[2,1].
    # Same MatrixInstruction variants as sk_hybrid_quick.yaml's SGEMM group with
    # ClusterDim added: exercises the enableCluster guard in StreamKHybrid.preLoop.
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SK5 hybrid - MatrixInstruction variants, ClusterDim=[2,1]
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - StreamK: [5]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 64 ]
        - 1LDSBuffer: [-1]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1,1, 1,2]
          - [16, 16, 4, 1, 1, 1,1, 2,1]
        - MIArchVgpr: [False]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WorkGroupMapping: [1]
        - ClusterDim: [[2, 1]]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
          - Exact: [129, 129, 1, 129]
          - Exact: [512, 512, 1, 512]
          - Exact: [512, 512, 1, 4096] # large K: exercises the hybrid dynamic work-queue
          - Exact: [512, 512, 2, 128]  # batched
