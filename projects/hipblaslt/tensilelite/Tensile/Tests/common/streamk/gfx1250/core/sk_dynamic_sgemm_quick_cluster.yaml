TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # gfx1250 only

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 32
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  NumWarmups: 0
  EnqueuesPerSync: 1
  SleepPercent: 50

BenchmarkProblems:

  - # SGEMM NT - StreamK=4 (dynamic work-queue), 1-D ClusterDim range [2,1]/[4,1]/[8,1].
    # Same MatrixInstruction sweep as sk_dynamic_sgemm_quick.yaml's first group with a
    # 1-D ClusterDim range added: exercises the enableCluster guard in StreamKDynamic.preLoop.
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # SGEMM NT - dynamic Stream-K queue, MatrixInstruction variants, ClusterDim range
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - PrefetchLocalRead: [1]
      ForkParameters:
        - StreamK: [4]
        - GlobalSplitU: [0]
        - WavefrontSize: [32]
        - DepthU: [ 64 ]
        - 1LDSBuffer: [-1]
        - ExpandPointerSwap: [False]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1,1, 1,2]
          - [16, 16, 4, 1, 1, 1,1, 2,1]
          - [16, 16, 4, 1, 1, 4,4, 1,2]
        - MIArchVgpr: [false]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0]
        - SourceSwap: [True]
        - StoreRemapVectorWidth: [0]
        - TransposeLDS: [0]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - WorkGroupMapping: [1]
        - ClusterDim: [[2, 1], [4, 1], [8, 1]]

      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [512, 512, 1, 4096] # large K: many queue work-items, stresses the atomic counter
          - Exact: [512, 512, 2, 128]  # batched
