TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: True
  SyncsPerBenchmark: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 2
  # PrintSolutionRejectionReason: True
  ForceGenerateKernel: True
  MaxWorkspaceSize: 134217728
  MXScaleFormat: 1

BenchmarkProblems:
  #######################################
  # Test Basic Activation Types with StreamK + MXFP4
  # One problem size per activation to verify each type works
  # With StreamK mode 3 (DP-before-SK)
  # TN transpose only
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32

    - # Test each activation type once with single representative config
      # Verifies activation works with StreamK MXFP4 codegen
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 4, 2, 2]
        - DepthU: [256]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [false]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - WavefrontSize: [64]
        - WorkGroupMapping: [1]
        - UseSubtileImpl: [true]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
          - [Enum: gelu]
          - [Enum: sigmoid]
          - [Enum: silu]
          - [Enum: clamp]
