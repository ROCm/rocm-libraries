TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  # Modes 1-3 omit reduction steps and provide launch-only coverage.
  NumElementsToValidate: 0
  SyncsPerBenchmark: 1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # DebugStreamK launch coverage without subtile
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4, 4, 2, 2]
        - DepthU: [16]
        - WavefrontSize: [64]
        - GlobalReadVectorWidthA: [4]
        - GlobalReadVectorWidthB: [4]
        - VectorWidthA: [4]
        - VectorWidthB: [4]
        - StoreVectorWidth: [4]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - StreamK: [3]
        - DebugStreamK: [0, 1, 2, 3]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
        - UseSubtileImpl: [false]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 512]
