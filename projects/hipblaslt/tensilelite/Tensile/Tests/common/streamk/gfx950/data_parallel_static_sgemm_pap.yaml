TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  Architecture: gfx950
  ISA: [[9, 5, 0]]
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  NumWarmups: 0
  EnqueuesPerSync: 1
  KernelTime: False
  CpuThreads: 8
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - TileProcessingStrategy: [DataParallel]
        - WorkAssignment: [StaticGrid]
        - MatrixInstruction: [[16, 16, 4, 1, 1, 4, 4, 2, 2]]
        - DepthU: [16]
        - GlobalSplitU: [0]
        - 1LDSBuffer: [0]
        - DirectToLds: [0]
        - ExpandPointerSwap: [False]
        - PrefetchAcrossPersistent: [0, 1]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - SourceSwap: [True]
        - MIArchVgpr: [False]
        - TransposeLDS: [0]
        - GlobalReadVectorWidthA: [4]
        - GlobalReadVectorWidthB: [4]
        - VectorWidthA: [4]
        - VectorWidthB: [4]
        - StoreVectorWidth: [4]
        - StoreRemapVectorWidth: [0]
        - WorkGroupMapping: [1]
        - StaggerU: [0]
        - UseSgprForGRO: [0]
        - Use64bShadowLimit: [False]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # With TENSILE_PERSISTENT_FIXED_GRID=7 these cover fewer/equal/more
          # tiles than workgroups, a nonmultiple, batches, tails, and zero K.
          - Exact: [128, 128, 1, 16]
          - Exact: [128, 896, 1, 32]
          - Exact: [128, 1024, 1, 64]
          - Exact: [384, 512, 3, 129]
          - Exact: [257, 385, 2, 129]
          - Exact: [129, 257, 2, 0]
          - Exact: [4096, 2048, 1, 512]
