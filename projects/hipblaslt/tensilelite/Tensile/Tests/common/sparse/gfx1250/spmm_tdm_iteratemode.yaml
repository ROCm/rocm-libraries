      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1,  1,  1, 1,  1, 1]
          - [16, 16, 64, 1,  1,  1, 1,  2, 2]
        - DepthU: [64, 128]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMIterateMode: [-1, 0, 1]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [8]
        - 1LDSBuffer: [0]
        - SourceSwap: [true]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - GroupLoadStore: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 512]
          - Exact: [64, 64, 1, 124] # K tail vs DepthU=64/128, K must be mult-of-4 for sparse prune
          - Exact: [127, 127, 1, 128]
          - Exact: [64, 64, 1, 456] # odd DU + tail (mult-of-4 for sparse prune)
        - ActivationArgs:
          - [Enum: none]
