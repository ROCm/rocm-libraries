########################################################
# datatype = bf16, TT + TransposeLDS (tr-load-b), sparse A (Sparse=1)
# Adapted from tdm_gfx1250.yaml TT+TLDS1 block (lines 267-345). TT layout
# makes the *dense* tensor B need tr-load (not the sparse/compressed A), so
# this exercises tr-load on the dense side of a sparse kernel. Exercises the
# pair-based brute-force (LdsBlockSizePerPad, LdsPad) search combined with
# TDMIterateMode sweep [-1,0,2]. MI K doubled 32->64 for sparse MFMA shape.
########################################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      Sparse: 1

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1,  1,  1, 1,  1, 1]
          - [16, 16, 64, 1,  1,  1, 1,  2, 2]
        - DepthU: [64, 128]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsBlockSizePerPadMetadata: [-1]
        - LDSTrInst: [True]
        - TDMInst: [3]
        - TDMIterateMode: [-1, 0, 2]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - LocalReadVectorWidth: [8]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - GroupLoadStore: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 512]
          - Exact: [64, 64, 1, 124] # K tail vs DepthU=64/128, K must be mult-of-4 for sparse prune
          - Exact: [127, 127, 1, 128]
          - Exact: [64, 64, 1, 456] # odd DU + tail (mult-of-4 for sparse prune)
        - ActivationArgs:
          - [Enum: none]

########################################################
# datatype = bf16, NN + TransposeLDS (tr-load-a), sparse B (Sparse=2)
# NN layout makes the *dense* tensor A need tr-load (not the sparse/
# compressed B), so this exercises tr-load on the dense side of a sparse
# kernel, mirroring the Sparse=1 block above (which uses TT/tr-load-b so the
# dense tensor there is B instead). TDMIterateMode explicit mask sweeps bit 1
# (A) here, since A is the tensor needing the iterate-mode walk; the
# Sparse=1/TT block sweeps bit 2 (B) for the same reason.
########################################################
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      Sparse: 2

