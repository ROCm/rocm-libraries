TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  PrintWinnersOnly: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  Architecture: gfx1250

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      UseGateResidual: True
      GateResidualDataTypeList: ['s', 'f8']
      Batched: True
      Activation: True
      ActivationType: all
      UseBias: 3
      UseScaleAlphaVec: 3
      Sparse: 1
      MetadataLayout: 0

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [128]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [0]
        - SourceSwap: [false]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - CompactLoopStore: [False, True]
        - NonTemporalGate: [0, 1]
        - TemporalHintGate: [0, 1]
        - NonVolatileGate: [0, 1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [264, 264, 1, 392]
          - Exact: [1024, 1024, 1, 1024]
        - BiasTypeArgs: ['s']
        - GateTypeArgs: ['s', 'f8']
        - FactorDimArgs: [0]
        - ActivationArgs:
          - [Enum: none]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      UseGateResidual: True
      GateResidualDataTypeList: ['h']
      Batched: True
      Activation: True
      ActivationType: all
      UseBias: 3
      UseScaleAlphaVec: 3
      Sparse: 1

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 2, 2, 1, 1]
        - WavefrontSize: [32]
        - DepthU: [128]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [-1]
        - SourceSwap: [false]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - 1LDSBuffer: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - CompactLoopStore: [False, True]
        - NonTemporalGate: [0, 1]
        - TemporalHintGate: [0, 1]
        - NonVolatileGate: [0, 1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [264, 264, 1, 392]
          - Exact: [1024, 1024, 1, 1024]
        - BiasTypeArgs: ['s']
        - GateTypeArgs: ['h']
        - FactorDimArgs: [0]
        - ActivationArgs:
          - [Enum: none]
