      TransposeB: False
      UseBeta: True
      Batched: True
      UseBias: 1
      OutputAmaxD: True
      DataTypeAmaxD: s
      UseScaleAB: "Scalar"
      UseScaleCD: True
      UseScaleAlphaVec: 1
      Activation: True # must be true if there is any of bias scale
      ActivationType: all
