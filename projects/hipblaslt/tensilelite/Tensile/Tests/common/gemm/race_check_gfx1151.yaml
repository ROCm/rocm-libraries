# Verify that the race emulator runs on generated kernel assembly and finds no
# races. This is a positive test: the generated assembly should be race-free.
# CheckForRaces: 1 enables the race-emulator pass inside tensilelite-client.
# Requires building with -DHIPBLASLT_ENABLE_RACE_EMULATOR=ON.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumElementsToValidate: -1
  CheckForRaces: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - WavefrontSize: [32]
        - MatrixInstruction:
            - [16, 16, 16, 1, 1, 1, 1, 1, 1]
        - WorkGroup:
          - [32, 1, 1]
        - DepthU: [16]
        - PrefetchLocalRead: [0]
        - PrefetchGlobalRead: [False]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - InnerUnroll: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 16]
