TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  NumWarmups: 1
  MaxEnqueuesPerSync: 1
  SleepPercent: 0
  PrintSolutionRejectionReason: True
  DataInitTypeA: 23
  DataInitTypeB: 24
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  Device: 0
  MaxWorkspaceSize: 134217728
  KernelTime: True
  RotatingBufferSize: 512

BenchmarkProblems:
  ########################################
  # NN - InitCIterWmma with gfx11 WMMA V1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 2, 2, 2, 2]
        - WavefrontSize: [32]
        - DepthU: [32]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - TransposeLDS: [0]
        - WorkGroupMapping: [1]
        - LocalReadVectorWidthA: [16]
        - LocalReadVectorWidthB: [16]
        - 1LDSBuffer: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - ScheduleIterAlg: [1]
        - InitCIterWmma: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
