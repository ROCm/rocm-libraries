# Verify that the emulator produces numerically correct output by comparing
# against the CPU reference. No GPU required — runs entirely on the host.
# ValidateWithEmulator: 1 triggers the emulator validation path.
# Requires building with -DHIPBLASLT_ENABLE_RACE_EMULATOR=ON.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumElementsToValidate: -1
  ValidateWithEmulator: 1
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Device: 0
  ISA:
    - [11, 5, 1]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - WavefrontSize: [32]
        - ThreadTile:
          - [2, 2]
        - WorkGroup:
          - [8, 8, 1]
        - DepthU: [8]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [1]
        - WorkGroupMapping: [1]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 16]
