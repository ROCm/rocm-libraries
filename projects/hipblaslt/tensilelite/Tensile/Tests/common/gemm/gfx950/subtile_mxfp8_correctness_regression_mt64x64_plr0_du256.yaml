########################################
# MXFP8 correctness regression — MT64x64x256 / PLR0 / WGM1 / DU=256 / DUMX=0
#                                (R=1 minority bug path; no swizzled scale)
#
# Coverage gap from /home/bnemanic/MXFP8_BUG_HANDOFF_kernels.csv (row 3).
#
# This YAML covers the *R=1* minority regime that the dominant R=2 yamls
# do not. The R=1 path has DepthU=256 and DepthUMX=0 (no MX-scale
# unroll-doubling); failures here therefore prove the bug is **not**
# exclusively a `DepthUMX > 0` problem.
#
# Cluster regime: PLR0 / WGM1 / DUMX=0 / DU=256.
# Dominant uncovered tile in this regime:
#
#     MT64x64x256 / MIWT=[2,2] / MIWG=[2,2] / PGR2 / PLR0 / WGM1
#                  → 7/26 bench fail   (26.9%)
#                  → max norm_error = 0.228
#
# Expected behaviour:
#   - Before the bug is fixed: verify FAILS on the failing sizes.
#   - After the bug is fixed: every size PASSes verify; if the R=2 fix does
#     not also clear R=1, that establishes the bug has at least two
#     distinct codegen surfaces and the next bug-hunt must continue.
#
# Pinned ForkParameter values:
#   MatrixInstruction:    [16, 16, 128, 1, 1, 2, 2, 2, 2]
#                                  → MT64x64, MIWT=[2,2], MIWG=[2,2]
#   PrefetchGlobalRead:   [2]      → PGR2
#   PrefetchLocalRead:    [0]      → PLR0
#   DepthU:               [256]
#   DepthUMX:             [0]      → DUMX0 (R = DepthUMX/DepthU not applicable; R=1)
#   ScheduleIterAlg:      [3]      → SIA3
#   DirectToLds:          [1]
#   StreamK:              [3]
#   StaggerU:             [0]
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]      → WGM1
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

