#
# MX-scaled F4 subtile coverage that does not work yet on a free-dim contiguous
# operand.  "disabled" in the filename makes config_helpers.py mark the whole file
# pytest.mark.skip, so nothing here runs; it is kept as an executable record of the
# gap and as the reproducer to re-run once the fix lands.
#
# Do not fold these back into subtile_mxfp4_tlu1.yaml until they pass.
#
# Root cause (diagnosed on gfx950, MI355X):
#   The MX scale swizzle builds its grid as if the scale tensor were always
#   [K blocks, MN].  That is true for a K-contiguous operand and is the transpose
#   of the truth for a free-dim contiguous one, so generateData hands
#   preSwizzleScalesGFX950 the two dimensions the wrong way round.  The swapped
#   grid has the same element count, so the size check inside the swizzle cannot
#   see it, but the padded extent differs -- roundUp(384,32)*roundUp(32,8) against
#   roundUp(1024,32)*roundUp(12,8) -- and the copy back into the caller's buffer
#   runs to the padded length, 4KB past the end.  glibc reports it at some later
#   unrelated free, so it surfaces as munmap_chunk() / corrupted double-linked list
#   well away from the cause.  The same transposed grid misplaces scales without
#   overflowing on a K tail, which is where the NaNs come from.
#
# Evidence that it is the layout and not these shapes:
#   - the identical tiles and sizes pass with the scales off (--mx-scale-format 0)
#   - the identical tiles and sizes pass on TN, which is K-contiguous
#   - subtile_mxfp8_tail_loop sweeps K=32..512 step 32 under MX on TN and passes
#
# The fix is to derive the block count from whichever axis actually carries K, and
# to take MN off the emitted buffer rather than the data extent, since the
# generator rounds MN up to a multiple of 32.  With that in place all three blocks
# below pass; delete this file and move them back into subtile_mxfp4_tlu1.yaml.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # NT, macro tile 96 at 4 waves, DepthU 512: the fetch group is spread over
      # both the K slices of a window AND several K windows, so a wave issues
      # more than one window at a per-wave window offset.
      #
      # Aborts on (384,768,1,1024): 32 K blocks is a whole multiple of 32, which is
      # what turns the swizzle on, and the transposed grid then overruns the
      # staging buffer.  The 512 size below is fine on its own -- 16 K blocks
      # leaves the swizzle off -- and is kept so the pair brackets the threshold.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]
          - Exact: [384, 768, 1, 1024]

  -
    - # The free-dim tail of the buffer window.  The last workgroup owns fewer
      # than a macro tile when the size leaves a remainder, so the window runs
      # past the tensor.  Faulting needs the operand to end on a page too:
      # 2048 over a tile of 96 leaves 32 rows and an A of exactly 2MB.
      # Keep the sizes -- the shapes make this reachable, not the tiles.
      #
      # Aborts at K=2048, i.e. 64 K blocks, for the same reason as above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 2048, 1, 2048]   # M tail vs tile 96, operand ends on a page
          - Exact: [1920, 2048, 1, 2048]   # same scale, no tail -- the control
          - Exact: [2048, 2000, 1, 2048]   # N tail on the other operand

  -
    - # The K tail.  Returns NaN rather than aborting: at these sizes the
      # transposed grid misplaces the scales without running past the buffer.
      # The assert does not catch them either, since 320 and 384 are both whole
      # multiples of the MXBlock 32 that ASEM derives from.
      #
      # TN F4 passes exactly these sizes 270/270, so this is the layout, not the
      # tail loop and not F4.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 320]   # K tail (320 = DepthU + 64)
          - Exact: [256, 256, 1, 384]   # K tail (384 = DepthU + 128)
          - Exact: [200, 200, 1, 320]   # M and N edge with a K tail
