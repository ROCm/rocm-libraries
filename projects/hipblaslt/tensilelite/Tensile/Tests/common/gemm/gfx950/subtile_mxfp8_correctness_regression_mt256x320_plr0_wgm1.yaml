########################################
# MXFP8 correctness regression — MT256x320x128 / PLR0 / WGM1 / DUMX256 path
#                                (R=2 swizzled-scale subtile, N-asym tile)
#
# Coverage gap from the 927-row validator sweep
# (/home/bnemanic/mxfp8_correctness_run9339.csv) and the bench-with-verify
# rollup in /home/bnemanic/MXFP8_BUG_HANDOFF_kernels.csv (row 1).
#
# Cluster regime: PLR0 / WGM1 / DUMX=256 / DU=128 (R = DepthUMX/DepthU = 2).
# Dominant uncovered tile in this regime:
#
#     MT256x320x128 / MIWT=[8,10] / MIWG=[2,2] / PGR2 / PLR0 / WGM1
#                  → 24/51 bench fail (47.1%)
#                  → 141/144 validator fail (97.9%)
#                  → max norm_error = 4.02e+18  (catastrophic NaN-class
#                                                blowup at (45312,64384,7936))
#
# Other uncovered tiles that share this PLR0/WGM1/DUMX256 regime and should
# light up (or stay green) together once the bug is fixed:
#     MT448x128x128 / MIWT[14,4] / MIWG[2,2]    (3/3 fail; norm_err≤0.260)
#     MT128x192x128 / MIWT[4,6]  / MIWG[2,2]    (2/2 fail; norm_err≤1.016)
#     MT128x256x128 / MIWT[4,8]  / MIWG[2,2]    (2/2 fail; norm_err≤0.547)
#     MT256x288x128 / MIWT[4,18] / MIWG[4,1]    (2/13 fail; norm_err≤0.032)
#
# Expected behaviour:
#   - Before the bug is fixed: verify FAILS on the failing sizes, including
#     the catastrophic (45312,64384,7936) → ~4e+18 NaN-class blowup case.
#   - After the bug is fixed: every size PASSes verify.
#
# NumElementsToValidate=-1 forces TensileLite to validate every element.
#
# Pinned ForkParameter values (mirror the dominant uncovered kernel name):
#   MatrixInstruction:    [16, 16, 128, 1, 1, 8, 10, 2, 2]
#                                  → MT256x320, MIWT=[8,10], MIWG=[2,2]
#   PrefetchGlobalRead:   [2]      → PGR2
#   PrefetchLocalRead:    [0]      → PLR0
#   DepthU:               [128]
#   DepthUMX:             [256]    → DUMX256 (R=2)
#   ScheduleIterAlg:      [3]      → SIA3
#   DirectToLds:          [1]      → DTLA1 / DTLB1
#   StreamK:              [3]      → SK3
#   StaggerU:             [0]      → SU0
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]      → WGM1
########################################

