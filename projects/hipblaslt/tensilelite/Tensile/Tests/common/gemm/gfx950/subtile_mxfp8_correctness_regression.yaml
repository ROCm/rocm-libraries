########################################
# MXFP8 correctness regression — DU=128 + DepthUMX=256 path (subtile MX-scale, R=2)
#
# Reproducer for the bug found by validate_mxfp8_correctness.py on
# branch users/bnemanich/subtile-mxfp8-libraries.  The snapshot of the
# in-flight validation CSV (run_9339, 548/1100 rows) shows:
#
#     DepthU=128 + DepthUMX=256 (R=2; swizzled-scale subtile path)
#                                      → 310/327 fail  (94.8% fail rate)
#     DepthU=256 + DepthUMX=0   (R=1)  →  85/221 fail  (38.5% fail rate)
#
# Within the failing path, the workhorse MT256x256x128 / MIWT=[8,8] /
# WG=[2,2] tile failed 71/74 cases with geomean(norm_error)=0.033 and
# max(norm_error)=0.151 on representative GEMMs.  PASS rows on the same
# tile only occurred at K≤768 — i.e. the bug needs ≥ a few K-loop unrolls
# to manifest.
#
# This test pins ForkParameters to that single tile + scheduler combo so
# TensileLite builds *only* the failing kernel and the verify step actually
# exercises it on every ProblemSize.  DepthUMX=256 (R=DepthUMX/DepthU=2)
# selects the 256-element swizzled MX scale period over a DepthU=128
# unroll, matching the failing kernel's DUMX256 token.
#
# Expected behaviour:
#   - Before the bug is fixed: the verify step FAILS on the failing sizes
#     (the controls at K=256/768 may still PASS, but TensileLite's overall
#     test status is FAIL once any size fails -- which is the point).
#   - After the bug is fixed: every size should pass verify and this test
#     turns green as a regression guard.
#
# NumElementsToValidate=-1 forces TensileLite to validate every element
# against the CPU/reference, matching how validate_mxfp8_correctness.py
# detected the bug.  KernelTime is on for the test harness but the test's
# pass/fail signal is correctness, not perf.
#
# Pinned ForkParameter values (mirror the failing kernel name token-by-token):
#   MatrixInstruction:    [16, 16, 128, 1, 1, 8, 8, 2, 2]   → MT256x256, MIWT=[8,8], WG=[2,2]
#   PrefetchGlobalRead:   [2]    → PGR2
#   PrefetchLocalRead:    [0]    → PLR0
#   DepthU:               [128]
#   DepthUMX:             [256]  → DUMX256 (matches failing kernel)
#   ScheduleIterAlg:      [3]    → SIA3
#   DirectToLds:          [1]    → DTL=1
#   StreamK:              [3]    → SK3
#   StaggerU:             [0]    → SU0
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]    → WGM1
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # MT256x256x128 / MIWT=[8,8] / WG=[2,2] — the dominant failing tile.
  #
  # All failing sizes have K that is a multiple of DepthU=128.  Each row
  # in the table below is annotated with the snapshot's measured
  # norm_error.  Sizes were drawn from /home/bnemanic/mxfp8_correctness_run9339.csv
  # (snapshot at 548/1100 rows, MT256x256x128 cluster, n=74 / fail=71).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT 256x256, MIWT=[8,8], WG=[2,2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead:  [0]
        - DepthU: [128]
        - DepthUMX: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ===== Failing sizes (drawn from MT256x256x128 cluster, sorted by norm_error desc) =====
          - Exact: [4992, 6016, 1, 7168]    # snapshot norm_error = 0.1512  (largest fail)
          - Exact: [6528, 6528, 1, 4352]    # snapshot norm_error = 0.1511
          - Exact: [5120, 6144, 1, 5632]    # snapshot norm_error = 0.1451
          - Exact: [4480, 6656, 1, 7680]    # snapshot norm_error = 0.1443
          - Exact: [4608, 5504, 1, 6656]    # snapshot norm_error = 0.1413
          - Exact: [5632, 5120, 1, 7936]    # snapshot norm_error = 0.1289
          - Exact: [6144, 5120, 1, 5888]    # snapshot norm_error = 0.1021 ; K=46*DU (not DU=256-aligned)
          - Exact: [7040, 3840, 1, 1536]    # snapshot norm_error = 0.0718 ; smaller K=12*DU
          # ===== Control sizes (PASSed at this tile in the snapshot) =====
          # These bracket the failure on K and on aspect ratio.  Their job
          # is to confirm that the codegen path itself isn't broken in
          # trivial ways -- only the K-loop with multiple unrolls of the
          # SDURA=2 path is broken.  Once the bug is fixed these should
          # still PASS (no regression on previously-good behaviour).
          - Exact: [2048, 6784, 1,  768]    # snapshot PASS, norm_error ≈ 7.6e-05 (small K, K=6*DU)
          - Exact: [7808, 5760, 1,  256]    # snapshot PASS, norm_error ≈ 7.0e-05 (smaller K, K=2*DU)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Prediction"

LibraryClient:
