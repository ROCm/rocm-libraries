########################################
# MXFP8 TN — MT 256x256, DU=128, ScaleDepthURatio{A,B}=2, PGR=2 perf benchmark
#
# Companion perf yaml for subtile_mxfp8_mt256.yaml. NOT a correctness test:
#   * NumElementsToValidate: 0  (skip CPU compare)
#   * NumWarmups: 1000, SyncsPerBenchmark: 1000  (timing protocol)
#   * Single problem: M=N=8192, K=32768
#
# Pins WorkGroupMapping=1 (linear). The Tensile default WGM=8 picks a
# tile-launch order that is poorly suited to this combination of MT256 +
# StreamK=3 + 1024-tile / 228-CU geometry: empirical sweep on gfx950
# (MI355X) at the K=32768 shape gave:
#
#   WGM=1   1528 us  /  2.88 PFLOPS    (best, on par with hipblaslt-bench's
#                                       best non-MX FP8 Tensile kernel at
#                                       the same shape: 1529 us / 2.88 PFLOPS)
#   WGM=4   1855 us  /  2.38 PFLOPS
#   WGM=8   2590 us  /  1.70 PFLOPS    (Tensile default — slowest)
#   WGM=16  2250 us  /  1.96 PFLOPS
#
# All other knobs match the PGR=2 fork of subtile_mxfp8_mt256.yaml so the
# kernel binary differs from the regression kernel only in the workgroup
# mapping factor.
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: 0
  ValidationMaxToPrint: 0
  NumWarmups: 1000
  SyncsPerBenchmark: 1000
  EnqueuesPerSync: 1
  NumBenchmarks: 1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # FP8 TN — PGR=2 (scheduler path), MT 256x256, DU=128, ScaleDepthURatio{A,B}=2
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]  # MT 256x256
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]                 # data DU = MI_K (half native)
        - ScaleDepthURatioA: [2]        # scale DU = 2 * data DU = 256
        - ScaleDepthURatioB: [2]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]         # perf-best for 8192x8192 K=32768 MT256
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 8192, 1, 32768]
