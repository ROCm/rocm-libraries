########################################
# MXFP8 TN — MT 256x256 with decoupled scale DepthU
#
# MT 256x256 MXFP8 only fits with DepthU=128 (LDS budget cannot hold the
# native DU=256 = 2*MI_K cadence at this tile size). However, the MX scale
# layout requires a K-span of at least 256 between scale loads, so a plain
# DU=128 schedule would over-fetch scales.
#
# This regression opts in to the half-rate scale cadence introduced by this
# PR via ScaleDepthURatio{A,B}=2: scales are loaded every 2*DU = 256 K-units
# while data continues to advance at DU=128 per inner iteration.
#
# Covers both PGR=0 and PGR=2 (scheduler) code paths at MT 256x256.
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # FP8 TN — PGR=0, MT 256x256, DU=128, ScaleDepthURatio{A,B}=2
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]  # MT 256x256
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]                 # data DU = MI_K (half native)
        - ScaleDepthURatioA: [2]        # scale DU = 2 * data DU = 256
        - ScaleDepthURatioB: [2]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]   # K = 1 * scaleDU (= 2 * data DU)
          - Exact: [256, 256, 1, 512]   # K = 2 * scaleDU
          - Exact: [256, 256, 1, 1024]  # K = 4 * scaleDU

  ########################################
  # FP8 TN — PGR=2 (scheduler path), MT 256x256, DU=128, ScaleDepthURatio{A,B}=2
  # Covers MIWaveGroup permutations [2,2] (baseline), [1,4], [4,1] per
  # sebvince review comment #9.  MIWaveTile compensates to keep MT 256x256:
  #   WG [2,2] → MIWT  8x 8  (numPartitionsM=1, numPartitionsN candidates {1,2,4,8})
  #   WG [1,4] → MIWT 16x 4  (numPartitionsM=1, numPartitionsN candidates {1,2,4})
  #   WG [4,1] → MIWT  4x16  (numPartitionsN=1, numPartitionsM candidates {1,2,4})
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8,  8,  2, 2]  # MT 256x256, WG 2x2 (baseline)
          - [16, 16, 128, 1,  1, 16,  4,  1, 4]  # MT 256x256, WG 1x4 (N-partition geometry)
          - [16, 16, 128, 1,  1,  4, 16,  4, 1]  # MT 256x256, WG 4x1 (M-partition geometry)
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [128]                 # data DU = MI_K (half native)
        - ScaleDepthURatioA: [2]        # scale DU = 2 * data DU = 256
        - ScaleDepthURatioB: [2]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]   # K = 1 * scaleDU (= 2 * data DU)
          - Exact: [256, 256, 1, 512]   # K = 2 * scaleDU
          - Exact: [256, 256, 1, 1024]  # K = 4 * scaleDU
          - Exact: [256, 256, 1, 4096]  # K = 16 * scaleDU = 32 outer iters; exercises last-iter prefetch gate

  ########################################
  # FP8 TN — sebvince review comment #10: larger DU on smaller MT
  # ----------------------------------------------------------------
  # Considered: MT 128x128 with DU=256 (data DU = 2*MI_K) and
  # ScaleDepthURatio{A,B}=2 (scaleDU = 512).  Rejected by the scheduler
  # constraint R*numSubIterK_data <= 2 in MFMASchedulerConfig.__post_init__
  # (scale VGPR holds at most 2 K-bytes per M parity; R*numSubIterK_data
  # would be 2*2=4 here, overflowing the op_sel byte index in emit_mfma).
  #
  # The baseline coverage (MT 128x128 + DU=256 + ScaleDepthURatio=1, i.e.
  # the no-decoupled-scale path) already lives in subtile_mxfp8.yaml — no
  # new yaml entry is added.  R=2 on small-MT/large-DU would require either
  # widening the scale VGPR holding to 4+ K-bytes or splitting MI_K — both
  # are out of scope for this PR.
  ########################################
