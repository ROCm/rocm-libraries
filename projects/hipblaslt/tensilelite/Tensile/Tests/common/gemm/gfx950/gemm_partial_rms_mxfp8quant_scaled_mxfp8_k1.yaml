# PartialRMS + MXFP8 DynQuant 32x1 fused epilogue (K1): MX-scaled fp8 input
# (MXBlockA=32, MXBlockB=32), OCP fp8 e4m3 output. Novel combo. MXFP8Quant
# owns quantization so PartialRMSQuant must be False.
# All tiles: MT1==128, MT0%64==0, DQuantSize0(=32) <= MT0/WG0.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  # Pipeline benchmark validation is disabled; correctness is covered by GPU
  # tests. Dynamic-quant reference cannot be validated in-pipeline.
  NumElementsToValidate: 128
  ExitOnFails: 0
  PrintSolutionRejectionReason: True
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1

BenchmarkProblems:

  ########################################
  # MX-scaled fp8 in, fp8 out — PartialRMS + MXFP8 DynQuant 32x1
  # DepthU=256, PGR=[1], MT1=128 for all tiles
  ########################################
  -
    - # ProblemType — MX-scaled fp8 in, OCP fp8 e4m3 out, f32 compute
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False
      PartialRMSQuant: False
      DQuantType: MXFP8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            # WG 1x1 (MT1=16*WT1*1=128 => WT1=8)
            - [16, 16, 128, 1, 1,  4,  8, 1, 1]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 1, 1]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1, 12,  8, 1, 1]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1, 16,  8, 1, 1]  # MT0=256  MT1=128
            # WG 2x1 (MT1=16*WT1*1=128 => WT1=8)
            - [16, 16, 128, 1, 1,  2,  8, 2, 1]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1,  6,  8, 2, 1]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 2, 1]  # MT0=256  MT1=128
            - [16, 16, 128, 1, 1, 10,  8, 2, 1]  # MT0=320  MT1=128
            - [16, 16, 128, 1, 1, 12,  8, 2, 1]  # MT0=384  MT1=128
            - [16, 16, 128, 1, 1, 14,  8, 2, 1]  # MT0=448  MT1=128
            - [16, 16, 128, 1, 1, 16,  8, 2, 1]  # MT0=512  MT1=128
            # WG 4x1 (MT1=16*WT1*1=128 => WT1=8)
            - [16, 16, 128, 1, 1,  1,  8, 4, 1]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  2,  8, 4, 1]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1,  3,  8, 4, 1]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1,  4,  8, 4, 1]  # MT0=256  MT1=128
            - [16, 16, 128, 1, 1,  5,  8, 4, 1]  # MT0=320  MT1=128
            - [16, 16, 128, 1, 1,  6,  8, 4, 1]  # MT0=384  MT1=128
            - [16, 16, 128, 1, 1,  7,  8, 4, 1]  # MT0=448  MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 4, 1]  # MT0=512  MT1=128
            # WG 2x2 (MT1=16*WT1*2=128 => WT1=4)
            - [16, 16, 128, 1, 1,  2,  4, 2, 2]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  4,  4, 2, 2]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1,  6,  4, 2, 2]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1,  8,  4, 2, 2]  # MT0=256  MT1=128
            # WG 1x4 (MT1=16*WT1*4=128 => WT1=2)
            - [16, 16, 128, 1, 1,  4,  2, 1, 4]  # MT0=64   MT1=128
            - [16, 16, 128, 1, 1,  8,  2, 1, 4]  # MT0=128  MT1=128
            - [16, 16, 128, 1, 1, 12,  2, 1, 4]  # MT0=192  MT1=128
            - [16, 16, 128, 1, 1, 16,  2, 1, 4]  # MT0=256  MT1=128
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [False]
        - PartialRMSQuant: [False]
        - DQuantType: [MXFP8]
        - DQuantSize0: [32]
        - DQuantSize1: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [256]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [128,  128, 1, 256]
            - Exact: [256,  2048, 1, 128]
            - Exact: [512,  4096, 1, 256]
            - Exact: [384,   128, 1, 256]
            - Exact: [512,   128, 1, 256]



LibraryLogic:
  ScheduleName: "partialrms_mxfp8quant_scaled_mxfp8_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
