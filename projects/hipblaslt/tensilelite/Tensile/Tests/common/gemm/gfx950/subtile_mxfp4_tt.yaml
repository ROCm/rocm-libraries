TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]  # subtile MX-FP4 is gfx950-only

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  PrintSolutionRejectionReason: True
  CpuThreads : 1
  MXScaleFormat: 1
  #NumWarmups: 100
  #EnqueuesPerSync: 2000
  #RotatingBufferSize: 512
  PrintTensorA: 1               # write A as binary to tensor_A.bin
  PrintTensorB: 1               # write B as binary to tensor_B.bin
  PrintTensorD: 1               # write GPU output D to tensor_D.bin
  PrintTensorRef: 1             # write CPU reference to tensor_Ref.bin
  DumpTensors: 1                # binary mode (else it would be text)
  NumWarmups: 0                 # avoid 100 warmups overwriting the buffer
  EnqueuesPerSync: 1            # one enqueue is enough for debugging
  RotatingBufferSize: 0         # disable rotation -> deterministic memory


BenchmarkProblems:
  ########################################
  # MX-FP4 *NN* layout (TransposeA=0, TransposeB=0)
  #   NN => TLUA=1 (A column-major, contiguous along M)
  #         TLUB=0 (B row-major,    contiguous along K)
  # Everything else is identical to the TN sample; only the
  # two Transpose flags change, because layout is the ONLY
  # property that distinguishes TN from NN.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      #TransposeA: 0          # <-- changed from 1 (TN) to 0 (NN)
      #TransposeB: 0          # <-- unchanged (N)
      TransposeA: 1          # changed from 0 (N) to 1 (T) — A becomes K-contiguous
      TransposeB: 1          # changed from 0 (N) to 1 (T) — B becomes N-contiguous
      UseBeta: True
      Batched: True
      ActivationFuncCall: True


    - # Solution knobs (subtile constraints; layout-independent)
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSubtileImpl: [1]
        - MatrixInstruction:
          # 1x1 wave group
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]  # MT 32x32
          # 2x2 wave group — symmetric
          #- [16, 16, 128, 1,  1, 8, 8,   2, 2 ]   # MT 256x256
          #- [16, 16, 128, 1,  1, 2, 2,  2, 2]  # MT 64x64
          #- [16, 16, 128, 1,  1, 4, 4,  2, 2]  # MT 128x128
          # 2x2 wave group — asymmetric
          #- [16, 16, 128, 1,  1, 6, 8,  2, 2]  # MT 256x192
          # 1x4 wave group
          #- [16, 16, 128, 1,  1, 2, 6,  1, 4]  # MT 32x384
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [256]                  # multiple of 2*MI_K = 256 (required)
        - ScheduleIterAlg: [3]
        - TransposeLDS: [1]
        - DirectToLds: [1]
        - StreamK: [3]                   # subtile requires StreamK=3
        - StaggerU: [0]
        - NonTemporalD: [4]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]    # M, N, batch, K ; full 256x256 tile, K = 1*DepthU
          #- Exact: [512, 256, 1, 256]
          #- Exact: [256, 512, 1, 256]
          #- Exact: [512, 512, 1, 256]
