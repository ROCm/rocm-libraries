TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

#######################################################################
# Subtile BF16 K-tail: K_remain even, K_remain % 8 != 0
# (K_remain ∈ {2, 4, 6, 10, 12, 14, 18, 22}, ASEM=2).
# Exercises the sub-lane refinement in `_emitTailByteShiftMaskSubtile`.
#######################################################################
GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  #PrintSolutionRejectionReason: True
  #GenerateSourcesAndExit: False
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # BF16 TN — no bias, DU = 2*MI_K = 64
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          # 1x1 wave group
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]  # MT 64x64
          # 2x2 wave group
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
          # 4x1 wave group
          - [16, 16, 32, 1,  1, 2, 2,  4, 1]  # MT 128x32
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K_remain ∈ {2, 4, 6} (tail-only)
          - Exact: [128, 128, 1,   2]
          - Exact: [128, 128, 1,   4]
          - Exact: [128, 128, 1,   6]
          # K_remain ∈ {10, 12, 14} (tail-only)
          - Exact: [128, 128, 1,  10]
          - Exact: [128, 128, 1,  12]
          - Exact: [128, 128, 1,  14]
          # K_remain ∈ {18, 22} (tail-only)
          - Exact: [128, 128, 1,  18]
          - Exact: [128, 128, 1,  22]
          # K = 1*DU + 2 = 66 (one main + tail with K_remain=2)
          - Exact: [128, 128, 1,  66]
          # K = 1*DU + 14 = 78
          - Exact: [128, 128, 1,  78]
          # K = 2*DU + 6 = 134 (two main + tail)
          - Exact: [128, 128, 1, 134]
          # Asymmetric M/N
          - Exact: [128,  32, 1,  10]
          - Exact: [ 32, 128, 1,  10]
          # Batched
          - Exact: [128, 128, 2,  14]
          - Exact: [128, 128, 3,   6]

  ########################################
  # BSS TN — BF16 input, F32 output, DU = 2*MI_K = 64
  #
  # Smaller wavetile coverage.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
          - [16, 16, 32, 1,  1, 3, 4,  2, 2]  # MT 96x128 (odd M wavetile)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1,   2]
          - Exact: [128, 128, 1,  14]
          - Exact: [128, 128, 1,  66]   # K = 1*DU + 2
          - Exact: [128, 128, 1, 134]   # K = 2*DU + 6
          - Exact: [128, 128, 2,  10]

  ########################################
  # BBS TN — BF16 bias epilogue + activation, DU = 2*MI_K = 64
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1,  66]   # K = 1*DU + 2, with bias
          - Exact: [128, 128, 1,  78]   # K = 1*DU + 14, with bias
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: relu]
          - [Enum: gelu]
