# PartialRMS + MXFP8 DynQuant 32x1 fused epilogue (K1): numeric validation
# with small sizes and full element check. bf16 input, OCP fp8 e4m3 output,
# no residual. Complements the pipeline-sweep file which disables validation.
# All tiles: MT1==128, MT0%64==0, DQuantSize0(=32) <= MT0/WG0.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: 128
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:

  ########################################
  # bf16 in, fp8 out — PartialRMS + MXFP8 DynQuant 32x1, small numeric sizes
  ########################################
  -
    - # ProblemType — bf16 in, OCP fp8 e4m3 out, f32 compute, PartialRMS + DynQuant
      OperationType: GEMM
      DataType: b
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False
      PartialRMSQuant: False
      DQuantType: MXFP8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1,  4,  8, 1, 1]  # MT0=64   MT1=128 WG 1x1
          - [16, 16, 32, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128 WG 2x1
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [False]
        - PartialRMSQuant: [False]
        - DQuantType: [MXFP8]
        - DQuantSize0: [32]
        - DQuantSize1: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [128, 256, 1, 64]
