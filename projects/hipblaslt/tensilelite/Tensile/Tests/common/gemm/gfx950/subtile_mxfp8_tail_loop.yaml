########################################
# MXFP8 SubtileImpl tail-loop sweep — mirrors MXFP4 TAIL sweep at
# subtile_mxfp4.yaml § "F4BS TN — TAIL loop sweep".
#
# Sweeps every K % DU remainder (K = 32..512 step 32) at M=N=256 across
# DU ∈ {256, 512} and PGR ∈ {0, 1, 2}, PLR ∈ {0, 1}. The 32-element step
# matches the MX block granularity that PR 7683 enabled for tail
# (Solution.minASEMforMX = 32, Solution.py ~698).
#
# Reference: PR 7683 (commit 9b8832cf128 on develop, "[SubtileImpl]
# [TailLoop] Add tail loop support for SubtileImpl") added BF16 + MXFP4
# tail support. The tail-loop orchestration in Components/Subtile/
# {Kernel.py, LogicalScheduler.py, InstructionEmitter.py} is dtype-
# agnostic, but only BF16 and MXFP4 are verified upstream. This sweep
# is the production-style stress for MXFP8.
#
# Likely-stressed code paths for MXFP8 specifically (cf. plan Step 7):
#   * Components/Subtile/InstructionEmitter.py emit_mask_k non-BF16 branch
#     (~line 498) — assumes FP4 packing; FP8's 1-byte/VGPR layout may
#     need a different mask stride.
#   * MX scale-mask reuse: comment "FP4 only" gates by
#     `not isBF16 and self.hasScale` — would also fire for MXFP8.
#
# Post-fix expectation (after [SubtileImpl][TailLoop] Fix PGR=2 main-
# to-tail handoff stale-LDS bug): all 96/96 cells PASS across PGR ∈
# {0, 1, 2} × PLR ∈ {0, 1} × K ∈ {32, 64, …, 512}.
#
#   * KernelWriterAssembly.computeTailLoopSrdLimit MX scale `kPad=256`
#     for DepthU>256 — may need an FP8-specific value at DU=512.
#
# Solution-count: 1 MI × 3 PGR × 2 PLR × 2 DU = 12 ForkParameter combos
# (some rejected by Solution.py); 16 K values per problem-size sweep.
#
# Geometry pinned to PR 7656's primary MXFP8 case (MT128x128) but at
# M=N=256 problem size so the WG grid is non-trivial (4 workgroups for
# MT128x128).
#
# PR 7781 + PR 7656 + PR 7683 verification status (gfx950, freshly rebuilt
# tensilelite-client at HEAD of users/bnemanich/mxfp8-tail-loop-test).
#
# Solution-rejection accounting (PrintSolutionRejectionReason=True):
#   12 nominal solutions → 8 after SolutionStructs → 6 after KernelWriter.
#   Effective sweep ran 6 ForkParameter combos × 16 K values = 96 cells.
#
# Pre-fix (HEAD ce357febed1, before main-loop regression was diagnosed):
#   PGR0 PLR0:  1 PASS / 15 FAIL    (only K=128 passed)
#   PGR0 PLR1:  1 PASS / 15 FAIL
#   PGR1 PLR0:  1 PASS / 15 FAIL
#   PGR1 PLR1:  1 PASS / 15 FAIL
#   PGR2 PLR0:  1 PASS / 15 FAIL
#   PGR2 PLR1:  1 PASS / 15 FAIL
#   Total: 6/96 PASS.
#
# Post-fix (after [SubtileImpl] Fix single-DU per_uid_k regression in
# emit_lr + NLL lr_inc PGR=1 gating + data K-mask skip for MX paths):
#   PGR0 PLR0: 16 PASS / 0 FAIL
#   PGR0 PLR1: 16 PASS / 0 FAIL
#   PGR1 PLR0: 16 PASS / 0 FAIL
#   PGR1 PLR1: 16 PASS / 0 FAIL
#   PGR2 PLR0: 16 PASS / 0 FAIL    (was 3 PASS / 13 FAIL pre-PGR=2 fix)
#   PGR2 PLR1: 16 PASS / 0 FAIL    (was 3 PASS / 13 FAIL pre-PGR=2 fix)
#   Total: 96/96 PASS.
#
# Post-PGR=2 fix (final): the [SubtileImpl][TailLoop] PGR=2 main→tail
# LW_base re-alignment fix in LogicalScheduler.emitMainAndExitLoops
# (introduced via _emit_pgr2_tail_lw_align, inserted between NLL_C{ui}
# and the SkipToEnd label) resolves the previously documented PGR=2
# K∈{288,320,352,384,416,448,480} × PLR{0,1} = 14 failing cells. Root
# cause was an LDS half-buffer mis-alignment between LW_base (swapped
# once by PRELOOP, not re-balanced by PGR=2's drop-gr_inc/lr_inc NLL)
# and the LR vgpr (never swapped on the tail-entering paths), so the
# tail GR wrote to one half while its LR re-read the prefetched-but-
# stale data still sitting in the OTHER half — double-counting that
# stale iteration on top of NLL's iteration. Fix XORs LW_base with
# sgprSwap{tc} for every live tensor before SkipToEnd on the NLL exit
# paths only (the K<DU direct-branch-to-SkipToEnd path is unaffected
# because neither LW nor v2 has been touched on that path). The pure
# tail-loop residual that previously bound PGR=0/1 cells went away in
# the [SubtileImpl][TailLoop] Skip data K-mask for MX-scaled paths fix
# (commit 82be5ef5b3f).
#
# Pre-existing v2 regression yamls (subtile_mxfp8_correctness_regression*
# .yaml MT256x256 multi-DU): unchanged by this fix, still fail kernel
# codegen with `vgprs=289 (Occupancy limit)`. Documented as a separate
# regression in the smoke-yaml docstring.
#
# Root cause + fix narrative is in the smoke yaml docstring; the patch
# touches `Components/Subtile/InstructionEmitter.py:emit_lr` and
# `Components/Subtile/LogicalScheduler.py:build_nll`.
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # MXFP8 TN — MT128x128 tail-loop sweep across PGR/PLR/DU.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128, MIWT=[4,4], MIWG=[2,2]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead:  [0, 1]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [[256], [256], [1], [32, 32, 512]]   # K = 32..512 step 32 (MX block granularity)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Prediction"

LibraryClient:
