########################################
# MXFP8 SubtileImpl tail-loop sweep — mirrors MXFP4 TAIL sweep at
# subtile_mxfp4.yaml § "F4BS TN — TAIL loop sweep".
#
# Sweeps every K % DU remainder (K = 32..512 step 32) at M=N=256 across
# DU ∈ {256, 512} and PGR ∈ {0, 1, 2}, PLR ∈ {0, 1}. The 32-element step
# matches the MX block granularity that PR 7683 enabled for tail
# (Solution.minASEMforMX = 32, Solution.py ~698).
#
# Reference: PR 7683 (commit 9b8832cf128 on develop, "[SubtileImpl]
# [TailLoop] Add tail loop support for SubtileImpl") added BF16 + MXFP4
# tail support. The tail-loop orchestration in Components/Subtile/
# {Kernel.py, LogicalScheduler.py, InstructionEmitter.py} is dtype-
# agnostic, but only BF16 and MXFP4 are verified upstream. This sweep
# is the production-style stress for MXFP8.
#
# Likely-stressed code paths for MXFP8 specifically (cf. plan Step 7):
#   * Components/Subtile/InstructionEmitter.py emit_mask_k non-BF16 branch
#     (~line 498) — assumes FP4 packing; FP8's 1-byte/VGPR layout may
#     need a different mask stride.
#   * MX scale-mask reuse: comment "FP4 only" gates by
#     `not isBF16 and self.hasScale` — would also fire for MXFP8.
#   * KernelWriterAssembly.computeTailLoopSrdLimit MX scale `kPad=256`
#     for DepthU>256 — may need an FP8-specific value at DU=512.
#
# Solution-count: 1 MI × 3 PGR × 2 PLR × 2 DU = 12 ForkParameter combos
# (some rejected by Solution.py); 16 K values per problem-size sweep.
#
# Geometry pinned to PR 7656's primary MXFP8 case (MT128x128) but at
# M=N=256 problem size so the WG grid is non-trivial (4 workgroups for
# MT128x128).
#
# PR 7781 + PR 7656 + PR 7683 verification status (gfx950, freshly rebuilt
# tensilelite-client at HEAD of users/bnemanich/mxfp8-tail-loop-test):
#
# Solution-rejection accounting (PrintSolutionRejectionReason=True):
#   12 nominal solutions → 8 after SolutionStructs → 6 after KernelWriter.
#   Effective sweep ran 6 ForkParameter combos × 16 K values = 96 cells.
#
# Aggregate per (PGR, PLR):
#   PGR0 PLR0:  1 PASS / 15 FAIL
#   PGR0 PLR1:  1 PASS / 15 FAIL
#   PGR1 PLR0:  1 PASS / 15 FAIL
#   PGR1 PLR1:  1 PASS / 15 FAIL
#   PGR2 PLR0:  1 PASS / 15 FAIL
#   PGR2 PLR1:  1 PASS / 15 FAIL
#
# The only PASS across all 96 cells is M=N=256 / K=128. Every K from 32
# up to 512 in step 32 FAILS regardless of PGR or PLR. That includes
# K < DU=256 tail-only cases (K=32, 64, 96, 160, 192, 224) — so the
# failure is not specifically tail-loop, nor specifically main-loop;
# it is broad across the MXFP8 SubtileImpl path post-merge.
#
# Companion data points (see subtile_mxfp8_tail_loop_smoke.yaml docstring
# for full triage write-up):
#   * Identical wrong-value counts across PGR=1 / PGR=2 at the same K
#     point to a kernel-vs-reference disagreement, not a scheduler bug.
#   * DataInitType=AllOnes makes the smoke yaml PASS at all K, while
#     DataInitType=Random fails — random-MX-data sensitivity.
#   * MXFP4 at the same MT/DU/PGR/PLR PASSes K=256 and K=512 but FAILs
#     K=288 (tail) with a tiny 0.6% wrong-rate; MXFP8 main loop wrong-
#     rate is an order of magnitude larger and grows linearly in K.
#   * Pre-existing subtile_mxfp8_correctness_regression.yaml (docstring
#     records 5/5 PASS at ce19b77af42) now fails kernel-generation
#     with "overflowed resources, vgprs=289" on its MT256x256 PGR=1
#     PLR=0 solution.
#
# Most likely root causes (none confirmed; see smoke yaml docstring for
# the full hypothesis chain):
#   * PR 7781 b937a0c8b3a "[Reference] Enable fast CPU GEMM path for
#     MX-scaled problems" was untested for MXFP8 + the PR 7656 / PR 7683
#     merges; the failure surface is consistent with a reference-side
#     regression activated by the new fast path.
#   * PR 7644 (`isMXProblem` → `isMXProblemExceptF6`) + PR 7683 restride
#     bookkeeping interact in a path the F8 init was not re-tested on.
#
# Status: BLOCKED on this baseline regression. Per plan Step 7, the work
# scopes beyond a small targeted fix (≤1 commit, ~50 lines) because the
# failure is wider than the tail loop the plan was meant to enable.
# Tail-specific triage (emit_mask_k non-BF16 branch / scale-mask gate /
# `computeTailLoopSrdLimit` MX `kPad`) is moot until the MXFP8 main-loop
# baseline is restored. This yaml is committed so the next worker has a
# repro and the per-K result matrix already gathered.
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # MXFP8 TN — MT128x128 tail-loop sweep across PGR/PLR/DU.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128, MIWT=[4,4], MIWG=[2,2]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead:  [0, 1]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [[256], [256], [1], [32, 32, 512]]   # K = 32..512 step 32 (MX block granularity)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Prediction"

LibraryClient:
