# MXFP8Quant fused epilogue (K1): GEMM + per-block e8m0 dynamic fp8 quantization.
# bf16 input, OCP fp8 e4m3 output. Exercises quant block shapes 16x16,
# 32x32, 1x32 plus PGR/DirectToLds variants across a broad macro-tile
# sweep on gfx950.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:

  ########################################
  # MXFP8Quant — quant block 16x16, bf16 in / fp8 out, PGR=1 DTL=1
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      DQuantType: MXFP8

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT 64x128,  WG 1x1
          - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT 128x128, WG 2x1
          - [16, 16, 32, 1, 1, 8, 4, 2, 1]   # MT 256x64,  WG 2x1
          - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT 256x256, WG 2x2
          - [16, 16, 32, 1, 1, 4, 4, 2, 2]   # MT 128x128, WG 2x2
          - [16, 16, 32, 1, 1, 2, 4, 1, 4]   # MT 32x256,  WG 1x4
          - [16, 16, 32, 1, 1, 8, 2, 4, 1]   # MT 512x32,  WG 4x1
        - DQuantType: [MXFP8]
        - DQuantSize0: [16]
        - DQuantSize1: [16]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 512]
          - Exact: [1024, 1024, 1, 1024]

