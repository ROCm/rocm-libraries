########################################
# MXFP8 correctness regression — MT128x32x256 / PLR1 / WGM1 / DU=256 / DUMX=0
#                                (R=1 minority bug path; asymmetric MIWG=[4,1])
#
# Coverage gap from /home/bnemanic/MXFP8_BUG_HANDOFF_kernels.csv (row 5).
#
# Second R=1 coverage entry (companion to mt64x64_plr0_du256.yaml). This one
# pins PLR1 *and* an asymmetric MIWG=[4,1] (vs the dominant MIWG=[2,2]).
# All failing sizes have m=n=128 (the MT itself), so failures here are
# purely K-loop driven — useful as a "is the bug K-period-dependent on the
# R=1 path?" probe.
#
# Cluster regime: PLR1 / WGM1 / DUMX=0 / DU=256 / MIWG=[4,1].
# Dominant uncovered tile in this regime:
#
#     MT128x32x256 / MIWT=[2,2] / MIWG=[4,1] / PGR2 / PLR1 / WGM1
#                  → 6/7 bench fail   (85.7%)
#                  → max norm_error = 0.158
#
# Pinned ForkParameter values:
#   MatrixInstruction:    [16, 16, 128, 1, 1, 2, 2, 4, 1]
#                                  → MT128x32, MIWT=[2,2], MIWG=[4,1]
#   PrefetchGlobalRead:   [2]      → PGR2
#   PrefetchLocalRead:    [1]      → PLR1
#   DepthU:               [256]
#   DepthUMX:             [0]      → DUMX0
#   ScheduleIterAlg:      [3]
#   DirectToLds:          [1]
#   StreamK:              [3]
#   StaggerU:             [0]
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]      → WGM1
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # MT128x32x256 / MIWT=[2,2] / MIWG=[4,1] / PLR1 / WGM1 / DU=256 / DUMX=0
  # — R=1 path with asymmetric MIWG=[4,1] (4 waves across M, 1 across N).
  # All failing sizes are m=n=128 with deep K, isolating the K-loop axis.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  4, 1]    # MT128x32, MIWT=[2,2], MIWG=[4,1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead:  [1]
        - DepthU: [256]
        - DepthUMX: [0]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ===== Failing sizes (bench-merged norm_error desc; all m=n=128) =====
          - Exact: [     128,    128, 1, 308736]  # bench norm_error = 0.158   (K=1206*DU)
          - Exact: [     128,    128, 1, 409344]  # bench norm_error = 0.155   (K=1599*DU)
          - Exact: [     128,    128, 1, 311552]  # bench norm_error = 0.141   (K=1217*DU)
          - Exact: [     128,    128, 1, 207360]  # bench norm_error = 0.118   (K=810*DU)
          - Exact: [     128,    128, 1, 159488]  # bench norm_error = 0.113   (K=623*DU)
          - Exact: [     128,    128, 1, 214016]  # bench norm_error = 0.104   (K=836*DU)
          # ===== Control sizes (synthetic small-K smokes) =====
          - Exact: [     128,    128, 1,    256]  # smoke (K=1*DU)
          - Exact: [     128,    128, 1,   2048]  # smoke (K=8*DU)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
