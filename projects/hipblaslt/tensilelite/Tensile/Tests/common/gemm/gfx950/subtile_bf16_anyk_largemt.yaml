TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

#######################################################################
# Subtile BF16 K-tail: large MT (320x288) where the historic
# bulk A/B vgprTiles alloc + per-mmak LR pushed the wave-64 vgpr
# budget over 256 (high-water ~302), failing assembly with
# "Occupancy limit". The per-mmak interleave restructure of
# `_emitTailLoopScaffoldSubtile` drops the slice live-range to one
# mmak at a time, bringing the high-water back to ~210.
#
# Coverage is intentionally tight (one MT shape, three ASEMs ×
# StreamK ∈ {0, 3}) so CI cost stays close to the existing anyk
# yamls; the largemt regression is about VGPR pressure on a single
# tile-grid shape, not exhaustive K-tail correctness (other anyk
# yamls already cover the small/medium MTs).
#######################################################################
GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # BF16 TN — MT 320x288, DU = 2*MI_K = 64, ASEM=2 (originally surfaced
  # as a K=66 / MT 320x288 VGPR-pressure regression).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 5, 18,  4, 1]  # MT 320x288 (4x1 WG)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 1*DU + 2 — the originally reported repro
          - Exact: [320, 288, 1,  66]
          # K = 1*DU + 14 — different K_remain on the same MT
          - Exact: [320, 288, 1,  78]

  ########################################
  # BF16 TN — MT 320x288, ASEM=8 (K%8 path: coarse cmp + cndmask
  # only, byte-refine gate rejects).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 5, 18,  4, 1]  # MT 320x288 (4x1 WG)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [8]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 1*DU + 8 — coarse mask path on the same shape
          - Exact: [320, 288, 1,  72]

  ########################################
  # BF16 TN — MT 320x288, ASEM=1 (odd K: runtime-gated mod>0 chain
  # in the sub-lane byte refine).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 5, 18,  4, 1]  # MT 320x288 (4x1 WG)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 1*DU + 1 — odd K_remain triggering byte-refine partial-mod chain
          - Exact: [320, 288, 1,  65]
