########################################
# MXFP8 correctness regression — MT192x256x128 / PLR1 / WGM4 / DUMX256 path
#                                (R=2 swizzled-scale subtile, WGM=4 scheduler)
#
# Coverage gap from /home/bnemanic/MXFP8_BUG_HANDOFF_kernels.csv (row 6).
#
# Cluster regime: PLR1 / WGM4 / DUMX=256 / DU=128 (R = DepthUMX/DepthU = 2).
# This matches the WGM=4 scheduler bucket of the existing
# `..._regression_depthumx.yaml` but at smaller MT (192x256 vs 320x256).
# Useful for isolating whether the bug is MT-size-dependent or just
# scheduler-bucket-dependent on the PLR1/WGM4 cluster.
#
# Dominant uncovered tile in this regime:
#
#     MT192x256x128 / MIWT=[6,8] / MIWG=[2,2] / PGR2 / PLR1 / WGM4
#                  → 5/5 bench fail (100.0%)
#                  → max norm_error = 0.0585
#
# Note: MIWT_M=6 is non-power-of-two — exactly the case
# LogicalScheduler.py:749's MAX_UNROLL=32 raise was meant to cover ("need
# up to lcm of MIWT components iterations to close the cycle"). If the bug
# is in the cycle convergence, this tile will exercise it.
#
# Expected behaviour:
#   - Before the bug is fixed: verify FAILS on every failing size (100% rate).
#   - After the bug is fixed: every size PASSes verify.
#
# Pinned ForkParameter values:
#   MatrixInstruction:    [16, 16, 128, 1, 1, 6, 8, 2, 2]
#                                  → MT192x256, MIWT=[6,8], MIWG=[2,2]
#   PrefetchGlobalRead:   [2]      → PGR2
#   PrefetchLocalRead:    [1]      → PLR1
#   DepthU:               [128]
#   DepthUMX:             [256]    → DUMX256 (R=2)
#   ScheduleIterAlg:      [3]
#   DirectToLds:          [1]
#   StreamK:              [3]
#   StaggerU:             [0]
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [4]      → WGM4 (matches existing _depthumx.yaml)
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
