  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # MT192x256x128 / MIWT=[6,8] / MIWG=[2,2] / PLR1 / WGM4 — dominant
  # uncovered failing tile in the PLR1/WGM4/DUMX256 regime (100% fail rate).
  # MIWT_M=6 is non-power-of-two; relevant to the LR free-list cycle
  # convergence path in LogicalScheduler.py.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 8,  2, 2]    # MT192x256, MIWT=[6,8], MIWG=[2,2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead:  [1]
        - DepthU: [128]
        - DepthUMX: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ===== Failing sizes (bench-merged norm_error desc) =====
          - Exact: [    4608,   4864, 1,  2560]   # bench norm_error = 0.0585    (K=20*DU)
          - Exact: [    4608,   4864, 1,  5888]   # bench norm_error = 0.0481    (K=46*DU, same shape diff K)
          - Exact: [    4992,   4608, 1,  7424]   # bench norm_error = 0.0432    (K=58*DU)
          - Exact: [    2944,   3584, 1,   512]   # bench norm_error = 0.0276    (K=4*DU)
          - Exact: [    1920,   5888, 1,  3328]   # bench norm_error = 0.0235    (K=26*DU)
          # ===== Control sizes (synthetic small-K smokes) =====
          - Exact: [    1920,   2560, 1,   256]   # smoke (K=2*DU)
          - Exact: [    3840,   2560, 1,   768]   # smoke (K=6*DU)

