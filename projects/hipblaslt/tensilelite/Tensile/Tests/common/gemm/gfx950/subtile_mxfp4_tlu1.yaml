          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 768]    # K past two DepthU-512 windows
          - Exact: [256, 256, 1, 1536]   # three of them
          - Exact: [200, 256, 1, 800]    # M edge with a 32-element K tail
          - Exact: [256, 256, 2, 768]    # batch through the mapped order

  -
    - # DepthU 768: three scale K-subtiles, where the scale thread split stops
      # being a shift.  MT64x64 only -- 128x128 runs past the LDS at this depth.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64 wg2x2
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [768]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 768]    # one unroll iteration
          - Exact: [256, 256, 1, 2304]   # three
          - Exact: [200, 200, 1, 768]    # M and N edge
          - Exact: [256, 256, 2, 1536]   # batch, two iterations

  -
    - # NT: the epilogue and scheduler knobs subtile_mxfp4.yaml varies -- bias,
      # activation, scaleAlphaVec, 1LDSBuffer, NonTemporalD (TransposeLDS needs a K-contiguous operand, so not here).
      OperationType: GEMM
