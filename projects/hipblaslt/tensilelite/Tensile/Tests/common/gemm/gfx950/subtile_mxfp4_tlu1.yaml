#
# MX-scaled F4 subtile GEMM correctness on the layouts with a free-dim contiguous
# operand: NT (both operands), NN (A) and TT (B).  subtile_mxfp4.yaml covers TN,
# where neither operand is free-dim contiguous.
#
# Geometry is picked per operand from TLU{A,B}: free-dim contiguous (TLU=1) gets
# the stacked transpose-read layout, K-contiguous (TLU=0) gets the row-major one.
# NT uses TLU=1 for both, TN TLU=0 for both, and NN / TT pair one of each -- so
# the mixed layouts also put the two scale operands on different group spans in
# the same kernel.  Stack = MIWaveTile[0]; MT = 16 * stack * waveGroup.  The 16x1
# blocks are rectangular because acc VGPRs scale as MIWT[0]*MIWT[1]*4.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # NT, power-of-two macro tiles across wave groups.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1 (2x2 strips)
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 512]   # two K windows
          - Exact: [96, 96, 1, 256]     # M,N inside one macro tile
          - Exact: [48, 80, 1, 256]     # M,N off the 32-row scale block
          - Exact: [34, 66, 1, 256]     # smallest even M,N; scale padding to 32

  -
    - # NT, tall and skewed macro tiles, up to 8:1.  Two shapes the non-MX suite
      # carried do not survive the scales: a stack of 16 at one wave cannot fetch
      # its MXSA scales in a single load per wave, and MT512 on the contiguous dim
      # runs the LDS past 160KB once the scale buffers are in.  The skew itself is
      # fine -- MT256x32 at wg2x1 is 8:1 and builds -- so keep the aspect ratios
      # and drop the two sizes, rather than the case.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8,  2,  1, 1]   # MT128x32  wg1x1 (4:1)
          - [16, 16, 128, 1,  1, 8,  2,  2, 1]   # MT256x32  wg2x1 (8:1)
          - [16, 16, 128, 1,  1, 16, 2,  1, 2]   # MT256x64  wg1x2 (stack 16, 2 waves)
          - [16, 16, 128, 1,  1, 8,  2,  2, 2]   # MT256x64  wg2x2
          - [16, 16, 128, 1,  1, 8,  4,  2, 2]   # MT256x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 64, 1, 256]
          - Exact: [1024, 128, 1, 512]

  -
    - # NT on a skewed tile at DepthU 512.  Two K windows per iteration against a
      # 2:1 tile; the deeper unroll doubles the scale bytes per window, so this is
      # where a scale span that is sized off a stride instead of off K shows up.
      # The stack has to stay at 4 here -- 8 at DepthU 512 hits the same one-load-
      # per-wave limit on MXSA as the tall tiles above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4,  2,  2, 2]   # MT128x64 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 512]
          - Exact: [512, 256, 1, 1024]

  -
    - # NT, macro tile 96 on either dim: MIWaveTile 6, 3 strips per wave.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 6,  1, 1]   # MT32x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  1, 1]   # MT64x96 wg1x1
          - [16, 16, 128, 1,  1, 2, 6,  2, 1]   # MT64x96 wg2x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 1]   # MT96x32 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 1]   # MT96x64 wg1x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 2]   # MT96x64 wg1x2
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96 wg1x1
          - [16, 16, 128, 1,  1, 6, 8,  1, 1]   # MT96x128 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 2]   # MT96x128 wg1x2
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 6, 12, 1, 1]   # MT96x192 wg1x1 (multi-wave straddles)
          - [16, 16, 128, 1,  1, 6, 8,  1, 2]   # MT96x256 wg1x2
          - [16, 16, 128, 1,  1, 6, 4,  1, 4]   # MT96x256 wg1x4
          - [16, 16, 128, 1,  1, 8, 6,  1, 1]   # MT128x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  2, 1]   # MT128x96 wg2x1
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
          - [16, 16, 128, 1,  1, 12, 6, 1, 1]   # MT192x96 wg1x1 (multi-wave straddles)
          - [16, 16, 128, 1,  1, 8, 6,  2, 1]   # MT256x96 wg2x1
          - [16, 16, 128, 1,  1, 4, 6,  4, 1]   # MT256x96 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]

  -
    - # NT, non-power-of-two macro tiles at four waves in N.  The stack is the
      # largest power-of-two divisor of the tile in MI tiles, so MT192 is 12
      # tiles -> strip 4, 3 strips per wave, and MT224 is 14 -> strip 2, 7 strips.
      # Both need the M wave group at 1: splitting the tile over M waves leaves a
      # per-wave count that neither divides nor is divided by the strip (12 -> 6
      # against strip 4, 14 -> 7 against strip 2), so the wave straddles a strip
      # and the geometry check rejects it.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]   # MT224x256 wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [200, 256, 1, 512]
          - Exact: [384, 512, 1, 512]
          - Exact: [448, 512, 1, 512]

  -
    - # NT prefetch cross product.  PGR double-buffers LDS, PLR double-buffers the
      # MFMA operand registers, so both change the GR/LR schedule and the LDS
      # buffer swap rather than the subtile layout itself.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   1 wave
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]

  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major).  The
      # two scales take different group spans in the same kernel.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]

  -
    - # TT: A K-contig (TLU=0, row-major), B free-contig (TLU=1, stacked) -- the
      # mirror of NN, so the spans land on the opposite scales.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          # Mirror of the NN pair: the non-power-of-two goes on N, which is the
          # contiguous dim here, so the N wave group is the one pinned to 1.
          - [16, 16, 128, 1,  1, 4, 12, 4,  1]  # MT256x192 wg4x1
          - [16, 16, 128, 1,  1, 4, 14, 4,  1]  # MT256x224 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [256, 192, 1, 256]
          - Exact: [256, 224, 1, 256]

  -
    - # M/N edge coverage: every other block uses whole macro tiles, so the edge
      # goes untested there.
      #
      # K stays a whole number of DepthU here, matching subtile_mxfp4.yaml, which
      # only ever uses K in {256, 512, 768, 1024}.
      #
      # This is a deliberate gap, not a passing case: a K tail on scaled F4 with a
      # free-dim contiguous operand returns NaN (K=320 and K=384 against DepthU
      # 256).  The tail loop is not the problem -- subtile_mxfp8_tail_loop sweeps
      # K=32..512 step 32 under MX and passes, and the same K tails on TN F4 pass
      # 270/270.  Both operands being K-contiguous is what makes those work, so
      # the fault is in the TLU=1 scale path here.  Restore these sizes once it is
      # fixed; the assert does not catch them, since 320 and 384 are both whole
      # multiples of the MXBlock 32 that ASEM is derived from.
      #
      # Odd M/N is out of reach here, not untested: two fp4 share a byte, so an
      # odd extent on a contiguous dim leaves the leading stride on a half byte
      # and the geometry raises AssertFree0/1ElementMultiple on whichever operand
      # is TLU=1.  Such sizes only ever come back DID_NOT_SATISFY_ASSERTS, so
      # they are covered in subtile_mxfp4.yaml instead, where the contiguous dim
      # is K and the assert does not apply.  This is a data-path constraint, not
      # a scale one.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [200, 256, 1, 256]   # M edge
          - Exact: [256, 200, 1, 256]   # N edge
          - Exact: [200, 200, 1, 512]   # M and N edge together, two K windows

