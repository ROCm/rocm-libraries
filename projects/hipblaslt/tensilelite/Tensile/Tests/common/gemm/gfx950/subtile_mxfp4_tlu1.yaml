          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 2, 256]   # batch 2, whole tiles
          - Exact: [256, 256, 3, 512]   # batch 3, two K windows
          - Exact: [200, 256, 2, 256]   # batch 2 with an M edge
          - Exact: [256, 256, 2, 288]   # batch 2 with a 32-element K tail

  -
    - # Mapped workgroup order, crossed with Stream-K.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
