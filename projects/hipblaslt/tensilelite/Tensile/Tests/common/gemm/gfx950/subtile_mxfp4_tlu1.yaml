#
# MX-scaled F4 subtile GEMM correctness on the layouts with a free-dim contiguous
# operand: NT (both operands), NN (A) and TT (B).  subtile_mxfp4.yaml covers TN,
# where neither operand is free-dim contiguous.
#
# Geometry is picked per operand from TLU{A,B}: free-dim contiguous (TLU=1) gets
# the stacked transpose-read layout, K-contiguous (TLU=0) gets the row-major one.
# NT uses TLU=1 for both, TN TLU=0 for both, and NN / TT pair one of each -- so
# the mixed layouts also put the two scale operands on different group spans in
# the same kernel.  Stack = MIWaveTile[0]; MT = 16 * stack * waveGroup.  The 16x1
# blocks are rectangular because acc VGPRs scale as MIWT[0]*MIWT[1]*4.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeBias: 1
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # NT, power-of-two macro tiles across wave groups.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1 (2x2 strips)
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 512]   # two K windows
          - Exact: [96, 96, 1, 256]     # M,N inside one macro tile
          - Exact: [48, 80, 1, 256]     # M,N off the 32-row scale block
          - Exact: [34, 66, 1, 256]     # smallest even M,N; scale padding to 32

  -
    - # NT, tall and skewed macro tiles, up to 8:1.  Two shapes the non-MX suite
      # carried do not survive the scales: a stack of 16 at one wave cannot fetch
      # its MXSA scales in a single load per wave, and MT512 on the contiguous dim
      # runs the LDS past 160KB once the scale buffers are in.  The skew itself is
      # fine -- MT256x32 at wg2x1 is 8:1 and builds -- so keep the aspect ratios
      # and drop the two sizes, rather than the case.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8,  2,  1, 1]   # MT128x32  wg1x1 (4:1)
          - [16, 16, 128, 1,  1, 8,  2,  2, 1]   # MT256x32  wg2x1 (8:1)
          - [16, 16, 128, 1,  1, 16, 2,  1, 2]   # MT256x64  wg1x2 (stack 16, 2 waves)
          - [16, 16, 128, 1,  1, 8,  2,  2, 2]   # MT256x64  wg2x2
          - [16, 16, 128, 1,  1, 8,  4,  2, 2]   # MT256x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 64, 1, 256]
          - Exact: [1024, 128, 1, 512]

  -
    - # NT on a skewed tile at DepthU 512.  Two K windows per iteration against a
      # 2:1 tile; the deeper unroll doubles the scale bytes per window, so this is
      # where a scale span that is sized off a stride instead of off K shows up.
      # The stack has to stay at 4 here -- 8 at DepthU 512 hits the same one-load-
      # per-wave limit on MXSA as the tall tiles above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4,  2,  2, 2]   # MT128x64 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 512]
          - Exact: [512, 256, 1, 1024]

  -
    - # NT, macro tile 96 on either dim: MIWaveTile 6, 3 strips per wave.  A 192
      # dim appears as MT128x192 / MT192x128: it needs one wave on the 192 side
      # and a second wave elsewhere, and 96 cannot supply one without going odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 6,  1, 1]   # MT32x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  1, 1]   # MT64x96 wg1x1
          - [16, 16, 128, 1,  1, 2, 6,  2, 1]   # MT64x96 wg2x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 1]   # MT96x32 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 1]   # MT96x64 wg1x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 2]   # MT96x64 wg1x2
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96 wg1x1
          - [16, 16, 128, 1,  1, 6, 8,  1, 1]   # MT96x128 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 2]   # MT96x128 wg1x2
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 4, 12, 2, 1]   # MT128x192 wg2x1 (12 tiles, one wave)
          - [16, 16, 128, 1,  1, 6, 8,  1, 2]   # MT96x256 wg1x2
          - [16, 16, 128, 1,  1, 6, 4,  1, 4]   # MT96x256 wg1x4
          - [16, 16, 128, 1,  1, 8, 6,  1, 1]   # MT128x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  2, 1]   # MT128x96 wg2x1
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
          - [16, 16, 128, 1,  1, 12, 4, 1, 2]   # MT192x128 wg1x2 (12 tiles, one wave)
          - [16, 16, 128, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2 (12 tiles both dims, shared strip)
          - [16, 16, 128, 1,  1, 8, 6,  2, 1]   # MT256x96 wg2x1
          - [16, 16, 128, 1,  1, 4, 6,  4, 1]   # MT256x96 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]

  -
    - # NT, non-power-of-two macro tiles at four waves in N.  The stack is picked
      # for cache-line utilization and then backed off until the wave group can
      # lay it out, so a tile that no stack suits at a given wave group is still
      # rejected.  MT224 is 14 MI tiles and is one of those: every M wave group
      # above 1 leaves 7 tiles per wave, which no power-of-two stack tiles.
      # MT192 (12 tiles) is not -- it shares a strip at wg2x2 on a stack of 2,
      # covered by the MT192x192 entry above.
      #
      # MT256x224 puts the non-power-of-two on N instead, where the same rule
      # pins the N wave group to 1 and leaves M free to take all four waves.
      # NT is the layout where that matters: both operands are TLU=1, so the
      # 14-tile dim is stacked here, whereas in TT (which carries the same tile)
      # only B is.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]   # MT224x256 wg1x4
          - [16, 16, 128, 1,  1, 4,  14, 4, 1]   # MT256x224 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 224, 1, 256]
          - Exact: [200, 256, 1, 512]
          - Exact: [384, 512, 1, 512]
          - Exact: [448, 512, 1, 512]

  -
    - # NT prefetch cross product.  PGR double-buffers LDS, PLR double-buffers the
      # MFMA operand registers, so both change the GR/LR schedule and the LDS
      # buffer swap rather than the subtile layout itself.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   1 wave
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]

  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major).  The
      # two scales take different group spans in the same kernel.  Only A is
      # TLU=1, so only M carries the multiple-of-2 assert and N may be odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 128, 1,  1, 4, 8,  2, 2]   # MT128x256 wg2x2
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]   # MT256x128 wg2x2
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 255, 1, 256]   # odd N, legal with B on the K-contig side
          - Exact: [256, 33,  1, 256]   # small odd N
          - Exact: [256, 200, 2, 256]   # batch with an N edge
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [256, 511, 3, 256]   # odd N with batch 3
          - Exact: [512, 127, 1, 512]   # odd N against a larger M
          - Exact: [256, 65,  1, 256]   # small odd N

  -
    - # NN at DepthU 512 and Stream-K, the axes the group above holds fixed.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 1024]
          - Exact: [512, 511, 1, 512]    # odd N through Stream-K
          - Exact: [512, 512, 2, 512]

  -
    - # TT: A K-contig (TLU=0, row-major), B free-contig (TLU=1, stacked) -- the
      # mirror of NN, so the spans land on the opposite scales, and M is the dim
      # free to be odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 128, 1,  1, 4, 8,  2, 2]   # MT128x256 wg2x2
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]   # MT256x128 wg2x2
          # Mirror of the NN pair: the non-power-of-two goes on N, which is the
          # contiguous dim here, so the N wave group is the one pinned to 1.
          - [16, 16, 128, 1,  1, 4, 12, 4,  1]  # MT256x192 wg4x1
          - [16, 16, 128, 1,  1, 4, 14, 4,  1]  # MT256x224 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [256, 192, 1, 256]
          - Exact: [256, 224, 1, 256]
          - Exact: [255, 256, 1, 256]   # odd M, legal with A on the K-contig side
          - Exact: [33,  256, 1, 256]   # small odd M
          - Exact: [200, 256, 2, 256]   # batch with an M edge
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [511, 256, 3, 256]   # odd M with batch 3
          - Exact: [127, 512, 1, 512]   # odd M against a larger N
          - Exact: [65,  256, 1, 256]   # small odd M

  -
    - # TT at DepthU 512 and Stream-K, the mirror of the NN group above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 1024]
          - Exact: [511, 512, 1, 512]    # odd M through Stream-K
          - Exact: [512, 512, 2, 512]

  -
    - # M/N edge coverage: every other block uses whole macro tiles, so the edge
      # goes untested there.
      #
      # The K tail is covered here.  It used to return NaN on this layout, because
      # the scale swizzle built its grid as if the row axis were always K -- true
      # for a K-contiguous operand, transposed for a free-dim contiguous one.  The
      # assert never caught it: 320 and 384 are both whole multiples of the MXBlock
      # 32 that ASEM derives from.  Tails run down to that multiple, not to 64.
      #
      # Odd M/N cannot live here: two fp4 share a byte, so an odd extent on a
      # contiguous dim leaves the leading stride on a half byte, and the subtile
      # geometry raises AssertFree0/1ElementMultiple to 2 on whichever operand is
      # TLU=1 -- every block in this file has at least one.  Those sizes are
      # covered in subtile_mxfp4.yaml, where K is the contiguous dim.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [200, 256, 1, 256]   # M edge
          - Exact: [256, 200, 1, 256]   # N edge
          - Exact: [200, 200, 1, 512]   # M and N edge together, two K windows
          - Exact: [256, 256, 1, 320]   # K tail (320 = DepthU + 64)
          - Exact: [256, 256, 1, 384]   # K tail (384 = DepthU + 128)
          - Exact: [200, 200, 1, 320]   # M and N edge with a K tail
          - Exact: [256, 256, 1, 288]   # K tail 32 -- the ASEM floor itself
          - Exact: [200, 200, 1, 352]   # M and N edge with a 32-element K tail
          - Exact: [16, 16, 1, 256]     # smallest free dim a TLU=1 operand takes
          - Exact: [514, 514, 1, 256]   # even, but 2 mod 8 rather than tile-aligned


  -
    - # NT, macro tile 96 at 4 waves, DepthU 512: the fetch group is spread over
      # both the K slices of a window AND several K windows, so a wave issues
      # more than one window at a per-wave window offset.
      #
      # K=1024 is 32 K blocks, which is where the scale buffer's padded extent
      # first differs between the two orientations; it used to abort in the
      # client's scale swizzle.  K=512 brackets it from below.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]
          - Exact: [384, 768, 1, 1024]

  -
    - # The free-dim tail of the buffer window.  The last workgroup owns fewer
      # than a macro tile when the size leaves a remainder, so the window runs
      # past the tensor.  Faulting needs the operand to end on a page too:
      # 2048 over a tile of 96 leaves 32 rows and an A of exactly 2MB.
      # Keep the sizes -- the shapes make this reachable, not the tiles.
      #
      # At K=2048 these are also the largest scale buffers here, so they cover
      # the padded-extent path that used to abort in the client's scale swizzle.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 2048, 1, 2048]   # M tail vs tile 96, operand ends on a page
          - Exact: [1920, 2048, 1, 2048]   # same scale shape, no tail -- the control
          - Exact: [2048, 2000, 1, 2048]   # N tail on the other operand

  -
    - # Batch and Stream-K: the GR base away from the batch-0 tile-0 origin every
      # other block starts at.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
