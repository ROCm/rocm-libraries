#
# NT F4 subtile GEMM correctness.  NT -> both operands free-dim contiguous, both
# transpose-read.  Stack = MIWaveTile[0]; MT = 16 * stack * waveGroup.  The 16x1
# blocks are rectangular because acc VGPRs scale as MIWT[0]*MIWT[1]*4.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]  # MT 32x32
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 128]
          - Exact: [32, 32, 1, 256]
          - Exact: [64, 64, 1, 256]
          - Exact: [256, 256, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT 64x64  (2x2 strips)
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT 128x128 (4x4 strips)
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128 wg2x2 (4 waves)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT 32x32
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT 64x64  (2x2 strips)
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128 wg2x2 (4 waves)
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT 256x256 wg2x2 (129KB LDS, 496 VGPR)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [256, 256, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 16, 2,  1, 1]   # MT 256x32  1 wave   A 16x1, B 2x1
          - [16, 16, 128, 1,  1, 16, 4,  1, 1]   # MT 256x64  1 wave   A 16x1, B 4x1
          - [16, 16, 128, 1,  1, 16, 2,  2, 2]   # MT 512x64  wg2x2    A 16x1, B 2x1
          - [16, 16, 128, 1,  1, 16, 4,  2, 2]   # MT 512x128 wg2x2    A 16x1, B 4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 128, 1, 128]
          - Exact: [1024, 256, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 16, 2,  1, 1]   # MT 256x32  1 wave  (73KB LDS)
          - [16, 16, 128, 1,  1, 16, 4,  1, 1]   # MT 256x64  1 wave  (81KB LDS)
          - [16, 16, 128, 1,  1, 16, 2,  2, 2]   # MT 512x64  wg2x2   (145KB LDS)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 64, 1, 256]
          - Exact: [1024, 128, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 16, 2,  1, 1]   # MT 256x32  1 wave  (145KB LDS)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 32, 1, 512]
          - Exact: [512, 64, 1, 1024]

  -
    - # ProblemType (SubtileWideGR: GR spans the whole macro tile, LR per-wave)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  2,  2, 2]   # MT64x64   wg2x2 GR4/LR2
          - [16, 16, 128, 1,  1,  4,  4,  2, 2]   # MT128x128 wg2x2 GR8/LR4
          - [16, 16, 128, 1,  1,  8,  8,  2, 2]   # MT256x256 wg2x2 GR16/LR8
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - SubtileWideGR: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [512, 512, 1, 256]
