# NT, tall and skewed macro tiles, up to 8:1.  Two shapes the non-MX suite
# carried do not survive the scales: a stack of 16 at one wave cannot fetch
# its MXSA scales in a single load per wave, and MT512 on the contiguous dim
# runs the LDS past 160KB once the scale buffers are in.  The skew itself is
# fine -- MT256x32 at wg2x1 is 8:1 and builds -- so keep the aspect ratios
# and drop the two sizes, rather than the case.
.SkewedTiles: &skewed_tiles
  OperationType: GEMM
  DataType: F4
  DestDataType: S
  ComputeDataType: S
  HighPrecisionAccumulate: True
  MXBlockA: 32
  MXBlockB: 32
  TransposeA: False
  TransposeB: True
  UseBeta: True
  Batched: True

