  # ---- per-layout extras: odd free-dim extents, which the shared matrix
  # cannot carry.  NT forces even M and N because both operands are TLU=1;
  # NN only even M and TT only even N, so an odd extent on the K-contiguous
  # side is legal there and nowhere else.
  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major).  The
      # two scales take different group spans in the same kernel.  Only A is
      # TLU=1, so only M carries the multiple-of-2 assert and N may be odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 128, 1,  1, 4, 8,  2, 2]   # MT128x256 wg2x2
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]   # MT256x128 wg2x2
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 255, 1, 256]   # odd N, legal with B on the K-contig side
          - Exact: [256, 33,  1, 256]   # small odd N
          - Exact: [256, 200, 2, 256]   # batch with an N edge
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [256, 511, 3, 256]   # odd N with batch 3
          - Exact: [512, 127, 1, 512]   # odd N against a larger M
          - Exact: [256, 65,  1, 256]   # small odd N
          - Exact: [256, 256, 1, 32]    # K below a window: the tail carries the GEMM
          - Exact: [256, 256, 1, 128]   # half a window
          - Exact: [32,  256, 1, 256]   # small M -- A is the free-contig (stacked) side
          - Exact: [32,  32,  1, 32]    # smallest problem on this layout
