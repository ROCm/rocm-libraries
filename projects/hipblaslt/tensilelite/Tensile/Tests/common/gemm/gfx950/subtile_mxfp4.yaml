          - [Enum: relu]
          - [Enum: gelu]
          - [Enum: sigmoid]
          - [Enum: silu]
          - [Enum: clamp]
          - [Enum: dgelu]
          - [Enum: drelu]

  ########################################
  # FP4 TN — PGR=2, PLR=1 (scheduler path)
  #
  # The PGR=2 scheduler takes a different code path than PGR=0.
  # Rectangular MIWTs exercise loadRatioGR != 1.0.
  # K=768 tests K > DU (K-loop with SRD advance).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
