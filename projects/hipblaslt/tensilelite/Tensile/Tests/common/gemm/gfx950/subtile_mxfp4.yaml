  # NN only even M and TT only even N, so an odd extent on the K-contiguous
  # side is legal there and nowhere else.
  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major).  The
      # two scales take different group spans in the same kernel.  Only A is
      # TLU=1, so only M carries the multiple-of-2 assert and N may be odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 128, 1,  1, 4, 8,  2, 2]   # MT128x256 wg2x2
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]   # MT256x128 wg2x2
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 255, 1, 256]   # odd N, legal with B on the K-contig side
          - Exact: [256, 33,  1, 256]   # small odd N
          - Exact: [256, 200, 2, 256]   # batch with an N edge
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [256, 511, 3, 256]   # odd N with batch 3
          - Exact: [512, 127, 1, 512]   # odd N against a larger M
          - Exact: [256, 65,  1, 256]   # small odd N
          - Exact: [256, 256, 1, 32]    # K below a window: the tail carries the GEMM
          - Exact: [256, 256, 1, 128]   # half a window
          - Exact: [32,  256, 1, 256]   # small M -- A is the free-contig (stacked) side
          - Exact: [32,  32,  1, 32]    # smallest problem on this layout
  -
    - # NN at DepthU 512 and Stream-K, the axes the group above holds fixed.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 1024]
          - Exact: [512, 511, 1, 512]    # odd N through Stream-K
          - Exact: [512, 512, 2, 512]
  -
    - # TT: A K-contig (TLU=0, row-major), B free-contig (TLU=1, stacked) -- the
      # mirror of NN, so the spans land on the opposite scales, and M is the dim
      # free to be odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 128, 1,  1, 4, 8,  2, 2]   # MT128x256 wg2x2
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]   # MT256x128 wg2x2
          # Mirror of the NN pair: the non-power-of-two goes on N, which is the
          # contiguous dim here, so the N wave group is the one pinned to 1.
          - [16, 16, 128, 1,  1, 4, 12, 4,  1]  # MT256x192 wg4x1
          - [16, 16, 128, 1,  1, 4, 14, 4,  1]  # MT256x224 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [256, 192, 1, 256]
          - Exact: [256, 224, 1, 256]
          - Exact: [255, 256, 1, 256]   # odd M, legal with A on the K-contig side
          - Exact: [33,  256, 1, 256]   # small odd M
          - Exact: [200, 256, 2, 256]   # batch with an M edge
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [511, 256, 3, 256]   # odd M with batch 3
          - Exact: [127, 512, 1, 512]   # odd M against a larger N
          - Exact: [65,  256, 1, 256]   # small odd M
          - Exact: [256, 256, 1, 32]    # K below a window: the tail carries the GEMM
          - Exact: [256, 256, 1, 128]   # half a window
          - Exact: [256, 32,  1, 256]   # small N -- B is the free-contig (stacked) side
          - Exact: [32,  32,  1, 32]    # smallest problem on this layout
  -
    - # TT at DepthU 512 and Stream-K, the mirror of the NN group above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 1024]
          - Exact: [511, 512, 1, 512]    # odd M through Stream-K
          - Exact: [512, 512, 2, 512]
  -
    - # NN: the epilogue and scheduler knobs the TN groups vary -- bias,
      # activation, scaleAlphaVec, 1LDSBuffer, NonTemporalD and TransposeLDS.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      ActivationFuncCall: True
      UseBias: 1
      BiasDataTypeList: [s]
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [1]
        - ActivationFuncCall: [false]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [[256], [256], [1], [64, 64, 512]]
        - BiasTypeArgs: ['s']
  -
    - # TT: the epilogue and scheduler knobs the TN groups vary -- bias,
      # activation, scaleAlphaVec, 1LDSBuffer, NonTemporalD and TransposeLDS.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      ActivationFuncCall: True
      UseBias: 1
      BiasDataTypeList: [s]
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [1]
        - ActivationFuncCall: [false]
        - DepthU: [256, 512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [[256], [256], [1], [64, 64, 512]]
        - BiasTypeArgs: ['s']
  ########################################
  # StreamK partial tiles, all four layouts
  ########################################
  -
    - <<: *sk_partial_tiles
    - *sk_partial_tiles_fork
  -
    - <<: *sk_partial_tiles
      TransposeA: False
      TransposeB: False
    - *sk_partial_tiles_fork
  -
    - <<: *sk_partial_tiles
      TransposeA: True
      TransposeB: True
    - *sk_partial_tiles_fork
  -
    - <<: *sk_partial_tiles
      TransposeA: True
      TransposeB: False
    - *sk_partial_tiles_fork
