          - Exact: [256, 256, 1, 768]   # K = 3*DU (K-loop)
          - Exact: [192, 192, 1, 256]   # Edge
          - Exact: [384, 384, 1, 256]   # Large tile edge

  # PGR=2 WG 4x1/1x4, K > DU — re-enabled after scheduler fix.
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
