          - [16, 16, 128, 1,  1, 12, 2, 2, 2]  # MT 384x64
          - [16, 16, 128, 1,  1, 4, 10, 2, 2]  # MT 128x320
          - [16, 16, 128, 1,  1, 10, 4, 2, 2]  # MT 320x128
          - [16, 16, 128, 1,  1, 4, 12, 2, 2]  # MT 128x384
          - [16, 16, 128, 1,  1, 12, 4, 2, 2]  # MT 384x128
          # More WG 4x1 configs
          - [16, 16, 128, 1,  1, 2, 4,  4, 1]  # MT 128x64
          - [16, 16, 128, 1,  1, 2, 8,  4, 1]  # MT 128x128
          - [16, 16, 128, 1,  1, 4, 4,  4, 1]  # MT 256x64
          - [16, 16, 128, 1,  1, 4, 8,  4, 1]  # MT 256x128
          # More WG 1x4 configs
          - [16, 16, 128, 1,  1, 4, 2,  1, 4]  # MT 64x128
          - [16, 16, 128, 1,  1, 8, 2,  1, 4]  # MT 128x128
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]  # MT 64x256
