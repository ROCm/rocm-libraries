  ########################################
  # F4BS TN — TAIL loop sweep (bias + ScaleAlphaVec + hipblaslt_all)
  #
  # Sweeps K = 32..512 (step 32, the FP4 K-granularity) at M=N=256 with
  # MT 128x128, exercising tail-loop remainders for DU=256 and DU=512.
  # PGR=0/1/2, StreamK=3, WGM=16/XCC=4 to match the production scheduler path.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      ActivationFuncCall: True
      UseBias: 1
      BiasDataTypeList: [s]
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]  # MT 128x128
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]  # MT 64x64   (single-wave, smaller scale-tile geometry)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [1]
        - ActivationFuncCall: [false]
        - DepthU: [256, 512, 768]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - SourceSwap: [true]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
        - UseCustomMainLoopSchedule: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Range: [[256], [256], [1], [32, 32, 512]]
        - BiasTypeArgs: ['s']
  # ---- NT, DestDataType S: the template cell.  Every group below is
  # anchored and replayed for the other eight (layout, out-type) cells.
  -
    - &prob0 # NT, power-of-two macro tiles across wave groups.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench0
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1 (2x2 strips)
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 512]   # two K windows
          - Exact: [96, 96, 1, 256]     # M,N inside one macro tile
          - Exact: [48, 80, 1, 256]     # M,N off the 32-row scale block
          - Exact: [34, 66, 1, 256]     # smallest even M,N; scale padding to 32
  -
    - &prob1 # NT, tall and skewed macro tiles, up to 8:1.  Two shapes the non-MX suite
      # carried do not survive the scales: a stack of 16 at one wave cannot fetch
      # its MXSA scales in a single load per wave, and MT512 on the contiguous dim
      # runs the LDS past 160KB once the scale buffers are in.  The skew itself is
      # fine -- MT256x32 at wg2x1 is 8:1 and builds -- so keep the aspect ratios
      # and drop the two sizes, rather than the case.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench1
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8,  2,  1, 1]   # MT128x32  wg1x1 (4:1)
          - [16, 16, 128, 1,  1, 8,  2,  2, 1]   # MT256x32  wg2x1 (8:1)
          - [16, 16, 128, 1,  1, 16, 2,  1, 2]   # MT256x64  wg1x2 (stack 16, 2 waves)
          - [16, 16, 128, 1,  1, 8,  2,  2, 2]   # MT256x64  wg2x2
          - [16, 16, 128, 1,  1, 8,  4,  2, 2]   # MT256x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 64, 1, 256]
          - Exact: [1024, 128, 1, 512]
  -
    - &prob2 # NT on a skewed tile at DepthU 512.  Two K windows per iteration against a
      # 2:1 tile; the deeper unroll doubles the scale bytes per window, so this is
      # where a scale span that is sized off a stride instead of off K shows up.
      # The stack has to stay at 4 here -- 8 at DepthU 512 hits the same one-load-
      # per-wave limit on MXSA as the tall tiles above.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench2
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4,  2,  2, 2]   # MT128x64 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 512]
          - Exact: [512, 256, 1, 1024]
  -
    - &prob3 # NT, macro tile 96 on either dim: MIWaveTile 6, 3 strips per wave.  A 192
      # dim appears as MT128x192 / MT192x128: it needs one wave on the 192 side
      # and a second wave elsewhere, and 96 cannot supply one without going odd.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench3
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 6,  1, 1]   # MT32x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  1, 1]   # MT64x96 wg1x1
          - [16, 16, 128, 1,  1, 2, 6,  2, 1]   # MT64x96 wg2x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 1]   # MT96x32 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 1]   # MT96x64 wg1x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 2]   # MT96x64 wg1x2
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96 wg1x1
          - [16, 16, 128, 1,  1, 6, 8,  1, 1]   # MT96x128 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 2]   # MT96x128 wg1x2
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 4, 12, 2, 1]   # MT128x192 wg2x1 (12 tiles, one wave)
          - [16, 16, 128, 1,  1, 6, 8,  1, 2]   # MT96x256 wg1x2
          - [16, 16, 128, 1,  1, 6, 4,  1, 4]   # MT96x256 wg1x4
          - [16, 16, 128, 1,  1, 8, 6,  1, 1]   # MT128x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  2, 1]   # MT128x96 wg2x1
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
          - [16, 16, 128, 1,  1, 12, 4, 1, 2]   # MT192x128 wg1x2 (12 tiles, one wave)
          - [16, 16, 128, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2 (12 tiles both dims, shared strip)
          - [16, 16, 128, 1,  1, 8, 6,  2, 1]   # MT256x96 wg2x1
          - [16, 16, 128, 1,  1, 4, 6,  4, 1]   # MT256x96 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]
  -
    - &prob4 # NT, non-power-of-two macro tiles at four waves in N.  MT224 is 14 MI
      # tiles, which no power-of-two stack covers at any M wave group above 1, so
      # it pins that group to 1.  MT256x224 moves the odd dim to N, freeing M to
      # take all four waves.  Both NT operands are TLU=1, so the 14-tile dim is
      # stacked here where in TT only B is.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench4
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]   # MT224x256 wg1x4
          - [16, 16, 128, 1,  1, 4,  14, 4, 1]   # MT256x224 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 224, 1, 256]
          - Exact: [200, 256, 1, 512]
          - Exact: [384, 512, 1, 512]
          - Exact: [448, 512, 1, 512]
  -
    - &prob5 # NT prefetch cross product.  PGR double-buffers LDS, PLR double-buffers the
      # MFMA operand registers, so both change the GR/LR schedule and the LDS
      # buffer swap rather than the subtile layout itself.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench5
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   1 wave
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
  -
    - &prob6 # M/N edge coverage: every other block uses whole macro tiles.  The K tail
      # here once returned NaN, because the scale swizzle built its grid as if the
      # row axis were always K -- transposed for a free-dim contiguous operand.
      # Odd M/N cannot live here: two fp4 share a byte, so the subtile geometry
      # raises AssertFree0/1ElementMultiple to 2 on any TLU=1 operand.  Those
      # sizes are covered by the TN groups above, where K is contiguous.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - &bench6
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [200, 256, 1, 256]   # M edge
          - Exact: [256, 200, 1, 256]   # N edge
          - Exact: [200, 200, 1, 512]   # M and N edge together, two K windows
          - Exact: [256, 256, 1, 320]   # K tail (320 = DepthU + 64)
          - Exact: [256, 256, 1, 384]   # K tail (384 = DepthU + 128)
          - Exact: [200, 200, 1, 320]   # M and N edge with a K tail
          - Exact: [256, 256, 1, 288]   # K tail 32 -- the ASEM floor itself
          - Exact: [200, 200, 1, 352]   # M and N edge with a 32-element K tail
          - Exact: [16, 16, 1, 256]     # smallest free dim a TLU=1 operand takes
          - Exact: [514, 514, 1, 256]   # even, but 2 mod 8 rather than tile-aligned
          # K below one DepthU: the unroll loop never runs a whole iteration, so
          # the tail carries the entire GEMM.  Every case above has at least one
          # full window before its tail, which leaves the zero-window path untested.
          - Exact: [256, 256, 1, 32]    # K = ASEM floor, no full window at all
          - Exact: [256, 256, 1, 128]   # half a window
          - Exact: [256, 256, 1, 224]   # one element short of a window
          - Exact: [200, 200, 1, 96]    # M and N edge with no full window
          - Exact: [32, 32, 1, 32]      # smallest problem the layout accepts
  -
    - &prob7 # NT, macro tile 96 at 4 waves, DepthU 512: the fetch group is spread over
      # both the K slices of a window AND several K windows, so a wave issues
      # more than one window at a per-wave window offset.
      #
      # K=1024 is 32 K blocks, which is where the scale buffer's padded extent
      # first differs between the two orientations; it used to abort in the
      # client's scale swizzle.  K=512 brackets it from below.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
