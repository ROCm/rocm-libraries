        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - TransposeLDS: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
