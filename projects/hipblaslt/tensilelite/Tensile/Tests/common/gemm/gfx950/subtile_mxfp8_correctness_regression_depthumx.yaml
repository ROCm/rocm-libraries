########################################
# MXFP8 correctness regression — DepthUMX=256 / PLR=1 / WGM=4 path
#                                (libs-merged DepthUMX build)
#
# Companion reproducer to subtile_mxfp8_correctness_regression.yaml.
# That file pins MT256x256x128 / MIWT=[8,8] / PLR0 / WGM1 from the
# pre-translation run_9339 snapshot. This file pins the *new* dominant
# failing tile observed on the post-translation (DepthUMX scheme) build:
#
#     MT320x256x128 / MIWT=[10,8] / MIWG=[2,2] / PGR2 / PLR1 / WGM4 / DUMX256
#
# Source snapshot: /home/bnemanic/mxfp8_bench_libs_merged_with_verify.csv
# at 144/1100 rows (88 OK / 56 FAIL_VERIFY / 0 FAIL_RUN). Cluster rollup
# (see /home/bnemanic/mxfp8_libs_merged_failure_clusters_partial.md):
#
#   By DepthUMX:
#     DUMX256 (R=2; DepthU=128 + DepthUMX=256, swizzled subtile)
#                                          → 51/119 fail  (42.9% fail rate)
#     DUMX0   (R=1; DepthU=256)            →  5/25  fail  (20.0% fail rate)
#   → DUMX256 carries 51/56 = 91.1% of all observed failures on this build.
#
#   Dominant cluster by absolute fail count on the snapshot:
#     MT320x256x128 / MIWT10_8 / PLR1 / WGM4 / DUMX256
#                                          → 17/40 fail  (42.5% fail rate)
#       geomean(norm_error over fails) = 0.51
#       max(norm_error over fails)     = 4.27e+18   (one catastrophic NaN-class
#                                                   blowup at m=488448; excluded
#                                                   from this test for workspace
#                                                   reasons)
#
# This tile + scheduler combo (PLR1 + WGM4) is *distinct from* the prior
# regression YAML's pin (PLR0 + WGM1), so the two files together cover both
# DUMX256 scheduler variants present in the Origami library on this branch.
#
# Comparison to yesterday's subtile-mxfp8-libraries build:
#   - Yesterday: DepthU=128 + SDURA=2 SDURB=2 → 310/327 fail (94.8%);
#     dominant tile MT256x256x128 / MIWT=[8,8] / PLR0 → 71/74 fail (95.9%).
#   - Today (DepthUMX translation): the same physical path (R=2, DU=128,
#     DUMX=256) still owns 91.1% of failures, but the per-tile concentration
#     is gentler -- MT256x256x128 dropped to 1/12 fail (8.3%) while
#     MT320x256x128 + PLR1 + WGM4 emerged as the new workhorse (17/40 fail).
#     The DepthUMX rename therefore preserved the bug but slightly reshuffled
#     which tile + scheduler combos hit it hardest.
#
# Expected behaviour:
#   - Before the bug is fixed: the verify step FAILS on at least the
#     non-bracket sizes below (TensileLite's overall test status becomes
#     FAIL once any size's verify fails, which is the point).
#   - After the bug is fixed: every size should pass verify and this test
#     turns green as a regression guard.
#
# NumElementsToValidate=-1 forces TensileLite to validate every element
# against the CPU/reference, matching how the bench-with-verify run that
# produced the source CSV detects the bug. KernelTime is on for the test
# harness but the test's pass/fail signal is correctness, not perf.
#
# Pinned ForkParameter values (mirror the failing kernel name token-by-token):
#   MatrixInstruction:    [16, 16, 128, 1, 1, 10, 8, 2, 2]
#                                  → MT320x256, MIWT=[10,8], MIWG=[2,2]
#   PrefetchGlobalRead:   [2]      → PGR2
#   PrefetchLocalRead:    [1]      → PLR1  (key difference vs companion YAML)
#   DepthU:               [128]
#   DepthUMX:             [256]    → DUMX256 (R = DepthUMX/DepthU = 2)
#   ScheduleIterAlg:      [3]      → SIA3
#   DirectToLds:          [1]      → DTLA1 / DTLB1
#   StreamK:              [3]      → SK3
#   StaggerU:             [0]      → SU0
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [4]      → WGM4  (key difference vs companion YAML)
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # MT320x256x128 / MIWT=[10,8] / MIWG=[2,2] / PLR1 / WGM4 — dominant
  # failing tile on the libs-merged DepthUMX bench-with-verify snapshot.
  #
  # 17 of 40 problems on this tile FAIL_VERIFY in the snapshot
  # (42.5% fail rate, geomean(norm_error)=0.51). All failing sizes have K
  # that is a multiple of DepthU=128, and several fail at K as small as
  # 768 (= 6 unrolls), so the bug does not require deep K-loops here --
  # unlike the prior regression which only triggered at K >= 1536.
  #
  # Sizes were drawn from /home/bnemanic/mxfp8_bench_libs_merged_with_verify.csv
  # at snapshot 144/1100 rows; the MT320x256x128 cluster had n=40 / fail=17
  # and the per-size norm_error annotated below is the bench-with-verify
  # measurement. The catastrophic 488448x5376x7936 case (norm_error
  # = 4.27e+18) is intentionally excluded because its destination-buffer
  # working set exceeds MaxWorkspaceSize=13 GiB.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 10, 8,  2, 2]  # MT 320x256, MIWT=[10,8], MIWG=[2,2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead:  [1]
        - DepthU: [128]
        - DepthUMX: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [4]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # ===== Failing sizes (drawn from MT320x256x128 cluster, sorted by norm_error desc) =====
          - Exact: [   71936,   4096, 1,  7168]   # snapshot norm_error = 0.0973   (largest finite-norm fail; K=56*DU)
          - Exact: [   12160,  14336, 1, 16128]   # snapshot norm_error = 0.0771   (K=126*DU, square-ish)
          - Exact: [  209536,   2048, 1,  1280]   # snapshot norm_error = 0.0744   (skinny, K=10*DU)
          - Exact: [   77312,   2816, 1,  1024]   # snapshot norm_error = 0.0494   (smallest work in the fail set, K=8*DU)
          - Exact: [   35328,  33664, 1,  6400]   # snapshot norm_error = 0.0454   (K=50*DU)
          - Exact: [  825216,   1536, 1,   768]   # snapshot norm_error = 0.0429   (very skinny, K=6*DU)
          - Exact: [  263296,   3712, 1,  4864]   # snapshot norm_error = 0.0318   (K=38*DU)
          - Exact: [   43776,  10624, 1,  6400]   # snapshot norm_error = 0.0279   (K=50*DU, rectangular)
          # ===== Control sizes (PASSed at this tile in the snapshot) =====
          # Bracket the failure on K and on aspect ratio. After the bug is
          # fixed these should still PASS (no regression on previously-good
          # behaviour). All three have snapshot norm_error well under 1e-4
          # i.e. comfortably below the fp8 numerical-noise floor.
          - Exact: [    7680,   5248, 1,  6144]   # snapshot PASS, norm_error ~ 6.0e-05 (small smoke, K=48*DU)
          - Exact: [    7808,   4864, 1,  6656]   # snapshot PASS, norm_error ~ 5.8e-05 (small smoke, K=52*DU)
          - Exact: [   13056,   7680, 1, 21504]   # snapshot PASS, norm_error ~ 7.6e-05 (deep K control, K=168*DU)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Prediction"

LibraryClient:
