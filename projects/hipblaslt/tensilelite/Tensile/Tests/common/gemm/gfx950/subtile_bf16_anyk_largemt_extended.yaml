TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

#######################################################################
# Subtile BF16 K-tail: extended large-MT coverage. Builds on
# `subtile_bf16_anyk_largemt.yaml` (which pins MT 320x288 VGPR-pressure
# regression at PGR=0 only) with:
#
#  1. MT 320x320 (10x10 wavetile, 2x2 WG): symmetric large MT that
#     stresses VGPR allocation (uses almost all available vgprs); pin
#     that no shape in this configuration is silently rejected by the
#     Solution-level gate.
#
#  2. PrefetchGlobalRead in {0, 1, 2}: tail-loop GR_inc differs across
#     prefetch depths, so the same shape must build at all three.
#
#  3. Larger K (multiple full main-loop iterations before the tail) so
#     the NGLL fast-path isn't bypassed and the GR_inc interaction with
#     the prefetch pipeline is genuinely exercised.
#
# DepthU is fixed at 64 (matches the existing largemt config) so the
# K-tail emit path is the same one the unit pins cover. Multi-partition
# DepthU layouts are explicitly out of scope for this PR.
#
# PrintSolutionRejectionReason is on so a VGPR-overflow rejection
# surfaces in the test log instead of silently dropping the kernel
# from the build set (errorCode 0).
#######################################################################
GlobalParameters:
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # Section 1 — MT 320x320, ASEM=2, PGR ∈ {0, 1, 2}.
  # K = N*DU + 2 across N ∈ {2, 4, 8} so NGLL fires (N>=2) and
  # GR_inc gets exercised under each prefetch depth.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 10, 10, 2, 2]  # MT 320x320 (2x2 WG)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 2*DU + 2 = 130 (NGLL active: 1 main-loop iter + tail)
          - Exact: [320, 320, 1, 130]
          # K = 4*DU + 2 = 258 (NGLL: 3 main-loop iters + tail)
          - Exact: [320, 320, 1, 258]
          # K = 8*DU + 2 = 514 (NGLL: 7 main-loop iters + tail)
          - Exact: [320, 320, 1, 514]

  ########################################
  # Section 2 — MT 320x320, ASEM=8, PGR ∈ {0, 1, 2}.
  # K = N*DU + 8 (coarse mask path; byte-refine gate rejects at
  # ASEM=8 since ASEM == numMIInUnroll).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 10, 10, 2, 2]  # MT 320x320 (2x2 WG)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [8]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 2*DU + 8 = 136
          - Exact: [320, 320, 1, 136]
          # K = 4*DU + 8 = 264
          - Exact: [320, 320, 1, 264]
          # K = 8*DU + 8 = 520
          - Exact: [320, 320, 1, 520]

  ########################################
  # Section 3 — MT 320x320, ASEM=1, PGR ∈ {0, 1, 2}.
  # Odd K_remain: byte-refine partial-mod chain (K%2 + K%1 paths).
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 10, 10, 2, 2]  # MT 320x320 (2x2 WG)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 2*DU + 1 = 129
          - Exact: [320, 320, 1, 129]
          # K = 4*DU + 1 = 257
          - Exact: [320, 320, 1, 257]
          # K = 8*DU + 1 = 513
          - Exact: [320, 320, 1, 513]

  ########################################
  # Section 4 — MT 320x288, ASEM=2, PGR ∈ {0, 1, 2}.
  # Extends the original largemt shape (subtile_bf16_anyk_largemt.yaml
  # only covers PGR=0) across all three prefetch depths at larger K to
  # exercise GR_inc under the full prefetch pipeline.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 5, 18,  4, 1]  # MT 320x288 (4x1 WG)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [2]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 2*DU + 2 = 130
          - Exact: [320, 288, 1, 130]
          # K = 4*DU + 2 = 258
          - Exact: [320, 288, 1, 258]
          # K = 8*DU + 2 = 514
          - Exact: [320, 288, 1, 514]
