# PartialRMS fused epilogue (K1): bf16 input, no residual, no quant.
# Groups are split by MT1 (Tensile PartialRMS pipeline constraint).
# All tiles: MT0%64==0, MT1%64==0.
# Deep-DepthU group (DepthU in {128,192}) covers MT1=128; larger tiles exceed LDS at these DepthU values.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 0
  PrintSolutionRejectionReason: True
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  BoundsCheck: 0
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:

  ########################################
  # Main — DepthU=64, PGR=[0,1,2], MT1=64
  ########################################
  -
    - # ProblemType — bf16 TN GEMM, PartialRMS (no residual add)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1,  4,  4, 1, 1]  # MT 64x64,   WG 1x1
            - [16, 16, 32, 1, 1,  3,  2, 2, 2]  # MT 96x64,   WG 2x2
            - [16, 16, 32, 1, 1,  6,  2, 2, 2]  # MT 192x64,  WG 2x2
            - [16, 16, 32, 1, 1,  6,  4, 4, 1]  # MT 384x64,  WG 4x1
            - [16, 16, 32, 1, 1,  9,  4, 4, 1]  # MT 576x64,  WG 4x1
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [True]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [320,  320, 1,  128]
            - Exact: [512,  512, 1,  512]
            - Exact: [1024, 1024, 1, 1024]
