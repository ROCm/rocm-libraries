#
# F4 subtile GEMM correctness.  Geometry is picked per operand from TLU{A,B}:
# free-dim contiguous (TLU=1) gets the stacked transpose-read layout, K-contiguous
# (TLU=0) gets the row-major one.  NT uses TLU=1 for both, TN TLU=0 for both, and
# NN / TT pair one of each.  Stack = MIWaveTile[0]; MT = 16 * stack * waveGroup.
# The 16x1 blocks are rectangular because acc VGPRs scale as MIWT[0]*MIWT[1]*4.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]   # MT 32x32
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT 64x64  (2x2 strips)
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128 wg2x2 (4 waves)
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT 256x256 wg2x2 (129KB LDS, 496 VGPR)
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 1 wave
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [256, 256, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 16, 2,  1, 1]   # MT 256x32  1 wave  (73KB LDS)
          - [16, 16, 128, 1,  1, 16, 4,  1, 1]   # MT 256x64  1 wave  (81KB LDS)
          - [16, 16, 128, 1,  1, 16, 2,  2, 2]   # MT 512x64  wg2x2   (145KB LDS)
          - [16, 16, 128, 1,  1, 16, 4,  2, 2]   # MT512x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 64, 1, 256]
          - Exact: [1024, 128, 1, 512]

  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 16, 2,  1, 1]   # MT 256x32  1 wave  (145KB LDS)
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 32, 1, 512]
          - Exact: [512, 64, 1, 1024]

  -
    - # ProblemType (macro tile 96 on either dim: MIWaveTile 6, 3 strips per wave)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 6,  1, 1]   # MT32x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  1, 1]   # MT64x96 wg1x1
          - [16, 16, 128, 1,  1, 2, 6,  2, 1]   # MT64x96 wg2x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 1]   # MT96x32 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 1]   # MT96x64 wg1x1
          - [16, 16, 128, 1,  1, 6, 2,  1, 2]   # MT96x64 wg1x2
          - [16, 16, 128, 1,  1, 6, 6,  1, 1]   # MT96x96 wg1x1
          - [16, 16, 128, 1,  1, 6, 8,  1, 1]   # MT96x128 wg1x1
          - [16, 16, 128, 1,  1, 6, 4,  1, 2]   # MT96x128 wg1x2
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 6, 12, 1, 1]   # MT96x192 wg1x1 (multi-wave straddles)
          - [16, 16, 128, 1,  1, 6, 8,  1, 2]   # MT96x256 wg1x2
          - [16, 16, 128, 1,  1, 6, 4,  1, 4]   # MT96x256 wg1x4
          - [16, 16, 128, 1,  1, 8, 6,  1, 1]   # MT128x96 wg1x1
          - [16, 16, 128, 1,  1, 4, 6,  2, 1]   # MT128x96 wg2x1
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
          - [16, 16, 128, 1,  1, 12, 6, 1, 1]   # MT192x96 wg1x1 (multi-wave straddles)
          - [16, 16, 128, 1,  1, 8, 6,  2, 1]   # MT256x96 wg2x1
          - [16, 16, 128, 1,  1, 4, 6,  4, 1]   # MT256x96 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]

  -
    - # ProblemType (macro tile 96 at 4 waves, DepthU 512: the fetch group is
      # spread over both the K slices of a window AND several K windows, so a
      # wave issues more than one window at a per-wave window offset.)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 6, 2,  1, 4]   # MT96x128 wg1x4
          - [16, 16, 128, 1,  1, 2, 6,  4, 1]   # MT128x96 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [512]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [384, 768, 1, 512]
          - Exact: [384, 768, 1, 1024]

  -
    - # ProblemType (MT192: MIWaveTile 12, strip 4, 3 strips per wave)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 256, 1, 256]
          - Exact: [384, 512, 1, 512]
  -
    - # Prefetch cross product.  PGR double-buffers LDS, PLR double-buffers the
      # MFMA operand registers, so both change the GR/LR schedule and the LDS
      # buffer swap rather than the subtile layout itself.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   1 wave
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
  -
    - # TT: A K-contig (TLU=0, row-major), B free-contig (TLU=1, stacked)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
  -
    - # Edge and tail coverage.  Every other block sizes M, N and K to whole
      # macro tiles and whole DepthU, so neither the M/N edge nor the tail loop
      # is reached; the buffer limits and the tail masking are untested there.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [200, 256, 1, 256]   # M edge
          - Exact: [256, 200, 1, 256]   # N edge
          - Exact: [256, 256, 1, 320]   # K tail (320 = DepthU + 64)
          - Exact: [256, 256, 1, 384]   # K tail (384 = DepthU + 128)
          - Exact: [200, 200, 1, 320]   # M and N edge with a K tail
