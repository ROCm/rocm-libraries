TestParameters:
  marks: [skip-gfx1250, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  KeepBuildTmp: True
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  MXScaleFormat: 1

BenchmarkProblems:
  -
    - # FP4 TN with host-pre-swizzled B
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SwizzleTensorB: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 2, 1, 4] # MIWT 2x2, WG 1x4, MT 32x128
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [1]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - InnerUnroll: [1]
        - UseSubtileImpl: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 128, 1, 256]

  -
    - # MT256x256: one M wave and four N waves, with two rolling B VGPR banks
      OperationType: GEMM
      DataType: F4
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SwizzleTensorB: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 16, 4, 1, 4] # MIWT 16x4, WG 1x4, MT 256x256
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [1]
        - DirectToLds: [1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [SingleBuffer]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - InnerUnroll: [1]
        - UseSubtileImpl: [True]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [257, 255, 1, 512]
