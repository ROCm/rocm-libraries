TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  NumWarmups: 1
  NumBenchmarks: 1
  SyncsPerBenchmark: 0
  EnqueuesPerSync: 1
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  CMakeBuildType: Release
  KernelTime: True
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 8, 8, 2, 2]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - ExpandPointerSwap: [false]
        - TransposeLDS: [1]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - WorkGroupMapping: [1]
        - WorkGroupMappingXCC: [1]
        - 1LDSBuffer: [0]
        - SourceSwap: [true]
        - UseCustomMainLoopSchedule: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 3072]
