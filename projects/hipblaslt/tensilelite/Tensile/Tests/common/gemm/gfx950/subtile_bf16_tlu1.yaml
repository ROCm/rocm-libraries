#
# bf16 subtile GEMM correctness on NT, where both operands are free-dim
# contiguous (TLU=1) and take the stacked transpose-read layout.
# subtile_bf16.yaml covers TN, where neither operand is.
#
# The MFMA is shared with the MX F4 TLU=1 suite (both are 16x16 with a 4-VGPR
# operand); what differs is the byte geometry.  bf16 reads LDS with
# ds_read_b64_tr_b16 -- gfx950 has no 128-bit transpose-16 form -- so two reads
# fill an operand, and a strip already covers a 128B cache line at 4 MFMA-M
# tiles, which caps the stack at 4.  Stack is derived from the macro tile, so
# MT = 16 * MIWaveTile * waveGroup drives which of the two stacks is selected.
#
# Unlike fp4 there is no even-free-dim requirement (that one comes from two fp4
# sharing a byte), so odd M/N sizes are covered here on purpose.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # NT, power-of-two macro tiles across wave groups.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1, stack 2
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1, stack 4
          - [16, 16, 32, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 128]

  -
    - # NT, skewed and tall tiles.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 32, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 32, 1,  1, 2, 8,  1, 1]   # MT32x128  wg1x1
          - [16, 16, 32, 1,  1, 8, 2,  1, 1]   # MT128x32  wg1x1
          - [16, 16, 32, 1,  1, 2, 4,  2, 1]   # MT64x64   wg2x1
          - [16, 16, 32, 1,  1, 4, 2,  1, 2]   # MT64x64   wg1x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, DepthU sweep.  TLU=1 sets numSubIterK=1, so the unit is one
      # MatrixInstK (32) rather than the fp4 suite's 256.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [32, 128, 256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]

  -
    - # NT, prefetch cross product.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, non-power-of-two macro tiles (MIWaveTile 3 and 6).
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 32, 1,  1, 3, 3,  2, 2]   # MT96x96   wg2x2
          - [16, 16, 32, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2
          - [16, 16, 32, 1,  1, 6, 4,  1, 1]   # MT96x64   wg1x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 192, 1, 256]
          - Exact: [384, 384, 1, 128]

  -
    - # NT, M/N edge and K tail, including odd free-dim extents.  fp4 forbids
      # odd M/N (two fp4 per byte); bf16 does not, so cover them here.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 1, 1, 64]
          - Exact: [17, 33, 1, 96]
          - Exact: [65, 129, 1, 160]
          - Exact: [127, 63, 1, 224]
          - Exact: [255, 257, 1, 288]

  -
    - # NT, batched and StreamK.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - WorkGroupMapping: [1, 8]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 3, 256]
          - Exact: [128, 128, 5, 512]

  -
    - # NT, f32 output.
      OperationType: GEMM
      DataType: b
      DestDataType: s
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, epilogue knobs: bias, activation, scale-alpha-vec.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s]
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [0]
        - WorkGroupMapping: [8]
        - WorkGroupMappingXCC: [1]
        - ActivationFuncCall: [false]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
        - BiasTypeArgs: ['s']
