#
# bf16 subtile GEMM correctness on the layouts with a free-dim contiguous
# operand: NT (both operands), NN (A) and TT (B).  subtile_bf16.yaml covers TN,
# where neither operand is.
#
# Geometry is picked per operand from TLU{A,B}: free-dim contiguous (TLU=1) gets
# the stacked transpose-read layout, K-contiguous (TLU=0) the row-major one, so
# the NN and TT groups put the two operands on different geometries in one
# kernel.  Mirrors subtile_mxfp4_tlu1.yaml.
#
# The MFMA is shared with the MX F4 TLU=1 suite (both are 16x16 with a 4-VGPR
# operand); what differs is the byte geometry.  bf16 reads LDS with
# ds_read_b64_tr_b16 -- gfx950 has no 128-bit transpose-16 form -- so two reads
# fill an operand, and a strip already covers a 128B cache line at 4 MFMA-M
# tiles, which caps the stack at 4.  Stack is derived from the macro tile, so
# MT = 16 * MIWaveTile * waveGroup drives which of the two stacks is selected.
#
# Unlike fp4 there is no even-free-dim requirement (that one comes from two fp4
# sharing a byte), so odd M/N sizes are covered here on purpose.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeBias: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # NT, power-of-two macro tiles across wave groups.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1, stack 2
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1, stack 4
          - [16, 16, 32, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 128]

  -
    - # NT, skewed and tall tiles.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 32, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 32, 1,  1, 2, 8,  1, 1]   # MT32x128  wg1x1
          - [16, 16, 32, 1,  1, 8, 2,  1, 1]   # MT128x32  wg1x1
          - [16, 16, 32, 1,  1, 2, 4,  2, 1]   # MT64x64   wg2x1
          - [16, 16, 32, 1,  1, 4, 2,  1, 2]   # MT64x64   wg1x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, DepthU sweep.  TLU=1 sets numSubIterK=1, so the unit is one
      # MatrixInstK (32) rather than the fp4 suite's 256.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [32, 128, 256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 512]

  -
    - # NT, prefetch cross product.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, non-power-of-two macro tiles (MIWaveTile 3 and 6).
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 6, 6,  1, 1]   # MT96x96   wg1x1
          - [16, 16, 32, 1,  1, 3, 3,  2, 2]   # MT96x96   wg2x2
          - [16, 16, 32, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2
          - [16, 16, 32, 1,  1, 6, 4,  1, 1]   # MT96x64   wg1x1
          # 16*odd free dims.  The stack cannot divide an odd tile count, so the
          # last strip is a partial one whose surplus M tiles are fetched and
          # never read.  That only resolves when the axis has a single wave,
          # hence wg1 on whichever dim is 144 or 176.
          - [16, 16, 32, 1,  1, 9,  2,  1, 4]  # MT144x128 wg1x4
          - [16, 16, 32, 1,  1, 2,  9,  4, 1]  # MT128x144 wg4x1
          - [16, 16, 32, 1,  1, 11, 2,  1, 4]  # MT176x128 wg1x4
          - [16, 16, 32, 1,  1, 2, 11,  4, 1]  # MT128x176 wg4x1
          - [16, 16, 32, 1,  1, 9,  4,  1, 4]  # MT144x256 wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 192, 1, 256]
          - Exact: [384, 384, 1, 128]
          - Exact: [1152, 1152, 1, 256]  # 144*8 / 176*6.5 -- aligned for 144
          - Exact: [1000, 1000, 1, 256]  # divides neither 144 nor 176
          - Exact: [145, 177, 1, 256]    # one element past a single tile
          - Exact: [1152, 1152, 1, 288]  # K tail on top of the free-dim edge

  -
    - # NT, M/N edge and K tail, including odd free-dim extents.  fp4 forbids
      # odd M/N (two fp4 per byte); bf16 does not, so cover them here.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1, 1, 1, 64]
          - Exact: [17, 33, 1, 96]
          - Exact: [65, 129, 1, 160]
          - Exact: [127, 63, 1, 224]
          - Exact: [255, 257, 1, 288]

  -
    - # NT, batched and StreamK.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - WorkGroupMapping: [1, 8]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 3, 256]
          - Exact: [128, 128, 5, 512]

  -
    - # NT, f32 output.
      OperationType: GEMM
      DataType: b
      DestDataType: s
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]

  -
    - # NT, epilogue knobs: bias, activation, scale-alpha-vec.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseBias: 1
      BiasDataTypeList: [s]
      ActivationType: hipblaslt_all
      UseScaleAlphaVec: 1

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [0]
        - WorkGroupMapping: [8]
        - WorkGroupMappingXCC: [1]
        - ActivationFuncCall: [false]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
        - BiasTypeArgs: ['s']

  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major), so the
      # two operands take different geometries in the same kernel.  Unlike fp4
      # neither dim carries an even-extent assert, so both M and N may be odd.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 32, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 32, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 32, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 32, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseCustomMainLoopSchedule: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [256, 255, 1, 256]   # odd N
          - Exact: [255, 256, 1, 256]   # odd M, legal for bf16 unlike fp4
          - Exact: [256, 33,  1, 256]   # small odd N
          - Exact: [256, 200, 2, 256]   # batch with an N edge
          - Exact: [256, 511, 3, 256]   # odd N with batch 3
          # K tails.  B is the K-contiguous operand here, and the bf16 boundary
          # fixup is skipped whenever either operand is TLU=1, so a partial K
          # window is exactly where a mixed layout would lose its last element.
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [256, 256, 1, 272]   # 16-element K tail
          - Exact: [256, 255, 1, 352]   # odd N against a K tail

  -
    - # TT: the mirror of the NN group -- A K-contig (TLU=0, row-major), B
      # free-contig (TLU=1, stacked).  Non-power-of-two now belongs to N.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]   # MT32x32   wg1x1
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 32, 1,  1, 2, 2,  2, 2]   # MT64x64   wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 32, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
          - [16, 16, 32, 1,  1, 4, 4,  4, 1]   # MT256x64  wg4x1
          - [16, 16, 32, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2
          # Non-power-of-two on N, the contiguous dim here; the N wave group
          # has to be 1 for it.
          - [16, 16, 32, 1,  1, 4, 12,  4, 1]  # MT256x192 wg4x1
          - [16, 16, 32, 1,  1, 4, 14,  4, 1]  # MT256x224 wg4x1
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0, 1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseCustomMainLoopSchedule: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [256, 192, 1, 256]
          - Exact: [256, 224, 1, 256]
          - Exact: [255, 256, 1, 256]   # odd M
          - Exact: [256, 255, 1, 256]   # odd N
          - Exact: [33,  256, 1, 256]   # small odd M
          - Exact: [200, 256, 2, 256]   # batch with an M edge
          - Exact: [511, 256, 3, 256]   # odd M with batch 3
          - Exact: [256, 256, 1, 288]   # 32-element K tail
          - Exact: [256, 256, 1, 272]   # 16-element K tail
          - Exact: [255, 256, 1, 352]   # odd M against a K tail

  -
    - # NT, wide macro-tile sweep.  Sampled at an even stride across every
      # tile/wave-group combination the TLU=1 path admits, so the spread covers
      # all six wave groups and the full 32..256 range rather than clustering.
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]   # MT32x32 wg1x1
          - [16, 16, 32, 1,  1, 2, 10,  1, 1]   # MT32x160 wg1x1
          - [16, 16, 32, 1,  1, 2, 15,  1, 1]   # MT32x240 wg1x1
          - [16, 16, 32, 1,  1, 4, 8,  1, 1]   # MT64x128 wg1x1
          - [16, 16, 32, 1,  1, 4, 13,  1, 1]   # MT64x208 wg1x1
          - [16, 16, 32, 1,  1, 6, 4,  1, 1]   # MT96x64 wg1x1
          - [16, 16, 32, 1,  1, 8, 2,  1, 1]   # MT128x32 wg1x1
          - [16, 16, 32, 1,  1, 9, 4,  1, 1]   # MT144x64 wg1x1
          - [16, 16, 32, 1,  1, 11, 2,  1, 1]   # MT176x32 wg1x1
          - [16, 16, 32, 1,  1, 13, 4,  1, 1]   # MT208x64 wg1x1
          - [16, 16, 32, 1,  1, 16, 2,  1, 1]   # MT256x32 wg1x1
          - [16, 16, 32, 1,  1, 1, 6,  2, 2]   # MT32x192 wg2x2
          - [16, 16, 32, 1,  1, 2, 6,  2, 2]   # MT64x192 wg2x2
          - [16, 16, 32, 1,  1, 4, 6,  2, 2]   # MT128x192 wg2x2
          - [16, 16, 32, 1,  1, 6, 6,  2, 2]   # MT192x192 wg2x2
          - [16, 16, 32, 1,  1, 8, 6,  2, 2]   # MT256x192 wg2x2
          - [16, 16, 32, 1,  1, 4, 1,  1, 4]   # MT64x64 wg1x4
          - [16, 16, 32, 1,  1, 6, 4,  1, 4]   # MT96x256 wg1x4
          - [16, 16, 32, 1,  1, 9, 2,  1, 4]   # MT144x128 wg1x4
          - [16, 16, 32, 1,  1, 11, 1,  1, 4]   # MT176x64 wg1x4
          - [16, 16, 32, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
          - [16, 16, 32, 1,  1, 14, 2,  1, 4]   # MT224x128 wg1x4
          - [16, 16, 32, 1,  1, 16, 1,  1, 4]   # MT256x64 wg1x4
          - [16, 16, 32, 1,  1, 1, 6,  4, 1]   # MT64x96 wg4x1
          - [16, 16, 32, 1,  1, 1, 12,  4, 1]   # MT64x192 wg4x1
          - [16, 16, 32, 1,  1, 2, 2,  4, 1]   # MT128x32 wg4x1
          - [16, 16, 32, 1,  1, 2, 10,  4, 1]   # MT128x160 wg4x1
          - [16, 16, 32, 1,  1, 2, 15,  4, 1]   # MT128x240 wg4x1
          - [16, 16, 32, 1,  1, 4, 8,  4, 1]   # MT256x128 wg4x1
          - [16, 16, 32, 1,  1, 4, 13,  4, 1]   # MT256x208 wg4x1
