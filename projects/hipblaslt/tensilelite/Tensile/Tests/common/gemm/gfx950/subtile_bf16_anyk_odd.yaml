TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250] # not supported by arch

#######################################################################
# Subtile BF16 K-tail: odd K (ASEM=1). Exercises the runtime-gated
# hi16 clear in `_emitTailByteShiftMaskSubtile` Step 2.
#######################################################################
GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  DataInitTypeBias: 1
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  #PrintSolutionRejectionReason: True
  #GenerateSourcesAndExit: False
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # BF16 TN — no bias, DU = 2*MI_K = 64
  #
  # K total values: K ∈ {1, 3, 7, 17, 31, 33, 35, 65, 97, 129}
  # covering:
  #   - single-element K (K=1): the canonical odd-K case;
  #   - just-under-DU K (K=31, K=33): tail iter only, with byte-mask
  #     boundary near the lane-mask boundary;
  #   - K ∈ {65, 97}: one main iter + odd K_remain;
  #   - K = 129: two main iters + K_remain = 1.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          # 1x1 wave group
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]  # MT 64x64
          # 2x2 wave group
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K = 1 (single-element K, tail-only, no main iters)
          - Exact: [128, 128, 1,   1]
          # K = 3, 7 (small odd K, tail-only)
          - Exact: [128, 128, 1,   3]
          - Exact: [128, 128, 1,   7]
          # K = 17, 31, 33, 35 (tail-only or 1*DU + small tail)
          - Exact: [128, 128, 1,  17]
          - Exact: [128, 128, 1,  31]
          - Exact: [128, 128, 1,  33]
          - Exact: [128, 128, 1,  35]
          # K = 65 (1*DU + 1)
          - Exact: [128, 128, 1,  65]
          # K = 97 (1*DU + 33)
          - Exact: [128, 128, 1,  97]
          # K = 129 (2*DU + 1)
          - Exact: [128, 128, 1, 129]
          # Asymmetric M/N
          - Exact: [128,  32, 1,  33]
          # Batched
          - Exact: [128, 128, 2,  33]

  ########################################
  # BSS TN — BF16 input, F32 output, DU = 2*MI_K = 64
  #
  # Minimal wavetile coverage.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0, 3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - AssertSummationElementMultiple: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1,   1]
          - Exact: [128, 128, 1,  33]
          - Exact: [128, 128, 1,  97]
