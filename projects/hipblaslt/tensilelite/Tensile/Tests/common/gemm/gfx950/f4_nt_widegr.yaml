#
# SubtileWideGR correctness coverage over the MT x wave-group matrix.
#
# The GR strip always spans the whole macro-tile free dim (G = MacroTile/instM)
# while LR stays at the per-wave stack (L = MIWaveTile[0]), so the contiguous
# run one buffer_load covers is set by the macro tile alone and no longer
# shrinks as waves are added:
#   MT64x64   ->  GR 4x1  ->  64 elem ( 32B),  LR 2x1 (wg2x2) or 1x1 (wg4x4)
#   MT128x128 ->  GR 8x1  -> 128 elem ( 64B),  LR 4x1 (wg2x2) or 2x1 (wg4x4)
#   MT256x256 ->  GR 16x1 -> 256 elem (128B),  LR 8x1 (wg2x2) or 4x1 (wg4x4)
# 256 fp4 elements is one full 128B cacheline.
#
# Every config is bank-conflict free: col_scatter reaches 1-way at stacks 2, 4,
# 8 and 16 alike, and its load index enters only as an additive K-column shift
# so it survives the loads being split across waves.  Verified 0
# SQ_LDS_BANK_CONFLICT on all six.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]
GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  2,  2, 2]   # MT64x64   wg2x2 GR4/LR2
          - [16, 16, 128, 1,  1,  1,  1,  4, 4]   # MT64x64   wg4x4 GR4/LR1
          - [16, 16, 128, 1,  1,  4,  4,  2, 2]   # MT128x128 wg2x2 GR8/LR4
          - [16, 16, 128, 1,  1,  2,  2,  4, 4]   # MT128x128 wg4x4 GR8/LR2
          - [16, 16, 128, 1,  1,  8,  8,  2, 2]   # MT256x256 wg2x2 GR16/LR8
          - [16, 16, 128, 1,  1,  4,  4,  4, 4]   # MT256x256 wg4x4 GR16/LR4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - SubtileWideGR: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [512, 512, 1, 256]
