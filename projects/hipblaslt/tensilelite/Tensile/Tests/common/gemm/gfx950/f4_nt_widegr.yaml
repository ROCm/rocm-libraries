#
# SubtileWideGR correctness coverage.  The GR strip spans the full macro-tile
# free dim (G = stack * waveGroup) while LR keeps the per-wave stack, so one
# buffer_load covers G*16 contiguous fp4 elements:
#   MT64x64   -> GR 4x1  / LR 2x1 ->  64 elem ( 32B)
#   MT128x128 -> GR 8x1  / LR 4x1 -> 128 elem ( 64B)
#   MT256x256 -> GR 16x1 / LR 8x1 -> 256 elem (128B = one cacheline)
# The waves sharing a strip split its K rows.  col_scatter carries over to this
# layout unchanged -- its load index enters purely additively as a K-column
# shift -- so GR 8x1/16x1 are conflict-free (verified 0 SQ_LDS_BANK_CONFLICT).
# GR 4x1 falls back to no swizzle: its XOR acts on a chunk bit the wave itself
# supplies, which an after-the-fact offset cannot express.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]
GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
BenchmarkProblems:
  -
    - OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64   -> GR 4x1  / LR 2x1
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 -> GR 8x1  / LR 4x1
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 -> GR 16x1 / LR 8x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [128]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
        - SubtileWideGR: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]
          - Exact: [512, 512, 1, 512]
