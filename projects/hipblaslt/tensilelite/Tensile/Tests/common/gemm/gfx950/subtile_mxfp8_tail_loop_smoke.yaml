########################################
# MXFP8 SubtileImpl tail-loop smoke — MT128x128 / DU=256 / PGR=1.
#
# Exercises the MXFP8 tail-loop path introduced for BF16/MXFP4 by PR 7683
# (commit 9b8832cf128 on develop, "[SubtileImpl][TailLoop] Add tail loop
# support for SubtileImpl"). The orchestration is dtype-agnostic but the
# upstream verification covers only BF16 + MXFP4; this smoke (5 problem
# sizes, ~1 min) is the minimum coverage that catches any MXFP8-specific
# drift across the {full-tail, main+tail, main-only} buckets.
#
# Geometry is pinned to PR 7656's primary MXFP8 case
# (users/psandhu/subtile_fp8_min_fix: MT128x128 / DU=256, "[SubtileImpl]
# Add plain-FP8 / MXFP8 MT128x128 + DU=256 path"). DepthU=256 + FP8 implies
# numSubIterK=1, duUnit = 1 * MatrixInstK * LSU = 128 < DU so the multi-DU
# split is *not* triggered here — this is the single-DU tail-loop path.
#
# Pinned ForkParameter values:
#   MatrixInstruction:    [16, 16, 128, 1, 1, 4, 4, 2, 2]   → MT128x128, MIWT=[4,4], MIWG=[2,2]
#   PrefetchGlobalRead:   [1]
#   PrefetchLocalRead:    [1]
#   DepthU:               [256]    → 2 * MatrixInstK = 256
#   ScheduleIterAlg:      [3]      → SIA3
#   DirectToLds:          [1]
#   StreamK:              [3]      → SK3
#   StaggerU:             [0]
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]
#
# K-bucket coverage (K % DU ∈ {0, 32}):
#   * K=128  — full tail, no main loop (K < DU).
#   * K=288  — 1 main iter + 32-element tail.
#   * K=512  — 2 main iters, no tail (control).
#   * K=544  — 2 main iters + 32-element tail.
#   * K=768  — 3 main iters, no tail (control).
#
# 32-element tail granularity = MX block size; PR 7683 set
# Solution.minASEMforMX = 32 (Solution.py ~698) so this is the finest tail
# granularity supported under UseSubtileImpl.
#
# PR 7781 + PR 7656 + PR 7683 verification status (gfx950, freshly rebuilt
# tensilelite-client at HEAD of users/bnemanich/mxfp8-tail-loop-test):
#
#   K=128 (full tail, no main): PASS
#   K=288 (1 main + 32 tail) : FAIL  889 / 16384 wrong (5.4%)
#   K=512 (2 main, no tail)  : FAIL 1421 / 16384 wrong (8.7%)
#   K=544 (2 main + 32 tail) : FAIL 1262 / 16384 wrong (7.7%)
#   K=768 (3 main, no tail)  : FAIL 1977 / 16384 wrong (12.1%)
#
# Note: the K=512 and K=768 cases trigger ZERO tail loop iterations
# (K % DU == 0) yet still fail with wrong-count growing linearly in K.
# This is NOT the tail loop — it is a main-loop regression that affects
# MXFP8 MT128x128 / DU=256 at K >= DU, regardless of PGR or PLR.
#
# Triage data (held constant: MT128x128, DU=256, MXScaleFormat=1,
# DataInit=Random, gfx950 / dev0):
#
# 1. Same K, same problem size, different PGR:
#      PGR=1 PLR=1 K=256: FAIL 681 wrong values
#      PGR=2 PLR=1 K=256: FAIL 681 wrong values  ← identical count
#    Different PGR schedules produce IDENTICAL wrong-value counts, which
#    points away from the SubtileImpl scheduler (the only path PGR varies
#    over) and toward a kernel-vs-reference disagreement that is constant
#    in the scheduler choice.
#
# 2. DataInitType=AllOnes (1) instead of Random (3): all K PASS.
#    Random-data sensitivity at K >= DU is consistent with either a CPU
#    reference path that mismatches the kernel for random MX scales, or
#    a kernel data-path bug that ones-data masks because 1.0 * 1.0 = 1.0
#    and the accumulator just counts.
#
# 3. MXFP4 sibling test, same kernel scheduler, same MT/DU/PGR/PLR
#    (subtile_mxfp4.yaml-style config):
#      K=256 (1*DU, no tail): PASS
#      K=512 (2*DU, no tail): PASS
#      K=288 (1*DU + tail)  : FAIL  415 / 65536 wrong (0.6%)
#    MXFP4 main loop is clean and only the tail trips up the validator at
#    a much smaller error rate. MXFP8's MAIN-LOOP wrong-count is an
#    order of magnitude larger and grows linearly in K, distinguishing
#    it from a tail-only or precision-only effect.
#
# 4. Pre-existing subtile_mxfp8_correctness_regression.yaml (which the v2
#    docstring records as 5/5 PASS at ce19b77af42) now fails to compile
#    one of its solutions with "overflowed resources, errorCode=4, msg=
#    Occupancy limit, vgprs=289" — a fresh symptom that the merge changed
#    VGPR pressure on the MT256x256 PGR=1 PLR=0 path.
#
# Most likely root causes (none confirmed; this is a triage record, not
# a fix prescription):
#
#   * PR 7781 commit b937a0c8b3a "[Reference] Enable fast CPU GEMM path
#     for MX-scaled problems" enabled a new CPU reference path for
#     MX-scaled GEMMs. The plan flagged this commit as "straightforward,
#     no overlap with PR 7656". Behavior with the PR 7656 + PR 7683
#     merges has not been re-validated and is consistent with a
#     reference-side regression on MXFP8 random data.
#
#   * PR 7644 (#7644, "Exclude F6 from data initialization using
#     mxDataGenerator") changed `isMXProblem` → `isMXProblemExceptF6` in
#     DataInitialization.cpp / ReferenceValidator.cpp; the F8 path still
#     enters mxDataGenerator, but the surrounding restride /
#     pre-swizzle bookkeeping added by PR 7683 may interact differently
#     than the plain `isMXProblem` it was tested against.
#
#   * PR 7683 added `restrideMXScaleBufferKFast` for K-fast layouts
#     when compactKBlocks != paddedKBlocks. For K=256 with MX block=32
#     compactKBlocks=8 already equals paddedKBlocks=8 so the restride
#     is a no-op; however the surrounding control flow added by the
#     same patch (around `initializeMXData`) runs unconditionally and
#     may touch MXFP8 scale buffers in a new way.
#
# Status: BLOCKED on this baseline regression. Per plan Step 7, the work
# scopes beyond a small targeted fix (≤1 commit, ~50 lines) because the
# failure is in the MAIN LOOP, not the tail loop the plan was meant to
# enable. The tail-loop emit_mask_k / scale-mask / SRD kPad triage
# suggested by the plan is moot until the main-loop baseline is restored.
# Yamls and triage data are committed so the next worker has a starting
# point (likely action: bisect PR 7781 `b937a0c8b3a` against PR 7656 +
# PR 7683 to localize the regression).
########################################

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  ########################################
  # MXFP8 TN — MT128x128, DU=256, PGR=1 tail-loop smoke.
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT 128x128, MIWT=[4,4], MIWG=[2,2]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead:  [1]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - WorkGroupMapping: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # K-bucket coverage (32-element MX block tail granularity).
          - Exact: [128, 128, 1, 128]   # K=128: full tail, no main (K < DU)
          - Exact: [128, 128, 1, 288]   # K=288: 1*DU + 32 tail
          - Exact: [128, 128, 1, 512]   # K=512: 2*DU, no tail (control)
          - Exact: [128, 128, 1, 544]   # K=544: 2*DU + 32 tail
          - Exact: [128, 128, 1, 768]   # K=768: 3*DU, no tail (control)

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "Prediction"

