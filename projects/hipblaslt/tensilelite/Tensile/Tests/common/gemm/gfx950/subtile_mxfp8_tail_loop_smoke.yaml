########################################
# MXFP8 SubtileImpl tail-loop smoke — MT128x128 / DU=256 / PGR=1.
#
# Exercises the MXFP8 tail-loop path introduced for BF16/MXFP4 by PR 7683
# (commit 9b8832cf128 on develop, "[SubtileImpl][TailLoop] Add tail loop
# support for SubtileImpl"). The orchestration is dtype-agnostic but the
# upstream verification covers only BF16 + MXFP4; this smoke (5 problem
# sizes, ~1 min) is the minimum coverage that catches any MXFP8-specific
# drift across the {full-tail, main+tail, main-only} buckets.
#
# Geometry is pinned to PR 7656's primary MXFP8 case
# (users/psandhu/subtile_fp8_min_fix: MT128x128 / DU=256, "[SubtileImpl]
# Add plain-FP8 / MXFP8 MT128x128 + DU=256 path"). DepthU=256 + FP8 implies
# numSubIterK=1, duUnit = 1 * MatrixInstK * LSU = 128 < DU so the multi-DU
# split is *not* triggered here — this is the single-DU tail-loop path.
#
# Pinned ForkParameter values:
#   MatrixInstruction:    [16, 16, 128, 1, 1, 4, 4, 2, 2]   → MT128x128, MIWT=[4,4], MIWG=[2,2]
#   PrefetchGlobalRead:   [1]
#   PrefetchLocalRead:    [1]
#   DepthU:               [256]    → 2 * MatrixInstK = 256
#   ScheduleIterAlg:      [3]      → SIA3
#   DirectToLds:          [1]
#   StreamK:              [3]      → SK3
#   StaggerU:             [0]
#   UseSubtileImpl:       [1]
#   WorkGroupMapping:     [1]
#
# K-bucket coverage (K % DU ∈ {0, 32}):
#   * K=128  — full tail, no main loop (K < DU).
#   * K=288  — 1 main iter + 32-element tail.
#   * K=512  — 2 main iters, no tail (control).
#   * K=544  — 2 main iters + 32-element tail.
#   * K=768  — 3 main iters, no tail (control).
#
# 32-element tail granularity = MX block size; PR 7683 set
# Solution.minASEMforMX = 32 (Solution.py ~698) so this is the finest tail
# granularity supported under UseSubtileImpl.
#
# PR 7781 + PR 7656 + PR 7683 verification status (gfx950, freshly rebuilt
# tensilelite-client at HEAD of users/bnemanich/mxfp8-tail-loop-test).
#
# Pre-fix (HEAD ce357febed1, before main-loop regression was diagnosed):
#   K=128 (full tail, no main): PASS
#   K=288 (1 main + 32 tail) : FAIL  889 / 16384 wrong (5.4%)
#   K=512 (2 main, no tail)  : FAIL 1421 / 16384 wrong (8.7%)
#   K=544 (2 main + 32 tail) : FAIL 1262 / 16384 wrong (7.7%)
#   K=768 (3 main, no tail)  : FAIL 1977 / 16384 wrong (12.1%)
#
# Post-main-loop-fix (after [SubtileImpl] Fix single-DU per_uid_k
# regression in emit_lr + NLL lr_inc PGR=1 gating):
#   K=128 (full tail, no main): PASS
#   K=288 (1 main + 32 tail) : FAIL   88 / 16384 wrong (0.5%)  <-- tail-only
#   K=512 (2 main, no tail)  : PASS
#   K=544 (2 main + 32 tail) : FAIL   63 / 16384 wrong (0.4%)  <-- tail-only
#   K=768 (3 main, no tail)  : PASS
#
# Post-data-mask-fix (after [SubtileImpl][TailLoop] Skip data K-mask
# for MX-scaled paths; rely on host scale zero-pad to neutralise OOB):
#   K=128 PASS, K=288 PASS, K=512 PASS, K=544 PASS, K=768 PASS  (5/5)
#
# Main-loop regression diagnosis and fix (the LARGE wrong-counts):
#
# Bisecting against origin/users/psandhu/subtile_fp8_min_fix (PR 7656 head)
# showed the smoke yaml at PR 7656 head ALSO produced exactly 88 / 63 wrong
# values for K=288 / K=544 (matching the post-fix tail residual) but PASSED
# K=512 / K=768. The merge of PR 7656 INTO our branch is what broke the
# main-loop cases — not PR 7781's b937a0c8b3a Reference.cpp fast-path nor
# PR 7644 / PR 7683 data-init changes. Forcing the slow CPU reference for
# MX problems (`rejectFast("MX_block")`) reproduced the same wrong counts,
# ruling out the reference-fast-path hypothesis.
#
# Root cause: at the merge `8b5096882e8`, the conflict resolution kept
# parent-1 (PR 7781)'s `local_k = k % per_uid_k` modulo in
# `InstructionEmitter.emit_lr` together with parent-2 (PR 7656)'s code
# elsewhere. Under multi-DU (`numUnroll>1`) the modulo correctly folds k
# into a uid-local index; under single-DU (`numUnroll==1`, the only mode
# exercised by MT128 / DU=256) `per_uid_k` resolves to `grGran.k = 1` and
# the modulo collapses every k>0 to local_k=0, so the wrap-LR loses its
# subtileK component and reads from the WRONG LDS half (offset:0 instead
# of offset:16384). Diff of generated assembly between PR 7656 head
# (passing) and the merged HEAD (failing) showed exactly this — same
# `s_xor s[sgprLocalWriteBaseAddrA]` was emitted, but the `ds_read_b128`
# used a different LDS half offset.
#
# Companion NLL fix: at the merge, parent-1's
# `elif em.opType == 'lr_inc' and not src.uid_swap: removed.add(...)` rule
# was kept WITHOUT parent-2's matching `gr_inc and self.config.pgr == 2`
# gate. Result: at PGR=1 NLL, gr_inc was kept (advance SRD + swap LW for
# tail entry, parent-2's design) but lr_inc was dropped (parent-1's
# design assumed gr_inc was also dropped). Tail-loop entry then read from
# the wrong LDS half. The lr_inc rule is now gated on `pgr == 2`,
# matching the gr_inc rule.
#
# Why "identical wrong-value counts across PGR=1/PGR=2" misled the prior
# triage: in the broken state, ALL of NLL's emit_lr-emitted reads land
# in the wrong half regardless of which PGR-shaped wrapper the kernel
# uses, so PGR doesn't change the failure footprint. The wrong-counts
# matching across PGR values is the symptom of an emit-time bug in the
# LR coordinate, not a CPU-reference vs kernel disagreement.
#
# Residual fix: the 88/63 K%MIK!=0 mismatches at K=288/K=544 turned
# out to be a HW-level interaction between the data K-mask V_AND chain
# and the v_mfma_scale_f32_16x16x128_f8f6f4 operand bypass on gfx950.
# Forcing the data K-mask to AND-with-(-1) (i.e. no-op masking)
# eliminated the residual; ANDing with the cmp-derived per-lane mask
# (sometimes 0, sometimes -1) introduced ~0.5% wrong outputs even
# though the mask logic was per-lane correct. The fix in
# InstructionEmitter.emit_mask_k SKIPS the data K-mask entirely for
# MX-scaled paths (hasScale=True): host-side zero-padding of the MX
# scale tensor already makes every out-of-bound K-group multiply by
# scale = E8M0 0x00 ≈ 2^-127, underflowing those contributions to 0
# in the FP32 accumulator. Plain non-MX FP8 (no scale) keeps the data
# K-mask, since its unit-scale fallback (E8M0 0x7F = 1.0) does NOT
# zero OOB contributions. Cross-validated on the matching MXFP4
# tail-loop configs: K=288, 320, 480, 512 all pass post-fix.
#
# Pre-existing v2 regression yamls (subtile_mxfp8_correctness_regression*
# .yaml, MT256x256x256 PGR=1 PLR=0 multi-DU): still fail kernel codegen
# at the post-merge HEAD with `vgprs=289 (Occupancy limit)`. The merge
# raised VGPR pressure on PR 7781's multi-DU path; this is independent
# of the main-loop bug fixed here. Per the fix-loop plan: "if the
# regression is fundamental (PR 7656's design choice), document and
# skip — the user can route to PR 7656's author".
########################################

TestParameters:
