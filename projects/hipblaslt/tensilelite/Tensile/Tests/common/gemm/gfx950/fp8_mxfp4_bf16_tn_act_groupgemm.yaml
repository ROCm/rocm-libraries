TestParameters:
  marks: [xfail-gfx950, skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]  # Only for gfx950

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 21
  DataInitTypeB: 21
  DataInitTypeC: 21
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  BoundsCheck: 2

BenchmarkProblems:
  ########################################
  # FP8 A + MXFP4 B -> BF16 C/D (TN (TransposeA=True, TransposeB=False))
  # Mixed FP8+MXFP4, BF16 output, All tile sizes (64x64, 128x128, 256x256), with Activation, GroupedGemm
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DataTypeA: F8
      DestDataType: B
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True   # TN configuration
      TransposeB: False  # TN configuration
      UseBeta: True
      Batched: True
      Activation: True
      ActivationType: hipblaslt_all
      UseBias: 1
      BiasDataTypeList: [s]
      GroupedGemm: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 1, 1, 1, 1]
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
          - [16, 16, 128, 1, 1, 2, 4, 2, 2]
          - [16, 16, 128, 1, 1, 8, 8, 2, 2]
          - [32, 32, 64, 1, 1, 4, 4, 2, 2]
          - [32, 32, 64, 1, 1, 8, 8, 2, 2]
        - DepthU: [32, 64, 128]
        - AssertFree0ElementMultiple: [1]
        - AssertFree1ElementMultiple: [1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DirectToLds: [0]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [32]
        - LocalReadVectorWidth: [32]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - ClusterLocalRead: [1]
        - 1LDSBuffer: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - GlobalReadPerMfma: [1]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [4]
        - InnerUnroll: [1]
        - ScheduleIterAlg: [3]
        - LdsPadA: [4]
        - LdsPadB: [4]
        - WorkGroupMapping: [64]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # Small sizes (Exact)
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          # Medium sizes (Exact)
          - Exact: [512, 512, 1, 512]
          - Exact: [1024, 1024, 1, 1024]
          # Large sizes (Exact)
          - Exact: [2048, 2048, 1, 2048]
          - Exact: [4096, 4096, 1, 4096]
          # Edge cases
          - Exact: [1, 1, 1, 1]
          - Exact: [1, 128, 1, 128]
          - Exact: [128, 1, 1, 128]
          - Exact: [127, 128, 1, 129]
          - Exact: [129, 127, 1, 128]
          - Exact: [255, 256, 1, 257]
          - Exact: [257, 255, 1, 256]
          - Exact: [128, 128, 1, 127]
          - Exact: [128, 128, 1, 129]
          # Batch variations
          - Exact: [256, 256, 2, 256]
          - Exact: [512, 512, 4, 512]
          - Exact: [1024, 1024, 8, 1024]
          - Exact: [256, 256, 16, 256]
          # Rectangular matrices
          - Exact: [512, 1024, 1, 256]
          - Exact: [1024, 512, 1, 256]
          - Exact: [256, 512, 1, 1024]
          - Exact: [512, 256, 1, 1024]
          # Small to medium range sweep (M, N, K: 128-512, step 128)
          - Range: [[128, 128, 512], [128, 128, 512], [1], [128, 128, 512]]
          # Medium range sweep (M, N, K: 512-1024, step 256)
          - Range: [[512, 256, 1024], [512, 256, 1024], [1], [512, 256, 1024]]
          # K dimension sweeps
          - Range: [[256], [256], [1], [128, 128, 512]]
          - Range: [[1024], [1024], [1], [256, 256, 1024]]
          # Batch size sweeps (1-8)
          - Range: [[512], [512], [1, 1, 8], [512]]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
          - [Enum: gelu]
          - [Enum: relu]
          - [Enum: sigmoid]
          - [Enum: Silu]
          - [Enum: Clamp]
