#
# MX-scaled F4 on the layouts with a free-dim contiguous operand: NT (both),
# NN (A) and TT (B).  subtile_mxfp4.yaml covers TN.  The scale byte span is
# derived per operand, so NN and TT carry one of each.
#
# The contiguous operand's extent stays even -- an odd one leaves the leading
# stride on a half byte for a 4-bit type.  Data-path constraint, not a scale
# one; f4_subtile.yaml covers the rejection.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 0
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType (power-of-two macro tiles across wave groups)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]   # MT64x64   wg1x1
          - [16, 16, 128, 1,  1, 8, 8,  1, 1]   # MT128x128 wg1x1
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]   # MT128x128 wg2x2
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256 wg2x2
          - [16, 16, 128, 1,  1, 4, 4,  1, 4]   # MT64x256  wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 512]   # two K windows
          - Exact: [96, 96, 1, 256]     # M,N inside one macro tile
          - Exact: [48, 80, 1, 256]     # M,N off the 32-row scale block
          - Exact: [34, 66, 1, 256]     # smallest even M,N; scale padding to 32
  -
    - # ProblemType (non-power-of-two macro tiles; the M wave group must be 1,
      # so these pair with wg1x4 only -- see f4_subtile.yaml for the reasoning)
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]   # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]   # MT224x256 wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
          - Exact: [200, 256, 1, 512]
  -
    - # NN: A free-contig (TLU=1, stacked), B K-contig (TLU=0, row-major).  The
      # two scales take different group spans in the same kernel.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          # Non-power-of-two on M, the contiguous dim here, so A takes a strip
          # narrower than its tile.  The M wave group has to be 1 for that.
          - [16, 16, 128, 1,  1, 12, 4,  1, 4]  # MT192x256 wg1x4
          - [16, 16, 128, 1,  1, 14, 4,  1, 4]  # MT224x256 wg1x4
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [192, 256, 1, 256]
          - Exact: [224, 256, 1, 256]
  -
    - # TT: A K-contig (TLU=0, row-major), B free-contig (TLU=1, stacked) -- the
      # mirror of NN, so the spans land on the opposite scales.
      OperationType: GEMM
      DataType: F4
      DestDataType: S
      ComputeDataType: S
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]   # MT64x64
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]   # MT256x256
          # Mirror of the NN pair: the non-power-of-two goes on N, which is the
          # contiguous dim here, so the N wave group is the one pinned to 1.
          - [16, 16, 128, 1,  1, 4, 12, 4,  1]  # MT256x192 wg4x1
          - [16, 16, 128, 1,  1, 4, 14, 4,  1]  # MT256x224 wg4x1
        - PrefetchGlobalRead: [0]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [512, 512, 1, 512]
          - Exact: [256, 192, 1, 256]
          - Exact: [256, 224, 1, 256]
