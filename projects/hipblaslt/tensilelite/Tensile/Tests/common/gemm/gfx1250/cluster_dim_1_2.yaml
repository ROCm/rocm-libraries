# Parameter gap coverage: ClusterDim [1,2]
# Note: ClusterDim not beneficial for A0, but testing for completeness

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # ClusterDim [1,2]
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ClusterDim: [[1, 2]]  # Missing cluster dimension
        - ScheduleIterAlg: [4]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [64, 64, 1, 64]     # Small
          - Exact: [128, 128, 1, 128]  # Medium
          - Exact: [256, 256, 1, 256]  # Larger
          - Exact: [512, 512, 1, 512]  # Large
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [128, 256, 1, 128]  # Non-square
          # === RANGE SIZES ===
          - Range: [ [128, 128, 512], [128, 128, 512], [1], [256] ]
