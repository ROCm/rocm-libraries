# Plan2: FP4 support with LDSSegmentInterleave
# Note: A0 cannot use F4 32x16 WMMA, use 16x16x64 instead

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP4 with LDSSegmentInterleave (16x16x64, not 32x16x128)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - LDSTrInst: [True]
        - ExpandPointerSwap: [False]
        - 1LDSBuffer: [1]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 1, 1, 1, 1]  # Use 16x16x64 for A0 (not 32x16x128)
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [16]
        - TDMInst: [3]
        - LDSSegmentInterleave: [0, 1]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [64, 64, 1, 64]
          - Exact: [63, 127, 1, 65]    # Odd sizes
