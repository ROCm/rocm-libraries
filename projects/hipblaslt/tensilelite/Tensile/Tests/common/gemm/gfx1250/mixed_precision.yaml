# A0-compatible test: Mixed precision combinations
# Different data types for input, compute, and output

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP16 input -> FP32 compute -> FP32 output
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True  # Use True with batch=1 to avoid non-batched bug

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [256, 256, 1, 256]  # Large
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [97, 97, 1, 97]     # Prime
          - Exact: [64, 256, 1, 128]   # Non-square
          - Exact: [64, 64, 5, 64]     # Batched
          # === RANGE SIZES ===
          - Range: [ [32, 32, 128], [32, 32, 128], [1], [64] ]

  # BF16 input -> FP32 compute -> FP16 output
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True  # Use True with batch=1 to avoid non-batched bug

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [96, 96, 1, 96]     # Non-power-of-2
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [128, 64, 1, 128]   # Non-square
          - Exact: [64, 64, 7, 64]     # Batched
          # === RANGE SIZES ===
          - Range: [ [64, 32, 128], [64, 32, 128], [1], [64] ]
