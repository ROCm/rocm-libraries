# Code Coverage Test: gfx1250 batch-offset logic
# Covers: KernelWriterAssembly.py lines 13711-13836
# Target: gfx1250-specific batch-offset skip logic (KernArgAddress direct refs)

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Large batch counts (FP32) - stress batch-offset apply logic
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 2, 128]   # batch=2
          - Exact: [128, 128, 4, 128]   # batch=4
          - Exact: [128, 128, 8, 128]   # batch=8
          - Exact: [128, 128, 16, 128]  # batch=16
          - Exact: [64, 64, 32, 64]     # batch=32
          - Exact: [64, 64, 64, 64]     # batch=64

  # Large batch with FP16 (different data type)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 2, 256]   # batch=2
          - Exact: [256, 256, 4, 256]   # batch=4
          - Exact: [256, 256, 8, 256]   # batch=8
          - Exact: [128, 128, 16, 128]  # batch=16
          - Exact: [128, 128, 32, 128]  # batch=32

  # Batch with transpose (different SRD computation paths)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 4, 128]
          - Exact: [128, 128, 8, 128]
          - Exact: [64, 64, 16, 64]

  # Batch with FP8 (yet another data type path)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 2, 2, 2, 2]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 2, 128]
          - Exact: [128, 128, 4, 128]
          - Exact: [128, 128, 8, 128]
          - Exact: [64, 64, 16, 64]

  # Batch with odd sizes (stress irregular batch offset)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 129, 3, 128]   # batch=3 (odd)
          - Exact: [65, 63, 5, 64]      # batch=5 (odd)
          - Exact: [255, 257, 7, 256]   # batch=7 (odd)
          - Exact: [97, 99, 11, 128]    # batch=11 (prime)

  # Batch with different DepthU (varies SRD setup)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [32, 64, 128]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 4, 256]   # K=2*DepthU for DepthU=128
          - Exact: [64, 64, 8, 128]     # K=2*DepthU for DepthU=64

  # Batch with TDM (combined with other features)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 4, 128]
          - Exact: [128, 128, 8, 128]
