TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # TDMStoreInst TDM store is gfx1250-only

GlobalParameters:
  NumElementsToValidate: -1
  PrintSolutionRejectionReason: True
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

# TDMStoreInst TDM store on StreamK (narrow scope), bf16 TN, MT256x256x64, StreamK=3.
# Under StreamK the fp32 partial-tile store to the workspace stays on buffer_store
# (StreamK partialsWriteBatch); only the fixup-owner's final bf16->D store -- the regular
# globalWriteBatch path, structurally identical to the GSU=1 case -- uses the TDM store.
# UseBeta=True is required: StreamK aliases sgprSkPartialIdx onto sgprBeta, so UseBeta=False
# is rejected up-front (pre-existing StreamK limitation, independent of the TDM store).
# The group forks SourceSwap x TDMStoreInst so it covers non-TDM StreamK baseline and the
# StreamK TDM store, SS0/SS1.  ProblemSizes exercise partial K-splits plus M/N edge clamps.
BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]  # MT 256x256 WG 2x2
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - TDMInst: [3]
        - SourceSwap: [False, True]
        - UseSubtileImpl: [False]
        - TDMStoreInst: [False, True]
        - StreamK: [3]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - PreloadKernArgs: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 512, 1, 256]  # non-edge, single M-tile, K split across WGs
          - Exact: [248, 512, 1, 256]  # edgeM
          - Exact: [232, 512, 1, 256]  # edgeM
          - Exact: [216, 512, 1, 256]  # edgeM
          - Exact: [512, 512, 1, 256]  # two M-tiles
          - Exact: [504, 512, 1, 256]  # edgeM (partial 2nd M-tile)
          - Exact: [256, 248, 1, 256]  # edgeN
          - Exact: [256, 1024, 1, 256] # wider N
