# Gap Coverage: StreamKXCCMapping parameter
# Tests StreamK with XCC (Execution Compute Chiplet) mapping

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP16 StreamK with XCC mapping
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - StreamK: [3]
        - StreamKXCCMapping: [0, 2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [256, 256, 1, 256]  # Medium
          - Exact: [512, 512, 1, 512]  # Large
          - Exact: [1024, 1024, 1, 1024] # Very large
          - Exact: [2048, 2048, 1, 1024] # Extra large
          - Exact: [255, 257, 1, 257]  # Odd
          - Exact: [256, 512, 1, 384]  # Non-square
          - Exact: [512, 1024, 4, 512]  # Non-square batched
          # === RANGE SIZES ===
          - Range: [ [256, 256, 1024], [256, 256, 1024], [1], [512] ]
          - Range: [ [512], [512], [1], [256, 256, 1024] ]  # K-sweep
          - Range: [ [256], [512], [1, 2, 4], [512] ]  # Batch sweep non-square

  # BF16 StreamK with XCC mapping
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - StreamK: [4]
        - StreamKXCCMapping: [0, 2]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [256, 256, 1, 256]  # Medium
          - Exact: [512, 512, 1, 512]  # Large
          - Exact: [768, 768, 1, 768]  # Non-power-of-2
          - Exact: [1024, 1024, 1, 512]  # Very large
          - Exact: [255, 257, 1, 257]  # Odd
          - Exact: [256, 512, 1, 384]  # Non-square
          - Exact: [384, 768, 4, 512]  # Non-square batched
          # === RANGE SIZES ===
          - Range: [ [256, 256, 768], [256, 256, 768], [1], [512] ]
          - Range: [ [512], [512], [1], [128, 128, 512] ]  # K-sweep
