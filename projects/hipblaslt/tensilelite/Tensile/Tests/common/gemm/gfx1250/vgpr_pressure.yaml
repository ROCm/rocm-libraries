# A0-compatible test: VGPR pressure tests
# gfx1250 supports up to 1024 VGPRs
# Test larger macro tiles that stress VGPR usage

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Test VGPR pressure with larger tiles
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True  # Use True with batch=1 to avoid non-batched bug

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 2, 2, 2, 2]  # Larger waves
          - [16, 16, 4, 1, 1, 4, 4, 2, 2]  # Even larger
        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0]
        - ScheduleIterAlg: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [256, 256, 1, 256]  # Large
          - Exact: [512, 512, 1, 512]  # Very large
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [127, 129, 1, 131]  # Near power-of-2
          - Exact: [64, 256, 1, 128]   # Non-square
          - Exact: [256, 64, 1, 128]   # Wide
          - Exact: [128, 128, 4, 128]  # Batched
          # === RANGE SIZES ===
          - Range: [ [64, 64, 256], [64, 64, 256], [1], [64] ]
          - Range: [ [128], [128], [1], [64, 64, 256] ]
