# Problem size gap coverage: Extreme aspect ratios
# M/N > 8 or M/N < 0.125 (very tall or very wide matrices)

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Very tall matrices (M >> N)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 64, 1, 128]   # 32:1 aspect ratio
          - Exact: [4096, 128, 1, 256]  # 32:1 aspect ratio
          - Exact: [1024, 64, 1, 128]   # 16:1 aspect ratio
          - Exact: [2048, 128, 1, 256]  # 16:1 aspect ratio
          - Exact: [512, 32, 1, 64]     # 16:1 aspect ratio

  # Very wide matrices (N >> M)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 2048, 1, 128]   # 1:32 aspect ratio
          - Exact: [128, 4096, 1, 256]  # 1:32 aspect ratio
          - Exact: [64, 1024, 1, 128]   # 1:16 aspect ratio
          - Exact: [128, 2048, 1, 256]  # 1:16 aspect ratio
          - Exact: [32, 512, 1, 64]     # 1:16 aspect ratio

  # Extreme with FP32
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - ScheduleIterAlg: [3]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 64, 1, 128]   # 16:1 tall
          - Exact: [64, 1024, 1, 128]   # 1:16 wide
          - Exact: [256, 32, 1, 64]     # 8:1 tall
          - Exact: [32, 256, 1, 64]     # 1:8 wide
