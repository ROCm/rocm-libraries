# A0-compatible test: Tensor Data Move (TDM) enabled
# TDMinst: 3 - Enable TDM for both A and B tensors (default config per plan)

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # TDM enabled with recommended legacy parameters
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        # TDM default configuration from plan
        - TDMInst: [3]  # Enable TDM for both A and B (note: TDMInst not TDMinst)
        # Legacy parameters used with TDM
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - 1LDSBuffer: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [256, 256, 1, 256]  # Large
          - Exact: [1024, 1024, 1, 512]  # Very large
          - Exact: [127, 63, 1, 65]    # Odd
          - Exact: [97, 101, 1, 103]   # Prime
          - Exact: [64, 256, 1, 128]   # Non-square
          - Exact: [64, 64, 5, 64]     # Batched
          - Exact: [256, 512, 4, 256]  # Non-square batched
          # === RANGE SIZES ===
          - Range: [ [64, 64, 256], [64, 64, 256], [1], [64] ]
          - Range: [ [256], [256], [1], [64, 64, 256] ]  # K-sweep

  # TDM with FP16
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - TDMInst: [3]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [32, 32, 1, 32]     # Small
          - Exact: [64, 64, 1, 64]     # Medium
          - Exact: [128, 128, 1, 128]  # Larger
          - Exact: [1024, 512, 1, 512]  # Very large non-square
          - Exact: [63, 65, 1, 67]     # Odd
          - Exact: [97, 97, 1, 97]     # Prime
          - Exact: [64, 64, 7, 64]     # Batched
          - Exact: [128, 256, 8, 128]  # Non-square batched
          # === RANGE SIZES ===
          - Range: [ [32, 32, 128], [32, 32, 128], [1], [64] ]
          - Range: [ [128], [256], [1, 2, 4], [64] ]  # Batch sweep non-square
