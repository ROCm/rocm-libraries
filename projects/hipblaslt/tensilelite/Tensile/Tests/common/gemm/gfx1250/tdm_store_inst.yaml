        - DepthU: [64]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - StreamK: [0]
        - TDMInst: [3]
        - TDMStoreInst: [true]
        - SourceSwap: [false]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - PreloadKernArgs: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
