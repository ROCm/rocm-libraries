# A0-compatible test: LDS pressure tests
# gfx1250 supports up to 320KB LDS
# Test configurations approaching LDS limits

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  PrintSolutionRejectionReason: True
  DataInitTypeA: 3
  DataInitTypeB: 2
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  PrintLevel: 1
  Architecture: gfx1250

BenchmarkProblems:
  # Test LDS usage with larger tiles
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True  # Use True with batch=1 to avoid non-batched bug

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 4, 1, 1, 4, 4, 2, 2]
        - DepthU: [128, 256]  # Larger DepthU for more LDS
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - 1LDSBuffer: [0, 1]  # Test both single and double buffering
        - ScheduleIterAlg: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [64, 64, 1, 128]    # Smaller with moderate K
          - Exact: [128, 128, 1, 256]  # Medium
          - Exact: [192, 192, 1, 384]  # Non-power-of-2
          - Exact: [256, 256, 1, 512]  # Large
          - Exact: [127, 129, 1, 257]  # Odd near power-of-2
          - Exact: [128, 256, 1, 384]  # Non-square
          - Exact: [256, 128, 1, 512]  # Wide
          - Exact: [128, 128, 4, 256]  # Batched
          # === RANGE SIZES ===
          - Range: [ [128, 64, 256], [128, 64, 256], [1], [256] ]
          - Range: [ [128], [128], [1], [128, 128, 512] ]
