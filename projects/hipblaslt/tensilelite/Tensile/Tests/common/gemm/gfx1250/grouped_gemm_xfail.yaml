# Gap Coverage: GroupedGemm parameter
# Tests grouped GEMM mode with multiple problem sizes in a single dispatch

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP16 Grouped GEMM
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      GroupedGemm: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [64, 64, 2, 64]     # Small
          - Exact: [128, 128, 2, 128]  # Medium
          - Exact: [256, 256, 4, 256]  # Larger
          - Exact: [512, 512, 2, 512]  # Large
          - Exact: [1024, 1024, 2, 1024] # Very large
          - Exact: [63, 65, 3, 67]     # Odd
          - Exact: [128, 256, 4, 128]  # Non-square batched
          - Exact: [256, 512, 8, 256]  # Non-square batched larger
          # === RANGE SIZES ===
          - Range: [ [64, 64, 256], [64, 64, 256], [2], [128] ]
          - Range: [ [512], [512], [2], [128, 128, 512] ]  # K-sweep
          - Range: [ [128], [256], [2, 2, 8], [128] ]  # Batch sweep non-square

  # BF16 Grouped GEMM
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      GroupedGemm: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [64, 64, 2, 64]     # Small
          - Exact: [128, 128, 2, 128]  # Medium
          - Exact: [256, 128, 4, 256]  # Non-square batched
          - Exact: [512, 256, 4, 512]  # Non-square batched larger
          - Exact: [1024, 512, 2, 512]  # Very large non-square
          - Exact: [63, 65, 3, 67]     # Odd
          - Exact: [97, 97, 5, 97]     # Prime
          # === RANGE SIZES ===
          - Range: [ [64, 64, 256], [64, 64, 128], [2], [128] ]
          - Range: [ [256], [256], [2], [64, 64, 256] ]  # K-sweep

  # FP16 Grouped GEMM with TN layout
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      GroupedGemm: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
      BenchmarkFinalParameters:
        - ProblemSizes:
          # === EXACT SIZES ===
          - Exact: [64, 64, 2, 64]     # Small
          - Exact: [128, 128, 2, 128]  # Medium
          - Exact: [256, 256, 2, 256]  # Larger
          - Exact: [1024, 1024, 2, 512]  # Very large
          - Exact: [63, 65, 3, 67]     # Odd
          - Exact: [128, 64, 4, 128]   # Non-square batched
          - Exact: [256, 128, 8, 256]  # Non-square batched larger
          # === RANGE SIZES ===
          - Range: [ [64, 64, 256], [64, 64, 256], [2], [128] ]
          - Range: [ [256], [128], [2, 2, 6], [128] ]  # Batch sweep non-square
