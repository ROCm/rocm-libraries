# Gap Coverage: UseInitialStridesCD parameter (expected to fail)
# Tests stride flexibility for output tensors (C and D)
#
# UseInitialStridesCD fails for two independent reasons:
#
# 1. GSU helper kernels assert 0 (architecture-independent issue):
#    - KernelWriterConversion.py:241 and KernelWriterBetaOnly.py:139 never learned
#      to pass runtime C/D strides and hard-assert 0
#    - Affects all GSU configs except GlobalSplitU=1 + GlobalSplitUAlgorithm=MultipleBufferSingleKernel
#
# 2. Undeclared StrideTD0 on the no-helper path (codegen bug):
#    - strideRef (KernelWriterAssembly.py:393) lumps the internal temp-D (TD) workspace
#      with real C/D/E tensors, but TD is an engine-allocated packed buffer with no
#      StrideTD0 argument, causing "error: expected absolute expression" at assembly time
#
# TODO: Once codegen is fixed, the no-helper path (GSU=1 + MultipleBufferSingleKernel)
# should be moved to initial_strides.yaml (without _xfail suffix).

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  KernelTime: True
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  Architecture: gfx1250

BenchmarkProblems:
  # FP16 with UseInitialStridesCD - MultipleBuffer (forces Conversion helper)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseInitialStridesCD: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]  # Forces Conversion helper
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]

  # FP16 with UseInitialStridesCD - GSU=4 MultipleBufferSingleKernel (forces BetaOnly helper)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseInitialStridesCD: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [4]
        - GlobalSplitUAlgorithm: ["MultipleBufferSingleKernel"]  # Forces BetaOnly helper
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]

  # FP16 with UseInitialStridesCD - SingleBuffer (forces Conversion helper)
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
      UseInitialStridesCD: True

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 1, 1, 1, 1]
        - DepthU: [64]
        - WavefrontSize: [32]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["SingleBuffer"]  # Forces Conversion helper
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
