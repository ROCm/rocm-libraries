TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250-strict] # not supported by arch

# TDM LDS ring: PrefetchGlobalRead >= 3 on TDM A+B under ScheduleIterAlg 0, against the
# two-stage PGR2 kernel of the same tile, plus PrefetchGlobalReadA != PrefetchGlobalReadB
# (a side at 1 takes the two-barrier fence whatever TDMRingFenceOverride says).
# K covers N < S (early exit), N == S, N >= 2S and a K that is not a multiple of DepthU
# (tail loop); for unequal sides also N between the shallower and the deeper side.
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  TDMRingFenceOverride: auto

BenchmarkProblems:
  #######################################
  # TN - MXF8F4SS Block32, E8: S=4 at DU256 and S=3 at DU512 on MT64x256
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup - TDM ring, TDMFuse 0, NumWaves=4
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  4,  4,  1, 4]   # 64x256, waves [1,4]
        - DepthU: [256, 512]
        - TDMInst: [3]
        - TDMSplit: [False]
        - Groups:
          -
            - PrefetchGlobalRead: 2
            - PrefetchGlobalRead: 3
            - PrefetchGlobalRead: 4
            - PrefetchGlobalRead: 5
            - PrefetchGlobalRead: 2
              PrefetchGlobalReadA: 2
              PrefetchGlobalReadB: 4
            - PrefetchGlobalRead: 2
              PrefetchGlobalReadA: 4
              PrefetchGlobalReadB: 2
            - PrefetchGlobalRead: 3
              PrefetchGlobalReadA: 3
              PrefetchGlobalReadB: 5
            - PrefetchGlobalRead: 1
              PrefetchGlobalReadA: 4
              PrefetchGlobalReadB: 1
            - PrefetchGlobalRead: 1
              PrefetchGlobalReadA: 1
              PrefetchGlobalReadB: 4
        - TDMFuse: [0]
        - ScheduleIterAlg: [0]
        - StaggerU: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 512, 1, 256]
          - Exact: [256, 512, 1, 512]
          - Exact: [256, 512, 1, 768]
          - Exact: [256, 512, 1, 1024]
          - Exact: [256, 512, 1, 1280]
