TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2

BenchmarkProblems:
  #######################################
  # TN - MXF8F4SS Block32, E8, decoupled PrefetchGlobalReadA/B
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup - decoupled PGR pairs, NumWaves=4
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2, 16,  2, 2]
        - DepthU: [256]
        - TDMInst: [3]
        # Upstream still rejects TDMSplit (PR #10911); xfailed unit tests keep
        # the per-row guards. Restore [False, True] when it is selectable again.
        - TDMSplit: [False]
        - TDMFuse: [0, 5]
        - PrefetchGlobalRead: [2]
        - PrefetchGlobalReadA: [1, 2]
        - PrefetchGlobalReadB: [1, 2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        # A single-buffered tensor's fill is relocated inside the unrolled loop,
        # so its write-after-read is only reachable from K = 2*DepthU: one trip
        # cannot reach it and the tail loop does not fill.
        - ProblemSizes:
          - Exact: [512, 512, 1, 384]   #below 2*DepthU
          - Exact: [512, 512, 1, 512]   #2*DepthU
          - Exact: [512, 512, 1, 1024]
          - Exact: [512, 512, 1, 1152]  #tail
        - ActivationArgs:
          - [Enum: none]
