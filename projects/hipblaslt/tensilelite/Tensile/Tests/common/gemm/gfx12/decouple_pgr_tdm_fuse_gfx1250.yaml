TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2

BenchmarkProblems:
  #######################################
  # TN - MXF8F4SS Block32, E8, decoupled PGR + TDMFuse sweep
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup - decoupled PGR, TDMFuse, NumWaves=4
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  4,  2, 2]   # 64x128, waves [2,2]
          - [16, 16, 128, 1,  1,  4,  4,  1, 4]   # 64x256, waves [1,4]
          - [16, 16, 128, 1,  1,  1, 32,  4, 1]   # 64x512, waves [4,1]
        - DepthU: [256, 512, 1024]
        - TDMInst: [3]
        - TDMSplit: [False]
        - InitCIterWmma: [0, 1]
        # The grouping and the per-tensor pair are not independent, and forking
        # them separately spends most of the sweep on combinations the solution
        # refuses: a level-0 side, two single-buffered sides, a one-sided key,
        # or a divergent pair on a grouping that cannot carry one.
        - Groups:
          -
            # Equal pairs degenerate to the legacy scalar, so one entry per
            # level covers every grouping.
            - TDMFuse: [0, 1, 2, 3]
              PrefetchGlobalRead: 0
              PrefetchGlobalReadA: 0
              PrefetchGlobalReadB: 0
            - TDMFuse: [0, 1, 2, 3]
              PrefetchGlobalRead: 1
              PrefetchGlobalReadA: 1
              PrefetchGlobalReadB: 1
            - TDMFuse: [0, 1, 2, 3]
              PrefetchGlobalRead: 2
              PrefetchGlobalReadA: 2
              PrefetchGlobalReadB: 2
            # Auto is asked for per tensor and ranks by LDS footprint.
            - TDMFuse: [0, 1, 2, 3]
              PrefetchGlobalRead: 2
              PrefetchGlobalReadA: -1
              PrefetchGlobalReadB: -1
            # A divergent pair needs each MX scale on the side whose LDS block
            # count it follows, which the two shared-scale groupings cannot give
            # it; only 0 and 1 accept one.
            - TDMFuse: [0, 1]
              PrefetchGlobalRead: 1
              PrefetchGlobalReadA: 1
              PrefetchGlobalReadB: 2
            - TDMFuse: [0, 1]
              PrefetchGlobalRead: 1
              PrefetchGlobalReadA: 2
              PrefetchGlobalReadB: 1
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 3, 4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [False]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 512, 1, 256]
          - Exact: [1024, 512, 1, 384]
          - Exact: [1024, 512, 1, 512]
          - Exact: [1024, 512, 1, 640]
          - Exact: [512, 1024, 1, 1024]
          - Exact: [512, 1024, 1, 1152]
          - Exact: [512, 1024, 1, 2048]
          - Exact: [512, 1024, 1, 2176]
        - ActivationArgs:
          - [Enum: none]
