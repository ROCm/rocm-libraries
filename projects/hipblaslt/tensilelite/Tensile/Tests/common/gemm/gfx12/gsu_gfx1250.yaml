TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  DataInitTypeA: 23 #3
  DataInitTypeB: 24 #3
  DataInitTypeC: 0
  # DataInitTypeD: 0
  # DataInitTypeE: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # Tensor printing controls:
  # PrintTensorA: 1          # Print TensorA after initialization
  # PrintTensorB: 1          # Print TensorB after initialization
  # PrintTensorC: 0x3          # Print TensorC.  0x1=after init; 0x2=after copy-back; 0x3=both
  # PrintTensorD: 0x3          # Print TensorD.  0x1=after init; 0x2=after copy-back; 0x3=both
  #PrintTensorRef: 1
  # print logs
  PrintLevel: 2                # how much info to print in generator. 0=none, 1=standard, 2=verbose
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250

BenchmarkProblems:
  #######################################
  # NN - standard
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 1
      Activation: True
      UseScaleAlphaVec: 1 #SAV
      BiasDataTypeList: ['s', 'b']
      ActivationType:  hipblaslt_all

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
          # Putting it all together:
          #  - [32, 32, 1, 2,  1,  4, 1,  2, 2]
          #     ^^^^^^^^^^^^   ^   ^^^^   ^^^^
          #      MatrixInst  BlkM   WT    Wave
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,   4, 4,  2, 2]
          - [16, 16, 32, 1,  1,   3, 4,  2, 2]
          - [16, 16, 32, 1,  1,   6, 3,  2, 2]
          - [16, 16, 32, 1,  1,   3, 6,  2, 2]
          - [16, 16, 32, 1,  1,  12, 6,  2, 2]
        - DepthU: [64, 128]
        - TDMInst: [3]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - GlobalSplitU: [-1,2,3]
        - GlobalSplitUCoalesced: [False, True]
        - GlobalSplitUWorkGroupMappingRoundRobin: [False, True]
        - GlobalSplitUAlgorithm: [MultipleBuffer,MultipleBufferSingleKernel]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - 1LDSBuffer: [0]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - SourceSwap: [True, False]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [511, 511, 1, 32768]
          - Exact: [513, 513, 1, 32768]
          - Exact: [512, 512, 1, 32767]
          - Exact: [512, 512, 1, 32769]
        - BiasTypeArgs: ['s']
        - ActivationArgs:
          - [Enum: none]
