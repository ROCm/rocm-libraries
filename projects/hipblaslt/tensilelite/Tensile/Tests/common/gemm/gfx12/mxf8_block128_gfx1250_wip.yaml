#
# MXF8 with MXBlockA/MXBlockB = 128 (one E8 scale shared by 128 K-elements, 1x128)
# on gfx1250. Derived from mxf8_gfx1250.yaml, which covers the 1x16 and 1x32 cases.
#
# STATUS: host-side only. The CPU reference, scale tensor descriptors, data
# generation and solution parameter derivation all handle a 128-element MX block,
# but the assembly MAC path still emits the 1x32 scaled WMMA
# (v_wmma_scale_f32_16x16x128_f8f6f4), so the GPU consumes the wrong number of
# scales and validation is expected to mismatch. The "_wip" suffix makes
# config_helpers.configMarks apply a non-strict pytest.mark.xfail, so this config
# runs but does not gate CI. Once the 1x128 assembly lands the test XPASSes; at
# that point fold this group into mxf8_gfx1250.yaml and delete this file.
#
# SCOPE: deliberately one small group (a single solution over four sizes) so the
# 1x128 assembly work has something fast to iterate against. The parameter sweeps
# that mxf8_gfx1250.yaml runs for 1x16 / 1x32 -- HalfPLR, TDMIterateMode,
# PrefetchGlobalRead, GlobalSplitU, and the odd MT256x224 tile -- are NOT
# replicated here. Widen this alongside the assembly change.
#
# All K sizes are multiples of 128 because AssertSummationElementMultiple is
# raised to max(MXBlockA, MXBlockB) during derivation (Solution.py); it is also
# set explicitly below so this file is self-describing. "tail" means K is a
# multiple of the MX block but not of DepthU.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2


BenchmarkProblems:
  #######################################
  # TN - standard, MXF8SS Block128, E8, MT256x256
  #######################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 128
      MXBlockB: 128
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 8,  2, 2]
        - HalfPLR: [0]
        - DepthU: [256]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - AssertSummationElementMultiple: [ 128 ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 128]  # K = exactly one MX block
          - Exact: [256, 256, 1, 2048]
          - Exact: [256, 256, 1, 2176] # tail
          - Exact: [257, 256, 1, 2048] # edge-m
