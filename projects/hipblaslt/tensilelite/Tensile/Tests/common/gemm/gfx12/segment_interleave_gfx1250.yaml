TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

# End-to-end functional test for the gfx1250 LDS segment-conflict interleave.
# Every problem runs as baseline and interleaved, validated against the CPU reference.
# Covers both oracle branches (tight: fA+fB >= 64KiB; aligned: < 64KiB, grows LDS),
# coarse and fine VectorWidthB, and PrefetchGlobalRead 1/2.
#
# MatrixInstruction: [M, N, K, B, _, MIWT0, MIWT1, MIWG0, MIWG1]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1        # full validation: interleave must match reference
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 16
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3                 # serial -> deterministic, exposes address bugs
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  8, 8,  2, 2]   # MT256x256 (tight)
          - [16, 16, 32, 1,  1,  8, 4,  2, 2]   # MT256x128 (aligned, non-square)
          - [16, 16, 32, 1,  1,  4, 4,  2, 2]   # MT128x128 (aligned)
          - [16, 16, 32, 1,  1,  2, 4,  2, 2]   # MT64x128  (aligned)
        - DepthU: [128]
        - TDMIterateMode: [-1]
        - TDMInst: [3]
        - HalfPLR: [1]
        - TDMSplit: [False]
        - LDSSegmentInterleave: [-1, 0, 1]      # auto / baseline / force-on, all validated
        - PrefetchGlobalRead: [1, 2]            # PGR!=2 tight interleave coverage
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1, 4, 2, 1]    # coarse (-1=auto) and fine (4/2/1) VWB
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[2,2], [2,4]]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 256]
          - Exact: [1024, 1024, 1, 512]
        - ActivationArgs:
          - [Enum: none]
