TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

# Functional test for the gfx1250 LDS segment-conflict interleave. Each problem runs baseline
# (LDSSegmentInterleave=0) and interleaved (=1) vs the CPU reference; both oracle branches are
# covered (tight fA+fB>=64KiB, aligned <64KiB). bf16=[2,2] no-scale; mxf8=asym+MX scales; mxf4=fp4 + VWA=WaveTileA/2.

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 16
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:
  # bf16 (no scales): [2,2] tight + aligned, B unrestricted (VWB = WaveTileB and WaveTileB/2).
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  8, 8,  2, 2]   # [2,2] tight
          - [16, 16, 32, 1,  1,  8, 4,  2, 2]   # [2,2] aligned
          - [16, 16, 32, 1,  1,  4, 4,  2, 2]   # [2,2] aligned
        - DepthU: [128]
        - TDMIterateMode: [-1]
        - TDMInst: [3]
        - HalfPLR: [1]
        - TDMSplit: [False, True]
        - LDSSegmentInterleave: [-1, 0, 1]      # auto / off / on
        - PrefetchGlobalRead: [1, 2]            # 2 enables the aligned branch
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1, 2]                 # VWB = WaveTileB, WaveTileB/2
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[2,4]]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1032, 1032, 1, 576]
          - Exact: [1024, 1024, 1, 512]
        - ActivationArgs:
          - [Enum: none]
  # mxf8 (block-32 e8): [4,1]/[1,4] + [2,2] with MX-scale relocation; B unrestricted (VWB = WaveTileB and WaveTileB/2).
  -
    - # ProblemType, TN - MXF8SS Block32, E8
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 8,  2, 2]   # [2,2] tight
          - [16, 16, 128, 1,  1,  8, 4,  2, 2]   # [2,2] aligned
          - [16, 16, 128, 1,  1,  8, 4,  4, 1]   # [4,1]
          - [16, 16, 128, 1,  1,  4, 8,  1, 4]   # [1,4]
          - [16, 16, 128, 1,  1,  8, 4,  1, 4]   # [1,4]
        - DepthU: [256]
        - TDMIterateMode: [-1]
        - TDMInst: [3]
        - HalfPLR: [3]
        - TDMSplit: [False, True]
        - LDSSegmentInterleave: [-1, 0, 1]
        - PrefetchGL2: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1, 4]                  # VWB = WaveTileB, WaveTileB/2; [1,4] uses the WaveTileB=8 tile
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - ClusterDim: [[4,4]]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1032, 1032, 1, 1056]
          - Exact: [1024, 1024, 1, 1024]
        - ActivationArgs:
          - [Enum: none]
  # mxf4: fp4 pad ([8,7]) + [2,2]/[4,1] with VWA=WaveTileA/2; extreme asym tiles.
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  8, 8,  2, 2]   # [2,2] tight (VWA=4 = WaveTileA/2)
          - [16, 16, 128, 1,  1,  8, 4,  2, 2]   # [2,2] aligned
          - [16, 16, 128, 1,  1,  8, 7,  2, 2]   # [2,2] odd WaveTileB: bcontig + fp4 pad
          - [16, 16, 128, 1,  1,  8, 1,  4, 1]   # [4,1] extreme (WaveTileA=8, N=16)
          - [16, 16, 128, 1,  1,  1, 8,  1, 4]   # [1,4] extreme (M=16, WaveTileB=8)
        - DepthU: [512]
        - TDMIterateMode: [-1]
        - TDMInst: [3]
        - HalfPLR: [1]
        - TDMSplit: [False, True]
        - LDSSegmentInterleave: [-1, 0, 1]
        - PrefetchGL2: [2]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1, 4]                  # VWA = WaveTileA, WaveTileA/2: [4,1] componentSplit, [2,2] portSplitA
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0]
        - SourceSwap: [True]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
        - CompactLoopStore: [False]
        - PreloadKernArgs: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1026, 1026, 1, 2592]
          - Exact: [1024, 1024, 1, 2560]
        - ActivationArgs:
          - [Enum: none]