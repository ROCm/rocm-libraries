# TensorStore + WaveTransposeStoreTDM coverage on gfx1250.
# Exercises both wave-contiguous store re-layouts across the axes that historically broke them:
#   - MIWaveTile with an axis == 2 ([4,2]) — the config that failed under WaveTransposeStoreTDM
#   - VectorWidth > 1 (VWA/VWB base scaling), SourceSwap True/False (lane thread-part swap)
#   - StoreVectorWidth: TensorStore handles any SVW (elementCoord+gwvw); WaveTransposeStoreTDM
#     requires SVW == MIOutputVectorWidth (auto -1 -> 8), non-compliant SVW is rejected.
#   - MX (bf16 dest, f8+E8 scales) and non-MX f8 — the store is MX-scale-agnostic.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  PrintSolutionRejectionReason: True
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:

  ########################################
  # non-MX f8 TN — TensorStore, VW=1, SourceSwap=False, MIWaveTile [2,2] and [4,2]
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - DepthU: [256]
        - LDSTrInst: [True]
        - TransposeLDS: [-1]
        - LdsPadA: [16]
        - LdsPadB: [16]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - ScheduleIterAlg: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - TDMInst: [3]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [False]
        - WaveTransposeStoreTDM: [False]
        - TensorStore: [True]
        - GlobalSplitU: [1]
        - WavefrontSize: [32]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 256]

  ########################################
  # non-MX f8 TN — WaveTransposeStoreTDM, SVW auto(->8), VW=1, SourceSwap=False
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 2, 2, 2]
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - DepthU: [256]
        - LDSTrInst: [True]
        - TransposeLDS: [-1]
        - LdsPadA: [16]
        - LdsPadB: [16]
        - LdsBlockSizePerPadA: [256]
        - LdsBlockSizePerPadB: [256]
        - ScheduleIterAlg: [4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - ClusterLocalRead: [1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - TDMInst: [3]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [False]
        - WaveTransposeStoreTDM: [True]
        - TensorStore: [False]
        - GlobalSplitU: [1]
        - WavefrontSize: [32]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 256]

  ########################################
  # MX f8 -> bf16 TN — TensorStore, MIWaveTile [4,2], VW={1,2}, SourceSwap=False
  ########################################
  - - OperationType: GEMM
      Batched: true
      ComputeDataType: 0
      DataType: 15
      DataTypeA: 15
      DataTypeB: 15
      DataTypeMXSA: 22
      DataTypeMXSB: 22
      DestDataType: 7
      HighPrecisionAccumulate: true
      IndexAssignmentsA: [3, 0, 2]
      IndexAssignmentsB: [3, 1, 2]
      MXBlockA: 32
      MXBlockB: 32
      MacDataTypeA: 15
      MacDataTypeB: 15
      NumIndicesC: 3
      TransposeA: true
      TransposeB: false
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - AssertFree0ElementMultiple: [4]
        - AssertFree1ElementMultiple: [4]
        - AssertSummationElementMultiple: [32]
        - DepthU: [512]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidthA: [16]
        - LocalReadVectorWidthB: [16]
        - MIArchVgpr: [true]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [2]
        - ScheduleIterAlg: [0]
        - StaggerU: [0]
        - TransposeLDS: [1]
        - TDMInst: [3]
        - ClusterDim: [[4, 4]]
        - VectorWidthA: [1, 2]
        - VectorWidthB: [1, 2]
        - StoreVectorWidth: [-1]
        - SourceSwap: [false]
        - WaveTransposeStoreTDM: [False]
        - TensorStore: [true]
        - GlobalSplitU: [1]
        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 512, 256, 256, 512, 512]

  ########################################
  # MX f8 -> bf16 TN — TensorStore, MIWaveTile [4,2], SourceSwap=True (VWA=1, VWB={1,2}, SVW=1)
  ########################################
  - - OperationType: GEMM
      Batched: true
      ComputeDataType: 0
      DataType: 15
      DataTypeA: 15
      DataTypeB: 15
      DataTypeMXSA: 22
      DataTypeMXSB: 22
      DestDataType: 7
      HighPrecisionAccumulate: true
      IndexAssignmentsA: [3, 0, 2]
      IndexAssignmentsB: [3, 1, 2]
      MXBlockA: 32
      MXBlockB: 32
      MacDataTypeA: 15
      MacDataTypeB: 15
      NumIndicesC: 3
      TransposeA: true
      TransposeB: false
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - AssertFree0ElementMultiple: [4]
        - AssertFree1ElementMultiple: [4]
        - AssertSummationElementMultiple: [32]
        - DepthU: [512]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidthA: [16]
        - LocalReadVectorWidthB: [16]
        - MIArchVgpr: [true]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [2]
        - ScheduleIterAlg: [0]
        - StaggerU: [0]
        - TransposeLDS: [1]
        - TDMInst: [3]
        - ClusterDim: [[4, 4]]
        - VectorWidthA: [1]
        - VectorWidthB: [1, 2]
        - StoreVectorWidth: [1]
        - SourceSwap: [true]
        - WaveTransposeStoreTDM: [False]
        - TensorStore: [true]
