        - WavefrontSize: [32]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 128, 1, 512, 256, 256, 512, 512]

  ########################################
  # MX f8 -> bf16 TN — WaveTransposeStoreTDM, MIWaveTile [4,2], SVW auto(->8), SourceSwap=False
  ########################################
  - - OperationType: GEMM
      Batched: true
      ComputeDataType: 0
      DataType: 15
      DataTypeA: 15
      DataTypeB: 15
      DataTypeMXSA: 22
      DataTypeMXSB: 22
      DestDataType: 7
      HighPrecisionAccumulate: true
      IndexAssignmentsA: [3, 0, 2]
      IndexAssignmentsB: [3, 1, 2]
      MXBlockA: 32
      MXBlockB: 32
      MacDataTypeA: 15
      MacDataTypeB: 15
      NumIndicesC: 3
      TransposeA: true
      TransposeB: false
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: [Assembly]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 4, 2, 2, 2]
        - AssertFree0ElementMultiple: [4]
        - AssertFree1ElementMultiple: [4]
        - AssertSummationElementMultiple: [32]
        - DepthU: [512]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - LocalReadVectorWidthA: [16]
        - LocalReadVectorWidthB: [16]
        - MIArchVgpr: [true]
        - MXLoadInst: [TDM]
        - MXScaleFormat: [InMemorySwizzle]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [2]
        - ScheduleIterAlg: [0]
