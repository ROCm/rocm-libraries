TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  PrintSolutionRejectionReason: False
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  KeepBuildTmp: False
  PrintLevel: 2
  CodeObjectVersion: "4"

BenchmarkProblems:

  # bf16 TN
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  2, 2,  2, 2]
          - [16, 16, 32, 1,  1,  4, 4,  2, 2]
        - DepthU: [64]
        - WavefrontSize: [32]
        - UseLoopModel: [true]
        - UseSubtileImpl: [false]
        - TDMInst: [3]
        - TDMIterateMode: [-1]
        - LDSTrInst: [false, true]
        - LDSSegmentInterleave: [0, 1]
        - SourceSwap: [false]
        - ExpandPointerSwap: [false]
        - StaggerU: [0]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1, 3]
        - ScheduleIterAlg: [4]
        - VectorWidthA: [-1, 1, 2, 4]
        - VectorWidthB: [-1, 1, 2, 4]
        - TDMSplitA: [0, 1, 2]
        - TDMSplitB: [0, 1, 2]
        - WmmaInnerOrder: [1, 2, 3, 4, 5, 6]
        - WmmaOuterOrder: [-1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 256, 1, 128]
          - Exact: [256, 256, 1, 64]
          - Exact: [257, 129, 1, 256]
          - Exact: [256, 256, 1, 97]
