#
# Subtile MXFP4 correctness test for gfx1250 (wave32).
# Covers single/multi-iteration (DepthU 128/256/512),
# single/multi-wave tiles up to 256x256, and PGR=1/2.
# Validates the TDM-based MX scale load path for subtile kernels,
# including edge tiles with non-multiple-of-MT problem sizes and
# multiple workgroups in both M and N dimensions.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  SyncsPerBenchmark: 0
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  PrintLevel: 2
  PrintSolutionRejectionReason: True
  ForceGenerateKernel: True

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32

    - # Subtile MXFP4: 1-wave and 4-wave, PGR 1 and 2, SIA 0 and 3
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 2, 2,  1, 1]  # MT 32x32 WG 1x1
          - [16, 16, 128, 1,  1, 4, 2,  1, 1]  # MT 64x32 WG 1x1 (MIWT 4,2)
          - [16, 16, 128, 1,  1, 2, 4,  1, 1]  # MT 32x64 WG 1x1 (MIWT 2,4)
          - [16, 16, 128, 1,  1, 4, 4,  1, 1]  # MT 64x64 WG 1x1 (MIWT 4,4)
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]  # MT 128x128 WG 2x2 (MIWT 4,4)
          - [16, 16, 128, 1,  1, 2, 2,  2, 2]  # MT 64x64 WG 2x2
          - [16, 16, 128, 1,  1, 4, 2,  2, 2]  # MT 128x64 WG 2x2 (MIWT 4,2)
          - [16, 16, 128, 1,  1, 2, 4,  2, 2]  # MT 64x128 WG 2x2 (MIWT 2,4)
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]  # MT 256x256 WG 2x2 (MIWT 8,8)
          - [16, 16, 128, 1,  1, 8, 4,  2, 2]  # MT 256x128 WG 2x2 (MIWT 8,4)
        - DepthU: [128, 256, 512]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchLocalRead: [1]
        - ScheduleIterAlg: [0, 3]
        - PreloadKernArgs: [True]
        - UseSubtileImpl: [True]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - StreamK: [0]
        - TDMInst: [3]
        - StaggerU: [0]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - LdsPadMXSA: [0]
        - LdsPadMXSB: [0]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 32, 1, 256]
          - Exact: [32, 32, 1, 128]
          - Exact: [64, 64, 1, 256]
          - Exact: [64, 64, 1, 512]
          - Exact: [128, 128, 1, 512]
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 256, 1, 256]
          - Exact: [256, 128, 1, 256]
          # Edge tiles
          - Exact: [33, 32, 1, 256]
          - Exact: [36, 32, 1, 256]
          - Exact: [100, 32, 1, 256]
          - Exact: [100, 64, 1, 256]
          - Exact: [100, 100, 1, 256]
          # 256x256 edge: M or N < MT but still valid
          - Exact: [200, 200, 1, 256]
