TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

# Auto PrefetchGlobalReadA/B under LDS pressure. The per-tensor keys are omitted, so every
# cell is auto: the PrefetchGlobalRead=2 kernel is derived first and kept when it fits LDS.
# At DepthU=1024 both 8-wave tiles exceed LDS at (2,2) and fit one divergent pair: B thick
# for 256x128, A thick for 128x256. At DepthU=512 they fit at (2,2) and must stay the
# PrefetchGlobalRead=2 kernel. Small wave tiles keep the divergent kernels inside 1024 VGPRs.
# K sweep: K < DepthU (tail loop only), a multiple of DepthU, and a loop plus a tail.
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  PrintLevel: 2
  DisableAsmComments: True

BenchmarkProblems:
  #######################################
  # TN - MXF4SS Block32, E4M3 scales, auto PrefetchGlobalReadA/B
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: f8
      DataTypeMXSB: f8

    - # BenchmarkProblemSizeGroup - LDS pressure, PrefetchGlobalReadA/B omitted (auto)
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [true]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  4, 4,  4, 2]   # 256x128, 8 waves
          - [16, 16, 128, 1,  1,  4, 4,  2, 4]   # 128x256, 8 waves
        - DepthU: [512, 1024]
        - TDMInst: [3]
        - TDMIterateMode: [0]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [0, 4]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [-1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - TransposeLDS: [1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [false]
        - WavefrontSize: [32]
        - AssertSummationElementMultiple: [ 32 ]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 480]
          - Exact: [1024, 1024, 1, 3072]
          - Exact: [1024, 1024, 1, 3616]
          - Exact: [1026, 1024, 1, 3616]
