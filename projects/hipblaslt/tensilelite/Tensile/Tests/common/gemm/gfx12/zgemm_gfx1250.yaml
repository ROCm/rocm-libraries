TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
  # gfx1250 ZGEMM uses the f64 VALU MAC path (TDM cannot express its 16B element),
  # so it does not share zgemm.yaml.

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 1
  EnqueuesPerSync: 1
  Architecture: gfx1250

BenchmarkProblems:
  - # zgemm NN / NT / TN / TT with conjugate coverage
    - {OperationType: GEMM, DataType: z, DestDataType: z, ComputeDataType: z, TransposeA: False, TransposeB: False, UseBeta: True, Batched: True}
    - BenchmarkCommonParameters: [{KernelLanguage: ["Assembly"]}]
      ForkParameters: &zvalu
        - ThreadTile: [[1,1],[2,2],[4,4]]
        - WorkGroup: [[8,4,1],[4,8,1]]
        - DepthU: [8,16,32]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - GlobalSplitU: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
        - 1LDSBuffer: [0]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]

  - # zgemm TN + conjugate A
    - {OperationType: GEMM, DataType: z, DestDataType: z, ComputeDataType: z, TransposeA: True, TransposeB: False, ComplexConjugateA: True, UseBeta: True, Batched: True}
    - BenchmarkCommonParameters: [{KernelLanguage: ["Assembly"]}]
      ForkParameters: *zvalu
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]

  - # zgemm TT + conjugate A and B
    - {OperationType: GEMM, DataType: z, DestDataType: z, ComputeDataType: z, TransposeA: True, TransposeB: True, ComplexConjugateA: True, ComplexConjugateB: True, UseBeta: True, Batched: True}
    - BenchmarkCommonParameters: [{KernelLanguage: ["Assembly"]}]
      ForkParameters: *zvalu
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [127, 127, 1, 127]
          - Exact: [128, 128, 1, 128]
