TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 1
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # TDMSplit x HalfPLR x TDMPlusLdsBuf (pins the per-buffer split memory tokens
      # and the HalfPLR tail LDS re-align)
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  2, 2,  1, 1]
          - [16, 16, 32, 1,  1,  2, 2,  2, 2]
          - [16, 16, 32, 1,  1,  4, 4,  2, 2]
        - DepthU: [64,128,256]
        - TransposeLDS: [-1]
        - LDSSegmentInterleave: [0,1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - TDMInst: [3]
        - TDMSplit: [False, True]
        - StreamK: [0]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [1,2]
        - TDMPlusLdsBuf: [-1,0,1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1,2]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0,1]
        - SourceSwap: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 32]    # only tail
          - Exact: [128, 128, 1, 1024]  # 16 iters, no tail
          - Exact: [128, 128, 1, 1000]  # 15 iters (mod 3 == 0) + 40
          - Exact: [128, 128, 1, 1064]  # 16 iters (mod 3 == 1) + 40
          - Exact: [128, 128, 1, 1128]  # 17 iters (mod 3 == 2) + 40
        - ActivationArgs:
          - [Enum: none]