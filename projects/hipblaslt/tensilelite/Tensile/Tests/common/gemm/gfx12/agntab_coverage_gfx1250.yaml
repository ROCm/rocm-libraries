TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumElementsToValidate: -1
  NumWarmups: 1
  MaxEnqueuesPerSync: 1
  SleepPercent: 0
  PrintSolutionRejectionReason: True
  DataInitTypeA: 23
  DataInitTypeB: 24
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  CSVExportWinner: True
  CSVMergeSameProblemID: True
  Device: 0
  MaxWorkspaceSize: 134217728
  KernelTime: True
  RotatingBufferSize: 512
  Architecture: gfx1250
  CodeObjectVersion: "4"

.AdaptiveBase: &adaptive_base
  CustomKernels:
  InitialSolutionParameters:
  BenchmarkCommonParameters:
    - KernelLanguage: ["Assembly"]
  ForkParameters:
    - MatrixInstruction:
      - [16, 16, 32, 1, 1, 1, 1, 1, 1] # gfx1250 WMMA bf16 16x16x32
    - WavefrontSize: [32]
    - DepthU: [32]
    - PrefetchGlobalRead: [1]
    - PrefetchLocalRead: [1]
    - TransposeLDS: [-1]
    - WorkGroupMapping: [1]
    - 1LDSBuffer: [-1]
    - GlobalSplitU: [1]
    - GlobalSplitUAlgorithm: ["MultipleBuffer"]
    # ============ StinkyTofu scheduling + AGNTAB/AG multi-body under test ============
    - ScheduleIterAlg: [0, 1, 2, 3, 4]
    - AdaptiveGemm: [0, 1]
    - AdaptiveGemmNTAB: [0, 1]
    - InitCIterWmma: [0, 1]
  BenchmarkJoinParameters:
  BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [128,    128, 1, 128]   # baseline   -> NTA0_NTB0
      - Exact: [32768,  128, 1, 192]   # NTA4 path  -> NTA4_NTB0
      - Exact: [128,  16384, 1, 256]   # NTB4 path  -> NTA0_NTB4

BenchmarkProblems:
  # =================================================================
  # AGNTAB x AG x StinkyTofu coverage -- 4 transpose x 3 sizes
  # Focus: exercise the multi-body main loop + multi-store epilogue through StinkyTofu.
  # =================================================================
  - # NN adaptive
    - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - <<: *adaptive_base

  - # TN adaptive
    - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - <<: *adaptive_base

  - # NT adaptive
    - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - <<: *adaptive_base

  - # TT adaptive
    - OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: True
      UseBeta: True
      Batched: True
    - <<: *adaptive_base
