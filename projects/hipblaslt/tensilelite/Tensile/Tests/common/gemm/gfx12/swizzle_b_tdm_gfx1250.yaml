  -
    - # ProblemType, TN, F8 swizzle-B, multi-wave N-split + HalfPLR=3 (rotating Valu groups; DepthU=256).
      # K=512 also exercises multi-main-loop-iteration (K>DepthU): the swizzled local read must reset its
      # per-K-sub-iteration LDS offset at each DepthU boundary.
      OperationType: GEMM
      DataType: F8
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      SwizzleTensorB: True

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
