        - DepthU: [256]
        - TDMInst: [3]
        - TDMPlusLdsBuf: [0]
        - HalfPLR: [1]
        - TDMIterateMode: [-1]
        - PrefetchGL2: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [0]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [0]
