          - Exact: [128, 64, 1, 256]
          - Exact: [128, 64, 1, 512]
        - ActivationArgs:
          - [Enum: none]
  -
    - # ProblemType, TN, MXF8 swizzle-B, VWA=8 + multi-wave (MIWaveGroup=[2,2]).
      # Regression guard for LDSSegmentInterleave: at VWA=8 LSI auto-resolves to 1, but its per-component
      # segment jump (wtid0*(fA+fB)) is not threaded through the swizzle-B TDM write/read, so waveN=1 used
      # to read B from the wrong LDS segment -> garbage in the 2nd N-band. segment_interleave.evaluate now
      # returns not-applicable for SwizzleTensor{A,B}, so LSI stays off here and this must PASS.
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8
      SwizzleTensorB: True

