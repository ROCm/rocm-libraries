        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  4, 2,  2, 2]
        - DepthU: [256]
        - TDMInst: [3]
        - HalfPLR: [3]
        - TDMIterateMode: [0]
        - PrefetchGL2: [0]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [0]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [0]
        - LDSTrInst: [False]
