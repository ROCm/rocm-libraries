  -
    - # ProblemType, TN, MXF8 swizzle-B, VWB=2 (VectorWidth>1 on the swizzled tensor).
      # Regression guard for swizzled-TDM VectorWidthB>1: the read decomposes the VW-strided N into
      # (nO,nI) (per-lane) plus an eIdx column phase + vIdx tile-group in the ds_load immediate, and
      # scales the multi-wave nO-band offset by VW, so the swizzled B lands in the VW-interleaved
      # register layout the WMMA/acc consume. Must PASS (garbage before the fix). Also lets MXSB scale
      # loads widen (ds_load count ~halves via the tileSpan).
      OperationType: GEMM
      DataType: F8
      DestDataType: B
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
