        - ScheduleIterAlg: [3]
        - ExpandPointerSwap: [False]
        - TransposeLDS: [1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["MultipleBuffer"]
        - SourceSwap: [False]
        - ActivationFuncCall: [false]
        - 1LDSBuffer: [1]
        - StaggerU: [32]
        - StaggerUMapping: [0]
        - StaggerUStride: [256]
        - WavefrontSize: [32]
        - ConvertAfterDS: [ False ]
        - CompactLoopStore: [ False, True ]
      BenchmarkForkParameters:
