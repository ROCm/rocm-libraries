# Verify that the emulator produces numerically correct output by comparing
# against the CPU reference. No GPU required — runs entirely on the host.
# ValidateWithEmulator: 1 triggers the emulator validation path.
# Requires building with -DHIPBLASLT_ENABLE_RACE_EMULATOR=ON.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1151, skip-gfx1200, skip-gfx1201]

GlobalParameters:
  NumElementsToValidate: -1
  ValidateWithEmulator: 1
  Device: 0
  ISA:
    - [9, 4, 2]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      DestDataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
      F32XdlMathOp: x
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 8, 1, 1, 1, 1, 1, 1]
        - ThreadTile:
            - [4, 4]
        - WorkGroup:
          - [8, 8, 1]
        - DepthU: [32]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [True]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - InnerUnroll: [2]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
           - Exact: [16, 16, 1, 8]
