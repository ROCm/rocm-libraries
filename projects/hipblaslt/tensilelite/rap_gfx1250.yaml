  #     BenchmarkCommonParameters:
  #       - KernelLanguage: ["Assembly"]
  #     ForkParameters:
  #       - ReuseAcrossPersistent: [0,1]
  #       - PrefetchAcrossPersistent: [0,1]
  #       - PrefetchGlobalRead: [1,2]
  #       - MatrixInstruction:
  #         - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 9
  #         - [16, 16, 128, 1,  1,  2, 16,  2, 2] # MT 64x512, kTiles 3
  #         - [16, 16, 128, 1,  1,  4,  4,  2, 2] # MT 128x128, kTiles 4
  #       - StreamK: [3]
  #       - StreamKForceDPOnly: [1]
  #       - TDMInst: [3]
  #       - DepthU: [256]
  #       - AssertSummationElementMultiple: [256]
  #       - ExpandPointerSwap: [False]
  #       - ScheduleIterAlg: [4]
  #       - StaggerU: [0]
  #       - SourceSwap: [True]
  #       - InitCIterWmma: [1]
  #       - WorkGroupMapping: [1]
  #       - WavefrontSize: [32]
  #       - UseSgprForGRO: [0]
  #       - ForceDisableShadowInit: [True]
  #     BenchmarkForkParameters:
  #     JoinParameters:
  #     BenchmarkJoinParameters:
  #     BenchmarkFinalParameters:
  #       - ProblemSizes:
  #         - Exact: [64, 12288, 4, 256]    # K floor
  #         - Exact: [64, 12288, 4, 512]
  #         - Exact: [64, 12288, 4, 768]    # ceiling for 64x512
  #         - Exact: [64, 12288, 2, 1536]
  #         - Exact: [64, 12288, 1, 2304]   # ceiling for 64x256
  #         - Exact: [128, 12288, 4, 256]
