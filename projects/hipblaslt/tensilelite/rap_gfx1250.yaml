TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 1
  NumWarmups: 0
  KernelTime: true
  Architecture: gfx1250
  NumElementsToValidate: -1
  BoundsCheck: 0
  CpuThreads: 32
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  # Alpha and Beta both 2: at 1 a dropped or mis-applied scale is invisible.
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 2
  PrintLevel: 2

BenchmarkProblems:

  ########################################################################
  # 1. A=F8 B=F4 (MX) -- MacroTile sweep.
  #    Prefetch axes pinned so the only thing moving is the tile shape.
  #    kTiles: 64x256 -> 8, 64x512 -> 3, 128x128 -> 4.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Under test.
        - ReuseAcrossPersistent: [0,1]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256
          - [16, 16, 128, 1,  1,  2, 16,  2, 2] # MT 64x512
          - [16, 16, 128, 1,  1,  4,  4,  2, 2] # MT 128x128
          # MT 128x256 omitted: rapCheckStoreNeutrality rejects RAP there, so
          # only the RAP 0 control would build and the comparison is empty.
        # Required by RAP. Wave-separated TDM (TDMInst 3 with NumWaves > 1) is
        # what lets RAP silence A's transfers per wave parity; ASEM == DepthU is
        # what gives NoTailLoop; ExpandPointerSwap must be off.
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        - PrefetchAcrossPersistent: [1]
        - PrefetchGlobalRead: [2]
        # Rest of the audited configuration; all differ from the parameter default.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # N = 12288 is a multiple of 128, 256 and 512, so one N serves every
          # MacroTile here, and it leaves several tiles per workgroup -- without
          # that the reuse copy never runs and only the fill copy is tested.
          # M selects which MacroTile answers: 64 for the 64xN pair, 128 for
          # 128x128. The rest report DID_NOT_SATISFY_ASSERTS.
          - Exact: [64, 12288, 4, 256]    # one k-tile: the K floor
          - Exact: [64, 12288, 4, 512]
          - Exact: [64, 12288, 4, 768]    # ceiling for 64x512
          - Exact: [64, 12288, 2, 1024]
          - Exact: [64, 12288, 1, 2048]   # ceiling for 64x256
          - Exact: [128, 12288, 4, 256]
          - Exact: [128, 12288, 4, 768]
          - Exact: [128, 12288, 2, 1024]  # ceiling for 128x128
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 2. A=F8 B=F4 (MX) -- prefetch and persistence sweep at MT 64x256.
  #    PrefetchGlobalRead 1 and 2 change how many trailing k-tiles RAP has to
  #    silence, and PrefetchAcrossPersistent 0 and 1 are independent of RAP but
  #    share its persistent loop, so all four pairings are exercised.
  ########################################################################
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: E8
      DataTypeMXSB: E8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        # Under test.
        - ReuseAcrossPersistent: [0,1]
        - PrefetchAcrossPersistent: [0,1]
        - PrefetchGlobalRead: [1,2]
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  2,  8,  2, 2] # MT 64x256, kTiles 8
        # Required by RAP.
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - TDMInst: [3]
        - DepthU: [256]
        - AssertSummationElementMultiple: [256]
        - ExpandPointerSwap: [False]
        # Rest of the audited configuration.
        - ScheduleIterAlg: [4]
        - StaggerU: [0]
        - SourceSwap: [True]
        - InitCIterWmma: [1]
        - WorkGroupMapping: [1]
        - WavefrontSize: [32]
        - UseSgprForGRO: [0]
        - ForceDisableShadowInit: [True]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 12288, 4, 256]    # K floor, many tiles per workgroup
          - Exact: [64, 12288, 4, 1280]
          - Exact: [64, 12288, 4, 2048]   # K ceiling
          - Exact: [64, 12288, 1, 1024]   # batch 1
          - Exact: [64, 12288, 2, 1536]   # batch 2
          # Few enough tiles that a workgroup gets one: exercises the fill copy
          # alone, with the reuse copy never entered.
          - Exact: [64, 2048, 1, 512]
        - ActivationArgs:
          - [Enum: none]

  ########################################################################
  # 3. A=F8 B=F8 -- DISABLED, does not pass today.
  #
  # Measured 2026-08-31 at MT 64x256 / 64x512 / 128x128, DepthU 256, PGR 1 and 2:
  #   RAP 1                       FAILED, including at PAP 0
  #   RAP 0 with PAP 1            FAILED at K 256 and 768, passed at 512
  #   RAP 0 with PAP 0            PASSED
  # So there are two separate defects here and only one of them is RAP's. Both
  # reproduce unchanged on the base commit, so neither was introduced by the
  # ReuseAcrossPersistent work; the PAP one is visible without RAP at all.
  #
  # A minimal repro is this group cut down to MT 64x512 and PGR 2 -- 4 kernels
  # over 3 sizes, about 90 seconds.
  #
  # Re-enable this group by uncommenting it once the non-MX path is fixed. The
  # tile shapes and sizes below mirror group 1, except that F8/F8 holds no MX
  # scales so the store has more slack: kTiles is 9 at 64x256 rather than 8.
  ########################################################################
  # -
  #   - # ProblemType, TN
  #     OperationType: GEMM
  #     MacDataTypeA: F8
  #     MacDataTypeB: F8
  #     DataType: F8
  #     DestDataType: s
  #     ComputeDataType: s
  #     HighPrecisionAccumulate: True
  #     TransposeA: True
  #     TransposeB: False
  #     UseBeta: True
  #     Batched: True
  #     Activation: False
  #     SupportUserArgs: True
  #     UseBias: 0
