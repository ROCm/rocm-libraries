    - AssertSummationElementMultiple: [32]
    - ClusterDim: [[1, 4]]
    - ClusterLocalRead: [0]
    - DepthU: [512]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [1]
    - GlobalReadVectorWidthB: [1]
    - GlobalSplitUWorkGroupMappingRoundRobin: [true]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadA: [512]
    - LdsBlockSizePerPadB: [1024]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [16]
    - LdsPadB: [16]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [16]
    - LocalReadVectorWidthB: [16]
