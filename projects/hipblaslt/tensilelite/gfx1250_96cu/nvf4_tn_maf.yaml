GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 2
  EnqueuesPerSync: 1000
  #NumBenchmarks: 10
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0
  #RotatingBufferSize: 256


BenchmarkProblems:
- - OperationType: GEMM
    Batched: true
    ComputeDataType: 0
    DataType: 21
    DataTypeMXSA: 15
    DataTypeMXSB: 15
    DestDataType: 7
    HighPrecisionAccumulate: true
    MXBlockA: 16
    MXBlockB: 16
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Activation: false
    SupportUserArgs: true
    UseBias: 0
  - InitialSolutionParameters:
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ActivationFuncCall: [false]
    - AssertFree0ElementMultiple: [2]
    - AssertFree1ElementMultiple: [2]
    - AssertSummationElementMultiple: [16]
    - ClusterDim: [[4, 4]]
    - ClusterLocalRead: [0]
    - DepthU: [512]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [2]
    - GlobalReadVectorWidthB: [2]
    - GlobalSplitUWorkGroupMappingRoundRobin: [true]
    - HalfPLR: [1]
    - InitCIterWmma: [1]
    - LDSSegmentInterleave: [1]
    - LdsBlockSizePerPadA: [2048]
    - LdsBlockSizePerPadB: [1024]
    - LdsBlockSizePerPadMXSA: [256]
    - LdsBlockSizePerPadMXSB: [256]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [32]
    - LdsPadB: [32]
    - LdsPadMXSA: [16]
    - LdsPadMXSB: [16]
    - LocalReadVectorWidthA: [32]
    - LocalReadVectorWidthB: [32]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PrefetchGL2: [2]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - SourceSwap: [true]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - StoreVectorWidth: [8]
    - SuppressNoLoadLoop: [true]
    - TDMInst: [3]
    - TDMIterateMode: [1]
    - ThreadTile: [[1, 1]]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - UseSgprForGRO: [0]
    - VectorWidthA: [8]
    - VectorWidthB: [4]
    - WavefrontSize: [32]
    - WorkGroupMapping: [1]
    - Groups:
      - - MatrixInstruction: [32, 16, 128, 1, 1, 8, 4, 2, 2]
          WorkGroup: [64, 2, 1]
          MIArchVgpr: true
    BenchmarkJoinParameters:
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [4096, 3072, 1, 65536]
LibraryLogic:
  ScheduleName: "gfx1250"
  DeviceNames: ["Device 75c7"]
  ArchitectureName: "gfx1250"
