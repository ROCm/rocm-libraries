GlobalParameters:
  # All-GPU single-process benchmarking (same workload on every visible GPU, released
  # simultaneously; reports median/mean per-GPU time and per-GPU + total-node FLOPS).
  # Uncomment to enable (do NOT combine with the per-process gfx1250_96cu AGT harness,
  # which drives one device per client process):
  #AllDevices: True
  #LaunchSyncMode: gate     # 'gate' (device-side spin gate) or 'barrier' (host thread barrier)
  #TimeAggregation: median  # 'median' or 'mean' (both are always reported)
  NumElementsToValidate: -1
  NumElementsToValidateWinner: 0
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: True
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 3
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 100
  EnqueuesPerSync: 1000
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  #NumBenchmarks: 10
  #RotatingBufferSize: 1024
  ForceGenerateKernel: 1

BenchmarkProblems:
- - OperationType: GEMM
    Batched: true
    ComputeDataType: 0
    DataType: 21
    DestDataType: 7
    HighPrecisionAccumulate: true
    MXBlockA: 32
    MXBlockB: 32
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Activation: false
    SupportUserArgs: true
    UseBias: 0
  - InitialSolutionParameters:
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ActivationFuncCall: [false]
    - AssertFree0ElementMultiple: [2]
    - AssertFree1ElementMultiple: [2]
    - AssertSummationElementMultiple: [32]
    - ClusterDim: [[1, 2]]
    - ClusterLocalRead: [0]
    - DepthU: [512]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [-1]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [-1]
    - GlobalReadVectorWidthB: [-1]
    - GlobalSplitUWorkGroupMappingRoundRobin: [true]
    - InitCIterWmma: [-1]
    - LdsBlockSizePerPadA: [-1]
    - LdsBlockSizePerPadB: [-1]
    - LdsBlockSizePerPadMXSA: [-1]
    - LdsBlockSizePerPadMXSB: [-1]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [-1]
    - LdsPadB: [-1]
    - LdsPadMXSA: [-1]
    - LdsPadMXSB: [-1]
    - LocalReadVectorWidth: [-1]
    - LocalReadVectorWidthA: [-1]
    - LocalReadVectorWidthB: [-1]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [-1]
    - MbskPrefetchMethod: [-1]
    - MinGRIncPerMfma: [-1]
    - PrefetchGL2: [1]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [-1]
    - ScheduleIterAlg: [4]
    - SourceSwap: [true]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - StoreVectorWidth: [-1]
    - TDMInst: [3]
    - TDMPlusLdsBuf: [0]  # -1 picks 1 here (3 LDS buffers fit); the tuned kernel uses 0
    - ThreadTile: [[1, 1]]
    - TransposeLDS: [-1]
    - UseCustomMainLoopSchedule: [-1]
    - UseSgprForGRO: [0]
    - VectorWidthA: [-1]
    - VectorWidthB: [-1]
    - WavefrontSize: [32]
    - WorkGroupMapping: [1]
    - Groups:
      - - MatrixInstruction: [16, 16, 128, 1, 1, 1, 4, 1, 4]
          WorkGroup: [16, 8, 1]
          MIArchVgpr: true
    BenchmarkJoinParameters:
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [16, 49152, 1, 65536]
LibraryLogic:
  ScheduleName: "gfx1250"
  DeviceNames: ["Device 75c7"]
  ArchitectureName: "gfx1250"
