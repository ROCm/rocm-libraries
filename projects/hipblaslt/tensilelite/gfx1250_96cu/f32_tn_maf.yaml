GlobalParameters:
  SyncsPerBenchmark: 1
  NumElementsToValidate: 0
  NumElementsToValidateWinner: -1
  KernelTime: False
  BoundsCheck: 0
  PrintSolutionRejectionReason: False
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 13
  DataInitTypeB: 12
  DataInitTypeD: 2
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  # PrintTensorC: 1
  # PrintTensorD: 1
  # PrintTensorRef: 1
  NumWarmups: 2
  EnqueuesPerSync: 1000
  PrintWinnersOnly: True
  Architecture: gfx1250
  KeepBuildTmp: True
  PrintLevel: 2
  SkipSlowSolutionRatio: 0.0
  RotatingBufferSize: 384


BenchmarkProblems:
- - OperationType: GEMM
    Batched: true
    ComputeDataType: 0
    DataType: 0
    DestDataType: 0
    HighPrecisionAccumulate: false
    TransposeA: true
    TransposeB: false
    UseBeta: true
    Activation: false
    SupportUserArgs: true
    UseBias: 0
  - InitialSolutionParameters:
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - ActivationFuncCall: [false]
    - DepthU: [32]
    - DirectToLdsMetadata: [0]
    - DtlPlusLdsBuf: [0]
    - ExpandPointerSwap: [false]
    - ForceDisableShadowInit: [true]
    - GlobalReadVectorWidthA: [1]
    - GlobalReadVectorWidthB: [1]
    - GlobalSplitU: [-1]
    - InitCIterWmma: [1]
    - LdsBlockSizePerPadA: [512]
    - LdsBlockSizePerPadB: [512]
    - LdsBlockSizePerPadMXSA: [0]
    - LdsBlockSizePerPadMXSB: [0]
    - LdsBlockSizePerPadMetadata: [0]
    - LdsPadA: [4]
    - LdsPadB: [4]
    - LdsPadMXSA: [0]
    - LdsPadMXSB: [0]
    - LocalReadVectorWidthA: [4]
    - LocalReadVectorWidthB: [4]
    - MXLoadInst: [TDM]
    - MXScaleFormat: [InMemorySwizzle]
    - MaxLDS: [327680]
    - MbskPrefetchMethod: [0]
    - MinGRIncPerMfma: [1]
    - PrefetchGL2: [1]
    - PrefetchGlobalRead: [2]
    - ScheduleGROverBarrier: [0]
    - ScheduleIterAlg: [4]
    - SourceSwap: [true]
    - StaggerU: [0]
    - StaggerUStride: [0]
    - StoreVectorWidth: [4]
    - TDMInst: [3]
    - ThreadTile: [[1, 1]]
    - TransposeLDS: [1]
    - UseCustomMainLoopSchedule: [0]
    - UseSgprForGRO: [0]
    - VectorWidthA: [4]
    - VectorWidthB: [4]
    - WavefrontSize: [32]
    - WorkGroupMapping: [1]
    - Groups:
      - - MatrixInstruction: [16, 16, 4, 1, 1, 4, 8, 1, 4]
          WorkGroup: [16, 8, 1]
          MIArchVgpr: true
    BenchmarkJoinParameters:
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [4096, 3072, 1, 65536]
LibraryLogic:
  ScheduleName: "gfx1250"
  DeviceNames: ["Device 75c7"]
  ArchitectureName: "gfx1250"
