[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
omit = [
    "*/Tests/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/build_tmp/*",
    "*/build/*",
    "*/.tox/*",
    "*/site-packages/*",
    "*/conftest.py",
    "*/setup.py",
    "*/.eggs/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"
# Whole-project coverage floor (AIHPBLAS-3877). This is the single documented
# source of truth for the floor: the `coverage report` step in the coverage-gate
# tox env reads it, so a job that runs that env fails when coverage drops below
# this number, without the value being duplicated in tox.ini or CI YAML.
# (coverage-unit measures with --fail-under=0 and does not gate; see tox.ini.)
# The GPU-less coverage-unit run is stable at ~84%. Keep two percentage points
# of headroom for run-to-run variation while the per-file ratchet
# (AIHPBLAS-3878) protects the individual modules.
fail_under = 82
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    "@abstractmethod",
    "pass",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
title = "TensileLite Code Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
show_contexts = true

[tool.pytest.ini_options]
# You can also move pytest config here if desired
testpaths = ["tensilelite/Tests", "rocisa/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project]
name = "tensile"
version = "5.0.0"
requires-python = ">=3.10"
description = "A code generation library for high-performance GEMM and tensor contraction kernels on AMD GPUs."
license = {text = "MIT"}
dependencies = [
    "packaging",
    "pyyaml",
    "msgpack>=1.0",
    "joblib>=1.4.0",
    "simplejson",
    "ujson",
    "orjson",
    "yappi",
    "filelock>=3.0.0",
    "numpy>=1.26.0",
    "hip-python; sys_platform != 'win32'",
]

[project.scripts]
Tensile = "tensilelite.Tensile:main"
TensileCreateLibrary = "tensilelite.TensileCreateLibrary:run"
TensileVerifyStinkyElfText = "tensilelite.verify_stinky_comment_vs_elf_text:main"
TensileGetPath = "tensilelite:PrintTensileRoot"
TensileBenchmarkCluster = "tensilelite.TensileBenchmarkCluster:main"
TensileRetuneLibrary = "tensilelite.TensileRetuneLibrary:main"

[dependency-groups]
# Compatibility constraints belong here; selected tool versions are pinned in uv.lock.
# Minimal tools for tests against a prebuilt installation.
# Additional source_only test prerequisites are supplied by build/dev.
test = [
    # Pytest >=5.4.1 avoids multiprocessing exception crashes in older releases.
    # https://github.com/pytest-dev/pytest/issues/5971
    "pytest>=5.4.1",
    "pytest-timeout",
    "pytest-xdist>=1.32.0",
    "syrupy",
]
# Tools for source linting, security checks, and formatting.
lint = ["flake8", "bandit", "black", "isort"]
# Tools for building the core Python package and native extension.
# Package build requirements belong in the owning package's build-system.requires.
# rocisa's build tools are also needed by no-isolation development builds and by
# requirements.txt consumers that build rocisa outside package build isolation.
build = [
    "setuptools",
    "scikit-build-core>=1.0",
    "nanobind>=2.0,!=3.0.0",  # see rocisa/pyproject.toml for why 3.0.0 is excluded
    "cmake",
    # Source builds use Invoke's rocisa and build-client tasks.
    "invoke",
]
# Minimal tools for inspecting coverage reports and enforcing coverage floors.
coverage = ["coverage[toml]>=7.0.0"]
# Full contributor environment for core builds, tests, linting, formatting,
# and coverage; selected by plain uv sync.
dev = [
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "coverage" },
    { include-group = "lint" },
    # Install local rocisa for source development and tests. Native builds and
    # prebuilt test artifacts supply it for the other requirements profiles.
    "rocisa",
    "ninja",
    "tox",
    "pytest-cov>=4.0.0",
    "lcov-cobertura",
    "pycobertura",
    "pre-commit",
    "mutmut>=3.6",
    "memory-profiler",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tensilelite*", "Tensile"]
exclude = ["tensilelite.Tests.unit.source_only*"]

[tool.setuptools.exclude-package-data]
"*" = ["Tests/unit/source_only/*", "source_only/*"]
[tool.uv]
# Use the user's existing interpreter; never download a uv-managed Python.
# rocisa is a HIP/nanobind native ext, so the chosen Python must have its dev
# files (Python.h / libpython) -- the ROCm dev container's system Python does
# (it already builds rocisa via `tox -e rocisa`). No version is pinned here;
# uv picks whatever satisfies requires-python (>=3.10).
python-preference = "only-system"
# rocisa's manual editable rebuild reuses its CMake tree. Build against the
# project environment so that tree does not retain paths into a deleted isolated
# build environment; keep its build dependencies in the default dev sync.
no-build-isolation-package = ["rocisa"]

[tool.uv.config-settings-package.rocisa]
# Separate TensileLite's development CMake state from standalone rocisa builds.
# Tox overrides this with a directory inside each environment.
"build-dir" = "build/tensilelite/{wheel_tag}"
# Rebuild explicitly before tests instead of checking on every process's import.
"editable.rebuild" = "false"
# Report watched native sources newer than the extension if a rebuild was missed.
"cmake.define.ROCISA_INCLUDE_BUILD_INFO" = "ON"
# Exercise the example pass in uv development; standalone rocisa defaults stay unchanged.
"cmake.define.ROCISA_BUILD_HELLOWORLD_STATIC_PLUGIN" = "ON"

[tool.uv.sources]
rocisa = { workspace = true }

[tool.uv.workspace]
members = ["rocisa"]

# Mutation testing (mutmut 3.x) — slice-1 pilot.
# See projects/hipblaslt/skills/tensilelite-mutation-rerun/SKILL.md for the
# optional workflow.
# mutmut 3.x copies `source_paths` into a `mutants/` dir and runs the selected
# tests there, so the WHOLE Tensile package is copied (for imports to resolve)
# while `only_mutate` restricts which files are actually mutated to the slice.
# `also_copy` must include pytest.ini (markers + config) and characterization
# fixtures. mutmut caches the initial non-Python source copy, so snapshots must
# be refreshed explicitly for the copied test tree to match the source suite.
[tool.mutmut]

source_paths = ["tensilelite"]
only_mutate = [
    "tensilelite/Common/DataType.py",
    "tensilelite/Common/Utilities.py",
    "tensilelite/Common/Types.py",
    "tensilelite/Common/ValidParameters.py",
    "tensilelite/SolutionStructs/Naming.py",
    "tensilelite/SolutionStructs/Utilities.py",
    "tensilelite/TensileLogic/ValidChipId.py",
    "tensilelite/TensileLogic/ValidMatrixInstruction.py",
    "tensilelite/TensileLogic/ValidWorkGroup.py",
    "tensilelite/TensileLogic/ValidWorkGroupMappingXCC.py",
]
do_not_mutate = [
    "tensilelite/Tests/*",
    "*/Tests/*",
    "*/test_*.py",
    "*/conftest.py",
]
pytest_add_cli_args_test_selection = [
    "tensilelite/Tests/unit/characterization/CommonTypes",
    "tensilelite/Tests/unit/characterization/CommonUtilities",
    "tensilelite/Tests/unit/characterization/DataType",
    "tensilelite/Tests/unit/characterization/Naming",
    "tensilelite/Tests/unit/characterization/SolutionStructsUtils",
    "tensilelite/Tests/unit/characterization/TensileLogic",
    "tensilelite/Tests/unit/characterization/ValidParameters"
]
also_copy = ["pytest.ini", "tensilelite/Tests/unit/characterization"]
# mutate_only_covered_lines MUST stay false here: when true, mutmut runs an
# in-process coverage gather whose _unload_modules_not_in() pops `rocisa` from
# sys.modules; the later "Running stats" phase re-imports rocisa in the SAME
# process -> nanobind duplicate registration -> SIGABRT (exit 134, no Python
# traceback). Per-mutant runs are fork children (one rocisa import each) so they
# are safe; only the in-process gather is the hazard. To re-enable covered-lines
# later, pre-import rocisa at interpreter startup (e.g. a sitecustomize.py on the
# path) so the unload snapshot keeps it loaded. Verified in-container 2026-06-07.
mutate_only_covered_lines = false
# Timeout deadline = (baseline_test_time + timeout_constant) * timeout_multiplier,
# enforced as a WALL-CLOCK limit (SIGXCPU from a checker thread). The baseline is
# measured once on a lightly loaded box, so when the run self-contends (mutmut
# defaults max_children to os.cpu_count() -> 128 workers here) or a neighbouring
# container adds load, per-mutant wall time inflates past the fixed deadline and
# healthy mutants are miscounted as timeouts. Raising the multiplier gives margin;
# always pair with `mutmut run --max-children 32` to bound self-contention so the
# measurement is reproducible regardless of host load. A slice-2 run at host load
# 35 produced 178 spurious timeouts under the defaults. Verified 2026-07-22.
timeout_multiplier = 30.0
# max_stack_depth is intentionally unset. It controls mutmut's dynamic
# test-to-function association rather than source slicing. Measure candidate
# values against the full unit-test candidate set before enabling one; a value
# that is too low can exclude valid deeper characterization tests.
