# rocFFT Test Categories Configuration
#

test_categories:
  quick:
    description: "Smoke - rocfft-test --smoketest (target: ~5 min)"
    test_patterns:
      - "*"
    exclude:
    extra_args:
      - "--smoketest"
    labels:
      - "quick"

  standard:
    description: "Pre-checkin - rocfft-test --test_prob 0.02"
    test_patterns:
      - "*"
    exclude:
      - "*multi_gpu*"
    extra_args:
      - "--test_prob"
      - "0.02"
    labels:
    # standard/comprehensive/full run the same single-GPU test set
      - "standard"
      - "comprehensive"
      - "full"

  # Same arguments as the math-ci extended job.
  bitwise_repro:
    description: "Bitwise reproducibility - rocfft-test *bitwise_repro* with a repro database"
    test_patterns:
      - "*bitwise_repro*"
    exclude:
    extra_args:
      - "--repro-db"
      - "bitwise_repro.db"
      - "--gtest_repeat=2"
    labels:
      - "comprehensive"
      - "full"

  # Multi-GPU only subset. These tests are excluded from the single-GPU
  # categories above (via "*multi_gpu*" excludes) and are instead selected
  # by a dedicated multi-GPU CI job that runs `ctest -L multigpu_<tier>`.
  # The labels are namespaced (multigpu_*) so they never overlap with the
  # single-GPU tier labels.
  multigpu_tests:
    description: "Multi-GPU only - rocfft-test *multi_gpu* (multi-GPU runner)"
    test_patterns:
      - "*multi_gpu*"
    exclude:
    extra_args:
      - "--test_prob"
      - "0.02"
    labels:
      - "multigpu_comprehensive"
      - "multigpu_full"

  ffm-quick:
    description: "Small test suite for simulation tests"
    test_patterns:
      - "*"
    exclude:
    extra_args:
      - "--simulation=quick"
    labels:
      - "ffm-quick"
      - "ffm-full" # alias to "ffm-quick" for now

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600           # 10 min
    standard: 10800      # 3 hours (covers standard/comprehensive/full labels), keep it conservative until oversubscription concerns in CI are addressed
    bitwise_repro: 1800  # 30 min
    ffm-quick: 7200      # 2 hours
    multigpu_tests: 3600 # 1 hour
