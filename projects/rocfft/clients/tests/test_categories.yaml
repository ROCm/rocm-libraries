# rocFFT Test Categories Configuration
#

test_categories:
  quick:
    description: "Smoke - rocfft-test --smoketest (target: ~5 min)"
    test_patterns:
      - "*"
    exclude:
    extra_args:
      - "--smoketest"
    labels:
      - "quick"

  standard:
    description: "Pre-checkin - rocfft-test --test_prob 0.02"
    test_patterns:
      - "*"
    exclude:
      - "*multi_gpu*"
    extra_args:
      - "--test_prob"
      - "0.02"
    labels:
      - "standard"

  comprehensive:
    description: "Nightly - rocfft-test --test_prob 0.1"
    test_patterns:
      - "*"
    exclude:
      - "*multi_gpu*"
    extra_args:
      - "--test_prob"
      - "0.1"
    labels:
      - "comprehensive"

  # Same arguments as the math-ci precheckin job: every test (the default
  # --test_prob is 1) plus 10 random ones.
  full:
    description: "Full - rocfft-test --nrand 10"
    test_patterns:
      - "*"
    exclude:
      - "*multi_gpu*"
    extra_args:
      - "--nrand"
      - "10"
    labels:
      - "full"

  # Multi-GPU only subset. These tests are excluded from the single-GPU
  # categories above (via "*multi_gpu*" excludes) and are instead selected
  # by a dedicated multi-GPU CI job that runs `ctest -L multigpu_<tier>`.
  # The labels are namespaced (multigpu_*) so they never overlap with the
  # single-GPU tier labels.
  multigpu_tests:
    description: "Multi-GPU only - rocfft-test *multi_gpu* (multi-GPU runner)"
    test_patterns:
      - "*multi_gpu*"
    exclude:
    extra_args:
      - "--test_prob"
      - "0.02"
    labels:
      - "multigpu_comprehensive"
      - "multigpu_full"

  ffm-quick:
    description: "Small test suite for simulation tests"
    test_patterns:
      - "*"
    exclude:
    extra_args:
      - "--simulation=quick"
    labels:
      - "ffm-quick"
      - "ffm-full" # alias to "ffm-quick" for now

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 600           # 10 min
    standard: 10800      # 3 hours, keep it conservative until oversubscription concerns in CI are addressed
    comprehensive: 21600 # 6 hours
    full: 43200          # 12 hours
    ffm-quick: 7200      # 2 hours
    multigpu_tests: 3600 # 1 hour
