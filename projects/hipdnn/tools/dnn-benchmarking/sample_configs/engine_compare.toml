# Engine comparison recipe.
# Run with:
#   dnn-benchmark --config sample_configs/engine_compare.toml
# Override any scalar from the CLI, for example:
#   dnn-benchmark --config sample_configs/engine_compare.toml --iters 500

version = 1

graphs = [
  "../graphs/sample_conv_fwd.json",
]

warmup = 20
iters = 200
seed = 123
validate = "none"
metrics_tier = "basic"

[[engines]]
id = 1
# Optional: uncomment when comparing plugin directories.
# plugin_path = "/opt/rocm/lib/hipdnn/plugins/baseline"

[[engines]]
id = 2
# Optional: uncomment when comparing plugin directories.
# plugin_path = "/path/to/candidate/plugins"
