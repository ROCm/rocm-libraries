# Source of truth for the shipped hipkernel:hip_conv_fwd_bias_dw2d_rdna catalog: a depthwise
# 2-D (and 1-D) forward convolution (groups == C, K a multiple of C) followed by a
# per-output-channel bias ADD, for the gfx11 (RDNA3/3.5) and gfx12 (RDNA4) targets. Its variants
# are those of hipkernel:hip_conv_fwd_dw2d_rdna built with a bias epilogue: the specialized
# kernel (../conv_dw2d_rdna/kernels/ConvFwdDepthwise2d.cpp) with HAS_BIAS, and the generic kernel
# of the dw3d bundle (../conv_dw3d_rdna/kernels/ConvFwdDepthwise3d.cpp) with DW_HAS_BIAS.
#
# The native matcher (HipConvFwdBiasDw2dRdnaNative.cpp) admits a conv_fprop node whose virtual
# output feeds a pointwise ADD with a bias of one value per output channel. It picks the variant
# as the unfused engine does (ConvRdnaDw2d.cpp, geometryOf), so each graph has one candidate; the
# shapes here must match it.

dialect: packaged
authored_subpath: hip/conv_bias_dw2d_rdna
engine:
  name: hipkernel:hip_conv_fwd_bias_dw2d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: variant
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: filter_h
  type: int
- name: filter_w
  type: int
- name: stride
