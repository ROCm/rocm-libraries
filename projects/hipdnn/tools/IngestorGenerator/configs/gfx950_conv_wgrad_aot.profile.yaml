  - {name: row_unroll, type: int, default_value: 0, builder_default: true}
  - {name: rows_per_seg, type: int, default_value: 0, builder_default: true}
  - {name: target_blocks, type: int, default_value: 0, builder_default: true}
  - {name: unfold_n, type: int, default_value: 0, builder_default: true}
  - {name: wave_c16, type: int, default_value: 0, builder_default: true}
  - {name: wave_k16, type: int, default_value: 0, builder_default: true}
  - {name: lanes_c, type: int, default_value: 0, builder_default: true}
  - {name: lanes_w, type: int, default_value: 0, builder_default: true}
  - {name: channels, type: int, default_value: 0, builder_default: true}
  - {name: strip, type: int, default_value: 0, builder_default: true}
  - {name: threads, type: int, default_value: 0, builder_default: true}
  - {name: q_tiles, type: int, default_value: 0, builder_default: true}
  - {name: rows_per_chunk, type: int, default_value: 0, builder_default: true}
  - {name: wave_q4, type: int, default_value: 0, builder_default: true}
  - {name: taps, type: int, default_value: 0, builder_default: true}

vocabulary:
  dtype: {fp16: fp16, bf16: bf16}
  layout: {NHWC: NHWC}
  pipeline: {mem: mem, compv3: compv3, compv4: compv4, direct: direct}
  epilogue: {cshuffle: cshuffle, default: default, direct: direct}
  direct_variant: {none: none, direct_wgrad: direct_wgrad, direct_wgrad_tiled: direct_wgrad_tiled, direct_wgrad_dw: direct_wgrad_dw, direct_wgrad_dw_cols: direct_wgrad_dw_cols, direct_wgrad_dw_mfma: direct_wgrad_dw_mfma, direct_wgrad_gather: direct_wgrad_gather, direct_wgrad_grouped_mfma: direct_wgrad_grouped_mfma, direct_wgrad_fold: direct_wgrad_fold}

# The cpp_mirror names below are the native pack's: packs/Gfx950ConvWgradNative.cpp and
# packs/Gfx950ConvWgradGeometry.hpp (not yet landed -- Phase 3/4). Both sides build one
# launch plan per (instance, problem) -- the ordered kernel steps with their grids,
# buffers, scalar values, the zero-dW requirement and the fold's workspace region -- and
# serialize it the same way (Gfx950ConvWgradPlan.serialize / serializePlan). A future
# make_conv_wgrad_aot_test_vectors.py (mirroring dgrad's, Phase 4) would pin the C++ plan
# digest of every catalog instance on every problem of the vector set to the Python plan.
launch_surface:
  - name: instance_contract
    python_source: builders/common/convolution_backward_filter.py:supports_gfx950_conv_wgrad_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradGeometry.hpp:parseAotInstance
    kmd_fields: [dtype, layout, kernel_family, direct_variant, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue, vector_size_a, vector_size_b, vector_size_c, lds_k_outer, grouped, async_dma, unroll_k, lds_k_pad, lds_layout, group_merge, ws_replicas, prefetch_addr, split_k, two_stage, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, cpg, kpg, instance_id]
    guard: parseAotInstance reads kernel_family first. Implicit GEMM (0) needs NHWC, wave64, a mem/compv3/compv4 pipeline, a default or cshuffle epilogue, positive tile/warp fields, widths in {1,2,4,8}, 0/1 flags, split_k >= -1 and every filter/stride/pad/dilation/channel field at 0 (a wgrad binary bakes no geometry at all, unlike dgrad's tilde kernels). Direct (1) and helper (2) instances need the direct placeholders, a variant of their family, the baked geometry (direct) or an all-zero geometry plus taps (helper), and the knobs their variant uses (AOT_WGRAD_DIRECT_KNOBS). Missing or malformed fields refuse the kernel; the kernel matcher never admits a helper.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvWgradMatchers.cpp
  - name: launch_plan
    python_source: builders/common/convolution_backward_filter.py:gfx950_conv_wgrad_aot_plan
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradGeometry.hpp:instancePlan
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n, tile_k, vector_size_a, vector_size_b, vector_size_c, grouped, group_merge, split_k, two_stage, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, cpg, kpg]
    guard: The instance serves the problem exactly when a plan exists. Implicit GEMM follows rocKE's identity_supports_problem and gfx950_conv_wgrad_aot_split_k (which always re-resolves the real split-K degree from the problem, exactly as dispatch.grouped_convolution._wgrad_split_k -- the catalog's own baked split_k is never read back). A two_stage instance is a valid, packageable spec but refuses to plan (the Stage 2 reduce is not wired here either, mirroring dispatch.grouped_convolution's own refusal) -- a declared gap, not a silent mis-plan. Direct kernels follow direct_kernel_sweep's own offer; the two families that write dW directly (direct_wgrad, direct_wgrad_tiled) need it zeroed first, the other five need the fold helper launched after them into the same scratch workspace. library/tests/test_convolution_backward_filter_aot_packaging.py checks the plan against rocKE's own offer and launch values.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvWgradGeometry.cpp
  - name: kernargs_and_execution
    python_source: builders/common/convolution_backward_filter.py:gfx950_conv_wgrad_aot_step_signature
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradNative.cpp:stepSignature
    kmd_fields: [dtype, kernel_family, direct_variant]
    guard: One kernarg signature per step ABI -- the implicit-GEMM wgrad ABI (dY, X, dW, byte sizes, the problem values and, when split_k != 1, the degree itself), the direct wgrad ABI (fp32 dW), and the fold helper's (parts, channels scalars after A, D). The GPU suite poisons dW and compares every catalog instance with the CPU reference.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvWgrad.cpp
  - name: helper_fold
    python_source: builders/common/convolution_backward_filter.py:gfx950_conv_wgrad_aot_fold_fields
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradNative.cpp:aotKernelPlan
    kmd_fields: [kernel_family, direct_variant, dtype, taps]
    guard: The five partial-slot families (direct_wgrad_dw, direct_wgrad_dw_cols, direct_wgrad_dw_mfma, direct_wgrad_gather, direct_wgrad_grouped_mfma) each name a fold-helper step; the native pack resolves it in the same kpack by kernel_family 2, direct_variant direct_wgrad_fold, dtype and taps alone -- a fold helper bakes no filter, stride, padding or channel count at all, unlike dgrad's transpose/reorganize helpers which still bake a filter. A missing helper refuses the instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvWgradMatchers.cpp
  - name: fallback_selection
    python_source: builders/common/convolution_backward_filter.py:gfx950_conv_wgrad_aot_runtime_candidates
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradGeometry.hpp:planScore
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n]
    guard: Unbenchmarked order only, until a trained ranker ships. Single-kernel direct plans rank first, then the folded direct families, then implicit GEMM by tile fill; BenchmarkPlan replaces it with measurements of every serving instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvWgradMatchers.cpp
  - name: workspace
    python_source: builders/common/convolution_backward_filter.py:Gfx950ConvWgradPlan
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvWgradNative.cpp:workspaceBytes
    kmd_fields: [kernel_family, direct_variant, taps]
    guard: The plan's workspace regions (the fold's per-partition scratch only; the implicit-GEMM wgrad launch bakes no sub-GEMM table or MFMA weight scratch the way dgrad/fwd do, so it asks for no workspace). Every kernel uses static LDS only; prepare requests zero dynamic shared memory.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvWgrad.cpp
