# WIDENED CATALOG: every request carries both tile_k arms so the engine's
# benchmarked selection has a real choice on every request. Derived from
# gfx950_conv_fwd.yaml by moving every shape from knobs1 (tile_k=64 only)
# to knobs0 (tile_k=64 and 128). Shapes and provenance are unchanged.
# Copyright (c) Advanced Micro Devices, Inc., or its affiliates.
# SPDX-License-Identifier: MIT
# Dispatcher-derived catalog: five verification shapes in FP16/BF16, each
# with tile_k=64/128, plus the default variant for every supported unique
# request in dnn-benchmarking's headline convolution corpus.
# Requests and public source hashes: gfx950_conv_fwd.requests.json.
# Each request's _catalog_tile_k records the arms admitted to this catalog.
# Source revision: 36f95cc7a8b8b3ee5ba82b195a8e51a7cd47f6cc; headline DVC object:
# b8e7d9105a49d3e9c566bf26a0f87451 (Workloads/headline/conv.tar.gz.dvc).
# Regenerate descriptors with generate.py --config this-file --output-dir DIR.

