# Packaged-dialect (`variants`) reference config for the hipkernel:Gfx950AttentionUnified3D
# catalog. The catalog's source of truth is the rocKE dispatcher registry, expanded from
# configs/gfx950_attention_unified_3d.engine.yaml by tools/registry_enumerator.py, then
# compacted with tools/factorise_config.py:
#     python tools/registry_enumerator.py --manifest configs/gfx950_attention_unified_3d.engine.yaml --out <scratch>/config.yaml
#     python tools/factorise_config.py --config <scratch>/config.yaml --out configs/gfx950_attention_unified_3d.yaml \
#         --knobs num_segments --vocabulary 'dtype:bf16=BF16,fp16=FP16'
#
# The descriptors under
# dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/descriptors/rocKE/gfx950_attention_unified_3d/
# and src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DPacks.cpp
# are generated from this file. Generation mints fresh UUIDs on every run, so after the
# first generation never copy a regenerated descriptor directory over the live one: render
# into an empty scratch directory and splice only the additions
# (tools/splice_additions.py refuses, writing nothing, if a retained entry changed).
# tests/test_registry_regeneration.py gates this file against
# configs/gfx950_attention_unified_3d.engine.yaml. The generated
# packs/Gfx950AttentionUnified3DNative.cpp and tests/TestGfx950AttentionUnified3DMatchers.cpp
# are stubs; the provider's copies are hand-maintained and must not be overwritten.
#
# The generated gfx950_attention_unified_3d.kdp.json is a DVC output: copy it to
# descriptors/rocKE/gfx950_attention_unified_3d/artifacts/ and run `dvc add artifacts`,
# not `git add`. See the descriptors README ("Large rocKE files live in DVC").
#
# Decode only (seqlen_q 1, decode grid). Three registry candidates, one pack: head_size 64
# and 128, bf16 and fp16, the two causal masks, each at 16, 32 and 64 KV splits with a
# one-page KV tile (16 is the cell's default). Every kernel is two launches of one module
# (build_unified_attention_3d_tiled_module): `segment` and its `reduce` companion. A
# NO_MASK decode graph is the bottom-right causal computation.
#
dialect: packaged
authored_subpath: rocKE/gfx950_attention_unified_3d
engine:
  name: hipkernel:Gfx950AttentionUnified3D
  slug: gfx950_attention_unified_3d
  census_name_symbol: GFX950_ATTENTION_UNIFIED_3D_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - num_segments
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 8
- name: num_kv_heads
  type: int
  default_value: 8
- name: block_size
  type: int
  default_value: 16
- name: mask_type
  type: int
  default_value: 2
- name: sliding_window
  type: int
  default_value: 0
- name: num_segments
  type: int
  default_value: 16
- name: use_decode_grid
  type: int
  default_value: 1
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - block_size
  - mask_type
  - sliding_window
  - num_segments
  - use_decode_grid
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    block_size:
      field: block_size
    mask_type:
      method: mask_type
    sliding_window:
      field: sliding_window
    num_segments:
      field: num_segments
    use_decode_grid:
      field: use_decode_grid
kernel_source_kind: rocke
workspace_policy: derived
reduction:
  fields:
    feature:
    - dtype
    - head_size
    - num_query_heads
    - num_kv_heads
    - causal_top_left
    - right_bound
    - sliding_window
    - block_size
    - use_decode_grid
    performance:
    - name: num_segments
    ignored:
    - waves_per_eu
    - use_kv_lds_swizzle
    - use_wave_page_id_load
  aot_budget_per_arch: 400
packs:
- name: gfx950_attention_unified_3d
  arch:
  - gfx950
  kernel_defaults:
    kind: rocke
    source: kernels/gfx950/attention_tiled_3d.py
    builder: build_unified_attention_3d_tiled_module
    launches:
      segment: {}
      reduce:
        role: reduce
