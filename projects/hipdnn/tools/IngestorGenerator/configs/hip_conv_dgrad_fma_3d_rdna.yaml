# Source of truth for the shipped hipkernel:hip_conv_dgrad_fma_3d_rdna catalog: the backward data
# of a 3-D convolution, which is also the forward of a ConvTranspose3d, for the gfx11 (RDNA3/3.5)
# and gfx12 (RDNA4) targets, compiled from HIP source (../conv_dgrad_fma_2d_rdna/kernels/
# ConvDgradFmaIgemm.cpp, shared with that bundle). An FMA implicit GEMM over the stride phases of
# dx that reads dy and the weights in place, so no variant needs a workspace. One kernel per
# dtype x layout x dx-channel tile. Batch, channels, groups, every spatial extent, stride,
# dilation and padding are launch arguments.
#
# The native matcher (HipConvDgradFma3dRdnaNative.cpp) admits one conv_dgrad node and picks the
# tile from the dx channels per group, so each graph has one candidate. The RDNA targets are
# listed one by one rather than as gfx11-generic / gfx12-generic, so each shard compiles its
# own targets and is stamped with its architecture.

dialect: packaged
authored_subpath: hip/conv_dgrad_fma_3d_rdna
engine:
  name: hipkernel:hip_conv_dgrad_fma_3d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: tile_n
  type: int

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: hip
workspace_policy: none

packs:
- name: hip_conv_dgrad_fma_3d_rdna
  arch: [gfx1100, gfx1101, gfx1102, gfx1103, gfx1150, gfx1151, gfx1152, gfx1153, gfx1200, gfx1201]
