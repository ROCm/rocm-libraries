      entry: ConvDgradFmaIgemm
      build:
        defines: {CONV_DTYPE: 0, CONV_CHANNELS_LAST: 0, TILE_N: 32}
    metadata: {kernel_family: dgrad_fma_igemm, dtype: FLOAT, layout: CHANNELS_FIRST, tile_n: 32}
