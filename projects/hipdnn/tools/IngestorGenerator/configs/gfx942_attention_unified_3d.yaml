# Packaged-dialect (`variants`) selection for the hipkernel:Gfx942AttentionUnified3d
# catalog: the full admitted space of rocKE's strided split-KV decode candidate on
# gfx942, 138 cells / 2192 kernels (segment + reduce launches each). The source of
# truth is the rocKE dispatcher registry, expanded from
# configs/gfx942_attention_unified_3d.engine.yaml; regenerate it, from this directory,
# with (RUNBOOK stage "Populate from the whole registry"):
#     .venv/bin/python tools/registry_enumerator.py \
#         --manifest configs/gfx942_attention_unified_3d.engine.yaml --out <scratch>/registry.yaml
#     .venv/bin/python tools/factorise_config.py --config <scratch>/registry.yaml \
#         --out configs/gfx942_attention_unified_3d.yaml \
#         --knobs block_size,tile_size_override,num_segments \
#         --vocabulary 'dtype:bf16=BF16,fp16=FP16'
# then restore this header. tests/test_registry_regeneration.py gates this file
# against the manifest. A cell is (dtype, head_size, heads); block_size, its tile
# and num_segments are the arms. `default: true` marks each cell's default arm (the
# split rule's pick for kv_block_size 16, batch 32, seqlen_k 8192); neither it nor
# `reduction` reaches a descriptor. 2,192 exceeds the 1000 AOT budget (warning).

dialect: packaged
authored_subpath: rocKE/gfx942_attention_unified_3d
engine:
  name: hipkernel:Gfx942AttentionUnified3d
  census_name_symbol: GFX942_ATTENTION_UNIFIED_3D_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - block_size
  - num_segments
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 32
- name: num_kv_heads
  type: int
  default_value: 8
- name: sliding_window
  type: int
  default_value: 0
- name: block_size
  type: int
  default_value: 16
- name: tile_size_override
  type: int
  default_value: 16
- name: num_segments
  type: int
  default_value: 16
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - sliding_window
  - block_size
  - tile_size_override
  - num_segments
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    sliding_window:
      field: sliding_window
    block_size:
      field: block_size
    tile_size_override:
      method: resolved_tile_size_override
    num_segments:
      field: num_segments
kernel_source_kind: rocke
workspace_policy: derived
reduction:
  fields:
    feature:
    - dtype
    - head_size
    - num_query_heads
    - num_kv_heads
    - sliding_window
    performance:
    - name: block_size
    - name: tile_size_override
      unset_resolves_by: resolved_tile_size_override
    - name: num_segments
    ignored:
    - num_seqs
  aot_budget_per_arch: 1000
packs:
- name: gfx942_attention_unified_3d
  arch:
  - gfx942
  kernel_defaults:
    kind: rocke
    source: kernels/gfx942/attention_tiled_3d.py
    builder: build_unified_attention_3d_module
    launches:
      segment: {}
      reduce:
        role: reduce
  variants:
  - name: attention_unified_3d.bf16_d64_hq1_kv1_b{block_size}_t{md_tile_size_override}_{tag}
    metadata: [dtype, head_size, num_query_heads, num_kv_heads, sliding_window, block_size, tile_size_override, num_segments]
    spec_order: [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_segments, use_alibi, use_qq_bias, num_seqs, waves_per_eu, kv_storage_dtype, use_invariant_hoist, use_wide_kv_load, use_i64_kv_addr, kv_layout, use_decode_grid, kv_cache_policy, use_kv_lds_swizzle, use_wave_page_id_load]
    policy_knobs: [tile_size_override]
    vocabulary:
      dtype:
        bf16: BF16
        fp16: FP16
    spec_defaults: {head_size: 64, num_query_heads: 1, num_kv_heads: 1, dtype: bf16, use_sinks: false, sliding_window: 0, has_softcap: false, use_alibi: false, use_qq_bias: false, num_seqs: 32, waves_per_eu: null, kv_storage_dtype: null, use_invariant_hoist: false, use_wide_kv_load: false, use_i64_kv_addr: false, kv_layout: strided, use_decode_grid: true, kv_cache_policy: stream, use_kv_lds_swizzle: false, use_wave_page_id_load: false}
