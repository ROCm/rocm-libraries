# Source of truth for the shipped hipkernel:hip_conv_fwd_dw2d_rdna catalog: a depthwise 2-D (and
# 1-D) forward convolution (groups == C, K a multiple of C) for the gfx11 (RDNA3/3.5) and gfx12
# (RDNA4) targets, compiled from HIP source.
#
# The specialized kernel (kernels/ConvFwdDepthwise2d.cpp) takes NCHW with K == C and compiles
# the filter, padding, stride and dilation in. It is built for "same" pre-padding,
# dilation x (filter - 1) / 2, on 3x3 / 5x5 / 7x7 at stride 1 or 2 and 1x31 at stride 1, and,
# on the dilation-grid walk (LANE_ON_DILATION_GRID), on 3x3 at dilation 2, 4, 6, 12, 18 and 5x5
# at dilation 2, stride 1. Every other problem, NHWC and channel multipliers above 1 included,
# runs on the generic depthwise kernel of the dw3d bundle with depth 1. The native matcher
# (HipConvFwdDw2dRdnaNative.cpp, geometryOf) picks one variant per graph; the shapes here must
# match it.

dialect: packaged
authored_subpath: hip/conv_dw2d_rdna
engine:
  name: hipkernel:hip_conv_fwd_dw2d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: variant
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: filter_h
  type: int
- name: filter_w
  type: int
- name: stride
  type: int
- name: dilation
  type: int

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: hip
workspace_policy: none

packs:
- name: hip_conv_fwd_dw2d_rdna
  arch: [gfx1100, gfx1101, gfx1102, gfx1103, gfx1150, gfx1151, gfx1152, gfx1153, gfx1200, gfx1201]
