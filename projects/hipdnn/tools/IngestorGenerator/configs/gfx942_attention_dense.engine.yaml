# Engine manifest for hipkernel:Gfx942AttentionDense.
#
# Everything about the engine that rocKE does not know: identity, KMD schema,
# metadata mapping, the registry space its kernels are drawn from, and how that
# space is reduced. The shipped kernel set is configs/gfx942_attention_dense.yaml;
# tests/test_registry_regeneration.py gates it against this manifest.
#
#     python tools/registry_enumerator.py --manifest configs/gfx942_attention_dense.engine.yaml --out <scratch>/config.yaml
#
# The generated packs/Gfx942AttentionDenseNative.cpp and
# tests/TestGfx942AttentionDenseMatchers.cpp are stubs; the provider's copies are
# hand-maintained and must not be overwritten.
#
# Unlike gfx950, the gfx942 dense body reads batch, both sequence lengths AND both
# head counts from kernel params (Gfx942AttentionDenseSpec.runtime_param_fields), so a
# kernel is identified by dtype, head size, mask, window and tuning alone. The head
# counts therefore sit in enumerate.fixed rather than in a cell axis: every head
# configuration lands on the same kernels.
#
# emit_lse is a compile-time variant: an emit_lse kernel also writes the softmax
# log-sum-exp (the graph's stats output) through one trailing lse_ptr argument. It is a
# cell axis, a KMD field and a name slot, so an LSE kernel and its non-LSE twin with the
# same knobs never share a catalog key, and every non-LSE kernel keeps its spec and code
# object (emit_lse=False emits no new IR).

dialect: packaged
authored_subpath: rocKE/gfx942_attention_dense
engine:
  name: hipkernel:Gfx942AttentionDense
  census_name_symbol: GFX942_ATTENTION_DENSE_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - block_m
  - block_n
  - lds_row_pad
  - pv_priority
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 8
- name: num_kv_heads
  type: int
  default_value: 8
- name: causal
  type: int
  default_value: 1
- name: ragged
  type: int
  default_value: 0
- name: sliding_window
  type: int
  default_value: 0
# 1: the kernel writes LSE through a trailing lse_ptr and serves only graphs that bind a
# stats output; 0: neither. A record omitting it completes to the non-LSE kernel.
- name: emit_lse
  type: int
  default_value: 0
- name: batch
  type: int
  default_value: 1
- name: seqlen_q
  type: int
  default_value: 512
- name: seqlen_kv
  type: int
  default_value: 512
# Tile metadata, also public engine knobs. A record omitting either field
# completes to the 256/64 baseline tile through these defaults.
- name: block_m
  type: int
  default_value: 256
- name: block_n
  type: int
  default_value: 64
# Performance knobs at the policy default the kernel resolves when left unset
# (Gfx942AttentionDenseSpec.lds_row_pad / pv_priority).
- name: lds_row_pad
  type: int
  default_value: 8
- name: pv_priority
  type: int
  default_value: 0
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - causal
  - ragged
  - sliding_window
  - emit_lse
  - batch
  - seqlen_q
  - seqlen_kv
  - block_m
  - block_n
  - lds_row_pad
  - pv_priority
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    causal:
      field: causal
    ragged:
      field: ragged
    sliding_window:
      field: sliding_window
    emit_lse:
      field: emit_lse
    batch:
      field: batch
    seqlen_q:
      field: seqlen_q
    seqlen_kv:
      field: seqlen_kv
    block_m:
      field: block_m
    block_n:
      field: block_n
    lds_row_pad:
      field: lds_row_pad
    pv_priority:
      field: pv_priority
kernel_source_kind: rocke
workspace_policy: none

pack: gfx942_attention_dense
arch: gfx942
provider_root: dnn-providers/hip-kernel-provider
source: kernels/gfx942/attention_dense.py
builder: build_attention_dense
kernel_name_template: attention_dense.{dtype}_d{head_size}_c{causal}_swa{sliding_window}_lse{emit_lse}_bm{block_m}_bn{block_n}.gfx942

# The registry space the selection is drawn from (see registry_enumerator.py).
enumerate:
  candidates: dispatch.attention:attention_candidates
  request: dispatch.attention.common:AttentionRequest
  # gfx942_dense_qbminor is the dense candidate whose default spec is the grid the
  # native dispatch launches: one CTA per (query block, query head, batch) at the
  # qb_minor block order, one KV segment. Its knob space scopes persistent,
  # nonpersist_decode and kv_segments out (dense_rules.py), so no enumerated spec
  # leaves that grid kind; reduction.fields.ignored lists them too, as a second guard.
  pin: {algorithm: attention_dense, spec_id: gfx942_dense_qbminor}
  # Request fields every cell shares. Batch, sequence lengths and head counts are
  # runtime kernel params on gfx942, so they only seed the build-time spec.
  fixed: {arch: gfx942, batch: 1, seqlen_q: 512, seqlen_k: 512, nhead_q: 8, nhead_k: 8}
  # Crossed in order, first group outermost (the catalog order).
  cells:
    - fields: [hdim_q, hdim_v]
      values:
        - [64, 64]
        - [128, 128]
    - fields: [dtype]
      values: [bf16, fp16]
    # A causal sliding window is TOP_LEFT_CAUSAL plus sliding_window = W, the number
    # of keys attended including the diagonal (the graph's left_bound). The window is
    # baked into the kernel and must be a multiple of block_n.
    - fields: [mask_type, sliding_window]
      values:
        - [TOP_LEFT_CAUSAL, 0]
        - [NO_MASK, 0]
        - [TOP_LEFT_CAUSAL, 128]
        - [TOP_LEFT_CAUSAL, 512]
        - [TOP_LEFT_CAUSAL, 1024]
        - [TOP_LEFT_CAUSAL, 2048]
    # Innermost: each kernel's LSE twin follows it. The twin differs only in the trailing
    # lse_ptr store, so it shares the cell's knob space.
    - fields: [emit_lse]
      values: [false, true]
  sweep_level: production
  # Every production-sweep spec sharing a cell's feature fields; the knobs it keeps
  # are reduction.fields.performance, every other varying field is held at default.
  space: full
  # Fields of the registry spec every generated kernel carries: the whole
  # Gfx942AttentionDenseSpec, so hkp_pack hydrates nothing from a changed default.
  spec_fields: [dtype, head_size, num_query_heads, num_kv_heads, causal, batch, seqlen_q, seqlen_kv, sliding_window, ragged, varlen, paged, persistent, block_m, block_n, waves_per_eu, lds_k_group_pad, lazy_rescale, interleave, persist_decode, num_persistent, block_size, num_kv_blocks, use_sinks, causal_bottom_right, lds_row_pad, v_row_pad, use_cfvst, use_v_swizzle, use_exp2_fast, iglp, lds_num_buffers, iglp_mode, pv_loop_order, o_store_width, pv_priority, pv_sched_fence_mask, causal_diag_split, emit_lse, nonpersist_decode, kv_segments, window_wave_skip, v_reg_prefetch, chiplet_num_xcds]
  # Frozen build cost: a registry that grows past this fails here, not at pack time.
  max_kernels: 1000

# How the variant space is reduced; copied verbatim into the generated config.
# Feature fields define a cell; performance knobs are the tuning arms, in priority order.
reduction:
  fields:
    feature: [dtype, head_size, num_query_heads, num_kv_heads, causal, sliding_window, emit_lse, ragged, batch, seqlen_q, seqlen_kv]
    performance:
      - {name: block_m, divides: seqlen_q}
      - {name: block_n, divides: seqlen_kv}
      - {name: lds_row_pad}
      - {name: pv_priority}
    # Held at the registry default. The grid catalog never varies the persistent
    # fields; the rest are gfx942 levers left to the kernel's own policy.
    ignored: [waves_per_eu, lds_k_group_pad, persistent, num_persistent, interleave, persist_decode, use_exp2_fast, iglp, iglp_mode, pv_loop_order, o_store_width, pv_sched_fence_mask, causal_diag_split, v_row_pad, use_cfvst, use_v_swizzle, nonpersist_decode, kv_segments, window_wave_skip, v_reg_prefetch, chiplet_num_xcds]
  aot_budget_per_arch: 1000

# How owner benchmark rows become hipDNN graphs (tools/ground_truth.py graphs).
ground_truth:
  graph_template: templates/attention_sdpa_fwd.graph.json
  value_map:
    dtype: {bf16: bfloat16, fp16: half}
    mask_type:
      TOP_LEFT_CAUSAL: {/nodes/sdpa_node/attributes/causal_mask: true}
      NO_MASK: {/nodes/sdpa_node/attributes/causal_mask: false}

# Launch-surface audit (`tools/launch_surface.py --check <this file>`).
launch_surface:
  - name: grid
    python_source: kernels/gfx942/attention_dense.py:attention_dense_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionDenseGeometry.hpp
    kmd_fields: [block_m, seqlen_q, num_query_heads, batch]
    guard: >
      gfx942AttentionDenseGeometry() throws HipdnnPluginException for a block_m
      that is not a positive multiple of 32 within a 1024-thread CTA, and for
      non-positive seqlen_q, num_query_heads or batch. Grid is
      (ceil(Sq/block_m), Hq, B) from the candidate's own block_m and the graph's
      shape; every shipped variant is non-persistent, and emit_lse does not change
      the grid.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseGeometry.cpp

  - name: block
    python_source: kernels/gfx942/attention_dense.py:attention_dense_block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionDenseGeometry.hpp
    kmd_fields: [block_m]
    guard: >
      block_m / GFX942_ROWS_PER_WAVE(32) * GFX942_WAVE_LANES(64) threads.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseGeometry.cpp

  # The tile rules, the window translation, the sliding-window zero-trip guard and the
  # empty-row rule are restated by hand from the rocKE Python. The LDS budget is not
  # restated. Matching and dispatch are shared with gfx950 (AttentionDenseNative.cpp);
  # Gfx942AttentionDenseNative.cpp binds them to the gfx942 tile, scale and window hooks.
  - name: matcher
    python_source: kernels/gfx942/attention_dense.py:supports_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/AttentionDenseNative.cpp
    kmd_fields: [dtype, head_size, causal, sliding_window, ragged, block_m, block_n]
    guard: >
      kernelMatches() returns false (no panic) if dtype, head_size, causal or
      sliding_window disagrees with the graph, the candidate's tile is not one
      isSupportedGfx942AttentionDenseTile() admits, the candidate is ragged,
      Sq % block_m or Skv % block_n is non-zero, or the window leaves the last
      query block no key tile (gfx942AttentionDenseWindowReachesKeys()). Head
      counts, batch and sequence lengths are runtime kernel arguments and are never
      compared (matchesHeadCounts is false for gfx942). graph_match maps a causal
      band of left_bound L to sliding_window L, declines every non-causal band, and
      declines a window that leaves query rows no key (seqlen_q - seqlen_kv >= W),
      with or without stats. It binds the stats output when stats_tensor_uid is
      set and generate_stats is not false (stats_flag declines the uid with false
      and true without a uid), and declines Max, Sum_exp and the RNG dump
      (stats_rowstats), a stats tensor that is not FLOAT (stats_dtype), and one
      that is not rank-4 [B,Hq,Sq,1] with packed strides [Hq*Sq,Sq,1,*],
      non-virtual, non-ragged, not pass-by-value, with a non-negative uid
      (stats_layout). gfx950 binds no stats and declines them all as 'stats'.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseMatchers.cpp

  - name: kernargs
    python_source: kernels/gfx942/attention_dense.py:attention_dense_signature
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/AttentionDenseNative.cpp
    kmd_fields: [seqlen_q, seqlen_kv, num_query_heads, num_kv_heads, batch]
    guard: >
      kernelSignature(RUNTIME_HEAD_COUNTS, writesLse), the ABI of gfx942's one
      launch contract (hipkernel.gfx942_attention_dense.dispatch.v1), is the 10-arg
      form (q,k,v,o,scale,batch,seqlen_q,seqlen_kv,num_query_heads,num_kv_heads) for
      an emit_lse=0 kernel, and the 11-arg form with lse_ptr last (offset 56) for an
      emit_lse=1 kernel, chosen by whether the graph binds a stats output. Every
      variant is non-persistent (no fast-division kernargs) and use_sinks=False.
      Validated at prepare() time by buildIngestorKernelCode(..., expectedSignature),
      and at restore by restoreIngestorLaunch() before any saved value is read; the
      restore selects the form from the saved stats.uid first.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseSignature.cpp

  # emit_lse is baked into the kernel (one trailing lse_ptr store of the natural-log LSE
  # at element (b*Hq + h)*Sq + s, no stride arguments), so it selects candidates rather
  # than ranking them.
  - name: lse
    python_source: kernels/common/_lse_store.py:validate_dense_lse
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionDenseNative.cpp
    kmd_fields: [emit_lse]
    guard: >
      candidateWritesLse() reads emit_lse as 0 or 1 and answers nullopt for a
      missing or other value, which kernelMatches() declines. kernelMatches()
      admits a candidate only when emit_lse == (the graph binds a stats output),
      and graph_match binds only the contiguous FP32 [B,Hq,Sq,1] stats tensor
      validate_dense_lse requires; prepare() re-checks it and throws BAD_PARAM.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseMatchers.cpp

  # The cold ranking reads the two LDS/scheduling knobs to order arms; they do not
  # enter the launch.
  - name: score
    python_source: kernels/gfx942/attention_dense.py:supports_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionDenseNative.cpp
    kmd_fields: [block_m, block_n, lds_row_pad, pv_priority]
    guard: >
      scoreKernel() returns 0 for a record without a launchable tile or with a
      missing or negative lds_row_pad / pv_priority; otherwise a distinct positive
      score per knob combination, policy arms (256/64, lds_row_pad 8,
      pv_priority 0) first.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionDenseMatchers.cpp
