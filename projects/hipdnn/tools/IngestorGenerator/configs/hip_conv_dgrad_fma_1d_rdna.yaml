# Source of truth for the shipped hipkernel:hip_conv_dgrad_fma_1d_rdna catalog: the backward data
# of a 1-D convolution that is not depthwise, which is also the forward of a ConvTranspose1d, for
# the gfx11 (RDNA3/3.5) and gfx12 (RDNA4) targets, compiled from HIP source. No variant needs a
# workspace.
#
# The specialized kernel (kernels/ConvDgradFma1d.cpp, ConvDgradFma1d) takes NCL with groups == 1
# and dilation 1 and compiles the filter width, stride and tile in. It is built for the
# ConvTranspose1d shapes of audio decoders and vocoders, k = 16 / 8 / 4 / 9 at stride 8 / 4 / 2
# / 5, at every dx-channel tile (channels_per_wave) a layer can take: fp32 weights are read in
# place (CT_WS 1), fp16 / bf16 weights as 32-bit words (CT_WS 0). Every other problem runs on
# the generic kernel of the same file (ConvDgradGeneric1d). The native matcher
# (HipConvDgradFma1dRdnaNative.cpp, geometryOf) picks one variant per graph; the variants here
# must match it.

dialect: packaged
authored_subpath: hip/conv_dgrad_fma_1d_rdna
engine:
  name: hipkernel:hip_conv_dgrad_fma_1d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: variant
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: filter_w
  type: int
- name: stride
  type: int
- name: channels_per_wave
  type: int

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: hip
workspace_policy: none

packs:
