# Source of truth for the shipped hipkernel:AttentionPagedUnified catalog.
#
# The kernels are rocKE's tiled 2D unified-attention builders
# (kernels/{gfx942,gfx950}/attention_tiled_2d.py, build_unified_attention_2d_tiled) in
# their runtime_layout form: Q/O/K/V strides, the query head count, the sliding window,
# the batch size and whether Q is dense or ragged are launch arguments, and the page
# table and sequence lengths are read on the device. Every object is built with
# num_kv_heads = 1, so num_query_heads is the GQA ratio (query heads per KV head),
# which with the head size, the paged-KV block size and the dtype fixes the kernel.
#
# The native matcher (packs/AttentionPagedUnifiedNative.cpp) serves cuDNN paged
# attention: paged K/V containers with arbitrary strides (including the interleaved
# K|V view of one cache allocation), an INT32 page table shared by K and V, INT32
# sequence lengths, dense or ragged Q, and bottom-right causal masking with an optional
# left bound.
#
# sdk_version 1.4.0: ragged Q/O (1.3.0) with a token-unit ragged_offset_multiplier
# (1.4.0). The matcher declines override-shape graphs (1.1.0).
#
# Geometry per arch is rocKE's runtime_layout_catalog_spec() in each builder module
# (num_warps, and on gfx942 sub-block tile_size where the LDS budget needs it); the
# engine launches num_warps * 64 threads with BLOCK_Q = 16 * num_warps // num_query_heads.

dialect: packaged
authored_subpath: rocKE/attention_paged_unified
engine:
  name: hipkernel:AttentionPagedUnified
  census_name_symbol: ATTENTION_PAGED_UNIFIED_ENGINE_NAME
  sdk_version: 1.4.0
  knobs: []
  heuristic: none

kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
- name: block_size
  type: int
- name: num_query_heads
  type: int
- name: num_kv_heads
  type: int
  default_value: 1
- name: num_warps
  type: int
  default_value: 1
- name: block_m_per_warp
  type: int
  default_value: 16

specialization:
  metadata_fields:
  - dtype
  - head_size
  - block_size
  - num_query_heads
  - num_kv_heads
  - num_warps
  - block_m_per_warp
  matcher_only_fields: []
  vocabulary:
    dtype: {bf16: BF16, fp16: FP16}
  bindings:
    dtype: {field: dtype}
    head_size: {field: head_size}
    block_size: {field: block_size}
    num_query_heads: {field: num_query_heads}
    num_kv_heads: {field: num_kv_heads}
    num_warps: {field: num_warps}
    block_m_per_warp: {field: block_m_per_warp}

# One pack per architecture (each builder module is arch-specific); each pack's
# discriminator names its graph-scoped criterion, which admits the pack only on its
# own architecture.
graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: rocke
workspace_policy: none
packs:
- name: gfx942
  arch: [gfx942]
  discriminator: gfx942
  kernel_defaults:
    kind: rocke
    source: kernels/gfx942/attention_tiled_2d.py
    builder: build_unified_attention_2d_tiled
  variants:
  - name: paged_unified.{dtype}_d{head_size}_bs{block_size}_g{num_query_heads}.gfx942
    metadata: [dtype, head_size, block_size, num_query_heads, num_kv_heads, num_warps, block_m_per_warp]
    vocabulary:
      dtype: {bf16: BF16, fp16: FP16}
    spec_order: [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_warps, block_m_per_warp, runtime_layout]
    spec_defaults:
      num_kv_heads: 1
      use_sinks: false
      sliding_window: 0
      has_softcap: false
      num_warps: 4
      block_m_per_warp: 16
      runtime_layout: true
    shape_axes:
      dtype: [fp16, bf16]
      head_size: [64]
      block_size: [16, 32, 64]
    knob_sets:
      gqa:
      - {num_query_heads: 1}
      - {num_query_heads: 2}
      - {num_query_heads: 4}
      - {num_query_heads: 5}
      - {num_query_heads: 6}
      - {num_query_heads: 7}
      - {num_query_heads: 8}
      - {num_query_heads: 16}
    shapes:
    - {knobs: gqa}
  - name: paged_unified.{dtype}_d{head_size}_bs{block_size}_g{num_query_heads}.gfx942
