# Source of truth for the shipped hipkernel:hip_conv_fwd_dw3d_rdna catalog: a depthwise 3-D
# forward convolution (groups == C, K a multiple of C) for the gfx11 (RDNA3/3.5) and gfx12
# (RDNA4) targets, compiled from HIP source (kernels/ConvFwdDepthwise3d.cpp).
#
# The specialized kernel takes the filter, the H / W stride and dilation and its output tile at
# compile time, so it is built for the common filters 3x3x3, 5x5x5, 3x1x1 and 1x3x3 with H / W
# stride 1 or 2 and H / W dilation 1: NCDHW with the uniform-k grid, one or two output depths
# per thread (two needs depth stride and dilation 1); NDHWC with one. One generic variant per
# dtype and layout takes filter, stride and dilation as launch arguments for every other
# problem. The native matcher (HipConvFwdDw3dRdnaNative.cpp, geometryOf) picks one variant per
# graph; the tile rules here must match it.

dialect: packaged
authored_subpath: hip/conv_dw3d_rdna
engine:
  name: hipkernel:hip_conv_fwd_dw3d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
