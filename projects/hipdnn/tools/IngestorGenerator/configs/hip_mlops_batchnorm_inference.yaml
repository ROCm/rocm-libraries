# The batchnorm inference engine on the kernel ingestor (ALMIOPEN-3066), one of the nine
# engines that serve the HIP MLOps operations, one per primary operation node. One pack per
# form of the node, each with its own operation matcher and dispatch handler. Every kernel
# is embedded source compiled at plan build, with the graph baked in as compile options, as
# the retired hand-written HIP_MLOPS_ENGINE did. The bundle ships under
# descriptors/HipMlops/batchnorm_inference/ with its kernel source in kernels/, and is packed with
# the kernel ingestor.

engine:
  name: hipkernel:BatchnormInference
  sdk_version: "1.4.0"
  behavior_notes: [runtime_compilation, supports_graph_capture]
  # No kernel uses atomics, and each cross-workgroup reduction is a later launch in a
  # fixed order, so a (graph, configuration, device) gives the same bits every run:
  # TestHipMlopsDeterminism.cpp proves it for every kernel the engine ships.
  numerical_notes: []
  # Each vector width is a kernel of its own, addressed by this knob. The native scorer ranks
  # the width the inference plans choose first.
  knobs: [vector_size]
  heuristic: native

# vector_size defaults to BatchnormInferenceConfig's own default.
kmd_fields:
  - name: operation
    type: string
  - name: vector_size
    type: int
    default_value: 1

graph_match:
  shape: disjoint_attributes
  discriminator: field_value

kernel_source_kind: embedded_source
workspace_policy: none

authored_subpath: descriptors/HipMlops/batchnorm_inference

packs:
  # Batchnorm inference, from one source with an entry point per form: the inverse variance
  # the graph supplies, or a variance and epsilon. Each also serves the hand-written builder's
  # two-node graph, an activation fused after the batchnorm.
  # The inverse-variance pack uses the engine's dispatch handler; the variance pack has its
  # own. Each pack ships a kernel per vector width the build takes, 1, 2 or 4, along C for a
  # channel-last layout and along the spatial dimension otherwise; `operation` tells the
  # packs' kernels apart.
  - name: batchnorm_inference
    discriminator: batchnorm_inference
    kernels:
      - name: hip_mlops.batchnorm_inference.vector1
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEstInvVar
        metadata:
          operation: BATCHNORM_INFERENCE
          vector_size: 1
        priority: 0
      - name: hip_mlops.batchnorm_inference.vector2
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEstInvVar
        metadata:
          operation: BATCHNORM_INFERENCE
          vector_size: 2
        priority: 0
      - name: hip_mlops.batchnorm_inference.vector4
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEstInvVar
        metadata:
          operation: BATCHNORM_INFERENCE
          vector_size: 4
        priority: 0
  - name: batchnorm_inference_variance
    discriminator: batchnorm_inference_variance
    dispatch: batchnorm_inference_variance
    kernels:
      - name: hip_mlops.batchnorm_inference_variance.vector1
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEst
        metadata:
          operation: BATCHNORM_INFERENCE_VARIANCE
          vector_size: 1
        priority: 0
      - name: hip_mlops.batchnorm_inference_variance.vector2
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEst
        metadata:
          operation: BATCHNORM_INFERENCE_VARIANCE
          vector_size: 2
        priority: 0
      - name: hip_mlops.batchnorm_inference_variance.vector4
        kernel_source:
          kind: embedded_source
          source_file: kernels/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEst
        metadata:
          operation: BATCHNORM_INFERENCE_VARIANCE
          vector_size: 4
        priority: 0

# Embedded source compiled at plan build: every field is matcher-only.
specialization:
  metadata_fields: []
  matcher_only_fields: [operation, vector_size]
  bindings: {}
  vocabulary: {}
