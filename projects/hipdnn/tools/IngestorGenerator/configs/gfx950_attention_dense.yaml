  # The full constrained tile set for every aligned semantic cohort above, as two
  # groups: each shape is one explicit baseline entry's (dtype, head_size,
  # num_query_heads, num_kv_heads, causal), crossed with every legal non-baseline
  # (block_m, block_n) arm; the baseline 256/64 tile is the explicit entry itself.
  # Legal tiles: block_m in {128, 256}, block_n a positive multiple of 32,
  # block_m % block_n == 0 and block_n % (block_m / 32) == 0. D128 omits 256/256,
  # whose static LDS (1184 * block_n = 303,104 bytes) exceeds gfx950's 163,840.
