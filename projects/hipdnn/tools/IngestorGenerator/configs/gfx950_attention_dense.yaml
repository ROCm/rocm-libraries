# Worked example: a real rocKE kernel packaged for gfx950.
#
# The dense flash-attention prefill kernel from
# rocke/library/kernels/gfx950/attention_dense.py in the PACKAGED dialect: hkp_pack
# lowers the named builder through comgr at build time and rewrites the shipped
# descriptor to `kind: kpack` before the runtime loader sees it, so nothing dispatches
# `rocke` at runtime.
#
# gfx950 is not a requirement: both the gfx942 and gfx950 builders satisfy hkp_pack's
# `_require_spec_arch_signature` `(spec, *, arch)` contract.
#
# Every `spec` value below is a field of AttentionDenseSpec. The six without defaults
# (batch, seqlen_q, seqlen_kv, num_query_heads, num_kv_heads, head_size) are MANDATORY:
# hkp_pack hydrates with Spec(**fields), so a missing one is a TypeError at pack time.
#
# Verify the builder before packing, from the IngestorGenerator root so
# `codegen` is importable:
#     .venv/bin/python -c "from codegen.sources import introspect; \
#         print(introspect('kernels/gfx950/attention_dense.py', \
#                          'build_attention_dense').signature_error or 'OK')"

dialect: packaged
authored_subpath: rocKE/gfx950_attention_dense
engine:
  name: hipkernel:Gfx950AttentionDense
  sdk_version: 1.0.0
  knobs:
  - head_size
  - num_query_heads
  - num_kv_heads
  - causal
  - block_m
  - block_n
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 8
- name: num_kv_heads
  type: int
  default_value: 8
- name: causal
  type: int
  default_value: 1
- name: ragged
  type: int
  default_value: 0
- name: sliding_window
  type: int
  default_value: 0
- name: batch
  type: int
  default_value: 1
- name: seqlen_q
  type: int
  default_value: 512
- name: seqlen_kv
  type: int
  default_value: 512
# Tile metadata, also public engine knobs. A record omitting either field
# completes to the 256/64 baseline tile through these defaults; with no tile
# knob set, cold selection prefers the applicable 256/64 candidate.
- name: block_m
  type: int
  default_value: 256
- name: block_n
  type: int
  default_value: 64
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - causal
  - ragged
  - sliding_window
  - batch
  - seqlen_q
  - seqlen_kv
  - block_m
  - block_n
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    causal:
      field: causal
    ragged:
      field: ragged
    sliding_window:
      field: sliding_window
    batch:
      field: batch
    seqlen_q:
      field: seqlen_q
    seqlen_kv:
      field: seqlen_kv
    block_m:
      field: block_m
    block_n:
      field: block_n
kernel_source_kind: rocke
workspace_policy: none
packs:
- name: gfx950_attention_dense
  arch:
  - gfx950
  # `variants` kernels carry only a spec; the explicit kernels restate these.
  kernel_defaults:
    kind: rocke
    source: kernels/gfx950/attention_dense.py
    builder: build_attention_dense
  kernels:
  - name: attention_dense.bf16_d64_hq8_kv1_ca.gfx950
    kernel_source:
      kind: rocke
      source: kernels/gfx950/attention_dense.py
      builder: build_attention_dense
      spec:
        dtype: bf16
        head_size: 64
        num_query_heads: 8
        num_kv_heads: 1
        causal: true
        batch: 1
        seqlen_q: 512
        seqlen_kv: 512
        sliding_window: 0
        ragged: false
        varlen: false
        paged: false
        persistent: false
        block_m: 256
        block_n: 64
        waves_per_eu: 2
        lds_k_group_pad: 8
        lds_v_row_pad: 32
        lazy_rescale: true
        wide_lds_dma: false
        interleave: false
        persist_decode: auto
        num_persistent: 256
        block_size: 0
        num_kv_blocks: 0
        use_sinks: false
    metadata:
      dtype: BF16
      head_size: 64
      num_query_heads: 8
      num_kv_heads: 1
      causal: 1
      ragged: 0
      sliding_window: 0
      batch: 1
