# Packaged-dialect (`variants`) reference config for the hipkernel:Gfx950AttentionDense
# catalog. The catalog's source of truth is the rocKE dispatcher registry, expanded from
# configs/gfx950_attention_dense.engine.yaml by tools/registry_enumerator.py.
#
# The descriptors under
# dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/descriptors/rocKE/gfx950_attention_dense/
# and src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDensePacks.cpp
# are generated from this file. Ids are reused by default: the installed bundle (the
# descriptors directory above) is the previous version, so every descriptor id that is
# still produced is kept (a kernel is matched by its completed metadata plus arch, not by
# name; a metadata change, or a retune that changes or drops a value its kernel_source
# stated, gives that kernel a new id) and only added descriptors
# get new ones. `--new-ids` starts every id over; `--ids-from <dir>` names a different
# previous version. Even so, never copy a regenerated descriptor directory over the live
# one, and never generate in place (that is refused: the KDP is a DVC output). After
# editing this file, render into an empty scratch directory from the IngestorGenerator
# root:
#     PROVIDER=../../../../dnn-providers/hip-kernel-provider
#     LIVE=$PROVIDER/src/engines/kernel_ingestor_engine/descriptors/rocKE/gfx950_attention_dense
#     .venv/bin/python generate.py --config configs/gfx950_attention_dense.yaml \
#         --output-dir <scratch>
# The live KDP sits in $LIVE/artifacts/, where tools/splice_additions.py does not look, so
# splice only the additions into it by hand, or with that tool on the KDP alone (it
# refuses, writing nothing, if a retained entry changed): copy the scratch KDP into an
# otherwise empty directory <kdp-only>, then
#     .venv/bin/python tools/splice_additions.py \
#         --scratch <kdp-only> --live "$LIVE/artifacts"
# and run `dvc add artifacts` there.
# The generated tests/TestGfx950AttentionDensePacks.cpp carries no UUIDs and is
# already in the provider's clang-format form; copy it over the live census test.
# tests/test_registry_regeneration.py gates this file against
# configs/gfx950_attention_dense.engine.yaml. `default: true` marks each cell's default
# variant, which variant reduction keeps; neither it nor `reduction` reaches a descriptor.
# The generated packs/Gfx950AttentionDenseNative.cpp and
# tests/TestGfx950AttentionDenseMatchers.cpp are stubs; the provider's copies are
# hand-maintained and must not be overwritten. See
# projects/hipdnn/tools/ai/skills/hipdnn-ingestor-engine/extend.md.
#
# The generated gfx950_attention_dense.kdp.json is a DVC output. The shipped one must be
# present in descriptors/rocKE/gfx950_attention_dense/artifacts/ before running the
# command above (`dvc pull -r ingestor artifacts.dvc` there); otherwise the run refuses
# rather than remint every kernel id. Record the spliced KDP with
# `dvc add artifacts`, not `git add`; an artifact that no longer hashes to the recorded
# md5 draws a stale-artifact warning on the next run until `dvc add` records it. See the
# descriptors README ("Large rocKE files live in DVC").
#
# The kernel is the dense flash-attention prefill from
# rocke/library/kernels/gfx950/attention_dense.py, in the PACKAGED dialect: hkp_pack
# lowers the named builder through comgr at build time and rewrites the shipped
# descriptor to `kind: kpack` before the runtime loader sees it, so nothing dispatches
# `rocke` at runtime.
#
# Every spec field below (a group's `spec_defaults` plus its shape rows and knob arms)
# is a field of AttentionDenseSpec. The six without defaults (batch, seqlen_q,
# seqlen_kv, num_query_heads, num_kv_heads, head_size) are MANDATORY: hkp_pack hydrates
# with Spec(**fields), so a missing one is a TypeError at pack time. The head counts are
# spec fields only (canonical 8 / 8): the kernel reads the real ones as kernargs.
#
# Verify the builder before packing, from the IngestorGenerator root so `codegen` is
# importable, with the rocKE library on PYTHONPATH:
#     PROVIDER=../../../../dnn-providers/hip-kernel-provider
#     PYTHONPATH="$PROVIDER/rocke/library:$PROVIDER/rocke/platform/python" \
#     .venv/bin/python -c "from codegen.sources import introspect; \
#         print(introspect('kernels/gfx950/attention_dense.py', \
#                          'build_attention_dense').signature_error or 'OK')"

dialect: packaged
authored_subpath: rocKE/gfx950_attention_dense
engine:
  name: hipkernel:Gfx950AttentionDense
  census_name_symbol: GFX950_ATTENTION_DENSE_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - block_m
  - block_n
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
# No head-count fields: the kernel reads num_query_heads / num_kv_heads as
# kernargs taken from the graph, so one kernel serves every head configuration.
- name: causal
  type: int
  default_value: 1
- name: ragged
  type: int
  default_value: 0
- name: sliding_window
  type: int
  default_value: 0
- name: batch
  type: int
  default_value: 1
- name: seqlen_q
  type: int
  default_value: 512
- name: seqlen_kv
  type: int
  default_value: 512
# Tile metadata, also public engine knobs. A record omitting either field
# completes to the 256/64 baseline tile through these defaults; with no tile
# knob set, cold selection prefers the applicable 256/64 candidate.
- name: block_m
  type: int
  default_value: 256
- name: block_n
  type: int
  default_value: 64
specialization:
  metadata_fields:
  - dtype
  - head_size
  - causal
  - ragged
  - sliding_window
  - batch
  - seqlen_q
  - seqlen_kv
  - block_m
  - block_n
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    causal:
      field: causal
    ragged:
      field: ragged
    sliding_window:
      field: sliding_window
    batch:
      field: batch
    seqlen_q:
      field: seqlen_q
    seqlen_kv:
      field: seqlen_kv
    block_m:
      field: block_m
    block_n:
      field: block_n
kernel_source_kind: rocke
workspace_policy: none
# A copy of the manifest's `reduction` block.
reduction:
  fields:
    feature: [dtype, head_size, causal, sliding_window, ragged, batch, seqlen_q, seqlen_kv]
    performance:
      - {name: block_m, divides: seqlen_q}
      - {name: block_n, divides: seqlen_kv}
      - {name: waves_per_eu}
      - {name: lazy_rescale}
      - {name: lds_k_group_pad}
      - {name: lds_v_row_pad}
      - {name: lds_k_row_pad}
      - {name: lazy_rescale_threshold}
      - {name: use_exp2_fast}
      - {name: exp_per_pv_step, unset_resolves_by: resolved_exp_per_pv_step}
      - {name: partial_vmcnt_prefetch}
      - {name: pv_priority}
      - {name: pv_sched_fence, unset_resolves_by: resolved_pv_sched_fence}
      - {name: pv_sched_group_template, unset_resolves_by: resolved_pv_sched_group_template}
      - {name: iglp_mode, unset_resolves_by: resolved_iglp_mode}
      - {name: pv_sched_fence_mask}
      - {name: pv_sched_group_ds_read}
      - {name: pv_loop_order, unset_resolves_by: resolved_pv_loop_order}
      - {name: causal_diag_split}
      - {name: o_store_width}
    ignored: []
  aot_budget_per_arch: 1000
packs:
- name: gfx950_attention_dense
  arch:
  - gfx950
  kernel_defaults:
    kind: rocke
    source: kernels/gfx950/attention_dense.py
    builder: build_attention_dense
  variants:
  # Each group crosses its shape rows with its knob set's tiles:
  #   D64:  {bf16, fp16} x {causal, non-causal} x 7 tiles = 28
  #   D128: {bf16, fp16} x {causal, non-causal} x 6 tiles = 24
  #   total 52
  # One kernel per head size: num_query_heads / num_kv_heads are runtime kernargs read
  # from the graph, so they are not metadata. The spec still carries them (hkp_pack
  # hydrates Spec(**fields)) at the canonical 8 / 8, set in spec_defaults.
  # Legal tiles: block_m in {128, 256}, block_n a positive multiple of 32,
  # block_m % block_n == 0 and block_n % (block_m / 32) == 0. D128 omits 256/256,
  # whose static LDS (1184 * block_n = 303,104 bytes) exceeds gfx950's 163,840.
  # Every entry is a runtime-shape instance built at the canonical B1/Sq512/Skv512;
  # the catalog is aligned-only (ragged 0 throughout).
  - name: attention_dense.{dtype}_d{head_size}_c{causal}_bm{block_m}_bn{block_n}.gfx950
    metadata: [dtype, head_size, causal, ragged, sliding_window, batch, seqlen_q, seqlen_kv, block_m, block_n]
    vocabulary:
      dtype: {bf16: BF16, fp16: FP16}
    spec_order: [dtype, head_size, num_query_heads, num_kv_heads, causal, batch, seqlen_q, seqlen_kv, sliding_window, ragged, varlen, paged, persistent, block_m, block_n, waves_per_eu, lds_k_group_pad, lds_v_row_pad, lazy_rescale, wide_lds_dma, interleave, persist_decode, nonpersist_decode, num_persistent, block_size, num_kv_blocks, use_sinks]
    spec_defaults:
      head_size: 64
      num_query_heads: 8
      num_kv_heads: 8
      batch: 1
      seqlen_q: 512
      seqlen_kv: 512
      sliding_window: 0
      ragged: false
      varlen: false
      paged: false
      persistent: false
      waves_per_eu: 2
      lds_k_group_pad: 8
      lds_v_row_pad: 32
      lazy_rescale: true
      wide_lds_dma: false
      interleave: false
      persist_decode: auto
      nonpersist_decode: qb_minor
      num_persistent: 256
      block_size: 0
      num_kv_blocks: 0
      use_sinks: false
    knob_sets:
      d64_tiles:
      - {block_m: 256, block_n: 64, default: true}
      - {block_m: 128, block_n: 32}
      - {block_m: 128, block_n: 64}
      - {block_m: 128, block_n: 128}
      - {block_m: 256, block_n: 32}
      - {block_m: 256, block_n: 128}
      - {block_m: 256, block_n: 256}
    shapes:
    - {dtype: bf16, causal: true, knobs: d64_tiles}
    - {dtype: bf16, causal: false, knobs: d64_tiles}
    - {dtype: fp16, causal: true, knobs: d64_tiles}
    - {dtype: fp16, causal: false, knobs: d64_tiles}
  - name: attention_dense.{dtype}_d{head_size}_c{causal}_bm{block_m}_bn{block_n}.gfx950
    metadata: [dtype, head_size, causal, ragged, sliding_window, batch, seqlen_q, seqlen_kv, block_m, block_n]
    vocabulary:
      dtype: {bf16: BF16, fp16: FP16}
    spec_order: [dtype, head_size, num_query_heads, num_kv_heads, causal, batch, seqlen_q, seqlen_kv, sliding_window, ragged, varlen, paged, persistent, block_m, block_n, waves_per_eu, lds_k_group_pad, lds_v_row_pad, lazy_rescale, wide_lds_dma, interleave, persist_decode, nonpersist_decode, num_persistent, block_size, num_kv_blocks, use_sinks]
    spec_defaults:
      head_size: 128
      num_query_heads: 8
      num_kv_heads: 8
      batch: 1
      seqlen_q: 512
      seqlen_kv: 512
      sliding_window: 0
      ragged: false
      varlen: false
      paged: false
      persistent: false
      waves_per_eu: 2
      lds_k_group_pad: 8
      lds_v_row_pad: 32
      lazy_rescale: true
      wide_lds_dma: false
      interleave: false
      persist_decode: auto
      nonpersist_decode: qb_minor
      num_persistent: 256
      block_size: 0
      num_kv_blocks: 0
      use_sinks: false
    knob_sets:
      d128_tiles:
      - {block_m: 256, block_n: 64, default: true}
      - {block_m: 128, block_n: 32}
      - {block_m: 128, block_n: 64}
      - {block_m: 128, block_n: 128}
      - {block_m: 256, block_n: 32}
      - {block_m: 256, block_n: 128}
    shapes:
    - {dtype: bf16, causal: true, knobs: d128_tiles}
    - {dtype: bf16, causal: false, knobs: d128_tiles}
    - {dtype: fp16, causal: true, knobs: d128_tiles}
    - {dtype: fp16, causal: false, knobs: d128_tiles}
