# gfx942 dense flash-attention prefill, packaged for the hipDNN generic kernel
# ingestor.
#
# Kernel: rocke/library/kernels/gfx942/attention_dense.py, build_attention_dense.
# Dialect: packaged -- hkp_pack lowers the builder through comgr at build time and
# rewrites the shipped descriptor to `kind: kpack` before the runtime loader sees it.
# HIPDNN_DESCRIPTOR_FILES / HIPDNN_INGESTOR_PACK_KERNELS never apply.
#
# Variant set (48 kernels), confirmed at RUNBOOK step 3:
#   capability : dtype{bf16,fp16} x head_size{64,128} x causal{true,false}  = 8 cells
#   shape      : mha256 (B2 Hq4 Hkv4 S256), gqa256 (B2 Hq8 Hkv2 S256),
#                mha512 (B2 Hq8 Hkv8 S512)                                  x 3
#   tuning     : block_n {32, 64}                                           x 2
# Every shape field is BAKED into the emitted binary (mining.md ss5), so shape
# coverage is a hard cross-product rather than a range. block_n {128,256} is
# excluded: supports_attention_dense rejects it at D128 on the 64 KB LDS budget.
#
# waves_per_eu is NOT a free knob -- it is _tuned_waves_per_eu(head_size, dtype),
# the kernel's own measured per-config policy, and it is baked into the emitted
# amdgpu-waves-per-eu attribute AND into kernel_name(). Every other gfx942-private
# knob stays at its shipped default, matching dispatch/attention/gfx942.py, which
# states that wiring one into a production path needs its own measured verdict.
#
# Knobs: every int-typed KMD field is exposed. `dtype` is deliberately NOT a knob --
# GenericPlanBuilder::getCustomKnobs (plugin_sdk/.../GenericPlanBuilder.hpp:344)
# keeps only `std::get_if<int64_t>` values and drops the knob entirely when none
# remain, so a string knob is silently inert at plan-build time.

dialect: packaged
authored_subpath: rocKE/gfx942_attention_dense

engine:
  name: hipkernel:Gfx942AttentionDense
  sdk_version: "1.0.0"
  knobs: [block_n, head_size, num_query_heads, num_kv_heads, seqlen_q, seqlen_kv, batch, causal]
  heuristic: native

kmd_fields:
  - name: dtype
    type: string
  - name: head_size
    type: int
    default_value: 128
  - name: num_query_heads
    type: int
    default_value: 8
  - name: num_kv_heads
    type: int
    default_value: 8
  - name: seqlen_q
    type: int
    default_value: 256
  - name: seqlen_kv
    type: int
    default_value: 256
  - name: batch
    type: int
    default_value: 2
  - name: causal
    type: int
    default_value: 1
  - name: block_n
    type: int
    default_value: 64
  - name: block_m
    type: int
    default_value: 256

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: rocke
workspace_policy: none
delegates_to_existing_plan: false

#
# Tile-forcing shape (Skv=288), added after review: every other shipped shape has
# Skv % 64 == 0, so BOTH block_n values are applicable and `score` -- which ranks the
# wider tile higher -- always selects 64. That left 24 of 48 kernels unreachable by any
# test graph, and the block_n=32 half of the tuning axis with no E2E coverage at all.
# Skv=288 is legal for block_n=32 and ILLEGAL for 64 (288 % 64 != 0), so a graph at this
# shape can only be served by the narrow tile. 8 kernels, one per dtype x head_size x
# causal cell.

# VARIANT SET -- sized from REAL WORKLOADS, not from a test matrix.
#
# The first cut of this engine shipped 56 kernels at Sq in {256, 288, 512}: a set chosen
# to exercise the matcher. It passed every gate and served ZERO real graphs -- of 3654
# SDPA graphs across dnn-benchmarking's model + microbench suites, 118 were servable by
# this kernel and NOT ONE matched a shipped variant.
#
# This set is derived from those workloads instead. Every shape below appears in a real
# model trace under Workloads/models/ (llama3.1, qwen3 8b/32b/30b-moe/235b-moe, gpt_oss,
# auto_regressive_dit, ltx2, mad_llama3_1_8b_train). It serves 38/38 of the real model
# graphs this kernel can build.
#
#   production shapes (block_n=64) .... one per (model family x sequence length x mask)
#   cross-attention ................... auto_regressive_dit runs Sq != Skv (Skv=62208)
#   fp16 capability coverage .......... no real trace uses fp16 at a servable shape, but
#                                       the engine advertises it, so it is backed
#   block_n=32 tuning twins ........... representative subset, so `score` has a real
#                                       choice without doubling the whole set
#
# Not served, deliberately, and reported at step 9: varlen (2245 of 3654 real graphs --
# by far the largest single gap and a kernel-side limitation, not a variant-set one),
# paged KV, sinks, sliding-window, and head sizes outside {64, 128} (D192 alone is 500
# real graphs).

#
# block_n=32 selection coverage (Skv=288). Every REAL workload shape has
# Skv %% 64 == 0, so both tiles are applicable and `score` -- which ranks the wider
# tile higher -- always picks 64. Without a shape where 64 is ILLEGAL, half the
# tuning axis is unreachable by any test graph and 32 of the shipped kernels can
# never be selected. 288 is legal for block_n=32 and illegal for 64.
# Synthetic on purpose: it exists to exercise selection, not to serve traffic.

#
# AITER shapes. aiter/Workloads MANIFEST: "Every JSON here was rendered by the
# committed hipDNN emitters from a real shape found in the aiter source. No shapes
# were invented." AITER serves real customers, so these are production shapes, not
# a synthetic sweep -- they were nearly discounted on the assumption that a
# microbench directory means synthetic. 64 of its 3546 SDPA graphs are servable by
# this kernel; all 64 are covered here.

