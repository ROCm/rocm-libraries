# Profile: gfx950 unified 2D paged/varlen attention.
#
# Read by the profile-driven scripts under tools/. Sibling of
# gfx950_attention_dense.profile.yaml; read that one first, since this file only
# states where the unified family differs.
#
# THE KERNEL IS NOT THE DENSE KERNEL ON A WIDER ABI. Three differences decide
# almost everything below, and each was measured against the registry rather
# than inferred from the dense bundle:
#
#   1. The ABI is the paged/varlen one, 18 arguments. There is no non-paged arm.
#      The provider reaches it from a dense BSHD SDPA graph by synthesizing an
#      identity block_tables / seq_lens / query_start_len workspace.
#   2. The kernel is UNCONDITIONALLY CAUSAL, bottom-right aligned. `causal` is
#      not a spec field and not a kernel argument; the mask is
#      `col_abs <= (seq_len - cur_batch_q_len) + q_pos`, emitted every time
#      (attention_tiled_2d.py:3452). So this engine must DECLINE an unmasked
#      graph -- the opposite of the dense engine, where `causal` is a KMD field
#      that toggles. Accepting NO_MASK here would return masked numerics for an
#      unmasked graph with nothing faulting.
#   3. `num_seqs` is a compile-time trip count, not a shape. It specializes the
#      binary search that maps a Q block to its sequence
#      (`binary_search_iters = ceil(log2(num_seqs + 1))`). See the kmd_fields
#      note on num_seqs for the capacity bound this creates.

arch: gfx950
slug: gfx950_attention_unified_2d

provider_root: dnn-providers/hip-kernel-provider

# Read by reconcile_applicability.py. The unified candidates are opt_in, so an
# unpinned reference request returns the route-only `unified_2d` plan and zero
# buildable candidates; the algorithm pin is what makes the family reachable.
reference_candidates:
  module: dispatch.attention
  function: attention_candidates
  match: algorithm
  family: unified_tuning

reference_request:
  module: dispatch.attention.common
  class: AttentionRequest
  defaults:
    arch: gfx950
    algorithm: unified_tuning
    spec_id: gfx950_u2d_narrow_nw1_mw16_t1xb_llvm

source: kernels/gfx950/attention_tiled_2d.py
builder: build_unified_attention_2d_tiled

dispatch:
  module: dispatch.attention
  function: dispatch_attention
  # Selection is by PIN, and the pin must name a spec_id -- not just the
  # algorithm. Measured: `algorithm: unified_2d` and the unpinned call both
  # return an AttentionSpec with no `kernel_spec` at all (a routing plan, F3),
  # and `algorithm: unified_tuning` alone raises "no candidate supports
  # request" because every unified candidate is opt_in. Only a spec_id pin
  # resolves to a UnifiedAttention2DTiledSpec a builder can compile.
  #
  # WHY THIS SPEC_ID. The 104 gfx950 u2d candidates carry 52 distinct
  # geometries, each in an `_llvm` and a `_hipcc` arm that bake an IDENTICAL
  # kernel_spec -- `compile_backend` lives on the tuning spec, not the kernel
  # spec, so the pair deduplicates to one binary. `_llvm` is the arm this
  # packaged dialect actually uses: hkp_pack lowers the named builder through
  # comgr, which is the LLVM path.
  #
  # Among the geometries, `narrow_nw1_mw16_t1xb` is the baseline: one warp,
  # block_m_per_warp 16, tile_size = 1 x block_size. It served 150/150 shapes
  # in this corpus, every head size included, where e.g.
  # `wide32_nw4_mw32_t4xb` served 100/150. A wider geometry is a stage-6
  # tuning result, not a baseline -- RUNBOOK stage 2: "a legal cross-product is
  # not a measured shipping set".
  pin:
    algorithm: unified_tuning
    spec_id: gfx950_u2d_narrow_nw1_mw16_t1xb_llvm
  result_attr: spec
  spec_attr: kernel_spec
  refusal_exception: rocke.dispatch.core.PinRefused

request:
  module: dispatch.attention.common
  class: AttentionRequest
  defaults:
    arch: gfx950

predicate:
  module: kernels.gfx950.attention_tiled_2d
  function: supports_tiled_2d_spec

arch_spec:
  module: kernels.gfx950.attention_tiled_2d
  class: UnifiedAttention2DTiledSpec

# WHAT THE BINARY SPECIALIZES ON, measured by holding the pin fixed and moving
# one request field at a time:
#
#   changes the spec : head_size, num_query_heads, num_kv_heads, dtype,
#                      block_size (and tile_size with it), sliding_window,
#                      use_sinks, num_seqs
#   does NOT         : mask_type (all four spell the same spec), seqlen_q,
#                      seqlen_k
#
# seqlen_q/seqlen_kv are absent for the same reason the dense catalog carries
# them as build inputs only: the kernel is shape-generic in the sequence
# dimensions, which enter through the runtime seq_lens / query_start_len
# buffers rather than the binary.
#
# The seven geometry fields are constant across this catalog because one
# spec_id is pinned, but they are still metadata: the collision rule keys a
# candidate on its COMPLETED metadata, and native-pack.md requires metadata for
# every field consumed by scoring, geometry or workspace even when no graph
# comparison reads it. Dropping the two that the first draft of this engine
# omitted -- use_register_pv and use_k_single_buffer -- would also make a
# future second geometry collide with this one instead of shipping beside it.
metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - block_size
  - sliding_window
  - use_sinks
  - num_seqs
  - tile_size
  - num_warps
  - block_m_per_warp
  - use_mfma_32x32
  - use_transposed_qk_32x32
  - use_register_pv
  - use_k_single_buffer

vocabulary:
  dtype:
    bf16: BF16
    fp16: FP16

specialization:
  metadata_fields:
    - dtype
    - head_size
    - num_query_heads
    - num_kv_heads
    - block_size
    - sliding_window
    - use_sinks
    - num_seqs
    - tile_size
    - num_warps
    - block_m_per_warp
    - use_mfma_32x32
    - use_transposed_qk_32x32
    - use_register_pv
    - use_k_single_buffer
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    block_size:
      field: block_size
    sliding_window:
      field: sliding_window
    use_sinks:
      field: use_sinks
    num_seqs:
      field: num_seqs
    tile_size:
      field: tile_size
    num_warps:
      field: num_warps
    block_m_per_warp:
      field: block_m_per_warp
    use_mfma_32x32:
      field: use_mfma_32x32
    use_transposed_qk_32x32:
      field: use_transposed_qk_32x32
    use_register_pv:
      field: use_register_pv
    use_k_single_buffer:
      field: use_k_single_buffer

dialect: packaged
authored_subpath: rocKE/gfx950_attention_unified_2d

kernel_name_template: >-
  attention_unified_2d.{dtype}_d{head_size}_hq{num_query_heads}_kv{num_kv_heads}_bs{block_size}_t{tile_size}_nw{num_warps}_mw{block_m_per_warp}.gfx950

engine:
  name: "hipkernel:Gfx950AttentionUnified2D"
  sdk_version: "1.0.0"
  # The geometry axes a caller may turn. The problem fields are not knobs: one
  # cannot be changed without naming a different graph. num_seqs is excluded
  # deliberately -- it reads like a knob but turning it DOWN silently breaks
  # correctness (see kmd_fields), so it is a shipped value, not an offer.
  knobs:
    - tile_size
    - num_warps
    - block_m_per_warp
  heuristic: native

kmd_fields:
  - name: dtype
    type: string
  - name: head_size
    type: int
    default_value: 128
  - name: num_query_heads
    type: int
    default_value: 8
  - name: num_kv_heads
    type: int
    default_value: 8
  # The KV page size. Also drags tile_size: measured, kv_block_size 16/32/64
  # resolve to block_size 16/32/64 and tile_size 16/32/64 on this `t1xb`
  # geometry, whose tile is one block.
  - name: block_size
    type: int
    default_value: 16
  # Baked, not a runtime argument. The catalog ships 0 (no window); a windowed
  # graph names a different binary, so graph_match declines one.
  - name: sliding_window
    type: int
    default_value: 0
  # Baked: use_sinks adds a live sink_ptr the dense graph has no source for.
  # The catalog ships 0 and the pointer is bound null.
  - name: use_sinks
    type: int
    default_value: 0
  # NOT a shape -- a compile-time trip count. The kernel resolves a Q block to
  # its sequence with a fixed-trip binary search of
  # ceil(log2(num_seqs + 1)) iterations (attention_tiled_2d.py:833).
  #
  # The loop is idempotent once converged -- it carries `done = left >= right`
  # and yields `select(done, left, ...)` -- and its `right` bound is the
  # RUNTIME num_seqs kernarg, not this baked value. So MORE iterations than the
  # batch needs are harmless and FEWER silently return the wrong sequence
  # index. That asymmetry is a proven capacity bound, which is what
  # kernelMatches enforces:
  #
  #     batch <= 2^ceil(log2(num_seqs + 1)) - 1
  #
  # The catalog bakes 256 (9 iterations, serving batch <= 511) rather than the
  # dense catalog's canonical batch of 1, which would bake ONE iteration and
  # restrict the whole engine to batch-1 graphs.
  - name: num_seqs
    type: int
    default_value: 256
  - name: tile_size
    type: int
    default_value: 16
  - name: num_warps
    type: int
    default_value: 1
  - name: block_m_per_warp
    type: int
    default_value: 16
  - name: use_mfma_32x32
    type: int
    default_value: 0
  - name: use_transposed_qk_32x32
    type: int
    default_value: 0
  - name: use_register_pv
    type: int
    default_value: 0
  - name: use_k_single_buffer
    type: int
    default_value: 0

kernel_source_kind: rocke
# The first nonzero workspace in this provider (F8). The handler derives
# block_tables / seq_lens / query_start_len from (batch, seqlen_q, seqlen_kv,
# block_size), all known at prepare().
workspace_policy: derived
delegates_to_existing_plan: false

# Documentation only; no generator tool reads this block.
runtime_param_fields:
  - batch
  - seqlen_q
  - seqlen_kv

graph_match:
  shape: shared_shape
  discriminator: none

launch_surface:
  - name: grid
    python_source: kernels/gfx950/attention_tiled_2d.py:build_unified_attention_2d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified2DGeometry.hpp
    kmd_fields: [block_m_per_warp, num_warps, num_query_heads, num_kv_heads]
    guard: >
      gfx950AttentionUnified2DGeometry() throws HipdnnPluginException for
      non-positive dimensions. Grid is (total Q blocks, num_kv_heads, 1),
      where the Q-block count sums ceil(seqlen_q / block_q) over the batch
      and block_q = (block_m_per_warp * num_warps) / num_queries_per_kv.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DGeometry.cpp

  - name: block
    python_source: kernels/gfx950/attention_tiled_2d.py:build_unified_attention_2d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified2DGeometry.hpp
    kmd_fields: [num_warps]
    guard: >
      num_warps * GFX950_WAVE_LANES(64) threads per CTA.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DGeometry.cpp

  - name: workspace
    python_source: kernels/gfx950/attention_tiled_2d.py:build_unified_attention_2d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified2DGeometry.hpp
    kmd_fields: [block_size]
    guard: >
      gfx950AttentionUnified2DWorkspace() sizes three sections, each padded to
      a 256-byte boundary: block_tables (batch * ceil(seqlen_kv / block_size)
      int32), seq_lens (batch int32) and query_start_len (batch + 1 int32).
      Contents depend only on (batch, seqlen_q, seqlen_kv, block_size).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DGeometry.cpp

  - name: matcher
    python_source: kernels/gfx950/attention_tiled_2d.py:build_unified_attention_2d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified2DNative.cpp
    kmd_fields: [dtype, head_size, num_query_heads, num_kv_heads, block_size, sliding_window, use_sinks, num_seqs]
    guard: >
      kernelMatches() returns false (no panic) if dtype, head_size,
      num_query_heads, num_kv_heads or block_size disagrees with the graph, if
      the candidate bakes a sliding window or sinks, if seqlen_kv is not a
      multiple of block_size, or if the graph's batch exceeds the candidate's
      proven binary-search capacity
      (batch > 2^ceil(log2(num_seqs + 1)) - 1). graph_match has already
      required a causal mask: the kernel masks unconditionally.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DMatchers.cpp

  - name: kernargs
    python_source: kernels/gfx950/attention_tiled_2d.py:build_unified_attention_2d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified2DNative.cpp
    kmd_fields: [dtype, use_sinks]
    guard: >
      attentionUnified2DKernelSignature() always returns the 18-argument paged
      form. The dense graph supplies no sink, alibi or qq_bias tensor, so those
      three pointers are bound null and k_scale/v_scale/out_scale are bound
      1.0f and softcap 0.0f -- the neutral values the kernel's own guarded
      paths read. Every slot is retained: the ABI is fixed, not conditional.
      Validated at prepare() by buildIngestorKernelCode(..., expectedSignature).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DSignature.cpp
