  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    block_size:
      field: block_size
    mask_type:
      method: mask_type
    sliding_window:
      field: sliding_window
    num_seqs:
      field: num_seqs
    tile_size:
      field: tile_size
    num_warps:
      field: num_warps
    block_m_per_warp:
      field: block_m_per_warp
    use_mfma_32x32:
      field: use_mfma_32x32
    use_transposed_qk_32x32:
