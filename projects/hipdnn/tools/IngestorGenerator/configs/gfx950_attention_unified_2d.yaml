# Packaged-dialect (`variants`) reference config for the hipkernel:Gfx950AttentionUnified2D
# catalog. The catalog's source of truth is the rocKE dispatcher registry, expanded from
# configs/gfx950_attention_unified_2d.engine.yaml by tools/registry_enumerator.py, then
# compacted with tools/factorise_config.py:
#     python tools/registry_enumerator.py --manifest configs/gfx950_attention_unified_2d.engine.yaml --out <scratch>/config.yaml
#     python tools/factorise_config.py --config <scratch>/config.yaml --out configs/gfx950_attention_unified_2d.yaml \
#         --knobs tile_size,num_warps,block_m_per_warp --vocabulary 'dtype:bf16=BF16,fp16=FP16'
#
# The descriptors under
# dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/descriptors/rocKE/gfx950_attention_unified_2d/
# and src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified2DPacks.cpp
# are generated from this file. Generation mints fresh UUIDs on every run, so after the
# first generation never copy a regenerated descriptor directory over the live one: render
# into an empty scratch directory and splice only the additions
# (tools/splice_additions.py refuses, writing nothing, if a retained entry changed).
# tests/test_registry_regeneration.py gates this file against
# configs/gfx950_attention_unified_2d.engine.yaml. The generated
# packs/Gfx950AttentionUnified2DNative.cpp and tests/TestGfx950AttentionUnified2DMatchers.cpp
# are stubs; the provider's copies are hand-maintained and must not be overwritten.
#
# The generated gfx950_attention_unified_2d.kdp.json is a DVC output: copy it to
# descriptors/rocKE/gfx950_attention_unified_2d/artifacts/ and run `dvc add artifacts`,
# not `git add`. See the descriptors README ("Large rocKE files live in DVC").
#
# One geometry per cell: narrow 16x16 MFMA, 4 warps x 16 rows (BLOCK_M 64), KV tile of 4
# pages (T = 64 at block_size 16), llvm backend. `num_seqs` (511) is the batch capacity
# the binary serves, not a shape: see the manifest.
#
dialect: packaged
authored_subpath: rocKE/gfx950_attention_unified_2d
engine:
  name: hipkernel:Gfx950AttentionUnified2D
  slug: gfx950_attention_unified_2d
  census_name_symbol: GFX950_ATTENTION_UNIFIED_2D_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - tile_size
  - num_warps
  - block_m_per_warp
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 8
- name: num_kv_heads
  type: int
  default_value: 8
- name: block_size
  type: int
  default_value: 16
- name: mask_type
  type: int
  default_value: 0
- name: sliding_window
  type: int
  default_value: 0
- name: num_seqs
  type: int
  default_value: 511
- name: tile_size
  type: int
  default_value: 64
- name: num_warps
  type: int
  default_value: 4
- name: block_m_per_warp
  type: int
  default_value: 16
- name: use_mfma_32x32
  type: int
  default_value: 0
- name: use_transposed_qk_32x32
  type: int
  default_value: 0
specialization:
