# This profile describes the same adapter, metadata and native hooks as
# gfx950_conv_fwd.yaml. Repository-relative paths resolve against the checkout
# root the tools find from their own location; python_source paths resolve
# against provider_root's rocke/library, the base dispatch_parity.py imports
# modules from.
#
# Two kernel families share the engine, selected per kernel by kernel_family.
# The dispatch/predicate/reference_candidates model below describes the
# implicit-GEMM family only (groups 1 and 2 of gfx950_conv_fwd.yaml).
# rocKE has no dispatcher for its direct depthwise kernels, so group 3
# (kernel_family=1) is hand-authored from
# builders/common/convolution_forward.py:gfx950_conv_fwd_direct_spec_for_request
# and dispatch_parity.py does not reproduce it. The supports_gfx950_conv_fwd
# predicate and the launch_surface entries cover both families.

slug: gfx950_conv_fwd
bundle: gfx950_conv_fwd
pack: gfx950_conv_fwd
arch: gfx950
provider_root: dnn-providers/hip-kernel-provider
dialect: packaged
authored_subpath: rocKE/gfx950_conv_fwd
source: builders/common/convolution_forward.py
builder: build_gfx950_conv_fwd
kernel_source_kind: rocke
workspace_policy: none
delegates_to_existing_plan: false

engine:
  name: hipkernel:Gfx950ConvFwd
  sdk_version: "1.0.0"
  knobs: [tile_k, kernel_family]
  heuristic: native

request:
  module: dispatch.grouped_convolution
  class: ConvGroupedRequest
  defaults:
    direction: fwd
    layout: NHWC
    G: 1
    algorithm: implicit_gemm_fwd
dispatch:
  module: builders.common.convolution_forward
  function: gfx950_conv_fwd_spec_for_request
predicate:
  module: builders.common.convolution_forward
  function: supports_gfx950_conv_fwd
arch_spec:
  module: builders.common.convolution_forward
  class: Gfx950ConvFwdSpec

# Consult the real forward candidate, including its capability gate. Grouped
# (G > 1, including depthwise) 2D forward is in scope; grouped pointwise
# (1x1, stride 1, no padding) and 3D cases the reference accepts remain visible
# as integration scope gaps.
reference_candidates:
  module: dispatch.grouped_convolution
  function: conv_grouped_candidates
  match: algorithm
  family: implicit_gemm_fwd
reference_request:
  module: dispatch.grouped_convolution
  class: ConvGroupedRequest
  defaults:
    direction: fwd
    layout: NHWC
    G: 1
    algorithm: implicit_gemm_fwd

metadata_fields: &metadata_fields
  [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, layout, groups,
   tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n,
   warp_tile_k, wave_size, pipeline, epilogue, kernel_family, direct_variant,
   block_w, block_waves]
kmd_fields:
  - {name: N, type: int}
  - {name: Hi, type: int}
  - {name: Wi, type: int}
  - {name: C, type: int}
  - {name: K, type: int}
  - {name: Y, type: int}
  - {name: X, type: int}
  - {name: sH, type: int}
  - {name: sW, type: int}
  - {name: pH, type: int}
  - {name: pW, type: int}
  - {name: dH, type: int}
  - {name: dW, type: int}
  - {name: dtype, type: string}
  - {name: layout, type: string}
  - {name: groups, type: int}
  - {name: tile_m, type: int}
  - {name: tile_n, type: int}
  - {name: tile_k, type: int, default_value: 64}
  - {name: warp_m, type: int}
  - {name: warp_n, type: int}
  - {name: warp_tile_m, type: int}
  - {name: warp_tile_n, type: int}
  - {name: warp_tile_k, type: int}
  - {name: wave_size, type: int}
  - {name: pipeline, type: string}
  - {name: epilogue, type: string}
  - {name: kernel_family, type: int, default_value: 0, builder_default: true}
  - {name: direct_variant, type: string, default_value: none, builder_default: true}
  - {name: block_w, type: int, default_value: 0, builder_default: true}
  - {name: block_waves, type: int, default_value: 0, builder_default: true}

# Every metadata field is baked into the kernel at compile time: the builder's
# Gfx950ConvFwdSpec consumes all 31, so the whole geometry and every tuning
# value is part of the specialization contract and none are matcher-only.
# Mirrors the `specialization` block of gfx950_conv_fwd.yaml.
specialization:
  metadata_fields: *metadata_fields
  matcher_only_fields: []
  bindings:
    N: {field: N}
    Hi: {field: Hi}
    Wi: {field: Wi}
    C: {field: C}
    K: {field: K}
    Y: {field: Y}
    X: {field: X}
    sH: {field: sH}
    sW: {field: sW}
    pH: {field: pH}
    pW: {field: pW}
    dH: {field: dH}
    dW: {field: dW}
    dtype: {field: dtype}
    layout: {field: layout}
    groups: {field: groups}
    tile_m: {field: tile_m}
    tile_n: {field: tile_n}
    tile_k: {field: tile_k}
    warp_m: {field: warp_m}
    warp_n: {field: warp_n}
    warp_tile_m: {field: warp_tile_m}
    warp_tile_n: {field: warp_tile_n}
    warp_tile_k: {field: warp_tile_k}
    wave_size: {field: wave_size}
    pipeline: {field: pipeline}
    epilogue: {field: epilogue}
    kernel_family: {field: kernel_family}
    direct_variant: {field: direct_variant}
    block_w: {field: block_w}
    block_waves: {field: block_waves}

# One exact-shape kernel per catalog entry: no field is read only from kernel
# arguments, so nothing is reused across runtime shapes. Documentation only.
runtime_param_fields: []

graph_match:
  shape: shared_shape
  discriminator: none

# Metadata uses the adapter's lowercase dtype names. Every tuning value is
# resolved before emission; there are no policy-owned optional fields here.
# Direct depthwise kernels carry pipeline and epilogue "none" and a
# direct_variant of std or spatial; implicit GEMM leaves direct_variant at its
# KMD default "none".
vocabulary:
  dtype: {fp16: fp16, bf16: bf16}
  layout: {NHWC: NHWC}
  pipeline: {mem: mem, none: none}
  epilogue: {cshuffle: cshuffle, default: default, none: none}
  direct_variant: {none: none, std: std, spatial: spatial}
policies: {}
field_map:
  G: groups
  stride_h: sH
  stride_w: sW
  pad_h: pH
  pad_w: pW
  dilation_h: dH
  dilation_w: dW
# Partial tiles are masked. tile_k need not divide Y*X*C.
divides: {}
# This models native fallback ordering only. Forced knobs and BenchmarkPlan
# can select any arm; an unforced host corpus prefers a direct depthwise kernel
# (tile_k 0) where one applies, then tile_k=64.
score: {field: tile_k, prefer: min}
sweep:
  tile_k:
    values: [64, 128]
    hazard: Keep the mem pipeline and dispatcher geometry fixed; validate every compiled arm.

launch_surface:
  - name: applicability_and_baked_constants
    python_source: builders/common/convolution_forward.py:supports_gfx950_conv_fwd
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:kernelFits
    kmd_fields: *metadata_fields
    guard: matchProblem checks the unfused forward graph and storage contract, derives groups from X.C / W.dims[1] and declines grouped pointwise; kernelFits compares every compiled shape, groups and tuning value, and takes the default epilogue only when K/groups is odd, before loading code.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdMatchers.cpp
  - name: problem_geometry_and_byte_counts
    python_source: builders/common/convolution_forward.py:_problem_error
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:deriveGeometry
    kmd_fields: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, groups]
    guard: deriveGeometry and outputExtent reject nonpositive outputs, signed byte-count overflow and unrepresentable padded or dilated coordinates.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: grid
    python_source: builders/common/convolution_forward.py:grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:launchGeometry
    kmd_fields: [N, Hi, Wi, K, Y, X, sH, sW, pH, pW, dH, dW, groups, tile_m, tile_n]
    guard: launchGeometry bounds both workgroup axes, uses ceiling division for the masked partial tiles over K/groups output channels, and puts groups on grid z (at most 65535).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: block
    python_source: builders/common/convolution_forward.py:block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:launchGeometry
    kmd_fields: [warp_m, warp_n, wave_size, pipeline]
    guard: launchGeometry requires wave64 and bounds the thread count at warp_m * warp_n * 64; kernelFits admits the mem, compv3, compv4 and basic pipelines, which share that launch, and refuses wavelet.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: kernargs_and_execution
    python_source: kernels/common/conv_implicit_gemm.py:build_implicit_gemm_conv
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:launch
    kmd_fields: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, groups]
    guard: prepare preserves tensor bindings and validated i32 byte counts; launch checks device pointers, 16-byte alignment and non-overlap, then passes A, B, D, A_bytes, B_bytes, D_bytes.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvFwd.cpp
  - name: pointer_nonalias
    python_source: kernels/common/conv_implicit_gemm.py:build_implicit_gemm_conv
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:bufferRangesDoNotOverlap
    kmd_fields: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, groups, dtype]
    guard: launch requires disjoint byte ranges for A, B and D, matching the original builder's noalias pointer contract.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: workspace
    python_source: kernels/common/conv_implicit_gemm.py:build_implicit_gemm_conv
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:workspaceBytes
    kmd_fields: [pipeline]
    guard: The packaged forward pipelines take no global workspace argument; workspaceBytes returns zero and prepare requests zero dynamic shared-memory bytes.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdMatchers.cpp
  - name: fallback_selection
    python_source: builders/common/convolution_forward.py:gfx950_conv_fwd_spec_for_request
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:score
    kmd_fields: [tile_k, kernel_family, direct_variant, block_w, block_waves]
    guard: Native score ranks direct depthwise kernels first, the default direct arm (gfx950_conv_fwd_direct_spec_for_request with no overrides) highest, then the dispatcher's tile_k=64 default; BenchmarkPlan can replace that ranking with measurements across both families.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdMatchers.cpp
  - name: direct_applicability
    python_source: builders/common/convolution_forward.py:_direct_error
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:kernelFits
    kmd_fields: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, groups, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue, kernel_family, direct_variant, block_w, block_waves]
    guard: kernelFits refuses an unknown kernel_family or direct_variant, an implicit-GEMM kernel whose direct fields are not at their defaults, and a direct kernel unless groups == C == K, sH == sW, pH == pW, dH == dW == 1, every implicit-GEMM placeholder is exact (tile/warp fields 0, wave_size 64, pipeline and epilogue none), block_waves is in [1, 16], a std kernel has block_w > 0 and a spatial kernel has block_w 0 and groups < 64.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdMatchers.cpp
  - name: direct_row_coverage
    python_source: builders/common/convolution_forward.py:_direct_rows_covered
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:directRowsCovered
    kmd_fields: [Hi, Wi, Y, X, sH, sW, pH, pW]
    guard: rocKE's direct kernels write output row floor(p/s) only for input rows p < Hi, so a direct kernel is accepted only when floor((Hi-1)/s) == Ho-1 and floor((Wi-1)/s) == Wo-1; otherwise rows are left unwritten or the runtime H loop writes into the next image. Such graphs stay on implicit GEMM.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: direct_grid
    python_source: builders/common/convolution_forward.py:grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:directLaunchGeometry
    kmd_fields: [N, Hi, Wi, X, sW, pW, groups, wave_size, direct_variant, block_w, block_waves]
    guard: "std: (ceil(Wo/block_w), ceil(groups/(64*block_waves)), N); spatial: (ceil(Wo/(block_waves*(64//groups))), 1, N), mirroring rocke/library/benchmarks/common/benchmark_direct_conv.py; directLaunchGeometry refuses any axis above 65535."
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: direct_block
    python_source: builders/common/convolution_forward.py:block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdGeometry.hpp:directLaunchGeometry
    kmd_fields: [wave_size, block_waves]
    guard: The block is 64 * block_waves threads with block_waves in [1, 16]; the direct kernels use no LDS and no workspace, so prepare still requests zero dynamic shared memory.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvFwdGeometry.cpp
  - name: direct_kernargs_and_execution
    python_source: kernels/common/conv_direct_grouped.py:build_direct_depthwise
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvFwdNative.cpp:launch
    kmd_fields: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, groups, kernel_family, direct_variant]
    guard: Both direct kernels (build_direct_depthwise and build_direct_depthwise_spatial) take the implicit-GEMM ABI unchanged (A, B, D, A_bytes, B_bytes, D_bytes) with the same byte counts, so launch is shared; the GPU tests force kernel_family=1 on every direct catalog shape, including both runtime H-loop paths with N=2.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvFwd.cpp
