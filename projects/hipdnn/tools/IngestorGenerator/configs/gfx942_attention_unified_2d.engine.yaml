# Engine manifest for hipkernel:Gfx942AttentionUnified2D.
#
# Everything about the engine that rocKE does not know: identity, KMD schema,
# metadata mapping, the registry space its kernels are drawn from, and how that
# space is reduced. The shipped kernel set is configs/gfx942_attention_unified_2d.yaml;
# tests/test_registry_regeneration.py gates it against this manifest.
#
#     python tools/registry_enumerator.py --manifest configs/gfx942_attention_unified_2d.engine.yaml --out <scratch>/config.yaml
#     python tools/registry_enumerator.py --manifest configs/gfx942_attention_unified_2d.engine.yaml --plan-space
#
# The kernel is rocKE's gfx942 paged unified-attention 2D prefill (vLLM
# `unified_attention` family). It takes a paged K/V cache plus block_tables / seq_lens /
# query_start_len, none of which a hipDNN SDPA graph carries: the provider derives them
# on the host (identity block table over the graph's contiguous BSHD K/V) and stages them
# in the plan's workspace. See packs/Gfx942AttentionUnified2DNative.cpp.
#
# Runtime shapes: the kernel reads num_query_heads, num_kv_heads and sliding_window as
# kernel arguments and derives its cu_q search trip count from num_seqs, so it bakes only
# the GQA ratio. A catalog cell is (head size, dtype, mask, GQA ratio), not a head pair:
# the head pairs below only build the requests, and every kernel serves any head pair of
# its ratio and any batch. rocKE's
# test_head_counts_and_batch_are_ir_neutral_at_a_fixed_gqa_ratio
# (rocke/library/tests/test_attention_tiled_2d_head_counts_gfx942.py) proves the head
# counts and num_seqs IR-neutral for one tuning candidate per codepath (narrow, transposed
# x8, wide 32x8).
#
# Mask: the gfx942 tiled 2D body computes the bottom-right causal band only, so every
# kernel is bottom-right causal. hipDNN's top-left causal mask is the same computation
# when every sequence has seqlen_q == seqlen_kv, but this engine declines every top-left
# graph: serving that case is a scope choice left to a follow-up, not a kernel limit.
# No-mask and top-left kernels join the cells when the gfx942 body gains those bands.
#
# Geometry: ten tuning geometries, five per head size, chosen by a correctness-checked
# gfx942 sweep, through rocKE's own launcher, of every LDS-legal geometry over 80 prefill
# shapes (D64/D128, bf16/fp16, GQA ratios 1..16, seqlen 256..4096 and a 512 -> 4096
# cross-length). A geometry that does not fit the 64 KiB LDS at a head size lists only the
# other head size's cells. The shipped selection is variant_reduce's cut of this space.
#
# Production stacks: rocKE's own spec for these cells is not a geometry in that sweep space.
# `_spec_gfx942_fp16_flash` and `_spec_gfx942_bf16_flash` (builders/common/attention_spec_builder.py)
# turn on, together, the mask-limit stack (scalar state, invariant hoist, mask once, mask
# limit), conflict-free V stores, a K ring or a single K buffer, `waves_per_eu` 2 and the
# `all` KV cache policy; at D64 also a sliced-K ring of 16-wide slices and direct-global Q.
# No registry sweep spec combines those, so three `enumerate.also` sections pin them with
# `spec_overrides`, each on the geometry rocKE selects: D64 (both dtypes in one section) and
# fp16 D128 at 4 warps x 32 rows with a 64-token tile (fp16 D128 with a depth-2 ring), and
# bf16 D128 at 2 warps x 32 rows with a single K buffer. The reduction kept no bf16 D128
# production kernel. rocKE routes short prefill (seqlen_q <= 768) to a light narrow geometry
# (16x16x16, 1 or 2 warps, 16 rows per warp, 64-token tile, register PV); this space has no
# such geometry at D128. After the reduction, D64 and fp16 D128 keep a narrow kernel only in
# their ratio-1 cells, and bf16 D128 keeps narrow kernels at ratios 1, 2, 4 and 8. The five
# stack fields that tell a production kernel from a geometry's default kernel are KMD fields,
# knobs and `reduction.fields.performance`, so the sweep ranks them and the catalog key never
# collides; the rest are fixed by the stack and recorded in the kernel spec.
#
# The generated packs/Gfx942AttentionUnified2DNative.cpp and its matcher test are stubs;
# the provider's copies are hand-maintained and must not be overwritten.

dialect: packaged
authored_subpath: rocKE/gfx942_attention_unified_2d
engine:
  name: hipkernel:Gfx942AttentionUnified2D
  slug: gfx942_attention_unified_2d
  census_name_symbol: GFX942_ATTENTION_UNIFIED_2D_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - tile_size
  - num_warps
  - block_m_per_warp
  - use_mfma_32x32x8
  - use_transposed_qk_32x32
  - use_k_sliced_ring
  - use_q_direct_global
  - use_conflict_free_v_store
  - use_transposed_mask_limit
  - use_transposed_invariant_hoist
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
# The GQA ratio (num_query_heads / num_kv_heads) the kernel bakes. The head counts are
# kernel arguments, so the matcher compares only the graph's ratio with this.
- name: num_queries_per_kv
  type: int
  default_value: 1
# The paged-KV block the identity block table is cut at. The graph's K/V are contiguous,
# so any block size that divides Skv addresses the same bytes.
- name: block_size
  type: int
  default_value: 16
# The mask kind, in hipDNN's / rocKE's AttentionMaskType numbering: 0 NO_MASK, 1
# TOP_LEFT_CAUSAL, 2 BOTTOM_RIGHT_CAUSAL. hkp_pack observes it from the compiled spec
# through the bound accessor UnifiedAttention2DTiledSpec.mask_type().
- name: mask_type
  type: int
  default_value: 2
# Always 0: no window kernels ship. Kept so the matcher compares it with the graph's
# left bound.
- name: sliding_window
  type: int
  default_value: 0
# Geometry, also public engine knobs: the KV tile, the CTA and the MFMA codepath
# (narrow 16x16, or transposed 32x32x8, which sets both flags). The defaults are the
# D128 cells' default kernel.
- name: tile_size
  type: int
  default_value: 32
- name: num_warps
  type: int
  default_value: 2
- name: block_m_per_warp
  type: int
  default_value: 32
- name: use_mfma_32x32x8
  type: int
  default_value: 1
- name: use_transposed_qk_32x32
  type: int
  default_value: 1
# The codegen stack, also public engine knobs. A geometry's default kernel leaves all five
# off except the 8-warp x 32-row one, which fits the LDS only with direct-Q and conflict-free
# V stores. A production kernel (see the header) turns on the mask limit and invariant
# hoist (the 4-flag mask stack moves together, so these two stand for it), conflict-free V
# stores, the K ring where rocKE uses it and direct-global Q at D64.
- name: use_k_sliced_ring
  type: int
  default_value: 0
- name: use_q_direct_global
  type: int
  default_value: 0
- name: use_conflict_free_v_store
  type: int
  default_value: 0
- name: use_transposed_mask_limit
  type: int
  default_value: 0
- name: use_transposed_invariant_hoist
  type: int
  default_value: 0
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_queries_per_kv
  - block_size
  - mask_type
  - sliding_window
  - tile_size
  - num_warps
  - block_m_per_warp
  - use_mfma_32x32x8
  - use_transposed_qk_32x32
  - use_k_sliced_ring
  - use_q_direct_global
  - use_conflict_free_v_store
  - use_transposed_mask_limit
  - use_transposed_invariant_hoist
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_queries_per_kv:
      method: resolved_num_queries_per_kv
    block_size:
      field: block_size
    mask_type:
      method: mask_type
    sliding_window:
      field: sliding_window
    tile_size:
      field: tile_size
    num_warps:
      field: num_warps
    block_m_per_warp:
      field: block_m_per_warp
    use_mfma_32x32x8:
      field: use_mfma_32x32x8
    use_transposed_qk_32x32:
      field: use_transposed_qk_32x32
    use_k_sliced_ring:
      field: use_k_sliced_ring
    use_q_direct_global:
      field: use_q_direct_global
    use_conflict_free_v_store:
      field: use_conflict_free_v_store
    use_transposed_mask_limit:
      field: use_transposed_mask_limit
    use_transposed_invariant_hoist:
      field: use_transposed_invariant_hoist
kernel_source_kind: rocke
workspace_policy: derived

pack: gfx942_attention_unified_2d
arch: gfx942
provider_root: dnn-providers/hip-kernel-provider
source: kernels/gfx942/attention_tiled_2d.py
builder: build_unified_attention_2d_tiled
kernel_name_template: attention_unified_2d.{dtype}_d{head_size}_g{num_queries_per_kv}_m{mask_type}_bs{block_size}_t{tile_size}_nw{num_warps}_mw{block_m_per_warp}_x{use_mfma_32x32x8}{use_transposed_qk_32x32}_f{use_k_sliced_ring}{use_q_direct_global}{use_conflict_free_v_store}{use_transposed_mask_limit}{use_transposed_invariant_hoist}.gfx942

# The registry space the selection is drawn from (see registry_enumerator.py).
enumerate:
  candidates: dispatch.attention:attention_candidates
  request: dispatch.attention.common:AttentionRequest
  # D64's default geometry: transposed 32x32x8, 4 warps x 32 rows, 4-page KV tile. Its
  # section lists only D64 cells, so it is their default; the next section is D128's.
  # Only llvm candidates are pinned: hkp_pack compiles every spec through the LLVM path.
  pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw4_mw32_t4xb_llvm}
  # Request fields every cell shares. The batch and sequence lengths are placeholders
  # for building the request: none of them is baked.
  fixed: &fixed {arch: gfx942, kv_block_size: 16, batch: 4, seqlen_q: 512, seqlen_k: 512}
  # Crossed in order, first group outermost (the catalog order). One head pair per GQA
  # ratio (1, 2, 4, 8, 16), each with 8 KV heads.
  cells: &d64_cells
    - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
      values: &d64_heads
        - [64, 64, 8, 8]
        - [64, 64, 16, 8]
        - [64, 64, 32, 8]
        - [64, 64, 64, 8]
        - [64, 64, 128, 8]
    - fields: [dtype]
      values: [bf16, fp16]
    - fields: [mask_type]
      values: [BOTTOM_RIGHT_CAUSAL]
  sweep_level: production
  # Full space per geometry. The five codegen stack fields (hold_fields) are held at each
  # geometry's default spec, and the rest of the flag stacks and waves_per_eu are held at
  # the registry default (reduction.fields.ignored): each geometry contributes its default
  # spec per cell, and variant reduction chooses among the geometries and the production
  # sections below. spec_fields records every field any pinned geometry's default sets: the
  # 8-warp x 32-row geometry fits the LDS only with direct-Q and conflict-free V stores,
  # which its default turns on.
  space: full
  spec_fields: &spec_fields [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_seqs, num_warps, block_m_per_warp, tile_size, use_mfma_32x32x8, use_transposed_qk_32x32, use_q_direct_global, use_conflict_free_v_store, use_i64_kv_addr, use_k_sliced_ring, use_transposed_mask_limit, use_transposed_invariant_hoist]
  hold_fields: [use_k_sliced_ring, use_q_direct_global, use_conflict_free_v_store, use_transposed_mask_limit, use_transposed_invariant_hoist]
  # The head pair only builds the request; cells merge per GQA ratio (inherited by
  # every also section).
  selector_fields: [nhead_q, nhead_k]
  # Not baked (see the header): every kernel carries its cell default's values, and the
  # launch passes the graph's head counts and batch.
  neutral_fields: &neutral [num_seqs, num_query_heads, num_kv_heads]
  # The head counts are neutral but their ratio is baked: one cell per ratio.
  cell_keyed_by: [num_queries_per_kv]
  # Required of every shipped manifest; under space: full the enumerator only records
  # it, and the aot_budget_per_arch WARN is the live check.
  max_kernels: 100
  also:
    # D128's default geometry, listed first among the D128 sections so it is their default:
    # transposed 32x32x8, 2 warps x 32 rows, 2-page KV tile.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw2_mw32_t2xb_llvm}
      fixed: *fixed
      cells: &d128_cells
        - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
          values: &d128_heads
            - [128, 128, 8, 8]
            - [128, 128, 16, 8]
            - [128, 128, 32, 8]
            - [128, 128, 64, 8]
            - [128, 128, 128, 8]
        - fields: [dtype]
          values: [bf16, fp16]
        - fields: [mask_type]
          values: [BOTTOM_RIGHT_CAUSAL]
      spec_fields: *spec_fields
      neutral_fields: *neutral
    # The rest of D64's five, in the sweep's order.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw8_mw32_t4xb_llvm}
      fixed: *fixed
      cells: *d64_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw4_mw16_t4xb_llvm}
      fixed: *fixed
      cells: *d64_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw4_mw32_t4xb_llvm}
      fixed: *fixed
      cells: *d64_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw2_mw16_t4xb_llvm}
      fixed: *fixed
      cells: *d64_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    # The rest of D128's five, in the sweep's order.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw4_mw32_t2xb_llvm}
      fixed: *fixed
      cells: *d128_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw4_mw16_t2xb_llvm}
      fixed: *fixed
      cells: *d128_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw2_mw32_t2xb_llvm}
      fixed: *fixed
      cells: *d128_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_narrow_nw2_mw16_t1xb_llvm}
      fixed: *fixed
      cells: *d128_cells
      spec_fields: *spec_fields
      neutral_fields: *neutral
    # rocKE's production stacks (see the header). Each section's spec_overrides are the
    # fields rocKE's builder sets beyond the pinned geometry's default spec for that
    # (dtype, head size) at prefill; tests/test_registry_regeneration.py::test_g9 holds them
    # to `_tiled_spec_from_problem`.
    # D64, both dtypes: 4 warps x 32 rows, 64-token tile, a depth-3 ring of 16-wide K
    # slices and direct-global Q.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw4_mw32_t4xb_llvm}
      fixed: *fixed
      cells:
        - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
          values: *d64_heads
        - fields: [dtype]
          values: [bf16, fp16]
        - fields: [mask_type]
          values: [BOTTOM_RIGHT_CAUSAL]
      spec_overrides:
        waves_per_eu: 2
        use_transposed_scalar_state: true
        use_transposed_invariant_hoist: true
        use_transposed_mask_once: true
        use_transposed_mask_limit: true
        use_conflict_free_v_store: true
        use_k_sliced_ring: true
        k_slice_hd: 16
        use_q_direct_global: true
        kv_cache_policy: all
      spec_fields: &production_spec_fields [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_seqs, num_warps, block_m_per_warp, tile_size, use_mfma_32x32x8, use_transposed_qk_32x32, use_q_direct_global, use_conflict_free_v_store, use_i64_kv_addr, use_k_sliced_ring, use_transposed_mask_limit, use_transposed_invariant_hoist, waves_per_eu, use_transposed_scalar_state, use_transposed_mask_once, use_k_single_buffer, ring_depth, k_slice_hd, kv_cache_policy]
      neutral_fields: *neutral
    # fp16 D128: 4 warps x 32 rows, 64-token tile, depth-2 K ring (a depth-3 ring reuses a
    # slot before its DMA drains at D128), no direct-global Q.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw4_mw32_t2xb_llvm}
      fixed: *fixed
      cells:
        - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
          values: *d128_heads
        - fields: [dtype]
          values: [fp16]
        - fields: [mask_type]
          values: [BOTTOM_RIGHT_CAUSAL]
      spec_overrides:
        tile_size: 64
        waves_per_eu: 2
        use_transposed_scalar_state: true
        use_transposed_invariant_hoist: true
        use_transposed_mask_once: true
        use_transposed_mask_limit: true
        use_conflict_free_v_store: true
        use_k_sliced_ring: true
        ring_depth: 2
        kv_cache_policy: all
      spec_fields: *production_spec_fields
      neutral_fields: *neutral
    # bf16 D128: no ring (every correct ring is slower at block size 16): 2 warps x 32 rows,
    # 64-token tile, one K buffer.
    - pin: {algorithm: unified_tuning, spec_id: gfx942_u2d_transposed_x8_nw2_mw32_t2xb_llvm}
      fixed: *fixed
      cells:
        - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
          values: *d128_heads
        - fields: [dtype]
          values: [bf16]
        - fields: [mask_type]
          values: [BOTTOM_RIGHT_CAUSAL]
      spec_overrides:
        tile_size: 64
        waves_per_eu: 2
        use_transposed_scalar_state: true
        use_transposed_invariant_hoist: true
        use_transposed_mask_once: true
        use_transposed_mask_limit: true
        use_k_single_buffer: true
        kv_cache_policy: all
      spec_fields: *production_spec_fields
      neutral_fields: *neutral

reduction:
  fields:
    # Spec fields and the ratio property the cells are keyed by. The mask is constant
    # (bottom-right causal) until the gfx942 body gains other bands.
    feature: [dtype, head_size, num_queries_per_kv, sliding_window, block_size]
    # The geometry: constant within a section, so variant reduction compares sections.
    performance:
      - {name: tile_size}
      - {name: num_warps}
      - {name: block_m_per_warp}
      - {name: use_mfma_32x32x8}
      - {name: use_transposed_qk_32x32}
      - {name: use_k_sliced_ring}
      - {name: use_q_direct_global}
      - {name: use_conflict_free_v_store}
      - {name: use_transposed_mask_limit}
      - {name: use_transposed_invariant_hoist}
    # num_seqs is neutral (above), so it never varies; listed to state that it is not a
    # kernel axis. The rest are the codegen flag stacks and the occupancy hint the
    # production sweep varies inside one geometry, held at the registry default. The five
    # performance stack fields above are held by enumerate.hold_fields in every section but
    # the production ones, which pin them with spec_overrides.
    ignored: [num_seqs, waves_per_eu, use_conflict_free_v_store_split, use_conflict_free_v, use_mfma_32x32, use_register_pv, use_transposed_scalar_state, use_transposed_mask_once, use_transposed_half_local_pv, use_mfma32_skip_legacy_qreg, use_grouped_kv2_softmax, use_fast_paged_kv_desc, use_early_v_schedule, use_agpr_alloc_zero, use_k_single_buffer, ring_depth, k_slice_hd, use_k_sliced_ldsseq, use_iglp_opt, use_qk_pv_sched_group_barrier, use_v_hbm_direct, use_global_load_lds_k, kv_cache_policy, use_q_major_grid, use_causal_mask_phase_split]
  aot_budget_per_arch: 1000

# How owner benchmark rows become hipDNN graphs (tools/ground_truth.py graphs).
ground_truth:
  graph_template: templates/attention_sdpa_fwd.graph.json
  value_map:
    dtype: {bf16: bfloat16, fp16: half}
    mask_type:
      BOTTOM_RIGHT_CAUSAL: {/nodes/sdpa_node/attributes/causal_mask_bottom_right: true}

# Launch-surface audit (`tools/launch_surface.py --check <this file>`).
launch_surface:
  - name: grid
    python_source: dispatch/attention/common.py:launch_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionUnified2DGeometry.hpp
    kmd_fields: [num_warps, block_m_per_warp, num_queries_per_kv]
    guard: >
      gfx942Unified2DLaunchGeometry() throws HipdnnPluginException for non-positive
      dimensions, num_queries_per_kv outside 1..16 or a non-dividing GQA ratio. Grid is
      (Hkv, total_q // block_q + batch, 1) with block_q = block_m / (Hq / Hkv), Hq and
      Hkv the graph's.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionUnified2DGeometry.cpp

  - name: block
    python_source: dispatch/attention/common.py:launch_block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionUnified2DGeometry.hpp
    kmd_fields: [num_warps]
    guard: >
      64 * num_warps threads; num_warps outside {1, 2, 4, 8} throws.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionUnified2DGeometry.cpp

  - name: workspace
    python_source: kernels/common/attention_unified.py:_tiled_2d_signature
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionUnified2DGeometry.hpp
    kmd_fields: [block_size]
    guard: >
      gfx942Unified2DWorkspaceLayout() lays out the identity block_tables
      [B, Skv / block_size], seq_lens [B] and query_start_len [B + 1] (int32, each 256-byte
      aligned) the kernel reads as paged-KV metadata; it throws for a Skv that block_size
      does not divide.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942AttentionUnified2DGeometry.cpp

  - name: matcher
    python_source: kernels/gfx942/attention_tiled_2d.py:supports_tiled_2d
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942AttentionUnified2DNative.cpp
    kmd_fields: [dtype, head_size, num_queries_per_kv, block_size, mask_type, sliding_window, tile_size, num_warps, block_m_per_warp, use_mfma_32x32x8, use_transposed_qk_32x32, use_k_sliced_ring, use_q_direct_global, use_conflict_free_v_store, use_transposed_mask_limit, use_transposed_invariant_hoist]
    guard: >
      kernelMatches() returns false (no panic) if dtype, head_size, the GQA ratio,
      mask_type or sliding_window disagrees with the graph, Skv is not a multiple of
      block_size, or the candidate's geometry is one gfx942 does not build; a record
      without one of the five codegen stack fields, or with a value outside 0/1, is
