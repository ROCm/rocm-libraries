#
# Tool profile for hipkernel:Gfx942ConvFwdAot, the shape-generic AOT-instance engine.
# The bundle and its generator config come from tools/make_conv_aot_config_gfx942.py; see
# dnn-providers/hip-kernel-provider/docs/gfx942_conv_fwd/aot_instances.md (not yet
# written; mi300plan.md tracks this integration instead for now).

slug: gfx942_conv_fwd_aot
bundle: gfx942_conv_fwd_aot
pack: gfx942_conv_fwd_aot
arch: gfx942
provider_root: dnn-providers/hip-kernel-provider
dialect: packaged
authored_subpath: rocKE/gfx942_conv_fwd_aot
source: builders/common/convolution_forward_gfx942.py
builder: build_gfx942_conv_fwd_aot
kernel_source_kind: rocke
# Only a split-C instance asks for scratch, sized per graph by the native handler.
workspace_policy: derived
delegates_to_existing_plan: false

engine:
  name: hipkernel:Gfx942ConvFwdAot
  sdk_version: "1.0.0"
  # make_conv_aot_config.ENGINE_KNOBS
  knobs:
    - kernel_family
    - direct_variant
    - tile_m
    - tile_n
    - tile_k
    - warp_m
    - warp_n
    - warp_tile_m
    - warp_tile_n
    - warp_tile_k
    - pipeline
    - epilogue
    - vector_size_a
    - vector_size_b
    - vector_size_c
    - unroll_k
    - async_dma
    - async_chunk_a
    - async_chunk_b
    - block_w
    - block_waves
    - block_h
    - unroll_rows
    - block_q
    - block_groups
    - double_buffer
    - tile_h
    - tile_w
    - tile_k_out
    - ck
    - waves_m
    - waves_n
    - atom
    - swizzle_wgm
    - iglp
    - waves_per_eu
    - group_merge
    - split_c
  heuristic: native

# Instances are matched per problem by capability, so "dispatch" resolves the problem
# the engine would match, and the predicate is its graph contract. rocKE's instance
# dispatcher, once instances are registered there, is the natural replacement.
# dispatch_parity.py uses these blocks to resolve requests only. Its config emission
# stage does not apply: the generator config comes from make_conv_aot_config.py.
request:
  module: dispatch.grouped_convolution
  class: ConvGroupedRequest
  defaults:
    direction: fwd
    layout: NHWC
    G: 1
    algorithm: implicit_gemm_fwd
dispatch:
  module: builders.common.convolution_forward_gfx942
  function: gfx942_conv_fwd_aot_problem_for_request
predicate:
  module: builders.common.convolution_forward_gfx942
  function: supports_gfx942_conv_fwd_aot_problem
arch_spec:
  module: builders.common.convolution_forward_gfx942
  class: Gfx942ConvFwdSpec

kmd_fields:
  - {name: dtype, type: string}
  - {name: tile_m, type: int}
  - {name: tile_n, type: int}
  - {name: tile_k, type: int}
  - {name: warp_m, type: int}
  - {name: warp_n, type: int}
  - {name: warp_tile_m, type: int}
  - {name: warp_tile_n, type: int}
  - {name: warp_tile_k, type: int}
  - {name: wave_size, type: int}
  - {name: pipeline, type: string}
  - {name: epilogue, type: string}
  - {name: vector_size_a, type: int}
  - {name: vector_size_b, type: int}
  - {name: vector_size_c, type: int}
  - {name: unroll_k, type: int}
  - {name: async_dma, type: int}
  - {name: async_chunk_a, type: int}
  - {name: async_chunk_b, type: int}
  - {name: grouped, type: int}
  - {name: instance_id, type: string}
  - {name: layout, type: string}
  # Direct depthwise instances; implicit-GEMM descriptors leave them to the builder default.
  - {name: kernel_family, type: int, default_value: 0, builder_default: true}
  - {name: direct_variant, type: string, default_value: none, builder_default: true}
  - {name: filter_h, type: int, default_value: 0, builder_default: true}
  - {name: filter_w, type: int, default_value: 0, builder_default: true}
  - {name: stride_h, type: int, default_value: 0, builder_default: true}
  - {name: stride_w, type: int, default_value: 0, builder_default: true}
  - {name: pad_h, type: int, default_value: 0, builder_default: true}
  - {name: pad_w, type: int, default_value: 0, builder_default: true}
  - {name: dilation_h, type: int, default_value: 0, builder_default: true}
  - {name: dilation_w, type: int, default_value: 0, builder_default: true}
  - {name: block_w, type: int, default_value: 0, builder_default: true}
  - {name: block_waves, type: int, default_value: 0, builder_default: true}

vocabulary:
  dtype: {fp16: fp16, bf16: bf16}
  layout: {NHWC: NHWC}
  pipeline: {mem: mem, compv3: compv3, compv4: compv4, basic: basic, direct: direct}
  epilogue: {cshuffle: cshuffle, default: default, direct: direct}
  # gfx950's profile.yaml lists only {none, std, spatial} here (pre-existing, not
  # kept in step with its own catalog's later direct families); this gfx942
  # catalog's actual direct_variant values (see
  # test_convolution_forward_gfx942_aot_packaging.py) are listed in full.
  direct_variant: {none: none, std: std, spatial: spatial, tiled: tiled, col: col, grouped: grouped, nongrouped: nongrouped, grouped_halo: grouped_halo}

launch_surface:
  - name: instance_contract
    python_source: builders/common/convolution_forward_gfx942.py:supports_gfx942_conv_fwd_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdNative.cpp:aotInstance
    kmd_fields: [dtype, layout, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue, vector_size_a, vector_size_b, vector_size_c, unroll_k, async_dma, async_chunk_a, async_chunk_b, grouped]
    guard: aotInstance admits only a kpack kernel with NHWC layout, wave64, an mem/compv3/compv4/basic pipeline, a default or cshuffle epilogue, positive tile/warp/vector fields, nonnegative async chunks and 0/1 flags; any missing or malformed field refuses the kernel.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942ConvFwdMatchers.cpp
  - name: served_problems
    python_source: builders/common/convolution_forward_gfx942.py:gfx942_conv_fwd_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdGeometry.hpp:aotInstanceLaunch
    kmd_fields: [vector_size_a, vector_size_b, vector_size_c, async_dma, async_chunk_a, async_chunk_b, grouped, tile_m, tile_n, warp_m, warp_n]
    guard: The forward subset of rocKE's KernelCache.supports_problem. The A/B widths divide C/groups, the D width divides K/groups, async chunks divide C/groups, a grouped graph needs a grouped binary, and every grid axis fits 65535; implicitGemmKernargs refuses a reduction Y*X*C/groups at or above 2^23. library/tests/test_convolution_forward_aot_packaging.py checks the Python predicate against supports_problem.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942ConvFwdGeometry.cpp
  - name: direct_instance_contract
    python_source: builders/common/convolution_forward_gfx942.py:supports_gfx942_conv_fwd_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdNative.cpp:aotInstance
    kmd_fields: [kernel_family, direct_variant, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, block_w, block_waves]
    guard: aotInstance reads kernel_family first. A direct instance must hold the direct identity's placeholders (0 tuning, vector, flag and chunk fields; "direct" pipeline and epilogue) and a std or spatial variant; an implicit-GEMM instance must leave every direct field at its KMD default. Unknown families or variants and missing fields refuse the kernel.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942ConvFwdMatchers.cpp
  - name: direct_served_problems
    python_source: builders/common/convolution_forward_gfx942.py:gfx942_conv_fwd_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdGeometry.hpp:directInstanceLaunch
    kmd_fields: [direct_variant, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, block_w, block_waves]
    guard: The exact-shape engine's direct rule. directProblemSupported (pure depthwise, one stride and padding, no dilation, odd filter with "same" padding, rows covered), then the compiled filter, stride, padding and dilation must be the graph's (directServes), then directLaunchGeometry (spatial below 64 groups, block bounds, every grid axis within 65535). library/tests/test_convolution_forward_aot_packaging.py checks the Python predicate against rocKE's supports_problem plus the per-shape validator.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942ConvFwdGeometry.cpp
  - name: kernargs_and_execution
    python_source: kernels/common/conv_abi.py:conv_arg_names
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdGeometry.hpp:implicitGemmKernargs
    kmd_fields: [dtype, tile_m, tile_n]
    guard: The launch is the exact-shape engine's 45-argument forward AOT ABI computed from the graph, with num_pid_m/num_pid_n from the instance's own tile; prepare checks the recorded argument names before launching. The GPU suite pins every serving instance of each graph and compares it with the CPU reference.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx942ConvFwd.cpp
  - name: fallback_selection
    python_source: builders/common/convolution_forward_gfx942.py:gfx942_conv_fwd_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdGeometry.hpp:aotInstanceScore
    kmd_fields: [tile_m, tile_n, vector_size_a, vector_size_b, vector_size_c]
    guard: Unbenchmarked order only, a placeholder until rocKE's dispatcher ranks instances. Less tile padding and a fuller grid rank higher, with wider vectors breaking ties; BenchmarkPlan replaces it with measurements of every serving instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx942ConvFwdMatchers.cpp
  - name: workspace
    python_source: builders/common/convolution_forward_gfx942.py:build_gfx942_conv_fwd_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx942ConvFwdNative.cpp:workspaceBytes
    kmd_fields: [pipeline, split_c]
    guard: The forward instances use static LDS only and prepare requests zero dynamic shared memory. Only a split-C non-grouped instance (split_c > 1, its own pack and dispatch, hipkernel.gfx942_conv_fwd_aot.split_c_dispatch) needs scratch, the fp32 [split_c, N, Ho, Wo, K] partial sums its conv pass writes and its direct_split_reduce launch folds (splitWorkspaceBytes, DirectNongroupedConvSpec.workspace_bytes); workspaceBytes returns zero for every other instance.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx942ConvFwd.cpp
