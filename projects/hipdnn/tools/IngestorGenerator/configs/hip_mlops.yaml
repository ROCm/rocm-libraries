# The HIP MLOps engine on the kernel ingestor (ALMIOPEN-3066). One engine that takes over
# the hand-written HIP_MLOPS_ENGINE's name and id, so support claims and pinned ids carry
# over; one pack per op family, each with its own operation matcher and dispatch handler.
# Every kernel is embedded source compiled at plan build, with the graph baked in as
# compile options, as the hand-written engine does. The bundle ships under
# descriptors/HipMlops/ and is packed only with HIPKERNELPROVIDER_MLOPS_ENABLE_INGESTOR ON.

engine:
  name: hipkernel:HipMlops
  builtin_engine: HIP_MLOPS_ENGINE
  sdk_version: "1.4.0"
  behavior_notes: [runtime_compilation, supports_graph_capture]
  heuristic: none

kmd_fields:
  - name: operation
    type: string

graph_match:
  shape: disjoint_attributes
  discriminator: field_value

kernel_source_kind: embedded_source
workspace_policy: none

authored_subpath: descriptors/HipMlops

packs:
  - name: resample_fwd
    discriminator: resample_fwd
    dispatch: resample_fwd
    kernels:
      - name: hip_mlops.resample_fwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/resample/ResampleFwd.cpp
          entry_point: ResampleFwd
        metadata:
          operation: RESAMPLE_FWD
        priority: 0
  - name: resample_bwd
    discriminator: resample_bwd
    dispatch: resample_bwd
    kernels:
      - name: hip_mlops.resample_bwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/resample/ResampleBwd.cpp
          entry_point: ResampleBwd
        metadata:
          operation: RESAMPLE_BWD
        priority: 0

  - name: layernorm_fwd
    discriminator: layernorm_fwd
    dispatch: layernorm_fwd
    kernels:
      - name: hip_mlops.layernorm_fwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/layernorm/LayernormFwd.cpp
          entry_point: LayernormFwd
        metadata:
          operation: LAYERNORM_FWD
        priority: 0
  # One program, two or three launches: LayernormBwd, then LayernormBwdScaleBias, or
  # LayernormBwdScaleBiasParallel and LayernormBwdScaleBiasReduceSum. The handler launches
  # the entry points after the first by symbol (entryPointKernelDefinition).
  - name: layernorm_bwd
    discriminator: layernorm_bwd
    dispatch: layernorm_bwd
    kernels:
      - name: hip_mlops.layernorm_bwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/layernorm/LayernormBwd.cpp
          entry_point: LayernormBwd
        metadata:
          operation: LAYERNORM_BWD
        priority: 0

  # Each also serves the hand-written builders' two-node graphs, a ReLU fused after the
  # forward or before the backward; the graph match tells them apart from the plain ones.
  - name: rmsnorm_fwd
    discriminator: rmsnorm_fwd
    dispatch: rmsnorm_fwd
    kernels:
      - name: hip_mlops.rmsnorm_fwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/rmsnorm/RMSNormFwd.cpp
          entry_point: RMSnormFwd
        metadata:
          operation: RMSNORM_FWD
        priority: 0
  # One program, two launches: RMSnormBwdData, then RMSnormBwdScaleBias by symbol.
  - name: rmsnorm_bwd
    discriminator: rmsnorm_bwd
    dispatch: rmsnorm_bwd
    kernels:
      - name: hip_mlops.rmsnorm_bwd
        kernel_source:
          kind: embedded_source
          source_file: kernels/rmsnorm/RMSNormBwd.cpp
          entry_point: RMSnormBwdData
        metadata:
          operation: RMSNORM_BWD
        priority: 0

  # Batchnorm inference, from one source with an entry point per form: the inverse variance
  # the graph supplies, or a variance and epsilon. Each also serves the hand-written builder's
  # two-node graph, an activation fused after the batchnorm.
  - name: batchnorm_inference
    discriminator: batchnorm_inference
    dispatch: batchnorm_inference
    kernels:
      - name: hip_mlops.batchnorm_inference
        kernel_source:
          kind: embedded_source
          source_file: kernels/batchnorm/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEstInvVar
        metadata:
          operation: BATCHNORM_INFERENCE
        priority: 0
  - name: batchnorm_inference_variance
    discriminator: batchnorm_inference_variance
    dispatch: batchnorm_inference_variance
    kernels:
      - name: hip_mlops.batchnorm_inference_variance
        kernel_source:
          kind: embedded_source
          source_file: kernels/batchnorm/BatchNormFwdInferSpatial.cpp
          entry_point: BatchNormFwdInferSpatialEst
        metadata:
          operation: BATCHNORM_INFERENCE_VARIANCE
        priority: 0
  # Batchnorm training, alone or followed by an activation: one launch, or for the
  # multi-workgroup variant three, all from one program.
  - name: batchnorm_training
    discriminator: batchnorm_training
    dispatch: batchnorm_training
    kernels:
      - name: hip_mlops.batchnorm_training
        kernel_source:
          kind: embedded_source
          source_file: kernels/batchnorm/BatchNormFwdTrainSpatial.cpp
          entry_point: BatchNormFwdTrainSpatial
        metadata:
          operation: BATCHNORM_TRAINING
        priority: 0
  # Batchnorm backward, alone or fused after an inference and an activation's backward: one
  # launch, or for the multi-workgroup variant up to five, all from one program.
  - name: batchnorm_backward
    discriminator: batchnorm_backward
    dispatch: batchnorm_backward
    kernels:
      - name: hip_mlops.batchnorm_backward
        kernel_source:
          kind: embedded_source
          source_file: kernels/batchnorm/BatchNormBwdSpatial.cpp
          entry_point: BatchNormBwdSpatial
        metadata:
          operation: BATCHNORM_BACKWARD
        priority: 0

# Embedded source compiled at plan build: every field is matcher-only.
specialization:
  metadata_fields: []
  matcher_only_fields: [operation]
  bindings: {}
  vocabulary: {}
