# The Resample backward engine on the kernel ingestor (ALMIOPEN-3066), one of the nine
# engines that serve the HIP MLOps operations, one per primary operation node. Every kernel
# is embedded source compiled at plan build, with the graph baked in as compile options, as
# the retired hand-written HIP_MLOPS_ENGINE did. The bundle ships under
# descriptors/HipMlops/resample_bwd/ with its kernel source in kernels/, and is packed with
# the kernel ingestor.

engine:
  name: hipkernel:ResampleBwd
  sdk_version: "1.4.0"
  behavior_notes: [runtime_compilation, supports_graph_capture]
  # No kernel uses atomics, and each cross-workgroup reduction is a later launch in a
  # fixed order, so a (graph, configuration, device) gives the same bits every run:
  # TestHipMlopsDeterminism.cpp proves it for every kernel the engine ships.
  numerical_notes: []
  # Each block size is a kernel of its own, addressed by this knob. The native scorer ranks
  # the hand-written plan's first.
  knobs: [block_size]
  heuristic: native

# block_size defaults to ResampleConfig's own default, the hand-written plan's block.
kmd_fields:
  - name: operation
    type: string
  - name: block_size
    type: int
    default_value: 256

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: embedded_source
workspace_policy: none

authored_subpath: descriptors/HipMlops/resample_bwd

packs:
  # One kernel per block size the screening kept: a thread per dx element in blocks of
  # 256, 512 or 1024 threads.
  - name: resample_bwd
    kernels:
      - name: hip_mlops.resample_bwd.block256
        kernel_source:
          kind: embedded_source
          source_file: kernels/ResampleBwd.cpp
          entry_point: ResampleBwd
        metadata:
          operation: RESAMPLE_BWD
          block_size: 256
        priority: 0
      - name: hip_mlops.resample_bwd.block512
        kernel_source:
          kind: embedded_source
          source_file: kernels/ResampleBwd.cpp
          entry_point: ResampleBwd
        metadata:
          operation: RESAMPLE_BWD
          block_size: 512
        priority: 0
      - name: hip_mlops.resample_bwd.block1024
        kernel_source:
          kind: embedded_source
          source_file: kernels/ResampleBwd.cpp
          entry_point: ResampleBwd
        metadata:
          operation: RESAMPLE_BWD
          block_size: 1024
        priority: 0

# Embedded source compiled at plan build: every field is matcher-only.
specialization:
  metadata_fields: []
  matcher_only_fields: [operation, block_size]
  bindings: {}
  vocabulary: {}
