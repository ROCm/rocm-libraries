# Source of truth for the shipped hipkernel:hip_conv_fwd_rdna catalog: an FMA implicit-GEMM
# forward convolution for the gfx11 (RDNA3/3.5) and gfx12 (RDNA4) targets, compiled from HIP
# source (kernels/ConvFwdFmaIgemm.cpp). One kernel per dtype x layout x output-channel tile.
# Batch, channels, groups, every spatial extent, stride, dilation and padding are launch
# arguments; 2D runs as 3D with depth 1.
#
# The native matcher (HipConvFwdRdnaNative.cpp) admits one conv_fprop node and picks the
# tile from the output channels per group, so each graph has one candidate. The RDNA
# targets are listed one by one rather than as gfx11-generic / gfx12-generic, so each
# shard compiles its own targets and is stamped with its architecture.

dialect: packaged
authored_subpath: hip/conv_rdna
engine:
  name: hipkernel:hip_conv_fwd_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: tile_n
  type: int

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: hip
workspace_policy: none

packs:
- name: hip_conv_fwd_rdna
  arch: [gfx1100, gfx1101, gfx1102, gfx1103, gfx1150, gfx1151, gfx1152, gfx1153, gfx1200, gfx1201]
  kernels:
  - name: hip_conv_fwd_rdna.fma_f32_nchw_tile_n32
    kernel_source:
      kind: hip
      source: kernels/ConvFwdFmaIgemm.cpp
      entry: ConvFwdFmaIgemm
      build:
        defines: {CONV_DTYPE: 0, CONV_CHANNELS_LAST: 0, CONV_WEI_KCZYX: 1, TILE_N: 32}
    metadata: {kernel_family: fma_igemm, dtype: FLOAT, layout: CHANNELS_FIRST, tile_n: 32}
    priority: 0
