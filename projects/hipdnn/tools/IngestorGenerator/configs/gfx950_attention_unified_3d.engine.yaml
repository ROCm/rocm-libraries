# Engine manifest for hipkernel:Gfx950AttentionUnified3D.
#
# Everything about the engine that rocKE does not know: identity, KMD schema, metadata
# mapping, the registry space its kernels are drawn from, and how that space is reduced.
# The shipped kernel set is configs/gfx950_attention_unified_3d.yaml;
# tests/test_registry_regeneration.py gates it against this manifest.
#
#     python tools/registry_enumerator.py --manifest configs/gfx950_attention_unified_3d.engine.yaml --out <scratch>/config.yaml
#
# The kernel is rocKE's gfx950 split-KV unified attention for DECODE (one query token per
# sequence): a segment kernel (build_unified_attention_3d_tiled) that writes per-segment
# partial softmax state, then a reduce kernel (build_unified_attention_reduce_tiled) that
# combines it. The reduce kernel ships as each kernel's companion code object. Like
# Unified2D it reads a paged K/V cache plus block_tables / seq_lens / query_start_len, which
# the provider derives on the host (identity block table over the graph's contiguous BSHD
# K/V) and stages in the plan's workspace beside the segment scratch. See
# packs/Gfx950AttentionUnified3DNative.cpp.
#
# The generated packs/Gfx950AttentionUnified3DNative.cpp and
# tests/TestGfx950AttentionUnified3DMatchers.cpp are stubs; the provider's copies are
# hand-maintained and must not be overwritten.

dialect: packaged
authored_subpath: rocKE/gfx950_attention_unified_3d
engine:
  name: hipkernel:Gfx950AttentionUnified3D
  slug: gfx950_attention_unified_3d
  census_name_symbol: GFX950_ATTENTION_UNIFIED_3D_ENGINE_NAME
  sdk_version: 1.0.0
  knobs:
  - num_segments
  heuristic: native
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
- name: num_query_heads
  type: int
  default_value: 8
- name: num_kv_heads
  type: int
  default_value: 8
# The paged-KV block the identity block table is cut at; also the KV tile (every shipped
# geometry is one page per tile).
- name: block_size
  type: int
  default_value: 16
# AttentionMaskType numbering, observed through UnifiedAttention3DTiledSpec.mask_type():
# 1 TOP_LEFT_CAUSAL, 2 BOTTOM_RIGHT_CAUSAL. No kernel carries 0: with one query row, full
# attention IS the bottom-right causal computation, and rocKE's normalize_band builds it as
# that, so the engine serves a NO_MASK decode graph with the mask_type 2 kernel.
- name: mask_type
  type: int
  default_value: 2
- name: sliding_window
  type: int
  default_value: 0
# How many KV splits the segment kernel runs (grid z) and the reduce kernel combines. Baked
# into both binaries and into the workspace size.
- name: num_segments
  type: int
  default_value: 16
# One CTA per sequence along grid x and no query_start_len search: legal only when every
# sequence has one query token. Every shipped kernel is built this way; kernel_match
# requires seqlen_q == 1 for it.
- name: use_decode_grid
  type: int
  default_value: 1
specialization:
  metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - block_size
  - mask_type
  - sliding_window
  - num_segments
  - use_decode_grid
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    block_size:
      field: block_size
    mask_type:
      method: mask_type
    sliding_window:
      field: sliding_window
    num_segments:
      field: num_segments
    use_decode_grid:
      field: use_decode_grid
kernel_source_kind: rocke
workspace_policy: derived

pack: gfx950_attention_unified_3d
arch: gfx950
provider_root: dnn-providers/hip-kernel-provider
source: kernels/gfx950/attention_tiled_3d.py
builder: build_unified_attention_3d_tiled
kernel_name_template: attention_unified_3d.{dtype}_d{head_size}_hq{num_query_heads}_kv{num_kv_heads}_m{mask_type}_bs{block_size}_seg{num_segments}.gfx950

# The reduce kernel every segment kernel launches after itself, derived from the segment
# kernel's own spec. registry_enumerator checks the derivation reproduces the reduce spec
# the registry pairs with each kernel.
companions:
  - source: kernels/gfx950/attention_tiled_3d.py
    builder: build_unified_attention_reduce_tiled
    spec_from:
      head_size: head_size
      num_query_heads: num_query_heads
      num_kv_heads: num_kv_heads
      dtype: dtype
      num_segments: num_segments

# The registry space the selection is drawn from (see registry_enumerator.py).
enumerate:
  candidates: dispatch.attention:attention_candidates
  request: dispatch.attention.common:AttentionRequest
  # One geometry: 16 KV splits, a one-page KV tile. The sweep-widened geometries are a
  # follow-up that needs measurements.
  pin: {algorithm: unified_tuning, spec_id: gfx950_u3d_splitkv_seg16_t1xb}
  # Request fields every cell shares. seqlen_q 1 is what makes these decode-grid kernels;
  # batch and seqlen_k are a reference shape only (they bake num_seqs 1, which the decode
  # grid does not read, and steer the perf-only K/V cache knobs).
  fixed: {arch: gfx950, kv_block_size: 16, batch: 1, seqlen_q: 1, seqlen_k: 4096}
  # Crossed in order, first group outermost (the catalog order).
  cells:
    - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
      values:
        - [64, 64, 8, 1]
        - [64, 64, 8, 8]
        - [64, 64, 10, 10]
        - [64, 64, 12, 12]
        - [64, 64, 16, 2]
        - [64, 64, 16, 16]
        - [64, 64, 20, 20]
        - [64, 64, 32, 4]
        - [64, 64, 32, 8]
        - [64, 64, 32, 32]
        - [64, 64, 64, 8]
        - [64, 64, 128, 128]
        - [128, 128, 24, 24]
        - [128, 128, 4, 4]
        - [128, 128, 8, 1]
        - [128, 128, 8, 2]
        - [128, 128, 8, 8]
        - [128, 128, 9, 9]
        - [128, 128, 16, 2]
        - [128, 128, 16, 16]
        - [128, 128, 32, 4]
        - [128, 128, 32, 8]
        - [128, 128, 32, 32]
        - [128, 128, 40, 10]
        - [128, 128, 40, 40]
        - [128, 128, 64, 4]
        - [128, 128, 64, 8]
        - [128, 128, 64, 64]
        - [128, 128, 128, 8]
    - fields: [dtype]
      values: [bf16, fp16]
    - fields: [mask_type]
      values: [TOP_LEFT_CAUSAL, BOTTOM_RIGHT_CAUSAL]
  sweep_level: production
  space: slice
  free_fields: []
  spec_fields: [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_segments, num_seqs, use_decode_grid, kv_cache_policy, use_kv_lds_swizzle, use_wave_page_id_load, causal_top_left, right_bound, use_i64_kv_addr]
  # Frozen build cost: a registry that grows past this fails here, not at pack time.
  max_kernels: 116
  # The bf16 D256 decode cohort (rocKE's d256_decode route). That route is route-only and
  # builds the generic 3D spec with a segment count chosen per shape, which no single
  # binary can reproduce; this section pins the registry's own split-rule variant
  # (segauto) evaluated at the reference shape above, so each kernel's segment count is
  # what the rule picks for batch 1 at 4096 keys. The segment count (and the page-id
  # loader, which follows it) only splits the KV loop: any value computes the same output.
  also:
    - pin: {algorithm: unified_tuning, spec_id: gfx950_u3d_splitkv_segauto_t1xb}
      fixed: {arch: gfx950, kv_block_size: 16, batch: 1, seqlen_q: 1, seqlen_k: 4096}
      cells:
        - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
          values:
            - [256, 256, 8, 1]
            - [256, 256, 8, 8]
            - [256, 256, 16, 2]
            - [256, 256, 16, 4]
            - [256, 256, 16, 16]
            - [256, 256, 32, 4]
            - [256, 256, 32, 8]
            - [256, 256, 32, 32]
            - [256, 256, 64, 8]
        - fields: [dtype]
          values: [bf16]
        - fields: [mask_type]
          values: [TOP_LEFT_CAUSAL, BOTTOM_RIGHT_CAUSAL]
      free_fields: []
      spec_fields: [head_size, block_size, num_query_heads, num_kv_heads, dtype, use_sinks, sliding_window, has_softcap, num_segments, num_seqs, use_decode_grid, kv_cache_policy, use_kv_lds_swizzle, use_wave_page_id_load, causal_top_left, right_bound, use_i64_kv_addr]
      max_kernels: 18

reduction:
  fields:
    feature: [dtype, head_size, num_query_heads, num_kv_heads, mask_type, sliding_window, block_size, use_decode_grid]
    performance:
      - {name: num_segments}
      - {name: waves_per_eu}
    ignored: []
  aot_budget_per_arch: 400

ground_truth:
  graph_template: templates/attention_sdpa_fwd.graph.json
  value_map:
    dtype: {bf16: bfloat16, fp16: half}
    mask_type:
      TOP_LEFT_CAUSAL: {/nodes/sdpa_node/attributes/causal_mask: true}
      BOTTOM_RIGHT_CAUSAL: {/nodes/sdpa_node/attributes/causal_mask_bottom_right: true}

# Launch-surface audit (`tools/launch_surface.py --check <this file>`).
launch_surface:
  - name: grid
    python_source: kernels/common/attention_unified.py:_num_q_blocks
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified3DGeometry.hpp
    kmd_fields: [num_segments, num_kv_heads, num_query_heads, use_decode_grid]
    guard: >
      gfx950Unified3DLaunchGeometry() throws HipdnnPluginException for non-positive
      dimensions, a non-dividing GQA ratio or a group over 16. The segment grid is
      (batch, Hkv, num_segments) on the decode grid, the reduce grid (batch, Hq, 1); both
      CTAs are one wave64.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DGeometry.cpp

  - name: block
    python_source: dispatch/attention/common.py:launch_block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified3DGeometry.hpp
    kmd_fields: []
    guard: >
      64 threads for the segment and the reduce kernel alike (SEGMENT_THREADS and the
      reduce builder's THREADS).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DGeometry.cpp

  - name: workspace
    python_source: kernels/gfx950/attention_tiled_3d.py:build_unified_attention_reduce_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified3DGeometry.hpp
    kmd_fields: [block_size, num_segments, num_query_heads, head_size]
    guard: >
      gfx950Unified3DWorkspaceLayout() lays out the identity block_tables
      [B, Skv / block_size], seq_lens [B] and query_start_len [B + 1] (int32), then
      segm_output [B, Hq, num_segments, D] and segm_max / segm_expsum [B, Hq, num_segments]
      (f32), each section 256-byte aligned; it returns nullopt for a Skv that block_size
      does not divide.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DGeometry.cpp

  - name: matcher
    python_source: kernels/gfx950/attention_tiled_3d.py:supports_tiled_3d
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified3DNative.cpp
    kmd_fields: [dtype, head_size, num_query_heads, num_kv_heads, block_size, mask_type, sliding_window, num_segments, use_decode_grid]
    guard: >
      kernelMatches() returns false (no panic) if dtype, head_size, num_query_heads,
      num_kv_heads, mask_type or sliding_window disagrees with the graph, Skv is not a
      multiple of block_size, the candidate is not a decode-grid kernel or the graph's
      seqlen_q is not 1, or the candidate carries no companion. A NO_MASK graph is matched
      as mask_type 2 (bottom-right causal), which is the same computation at one query
      row. head_size 256 is bf16 only. score() ranks the fewest segments first.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DMatchers.cpp

  - name: kernargs
    python_source: kernels/gfx950/attention_tiled_3d.py:build_unified_attention_3d_tiled
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionUnified3DNative.cpp
    kmd_fields: [dtype]
    guard: >
      unified3DSegmentSignature() is the 19-argument segment form (12 pointers, 4 f32
      scalars, num_seqs, block_table_stride, qq_bias_stride_0) and unified3DReduceSignature()
      the 5-pointer reduce form. Each is validated at prepare() time against its own code
      object by buildIngestorKernelCode(..., expectedSignature); names are load-bearing.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionUnified3DSignature.cpp
