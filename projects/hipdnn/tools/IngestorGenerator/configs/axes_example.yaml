# Worked example: pack-level `axes`.
#
# `axes` declares a tuning sweep instead of enumerating it: at LOAD TIME the loader
# crosses every axis's value list against `kernel_template` into the same per-kernel dicts
# a hand-authored `kernels:` entry produces, so generator.py, the emitters and the dedup
# pass see ordinary enumerated kernels with `kernel_defaults` applying underneath.
#
# This file's two axes (2 values each) expand to 4 kernels. See
# `tests/test_config_loader.py::TestAxisExpansion` for the load-time contract:
# unique names, axis rejection against kmd_fields, and single-valued/empty-axis
# guards.

dialect: packaged
authored_subpath: rocKE/axes_example

engine:
  name: hipkernel:AxesExample
  sdk_version: "1.0.0"
  knobs: [block_n]
  heuristic: native

kmd_fields:
  - name: dtype
    type: string
  - name: seqlen_q
    type: int
    default_value: 256
  - name: block_n
    type: int
    default_value: 64
  - name: waves_per_eu
    type: int
    default_value: 2

graph_match:
  shape: shared_shape
  discriminator: none

kernel_source_kind: rocke
workspace_policy: none

packs:
  - name: axes_example
    arch: [gfx942]
    # Fields every expanded kernel shares -- merged in underneath the template
    # exactly as under a hand-authored kernel.
    kernel_defaults:
      kind: rocke
      source: kernels/gfx942/dense_example.py
      builder: build_dense_example
      spec:
        dtype: bf16

    # The tuning knobs to cross. Two axes x two values each = 4 kernels; a third
    # two-valued axis would make it 8 for one more YAML line.
    axes:
      block_n: [64, 32]
      waves_per_eu: [2, 4]

    # The one kernel that varies over the axes above. Each axis value is written into
    # both `kernel_source.spec` and `metadata` unless this template already states the
    # field, which is how a combination pins one axis value instead of varying it.
    kernel_template:
      name: dense_example
      kernel_source:
        spec:
          seqlen_q: 256
      metadata:
        dtype: BF16
        seqlen_q: 256

# What the COMPILER specialized on. Every field here is written into
# `kernel_source.spec` -- `dtype` by the pack defaults, `seqlen_q` by the template,
# `block_n` and `waves_per_eu` by the axes -- so all four are hydrated into the
# builder's spec dataclass and all four are bound to it.
specialization:
  metadata_fields: [dtype, seqlen_q, block_n, waves_per_eu]
  matcher_only_fields: []
  bindings:
    dtype: {field: dtype}
    seqlen_q: {field: seqlen_q}
    block_n: {field: block_n}
    waves_per_eu: {field: waves_per_eu}
  vocabulary:
    dtype: {bf16: BF16}
