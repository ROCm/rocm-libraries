# Profile: gfx950 dense flash-attention prefill
#
# Drives dispatch_parity.py, knob_sweep.py, verify_variant_sets.py and
# variant_reachability.py. Every tool reads the same file, so the kernel
# and the tooling cannot disagree.

arch: gfx950
slug: gfx950_attention_dense

provider_root: ../../../../../dnn-providers/hip-kernel-provider

# The reference candidate registry, used by reconcile_applicability.py.
reference_candidates:
  module: dispatch.attention
  function: attention_candidates
  match: algorithm
  family: attention_dense

# rocKE source module and builder function.
source: kernels/gfx950/attention_dense.py
builder: build_attention_dense

# The dispatcher factory that constructs the spec from a request.
dispatch:
  module: dispatch.attention.gfx950
  function: dense_spec_for_request

# The request class the factory takes.
request:
  module: dispatch.attention.common
  class: AttentionRequest
  defaults:
    arch: gfx950
    algorithm: attention_dense

# The eligibility predicate.
predicate:
  module: kernels.gfx950.attention_dense
  function: supports_attention_dense

# The spec class.
arch_spec:
  module: kernels.gfx950.attention_dense
  class: Gfx950AttentionDenseSpec

# Metadata fields the compiled binary specializes on.
# 10-field schema: block_n/waves_per_eu/persistent/num_persistent/wide_lds_dma
# no longer vary and are removed from the KMD.
metadata_fields:
  - dtype
  - head_size
  - num_query_heads
  - num_kv_heads
  - causal
  - ragged
  - sliding_window
  - batch
  - seqlen_q
  - seqlen_kv

# Vocabulary: map kernel dtype spelling to hipDNN matcher spelling.
vocabulary:
  dtype:
    bf16: BF16
    fp16: FP16

# Specialization contract.
specialization:
  metadata_fields:
    - dtype
    - head_size
    - num_query_heads
    - num_kv_heads
    - causal
    - ragged
    - sliding_window
    - batch
    - seqlen_q
    - seqlen_kv
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    num_query_heads:
      field: num_query_heads
    num_kv_heads:
      field: num_kv_heads
    causal:
      field: causal
    ragged:
      field: ragged
    sliding_window:
      field: sliding_window
    batch:
      field: batch
    seqlen_q:
      field: seqlen_q
    seqlen_kv:
      field: seqlen_kv

# Emitted config skeleton.
dialect: packaged
authored_subpath: rocKE/gfx950_attention_dense

engine:
  name: "hipkernel:Gfx950AttentionDense"
  sdk_version: "1.0.0"
  knobs:
    - head_size
    - num_query_heads
    - num_kv_heads
    - causal
  heuristic: native

kmd_fields:
  - name: dtype
    type: string
  - name: head_size
    type: int
    default_value: 128
  - name: num_query_heads
    type: int
    default_value: 8
  - name: num_kv_heads
    type: int
    default_value: 8
  - name: causal
    type: int
    default_value: 1
  - name: ragged
    type: int
    default_value: 0
  - name: sliding_window
    type: int
    default_value: 0
  - name: batch
    type: int
    default_value: 1
  - name: seqlen_q
    type: int
    default_value: 512
  - name: seqlen_kv
    type: int
    default_value: 512

kernel_source_kind: rocke
workspace_policy: none
delegates_to_existing_plan: false

# Knob sweep declarations.
#
# All tuning knobs are settled; none remain as candidates.
sweep:
  lds_k_group_pad:
    verdict: >
      Settled at 8. Sweep {0,8,16,24,32} at D=64: 8 and 16 tied at the
      4-deep bank-conflict floor; 0 and 32 were measurably worse. Commit a2cb8ab.
  lds_v_row_pad:
    verdict: >
      Settled at 32. Sweep {0,8,16,32}: 32 eliminates all bank conflicts for
      the D=128 transposed PV accumulation slab. Commit 88b8bc5.
  block_m:
    verdict: >
      Settled at 256. Dispatcher sets _DENSE_GEOMETRY="default" which maps to
      block_m=256. Both 128 and 256 are legal; 256 is the measured-optimal
      value for prefill-length sequences.

graph_match:
  shape: shared_shape
  discriminator: none

# Launch-surface audit: every quantity the C++ engine restates from the Python
# launch path, per surface. See tools/launch_surface.py for the schema and checks.
#
# Four surfaces for this kernel:
#   grid     -- attention_dense_grid, single non-persistent arm (ceil(Sq/256), Hq, B)
#   block    -- attention_dense_block, constant 512 threads for every shipped variant
#   matcher  -- build_attention_dense field comparisons in kernelMatches()
#   kernargs -- attentionDenseKernelSignature, always 8-arg (q,k,v,o,scale,B,Sq,Skv)
#
# No sliding_window or dtype surface: neither controls the grid, block or ABI.
launch_surface:
  - name: grid
    python_source: kernels/gfx950/attention_dense.py:attention_dense_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseGeometry.hpp
    kmd_fields: [seqlen_q, num_query_heads, batch]
    guard: >
      gfx950AttentionDenseGeometry() throws HipdnnPluginException for
      non-positive dimensions (seqlen_q, num_query_heads or batch <= 0).
      Grid is (ceil(Sq/256), Hq, B) for aligned, ragged, and SWA alike.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDensePacks.cpp

  - name: block
    python_source: kernels/gfx950/attention_dense.py:attention_dense_block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseGeometry.hpp
    kmd_fields: []
    guard: >
      Constant 512 threads (GFX950_ATTENTION_DENSE_BLOCK_M=256 /
      GFX950_ROWS_PER_WAVE=32 * GFX950_WAVE_LANES=64). No KMD field
      controls the block; the value is the same for every shipped variant.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDensePacks.cpp

  - name: matcher
    python_source: kernels/gfx950/attention_dense.py:build_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseNative.cpp
    kmd_fields: [dtype, head_size, num_query_heads, num_kv_heads, causal, sliding_window, ragged, seqlen_q, seqlen_kv, batch]
    guard: >
      kernelMatches() returns false (no panic) if any field disagrees.
      shape_generic = (ragged==0): B/Sq/Skv equality skipped for aligned and SWA;
      enforced for tail (ragged==1). score() returns constant 1.0.
      block_n is fixed at 64 (not a KMD field); tile divisibility uses
      GFX950_ATTENTION_DENSE_BLOCK_N constant directly.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDenseMatchers.cpp

  - name: kernargs
    python_source: kernels/gfx950/attention_dense.py:build_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseNative.cpp
    kmd_fields: [ragged, seqlen_q, num_query_heads, batch]
    guard: >
      attentionDenseKernelSignature() always returns the 8-arg form
      (q,k,v,o,scale,batch,seqlen_q,seqlen_kv). All 150 variants are
      non-persistent. use_sinks=False; no sink_ptr slot. Validated at
      prepare() time by buildIngestorKernelCode(..., expectedSignature).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDensePacks.cpp
