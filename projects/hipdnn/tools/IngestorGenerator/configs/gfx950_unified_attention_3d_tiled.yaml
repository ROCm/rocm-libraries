# rocKE split-KV 3D tiled attention (gfx950) + its paired reduce kernel, packaged.
#
# Two builders cooperate: build_unified_attention_3d_tiled (per-segment partial
# softmax state into a workspace) and build_unified_attention_reduce_tiled
# (combines segments into the final output). They are NOT independent operations --
# every shipped (dtype, head_size, GQA-ratio, block_size, num_segments) capability
# point ships as a PAIR of kernels distinguished by the KMD field `role`
# ("segment"/"reduce"), sharing every other metadata value. See
# rocke/library/kernels/gfx950/mining.md Sec 6 for why this shape was chosen over
# the alternatives (a single kernel entry cannot represent two code objects; two
# independent packs would lose the invariant that score() sees one candidate and
# cannot see its silently-required reduce partner).
#
# This kernel ALWAYS reads K/V through a page table (paged_kv_desc with an
# indirect() block-table lookup) -- there is no dense-K/V path in the source at
# all. graph_match therefore requires page_table_k_tensor_uid AND
# page_table_v_tensor_uid on the graph; a dense-KV SDPA graph is out of scope for
# this engine and must be declined, not silently misread as paged.
#
# block_size is the exposed knob (rocke-mining.md's KNOB-SEL note is UNSURE on a
# strict seqlen_kv%block_size relationship, but it is treated as a tuning knob per
# the Step 3 batch answer, step3_batch.md). num_segments is a KMD field only, never
# a knob: it is a launch-geometry constant baked into a specific compiled
# segment/reduce PAIR, not something a caller can pick independently.
#
# use_sinks, use_alibi, sliding_window, use_qq_bias, has_softcap are OFF in every
# shipped variant -- see step3_batch.md item 7 for why each is declined for this
# first integration (two are unrepresentable in the SDPA graph schema at all;
# the others are declined as a stated scope limit, not silently unserved).
#
dialect: packaged
authored_subpath: rocKE/gfx950_unified_attention_3d_tiled
engine:
  name: hipkernel:UnifiedAttention3DTiled
  sdk_version: 1.0.0
  knobs:
  - block_size
  heuristic: native
kmd_fields:
- name: role
  type: string
- name: dtype
  type: string
- name: head_size
  type: int
- name: num_query_heads
  type: int
- name: num_kv_heads
  type: int
- name: block_size
  type: int
  default_value: 0
- name: num_segments
  type: int
graph_match:
  shape: shared_shape
  discriminator: none
kernel_source_kind: rocke
workspace_policy: derived
delegates_to_existing_plan: false
