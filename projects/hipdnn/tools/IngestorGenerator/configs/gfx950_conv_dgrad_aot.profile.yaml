vocabulary:
  dtype: {fp16: fp16, bf16: bf16}
  layout: {NHWC: NHWC}
  pipeline: {mem: mem, compv3: compv3, compv4: compv4, direct: direct}
  epilogue: {cshuffle: cshuffle, default: default, direct: direct}
  direct_variant: {none: none, depthwise_dgrad: depthwise_dgrad, depthwise_dgrad_win: depthwise_dgrad_win, grouped_dgrad_fused: grouped_dgrad_fused, grouped_dgrad_4c: grouped_dgrad_4c, grouped_dgrad_mfma: grouped_dgrad_mfma, dgrad_mfma_rtc: dgrad_mfma_rtc, transpose: transpose, reorganize: reorganize, transpose_rtc: transpose_rtc, reorganize_rtc: reorganize_rtc}

# The cpp_mirror names below are the native pack's: packs/Gfx950ConvDgradNative.cpp and
# packs/Gfx950ConvDgradGeometry.hpp. Both sides build one launch plan per (instance,
# problem) -- the ordered kernel steps with their grids, buffers, scalar values and
# sub-GEMM tables, the workspace regions and the dX zero-fill -- and serialize it the same
# way (Gfx950ConvDgradPlan.serialize / serializePlan). The golden vectors of
# make_conv_dgrad_aot_test_vectors.py pin the C++ plan digest of every catalog instance on
# every problem of the vector set to the Python plan.
launch_surface:
  - name: instance_contract
    python_source: builders/common/convolution_backward_data.py:supports_gfx950_conv_dgrad_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:parseAotInstance
    kmd_fields: [dtype, layout, kernel_family, direct_variant, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue, vector_size_a, vector_size_b, vector_size_c, lds_k_outer, max_sub_gemms, grouped, dy_halo, halo_max_wo, patch, tap_outer_k, uniform_k_decode, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, cpg, kpg, instance_id]
    guard: parseAotInstance reads kernel_family first. Implicit GEMM (0) needs NHWC, wave64, an mem/compv3/compv4 pipeline, a default or cshuffle epilogue, positive tile/warp fields, widths in {1,2,4,8} and 0/1 flags; its filter/stride/dilation are baked when non-zero. Direct (1) and helper (2) instances need the direct placeholders, a variant of their family, the baked geometry and the knobs their variant uses (directVariantUses). Missing or malformed fields refuse the kernel; the kernel matcher never admits a helper.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: launch_plan
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_plan
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:instancePlan
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n, tile_k, vector_size_a, vector_size_b, vector_size_c, grouped, max_sub_gemms, dy_halo, halo_max_wo, patch, tap_outer_k, uniform_k_decode, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, cpg, kpg]
    guard: The instance serves the problem exactly when a plan exists. Implicit GEMM follows rocKE's KernelCache.supports_problem and the benchmark launch (width fold, batch chunks over 2^31-byte images, patch sub-GEMMs, the dY halo's Wo bound, tile grid within one dispatch) and zero-fills dX only when the sub-GEMMs leave part of it unwritten. Direct kernels follow direct_kernel_sweep.plan_for (capability equality, MFMA knob fit, block groups, LDS budget, persistent cells, transposed-problem fwd launches). library/tests/test_convolution_backward_data_aot_packaging.py checks the plan against rocKE's own offer and launch values.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: kernargs_and_execution
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_step_signature
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:stepSignature
    kmd_fields: [dtype, kernel_family, direct_variant]
    guard: One kernarg signature per step ABI -- the implicit GEMM ABI (sub-GEMM table pointer, then its scalar values), the direct dgrad ABI, the forward direct ABI on the transposed problem, and the transpose/reorganize helpers (static and runtime-C). The GPU suite poisons dX and compares every catalog instance with the CPU reference.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvDgrad.cpp
  - name: sub_gemm_table
    python_source: kernels/common/conv_implicit_gemm_dgrad.py:pack_sub_gemm_buffer
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:packSubGemmBuffer
    kmd_fields: [tile_m, tile_n, tile_k, patch]
    guard: 22 i32 per non-empty tilde (or patch) sub-GEMM record, then 8 i32 of (mult, shift) magic pairs per record; a non-positive divisor or an overflow refuses. Each implicit step carries its table and its offset in the SUB_GEMM workspace region; launch uploads it before the step.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: helpers
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_helper_fields
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:aotKernelPlan
    kmd_fields: [kernel_family, direct_variant, dtype, filter_h, cpg, kpg, fold_k32]
    guard: MFMA plans name transpose/reorganize helper steps (static or runtime-C); the native pack resolves each in the same kpack by kernel_family 2 and its helper fields. A missing helper refuses the instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: fallback_selection
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_runtime_candidates
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:planScore
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n]
    guard: Unbenchmarked order only, until a trained ranker ships. Single-kernel direct plans rank first, then MFMA, then implicit GEMM by tile fill; BenchmarkPlan replaces it with measurements of every serving instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: workspace
    python_source: builders/common/convolution_backward_data.py:Gfx950ConvDgradPlan
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:workspaceBytes
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n, tile_k, fold_k32, waves_k, runtime_k_loop]
    guard: The plan's workspace regions (SUB_GEMM tables, WS_T, WS_COA), each 256-byte aligned. Every kernel uses static LDS only; prepare requests zero dynamic shared memory.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvDgrad.cpp
