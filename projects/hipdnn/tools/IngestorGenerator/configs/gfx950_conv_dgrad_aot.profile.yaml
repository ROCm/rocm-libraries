#
# Tool profile for hipkernel:Gfx950ConvDgradAot, the shape-generic AOT-instance
# backward-data (dgrad) engine. The bundle and its generator config come from
# tools/make_conv_dgrad_aot_config.py over the lists of
# tools/enumerate_conv_dgrad_aot_instances.py; the rocKE adapter is
# builders/common/convolution_backward_data.py.

slug: gfx950_conv_dgrad_aot
bundle: gfx950_conv_dgrad_aot
pack: gfx950_conv_dgrad_aot
arch: gfx950
provider_root: dnn-providers/hip-kernel-provider
dialect: packaged
authored_subpath: rocKE/gfx950_conv_dgrad_aot
source: builders/common/convolution_backward_data.py
builder: build_gfx950_conv_dgrad_aot
kernel_source_kind: rocke
workspace_policy: derived
delegates_to_existing_plan: false

engine:
  name: hipkernel:Gfx950ConvDgradAot
  sdk_version: "1.0.0"
  # make_conv_dgrad_aot_config.ENGINE_KNOBS
  knobs:
    - kernel_family
    - direct_variant
    - tile_m
    - tile_n
    - tile_k
    - warp_m
    - warp_n
    - warp_tile_m
    - warp_tile_n
    - warp_tile_k
    - pipeline
    - epilogue
    - vector_size_a
    - vector_size_b
    - vector_size_c
    - lds_k_outer
    - block_w
    - block_waves
    - block_h
    - block_q
    - block_groups
    - fold_k32
    - waves_k
    - waves_q
    - persistent_grid
    - runtime_k_loop
  heuristic: native

# Instances are matched per problem by capability, so "dispatch" resolves the dgrad
# problem the engine would match (Hi/Wi are the dX extents), and the predicate is its
# graph contract. dispatch_parity.py uses these blocks to resolve requests only; the
# generator config comes from make_conv_dgrad_aot_config.py.
request:
  module: dispatch.grouped_convolution
  class: ConvGroupedRequest
  defaults:
    direction: dgrad
    layout: NHWC
    G: 1
    algorithm: implicit_gemm_dgrad
dispatch:
  module: builders.common.convolution_backward_data
  function: gfx950_conv_dgrad_aot_problem_for_request
predicate:
  module: builders.common.convolution_backward_data
  function: supports_gfx950_conv_dgrad_aot_problem
arch_spec:
  module: builders.common.convolution_backward_data
  class: Gfx950ConvDgradProblem

kmd_fields:
  - {name: dtype, type: string}
  - {name: tile_m, type: int}
  - {name: tile_n, type: int}
  - {name: tile_k, type: int}
  - {name: warp_m, type: int}
  - {name: warp_n, type: int}
  - {name: warp_tile_m, type: int}
  - {name: warp_tile_n, type: int}
  - {name: warp_tile_k, type: int}
  - {name: wave_size, type: int}
  - {name: pipeline, type: string}
  - {name: epilogue, type: string}
  - {name: vector_size_a, type: int}
  - {name: vector_size_b, type: int}
  - {name: vector_size_c, type: int}
  - {name: lds_k_outer, type: int}
  - {name: max_sub_gemms, type: int}
  - {name: grouped, type: int}
  - {name: instance_id, type: string}
  - {name: layout, type: string}
  # Direct and helper instances; implicit-GEMM descriptors leave them to the builder default.
  - {name: kernel_family, type: int, default_value: 0, builder_default: true}
  - {name: direct_variant, type: string, default_value: none, builder_default: true}
  - {name: filter_h, type: int, default_value: 0, builder_default: true}
  - {name: filter_w, type: int, default_value: 0, builder_default: true}
  - {name: stride_h, type: int, default_value: 0, builder_default: true}
  - {name: stride_w, type: int, default_value: 0, builder_default: true}
  - {name: pad_h, type: int, default_value: 0, builder_default: true}
  - {name: pad_w, type: int, default_value: 0, builder_default: true}
  - {name: dilation_h, type: int, default_value: 0, builder_default: true}
  - {name: dilation_w, type: int, default_value: 0, builder_default: true}
  - {name: cpg, type: int, default_value: 0, builder_default: true}
  - {name: kpg, type: int, default_value: 0, builder_default: true}
  - {name: block_w, type: int, default_value: 0, builder_default: true}
  - {name: block_waves, type: int, default_value: 0, builder_default: true}
  - {name: block_h, type: int, default_value: 0, builder_default: true}
  - {name: block_q, type: int, default_value: 0, builder_default: true}
  - {name: block_groups, type: int, default_value: 0, builder_default: true}
  - {name: fold_k32, type: int, default_value: 0, builder_default: true}
  - {name: waves_k, type: int, default_value: 0, builder_default: true}
  - {name: waves_q, type: int, default_value: 0, builder_default: true}
  - {name: persistent_grid, type: int, default_value: 0, builder_default: true}
  - {name: runtime_k_loop, type: int, default_value: 0, builder_default: true}

vocabulary:
  dtype: {fp16: fp16, bf16: bf16}
  layout: {NHWC: NHWC}
  pipeline: {mem: mem, compv3: compv3, compv4: compv4, direct: direct}
  epilogue: {cshuffle: cshuffle, default: default, direct: direct}
  direct_variant: {none: none, depthwise_dgrad: depthwise_dgrad, grouped_dgrad_mfma: grouped_dgrad_mfma, transpose: transpose, reorganize: reorganize}

# The cpp_mirror names below are the native pack's: packs/Gfx950ConvDgradNative.cpp and
# packs/Gfx950ConvDgradGeometry.hpp.
launch_surface:
  - name: instance_contract
    python_source: builders/common/convolution_backward_data.py:supports_gfx950_conv_dgrad_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:aotInstance
    kmd_fields: [dtype, layout, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue, vector_size_a, vector_size_b, vector_size_c, lds_k_outer, max_sub_gemms, grouped, instance_id]
    guard: aotInstance admits only a kpack kernel with NHWC layout, wave64, an mem/compv3/compv4 pipeline, a default or cshuffle epilogue, positive tile/warp fields, widths in {1,2,4,8}, 0/1 lds_k_outer and grouped, and a positive max_sub_gemms; any missing or malformed field refuses the kernel.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: served_problems
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:implicitInstanceLaunch
    kmd_fields: [vector_size_a, vector_size_b, vector_size_c, grouped, max_sub_gemms, tile_m, tile_n, tile_k, warp_m, warp_n]
    guard: The dgrad subset of rocKE's KernelCache.supports_problem. The A (dY) width divides K/groups, the B (W) and D (dX) widths divide C/groups, a grouped graph needs a grouped binary, depthwise (groups > 1, C/groups == 1) is refused, the non-empty tilde sub-GEMM count is at most max_sub_gemms, groups fits grid y, the flat tile grid fits one dispatch and N*Hi*Wi stays below 2^31; a sub-GEMM table packing failure refuses. library/tests/test_convolution_backward_data_aot_packaging.py checks the Python predicate against supports_problem.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: direct_instance_contract
    python_source: builders/common/convolution_backward_data.py:supports_gfx950_conv_dgrad_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:aotInstance
    kmd_fields: [kernel_family, direct_variant, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, cpg, kpg, block_w, block_waves, block_h, block_q, block_groups, fold_k32, waves_k, waves_q, persistent_grid, runtime_k_loop]
    guard: aotInstance reads kernel_family first. A direct (1) or helper (2) instance must hold the direct identity's placeholders (0 tuning, vector, lds_k_outer, max_sub_gemms and grouped; "direct" pipeline and epilogue), a variant of its family, a square undilated filter, and leave the knobs its variant does not use at 0; the kernel matcher never admits a helper. Unknown families or variants and missing fields refuse the kernel.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: direct_served_problems
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:directInstanceLaunch
    kmd_fields: [direct_variant, filter_h, filter_w, stride_h, stride_w, pad_h, pad_w, dilation_h, dilation_w, cpg, kpg, block_w, block_waves, block_h, block_q, block_groups, fold_k32, waves_k, waves_q]
    guard: Exact capability equality (filter, one stride, one padding, dilation 1, C/groups and K/groups), then for MFMA _mfma_knobs_reason and groups % block_groups == 0, then every launch fits (grid y/z 65535, the MFMA compute grid's x too, the transforms' x a 32-bit dispatch, each workspace a 32-bit size). library/tests/test_convolution_backward_data_aot_packaging.py checks it against supports_problem plus plan_for's re-validation.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: kernargs_and_execution
    python_source: kernels/common/conv_abi.py:conv_arg_names
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:implicitGemmKernargs
    kmd_fields: [dtype, tile_m, tile_n, tile_k]
    guard: The 44-argument dgrad AOT ABI (sub_gemm_buf a device pointer at position 43, num_sub_gemms last) computed from the graph, with num_pid_m/num_pid_n from the instance's own tile; the 20-argument direct dgrad ABI for depthwise; the forward direct ABI on the transposed problem for the MFMA compute pass. Strided implicit GEMM zero-fills dX first. The GPU suite poisons dX and compares every family with the CPU reference.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvDgrad.cpp
  - name: sub_gemm_table
    python_source: kernels/common/conv_implicit_gemm_dgrad.py:pack_sub_gemm_buffer
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:packSubGemmBuffer
    kmd_fields: [tile_m, tile_n, tile_k]
    guard: 22 i32 per non-empty tilde sub-GEMM record (fields 1 and 2 the instance's tile counts), then 8 i32 of (mult, shift) magic pairs per record for kpg, x_dot_slice, h_tilde_slice*w_tilde_slice and w_tilde_slice; a non-positive divisor or an overflow refuses. The unit test compares it with golden vectors from sub_gemm_buffer_for.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: mfma_pipeline
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_mfma_plan
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:mfmaLaunchPlan
    kmd_fields: [cpg, kpg, filter_h, filter_w, block_h, block_q, block_groups, fold_k32, waves_k, waves_q, runtime_k_loop, persistent_grid]
    guard: direct_kernel_sweep.plan_for's steps. Transpose (W -> ws_t), reorganize (ws_t -> ws_coa) when waves_k > 1 or runtime_k_loop, then the compute kernel on (dY, ws, dX); the helpers are found in the same kpack by kernel_family 2, direct_variant, dtype, filter, cpg, kpg and fold_k32. A missing helper refuses the instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradGeometry.cpp
  - name: fallback_selection
    python_source: builders/common/convolution_backward_data.py:gfx950_conv_dgrad_aot_serves
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradGeometry.hpp:aotInstanceScore
    kmd_fields: [tile_m, tile_n, vector_size_a, vector_size_b, vector_size_c]
    guard: Unbenchmarked order only, until a trained ranker ships. Less tile padding and a fuller grid rank higher, with wider vectors breaking ties; BenchmarkPlan replaces it with measurements of every serving instance.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950ConvDgradMatchers.cpp
  - name: workspace
    python_source: builders/common/convolution_backward_data.py:build_gfx950_conv_dgrad_aot
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950ConvDgradNative.cpp:workspaceBytes
    kmd_fields: [kernel_family, direct_variant, tile_m, tile_n, tile_k, fold_k32, waves_k, runtime_k_loop]
    guard: Implicit GEMM takes (22+8)*num_sub_gemms*4 bytes for the record table, uploaded in launch; MFMA takes ws_t plus ws_coa (at ws_t rounded up to 256) when it reorganizes; depthwise takes none. Every kernel uses static LDS only; prepare requests zero dynamic shared memory.
    test: dnn-providers/hip-kernel-provider/src/integration_tests/kernel_ingestor_engine/IntegrationGpuGfx950ConvDgrad.cpp
