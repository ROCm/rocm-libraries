# Source of truth for the shipped hipkernel:hip_conv_fwd_bias_dw3d_rdna catalog: a depthwise
# 3-D forward convolution (groups == C, K a multiple of C) followed by a per-output-channel bias
# ADD, for the gfx11 (RDNA3/3.5) and gfx12 (RDNA4) targets. It is the depthwise 3-D kernel of
# hipkernel:hip_conv_fwd_dw3d_rdna (../conv_dw3d_rdna/kernels/ConvFwdDepthwise3d.cpp, shared
# with that bundle) built with its bias epilogue (DW_HAS_BIAS), with the same variants.
#
# The native matcher (HipConvFwdBiasDw3dRdnaNative.cpp) admits a conv_fprop node whose virtual
# output feeds a pointwise ADD with a bias of one value per output channel. It picks the variant
# as the unfused engine does (ConvRdnaDw3d.cpp, geometryOf), so each graph has one candidate; the
# tile rules here must match it.

dialect: packaged
authored_subpath: hip/conv_bias_dw3d_rdna
engine:
  name: hipkernel:hip_conv_fwd_bias_dw3d_rdna
  sdk_version: "1.0.0"
  knobs: []
  heuristic: native

kmd_fields:
- name: kernel_family
  type: string
- name: variant
  type: string
- name: dtype
  type: string
- name: layout
  type: string
- name: filter_d
  type: int
- name: filter_h
  type: int
- name: filter_w
  type: int
- name: stride_h
  type: int
- name: stride_w
  type: int
- name: tile_d
