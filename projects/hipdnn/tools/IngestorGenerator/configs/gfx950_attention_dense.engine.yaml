# Engine manifest for hipkernel:Gfx950AttentionDense.
#
# Everything about the engine that rocKE does not know: identity, KMD schema,
# metadata mapping, the registry space its kernels are drawn from, and how that
# space is reduced. The shipped kernel set is configs/gfx950_attention_dense.yaml;
# tests/test_registry_regeneration.py gates it against this manifest.
#
#     python tools/registry_enumerator.py --manifest configs/gfx950_attention_dense.engine.yaml --out <scratch>/config.yaml
#
# The generated packs/Gfx950AttentionDenseNative.cpp and
# tests/TestGfx950AttentionDenseMatchers.cpp are stubs; the provider's copies are
# hand-maintained and must not be overwritten.

dialect: packaged
authored_subpath: rocKE/gfx950_attention_dense
engine:
  name: hipkernel:Gfx950AttentionDense
  census_name_symbol: GFX950_ATTENTION_DENSE_ENGINE_NAME
  sdk_version: 1.0.0
  behavior_notes:
  - supports_graph_capture
  knobs:
  - block_m
  - block_n
  heuristic: native
  # Trained sort_kernel_catalog models (tflops, time) for gfx950, beside the native
  # default, and the catalog they were trained on; retrain when it changes
  # (tests/test_trained_rankers.py, README "Shipping a trained model").
  heuristics:
    sort_kernel_catalog:
      gfx950:
      - df4ca2de-53c4-44d4-b92c-ead86e287fa5
      - 6f606e00-09cf-4e43-968b-77eb71de64db
  trained_catalog_sha256:
    gfx950: 85faef422144bc770fb095b624b26732de9361b2ebce25d29d32cc08a3bfe513
kmd_fields:
- name: dtype
  type: string
- name: head_size
  type: int
  default_value: 128
# No head-count fields: the kernel reads num_query_heads / num_kv_heads as
# kernargs taken from the graph, so one kernel serves every head configuration.
- name: causal
  type: int
  default_value: 1
- name: ragged
  type: int
  default_value: 0
- name: sliding_window
  type: int
  default_value: 0
- name: batch
  type: int
  default_value: 1
- name: seqlen_q
  type: int
  default_value: 512
- name: seqlen_kv
  type: int
  default_value: 512
# Tile metadata, also public engine knobs. A record omitting either field still
# completes to 256/64 through these defaults, which is only a completion rule.
# It is no longer what cold selection picks: preferredTile() in
# Gfx950AttentionDenseNative.cpp reads head size, mask and seqlen_q, so the
# no-knob winner varies by shape.
- name: block_m
  type: int
  default_value: 256
- name: block_n
  type: int
  default_value: 64
specialization:
  metadata_fields:
  - dtype
  - head_size
  - causal
  - ragged
  - sliding_window
  - batch
  - seqlen_q
  - seqlen_kv
  - block_m
  - block_n
  matcher_only_fields: []
  vocabulary:
    dtype:
      bf16: BF16
      fp16: FP16
  bindings:
    dtype:
      field: dtype
    head_size:
      field: head_size
    causal:
      field: causal
    ragged:
      field: ragged
    sliding_window:
      field: sliding_window
    batch:
      field: batch
    seqlen_q:
      field: seqlen_q
    seqlen_kv:
      field: seqlen_kv
    block_m:
      field: block_m
    block_n:
      field: block_n
kernel_source_kind: rocke
workspace_policy: none

pack: gfx950_attention_dense
arch: gfx950
provider_root: dnn-providers/hip-kernel-provider
source: kernels/gfx950/attention_dense.py
builder: build_attention_dense
kernel_name_template: attention_dense.{dtype}_d{head_size}_c{causal}_bm{block_m}_bn{block_n}.gfx950

# The registry space the selection is drawn from (see registry_enumerator.py).
# `space: full`, so every varying registry field is accounted for: projected into the
# catalog, or named in `hold_fields` below and held at the cell default. One that is
# neither is held with a WARN, which is how a knob added upstream becomes visible rather
# than silently dropped (what `space: slice` did).
enumerate:
  candidates: dispatch.attention:attention_candidates
  request: dispatch.attention.common:AttentionRequest
  # Selects the one non-persistent grid candidate.
  pin: {algorithm: attention_dense_grid, spec_id: gfx950_dense_qbminor}
  # Request fields every cell shares.
  fixed: {arch: gfx950, batch: 1, seqlen_q: 512, seqlen_k: 512}
  # Crossed in order, first group outermost (the catalog order). One row per head
  # size: the kernel takes the head counts as runtime kernargs, so 8/8 is only the
  # canonical spec value (the spec still carries the fields; hkp_pack hydrates
  # Spec(**fields)) and one kernel serves every head configuration.
  cells:
    - fields: [hdim_q, hdim_v, nhead_q, nhead_k]
      values:
        - [64, 64, 8, 8]
        - [128, 128, 8, 8]
    - fields: [dtype]
      values: [bf16, fp16]
    - fields: [mask_type]
      values: [TOP_LEFT_CAUSAL, NO_MASK]
  sweep_level: production
  space: full
  # The tile is the only thing this catalog varies, so every other performance knob is
  # held at the cell's default spec by name. Holding is a decision, not an omission:
  # check_hold_fields refuses a name the registry spec does not have, so a knob renamed
  # upstream fails the build instead of quietly reverting to a default.
  #
  # Keep this list and reduction.fields.performance consistent by hand, and know what
  # does NOT catch a mistake. A knob added there and forgotten here is projected, which
  # widens the catalog, and the enumerator applies max_kernels only when `space` is not
  # full (registry_enumerator.py, `if not full and limit is not None`). So nothing
  # refuses the growth until it passes aot_budget_per_arch, which warns rather than
  # fails. What does catch it is regenerating: the new kernels have to be committed,
  # and the g2/g3 gates compare the shipped catalog against the enumeration.
  hold_fields: [waves_per_eu, lazy_rescale, lds_k_group_pad, lds_v_row_pad, lds_k_row_pad,
                lazy_rescale_threshold, use_exp2_fast, exp_per_pv_step,
                partial_vmcnt_prefetch, pv_priority, pv_sched_fence,
                pv_sched_group_template, iglp_mode, pv_sched_fence_mask,
                pv_sched_group_ds_read, pv_loop_order, causal_diag_split, o_store_width]
  # Fields of the registry spec every generated kernel carries. The registry spec is
  # wider, and the rest sit at their dataclass defaults. The shipped KDP omits
  # lds_k_row_pad, which hold_fields above keeps at its default.
  # The catalog is aligned-only, so a ragged spec is not reachable: `ragged` is a
  # reduction.fields.feature field, and `space: full` keeps only specs matching the
  # cell default on those. tests/test_registry_regeneration.py asserts the defaults
  # (g1) and diffs the enumeration against the shipped catalog on the shipped fields
  # (g3, a subset check under `space: full`).
  spec_fields: [dtype, head_size, num_query_heads, num_kv_heads, causal, batch, seqlen_q, seqlen_kv, sliding_window, ragged, varlen, paged, persistent, block_m, block_n, waves_per_eu, lds_k_group_pad, lds_v_row_pad, lds_k_row_pad, lazy_rescale, wide_lds_dma, interleave, persist_decode, nonpersist_decode, num_persistent, block_size, num_kv_blocks, use_sinks]
  # Frozen build cost. NOT enforced under `space: full`, which the enumerator skips this
  # check for; it is kept as the declared intent and as the gate if this ever returns to
  # `space: slice`. The ceiling that applies is reduction.aot_budget_per_arch.
  max_kernels: 52

# How the variant space is reduced; copied verbatim into the generated config.
# Feature fields define a cell; performance knobs are the tuning arms, in priority order.
reduction:
  fields:
    feature: [dtype, head_size, causal, sliding_window, ragged, batch, seqlen_q, seqlen_kv]
    performance:
      - {name: block_m, divides: seqlen_q}
      - {name: block_n, divides: seqlen_kv}
      - {name: waves_per_eu}
      - {name: lazy_rescale}
      - {name: lds_k_group_pad}
      - {name: lds_v_row_pad}
      - {name: lds_k_row_pad}
      - {name: lazy_rescale_threshold}
      - {name: use_exp2_fast}
      - {name: exp_per_pv_step, unset_resolves_by: resolved_exp_per_pv_step}
      - {name: partial_vmcnt_prefetch}
      - {name: pv_priority}
      - {name: pv_sched_fence, unset_resolves_by: resolved_pv_sched_fence}
      - {name: pv_sched_group_template, unset_resolves_by: resolved_pv_sched_group_template}
      - {name: iglp_mode, unset_resolves_by: resolved_iglp_mode}
      - {name: pv_sched_fence_mask}
      - {name: pv_sched_group_ds_read}
      - {name: pv_loop_order, unset_resolves_by: resolved_pv_loop_order}
      - {name: causal_diag_split}
      - {name: o_store_width}
    # Never a kernel axis for this engine, as opposed to hold_fields' "this section
    # holds it": kv_segments is a split-KV build axis the dispatcher owns, and the
    # matcher serves a single segment only (ServesOnlyASingleKvSegment). It varies over
    # {1, 2, 4, 8} in the registry, so `space: full` reports it unclassified until it is
    # named here.
    ignored: [kv_segments]
  aot_budget_per_arch: 1000

# How owner benchmark rows become hipDNN graphs (tools/ground_truth.py graphs).
# `${<request field>}` fills a scalar; `value_map` translates a request value to that
# scalar or to patches; an unlisted value fails the row. A patch is a JSON pointer whose
# list segments are preferably element `name`s (`/nodes/sdpa_node/...`), which survive a
# template reordering; an index (`/nodes/0/...`) is still accepted.
# A tensor's `"strides": "packed"` packs its axes outermost-first in `stride_order` (BSHD here).
ground_truth:
  graph_template: templates/attention_sdpa_fwd.graph.json
  value_map:
    dtype: {bf16: bfloat16, fp16: half}
    mask_type:
      TOP_LEFT_CAUSAL: {/nodes/sdpa_node/attributes/causal_mask: true}
      NO_MASK: {/nodes/sdpa_node/attributes/causal_mask: false}

# Launch-surface audit (`tools/launch_surface.py --check <this file>`).
launch_surface:
  - name: grid
    python_source: kernels/gfx950/attention_dense.py:attention_dense_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseGeometry.hpp
    kmd_fields: [block_m, seqlen_q, batch]
    guard: >
      gfx950AttentionDenseGeometry() throws HipdnnPluginException for
      non-positive dimensions (seqlen_q, num_query_heads or batch <= 0).
      Grid is (ceil(Sq/block_m), Hq, B) from the candidate's own block_m; Hq is
      the graph's query head count (no head field in the metadata).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestAttentionDenseGeometry.cpp

  - name: block
    python_source: kernels/gfx950/attention_dense.py:attention_dense_block
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseGeometry.hpp
    kmd_fields: [block_m]
    guard: >
      block_m / GFX950_ROWS_PER_WAVE(32) * GFX950_WAVE_LANES(64) threads:
      256 for block_m=128, 512 for block_m=256.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestAttentionDenseGeometry.cpp

  # The tile-legality and static-LDS rules are restated by hand from the rocKE Python.
  # Matching and dispatch are shared with gfx942 (AttentionDenseNative.cpp);
  # Gfx950AttentionDenseNative.cpp binds them to the gfx950 tile and geometry hooks.
  - name: matcher
    python_source: kernels/gfx950/attention_dense.py:build_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/AttentionDenseNative.cpp
    kmd_fields: [dtype, head_size, causal, sliding_window, ragged, block_m, block_n]
    guard: >
      kernelMatches() returns false (no panic) if dtype, head_size, causal or
      sliding_window disagrees with the graph, the candidate's tile is illegal,
      or the candidate is ragged (ragged != 0). The metadata carries no head
      counts and none are compared: one kernel serves every (num_query_heads,
      num_kv_heads), and their legality (positive, Hq % Hkv == 0, 32-bit
      extents) is checked on the graph by
      gfx950AttentionDenseGraphMatches(). The metadata's batch, seqlen_q and
      seqlen_kv are build inputs of a shape-generic kernel and are never
      compared; the graph's shape enters only through seqlen_q % block_m == 0
      and seqlen_kv % block_n == 0 per candidate.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDenseMatchers.cpp

  - name: kernargs
    python_source: kernels/gfx950/attention_dense.py:build_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/AttentionDenseNative.cpp
    kmd_fields: [ragged, seqlen_q, batch]
    guard: >
      kernelSignature(RUNTIME_HEAD_COUNTS), the catalog's dispatch.v2 contract,
      returns the 10-arg form
      (q,k,v,o,scale,batch,seqlen_q,seqlen_kv,num_query_heads,num_kv_heads):
      the runtime-shape grid body reads the shape and both head counts as
      kernargs, all taken from the graph at launch (the metadata carries no head
      fields). kernelSignature(BAKED_HEAD_COUNTS), the 8-arg form, is used only
      to restore plans saved under dispatch.v1. Every variant is non-persistent
      and on the runtime-shape path, which enumerate.pin and the aligned catalog
      keep true. use_sinks=False; no sink_ptr slot. Validated at prepare() time
      by buildIngestorKernelCode(..., expectedSignature).
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestAttentionDenseSignature.cpp

  # The cold ranking reads only the tile, through the shared candidateTile().
  - name: score
    python_source: kernels/gfx950/attention_dense.py:build_attention_dense
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/Gfx950AttentionDenseNative.cpp
    kmd_fields: [head_size, causal, block_m, block_n]
    guard: >
      scoreKernel() returns 0 for a record without a launchable tile; otherwise a
      distinct positive score per tile, ordered by closeness to preferredTile()
      for the graph's (head_size, causal) cohort and seqlen_q, with the
      historical ascending (block_m, block_n) order as the remainder. causal is
      read from the candidate's own metadata, which kernelMatches has already
      required to agree with the graph.
    test: dnn-providers/hip-kernel-provider/src/tests/engines/kernel_ingestor_engine/packs/TestGfx950AttentionDenseMatchers.cpp
