# Dispatcher-derived catalog of synthetic verification shapes only. Workload
# shapes are not committed: production catalogs are generated from a private
# request list and packed from a descriptor root outside the source tree (see
# docs/gfx950_conv_fwd/README.md). Every request carries both tile_k arms (64
# and 128) so the engine's benchmarked selection has a real choice.
# Group 1 (groups=1): five verification shapes in FP16/BF16.
# Group 2 (groups>1, names carry _G{groups}): seven grouped and depthwise
# verification shapes in FP16/BF16. Grouped pointwise (1x1, stride 1, no
# padding) is outside the contract and never appears here.
# Requests: gfx950_conv_fwd.requests.json; each request's _catalog_tile_k
# records the arms admitted to this catalog.
# Regenerate descriptors with generate.py --config this-file --output-dir DIR.

dialect: packaged
authored_subpath: rocKE/gfx950_conv_fwd
engine:
  name: hipkernel:Gfx950ConvFwd
  sdk_version: 1.0.0
  knobs:
  - tile_k
  heuristic: native
kmd_fields:
- name: N
  type: int
- name: Hi
  type: int
- name: Wi
  type: int
- name: C
  type: int
- name: K
  type: int
- name: Y
  type: int
- name: X
  type: int
- name: sH
  type: int
- name: sW
  type: int
- name: pH
  type: int
- name: pW
  type: int
- name: dH
  type: int
- name: dW
  type: int
- name: dtype
  type: string
- name: layout
  type: string
- name: groups
  type: int
- name: tile_m
  type: int
- name: tile_n
  type: int
- name: tile_k
  type: int
  default_value: 64
- name: warp_m
  type: int
- name: warp_n
  type: int
- name: warp_tile_m
  type: int
- name: warp_tile_n
  type: int
- name: warp_tile_k
  type: int
- name: wave_size
  type: int
- name: pipeline
  type: string
- name: epilogue
  type: string
kernel_source_kind: rocke
workspace_policy: none
graph_match:
  shape: shared_shape
  discriminator: none
# Every metadata field is baked into the kernel at compile time: the builder's
# Gfx950ConvFwdSpec consumes all 27, so the whole geometry and every tuning value
# is part of the specialization contract and none of them are matcher-only.
specialization:
  metadata_fields:
    [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, layout, groups, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue]
  matcher_only_fields: []
  bindings:
    N: {field: N}
    Hi: {field: Hi}
    Wi: {field: Wi}
    C: {field: C}
    K: {field: K}
    Y: {field: Y}
    X: {field: X}
    sH: {field: sH}
    sW: {field: sW}
    pH: {field: pH}
    pW: {field: pW}
    dH: {field: dH}
    dW: {field: dW}
    dtype: {field: dtype}
    layout: {field: layout}
    groups: {field: groups}
    tile_m: {field: tile_m}
    tile_n: {field: tile_n}
    tile_k: {field: tile_k}
    warp_m: {field: warp_m}
    warp_n: {field: warp_n}
    warp_tile_m: {field: warp_tile_m}
    warp_tile_n: {field: warp_tile_n}
    warp_tile_k: {field: warp_tile_k}
    wave_size: {field: wave_size}
    pipeline: {field: pipeline}
    epilogue: {field: epilogue}

packs:
- name: gfx950_conv_fwd
  arch:
  - gfx950
  kernel_defaults:
    kind: rocke
    source: builders/common/convolution_forward.py
    builder: build_gfx950_conv_fwd
  variants:
  - name: gfx950_conv_fwd_{tag}_N{N}_Hi{Hi}_Wi{Wi}_C{C}_K{K}_Y{Y}_X{X}_sH{sH}_sW{sW}_pH{pH}_pW{pW}_dH{dH}_dW{dW}_tile_k{tile_k}
    metadata: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, layout, groups, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue]
    spec_order: [N, Hi, Wi, C, K, Y, X, sH, sW, pH, pW, dH, dW, dtype, layout, groups, tile_m, tile_n, tile_k, warp_m, warp_n, warp_tile_m, warp_tile_n, warp_tile_k, wave_size, pipeline, epilogue]
    vocabulary:
      dtype:
        fp16: fp16
        bf16: bf16
      layout:
        NHWC: NHWC
      pipeline:
        mem: mem
      epilogue:
        cshuffle: cshuffle
