# Dispatcher-derived catalog of synthetic verification shapes only. Workload
# shapes are not committed: production catalogs are generated from a private
# request list and packed from a descriptor root outside the source tree (see
# docs/gfx950_conv_fwd/README.md). Every request carries both tile_k arms (64
# and 128) so the engine's benchmarked selection has a real choice.
# Group 1 (groups=1): five verification shapes in FP16/BF16.
# Group 2 (groups>1, names carry _G{groups}): seventeen grouped and depthwise
# verification shapes in FP16/BF16. The last four are depthwise shapes the
# direct family must decline (pad 0, pad 2, sH != sW, dilation 2), served by
# implicit GEMM only. Grouped pointwise (1x1, stride 1, no padding) is outside
# the contract and never appears here.
# Group 3 (kernel_family=1, names end _family1_std_bw{block_w}_bwv{block_waves}
# or _family1_spatial_bwv{block_waves}; the spatial kernel derives its block
# width): rocKE's direct depthwise kernels on nine of the depthwise shapes of
# group 2, in FP16/BF16. kernel_family=1 forces them. Their implicit-GEMM fields
# hold placeholders: tile_k is 0, so forcing tile_k=64/128 selects only implicit
# GEMM (a known quirk: tile_k=0 is advertised on these graphs and also selects
# only direct kernels; see docs/gfx950_conv_fwd/README.md). Every direct arm
# streams input rows through rocKE's runtime H loop.
# Requests: gfx950_conv_fwd.requests.json; each request's _catalog_tile_k
# records the implicit-GEMM arms and _catalog_direct the direct arms admitted
# to this catalog.
# The four family fields are builder_default: the adapter's dataclass defaults
# them to the KMD default_value, so groups 1 and 2 omit them and their
# descriptors stay as first shipped.
# Regenerate descriptors with generate.py --config this-file --output-dir DIR.

