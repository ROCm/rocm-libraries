#
# A SYNTHETIC authoring profile in the gfx950 shape, read by `test_launch_surface.py`
# and `test_variant_reachability.py` when no override is set: a controlled INPUT to the
# tools, not a description of any shipped engine's real launch surface. See README.md
# in this directory.
#
# Two properties are wired in deliberately, because two tests distinguish them:
#
#   * `applicability` and `kernargs` cite the SAME `cpp_mirror`, and only `applicability`
#     declares the fields that mirror reads through a required accessor, so deleting
#     `kernargs` is invisible to the metadata-field scan while deleting `applicability`
#     is caught -- the two branches of the audit's residual gap.
#   * `spec_resolution` is the ONLY surface admitting `guard: none`, so the unguarded list
#     is a single name and a second admission would be noticed.
#
# Every path is repo-relative and must exist; `--check` resolves them against the repo root
# and reports a missing one as a failure.

kmd_fields:
  - name: dtype
    type: string
  - name: block_size
    type: int
#: `python_source` paths resolve under `<provider_root>/rocke/library`, the same base
#: `dispatch_parity.py` imports kernel modules from.
provider_root: dnn-providers/hip-kernel-provider

launch_surface:
  - name: grid
    python_source: kernels/common/conv_implicit_gemm.py:implicit_gemm_conv_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:ConvFwdDispatchHandler::prepare
    kmd_fields: []
    guard: prepare() throws on a non-positive launch dimension
    test: projects/hipdnn/tools/IngestorGenerator/tests/test_launch_surface.py
  # Sole declarer of both fields `ConvNative.cpp` dereferences unconditionally, which is
  # what makes its deletion detectable.
  - name: applicability
    python_source: kernels/common/conv_implicit_gemm.py:is_valid_spec_for_problem
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:convFwdKernelMatches
    kmd_fields: [dtype, block_size]
    guard: convFwdKernelMatches compares dtype and block size against the graph's
    test: projects/hipdnn/tools/IngestorGenerator/tests/test_launch_surface.py
  # Shares `applicability`'s mirror and declares nothing, so no metadata-field scan can
  # notice its removal.
  - name: kernargs
    python_source: kernels/common/conv_implicit_gemm.py:_build_implicit_gemm_conv_impl
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:convFwdKernelSignature
    kmd_fields: []
    guard: positional device-buffer pointers only, bound in signature order
    test: projects/hipdnn/tools/IngestorGenerator/tests/test_launch_surface.py
  - name: spec_resolution
    python_source: kernels/common/conv_implicit_gemm.py:_resolve_conv_op
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:prepare() trusts the KMD's own numbers
    kmd_fields: []
    guard: none
    test: none
