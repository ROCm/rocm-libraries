# A synthetic engine manifest: a controlled input to `launch_surface.py --check`. See
# README.md in this directory.

kmd_fields:
  - name: dtype
    type: string
  - name: block_size
    type: int

#: `python_source` paths resolve under `<provider_root>/rocke/library`.
provider_root: dnn-providers/hip-kernel-provider

launch_surface:
  - name: grid
    python_source: kernels/common/conv_implicit_gemm.py:implicit_gemm_conv_grid
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:ConvFwdDispatchHandler::prepare
    kmd_fields: [block_size]
    guard: prepare() rejects a block size the kernel signature cannot bind
    test: projects/hipdnn/tools/IngestorGenerator/tests/test_launch_surface.py
  - name: applicability
    python_source: kernels/common/conv_implicit_gemm.py:is_valid_spec_for_problem
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:convFwdKernelMatches
    kmd_fields: [dtype]
    guard: convFwdKernelMatches compares the descriptor's dtype against the graph's
    test: projects/hipdnn/tools/IngestorGenerator/tests/test_launch_surface.py
  # `guard: none` / `test: none` are written out so an unguarded surface is a visible
  # choice.
  - name: kernargs
    python_source: kernels/common/conv_implicit_gemm.py:_build_implicit_gemm_conv_impl
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:convFwdKernelSignature
    kmd_fields: []
    guard: none
    test: none
  # A prose locator: `prepare()` is not a bare identifier, so the symbol check skips it.
  - name: spec_resolution
    python_source: kernels/common/conv_implicit_gemm.py:_resolve_conv_op
    cpp_mirror: dnn-providers/hip-kernel-provider/src/engines/kernel_ingestor_engine/packs/ConvNative.cpp:prepare() trusts the KMD's own numbers
    kmd_fields: []
    guard: none
    test: none
