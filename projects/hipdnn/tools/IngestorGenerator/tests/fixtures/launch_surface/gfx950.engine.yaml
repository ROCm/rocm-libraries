# A synthetic engine manifest: a controlled input to `launch_surface.py --check`. See
# README.md in this directory.

kmd_fields:
  - name: dtype
    type: string
  - name: block_size
    type: int
#: `python_source` paths resolve under `<provider_root>/rocke/library`; every path
#: below is written by the test under a temporary check root.
provider_root: provider

launch_surface:
  - name: grid
    python_source: kernels/mirror.py:grid_fn
    cpp_mirror: provider/Mirror.cpp:Handler::prepare
    kmd_fields: []
    guard: prepare() throws on a non-positive launch dimension
    test: tests/test_mirror.py
  # Sole declarer of both fields `Mirror.cpp` reads unconditionally.
  - name: applicability
    python_source: kernels/mirror.py:is_valid_fn
    cpp_mirror: provider/Mirror.cpp:matches
    kmd_fields: [dtype, block_size]
    guard: matches compares dtype and block size against the graph's
    test: tests/test_mirror.py
  # Shares `applicability`'s mirror and declares nothing.
  - name: kernargs
    python_source: kernels/mirror.py:build_fn
    cpp_mirror: provider/Mirror.cpp:signature
    kmd_fields: []
    guard: positional device-buffer pointers only, bound in signature order
    test: tests/test_mirror.py
  - name: spec_resolution
    python_source: kernels/mirror.py:resolve_fn
    cpp_mirror: provider/Mirror.cpp:prepare() trusts the KMD's own numbers
    kmd_fields: []
    guard: none
    test: none
