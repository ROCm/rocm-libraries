interface:
  display_name: "hipDNN Ingestor Engine"
  short_description: "Production mining and lowering through final artifact, device and corpus proof"
  default_prompt: >-
    Use hipdnn-ingestor-engine for production mining and lowering of an ingestor
    engine — corpus and workloads, sweeps and tuning, packaging, final corpus
    proof — and for adding a hiprtc_file variant to a pack whose native symbols are
    already installed. Integrating a kernel that needs new native symbols is
    hipdnn-kernel-integration's create path, not this skill's: route it there and
    return here for the production half. Read SKILL.md for entry/completion
    requirements, then execute RUNBOOK.md as the only ordered workflow for that
    production half. Consult its linked domain pages for contracts; do not invent
    a second sequence or unsupported CLI capabilities. Report final-installation
    evidence and exact limitations, never generation, skipped work, another engine's
    results or an unchanged extension baseline as completion.
