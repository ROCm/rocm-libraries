#
# Tool registry -- MACHINE-LOCAL. It answers one question: given the name `claude`,
# what do I exec on this box? Arguments, cwd, timeouts and stdin belong to the step
# that invokes the tool, never here; the loader rejects them with a pointer to where
# they go.
#
# Check what this resolves to on the current machine with:
#     python orchestrate.py doctor
#     python orchestrate.py doctor --flow configs/flows/rtc-kernel-review.yaml
version: 1

vars:
  # This checkout. Every other path is derived from it.
  repo_root: D:/develop/rocm-libraries
  hipdnn_root: "${vars.repo_root}/projects/hipdnn"
  build_dir: "${vars.repo_root}/build"
  # The ROCm SDK this checkout was configured against (ROCM_PATH in the build cache).
  # Its bin directory has to be on PATH for anything that links the HIP runtime --
  # see the comment on integration_tests below.
  rocm_path: D:/develop/latest_wheels/Lib/site-packages/_rocm_sdk_devel
  rocm_bin: "${vars.rocm_path}/bin"
  # The hip-kernel-provider plugin the integration suite and the benchmark load.
  # Here rather than in a flow because the library suffix is machine-local: a flow
  # that spelled `.dll` would be a Windows flow.
  hip_kernel_plugin: "${vars.build_dir}/bin/hipdnn_plugins/engines/hip_kernel_provider.dll"

  # --- ingestor-engine-kernel ------------------------------------------------
  #
  # That flow builds into its own tree. It turns HIPDNN_ENABLE_KERNEL_INGESTOR and
  # HIPKERNELPROVIDER_ENABLE_ROCKE on and then installs, and sharing a build directory
  # with a flow whose exit condition is a benchmark median would let one run's
  # reconfiguration move the other run's timings without either noticing. The cost is
  # one cold build; the alternative costs a measurement nobody can trust.
  ingestor_build_dir: "${vars.repo_root}/build-ingestor"
  ingestor_install_dir: "${vars.repo_root}/install-ingestor"
  # Built and installed copies of the same plugin. Both are here rather than in the flow
  # for the reason above: the suffix and the install layout are machine-local. The flow
  # asserts each exists at the step that first needs it, so a wrong layout here fails at
  # that step with the path in the message rather than as a mystery skip later.
  ingestor_plugin: "${vars.ingestor_build_dir}/bin/hipdnn_plugins/engines/hip_kernel_provider.dll"
  installed_plugin: "${vars.ingestor_install_dir}/bin/hipdnn_plugins/engines/hip_kernel_provider.dll"
  # The provider's own installed CTest root -- not the install prefix. The registered
  # external integration entries live under here, and pointing ctest at the prefix finds
  # nothing while exiting 0.
  ingestor_ctest_root: "${vars.ingestor_install_dir}/bin/hip_kernel_provider"
  # Clang is a prerequisite of the preset's toolchain and is not provisioned by anything
  # in this repository; the superbuild skill installs it. CMAKE_PROGRAM_PATH points the
  # preset at it on Windows.
  clang_bin: D:/develop/dist/clang/bin

# A profile is an overlay on the `vars` and `tools` above, selected with
# `--profile NAME`. It exists because this registry is the one machine-local file and
# the values above describe a Windows workstation: a second machine that edits them in place
# makes every later diff of this file a merge conflict about somebody's home directory.
# Only the leaves need restating -- `_resolve_vars` runs after the merge, so derived
# vars like `rocm_bin` and `ingestor_build_dir` pick the overridden roots up themselves.
profiles:

  # A Linux workstation, MI200-class (gfx90a:sramecc+:xnack-), ROCm 7.16 at the
  # system prefix rather than a wheel. Verified 2026-09.
  linux-gfx90a:
    vars:
      repo_root: /path/to/rocm-libraries
      rocm_path: /opt/rocm
      # Only reaches -DCMAKE_PROGRAM_PATH, which is a Windows-only crutch:
      # cmake/toolchains/rocm-clang.cmake derives clang from ROCM_PATH on Linux and
      # this never gets consulted. Pointed at the real directory anyway, because a
      # variable naming a path that does not exist is a trap for the next reader.
      clang_bin: /opt/rocm/lib/llvm/bin
      # Two differences from the Windows spellings above, and both are load-bearing.
      # HIPDNN_PLUGIN_ROOTDIR is CMAKE_INSTALL_BINDIR only under WIN32 and
      # CMAKE_INSTALL_LIBDIR otherwise, so plugins land in lib/ rather than bin/; and
      # a CMake SHARED target is libhip_kernel_provider.so, not hip_kernel_provider.dll.
      # `lib` rather than `lib64`: GNUInstallDirs only multiarch-ifies LIBDIR for a /usr
      # prefix, and every prefix here is out-of-tree. Check `ls` if install ever moves.
      hip_kernel_plugin: "${vars.build_dir}/lib/hipdnn_plugins/engines/libhip_kernel_provider.so"
      ingestor_plugin: "${vars.ingestor_build_dir}/lib/hipdnn_plugins/engines/libhip_kernel_provider.so"
      installed_plugin: "${vars.ingestor_install_dir}/lib/hipdnn_plugins/engines/libhip_kernel_provider.so"
      # ingestor_ctest_root is deliberately NOT restated: the provider installs its
      # CTest files to CMAKE_INSTALL_BINDIR/hip_kernel_provider on both platforms.

tools:
  # Claude Code CLI. Verified present at this path on a Windows workstation (2026-09).
  claude:
    exe:
      windows: C:/Users/dev/.local/bin/claude.exe
      linux: claude

  cmake:
    exe:
      windows: C:/Program Files/CMake/bin/cmake.exe
      linux: cmake

  ctest:
    exe:
      windows: C:/Program Files/CMake/bin/ctest.exe
      linux: ctest

  git:
    exe:
      windows: C:/Program Files/Git/cmd/git.exe
      linux: git

  python:
    exe:
      windows: C:/Python314/python.exe
      linux: python3

  # The cross-provider integration test binary. Only exists after a superbuild, so
  # `doctor` reports it MISSING until one is built -- that is accurate, not a bug.
  #
  # path_prepend is load-bearing on Windows, and both entries are needed. Without
  # ROCm's bin the Win32 loader cannot find amdhip64_7.dll and the process dies with
  # 0xC0000135 (exit 3221225781) before main -- no output, no diagnostic, and a step
  # that looks like the binary crashed rather than like a PATH problem. The build's
  # own bin is there for the app-local amd_comgr.dll, which must outrank the driver's
  # stale copy in System32.
  integration_tests:
    exe: "${vars.build_dir}/bin/hipdnn_integration_tests${platform.exe_suffix}"
    path_prepend:
      - "${vars.build_dir}/bin"
      - "${vars.rocm_bin}"

  # Times one graph on one named engine. Same superbuild and the same loader
  # requirements as integration_tests above.
  graph_bench:
    exe: "${vars.build_dir}/bin/hipdnn_graph_bench${platform.exe_suffix}"
    path_prepend:
      - "${vars.build_dir}/bin"
      - "${vars.rocm_bin}"
