<svg viewBox="0 0 960 660" width="960" height="660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- ======================= TITLE ======================= -->
  <text x="480" y="28" text-anchor="middle" font-weight="600" font-size="15">A UKD is a thin binding of reusable descriptors</text>
  <text x="480" y="48" text-anchor="middle" fill="#555" font-size="12">match / dispatch / heuristic / engine are reusable descriptors; a Launch = kernel source + UDD (unique, not reused)</text>

  <!-- ======================= COLUMN 1: reusable descriptors ======================= -->
  <text x="35" y="82" font-weight="600" font-size="12">Shared descriptors (referenced by ID, reused across UKDs)</text>

  <!-- UMD -->
  <rect x="30" y="92" width="250" height="66" rx="8" fill="#e0f2f1" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="45" y="114" font-weight="600">UMD: Universal Match Descriptor</text>
  <text x="45" y="134" font-size="12" fill="#333">when it applies: graph pattern + constraints</text>
  <text x="45" y="150" font-size="12" fill="#333">binds $vars (dims, tensors) for launch</text>

  <!-- UHD -->
  <rect x="30" y="172" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="45" y="194" font-weight="600">UHD: Universal Heuristic Descriptor</text>
  <text x="45" y="214" font-size="12" fill="#333">ranks the kernels that fit a graph</text>
  <text x="45" y="230" font-size="12" fill="#333">and picks one per problem</text>

  <!-- UED -->
  <rect x="30" y="252" width="250" height="66" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="45" y="274" font-weight="600">UED: Universal Engine Descriptor</text>
  <text x="45" y="294" font-size="12" fill="#333">engine identity, knobs[], notes[]</text>
  <text x="45" y="310" font-size="12" fill="#333">a named group of kernels</text>

  <!-- ======================= COLUMN 2: the UKD binding (one of N in a KDP) ======================= -->
  <!-- small stack icon implying N UKDs packed in a KDP -->
  <rect x="356" y="90" width="18" height="14" rx="2" fill="#fdf1cf" stroke="#c99a2e" stroke-width="1"/>
  <rect x="352" y="94" width="18" height="14" rx="2" fill="#fdf4dd" stroke="#c99a2e" stroke-width="1"/>
  <rect x="348" y="98" width="18" height="14" rx="2" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="374" y="103" font-size="10" fill="#8a6d1f">KDP file: kernelDescriptors[] : N UKDs (this is one)</text>
  <rect x="345" y="112" width="250" height="210" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="470" y="138" text-anchor="middle" font-weight="600">UKD</text>
  <text x="470" y="156" text-anchor="middle" fill="#555" font-size="11">Universal Kernel Descriptor</text>
  <text x="470" y="174" text-anchor="middle" fill="#555" font-size="11">a binding, no logic of its own</text>
  <line x1="360" y1="186" x2="580" y2="186" stroke="#c99a2e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="362" y="210" font-family="Consolas, monospace" font-size="12">match:      1 UMD</text>
  <text x="362" y="234" font-family="Consolas, monospace" font-size="12">engine:     1 UED</text>
  <text x="362" y="258" font-family="Consolas, monospace" font-size="12">heuristic:  1 UHD</text>
  <text x="362" y="286" font-family="Consolas, monospace" font-size="12">launches[]: N Launches</text>
  <text x="362" y="305" font-family="Consolas, monospace" font-size="11" fill="#555">  Launch = source + UDD</text>

  <!-- UKD -> shared defs -->
  <line x1="345" y1="205" x2="282" y2="128" stroke="#444" stroke-width="1.4" marker-end="url(#arrowD)"/>
  <line x1="345" y1="234" x2="282" y2="200" stroke="#444" stroke-width="1.4" marker-end="url(#arrowD)"/>
  <line x1="345" y1="262" x2="282" y2="285" stroke="#444" stroke-width="1.4" marker-end="url(#arrowD)"/>

  <!-- ======================= COLUMN 3: N Launches ======================= -->
  <text x="625" y="82" font-weight="600" font-size="12">Launches: N per kernel</text>

  <text x="625" y="99" fill="#555" font-size="11">1 for a simple kernel, N for multi-launch (e.g. SDPA-BWD)</text>

  <!-- Launch 1 -->
  <rect x="618" y="110" width="328" height="72" rx="8" fill="#fbfbfd" stroke="#b0b7c0" stroke-width="1.5"/>
  <text x="628" y="128" font-weight="600" font-size="11" fill="#333">Launch 1  =  kernel source  +  UDD</text>
  <rect x="628" y="134" width="130" height="40" rx="6" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="693" y="153" text-anchor="middle" font-size="12">kernel source</text>
  <text x="693" y="168" text-anchor="middle" font-size="10" fill="#555">kpack / hsaco / hip / hiprtc</text>
  <text x="780" y="159" text-anchor="middle" font-size="16" fill="#555">+</text>
  <rect x="804" y="134" width="132" height="40" rx="6" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="870" y="153" text-anchor="middle" font-size="12">UDD</text>
  <text x="870" y="168" text-anchor="middle" font-size="10" fill="#555">dispatch ABI</text>

  <!-- Launch 2 -->
  <rect x="618" y="192" width="328" height="72" rx="8" fill="#fbfbfd" stroke="#b0b7c0" stroke-width="1.5"/>
  <text x="628" y="210" font-weight="600" font-size="11" fill="#333">Launch 2  =  kernel source  +  UDD</text>
  <rect x="628" y="216" width="130" height="40" rx="6" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="693" y="235" text-anchor="middle" font-size="12">kernel source</text>
  <text x="693" y="250" text-anchor="middle" font-size="10" fill="#555">kpack / hsaco / hip / hiprtc</text>
  <text x="780" y="241" text-anchor="middle" font-size="16" fill="#555">+</text>
  <rect x="804" y="216" width="132" height="40" rx="6" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="870" y="235" text-anchor="middle" font-size="12">UDD</text>
  <text x="870" y="250" text-anchor="middle" font-size="10" fill="#555">dispatch ABI</text>

  <!-- UKD -> launches -->
  <line x1="595" y1="215" x2="618" y2="150" stroke="#444" stroke-width="1.4" marker-end="url(#arrowD)"/>
  <line x1="595" y1="240" x2="618" y2="228" stroke="#444" stroke-width="1.4" marker-end="url(#arrowD)"/>

  <!-- notes -->
  <text x="625" y="284" font-size="12" fill="#555">(up to N Launches; one UMD binds them all)</text>
  <text x="625" y="308" font-size="11" fill="#555">UDD = args &amp; ordering, grid/block, shared mem, workspace</text>
  <text x="625" y="323" font-size="11" fill="#555">a UDD is reusable, referenced by ID; a Launch is unique</text>

  <!-- JIT future: another source-half kind (no connector, self-explaining) -->
  <rect x="625" y="338" width="321" height="44" rx="6" fill="#ffffff" stroke="#7f8a99" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="636" y="357" font-size="11" fill="#555">+ JIT source (future): another code-source kind for</text>
  <text x="636" y="372" font-size="11" fill="#555">the source half. UMD / UDD / UHD / UED reused unchanged.</text>

  <!-- ======================= BOTTOM: UCD strip ======================= -->
  <rect x="30" y="398" width="900" height="238" rx="8" fill="#faf7fc" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="48" y="424" font-weight="600">UCD (Universal Composite Descriptor): a pipeline of the same pieces (future work, Section 10)</text>
  <text x="48" y="444" fill="#555" font-size="12">each stage resolves to a UKD (its own UMD, UHD, UED, and one or more Launches), wired by intermediate tensors</text>

  <!-- Stage 1 -->
  <rect x="55" y="458" width="272" height="168" rx="8" fill="#ffffff" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="70" y="480" font-weight="600" font-size="12">stage: transpose_in</text>
  <rect x="70" y="490" width="100" height="24" rx="5" fill="#e0f2f1" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="120" y="507" text-anchor="middle" font-size="11">UMD (match)</text>
  <rect x="180" y="490" width="127" height="24" rx="5" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.2"/>
  <text x="243" y="507" text-anchor="middle" font-size="11">UHD (heuristic)</text>
  <rect x="70" y="522" width="100" height="24" rx="5" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="120" y="539" text-anchor="middle" font-size="11">UED (engine)</text>
  <rect x="70" y="554" width="237" height="48" rx="6" fill="#fbfbfd" stroke="#b0b7c0" stroke-width="1.2"/>
  <text x="78" y="568" font-size="10" fill="#555">Launch</text>
  <rect x="78" y="572" width="140" height="24" rx="5" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.2"/>
  <text x="148" y="589" text-anchor="middle" font-size="11">kernel source</text>
  <rect x="226" y="572" width="73" height="24" rx="5" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.2"/>
  <text x="262" y="589" text-anchor="middle" font-size="11">UDD</text>
  <text x="191" y="618" text-anchor="middle" font-size="10" fill="#555">out &#8594; $x_t</text>

  <!-- Stage 2 -->
  <rect x="344" y="458" width="272" height="168" rx="8" fill="#ffffff" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="359" y="480" font-weight="600" font-size="12">stage: work</text>
  <rect x="359" y="490" width="100" height="24" rx="5" fill="#e0f2f1" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="409" y="507" text-anchor="middle" font-size="11">UMD (match)</text>
  <rect x="469" y="490" width="127" height="24" rx="5" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.2"/>
  <text x="532" y="507" text-anchor="middle" font-size="11">UHD (heuristic)</text>
  <rect x="359" y="522" width="100" height="24" rx="5" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="409" y="539" text-anchor="middle" font-size="11">UED (engine)</text>
  <rect x="359" y="554" width="237" height="48" rx="6" fill="#fbfbfd" stroke="#b0b7c0" stroke-width="1.2"/>
  <text x="367" y="568" font-size="10" fill="#555">Launch</text>
  <rect x="367" y="572" width="140" height="24" rx="5" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.2"/>
  <text x="437" y="589" text-anchor="middle" font-size="11">kernel source</text>
  <rect x="515" y="572" width="73" height="24" rx="5" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.2"/>
  <text x="551" y="589" text-anchor="middle" font-size="11">UDD</text>
  <text x="480" y="618" text-anchor="middle" font-size="10" fill="#555">$x_t &#8594; out $y_t</text>

  <!-- Stage 3 -->
  <rect x="633" y="458" width="272" height="168" rx="8" fill="#ffffff" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="648" y="480" font-weight="600" font-size="12">stage: transpose_out</text>
  <rect x="648" y="490" width="100" height="24" rx="5" fill="#e0f2f1" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="698" y="507" text-anchor="middle" font-size="11">UMD (match)</text>
  <rect x="758" y="490" width="127" height="24" rx="5" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.2"/>
  <text x="821" y="507" text-anchor="middle" font-size="11">UHD (heuristic)</text>
  <rect x="648" y="522" width="100" height="24" rx="5" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="698" y="539" text-anchor="middle" font-size="11">UED (engine)</text>
  <rect x="648" y="554" width="237" height="48" rx="6" fill="#fbfbfd" stroke="#b0b7c0" stroke-width="1.2"/>
  <text x="656" y="568" font-size="10" fill="#555">Launch</text>
  <rect x="656" y="572" width="140" height="24" rx="5" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.2"/>
  <text x="726" y="589" text-anchor="middle" font-size="11">kernel source</text>
  <rect x="804" y="572" width="73" height="24" rx="5" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.2"/>
  <text x="840" y="589" text-anchor="middle" font-size="11">UDD</text>
  <text x="769" y="618" text-anchor="middle" font-size="10" fill="#555">$y_t &#8594; out</text>

  <!-- stage arrows -->
  <line x1="327" y1="540" x2="344" y2="540" stroke="#444" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="616" y1="540" x2="633" y2="540" stroke="#444" stroke-width="1.5" marker-end="url(#arrowD)"/>
</svg>
