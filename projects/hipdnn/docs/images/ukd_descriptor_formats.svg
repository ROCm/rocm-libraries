<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowDF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="500" y="26" text-anchor="middle" font-weight="600">Descriptor formats: a KDP binds matchers, one engine, one heuristic, and one UDD over a vector of child UKDs</text>

  <!-- ===================== KDP CONTAINER (left) ===================== -->
  <rect x="15" y="48" width="345" height="470" rx="8" fill="#faf7fc" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="30" y="74" font-family="Consolas, monospace" font-size="13" fill="#8e5bc4" font-weight="600">KDP  Kernel Descriptor Pack</text>
  <text x="30" y="94"  font-family="Consolas, monospace" font-size="11" fill="#2a9d8f">matchers[]          &#8594; UMD set (shared)</text>
  <text x="30" y="110" font-family="Consolas, monospace" font-size="11" fill="#4a72c4">engine              &#8594; one UED</text>
  <text x="30" y="126" font-family="Consolas, monospace" font-size="11" fill="#3f9159">heuristic           &#8594; one UHD</text>
  <text x="30" y="142" font-family="Consolas, monospace" font-size="11" fill="#8e5bc4">dispatch            &#8594; one UDD</text>
  <text x="30" y="160" font-family="Consolas, monospace" font-size="11" fill="#555">kernelDescriptors[] : [ UKD, UKD, ... ]</text>

  <!-- UKD #1 (detailed, the reference source) -->
  <rect x="30" y="172" width="315" height="122" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="44" y="192" font-family="Consolas, monospace" font-size="13" fill="#8a6d1f" font-weight="600">UKD  child kernel</text>
  <text x="44" y="212" font-family="Consolas, monospace" font-size="11">id / name</text>
  <text x="44" y="230" font-family="Consolas, monospace" font-size="11">kernel_source &#8594; kpack / hsaco / hip</text>
  <text x="44" y="248" font-family="Consolas, monospace" font-size="11">metadata      : build features + values</text>
  <text x="44" y="266" font-family="Consolas, monospace" font-size="11" fill="#555">(the heuristic ranks on these) · priority</text>
  <text x="44" y="286" font-family="Consolas, monospace" font-size="10" fill="#555">matchers, engine, heuristic, dispatch: all the KDP's</text>

  <!-- UKD #2, #3 (collapsed) -->
  <rect x="30" y="304" width="315" height="28" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="44" y="323" font-family="Consolas, monospace" font-size="11" fill="#8a6d1f">UKD  { id, name, kernel_source, metadata }</text>
  <rect x="30" y="340" width="315" height="28" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="44" y="359" font-family="Consolas, monospace" font-size="11" fill="#8a6d1f">UKD  { id, name, kernel_source, metadata }</text>

  <text x="187" y="398" text-anchor="middle" font-size="11" fill="#555">one file: matchers + engine + heuristic + one UDD</text>
  <text x="187" y="418" text-anchor="middle" font-size="11" fill="#555">over a kernel vector; all kernels share those four</text>
  <text x="187" y="438" text-anchor="middle" font-size="11" fill="#555">every reference is by ID</text>

  <!-- ===================== REUSABLE CARDS (right) ===================== -->
  <!-- UED -->
  <rect x="620" y="56" width="365" height="64" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="636" y="78" font-family="Consolas, monospace" font-size="13" fill="#4a72c4" font-weight="600">UED  engine descriptor</text>
  <text x="636" y="100" font-family="Consolas, monospace" font-size="11">id</text>
  <text x="636" y="116" font-family="Consolas, monospace" font-size="11">name</text>
  <text x="800" y="100" font-family="Consolas, monospace" font-size="11">notes[]</text>
  <text x="800" y="116" font-family="Consolas, monospace" font-size="11">knobs[]</text>

  <!-- UHD -->
  <rect x="620" y="132" width="365" height="64" rx="8" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="636" y="154" font-family="Consolas, monospace" font-size="13" fill="#3f9159" font-weight="600">UHD  heuristic descriptor</text>
  <text x="636" y="176" font-family="Consolas, monospace" font-size="11">id</text>
  <text x="636" y="192" font-family="Consolas, monospace" font-size="11">name</text>
  <text x="800" y="176" font-family="Consolas, monospace" font-size="11">kind</text>
  <text x="800" y="192" font-family="Consolas, monospace" font-size="11">model {...}</text>

  <!-- UMD (matcher set) -->
  <rect x="620" y="208" width="365" height="88" rx="8" fill="#e0f2f1" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="636" y="230" font-family="Consolas, monospace" font-size="13" fill="#2a9d8f" font-weight="600">UMD  matcher  (a shared set)</text>
  <text x="636" y="252" font-family="Consolas, monospace" font-size="11">id</text>
  <text x="636" y="268" font-family="Consolas, monospace" font-size="11">name</text>
  <text x="800" y="252" font-family="Consolas, monospace" font-size="11">nodes[]</text>
  <text x="800" y="268" font-family="Consolas, monospace" font-size="11">criteria {...}</text>
  <text x="636" y="288" font-size="10" fill="#2a9d8f">a kernel applies iff all of its KDP's matchers pass</text>

  <!-- UDD (one per KDP) -->
  <rect x="620" y="308" width="365" height="120" rx="8" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="636" y="330" font-family="Consolas, monospace" font-size="13" fill="#8e5bc4" font-weight="600">UDD  dispatch  (one per KDP, shared)</text>
  <text x="636" y="352" font-family="Consolas, monospace" font-size="11">id</text>
  <text x="636" y="368" font-family="Consolas, monospace" font-size="11">name</text>
  <text x="636" y="384" font-family="Consolas, monospace" font-size="11">grid / block</text>
  <text x="800" y="352" font-family="Consolas, monospace" font-size="11">shared_mem_bytes</text>
  <text x="800" y="368" font-family="Consolas, monospace" font-size="11">workspace_bytes</text>
  <text x="800" y="384" font-family="Consolas, monospace" font-size="11">args_signature[]</text>
  <text x="636" y="412" font-size="10" fill="#8e5bc4">shared by every child kernel in the pack</text>

  <!-- kernel source (per-UKD, unique) -->
  <rect x="620" y="440" width="365" height="78" rx="8" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="636" y="462" font-weight="600" font-size="12" fill="#333">kernel source  (unique, one per UKD)</text>
  <text x="636" y="484" font-size="11" fill="#555">compiled artifact + entry point</text>
  <text x="636" y="504" font-size="11" fill="#8e5bc4">Launch = a kernel's source + the KDP's shared UDD</text>

  <!-- ===================== REFERENCE ARROWS (straight across, label above each) ===================== -->
  <!-- KDP engine -> UED -->
  <text x="489" y="82" text-anchor="middle" font-size="11" fill="#555">engine</text>
  <line x1="360" y1="88" x2="617" y2="88" stroke="#444" stroke-width="1.5" marker-end="url(#arrowDF)"/>

  <!-- KDP heuristic -> UHD -->
  <text x="489" y="158" text-anchor="middle" font-size="11" fill="#555">heuristic</text>
  <line x1="360" y1="164" x2="617" y2="164" stroke="#444" stroke-width="1.5" marker-end="url(#arrowDF)"/>

  <!-- KDP matchers[] -> UMD -->
  <text x="489" y="246" text-anchor="middle" font-size="11" fill="#555">matchers</text>
  <line x1="360" y1="252" x2="617" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#arrowDF)"/>

  <!-- KDP dispatch -> UDD -->
  <text x="489" y="362" text-anchor="middle" font-size="11" fill="#555">dispatch (1)</text>
  <line x1="360" y1="368" x2="617" y2="368" stroke="#444" stroke-width="1.5" marker-end="url(#arrowDF)"/>

  <!-- UKD kernel_source -> kernel source card -->
  <text x="489" y="473" text-anchor="middle" font-size="11" fill="#555">source</text>
  <line x1="360" y1="479" x2="617" y2="479" stroke="#444" stroke-width="1.5" marker-end="url(#arrowDF)"/>

  <!-- CAPTION -->
  <text x="500" y="576" text-anchor="middle" font-size="12" fill="#555">The KDP binds the matchers, engine, heuristic, and the one UDD; each child UKD adds only its source. Everything is by ID.</text>
</svg>
