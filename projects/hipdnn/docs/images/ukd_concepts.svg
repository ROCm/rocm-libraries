<svg viewBox="0 0 780 470" width="780" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- UED -->
  <rect x="230" y="20" width="340" height="86" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="400" y="44" text-anchor="middle" font-weight="600">UED: Universal Engine Descriptor</text>
  <text x="400" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="12">engine identity, tags[], knobs[]</text>
  <text x="400" y="88" text-anchor="middle" fill="#555" font-size="12">→ one hipDNN engine</text>

  <!-- UHD -->
  <rect x="30" y="220" width="300" height="150" rx="8" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="180" y="248" text-anchor="middle" font-weight="600">UHD: Heuristic Descriptor</text>
  <text x="180" y="274" text-anchor="middle" font-size="12">kernel-level selector</text>
  <text x="180" y="298" text-anchor="middle" font-size="12">model content</text>
  <text x="180" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="11">(model + feature-spec)</text>
  <text x="180" y="346" text-anchor="middle" font-size="12">+ optional native</text>
  <text x="180" y="362" text-anchor="middle" font-size="12">scoring predicate</text>

  <!-- UKD -->
  <rect x="410" y="200" width="340" height="190" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="580" y="228" text-anchor="middle" font-weight="600">UKD: Universal Kernel Descriptor</text>
  <text x="432" y="258" font-family="Consolas, monospace" font-size="12">• graph_criteria (accept a graph)</text>
  <text x="432" y="284" font-family="Consolas, monospace" font-size="12">• engine (which UED to join)</text>
  <text x="432" y="310" font-family="Consolas, monospace" font-size="12">• heuristic (which UHD ranks it)</text>
  <text x="432" y="336" font-family="Consolas, monospace" font-size="12">• launch (grid/block/ws/args)</text>
  <text x="432" y="362" font-family="Consolas, monospace" font-size="12">• kernel_source (kpack/hsaco/hip/rtc)</text>

  <!-- UKD -> UED (engine membership) -->
  <line x1="500" y1="200" x2="440" y2="106" stroke="#444" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="360" y="160" font-size="11" fill="#333">engine (membership)</text>

  <!-- UKD -> UHD (heuristic) -->
  <line x1="410" y1="295" x2="330" y2="295" stroke="#444" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="370" y="288" text-anchor="middle" font-size="11" fill="#333">heuristic</text>

  <!-- caption -->
  <text x="30" y="418" font-size="12" fill="#333">Many UKDs → one UED (an engine is a bag of kernels). Many UKDs → one UHD (a kernel-selection group).</text>
  <text x="30" y="436" font-size="12" fill="#333">UEDs and UHDs are shared and reusable; the UKD is the leaf. Engine-level selection picks the engine;</text>
  <text x="30" y="454" font-size="12" fill="#333">a UHD picks the kernel within it. The UHD is what makes dropping in a family of kernels useful.</text>
</svg>
