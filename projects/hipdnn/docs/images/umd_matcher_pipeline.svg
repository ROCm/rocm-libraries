<svg viewBox="0 0 940 360" width="940" height="360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowMP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="470" y="34" text-anchor="middle" font-weight="600">Compile once at load; run per graph at plan build</text>

  <!-- Compile stage box -->
  <rect x="20" y="56" width="600" height="140" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="35" y="78" font-weight="600" font-size="12">Compile (once)</text>

  <!-- row A: the engine's pattern -->
  <rect x="33" y="88" width="112" height="44" rx="6" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="89" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="11">UED nodes</text>
  <text x="89" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="11">(JSONC)</text>

  <line x1="147" y1="110" x2="171" y2="110" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="173" y="88" width="146" height="44" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="246" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="10">resolve op +</text>
  <text x="246" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="10">operand names</text>

  <line x1="321" y1="110" x2="345" y2="110" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="347" y="88" width="136" height="44" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="415" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="10">matcher</text>
  <text x="415" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="10">(the pattern)</text>

  <line x1="485" y1="110" x2="509" y2="110" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="511" y="88" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.2"/>
  <text x="561" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="10">root-opcode</text>
  <text x="561" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="10">index: engines</text>

  <!-- row B: the pack's criteria -->
  <rect x="33" y="140" width="112" height="44" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="89" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="11">UMD criteria</text>
  <text x="89" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="11">(JSONC)</text>

  <line x1="147" y1="162" x2="171" y2="162" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="173" y="140" width="146" height="44" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="246" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10">expand layouts,</text>
  <text x="246" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="10">parse exprs, check</text>

  <line x1="321" y1="162" x2="345" y2="162" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="347" y="140" width="136" height="44" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="415" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10">constraint IR</text>
  <text x="415" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="10">early-out ordered</text>

  <!-- Run stage box -->
  <rect x="20" y="216" width="600" height="118" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="35" y="238" font-weight="600" font-size="12">Run (per graph)</text>

  <rect x="35" y="252" width="110" height="66" rx="6" fill="#ffffff" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="90" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10">live graph</text>
  <text x="90" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="10">root op</text>

  <line x1="147" y1="285" x2="177" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>
  <text x="162" y="330" text-anchor="middle" font-size="9" fill="#444">index lookup</text>

  <rect x="179" y="252" width="150" height="66" rx="6" fill="#ffffff" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="254" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10">candidate engines</text>
  <text x="254" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="10">for this opcode</text>

  <line x1="331" y1="285" x2="361" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>
  <text x="346" y="330" text-anchor="middle" font-size="9" fill="#444">bind, then eval</text>

  <rect x="363" y="252" width="130" height="66" rx="6" fill="#ffffff" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="428" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10">pattern binds</text>
  <text x="428" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="10">criteria pass</text>

  <line x1="495" y1="285" x2="525" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arrowMP)"/>

  <rect x="527" y="252" width="80" height="66" rx="6" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.2"/>
  <text x="567" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="10">provider</text>
  <text x="567" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="10">cache</text>

  <!-- cache reuse box on the right -->
  <rect x="650" y="120" width="270" height="150" rx="8" fill="#f3e8fd" stroke="#8a4fbe" stroke-width="1.5"/>
  <text x="785" y="146" text-anchor="middle" font-weight="600" font-size="12">Applicability-time cache</text>
  <text x="668" y="174" font-family="Consolas, monospace" font-size="11">catalog (kernels that passed)</text>
  <text x="668" y="196" font-family="Consolas, monospace" font-size="11">bound token state</text>
  <text x="668" y="218" font-family="Consolas, monospace" font-size="11">key: engine, graph, device</text>
  <text x="668" y="248" font-family="Consolas, monospace" font-size="10" fill="#666">written by isApplicable; read by</text>
  <text x="668" y="264" font-family="Consolas, monospace" font-size="10" fill="#666">getDetails / workspace / buildPlan</text>

  <line x1="607" y1="285" x2="649" y2="230" stroke="#8a4fbe" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMP)"/>

  <text x="470" y="352" text-anchor="middle" font-style="italic" fill="#444">Root-opcode indexing prunes whole engines before a criterion runs; the pattern binds once per graph (RFC 0017 §8).</text>
</svg>
