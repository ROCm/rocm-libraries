<svg viewBox="0 0 940 500" width="940" height="500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowCX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL: execution composition ===================== -->
  <text x="237" y="26" text-anchor="middle" font-weight="600">Multi-launch pack: one shared UDD, several Launches, one selection</text>
  <rect x="15" y="40" width="445" height="395" rx="8" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>

  <!-- UKD -->
  <rect x="70" y="64" width="250" height="46" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="195" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="12">UDD  sdpa_bwd (one per pack)</text>
  <text x="195" y="102" text-anchor="middle" font-size="11">holds Launches; each UKD fills a source</text>
  <line x1="195" y1="110" x2="195" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>

  <!-- launches -->
  <rect x="70" y="150" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="82" y="175" font-size="12">Launch 1  preprocess  &#8594; writes $D</text>
  <line x1="195" y1="190" x2="195" y2="214" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>

  <rect x="70" y="214" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="82" y="239" font-size="12">Launch 2  dK / dV  &#8594; reads $D</text>
  <line x1="195" y1="254" x2="195" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>

  <rect x="70" y="278" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="82" y="303" font-size="12">Launch 3  dQ  &#8594; reads $D</text>

  <!-- intermediate $D -->
  <rect x="352" y="196" width="86" height="72" rx="8" fill="#ffffff" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="395" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="12">$D</text>
  <text x="395" y="246" text-anchor="middle" font-size="10" fill="#555">scratch</text>
  <!-- write / read edges -->
  <line x1="320" y1="168" x2="352" y2="210" stroke="#444" stroke-width="1.3" marker-end="url(#arrowCX)"/>
  <text x="328" y="173" font-size="9" fill="#555">write</text>
  <line x1="352" y1="240" x2="320" y2="236" stroke="#444" stroke-width="1.3" marker-end="url(#arrowCX)"/>
  <line x1="360" y1="268" x2="320" y2="300" stroke="#444" stroke-width="1.3" marker-end="url(#arrowCX)"/>
  <text x="346" y="292" font-size="9" fill="#555">read</text>

  <!-- caption -->
  <text x="237" y="352" text-anchor="middle" font-size="11" fill="#555">the pack's one UDD holds all 3 Launches; each UKD fills a source per Launch</text>
  <text x="237" y="378" text-anchor="middle" font-size="12" fill="#333">Co-designed Launches, selected atomically,</text>
  <text x="237" y="396" text-anchor="middle" font-size="12" fill="#333">run in order on one stream.</text>

  <!-- ===================== RIGHT PANEL: selection composition ===================== -->
  <text x="703" y="26" text-anchor="middle" font-weight="600">Composition (UCD): a pipeline of independent picks</text>
  <rect x="480" y="40" width="445" height="395" rx="8" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>

  <!-- composite engine -->
  <rect x="528" y="64" width="350" height="46" rx="8" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="703" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="12">UCD  PIPELINE_ENGINE</text>
  <text x="703" y="102" text-anchor="middle" font-size="11">declares stages; each resolved separately</text>
  <line x1="703" y1="110" x2="703" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>

  <!-- stages -->
  <rect x="528" y="150" width="350" height="48" rx="8" fill="#ffffff" stroke="#3f9159" stroke-width="1.5"/>
  <text x="544" y="170" font-size="12">transpose_in</text>
  <text x="544" y="188" font-size="10" fill="#555">&#8627; resolves to a UKD, picked by its own heuristic</text>
  <line x1="703" y1="198" x2="703" y2="220" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>
  <text x="716" y="214" font-family="Consolas, monospace" font-size="10" fill="#555">$x_t</text>

  <rect x="528" y="220" width="350" height="48" rx="8" fill="#ffffff" stroke="#3f9159" stroke-width="1.5"/>
  <text x="544" y="240" font-size="12">work (core)</text>
  <text x="544" y="258" font-size="10" fill="#555">&#8627; resolves to a UKD, picked by its own heuristic</text>
  <line x1="703" y1="268" x2="703" y2="290" stroke="#444" stroke-width="1.5" marker-end="url(#arrowCX)"/>
  <text x="716" y="284" font-family="Consolas, monospace" font-size="10" fill="#555">$y_t</text>

  <rect x="528" y="290" width="350" height="48" rx="8" fill="#ffffff" stroke="#3f9159" stroke-width="1.5"/>
  <text x="544" y="310" font-size="12">transpose_out</text>
  <text x="544" y="328" font-size="10" fill="#555">&#8627; resolves to a UKD, picked by its own heuristic</text>

  <!-- caption -->
  <text x="703" y="366" text-anchor="middle" font-size="11" fill="#555">each stage resolves to a UKD from its own KDP</text>
  <text x="703" y="390" text-anchor="middle" font-size="12" fill="#333">Independently authored kernels, each ranked</text>
  <text x="703" y="408" text-anchor="middle" font-size="12" fill="#333">separately, wired by intermediate tensors.</text>

  <!-- ===================== FOOTER ===================== -->
  <rect x="120" y="452" width="700" height="34" rx="8" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="470" y="474" text-anchor="middle" font-size="12" fill="#333">Fused kernel vs. pipeline are separate engines; the existing engine-level selection chooses between them.</text>
</svg>
