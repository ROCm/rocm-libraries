<svg viewBox="0 0 1060 420" width="1060" height="420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowTS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowTSdecline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4553f"/>
    </marker>
  </defs>

  <text x="530" y="32" text-anchor="middle" font-weight="600">Two-stage matching: bind once per engine, then constrain per pack</text>

  <!-- 1. incoming problem graph -->
  <rect x="20" y="122" width="104" height="76" rx="6" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="72" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="10">problem</text>
  <text x="72" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="10">graph</text>
  <text x="72" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#666">op: sdpa_fwd</text>

  <line x1="126" y1="160" x2="148" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrowTS)"/>

  <!-- 2. root-opcode index -->
  <rect x="150" y="122" width="118" height="76" rx="6" fill="#ffffff" stroke="#4a72c4" stroke-width="1.2"/>
  <text x="209" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="10">root-opcode</text>
  <text x="209" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="10">index</text>
  <text x="209" y="186" text-anchor="middle" font-size="9" fill="#666">prunes whole engines</text>

  <line x1="270" y1="160" x2="296" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrowTS)"/>

  <!-- 3. STAGE ONE -->
  <rect x="298" y="64" width="214" height="190" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="312" y="86" font-weight="600" font-size="12">STAGE ONE</text>
  <text x="312" y="102" font-size="9" fill="#666">the UED's graph_match pattern</text>

  <rect x="312" y="112" width="186" height="86" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="405" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="10">resolve op + operands</text>
  <text x="405" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="10">walk the op DAG</text>
  <text x="405" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="10">bind $q $k $v $o ...</text>
  <text x="405" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="10">publish the table</text>

  <text x="405" y="222" text-anchor="middle" font-weight="600" font-size="11" fill="#4a72c4">ONCE PER ENGINE</text>
  <text x="405" y="238" text-anchor="middle" font-weight="600" font-size="11" fill="#4a72c4">PER GRAPH</text>

  <line x1="514" y1="160" x2="538" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrowTS)"/>

  <!-- 4. bound symbol table -->
  <text x="620" y="94" text-anchor="middle" font-weight="600" font-size="11">bound symbol table</text>
  <rect x="540" y="104" width="160" height="112" rx="6" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="554" y="126" font-family="Consolas, monospace" font-size="10">$q $k $v $o</text>
  <text x="554" y="144" font-family="Consolas, monospace" font-size="10">$q.dims[..] .strides</text>
  <text x="554" y="162" font-family="Consolas, monospace" font-size="10">$q.dtype $q.rank</text>
  <text x="554" y="180" font-family="Consolas, monospace" font-size="10">$sdpa_fwd.causal_mask</text>
  <text x="554" y="204" font-size="9" fill="#666">the hand-off artifact</text>

  <line x1="702" y1="160" x2="726" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrowTS)"/>

  <!-- 5. STAGE TWO -->
  <rect x="728" y="64" width="214" height="190" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="742" y="86" font-weight="600" font-size="12">STAGE TWO</text>
  <text x="742" y="102" font-size="9" fill="#666">each pack's UMD criteria</text>

  <rect x="742" y="112" width="186" height="86" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/>
  <text x="835" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="10">pack A: m1 AND m2</text>
  <text x="835" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="10">pack B: m1 AND m3</text>
  <text x="835" y="170" text-anchor="middle" font-size="9" fill="#666">every matcher in a pack</text>
  <text x="835" y="184" text-anchor="middle" font-size="9" fill="#666">MUST pass</text>

  <text x="835" y="222" text-anchor="middle" font-weight="600" font-size="11" fill="#4a72c4">PER PACK</text>
  <text x="835" y="238" text-anchor="middle" font-size="9" fill="#666">memoized per $kernel.* value</text>

  <line x1="944" y1="160" x2="968" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrowTS)"/>

  <!-- 6. catalog -->
  <rect x="970" y="122" width="76" height="76" rx="6" fill="#e6f4ea" stroke="#3f9159" stroke-width="1.5"/>
  <text x="1008" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="10">catalog</text>
  <text x="1008" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#666">kernels</text>
  <text x="1008" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#666">that pass</text>

  <!-- decline path out of stage one -->
  <line x1="405" y1="254" x2="405" y2="294" stroke="#b4553f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowTSdecline)"/>
  <text x="415" y="278" font-size="9" fill="#b4553f">the pattern does not match</text>

  <rect x="298" y="296" width="300" height="60" rx="6" fill="#fbeae8" stroke="#b4553f" stroke-width="1.2"/>
  <text x="448" y="320" text-anchor="middle" font-weight="600" font-size="11" fill="#b4553f">decline the engine outright</text>
  <text x="448" y="340" text-anchor="middle" font-size="9" fill="#666">no pack consulted, no UMD loaded, no criteria evaluated</text>

  <text x="530" y="392" text-anchor="middle" font-style="italic" fill="#444">Stage one binds once per engine per graph; stage two runs each pack's criteria over that one binding (RFC 0018 §1, §8).</text>
</svg>
