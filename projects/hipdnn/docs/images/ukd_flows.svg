<svg viewBox="0 0 920 540" width="920" height="540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="145" y="24" text-anchor="middle" font-weight="600" fill="#333">AUTHORING (source tree)</text>
  <text x="460" y="24" text-anchor="middle" font-weight="600" fill="#333">BUILD-TIME (AOT)</text>
  <text x="775" y="24" text-anchor="middle" font-weight="600" fill="#333">RUNTIME</text>

  <!-- Authoring box -->
  <rect x="20" y="36" width="250" height="158" rx="8" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="36" y="62" font-size="12" fill="#333">descriptor files:</text>
  <text x="36" y="84" font-family="Consolas, monospace" font-size="12">  KDP: matchers + engine</text>
  <text x="36" y="106" font-family="Consolas, monospace" font-size="12">       + UDD + kernels</text>
  <text x="36" y="128" font-family="Consolas, monospace" font-size="12">  UED: heuristic + KMD</text>
  <text x="36" y="150" font-family="Consolas, monospace" font-size="12">kernel sources / &lt;arch&gt;</text>

  <!-- Build-time box -->
  <rect x="335" y="36" width="250" height="140" rx="8" fill="#e8f0fe" stroke="#4a72c4" stroke-width="1.5"/>
  <text x="351" y="64" font-size="12">compile per architecture</text>
  <text x="351" y="82" font-family="Consolas, monospace" font-size="11">→ code objects</text>
  <text x="351" y="106" font-size="12">pack + manifest</text>
  <text x="351" y="124" font-size="11" fill="#555">(per arch)</text>
  <text x="351" y="148" font-size="12">install beside provider</text>
  <text x="351" y="166" font-size="11" fill="#555">+ compiled descriptors</text>

  <!-- Runtime box -->
  <rect x="650" y="36" width="250" height="140" rx="8" fill="#fef7e0" stroke="#c99a2e" stroke-width="1.5"/>
  <text x="775" y="62" text-anchor="middle" font-size="12">hip-kernel-provider</text>
  <rect x="668" y="76" width="214" height="86" rx="6" fill="#fffdf5" stroke="#c99a2e" stroke-width="1"/>
  <text x="775" y="98" text-anchor="middle" font-weight="600" font-size="12">Generic engine</text>
  <text x="682" y="120" font-family="Consolas, monospace" font-size="11">load KDPs → build engines</text>
  <text x="682" y="138" font-family="Consolas, monospace" font-size="11">match: shared, cached, pruned</text>
  <text x="682" y="156" font-family="Consolas, monospace" font-size="11">UHD → kernel-selector</text>

  <!-- arrows across top row -->
  <line x1="270" y1="106" x2="335" y2="106" stroke="#444" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="302" y="98" text-anchor="middle" font-size="10" fill="#333">validate</text>
  <line x1="585" y1="106" x2="650" y2="106" stroke="#444" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="617" y="98" text-anchor="middle" font-size="10" fill="#333">ship</text>

  <!-- runtime-drop box -->
  <rect x="335" y="210" width="250" height="60" rx="8" fill="#f3e8fd" stroke="#8e5bc4" stroke-width="1.5"/>
  <text x="460" y="234" text-anchor="middle" font-size="12">runtime-drop folder</text>
  <text x="460" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="10">*.kdp + code objects (or JIT source)</text>
  <!-- runtime-drop -> runtime provider (enters bottom edge left of the core downflow) -->
  <path d="M585 232 L710 232 L710 176" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- hipDNN core box -->
  <rect x="110" y="310" width="700" height="60" rx="8" fill="#eef1f5" stroke="#7f8a99" stroke-width="1.5"/>
  <text x="460" y="334" text-anchor="middle" font-size="12" font-weight="600">hipDNN core (unchanged)</text>
  <text x="460" y="356" text-anchor="middle" font-family="Consolas, monospace" font-size="11">applicable engines → engine-level heuristics → config → execution plan → execute</text>
  <!-- runtime provider -> core -->
  <line x1="775" y1="176" x2="775" y2="310" stroke="#444" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- generic launcher box -->
  <rect x="110" y="410" width="700" height="90" rx="8" fill="#fdecec" stroke="#c65353" stroke-width="1.5"/>
  <text x="460" y="436" text-anchor="middle" font-size="12" font-weight="600">Generic launcher</text>
  <text x="460" y="460" text-anchor="middle" font-family="Consolas, monospace" font-size="11">match graph → bind args → eval grid/block/shared/workspace</text>
  <text x="460" y="480" text-anchor="middle" font-family="Consolas, monospace" font-size="11">→ load code object → launch kernel</text>
  <!-- core -> launcher -->
  <line x1="460" y1="370" x2="460" y2="410" stroke="#444" stroke-width="1.5" marker-end="url(#arrow5)"/>
</svg>
