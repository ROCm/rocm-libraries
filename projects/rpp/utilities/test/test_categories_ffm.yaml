# RPP emulator test categories (see test_categories.yaml). Applied only for HIP builds:
# a CPU build generates no HIP cases, so these filters would select nothing.

test_categories:
  # Emulator tiers are HIP-only: HOST cases already run on native runners.
  ffm-quick:
    description: "HIP-only subset of quick for emulator runs"
    test_patterns:
      - "HandleTest.*HIP*"
      - "*/*HIP_U8toU8_PKD3_FullRoi_*"
      - "*/*HIP_F32toF32_PKD3_FullRoi_*"
      - "Image_DataExchange/ColorToGreyscaleTest.*HIP_U8toU8_PKD3toPLN1_FullRoi_*"
      - "Image_Filter/SobelFilterTest.*HIP_U8toU8_PLN1_FullRoi_*"
      - "Misc_*/*HIP_*_2D_*2x24x32"
      - "Voxel_*/*HIP_*_NCDHW1_FullRoi_XYZWHD_*"
    labels:
      - "ffm-quick"

  ffm-standard:
    description: "HIP-only full correctness grid for emulator runs"
    test_patterns:
      - "*HIP*"
    labels:
      - "ffm-standard"

  ffm-comprehensive:
    description: "Same as ffm-standard until an extended grid exists"
    test_patterns:
      - "*HIP*"
    labels:
      - "ffm-comprehensive"

  ffm-full:
    description: "Same as ffm-comprehensive"
    test_patterns:
      - "*HIP*"
    labels:
      - "ffm-full"

execution_settings:
  default_timeout: 1800
  timeout_multiplier: 1
  category_timeouts:
    ffm-quick: 300
    ffm-standard: 1800
    ffm-comprehensive: 7200
    ffm-full: 14400
