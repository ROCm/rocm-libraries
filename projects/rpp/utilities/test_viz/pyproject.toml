[project]
name = "rpp-test-viz"
version = "0.1.0"
description = "Visual debugger for rpp_tests_capture comparison bundles"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
rpp-test-viz = "rpp_test_viz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpp_test_viz"]
