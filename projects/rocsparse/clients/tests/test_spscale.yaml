---
include: rocsparse_common.yaml


Definitions:
  - &alpha_range_quick
    - { alpha:   2.0, alphai:  1.0 }

  - &alpha_range_checkin
    - { alpha:   0.0, alphai:  0.0 }
    - { alpha:   3.0, alphai:  0.5 }
    - { alpha:  -1.5, alphai: -0.8 }

Tests:
# C = alpha * A

# Quick - all supported formats (COO, COO AoS, CSR, CSC, BSR, ELL, SELL, BELL).
- name: spscale
  category: quick
  function: spscale
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: [300, 512]
  N: [300, 254]
  block_dim: [2]
  sell_slice_size: [8]
  alpha_alphai: *alpha_range_quick
  baseA: [rocsparse_index_base_zero]
  baseC: [rocsparse_index_base_zero]
  formatA: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_bsr,
            rocsparse_format_ell,
            rocsparse_format_sell]
  matrix: [rocsparse_matrix_random]

# Quick - Blocked-ELL across a couple of block sizes.
- name: spscale
  category: quick
  function: spscale
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: [300, 512]
  N: [300, 254]
  block_dim: [2, 4]
  alpha_alphai: *alpha_range_quick
  baseA: [rocsparse_index_base_zero]
  baseC: [rocsparse_index_base_zero]
  formatA: [rocsparse_format_bell]
  matrix: [rocsparse_matrix_random]

- name: spscale_file
  category: quick
  function: spscale
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions
  M: 1
  N: 1
  alpha_alphai: *alpha_range_quick
  baseA: [rocsparse_index_base_one]
  baseC: [rocsparse_index_base_one]
  formatA: [rocsparse_format_csr]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos1,
             nos2,
             nos3,
             nos4,
             nos5,
             nos6,
             nos7]

# Pre-checkin
- name: spscale_bad_arg
  category: pre_checkin
  function: spscale_bad_arg
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real

- name: spscale
  category: pre_checkin
  function: spscale
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M: [2000]
  N: [1956]
  block_dim: [3]
  sell_slice_size: [16]
  alpha_alphai: *alpha_range_checkin
  baseA: [rocsparse_index_base_zero]
  baseC: [rocsparse_index_base_zero]
  formatA: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_bsr,
            rocsparse_format_ell,
            rocsparse_format_sell]
  matrix: [rocsparse_matrix_random]

- name: spscale
  category: pre_checkin
