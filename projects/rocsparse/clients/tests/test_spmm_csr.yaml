---
include: rocsparse_common.yaml
Definitions:
  - &alpha_beta_range_quick
    - { alpha:   1.0, beta: -1.0, alphai:  1.0, betai: -0.5 }

  - &alpha_beta_range_checkin
    - { alpha:   0.0, beta:  1.0,  alphai:  1.5, betai:  0.5 }

  - &alpha_beta_range_nightly
    - { alpha:  -0.5, beta:  0.5,  alphai:  1.0, betai: -0.5 }
    - { alpha:  -1.0, beta: -0.5,  alphai:  0.0, betai:  0.0 }
  - &alpha_beta_range_stress
    - { alpha:   1.0, beta:  0.0, alphai:  0.0, betai:  0.0 }

Tests:
- name: spmm_csr_bad_arg
  category: pre_checkin
  function: spmm_csr_bad_arg
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real

# Default-algorithm auto-selection. Drives the full buffer_size -> preprocess ->
# compute pipeline on an extremely row-skewed and an extremely uniform matrix and
# checks the default result against the analytic product and both explicit
# load-balanced kernels. The test builds its own matrices, so it ignores the
# index/precision below.
- name: spmm_csr_extra
  category: quick
  function: spmm_csr_extra
  indextype: *i32
  precision: *double_only_precisions

