---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }
    - { M: 124, N: 124 }

  - &M_N_range_checkin
    - { M:   0, N:   0 }
    - { M:   1, N:   1 }
    - { M:   2, N:   2 }
    - { M:   8, N:   8 }

  - &M_N_range_nightly
    - { M:  9381, N:  9381 }
    - { M: 37017, N: 37017 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }
    - { alpha:  -0.5, alphai:  0.1 }

  - &alpha_range_checkin
    - { alpha:   3.0, alphai: -1.0 }

  - &alpha_range_nightly
    - { alpha:   0.0,  alphai:  0.05 }
    - { alpha:  -0.02, alphai: -0.1 }

Tests:
# Quick
- name: bsrsm
  category: quick
  function: bsrsm
  precision: *single_only_precisions
  M_N:
    - { M: 20, N: 20 }
  K: [4]
  block_dim: [2]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  direction: [rocsparse_direction_row]
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_zero]

- name: bsrsm
  category: quick
  function: bsrsm
  precision: *single_only_precisions
  M_N:
    - { M: 768, N: 768 }
    - { M: 1536, N: 1536 }
    - { M: 3072, N: 3072 }
  K: [8, 32]
  block_dim: [4]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  direction: [rocsparse_direction_row]
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random, rocsparse_matrix_tridiagonal]

- name: bsrsm
  category: quick
  function: bsrsm
  precision: *single_only_precisions
  M_N:
    - { M: 8192, N: 8192 }
    - { M: 16384, N: 16384 }
    - { M: 24576, N: 24576 }
  K: [16]
  block_dim: [4]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  direction: [rocsparse_direction_row]
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
