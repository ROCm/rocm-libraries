  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_tridiagonal]

- name: bsrsm
  category: quick
  function: bsrsm
  precision: *single_only_precisions
  M: 1
  N: 1
  K: [8]
  block_dim: [4]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  direction: [rocsparse_direction_row]
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos3, qc2534, mplate]

# block_dim 32 selects the large-kernel case 32 (next power of two, clamped to
# the wavefront). Both fill modes exercise the upper and lower launches.
- name: bsrsm
  category: quick
  function: bsrsm
  precision: *single_only_precisions
  M_N:
    - { M: 64, N: 64 }
  K: [1]
  block_dim: [32]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  direction: [rocsparse_direction_row]
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower, rocsparse_fill_mode_upper]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_tridiagonal]

# Pre_checkin
- name: bsrsm_bad_arg
  category: pre_checkin
  function: bsrsm_bad_arg
  precision: *single_double_precisions_complex_real

