# rocSPARSE Test Categories Configuration
# Organizes GTest suites into CTest categories for CI/CD pipeline efficiency.
#
# The rocsparse-test binary uses INSTANTIATE_TEST_SUITE_P with category prefixes:
#   quick/testclass.category/suffix
#   pre_checkin/testclass.category/suffix
#   nightly/testclass.category/suffix
#   stress/testclass.category/suffix
#   known_bug/testclass.category/suffix

test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min)"
    test_patterns:
      - "quick/*"
    exclude:
      - "*known_bug*"
    labels:
      - "quick"
      - "pre-commit"

  pre_checkin:
    description: "Pre-checkin validation (target: < 30 min)"
    test_patterns:
      - "quick/*"
      - "pre_checkin/*"
    exclude:
      - "*known_bug*"
    labels:
      - "pre_checkin"

  nightly:
    description: "Nightly comprehensive tests (target: < 4 hours)"
    test_patterns:
      - "quick/*"
      - "pre_checkin/*"
      - "nightly/*"
    exclude:
      - "*known_bug*"
    labels:
      - "nightly"

  stress:
    description: "Stress tests with large matrices"
    test_patterns:
      - "stress/*"
    exclude:
      - "*known_bug*"
    labels:
      - "stress"

# Uncomment and populate to exclude specific tests on certain GPU architectures.
