---
include: rocsparse_common.yaml

Tests:

- name: dnmat_copy_data_bad_arg
  category: pre_checkin
  function: dnmat_copy_data_bad_arg
  precision: *single_double_precisions_complex_real

- name: dnmat_copy_data
  category: quick
  function: dnmat_copy_data
  precision: *single_double_precisions_complex_real
  M: [3, 4]
  N: [4, 5]
  alpha: [2, -2]
  alphai: [0]
  orderB: *all_rocsparse_order
  orderC: *all_rocsparse_order
  batch_count_C: [4, 8]
  batch_count_B: [-1]
  batch_count_A: [-1, 1]
  direction: *all_rocsparse_direction

- name: dnmat_copy_data
  category: pre_checkin
  function: dnmat_copy_data
  precision: *single_double_precisions_complex_real
  alpha: [1,2,-4,8]
  alphai: [0]
  M: [0, 16]
  N: [0, 32]
  orderB: *all_rocsparse_order
  orderC: *all_rocsparse_order
  batch_count_C: [1, 2]
  batch_count_B: [-1, 1]
  batch_count_A: [-1, 1]
  direction: *all_rocsparse_direction

- name: dnmat_copy_data
  category: nightly
  function: dnmat_copy_data
  precision: *single_double_precisions_complex_real
  M: [128]
  N: [32, 64]
  alpha: [-2,4,-8]
  alphai: [0]
  orderB: *all_rocsparse_order
  orderC: *all_rocsparse_order
  direction: *all_rocsparse_direction
  batch_count_C: [3, 32]
  batch_count_B: [-1, 1]
  batch_count_A: [-1, 1]
