---
include: rocsparse_common.yaml

Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }
    - { M: 187, N: 187 }

  - &M_N_range_checkin
    - { M:   0, N:   0 }
    - { M:  79, N:  79 }
    - { M: 361, N: 361 }

  - &M_N_range_nightly
    - { M:   9381, N:   9381 }
    - { M:  37017, N:  37017 }

Tests:
- name: fsai_bad_arg
  category: pre_checkin
  function: fsai_bad_arg
  precision: *single_double_precisions_complex_real
  formatA: [rocsparse_format_csr]

