---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }
    - { M: 124, N: 124 }

  - &M_N_range_checkin
    - { M:   0, N:   0 }
    - { M:   1, N:   1 }
    - { M:   2, N:   2 }
    - { M:   8, N:   8 }

  - &M_N_range_checkin_1
    - { M:  79, N:  79 }
    - { M: 152, N: 152 }

  - &M_N_range_nightly
    - { M:  9381, N:  9381 }
    - { M: 37017, N: 37017 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }
    - { alpha:  -0.5, alphai:  0.1 }

  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }
    - { alpha:   3.0, alphai: -1.0 }

  - &alpha_range_nightly
    - { alpha:   0.0,  alphai:  0.05 }
    - { alpha:  -0.02, alphai: -0.1 }

  - &alpha_range_nightly_one
    - { alpha:   1.0,  alphai:  0.0 }

  - &alpha_range_stress
    - { alpha:   1.0, alphai:  0.0}

Tests:
# Quick
- name: spsm_csc
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_only_precisions_complex
  M_N:
    - { M: 20, N: 20 }
  K: [4]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_conjugate_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: spsm_csc
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_only_precisions
  M_N:
    - { M: 768, N: 768 }
    - { M: 1536, N: 1536 }
    - { M: 3072, N: 3072 }
  K: [8, 32]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random, rocsparse_matrix_tridiagonal]

- name: spsm_csc
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_only_precisions
  M_N:
    - { M: 16384, N: 16384 }
    - { M: 32768, N: 32768 }
    - { M: 49152, N: 49152 }
    - { M: 65536, N: 65536 }
  K: [16]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_pentadiagonal]

- name: spsm_csc
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_only_precisions
  M: 1
  N: 1
  K: [8]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos3, qc2534, mplate]

# nrhs == 0 returns from cscsm_compute before the CSR solve.
- name: spsm_csc
  category: quick
  function: spsm_csc
  indextype: *i32
  precision: *single_only_precisions
  M_N:
    - { M: 16, N: 16 }
  K: [0]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai:
    - { alpha: 1.0, alphai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_column]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_tridiagonal]

- name: spsm_csc
  category: quick
  function: spsm_csc_extra

# Pre_checkin
- name: spsm_csc_bad_arg
  category: pre_checkin
  function: spsm_csc_bad_arg
  precision: *single_double_precisions_complex_real

- name: spsm_csc
  category: pre_checkin
  function: spsm_csc
  indextype: *i64
  precision: *single_only_precisions
  M_N: *M_N_range_checkin
  K: [16, 64]
  ld_multiplier_B: [1]
  ld_multiplier_C: [4]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none, rocsparse_operation_transpose]
  orderB: [rocsparse_order_row, rocsparse_order_column]
  orderC: [rocsparse_order_row, rocsparse_order_column]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_upper, rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: spsm_csc
  category: pre_checkin
  function: spsm_csc
  indextype: *i32
  precision: *double_only_precisions
  M_N: *M_N_range_checkin
  K: [33, 129]
  ld_multiplier_B: [1]
  ld_multiplier_C: [4]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none, rocsparse_operation_transpose]
  orderB: [rocsparse_order_row, rocsparse_order_column]
  orderC: [rocsparse_order_row, rocsparse_order_column]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_upper, rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: spsm_csc
  category: pre_checkin
  function: spsm_csc
  indextype: *i64i32
  precision: *single_double_precisions
  M_N: *M_N_range_checkin_1
  K: [7, 17]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_transpose]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: spsm_csc_file
  category: pre_checkin
  function: spsm_csc
  indextype: *i64
  precision: *single_double_precisions
  K: [141]
  ld_multiplier_B: [3]
  ld_multiplier_C: [2]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_one]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos1,
             nos5,
             nos7]

# Nightly
- name: spsm_csc
  category: nightly
  function: spsm_csc
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_nightly
  K: [32, 135, 280]
  ld_multiplier_B: [3]
  ld_multiplier_C: [3]
  alpha_alphai: *alpha_range_nightly
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  spsm_alg: [rocsparse_spsm_alg_default]
  matrix: [rocsparse_matrix_random]
