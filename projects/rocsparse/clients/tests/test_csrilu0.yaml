---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }
    - { M: 187, N: 187 }

  - &M_N_range_checkin
    - { M:  -1, N:  -1 }
    - { M:   0, N:   0 }
    - { M:  79, N:  79 }
    - { M: 361, N: 361 }

  - &M_N_range_nightly
    - { M:   9381, N:   9381 }
    - { M:  37017, N:  37017 }
    - { M: 505193, N: 505193 }

Tests:
# Quick
- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M: [50]
  N: [50]
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_zero]

- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M: [50]
  N: [50]
  numericboost: [1]
  boosttol: [0.5]
  boostval: [1.0]
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random]

- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M_N:
    - { M: 1536, N: 1536 }
    - { M: 3072, N: 3072 }
    - { M: 6144, N: 6144 }
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random, rocsparse_matrix_tridiagonal, rocsparse_matrix_pentadiagonal]

- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M_N:
    - { M: 768, N: 768 }
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random]
  matrix_init_kind: [rocsparse_matrix_init_kind_tunedavg]

- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M_N:
    - { M: 20480, N: 20480 }
    - { M: 32768, N: 32768 }
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_tridiagonal, rocsparse_matrix_pentadiagonal]

- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_only_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos3, nos7, qc2534, mplate]

# sme3Dc max row nnz is 405, which on a 32-wide wavefront selects the hash
# kernel's max_nnz < 16 * wavefront arm (and not the smaller arms).
- name: csrilu0
  category: quick
  function: csrilu0
  precision: *single_double_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [sme3Dc]

# Pre_checkin
- name: csrilu0_bad_arg
  category: pre_checkin
  function: csrilu0_bad_arg
  precision: *single_double_precisions_complex_real

- name: csrilu0
  category: pre_checkin
  function: csrilu0
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_checkin
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_random]

- name: csrilu0_file
  category: pre_checkin
  function: csrilu0
  precision: *single_double_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [mc2depi,
             nos1,
             nos3,
             nos5,
             nos7]

- name: csrilu0_file
  category: pre_checkin
  function: csrilu0
  precision: *single_double_precisions_complex
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [Chevron3]

- name: csrilu0_extra
  category: pre_checkin
  function: csrilu0_extra

# Nightly
- name: csrilu0
  category: nightly
  function: csrilu0
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_nightly
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_random]

- name: csrilu0_file
  category: nightly
  function: csrilu0
  precision: *single_double_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [bmwcra_1,
             amazon0312,
             sme3Dc,
             webbase-1M]

- name: csrilu0_file
  category: nightly
  function: csrilu0
  precision: *single_double_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [Chebyshev4]
  skip_hardware: gfx940, gfx941

- name: csrilu0_file
  category: nightly
  function: csrilu0
  precision: *single_double_precisions_complex
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [Chevron4]

# Stress

- name: csrilu0_file
  category: stress
  function: csrilu0
  precision: *single_double_precisions
  M: 1
  N: 1
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [ASIC_320k]
  skip_hardware: gfx940, gfx941

# Known_bug

- name: csrilu0_graph_test
  # known_bug: hipGraphLaunch OOMs (hipErrorOutOfMemory) on memory-constrained
  # GPUs such as the gfx110X family. See ROCm/rocm-libraries#9143. Restore to
  # pre_checkin once the graph capture/launch memory usage is fixed.
  category: known_bug
  function: csrilu0
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  transA: [rocsparse_operation_none]
  apol: [rocsparse_analysis_policy_reuse, rocsparse_analysis_policy_force]
  spol: [rocsparse_solve_policy_auto]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  matrix: [rocsparse_matrix_random]
  graph_test: true
