---
include: rocsparse_common.yaml

Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }

  - &M_N_range_checkin
    - { M:   1, N:   1 }
    - { M:   8, N:   8 }

  - &M_N_range_checkin_1
    - { M:  79, N:  79 }
    - { M: 152, N: 152 }

  - &M_N_range_nightly
    - { M: 1024, N: 1024 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }

  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }
    - { alpha:   3.0, alphai: -1.0 }

  - &alpha_range_nightly
    - { alpha:  -0.5, alphai:  0.1 }
    - { alpha:   0.0,  alphai:  0.05 }
    - { alpha:  -0.02, alphai: -0.1 }

  - &alpha_range_nightly_one
    - { alpha:   1.0,  alphai:  0.0 }


Tests:
# Quick
- name: sptrsm
  category: quick
  function: sptrsm
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  K: [8]
  alpha_alphai: *alpha_range_quick
  transA: [rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]
  batch_count_C: [4]
  batch_count_B: [-1]
  batch_count_A: [-1]
  formatA: [rocsparse_format_csr, rocsparse_format_csc, rocsparse_format_coo]
  direction: [rocsparse_direction_row]

