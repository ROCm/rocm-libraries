---
include: rocsparse_common.yaml


Definitions:
  - &alpha_beta_range_quick
    - { alpha:   1.0, beta: -1.0, alphai:  1.0, betai: -0.5 }
  - &alpha_beta_range_pre_checkin
    - { alpha:   2.0, beta: -2.0, alphai:  1.0, betai: -0.5 }
  - &alpha_beta_range_nightly
    - { alpha:   2.0, beta: -2.0, alphai:  1.0, betai: -0.5 }

Tests:
# Quick
- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32
  precision: *single_only_precisions
  M: [35]
  N: [17]
  K: [8]
  alpha_beta:
    - { alpha: 0.0, beta: 1.0, alphai: 0.0, betai: 0.0 }
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_random]
  formatC: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_ell]

# nnz == 0 returns in both preprocess and compute. Any one format reaches it.
- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32
  precision: *single_only_precisions
  M: [32]
  N: [32]
  K: [8]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_zero]
  formatC: [rocsparse_format_csr]

- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32
  precision: *single_only_precisions
  M: [1024, 4096]
  N: [1024, 4096]
  K: [32, 128]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_random, rocsparse_matrix_tridiagonal]
  formatC: [rocsparse_format_csr, rocsparse_format_coo]

- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32
  precision: *single_only_precisions
  M: 1
  N: 1
  K: [32]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos3, qc2534, mplate]
  formatC: [rocsparse_format_csr]

# Default-algorithm K dispatch in each format file: k>2, k>1, and k==1.
# k>4 is already hit by the K=8/32/128 cases above.
- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32
  precision: *single_only_precisions
  M: [8]
  N: [8]
  K: [1, 2, 4]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_random]
  formatC: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_ell]

# All-half default algorithm. pre_checkin half uses the dense algorithm, which
# does not instantiate the per-format sddmm_st<_Float16> kernels.
- name: sddmm
  category: quick
  function: sddmm
  indextype: *i32i32_i64i32_i64i64
  precision: *float16_float16_float16_float16_abct_precision
  M: [8]
  N: [8]
  K: [8]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  baseC: [rocsparse_index_base_zero]
  order: [rocsparse_order_column]
  orderB: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_random]
  formatC: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_ell]

# Pre_checkin
