  graph_test: true

- name: sddmm_file
  category: pre_checkin
  function: sddmm
  indextype: *i32
  precision: *single_double_precisions
  M: 1
  N: 1
  K: [5, 9]
  alpha_beta: *alpha_beta_range_pre_checkin
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_transpose]
  baseA: [rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  order: [rocsparse_order_column]
  filename: [nos1,
             nos2,
             nos3,
             nos4,
             nos5,
             nos6,
             nos7]
  formatC: [rocsparse_format_coo,rocsparse_format_coo_aos,rocsparse_format_csr,rocsparse_format_csc,rocsparse_format_ell]

- name: sddmm_file
  category: pre_checkin
  function: sddmm
  indextype: *i32
  precision: *single_double_precisions_complex
  M: 1
  N: 1
  K: [32, 64]
  alpha_beta: *alpha_beta_range_pre_checkin
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_transpose]
  baseA: [rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  order: [rocsparse_order_column]
  filename: [mplate, mc2depi]
  formatC: [rocsparse_format_coo,rocsparse_format_coo_aos,rocsparse_format_csr,rocsparse_format_csc,rocsparse_format_ell]

# transpose x order x base variety (default alg) across all formats.
# Moved to pre_checkin: this is the largest sddmm coverage block (full
# transA x transB x baseC x order x orderB x format sweep); keeping it in
# quick pushed quick/sddmm well past the ~5s per-routine quick budget.
- name: sddmm
  category: pre_checkin
  function: sddmm
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions
  M: [42]
  N: [23]
  K: [16]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  transB: [rocsparse_operation_none, rocsparse_operation_transpose]
  baseC: [rocsparse_index_base_zero, rocsparse_index_base_one]
  order: [rocsparse_order_row, rocsparse_order_column]
  orderB: [rocsparse_order_row, rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default]
  matrix: [rocsparse_matrix_random]
  formatC: [rocsparse_format_coo,
            rocsparse_format_coo_aos,
            rocsparse_format_csr,
            rocsparse_format_csc,
            rocsparse_format_ell]

# Nightly
- name: sddmm
  category: nightly
  function: sddmm
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions
  M: [1000]
  N: [1000]
  K: [40000]
  alpha_beta: *alpha_beta_range_nightly
  transA: [rocsparse_operation_none]
  baseA: [rocsparse_index_base_one]
  transB: [rocsparse_operation_none]
  order: [rocsparse_order_column]
  sddmm_alg: [rocsparse_sddmm_alg_default, rocsparse_sddmm_alg_dense]
  matrix: [rocsparse_matrix_random]
  formatC: [rocsparse_format_coo,rocsparse_format_coo_aos,rocsparse_format_csr,rocsparse_format_csc,rocsparse_format_ell]

- name: sddmm
  category: nightly
  function: sddmm
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions
  M: [40000]
  N: [40000]
  K: [32, 64]
  alpha_beta: *alpha_beta_range_nightly
  transA: [rocsparse_operation_none]
