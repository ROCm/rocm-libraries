---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }

  - &M_N_range_checkin
    - { M:   1, N:   1 }
    - { M:   8, N:   8 }

  - &M_N_range_checkin_1
    - { M:  79, N:  79 }
    - { M: 152, N: 152 }

  - &M_N_range_nightly
    - { M:  9381, N:  9381 }
    - { M: 37017, N: 37017 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }

  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }

  - &alpha_range_nightly
    - { alpha:  -0.5, alphai:  0.1 }
    - { alpha:   0.0,  alphai:  0.05 }
    - { alpha:  -0.02, alphai: -0.1 }

  - &alpha_range_nightly_one
    - { alpha:   1.0,  alphai:  0.0 }

  - &alpha_range_stress
    - { alpha:   1.0, alphai:  0.0}

Tests:
- name: sptrsm_csc
  category: pre_checkin
  function: sptrsm_csc
  indextype: *i64
  precision: *double_only_precisions
  M_N: *M_N_range_checkin
  K: [1]
  ld_multiplier_B: [2]
  ld_multiplier_C: [2]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_zero]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc_bad_arg
  category: pre_checkin
  function: sptrsm_csc_bad_arg
  precision: *single_double_precisions_complex_real

- name: sptrsm_csc
  category: pre_checkin
  function: sptrsm_csc
  indextype: *i32
  precision: *single_double_precisions
  M_N: *M_N_range_checkin
  K: [8]
  ld_multiplier_B: [1]
  ld_multiplier_C: [4]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_transpose]
  transB: [rocsparse_operation_transpose]
  orderB: [rocsparse_order_row]
  orderC: *all_rocsparse_order
  diag: [rocsparse_diag_type_unit]
  uplo: *all_rocsparse_fill_mode
  baseA: *all_rocsparse_index_base
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc_diagonal
  category: pre_checkin
  function: sptrsm_csc
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  K: [1, 73]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none, rocsparse_operation_transpose, rocsparse_operation_conjugate_transpose]
  transB: [rocsparse_operation_none, rocsparse_operation_transpose]
  orderB: [rocsparse_order_column, rocsparse_order_row]
  orderC: [rocsparse_order_column, rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit, rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_diagonal]
  baseA: [rocsparse_index_base_zero, rocsparse_index_base_one]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc
  category: pre_checkin
  function: sptrsm_csc
  indextype: *i64i32
  precision: *single_double_precisions
  M_N: *M_N_range_checkin_1
  K: [7]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_transpose]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_zero]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc_file
  category: pre_checkin
  function: sptrsm_csc
  indextype: *i64i32
  precision: *single_double_precisions
  K: [141]
  ld_multiplier_B: [3]
  ld_multiplier_C: [2]
  alpha_alphai: *alpha_range_checkin
  transA: [rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_one]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [nos1,
             mplate]

- name: sptrsm_csc
  category: quick
  function: sptrsm_csc
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  K: [32, 96]
  ld_multiplier_B: [1]
  ld_multiplier_C: [1]
  alpha_alphai: *alpha_range_quick
  transA: [rocsparse_operation_transpose]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc_file
  category: quick
  function: sptrsm_csc
  indextype: *i32i32_i64i32_i64i64
  precision: *double_only_precisions_complex
  M: 1
  N: 1
  K: [77]
  ld_multiplier_B: [1]
  ld_multiplier_C: [3]
  alpha_alphai: *alpha_range_quick
  transA: [rocsparse_operation_conjugate_transpose]
  transB: [rocsparse_operation_none, rocsparse_operation_conjugate_transpose]
  orderB: [rocsparse_order_column]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_upper]
  baseA: [rocsparse_index_base_one]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_file_rocalution]
  filename: [mplate]

- name: sptrsm_csc
  category: nightly
  function: sptrsm_csc
  indextype: *i32i32_i64i32_i64i64
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_nightly
  K: [32, 135, 280]
  ld_multiplier_B: [3]
  ld_multiplier_C: [3]
  alpha_alphai: *alpha_range_nightly
  transA: [rocsparse_operation_none]
  transB: [rocsparse_operation_none]
  orderB: [rocsparse_order_row]
  orderC: [rocsparse_order_row]
  diag: [rocsparse_diag_type_non_unit]
  uplo: [rocsparse_fill_mode_lower]
  baseA: [rocsparse_index_base_zero]
  sptrsm_alg: [rocsparse_sptrsm_alg_default]
  matrix: [rocsparse_matrix_random]

- name: sptrsm_csc
  category: quick
  function: sptrsm_csc_extra
