---
include: rocsparse_common.yaml

Definitions:
  - &alpha_beta_range_quick
    - { alpha:   1.0, beta: -1.0, alphai:  1.0, betai: -0.5 }
    - { alpha:  -0.5, beta:  0.5, alphai: -0.5, betai:  1.0 }

  - &alpha_beta_range_checkin
    - { alpha:   2.0, beta:  0.0,  alphai:  1.5, betai:  0.5 }
    - { alpha:   2.0, beta:  0.67, alphai: -1.0, betai:  1.5 }

  - &alpha_beta_range_nightly
    - { alpha:   0.0, beta:  0.0,  alphai:  1.5, betai:  0.5 }
    - { alpha:   2.0, beta:  0.67, alphai:  0.0, betai:  1.5 }

Tests:
- name: spmv_sell_bad_arg
  category: pre_checkin
  function: spmv_sell_bad_arg
  indextype: *i32_i64
  precision: *single_double_precisions_complex_real

- name: spmv_sell
  category: quick
  function: spmv_sell
  indextype: *i32
  precision: *single_double_precisions_complex_real
  M: [300]
  N: [300]
  sell_slice_size: [1, 2]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none, rocsparse_operation_transpose, rocsparse_operation_conjugate_transpose]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_zero]

- name: spmv_sell
  category: quick
  function: spmv_sell
  indextype: *i32_i64
  precision: *single_double_precisions_complex_real
  M: [44, 170]
  N: [89, 243]
  sell_slice_size: [1, 2, 3]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none, rocsparse_operation_transpose, rocsparse_operation_conjugate_transpose]
  baseA: [rocsparse_index_base_zero]
  matrix: [rocsparse_matrix_random]

- name: spmv_sell_file
  category: quick
  function: spmv_sell
  indextype: *i32_i64
  precision: *double_only_precisions
  M: 1
  N: 1
  sell_slice_size: [4, 5, 6]
  alpha_beta: *alpha_beta_range_quick
  transA: [rocsparse_operation_none, rocsparse_operation_transpose]
  baseA: [rocsparse_index_base_one]
  matrix: [rocsparse_matrix_file_rocalution]
