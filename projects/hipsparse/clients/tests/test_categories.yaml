# hipSPARSE Test Categories Configuration
# Organizes GTest suites into CTest categories for CI/CD pipeline efficiency.
#
# The hipsparse-test binary uses INSTANTIATE_TEST_SUITE_P with category prefixes:
#   quick/testclass.category/suffix
#   pre_checkin/testclass.category/suffix
#   nightly/testclass.category/suffix
#   stress/testclass.category/suffix
#   known_bug/testclass.category/suffix

test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min)"
    test_patterns:
      - "quick/*"
    exclude:
      - "*known_bug*"
    labels:
      - "quick"
      - "pre-commit"

  standard:
    description: "Pre-checkin validation (target: < 30 min)"
    test_patterns:
      - "quick/*"
      - "pre_checkin/*"
    exclude:
      - "*known_bug*"
    labels:
      - "standard"
      - "pr"

  comprehensive:
    description: "Nightly comprehensive tests (target: < 4 hours)"
    test_patterns:
      - "quick/*"
      - "pre_checkin/*"
      - "nightly/*"
    exclude:
      - "*known_bug*"
    labels:
      - "comprehensive"
      - "nightly"

  full:
    description: "Test full suite including stress tests"
    test_patterns:
      - "quick/*"
      - "pre_checkin/*"
      - "nightly/*"
      - "stress/*"
    exclude:
      - "*known_bug*"
    labels:
      - "full"
      - "weekly"

  ffm-quick:
    description: "Quick level1 and level2 tests only"
    test_patterns:
      - "quick/*.level1*"
      - "quick/*.level2*"
      - "quick/spmv_csr*"
      - "quick/spmv_coo*"
      - "quick/spsv_csr*"
      - "quick/spsv_coo*"
      - "quick/spsv_csc*"
    exclude:
      - "*known_bug*"
    labels:
      - "ffm-quick"

  ffm-full:
    description: "Alias of ffm-quick: quick level1, level2, and level3 tests only"
    test_patterns:
      - "quick/*.level1*"
      - "quick/*.level2*"
      - "quick/*.level3*"
      - "quick/*.conversion*"
      - "quick/spmv_csr*"
      - "quick/spmv_coo*"
      - "quick/spsv_csr*"
      - "quick/spsv_coo*"
      - "quick/spsv_csc*"
    exclude:
      - "*known_bug*"
    labels:
      - "ffm-full"

  emulation-quick:
    description: "Alias of ffm-quick: quick level1 and level2 tests only"
    test_patterns:
      - "quick/*.level1*"
      - "quick/*.level2*"
      - "quick/spmv_csr*"
      - "quick/spmv_coo*"
      - "quick/spsv_csr*"
      - "quick/spsv_coo*"
      - "quick/spsv_csc*"
    exclude:
      - "*known_bug*"
    labels:
      - "emulation-quick"

  emulation-full:
    description: "Alias of ffm-quick: quick level1, level2, and level3 tests only"
    test_patterns:
      - "quick/*.level1*"
      - "quick/*.level2*"
      - "quick/*.level3*"
      - "quick/*.conversion*"
      - "quick/spmv_csr*"
      - "quick/spmv_coo*"
      - "quick/spsv_csr*"
      - "quick/spsv_coo*"
      - "quick/spsv_csc*"
    exclude:
      - "*known_bug*"
    labels:
      - "emulation-full"

# GPU-specific CTest suites (exclude_gpu) are unused for hipSPARSE: f64 real/complex
# tests run on gfx1151 (Strix Halo) via the standard category suites. TheRock CI
# selects those with ctest -L <category> -LE ex_gpu when no ex_gpu_* label matches.
exclude_gpu: {}

execution_settings:
  timeout_multiplier: 1
  category_timeouts:
    quick: 300
    standard: 1800
    comprehensive: 14400
    full: 28800
    ffm-quick: 7200
    ffm-full: 7200
    emulation-quick: 7200
    emulation-full: 7200
