---
include: hipsparse_common.yaml


# The cuSPARSE SpGEAM backend requires host pointer mode scalars (enforced by the test) and
# does not support the bad-argument probing, so those cases are only run on the rocSPARSE
# backend (see the rocm test yaml). The alpha/beta zero edge cases below match cuSPARSE on
# this backend and are also handled on the rocSPARSE backend (see the rocm test yaml).
Tests:
- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [325, 1057]
  N: [174, 623]
  alpha: [2.0]
  alphai: [0.0]
  beta: [-1.5]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Edge cases: alpha and/or beta equal to zero. cuSPARSE drops the operand scaled by a zero
# scalar from C's sparsity pattern (alpha == 0 -> pattern of B, beta == 0 -> pattern of A,
# both zero -> empty C).
- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [325, 1057]
  N: [174, 623]
  alpha: [0.0, 2.0]
  alphai: [0.0]
  beta: [0.0, -1.5]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Quick: base-one indexing with complex scalars. cuSPARSE requires all matrices to share
# the same base index, so mixed-base coverage is only run on the rocSPARSE backend.
- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [512]
  N: [512]
  alpha: [1.0]
  alphai: [0.5]
  beta: [2.0]
  betai: [-0.5]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]

- name: spgeam_csr
  category: pre_checkin
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: 1
  N: 1
  alpha: [3.0]
  alphai: [0.0]
  beta: [2.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]
  filename: [nos1,
             nos2,
             nos3,
             nos4,
             nos5,
             nos6,
             nos7]

# Pre-checkin: medium random matrices with complex scalars.
- name: spgeam_csr
  category: pre_checkin
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [2000, 5000]
  N: [1500, 4000]
  alpha: [1.5]
  alphai: [0.7]
  beta: [-2.0]
  betai: [0.3]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Nightly: large real matrices (A from file, B independent random of the same size).
- name: spgeam_csr
  category: nightly
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: 1
  N: 1
  alpha: [2.0]
  alphai: [0.0]
  beta: [1.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]
  filename: [scircuit,
             ASIC_320k,
             bmwcra_1,
             shipsec1]

# Nightly: large random matrices.
- name: spgeam_csr
  category: nightly
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [10000, 20000]
  N: [10000, 20000]
  alpha: [1.0]
  alphai: [0.0]
  beta: [-1.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]
