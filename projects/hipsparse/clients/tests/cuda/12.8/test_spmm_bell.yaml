---
include: hipsparse_common.yaml


Tests:
# Quick
- name: spmm_bell
  category: quick
  function: spmm_bell
  indextype: *i32
  precision: *single_double_precisions
  M: [16, 32, 48]
  N: [8, 16]
  K: [16, 32, 48]
  block_dim: [2, 4, 8, 16]
  alpha: [1.0]
  alphai: [0.0]
  beta: [0.0]
  betai: [0.0]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE]
  transB: [HIPSPARSE_OPERATION_NON_TRANSPOSE]
  orderB: [HIPSPARSE_ORDER_COL, HIPSPARSE_ORDER_ROW]
  orderC: [HIPSPARSE_ORDER_COL, HIPSPARSE_ORDER_ROW]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  spmm_alg: [HIPSPARSE_SPMM_BLOCKED_ELL_ALG1]
  call_preprocess: [true, false]

- name: spmm_bell
  category: quick
  function: spmm_bell
  indextype: *i32
  precision: *single_double_precisions
  M: [48]
  N: [16]
  K: [32]
  block_dim: [3, 7]
  alpha: [2.0]
  alphai: [0.5]
  beta: [1.0]
  betai: [-0.5]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE]
  transB: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  orderB: [HIPSPARSE_ORDER_COL, HIPSPARSE_ORDER_ROW]
  orderC: [HIPSPARSE_ORDER_COL, HIPSPARSE_ORDER_ROW]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO, HIPSPARSE_INDEX_BASE_ONE]
  spmm_alg: [HIPSPARSE_SPMM_BLOCKED_ELL_ALG1, HIPSPARSE_SPMM_ALG_DEFAULT]
  call_preprocess: [true]
  
