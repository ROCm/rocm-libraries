---
include: hipsparse_common.yaml


Tests:
# Quick
- name: spmm_csr_reuse_descr
  category: quick
  function: spmm_csr_reuse_descr
  indextype: *i32_i64
  precision: *single_double_precisions_complex_real
  M: [78]
  N: [21]
  K: [96]
  alpha: [2.0]
  alphai: [0.5]
  beta: [1.0]
  betai: [0.5]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO, HIPSPARSE_INDEX_BASE_ONE]

# Pre-checkin
- name: spmm_csr_reuse_descr
  category: pre_checkin
  function: spmm_csr_reuse_descr
  indextype: *i32_i64
  precision: *single_double_precisions_complex_real
  M: 1
  N: [13]
  K: 1
  alpha: [2.0]
  alphai: [-0.5]
  beta: [1.0]
  betai: [-0.5]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO, HIPSPARSE_INDEX_BASE_ONE]
  filename: [nos1,
             nos4,
             nos5]

# Nightly
- name: spmm_csr_reuse_descr
  category: nightly
  function: spmm_csr_reuse_descr
  indextype: *i32
  precision: *double_only_precisions
  M: 1
  N: [15]
  K: 1
  alpha: [1.5]
  alphai: [0.0]
  beta: [1.2]
  betai: [-1.2]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  filename: [nos2,
             nos3,
             nos6,
             nos7]
