---
include: hipsparse_common.yaml

# Known bugs - tests matching these criteria are moved to the known_bug category so they are
# not run. rocSPARSE currently does not match the cuSPARSE SpGEAM behavior when a scalar is
# zero: cuSPARSE drops the operand scaled by a zero scalar from C's sparsity pattern
# (alpha == 0 -> pattern of B, beta == 0 -> pattern of A, both zero -> empty C), while
# rocSPARSE produces the union of A and B with the scaled-by-zero values set to zero. The
# host reference matches cuSPARSE, so these cases fail on the rocSPARSE backend until
# rocSPARSE is fixed.
Known bugs:
  - function: spgeam_csr
    alpha: 0.0
  - function: spgeam_csr
    beta: 0.0

Tests:
- name: spgeam_csr_bad_arg
  category: pre_checkin
  function: spgeam_csr_bad_arg
  precision: *single_double_precisions_complex_real

- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [325, 1057]
  N: [174, 623]
  alpha: [2.0]
  alphai: [0.0]
  beta: [-1.5]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Edge cases: alpha and/or beta equal to zero. cuSPARSE drops the operand scaled by a zero
# scalar from C's sparsity pattern (alpha == 0 -> pattern of B, beta == 0 -> pattern of A,
# both zero -> empty C). On rocSPARSE these are currently marked as known bugs (see above).
- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [325, 1057]
  N: [174, 623]
  alpha: [0.0, 2.0]
  alphai: [0.0]
  beta: [0.0, -1.5]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Quick: mixed index bases and complex scalars.
- name: spgeam_csr
  category: quick
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [512]
  N: [512]
  alpha: [1.0]
  alphai: [0.5]
  beta: [2.0]
  betai: [-0.5]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]

- name: spgeam_csr
  category: pre_checkin
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: 1
  N: 1
  alpha: [3.0]
  alphai: [0.0]
  beta: [2.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]
  filename: [nos1,
             nos2,
             nos3,
             nos4,
             nos5,
             nos6,
             nos7]

# Pre-checkin: medium random matrices with complex scalars.
- name: spgeam_csr
  category: pre_checkin
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [2000, 5000]
  N: [1500, 4000]
  alpha: [1.5]
  alphai: [0.7]
  beta: [-2.0]
  betai: [0.3]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]

# Nightly: large real matrices (A from file, B independent random of the same size).
- name: spgeam_csr
  category: nightly
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: 1
  N: 1
  alpha: [2.0]
  alphai: [0.0]
  beta: [1.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]
  filename: [scircuit,
             ASIC_320k,
             bmwcra_1,
             shipsec1]

# Nightly: large random matrices.
- name: spgeam_csr
  category: nightly
  function: spgeam_csr
  precision: *single_double_precisions_complex_real
  M: [10000, 20000]
  N: [10000, 20000]
  alpha: [1.0]
  alphai: [0.0]
  beta: [-1.0]
  betai: [0.0]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ZERO]
  baseC: [HIPSPARSE_INDEX_BASE_ZERO]
