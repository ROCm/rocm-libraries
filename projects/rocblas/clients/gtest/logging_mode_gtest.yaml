include: rocblas_common.yaml
include: known_bugs.yaml

Tests:
- name: logging_mode
  category: quick
  function: logging
  precision: *half_single_double_precisions_complex_real
  api: [C, C_64]
  pointer_mode_host: [true, false]

- name: logging_mode_internal
  category: quick
  function: logging
  precision: *single_double_precisions
  api: [C, C_64]
  pointer_mode_host: [true, false]
  algo: 1 # internal logging with hipblaslt backend
  os_flags: [ LINUX ]
  gpu_arch: [ '120?' ] # expected backend for LAYER=8

- name: logging_kernel_select
  category: quick
  function:
    - kernel_select_trsm: *single_precision
    - kernel_select_layout: *single_precision
    - kernel_select_combined: *single_precision
    - kernel_select_source: *single_precision
    - kernel_select_gemv: *single_precision
  api: C

- name: logging_kernel_select_no_hipblaslt
  category: quick
  function:
    - kernel_select_tensile: *single_precision
    - kernel_select_check_only: *single_precision
  api: C
  use_hipblaslt: 0

