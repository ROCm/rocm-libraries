# rocBLAS Test Categories Configuration
# Aligned with rocJenkins job types (precheckin, extended, weekly) and Test Filter Standardization POC.
# rocblas_smoke.yaml defines tests with category: quick, so *quick* is the smoke set.
test_categories:
  quick:
    description: "Smoke - same as rocblas_smoke.yaml (tests with category quick)"
    test_patterns:
      - "*quick*"
    exclude:
      - "*known_bug*"
    labels:
      - "quick"
      - "smoke"

  standard:
    description: "Precheckin - same as Jenkins precheckin (target: < 30 min)"
    test_patterns:
      - "*quick*"
      - "*pre_checkin*"
    exclude:
      - "*known_bug*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Extended - same as Jenkins extended/nightly (target: < 2 hours)"
    test_patterns:
      - "*nightly*"
    exclude:
      - "*known_bug*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  stress:
    description: "Stress / weekly - same as Jenkins weekly (stress + HMM)"
    test_patterns:
      - "*stress*"
      - "*HMM*"
    exclude:
      - "*known_bug*"
    labels:
      - "stress"
      - "weekly"

# GPU-specific exclusions can be added here when needed (see shared/ctest/README.md).
# exclude_gpu:
#   exclude_gpu_gfxXXXX:
#     test_patterns: [...]
#     labels: ["quick", "standard", "comprehensive", "stress", "ex_gpu_gfxXXXX"]

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300
    standard: 7200    # ~2 hours (standard can take over an hour)
    comprehensive: 28800   # 8 hours
    stress: 86400     # 24 hours
