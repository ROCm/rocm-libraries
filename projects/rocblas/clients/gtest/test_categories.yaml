# rocBLAS Test Categories Configuration
# Aligned with rocJenkins job types (precheckin, extended, weekly) and Test Filter Standardization POC.
# *quick* without *strided* is a proxy for smoke set until we use the smoke yaml.
test_categories:
  ffm-quick:
    description: "FFM NPI simulation tests for PR pipelines (target: < 2 hours on FFM runner) - quick level-1 tests only"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "ffm-quick"

  ffm-full:
    description: "FFM NPI nightly tests (initially the same as ffm-quick; expand as capacity grows)"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "ffm-full"

  quick:
    description: "Smoke - rocblas_smoke.yaml with optional gtest filter refinements (timeout: 30 min)"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "quick"
      - "smoke"

  standard:
    description: "Precheckin - same as Jenkins precheckin (timeout: 2 hours)"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
      #- "*quick*"
      #- "*pre_checkin*"
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Extended - same as Jenkins extended/nightly (timeout: 8 hours)"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
      # - "*nightly*"
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Stress / weekly - same as Jenkins weekly (stress + HMM)"
    # rtest-driver enabled so patterns and exclude are not used
    test_patterns:
    #  - "*stress*"
    #  - "*HMM*"
    # current CI use case currently does not match stress use case
    #  - "*quick*"
    #  - "*pre_checkin*"
    #  - "*nightly*"
      - "*known_bug*"
    exclude:
      - "*known_bug*"
    labels:
      - "full"
      - "stress"
      - "weekly"

# GPU-specific exclusions can be added here when needed (see shared/ctest/README.md).
# exclude_gpu:
#   exclude_gpu_gfxXXXX:
#     test_patterns: [...]
#     labels: ["quick", "standard", "comprehensive", "full", "ex_gpu_gfxXXXX"]

execution_settings:
  default_timeout: 900
  timeout_multiplier: 1
  category_timeouts:
    ffm-quick: 7200     # 2 hours — hard FFM PR budget
    ffm-full: 7200      # 2 hours — initially same as ffm-quick (expand as capacity grows)
    quick: 1800         # 30 min (rocblas_smoke.yaml)
    standard: 7200      # 2 hours
    comprehensive: 7200 # 2 hours
    full: 28800         # 8 hours
