  pointer_mode_host: false
  initialization: hpl
  atomics_mode: 0
  iters: 5
  uplo: [ L ]
  transA: [ N, T ]
  matrix_size:
    - { N:   199, K:   33,  lda:  199,  ldb: 199,  ldc: 199 }
  alpha_beta: *alpha_beta_range
  batch_count: [ 2 ]
  stride_scale: 1
  devices: 4
  repeatability_check: true

