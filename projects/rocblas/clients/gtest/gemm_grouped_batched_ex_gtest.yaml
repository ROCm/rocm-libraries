---
include: rocblas_common.yaml
include: known_bugs.yaml

Definitions:
  - &transA_transB_range
    - { transA: N, transB: N }
    - { transA: N, transB: T }
    - { transA: T, transB: N }
    - { transA: T, transB: T }

  - &alpha_beta_range_small
    - { alpha: 2, beta: -1.0 }

  - &small_grouped_ex_matrix_size
    - { M: 32, N: 32, K: 32, lda: 32, ldb: 32, ldc: 32, ldd: 32 }
    - { M: 64, N: 64, K: 64, lda: 64, ldb: 64, ldc: 64, ldd: 64 }

Tests:
  # to simplify test values if more than one group, each group increases batch_count and sizes by 1

- name: gemm_grouped_batched_ex_bad_arg
  category: quick
  function:
    - gemm_grouped_batched_ex_bad_arg: *nonint8_real_precisions
    - gemm_grouped_batched_ex_bad_arg: *single_double_precisions_complex
  stride_x: 2 # for group_count
  batch_count: 2
  transA: N
  transB: N
  M: 32
  N: 32
  K: 32
  lda: 32
  ldb: 32
  ldc: 32
  ldd: 32
  alpha: 1
  beta: 0
  api: [ FORTRAN, FORTRAN_64 ]

- name: gemm_grouped_batched_ex
  category: quick
  function:
    - gemm_grouped_batched_ex: *nonint8_real_precisions
    - gemm_grouped_batched_ex: *single_double_precisions_complex
  stride_x: 1 # for group_count
  transA_transB: *transA_transB_range
  matrix_size: *small_grouped_ex_matrix_size
  alpha_beta: *alpha_beta_range_small
  batch_count: [ 1, 3 ]
  api: [ C, FORTRAN_64 ]

- name: gemm_grouped_batched_ex
  category: pre_checkin
  function:
    - gemm_grouped_batched_ex: *nonint8_real_precisions
    - gemm_grouped_batched_ex: *single_double_precisions_complex
  stride_x: 2 # for group_count
  transA_transB: *transA_transB_range
  matrix_size: *small_grouped_ex_matrix_size
  alpha_beta: *alpha_beta_range_small
  batch_count: [ 2 ]
  outofplace: [false, true]
  api: FORTRAN
