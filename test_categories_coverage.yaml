# Coverage configuration for rocm-libraries projects.
#
# Defines which projects have coverage enabled and the metadata used to drive
# the coverage report (see .github/scripts/export_coverage_metadata.py).
#
# Notes:
#   * `libraries` / `test_binaries` are matched by file name (basename); the
#     export/runner scripts locate the actual instrumented files in the build
#     tree, so version suffixes (e.g. libhiprand.so.1.1) are handled
#     automatically.
#   * `ignore_filename_regex` is passed to `llvm-cov` as -ignore-filename-regex.
#   * `llvm_profile_pattern` is the LLVM_PROFILE_FILE pattern; %m keeps one file
#     per instrumented binary so parallel tests do not clobber each other.
#   * `test_category` is the ctest label coverage tests run under.
projects:
  hiprand:
    enabled: true
    coverage_objects:
      # hipRAND is a thin wrapper; coverage is collected from the wrapper lib.
      libraries:
        - libhiprand.so
      test_binaries: []
    ignore_filename_regex: '.*/test/.*|.*/tests/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  rocrand:
    enabled: true
    coverage_objects:
      # Coverage is collected from the rocRAND device library.
      libraries:
        - librocrand.so
      test_binaries: []
    ignore_filename_regex: '.*/test/.*|.*/tests/.*|.*/benchmark/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  rocfft:
    enabled: true
    coverage_objects:
      # Coverage is collected from the rocFFT library.
      libraries:
        - librocfft.so
      test_binaries: []
    ignore_filename_regex: '.*/test/.*|.*/tests/.*|.*/clients/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  rocblas:
    enabled: true
    coverage_objects:
      # Coverage is collected from the rocBLAS library.
      libraries:
        - librocblas.so
      test_binaries: []
    ignore_filename_regex: '.*/test/.*|.*/tests/.*|.*/clients/.*|.*[Tt]ensile.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  # Header-only libraries: there is no shared library to instrument, so coverage
  # is collected from the instrumented test binaries (matched by name prefix and
  # staged from the build tree). test_binaries entries are name prefixes.
  # Disabled for now (enabled: false) while the coverage flow is reworked to only
  # handle shared-object components first; the config is kept here so header-only
  # support can be re-enabled without re-deriving it.
  rocprim:
    enabled: false
    coverage_objects:
      libraries: []
      test_binaries:
        - test_
    ignore_filename_regex: '.*/test/.*|.*/benchmark/.*|.*/gtest/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  hipcub:
    enabled: false
    coverage_objects:
      libraries: []
      test_binaries:
        - test_hipcub_
    ignore_filename_regex: '.*/test/.*|.*/benchmark/.*|.*/gtest/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick

  rocthrust:
    enabled: false
    coverage_objects:
      libraries: []
      test_binaries:
        - test_thrust_
    ignore_filename_regex: '.*/testing/.*|.*/test/.*|.*/benchmark/.*|.*/gtest/.*|.*/_deps/.*|.*deps.*'
    llvm_profile_pattern: '%m'
    test_category: quick
