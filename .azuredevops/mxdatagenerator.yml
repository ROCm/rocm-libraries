variables:
- group: common
- template: /.azuredevops/variables-global.yml@pipelines_repo

parameters:
- name: pipelinesRepoRef
  type: string
  default: refs/heads/develop
- name: triggerDownstreamJobs
  type: boolean
  default: false

resources:
  repositories:
  - repository: pipelines_repo
    type: github
    endpoint: ROCm
    name: ROCm/ROCm
    ref: ${{ parameters.pipelinesRepoRef }}

trigger:
  batch: true
  branches:
    include:
    - develop
    - release-staging/rocm-rel-7.*
  paths:
    include:
    - shared/mxdatagenerator
    exclude:
    - shared/mxdatagenerator/.github
    - shared/mxdatagenerator/.jenkins
    - shared/mxdatagenerator/docs
    - shared/mxdatagenerator/*.md
    - shared/mxdatagenerator/.*.y*ml

pr: none

stages:
- stage: mxdatagenerator
  jobs:
  - template: ${{ variables.CI_COMPONENT_PATH }}/mxDataGenerator.yml@pipelines_repo
    parameters:
      sparseCheckoutDir: shared/mxdatagenerator
      triggerDownstreamJobs: ${{ parameters.triggerDownstreamJobs }}
- template: templates/report-summary-check-wrapper.yml
