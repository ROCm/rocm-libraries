# gfx1151 MAC f32 GEMM, ThreadTile 4x4, 2 waves. Larger problem.
# Generates: tensilelite_mm_f32_mac_large.s

GlobalParameters:
  NumElementsToValidate: -1
  Device: 0
  PrintSolutionRejectionReason: True
  ISA:
    - [11, 5, 1]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: s
      ComputeDataType: s
      TransposeA: False
      TransposeB: False
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - WavefrontSize: [32]
        - ThreadTile:
          - [4, 4]
        - WorkGroup:
          - [8, 8, 1]
        - DepthU: [16]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [1]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [1]
        - GlobalReadVectorWidthB: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 256, 1, 96]
