# gfx1151 WMMA f16 TN GEMM, M=16 N=16 K=16, 1 wave, no prefetch.
# TransposeA: True, TransposeB: False.
# Single WMMA tile: MatrixInstruction [16,16,16,1,1,1,1,1,1], WorkGroup [32,1,1].
GlobalParameters:
  NumElementsToValidate: -1
  Device: 0
  ISA:
    - [11, 5, 1]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: h
      DestDataType: h
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      Batched: True
    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - WavefrontSize: [32]
        - MatrixInstruction:
            - [16, 16, 16, 1, 1, 1, 1, 1, 1]
        - WorkGroup:
          - [32, 1, 1]
        - DepthU: [16]
        - PrefetchLocalRead: [0]
        - PrefetchGlobalRead: [False]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - InnerUnroll: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 16]
