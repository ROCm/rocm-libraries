# gfx1151 WMMA bf16 GEMM, 1 wave, no prefetch.
# Generates: tensilelite_mm_bf16_wmma_small.s

GlobalParameters:
  NumElementsToValidate: -1
  Device: 0
  ISA:
    - [11, 5, 1]

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: False
      TransposeB: False
      Batched: True
    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - WavefrontSize: [32]
        - MatrixInstruction:
            - [16, 16, 16, 1, 1, 1, 1, 1, 1]
        - WorkGroup:
          - [32, 1, 1]
        - DepthU: [16]
        - PrefetchLocalRead: [0]
        - PrefetchGlobalRead: [False]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - InnerUnroll: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [16, 16, 1, 128]
