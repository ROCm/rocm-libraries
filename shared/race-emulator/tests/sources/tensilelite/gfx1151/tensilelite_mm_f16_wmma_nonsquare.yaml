        - DepthU: [16]
        - PrefetchLocalRead: [0]
        - PrefetchGlobalRead: [False]
        - WorkGroupMapping: [8]
        - GlobalSplitU: [1]
        - InnerUnroll: [1]
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [32, 16, 1, 128]
