# Comprehensive GTest test_categories.yaml exercising all supported features:
#   - YAML anchors / aliases
#   - All four tiered categories (quick / standard / comprehensive / full)
#   - Category-level `exclude`
#   - OS-specific `exclude_windows` / `exclude_linux`
#   - `exclude_gpu` with hierarchical matching (gfx11X family + gfx1150 specific)
#   - `exclude_gpu` `test_patterns` given as a list-of-lists (anchored)
#   - `execution_settings.category_timeouts` + `timeout_multiplier`
#   - `execution_settings.environment`
_common_excludes: &common_excludes
  - "*KnownBroken*"
  - "*Flaky*"

_all_gpu_excludes: &all_gpu_excludes
  - "*UnsupportedOnGfx11*"
  - "*KnownGPUFailure*"

test_categories:
  quick:
    description: "Fast sanity checks (target < 5 min)"
    test_patterns:
      - "Smoke.*"
      - "Unit.*"
    exclude: *common_excludes
    exclude_windows:
      - "*LinuxOnly*"
    exclude_linux:
      - "*WindowsOnly*"
    labels:
      - "quick"
      - "pre-commit"

  standard:
    description: "Core functionality (target < 30 min)"
    test_patterns:
      - "Smoke.*"
      - "Unit.*"
      - "GPU_Conv.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"

  comprehensive:
    description: "Full regression suite"
    test_patterns:
      - "GPU_Conv.*"
      - "GPU_BN.*"
      - "GPU_Reduce.*"
    labels:
      - "comprehensive"
      - "nightly"

  full:
    description: "Everything including slow tests"
    test_patterns:
      - "*"
    labels:
      - "full"
      - "weekly"

exclude_gpu:
  exclude_gpu_gfx11X:
    test_patterns:
      - *all_gpu_excludes
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ex_gpu_gfx11X"

  exclude_gpu_gfx1150:
    test_patterns:
      - "*Gfx1150SpecificFailure*"
    labels:
      - "quick"
      - "standard"
      - "ex_gpu_gfx1150"

  exclude_gpu_gfx950:
    test_patterns:
      - "*Gfx950Issue*"
    labels:
      - "quick"
      - "ex_gpu_gfx950"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 2
  category_timeouts:
    quick: 300
    standard: 1800
    comprehensive: 7200
    full: 14400
  environment:
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "4"
