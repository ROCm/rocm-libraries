[project]
name = "stinkytofu"
version = "0.1.0"
description = "An LLVM-inspired pass-based IR optimizer for AMD GPU assembly kernels"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[build-system]
# nanobind 3.0.0 does not build with clang on Windows: NB_SLOT_ALIAS constexpr-
# initialises a function pointer to the dllimport'd PyObject_Vectorcall, which is not a
# constant expression there. Fixed upstream by wjakob/nanobind#1421, so exclude just that
# release rather than capping the 3.x line -- 3.0.1 will be picked up automatically.
requires = ["scikit-build-core>=0.10", "nanobind>=2.0,!=3.0.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
    "-DSTINKYTOFU_BUILD_PYTHON=ON",
    "-DSTINKYTOFU_BUILD_TESTS=OFF",
]
# No pure-Python packages to scan; the wheel contents come entirely from
# cmake install() rules (_stinkytofu.so + __init__.py → stinkytofu/).
wheel.packages = []
