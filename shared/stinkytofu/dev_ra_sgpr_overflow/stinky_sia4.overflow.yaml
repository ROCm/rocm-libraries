#
# Minimal repro extracted from stinky_sia4.yaml (BenchmarkProblems entry at
# lines 1161-1221, "TN - MX F6, Block32, E8").
#
# Benchmark step: Cijk_Alik_Bljk_F6SS_MXAE8B32_MXBE8B32_BH_UserArgs_00
# Expected failure:
#   warning: Number of defined SGPRS (117) overflowed max SGPRS (106).
#   Tensile::WARNING: Failed to generate assembly source code for
#     Cijk_Alik_Bljk_F6SS_MXAE8B32_MXBE8B32_BH_UserArgs_MT16x16x128_...:
#     Generating kernel source resulted in error 2
#
# Only the single-wave MatrixInstruction variant ([..., 1, 1] -> WG16_2_1,
# MT16x16) overflows. In the parent config all four of its fork combinations
# fail (DepthU 128/256 x InitCIterWmma -1/0); the [..., 2, 2] variant passes.
# This file pins the smallest failing one.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4      # maximum number of mismatches to print
  ValidationPrintValids: False # print matches too
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: True
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"
  # ForceGenerateKernel: True

BenchmarkProblems:
  -
    - # ProblemType - TN, MX F6, Block32, E8 scales
      OperationType: GEMM
      DataType: F6
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1,  1, 1,  1, 1]  # WG16_2_1, MT16x16 - overflows
        - DepthU: [128]
        - LocalReadVectorWidth: [32]
        - ScheduleIterAlg: [4]
        - InitCIterWmma: [-1]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - GlobalReadVectorWidthA: [32]
        - GlobalReadVectorWidthB: [32]
        - InnerUnroll: [1]
        - LdsBlockSizePerPadA: [0]
        - LdsBlockSizePerPadB: [0]
        - TransposeLDS: [1]
        - LdsPadA: [0]
        - LdsPadB: [0]
        - WaveSeparateGlobalReadA: [0]
        - WaveSeparateGlobalReadB: [0]
        - 1LDSBuffer: [0]
        - GlobalReadPerMfma: [1.0]
        - LocalWritePerMfma: [-1]
        - StoreVectorWidth: [-1]
        - SourceSwap: [true]
        - WavefrontSize: [32]
        - TDMInst: [3]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [128, 128, 1, 256]
