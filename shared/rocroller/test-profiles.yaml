# rocRoller Test profiles
#
# See scripts/lib/rrtest for Python utilities.

profiles:
  smoke:
    description: "Test suite for fires"
    tests:
    - executable: "test/rocroller-tests"
      framework: "gtest"
      include:
      - "*BasicGEMM*"
      exclude: []
    - executable: "test/rocroller-tests-catch"
      framework: "catch2"
      include:
      - "[kernel-graph]"
      exclude:
      - "[gpu]"

  precheckin:
    description: "Test suite for pre-commit validation"
    tests:
    - executable: "test/rocroller-tests"
      framework: "gtest"
      include: []
      exclude: []
    - executable: "test/rocroller-tests-catch"
      framework: "catch2"
      include: []
      exclude: []
    - executable: "ctest"
      framework: "ctest"
      include: []
      exclude: [["-LE", "GTEST|CATCH"]]
  
  codecov:
    description: "Reduced test suite for code coverage analysis"
    tests:
    - executable: "test/rocroller-tests"
      framework: "gtest"
      include: []
      exclude:
        - "*GEMM*"
    - executable: "test/rocroller-tests-catch"
      framework: "catch2"
      include: []
      exclude: []
    - executable: "ctest"
      framework: "ctest"
      include: []
      exclude: [["-LE", "GTEST|CATCH"]]
