# FP8 GEMM with per-tensor scalar scales (bf16 output), TN layout, on gfx950.
# README.md documents every key.
config_id: gfx950_f8bs_tn_int4
arch: gfx950

hipblaslt:
  a_type: f8_r
  b_type: f8_r
  c_type: bf16_r
  d_type: bf16_r
  scale_type: f32_r
  compute_type: c_f32_r
  # hipblaslt-bench scaling format 1 = per-tensor scalar.
  scaleA: 1
  scaleB: 1
  transA: T
  transB: N
  library_stem: TensileLibrary_F8F8_BF8_HA_Bias_SAB_SAV_UA_Type_F8B_HPA_Contraction_l_Alik_Bljk_Cijk_Dijk_ID75a0_gfx950

runtime:
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  rocm_libraries_root: ${TILEWRIGHT_BENCH_ROOT}

seed:
  target_per_cell: 400
  shapes_per_cell: 150
  seed: 42
  n_strata: 2

probe:
  first_line_iters: 10
  first_line_cold_iters: 10
  other_lines_iters: 1
  other_lines_cold_iters: 0
  duration_us: 2000
  skip_ratio_mode: bucket
  fast_us_threshold: 30
  ratio_light: 0.3
  ratio_heavy: 0.8

bench:
  blocks_per_gpu: 50

train:
  workers: 48
  threads_per_worker: 0
  epochs: 200
  device: cpu
  eval_sample_frac: 1.0
  smart_k: 15
  smart_k_max: 25
  smart_k_min: 5
  smart_k_saturation_eps: 0.005
  min_cell_gemms: 30

validate:
  sel_eff_threshold: 0.95
  min_cell_gemms: 20
  split_floor: 0.83
  split_min_improvement: 0.02
  split_after_attempts: 1
  max_split_depth: 6
  structural_split_min_octaves: 6.0

full:
  total_rounds: 8

deploy:
  target_sel_eff: 0.95
  on_final_round: true
  stop_when_target_reached: false
  weight_dtype: int4
  rocm_libraries_to_deploy: ${TILEWRIGHT_DEPLOY_ROOT}
  apply_patch: true
  build_after_apply: true
  build_jobs: null

stage07:
  parity_sample_trained: 1000
  bench_yamls: []

stage08:
  datasets: []
