# bf16 GEMM (bf16 output, fp32 compute), TN layout,
# on gfx1250-strict: the library hipBLASLt builds in
# Tensile/library/gfx1250-strict from Logic/asm_full/gfx1250-strict/
# gfx1250-strict/Origami/gfx1250-strict_Cijk_Alik_Bljk_BBS_BH_Bias_HA_S_SAV_UserArgs.yaml,
# benched on a device that reports gfx1250-strict: a gfx1250 device of
# ASIC revision 0 does so only with HSA_DISABLE_GFX12_STRICT=0 in its
# environment, which runtime.env gives every stage, bench and cotenant
# (without it the device reports gfx1250 and hipBLASLt loads its
# gfx1250v0 library); preflight checks every device.
# Catalog v3 with the planner, execution contexts and the audit set, and
# no bank. Device values come from the bench device when the run starts
# (the context budgets from its CU count, the dynamic-queue count from its
# XCDs); a run config kept outside the repository pins any of them in a
# `hardware:` block. The one command (--mode full) builds the audit set
# before its first round (audit.build).
# Stages the trained model only (deploy.apply_patch: false).
# README.md documents every key.
config_id: gfx1250-strict_bbs_tn_v3
arch: gfx1250-strict

hipblaslt:
  a_type: bf16_r
  b_type: bf16_r
  c_type: bf16_r
  d_type: bf16_r
  scale_type: f32_r
  compute_type: c_f32_r
  scaleA: 0
  scaleB: 0
  transA: T
  transB: N
  library_stem: TensileLibrary_BB_BB_HA_Bias_SAV_UA_Type_BB_HPA_Contraction_l_Alik_Bljk_Cijk_Dijk_gfx1250-strict

runtime:
  devices: [0, 1, 2, 3]
  rocm_libraries_root: ${TILEWRIGHT_BENCH_ROOT}
  env:
    HSA_DISABLE_GFX12_STRICT: "0"

seed:
  target_per_cell: 400
  shapes_per_cell: 150
  seed: 42
  n_strata: 2

bench:
  blocks_per_gpu: 50
  warmup_pass: false
  # Budget for a bench process's first output (library load), then for the
  # gap between outputs; a silent bench is killed and its shape skipped.
  startup_grace_s: 2400
  stall_timeout_s: 1200
  # Times a kernel only when its single cold call is within 1/0.45 of the
  # fastest: the gfx950 configs' screen of planned lines, whose
  # near-winners' cold calls sit just above twice the fastest. Not
  # validated on gfx1250 yet: an A/B against benches without the skip
  # screen has to show that it keeps every kernel close to the winner.
  skip_slow_solution_ratio: 0.45
  rotating_mb: 512
  rotating_target_blocks: 16
  rebench:
    enabled: true
  # Adaptive timing is always on: each kernel is timed until the relative
  # standard error of its mean is below noise_threshold (times in ms).
  adaptive:
    warmup_time: 1.0
    sample_time: 0.5
    measure_time: 1.5
    max_measure_time: 8.0
    min_iters: 3
    max_iters: 0
    noise_threshold: 0.05
    stability_threshold: 0.05
    stability_window: 32
    stability_interval: 16

planner:
  enabled: true
  mode: planned
  seed_per_cell: 8
  ranker: neighbors
  neighbors_k: 4
  # No bank yet: the signature's cache-hint fields would fold cache
  # policies of Equality kernels into the keys of pool kernels, and how a
  # kernel's identity should tell those apart is still open.
  bank: none
  # Sized for the library's kernel pool; check the recall of the winners
  # on the round-0 seed benches before relying on them.
  top_k: 48
  families_top_f: 4
  family_variants: 0
  explore_random_k: 8
  min_coverage: 2
  max_list: 512
  seed: 42

contexts:
  # CU budgets as fractions of the bench device's CUs; the run resolves
  # them to multiples of 32 CUs when it starts. Entries that meet on one
  # budget keep the first, so on a device or partition with few CUs the
  # held-out entries can all be left out; the run and its report say so.
  list:
    - {cu_budget: 0}
    - {cu_fraction: 0.75, cotenant: true, fraction: 0.15}
    - {cu_fraction: 0.5, cotenant: true, fraction: 0.15}
    - {cu_fraction: 0.25, cotenant: true, fraction: 0.15}
  holdout:
    - {cu_fraction: 0.875, cotenant: true, fraction: 0.03}
    - {cu_fraction: 0.375, cotenant: true, fraction: 0.03}
  seed: 42
  replan: true

train:
  workers: 32
  threads_per_worker: 0
  epochs: 200
  device: cpu
  eval_sample_frac: 1.0
  catalog: v3
  whitelist: none
  smart_k: 0
  cascade_k: 16
  stage1_recall_weight: 0.1
  served_candidates: true
  unmeasured_samples: 0
  non_temporal_rule: false
  min_cu_fraction: 0.25
  schedules: [default]
  min_cell_gemms: 30
  off_list_sel_eff: auto
  off_list_fallback: 0.83

validate:
  sel_eff_threshold: 0.95
  min_cell_gemms: 20
  split_floor: 0.83
  split_min_improvement: 0.02
  split_after_attempts: 1
  max_split_depth: 6
  structural_split_min_octaves: 0.0

full:
  total_rounds: 8

audit:
  dir: ${TILEWRIGHT_AUDIT_ROOT}/gfx1250-strict_bbs_tn_v3

deploy:
  target_sel_eff: 0.95
  on_final_round: true
  stop_when_target_reached: false
  weight_dtype: int8
  rocm_libraries_to_deploy: ${TILEWRIGHT_DEPLOY_ROOT}
  # One model serves the library of every directory listed here;
  # hipBLASLt also builds gfx1250-strict's logic for gfx1250 into its
  # gfx1250v0 subtree.
  targets: [gfx1250-strict, gfx1250v0, gfx1250]
  apply_patch: false
  build_after_apply: false
  build_jobs: null

stage07:
  parity_sample_trained: 0
  bench_yamls: []

stage08:
  datasets: []
