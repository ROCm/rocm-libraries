[build-system]
requires = [
    "scikit-build-core>=0.5",
    "nanobind>=2.0.0"
]
build-backend = "scikit_build_core.build"

# NOTE: Building this package requires a ROCm install. The native Origami
# library (liborigami + its CMake package) is first-class in ROCm, so a ROCm
# install provides it.

[project]
name = "rocm-origami"
dynamic = ["version"]
description = "Analytical GEMM Solution Selection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Advanced Micro Devices, Inc."}
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
]
torch = ["torch>=2.0.0"]

[tool.scikit-build]
wheel.packages = ["python/src/origami"]
cmake.version = ">=3.25"
build.verbose = true
cmake.source-dir = "."
build-dir = "build/{state}-{wheel_tag}"
cmake.args = ["--preset=python"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/src/origami/__init__.py"
metadata.version.regex = '^__version__\s*=\s*["\x27](?P<value>[^"\x27]+)["\x27]'
sdist.exclude = [
    "build/*",
    "*.egg-info/*",
    "PYTHON_BUILD_LAYOUT_PLAN.md",
    "SHARED_LIBRARY_ROLLOUT_PLAN.md",
]
wheel.exclude = [
    "*.md",
    "*.sh",
    "tests/*",
    "csrc/*",
    "**/__pycache__",
    "**/*.pyc",
    "**/liborigami.so*",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests that require hardware",
    "regression: marks tests as ranking regression tests",
]
addopts = [
    "-ra",
    "--strict-markers",
]


[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.args = ["--preset=dev"]
cmake.build-type = "RelWithDebInfo"
