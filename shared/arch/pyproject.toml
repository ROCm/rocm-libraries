[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-arch"
version = "0.4.0"
description = "Prototype device-independent AMD GPU architecture catalog"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
rocm_arch = ["architectures/*.json"]
