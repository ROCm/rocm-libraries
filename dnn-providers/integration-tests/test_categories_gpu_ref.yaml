#
# hipdnn_gpu_ref_tests Test Categories Configuration.
#
# Same tier labels as test_categories.yaml, with the opposite default for this binary:
# quick is an opt-in list, standard is the catch-all.
#
# quick: one fp32 case per GPU reference kernel family (every kernel entry point is
#   compiled and launched once and compared with the CPU reference). Nearly all of
#   the time is HipRTC compilation (~0.4 s per kernel variant, docs/gpu-ref-test-coverage.md),
#   so the quick tier is sized by the number of kernel variants it compiles, not by its
#   case count. The list is:
#     - Quick/*: the one-case Quick instantiations (tests/gpu-ref/QuickCases.hpp);
#     - the plain TESTs named below, one per family the Quick instantiations leave out.
# standard: everything else except Comprehensive* and Full*, so a new test lands in
#   standard unless it is named here. This includes the fp32 small and medium catalogs
#   (Standard*), every reduced-precision, fp8, int8, TF32 and mixed-type case and the
#   host-only validation tests. Datatype only enters through per-element load/store
#   conversion (P1), and every extra datatype is a separate HipRTC compile.
# comprehensive / full: Comprehensive* / Full* (large shapes, fp32 only).
#
# The quick list appears twice below (quick test_patterns, standard exclude): change both.
# The hipdnn_gpu_ref_tests_tier_partition test checks that every test runs in exactly one
# tier and that every quick pattern selects a test. GTest filters are case-sensitive.
test_categories:
  quick:
    description: "One fp32 case per GPU reference kernel family (Quick/* plus the named plain tests)"
    test_patterns: &gpu_ref_quick_patterns
      - "Quick/*"
      - "TestGpuFpReferenceRmsValidation/0.AgreesWithCpuOnBothSidesOfTheThreshold"
      - "TestGpuIntValidation/2.SingleElementExactMatchPasses"
      - "TestGpuFpReferenceBlockScale.QuantizeMatchesCpu"
      - "TestGpuFpReferenceBlockScale.DequantizeWithPermutedOutputStridesMatchesCpu"
      - "TestGpuSdpaBwdFp32.MatchesCpuReference/BiasScalarDBias"
      - "TestGpuSdpaFwdDropoutFp32.MatchesCpuReference"
      - "TestGpuSdpaRaggedFwdFp32.HeadMajorLayoutMatchesCpu"
      - "TestGpuLayernormFwdRefChannelLast.MatchesCpuRef"
      - "TestGpuLayernormBwdRefChannelLast.MatchesCpuRef"
      - "TestGpuRMSNormFwdRefChannelLast.MatchesCpuRef"
      - "TestGpuReductionRefChannelLast.MatchesCpuRefDifferentIOLayouts"
      - "TestGpuResampleFwdRefChannelLast.AvgPoolMatchesCpuRef5D"
      - "TestGpuResampleBwdRefOverlap.AvgPoolOverlappingWindowsMatchesCpuRef"
    exclude:
      - "*DISABLED*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"

  standard:
    description: "Standard-tier GPU reference cases: everything that is not quick, Comprehensive* or Full*"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Comprehensive*"
      - "Full*"
      # The quick list (quick test_patterns above)
      - "Quick/*"
      - "TestGpuFpReferenceRmsValidation/0.AgreesWithCpuOnBothSidesOfTheThreshold"
      - "TestGpuIntValidation/2.SingleElementExactMatchPasses"
      - "TestGpuFpReferenceBlockScale.QuantizeMatchesCpu"
      - "TestGpuFpReferenceBlockScale.DequantizeWithPermutedOutputStridesMatchesCpu"
      - "TestGpuSdpaBwdFp32.MatchesCpuReference/BiasScalarDBias"
      - "TestGpuSdpaFwdDropoutFp32.MatchesCpuReference"
      - "TestGpuSdpaRaggedFwdFp32.HeadMajorLayoutMatchesCpu"
      - "TestGpuLayernormFwdRefChannelLast.MatchesCpuRef"
      - "TestGpuLayernormBwdRefChannelLast.MatchesCpuRef"
      - "TestGpuRMSNormFwdRefChannelLast.MatchesCpuRef"
      - "TestGpuReductionRefChannelLast.MatchesCpuRefDifferentIOLayouts"
      - "TestGpuResampleFwdRefChannelLast.AvgPoolMatchesCpuRef5D"
      - "TestGpuResampleBwdRefOverlap.AvgPoolOverlappingWindowsMatchesCpuRef"
    labels:
      - "standard"
      - "comprehensive"
      - "full"
      - "slow"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier - mirrors the quick tier"
    test_patterns: *gpu_ref_quick_patterns
    exclude:
      - "*DISABLED*"
    labels:
      - "ffm-quick"
      - "ffm-full"

  comprehensive:
    description: "Comprehensive-tier GPU reference cases: large edge-case shapes in fp32, plus the batchnorm bwd ComprehensiveDouble cases"
    test_patterns:
      - "Comprehensive*"
    exclude:
      - "*DISABLED*"
    labels:
      - "comprehensive"
      - "full"
      - "slow"

  full:
    description: "Full-tier GPU reference cases: large stress shapes, fp32 only"
    test_patterns:
      - "Full*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "slow"

execution_settings:
  default_timeout: 600
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 1800
    ffm-quick: 7200
    comprehensive: 3600
    full: 7200
