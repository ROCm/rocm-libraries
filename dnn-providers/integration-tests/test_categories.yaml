#
# hipdnn-integration-tests Test Categories Configuration.
#
# GTest-filter categories applied to the component's own GTest binaries
# (hipdnn_integration_tests_unit_tests and hipdnn_golden_data_tests) via
# apply_test_category_labels(). hipdnn_gpu_ref_tests uses
# test_categories_gpu_ref.yaml instead (fp32-only quick tier). Each category
# becomes one CTest suite whose --gtest_filter is built from test_patterns/exclude;
# labels are cumulative so `ctest -L standard` runs quick + standard, etc.
#
# Tier prefixes: framework unit tests carry no tier prefix and are caught by the
# quick catch-all (everything not Standard/Comprehensive/Full).
# hipdnn_golden_data_tests names its tests after the bundle's path, so their tier
# prefix is the lowercase data directory: "standard_", "comprehensive_" or
# "full_" (quick-tier bundles start "quick_" and fall into the catch-all).
# GTest filters are case-sensitive, so every tier is excluded from the catch-all
# in both spellings; miss one and that tier's bundles run in the quick lanes.
# The external hipdnn_integration_tests bundle binary is categorized by each
# provider's test_categories_integration.yaml, not this file.
#
# The "comprehensive" and "full" tiers here select the lowercase bundle-named
# golden-data tests ("comprehensive_*", "full_*"). The PascalCase
# Comprehensive*/Full* GPU reference cases are selected by
# test_categories_gpu_ref.yaml.
# Tiers cascade through labels: quick carries quick+standard+comprehensive+full,
# standard carries standard+comprehensive+full, comprehensive carries
# comprehensive+full, so `ctest -L standard` selects quick + standard,
# `ctest -L comprehensive` selects quick + standard + comprehensive and
# `ctest -L full` selects everything.
test_categories:
  quick:
    description: "Quick-tier golden-data bundles plus all framework unit tests (catch-all: everything not Standard/Comprehensive/Full)"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Standard*"
      - "standard_*"
      - "Comprehensive*"
      - "comprehensive_*"
      - "Full*"
      - "full_*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"

  standard:
    description: "Standard-tier cases (Standard* tests and standard_* golden-data bundles)"
    test_patterns:
      - "Standard*"
      - "standard_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "standard"
      - "comprehensive"
      - "full"
      - "slow"

  comprehensive:
    description: "Comprehensive-tier golden-data bundle cases"
    test_patterns:
      - "comprehensive_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "comprehensive"
      - "full"
      - "slow"

  full:
    description: "Full-tier golden-data bundle cases"
    test_patterns:
      - "full_*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "slow"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier - currently mirrors the quick tier"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Standard*"
      - "standard_*"
      - "Comprehensive*"
      - "comprehensive_*"
      - "Full*"
      - "full_*"
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 600
  timeout_multiplier: 1
  category_timeouts:
    quick: 600            # 10 minutes (was add_tiered_test_target SMOKE_TIMEOUT default)
    standard: 1800        # 30 minutes
    comprehensive: 3600   # 60 minutes
    full: 7200            # 120 minutes
    ffm-quick: 7200       # 2 hours
