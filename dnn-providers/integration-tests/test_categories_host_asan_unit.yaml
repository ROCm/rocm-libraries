# Positive-only CPU admission for hipdnn_integration_tests_unit_tests.
#
# This deliberately names wholly host-safe suites plus individual host-safe
# cases from mixed suites. Do not replace it with a negative GPU filter: a new
# test must be reviewed before it enters host-ASAN. The TheRock runner protects
# this selector with the exact 515-case name inventory present on this branch.
test_categories:
  host-asan:
    description: "Explicit CPU-only unit and harness tests"
    test_patterns:
      - "TestIsMetaJsonFile.*"
      - "TestMetaJsonPath.*"
      - "TestLoadBundleMetadata.*"
      - "TestCheckVramRequirement.*"
      - "TestCheckArchCompatibility.*"
      - "TestParseSupportClaimsJson.*"
      - "TestSupportJsonPath.*"
      - "TestLoadSupportClaims.*"
      - "TestParseSweepSupportClaimsJson.*"
      - "TestLoadSweepSupportClaims.*"
      - "TestSupportClaimLocator.*"
      - "TestGraphDescription.*"
      - "TestNodeTypeToString.*"
      - "TestGlobMatch.*"
      - "TestCurrentPlatform.*"
      - "TestSupportMatrixCollector.*"
      - "TestConfigUninitialized.*"
      - "TestParseVerificationMode.*"
      - "TestResolveVerificationMode.*"
      - "TestResolveGoldenDataDir.*"
      - "TestConfigInitialized.*"
      - "TestSettingsParser.*"
      - "TestTomlGuards.*"
      - "TestGpuConvolutionFwdSignatureKey.*"
      - "TestGpuConvolutionFwdPlanBuilder.*"
      - "TestGpuLayernormBwdSignatureKey.*"
      - "TestGpuLayernormBwdPlanBuilder.*"
      - "TestGpuLayernormFwdSignatureKey.*"
      - "TestGpuLayernormFwdPlanBuilder.*"
      - "TestGpuSdpaFwdSignatureKey.*"
      - "TestGpuRMSNormFwdSignatureKey.*"
      - "TestGpuRMSNormBwdSignatureKey.*"
      - "TestGpuRMSNormFwdPlanBuilder.*"
      - "TestGpuRMSNormBwdPlanBuilder.*"
      - "TestReferenceGraphExecutorFactory.*"
      - "TestBundleDiscoveryFixture.*"
      - "TestGraphFile.*"
      - "TestSanitizeForGtest.*"
      - "TestGoldenHarnessFixture.*"
      - "TestInputFillRecipes.*"
      - "TestFillInputs.*"
      - "TestToleranceResolver.*"
      - "TestVerificationModePathsFixture.*"
      - "TestErrorPaths.*"
      - "TestLoadedEngineTable.*"
      - "TestReferenceOpCoverage.*"
      - "TestSupportClaimReport.*"
      - "TestSupportClaimCoverageRules.*"
      - "TestSupportClaimSummary.*"
      - "TestSupportClaimEnforcement.*"
      - "TestEnforcementRungs.*"
      - "TestSupportVerdict.*"
      - "TestUnpinnedRunEnforcement.*"
      - "TestProductionPolicy.*"
      - "TestGraphSession.*"
      - "TestOutputComparison.*"
      - "TestGpuReferenceGraphExecutor.IsNotApplicableForRuntimePassByValueGraph"
      - "TestGpuReferenceGraphExecutor.IsApplicableForBakedScalarGraph"
