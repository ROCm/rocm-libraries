# Example TOML config showing the [[test_skips]] schema added in
# users/addickin/integration_test_asic_skips.
#
# Pass this file to hipdnn_integration_tests via:
#   hipdnn_integration_tests --tc <path-to-this-file> --gtest_filter='IntegrationGpuConvFwd*'
#
# Tests whose suite.test name matches any 'filters' glob AND that run on a
# device whose raw gcnArchName contains any 'archs' substring will be reported
# as SKIPPED with the 'reason' string. Other tests run normally.

[meta]
version = 1

[[test_skips]]
archs   = ["gfx1151"]
filters = ["*ConvFwd*Fp16*"]
reason  = "manual smoke test of [[test_skips]] mechanism"
