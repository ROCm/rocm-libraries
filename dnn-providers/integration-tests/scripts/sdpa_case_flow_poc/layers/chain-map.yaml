# How the model (test-plans/sdpa-fwd/model.yaml) states each Layer 0 axis when the ids are NOT the same.
# Read by chain_check.py. Everything not listed here is matched by identical axis id and value id,
# or by a model value's `class:` field (model value -> the Layer 0 value of that id).
# Written 2026-10-29 (layers redo, agent); round b entries removed the same day. Every `explained_by` must be a rule id in rules.yaml.

# Model axes that are not Layer 0 axes, and the Layer 0 entry they come from.
model_axis_sources:
  dtype_k_vs_q: {l0_axis: dtype_k, explained_by: CH-DTYPE-MIX-RELATIONSHIP,
                 why: "K's format is carried relative to Q's: same, or one alternative format per Q format"}
  dtype_v_vs_q: {l0_axis: dtype_v, explained_by: CH-DTYPE-MIX-RELATIONSHIP, why: "as dtype_k_vs_q"}
  implementation: {l0_axis: execution_strategy,
                   why: "the API names the Layer 0 axis execution_strategy `implementation` (set_implementation)"}
  ragged_offset_form: {l0_axis: ragged_offset_unit, explained_by: CH-FOLDED-CHILD-AXES,
                       why: "one model axis holds the offset unit and the offset sharing (Layer 0 ragged_offset_unit, ragged_offset_sharing)"}
  runtime_shape_override: {l0_set_aside: runtime_shape_overrides,
                           why: "an API opt-in L0 sets aside 'to Layer 2 API-path variants'; the model carries it as an axis"}

# Layer 0 axes the model does not carry as an axis, value by value.
l0_axis_fates:
  dtype_k:
    all_values: {to_model_axis: dtype_k_vs_q, explained_by: CH-DTYPE-MIX-RELATIONSHIP,
                 why: "every K format is 'same' or 'differs' relative to Q; the model picks one 'differs' format per Q format"}
  dtype_v:
    all_values: {to_model_axis: dtype_v_vs_q, explained_by: CH-DTYPE-MIX-RELATIONSHIP, why: "as dtype_k"}
  head_dim_v_vs_qk:
    all_values: {derived_from: [head_dim_qk, head_dim_v], explained_by: CH-HEAD-DIM-LEVELS,
                 why: "smaller / equal / larger follow from the two head-size levels (e.g. d128 vs d192)"}
  alibi_slopes:
    standard_geometric: {folded_into: [alibi, present], explained_by: F-ALIBI-NO-SLOPES,
                         why: "the API's ALiBi flag is read as the standard slopes (L2 mapping_assumed)"}
  logit_softcap:
    absent: {folded_into: null, explained_by: F-NO-SOFTCAP, why: "no API; every case is 'absent'"}
  kv_cache_append:
    absent: {folded_into: null, explained_by: F-NO-KV-APPEND, why: "no API; every case is 'absent'"}
  amax_q:
    not_requested: {folded_into: null, explained_by: F-NO-AMAX-QKV, why: "no API; never requested"}
  amax_k:
    not_requested: {folded_into: null, explained_by: F-NO-AMAX-QKV, why: "no API; never requested"}
  amax_v:
    not_requested: {folded_into: null, explained_by: F-NO-AMAX-QKV, why: "no API; never requested"}
  ragged_offset_sharing:
    all_values: {to_model_axis: ragged_offset_form, explained_by: CH-FOLDED-CHILD-AXES,
                 why: "per_tensor is ragged_offset_form per_tensor_elements; shared_per_side is shared_tokens"}
  length_form:
    per_sequence_lengths: {folded_into: [sequence_lengths, variable], explained_by: CH-FOLDED-CHILD-AXES,
                           why: "sequence_lengths variable and variable_no_flag state per-sequence length tensors"}
    start_position_differences: {folded_into: [sequence_lengths, lengths_in_offsets], explained_by: CH-FOLDED-CHILD-AXES,
                                 why: "sequence_lengths lengths_in_offsets: the ragged offsets give each length"}
  rng_state_storage:
    by_value: {folded_into: [dropout_rng_state, caller_supplied], explained_by: CH-FOLDED-CHILD-AXES,
               why: "dropout_rng_state caller_supplied: seed and offset by value"}
    device_memory: {folded_into: [dropout_rng_state, caller_supplied_device_memory], explained_by: CH-FOLDED-CHILD-AXES,
                    why: "dropout_rng_state caller_supplied_device_memory: seed and offset in device memory"}
  index_tensor_dtype:
    int32: {folded_into: null, explained_by: F-INDEX-TENSORS-INT32,
            why: "a fixed model setting: the frontend takes only INT32 length tensors and page tables"}
  dropout_scale_storage:
    by_value: {folded_into: null, explained_by: CH-FIXED-STORAGE-ROUTE, why: "storage route held fixed; follow-up"}
    device_memory: {folded_into: null, explained_by: CH-FIXED-STORAGE-ROUTE, why: "storage route held fixed; follow-up"}
  descale_storage:
    by_value: {folded_into: null, explained_by: CH-FIXED-STORAGE-ROUTE, why: "storage route held fixed; follow-up"}
    device_memory: {folded_into: null, explained_by: CH-FIXED-STORAGE-ROUTE, why: "storage route held fixed; follow-up"}

# Layer 0 values (that L1/L2 keep) of an axis the model carries, with no image in any model row.
# The entries below are model values that CH-FUZZER-HINTS removes from every row.
l0_values_not_in_model:
  scale_value: {non_finite: CH-FUZZER-HINTS}
  sink_values: {no_sink: CH-FUZZER-HINTS, very_large: CH-FUZZER-HINTS, non_finite: CH-FUZZER-HINTS}
  scale_factor_values: {one: CH-FUZZER-HINTS, zero: CH-FUZZER-HINTS, non_finite: CH-FUZZER-HINTS}
  special_values: {infinity: CH-FUZZER-HINTS, nan: CH-FUZZER-HINTS, negative_infinity_bias: CH-FUZZER-HINTS,
                   subnormal: CH-FUZZER-HINTS, signed_zero: CH-FUZZER-HINTS}
  value_magnitude: {overflow_prone: CH-FUZZER-HINTS, precision_loss_prone: CH-FUZZER-HINTS}
# 2026-10-29 round b: the six values CH-NOT-MODELLED-YET held (batch_packing ragged_q_side / ragged_kv_side,
# page_size_k_vs_v, page_table_storage, descale_* finer, matmul_input_precision fp8, dropout_mask_broadcast) are model
# values with the Layer 0 ids, so they need no entry here; CH-NOT-MODELLED-YET is removed from rules.yaml.

# Layer 2 values (meaningful, and the frontend states them) that a policy rule removes from the model:
# hipDNN should refuse them, so they are rejection-suite cases, not numerical ones. Every entry names a
# rules.yaml rule of kind policy. Policy rules that remove only combinations, or nothing at all
# (P-NO-OUTPUT-BROADCAST: covered by D-OUTPUT-SELF-ALIAS, which Layer 1 also holds), remove no single
# value, so they need no entry. Negative strides are removed at Layer 2 by F-NO-NEGATIVE-STRIDE (a
# frontend rule that is not enforced yet).
l0_values_refused_by_policy: {}

# Rules whose Layer 1 form and rules.yaml form name different axes. Read by people, not by chain_check.py.
rule_translations:
  D-INPUTS-OVERLAP-VIEW-DTYPE:
    layer1: "tensor_overlap, head_dim_v_vs_qk, dtype_q, dtype_k, dtype_v (absolute formats)"
    model: "tensor_overlap, head_dim_qk x head_dim_v value pairs, dtype_k_vs_q, dtype_v_vs_q"
    why: "The model states K and V formats relative to Q (CH-DTYPE-MIX-RELATIONSHIP) and the head-size relation through the two head-size levels (CH-HEAD-DIM-LEVELS). V inside K: the two relations are equal (one 'differs' format per Q format). K inside Q: K is 'same'."
  D-INPUTS-OVERLAP-VIEW-LAYOUT:
    layer1: "tensor_overlap, head_dim_v_vs_qk, strides_k, strides_v, dim_order_k, dim_order_v"
    model: "tensor_overlap, head_dim_qk x head_dim_v value pairs, strides_k, strides_v, dim_order_k, dim_order_v"
    why: "The view is V when head_dim_v <= head_dim_qk, else K, as in class_to_value.tensor_overlap; the model names the relation through its head-size levels."
  D-REL-STRIDE-NEEDS-EXTENT:
    layer1: "size classes zero / one"
    model: "size class one (zero is not in the model, F-EXTENT-NONZERO); head size one is the level d1"
    why: "as the rule's `adapted` field"
