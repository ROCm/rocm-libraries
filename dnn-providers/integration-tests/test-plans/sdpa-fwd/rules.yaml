  - id: F-NO-AMAX-QKV
    kind: frontend
    form: value_list
    reason: "The API returns amax only for S and O, not for Q, K or V."
    shapes_axes: [amax_s, amax_o]
    omits: "axes amax_q, amax_k, amax_v"
    source: "SA:107-116; @ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:570,580 (set_amax_s, set_amax_o); FBS:69-70"
    evidence: read in code

  - id: F-SCALE-NO-DEFAULT-SOURCE
    kind: frontend
    form: value_list
    reason: "Leaving the scale unset gives 1.0, not 1/sqrt(d), so 'use the definition's own scale' cannot be stated."
    shapes_axes: [scale_source]
    omits: "scale_source value 'default'"
    source: "SA:36-37; @ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/Graph.hpp:6357 (scale 1.0 when none is set); FBS:81"
    still_expressible: "The same number: scale_value = inverse_sqrt_d. Unset is API-path variant PV-SCALE-UNSET."
    evidence: read in code

  - id: F-RAGGED-OFFSETS-ARE-LENGTHS
    kind: frontend
    form: exclusion
    reason: "Without length tensors the ragged offsets are boundaries and lengths: sequence b holds [offset[b], offset[b + 1]) and the offsets do not decrease. So a slot longer than its sequence (gapped, independent_starts) or a sequence stored before a sequence of lower index (out_of_order) cannot be stated. With length tensors the offsets are start positions only: any order can be stated, and the length tensors give the lengths."
    forbid: {ragged_offsets: [gapped, independent_starts, out_of_order], sequence_lengths: [uniform, lengths_in_offsets]}
    omits: "ragged_offsets value overlapping (Layer 1 D-RAGGED-NO-OVERLAP)"
    source: "DH:243-262 (the frontend checks only the offset tensor's own properties); projects/hipdnn/data_sdk/include/hipdnn_data_sdk/utilities/RaggedTensor.hpp:101-128 (with length tensors the lengths come from them; without them each length is offset[b + 1] - offset[b], and a decrease is refused)"
    debatable: "The frontend accepts any offset contents. The boundary form without length tensors is hipDNN's ragged definition; the references read the offsets that way when no length tensors are given and as start positions when they are. cuDNN's form is the same: start positions with lengths from the length tensors. Overlapping sequences stay out of the model (Layer 1 D-RAGGED-NO-OVERLAP). leading_gap (offset[0] > 0) needs no length tensors and is not removed here."
    evidence: read in code

  - id: F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN
    kind: frontend
    form: exclusion
    reason: "With max_seq_len_kv declared, each page table must be exactly ceil(max_seq_len_kv / page size) pages wide, so a surplus page with the maximum equal to the length, or exactly the needed pages with a larger maximum, cannot be stated."
    forbid_any:
      - {page_count: [surplus], max_seq_len_kv: [equal]}
      - {page_count: [exact], max_seq_len_kv: [larger]}
    source: "@ 00d9c566bea projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:355-366 (page-table dim 2 must equal ceil(max_seq_len_kv / block_size)), 304-310 (stated as cuDNN's rule)"
    note: "page_count exact + larger is stateable only when the page size does not divide S_kv (a maximum in (S_kv, pages x page size]); with the class values (S_kv 1, 128, 256; page size 1, 16, S_kv) it never is. surplus + larger stays stateable: the graph builder sets the maximum to pages x page size. A surplus table with max_seq_len_kv unset is also accepted (PV-OPTIONAL-UNSET), but the model has no unset value."
