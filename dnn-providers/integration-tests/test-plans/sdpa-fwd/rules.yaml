  - id: D-REL-VIEW-FITS-OWNER
    kind: definition
    form: exclusion
    basis: consistency
    reason: "A view reads inside its owner's buffer, so no dim of the view is larger than the owner's. V inside K needs H_v <= H_k. K inside Q needs S_kv <= S_q. The batch, K's heads against Q's heads and the head sizes always fit."
    forbid_any:
      - {tensor_overlap: [inputs_overlap], strides_v: [inherited], paged_kv: [absent], k_head_sharing: [gqa, mqa], v_head_sharing: [mha]}
      - {tensor_overlap: [inputs_overlap], strides_v: [inherited], paged_kv: [absent], k_head_sharing: [mqa], v_head_sharing: [gqa]}
      - {tensor_overlap: [inputs_overlap], strides_v: [inherited], paged_kv: [absent], k_head_sharing: [gqa], v_head_sharing: [gqa], k_heads_vs_v_heads: [differ]}
      - {tensor_overlap: [inputs_overlap], strides_k: [inherited], paged_kv: [absent], seq_q_vs_seq_kv: [shorter]}
    source: "the case builder's shared-memory check (@ 60109961eee src/sdpa-case-flow-poc/CaseGraph.cpp:1121-1134 overlapProblem: a view dim larger than its owner's dim is 'view-does-not-fit'); class_to_value.head_counts (H_v > H_k for these sharing pairs; k_and_v_differ gives V more heads than K); class_to_value.seq_lengths (shorter: S_q < S_kv)"
    adapted: "Model only: the class values fix which tensor is the view (strides `inherited`, D-INPUTS-OVERLAP-VIEW-LAYOUT) and its sizes."
    note: "The rule states the fit for unpaged storage only: the case builder makes no shared-memory view on a paged row (overlapProblem returns 'paged' before the fit check), and a paged side holds a page pool, not [B, H, S, D] slots. A view on a ragged row is out of generation (CH-RAGGED-SHARED-MEMORY-LATER)."
    evidence: read in code

  # =========================================================================== definition — structural
  # The model's shape enforces these. Rejection probes name them as their basis.
  - {id: D-S-BATCH-SHARED, kind: definition, form: structural, reason: "Q, K, V and O have one batch size.", enforced_by: "one axis batch_size", source: "a query sequence attends only to its own keys"}
  - {id: D-S-KV-LENGTH-SHARED, kind: definition, form: structural, reason: "Each key pairs with exactly one value, so K and V have one length.", enforced_by: "one axis seq_kv", source: "definition of attention"}
  - {id: D-S-QK-HEAD-DIM-SHARED, kind: definition, form: structural, reason: "A score is the dot product of a query and a key, so they have one head size.", enforced_by: "one axis head_dim_qk", source: "definition of attention"}
  - {id: D-S-OUTPUT-SHAPE, kind: definition, form: structural, reason: "O has Q's batch, heads and length and V's head size; Stats, Max and Sum_exp have one value per query row.", enforced_by: "no O or Stats size axes", source: "definition of attention and of log-sum-exp"}
  - {id: D-S-RAGGED-NEEDS-OFFSETS, kind: definition, form: structural, reason: "Ragged packing without start positions does not say where any sequence is.", enforced_by: "child axis ragged_offsets", source: "definition of ragged packing"}
  - {id: D-S-VARLEN-NEEDS-LENGTHS, kind: definition, form: structural, reason: "Variable lengths (a padding mask) without the list of lengths do not say which positions take part.", enforced_by: "sequence_lengths = variable carries both; variable_no_flag carries the lengths without the API flag (the flag is not part of the meaning, SdpaSemanticsRegister.md SEM-008); child axes per_seq_len_q, per_seq_len_kv", source: "definition of varlen attention"}
  - {id: D-S-CAUSAL-NEEDS-ALIGNMENT, kind: definition, form: structural, reason: "A causal mask with seq_q != seq_kv is defined only once one diagonal is chosen.", enforced_by: "child axis causal_alignment (one value)", source: "definition of a causal mask"}
  - {id: D-S-WINDOW-NEEDS-SIZES-AND-ALIGNMENT, kind: definition, form: structural, reason: "A sliding window is defined by its two sizes and its diagonal.", enforced_by: "child axes window_left, window_right, window_alignment", source: "definition of a sliding window"}
  - {id: D-S-BLOCK-MASK-NEEDS-PATTERN, kind: definition, form: structural, reason: "A block mask is its pattern.", enforced_by: "child axis block_mask_pattern", source: "definition of a block mask"}
  - {id: D-S-RANDOM-DROPOUT-NEEDS-P, kind: definition, form: structural, reason: "Random dropout is defined by its probability; a seed without dropout has no effect.", enforced_by: "child axes dropout_probability, dropout_rng_state", source: "definition of dropout"}
  - {id: D-S-MASK-DROPOUT-NEEDS-PATTERN, kind: definition, form: structural, reason: "Caller-mask dropout is defined by the caller's pattern and rescale factor.", enforced_by: "dropout = caller_mask carries both; child axis dropout_mask_pattern", source: "definition of dropout"}
  - {id: D-S-ONE-DROPOUT-SOURCE, kind: definition, form: structural, reason: "One dropout pattern has one source: drawn at random or given by the caller.", enforced_by: "one axis dropout (absent | random | caller_mask)", source: "consistency of a single pattern", adapted: "Names the basis of rejection probe MV-13."}
  - {id: D-S-DROPOUT-OUTPUT-NEEDS-DROPOUT, kind: definition, form: structural, reason: "There is no dropped-weight pattern to return without dropout.", enforced_by: "child axis dropout_pattern_output", source: "definition of dropout"}
  - {id: D-S-STATS-PROPERTIES-NEED-STATS, kind: definition, form: structural, reason: "Stats has a format and a layout only when it is produced.", enforced_by: "child axes dtype_stats, dim_order_stats, strides_stats, alignment_stats", source: "definition of an optional output"}
  - {id: D-S-PAGING-PROPERTIES-NEED-PAGING, kind: definition, form: structural, reason: "Page size, page table, page count and declared maximum length exist only for paged storage.", enforced_by: "child axes of paged_kv", source: "definition of paged storage"}
  - {id: D-S-SHARED-TABLE-NEEDS-BOTH-PAGED, kind: definition, form: structural, reason: "A page table shared by K and V, and a K-vs-V page-size relation, exist only when both are paged.", enforced_by: "child axes page_table_sharing and page_size_k_vs_v under paged_kv = present", source: "definition of paged storage"}
  - {id: D-S-MASK-BROADCAST-NEEDS-MASK, kind: definition, form: structural, reason: "A dropout pattern's broadcast exists only for a caller-supplied pattern.", enforced_by: "child axis dropout_mask_broadcast under dropout = caller_mask", source: "definition of a broadcast caller mask"}
  - {id: D-S-BIAS-PROPERTIES-NEED-BIAS, kind: definition, form: structural, reason: "A bias shape and format exist only for a bias.", enforced_by: "child axes bias_broadcast, bias_dtype", source: "definition of an additive term"}
  - {id: D-S-SCALE-VALUE-NEEDS-SOURCE, kind: definition, form: structural, reason: "A scale has one source: a value or a tensor, not both.", enforced_by: "one axis scale_source", source: "consistency of a single number"}

  # =========================================================================== frontend
  - id: F-ONE-DIAGONAL
    kind: frontend
    form: exclusion
    reason: "The node has one diagonal alignment and one band, so a causal mask and a sliding window cannot use different diagonals."
    forbid_any:
      - {causal_alignment: [top_left], window_alignment: [bottom_right]}
      - {causal_alignment: [bottom_right], window_alignment: [top_left]}
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:620-648 (causal setters write diagonal_alignment and right_bound); @ 91a40bdfd4c projects/hipdnn/flatbuffers_sdk/schemas/sdpa_attributes.fbs:83-84,88 (one left_bound, one right_bound, one diagonal_alignment); @ 00d9c566bea projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:149 (one diagonal_alignment member), 611-648 (set_causal_mask and set_causal_mask_bottom_right write that member), 718-722 (set_diagonal_alignment, the only other writer); node/SdpaFwdNode.hpp:40-42 -> node/detail/Utilities.hpp:479-495 validateSdpaDiagonalBand (one left_bound and one right_bound checked)"
    note: "Removed at every length relation. With equal lengths the two diagonals give the same scores, but a graph can state only one alignment, so a row that names two alignments cannot be built. Causal and sliding-window alignment must be the same."
    evidence: read in code

  - id: F-EXTENT-NONZERO
    kind: frontend
    form: value_list
    reason: "Every tensor dimension must be at least 1, so an empty batch, head set, stored length or head size cannot be stated."
    shapes_axes: [batch_size, seq_q, seq_kv, q_heads, head_dim_qk, head_dim_v]
    omits: "value class zero on each listed axis"
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/TensorAttributes.hpp:636-637 (every dim must be positive)"
    still_expressible: "A length 0 for one sequence, through per_seq_len_q / per_seq_len_kv (some_zero, all_zero)."
    evidence: read in code

  - id: F-ALIBI-NO-SLOPES
    kind: frontend
    form: value_list
    reason: "ALiBi is an on/off flag; no API sets its per-head slopes, and which slopes the flag means is not documented."
    shapes_axes: [alibi]
    omits: "the slope axis (standard, other positive, zero, negative)"
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:599 (set_alibi_mask); FBS:74; no 'slope' setting in SA, NODE, the schemas or PY"
    evidence: "read in code (absence); the meaning of alibi = present is inferred"

