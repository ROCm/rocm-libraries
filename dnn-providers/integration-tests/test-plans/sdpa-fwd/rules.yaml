# Case model: rules for FORWARD SDPA (companion to model.yaml).
#
# What this file is
#   Every rule the case generator applies to the axes of model.yaml. The generator applies all
#   rules at once; their order has no effect. A generated row never breaks a rule.
#
# Kind tags (who may change a rule)
#   definition  a fact about attention or about numbers. It never changes. Do not edit it to fit a
#               library. (Ids D-*; ids are stable across files and reports.)
#   frontend    a limit of hipDNN's frontend API. Change it when the API changes. (Ids F-*.)
#   choice      a judgement call: classes, representative values, budgets, fixed settings.
#               Change it freely, and record why. (Ids CH-*.)
#   policy      a request that means something (not Layer 1) and that the frontend accepts today
#               (not Layer 2), but that hipDNN should refuse. Removed from the numerical levels and
#               recorded as a "should be refused" case for the rejection suite; `ticket` names the
#               frontend gap. Change it when hipDNN's policy changes. (Ids P-*.)
#   engine:<name>  written by discovery, in a separate file of the same format.
#
# Rule fields
#   id, kind, reason (one line), source (where the fact or the decision comes from).
#   basis       for definition rules: meaning (the combination has no defined result) or
#               consistency (the combination contradicts itself, or a class cannot hold the values).
#   form        exclusion   — removes rows; has `forbid` or `forbid_any`.
#               value_list  — explains why values or axes are absent from model.yaml. Removes
#                             nothing at generation time; `shapes_axes` lists the model axes it
#                             shaped, `omits` (text) names what is absent.
#               structural  — a fact that model.yaml enforces by its shape (one shared axis or a
#                             child axis). Removes nothing; `enforced_by` says how. Kept so that a
#                             rejection probe can name the fact it tests.
#               setting     — a choice that fixes how the model is built or used; `applies_to`
#                             lists the axes it concerns.
#   forbid      map axis -> list of values. A row is excluded when, for EVERY listed axis, the
#               row's value is in the list. A child axis that is not active never matches.
#   forbid_any  list of `forbid` maps; the rule excludes a row that matches any one of them.
#   adapted     for definition rules: how the rule differs from its Layer 1 form (branches
#               dropped because their values are not expressible).
#   probe       the injections.yaml rejection-probe entry that adds the removed request back.
#   evidence    read in code | inferred | measured.
#   moot        a definition rule whose values are all outside the model: it has no `forbid`, removes
#               nothing, and is kept so that its rejection probe can name it. Says why.
#   covered_by  for a policy rule with no `forbid`: the rule that already removes every request it
#               names (form `covered`). It removes nothing itself.
#   ticket      for policy rules: the Jira issue that asks hipDNN to refuse the request.
#   debatable   the rule records a validation choice, not an impossibility; it is a draft.
#
# File and line citations (SA:, NODE:, TA:, ...) use the abbreviations of model.yaml
# `api_record.paths`. A citation with "@ <commit>" gives the line numbers at that commit.

schema_version: 1
model: sdpa_forward
applies_to_model: model.yaml

rules:

  # =========================================================================== definition — meaning
  - id: D-HEADS-K-DIVIDES
    kind: definition
    form: exclusion
    basis: meaning
    reason: "Each query head must use exactly one K head; with K heads not dividing query heads no grouping exists."
    forbid: {k_head_sharing: [non_divisor]}
    source: "definition of grouped attention: query head h uses K head floor(h / (H_q / H_k))"
    frontend_enforces: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:129-152 refuses it, so it is not a rejection probe"

  - id: D-HEADS-V-DIVIDES
    kind: definition
    form: exclusion
    basis: meaning
    reason: "Each query head must use exactly one V head; with V heads not dividing query heads no grouping exists."
    forbid: {v_head_sharing: [non_divisor]}
    source: "definition of grouped attention (as D-HEADS-K-DIVIDES, for V)"
    frontend_enforces: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:129-152"

  - id: D-DROPOUT-P-RANGE
    kind: definition
    form: exclusion
    basis: meaning
    reason: "A dropout probability is a probability; a value below 0 or above 1 is not one."
    forbid: {dropout_probability: [negative, above_one]}
    source: "definition of a probability"
    probe: MV-01

  - id: D-OUTPUTS-OVERLAP
    kind: definition
    form: exclusion
    basis: meaning
    reason: "Two different results cannot both be stored in the same memory."
    forbid: {tensor_overlap: [outputs_overlap]}
    source: "one memory location holds one value"
    probe: MV-05

  - id: D-OUTPUT-SELF-ALIAS
    kind: definition
    form: exclusion
    basis: meaning
    reason: "An output stride pattern that sends two different output elements to one address cannot hold both results."
    forbid_any:
      - {strides_o: [zero_broadcast, self_overlapping]}
      - {strides_stats: [zero_broadcast, self_overlapping]}
    source: "one memory location holds one value; a zero stride is a broadcast, defined only for reading"
    probe: MV-04

  - id: D-BIAS-SHAPE
    kind: definition
    form: exclusion
    basis: meaning
    reason: "A bias that cannot be broadcast to the score shape has no score to add each element to."
    forbid: {bias_broadcast: [not_broadcastable]}
    source: "definition of an additive score term: one bias value per score, after broadcasting"
    probe: MV-06

  - id: D-SEQLEN-WITHIN-STORAGE
    kind: definition
    form: exclusion
    basis: meaning
    reason: "A sequence length longer than its storage describes tokens that do not exist."
    forbid_any:
      - {per_seq_len_q: [exceeds_storage]}
      - {per_seq_len_kv: [exceeds_storage]}
    source: "a real length counts stored tokens"
    probe: MV-09

  - id: D-RAGGED-NO-OVERLAP
    kind: definition
    form: exclusion
    basis: meaning
    reason: "Two sequences of an output cannot share memory: two results would be written to one place. hipDNN's ragged form also refuses input sequences that share memory."
    note: "The input half rests on hipDNN's ragged format, not on the definition of attention."
    source: "one memory location holds one value; projects/hipdnn/data_sdk/include/hipdnn_data_sdk/utilities/RaggedTensor.hpp:208-219 (overlapping token intervals are refused)"
    probe: MV-10
    moot: "Removes nothing. The value overlapping ({ragged_offsets: [overlapping]}) is not in the model: Layer 1 removes it on its own. Its probe belongs to the rejection suite."

  - id: D-PAGES-SUFFICIENT
    kind: definition
    form: exclusion
    basis: meaning
    reason: "A page table with fewer pages than the key/value length needs cannot address every key and value."
    forbid: {page_count: [insufficient]}
    source: "paged storage: every key and value lives on a listed page"
    probe: MV-08

  - id: D-MAXLEN-NOT-BELOW-ACTUAL
    kind: definition
    form: exclusion
    basis: meaning
    reason: "A declared maximum key/value length below the actual length contradicts the actual length."
    forbid: {max_seq_len_kv: [smaller]}
    source: "definition of a maximum"
    probe: MV-07

  # =========================================================================== definition — consistency
  - id: D-REL-SEQ
    kind: definition
    form: exclusion
    basis: consistency
    reason: "The query-vs-key/value relationship must agree with the two length classes (one < many)."
    forbid_any:
      - {seq_q: [one], seq_kv: [many], seq_q_vs_seq_kv: [equal, longer]}
      - {seq_q: [many], seq_kv: [one], seq_q_vs_seq_kv: [shorter, equal]}
      - {seq_q: [one], seq_kv: [one], seq_q_vs_seq_kv: [shorter, longer]}
    source: "order of whole numbers: 1 < 2 or more"
    adapted: "Branches with length class zero dropped: zero is not in the model (F-EXTENT-NONZERO)."

  - id: D-REL-HEAD-SHARING
    kind: definition
    form: exclusion
    basis: consistency
    reason: "With one query head, the only possible K or V head count equals the query head count (MHA)."
    forbid_any:
      - {q_heads: [one], k_head_sharing: [gqa, mqa]}
      - {q_heads: [one], v_head_sharing: [gqa, mqa]}
    source: "a divisor of 1 is 1"
    adapted: "q_heads class zero dropped (F-EXTENT-NONZERO)."

  - id: D-REL-K-V-HEADS
    kind: definition
    form: exclusion
    basis: consistency
    reason: "Whether K and V head counts are equal must agree with their two sharing relationships."
    forbid_any:
      - {k_head_sharing: [mha], v_head_sharing: [mha], k_heads_vs_v_heads: [differ]}
      - {k_head_sharing: [mqa], v_head_sharing: [mqa], k_heads_vs_v_heads: [differ]}
      - {k_head_sharing: [mha], v_head_sharing: [gqa, mqa], k_heads_vs_v_heads: [equal]}
      - {k_head_sharing: [gqa, mqa], v_head_sharing: [mha], k_heads_vs_v_heads: [equal]}
      - {k_head_sharing: [mqa], v_head_sharing: [gqa], k_heads_vs_v_heads: [equal]}
      - {k_head_sharing: [gqa], v_head_sharing: [mqa], k_heads_vs_v_heads: [equal]}
    source: "H_k and H_v are fixed by H_q and the sharing value"

  - id: D-REL-WINDOW
    kind: definition
    form: exclusion
    basis: consistency
    reason: "A window that covers some but not all keys needs at least two keys."
    forbid_any:
      - {seq_kv: [one], window_left: [partial]}
      - {seq_kv: [one], window_right: [partial]}
    source: "a strict non-empty subset of one key does not exist"
    adapted: "seq_kv class zero dropped (F-EXTENT-NONZERO)."

  - id: D-REL-PER-SEQ-LEN
    kind: definition
    form: exclusion
    basis: consistency
    reason: "Per-sequence length classes must be possible for the batch size and the stored length."
    forbid_any:
      - {batch_size: [one], per_seq_len_q: [mixed, some_zero]}
      - {batch_size: [one], per_seq_len_kv: [mixed, some_zero]}
      - {seq_q: [one], per_seq_len_q: [all_equal_partial, mixed]}
      - {seq_kv: [one], per_seq_len_kv: [all_equal_partial, mixed]}
    source: "'mixed' and 'some zero' need two sequences; a partial length needs a stored length of 2 or more"
    adapted: "Branches with batch, seq_q or seq_kv class zero dropped (F-EXTENT-NONZERO)."

  - id: D-REL-RAGGED-ORDER
    kind: definition
    form: exclusion
    basis: consistency
    reason: "Out-of-order or independent start positions need at least two sequences: one sequence has no order, and a gap between sequences needs two."
    forbid: {batch_size: [one], ragged_offsets: [out_of_order, independent_starts]}
    source: "an order and a gap between items need two items"
    adapted: "batch class zero dropped (F-EXTENT-NONZERO); value overlapping dropped (not in the model: D-RAGGED-NO-OVERLAP)."

  - id: D-REL-PAGE-SIZE
    kind: definition
    form: exclusion
    basis: consistency
    reason: "A page size between one token and a whole sequence needs a key/value length of at least two."
    forbid: {seq_kv: [one], page_size: [partial, large]}
    source: "no whole number lies strictly between 1 and 1"
    adapted: "seq_kv class zero dropped (F-EXTENT-NONZERO)."

  - id: D-REL-SUB-ELEMENT-ALIGNMENT
    kind: definition
    form: exclusion
    basis: consistency
    reason: "An address cannot be part of a byte, so a 1-byte format cannot start off its element size."
    forbid_any:
      - {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], alignment_q: [sub_element]}
      - {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], dtype_k_vs_q: [same], alignment_k: [sub_element]}
      - {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], dtype_v_vs_q: [same], alignment_v: [sub_element]}
      - {dtype_q: [fp16, bf16], dtype_k_vs_q: [differs], alignment_k: [sub_element]}
      - {dtype_q: [fp16, bf16], dtype_v_vs_q: [differs], alignment_v: [sub_element]}
      - {dtype_o: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], alignment_o: [sub_element]}
      - {dtype_stats: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], alignment_stats: [sub_element]}
    source: "byte addressing; element sizes in model.yaml `formats`"
    adapted: "The Layer 1 rule states it per tensor in absolute formats; here it is written in the model's relative-format axes: the class sub_element has no value for 1-byte formats. K and V with dtype_*_vs_q = differs are 1-byte fp8 when dtype_q is fp16 or bf16 (class_to_value.dtype_relation)."
    evidence: inferred

  - id: D-REL-STRIDE-NEEDS-EXTENT
    kind: definition
    form: exclusion
    basis: consistency
    reason: "A zero or negative stride needs a dimension with more than one element, and a self-overlapping stride needs two; a head-dim stride needs a head size above one."
    forbid_any:
      - {head_dim_qk: [d1], strides_q: [head_dim_strided]}
      - {head_dim_qk: [d1], strides_k: [head_dim_strided]}
      - {head_dim_v: [d1], strides_v: [head_dim_strided]}
      - {head_dim_v: [d1], strides_o: [head_dim_strided]}
      - {batch_size: [one], q_heads: [one], seq_q: [one], head_dim_qk: [d1], strides_q: [zero_broadcast, negative, self_overlapping]}
      - {batch_size: [one], q_heads: [one], seq_kv: [one], head_dim_qk: [d1], strides_k: [zero_broadcast, negative, self_overlapping]}
      - {batch_size: [one], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d1], strides_k: [zero_broadcast, negative, self_overlapping]}
      - {batch_size: [one], q_heads: [one], seq_kv: [one], head_dim_v: [d1], strides_v: [zero_broadcast, negative, self_overlapping]}
      - {batch_size: [one], v_head_sharing: [mqa], seq_kv: [one], head_dim_v: [d1], strides_v: [zero_broadcast, negative, self_overlapping]}
      - {batch_size: [one], q_heads: [one], seq_q: [one], head_dim_v: [d1], strides_o: [negative]}
      - {batch_size: [one], q_heads: [one], seq_q: [one], strides_stats: [negative]}
      - {batch_size: [one], q_heads: [one], seq_q: [one], head_dim_qk: [d1, d64, d96, d128, d192, d256, d512, d576], strides_q: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], seq_q: [many], head_dim_qk: [d1], strides_q: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], seq_q: [one], head_dim_qk: [d1], strides_q: [self_overlapping]}
      - {batch_size: [many], q_heads: [one], seq_q: [one], head_dim_qk: [d1], strides_q: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d1, d64, d96, d128, d192, d256, d512, d576], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d1, d64, d96, d128, d192, d256, d512, d576], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [one, many], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [equal, larger], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [many], head_dim_qk: [d1], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], k_head_sharing: [mha], seq_kv: [many], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mha, gqa, mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mha, gqa, mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mha, gqa, mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one, many], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [larger], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [many], head_dim_qk: [d1], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [many], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], k_head_sharing: [mqa], seq_kv: [many], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d1], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [one], k_head_sharing: [mha], seq_kv: [one], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [one], k_head_sharing: [mha], seq_kv: [many], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [absent], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token, whole_sequence], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [many], k_head_sharing: [mqa], seq_kv: [one], head_dim_qk: [d1], paged_kv: [v_only], max_seq_len_kv: [equal], strides_k: [self_overlapping]}
      - {batch_size: [many], q_heads: [many], k_head_sharing: [mqa], seq_kv: [many], head_dim_qk: [d1], paged_kv: [present, k_only], page_size: [one_token], strides_k: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one], head_dim_v: [d1, d64, d96, d128, d192, d256, d512, d576], paged_kv: [absent], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one], head_dim_v: [d1], paged_kv: [present], page_size: [one_token, whole_sequence], page_size_k_vs_v: [equal, differ], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one, many], head_dim_v: [d1], paged_kv: [k_only], max_seq_len_kv: [equal, larger], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one], head_dim_v: [d1, d64, d96, d128, d192, d256, d512, d576], paged_kv: [v_only], page_size: [one_token, whole_sequence], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one], head_dim_v: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [present], page_size: [one_token, whole_sequence], page_size_k_vs_v: [equal], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [one], head_dim_v: [d64, d96, d128, d192, d256, d512, d576], paged_kv: [k_only], max_seq_len_kv: [equal], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [many], head_dim_v: [d1], paged_kv: [absent], strides_v: [self_overlapping]}
