    form: value_list
    reason: "No API sets logit soft-capping; set_score_mod is always refused at validate."
    shapes_axes: []
    omits: "axes logit_softcap and its cap value"
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:36-38 (unsupported usage refused); @ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:811-815 (set_score_mod); no softcap field in SA, NODE or the schemas"
    evidence: read in code

  - id: F-NO-KV-APPEND
    kind: frontend
    form: value_list
    reason: "No API asks the operation to write new keys and values into an existing cache."
    shapes_axes: []
    omits: "axis kv_cache_append"
