      - {ragged_offsets: [independent_starts], batch_packing: [ragged_kv_side], per_seq_len_kv: [all_full, all_equal_partial, all_zero]}
    source: "class_to_value.ragged_offsets.independent_starts: the gap before sequence b is S - its live length"
    adapted: "Model only: Layer 1 asks only for spare room (D-REL-GAPPED-NEEDS-SHORT-LENGTHS); the class value fixes how the spare room is placed."
    evidence: inferred

  - id: D-REL-LENGTHS-IN-OFFSETS
