      - {batch_size: [one], q_heads: [one], v_head_sharing: [mha], seq_kv: [many], head_dim_v: [d1], paged_kv: [v_only], page_size: [one_token, whole_sequence], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], v_head_sharing: [mha, gqa, mqa], seq_kv: [one], head_dim_v: [d1], paged_kv: [absent], strides_v: [self_overlapping]}
      - {batch_size: [one], q_heads: [many], v_head_sharing: [mha, gqa], seq_kv: [one], head_dim_v: [d1], paged_kv: [present], page_size: [one_token, whole_sequence], page_size_k_vs_v: [equal], strides_v: [self_overlapping]}
