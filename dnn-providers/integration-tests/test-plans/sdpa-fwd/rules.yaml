  - id: D-REL-GAPPED-NEEDS-SHORT-LENGTHS
    kind: definition
    form: exclusion
    basis: consistency
    reason: "A gap needs a slot longer than its live sequence, so some live length on a ragged side must be shorter than its slot."
    forbid_any:
      - {ragged_offsets: [gapped, leading_gap, independent_starts], batch_packing: [ragged], per_seq_len_q: [all_full], per_seq_len_kv: [all_full]}
      - {ragged_offsets: [gapped, leading_gap, independent_starts], batch_packing: [ragged_q_side], per_seq_len_q: [all_full]}
      - {ragged_offsets: [gapped, leading_gap, independent_starts], batch_packing: [ragged_kv_side], per_seq_len_kv: [all_full]}
      - {ragged_offsets: [leading_gap, independent_starts], sequence_lengths: [uniform]}
    source: "a side's slots hold B x the stored length; spare room exists only where a live length is shorter than its slot"
    note: "gapped and independent_starts with sequence_lengths uniform or lengths_in_offsets are F-RAGGED-OFFSETS-ARE-LENGTHS. A ragged side is the Q side (Q and O) or the K/V side (K and V)."
    evidence: inferred

  - id: D-REL-INDEPENDENT-STARTS-NEED-DIFFERENT-LENGTHS
    kind: definition
    form: exclusion
    basis: consistency
    reason: "independent_starts puts each sequence at the end of its full slot, so the gaps differ in size only when the live lengths on a ragged side differ."
    forbid_any:
      - {ragged_offsets: [independent_starts], batch_packing: [ragged], per_seq_len_q: [all_full, all_equal_partial, all_zero], per_seq_len_kv: [all_full, all_equal_partial, all_zero]}
