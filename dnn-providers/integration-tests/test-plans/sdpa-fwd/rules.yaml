  # =========================================================================== policy
  # Meaningful layouts that the frontend accepts today and hipDNN should refuse. They leave the
  # numerical levels and come back as rejection probes.
  - id: P-NO-OUTPUT-BROADCAST
    kind: policy
    form: covered
    reason: "A zero stride on a dimension of size > 1 of O, Stats, Max or Sum_exp should be refused."
    covered_by: D-OUTPUT-SELF-ALIAS
    ticket: ALMIOPEN-3155
    source: "hipDNN policy"
    note: "Removes nothing: D-OUTPUT-SELF-ALIAS already removes zero_broadcast on strides_o and strides_stats (zero_broadcast means a dimension of extent > 1), and Max and Sum_exp have no stride axis (always packed). Its probes are MV-04a and MV-04c."
    probe: MV-04
    evidence: read in code

  - id: P-RAGGED-STRIDES-NO-ALIAS
    kind: policy
    form: exclusion
    reason: "A ragged Q, K or V with a zero sequence stride, or with token rows or heads that share elements, should be refused. The ragged tensor contract of RFC 0014 needs a positive sequence-axis stride and the sorted-stride rule over the non-batch axes."
    forbid_any:
      - {batch_packing: [ragged, ragged_q_side], seq_q: [many], strides_q: [zero_broadcast]}
      - {batch_packing: [ragged, ragged_q_side], seq_q: [many], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], strides_q: [self_overlapping]}
      - {batch_packing: [ragged, ragged_q_side], seq_q: [many], q_heads: [many], strides_q: [self_overlapping]}
      - {batch_packing: [ragged, ragged_q_side], q_heads: [many], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], strides_q: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], seq_kv: [many], strides_k: [zero_broadcast]}
      - {batch_packing: [ragged, ragged_kv_side], paged_kv: [v_only], max_seq_len_kv: [larger], strides_k: [zero_broadcast]}
      - {batch_packing: [ragged, ragged_kv_side], seq_kv: [many], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], strides_k: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], paged_kv: [v_only], max_seq_len_kv: [larger], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], strides_k: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], seq_kv: [many], q_heads: [many], k_head_sharing: [mha, gqa], strides_k: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], paged_kv: [v_only], max_seq_len_kv: [larger], q_heads: [many], k_head_sharing: [mha, gqa], strides_k: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], q_heads: [many], k_head_sharing: [mha, gqa], head_dim_qk: [d64, d96, d128, d192, d256, d512, d576], strides_k: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], v_packing: [as_k, own_starts], seq_kv: [many], strides_v: [zero_broadcast]}
      - {batch_packing: [ragged, ragged_kv_side], v_packing: [as_k, own_starts], seq_kv: [many], head_dim_v: [d64, d96, d128, d192, d256, d512, d576], strides_v: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], v_packing: [as_k, own_starts], seq_kv: [many], q_heads: [many], v_head_sharing: [mha, gqa], strides_v: [self_overlapping]}
      - {batch_packing: [ragged, ragged_kv_side], v_packing: [as_k, own_starts], q_heads: [many], v_head_sharing: [mha, gqa], head_dim_v: [d64, d96, d128, d192, d256, d512, d576], strides_v: [self_overlapping]}
    ticket: "to file"
    source: "projects/hipdnn/docs/rfcs/0014_RaggedTensors.md (constructor-time validation: a positive sequence-axis stride; the sorted-stride rule, with the batch axis excluded and zero-stride axes exempt); the data SDK refuses the layout (@ 60109961eee projects/hipdnn/data_sdk/include/hipdnn_data_sdk/utilities/RaggedTensor.hpp:69-71, 171-173, 255 sorted-stride rule)"
    note: "class_to_value.strides puts a zero stride on S first (then H, B, D): it breaks the contract only on S. self_overlapping goes on S first (then H, B) and shares elements with a partner dim (D first, then S, H, B); it breaks the contract unless the partner is the batch axis, so it needs S or H above 1 and D or a second non-batch dim above 1. The dense K beside a paged V has S = max_seq_len_kv. A ragged V is never paged (D-RAGGED-NOT-THROUGH-PAGES). O and Stats take neither stride (D-OUTPUT-SELF-ALIAS). AK-RAGGED-TOKEN-MAJOR names these layouts as uncheckable. F-RAGGED-MULTIPLIER-AT-LEAST-ONE removes a zero sequence stride on a shared-token ragged tensor. A view (`inherited`) of a ragged owner is out of generation (CH-RAGGED-SHARED-MEMORY-LATER)."
    evidence: read in code

  # =========================================================================== choice
  - id: CH-SIZE-CLASSES
    kind: choice
    form: setting
    reason: "Sizes enter as meaning classes (one, many) plus relationship axes; concrete numbers come from class_to_value."
    applies_to: [batch_size, seq_q, seq_kv, seq_q_vs_seq_kv, q_heads, k_head_sharing, v_head_sharing, k_heads_vs_v_heads]
    source: "the narrowing method: meaning classes, then concrete values from class_to_value"

  - id: CH-HEAD-DIM-LEVELS
    kind: choice
    form: setting
    reason: "Head sizes are carried as representative levels d1, d64, d96, d128, d192, d256, d512, d576, so an engine's single-value refusal names one size; the v-vs-qk relation follows from the two levels."
    applies_to: [head_dim_qk, head_dim_v]
    source: "include the values the engine is sensitive to, e.g. head sizes 64, 128, 192; rules hold only for the tested values"

  - id: CH-DTYPE-MIX-RELATIONSHIP
    kind: choice
    form: setting
    reason: "K and V formats are carried relative to Q (same / differs), with one alternative format per Q format, to keep one axis to stratify by format."
    applies_to: [dtype_q, dtype_k_vs_q, dtype_v_vs_q]
    source: "supports per-format pairwise (CH-STRATIFY-DTYPE)"

  - id: CH-FLOAT-FORMATS-ONLY
    kind: choice
    form: setting
    reason: "Tensor formats are the seven float formats; compute types are fp32, fp16, bf16. The frontend also maps DOUBLE, FP8_E8M0, FP4, FP6, integer and BOOLEAN types; they are outside the model."
    applies_to: [dtype_q, dtype_o, dtype_stats, bias_dtype, compute_precision, matmul_input_precision]
    source: "frontend facts T:835-878, DH:106-110, BASE:242-246"

  - id: CH-SCALE-DELIVERY-LEVELS
    kind: choice
    form: setting
    reason: "scale_source carries the four API delivery forms (float attribute, by-value constant, runtime parameter, device tensor), grouped into classes constant and runtime."
    applies_to: [scale_source]
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:347,668 (the two set_attn_scale setters); TA:228-313"

  - id: CH-PAIRED-SETTERS
    kind: choice
    form: setting
    reason: "Setters that belong together are one axis: descale_s with scale_s. One alone is outside the model. logit_max and score_sum_exp, and the K and V page tables, are not paired: each alone is a model value (max_sumexp_output max_only / sum_exp_only, paged_kv k_only / v_only)."
    applies_to: [s_quantization]
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:457-514"

  - id: CH-FIXED-API-SETTINGS
    kind: choice
    form: setting
    reason: "Held fixed: workspace large enough; O and Stats non-virtual with an explicit format; graph default types unset; one fixed node name; engine pinned by name by the driver."
    applies_to: []
    source: "@ 91a40bdfd4c projects/hipdnn/frontend/include/hipdnn_frontend/Graph.hpp:4855, 1008-1013"

  - id: CH-FIXED-STORAGE-ROUTE
    kind: choice
    form: setting
    reason: "The storage route (by value or device memory) of the caller-mask dropout scale and of one-element descale and scale factors is held fixed: the dropout scale is by value, a one-element factor follows the runner's descale form. Varying it is follow-up work."
    applies_to: [dropout, descale_q, descale_k, descale_v, s_quantization, scale_o]
    source: "Layer 0 axes dropout_scale_storage and descale_storage"

  - id: CH-FOLDED-CHILD-AXES
    kind: choice
    form: setting
    reason: "Some Layer 0 child axes are carried inside one model axis. ragged_offset_form holds ragged_offset_unit and ragged_offset_sharing: per-tensor lists in elements, or one token list per side; a per-tensor token list and a shared element list are not model values. sequence_lengths holds length_form (variable and variable_no_flag: length tensors; lengths_in_offsets: start-position differences; cu_seq_len: cumulative lengths). dropout_rng_state holds rng_state_storage (caller_supplied: by value; caller_supplied_device_memory: device memory)."
    applies_to: [ragged_offset_form, sequence_lengths, dropout_rng_state]
    source: "Layer 0 axes ragged_offset_unit, ragged_offset_sharing, length_form, rng_state_storage"

  - id: CH-FUZZER-HINTS
    kind: choice
    form: exclusion
    reason: "Value classes of tensor contents are hints for a fuzzer, not for test-case generation. Every case holds the representative class of each; the other classes stay in the model with their labels."
    forbid_any:
      - {scale_value: [non_finite]}
      - {sink_values: [no_sink, very_large, non_finite]}
      - {scale_factor_values: [one, zero, non_finite]}
      - {special_values: [infinity, nan, negative_infinity_bias, subnormal, signed_zero]}
      - {value_magnitude: [overflow_prone, precision_loss_prone]}
    source: "user decision 2026-11-04: the content value classes are left as hints for a fuzzer; a NaN or infinite scale is held out with no answer"

  - id: CH-RAGGED-SHARED-MEMORY-LATER
    kind: choice
    form: exclusion
    reason: "Inputs that share memory on a ragged row are left out of generation. ALMIOPEN-3180 tracks aliases whose owner is ragged."
    forbid: {batch_packing: [ragged, ragged_q_side, ragged_kv_side], tensor_overlap: [inputs_overlap]}
    source: "judgement call, 2026-11-06; ALMIOPEN-3180"

  - id: CH-STRATIFY-DTYPE
    kind: choice
    form: setting
    reason: "Extra strength goes to the format axis: one complete pairwise set per dtype_q value. A second extra-strength axis (dim_order_q) is counted, not generated."
    applies_to: [dtype_q, dim_order_q]
    source: "per-data-type pairwise; dim_order_q is the candidate second axis"

  - id: CH-SHARED-BASE
    kind: choice
    form: setting
    reason: "The shared one-at-a-time base is model.yaml base_cases.shared: bf16, head size 128/128, no mask, chosen inside ASM_SDPA_ENGINE's support on gfx942 and gfx950."
    applies_to: [dtype_q, head_dim_qk, head_dim_v, causal_mask, sliding_window]
    source: "one shared base inside the engine's support on both archs; no per-engine base"

  - id: CH-KEEP-EQUIVALENT-ROWS
    kind: choice
    form: setting
    reason: "Combinations with the same result are kept, not merged (e.g. top-left and bottom-right causal with equal lengths; p = 0 vs no dropout; scale 1/sqrt(d) by value vs unset at d = 1)."
    applies_to: [causal_alignment, window_alignment, dropout_probability, scale_value]
    source: "an engine may treat equivalent requests differently"

  - id: CH-KEEP-OPEN-QUESTIONS
    kind: choice
    form: setting
    reason: "Debatable values stay in the model until they are decided: fully-masked rows, non-finite scale (held out of generation by CH-FUZZER-HINTS), p = 1, K heads != V heads, random dropout with no seed, output over an input."
    applies_to: [block_mask_pattern, scale_value, dropout_probability, k_heads_vs_v_heads, dropout_rng_state, tensor_overlap]
    source: "open questions: fully-masked rows, non-finite scale, p = 1, K heads != V heads, random dropout with no seed, output over an input"

  - id: CH-PAIRWISE-STRENGTH
    kind: choice
    form: setting
    reason: "Shared sets: one-at-a-time from the shared base, then pairwise (strength 2) over all axes."
    applies_to: []
    source: "one-at-a-time, complemented with 2-wise"
