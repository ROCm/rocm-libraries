      runtime_parameter: [common, "yes", "yes"]
      device_tensor: [rare, "yes", "yes"]

  - id: scale_value
    kind: child
    value_kind: class
    parent: {scale_source: [attribute_value, by_value_constant_tensor, runtime_parameter, device_tensor]}
    level: graph   # the value is part of the graph for attribute_value / by-value; data for device_tensor
    meaning: "The scale number."
    values:
      - {id: inverse_sqrt_d, meaning: "1/sqrt(head_dim_qk)"}
      - {id: other_positive, meaning: "another positive number"}
      - {id: zero, meaning: "0: every score becomes 0"}
      - {id: negative, meaning: "a negative number"}
      - {id: non_finite, meaning: "NaN or +/-inf (removed by D-SCALE-FINITE; kept for the rejection suite)"}
    api_paths: [cpp, python]
    cite: "SA:665-669 (any float accepted)"
    note: "For scale_source = device_tensor the number is tensor contents (execute level)."
    group: G3-precision-scale
    size_sensitive: ["no", "one scalar"]
    labels:
      inverse_sqrt_d: [common, "yes", "yes"]
      other_positive: [common, "yes", "yes"]
      zero: [rare, "yes", "yes"]
      negative: [rare, "yes", "yes"]
      non_finite: [rare, "yes", "yes"]

