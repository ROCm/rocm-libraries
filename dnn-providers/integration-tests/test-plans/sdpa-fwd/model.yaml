    group: G3-precision-scale
    size_sensitive: ["no", "a fuzzer hint, held out of generation"]
    labels:
      ordinary: [common, "yes", "yes"]
      overflow_prone: [rare, "yes", "no"]
      precision_loss_prone: [rare, "yes", "no"]

# Not in the model at all (no axis), with the reason. Text only.
omitted:
  - {what: "logit soft-capping", reason: "no API (frontend rule F-NO-SOFTCAP)"}
  - {what: "KV-cache append", reason: "no API (frontend rule F-NO-KV-APPEND)"}
  - {what: "amax of Q, K, V", reason: "no API (frontend rule F-NO-AMAX-QKV)"}
  - {what: "ALiBi slope values", reason: "no API (frontend rule F-ALIBI-NO-SLOPES)"}
  - {what: "tensor contents: which random draw fills a tensor (value distribution, signs, data seed)", reason: "chosen when classes become concrete test data, after this model. The value classes that decide whether a result exists or is exact are the axes special_values, value_magnitude, sink_values, scale_factor_values and scale_value non_finite: hints for a fuzzer (CH-FUZZER-HINTS)"}
  - {what: "GPU architecture and model, OS, software stack", reason: "where the operation runs; discovery runs per GPU type"}
  - {what: "engine choice, plan policy, autotune, knobs", reason: "engine selection is the driver's job (pin by name)"}
  - {what: "workspace, node name, graph default types, virtual-output flag", reason: "held fixed by choice rule CH-FIXED-API-SETTINGS"}
  - {what: "ragged offsets per tensor in tokens, and one element-offset tensor shared by a side", reason: "ragged_offset_form holds per-tensor element offsets and one token list per side (choice rule CH-FOLDED-CHILD-AXES)"}
  - {what: "deprecated causal flags, Python; the alias setters set_is_inference (set_generate_stats(!b)), set_sliding_window_length (set_diagonal_band_left_bound) and _set_mma_core_mode (set_mma_core_mode)", reason: "other API routes to the same request; API-path variants in injections.yaml, or aliases of a modelled setter"}
  - {what: "the cuDNN-compatibility entry point", reason: "the same request with matmul_input_precision fp16 when the caller leaves it unset (API-path variant PV-CUDNN-COMPAT)"}
  - {what: "INT64 length tensors and page tables", reason: "the frontend takes INT32 only (frontend rule F-INDEX-TENSORS-INT32)"}
  - {what: "the unfuse-FMA hint (set_unfuse_fma)", reason: "advisory: Graph::sdpa warns and then ignores it (@ 91a40bdfd4c Graph.hpp:6382)"}
  - {what: "storage route of the caller-mask dropout scale and of one-element descale and scale factors (by value or device memory)", reason: "storage route held fixed; follow-up (choice rule CH-FIXED-STORAGE-ROUTE)"}

# ---------------------------------------------------------------------------------------------
# Class-to-value table.
# ⚠️ Rules hold only for the tested values. Results must quote the concrete values used.
# Values the engine under test is sensitive to are included on purpose (head sizes 64, 128, 192;
# bf16 and fp8 e4m3 fnuz; top-left vs bottom-right causal), taken from the forward support of
# ASM_SDPA_ENGINE.
# No tile-edge or hazard values (127/129, primes, not a multiple of 8): they belong to concrete
# test data, after this model.
# ---------------------------------------------------------------------------------------------
# Entry format. Every field is read by a program except `note`, which is text for people.
#   size     an integer; a symbol (B, H_q, S, S_q, S_kv, D, head_dim_qk, head_dim_v, page_size,
#            exact, element_size); {of: <size>, add: n}; {of: <size>, multiply: n};
#            {of: <size>, divide: n, minimum: n}; or {ceil_div: [<size>, <size>]}.
#   number   a YAML number; .nan and .inf for non-finite values; {numerator: n, denominator: n}.
class_to_value:
  batch_size: {one: 1, many: 2}
  q_heads: {one: 1, many: 8}
  seq_lengths:  # (seq_q class, seq_kv class, seq_q_vs_seq_kv) -> (S_q, S_kv)
    - {seq_q: one, seq_kv: one, seq_q_vs_seq_kv: equal, S_q: 1, S_kv: 1}
    - {seq_q: one, seq_kv: many, seq_q_vs_seq_kv: shorter, S_q: 1, S_kv: 256}
    - {seq_q: many, seq_kv: one, seq_q_vs_seq_kv: longer, S_q: 256, S_kv: 1}
    - {seq_q: many, seq_kv: many, seq_q_vs_seq_kv: shorter, S_q: 128, S_kv: 256}
    - {seq_q: many, seq_kv: many, seq_q_vs_seq_kv: equal, S_q: 256, S_kv: 256}
    - {seq_q: many, seq_kv: many, seq_q_vs_seq_kv: longer, S_q: 256, S_kv: 128}
  head_counts:  # H_k or H_v by sharing value, keyed by the q_heads class (H_q 1 or 8)
    mha: {by_q_heads: {one: 1, many: 8}}
    gqa: {by_q_heads: {many: 2}, divide_q_heads_by: 4, minimum: 2,
          k_and_v_differ: {H_k: 2, H_v: 4},
          note: "H = H_q / 4, at least 2. k_and_v_differ applies when k_heads_vs_v_heads = differ and both sharings are gqa."}
    mqa: {by_q_heads: {one: 1, many: 1}}
    non_divisor: {by_q_heads: {one: 2, many: 3}}
    with_alibi_not_power_of_two:  # when alibi_head_count = not_power_of_two; keyed by the replaced H_q
      H_q: {6: 6, 24: 24}
      mha: {6: 6, 24: 24}
      gqa: {6: 2, 24: 6}
      mqa: {6: 1, 24: 1}
      k_and_v_differ: {6: {H_k: 2, H_v: 3}, 24: {H_k: 6, H_v: 12}}
      note: "gqa = H_q / 3 (6) or H_q / 4 (24): the H_q / 4 rule does not divide 6. Every count divides H_q, as D-HEADS-*-DIVIDES requires."
  alibi_head_count:
    power_of_two: {H_q: q_heads}
    not_power_of_two: {H_q_by_power_of_two: {8: 6, 32: 24}, otherwise: null,
                       note: "H_q = 3/4 of the power-of-two count it replaces (8 -> 6, the BLOOM-style count of the reference bundle alibi_causal_tl_h6; 32 -> 24). q_heads one never reaches it (D-REL-ALIBI-HEAD-COUNT). Shape tiers set the power-of-two count first; they use only 8 and 32, so no other count needs a value (otherwise: null)."}
  head_dim:
    d1: 1
    d64: 64
    d128: 128
    d192: 192
    d256: 256
    d96: 96
    d512: 512
    d576: 576
    note: "Engine answer-key pairs (head_dim_qk, head_dim_v): (128,128) and (192,128) forward. 64 is a backward-table value, included as a likely-refused probe value. 256 is a real-model size (Gemma 2 9B head_dim 256) with no ASM kernel: a likely-refused value for ASM, a real value for other engines. 96 is Phi-3 mini; 576 (Q, K) with 512 (V) is DeepSeek-V3 MLA decode. Their answer_key yes is read in code: the reference gate has no head-size check (PlanUtils.hpp); no run has measured them yet."
  dtype_relation:
    same: {k_v: same_as_q}
    differs:
      when_q: [fp16, bf16]
      k_v: fp8_e4m3
      otherwise: bf16
      note: "fp8 K/V against fp16 or bf16 Q stands for the vLLM --kv-cache-dtype fp8 case (bf16 Q against an fp8 K/V cache); the case uses OCP E4M3 on every GPU architecture, also where that cache uses E4M3 FNUZ (gfx942). bf16 K/V for fp32 or fp8 Q has no known use and is kept as a probe."
  dim_order:  # physical order, outermost first
    bhsd: {order: [B, H, S, D], note: "strides packed in that order"}
    bshd: {order: [B, S, H, D]}
    other_permutation: {order: [S, B, H, D], note: "Transformer Engine qkv_format sbhd, its default; Megatron-LM"}
    bsdh: {order: [B, S, D, H], note: "the head-dim outside the heads; S stays outer of H and D, so a ragged tensor in this order is still token-major"}
    inherited: {order: owner, note: "a view: see strides.inherited"}
  strides:  # applied on top of the dim_order's packed strides
    packed: {change: none}
    padded: {row_stride_extra_elements: 16, note: "D + 16 elements: 16 head-dim slots, wherever D sits in the order (in bsdh the stride outside D is (D + 16) x H)"}
    non_contiguous_view: {head_stride_multiplier: 2, note: "every head of a tensor with twice the heads"}
    head_dim_strided: {head_dim_stride: twice_packed, note: "the head-dim stride and every stride outside D are twice their packed value; a stride inside D (H in bsdh) keeps its packed value. So the head-dim elements are not adjacent: the head-dim stride is 2 in every order but bsdh, where it is 2 x H"}
    inherited: {strides: owner,
                note: "the tensor is a view; its numeric strides are its owner's strides, one per dim, applied to its own dims (so its dim order is the owner's). Owner: K for V when head_dim_v <= head_dim_qk, Q for K otherwise (tensor_overlap.inputs_overlap). Example: V d128 inside a packed bhsd K d192 has row stride 192"}
    zero_broadcast: {stride: 0, dimension: first_with_extent_over_1, search_order: [S, H, B, D]}
    negative: {stride_sign: -1, dimension: first_with_extent_over_1, search_order: [S, H, B, D], start: last_element,
               note: "the start pointer moves to the last element"}
    self_overlapping: {dimension: first_with_extent_over_1, search_order: [S, H, B],
                       partner: first_other_with_extent_over_1, partner_search_order: [D, S, H, B],
                       stride: {of: partner, extent_divide: 2, times: partner_stride},
                       note: "index 1 of the dimension and index extent/2 of the partner reach one element; with S > 1 and D > 1 this is S stride = D/2, two rows sharing elements. Needs two dimensions with extent > 1"}
    note: "zero_broadcast, negative and self_overlapping need a dimension with extent > 1 (definition rule D-REL-STRIDE-NEEDS-EXTENT)"
  alignment:
    wide_aligned: {base_alignment_bytes: 256, start_offset: 0, declared_alignment: 16, note: "declared alignment 16 is the default"}
    element_aligned: {base_alignment_bytes: 256, start_offset: element_size, declared_alignment: element_size}
    sub_element: {base_alignment_bytes: 256, start_offset: 1, declared_alignment: 1,
                  note: "start_offset and declared_alignment in bytes. Impossible for 1-byte formats (definition rule D-REL-SUB-ELEMENT-ALIGNMENT)"}
    note: "The runner moves the data start by start_offset bytes from a base aligned to base_alignment_bytes and declares declared_alignment. A bundle case carries the same start offset in its metadata `start_offsets`; the bundle harness moves the engine's data start by it."
  window:  # keys on one side of the diagonal; right_bound = keys, left_bound = keys + 1 (it counts the diagonal key, cuDNN)
    left_bound_adds: 1
    zero: {keys: 0, note: "left_bound 1 (the diagonal only), right_bound 0. The frontend refuses left_bound 0 (@ 00d9c566bea SdpaFwdNode.hpp:40-42 -> node/detail/Utilities.hpp:479-495)"}
    partial: {keys: {of: S_kv, divide: 4, minimum: 1}}
    whole_span: {keys: S_kv, note: "a bound past the last key reaches every key; that -1 means the same is inferred, API-path variant PV-WINDOW-UNBOUNDED"}
    zero_excluding_diagonal: {left_bound: 0, note: "left side only; the frontend refuses it (F-LEFT-BOUND-NOT-ZERO)"}
    with_causal: {left_bound: window_left, right_bound: 0,
                  note: "causal mask + window = one band on one diagonal; window_right then has no effect"}
  bias_shape:
    none: {shape: [B, H_q, S_q, S_kv]}
    batch_or_heads: {shape: [1, 1, S_q, S_kv]}
    batch_only: {shape: [1, H_q, S_q, S_kv]}
    heads_only: {shape: [B, 1, S_q, S_kv]}
    note: "With paged K/V the key extent is max_seq_len_kv, not S_kv (@ 00d9c566bea SdpaFwdNode.hpp:174-188; PlanUtils.hpp:286-293)."

    sequence: {shape: [B, H_q, 1, S_kv]}
    all: {shape: [1, 1, 1, 1]}
    not_broadcastable: {shape: [{of: B, add: 1}, H_q, S_q, S_kv]}
  scale_value:  # representatives, primary first
    inverse_sqrt_d: {representatives: [inverse_sqrt_head_dim_qk],
                     note: "1 / sqrt(head_dim_qk): 0.08838834764831845 at d128; 1.0 at d1, the same number as the unset default"}
    other_positive: {representatives: [0.1352, {numerator: 1, denominator: 12}],
                     note: "0.1352: DeepSeek-V3, yarn mscale^2 / sqrt(192). 1/12 = 0.0833: Gemma 2 27B, query_pre_attn_scalar 144"}
    zero: {representatives: [0.0]}
    negative: {representatives: [-0.125]}
    non_finite: {representatives: [.nan, .inf]}
  dropout_probability: {zero: 0.0, between: 0.1, one: 1.0, negative: -0.5, above_one: 1.5}
  dropout_rng_state:
    caller_supplied: {seed: 1234, offset: 0, tensors: by_value_int64}
    caller_supplied_device_memory: {seed: 1234, offset: 0, tensors: device_memory_int64,
                                    note: "INT64 [1, 1, 1, 1] tensors in device memory, filled with the seed and the offset"}
    not_supplied: {seed: null, offset: null, note: "no seed or offset tensors"}
  dropout_mask_pattern:
    keep_all: {pattern: all_ones, cycle: [1.0], scale: 1.0}
    mixed: {pattern: alternating_one_zero, cycle: [1.0, 0.0], scale: 2.0}
    drop_all: {pattern: all_zeros, cycle: [0.0], scale: 1.0}
    note: "The mask repeats `cycle` in element order (the mask is packed), in the format dropout_mask_dtype names."
  dropout_mask_broadcast:  # `keys` = max_seq_len_kv with paged K/V, else S_kv (also for rng_dump)
    none: {shape: [B, H_q, S_q, keys]}
    batch_only: {shape: [1, H_q, S_q, keys]}
    heads_only: {shape: [B, 1, S_q, keys]}
    batch_and_heads: {shape: [1, 1, S_q, keys]}
    note: "With paged K the references compare a caller mask's last dim with max_seq_len_kv (@ 1790cf623f4 PlanUtils.hpp:400-415), but rng_dump's with K's dim 2, the page size (PlanUtils.hpp:549-553; AK-DROPOUT-NOT-PAGED-K)."
  batch_packing:
    ragged_tensors: {padded: [], ragged: [Q, K, V, O], ragged_q_side: [Q, O], ragged_kv_side: [K, V]}
    ragged_stats: {dense: [], packed_with_q: [Stats],
                   note: "keyed by stats_packing: Stats is ragged on packed_with_q rows. Its offsets follow Q's lengths and the row's ragged_offsets value, in Stats's element units (per_tensor_elements) or as Q's token list (shared_tokens)"}
    offsets: {dtype: ragged_offset_dtype, dims: [{of: B, add: 1}, 1, 1, 1], form: ragged_offset_form, by: ragged_offsets,
              note: "Q, O and a packed Stats use per_seq_len_q; K and V use per_seq_len_kv. Without per-sequence lengths (sequence_lengths uniform) every length is the stored length. ragged_offsets gives the formula; ragged_offset_form gives the unit and the sharing."}
    note: "A ragged tensor with H outside S (bhsd) is written head-major as [H, T, D]: head stride T x D with T = B x S, sequence stride D. A ragged tensor in order S,B,H,D folds the batch into the token axis, [T, H, D] (the strides of bshd). bshd and bsdh keep their packed strides."
  ragged_offset_form:
    per_tensor_elements: {tensors: one_per_ragged_tensor, unit: elements, multiplier: 1, stored_length: tensor_sequence_extent,
                          note: "an offset counts elements of its own tensor: token x the tensor's sequence stride"}
    shared_tokens: {tensors: {query_side: [Q, O, Stats], key_value_side: [K, V]}, unit: tokens, multiplier: sequence_stride, stored_length: {query_side: S_q, key_value_side: S_kv},
                    note: "one offset tensor per side holds token counts; each tensor's ragged_offset_multiplier is its own sequence stride, so the same tokens name each tensor's elements"}
  ragged_offset_dtype: {int32: int32, int64: int64}
  o_packing:
    as_q: {o_offsets: as_q}
    own_starts: {o_offsets: {q_contiguous: full_slots, otherwise: prefix_sum_of_lengths},
                 note: "O has its own offset tensor: full slots beside a Q packed end to end, end to end beside any other Q layout"}
    padded: {o_offsets: none, note: "O keeps plain [B, H_q, S_q, D_v] slots"}
  v_packing:
    as_k: {v_offsets: as_k}
    own_starts: {v_offsets: {k_contiguous: full_slots, otherwise: prefix_sum_of_lengths},
                 note: "V has its own offset tensor: full slots beside a K packed end to end, end to end beside any other K layout"}
    padded: {v_offsets: none, note: "V keeps plain [B, H_v, S_kv, D_v] slots"}
  matmul_input_precision:
    native: {mma_core_mode: unset}
    fp32: {mma_core_mode: fp32}
    fp16: {mma_core_mode: fp16}
    bf16: {mma_core_mode: bf16}
    fp8: {mma_core_mode: {when_q_is_fp8: dtype_q, otherwise: fp8_e4m3},
          note: "Q's own fp8 format when Q is fp8; else the OCP E4M3 format, on every GPU architecture."}
  sequence_lengths:
    uniform: {seq_len_tensors: none, padding_mask: false}
    variable: {seq_len_tensors: [seq_len_q, seq_len_kv], padding_mask: true}
    variable_no_flag: {seq_len_tensors: [seq_len_q, seq_len_kv], padding_mask: false}
    lengths_in_offsets: {seq_len_tensors: none, padding_mask: false, lengths: ragged_offsets,
                         note: "ragged rows only (D-REL-LENGTHS-IN-OFFSETS): the ragged side's offsets carry per_seq_len_*; a dense side is full"}
    cu_seq_len: {seq_len_tensors: none, padding_mask: false, cumulative_tensors: [cu_seq_len_q, cu_seq_len_kv],
                 note: "no API: F-NO-CU-SEQ-LEN removes it; the case builder does not realise it"}
  per_seq_len:  # lengths of sequences 0 .. B-1 repeat `cycle`; S = the stored length (S_q or S_kv)
    all_full: {cycle: [S]}
    all_equal_partial: {cycle: [{of: S, divide: 2}]}
    mixed: {cycle: [S, {of: S, divide: 2}]}
    some_zero: {cycle: [S, 0]}
    all_zero: {cycle: [0]}
    exceeds_storage: {cycle: [{of: S, add: 1}, S]}
  ragged_offsets:   # S = the side's stored length, stride = the tensor's sequence stride
    contiguous: {offsets: prefix_sum_of_lengths, count: {of: B, add: 1}, first: 0, last: total_tokens,
                 note: "offset b = (sum of the lengths of sequences 0 .. b-1) x stride"}
    gapped: {offsets: full_slots, count: {of: B, add: 1}, first: 0, last: {of: B, multiply: S},
             note: "offset b = b x S x stride; the length tensors give the live lengths"}
    leading_gap: {offsets: prefix_sum_after_gap, count: {of: B, add: 1}, gap: slack, last: {of: B, multiply: S},
                  note: "per ragged tensor, slack = B x S - the sum of its side's live lengths; the gap g = slack (all the spare room), or 0 on a side with no slack. offset b = (g + sum of the lengths of sequences 0 .. b-1) x stride, so offset[B] = B x S x stride, the end of the tensor. The length tensors, when present, hold the same live lengths. CaseGraph computes it"}
    independent_starts: {offsets: slot_end_aligned, count: {of: B, add: 1}, last: {of: B, multiply: S},
                         note: "offset b = (b x S + S - length b) x stride for b < B, and offset[B] = B x S x stride: each sequence ends at the end of its full slot, so the gap before sequence b is S - length b"}
    out_of_order: {offsets: reversed_slots, count: {of: B, add: 1}, last: {of: B, multiply: S},
                   note: "offset b = (B - 1 - b) x S x stride for b < B; offset[B] = B x S x stride"}
  block_mask_granularity:
    tile_128: {tile: [128, 128]}
    other_tile: {tile: [64, 64]}
    per_element: {tile: [1, 1]}
  block_mask_dtype:
    uint8: {dtype: uint8, key_tiles_per_element: 8}
    int32: {dtype: int32, key_tiles_per_element: 32, note: "bit 31 is the sign bit, so a word with key tile 31 allowed is negative"}
  block_mask_pattern:
    layout: {tile: [128, 128], dtype: uint8, dims: [B, H_q, {ceil_div: [S_q, 128]}, {ceil_div: [{ceil_div: [S_kv, 128]}, 8]}],
             bits: {per_tile: 1, tiles_per_byte: 8, order: least_significant_first, clear_bit: masks_the_tile},
             note: "One bit per 128 x 128 score tile, 8 key tiles per byte, least significant bit first; a clear bit masks the tile. The references take a mask over more than one key tile: the reference gate checks only the mask's shape (isSupportedSdpaBlockMask, PlanUtils.hpp), and both references answered and agreed on 2-key-tile masks (runner, gfx942). With paged K/V, S_kv is the paged key extent"}
    all_open: {allowed: all}
    mixed: {allowed: alternating, always_allowed: first_column, note: "the first tile column allowed, every other tile alternating"}
    some_rows_blocked: {allowed: all, blocked_rows: [last]}
    all_blocked: {allowed: none}
  paging:
    sides: {present: [K, V], k_only: [K], v_only: [V], note: "The dense side keeps [B, H, S_kv, D]; S_kv there equals the paged side's key extent (max_seq_len_kv), @ 00d9c566bea PlanUtils.hpp:266-273. Each paged side's pool holds B x (its table width) pages: one page per table slot, so surplus slots point at pages of their own"}
    page_table_sharing: {separate: {tables: two}, shared: {tables: one, note: "one INT32 [B, 1, pages, 1] tensor given to set_paged_attention_k_table and _v_table; the same page slots in the K and V containers"}}
    page_size: {one_token: 1, partial: 16, whole_sequence: S_kv, large: 64}
    page_size_k_vs_v:
      equal: {v_page_size: {multiply: 1}}
      differ: {v_page_size: {multiply: 2}, note: "V's page size = 2 x K's; V's table is ceil(max_seq_len_kv / V's page size) wide. Each paged side's pool holds B x (its table width) pages"}
    page_table_storage:
      dense: {ragged_offset: none}
      packed: {ragged_offset: {dtype: int32, dims: [{of: B, add: 1}, 1, 1, 1], offset_of_sequence: {multiply: pages_per_sequence}},
               note: "every row full, written end to end; the offsets count table entries"}
    page_count:
      exact: {ceil_div: [S_kv, page_size]}
      surplus: {of: exact, add: 1}
      insufficient: {of: exact, add: -1, needs: {exact_at_least: 2}}
    max_seq_len_kv:
      equal: S_kv
      larger: {of: pages_times_page_size, note: "pages per sequence x page size; with the class values this is always above S_kv (F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN needs the table width ceil(max / page size))"}
      smaller: {of: S_kv, add: -1}
    page_table_order:
      in_order: {slot_of_page: identity,
                 note: "each sequence owns n pages of the pool (n = pool pages / B); slot j of sequence b holds page b x n + (j mod n)"}
      shuffled: {slot_of_page: seeded_permutation, seed: 2893,
                 note: "each sequence's in_order slots in an order drawn from the seed (one Mersenne Twister 64 stream per table, row by row); a row of two or more different pages never keeps the in_order order"}
      shared_pages: {slot_of_page: identity, shares: {sequence: 1, reuses_sequence: 0, page: 0},
                     note: "sequence 1 reuses sequence 0's first page; needs B of 2 or more"}
  sinks: {shape: [1, H_q, 1, 1], dtype: sink_dtype, values: data_seed, note: "Shape [1, H_q, 1, 1] and FLOAT required by the frontend @ 00d9c566bea SdpaFwdNode.hpp:263-281"}
  # Hints for a fuzzer. The case builder realises only the first value of each (CH-FUZZER-HINTS).
  sink_values: {ordinary: data_seed, no_sink: -.inf, very_large: 1.0e4, non_finite: [.inf, .nan]}
  scale_factor_values: {ordinary: descale_and_scale_tensors, one: 1.0, zero: 0.0, non_finite: [.inf, .nan]}
  special_values: {none: data_seed, infinity: [.inf, -.inf], nan: [.nan], negative_infinity_bias: -.inf,
                   subnormal: smallest_subnormal_of_the_format, signed_zero: [0.0, -0.0]}
  value_magnitude: {ordinary: data_seed, overflow_prone: near_the_largest_finite_number_of_the_format,
                    precision_loss_prone: near_the_smallest_normal_number_of_the_format}
  descale_and_scale_tensors:
    descale_q: 0.5
    descale_k: 0.25
    descale_v: 2.0
    other: 1.0
    tensors: by_value_volume_1
    per_head: {shape: [B, H_kv, 1, 1], dtype: fp32, tensors: device_memory, values: {descale_q: [0.5, 1.0], descale_k: [0.25, 0.5], descale_v: [2.0, 4.0]},
               note: "H_kv = H_k for descale_q and descale_k, H_v for descale_v. Each factor list repeats over (batch, head) in order; powers of two, so a factor applied to the wrong head changes O. Device memory, because the references refuse a pass-by-value descale of more than one element (@ 00d9c566bea PlanUtils.hpp:700-708)"}
    finer: {shape: [B, H, S, 1], dtype: fp32, tensors: device_memory, values: {descale_q: [0.5, 1.0], descale_k: [0.25, 0.5], descale_v: [2.0, 4.0]},
            note: "H and S of the tensor itself: H_q and S_q for Q, H_k and S_kv for K, H_v and S_kv for V (max_seq_len_kv when that side is paged). Each factor list repeats in element order"}
    note: "Powers of two: exact in fp32, and a descale that is dropped or applied to the wrong tensor changes O. `other` is every other scale tensor."
  tensor_overlap:
    separate: {buffers: one_per_tensor}
    inputs_overlap: {view: {tensor: V, of: K, columns: leading_head_dim_v},
                     fallback: {when: head_dim_v_over_head_dim_qk, view: {tensor: K, of: Q}},
                     view_layout: inherited,
                     note: "SGLang MLA K/V pool. The view's strides_* and dim_order_* values are inherited (strides.inherited)"}
    output_overlaps_input: {shares_buffer: {tensor: O, of: Q}}
    outputs_overlap: {shares_buffer: {tensor: Stats, of: O}}

# ---------------------------------------------------------------------------------------------
# Base cases. Generator modes "one-at-a-time" start from a named base; child axes whose parent is
# not active are omitted.
# ---------------------------------------------------------------------------------------------
base_cases:
  shared:
    decided_by: "a base ASM_SDPA_ENGINE accepts on gfx942 and gfx950 — bf16, head size 128/128, no mask. Every other value is chosen from inside the engine's answer key."
    concrete: "B 2, H_q = H_k = H_v 8, S_q = S_kv 256, d 128/128, bf16 in and out, fp32 compute, BHSD packed, scale 1/sqrt(128) as a float attribute, no mask, no optional input or output"
    values:
      batch_packing: padded
      sequence_lengths: uniform
      dtype_q: bf16
      dtype_k_vs_q: same
      dtype_v_vs_q: same
      dtype_o: bf16
      compute_precision: fp32
      matmul_input_precision: native
      batch_size: many
      seq_q: many
      seq_kv: many
      seq_q_vs_seq_kv: equal
      q_heads: many
      k_head_sharing: mha
      v_head_sharing: mha
      k_heads_vs_v_heads: equal
      head_dim_qk: d128
      head_dim_v: d128
      dim_order_q: bhsd
      dim_order_k: bhsd
      dim_order_v: bhsd
      dim_order_o: bhsd
      strides_q: packed
      strides_k: packed
      strides_v: packed
      strides_o: packed
      alignment_q: wide_aligned
      alignment_k: wide_aligned
      alignment_v: wide_aligned
      alignment_o: wide_aligned
      tensor_overlap: separate
      causal_mask: absent
      sliding_window: absent
      block_mask: absent
      bias: absent
      alibi: absent
      attention_sinks: absent
      scale_source: attribute_value
      scale_value: inverse_sqrt_d
      dropout: absent
      stats_output: not_requested
      max_sumexp_output: not_requested
      amax_s: not_requested
      amax_o: not_requested
      descale_q: absent
      descale_k: absent
      descale_v: absent
      s_quantization: absent
      scale_o: absent
      paged_kv: absent
      implementation: auto
      runtime_shape_override: disabled
      special_values: none
      value_magnitude: ordinary
    note: "Engine-specific discovery bases (2-3 per GPU type) are not stored here; they depend on one engine."

# Hints for generator modes that need an axis choice.
generator_hints:
  per_value_pairwise_axis: dtype_q        # one complete pairwise set per Q format (choice rule CH-STRATIFY-DTYPE)
  second_strength_candidate: dim_order_q  # count only: the cost of a second extra-strength axis
  execute_level_axes_note: "An acceptance-only driver cannot observe level `execute` values; it reports them as 'not observed', never as 'accepted'."
  # Harness capabilities that a row can need before a bundle can carry it. `forbid_any` lists the
  # rows that need the capability, as in rules.yaml; `select_reason` is the matching exclusion
  # reason of the bundle row selection (select_rows.py). An axis lists per value in `harness_needs`
  # the capabilities the value needs; a value that the axis does not list needs nothing. Among
  # values of equal cost, the low-change step tries a value with no need first. A level with
  # `bundle_first` covers first the pairs that a row with no need can hold, with such rows.
  harness_needs:
    - {id: shared_memory, select_reason: tensor_overlap, why: "an output written over an input is not realised: the case builder keeps O and Q apart. Inputs that share memory need it only on a paged row: the harness aliases carry the other rows",
       forbid_any: [{tensor_overlap: [output_overlaps_input, outputs_overlap]}, {tensor_overlap: [inputs_overlap], paged_kv: [present, k_only, v_only]}]}
    - {id: dropout_replay, select_reason: dropout_without_rng_dump, why: "random dropout is checked only through the RNG dump, so a bundle needs dropout_pattern_output requested",
       forbid_any: [{dropout: [random], dropout_pattern_output: [not_requested]}]}
  # Plain alternatives: in a row that matches `when`, each listed value counts as no change from the
  # shared base, as the base value does. A fewest-change search decides the `when` axes first and then
  # tries the listed value before the base value. These entries steer every row that holds a ragged
  # value: low-change rows, size-sweep crossings and coverage rows.
  plain_when:
    - {id: PW-RAGGED-Q-TOKEN-MAJOR, when: {batch_packing: [ragged, ragged_q_side]}, values: {dim_order_q: bshd, dim_order_o: bshd},
       why: "varlen attention stores a ragged Q and O token-major ([tokens, heads, head-dim], the THD layout); head-major rows still come from the pairs that name bhsd"}
    - {id: PW-RAGGED-KV-TOKEN-MAJOR, when: {batch_packing: [ragged, ragged_kv_side]}, values: {dim_order_k: bshd, dim_order_v: bshd},
       why: "varlen attention stores a ragged K and V token-major ([tokens, heads, head-dim], the THD layout); head-major rows still come from the pairs that name bhsd"}

# ---------------------------------------------------------------------------------------------
# Labels that are not per value (draft). Read only by the level step.
# ---------------------------------------------------------------------------------------------
level_labels:
  # Pairs of settings in different groups that still interact.
  bridges:
    - {id: B1, why: "a mask changes Stats (fully-masked rows)", a: [causal_mask, sliding_window], b: [stats_output]}
    - {id: B2, why: "a score term interacts with masking and lengths",
       a: [bias, alibi, alibi_head_count, attention_sinks],
       b: [sequence_lengths, per_seq_len_q, per_seq_len_kv, seq_q, seq_kv, seq_q_vs_seq_kv, causal_mask, causal_alignment,
           sliding_window, window_alignment, window_left, window_right, block_mask, block_mask_pattern]}
    - {id: B3, why: "element size changes byte strides and alignment", a: [dtype_q, dtype_o], b: &g4
         [dim_order_q, dim_order_k, dim_order_v, dim_order_o, strides_q, strides_k, strides_v, strides_o,
          alignment_q, alignment_k, alignment_v, alignment_o, tensor_overlap]}
    - {id: B4, why: "head size sets the tile stride", a: [head_dim_qk, head_dim_v], b: *g4}
    - {id: B5, why: "page count and ragged offsets are defined against the lengths",
       a: [seq_kv, sequence_lengths],
       b: [batch_packing, ragged_offsets, v_packing, batch_size, q_heads, k_head_sharing, v_head_sharing, k_heads_vs_v_heads,
           paged_kv, page_table_sharing, page_size_k_vs_v, page_table_storage, page_size, page_table_order, page_count,
           max_seq_len_kv]}
    - {id: B6, why: "one kernel per (format, head size, mask type)",
       a: &causal_window [causal_mask, causal_alignment, sliding_window, window_alignment, window_left, window_right],
       b: [dtype_q, head_dim_qk, head_dim_v]}
    - {id: B7, why: "descales are indexed per batch and K/V head",
       a: [descale_q, descale_k, descale_v], b: [k_head_sharing, v_head_sharing, k_heads_vs_v_heads, batch_size, q_heads, paged_kv]}
    - {id: B8, why: "the diagonal is per sequence in a ragged batch", a: *causal_window, b: [batch_packing, ragged_offsets]}
    - {id: B9, why: "with extent 1 the broadcast classes coincide", a: [bias_broadcast], b: [batch_size, q_heads, seq_q]}
    - {id: B10, why: "Stats batch/head strides only show with B, H > 1", a: [strides_stats, dim_order_stats], b: [batch_size, q_heads]}
    - {id: B11, why: "which (format, packing) pairs have an answer key", a: [dtype_q], b: [batch_packing]}
    - {id: B12, why: "a head count that is not a power of two changes the ALiBi slopes and the head grouping",
       a: [alibi_head_count], b: [q_heads, k_head_sharing, v_head_sharing, k_heads_vs_v_heads]}
    - {id: B13, why: "with extent 1 the dropout-mask broadcast classes coincide",
       a: [dropout_mask_broadcast], b: [batch_size, q_heads]}
    - {id: B14, why: "a packed Stats follows Q's token boundaries", a: [stats_packing],
       b: [batch_packing, ragged_offsets, ragged_offset_form, o_packing, sequence_lengths, per_seq_len_q]}
  # Combinations no reference can check although each value alone can. Same layout as rules.yaml.
  # Used only by levels with `answerable: true`. Every entry cites the reference code; every line
  # number below is at commit 91a40bdfd4c. Paths
  # (from the repository root):
  #   PU   projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/cpu_graph_executor/detail/PlanUtils.hpp
  #        (the forward gate shared by the CPU and GPU plans; isSupportedSdpaFwdNode at 647-779)
  #   CSK  projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/cpu_graph_executor/detail/SdpaFwdSignatureKey.hpp
  #   GSK  dnn-providers/integration-tests/src/harness/gpu-graph-executor/detail/GpuSdpaFwdSignatureKey.hpp
  #   RSD  projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/detail/RaggedSdpaDensify.hpp
  #   RTB  projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/detail/RaggedTokenBoundaries.hpp
  #   RaggedSdpaFwdSupport.hpp  projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/detail/RaggedSdpaFwdSupport.hpp
  #   SRI  projects/hipdnn/docs/SdpaReferenceImplementations.md
  # Restrictions that one value carries alone are its answer_key label "no", not an entry here: K or V
  # in another format than Q (dtype_*_vs_q differs; CSK keys Q = K = V, 115-177), a bias in fp8
  # (bias_dtype; CSK:219, 224, 229 register mask types FLOAT, HALF and BFLOAT16 only), Stats in any
  # format but FP32 (PU:775), p = 1 and random dropout without seed or rng_dump (PU:519-554).
  answer_key_needs:
    - {id: AK-Q-O-FORMATS, why: "(Q, O) format pairs the references register: O as Q for fp32, fp16, bf16; FP32 O for fp16 or bf16 Q; fp8 Q with BF16 O or O in Q's own fp8 format (CSK:115-177, GSK:123-177 the same list; SRI:78). fp16 output therefore needs fp16 inputs; fp8 output needs the same fp8 input. No graph plan takes fp8 Q with FP32 O (only the bare function does)", forbid_any: [
        {dtype_q: [fp32], dtype_o: [fp16, bf16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz]},
        {dtype_q: [fp16], dtype_o: [bf16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz]},
        {dtype_q: [bf16], dtype_o: [fp16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz]},
        {dtype_q: [fp8_e4m3], dtype_o: [fp32, fp16, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz]},
        {dtype_q: [fp8_e4m3_fnuz], dtype_o: [fp32, fp16, fp8_e4m3, fp8_e5m2, fp8_e5m2_fnuz]},
        {dtype_q: [fp8_e5m2], dtype_o: [fp32, fp16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2_fnuz]},
        {dtype_q: [fp8_e5m2_fnuz], dtype_o: [fp32, fp16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2]}],
       note: "The references compute an fp8 O, but the PoC runner cannot grade it (no element-wise diff for fp8, tolerance finer than one fp8 step). That is a runner gap, not an answer-key gap."}
    - {id: AK-DESCALE-WITH-FP8, why: "the descale count gate: an fp8 Q needs all three Q, K and V descales, and any other Q takes none (PU:734 `if((fp8Input && numQkvDescales != 3) || (!fp8Input && numQkvDescales != 0))`; fp8Input means the builder's Q is fp8, PU:641; SRI:93). So a K or V descale beside a bf16 Q is declined even when K and V are fp8", forbid_any: [
        {dtype_q: [fp32, fp16, bf16], descale_q: [present, per_head, finer]},
        {dtype_q: [fp32, fp16, bf16], descale_k: [present, per_head, finer]},
        {dtype_q: [fp32, fp16, bf16], descale_v: [present, per_head, finer]},
        {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], descale_q: [absent]},
        {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], descale_k: [absent]},
        {dtype_q: [fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], descale_v: [absent]}]}
    - {id: AK-DESCALE-PER-HEAD-NOT-PAGED, why: "a per-head descale on a paged side: the GPU reference reads pages in place and needs a one-element descale there (PU:639-645, 739-753); the CPU reference gathers the pages and takes it, but runs only at small shapes", forbid_any: [
        {paged_kv: [present, k_only], descale_k: [per_head]}, {paged_kv: [present, v_only], descale_v: [per_head]}]}
    - {id: AK-ALIBI-TOP-LEFT-CAUSAL, why: "ALiBi only with right bound 0 and top-left alignment, as cuDNN (PU:83-101 isSupportedSdpaAlibi, the test at PU:96; alignment and right bound resolved from the causal flags at PU:39-81; called by the forward gate at PU:668 and the backward at PU:821; SRI:89; SdpaSemanticsRegister.md SEM-021 at 283-285: the decline is a reference choice, the frontend accepts the graph). The native ragged plans decline ALiBi (RaggedSdpaFwdSupport.hpp:167-171); the dense rewrite carries it to this gate. An attention sink does not change the gate (PU:700-704 checks only the sink's shape); with a sink the references use cuDNN's form exactly: the sink logit has no ALiBi term (CpuFpReferenceSdpa.hpp:566-574, ALiBi on key scores only at 1045-1048). Any head count, power of two or not (CpuFpReferenceSdpa.hpp:941-960)", forbid_any: [
        {alibi: [present], causal_mask: [absent], sliding_window: [absent]},
        {alibi: [present], causal_mask: [absent], window_right: [partial, whole_span]},
        {alibi: [present], causal_alignment: [bottom_right]},
        {alibi: [present], window_alignment: [bottom_right]}],
       note: "A sliding window with window_right zero and top-left alignment is right bound 0 too, so it counts as causal here. With a causal mask the builder leaves right_bound at 0 whatever window_right says (CaseGraph.cpp), and the node has one alignment (rule F-ONE-DIAGONAL), so causal_alignment and window_alignment agree."}
    - {id: AK-FP8-SCALING-NEEDS-FP8, why: "softmax/output scaling and amax (scale_s with descale_s, scale_o, amax_s, amax_o): one-element FLOAT, fp8 inputs only, not with dropout (PU:452-497; SRI:94)", forbid_any: [
        {dtype_q: [fp32, fp16, bf16], s_quantization: [present]}, {dtype_q: [fp32, fp16, bf16], scale_o: [present]},
        {dtype_q: [fp32, fp16, bf16], amax_s: [requested]}, {dtype_q: [fp32, fp16, bf16], amax_o: [requested]},
        {dropout: [random, caller_mask], s_quantization: [present]}, {dropout: [random, caller_mask], scale_o: [present]},
        {dropout: [random, caller_mask], amax_s: [requested]}, {dropout: [random, caller_mask], amax_o: [requested]}]}
    - {id: AK-PHILOX-NEEDS-DUMP, why: "random (Philox) dropout is checkable only through rng_dump, with seed and offset given and p in [0, 1) (PU:519-554, 679-686; SRI:92). The child labels already say so; listed so `partial` on dropout random names its rule", forbid_any: [
        {dropout: [random], dropout_pattern_output: [not_requested]}, {dropout: [random], dropout_rng_state: [not_supplied]},
        {dropout_probability: [one]}]}
    - {id: AK-DROPOUT-NOT-PAGED-K, why: "random (Philox) dropout is checked through rng_dump, whose key extent the references compare with K's dim 2 (PU:549-553 isSdpaPhiloxDropoutWithDump), and K's dim 2 is the page size when K is paged. A caller mask over paged K is checkable: its last dim is compared with the paged key extent max_seq_len_kv (PU:400-415; a mask sized to the page is declined)", forbid_any: [
        {dropout: [random], paged_kv: [present, k_only]}],
       note: "The rng_dump comparison with the page size is a reference gap. The graph builder sizes a paged caller mask max_seq_len_kv wide."}
    - {id: AK-RAGGED-TOKEN-MAJOR, why: "the references read a ragged tensor only in a layout their ragged container accepts: sorted strides over [tokens, H, D] with the batch axis left out, and no negative or self-overlapping stride and no zero sequence stride on the ragged side; the case builder puts a zero stride on S first (@ 2fcf1e30202 RaggedTensor.hpp:238-259, RaggedTokenBoundaries.hpp:23-48). Ragged graphs run natively (BF16, FP8 E4M3) or through the dense rewrite (every other format, bias, sinks) (SRI:87). Only the ragged side's tensors are held to it", forbid_any: [
        {batch_packing: [ragged, ragged_q_side], strides_q: [zero_broadcast, negative, self_overlapping]},
        {batch_packing: [ragged, ragged_kv_side], strides_k: [zero_broadcast, negative, self_overlapping]},
        {batch_packing: [ragged, ragged_kv_side], strides_v: [zero_broadcast, negative, self_overlapping]},
        {batch_packing: [ragged, ragged_q_side], strides_o: [zero_broadcast, negative, self_overlapping]},
        {batch_packing: [ragged, ragged_q_side], stats_packing: [packed_with_q], strides_stats: [zero_broadcast, negative, self_overlapping]},
        {batch_packing: [ragged_kv_side], dim_order_k: [inherited], dim_order_q: [bhsd]},
        {batch_packing: [ragged, ragged_kv_side], strides_k: [inherited], strides_q: [zero_broadcast, negative, self_overlapping]}],
       note: "The case builder writes a ragged tensor with H outside S (bhsd) head-major as [H, T, D] and folds the batch into the token axis for S,B,H,D ([T, H, D]), so every dim order is a layout the references take. Evidence for the dense rewrite is code and the reference unit tests ZeroBiasThroughTheRewrite and ForwardWithBiasMatchesCpu. The PoC runs hold no fp32 or biased ragged row that the references computed. A dense Stats beside a ragged Q is not held to it (@ 2fcf1e30202 RaggedSdpaDensify.hpp:234: Stats is left out of the all-ragged-or-all-dense test); a packed Stats is (RaggedSdpaFwdSupport.hpp:253-257). A view (`inherited`) has its owner's layout: K inside a dense Q on a ragged K/V side takes Q's strides, so the last two clauses name Q's values (a dense bhsd Q beside a ragged K/V side has per-batch slots, which the ragged container refuses; a ragged Q is head-major itself); V inside K is covered by K's own clauses (both are on the K/V side). bsdh and head_dim_strided keep the H and D strides sorted within one token, so neither breaks the sorted-stride test."}
    - {id: AK-SCALE-FINITE, why: "both references decline a non-finite scale written into the graph as a number: every output would be NaN (PU:328-332 isSupportedSdpaScaleOperand; native ragged plan RaggedSdpaFwdSupport.hpp:233-238). A one-element by-value or FLOAT scale tensor holding NaN or inf is not checked (PU:333-349)", forbid_any: [
        {scale_value: [non_finite], scale_source: [attribute_value]}],
       note: "The tensor forms run, and every output is NaN, which no check grades: scale_value non_finite carries answer_key no, and CH-FUZZER-HINTS holds it out of generation. So this rule removes no row that the label leaves in; it states the reference gate."}
    - {id: AK-RNG-DUMP-NEEDS-PHILOX, why: "rng_dump is checkable only with Philox dropout: a caller-supplied mask with rng_dump is declined (PU:681-686: without Philox-with-dump, the gate refuses any rng_dump tensor)", forbid_any: [
        {dropout: [caller_mask], dropout_pattern_output: [requested]}]}
    - {id: AK-RAGGED-ONE-SIDE-NEEDS-LENGTHS, why: "a ragged side beside a dense side runs only through the dense rewrite, which takes the dense side's lengths from seq_len_q / seq_len_kv and declines without them (RSD:268-284). sequence_lengths variable and variable_no_flag state the length tensors; uniform and lengths_in_offsets state none", forbid_any: [
        {batch_packing: [ragged_q_side, ragged_kv_side], sequence_lengths: [uniform, lengths_in_offsets]}]}

  # Concrete sizes per shape tier (S small, L medium, M model, H hazard,
  # X stress). A tier gives the size of every "many"; a "one" stays 1. Sequence pairs: equal =
  # S/S; shorter = S_short/S; longer = S/S_short. Head counts and head sizes come from
  # class_to_value (gqa = H_q / 4, at least 2). work = 2 * B * H_q * S_q * S_kv * (d_qk + d_v).
  shape_tiers:
    S: {B: 2, H_q: 8,  S: 64,  S_short: 32,  why: "small: the feature works"}
    H: {B: 3, H_q: 8,  S: 127, S_short: 65,  why: "hazard: odd batch, lengths one off a 64/128 tile edge"}
    M: {B: 2, H_q: 32, S: 256, S_short: 128, why: "model: Llama 3 8B heads (32 query, 8 K/V via gqa, d128)"}
    L: {B: 4, H_q: 8,  S: 512, S_short: 256, why: "medium: realistic length, under the comprehensive per-case ceiling at d128"}
    X: {B: 8, H_q: 32, S: 4096, S_short: 2048, why: "stress: long accumulation"}

  # Targeted single cases. Each is the shared base plus
  # `changes`; the solver fills in anything a rule forces. They need no label.
  targeted:
    # A negative stride on the head dim is a rejection probe (MV-22a), not a targeted case.
    - {id: X2, why: "caller dropout mask may run as no dropout", changes: {dropout: caller_mask, dropout_mask_pattern: mixed}}
    - {id: X3a, why: "block mask may be ignored", changes: {block_mask: present, block_mask_pattern: mixed}}
    - {id: X3b, why: "max/sum-exp outputs may be ignored", changes: {max_sumexp_output: requested}}
    - {id: X3c, why: "dropout seed/offset may be ignored", changes: {dropout: random, dropout_probability: between, dropout_rng_state: caller_supplied}}
    - {id: X3d, why: "dropout pattern output may be ignored", changes: {dropout: random, dropout_probability: between, dropout_pattern_output: requested}}
    - {id: X4, why: "only the Stats head stride may reach the kernel", changes: {stats_output: requested, dim_order_stats: bshd, strides_stats: padded}}
    - {id: X5, why: "a ragged graph may reach an engine without a ragged check", changes: {batch_packing: ragged, ragged_offsets: contiguous, dim_order_q: bshd, dim_order_k: bshd, dim_order_v: bshd, dim_order_o: bshd}}
    - {id: X6a, why: "a scale tensor may be ignored (scale 1.0 used)", changes: {scale_source: by_value_constant_tensor}}
    - {id: X6b, why: "a scale tensor may be ignored (scale 1.0 used)", changes: {scale_source: runtime_parameter}}
    - {id: X6c, why: "a scale tensor may be ignored (scale 1.0 used)", changes: {scale_source: device_tensor}}
    - {id: X7, why: "a runtime scale is rounded to bf16; the expected output must use the rounded value", changes: {scale_source: runtime_parameter, scale_value: other_positive}}
    - {id: X8a, why: "bias format regression pin (#13474)", changes: {bias: present, bias_broadcast: none, bias_dtype: fp32}}
    - {id: X8b, why: "bias format regression pin (#13474)", changes: {bias: present, bias_broadcast: none, bias_dtype: fp16}}
    - {id: X8c, why: "bias format regression pin (#13474)", changes: {bias: present, bias_broadcast: none, bias_dtype: bf16}}
    - {id: X9, why: "fp8 descales that are not 1.0, with GQA", changes: {dtype_q: fp8_e4m3_fnuz, dtype_o: bf16, descale_q: present, descale_k: present, descale_v: present, k_head_sharing: gqa, v_head_sharing: gqa}}
    - {id: X10, why: "fp8 K/V byte offsets past 2^31 (two batches, batch stride 1.5 * 2^30 bytes)", tier: X, sizes: {B: 2, H_q: 96, S: 131072},
       changes: {dtype_q: fp8_e4m3_fnuz, dtype_o: bf16, descale_q: present, descale_k: present, descale_v: present, seq_q: one, seq_q_vs_seq_kv: shorter}}
    # 64-token pages need a key/value length above 64 to hold more than one page per sequence.
    - {id: X11a, why: "64-token pages, several per sequence (key/value length 256)", sizes: {S: 256, S_short: 128},
       changes: {paged_kv: present, page_size: large, sequence_lengths: variable}}
    - {id: X11b, why: "64-token pages with GQA and bottom-right causal (key/value length 256)", sizes: {S: 256, S_short: 128},
       changes: {paged_kv: present, page_size: large, sequence_lengths: variable, k_head_sharing: gqa, v_head_sharing: gqa,
                 causal_mask: present, causal_alignment: bottom_right}}
    - {id: X11c, why: "64-token pages in shuffled order (key/value length 256)", sizes: {S: 256, S_short: 128},
       changes: {paged_kv: present, page_size: large, page_table_order: shuffled, sequence_lengths: variable}}

  # Real-world configurations: public model configurations and serving defaults (pinned source in the
  # comment above an entry), and hand-picked ragged (varlen) cases for quick.
  # Same shape as `targeted`. Each runs at tier S
  # in the first level whose recipe has `real_world: true`, whatever that level's labels and ceiling.
  real_world:
    - {id: ragged-vllm-serving, why: "vLLM-style serving: varlen queries token-major (THD) over a paged GQA K/V cache with shuffled pages, mixed lengths, bottom-right causal",
       changes: {batch_packing: ragged_q_side, dim_order_q: bshd, dim_order_o: bshd, paged_kv: present, page_size: partial,
                 page_table_order: shuffled, sequence_lengths: variable, per_seq_len_q: mixed, per_seq_len_kv: mixed,
                 k_head_sharing: gqa, v_head_sharing: gqa, causal_mask: present, causal_alignment: bottom_right}}
    - {id: ragged-varlen-prefill-thd, why: "varlen prefill in the THD layout: one token-count offset list per side (cu_seqlens style), mixed lengths",
       changes: {batch_packing: ragged, dim_order_q: bshd, dim_order_k: bshd, dim_order_v: bshd, dim_order_o: bshd, ragged_offset_form: shared_tokens,
