    - {id: ragged-varlen-gqa-causal, why: "varlen GQA prefill, token-major, bottom-right causal: the diagonal is per sequence",
       changes: {batch_packing: ragged, dim_order_q: bshd, dim_order_k: bshd, dim_order_v: bshd, dim_order_o: bshd, ragged_offset_form: shared_tokens, sequence_lengths: lengths_in_offsets,
                 per_seq_len_q: mixed, per_seq_len_kv: mixed, k_head_sharing: gqa, v_head_sharing: gqa,
                 causal_mask: present, causal_alignment: bottom_right}}
    - {id: ragged-sliding-window, why: "varlen sliding-window attention (Mistral style), token-major",
