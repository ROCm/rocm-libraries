    cite: "SA:374,384; @ 91a40bdfd4c SdpaAttributes.hpp:377-395 (set_seed, set_offset take any tensor); SdpaFwdNode.hpp:34-252 (no check of where they are held)"
    note: "caller_supplied_device_memory answer_key yes: the references check Philox dropout through rng_dump and need only that a seed and an offset are given (@ 91a40bdfd4c PlanUtils.hpp:519-554); both references ran and agreed on the 3 sampled rows whose other values are checkable (runner job 68273158, gfx942). Usage common: frameworks keep the Philox seed and offset in device memory so that a captured graph can replay them."
