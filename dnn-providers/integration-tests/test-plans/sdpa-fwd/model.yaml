       changes: {block_mask: present, paged_kv: present}}

  # Cost of one case (draft). Seconds come from a per-case timing file (`--timings ARCH=FILE`,
  # columns case_key,seconds,source); the first arch named is the budget basis. A case the file
  # does not name, or names as `modelled`, costs a + b*MFLOP + c*tensor-MB (fitted to the cases
  # measured in full, one run on one node per arch). Outside fitted_range the model is not
  # trusted: the case is UNMEASURED and never pulled down by `fill`.
  cost:
    basis: gfx942
    model:
      gfx942: {a: 0.0155, b: 3.02e-5, c: 0.0196}
      gfx950: {a: 0.0137, b: 2.43e-5, c: 0.0133}
    fitted_range: {max_mflop: 8590, max_tensor_mb: 58.5}
    # A case that stops early (frontend rejection, graph builder refusal) is budgeted at its
    # modelled full cost: once the model or driver is corrected it runs in full.
    stops_early_budget: modelled

  # Filling each level up to its budget (draft). A level keeps every case its recipe gives it
  # (the floor), then takes cases from higher levels in `priority` order until its cumulative
  # time plus `overhead_s` reaches `headroom` x budget. A taken case must fit the level's shapes
  # and per-case ceiling (no S-tier exemption) and must not be UNMEASURED; a case that does not
  # fit the remaining room is skipped. With respect_labels, a taken case must also use only values
  # the level's labels accept (and, for an answerable level, be answerable). Priority keys, best first:
  #   fewest_rare        fewest non-base values labelled rare
  #   best_answer_key    worst answer key among its non-base values: yes, then partial, then no
  #   fewest_no_numbers  fewest non-base values whose changes_numbers is "no"
  #   cheapest           lowest cost
  # What happens when a level's cumulative time is over its budget. move: its largest, most expensive
  # non-S cases move up one level until it fits. report: nothing moves; the summary says what would.
  over_budget: report

  fill:
    overhead_s: 10.0   # per level run: hipRTC compile (8.1 s measured, gfx942) + process start (2 s, not measured)
    headroom: 0.5      # one node per arch, one run, no repeats
    respect_labels: true
    priority: [fewest_rare, best_answer_key, fewest_no_numbers, cheapest]

# ---------------------------------------------------------------------------------------------
# Numeric domains of the size-like axes. Each axis gives the frontend's minimum and maximum (or
# "unbounded, cost-limited" when the frontend sets no maximum: the cost model bounds it), the range
# of each class inside the domain, and the boundary values a size sweep takes its corner sizes
# from. Every line number is at rocm-libraries 91a40bdfd4c. The generator reads this section only
# for the size sweep (`size_sweep`).
# ---------------------------------------------------------------------------------------------
numeric_domains:
  boundaries:   # the generic boundary set of every size-like axis
    powers_of_two: true
    multiples_of: [16, 32, 64, 128]
    neighbours: [-1, 1]          # each boundary b also gives b - 1 and b + 1
    int32_limit: 2147483647
    source: "powers of two and multiples of 16, 32, 64 and 128 are the tile and vector widths GPU kernels split work by; the int32 limit is the largest value of an INT32 length tensor, page-table entry or ragged offset (projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:298 `HIPDNN_RETURN_IF_TRUE(seqLen->get_data_type() != DataType::INT32,`; projects/hipdnn/test_sdk/include/hipdnn_test_sdk/utilities/detail/RaggedSdpaFwdSupport.hpp:98 `hipdnn_flatbuffers_sdk::data_objects::DataType::INT32)`)"
  axes:
    batch_size:
      domain: {min: 1, max: unbounded_cost_limited,
               source: "projects/hipdnn/frontend/include/hipdnn_frontend/attributes/TensorAttributes.hpp:636 `auto isPositive = [](int64_t value) constexpr { return value > 0; };`; no maximum in SdpaFwdNode.hpp, node/detail/Utilities.hpp, TensorAttributes.hpp validate() or Graph.hpp"}
      classes: {one: [1, 1], many: [2, max]}
    q_heads:
      domain: {min: 1, max: unbounded_cost_limited, source: "as batch_size"}
      classes: {one: [1, 1], many: [2, max]}
    k_v_heads:   # k_head_sharing, v_head_sharing, k_heads_vs_v_heads
      domain: {min: 1, max: H_q, must_divide: H_q,
               source: "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:133 `HIPDNN_RETURN_IF_TRUE(numHeadsK <= 0,`, :137 `HIPDNN_RETURN_IF_TRUE(numHeads % numHeadsK != 0,`, :143 and :147 the same for V"}
      classes: {mha: [H_q, H_q], gqa: "a divisor of H_q in [2, H_q - 1]", mqa: [1, 1]}
    seq_q:
      domain: {min: 1, max: unbounded_cost_limited, source: "as batch_size; a per-sequence length is INT32 (numeric_domains.boundaries.int32_limit)"}
      classes: {one: [1, 1], many: [2, max]}
    seq_kv:
      domain: {min: 1, max: unbounded_cost_limited,
               source: "as batch_size; with paging the declared maximum is int32 (projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp:146 `std::optional<int32_t> max_seq_len_kv;`)"}
      classes: {one: [1, 1], many: [2, max]}
    S_short:     # the shorter length of seq_q_vs_seq_kv shorter / longer
      domain: {min: 1, max: S - 1, source: "the relation shorter / longer needs S_short < S (definition rule D-REL-SEQ)"}
      classes: {shorter_side: [1, S - 1]}
    head_dim_qk:
      domain: {min: 1, max: unbounded_cost_limited, source: "as batch_size; no head-size list or multiple-of-8 check in the frontend or the reference gate"}
      classes: {one: [1, 1], many: [2, max]}
    head_dim_v:
      domain: {min: 1, max: unbounded_cost_limited, source: "as head_dim_qk"}
      classes: {one: [1, 1], many: [2, max]}
    page_size:
      domain: {min: 1, max: unbounded_cost_limited,
               source: "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp:351 `HIPDNN_RETURN_IF_TRUE(blockSize <= 0,`"}
      classes: {one_token: [1, 1], partial: [2, S_kv - 1], whole_sequence: [S_kv, S_kv]}
    window_left:
      domain: {min: 1, max: unbounded, unbounded_value: -1,
               source: "projects/hipdnn/frontend/include/hipdnn_frontend/node/detail/Utilities.hpp:483-484 `HIPDNN_RETURN_IF_TRUE(leftBound.has_value()` / `&& (leftBound.value() == 0 || leftBound.value() < -1),`"}
      classes: {zero: [1, 1], partial: [2, S_kv], whole_span: [S_kv + 1, max]}
      note: "Values are left_bound, which counts the diagonal key (class_to_value window.left_bound_adds)."
    window_right:
      domain: {min: 0, max: unbounded, unbounded_value: -1,
               source: "projects/hipdnn/frontend/include/hipdnn_frontend/node/detail/Utilities.hpp:490 `HIPDNN_RETURN_IF_TRUE(rightBound.has_value() && rightBound.value() < -1,`"}
      classes: {zero: [0, 0], partial: [1, S_kv - 1], whole_span: [S_kv, max]}

# ---------------------------------------------------------------------------------------------
# Size sweep. Concrete sizes inside the size classes, derived from numeric_domains; no axis or
# value is added. Each sweep size has a label:
#   typical  the class's representative values (shape_tiers and class_to_value);
#   corner   boundary values near a representative value or a tile edge (rule below);
#   stress   the axis's extent in shape tier X.
# The derivation is a pure function of numeric_domains, the boundary set and the cost model. It
# uses no seed: the same inputs give the same sweep.
# ---------------------------------------------------------------------------------------------
size_sweep:
  axis_order: [seq_q, seq_kv, head_dim_qk, head_dim_v, q_heads, batch_size, page_size, window_left, window_right]
  corner:
    anchors: [representative_values, 64, 128, 256]
    tile_edge_axes: [seq_q, seq_kv, head_dim_qk, head_dim_v]   # the number anchors (tile edges) apply only to these axes
    candidates: "the axis's boundaries inside the class range that are an anchor or an anchor +/- 1"
    drop: "values equal to a representative value, and duplicates"
    order: "distance to the nearest anchor, then the smaller value"
    per_axis: 6            # N: corner values kept per axis
    per_crossed_value: 3   # K: corner sizes crossed with each size_sensitive non-base value
    crossing: "K entries of the interleaved list (axis 1 corner 1, axis 2 corner 1, ..., then corner 2 of each axis, ...) that the value's row can take; the j-th crossed value (from 0, in model order) starts at entry j x K and wraps around; an axis the value fixes is skipped"
  stress:
    tier: X
    note: "Each size axis takes at most one stress value. Page size whole_sequence and the window sizes scale with tier X's S 4096. The head size takes its largest class value, 256, because tier X's D 128 is not larger than its typical values."
  target_rows: [200, 500]
  over_budget_drop_order: "crossed rows first, from the end of the interleaved list; then plain corner rows, last axis first. Typical, stress and hand-picked rows are never dropped."
  rules: "each derived row is checked by the rule checker; a row that breaks a rule is listed as rejected with its rule and never emitted"

# ---------------------------------------------------------------------------------------------
# Level recipe (draft). Budgets: minutes for the whole level, cumulative;
# per-case ceilings: MFLOP. The shared base value of a setting is always allowed.
# An S-tier case is never removed by a ceiling: S is the smallest form of a case.
# ---------------------------------------------------------------------------------------------
# max_changes: low-change pairwise, counted from the shared base (a child setting switched on or off by its
# parent's change does not count). Levels without it use packed pairwise.
#   max_changes: N                          every pairwise row changes at most N settings; a pair that needs
#                                           more is not asked for.
#   max_changes: {start: N, escalate: true} the pairs N changes can hold get rows of at most N changes; then
#                                           the pairs that need N + 1 get rows of at most N + 1; and so on,
#                                           until every pair of the level is covered.
#   Every level uses {start: 3, escalate: true}. A value in generator_hints.plain_when counts as no
#   change in a row that matches its condition. Among values of equal cost, a value with no harness
#   need comes first (generator_hints.harness_needs).
# bundle_first: true: the low-change steps take only the pairs that a row with no harness need can
#   hold, and use only such rows (a bundle can hold every one of them). Then packed pairwise covers the
#   level's other pairs in a few rows that change many settings.
# super_setting: {id: ID, axes: [...]}: the listed axes form ONE setting. Each complete combination of their
#   values is one value of that setting; it counts as one change, and every combination the level allows is
#   paired with every value of every other setting the level allows. Pairs between the listed axes are not
#   asked for separately: the combinations hold them.
# answer_key: every level admits `yes` and `partial`. Every level is `answerable`: answer_key_needs
#   removes the combinations the references cannot check. So no generated row pairs an answer-key "no"
#   value or such a combination with other settings; targeted, real-world and seed rows skip the labels.
# uncheckable_singles: <shape tier>: the level adds one case at that tier per answer-key "no" value
#   and one per answer_key_needs combination. Each holds only its own reason when a valid row can.
# Restricting a level's own new cases (each case a level does not keep moves up one level):
#   larger_tiers: size_sensitive   tiers other than S only for rows that change a setting whose
#                                  size_sensitive label is "yes"; other rows keep only their S case.
#   tiers_per_row: one             each row keeps exactly one of its remaining tiers, handed out in turn
#                                  so that no tier gets more rows than another tier those rows could take.
#   tiers_per_value: [M, L]        every value that a case at that tier can hold keeps at least one
#                                  case at that tier, counting lower levels.
# size_sweep: the size-sweep rows a level takes (section `size_sweep`). quick takes the typical
#   sizes, the cases most likely to pass; standard takes the corner sizes on the plain case and
#   crossed with size_sensitive settings, the cases most likely to find a defect; comprehensive takes
#   standard's crossings again at shape tier L; full takes the stress sizes (tier X). It is the one
#   change to the recipe's selection rules that sizes make.
levels:
  - {name: quick, budget_min: 5, ceiling_mflop: 20, shapes: [S],
     usage: [common], changes_numbers: ["yes", layout, unclear], answer_key: ["yes", partial], answerable: true,
     pairs: all, max_changes: {start: 3, escalate: true}, bundle_first: true, one_at_a_time: false, targeted: false, real_world: true,
     super_setting: {id: dtype_combination, axes: [dtype_q, dtype_k_vs_q, dtype_v_vs_q, dtype_o, dtype_stats, compute_precision]},
     size_sweep: [typical]}
  - {name: standard, budget_min: 30, ceiling_mflop: 200, shapes: [S, H, M],
     usage: [common, rare], changes_numbers: ["yes", layout, unclear], answer_key: ["yes", partial], answerable: true,
     pairs: all, max_changes: {start: 3, escalate: true}, bundle_first: true, one_at_a_time: false, targeted: true,
     size_sweep: [corner_plain, corner_crossed]}
  - {name: comprehensive, budget_min: 60, ceiling_mflop: 8000, shapes: [S, H, M, L],
     usage: [common, rare], changes_numbers: ["yes", layout, unclear], answer_key: ["yes", partial], answerable: true,
     pairs: groups_and_bridges, max_changes: {start: 3, escalate: true}, bundle_first: true, one_at_a_time: true, oat_shapes: [S, L], targeted: true,
     larger_tiers: size_sensitive, tiers_per_row: one, tiers_per_value: [M, L],
     size_sweep: [corner_crossed_at_L]}
  - {name: full, budget_min: null, ceiling_mflop: null, shapes: [S, H, M, L], stress_tier: X, stress_rows: [base],
     usage: any, changes_numbers: any, answer_key: ["yes", partial], answerable: true,
     pairs: all, max_changes: {start: 3, escalate: true}, bundle_first: true, one_at_a_time: true, oat_shapes: [S, L], targeted: true,
     uncheckable_singles: S,
     size_sweep: [stress]}
