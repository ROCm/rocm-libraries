    api_paths: [cpp, python]
    cite: "SA:374,384"
    group: G6-dropout
    size_sensitive: ["no", "a scalar or table-format choice"]
    labels:
      caller_supplied: [common, "yes", "yes"]
      not_supplied: [rare, "yes", "no"]

  - id: dropout_mask_pattern
    kind: child
    value_kind: class
    parent: {dropout: [caller_mask]}
    level: execute
    meaning: "Contents of the caller's dropout mask."
    values:
      - {id: keep_all, meaning: "nothing dropped"}
      - {id: mixed, meaning: "some weights dropped"}
      - {id: drop_all, meaning: "every weight dropped"}
    api_paths: [cpp, python]
    cite: "SA:394"
    group: G6-dropout
    size_sensitive: ["no", "a scalar or table-format choice"]
    labels:
      keep_all: [common, "yes", "yes"]
      mixed: [common, "yes", "yes"]
      drop_all: [rare, "yes", "yes"]

  - id: dropout_mask_broadcast
    kind: child
    value_kind: class
    parent: {dropout: [caller_mask]}
    level: graph
    meaning: "Which score dimensions the caller's dropout mask repeats over."
    values:
      - {id: none, meaning: "one mask value per batch, head, query and key: [B, H_q, S_q, keys]"}
      - {id: batch_only, meaning: "repeats over the batch: [1, H_q, S_q, keys]"}
      - {id: heads_only, meaning: "repeats over the heads: [B, 1, S_q, keys]"}
      - {id: batch_and_heads, meaning: "repeats over batch and heads: [1, 1, S_q, keys]"}
    api_paths: [cpp, python]
    cite: "@ 00d9c566bea SdpaFwdNode.hpp:34-252 (no dropout mask shape check); references @ 1790cf623f4 PlanUtils.hpp:352-416 (mask [B or 1, H or 1, Sq, key extent]; the key extent is max_seq_len_kv when K is paged, 400-415)"
    group: G6-dropout
    size_sensitive: ["no", "strides are products of the extents; tier S already has every extent above 1 (only tier X reaches 32-bit stride limits)"]
    labels:
      none: [common, layout, "yes"]
      batch_only: [rare, layout, "yes"]
      heads_only: [rare, layout, "yes"]
      batch_and_heads: [rare, layout, "yes"]

  - id: dropout_pattern_output
    kind: child
    value_kind: categorical
    parent: {dropout: [random, caller_mask]}
    level: graph
    meaning: "rng_dump output: hand back which weights were dropped."
    values: *request
    api_paths: [cpp, python]
    cite: "SA:557"
    group: G6-dropout
    size_sensitive: ["yes", "Philox counters per element across tiles and workgroups; the pattern output is a full score-sized tensor"]
    labels:
      not_requested: [common, "yes", "yes"]
      requested: [rare, "yes", "yes"]

