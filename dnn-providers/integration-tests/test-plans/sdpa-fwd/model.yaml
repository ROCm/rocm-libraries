# Case model: FORWARD scaled dot-product attention (SDPA) through hipDNN's frontend.
#
# What this file is
#   The axes and values that hipDNN's C++ frontend API can express for one forward SDPA node.
#   The case generator reads this file, rules.yaml and injections.yaml, and nothing else.
#
# Companion files (same folder)
#   rules.yaml       rules that remove combinations: kind definition | frontend | policy | choice.
#   injections.yaml  cases added back on purpose: rejection probes, API-path variants, controls.
#
# Fixed choices
#   - The class-to-value table includes the values the engine under test is sensitive to
#     (head sizes 64, 128, 192). Rules hold only for the tested values.
#   - The shared base case is one that ASM_SDPA_ENGINE accepts on both gfx942 and gfx950:
#     bf16, head size 128/128, no mask.
#   - Only the C++ API route is run. Other routes are recorded in injections.yaml.
#
# Terms
#   axis           one thing a test can vary.
#   value          one level of an axis that the generator can put in a case. Value ids are the
#                  short codes in generated CSV files.
#   class          a group of values chosen by MEANING (for example "one" vs "many"). A value of a
#                  class axis is a class; the class-to-value table gives the concrete number(s).
#   relationship   an axis that says how two sizes relate (shorter / equal / longer).
#   child          an axis that exists only under a parent value. When the parent has another
#                  value, the child is absent from the case and adds no pair.
#   level          graph   = decided by the graph alone (validate, build, applicability query);
#                  execute = decided by tensor contents or pointers at execute time;
#                  both    = declared in the graph, made real by the pointer at execute time.
#                  An acceptance-only driver cannot observe an `execute` value.
#   api_paths      the API routes that can state the axis: cpp, python, cudnn_compat.
#
# ⚠️ Rules hold only for the tested values. A rule found at head size 128 says nothing about
#   head size 80. Every result that uses this model must state the concrete values from
#   `class_to_value`.
#
# Rule-reference contract for tools: every axis id and value id named in a `forbid`, `forbid_any`,
# `shapes_axes`, `applies_to`, `changes` or `base_cases` entry exists in this file. Text fields
# (`omits`, `not_in_model`, `reason`, `note`) may name things that are deliberately absent.
#
# Labels and levels (draft, under review)
#   One case list with a `level` column. Levels are cumulative: a case's level is the first level
#   that needs it. A script assigns the levels. Judgement lives only in the per-value labels and
#   in a short recipe.
#   Each axis carries `group` (its interaction group) and `labels`, one entry per value:
#       <value>: [usage, changes_numbers, answer_key]
#     usage            common | rare | fringe — how often real software uses the value. fringe: no
#                      mainstream software uses it; only a level with `usage: any` (full) takes it.
#     changes_numbers  "yes"     the correct output changes (a requested extra output counts: it is
#                                compared too);
#                      layout    the correct output stays the same, but the engine reads or writes
#                                memory differently, so only a numerical check shows a mistake;
#                      unclear   the evidence supports both "yes" and layout;
#                      "no"      no number can change (acceptance only).
#     answer_key       "yes" a reference can compute the expected output; partial = only together
#                      with other values (see level_labels.answer_key_needs); "no" = no reference.
#   Values that a rule removes still carry labels; no case can hold them, so the labels never matter.
#   Each axis also carries `size_sensitive: [yes | no, reason]`: "yes" when a larger shape tier can
#   change what the setting exercises (tile edges, many pages, long accumulation), "no" when the
#   smallest tier already shows everything it does (element formats, scalars, layouts).
#   The level recipe is `levels:` at the end; the extra label data it uses is `level_labels:`.
#   Only the level step of the generator reads them; the pairwise case generator does not.
#   The answer_key labels follow the SDPA CPU and GPU reference executors
#   (projects/hipdnn/docs/SdpaReferenceImplementations.md and
#   dnn-providers/integration-tests/docs/OperationSupport-GpuReferenceImpl.md). Where the code and
#   a run disagree, the run decides.
#   The frontend rule F-NO-NEGATIVE-STRIDE (not enforced yet, ALMIOPEN-3114) removes negative
#   strides from the levels. They come back as rejection probe MV-22.
#   Quick treats the data-type combination as one setting (levels `super_setting`). Every level
#   admits answer_key partial; full holds the answer-key "no" values only in its uncheckable singles.
#   Five paging and packing values carry usage `fringe`, so only full runs them. Comprehensive
#   keeps one shape tier per row, uses tiers above S only for size-sensitive rows, and keeps an M
#   case and an L case for every value. Over budget, the level step only reports.
#   The references decline ALiBi with bottom-right causal alignment (AK-ALIBI-TOP-LEFT-CAUSAL), so
#   the BLOOM real-world row uses top-left causal. A ragged offset on a paged K or V has no defined
#   meaning (rule D-RAGGED-NOT-THROUGH-PAGES); ragged Q over paged K/V is checkable.
#   harness_needs (per axis, optional): the harness capabilities a value needs before a bundle can
#   hold its row (generator_hints.harness_needs). A value the axis does not list needs nothing. A
#   value can map to {needs, when}: the need holds only in a row that matches `when`.

schema_version: 1
model: sdpa_forward
direction: forward
api_record:
  repository: ROCm/rocm-libraries
  sha: 61c26758398ae591dd846753005d73600295ee18
  evidence: "read in code at `sha`; nothing built or run"
  paths:  # relative to projects/hipdnn/
    SA: frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp
    ATTR: frontend/include/hipdnn_frontend/attributes/Attributes.hpp
    TA: frontend/include/hipdnn_frontend/attributes/TensorAttributes.hpp
    NODE: frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp
    BASE: frontend/include/hipdnn_frontend/node/Node.hpp
    PACK: frontend/include/hipdnn_frontend/detail/SdpaFwdPacker.hpp
    DH: frontend/include/hipdnn_frontend/detail/DescriptorHelpers.hpp
    G: frontend/include/hipdnn_frontend/Graph.hpp
    T: frontend/include/hipdnn_frontend/Types.hpp
    BWD: frontend/include/hipdnn_frontend/node/SdpaBwdNode.hpp
    SHIM: frontend/include/hipdnn_compatibility/cudnn/detail/graph_wrapper.h
    FBS: flatbuffers_sdk/schemas/sdpa_attributes.fbs
    PY: python/frontend_bindings/src/attributes_bindings.cpp
    PYT: python/frontend_bindings/src/tensor_bindings.cpp
  run_path: cpp

formats: &formats
  - {id: fp32, meaning: "32-bit IEEE float (DataType FLOAT)", bytes: 4}
  - {id: fp16, meaning: "16-bit IEEE float (HALF)", bytes: 2}
  - {id: bf16, meaning: "16-bit bfloat (BFLOAT16)", bytes: 2}
  - {id: fp8_e4m3, meaning: "8-bit float, 4 exponent bits, OCP variant (FP8_E4M3)", bytes: 1}
  - {id: fp8_e4m3_fnuz, meaning: "8-bit float, 4 exponent bits, fnuz variant (FP8_E4M3_FNUZ)", bytes: 1}
  - {id: fp8_e5m2, meaning: "8-bit float, 5 exponent bits, OCP variant (FP8_E5M2)", bytes: 1}
  - {id: fp8_e5m2_fnuz, meaning: "8-bit float, 5 exponent bits, fnuz variant (FP8_E5M2_FNUZ)", bytes: 1}

size_classes: &size_classes
  - {id: one, class: one, meaning: "exactly one"}
  - {id: many, class: many, meaning: "two or more"}

# Stats: its head-dim extent is 1, so it has no head-dim order or head-dim stride value.
dim_orders: &dim_orders
  - {id: bhsd, meaning: "batch, heads, sequence, head-dim, outermost to innermost"}
  - {id: bshd, meaning: "batch, sequence, heads, head-dim"}
  - {id: other_permutation, meaning: "one of the other 22 orders of the four dimensions"}

# Q and O.
dim_orders_qo: &dim_orders_qo
  - {id: bhsd, meaning: "batch, heads, sequence, head-dim, outermost to innermost"}
  - {id: bshd, meaning: "batch, sequence, heads, head-dim"}
  - {id: other_permutation, meaning: "one of the other orders with the head-dim innermost"}
  - {id: bsdh, class: d_not_innermost, meaning: "batch, sequence, head-dim, heads: the head-dim is not innermost"}

# K and V: either can be a view into another input's buffer (tensor_overlap inputs_overlap).
dim_orders_kv: &dim_orders_kv
  - {id: bhsd, meaning: "batch, heads, sequence, head-dim, outermost to innermost"}
  - {id: bshd, meaning: "batch, sequence, heads, head-dim"}
  - {id: other_permutation, meaning: "one of the other orders with the head-dim innermost"}
  - {id: bsdh, class: d_not_innermost, meaning: "batch, sequence, head-dim, heads: the head-dim is not innermost"}
  - {id: inherited, meaning: "the tensor is a view; it reads through its owner's dimension order (class_to_value strides.inherited)"}

stride_classes: &stride_classes
  - {id: packed, meaning: "no gaps between elements"}
  - {id: padded, meaning: "gaps after some dimension (row or plane padding)"}
  - {id: non_contiguous_view, meaning: "a slice of a larger tensor"}
  - {id: zero_broadcast, meaning: "stride 0 on a dimension of extent > 1"}
  - {id: negative, meaning: "a dimension is walked backwards in memory"}
  - {id: self_overlapping, meaning: "non-zero strides under which two different indices reach one element"}

stride_classes_qo: &stride_classes_qo
  - {id: packed, meaning: "no gaps between elements"}
  - {id: padded, meaning: "gaps after some dimension (row or plane padding)"}
  - {id: non_contiguous_view, meaning: "a slice of a larger tensor"}
  - {id: zero_broadcast, meaning: "stride 0 on a dimension of extent > 1"}
  - {id: negative, meaning: "a dimension is walked backwards in memory"}
  - {id: self_overlapping, meaning: "non-zero strides under which two different indices reach one element"}
  - {id: head_dim_strided, meaning: "head-dim stride 2: the head-dim elements are not adjacent"}

stride_classes_kv: &stride_classes_kv
  - {id: packed, meaning: "no gaps between elements"}
  - {id: padded, meaning: "gaps after some dimension (row or plane padding)"}
  - {id: non_contiguous_view, meaning: "a slice of a larger tensor"}
  - {id: zero_broadcast, meaning: "stride 0 on a dimension of extent > 1"}
  - {id: negative, meaning: "a dimension is walked backwards in memory"}
  - {id: self_overlapping, meaning: "non-zero strides under which two different indices reach one element"}
  - {id: head_dim_strided, meaning: "head-dim stride 2: the head-dim elements are not adjacent"}
  - {id: inherited, meaning: "the tensor is a view; it reads through its owner's strides (class_to_value strides.inherited)"}

alignment_classes: &alignment_classes
  - {id: wide_aligned, meaning: "start address on a wide power-of-two boundary"}
  - {id: element_aligned, meaning: "start address a multiple of the element size only"}
  - {id: sub_element, meaning: "start address not a multiple of the element size"}

presence: &presence
  - {id: absent, meaning: "not used"}
  - {id: present, meaning: "used"}

request: &request
  - {id: not_requested, meaning: "the caller does not ask for this output"}
  - {id: requested, meaning: "the caller asks for this output"}

axes:

  # ------------------------------------------------------------------ batch packing and lengths
  - id: batch_packing
    kind: categorical
    level: graph
    meaning: "How several sequences share one tensor. The query side (Q, O) and the key/value side (K, V) can be packed differently."
    values:
      - {id: padded, meaning: "equal-length slots (plain dims)"}
      - {id: ragged, meaning: "sequences end to end on Q, K, V and O; offset tensors give each start (ragged_offset_form)"}
      - {id: ragged_q_side, meaning: "Q and O ragged; K and V in equal-length slots or pages (the vLLM serving shape)"}
      - {id: ragged_kv_side, meaning: "K and V ragged; Q and O in equal-length slots"}
    api_paths: [cpp]   # ragged: set_ragged_offset is not bound in Python
    cite: "TA:508,562; PYT:130-160; @ 00d9c566bea set_ragged_offset per tensor (TensorAttributes.hpp), the frontend checks only the offset tensor itself"
    note: "ragged_q_side usage common: vLLM's attention runs varlen queries (cu_seqlens_q) over a paged K/V cache (block_table), and the integration suite's reference bundles hd128_causal_ragged_paged and hd64_window_ragged_paged(_sinks) state this shape. ragged_kv_side has no known use: fringe. A ragged tensor in any dim order is written in a layout the references take: H outside S (bhsd) as head-major [H, T, D] with T = B x S, and S,B,H,D with the batch folded into the token axis ([T, H, D], the strides of bshd)."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      padded: [common, unclear, "yes"]
      ragged: [common, unclear, partial]
      ragged_q_side: [common, unclear, partial]
      ragged_kv_side: [fringe, unclear, partial]

  - id: ragged_offsets
    kind: child
    value_kind: class
    parent: {batch_packing: [ragged, ragged_q_side, ragged_kv_side]}
    level: execute
    meaning: "Contents of the ragged-offset tensors: B + 1 values; offset[b] is where sequence b starts. Without length tensors sequence b's slot is offset[b + 1] - offset[b]; with them the length tensors give the lengths."
    values:
      - {id: contiguous, meaning: "each sequence starts where the previous one ends"}
      - {id: gapped, meaning: "each slot is a full stored length; the length tensors give shorter live lengths, so a slot is longer than its sequence"}
      - {id: leading_gap, meaning: "the first sequence starts after the start of the tensor: all the spare room is before sequence 0"}
      - {id: independent_starts, meaning: "each sequence starts at a position of its own: it ends at the end of its full slot, so the gap before it is its own spare room and the gaps differ when the lengths differ"}
      - {id: out_of_order, meaning: "sequences stored in another order than their index: sequence b sits in slot B - 1 - b; the length tensors give the lengths"}
    not_in_model: "overlapping (two sequences share memory): Layer 1 D-RAGGED-NO-OVERLAP. A start inside a token: Layer 1 D-RAGGED-WHOLE-TOKENS."
    api_paths: [cpp]
    cite: "TA:508; DH:243-262 (checks the offset tensor's own properties only); @ 2fcf1e30202 RaggedTensor.hpp:91-99 (offset[0] any whole-token value of 0 or more), 101-111 (with length tensors: each length from them, at most S_max; starts in any order), 112-128 (without them: offsets must not decrease, each length is the block, capped at S_max), 208-219 (overlapping sequences refused); RaggedSdpaFwdSupport.hpp:165-168 (native plan: length tensors accepted); RaggedSdpaDensify.hpp:27-33 (dense rewrite: lengths from the length tensors, else from the offset blocks)"
    note: "Both references take any whole-token offset[0] of 0 or more and, with the length tensors, start positions in any order with gaps between them. Without the length tensors the offsets are boundaries and lengths, so gapped, independent_starts and out_of_order need the length tensors (F-RAGGED-OFFSETS-ARE-LENGTHS). The answer_key yes of leading_gap and independent_starts is measured: in the CASE-BUILDER ragged probe (runner, gfx942, 3,581 ragged rows) both references answered every clean row that holds them, and agreed. The labels follow the references, not the meaning: the values stay in the model whatever the references take."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      contiguous: [common, "yes", "yes"]
      gapped: [rare, "yes", "yes"]
      leading_gap: [fringe, "yes", "yes"]
      independent_starts: [rare, "yes", "yes"]
      out_of_order: [rare, "yes", "yes"]

  - id: ragged_offset_form
    kind: child
    value_kind: categorical
    parent: {batch_packing: [ragged, ragged_q_side, ragged_kv_side]}
    level: graph
    meaning: "The unit of the ragged offsets and which tensors share an offset tensor (Layer 0 ragged_offset_unit and ragged_offset_sharing, CH-FOLDED-CHILD-AXES)."
    values:
      - {id: per_tensor_elements, meaning: "each ragged tensor has its own offset tensor, which counts that tensor's elements (ragged_offset_multiplier 1)"}
      - {id: shared_tokens, meaning: "one offset tensor per side counts tokens: Q, O and a packed Stats read one, K and V read another; each tensor's ragged_offset_multiplier is its sequence stride"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "TA:508; @ 91a40bdfd4c TensorAttributes.hpp:545-575 (set_ragged_offset_multiplier), 644-651 (a multiplier below 1 is refused); DescriptorHelpers.hpp:229-238 (the multiplier is sent when it is not 1), 268 (an offset tensor already lowered is found again); RaggedTensor.hpp:161 (element offset = stored offset x multiplier); references RaggedSdpaDensify.hpp:207-216, 326-345 (any multiplier of 1 or more)"
    note: "shared_tokens answer_key yes: the references multiply each stored offset by its tensor's multiplier and then compare token boundaries (RaggedSdpaDensify.hpp:326-345, RaggedTokenBoundaries.hpp:105-128); in runner job 68273158 (gfx942) both references ran and agreed on the 6 sampled shared_tokens rows that hold no other unchecked value; on a seventh, at shape M, the GPU reference ran and the CPU reference is size-gated. Usage common: varlen attention APIs pass one cumulative token list per side (cu_seqlens_q, cu_seqlens_k)."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "a unit choice; where the offsets cross tile edges is batch_packing and ragged_offsets"]
    labels:
      per_tensor_elements: [common, layout, "yes"]
      shared_tokens: [common, layout, "yes"]

  - id: ragged_offset_dtype
    kind: child
    value_kind: categorical
    parent: {batch_packing: [ragged, ragged_q_side, ragged_kv_side]}
    level: graph
    meaning: "Integer format of the ragged offset tensors."
    values:
      - {id: int32, meaning: "INT32"}
      - {id: int64, meaning: "INT64"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "@ 91a40bdfd4c DescriptorHelpers.hpp:243-275 (no check of the offset tensor's format); RaggedTensor.hpp:142-145 (offsets read as INT32 or INT64); references @ a6a860a8fff RaggedSdpaDensify.hpp:76-82 (dense rewrite: an INT64 element is sized without the test SDK's type mapping), 271-274 (INT32 or INT64 offsets), RaggedSdpaFwdSupport.hpp:97-99 (native plan: INT32)"
    note: "int64 answer_key yes: the dense rewrite reads INT64 offsets (ALMIOPEN-3154). Both references ran and agreed on 60 clean ragged rows re-run with INT64 offsets, with the same results as INT32 (runner job 68283697, gfx942), and on the one INT64 row of levels.csv 6a630757 that both references ran. ASM_SDPA_ENGINE refuses INT64 offsets."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "element format of the offsets, the same at every size"]
    labels:
      int32: [common, layout, "yes"]
      int64: [rare, layout, "yes"]

  - id: o_packing
    kind: child
    value_kind: categorical
    parent: {batch_packing: [ragged, ragged_q_side]}
    level: graph
    meaning: "How O stores its rows when Q is ragged."
    values:
      - {id: as_q, meaning: "O is ragged with Q's start positions"}
      - {id: own_starts, meaning: "O is ragged with its own offset tensor and other start positions (class_to_value o_packing)"}
      - {id: padded, meaning: "O is in plain [B, H_q, S_q, D_v] slots while Q is ragged"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "TA:508 (a ragged offset per tensor); @ 2fcf1e30202 references RaggedTokenBoundaries.hpp:51-53 (Q and O may start their sequences at other positions; their per-batch lengths must match), RaggedSdpaDensify.hpp:226-243 and RaggedSdpaFwdSupport.hpp:153-163 (the tensors of a packing group are all ragged or all dense)"
    note: "own_starts answer_key yes: the references take O with its own start positions when its lengths match Q's; it needs the length tensors (D-REL-O-OWN-STARTS-NEED-ROOM). padded answer_key no: both references decline a dense O beside a ragged Q (RaggedSdpaDensify.hpp:226-243, RaggedSdpaFwdSupport.hpp:153-163)."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      as_q: [common, layout, "yes"]
      own_starts: [fringe, layout, "yes"]
      padded: [rare, layout, "no"]

  - id: v_packing
    kind: child
    value_kind: categorical
    parent: {batch_packing: [ragged, ragged_kv_side]}
    level: graph
    meaning: "How V stores its rows when K is ragged."
    values:
      - {id: as_k, meaning: "V is ragged with K's start positions"}
      - {id: own_starts, meaning: "V is ragged with its own offset tensor and other start positions (class_to_value v_packing)"}
      - {id: padded, meaning: "V is in plain [B, H_v, S_kv, D_v] slots while K is ragged"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "TA:508 (a ragged offset per tensor); @ 2fcf1e30202 references RaggedTokenBoundaries.hpp:51-53 (K and V may start their sequences at other positions; their per-batch lengths must match), RaggedSdpaDensify.hpp:226-243 and RaggedSdpaFwdSupport.hpp:153-163 (the tensors of a packing group are all ragged or all dense)"
    note: "own_starts answer_key yes: it needs the length tensors; the references take K's and V's lengths from seq_len_kv and need them equal (D-REL-V-OWN-STARTS-NEED-ROOM). padded answer_key no: both references decline a dense V beside a ragged K (RaggedSdpaDensify.hpp:226-243, RaggedSdpaFwdSupport.hpp:153-163)."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      as_k: [common, layout, "yes"]
      own_starts: [fringe, layout, "yes"]
      padded: [rare, layout, "no"]

  - id: sequence_lengths
    kind: categorical
    level: graph
    meaning: "Whether every sequence uses the full stored length, or each has its own real length (varlen)."
    values:
      - {id: uniform, meaning: "padding_mask false, no seq-len tensors"}
      - {id: variable, class: variable, meaning: "padding_mask true + seq_len_q and seq_len_kv tensors"}
      - {id: variable_no_flag, class: variable, meaning: "seq_len_q and seq_len_kv tensors with padding_mask false: the second spelling of per-sequence lengths. hipDNN's references read it as padding (SEM-008); cuDNN refuses it"}
      - {id: lengths_in_offsets, class: variable, meaning: "ragged only: the ragged offsets give each length; no seq_len tensors. The third spelling of per-sequence lengths"}
      - {id: cu_seq_len, class: variable, meaning: "cumulative lengths in cu_seq_len_q and cu_seq_len_kv tensors (B + 1 running totals); removed by F-NO-CU-SEQ-LEN"}
    api_paths: [cpp, python]
    cite: "SA:354,364,602; @ 00d9c566bea SdpaFwdNode.hpp:154-157,283-302 (each tensor checked alone, never against the flag); PlanUtils.hpp:112-157 (references: tensors without the flag are padding); @ 91a40bdfd4c no cu_seq_len setter"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      uniform: [common, "yes", "yes"]
      variable: [common, "yes", "yes"]
      variable_no_flag: [common, "yes", "yes"]
      lengths_in_offsets: [common, "yes", partial]
      cu_seq_len: [common, "yes", "no"]

  - id: per_seq_len_q
    kind: child
    value_kind: class
    parent: {sequence_lengths: [variable, variable_no_flag, lengths_in_offsets, cu_seq_len]}
    level: execute
    meaning: "Contents of seq_len_q, relative to the stored query length. With lengths_in_offsets, the lengths the Q-side offsets give."
    values: &per_seq_len_classes
      - {id: all_full, meaning: "every sequence uses the full stored length"}
      - {id: all_equal_partial, meaning: "every sequence the same length, shorter than stored"}
      - {id: mixed, meaning: "different non-zero lengths"}
      - {id: some_zero, meaning: "at least one sequence, not all, has length 0"}
      - {id: all_zero, meaning: "every sequence has length 0"}
      - {id: exceeds_storage, meaning: "a length larger than storage (removed by D-SEQLEN-WITHIN-STORAGE; rejection probe MV-09)"}
    api_paths: [cpp, python]
    cite: "SA:354"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      all_full: [common, "yes", "yes"]
      all_equal_partial: [common, "yes", "yes"]
      mixed: [common, "yes", "yes"]
      some_zero: [rare, "yes", "yes"]
      all_zero: [rare, "yes", "yes"]
      exceeds_storage: [common, "yes", "no"]

  - id: per_seq_len_kv
    kind: child
    value_kind: class
    parent: {sequence_lengths: [variable, variable_no_flag, lengths_in_offsets, cu_seq_len]}
    level: execute
    meaning: "Contents of seq_len_kv, relative to the stored key/value length. With lengths_in_offsets, the lengths the K/V-side offsets give."
    values: *per_seq_len_classes
    api_paths: [cpp, python]
    cite: "SA:364"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      all_full: [common, "yes", "yes"]
      all_equal_partial: [common, "yes", "yes"]
      mixed: [common, "yes", "yes"]
