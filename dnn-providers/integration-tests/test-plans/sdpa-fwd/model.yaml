  # ------------------------------------------------------------------ scale and dropout
  - id: scale_source
    kind: categorical
    level: graph
    meaning: "How the score scale reaches the operation. Each value belongs to a class: constant (fixed at setup) or runtime (supplied at execute)."
    values:
      - {id: attribute_value, class: constant, meaning: "set_attn_scale(float)"}
      - {id: by_value_constant_tensor, class: constant, meaning: "a volume-1 scale tensor passed by value as a compile-time constant"}
      - {id: runtime_parameter, class: runtime, meaning: "a volume-1 scale tensor passed by value as a runtime parameter"}
      - {id: device_tensor, class: runtime, meaning: "a volume-1 scale tensor in device memory"}
    not_in_model: "'Use the definition's 1/sqrt(d)': unset gives 1.0 (frontend rule F-SCALE-NO-DEFAULT-SOURCE). Unset is API-path variant PV-SCALE-UNSET."
    api_paths: [cpp, python]
    cite: "SA:36-37,344,665; TA:228-313; NODE:155-166"
    group: G3-precision-scale
    size_sensitive: ["no", "one scalar"]
    labels:
      attribute_value: [common, "yes", "yes"]
      by_value_constant_tensor: [common, "yes", "yes"]
      runtime_parameter: [common, "yes", "yes"]
      device_tensor: [rare, "yes", "yes"]

  - id: scale_value
    kind: child
    value_kind: class
    parent: {scale_source: [attribute_value, by_value_constant_tensor, runtime_parameter, device_tensor]}
    level: graph   # the value is part of the graph for attribute_value / by-value; data for device_tensor
    meaning: "The scale number."
    values:
      - {id: inverse_sqrt_d, meaning: "1/sqrt(head_dim_qk)"}
      - {id: other_positive, meaning: "another positive number"}
      - {id: zero, meaning: "0: every score becomes 0"}
      - {id: negative, meaning: "a negative number"}
      - {id: non_finite, meaning: "NaN or +/-inf. Not for test-case generation: a hint for a fuzzer (CH-FUZZER-HINTS)"}
    api_paths: [cpp, python]
    cite: "SA:665-669 (any float accepted)"
    note: "For scale_source = device_tensor the number is tensor contents (execute level). non_finite answer_key no: the references decline a non-finite scale written into the graph as a number (AK-SCALE-FINITE), and with a by-value tensor holding NaN or inf every output is NaN, which no check grades. Whether a NaN scale is meaningful is open (open-questions.md OQ-04)."
    group: G3-precision-scale
    size_sensitive: ["no", "one scalar"]
    labels:
      inverse_sqrt_d: [common, "yes", "yes"]
      other_positive: [common, "yes", "yes"]
      zero: [rare, "yes", "yes"]
      negative: [rare, "yes", "yes"]
      non_finite: [rare, "yes", "no"]

