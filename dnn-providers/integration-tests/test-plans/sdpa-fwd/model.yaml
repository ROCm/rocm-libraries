    - {id: ragged-bias, why: "token-major ragged batch with an additive bias: the references run it through the dense rewrite",
       changes: {batch_packing: ragged, dim_order_q: bshd, dim_order_k: bshd, dim_order_v: bshd, dim_order_o: bshd, sequence_lengths: lengths_in_offsets, per_seq_len_q: mixed,
