  - {what: "tensor contents (value distribution, special values, signs, data seed, scale-tensor values, sink values)", reason: "chosen when classes become concrete test data, after this model"}
  - {what: "GPU architecture and model, OS, software stack", reason: "where the operation runs; discovery runs per GPU type"}
  - {what: "engine choice, plan policy, autotune, knobs", reason: "engine selection is the driver's job (pin by name)"}
  - {what: "ragged_offset_multiplier, workspace, block tile size, node name, graph default types, virtual-output flag", reason: "held fixed by choice rule CH-FIXED-API-SETTINGS"}
