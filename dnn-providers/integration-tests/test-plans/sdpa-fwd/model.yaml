      - {id: not_requested, meaning: "neither"}
      - {id: requested, meaning: "both, set together"}
      - {id: max_only, meaning: "set_logit_max alone"}
      - {id: sum_exp_only, meaning: "set_score_sum_exp alone"}
    api_paths: [cpp, python]
    cite: "SA:537,547; @ 00d9c566bea SdpaAttributes.hpp:540-559 (two independent setters); references PlanUtils.hpp:738-745, SdpaFwdPlan.hpp:444-452 (each output handled alone)"
    group: G7-aux-outputs
    size_sensitive: ["no", "reduced over the key tiles, but tier H (two tiles, one partial) already runs it in standard"]
    labels:
      not_requested: [common, "yes", "yes"]
      requested: [rare, "yes", "yes"]
      max_only: [rare, "yes", "yes"]
      sum_exp_only: [rare, "yes", "yes"]

  - {id: amax_s, kind: categorical, level: graph, meaning: "amax (largest absolute value) of S.", values: *request, api_paths: [cpp, python], cite: "SA:567; FBS:69-70",
     group: G7-aux-outputs, size_sensitive: ["no", "reduced over the key tiles, but tier H (two tiles, one partial) already runs it in standard"],
     labels: {not_requested: [common, "yes", "yes"], requested: [rare, "yes", partial]}}
  - {id: amax_o, kind: categorical, level: graph, meaning: "amax of O.", values: *request, api_paths: [cpp, python], cite: "SA:577; FBS:69-70",
     group: G7-aux-outputs, size_sensitive: ["no", "reduced over the key tiles, but tier H (two tiles, one partial) already runs it in standard"],
     labels: {not_requested: [common, "yes", "yes"], requested: [rare, "yes", partial]}}

  # ------------------------------------------------------------------ fp8-style scale tensors (any format)
  - id: descale_q
    kind: categorical
    level: graph
    meaning: "A descale tensor for Q. `present` = one factor (per tensor); per_head = one factor per K/V head; finer = one factor per token and head."
    values: &descale_granularity
      - {id: absent, meaning: "no descale tensor"}
      - {id: present, meaning: "one-element descale (per tensor), passed by value"}
      - {id: per_head, meaning: "FLOAT descale [B, H_kv, 1, 1] in device memory: one factor per sequence and K/V head (for Q: per K/V head group)"}
      - {id: finer, meaning: "FLOAT descale [B, H, S, 1] of the tensor in device memory: one factor per token and head"}
    api_paths: [cpp, python]
    cite: "SA:454-511 (not tied to fp8 by validation); @ 00d9c566bea no descale shape check in SdpaFwdNode.hpp:34-252; references CpuFpReferenceSdpa.hpp:81-85,444-446 (scalar or [B, H_kv, 1, 1])"
    note: "finer: answer_key no. Every observed decline is the descale count gate: no descale on a non-fp8 Q, all three on an fp8 Q (@ 91a40bdfd4c PlanUtils.hpp:734). An fp8 Q with three finer descales passes that gate, and the CPU reference's descale shape check takes only a scalar or [B, H_kv, 1, 1] (CpuFpReferenceSdpa.hpp:444-446); not run. Usage rare: per-token K/V-cache scales exist in some serving stacks, but no surveyed real-model configuration uses them."
    group: G3-precision-scale
    size_sensitive: ["no", "a one-element descale is a scalar; a per-head one is indexed by head, and tier S already has 8 heads"]
    labels: {absent: [common, "yes", "yes"], present: [common, "yes", partial], per_head: [common, "yes", partial], finer: [rare, "yes", "no"]}
  - {id: descale_k, kind: categorical, level: graph, meaning: "A descale tensor for K (as descale_q).", values: *descale_granularity, api_paths: [cpp, python], cite: "SA:454-511; as descale_q",
     group: G3-precision-scale, size_sensitive: ["no", "a one-element descale is a scalar; a per-head one is indexed by head, and tier S already has 8 heads"],
     labels: {absent: [common, "yes", "yes"], present: [common, "yes", partial], per_head: [common, "yes", partial], finer: [rare, "yes", "no"]}}
  - {id: descale_v, kind: categorical, level: graph, meaning: "A descale tensor for V (as descale_q).", values: *descale_granularity, api_paths: [cpp, python], cite: "SA:454-511; as descale_q",
     group: G3-precision-scale, size_sensitive: ["no", "a one-element descale is a scalar; a per-head one is indexed by head, and tier S already has 8 heads"],
     labels: {absent: [common, "yes", "yes"], present: [common, "yes", partial], per_head: [common, "yes", partial], finer: [rare, "yes", "no"]}}
  - {id: s_quantization, kind: categorical, level: graph, meaning: "descale_s and scale_s tensors, set together.", values: *presence, api_paths: [cpp, python], cite: "SA:454-511",
     note: "The API also takes each one alone; that is outside the model.",
     group: G3-precision-scale, size_sensitive: ["no", "one scalar"],
     labels: {absent: [common, "yes", "yes"], present: [rare, "yes", partial]}}
  - {id: scale_o, kind: categorical, level: graph, meaning: "A scale tensor for O.", values: *presence, api_paths: [cpp, python], cite: "SA:454-511",
     group: G3-precision-scale, size_sensitive: ["no", "one scalar"],
     labels: {absent: [common, "yes", "yes"], present: [rare, "yes", partial]}}

  - id: scale_factor_values
    kind: child
    value_kind: class
    parent: {descale_q: [present, per_head, finer]}
    level: execute
    meaning: "The numbers in the descale and scale tensors of the case. Not for test-case generation: a hint for a fuzzer (CH-FUZZER-HINTS keeps every case at ordinary)."
    values:
      - {id: ordinary, meaning: "the factors of class_to_value descale_and_scale_tensors: powers of two other than 1, different between heads and tokens on per_head and finer"}
      - {id: one, meaning: "every factor 1"}
      - {id: zero, meaning: "a factor of 0"}
      - {id: non_finite, meaning: "NaN or +/-inf"}
    api_paths: [cpp, python]
    cite: "SA:454-511"
    note: "The class exists when descale_q is present and covers the K, V, S and O factors of the case too. No reference run checks the held-out classes, so their answer_key is no."
    group: G3-precision-scale
    size_sensitive: ["no", "a fuzzer hint, held out of generation"]
    labels:
      ordinary: [common, "yes", "yes"]
      one: [common, "yes", "no"]
      zero: [rare, "yes", "no"]
      non_finite: [rare, "yes", "no"]

  # ------------------------------------------------------------------ paged K/V
  - id: paged_kv
    kind: categorical
    level: graph
    meaning: "Which of K and V are paged. Page size and count come from the paged side's container dims."
    values:
      - {id: absent, meaning: "no page table"}
      - {id: present, meaning: "K and V both paged (two table setters)"}
      - {id: k_only, meaning: "only K paged; V dense [B, H_v, S_kv, D_v]"}
      - {id: v_only, meaning: "only V paged; K dense [B, H_k, S_kv, D_qk]"}
    api_paths: [cpp, python]
    cite: "SA:414,424; @ 00d9c566bea SdpaFwdNode.hpp:80-106,304-370 ('K or V may be paged alone, with its own block size'); references PlanUtils.hpp:159-297 (K, V or both)"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      absent: [common, layout, "yes"]
      present: [common, layout, partial]
      k_only: [fringe, layout, partial]
      v_only: [fringe, layout, partial]

  - id: page_table_sharing
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present]}
    level: graph
    meaning: "Whether K and V use one page table (the same tensor given to both setters) or one each."
    values:
      - {id: separate, meaning: "two page-table tensors"}
      - {id: shared, meaning: "one page-table tensor for K and V (vLLM's single block table); K and V containers share the page size"}
    api_paths: [cpp, python]
    cite: "@ 00d9c566bea SdpaAttributes.hpp:416-435; SdpaFwdNode.hpp:332-368 (each table checked alone; no check that the two differ). Inferred, not run"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      separate: [common, layout, "yes"]
      shared: [common, layout, "yes"]

  - id: page_size_k_vs_v
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present]}
    relates: [page_size_k, page_size_v]
    level: graph
    meaning: "Whether K's pages and V's pages hold the same number of tokens. page_size then describes K's pages."
    values:
      - {id: equal, meaning: "one page size for K and V"}
      - {id: differ, meaning: "V's pages hold twice K's tokens (class_to_value paging page_size_k_vs_v)"}
    api_paths: [cpp, python]
    cite: "@ 00d9c566bea SdpaFwdNode.hpp:308-310 ('K or V may be paged alone, with its own block size'), 336-367 (each table's width follows its own block size); references PlanUtils.hpp:159-297 (capacity per side)"
    note: "differ usage rare: vLLM and the other serving stacks use one block size for K and V; the reference executors' unit test PerSideTablesAndBlockSizes uses two."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      equal: [common, layout, "yes"]
      differ: [fringe, layout, "yes"]

  - id: page_table_storage
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present, k_only, v_only]}
    level: graph
    meaning: "How each page table is stored."
    values:
      - {id: dense, meaning: "every sequence has a row of the same width"}
      - {id: packed, meaning: "the table carries a ragged offset (rows end to end), as cuDNN 9.10.2+ accepts"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "@ 00d9c566bea SdpaFwdNode.hpp:304-310 (a packed table is accepted); references decline it (PlanUtils.hpp:643-644 CHECK_NO_RAGGED_TENSORS; RaggedSdpaDensify.hpp:153-159 a ragged tensor that is not a primary)"
    note: "packed usage rare: vLLM and the other serving stacks use a dense block table."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "a scalar or table-format choice"]
    labels:
      dense: [common, layout, "yes"]
      packed: [rare, layout, "no"]

  - id: page_size
    kind: child
    value_kind: class
    parent: {paged_kv: [present, k_only, v_only]}
    level: graph
    meaning: "Tokens per page, relative to the key/value length."
    values:
      - {id: one_token, meaning: "one token per page"}
      - {id: partial, meaning: "more than one token, less than a whole sequence"}
      - {id: whole_sequence, meaning: "one page per sequence"}
      - {id: large, class: partial, meaning: "64 tokens per page (a large serving block size); less than a whole sequence when the key/value length is above 64"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      one_token: [common, layout, "yes"]
      partial: [common, layout, "yes"]
      whole_sequence: [fringe, layout, "yes"]
      large: [rare, layout, "yes"]

  - id: page_table_order
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present, k_only, v_only]}
    level: execute
    meaning: "Contents of the page tables."
    values:
      - {id: in_order, meaning: "pages in increasing memory order"}
      - {id: shuffled, meaning: "pages scattered"}
      - {id: shared_pages, meaning: "a page used by more than one sequence"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      in_order: [common, layout, "yes"]
      shuffled: [common, layout, "yes"]
      shared_pages: [common, layout, "yes"]

  - id: page_count
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present, k_only, v_only]}
    relates: [pages_provided, pages_needed]
    level: graph
    meaning: "Pages per sequence in the page table, relative to the pages the key/value length needs."
    values:
      - {id: exact, meaning: "as many as needed"}
      - {id: surplus, meaning: "more than needed"}
      - {id: insufficient, meaning: "fewer than needed (removed by D-PAGES-SUFFICIENT; rejection probe MV-08)"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      exact: [common, layout, "yes"]
      surplus: [common, layout, "yes"]
      insufficient: [common, layout, "no"]

  - id: max_seq_len_kv
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present, k_only, v_only]}
    relates: [declared_max_kv_length, seq_kv]
    level: graph
    meaning: "set_paged_attention_max_seq_len_kv, relative to the key/value length."
    values:
      - {id: equal, meaning: "declared maximum = seq_kv"}
      - {id: larger, meaning: "declared maximum > seq_kv"}
      - {id: smaller, meaning: "declared maximum < seq_kv (removed by D-MAXLEN-NOT-BELOW-ACTUAL; rejection probe MV-07)"}
    api_paths: [cpp, python]
    cite: "SA:683; FBS:84"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      equal: [common, "no", "yes"]
      larger: [common, "no", "yes"]
      smaller: [common, "no", "no"]

