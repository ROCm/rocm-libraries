  # ------------------------------------------------------------------ paged K/V
  - id: paged_kv
    kind: categorical
    level: graph
    meaning: "Which of K and V are paged. Page size and count come from the paged side's container dims."
    values:
      - {id: absent, meaning: "no page table"}
      - {id: present, meaning: "K and V both paged (two table setters)"}
      - {id: k_only, meaning: "only K paged; V dense [B, H_v, S_kv, D_v]"}
      - {id: v_only, meaning: "only V paged; K dense [B, H_k, S_kv, D_qk]"}
    api_paths: [cpp, python]
    cite: "SA:414,424; @ 00d9c566bea SdpaFwdNode.hpp:80-106,304-370 ('K or V may be paged alone, with its own block size'); references PlanUtils.hpp:159-297 (K, V or both)"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      absent: [common, layout, "yes"]
      present: [common, layout, partial]
      k_only: [fringe, layout, partial]
      v_only: [fringe, layout, partial]

  - id: page_table_sharing
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present]}
    level: graph
    meaning: "Whether K and V use one page table (the same tensor given to both setters) or one each."
    values:
      - {id: separate, meaning: "two page-table tensors"}
      - {id: shared, meaning: "one page-table tensor for K and V (vLLM's single block table); K and V containers share the page size"}
    api_paths: [cpp, python]
    cite: "@ 00d9c566bea SdpaAttributes.hpp:416-435; SdpaFwdNode.hpp:332-368 (each table checked alone; no check that the two differ). Inferred, not run"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      separate: [common, layout, "yes"]
      shared: [common, layout, "yes"]

  - id: page_size_k_vs_v
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present]}
    relates: [page_size_k, page_size_v]
    level: graph
    meaning: "Whether K's pages and V's pages hold the same number of tokens. page_size then describes K's pages."
    values:
      - {id: equal, meaning: "one page size for K and V"}
      - {id: differ, meaning: "V's pages hold twice K's tokens (class_to_value paging page_size_k_vs_v)"}
    api_paths: [cpp, python]
    cite: "@ 00d9c566bea SdpaFwdNode.hpp:308-310 ('K or V may be paged alone, with its own block size'), 336-367 (each table's width follows its own block size); references PlanUtils.hpp:159-297 (capacity per side)"
    note: "differ usage rare: vLLM and the other serving stacks use one block size for K and V; the reference executors' unit test PerSideTablesAndBlockSizes uses two."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      equal: [common, layout, "yes"]
      differ: [fringe, layout, "yes"]

  - id: page_table_storage
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present, k_only, v_only]}
    level: graph
    meaning: "How each page table is stored."
    values:
      - {id: dense, meaning: "every sequence has a row of the same width"}
      - {id: packed, meaning: "the table carries a ragged offset (rows end to end), as cuDNN 9.10.2+ accepts"}
    api_paths: [cpp]   # set_ragged_offset is not bound in Python
    cite: "@ 00d9c566bea SdpaFwdNode.hpp:304-310 (a packed table is accepted); references decline it (PlanUtils.hpp:643-644 CHECK_NO_RAGGED_TENSORS; RaggedSdpaDensify.hpp:153-159 a ragged tensor that is not a primary)"
    note: "packed usage rare: vLLM and the other serving stacks use a dense block table."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "a scalar or table-format choice"]
    labels:
      dense: [common, layout, "yes"]
      packed: [rare, layout, "no"]

  - id: page_size
    kind: child
    value_kind: class
    parent: {paged_kv: [present, k_only, v_only]}
    level: graph
    meaning: "Tokens per page, relative to the key/value length."
    values:
      - {id: one_token, meaning: "one token per page"}
      - {id: partial, meaning: "more than one token, less than a whole sequence"}
      - {id: whole_sequence, meaning: "one page per sequence"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      one_token: [common, layout, "yes"]
      partial: [common, layout, "yes"]
      whole_sequence: [fringe, layout, "yes"]

  - id: page_table_order
    kind: child
    value_kind: categorical
    parent: {paged_kv: [present, k_only, v_only]}
    level: execute
    meaning: "Contents of the page tables."
    values:
      - {id: in_order, meaning: "pages in increasing memory order"}
      - {id: shuffled, meaning: "pages scattered"}
      - {id: shared_pages, meaning: "a page used by more than one sequence"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      in_order: [common, layout, "yes"]
      shuffled: [common, layout, "yes"]
      shared_pages: [common, layout, "yes"]

  - id: page_count
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present, k_only, v_only]}
    relates: [pages_provided, pages_needed]
    level: graph
    meaning: "Pages per sequence in the page table, relative to the pages the key/value length needs."
    values:
      - {id: exact, meaning: "as many as needed"}
      - {id: surplus, meaning: "more than needed"}
      - {id: insufficient, meaning: "fewer than needed (removed by D-PAGES-SUFFICIENT; rejection probe MV-08)"}
    api_paths: [cpp, python]
    cite: "SA:414,424"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "pages per sequence grow with length; shuffled and shared pages only mean something with many pages"]
    labels:
      exact: [common, layout, "yes"]
      surplus: [common, layout, "yes"]
      insufficient: [common, layout, "no"]

  - id: max_seq_len_kv
    kind: child
    value_kind: relationship
    parent: {paged_kv: [present, k_only, v_only]}
    relates: [declared_max_kv_length, seq_kv]
    level: graph
    meaning: "set_paged_attention_max_seq_len_kv, relative to the key/value length."
