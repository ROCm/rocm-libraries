# Case model: FORWARD scaled dot-product attention (SDPA) through hipDNN's frontend.
#
# What this file is
#   The axes and values that hipDNN's C++ frontend API can express for one forward SDPA node.
#   The case generator reads this file, rules.yaml and injections.yaml, and nothing else.
#
# Companion files (same folder)
#   rules.yaml       rules that remove combinations: kind definition | frontend | policy | choice.
#   injections.yaml  cases added back on purpose: rejection probes, API-path variants, controls.
#
# Fixed choices
#   - The class-to-value table includes the values the engine under test is sensitive to
#     (head sizes 64, 128, 192). Rules hold only for the tested values.
#   - The shared base case is one that ASM_SDPA_ENGINE accepts on both gfx942 and gfx950:
#     bf16, head size 128/128, no mask.
#   - Only the C++ API route is run. Other routes are recorded in injections.yaml.
#
# Terms
#   axis           one thing a test can vary.
#   value          one level of an axis that the generator can put in a case. Value ids are the
#                  short codes in generated CSV files.
#   class          a group of values chosen by MEANING (for example "one" vs "many"). A value of a
#                  class axis is a class; the class-to-value table gives the concrete number(s).
#   relationship   an axis that says how two sizes relate (shorter / equal / longer).
#   child          an axis that exists only under a parent value. When the parent has another
#                  value, the child is absent from the case and adds no pair.
#   level          graph   = decided by the graph alone (validate, build, applicability query);
#                  execute = decided by tensor contents or pointers at execute time;
#                  both    = declared in the graph, made real by the pointer at execute time.
#                  An acceptance-only driver cannot observe an `execute` value.
#   api_paths      the API routes that can state the axis: cpp, python, cudnn_compat.
#
# ⚠️ Rules hold only for the tested values. A rule found at head size 128 says nothing about
#   head size 96. Every result that uses this model must state the concrete values from
#   `class_to_value`.
#
# Rule-reference contract for tools: every axis id and value id named in a `forbid`, `forbid_any`,
# `shapes_axes`, `applies_to`, `changes` or `base_cases` entry exists in this file. Text fields
# (`omits`, `not_in_model`, `reason`, `note`) may name things that are deliberately absent.
#
# Labels and levels (draft, under review)
#   One case list with a `level` column. Levels are cumulative: a case's level is the first level
#   that needs it. A script assigns the levels. Judgement lives only in the per-value labels and
#   in a short recipe.
#   Each axis carries `group` (its interaction group) and `labels`, one entry per value:
#       <value>: [usage, changes_numbers, answer_key]
#     usage            common | rare | fringe — how often real software uses the value. fringe: no
#                      mainstream software uses it; only a level with `usage: any` (full) takes it.
#     changes_numbers  "yes"     the correct output changes (a requested extra output counts: it is
#                                compared too);
#                      layout    the correct output stays the same, but the engine reads or writes
#                                memory differently, so only a numerical check shows a mistake;
#                      unclear   the evidence supports both "yes" and layout;
#                      "no"      no number can change (acceptance only).
#     answer_key       "yes" a reference can compute the expected output; partial = only together
#                      with other values (see level_labels.answer_key_needs); "no" = no reference.
#   Values that a rule removes still carry labels; no case can hold them, so the labels never matter.
#   Each axis also carries `size_sensitive: [yes | no, reason]`: "yes" when a larger shape tier can
#   change what the setting exercises (tile edges, many pages, long accumulation), "no" when the
#   smallest tier already shows everything it does (element formats, scalars, layouts).
#   The level recipe is `levels:` at the end; the extra label data it uses is `level_labels:`.
#   Only the level step of the generator reads them; the pairwise case generator does not.
#   The answer_key labels follow the SDPA CPU and GPU reference executors
#   (projects/hipdnn/docs/SdpaReferenceImplementations.md and
#   dnn-providers/integration-tests/docs/OperationSupport-GpuReferenceImpl.md). Where the code and
#   a run disagree, the run decides.
#   Policy rules (rules.yaml P-*, ALMIOPEN-3114) remove negative strides, and a zero stride on the
#   head dimension of Q, K or V, from the levels. They come back as rejection probes MV-22 and MV-23.
#   Quick treats the data-type combination as one setting (levels `super_setting`). Quick and
#   standard admit answer_key partial.
#   Five paging and packing values carry usage `fringe`, so only full runs them. Comprehensive
#   keeps one shape tier per row, uses tiers above S only for size-sensitive rows, and keeps an M
#   case and an L case for every value. Over budget, the level step only reports.
#   The references decline ALiBi with bottom-right causal alignment (AK-ALIBI-TOP-LEFT-CAUSAL), so
#   the BLOOM real-world row uses top-left causal. Ragged offsets on a paged K or V stay removed by
#   the Layer 1 rule D-REL-PAGED-NOT-RAGGED; ragged Q over paged K/V is allowed.

schema_version: 1
model: sdpa_forward
direction: forward
api_record:
  repository: ROCm/rocm-libraries
  sha: 61c26758398ae591dd846753005d73600295ee18
  evidence: "read in code at `sha`; nothing built or run"
  paths:  # relative to projects/hipdnn/
    SA: frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp
    ATTR: frontend/include/hipdnn_frontend/attributes/Attributes.hpp
    TA: frontend/include/hipdnn_frontend/attributes/TensorAttributes.hpp
    NODE: frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp
    BASE: frontend/include/hipdnn_frontend/node/Node.hpp
    PACK: frontend/include/hipdnn_frontend/detail/SdpaFwdPacker.hpp
    DH: frontend/include/hipdnn_frontend/detail/DescriptorHelpers.hpp
    G: frontend/include/hipdnn_frontend/Graph.hpp
    T: frontend/include/hipdnn_frontend/Types.hpp
    BWD: frontend/include/hipdnn_frontend/node/SdpaBwdNode.hpp
    SHIM: frontend/include/hipdnn_compatibility/cudnn/detail/graph_wrapper.h
    FBS: flatbuffers_sdk/schemas/sdpa_attributes.fbs
    PY: python/frontend_bindings/src/attributes_bindings.cpp
    PYT: python/frontend_bindings/src/tensor_bindings.cpp
  run_path: cpp

formats: &formats
  - {id: fp32, meaning: "32-bit IEEE float (DataType FLOAT)", bytes: 4}
  - {id: fp16, meaning: "16-bit IEEE float (HALF)", bytes: 2}
  - {id: bf16, meaning: "16-bit bfloat (BFLOAT16)", bytes: 2}
  - {id: fp8_e4m3, meaning: "8-bit float, 4 exponent bits, OCP variant (FP8_E4M3)", bytes: 1}
  - {id: fp8_e4m3_fnuz, meaning: "8-bit float, 4 exponent bits, fnuz variant (FP8_E4M3_FNUZ)", bytes: 1}
  - {id: fp8_e5m2, meaning: "8-bit float, 5 exponent bits, OCP variant (FP8_E5M2)", bytes: 1}
  - {id: fp8_e5m2_fnuz, meaning: "8-bit float, 5 exponent bits, fnuz variant (FP8_E5M2_FNUZ)", bytes: 1}

size_classes: &size_classes
  - {id: one, class: one, meaning: "exactly one"}
  - {id: many, class: many, meaning: "two or more"}

dim_orders: &dim_orders
  - {id: bhsd, meaning: "batch, heads, sequence, head-dim, outermost to innermost"}
  - {id: bshd, meaning: "batch, sequence, heads, head-dim"}
  - {id: other_permutation, meaning: "one of the other 22 orders of the four dimensions"}

stride_classes: &stride_classes
  - {id: packed, meaning: "no gaps between elements"}
  - {id: padded, meaning: "gaps after some dimension (row or plane padding)"}
  - {id: non_contiguous_view, meaning: "a slice of a larger tensor"}
  - {id: zero_broadcast, meaning: "stride 0 on a dimension of extent > 1"}
  - {id: negative, meaning: "a dimension is walked backwards in memory"}
  - {id: self_overlapping, meaning: "non-zero strides under which two different indices reach one element"}

alignment_classes: &alignment_classes
  - {id: wide_aligned, meaning: "start address on a wide power-of-two boundary"}
  - {id: element_aligned, meaning: "start address a multiple of the element size only"}
  - {id: sub_element, meaning: "start address not a multiple of the element size"}

presence: &presence
  - {id: absent, meaning: "not used"}
  - {id: present, meaning: "used"}

request: &request
  - {id: not_requested, meaning: "the caller does not ask for this output"}
  - {id: requested, meaning: "the caller asks for this output"}

axes:

  # ------------------------------------------------------------------ batch packing and lengths
  - id: batch_packing
    kind: categorical
    level: graph
    meaning: "How several sequences share one tensor. The query side (Q, O) and the key/value side (K, V) can be packed differently."
    values:
      - {id: padded, meaning: "equal-length slots (plain dims)"}
      - {id: ragged, meaning: "sequences end to end on Q, K, V and O; each tensor has its own offset tensor that gives each start"}
      - {id: ragged_q_side, meaning: "Q and O ragged; K and V in equal-length slots or pages (the vLLM serving shape)"}
      - {id: ragged_kv_side, meaning: "K and V ragged; Q and O in equal-length slots"}
    api_paths: [cpp]   # ragged: set_ragged_offset is not bound in Python
    cite: "TA:508,562; PYT:130-160; @ 00d9c566bea set_ragged_offset per tensor (TensorAttributes.hpp), the frontend checks only the offset tensor itself"
    note: "ragged_q_side usage common: vLLM's attention runs varlen queries (cu_seqlens_q) over a paged K/V cache (block_table), and the integration suite's reference bundles hd128_causal_ragged_paged and hd64_window_ragged_paged(_sinks) state this shape. ragged_kv_side has no known use: fringe."
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      padded: [common, unclear, "yes"]
      ragged: [common, unclear, partial]
      ragged_q_side: [common, unclear, partial]
      ragged_kv_side: [fringe, unclear, partial]

  - id: ragged_offsets
    kind: child
    value_kind: class
    parent: {batch_packing: [ragged, ragged_q_side, ragged_kv_side]}
    level: execute
    meaning: "Contents of the ragged-offset tensor: B + 1 boundaries; sequence b's length is offset[b + 1] - offset[b]."
    values:
      - {id: contiguous, meaning: "each sequence starts where the previous one ends"}
    not_in_model: "gapped, out_of_order, overlapping: the offsets are non-decreasing boundaries that also give the lengths, so a gap, an out-of-order start or two overlapping sequences cannot be stated (frontend rule F-RAGGED-OFFSETS-ARE-LENGTHS)."
    api_paths: [cpp]
    cite: "TA:508; DH:243-262 (checks the offset tensor's own properties only); RaggedTokenBoundaries.hpp:67-71,89-94"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "ragged offsets cross tile edges; the diagonal is per sequence"]
    labels:
      contiguous: [common, "yes", partial]

  - id: sequence_lengths
    kind: categorical
    level: graph
    meaning: "Whether every sequence uses the full stored length, or each has its own real length (varlen)."
    values:
      - {id: uniform, meaning: "padding_mask false, no seq-len tensors"}
      - {id: variable, class: variable, meaning: "padding_mask true + seq_len_q and seq_len_kv tensors"}
      - {id: variable_no_flag, class: variable, meaning: "seq_len_q and seq_len_kv tensors with padding_mask false: the second spelling of per-sequence lengths. hipDNN's references read it as padding (SEM-008); cuDNN refuses it"}
    api_paths: [cpp, python]
    cite: "SA:354,364,602; @ 00d9c566bea SdpaFwdNode.hpp:154-157,283-302 (each tensor checked alone, never against the flag); PlanUtils.hpp:112-157 (references: tensors without the flag are padding)"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      uniform: [common, "yes", "yes"]
      variable: [common, "yes", "yes"]
      variable_no_flag: [common, "yes", "yes"]

  - id: per_seq_len_q
    kind: child
    value_kind: class
    parent: {sequence_lengths: [variable, variable_no_flag]}
    level: execute
    meaning: "Contents of seq_len_q, relative to the stored query length."
    values: &per_seq_len_classes
      - {id: all_full, meaning: "every sequence uses the full stored length"}
      - {id: all_equal_partial, meaning: "every sequence the same length, shorter than stored"}
      - {id: mixed, meaning: "different non-zero lengths"}
      - {id: some_zero, meaning: "at least one sequence, not all, has length 0"}
      - {id: all_zero, meaning: "every sequence has length 0"}
      - {id: exceeds_storage, meaning: "a length larger than storage (removed by D-SEQLEN-WITHIN-STORAGE; rejection probe MV-09)"}
    api_paths: [cpp, python]
    cite: "SA:354"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      all_full: [common, "yes", "yes"]
      all_equal_partial: [common, "yes", "yes"]
      mixed: [common, "yes", "yes"]
      some_zero: [rare, "yes", "yes"]
      all_zero: [rare, "yes", "yes"]
      exceeds_storage: [common, "yes", "no"]

  - id: per_seq_len_kv
    kind: child
    value_kind: class
    parent: {sequence_lengths: [variable, variable_no_flag]}
    level: execute
    meaning: "Contents of seq_len_kv, relative to the stored key/value length."
    values: *per_seq_len_classes
    api_paths: [cpp, python]
    cite: "SA:364"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      all_full: [common, "yes", "yes"]
      all_equal_partial: [common, "yes", "yes"]
      mixed: [common, "yes", "yes"]
      some_zero: [rare, "yes", "yes"]
      all_zero: [rare, "yes", "yes"]
      exceeds_storage: [common, "yes", "no"]

  # ------------------------------------------------------------------ number types
  - id: dtype_q
    kind: categorical
    level: graph
    meaning: "Storage format of Q. The reference format for K and V (see dtype_k_vs_q, dtype_v_vs_q)."
    values: *formats
    not_in_model: "Other DataTypes the frontend maps (DOUBLE, FP8_E8M0, FP4, FP6, INT*, UINT8, BOOLEAN): choice rule CH-FLOAT-FORMATS-ONLY."
    api_paths: [cpp, python]
    cite: "TA:424; T:205-238, 835-878; DH:106-110"
    group: G3-precision-scale
    size_sensitive: ["no", "element format and rounding are per element, the same at every size"]
    labels:
      fp32: [rare, "yes", "yes"]
      fp16: [common, "yes", "yes"]
      bf16: [common, "yes", "yes"]
      fp8_e4m3: [common, "yes", partial]
      fp8_e4m3_fnuz: [common, "yes", partial]
      fp8_e5m2: [rare, "yes", partial]
      fp8_e5m2_fnuz: [rare, "yes", partial]

  - id: dtype_k_vs_q
    kind: relationship
    relates: [dtype_k, dtype_q]
    level: graph
    meaning: "Whether K has Q's format."
    values: &dtype_relation
      - {id: same, meaning: "same format as Q"}
      - {id: differs, meaning: "a different format (concrete format in class_to_value)"}
    api_paths: [cpp, python]
    cite: "TA:424; NODE:28-205 (no dtype check)"
    group: G3-precision-scale
    size_sensitive: ["no", "element format and rounding are per element, the same at every size"]
    labels:
      same: [common, "yes", "yes"]
      differs: [common, "yes", "no"]

  - id: dtype_v_vs_q
    kind: relationship
    relates: [dtype_v, dtype_q]
    level: graph
    meaning: "Whether V has Q's format."
    values: *dtype_relation
    api_paths: [cpp, python]
    cite: "TA:424"
    group: G3-precision-scale
    size_sensitive: ["no", "element format and rounding are per element, the same at every size"]
    labels:
      same: [common, "yes", "yes"]
      differs: [common, "yes", "no"]

  - id: dtype_o
    kind: categorical
    level: graph
    meaning: "Storage format of the output O (O set as a non-virtual output with an explicit type)."
    values: *formats
    api_paths: [cpp, python]
    cite: "G:1007-1012; TA:478,586-601"
    group: G3-precision-scale
    size_sensitive: ["no", "element format and rounding are per element, the same at every size"]
    labels:
      fp32: [common, "yes", "yes"]
      fp16: [common, "yes", partial]
      bf16: [common, "yes", "yes"]
      fp8_e4m3: [rare, "yes", partial]
      fp8_e4m3_fnuz: [rare, "yes", partial]
      fp8_e5m2: [rare, "yes", partial]
      fp8_e5m2_fnuz: [rare, "yes", partial]

  - id: compute_precision
    kind: categorical
    level: graph
    meaning: "Node compute_data_type (required)."
    values:
      - {id: fp32, meaning: "FLOAT"}
      - {id: fp16, meaning: "HALF"}
      - {id: bf16, meaning: "BFLOAT16"}
    not_in_model: "Non-float compute types: choice rule CH-FLOAT-FORMATS-ONLY."
    api_paths: [cpp, python]
    cite: "ATTR:114; BASE:242-246"
    group: G3-precision-scale
    size_sensitive: ["yes", "low-precision accumulation error grows with the length summed over"]
    labels:
      fp32: [common, "yes", "yes"]
      fp16: [rare, "yes", "yes"]
      bf16: [rare, "yes", "yes"]

  - id: matmul_input_precision
    kind: categorical
    level: graph
    meaning: "SdpaAttributes mma_core_mode: the type the matrix-multiply operands use."
    values:
      - {id: native, meaning: "mma_core_mode unset (NOT_SET, not packed). Reading NOT_SET as 'operands stay in their format' is inferred"}
      - {id: fp32, meaning: "FLOAT"}
      - {id: fp16, meaning: "HALF"}
      - {id: bf16, meaning: "BFLOAT16"}
      - {id: fp8, meaning: "an 8-bit float format (class_to_value matmul_input_precision fp8 names which)"}
    api_paths: [cpp, python]
    cite: "SA:696; PACK:272-278; @ 00d9c566bea SdpaAttributes.hpp:150,724-727 (set_mma_core_mode takes any DataType)"
    note: "The references accept mma_core_mode and ignore it (SdpaReferenceImplementations.md, 'accepted and ignored'); they compute in fp32, so answer_key yes, with the tolerance risk the fp16 and bf16 values already carry. fp8 usage rare: every fp8 golden bundle sets it, but no real-model configuration was found that states it."
    group: G3-precision-scale
    size_sensitive: ["no", "element format and rounding are per element, the same at every size"]
    labels:
      native: [common, "yes", "yes"]
      fp32: [rare, "yes", "yes"]
      fp16: [rare, "yes", "yes"]
      bf16: [rare, "yes", "yes"]
      fp8: [rare, "yes", "yes"]

  # ------------------------------------------------------------------ sizes
  - id: batch_size
    kind: class
    level: graph
    meaning: "Number of sequences (dims[0] of Q, K, V, O)."
    values: *size_classes
    not_in_model: "zero: every dim must be >= 1 (frontend rule F-EXTENT-NONZERO)."
    api_paths: [cpp, python]
    cite: "TA:636-639; NODE:70-79"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "its non-base value is the extent 1, the same at every tier"]
    labels:
      one: [common, layout, "yes"]
      many: [common, layout, "yes"]

  - id: seq_q
    kind: class
    level: graph
    meaning: "Stored query length (Q dims[2]). 'one' is the decode case."
    values: *size_classes
    not_in_model: "zero as a dim (F-EXTENT-NONZERO). A length 0 for one sequence stays expressible through per_seq_len_q."
    api_paths: [cpp, python]
    cite: "TA:636-639"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      one: [common, "yes", "yes"]
      many: [common, "yes", "yes"]

  - id: seq_kv
    kind: class
    level: graph
    meaning: "Stored key/value length (K and V dims[2])."
    values: *size_classes
    not_in_model: "zero as a dim (F-EXTENT-NONZERO)."
    api_paths: [cpp, python]
    cite: "TA:636-639; NODE:89-96"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      one: [common, "yes", "yes"]
      many: [common, "yes", "yes"]

  - id: seq_q_vs_seq_kv
    kind: relationship
    relates: [seq_q, seq_kv]
    level: graph
    meaning: "How the query length compares with the key/value length."
    values:
      - {id: shorter, meaning: "seq_q < seq_kv"}
      - {id: equal, meaning: "seq_q = seq_kv"}
      - {id: longer, meaning: "seq_q > seq_kv"}
    api_paths: [cpp, python]
    cite: "NODE:28-205 (no relation check)"
    group: G1-mask-seq
    size_sensitive: ["yes", "decides which query/key positions exist; at length 64 there is one tile, so per-tile and per-sequence offsets only show at larger lengths"]
    labels:
      shorter: [common, "yes", "yes"]
      equal: [common, "yes", "yes"]
      longer: [common, "yes", "yes"]

  - id: q_heads
    kind: class
    level: graph
    meaning: "Number of query heads (Q dims[1])."
    values: *size_classes
    not_in_model: "zero (F-EXTENT-NONZERO)."
    api_paths: [cpp, python]
    cite: "TA:636-639"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["no", "its non-base value is the extent 1, the same at every tier"]
    labels:
      one: [rare, layout, "yes"]
      many: [common, layout, "yes"]

  - id: k_head_sharing
    kind: relationship
    relates: [k_heads, q_heads]
    level: graph
    meaning: "How the K head count relates to the query head count."
    values: &head_sharing
      - {id: mha, meaning: "as many K heads as query heads"}
      - {id: gqa, meaning: "K heads divide query heads, 1 < K heads < query heads"}
      - {id: mqa, meaning: "one K head shared by several query heads"}
      - {id: non_divisor, meaning: "K heads do not divide query heads (removed by D-HEADS-K-DIVIDES; the frontend refuses it)"}
    api_paths: [cpp, python]
    cite: "NODE:98-121"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "head-group mapping: tier M has 32 query heads and 8 K/V heads, tier S only 8 and 2"]
    labels:
      mha: [common, unclear, "yes"]
      gqa: [common, unclear, "yes"]
      mqa: [common, unclear, "yes"]
      non_divisor: [common, unclear, "no"]

  - id: v_head_sharing
    kind: relationship
    relates: [v_heads, q_heads]
    level: graph
    meaning: "How the V head count relates to the query head count."
    values: *head_sharing
    api_paths: [cpp, python]
    cite: "NODE:98-121"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "head-group mapping: tier M has 32 query heads and 8 K/V heads, tier S only 8 and 2"]
    labels:
      mha: [common, unclear, "yes"]
      gqa: [common, unclear, "yes"]
      mqa: [common, unclear, "yes"]
      non_divisor: [common, unclear, "no"]

  - id: k_heads_vs_v_heads
    kind: relationship
    relates: [k_heads, v_heads]
    level: graph
    meaning: "Whether K and V have the same head count (the frontend checks each against Q separately)."
    values:
      - {id: equal, meaning: "K heads = V heads"}
      - {id: differ, meaning: "K heads != V heads"}
    api_paths: [cpp, python]
    cite: "NODE:98-121"
    group: G5-batch-heads-kvstorage
    size_sensitive: ["yes", "head-group mapping: tier M has 32 query heads and 8 K/V heads, tier S only 8 and 2"]
    labels:
      equal: [common, "yes", "yes"]
      differ: [rare, "yes", "yes"]

  - id: head_dim_qk
    kind: class
    level: graph
    meaning: "Q and K head size d (Q/K dims[3]). Carried as representative levels; see choice rule CH-HEAD-DIM-LEVELS."
    values: &head_dims
      - {id: d1, class: one, meaning: "head size 1"}
      - {id: d64, class: many, meaning: "head size 64"}
      - {id: d128, class: many, meaning: "head size 128"}
      - {id: d192, class: many, meaning: "head size 192"}
      - {id: d256, class: many, meaning: "head size 256 (Gemma 2 9B, Gemma 3)"}
