      - {id: by_value_constant_tensor, class: constant, meaning: "a volume-1 scale tensor passed by value as a compile-time constant"}
      - {id: runtime_parameter, class: runtime, meaning: "a volume-1 scale tensor passed by value as a runtime parameter"}
      - {id: device_tensor, class: runtime, meaning: "a volume-1 scale tensor in device memory"}
    not_in_model: "'Use the definition's 1/sqrt(d)': unset gives 1.0 (frontend rule F-SCALE-NO-DEFAULT-SOURCE). Unset is API-path variant PV-SCALE-UNSET."
