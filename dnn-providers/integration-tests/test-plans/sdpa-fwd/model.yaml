  # ------------------------------------------------------------------ tensor contents: hints for a fuzzer
  # Not for test-case generation. CH-FUZZER-HINTS keeps every case at the first value.
  - id: special_values
    kind: categorical
    level: execute
    meaning: "Special numbers in the contents of Q, K, V or the bias. Not for test-case generation: a hint for a fuzzer (CH-FUZZER-HINTS keeps every case at none)."
    values:
      - {id: none, meaning: "only ordinary finite numbers (a random fill)"}
      - {id: infinity, meaning: "+inf or -inf in an input"}
      - {id: nan, meaning: "NaN in an input"}
      - {id: negative_infinity_bias, meaning: "-inf in the bias: the score it meets is masked"}
      - {id: subnormal, meaning: "numbers below the smallest normal number of the format"}
      - {id: signed_zero, meaning: "+0 and -0"}
    api_paths: [cpp, python]
    cite: "G:4746-4748 (contents are data at execute)"
    note: "No reference run checks the held-out classes, so their answer_key is no."
    group: G3-precision-scale
    size_sensitive: ["no", "a fuzzer hint, held out of generation"]
    labels:
      none: [common, "yes", "yes"]
      infinity: [rare, "yes", "no"]
      nan: [rare, "yes", "no"]
      negative_infinity_bias: [common, "yes", "no"]
