# Layer 2 — the expressible space of FORWARD scaled dot-product attention (SDPA) through hipDNN's
# frontend API.
#
# What this file is
#   One-time research record. Each rule removes Layer 1 combinations (L0-axes.yaml narrowed by
#   L1-definition.yaml) that hipDNN's frontend API CANNOT STATE. Every rule has kind `frontend`:
#   it changes when the API changes. Removed cases are not tests: a request that cannot be written
#   is not a test.
#   The opposite gap — meaningless things the frontend ACCEPTS — is not here. Such requests belong
#   to a rejection suite.
#
# Inputs
#   - L0-axes.yaml, L1-definition.yaml (Layers 0 and 1).
#   - The frontend API at the commit in model.yaml `api_record.sha`. Every rule cites the function
#     or field it rests on, as `<abbreviation>::<function>`, with a quoted error string or condition
#     where one identifies the check. Path abbreviations (SA, TA, NODE, FBS, G, …) are model.yaml
#     `api_record.paths`, plus UTIL frontend/include/hipdnn_frontend/node/detail/Utilities.hpp,
#     TFBS flatbuffers_sdk/schemas/tensor_attributes.fbs, GFBS flatbuffers_sdk/schemas/graph.fbs and
#     PU test_sdk/include/hipdnn_test_sdk/utilities/cpu_graph_executor/detail/PlanUtils.hpp (all
#     under projects/hipdnn/).
#   - Extra code read for this file:
#       SA::set_causal_mask and SA::set_causal_mask_bottom_right set diagonal_alignment and
#         right_bound = 0, the same fields the sliding-window setters use
#         (SA::set_diagonal_band_left_bound, SA::set_diagonal_band_right_bound);
#       FBS SdpaAttributes: one diagonal_alignment field, one left_bound, one right_bound for the
#         whole node;
#       NODE::pre_validate_node, NODE::infer_properties_node.
#
# Rule format — the same as L1-definition.yaml
#   forbid      map axis -> values. A case is excluded when, for EVERY listed axis, the case's value
#               is in the list. A child axis that is not active never matches.
#   forbid_any  list of `forbid` maps; the rule excludes a case that matches any one of them.
#   cites       the function or field each rule rests on.
#   why_frontend  why the rule is a frontend limit — not a definition fact (Layer 1 keeps the
#               combination) and not an engine or library limit (no engine is ever asked: the
#               request cannot be written).
#   evidence    measured | read in code | inferred.
#   debatable   true when the classification is open; the reason is in `debatable_reason`.
#
# Amended 2026-10-29.
#   Re-checked against the frontend for the Layer 0 values added that day.
#   Every new value is expressible, so no exclusion rule was added; `how_stated` gains one line per
#   new value with the code it rests on. F-SCALE-TENSOR-BY-VALUE now states its forbid against the model's
#   value (`forbid_in_model`): device_tensor is an API delivery form, not a Layer 0 value, so the rule
#   removes nothing from Layer 0.
# Amended 2026-11-04 (Layer 0 fix): new rules
#   F-NO-CU-SEQ-LEN and F-BLOCK-MASK-TILE-128; F-SINK-FLOAT-ONLY names every non-FLOAT format;
#   F-RAGGED-OFFSETS-ARE-LENGTHS states the boundary form and covers independent_starts.

schema_version: 1
layer: 2
direction: forward
derived_from: [L0-axes.yaml, L1-definition.yaml]
api_record: model.yaml api_record
run_path: "C++ frontend. The Python and cuDNN-compatibility paths are API-path variants (see path_variants), not separate layers."

rules:

  - id: F-EXTENT-NONZERO
    kind: frontend
    reason: "Every tensor dimension must be at least 1, so an empty batch, head set, stored length or head size cannot be stated."
    forbid_any:
      - {batch_size: [zero]}
      - {seq_q: [zero]}
      - {seq_kv: [zero]}
      - {q_heads: [zero]}
      - {head_dim_qk: [zero]}
      - {head_dim_v: [zero]}
    cites:
      - "TA::validate (`isPositive`); NODE::pre_validate_node (\"batch size mismatch between Q and K\")"
      - "TA::validate (`isPositive`); SA::set_seq_len_q"
      - "TA::validate (`isPositive`); NODE::pre_validate_node (\"seq_kv mismatch between K and V\"); SA::set_seq_len_kv"
      - "TA::validate (`isPositive`)"
      - "NODE::pre_validate_node (\"head_dim mismatch between Q and K\"); TA::validate (`isPositive`)"
      - "NODE::pre_validate_node (Rule 2: V head_dim is independent; \"Output O head_dim must match V head_dim\"); TA::validate (`isPositive`)"
    why_frontend: >-
      Layer 1 keeps every one of these values (L1 rejected
      candidate "Sequence length 0 forbidden", verdict api_limit). The limit is the API's
      tensor-dimension check, applied before any engine is asked.
    still_expressible: "A length of 0 for ONE sequence stays expressible as a value in the seq_len_q / seq_len_kv tensors (per_seq_len_q / per_seq_len_kv = some_zero or all_zero)."
    evidence: read in code
    debatable: false

  - id: F-ALIBI-NO-SLOPES
    kind: frontend
    reason: "ALiBi is an on/off flag; no API sets its per-head slopes."
    forbid: {alibi_slopes: [other_positive, zero, negative]}
    cites:
      - "SA::set_alibi_mask; FBS SdpaAttributes::alibi_mask (bool = false); absence search: rg -i slope in SA, NODE, flatbuffers_sdk/schemas, PY — only Pointwise relu-slope hits"
    why_frontend: >-
      Layer 1 keeps every slope class (L1 rejected candidate "Negative scale, zero scale, negative
      ALiBi slope, zero ALiBi slope", verdict unusual_not_meaningless; D-S-ALIBI-NEEDS-SLOPES says
      ALiBi is DEFINED by its slopes). No engine is involved: the API has no field to carry a slope.
    mapping_assumed: "alibi = present is read as alibi_slopes = standard_geometric (the ALiBi paper's sequence). Inferred: no API document states which slopes alibi_mask = true means."
    evidence: read in code (absence) + inferred (mapping)
    debatable: true
    debatable_reason: >-
      The API does not document which slopes alibi_mask = true uses, nor which diagonal ALiBi
      measures distance from. If the slopes are not the standard
      sequence, alibi = present itself is underspecified at this layer, not only the other slope
      classes.
    waiting_list: WL-ALIBI-SLOPES

  - id: F-NO-SOFTCAP
    kind: frontend
    reason: "No API sets logit soft-capping; the general score-modifier hook is always rejected."
    forbid: {logit_softcap: [present]}
    cites:
      - "absence search: rg -i 'soft_?cap|softcap|logit_cap|tanh' in SA, NODE, FBS, GFBS, TFBS, PY: 0 hits"
      - "NODE::pre_validate_node (`hasUnsupportedUsage()`: set_score_mod recorded as unsupported, validate returns INVALID_VALUE); SA::set_score_mod"
    why_frontend: >-
      Soft-capping with a cap other than 0 is meaningful (only D-SOFTCAP-ZERO excludes a value).
      The API has neither a field nor a working hook for it.
    evidence: read in code
    debatable: false
    waiting_list: WL-SOFTCAP

  - id: F-NO-KV-APPEND
    kind: frontend
    reason: "No API asks the operation to write new keys and values into an existing cache."
    forbid: {kv_cache_append: [present]}
    cites:
      - "absence search: rg -i 'split_?kv|num_splits|append|kv_cache|cache_batch|new_kv' in SA, NODE, FBS, GFBS, TFBS, PY: 0 hits"
    why_frontend: "Writing to a cache while attending is a meaningful fused operation (no Layer 1 rule touches it). The API has no field for it."
    evidence: read in code
    debatable: false
    waiting_list: WL-KV-APPEND

  - id: F-NO-AMAX-QKV
    kind: frontend
    reason: "The API returns amax (largest absolute value) only for S and O, not for Q, K or V."
    forbid_any:
      - {amax_q: [requested]}
      - {amax_k: [requested]}
      - {amax_v: [requested]}
    cites:
      - "SA::set_amax_s, SA::set_amax_o (only these two); FBS SdpaAttributes::amax_s_tensor_uid, ::amax_o_tensor_uid; the SA::OutputNames enum lists Amax_S and Amax_O only"
    why_frontend: "Layer 1 keeps amax for every tensor (L1 rejected candidate 'amax outputs only for fp8, or only for S and O', verdict library_limit)."
    evidence: read in code
    debatable: false
    waiting_list: WL-AMAX-QKV

  - id: F-SCALE-NO-DEFAULT-SOURCE
    kind: frontend
    reason: "Leaving the scale unset gives 1.0, not the definition's 1/√d, so 'use the definition's own scale' cannot be stated."
    forbid: {scale_source: [default]}
    cites:
      - "the SA header comment (default 1.0: 'When neither is set it is 1.0'); G::sdpa doc comment; FBS SdpaAttributes::attn_scale_value (float = null)"
    why_frontend: >-
      Layer 1 keeps scale_source = default. The API's unset value is a different number (1.0).
      No meaning is lost: scale_source = constant with scale_value = inverse_sqrt_d gives the same
      number (L1 `equivalences`).
    api_unset_maps_to: "scale_source = constant, scale_value = other_positive (1.0); equal to inverse_sqrt_d only when head_dim_qk is one. Recorded as an API-path variant (unset vs set-to-default) under path_variants."
    evidence: read in code
    debatable: true
    debatable_reason: "Because an equivalent value stays expressible, this can also be read as an API-path variant rather than an exclusion. It is kept as a rule so that the 'default' class never reaches the generator under a name that the API cannot honour."

  - id: F-ONE-DIAGONAL
    kind: frontend
    reason: "The node has one diagonal alignment and one band (left_bound, right_bound); a causal mask and a sliding window cannot use different diagonals."
    forbid_any:
      - {causal_alignment: [top_left], window_alignment: [bottom_right]}
      - {causal_alignment: [bottom_right], window_alignment: [top_left]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp::SdpaAttributes::diagonal_alignment (one member, default TOP_LEFT); ::set_causal_mask and ::set_causal_mask_bottom_right write it; ::set_diagonal_alignment writes it"
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::pre_validate_node -> node/detail/Utilities.hpp::validateSdpaDiagonalBand (the node checks one left_bound and one right_bound)"
      - "SA::set_causal_mask, SA::set_causal_mask_bottom_right (both set diagonal_alignment and right_bound = 0)"
      - "SA::set_diagonal_alignment; FBS SdpaAttributes::diagonal_alignment (one field); T::DiagonalAlignment"
      - "SA::set_diagonal_band_left_bound, SA::set_diagonal_band_right_bound, SA::set_sliding_window_length; FBS SdpaAttributes::left_bound, ::right_bound (one of each)"
      - "the SA::causal_mask doc comment (a deprecated flag is refined by the same bounds and alignment; it adds no second diagonal)"
    why_frontend: >-
      Layer 1 keeps two masks on two diagonals (masks combine by intersection; L0 keeps
      causal_alignment and window_alignment as separate child axes). The API stores one band
      and one diagonal_alignment. Two different alignments are removed at every length
      relation: with seq_q = seq_kv the two diagonals give the same scores (L1 `equivalences`),
      but a graph can still state only one alignment, so the row cannot be written as two.
      User decision 2026-10-29 ("yes": causal and sliding-window alignment must be the same).
      Causal + window on ONE diagonal stays expressible as one band
      (left_bound = window left, right_bound = 0).
    evidence: read in code
    debatable: true
    debatable_reason: "The same score pattern can still be written another way: as an additive bias of 0 / −∞ (bias = present) or a block mask. That changes other axes of the case, so the settings themselves stay unexpressible."

  - id: F-RAGGED-OFFSETS-ARE-LENGTHS
    kind: frontend
    reason: "Without length tensors the ragged offsets are boundaries and lengths: sequence b holds [offset[b], offset[b + 1]) and the offsets do not decrease. So a slot longer than its sequence (gapped, independent_starts) or a sequence stored before a sequence of lower index (out_of_order) cannot be stated. With length tensors the offsets are start positions only: any order can be stated, and the length tensors give the lengths."
    forbid_any:
      - {ragged_offsets: [gapped, independent_starts, out_of_order], sequence_lengths: [uniform]}
      - {ragged_offsets: [gapped, independent_starts, out_of_order], length_form: [start_position_differences]}
    cites:
      - "TA::set_ragged_offset; DH::createOrFindTensorDesc, the `has_ragged_offset` branch (checks the offset tensor's own properties only)"
      - "the ragged batch layout that hipDNN PR #15080 adds to the data SDK's RaggedTensor.hpp (with length tensors the lengths come from them; without them each length is offset[b + 1] - offset[b], and a decrease is refused)"
    why_frontend: >-
      Without length tensors a decreasing list states a negative length, not an out-of-order start,
      and one sequence ends where the next starts. With the per-sequence length tensors (cuDNN's
      ragged + padding form) the offsets are start positions: a gapped, independent or out-of-order
      layout is stated. Overlapping sequences are Layer 1 (D-RAGGED-NO-OVERLAP).
    evidence: read in code
    debatable: true
    debatable_reason: "The frontend accepts any offset contents (DH::createOrFindTensorDesc). The boundary form without length tensors is hipDNN's ragged definition; the references read the offsets that way when no length tensors are given and as start positions when they are. cuDNN's form is the same: start positions with lengths from the length tensors. leading_gap (offset[0] > 0) needs no length tensors and is not removed here."

  - id: F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN
    kind: frontend
    reason: "With max_seq_len_kv declared, each page table must be exactly ceil(max_seq_len_kv / page size) pages wide, so a surplus page with the maximum equal to the length, or exactly the needed pages with a larger maximum, cannot be stated."
    forbid_any:
      - {page_count: [surplus], max_seq_len_kv: [equal]}
      - {page_count: [exact], max_seq_len_kv: [larger]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validatePagedKv (\"max_blocks_per_seq must equal ceil(max_seq_len_kv / block_size)\", block_size = the container's dim 2; its comment: cuDNN's rule, an unset max_seq_len_kv is inferred by the engine)"
      - "SA::set_paged_attention_k_table, SA::set_paged_attention_v_table, SA::set_paged_attention_max_seq_len_kv"
    why_frontend: >-
      Layer 1 keeps both combinations: a table with an unused page, or a declared maximum that the
      table more than covers, still addresses every key and value (D-PAGES-SUFFICIENT and
      D-MAXLEN-NOT-BELOW-ACTUAL do not touch them). The frontend fixes the table width from the
      declared maximum, so with max_seq_len_kv set the page count and the maximum are one setting.
    still_expressible: "surplus + larger (maximum = pages x page size). exact + larger only when the page size does not divide the key/value length. A surplus table with max_seq_len_kv unset (an API-path variant under path_variants)."
    evidence: "read in code; measured (re-discovery 2026-10-28: frontend-rejected on gfx942 and gfx950)"
    debatable: true
    debatable_reason: "A validation choice that matches cuDNN, not an impossibility: the extra pages are never read. Added 2026-10-28."

  - id: F-SHARED-TABLE-ONE-WIDTH
    kind: frontend
    reason: "One page-table tensor has one width, but with max_seq_len_kv declared each side's table must be ceil(max_seq_len_kv / that side's page size) wide, so one table shared by K and V cannot serve two page sizes."
    forbid: {page_table_sharing: [shared], page_size_k_vs_v: [differ]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validatePagedKv (each table's dim 2 must equal ceil(max_seq_len_kv / its own container's block size))"
    why_frontend: >-
      Layer 1 keeps it: a shared table read with two page sizes still addresses every key and value if both
      pools are laid out to match (L1 rejected candidate "A shared K/V page table only with equal page
      sizes"). The frontend fixes each table's width from its own page size, so one tensor cannot be both
      widths unless they happen to agree. Added 2026-10-29 (read in code, not run).
  - id: F-SCALE-TENSOR-BY-VALUE
    kind: frontend
    reason: "A scale tensor must be passed by value (a compile-time constant or a runtime parameter), so a scale held in device memory cannot be stated."
    forbid_in_model: {scale_source: [device_tensor]}
    layer0_effect: "none. Layer 0's scale_source = runtime keeps an expressible form (a runtime parameter); device_tensor is one of the model's API delivery forms (rules.yaml CH-SCALE-DELIVERY-LEVELS). Moved from `forbid` 2026-10-29 so that the rule names only Layer 0 values here."
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::pre_validate_node (Rule 6b: validateScalarParameter on the scale tensor)"
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/detail/Utilities.hpp::validateScalarParameter (\"must be a pass-by-value tensor\")"
    why_frontend: >-
      Layer 1 keeps a device-memory scale: one number in device memory is a well-defined scale.
      The frontend accepts a scale tensor only when it is passed by value. Found as a frontend
      rejection in discovery B4 (2026-10-27, 408 rows) and in the per-case runner (2026-10-28,
      78 rows); added as a rule 2026-10-28.
    still_expressible: "A by-value scale tensor: scale_source by_value_constant_tensor or runtime_parameter."
    evidence: "read in code; measured"
    debatable: true
    debatable_reason: "A validation choice, not an impossibility."

  - id: F-SINK-FLOAT-ONLY
    kind: frontend
    reason: "The frontend takes only a FLOAT sink tensor, so a sink in any other format cannot be stated."
    label: "refused by frontend, potential deficiency or defect"
    forbid: {sink_dtype: [fp16, bf16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validateSinkToken (\"sink_token must have FLOAT data type\")"
    why_frontend: "Layer 0 keeps a sink in every format (lossy, not meaningless). The node refuses any sink whose type is not FLOAT; an unset type takes the graph's io type and is refused the same way."
    evidence: read in code
    debatable: true
    debatable_reason: "A validation choice, not an impossibility: a sink in any format is a defined logit, and no frontend setting reaches an engine that takes one."

  - id: F-NO-NEGATIVE-STRIDE
    kind: frontend
    reason: "A negative stride (a dimension walked backwards) on Q, K, V, O or Stats should be refused by the frontend."
    enforced: "not yet: the frontend accepts any int64 stride (ALMIOPEN-3114)"
    forbid_any:
      - {strides_q: [negative]}
      - {strides_k: [negative]}
      - {strides_v: [negative]}
      - {strides_o: [negative]}
      - {strides_stats: [negative]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/attributes/TensorAttributes.hpp::validate (`HIPDNN_RETURN_IF_NE(_dim.size(), _stride.size(), ...)`: only the stride count is checked)"
    why_frontend: "Layer 1 keeps negative strides (reading through any stride pattern is defined). The rule records a frontend validation gap: hipDNN intends to refuse them (ALMIOPEN-3114); the frontend accepts them today."
    evidence: read in code

  - id: F-PAGED-NEEDS-SEQ-LENS
    kind: frontend
    reason: "Paged K or V needs both seq_len_q and seq_len_kv, so paging with every sequence at full length and no length tensors cannot be stated."
    forbid: {paged_kv: [present, k_only, v_only], sequence_lengths: [uniform]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validatePagedKv (\"paged K/V needs seq_len_q and seq_len_kv\")"
    why_frontend: "Layer 1 keeps paged storage with full lengths. The node refuses paging without both length tensors; full lengths are stated as sequence_lengths variable with every length full."
    still_expressible: "sequence_lengths = variable with per_seq_len_q / per_seq_len_kv = all_full."
    evidence: read in code

  - id: F-INDEX-TENSORS-INT32
    kind: frontend
    reason: "The per-sequence length tensors and the page tables must be INT32, so a 64-bit index tensor cannot be stated."
    forbid: {index_tensor_dtype: [int64]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validateSeqLenTensor (\"must have INT32 data type\")"
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/SdpaFwdNode.hpp::validatePagedKv (`table->get_data_type() != DataType::INT32`)"
    why_frontend: "Layer 0 keeps any integer format for an index. The node checks the type of each length tensor and each page table. It does not check the format of the ragged start positions (ragged_offset_dtype; DH::createOrFindTensorDesc)."
    evidence: read in code

  - id: F-NO-CU-SEQ-LEN
    kind: frontend
    reason: "No API takes cumulative sequence lengths, so lengths given as running totals cannot be stated."
    forbid: {length_form: [cumulative_lengths]}
    cites:
      - "no cu_seq_len setter in projects/hipdnn/frontend/include/hipdnn_frontend/attributes/SdpaAttributes.hpp, node/SdpaFwdNode.hpp or flatbuffers_sdk/schemas/sdpa_attributes.fbs (search for cu_seq_len: 0 hits)"
    why_frontend: "Layer 0 keeps cumulative lengths (a defined way to state per-sequence lengths). The node has seq_len_q / seq_len_kv tensors of per-sequence lengths and no setter for running totals."
    evidence: read in code (absence)

  - id: F-BLOCK-MASK-TILE-128
    kind: frontend
    reason: "The API's block mask holds one flag per 128 x 128 score tile, so a mask with one flag per score, or with another tile size, cannot be stated."
    forbid: {block_mask_granularity: [per_element]}
    forbid_in_model: {block_mask_granularity: [other_tile, per_element]}
    cites:
      - "projects/hipdnn/flatbuffers_sdk/schemas/sdpa_attributes.fbs SdpaAttributes::block_mask_tensor_uid and its comment (each entry selects whether a 128x128 score tile is computed)"
    why_frontend: "Layer 0 keeps a flag per score and any tile size. The API fixes the tile size; no setter changes it."
    evidence: read in code
    debatable: true
    debatable_reason: "The tile size is stated in the schema comment; the frontend does not check the block-mask shape against it."

  - id: F-LEFT-BOUND-NOT-ZERO
    kind: frontend
    reason: "A left bound of 0 is refused, so a window that excludes the diagonal key on the left cannot be stated."
    forbid: {window_left: [zero_excluding_diagonal]}
    cites:
      - "projects/hipdnn/frontend/include/hipdnn_frontend/node/detail/Utilities.hpp::validateSdpaDiagonalBand (`leftBound.has_value() && (leftBound.value() == 0 || leftBound.value() < -1)`)"
    why_frontend: "Layer 0 keeps the value (the left bound counts the diagonal key, so 0 excludes it). The node's band check refuses left_bound 0, as cuDNN does."
    evidence: read in code

# Layer 1 facts that the frontend DOES enforce. They remove nothing here (Layer 1 already removed
# them, or Layer 0 cannot state them). Listed so a reader sees the agreements, not only the gaps.
layer1_facts_enforced_by_frontend:
  - {l1_id: D-HEADS-K-DIVIDES, check: "num_heads % num_heads_k == 0, num_heads_k > 0", cite: "NODE::pre_validate_node (Rule 4: \"num_heads must be divisible by num_heads_k\" / \"num_heads_v\")"}
  - {l1_id: D-HEADS-V-DIVIDES, check: "num_heads % num_heads_v == 0, num_heads_v > 0", cite: "NODE::pre_validate_node (Rule 4: \"num_heads must be divisible by num_heads_k\" / \"num_heads_v\")"}
  - {l1_id: D-S-BATCH-SHARED, check: "Q, K, V batch equal; O batch equal when O dims are set", cite: "NODE::pre_validate_node (\"batch size mismatch between Q and K\"; Rule 7: \"Output O batch mismatch\")"}
  - {l1_id: D-S-KV-LENGTH-SHARED, check: "K dims[2] == V dims[2]", cite: "NODE::pre_validate_node (\"seq_kv mismatch between K and V\")"}
  - {l1_id: D-S-QK-HEAD-DIM-SHARED, check: "Q dims[3] == K dims[3]", cite: "NODE::pre_validate_node (\"head_dim mismatch between Q and K\")"}
  - {l1_id: D-S-OUTPUT-SHAPE, check: "O only: rank 4, [B, H_q, S_q, D_v] when O dims are set; inferred when unset. Stats, Max, Sum_exp are NOT checked", cite: "NODE::pre_validate_node (Rule 7: \"If O has dims already set, validate them\"); NODE::infer_properties_node"}
  - {l1_id: D-S-SCALE-VALUE-NEEDS-SOURCE, check: "scale tensor and scale value not both; scale tensor volume 1", cite: "NODE::pre_validate_node (Rule 6: \"attn_scale tensor and attn_scale_value cannot both be set\"); UTIL::validateScalarParameter"}
  - {l1_id: D-BIAS-SHAPE, check: "PARTLY: rank <= 4 and the last two dims in {seq, 1}. Leading (batch, head) dims are not checked", cite: "NODE::pre_validate_node (Rule 5: \"ATTN_MASK rank must be <= 4\", \"ATTN_MASK last dim must equal seq_kv\")"}
  - {l1_id: D-S-CAUSAL-NEEDS-ALIGNMENT, check: "by shape: diagonal_alignment is always packed (default TOP_LEFT)", cite: "FBS SdpaAttributes::diagonal_alignment; PACK::createSdpaFwdOperation (always packs diagonal_alignment)"}

# How each Layer 0 axis is stated through the C++ frontend. "full" = every Layer 1 value of the
# axis can be stated. Axes not listed under `partial` are `full`.
expressibility:
  partial:
    - {axis: batch_size, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: seq_q, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: seq_kv, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: q_heads, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: head_dim_qk, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: head_dim_v, lost: [zero], rule: F-EXTENT-NONZERO}
    - {axis: alibi_slopes, lost: [other_positive, zero, negative], rule: F-ALIBI-NO-SLOPES}
    - {axis: scale_source, lost: [default], rule: F-SCALE-NO-DEFAULT-SOURCE}
    - {axis: ragged_offsets, lost: "gapped, independent_starts and out_of_order when the offsets are the only lengths", rule: F-RAGGED-OFFSETS-ARE-LENGTHS}
    - {axis: sink_dtype, lost: [fp16, bf16, fp8_e4m3, fp8_e4m3_fnuz, fp8_e5m2, fp8_e5m2_fnuz], rule: F-SINK-FLOAT-ONLY}
    - {axis: length_form, lost: [cumulative_lengths], rule: F-NO-CU-SEQ-LEN}
    - {axis: block_mask_granularity, lost: [per_element], rule: F-BLOCK-MASK-TILE-128}
    - {axis: strides_q, lost: [negative], rule: F-NO-NEGATIVE-STRIDE}
    - {axis: strides_k, lost: [negative], rule: F-NO-NEGATIVE-STRIDE}
    - {axis: strides_v, lost: [negative], rule: F-NO-NEGATIVE-STRIDE}
    - {axis: strides_o, lost: [negative], rule: F-NO-NEGATIVE-STRIDE}
    - {axis: strides_stats, lost: [negative], rule: F-NO-NEGATIVE-STRIDE}
    - {axis: sequence_lengths, lost: "uniform, only combined with paging", rule: F-PAGED-NEEDS-SEQ-LENS}
    - {axis: index_tensor_dtype, lost: [int64], rule: F-INDEX-TENSORS-INT32}
    - {axis: window_left, lost: [zero_excluding_diagonal], rule: F-LEFT-BOUND-NOT-ZERO}
    - {axis: causal_alignment, lost: "only combined with a window on the other diagonal", rule: F-ONE-DIAGONAL}
    - {axis: window_alignment, lost: "as causal_alignment", rule: F-ONE-DIAGONAL}
    - {axis: page_count, lost: "surplus with max_seq_len_kv equal; exact with larger", rule: F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN}
    - {axis: max_seq_len_kv, lost: "as page_count", rule: F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN}
    - {axis: page_size_k_vs_v, lost: "differ, only combined with a shared page table", rule: F-SHARED-TABLE-ONE-WIDTH}
    - {axis: scale_source, lost: [device_tensor], rule: F-SCALE-TENSOR-BY-VALUE}
  none_but_absent:
    - {axis: logit_softcap, rule: F-NO-SOFTCAP, note: "child softcap_value is then never active"}
    - {axis: kv_cache_append, rule: F-NO-KV-APPEND}
    - {axis: amax_q, rule: F-NO-AMAX-QKV}
    - {axis: amax_k, rule: F-NO-AMAX-QKV}
    - {axis: amax_v, rule: F-NO-AMAX-QKV}
  how_stated:  # one line per non-obvious mapping; all read in code unless marked inferred
    batch_packing: "padded: plain dims; ragged: set_ragged_offset on Q/K/V/O (C++ only, TA::set_ragged_offset)"
    ragged_offsets: "contents of the offset tensor (data): offset[b] is the start of sequence b; without length tensors length = offset[b + 1] − offset[b], with them the length tensors give the lengths (the ragged batch layout that hipDNN PR #15080 adds to the data SDK's RaggedTensor.hpp); DH::createOrFindTensorDesc checks only the tensor's own properties"
    sequence_lengths: "variable: padding_mask = true + seq_len_q/kv tensors (SA::set_seq_len_q, SA::set_seq_len_kv, SA::set_padding_mask)"
    per_seq_len_q: "contents of seq_len_q (data)"
    per_seq_len_kv: "contents of seq_len_kv (data)"
    compute_precision: "Node.compute_data_type (required; ATTR::set_compute_data_type, BASE::post_validate_node: \"does not have a compute_data_type set\")"
    matmul_input_precision: "mma_core_mode (SA::set_mma_core_mode). 'native' = NOT_SET — inferred: the API does not document what NOT_SET means"
    dim_order_q: "strides (the SA header comment names helpers for BHSD/BSHD: `TensorLayout::BHSD`, `TensorLayout::BSHD`; other orders by explicit strides)"
    strides_q: "set_stride: any int64 values (TA::set_stride; TA::validate)"
    alignment_q: "set_alignment declares; the real start address is the pointer passed to execute (C++ only, TA::set_alignment)"
    tensor_overlap: "pointers in the variant pack at execute (G::execute); not a graph setting"
    causal_mask: "set_causal_mask / set_causal_mask_bottom_right = alignment + right_bound 0 (SA::set_causal_mask, SA::set_causal_mask_bottom_right)"
    window_left: "left_bound (SA::set_diagonal_band_left_bound). whole_span: a bound >= seq_kv, or −1 — inferred 'unbounded'"
    window_right: "right_bound (SA::set_diagonal_band_right_bound); as window_left"
    block_mask_pattern: "contents of the block-mask tensor (SA::set_block_mask); 128×128 tiles per the schema comment (FBS SdpaAttributes::block_mask_tensor_uid)"
    bias_broadcast: "bias dims of size 1 (NODE::pre_validate_node, Rule 5)"
    alibi: "set_alibi_mask(true) (SA::set_alibi_mask)"
    scale_source: "constant: set_attn_scale(float) or a by-value compile-time-constant tensor; runtime: a device tensor or runtime parameter (SA::set_attn_scale, the tensor and the float overloads; TA::set_value, TA::set_compile_time_constant, TA::set_as_runtime_parameter, TA::set_is_pass_by_value)"
    dropout: "random: set_dropout(p, seed, offset) or set_dropout_probability; caller_mask: set_dropout_mask + set_dropout_scale (SA::set_dropout_mask, SA::set_dropout_scale, SA::set_dropout, SA::set_dropout_probability)"
    dropout_pattern_output: "set_rng_dump (SA::set_rng_dump)"
    stats_output: "set_generate_stats(true); Graph::sdpa creates Stats (G::sdpa, the `generate_stats.value()` branch)"
    max_sumexp_output: "set_logit_max + set_score_sum_exp (SA::set_logit_max, SA::set_score_sum_exp); the API takes each alone as well"
    s_quantization: "set_descale_s + set_scale_s (SA::set_descale_s, SA::set_scale_s); the API takes each alone as well"
    paged_kv: "set_paged_attention_k_table + _v_table (SA::set_paged_attention_k_table, SA::set_paged_attention_v_table); page size and count from K/V dims"
    max_seq_len_kv: "set_paged_attention_max_seq_len_kv (SA::set_paged_attention_max_seq_len_kv). It is rejected without paging (NODE::validatePagedKv: \"max_seq_len_kv is only valid with paged K/V\") and fixes the page-table width (NODE::validatePagedKv: \"max_blocks_per_seq must equal ceil(max_seq_len_kv / block_size)\")"
    paged_kv_node_checks: "paging requires seq_len_q and seq_len_kv (NODE::validatePagedKv), so sequence_lengths = uniform is stated as both tensors filled with the stored lengths (the 2026-10-28 driver also sets padding_mask). A bias's key extent is max_seq_len_kv or 1 (NODE::pre_validate_node, Rule 5: 'the logical key length is max_seq_len_kv when given'). Page tables are INT32 [B, 1, pages, 1] and may carry a ragged offset (accepted, as cuDNN 9.10.2+; NODE::validatePagedKv). The references decline a packed table."
    # --- added 2026-10-29; read in code, nothing run unless marked
    sequence_lengths_spellings: "variable has two spellings: seq_len_q + seq_len_kv with set_padding_mask(true) (model value variable), or the two tensors alone (model value variable_no_flag). The node validates each tensor on its own, INT32 [B, 1, 1, 1], and never ties them to the flag (NODE::pre_validate_node, Rule 4b; NODE::validateSeqLenTensor; setters SA::set_seq_len_q, SA::set_seq_len_kv, SA::set_padding_mask). The references treat the tensors as padding whatever the flag says (PU::isSupportedSdpaPadding); cuDNN refuses tensors without the flag (SdpaSemanticsRegister.md SEM-008)."
    paged_kv_one_side: "k_only / v_only: set only one of set_paged_attention_k_table / _v_table (SA::set_paged_attention_k_table, SA::set_paged_attention_v_table). The node skips the batch and seq_kv checks for the paged side only (NODE::pre_validate_node: `if(!pagedK)`, `if(!pagedK && !pagedV)`) and validates each table on its own, each with its own block size (NODE::validatePagedKv: 'K or V may be paged alone, with its own block size')."
    page_table_sharing: "shared: pass the same INT32 [B, 1, pages, 1] tensor to both table setters (SA::set_paged_attention_k_table, SA::set_paged_attention_v_table). No check compares the two tables (NODE::validatePagedKv loops over each table alone). Inferred, not run: no Graph-level check against one tensor feeding two inputs was found."
    page_size_k_vs_v: "differ: the K and V containers [blocks, H, block_size, D] have different dim 2 (NODE::validatePagedKv: `blockSize = (*container)[2]`); each table's width follows its own block size (NODE::validatePagedKv)."
    page_table_storage: "packed: a page table with a ragged offset is accepted (NODE::validatePagedKv: a table 'may be packed with a ragged offset', as cuDNN 9.10.2+); the references decline it (SdpaReferenceImplementations.md § 2.1)."
    bias_broadcast_new: "batch_only: bias dims [1, H_q, S_q, S_kv]; heads_only: [B, 1, S_q, S_kv]. The node checks only rank <= 4 and the last two dims (NODE::pre_validate_node, Rule 5), so any leading dims are accepted. Rank-2 [S_q, S_kv] and rank-3 biases are other spellings of batch_or_heads / heads_only."
    alibi_head_count: "the query head count is Q dims[1] (NODE::pre_validate_node, Rule 4, checks only divisibility by the K and V head counts); set_alibi_mask(true) (SA::set_alibi_mask) takes no slope or head-count setting."
    descale_granularity: "per_head: a FLOAT descale tensor [B, H_kv, 1, 1] in device memory; finer: any larger shape. The node has no descale shape check (NODE::pre_validate_node; setters SA::set_descale_q, SA::set_descale_k, SA::set_descale_v). The references take a scalar or [B, H_kv, 1, 1] (CpuFpReferenceSdpa.hpp::validateDescaleShape) and refuse a pass-by-value descale with more than one element (PU::isSupportedSdpaFwdNode: 'A pass-by-value descale is staged as one value, so it must be one element')."
    max_sumexp_output_alone: "max_only: set_logit_max alone; sum_exp_only: set_score_sum_exp alone (SA::set_logit_max, SA::set_score_sum_exp). No node check pairs them (NODE::pre_validate_node)."
    batch_packing_per_side: "ragged_q_side / ragged_kv_side: set_ragged_offset on the tensors of one side only (TA::set_ragged_offset). The frontend checks only the offset tensor itself (DH::createOrFindTensorDesc). Each ragged tensor takes its own offset tensor: offsets count that tensor's elements (RaggedTokenBoundaries.hpp::raggedTokenBoundaries). First run on the GPU on 2026-10-29 (gfx942)."
    matmul_input_precision_fp8: "set_mma_core_mode takes any DataType (SA::SdpaAttributes::mma_core_mode; SA::set_mma_core_mode)."
    dropout_mask_broadcast: "the dropout mask dims [1 or B, 1 or H_q, S_q, S_kv]; the node does not check the dropout mask shape (NODE::pre_validate_node). The references take [B or 1, H or 1, Sq, key extent], the key extent being max_seq_len_kv when K is paged (PU::isSupportedSdpaDropout); rng_dump is still compared with K's dim 2 (PU::isSdpaPhiloxDropoutWithDump)."
    head_dim_stride: "head_dim_strided: a D stride of 2 or more through set_stride; d_not_innermost: strides that put D outside the innermost place. The tensor check compares only the stride count with the dim count (TA::validate)."
    view_layout: "inherited: the view's strides are its owner's strides (set_stride); the node never compares two tensors' strides. Memory sharing is made by the execute pointers (G::execute)."
    stats_packing: "packed_with_q: set_ragged_offset on the Stats tensor (TA::set_ragged_offset). The node only fills Stats dims and strides when they are empty (NODE::infer_properties_node); it has no ragged check, so no Layer 2 rule removes the value."
    sink_dtype: "the sink tensor's data type (set_data_type); only FLOAT passes (F-SINK-FLOAT-ONLY)."
    ragged_offset_unit: "tokens: set_ragged_offset_multiplier(sequence stride) on each ragged tensor (TA::set_ragged_offset_multiplier; a multiplier below 1 is refused: TA::validate, \"ragged offset multiplier must be >= 1\"); elements: the default multiplier 1, not sent (DH::createOrFindTensorDesc, the `get_ragged_offset_multiplier()` branch)."
    ragged_offset_sharing: "shared_per_side: the same offset tensor passed to set_ragged_offset of each tensor of the side; the descriptor builder finds the tensor already lowered (DH::createOrFindTensorDesc)."
    ragged_offset_dtype: "the offset tensor's data type; DH::createOrFindTensorDesc checks that it is not virtual and not ragged, not its format."
    o_packing: "own_starts: O's own offset tensor with other contents; padded: no set_ragged_offset on O."
    v_packing: "own_starts: V's own offset tensor with other contents; padded: no set_ragged_offset on V."
    dropout_scale_storage: "by_value: a dropout-scale tensor with a pass-by-value value; device_memory: a dropout-scale tensor in device memory (SA::set_dropout_scale; TA::set_is_pass_by_value)."
    descale_storage: "by_value: a one-element factor tensor with a pass-by-value value; device_memory: the same tensor in device memory (SA::set_descale_q to SA::set_scale_o; TA::set_is_pass_by_value)."
    length_form: "per_sequence_lengths: seq_len_q / seq_len_kv; start_position_differences: the ragged offsets without length tensors; cumulative_lengths: no setter (F-NO-CU-SEQ-LEN)."
    block_mask_granularity: "tile: the block-mask tensor of 128 x 128 tiles (FBS SdpaAttributes::block_mask_tensor_uid); no setter for another tile size."
    block_mask_dtype: "the block-mask tensor's data type (set_data_type); the node does not check it (NODE::pre_validate_node)."
    dropout_mask_dtype: "the dropout-mask tensor's data type (set_data_type); the node does not check it (NODE::pre_validate_node)."
    rng_state_storage: "by_value: seed and offset tensors with set_value; device_memory: seed and offset tensors in device memory (SA::set_seed, SA::set_offset); the node does not check where they are held."
    execution_strategy: "set_implementation (SA::set_implementation; T::AttentionImplementation; FBS SdpaAttributes::implementation); unset equals AUTO (an API-path variant under path_variants)."
    sink_values: "contents of the sink tensor (data)."
    scale_factor_values: "contents of the descale and scale tensors (data), or the number of a by-value tensor."
    special_values: "contents of Q, K, V and the bias (data)."
    value_magnitude: "contents of Q, K, V and the bias (data)."
    index_tensor_dtype: "the data type of the seq_len tensors and the page tables; only INT32 passes (F-INDEX-TENSORS-INT32)."
    left_bound_semantics: "left_bound counts the diagonal key (cuDNN); 0 and < -1 rejected, right_bound < -1 rejected (NODE::pre_validate_node -> UTIL::validateSdpaDiagonalBand). window_left zero / partial / whole_span = left_bound 1 / S_kv/4 + 1 / S_kv + 1"

# API-path variants found while mapping: one request stated through different API routes. They are
# not exclusions and not cases of this plan; they belong to a rejection suite.
path_variants:
  - {what: "scale unset (1.0) vs set_attn_scale(1.0)", cite: "the SA header comment ('When neither is set it is 1.0'); FBS SdpaAttributes::attn_scale_value"}
  - {what: "alibi_mask, padding_mask, causal_mask*, diagonal_alignment, implementation: unset and set-to-default cannot be told apart", cite: "PACK::createSdpaFwdOperation"}
  - {what: "generate_stats, dropout_probability, attn_scale_value, left/right_bound, max_seq_len_kv: unset survives packing", cite: "PACK::createSdpaFwdOperation, the `has_value()` branches; FBS '= null' fields"}
  - {what: "causal by set_causal_mask*, by set_diagonal_band_right_bound(0) + alignment, or by the deprecated member flags", cite: "SA::causal_mask, SA::causal_mask_bottom_right; SA::set_causal_mask, SA::set_causal_mask_bottom_right"}
  - {what: "Python lacks ragged offsets, set_alignment, runtime shape overrides, set_sliding_window_length, set_dropout(mask, scale)", cite: "PY::attributesBindings (the `set_dropout` binding)"}
  - {what: "cuDNN-compat entry sets mma_core_mode = HALF when unset", cite: "SHIM::sdpa"}

# Axes that L0-axes.yaml sets aside "to Layer 2" and that the frontend does carry. They are API
# settings, not attention-meaning axes. model.yaml decides whether it carries them. They are
# NOT in the layer counts.
api_only_settings:
  - {id: runtime_shape_overrides, values: [off, on], cite: "G::set_override_shape_enabled; G::execute, the overloads that take override shapes and strides or an override map"}
  - {id: workspace_memory, values: [none, enough], cite: "G::get_workspace_size; G::execute"}

# Debatable count for this layer: 8 of the 18 rules
# (F-ALIBI-NO-SLOPES, F-SCALE-NO-DEFAULT-SOURCE, F-ONE-DIAGONAL, F-RAGGED-OFFSETS-ARE-LENGTHS,
# F-PAGE-TABLE-WIDTH-FOLLOWS-MAXLEN, F-SCALE-TENSOR-BY-VALUE, F-SINK-FLOAT-ONLY,
# F-BLOCK-MASK-TILE-128), plus 2 inferred mappings that are not rules (matmul_input_precision
# native = NOT_SET; window whole_span = −1).
debatable_count: {rules: 8, mappings: 2}
