# Integration test configuration for HIPBLASLT_ENGINE
# Filters use GTest-style globs: * matches any sequence of characters
# Later entries take precedence over earlier ones when multiple filters match

[meta]
version = 1

# -- Tolerance Overrides --
# Override default tolerances for specific tests or groups of tests.
# Each entry requires:
#   filters: array of glob patterns matched against the full GTest name
#   atol: absolute tolerance
#   rtol: relative tolerance

# MatmulBiasActiv Bf16 (bias-add then SWISH_FWD) is flaky against the default
# bf16 tolerance (atol=0.01, rtol=0.01): a local 40-run sweep of the whole
# suite showed ~20% of runs mismatching by 1-2 bf16 ULP on a single output
# element, and the failing parameterization/index/tensor-position varied
# from run to run (e.g. Correctness/7, /19, /23, /31 all observed failing
# across different sweeps; never more than one element per run). Observed
# worst case: ref=4.5, GPU=4.5625, absolute diff 0.0625 vs default
# threshold 0.055. This is nondeterministic GPU reduction/epilogue rounding
# landing on the bf16 boundary just past bias-add before the nonlinear
# SWISH slope amplifies it, not a fixed per-shape bug — a single-index
# override would leave other indices intermittently red. Not a regression
# from this port: same synthesis range and default tolerance as pre-port.
# atol/rtol bumped to 0.02 covers the worst observed diff (0.0625 at
# ref=4.5, threshold becomes 0.11) with ~75% margin, and covers the
# smaller 0.03125-at-ref=2.0625 case with ~95% margin.
[[tolerance_overrides]]
filters = ["*_MatmulPointwise_Variant3.*bfp16*swish*"]
atol = 0.02
rtol = 0.02

# -- Test Skips --
# Skip tests on specific architectures (or globally if 'archs' is omitted).
# Each entry requires:
#   archs:   optional array of substrings matched against the device's raw
#            gcnArchName (e.g. "gfx942" matches "gfx942:sramecc+:xnack-").
#            Omit or leave empty to skip on every arch.
#   filters: array of GTest globs matched against the full GTest name
#   reason:  human-readable string surfaced in the GTEST_SKIP message
# First matching entry wins.

# dnn-benchmarking: the batched fp16 gemm b96 x 8640^3 has 7.2e9 elements per
# operand (> 2^32). Device input fill fails to launch (hipModuleLaunchKernel:
# invalid argument), and with HIPDNN_TEST_HOST_INPUT_FILL=1 it ran past 15 min
# on gfx90a. Every other hipblaslt workload verifies on the GPU reference.
[[test_skips]]
filters = ["dnn_benchmarking_hipblaslt_gemm.fp16_b96_m8640_n8640_k8640"]
reason  = "7.2e9 elements per operand: device input fill cannot launch"

# dnn-benchmarking fp32 gemm workloads. hipBLASLt and the GPU reference accumulate
# K terms in different orders, so large-K fp32 results differ by more than the
# default atol=rtol=1e-5 (135 of 141 fail at the default). Observed max abs diff
# grows with K: 7.1e-5 at K=6656 (fp32_m96_n6656_k6656) and 1.3e-3 at K=24576
# (fp32_m32_n8192_k24576). atol=2e-3 leaves ~1.5x over the worst.
[[tolerance_overrides]]
filters = ["dnn_benchmarking_hipblaslt_gemm.fp32_*"]
atol = 2e-3
rtol = 1e-4
