# bf16_m10240_n5120_k5120 = 95 s). The GPU reference does not cover matmul, so
# every gemm is verified on the CPU. The largest shape alone would take hours.
[[test_skips]]
filters = [
    "dnn_benchmarking_hipblaslt_gemm.bf16_m10240_n5120_k5120",
    "dnn_benchmarking_hipblaslt_gemm.bf16_m14336_n16384_k6144",
