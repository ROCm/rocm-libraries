#
# hipblaslt-provider graph-capture lane categories.
#
# HIPBLASLT_ENGINE reports SUPPORTS_GRAPH_CAPTURE. Its graph-capture lane is pinned to it
# via --test-engine and passes --graph-capture: every bundle test the engine verifies is
# captured into a HIP graph, replayed, and checked again with the same oracle.
#
# The patterns name a few quick matmul bundle suites. Every tier runs the same short
# list, so the lane is part of each tier's run. Keep the patterns in step with the
# graph-capture lane's GTEST_FILTER in CMakeLists.txt, which the legacy-label build
# passes instead of this file.

_graph_capture_patterns: &graph_capture_patterns
  - "quick_Matmul_Default.*"
  - "quick_MatmulPointwise_Default.*"

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Graph-capture replay of a few quick matmul bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Graph-capture replay of a few quick matmul bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Graph-capture replay of a few quick matmul bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Graph-capture replay of a few quick matmul bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback quick tier: graph-capture replay of a few quick matmul bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# Each tier runs the same list, so each gets the quick-tier kill limit the other lanes use.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 600
    comprehensive: 600
    full: 600
    ffm-quick: 600
