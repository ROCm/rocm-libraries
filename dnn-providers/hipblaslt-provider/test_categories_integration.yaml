#
# hipblaslt-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hipblaslt provider plugin. These patterns match hipdnn_integration_tests
# GTest names, not hipblaslt_plugin_tests/hipblaslt_plugin_integration_tests
# names.
#
# hipblaslt only implements matmul, but test_patterns below are not scoped to
# it: --test-engine HIPBLASLT_ENGINE pins the graph-support check in
# IntegrationGraphVerificationHarness::checkEngineSupportOrSkip(), which
# already GTEST_SKIPs (or, under --fail-on-unsupported, fails) any graph
# HIPBLASLT_ENGINE doesn't support. Filtering by test name here would just
# duplicate that check while hiding it from `ctest -V`; letting every op run
# and rely on the generic skip keeps this YAML identical in shape to
# miopen-provider's, since both wrap the same hipdnn_integration_tests binary.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      # "quick_*" matches the bundle suites (integration-test-bundles/quick/...),
      # which are the CI driver. "Smoke/*" matches the C++ parameterised suites:
      # most are graph tests that no longer build by default (see
      # BUILD_CPP_GRAPH_TESTS in
      # dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt),
      # but the always-built non-graph ones register under it too, and a
      # -DBUILD_CPP_GRAPH_TESTS=ON build gets the rest back.
      - "quick_*"
      - "Smoke/*"
      # "Quick/*" and "Standard/*" match the C++ suites that carry an explicit
      # tier prefix (layernorm uses Quick/Standard/Comprehensive/Full).
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage: quick + standard + comprehensive-tier bundles"
    # Tiers cascade: comprehensive runs everything quick and standard run, plus
    # the comprehensive-tier bundles. It deliberately does NOT run the full-tier
    # bundles (full_*): "full" holds only what does not belong in a lower tier
    # (exhaustive/stress cases, or cases redundant with lower-tier coverage of
    # the same option axis) and has no runtime budget; "full" below runs it.
    #
    # Two namespaces are in play and both are needed. Lowercase "quick_*" /
    # "standard_*" / "comprehensive_*" are bundle suites, named after their
    # on-disk tier under integration-test-bundles/. Capitalised "Smoke/" /
    # "Quick/" / "Standard/" / "Comprehensive/" are C++ gtest prefixes; "Full/*"
    # is not listed because the C++ Full tier is the weekly-only set that
    # "full" below still runs.
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "comprehensive_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
      - "Comprehensive/*"
      # The always-built C++ tests that carry no tier prefix
      # (IntegrationIsSupportedExtPerformance, IntegrationCpuSdpaFwdBwdChained).
      - "Integration*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: currently mirrors the quick tier's coverage, with a 2 hour timeout"
    test_patterns:
      - "Smoke/*"
      # Mirrors the quick tier: suites that carry an explicit tier prefix put
      # their cheapest cases under "Quick/", so without this the ops that moved
      # off "Smoke/" (layernorm) would drop out of fast feedback entirely.
      - "Quick/*"
      - "TestCpu*GoldenReference*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, set to 2x the tier's runtime budget
# (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget) so a budget overrun is a failure to
# investigate while ordinary run-to-run variance does not trip the timeout.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 3600
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
