#
# rocKE CTest Categories (RFC0010) for pre-registered (non-GTest) CTest tests.
#
# rocke/platform/tests/CMakeLists.txt (C++ smoke binaries) and
# rocke/platform/CMakeLists.txt (Python import/golden/pytest checks) register
# these tests directly via add_test(), not through a GTest binary categorized
# by a shared YAML (rocKE's C++ client API and its GTest binaries were
# removed entirely in AICK-1737 (#9800); no rocKE GTest suite remains).
# Without an entry here they carry no quick/standard/comprehensive/full
# label: the install-tree copy only has a hardcoded literal "quick" label
# baked in by rocke/platform/CMakeLists.txt (nothing gives it
# standard/comprehensive/full), and the build-tree copy
# (rocke/platform/tests/CMakeLists.txt) has no tier label at all. Either way
# they silently drop out of `ctest -L <tier>` selection, which is how
# TheRock CI's per-tier test_hipkernelprovider.py invocation runs these
# suites.
#
# These tests carry no Full*/Standard*/
# Comprehensive* variant, so every tier runs the same coverage -- matching
# HIP_MLOPS_ENGINE_test_categories.yaml's convention for suites without
# tiered coverage yet.
#
# The pinned GPU reference entries are regex patterns, unlike the other
# entries here: rocke/platform/CMakeLists.txt registers
# rocke_<operation>_reference_unit_pytest for each reference operation and
# rocke_<operation>_gpu_<arch>_pytest for each published architecture, so a
# new operation or architecture is labeled without an edit here. The
# patterns match by name shape alone, so any other test registered as
# rocke_<name>_gpu_gfx<target>_pytest or rocke_<name>_reference_unit_pytest
# joins these categories too. <name> may use lowercase letters, digits, and
# underscores, and <target> lowercase letters and digits. The parser takes
# the regex path on seeing a metacharacter and anchors the pattern at both
# ends; the build tree evaluates it with CMake's if(MATCHES), so use only
# syntax CMake and Python share (no \d or {n}).
# rocke_reference_common_pytest, shared by every operation, stays exact.
# rocke/platform/tests/test_gpu_references.py checks that each registered
# pinned reference name still gets the labels of
# rocke_reference_common_pytest.
test_categories:
  quick:
    description: "rocKE pre-registered smoke/golden/unit checks (C++ + Python)"
    test_patterns:
      - "rocke_optimization_barrier"
      - "rocke_arch_target_identity"
      - "rocke_ir_serialize_roundtrip"
      - "rocke_mma_frag_ssot"
      - "rocke_streamk_iter_partition"
      - "rocke_wgrad_streamk_host"
      - "rocke_wmma_fmha_decode_host"
      - "rocke_future_intrinsic_lowering"
      - "rocke_ir_types"
      - "rocke_opcode_values"
      - "rocke_unsigned_int_ops"
      - "rocke_qk_scale_spec_validate"
      - "rocke_fp8_scale_conversion_gate"
      - "rocke_mx_scale_decode"
      - "rocke_buffer_rsrc_hip"
      - "rocke_tiled_attention_2d_reentrancy"
      - "rocke_unified_attention_scalar_lower_to_llvm"
      - "rocke_python_import_smoke"
      - "rocke_golden_static"
      - "rocke_library_conv_pytest"
      - "rocke_library_attention_cpu_pytest"
      - "rocke_library_attention_pytest"
      - "rocke_library_gdn_pytest"
      - "rocke_library_attention_gpu_pytest"
      - "rocke_library_attention_bias_gpu_pytest"
      - "rocke_library_mla_pytest"
      - "rocke_pytest"
      - "rocke_library_gpu_pytest"
      - "rocke_reference_common_pytest"
      - "rocke_[a-z0-9_]+_reference_unit_pytest"
      - "rocke_[a-z0-9_]+_gpu_gfx[0-9a-z]+_pytest"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) rocKE smoke/golden/unit checks"
    test_patterns:
      - "rocke_optimization_barrier"
      - "rocke_arch_target_identity"
      - "rocke_ir_serialize_roundtrip"
      - "rocke_mma_frag_ssot"
      - "rocke_streamk_iter_partition"
      - "rocke_wgrad_streamk_host"
      - "rocke_wmma_fmha_decode_host"
      - "rocke_future_intrinsic_lowering"
      - "rocke_ir_types"
      - "rocke_opcode_values"
      - "rocke_unsigned_int_ops"
      - "rocke_qk_scale_spec_validate"
      - "rocke_fp8_scale_conversion_gate"
      - "rocke_mx_scale_decode"
      - "rocke_buffer_rsrc_hip"
      - "rocke_tiled_attention_2d_reentrancy"
      - "rocke_unified_attention_scalar_lower_to_llvm"
      - "rocke_python_import_smoke"
      - "rocke_golden_static"
      - "rocke_library_conv_pytest"
      - "rocke_library_attention_cpu_pytest"
      - "rocke_library_attention_pytest"
      - "rocke_library_gdn_pytest"
      - "rocke_library_attention_gpu_pytest"
      - "rocke_library_attention_bias_gpu_pytest"
      - "rocke_library_mla_pytest"
      - "rocke_pytest"
      - "rocke_library_gpu_pytest"
      - "rocke_reference_common_pytest"
      - "rocke_[a-z0-9_]+_reference_unit_pytest"
      - "rocke_[a-z0-9_]+_gpu_gfx[0-9a-z]+_pytest"
    labels:
      - "ffm-full"
