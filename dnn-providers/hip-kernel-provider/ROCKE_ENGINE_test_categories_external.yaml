#
# rocKE CTest Categories (RFC0010) for pre-registered (non-GTest) CTest tests.
#
# rocke/platform/tests/cmake/*.cmake (C++ smoke binaries) and
# rocke/platform/CMakeLists.txt (Python import/golden/pytest checks, plus the
# library suites it includes from rocke/library/tests/ctest_lists.cmake) register
# these tests directly via add_test(), not through a GTest binary categorized
# by a shared YAML (rocKE's C++ client API and its GTest binaries were
# removed entirely in AICK-1737 (#9800); no rocKE GTest suite remains).
# Without an entry here they carry no quick/standard/comprehensive/full
# label: the install-tree copy has at most a hardcoded tier label baked
# in by rocke/platform/CMakeLists.txt (nothing gives it
# standard/comprehensive/full), and the build-tree copies registered by
# rocke/platform/tests/cmake/*.cmake have no tier label at all. Either way
# they silently drop out of `ctest -L <tier>` selection, which is how
# TheRock CI's per-tier test_hipkernelprovider.py invocation runs these
# suites.
#
# Most tests carry no Full*/Standard*/Comprehensive* variant, so every tier
# runs the same coverage. The arch-domain reproducibility gate is intentionally
# standard-tier: it probes the external LLVM toolchain across the full
# intrinsic/architecture matrix and does not belong in quick or FFM. The
# compiler-option reproducibility gate joins it: it re-measures which -mllvm
# options the loaded compiler accepts. Both are registered in build-tree and
# installed-artifact CTest, so developers and provider CI execute the same
# logical gates against their respective package data. The pytest-scaling
# runner and counted-sync entries start at comprehensive so nightly/full runs
# own them without adding work to quick/standard pre-merge and post-merge runs.
#
# The pinned GPU reference entries are regex patterns, unlike most
# entries here: rocke/platform/CMakeLists.txt registers
# rocke_<operation>_reference_unit_pytest for each reference operation and
# rocke_<operation>_gpu_<arch>_pytest for each published architecture, so a
# new operation or architecture is labeled without an edit here. The
# patterns match by name shape alone, so any other test registered as
# rocke_<name>_gpu_gfx<target>_pytest or rocke_<name>_reference_unit_pytest
# joins these categories too. <name> may use lowercase letters, digits, and
# underscores, and <target> lowercase letters and digits. The parser takes
# the regex path on seeing a metacharacter and anchors the pattern at both
# ends; the build tree evaluates it with CMake's if(MATCHES), so use only
# syntax CMake and Python share (no \d or {n}).
# rocke_reference_common_pytest, shared by every operation, stays exact.
# rocke/platform/tests/test_gpu_references.py checks that each registered
# pinned reference name still gets the labels of
# rocke_reference_common_pytest.
#
# The platform pytest suite is a pattern too: rocke/platform/CMakeLists.txt
# registers one rocke_pytest_<group> entry per group of test directories, so
# a new group is labeled without an edit here. The rocke_pytest_ prefix is
# reserved for those entries.
# rocke/platform/tests/test_engine_linkage.py checks that every registered
# part gets the same labels, including the quick, standard and ffm-quick
# tiers.
#
# The comprehensive tier holds tests run only by scheduled CI: its entries
# get only the comprehensive and full labels, so a `ctest -L '^quick$'` or
# `-L '^standard$'` run (pull-request and push CI) skips them and the
# scheduled (nightly) run, which selects `-L '^comprehensive$'`, runs them.
