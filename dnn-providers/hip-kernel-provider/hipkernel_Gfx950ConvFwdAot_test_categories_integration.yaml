#
# hip-kernel-provider hipkernel:Gfx950ConvFwdAot external integration test categories.
#
# Pinned to hipkernel:Gfx950ConvFwdAot via --test-engine. Selects
# integration-test-bundles/standard/Gfx950ConvFwd/{Smoke,Spatial,Depthwise}/ by suite,
# not by text in the case id: import_graph.py names cases in its own format, so a name
# pattern would miss the cases it adds. Engine pinning and support claims do the rest: a
# claimed case the engine declines fails its lane, an unclaimed one it declines skips,
# and an unclaimed one it accepts runs and is reported as unclaimed support.
#
# Only the standard-tier bundle exists today, so quick reuses its Smoke sub-bundle
# (the lightest of the three) rather than a dedicated quick-tier directory. Tiers
# cascade: standard runs quick + standard, comprehensive runs quick + standard +
# comprehensive; only "full" runs the full-tier bundles.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Quick gfx950 forward AOT smoke coverage"
    test_patterns:
      - "standard_Gfx950ConvFwd_Smoke.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard gfx950 forward AOT bundle coverage"
    test_patterns:
      - "standard_Gfx950ConvFwd_Smoke.*"
      - "standard_Gfx950ConvFwd_Spatial.*"
      - "standard_Gfx950ConvFwd_Depthwise.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive gfx950 forward AOT coverage: quick + standard + comprehensive-tier bundles"
    test_patterns:
      - "standard_Gfx950ConvFwd_Smoke.*"
      - "standard_Gfx950ConvFwd_Spatial.*"
      - "standard_Gfx950ConvFwd_Depthwise.*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Full gfx950 forward AOT coverage"
    test_patterns:
      - "*_Gfx950ConvFwd_Smoke.*"
      - "*_Gfx950ConvFwd_Spatial.*"
      - "*_Gfx950ConvFwd_Depthwise.*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 3600
    comprehensive: 7200
    full: 14400
