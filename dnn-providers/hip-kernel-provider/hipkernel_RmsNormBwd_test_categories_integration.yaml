#
# hip-kernel-provider external integration test categories: the RMSnorm backward bundles.
#
# Pinned to hipkernel:RmsNormBwd via --test-engine, the engine that serves them. Selects
# the shared integration-test-bundles/<tier>/ suites of the graphs it serves by suite name:
#   RMSNormBackward, PointwiseRMSNormBackward.
# Keep the folders in step with the engine's row in HKP_MLOPS_INGESTOR_ENGINES
# (src/CMakeLists.txt), whose filter the legacy-label build passes instead of this file;
# descriptor-packaging/tests/test_mlops_bundle_filters.py fails on a mismatch.
# Engine pinning and support claims do the rest: a claimed case the engine declines fails
# its lane, an unclaimed one it declines skips.
#
# The tiers mirror the retired HIP_MLOPS_ENGINE lane's, narrowed to these folders: they
# cascade, and only "full" runs the full-tier bundles.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Quick-tier RMSnorm backward bundles"
    test_patterns:
      - "quick_RMSNormBackward_*.*"
      - "quick_PointwiseRMSNormBackward_*.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard RMSnorm backward coverage: quick + standard-tier bundles"
    test_patterns:
      - "quick_RMSNormBackward_*.*"
      - "quick_PointwiseRMSNormBackward_*.*"
      - "standard_RMSNormBackward_*.*"
      - "standard_PointwiseRMSNormBackward_*.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive RMSnorm backward coverage: quick + standard + comprehensive-tier bundles"
    test_patterns:
      - "quick_RMSNormBackward_*.*"
      - "quick_PointwiseRMSNormBackward_*.*"
      - "standard_RMSNormBackward_*.*"
      - "standard_PointwiseRMSNormBackward_*.*"
      - "comprehensive_RMSNormBackward_*.*"
      - "comprehensive_PointwiseRMSNormBackward_*.*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "All RMSnorm backward bundles"
    test_patterns:
      - "*_RMSNormBackward_*.*"
      - "*_PointwiseRMSNormBackward_*.*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier RMSnorm backward bundles"
    test_patterns:
      - "quick_RMSNormBackward_*.*"
      - "quick_PointwiseRMSNormBackward_*.*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, as in the retired HIP_MLOPS_ENGINE lane: 2x the tier's
# runtime budget (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget).
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 3600
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
