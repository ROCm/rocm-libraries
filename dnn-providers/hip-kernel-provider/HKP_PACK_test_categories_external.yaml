#
# CTest categories for the entries pre-registered via add_test() rather than through a
# GTest binary: the hkp pytest entries (hkp_register_tests) and the census entries
# (hkp_register_census_tests) from descriptor-packaging/cmake/HkpPackaging.cmake, and the
# Triton generator's unit tests from triton/CMakeLists.txt, which are host-only and sit
# in quick.
#
# The two pytest entries run DISJOINT sets -- quick is `-m quick` (the no-compile
# subset), standard is `-m "not quick"`. The tier cascade labels a quick test
# quick;standard;comprehensive;full and a standard test standard;comprehensive;full, so
# each tier runs every test once and comprehensive/full run the union.
#
# The census pattern is a REGEX, unlike every other entry here: an entry is named
# hip-kernel-provider-hkp-census-<arch>-<suite>, whose values are configure-time ones no
# static YAML can spell. The parser takes the regex path on seeing a metacharacter and
# anchors the pattern at both ends. That one pattern deliberately covers the entry AND
# its three -control-* siblings, so a control cannot land in a different tier from the
# entry it watches. The census sits in quick, and through the cascade in every tier,
# because a census run is host-only and filtered to one suite.
#
# The quick block's three descriptive labels are load-bearing for the pytest and Triton
# generator entries, whose add_test() sets none. _hkp_add_census_test() sets the same
# three on each census entry directly, so they survive a tree where YAML categorization
# is off and dnn-providers/cmake/Tests.cmake falls back to `ctest -L unit_test`.
test_categories:
  quick:
    description: "hkp descriptor-packaging pytest (no-compile subset), the descriptor census and the Triton generator unit tests"
    test_patterns:
      - "hip-kernel-provider-hkp-pack-quick"
      - "hip-kernel-provider-hkp-census-.*"
      - "hip-kernel-provider-triton-generator"
    labels:
      - "unit_test"
      - "hip-kernel-provider"
      - "host"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) descriptor-packaging no-compile checks and census"
    test_patterns:
      - "hip-kernel-provider-hkp-pack-quick"
      - "hip-kernel-provider-hkp-census-.*"
    labels:
      - "ffm-full"

  standard:
    description: "hkp descriptor-packaging pytest: full suite (real compile)"
    test_patterns:
      - "hip-kernel-provider-hkp-pack"
    labels:
      - "unit_test"
      - "hip-kernel-provider"
      - "host"
