#
# CTest categories for the two families that descriptor-packaging/cmake/
# HkpPackaging.cmake pre-registers via add_test() rather than through a GTest
# binary: the hkp pytest entries (hkp_register_tests) and the descriptor census
# entries (hkp_register_census_tests).
#
# The two pytest entries run DISJOINT pytest sets: the quick entry runs `-m quick`
# (the no-compile subset) and the standard entry runs `-m "not quick"` (the rest).
# The tier cascade labels a quick test quick;standard;comprehensive;full and a
# standard test standard;comprehensive;full, so every tier runs each test once
# with no overlap, and comprehensive/full run the union via the cascade (there
# are no comprehensive- or full-only tests yet).
#
# The census pattern is a REGEX, unlike every other entry here: an entry is named
# hip-kernel-provider-hkp-census-<arch>-<suite>, and both the arch and the suite
# are configure-time values no static YAML can spell. The parser takes the regex
# path on seeing a metacharacter and anchors the pattern at both ends.
#
# That one pattern deliberately covers the entry AND its three -control-*
# siblings: a control selected into a different tier from the entry it watches
# would run where nothing proves the gate can still fail.
#
# The census sits in quick -- and hence, through the cascade, in every tier --
# because a census run is host-only, filtered to a single suite, and carries no
# Full*/Standard*/Comprehensive* variant, so every tier runs the same coverage.
# Listing it under standard as well would add none.
#
# The quick block's three descriptive labels are load-bearing for the pytest
# entries, whose add_test() sets none. _hkp_add_census_test() sets the same three
# on each census entry directly, so they survive a tree where YAML categorization
# is off and dnn-providers/cmake/Tests.cmake falls back to `ctest -L unit_test`.
# The parser deduplicates, so the overlap costs nothing.
test_categories:
  quick:
    description: "hkp descriptor-packaging pytest (no-compile subset) and the descriptor census"
    test_patterns:
      - "hip-kernel-provider-hkp-pack-quick"
      - "hip-kernel-provider-hkp-census-.*"
    labels:
      - "unit_test"
      - "hip-kernel-provider"
      - "host"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) descriptor-packaging no-compile checks and census"
    test_patterns:
      - "hip-kernel-provider-hkp-pack-quick"
      - "hip-kernel-provider-hkp-census-.*"
    labels:
      - "ffm-full"

  standard:
    description: "hkp descriptor-packaging pytest: full suite (real compile)"
    test_patterns:
      - "hip-kernel-provider-hkp-pack"
    labels:
      - "unit_test"
      - "hip-kernel-provider"
      - "host"
