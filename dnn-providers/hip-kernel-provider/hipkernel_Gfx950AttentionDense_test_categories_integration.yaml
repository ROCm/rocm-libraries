#
# hip-kernel-provider hipkernel:Gfx950AttentionDense external integration test categories.
#
# Pinned to hipkernel:Gfx950AttentionDense via --test-engine. Selects the shared sweeps
# integration-test-bundles/{quick,standard}/SdpaFwd/Default/ by suite, not by text in
# the case id: import_graph.py names cases in its own format, so a name pattern would
# miss the cases it adds. Engine pinning and support claims do the rest: a claimed case
# the engine declines fails its lane, an unclaimed one it declines skips, and an
# unclaimed one it accepts runs and is reported as unclaimed support.

_common_excludes: &common_excludes
  - "*DISABLED*"
  - "*SdpaBackward*"

test_categories:
  quick:
    description: "Quick gfx950 dense attention BSHD bundle coverage"
    test_patterns:
      - "quick_SdpaFwd_Default.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard gfx950 dense attention BSHD bundle coverage"
    test_patterns:
      - "quick_SdpaFwd_Default.*"
      - "standard_SdpaFwd_Default.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive gfx950 dense attention coverage"
    test_patterns:
      - "*_SdpaFwd_Default.*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Full gfx950 dense attention coverage"
    test_patterns:
      - "*_SdpaFwd_Default.*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback quick tier: BSHD quick bundles"
    test_patterns:
      - "quick_SdpaFwd_Default.*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 1800
    comprehensive: 7200
    full: 14400
    ffm-quick: 1800
