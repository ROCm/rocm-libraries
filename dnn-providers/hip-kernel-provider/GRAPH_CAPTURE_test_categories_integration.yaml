#
# hip-kernel-provider graph-capture lane categories.
#
# Shared by every hip-kernel-provider engine that reports SUPPORTS_GRAPH_CAPTURE and has
# an external integration lane. Each graph-capture lane is pinned to one engine via
# --test-engine and passes --graph-capture: every bundle test the engine verifies is
# captured into a HIP graph, replayed, and checked again with the same oracle.
#
# The patterns name a few quick bundle suites that each claiming engine serves: the
# HIP_MLOPS_ENGINE batchnorm, layernorm and RMSNorm suites, the FlyDSL RMSNorm forward
# and backward suites, and the SDPA forward and backward suites of the attention
# engines. A pinned engine declines the suites it does not serve, and an unclaimed
# decline skips, so one list serves every lane.
#
# The standard, comprehensive and full tiers run the same short list. The lane stays out of
# quick and ffm-quick: pull requests run standard, nightly runs comprehensive. Keep the
# patterns in step with HKP_GRAPH_CAPTURE_GTEST_FILTER in src/CMakeLists.txt, which the
# legacy-label build passes instead of this file.

_graph_capture_patterns: &graph_capture_patterns
  - "quick_Batchnorm_Default.*"
  - "quick_BatchnormBackward_Default.*"
  - "quick_Layernorm_Default.*"
  - "quick_RMSNorm_Default.*"
  - "quick_RMSNorm_Variant2.*"
  - "quick_RMSNorm_Variant3.*"
  - "quick_RMSNormBackward_Variant2.*"
  - "quick_SdpaFwd_*.*"
  - "quick_SdpaBackward_*.*"

# The two 4096-token fp16 causal bhsd cases cost about two minutes each in the GPU
# reference on an RDNA iGPU. hipkernel_flydsl_sdpa_test_categories_integration.yaml
# keeps them out of its fast tiers for the same reason.
_graph_capture_excludes: &graph_capture_excludes
  - "*DISABLED*"
  - "quick_SdpaBackward_*_fwd_pair*"
  - "*_SdpaFwd_bhsd_fp16_hd128_causal_gqa4_Small.*"
  - "*_SdpaFwd_bhsd_fp16_hd128_causal_mha_Small.*"

test_categories:
  standard:
    description: "Graph-capture replay of a few quick bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *graph_capture_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Graph-capture replay of a few quick bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *graph_capture_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Graph-capture replay of a few quick bundle suites"
    test_patterns: *graph_capture_patterns
    exclude: *graph_capture_excludes
    labels:
      - "full"
      - "all"

# The tiers run the same list, so each gets the 600 s kill limit the other lanes' quick
# tiers use.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    standard: 600
    comprehensive: 600
    full: 600
