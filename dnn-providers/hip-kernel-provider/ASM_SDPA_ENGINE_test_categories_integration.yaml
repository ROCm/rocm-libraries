#
# hip-kernel-provider ASM SDPA external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to ASM_SDPA_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names (the engine-agnostic SDPA
# forward/backward suites under dnn-providers/integration-tests), not
# hip_kernel_provider_tests or hip_kernel_provider_integration_tests names.
#
# "Smoke/*Sdpa*" covers both the common-suite SDPA forward correctness cases
# (IntegrationGpuSdpaFwdBfp16) and the ported backward cases
# (IntegrationGpuSdpaBwdBfp16 / IntegrationGpuSdpaBwdFp16). The harness's
# generic engine-support check (checkEngineSupportOrSkip / verifyGraph) skips
# any case ASM_SDPA_ENGINE doesn't service, so pinning the whole SDPA surface
# here is safe.
_common_excludes: &common_excludes
  - "*DISABLED*"

# TEMPORARY TIER REMAPPING (revert once CI has proper test-label support).
# Mirrors HIP_MLOPS_ENGINE_test_categories_integration.yaml's rationale: CI
# cannot yet select tests by label, so only the standard tier is populated
# until label-based selection lands.
test_categories:
  # quick: commented out -- see HIP_MLOPS_ENGINE_test_categories_integration.yaml
  # for rationale. Uncomment and give it a distinct pattern once label-based
  # selection lands.
  #
  # quick:
  #   description: "Smoke SDPA cases"
  #   test_patterns:
  #     - "Smoke/*Sdpa*"
  #   exclude: *common_excludes
  #   labels:
  #     - "quick"
  #     - "pre-commit"
  #     - "smoke"

  standard:
    description: "ASM SDPA external integration coverage (temporary: standard tier only until CI label support lands)"
    test_patterns:
      - "Smoke/*Sdpa*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  # Commented out (not just left empty): the shared category validator rejects
  # a category whose test_patterns is empty, so these no-op tiers are
  # commented out entirely until CI label support lands.
  #
  # comprehensive:
  #   description: "Disabled for now (temporary: runs nothing until CI label support lands)"
  #   test_patterns: []
  #   exclude: *common_excludes
  #   labels:
  #     - "comprehensive"
  #     - "nightly"
  #     - "extended"
  #
  # full:
  #   description: "Disabled for now (temporary: runs nothing until CI label support lands)"
  #   test_patterns: []
  #   exclude: *common_excludes
  #   labels:
  #     - "full"
  #     - "all"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    standard: 2700
    # comprehensive: 25200
    # full: 28800
