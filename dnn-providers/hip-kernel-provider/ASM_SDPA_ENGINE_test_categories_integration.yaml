#
# hip-kernel-provider ASM SDPA external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to ASM_SDPA_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names (the engine-agnostic SDPA
# forward/backward suites under dnn-providers/integration-tests), not
# hip_kernel_provider_tests or hip_kernel_provider_integration_tests names.
#
# Tier pattern shape mirrors miopen-provider/test_categories_integration.yaml,
# scoped to the SDPA surface this engine actually implements:
#   - "quick_*Sdpa*"/"standard_*Sdpa*" match the bundle suites
#     (integration-test-bundles/{quick,standard}/SdpaFwd*), whose names mirror
#     the on-disk tier directory; bundles are the CI driver.
#   - "Smoke/*Sdpa*" (slash) matches the C++ parameterised suites
#     (Smoke/IntegrationGpuSdpaFwdBfp16 and the ported backward cases
#     Smoke/IntegrationGpuSdpaBwd{Bfp16,Fp16}). These no longer build by
#     default -- see BUILD_CPP_GRAPH_TESTS in
#     dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt --
#     but keep the pattern regardless so a graph-tests-enabled build still
#     picks them up.
#   - "*Sdpa*" (comprehensive/full) covers the whole SDPA surface in either
#     authoring style, including any future full-tier SDPA bundle.
# The harness's generic engine-support check (checkEngineSupportOrSkip /
# verifyGraph) skips any case ASM_SDPA_ENGINE doesn't service, so pinning the
# whole SDPA surface at the comprehensive/full tier is safe.
_common_excludes: &common_excludes
  - "*DISABLED*"
  # SdpaBackward bundles fail on two independent issues:
  #   1. ASM kernel .co files missing from TheRock artifact (hipError 301)
  #   2. CPU reference rejects LSE tensor shape ("lse must be rank-4")
  # Tracked upstream — re-enable once hip-kernel-provider ships the kernels
  # and the CPU ref handles the new LSE layout.
  - "*SdpaBackward*"

test_categories:
  quick:
    description: "Fast ASM SDPA external integration coverage: quick-tier bundle sweeps plus Smoke SDPA cases"
    test_patterns:
      - "quick_*Sdpa*"
      - "Smoke/*Sdpa*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard ASM SDPA external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*Sdpa*"
      - "standard_*Sdpa*"
      - "Smoke/*Sdpa*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive ASM SDPA external integration coverage"
    test_patterns:
      - "*Sdpa*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete ASM SDPA external integration coverage"
    test_patterns:
      - "*Sdpa*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier bundle sweeps plus Smoke SDPA cases"
    test_patterns:
      - "quick_*Sdpa*"
      - "Smoke/*Sdpa*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 2700
    comprehensive: 25200
    full: 28800
    ffm-quick: 7200  # 2 hours
