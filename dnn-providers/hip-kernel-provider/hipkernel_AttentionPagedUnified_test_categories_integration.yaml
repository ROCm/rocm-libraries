#
# hip-kernel-provider hipkernel:AttentionPagedUnified external integration test categories.
#
# One lane per architecture the engine ships for (gfx942, gfx950), each pinned to
# hipkernel:AttentionPagedUnified via --test-engine. Selects the shared
# integration-test-bundles/{quick,standard,comprehensive,full}/SdpaFwd/ suites by suite
# name. Engine pinning and support claims do the rest: a claimed case the engine declines
# fails its lane, an unclaimed one it declines skips (every non-paged SdpaFwd bundle), and
# an unclaimed one it accepts runs and is reported as unclaimed support.
# Tiers cascade: standard runs quick + standard, comprehensive runs quick + standard +
# comprehensive; only "full" runs the full-tier bundles.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Quick paged attention SdpaFwd bundle coverage"
    test_patterns:
      - "quick_SdpaFwd_*.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard paged attention SdpaFwd bundle coverage"
    test_patterns:
      - "quick_SdpaFwd_*.*"
      - "standard_SdpaFwd_*.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive paged attention SdpaFwd coverage: quick + standard + comprehensive-tier bundles"
    test_patterns:
      - "quick_SdpaFwd_*.*"
      - "standard_SdpaFwd_*.*"
      - "comprehensive_SdpaFwd_*.*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Full paged attention SdpaFwd coverage"
    test_patterns:
      - "*_SdpaFwd_*.*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback quick tier: paged attention SdpaFwd quick bundles"
    test_patterns:
      - "quick_SdpaFwd_*.*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, set to 2x the tier's runtime budget
# (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget) so a budget overrun is a failure to
# investigate while ordinary run-to-run variance does not trip the timeout.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 600
    standard: 3600
    comprehensive: 7200
    full: 14400
    ffm-quick: 1800
