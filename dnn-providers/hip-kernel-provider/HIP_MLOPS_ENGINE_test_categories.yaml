# hip-kernel-provider Test Categories Configuration
# Aligned with Test Filter Standardization (RFC0010).
#
# hip-kernel-provider has two GTest binaries (hip_kernel_provider_tests and
# hip_kernel_provider_integration_tests) that share this YAML. CI can invoke the
# generated CTest file without a label filter, so each enabled category becomes
# a separate binary execution. Because the tiers are cumulative (see below),
# invoking multiple tiers in one run re-executes the lower-tier tests; select a
# single tier label to run exactly that tier's coverage.
# See https://github.com/ROCm/rocm-libraries/issues/8852 for background on the
# category execution model.
# Tier behaviour (cumulative — each tier is a superset of the ones below it):
#   - quick: host unit tests only. Excludes Comprehensive* and Full* parameterised
#     expansions, Standard*-prefixed expansions, and every FlyDSL device suite
#     (TestGpuFlydsl*, IntegrationGpuFlydsl*, with or without an instantiation prefix).
#   - standard: quick coverage plus the FlyDSL device tests: the Standard*-prefixed
#     expansions and the unprefixed TestGpuFlydsl* / IntegrationGpuFlydsl* cases, at
#     small shapes that give per-feature signal on every PR. Excludes Comprehensive*
#     and Full* parameterised expansions.
#   - comprehensive: standard + quick coverage, plus Comprehensive* parameterised
#     expansions and the long-running device tests and sweeps.
#   - full: all tests (non-Full + Full* parameterised expansions), excluding
#     only disabled tests.
#
# Standard*, Comprehensive* and Full* are GTest instantiation prefixes (matching
# miopen-provider's convention): the gfx942 dense attention knob suite's per-kernel
# rows are Comprehensive/, FlyDSL's every-object cases Full/, and FlyDSL's
# per-form representative objects and frontend cases Standard/. A FlyDSL device
# suite with an instantiation prefix uses Standard, Comprehensive or Full; the "*/"
# guards below keep a device suite out of quick under any other prefix.
#
# These categories apply to hip_kernel_provider_tests and
# hip_kernel_provider_integration_tests. The external hipdnn_integration_tests
# suite (run against HIP_MLOPS_ENGINE) uses
# HIP_MLOPS_ENGINE_test_categories_integration.yaml because it has different
# GTest naming conventions.
#
# Excluded from quick and ffm-quick: disabled tests, the higher tiers' expansions, and every
# FlyDSL device suite. A gtest full name is "Suite.Case" or "Prefix/Suite.Case/Param", so
# "TestGpuFlydsl*" matches a bare suite and "*/TestGpuFlydsl*" a prefixed one; the same holds
# for IntegrationGpuFlydsl*.
_quick_excludes: &quick_excludes
  - "*DISABLED*"
  - "Comprehensive*"
  - "Full*"
  - "Standard*"
  - "TestGpuFlydsl*"
  - "*/TestGpuFlydsl*"
  - "IntegrationGpuFlydsl*"
  - "*/IntegrationGpuFlydsl*"

test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min) - host unit tests only: excludes FlyDSL device suites and Standard*, Comprehensive* and Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude: *quick_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Pre-checkin validation (cumulative: runs quick coverage plus the FlyDSL device tests and Standard* expansions) - excludes Comprehensive* and Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Comprehensive*"
      - "Full*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive validation (cumulative: runs standard + quick coverage, plus Comprehensive*) - excludes Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete suite (cumulative: runs all tests, non-Full + Full*) - excludes only disabled tests"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier - mirrors the quick tier"
    test_patterns:
      - "*"
    exclude: *quick_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300            # 5 minutes
    standard: 2700        # 45 minutes
    comprehensive: 25200  # 7 hours
    full: 28800           # 8 hours
    ffm-quick: 7200       # 2 hours
