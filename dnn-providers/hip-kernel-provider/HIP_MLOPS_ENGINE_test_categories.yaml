#
# hip-kernel-provider Test Categories Configuration
# Aligned with Test Filter Standardization (RFC0010).
#
# hip-kernel-provider has two GTest binaries (hip_kernel_provider_tests and
# hip_kernel_provider_integration_tests) that share this YAML. CI can invoke the
# generated CTest file without a label filter, so each enabled category becomes
# a separate binary execution. Because the tiers are cumulative (see below),
# invoking multiple tiers in one run re-executes the lower-tier tests; select a
# single tier label to run exactly that tier's coverage.
# See https://github.com/ROCm/rocm-libraries/issues/8852 for background on the
# category execution model.
# Tier behaviour (cumulative — each tier is a superset of the ones below it):
#   - quick: run tests that are neither Comprehensive* nor Full*.
#   - standard: quick coverage (quick tests). No distinct Standard* prefix
#     exists, so standard runs the same tests as quick.
#   - comprehensive: standard + Comprehensive* parameterised expansions
#     (breadth sweeps whose pre-merge case stays in standard; nightly).
#   - full: all tests (the above + Full* parameterised expansions), excluding
#     only disabled tests.
#
# Comprehensive* and Full* are GTest instantiation prefixes
# (INSTANTIATE_TEST_SUITE_P(Comprehensive, ...)), as in integration-tests'
# test_categories.yaml. There is no Standard* prefix here, so quick and
# standard run the same coverage.
#
# These categories apply to hip_kernel_provider_tests and
# hip_kernel_provider_integration_tests. The external hipdnn_integration_tests
# suite (run against HIP_MLOPS_ENGINE) uses
# HIP_MLOPS_ENGINE_test_categories_integration.yaml because it has different
# GTest naming conventions.
test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min) - excludes Comprehensive* and Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Comprehensive*"
      - "Full*"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Pre-checkin validation (cumulative: runs quick coverage) - excludes Comprehensive* and Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Comprehensive*"
      - "Full*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive validation (cumulative: runs standard + quick coverage and Comprehensive* parameterised expansions) - excludes Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete suite (cumulative: runs all tests, Comprehensive* and Full* included) - excludes only disabled tests"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier - currently mirrors the quick tier"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Comprehensive*"
      - "Full*"
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300            # 5 minutes
    standard: 2700        # 45 minutes
    comprehensive: 25200  # 7 hours
    full: 28800           # 8 hours
    ffm-quick: 7200       # 2 hours
