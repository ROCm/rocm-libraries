# Integration test configuration for hipkernel:flydsl_sdpa_bwd_split
# Filters use GTest-style globs: * matches any sequence of characters
# Later entries take precedence over earlier ones when multiple filters match

[meta]
version = 1

# -- Tolerance Overrides --
# Each entry requires:
#   filters: array of glob patterns matched against the full GTest name
#   atol: absolute tolerance
#   rtol: relative tolerance
#
# The common suite's ToleranceResolver maps both SdpaAttributes and
# SdpaBackwardAttributes to tol::sdpa::getToleranceFwd<T>() (1e-2 for fp16 and bf16),
# so SDPA backward gradients (dQ/dK/dV) get their own entries here: the bf16 entry equals
# that default and the fp16 entry tightens it.
# Calibrated against the bundles that derive O and the LSE from the forward, on gfx1100
# (host input fill) and gfx950 (device and host input fill), with both references: every case passes
# at fp16 2.5e-3 and bf16 5e-3 (bf16 dV differs by up to 2 ulp from fp32
# accumulation order); each value below is one grid step above that.
# Filters key on the dtype token: in a sweep's case id ("_fp16_", "_bfp16_" or "_bf16_"),
# or in a single-graph bundle's suite, whose test name is the graph's file name
# (SdpaBackward/bhsd/{fp16,bf16}/...). The leading "_" in "_fp16_" keeps it from also
# matching "bfp16_".
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*", "*_SdpaBackward_*_fp16_*.*"]
atol = 5e-3
rtol = 5e-3

[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*", "*_SdpaBackward_*.*_bf16_*", "*_SdpaBackward_*_bf16_*.*"]
atol = 1e-2
rtol = 1e-2
