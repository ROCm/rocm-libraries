# Integration test configuration for hipkernel:hip_conv_dgrad_fma_3d_rdna
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# The engine serves 3-D backward data (conv_dgrad) on the gfx11 and gfx12 RDNA targets: rank 5,
# packed NCDHW or NDHWC, fp32 / fp16 / bf16, any stride, dilation and padding, groups == 1 or at
# least two dx channels per group. It declines depthwise, 1-D and 2-D problems, and the harness
# skips a declined case. No tolerance overrides: the common ConvolutionBwdAttributes tolerance
# applies.
#
# No [[test_skips]] entry: the engine's pack ships only for RDNA targets, so another device
# declines through the ordinary path. An entry cannot express "skip everywhere except
# RDNA" -- the schema has no negation, and an empty `archs` list means EVERY arch
# (TestSettings.hpp: `entry.archs.empty() || ...`).
