# Integration test configuration for hipkernel:hip_conv_fwd_fma_igemm_rdna
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# The engine serves forward cross-correlation on the gfx11 and gfx12 RDNA targets: 2D and 3D
# (1D as NCHW with H = 1), packed NC(D)HW or N(D)HWC, fp32 / fp16 / bf16, any stride,
# dilation and padding, and groups with at least 16 output channels each. It declines
# depthwise and narrower groups, and the harness skips a declined case. No tolerance
# overrides: the common ConvolutionFwdAttributes tolerance applies.
#
# No [[test_skips]] entry: the engine's pack ships only for RDNA targets, so another device
# declines through the ordinary path. An entry cannot express "skip everywhere except
# RDNA" -- the schema has no negation, and an empty `archs` list means EVERY arch
# (TestSettings.hpp: `entry.archs.empty() || ...`).
