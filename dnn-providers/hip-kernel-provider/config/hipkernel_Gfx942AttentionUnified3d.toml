# Integration test configuration for hipkernel:Gfx942AttentionUnified3d
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# All bundles for this engine are forward-only SDPA decode (seqlen_q 1) on gfx942.
# No tolerance overrides needed: the forward pass uses the common SdpaAttributes
# tolerance (tol::sdpa::getToleranceFwd<T>()).
#
# No [[test_skips]] entry: the engine's packs arch-prune before the matcher, so a
# non-gfx942 device declines through the ordinary path, and every seqlen_q > 1 case of
# the shared sweeps declines in the graph match. An entry cannot express "skip everywhere
# except gfx942" -- the schema has no negation, and an empty `archs` list means EVERY
# arch (TestSettings.hpp: `entry.archs.empty() || ...`), so a skip written that way would
# silence gfx942 too.
