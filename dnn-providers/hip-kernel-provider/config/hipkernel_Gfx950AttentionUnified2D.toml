# Integration test configuration for hipkernel:Gfx950AttentionUnified2D
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# This engine serves causal BSHD SDPA forward graphs on gfx950 through a synthesized
# identity block_tables / seq_lens / query_start_len workspace. The shared SdpaFwd
# sweeps also carry unmasked cases, which it does not serve.
#
# No tolerance overrides needed: the forward pass uses the common SdpaAttributes
# tolerance (tol::sdpa::getToleranceFwd<T>()).
#
# NOTE: This engine declines NO_MASK graphs because the kernel is unconditionally
# causal (bottom-right). Those cases carry no support claim for this engine, so the
# harness records the decline as a skip rather than a failure. An explicit
# [[test_skips]] entry is not needed: the engine returns no plan for them and the
# harness records them as "no engine" declines.
