# Integration test configuration for hipkernel:AttentionPagedUnified, gfx950 entry
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# The engine serves the paged/ragged SdpaFwd bundles on gfx942 and gfx950. No tolerance
# overrides needed: the forward pass uses the common SdpaAttributes tolerance
# (tol::sdpa::getToleranceFwd<T>()).
#
# The engine ships for both architectures, so on a gfx942 device this entry would repeat
# the gfx942 entry's run. Skip there, so a package carrying both shards runs the bundles
# once. Any other device declines through the ordinary path (the packs arch-prune
# before the matcher).
[[test_skips]]
archs = ["gfx942"]
filters = ["*"]
reason = "hipkernel:AttentionPagedUnified: this entry runs on gfx950 only"
