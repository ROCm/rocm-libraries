# Integration test configuration for HIP_MLOPS_ENGINE
# Filters use GTest-style globs: * matches any sequence of characters
# Later entries take precedence over earlier ones when multiple filters match

[meta]
version = 1

# -- Test Skips --
# Skip tests on specific architectures (or globally if 'archs' is omitted).
# Each entry requires:
#   archs:   optional array of substrings matched against the device's raw
#            gcnArchName (e.g. "gfx942" matches "gfx942:sramecc+:xnack-").
#            Omit or leave empty to skip on every arch.
#   filters: array of GTest globs matched against the full GTest name
#   reason:  human-readable string surfaced in the GTEST_SKIP message
# First matching entry wins.
#
# -- Tolerance Overrides --
# Override default tolerances for specific tests or groups of tests.
# Each entry requires:
#   filters: array of glob patterns matched against the full GTest name
#   atol: absolute tolerance
#   rtol: relative tolerance
#
# -- Validator Overrides --
# Change which comparison an output tensor is graded by. allclose is the default
# everywhere and this is the only thing that can change it. Each entry requires:
#   filters:       array of GTest globs matched against the full GTest name
#   tensors:       array of globs matched against the output tensor's label — its
#                  name, or "uid=N" when the graph did not name it
#   validator:     "allclose", "allclose_matching_infinities" or "rms"
#   rms_threshold: required when validator = "rms", and must be absent otherwise
# "allclose" and "allclose_matching_infinities" may also set atol, rtol or both (finite,
# non-negative; forbidden for "rms"): that tolerance applies to the matched tensors only and
# outranks a [[tolerance_overrides]] entry for the same test.
# "allclose_matching_infinities" grades as "allclose" does, at the same resolved
# atol/rtol, except that an element that is infinite with the same sign in both the
# reference and the device output compares equal — for an output whose correct value
# is infinite on both sides, such as a fully masked SDPA forward log-sum-exp row.
# NaN, opposite-signed infinities and finite-versus-infinite still fail. It is a host
# validator only: a comparison on the device (--validator gpu, or auto when the GPU
# reference ran) fails the tensor, so a run grading with it needs --validator cpu.
# Later entries take precedence.
#
# Layernorm backward's dscale/dbias are reductions over the batch axes:
#   dscale_j = sum_i dy*xhat, dbias_j = sum_i dy
# over up to ~9e5 zero-mean terms. The GPU's reduction order differs from the CPU
# reference's, and the resulting absolute error tracks the *tensor's* scale, not each
# element's. Elements that land near zero through cancellation then blow past
# atol + rtol*|ref| while the tensor as a whole is accurate to ~1e-6 relative.
# Measured on gfx1151: 22 of 132 fp32/upcast Smoke cases fail under allclose; the atol
# that would rescue them ranges 0.9x-52x the default depending on reduction length and
# swings ~2x with the input seed, and applies to dx as well, whose real error is 4-5
# decades smaller. Relative RMS stays 1e-6..8e-6 across the whole set.
[[validator_overrides]]
filters = ["*LayernormBackward*"]
tensors = ["*::DSCALE", "*::DBIAS"]
validator = "rms"
rms_threshold = 1e-4

# dscale/dbias tolerance for reduced-precision cases, matching
# layernorm::getTolerance<T>() in TestTolerances.hpp. Filters match the dtype
# tag in the bundle case id, which is the input dtype, so cases that keep
# dscale/dbias in FP32 (Mixed/Upcast) also get this looser threshold.
# "*fp16_*" also matches "bfp16_", so the bf16 entry must come after it
# (later matches win).
[[validator_overrides]]
filters = ["*LayernormBackward*fp16_*"]
tensors = ["*::DSCALE", "*::DBIAS"]
validator = "rms"
rms_threshold = 1e-3

[[validator_overrides]]
filters = ["*LayernormBackward*bfp16_*"]
tensors = ["*::DSCALE", "*::DBIAS"]
validator = "rms"
rms_threshold = 1e-2

# BatchnormBackward, gauntlet suites only. These entries replace two fuzz-space constraints
# (BatchnormBackward.space.json) that kept the oracle inside the common suite's tolerances.
# Both are scoped to `*gauntlet*` so the checked-in quick..comprehensive bundles keep the
# common tolerance and per-element grading. The gauntlet suite carries the input dtype tag
# before `_cases` (`gauntlet_BatchnormBackward_Default_fp16_cases.s7`); "_fp16_" does not match
# "_bfp16_".
#
# dx of half and bfloat16 (replaces the space rule that dropped the wide, positive and large
# domains for these dtypes). The common tolerance is atol = rtol = 4e-4 (half) and 3e-3
# (bfloat16), TestTolerances.hpp batchnorm::getToleranceBackward, graded as
# |impl - ref| <= atol + rtol * |ref|. In those domains |dx| runs from a few units to about 1e4
# (saved mean and inv_variance are literal ranges, so xhat * mean(xhat * dy) is not cancelled),
# where the engine and the fp32 reference round the channel reductions differently and a few
# elements per thousand differ by exactly one ulp of the result (measured on gfx950, e.g.
# ref 2.535156 impl 2.537109 in half). One ulp of v in [2^e, 2^(e+1)) is 2^(e-p), p = 10 for
# half and 7 for bfloat16, so it is at most 2^-p * |v|: 9.8e-4 of |v| for half and 7.8e-3 for
# bfloat16, at every magnitude up to the domain's range (1 ulp = 8 at |dx| near 1e4 in half).
# rtol = 2 * 2^-p covers one ulp of any |dx| with a factor of two over the ulp at the bottom
# of its binade, so a one-ulp disagreement cannot fail at any magnitude, while an error of
# a few ulps still does. atol stays at the common tolerance: it only matters near zero, where
# the disagreement is far below one ulp of the larger operand.
[[validator_overrides]]
filters = ["*gauntlet*BatchnormBackward*_fp16_*"]
tensors = ["*::DX"]
validator = "allclose"
atol = 4e-4
rtol = 2e-3

[[validator_overrides]]
filters = ["*gauntlet*BatchnormBackward*_bfp16_*"]
tensors = ["*::DX"]
validator = "allclose"
atol = 3e-3
rtol = 1.6e-2

# dscale and dbias (replaces the space rule that bounded n*hw for the wide and large domains).
# Both are fp32 sums of random-sign terms of magnitude 4.6 to 24 over n*hw elements per
# channel. The CPU reference adds them as one sequential fp32 sum and the engine by a tree, so
# they differ by about 1e-2 once partial sums reach 1e4 (measured on gfx950: 3 to 17 percent of
# cases at n*hw = 4096..32768, always one channel whose true sum is near zero and so misses
# atol + rtol * |ref|). Like LayernormBackward's dscale and dbias above, this is an error that
# tracks the tensor's scale, not each element's, so it is graded as a relative RMS. That error
# is about 1e-2 on channel sums whose rms is about sqrt(n*hw) * 10 (4e2 at n*hw = 2**11,
# 1.8e3 at 2**15), so the relative RMS is of order 1e-5 or below. The threshold has to clear
# the reference's own sequential-sum error that two constraints of the space still bound
# instead (4.5e-4 relative for constant terms at n*hw = 2**15, 2.4e-4 for same-sign terms at
# 2**21: BatchnormBackward.space.json), so it is 1e-3, the fp16 tier of the LayernormBackward
# precedent above: more than twice that bound and two orders above the error of the
# random-sign sums, while a wrong reduction (a missing channel, a doubled term) is a relative
# RMS of order 1 (4e-2 for one missing channel of 512). dscale and dbias are fp32 for every
# input dtype, so one threshold serves all of them.
#
# The suite grades dscale and dbias by this RMS in every domain, not only wide and large: a
# gauntlet name carries no domain, and a per-element comparison of a sum whose reference is a
# sequential fp32 sum is what the constraint removed here was working around.
[[validator_overrides]]
filters = ["*gauntlet*BatchnormBackward*"]
tensors = ["*::DSCALE", "*::DBIAS"]
validator = "rms"
rms_threshold = 1e-3

#
# RMSNormBackward Pure-Bfp16 (dy/x/dx all bf16) fails CPU-reference tolerance
# at the suite's large-reduction shapes (x:[4096,128,1,1], x:[5,256,14,14],
# x:[16,3,8,14,14]) — smaller shapes in the same suites pass reliably. The
# exact failing case (which training/bias/layout combo) varies between runs
# at a fixed shape, pointing at run-to-run nondeterminism in the GPU kernel's
# reduction order rather than a fixed tolerance shortfall, so per-case index
# filters aren't reliable here — skipping both fixtures outright. Root cause
# not yet identified; revisit once the CPU reference / GPU kernel numerics
# have been compared directly.
#
# The C++ fixtures this originally covered (Smoke/IntegrationGpuRMSNormBackward*PureBfp16)
# were retired in favor of the bundle suites
# (integration-test-bundles/{full,comprehensive}/RMSNormBackward/{Default,Variant2}),
# which cover the same shapes and hit the same flakiness — e.g.
# quick_RMSNormBackward_Default.4096_128_1_1_bfp16_{nchw,nhwc}_* failed on gfx94X
# in CI once the quick tier ran bundles (PR #11240). Shape coverage by tier: the
# 4096 shape is in full and comprehensive, the other two are comprehensive only.
# Filters below are scoped to the three known-flaky shapes (leading "*" matches
# any tier prefix; the variant is wildcarded so Default and Variant2 are both
# covered) rather than a blanket "*bfp16*", since smaller-shape bfp16 bundle
# cases pass reliably and should keep running.
[[test_skips]]
filters = [
    "*RMSNormBackward_*.4096_128_1_1_bfp16_*",
    "*RMSNormBackward_*.5_256_14_14_bfp16_*",
    "*RMSNormBackward_*.16_3_8_14_14_bfp16_*",
]
reason = "RMSNormBackward Pure-Bfp16 is flaky at large reduction shapes — root cause under investigation"
