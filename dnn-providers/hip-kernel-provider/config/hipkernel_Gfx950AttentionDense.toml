# Integration test configuration for hipkernel:Gfx950AttentionDense
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# All bundles for this engine are forward-only dense SDPA on gfx950.
# No tolerance overrides needed: the forward pass uses the common SdpaAttributes
# tolerance (tol::sdpa::getToleranceFwd<T>()).
#
# No [[test_skips]] entry: the engine's packs arch-prune before the matcher, so a
# non-gfx950 device declines through the ordinary path. An entry cannot express
# "skip everywhere except gfx950" -- the schema has no negation, and an empty
# `archs` list means EVERY arch (TestSettings.hpp: `entry.archs.empty() || ...`),
# so a skip written that way would silence gfx950 too. ASM_SDPA_ENGINE.toml ships
# no skips for the same reason.
