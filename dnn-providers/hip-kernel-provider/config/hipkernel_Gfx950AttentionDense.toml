# Integration test configuration for hipkernel:Gfx950AttentionDense
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# All bundles for this engine are forward-only dense SDPA on gfx950.
# No tolerance overrides needed: the forward pass uses the common SdpaAttributes
# tolerance (tol::sdpa::getToleranceFwd<T>()).
#
# No [[test_skips]] entry: the engine's packs arch-prune before the matcher, so a
# non-gfx950 device declines through the ordinary path. An entry cannot express
# "skip everywhere except gfx950" -- the schema has no negation, and an empty
# `archs` list means EVERY arch (TestSettings.hpp: `entry.archs.empty() || ...`),
# so a skip written that way would silence gfx950 too.

# -- Validator Overrides --
# Change which comparison an output tensor is graded by (see TestSettings.hpp for the schema).
# allclose is the default everywhere.
#
# SdpaFwd output O, gauntlet suites only (`*gauntlet*`; the quick bundles keep the common
# allclose tolerance, tol::sdpa::getToleranceFwd<T>() = 1e-2). This replaces the narrowing of
# V in the SdpaFwd/Gfx950Dense space (V free(-2, 2) under wide, scale 2 under large instead
# of the Q and K ranges). The kernel rounds P to the input dtype for the P.V product, which
# gives each P_j a relative error up to the unit roundoff of that dtype: 2^-8 (rms about
# 1.5e-3) for bfloat16, 2^-11 (rms about 3e-4) for half. The error of one output element is
# the P-weighted sum of |V_j| times those errors, so it grows with |V| (a V of magnitude 4
# or more failed 14 of 60 samples, V in +-8 21 of 60, at atol 0.01: probed on gfx950), while
# a cancelling sum leaves O itself small. The error tracks the scale of V, not each element
# of O, so it is graded as a relative RMS, as LayernormBackward does for dscale and dbias.
# Rounding O to the dtype adds one ulp at most (2^-8 or 2^-11 of |O|), so the expected
# relative RMS is about 2e-3 for bfloat16 and 5e-4 for half. The thresholds are about three
# to four times that: 8e-3 for bfloat16 (the bfloat16 relative-RMS tolerance of
# rmsnorm::getTolerance in TestTolerances.hpp) and 2e-3 for half. A wrong softmax or a
# missing kv block is a relative error of order 1. The patterns carry the dtype tag the fuzz
# driver puts in the suite (`gauntlet_SdpaFwd_Gfx950Dense_fp16_cases.s7`); `_fp16_` does not
# match `_bfp16_`.
[[validator_overrides]]
filters = ["*gauntlet*SdpaFwd*_bfp16_*"]
tensors = ["*::O"]
validator = "rms"
rms_threshold = 8e-3

[[validator_overrides]]
filters = ["*gauntlet*SdpaFwd*_fp16_*"]
tensors = ["*::O"]
validator = "rms"
rms_threshold = 2e-3
