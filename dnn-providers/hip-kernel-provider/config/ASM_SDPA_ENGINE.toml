# Integration test configuration for ASM_SDPA_ENGINE
# Filters use GTest-style globs: * matches any sequence of characters
# Later entries take precedence over earlier ones when multiple filters match

[meta]
version = 1

# -- Test Skips --
# Skip tests on specific architectures (or globally if 'archs' is omitted).
# Each entry requires:
#   archs:   optional array of substrings matched against the device's raw
#            gcnArchName (e.g. "gfx942" matches "gfx942:sramecc+:xnack-").
#            Omit or leave empty to skip on every arch.
#   filters: array of GTest globs matched against the full GTest name
#   reason:  human-readable string surfaced in the GTEST_SKIP message
# First matching entry wins.
#
# -- Tolerance Overrides --
# Override default tolerances for specific tests or groups of tests.
# Each entry requires:
#   filters: array of glob patterns matched against the full GTest name
#   atol: absolute tolerance
#   rtol: relative tolerance
#

# The common suite's ToleranceResolver maps both SdpaAttributes and
# SdpaBackwardAttributes to tol::sdpa::getToleranceFwd<T>() (tight, tuned for
# forward), so SDPA backward gradients (dQ/dK/dV) get their own entries here.
# Calibrated on gfx942 against the CPU reference, with O and the LSE derived from
# Q, K and V by the bundle fill, over every SdpaBackward case and eight seeds: the
# worst |GPU - CPU| was 7.8e-3 for bf16 and 2.0e-3 for fp16, about one bf16 and two
# fp16 ulps of the largest gradient (|dV| up to 2.1). Each entry leaves about 3x
# that at the worst element, and an all-zero output fails every case.
# Filters key on the dtype token of the full GTest name `<suite>.<case>`, and the token sits in
# a different place by source: the quick bundles carry it in the case id
# (`quick_SdpaBackward_Default.1_1_256_128_fp16_...`), the gauntlet fuzz driver in the suite,
# because its case ids are `s<seed>` (`gauntlet_SdpaBackward_Default_fp16_cases.s7`). The
# globs therefore do not anchor on the `.`. The leading "_" in "_fp16_" keeps it from also
# matching "bfp16_". The golden cases spell bfloat16 `bf16` in their ids
# (`quick_SdpaBackward_Default.golden_1_1_128_128_bf16_nomask`), so the bfloat16 entry
# matches both tokens.
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*_fp16_*"]
atol = 2.5e-3
rtol = 2.5e-3

[[tolerance_overrides]]
filters = ["*_SdpaBackward_*_bfp16_*", "*_SdpaBackward_*_bf16_*"]
atol = 1e-2
rtol = 1e-2

# -- Validator Overrides --
# Change which comparison an output tensor is graded by (see TestSettings.hpp for the schema).
# allclose is the default everywhere. Each entry names the output tensors it applies to.
#
# SdpaFwd output O, gauntlet suites only (`*gauntlet*`; the quick bundles keep the common
# allclose tolerance, tol::sdpa::getToleranceFwd<T>() = 1e-2). This replaces the narrowing of
# V in the SdpaFwd/Default space (V free(-2, 2) under wide, scale 2 under large instead of the
# Q and K ranges), graded per element as |impl - ref| <= atol + rtol * |ref| with its own
# atol and rtol. A relative RMS does not do here: the space also draws the subnormal domain,
# where O is of order 1e-39, the engine flushes it to zero (a relative error of 100 percent)
# and the RMS fails every such sample (3 of 256 on gfx950), while an atol passes it.
#
# atol covers the rounding of P. The kernel rounds the softmax weights P to bfloat16 for the
# P.V product, a relative error of at most the unit roundoff u = 2^-8 per weight, so
# O_i = sum_j P_j V_j is off by at most u * sum_j P_j |V_j| <= u * max|V|, whatever |O_i| is
# (a cancelling sum leaves O_i far below that). max|V| is 8 (wide draws +-8, large draws 4 to
# 8 in magnitude), so atol = 2^-8 * 8 = 0.03125. Probed on gfx950 over 3000 samples, the
# largest error that did not scale with |O| was 0.0102, and atol = rtol = 0.0156 passes all
# of them. rtol covers what does scale with |O|: rounding O to bfloat16 (one ulp, at most
# 2^-7 of |O|) and the engine's softmax error, which reached 1.7 percent of |O| on one row
# in 2000 samples of the Gfx950AttentionDense kernel, so rtol = 2^-5 = 0.03125. Subnormal
# and all-zero outputs pass by atol (the largest bfloat16 subnormal is 1.2e-38). A wrong
# softmax or a missing kv block is an error of order |O|, which the tolerance fails wherever
# |O| exceeds a few hundredths; it cannot see an O below atol, as the common tolerance of
# 1e-2 could not. The patterns carry the dtype tag the fuzz driver puts in the suite
# (`gauntlet_SdpaFwd_Default_bfp16_cases.s7`); the space draws bfloat16 only. The
# log-sum-exp (stats) keeps the common tolerance: a different tensor label.
[[validator_overrides]]
filters = ["*gauntlet*SdpaFwd*_bfp16_*"]
tensors = ["*::O"]
validator = "allclose"
atol = 3.125e-2
rtol = 3.125e-2
