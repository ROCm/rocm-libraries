# Integration test configuration for ASM_SDPA_ENGINE
# Filters use GTest-style globs: * matches any sequence of characters
# Later entries take precedence over earlier ones when multiple filters match

[meta]
version = 1

# -- Test Skips --
# Skip tests on specific architectures (or globally if 'archs' is omitted).
# Each entry requires:
#   archs:   optional array of substrings matched against the device's raw
#            gcnArchName (e.g. "gfx942" matches "gfx942:sramecc+:xnack-").
#            Omit or leave empty to skip on every arch.
#   filters: array of GTest globs matched against the full GTest name
#   reason:  human-readable string surfaced in the GTEST_SKIP message
# First matching entry wins.
#
# -- Tolerance Overrides --
# Override default tolerances for specific tests or groups of tests.
# Each entry requires:
#   filters: array of glob patterns matched against the full GTest name
#   atol: absolute tolerance
#   rtol: relative tolerance
#

# SdpaBackward defect DEF-03 (test plan sdpa-bwd.md §4.2): the ASM kernel's fp16
# dV loses precision when Skv <= 2 and Sq >= 512 (4 to 18 ulps, growing with Sq;
# bf16 is bit-exact). The fp16 probes stay in their levels: every ASM run reports
# them as skipped, and any other engine runs them. Delete this entry when the
# kernel is fixed or the engine declines these shapes.
[[test_skips]]
filters = [
    "*_SdpaBackward_*.def03a_*_fp16_*",
    "*_SdpaBackward_*.def03d_*_fp16_*",
    "*_SdpaBackward_*.x07_*_fp16_*",
]
reason = "DEF-03: fp16 dV loses precision at Skv <= 2 and Sq >= 512 (AITER kernel); tracked as ALMIOPEN-3046"

# Fallback entries for the cases the per-class rows below do not reach: the independent
# PyTorch golden sweeps (which retain their pre-plan fp16 tolerance) and the gauntlet fuzz
# driver. The generated plan cases use the per-class rows below; later entries take
# precedence, so every case id that carries a tolerance class token still takes its class row.
# Filters key on the dtype token of the full GTest name `<suite>.<case>`, and the token sits in
# a different place by source: the quick bundles carry it in the case id
# (`quick_SdpaBackward_Default.1_1_256_128_fp16_...`), the gauntlet fuzz driver in the suite,
# because its case ids are `s<seed>` (`gauntlet_SdpaBackward_Default_fp16_cases.s7`). The
# gauntlet globs therefore do not anchor on the `.`. The leading "_" in "_fp16_" keeps it from
# also matching "bfp16_". The golden cases spell bfloat16 `bf16` in their ids
# (`quick_SdpaBackward_Default.golden_1_1_128_128_bf16_nomask`), so the bfloat16 entry
# matches both tokens.
[[tolerance_overrides]]
filters = ["*_SdpaBackward_Golden_*.*_fp16_*", "*gauntlet*_SdpaBackward_*_fp16_*"]
atol = 2.5e-3
rtol = 2.5e-3

[[tolerance_overrides]]
filters = ["*gauntlet*_SdpaBackward_*_bfp16_*", "*_SdpaBackward_*_bf16_*"]
atol = 1e-2
rtol = 1e-2

# The common suite's ToleranceResolver maps both SdpaAttributes and
# SdpaBackwardAttributes to tol::sdpa::getToleranceFwd<T>() (tight, tuned for
# forward), so SDPA backward gradients (dQ/dK/dV) get their own entries here:
# one per tolerance class and dtype of the SdpaBackward test plan. The generator
# writes the block between the BEGIN and END lines.
# BEGIN SdpaBackward tolerance classes, written by generate_sdpa_bwd_bundles.py --toml
# Plan sdpa-bwd.md §6.1. Each SdpaBackward case id ends with its tolerance class token
# after its dtype token, so every id matches exactly one row. The class follows from the
# case's shape, band, scale and value domain and a NumPy estimate of max|ref| per
# gradient: atol <= 0.1 x the smallest non-zero max|ref| (the guard), and a
# same-precision kernel model passes with margin >= 2.5 against an FP32-accumulating
# reference. rtol is two ulps of the dtype. Do not edit: rerun the generator.

# class D, bf16: diffuse softmax
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_told"]
atol = 0.0025
rtol = 0.016

# class D, fp16: diffuse softmax
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*_told"]
atol = 0.00075
rtol = 0.004

# class DL, bf16: diffuse softmax, long rows (bf16, Skv > 1024)
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_toldl"]
atol = 0.0012
rtol = 0.016

# class P, bf16: peaked softmax: causal, narrow window, Sq > Skv bottom-right, long Sq accumulation
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_tolp"]
atol = 0.012
rtol = 0.016

# class P, fp16: peaked softmax: causal, narrow window, Sq > Skv bottom-right, long Sq accumulation
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*_tolp"]
atol = 0.003
rtol = 0.004

# class S, bf16: short query side, Sq <= 17 (decode-like); tiny dK, dV
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_tols"]
atol = 0.0003
rtol = 0.016

# class S, fp16: short query side, Sq <= 17 (decode-like); tiny dK, dV
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*_tols"]
atol = 0.0002
rtol = 0.004

# class U, bf16: unscaled or high-spread logits (lambda >= 2): unset scale, scale ~1, peaked value domain
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_tolu"]
atol = 0.025
rtol = 0.016

# class U, fp16: unscaled or high-spread logits (lambda >= 2): unset scale, scale ~1, peaked value domain
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*_tolu"]
atol = 0.003
rtol = 0.004

# class K1, bf16: Skv <= 2: dQ and dK cancel to about 0 at Skv = 1; dV is a sum of dO rows
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_bfp16_*_tolk1"]
atol = 0.0003
rtol = 0.016

# class K1, fp16: Skv <= 2: dQ and dK cancel to about 0 at Skv = 1; dV is a sum of dO rows
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp16_*_tolk1"]
atol = 0.0003
rtol = 0.004

# class F32, fp32: fp32 IO (uncalibrated)
[[tolerance_overrides]]
filters = ["*_SdpaBackward_*.*_fp32_*_tolf32"]
atol = 1e-05
rtol = 1e-05
# END SdpaBackward tolerance classes

# -- Validator Overrides --
# Change which comparison an output tensor is graded by (see TestSettings.hpp for the schema).
# allclose is the default everywhere. Each entry names the output tensors it applies to.
#
# SdpaFwd output O, gauntlet suites only (`*gauntlet*`; the quick bundles keep the common
# allclose tolerance, tol::sdpa::getToleranceFwd<T>() = 1e-2). This replaces the narrowing of
# V in the SdpaFwd/Default space (V free(-2, 2) under wide, scale 2 under large instead of the
# Q and K ranges), graded per element as |impl - ref| <= atol + rtol * |ref| with its own
# atol and rtol. A relative RMS does not do here: the space also draws the subnormal domain,
# where O is of order 1e-39, the engine flushes it to zero (a relative error of 100 percent)
# and the RMS fails every such sample (3 of 256 on gfx950), while an atol passes it.
#
# atol covers the rounding of P. The kernel rounds the softmax weights P to bfloat16 for the
# P.V product, a relative error of at most the unit roundoff u = 2^-8 per weight, so
# O_i = sum_j P_j V_j is off by at most u * sum_j P_j |V_j| <= u * max|V|, whatever |O_i| is
# (a cancelling sum leaves O_i far below that). max|V| is 8 (wide draws +-8, large draws 4 to
# 8 in magnitude), so atol = 2^-8 * 8 = 0.03125. Probed on gfx950 over 3000 samples, the
# largest error that did not scale with |O| was 0.0102, and atol = rtol = 0.0156 passes all
# of them. rtol covers what does scale with |O|: rounding O to bfloat16 (one ulp, at most
# 2^-7 of |O|) and the engine's softmax error, which reached 1.7 percent of |O| on one row
# in 2000 samples of the Gfx950AttentionDense kernel, so rtol = 2^-5 = 0.03125. Subnormal
# and all-zero outputs pass by atol (the largest bfloat16 subnormal is 1.2e-38). A wrong
# softmax or a missing kv block is an error of order |O|, which the tolerance fails wherever
# |O| exceeds a few hundredths; it cannot see an O below atol, as the common tolerance of
# 1e-2 could not. The patterns carry the dtype tag the fuzz driver puts in the suite
# (`gauntlet_SdpaFwd_Default_bfp16_cases.s7`); the space draws bfloat16 only. The
# log-sum-exp (stats) keeps the common tolerance: a different tensor label.
[[validator_overrides]]
filters = ["*gauntlet*SdpaFwd*_bfp16_*"]
tensors = ["*::O"]
validator = "allclose"
atol = 3.125e-2
rtol = 3.125e-2
