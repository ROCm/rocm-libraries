# Integration test configuration for hipkernel:Gfx950ConvFwd
# Filters use GTest-style globs: * matches any sequence of characters

[meta]
version = 1

# All bundles for this engine are plain 2D forward convolution (grouped and
# depthwise included) with FP16 or BF16 storage on gfx950. No tolerance
# overrides: the common ConvolutionFwdAttributes tolerance applies.
#
# No [[test_skips]] entry: the engine's pack arch-prunes before the matcher, so a
# non-gfx950 device declines through the ordinary path. An entry cannot express
# "skip everywhere except gfx950" -- the schema has no negation, and an empty
# `archs` list means EVERY arch (TestSettings.hpp: `entry.archs.empty() || ...`),
# so a skip written that way would silence gfx950 too.
