[pytest]
# importlib mode lets same-named test modules live in different layer dirs
# without __init__.py packaging or rootdir collisions.
addopts = --import-mode=importlib
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: host-side native build/replay integration (exclude with '-m not integration')
    tier_standard: run the test in the standard tier and above, not in quick (see rocke/TESTING.md)
    tier_comprehensive: run the test in the comprehensive and full tiers only
    tier_full: run the test in the full tier only
