#
# Pytest collection config for the rocKE *library* test tree (kernels / builders /
# dispatch). The platform engine tree has its own pytest.ini under
# platform/tests/; this is the library-side counterpart. It exists because the
# platform CI entrypoint (platform/tests/run_all.py) structurally CANNOT collect
# library/tests/ -- platform is a verbatim-copyable tree guarded against
# referencing the library (the one-way library -> platform dependency rule), so
# the library must own its own collection config + entrypoint (tests/run_all.py).
#
# sys.path for `kernels`/`builders`/`dispatch`/`rocke` is set by tests/conftest.py.
[pytest]
# importlib mode lets same-named test modules live in different layer dirs without
# __init__.py packaging or rootdir collisions (matches platform/tests/pytest.ini).
addopts = --import-mode=importlib
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registered markers (an unregistered mark is a warning under -W error). The `gpu`
# marker tags the on-GPU numeric lanes so CI can select them (`-m gpu`, on a
# gfx942/gfx950 runner) or exclude them (`-m "not gpu"`, the default CPU lane in
# run_all.py). Tests still self-gate with a skipif on device presence, so `-m gpu`
# on a CPU box skips rather than errors.
markers =
    gpu: test requires a real GPU (gfx942 or gfx950) and ROCm torch; skipped on CPU CI
