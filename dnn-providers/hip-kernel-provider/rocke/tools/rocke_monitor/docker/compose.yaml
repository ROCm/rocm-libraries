# The rocKE monitor's container. Do not edit this file, docker/.env or docker/compose.override.yaml:
# rkmon start (the first time), rkmon apply and rkmon rollback write .env and the override from the settings you
# confirmed (rkmon confirm), and rkmon apply puts back a hand edit. Where each .env value comes from: README.md,
# "Ports, volumes and docker/.env". The deploy steps: QUICK_DEPLOY_GUIDE.md; rkmon next says where you are.
name: ${COMPOSE_PROJECT_NAME:?see ./rkmon next}
services:
  rkmon:
    image: &image ${RKMON_IMAGE:?see ./rkmon next}:${RKMON_TAG:?see ./rkmon next}
    # The image comes from `rkmon image load` or `rkmon image pull`, never from a pull compose would start.
    pull_policy: never
    restart: unless-stopped
    # docker stop ends the orchestrator, then runs rk stop, which may wait for a write in flight and for the state
    # lock, a few minutes each at most (rkmon_lib/control.py: WRITE_WAIT_S, STATE_WAIT_S): the grace keeps a margin
    # over that.
    stop_grace_period: 10m
    cpus: ${RKMON_CPUS:?see ./rkmon next}
    mem_limit: ${RKMON_MEMORY:?see ./rkmon next}
    # Only the Linux capabilities the start's root steps, sudo and tini need, and a cap on the processes
    # (rkmon_lib/container_layout.py: CAPABILITIES, PIDS_LIMIT).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETUID, SETGID, AUDIT_WRITE]
    pids_limit: 4096
    ports:
      - "${RKMON_ADMIN_HOST:?see ./rkmon next}:${RKMON_PORT:?see ./rkmon next}:18613"
    environment:
      RKMON_PORT: ${RKMON_PORT:?see ./rkmon next}
      RKMON_ADMIN_HOST: ${RKMON_ADMIN_HOST:?see ./rkmon next}
      RKMON_TEAM_PORT: ${RKMON_TEAM_PORT:-}
      RKMON_TEAM_HOST: ${RKMON_TEAM_HOST:-127.0.0.1}
      RKMON_UID: ${RKMON_UID:-}
      RKMON_GID: ${RKMON_GID:-}
    volumes:
      - rkmon-work:/work
      - rkmon-secrets:/secrets
      - rkmon-secrets-write:/secrets-write
      # The code root installs over the image's own (rkmon_lib/container_layout.py: CODE_DIR)
      - rkmon-code:/code
      # Your confirmed deploy settings, read-only: nothing in the container changes them
      # (rkmon_lib/container_layout.py: SETTINGS_DIR).
      - rkmon-settings:/etc/rkmon/settings:ro
  # The one-off container that writes the settings volume (rkmon_lib/deliver.py runs it, as root): that volume alone,
  # no network and one capability, CHOWN, to give the settings the monitor's group (rkmon_lib/container_layout.py:
  # LAYER_WRITE_DIR, LAYER_WRITE_CAPABILITIES). Its profile keeps `docker compose up` from starting it.
  deliver:
    image: *image
    pull_policy: never
    profiles: [one-off]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - rkmon-settings:/mnt/rkmon-settings
volumes:
  rkmon-work:
  rkmon-secrets:
  rkmon-secrets-write:  # the writer's logins and secrets: only the write user reads them
  rkmon-code:  # the releases of the package's code: root writes them, and every other user only reads them
  rkmon-settings:  # your confirmed deploy settings: the monitor and the writer read them, only deliver writes them
