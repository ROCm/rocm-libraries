#
# hip-kernel-provider external integration test categories: the batchnorm training bundles.
#
# Pinned to hipkernel:BatchnormTraining via --test-engine, the engine that serves them when
# HIPKERNELPROVIDER_MLOPS_ENABLE_INGESTOR is ON, in place of HIP_MLOPS_ENGINE
# (HIP_MLOPS_ENGINE_test_categories_integration.yaml). Selects the shared
# integration-test-bundles/<tier>/ suites of the graphs it serves by suite name:
#   Batchnorm, BatchnormPointwise.
# Keep the folders in step with the engine's row in HKP_MLOPS_INGESTOR_ENGINES
# (src/CMakeLists.txt), whose filter the legacy-label build passes instead of this file;
# descriptor-packaging/tests/test_mlops_bundle_filters.py fails on a mismatch.
# Engine pinning and support claims do the rest: a claimed case the engine declines fails
# its lane, an unclaimed one it declines skips.
#
# The tiers mirror HIP_MLOPS_ENGINE's lane, narrowed to these folders: they cascade, and
# only "full" runs the full-tier bundles.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Quick-tier batchnorm training bundles"
    test_patterns:
      - "quick_Batchnorm_*.*"
      - "quick_BatchnormPointwise_*.*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard batchnorm training coverage: quick + standard-tier bundles"
    test_patterns:
      - "quick_Batchnorm_*.*"
      - "quick_BatchnormPointwise_*.*"
      - "standard_Batchnorm_*.*"
      - "standard_BatchnormPointwise_*.*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive batchnorm training coverage: quick + standard + comprehensive-tier bundles"
    test_patterns:
      - "quick_Batchnorm_*.*"
      - "quick_BatchnormPointwise_*.*"
      - "standard_Batchnorm_*.*"
      - "standard_BatchnormPointwise_*.*"
      - "comprehensive_Batchnorm_*.*"
      - "comprehensive_BatchnormPointwise_*.*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "All batchnorm training bundles"
    test_patterns:
      - "*_Batchnorm_*.*"
      - "*_BatchnormPointwise_*.*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier batchnorm training bundles"
    test_patterns:
      - "quick_Batchnorm_*.*"
      - "quick_BatchnormPointwise_*.*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, as in HIP_MLOPS_ENGINE's lane: 2x the tier's
# runtime budget (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget).
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 3600
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
