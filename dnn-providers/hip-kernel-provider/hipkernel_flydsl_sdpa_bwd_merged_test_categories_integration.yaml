#
# hip-kernel-provider hipkernel:flydsl_sdpa_bwd_merged external integration test categories.
#
# Pinned to hipkernel:flydsl_sdpa_bwd_merged via --test-engine. Selects every backward
# bundle under integration-test-bundles/{quick,standard,comprehensive,full}/SdpaBackward/
# by suite, not by text in the case id: import_graph.py names cases in its own format, so
# a name pattern would miss the cases it adds. The *_fwd_pair bundles beside them are the
# forward halves of golden pairs and are excluded. Engine pinning and support claims do the
# rest: a claimed case the engine declines fails its lane, an unclaimed one it declines
# skips, and an unclaimed one it accepts runs; it is reported as unclaimed support only
# when its bundle has a sidecar.
# No FlyDSL device test runs in quick or ffm-quick, so the lane registers standard,
# comprehensive and full only. Tiers cascade: standard runs the quick_* and standard_*
# bundles, comprehensive adds the comprehensive_* ones; only "full" runs the full-tier bundles.

_common_excludes: &common_excludes
  - "*DISABLED*"
  - "*SdpaFwd*"
  - "*_fwd_pair*"

test_categories:
  standard:
    description: "Standard FlyDSL merged SDPA backward bundle coverage"
    test_patterns:
      - "quick_SdpaBackward_*"
      - "standard_SdpaBackward_*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Comprehensive FlyDSL merged SDPA backward coverage: quick + standard + comprehensive-tier bundles"
    test_patterns:
      - "quick_SdpaBackward_*"
      - "standard_SdpaBackward_*"
      - "comprehensive_SdpaBackward_*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Full FlyDSL merged SDPA backward coverage"
    test_patterns:
      - "*_SdpaBackward_*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

# category_timeouts are CTest kill limits, set to 2x the tier's runtime budget
# (standard ~30 min, comprehensive <= 60 min incl.
# standard; full has no budget) so a budget overrun is a failure to
# investigate while ordinary run-to-run variance does not trip the timeout.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    standard: 3600
    comprehensive: 7200
    full: 14400
