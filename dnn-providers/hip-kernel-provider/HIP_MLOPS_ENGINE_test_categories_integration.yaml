#
# hip-kernel-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to HIP_MLOPS_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names, not hip_kernel_provider_tests
# or hip_kernel_provider_integration_tests names.
#
# hipdnn_integration_tests covers ops (conv, matmul, sdpa, reduction, ...) that
# HIP_MLOPS_ENGINE doesn't implement; the harness's generic engine-support check
# (checkEngineSupportOrSkip / verifyGraph) skips those automatically, so pinning
# every tier to the full "*" pattern here is safe — it never runs a case
# HIP_MLOPS_ENGINE can't service, it just lets the harness make that call instead
# of narrowing the GTest filter up front.
_common_excludes: &common_excludes
  - "*DISABLED*"

# TEMPORARY TIER REMAPPING (revert once CI has proper test-label support).
#
# CI cannot yet select tests by label, so it runs whole tiers by name. To land
# the hip-kernel-provider mlops integration-test port without overloading the
# pre-commit/PR jobs, the tiers are temporarily repurposed:
#   - quick:         all Smoke GPU cases (fast pre-commit signal).
#   - standard:      everything ("*"), i.e. what "full" used to run. The harness
#                    auto-skips ops HIP_MLOPS_ENGINE can't service (see the
#                    engine-support note above), so "*" is safe here.
#   - comprehensive: nothing (empty test_patterns -> category is skipped).
#   - full:          nothing (empty test_patterns -> category is skipped).
# Once label-based selection exists, restore comprehensive/full to real
# coverage and give each tier its intended, distinct pattern set.
test_categories:
  quick:
    description: "Smoke GPU cases (temporary: all smoke patterns until CI label support lands)"
    test_patterns:
      - "Smoke/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Full external integration coverage (temporary: runs the former full '*' tier until CI label support lands)"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  # Intentionally empty: an empty test_patterns list makes the category
  # generator skip this tier entirely (runs nothing) until CI label support
  # lands. See parse_test_categories.py ("no test_patterns defined, skipping").
  comprehensive:
    description: "Disabled for now (temporary: runs nothing until CI label support lands)"
    test_patterns: []
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  # Intentionally empty: see the comprehensive note above.
  full:
    description: "Disabled for now (temporary: runs nothing until CI label support lands)"
    test_patterns: []
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300
    standard: 2700
    comprehensive: 25200
    full: 28800
