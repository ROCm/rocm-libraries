#
# hip-kernel-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to HIP_MLOPS_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names, not hip_kernel_provider_tests
# or hip_kernel_provider_integration_tests names.
#
# Tier pattern shape mirrors miopen-provider/test_categories_integration.yaml:
#   - "quick_*"/"standard_*" match the bundle suites (integration-test-bundles/
#     {quick,standard}/...), whose names mirror the on-disk tier directory;
#     bundles are the CI driver. "Smoke/*" (slash) matches the always-built,
#     non-graph C++ parameterised suites -- most Smoke/* graph tests only build
#     under -DBUILD_CPP_GRAPH_TESTS=ON (see that flag in
#     dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt),
#     but keep the pattern regardless so a graph-tests-enabled build still
#     picks them up. GTest treats '/' and '_' as literal chars, so both
#     pattern shapes are needed. "*" (comprehensive/full) also matches the
#     full-tier bundles (integration-test-bundles/full/...).
#
# Layernorm backward (IntegrationGpuLayernormBackward.cpp) is the one
# always-built graph suite here that instantiates the full Quick/Standard/
# Comprehensive/Full tier set directly -- same convention as the gpu-ref
# reference tests (tests/gpu-ref/TestGpuFpReferenceLayernormBwd.cpp and
# friends) -- rather than registering everything under one "Smoke" bucket and
# filtering by CTest pattern. "Quick/*", "Standard/*", "Comprehensive/*" below
# pick that up generically: any other op that adopts the same instantiation
# convention is covered with no further YAML change. Real numbers below are
# layernorm backward's OWN contribution in isolation (measured via
# --gtest_filter='Quick/*:Standard/*:Comprehensive/*' against just this
# suite) -- NOT the comprehensive tier's total wall time, which also runs
# every other op's own quick/standard/full-tier bundle sweeps via the same
# bare "*" pattern (pre-existing, unrelated to this file's layernorm changes;
# that total is what execution_settings.category_timeouts.comprehensive's
# 7200 s allowance below is sized for). Single-process totals measured on
# gfx1151, dominated by fixed HIP/plugin process warm-up rather than test
# content: Quick alone ~25 s; Quick+Standard together ~38 s;
# Quick+Standard+Comprehensive together ~173 s -- each within its 20 s / 2
# min / 5 min budget for layernorm backward's own share of that tier.
# Comprehensive isolates one variant (optionalTensors=false) of the
# {32,32,14,25,59} production shape (21.1M el, ~8-10 s/case -- host-side
# verification cost scales with element count); its optionalTensors=true
# sibling doesn't fit that budget alongside it and is deferred to the Full
# tier instead. See LayernormCommon.hpp's getLayernorm5DStandardTestCases() /
# getLayernorm5DComprehensiveTestCases() / getLayernorm5DBackwardFullTestCases()
# for the exact split.
#
# hipdnn_integration_tests covers ops (conv, matmul, sdpa, reduction, ...) that
# HIP_MLOPS_ENGINE doesn't implement; the harness's generic engine-support check
# (checkEngineSupportOrSkip / verifyGraph) skips those automatically, so the
# patterns below are safe even though they aren't narrowed to HIP_MLOPS_ENGINE's
# actual op coverage (batchnorm, layernorm, RMSNorm, resample) -- unsupported
# cases are skipped by the harness rather than filtered out here.
_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage"
    test_patterns:
      - "*"
    # Layernorm backward is always built (HIPDNN_IT_ALWAYS_BUILT_SOURCES), so
    # unlike the other C++ graph suites it runs in CI. All three "Full"-tagged
    # layernorm backward instantiations (4D, 5D, LargeBatch) are excluded here
    # -- not just the two that are actually expensive -- so the tag boundary
    # stays crisp: "Full" means full-tier-only, never leaks into comprehensive
    # via the bare "*" pattern below just because one Full-tagged case happens
    # to be cheap. Comprehensive's layernorm content is exactly the union of
    # its Quick/Standard/Comprehensive-tagged instantiations, matched by "*"
    # with nothing more to exclude for those three. Full/*5D* and
    # Full/*LargeBatch* each measured well over an hour on gfx1151 in the
    # original full-suite run (ROCm/rocm-libraries#11529 is the timeout this
    # was cut from); Full/*4D* is cheap (~5 s) but excluded anyway for the
    # same tag-boundary reason.
    #
    # Explicit list because YAML cannot concatenate an aliased sequence, hence
    # the repeated "*DISABLED*" instead of *common_excludes.
    exclude:
      - "*DISABLED*"
      - "Full/*IntegrationGpuLayernormBackwardLargeBatch*"
      - "Full/*IntegrationGpuLayernormBackward*5D*"
      - "Full/*IntegrationGpuLayernormBackward*4D*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier bundle sweeps plus Smoke GPU cases"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 2700
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
