#
# hip-kernel-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to HIP_MLOPS_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names, not hip_kernel_provider_tests
# or hip_kernel_provider_integration_tests names.
#
# Tier pattern shape mirrors miopen-provider/test_categories_integration.yaml:
#   - "quick_*"/"standard_*" match the bundle suites (integration-test-bundles/
#     {quick,standard}/...), whose names mirror the on-disk tier directory;
#     bundles are the CI driver. "Smoke/*" (slash) matches the always-built,
#     non-graph C++ parameterised suites -- most Smoke/* graph tests only build
#     under -DBUILD_CPP_GRAPH_TESTS=ON (see that flag in
#     dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt),
#     but keep the pattern regardless so a graph-tests-enabled build still
#     picks them up. GTest treats '/' and '_' as literal chars, so both
#     pattern shapes are needed. "*" (comprehensive/full) also matches the
#     full-tier bundles (integration-test-bundles/full/...).
#
# hipdnn_integration_tests covers ops (conv, matmul, sdpa, reduction, ...) that
# HIP_MLOPS_ENGINE doesn't implement; the harness's generic engine-support check
# (checkEngineSupportOrSkip / verifyGraph) skips those automatically, so the
# patterns below are safe even though they aren't narrowed to HIP_MLOPS_ENGINE's
# actual op coverage (batchnorm, layernorm, RMSNorm, resample) -- unsupported
# cases are skipped by the harness rather than filtered out here.
_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      # Layernorm backward's "4D" shape family (Smoke and Full instantiations
      # alike) is cheap regardless of tier -- 18.0 s measured on gfx1151 for
      # all 14 suites combined (Smoke ~12.6 s + Full ~5.5 s) -- so it is
      # pulled into quick explicitly. "Full/*" isn't otherwise part of quick;
      # this pattern is scoped to layernorm backward's own suite names so it
      # can't pick up another op's Full suite.
      - "Full/*IntegrationGpuLayernormBackward*4D*"
    exclude:
      - "*DISABLED*"
      # Layernorm backward's "5D" shape family is not cheap: 276.7 s measured
      # on gfx1151 across the 7 Smoke/*5D* suites alone (see standard/
      # comprehensive below for where it lands instead). The blanket
      # "Smoke/*" pattern above would otherwise pull all of it into quick;
      # carve it back out here. Full/*5D* and Full/*LargeBatch* never enter
      # quick's positive patterns in the first place (quick has no bare
      # "Full/*"), so they need no exclude.
      - "Smoke/*IntegrationGpuLayernormBackward*5D*"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
      - "Full/*IntegrationGpuLayernormBackward*4D*"
    exclude:
      - "*DISABLED*"
      # Standard adds the 5D family back (25.0 s measured for 7 suites x 26
      # cases minus the four indices below), keeping quick's content plus
      # this at 43.0 s total -- comfortably under the 2-minute standard
      # budget. The four excluded indices are the same production shape
      # (see comprehensive's comment below) repeated per dtype fixture: ~8.2-
      # 10.0 s each, ~251.7 s combined across all 7 5D suites, which alone
      # would blow the standard budget, so they wait for comprehensive.
      - "Smoke/*IntegrationGpuLayernormBackward*5D*.Correctness/10"
      - "Smoke/*IntegrationGpuLayernormBackward*5D*.Correctness/12"
      - "Smoke/*IntegrationGpuLayernormBackward*5D*.Correctness/23"
      - "Smoke/*IntegrationGpuLayernormBackward*5D*.Correctness/25"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage"
    test_patterns:
      - "*"
    # Layernorm backward is always built (HIPDNN_IT_ALWAYS_BUILT_SOURCES), so
    # unlike the other C++ graph suites it runs in CI. Full/*5D* and
    # Full/*LargeBatch* are still excluded here -- 1364.2 s and 1240.1 s
    # measured on gfx1151 respectively, each alone blowing the 5-minute
    # comprehensive budget by itself (ROCm/rocm-libraries#11529 is the
    # original full-suite timeout this was cut from). Everything else layernorm
    # backward now runs in comprehensive: with quick+standard's 43.0 s plus the
    # four production-shape indices standard held back (251.7 s), the total is
    # 294.7 s -- just inside 5 minutes. Those four indices are one shape,
    # {32,32,14,25,59} (21.1M el), repeated per dtype fixture; identified by
    # index rather than name because the shape isn't in the test name:
    # Combine(2 layouts, getLayernorm5DTestCases()) gives index = layout * 13 +
    # case, and this shape is cases 10 and 12 in common/LayernormCommon.hpp.
    # Re-derive if that list changes -- the indices shift silently.
    #
    # Explicit list because YAML cannot concatenate an aliased sequence, hence
    # the repeated "*DISABLED*" instead of *common_excludes.
    exclude:
      - "*DISABLED*"
      - "Full/*IntegrationGpuLayernormBackwardLargeBatch*"
      - "Full/*IntegrationGpuLayernormBackward*5D*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier bundle sweeps plus Smoke GPU cases"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      - "Full/*IntegrationGpuLayernormBackward*4D*"
    exclude:
      - "*DISABLED*"
      # Mirrors the quick tier's carve-out above -- see quick's exclude comment.
      - "Smoke/*IntegrationGpuLayernormBackward*5D*"
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 2700
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
