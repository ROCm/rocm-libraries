#
# hip-kernel-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# hip-kernel-provider plugin, pinned to HIP_MLOPS_ENGINE via --test-engine. These
# patterns match hipdnn_integration_tests GTest names, not hip_kernel_provider_tests
# or hip_kernel_provider_integration_tests names.
#
# Tier pattern shape mirrors miopen-provider/test_categories_integration.yaml:
#   - "quick_*"/"standard_*"/"comprehensive_*" match the bundle suites
#     (integration-test-bundles/{quick,standard,comprehensive}/...), whose names
#     mirror the on-disk tier directory;
#     bundles are the CI driver. "Smoke/*" (slash) matches the always-built,
#     non-graph C++ parameterised suites -- most Smoke/* graph tests only build
#     under -DBUILD_CPP_GRAPH_TESTS=ON (see that flag in
#     dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt),
#     but keep the pattern regardless so a graph-tests-enabled build still
#     picks them up. GTest treats '/' and '_' as literal chars, so both
#     pattern shapes are needed. The "full" tier runs everything, including the
#     full-tier bundles (integration-test-bundles/full/...), which no lower tier
#     selects.
#
# hipdnn_integration_tests covers ops (conv, matmul, sdpa, reduction, ...) that
# HIP_MLOPS_ENGINE doesn't implement; the harness's generic engine-support check
# (checkEngineSupportOrSkip / verifyGraph) skips those automatically, so the
# patterns below are safe even though they aren't narrowed to HIP_MLOPS_ENGINE's
# actual op coverage (batchnorm, layernorm, RMSNorm, resample) -- unsupported
# cases are skipped by the harness rather than filtered out here.
_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      # "Quick/*" and "Standard/*" match the C++ suites that carry an explicit
      # tier prefix (layernorm uses Quick/Standard/Full).
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage: quick + standard + comprehensive-tier bundles"
    # Tiers cascade: comprehensive runs everything quick and standard run, plus
    # the comprehensive-tier bundles. It deliberately does NOT run the full-tier
    # bundles (full_*): "full" holds only what does not belong in a lower tier
    # (exhaustive/stress cases, or cases redundant with lower-tier coverage of
    # the same option axis) and has no runtime budget; "full" below runs it.
    #
    # Two namespaces are in play and both are needed. Lowercase "quick_*" /
    # "standard_*" / "comprehensive_*" are bundle suites, named after their
    # on-disk tier under integration-test-bundles/. Capitalised "Smoke/" /
    # "Quick/" / "Standard/" / "Comprehensive/" are C++ gtest prefixes; "Full/*"
    # is not listed because the C++ Full tier is the weekly-only set that
    # "full" below still runs.
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "comprehensive_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
      - "Comprehensive/*"
      # The always-built C++ tests that carry no tier prefix
      # (IntegrationIsSupportedExtPerformance, IntegrationCpuSdpaFwdBwdChained).
      - "Integration*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: quick-tier bundle sweeps plus Smoke GPU cases"
    test_patterns:
      - "quick_*"
      - "Smoke/*"
      # Mirrors the quick tier: suites that carry an explicit tier prefix put
      # their cheapest cases under "Quick/", so without this the ops that moved
      # off "Smoke/" (layernorm) would drop out of fast feedback entirely.
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, set to 2x the tier's runtime budget
# (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget) so a budget overrun is a failure to
# investigate while ordinary run-to-run variance does not trip the timeout.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 1200
    standard: 3600
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
