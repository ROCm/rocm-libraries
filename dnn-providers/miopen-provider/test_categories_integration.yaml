#
# miopen-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# miopen provider plugin. These patterns match hipdnn_integration_tests GTest
# names, not miopen_plugin_tests names.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      # "quick_*" matches the bundle suites, whose names mirror the on-disk
      # tier directory (integration-test-bundles/quick/...); bundles are the CI
      # driver. "Smoke/*" (slash) matches the C++ parameterised suites. Most of
      # those are graph tests that no longer build by default — see
      # BUILD_CPP_GRAPH_TESTS in
      # dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt —
      # but "Smoke/*" is not dead: the always-built non-graph tests
      # (Smoke/IntegrationConvFwdSerializeRoundTripFp32,
      # Smoke/IntegrationGpuResampleForward*) still register under it. It also
      # picks the graph tests back up on a -DBUILD_CPP_GRAPH_TESTS=ON branch.
      # GTest treats '/' and '_' as literal chars, so both patterns are needed.
      - "quick_*"
      - "Smoke/*"
      # "Quick/*" and "Standard/*" match the C++ suites that carry an explicit
      # tier prefix (layernorm uses Quick/Standard/Comprehensive/Full).
      - "Quick/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage: quick + standard + comprehensive-tier bundles"
    # Tiers cascade: comprehensive runs everything quick and standard run, plus
    # the comprehensive-tier bundles. It deliberately does NOT run the full-tier
    # bundles (full_*): "full" holds only what does not belong in a lower tier
    # (exhaustive/stress cases, or cases redundant with lower-tier coverage of
    # the same option axis) and has no runtime budget; "full" below runs it.
    #
    # Two namespaces are in play and both are needed. Lowercase "quick_*" /
    # "standard_*" / "comprehensive_*" are bundle suites, named after their
    # on-disk tier under integration-test-bundles/. Capitalised "Smoke/" /
    # "Quick/" / "Standard/" / "Comprehensive/" are C++ gtest prefixes; "Full/*"
    # is not listed because the C++ Full tier is the weekly-only set that
    # "full" below still runs.
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "comprehensive_*"
      - "Smoke/*"
      - "Quick/*"
      - "Standard/*"
      - "Comprehensive/*"
      # The always-built C++ tests that carry no tier prefix
      # (IntegrationIsSupportedExtPerformance, IntegrationCpuSdpaFwdBwdChained).
      - "Integration*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: one bundle case per operation for rapid signal"
    test_patterns:
      # One case per op, named exactly. These are sweep-case ids taken from
      # integration-test-bundles/quick/<Op>/Default/sweep.json (and the SDPA
      # single-graph bundle path); regenerating a sweep can rename them, in
      # which case this tier silently shrinks. Verify with:
      #   ctest -L ffm-quick -N
      - "quick_ConvolutionFwd_Default.1_16_16_16_bfp16_nchw_dil1x1_postpad0x0_prepad0x0"
      - "quick_BatchnormInference_Default.1_3_224_fp32_ncl"
      - "quick_Pointwise_Default.2_4_8_8_fp16_nchw"
      - "quick_Reduction_Default.1_16_8_8_bfp16_nchw_modeadd"
      - "quick_RMSNorm_Default.2_3_4_4_bfp16_nchw_bcd247"
      # Layernorm had no entry here at all, so the op had no fast-feedback
      # signal; this is the smallest quick-tier layernorm bundle case.
      - "quick_Layernorm_Default.2_2_3_2_bfp16_nhwc_normalized_dim_count1_6d6330"
      - "quick_SdpaFwd_bhsd_bf16_hd128_nomask_batch_Small.Small"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# category_timeouts are CTest kill limits, set to 2x the tier's runtime budget
# (quick ~5 min, standard ~30 min incl. quick, comprehensive <= 60 min incl.
# quick+standard; full has no budget) so a budget overrun is a failure to
# investigate while ordinary run-to-run variance does not trip the timeout.
execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    # Interim workaround: Windows runners show high runtime variance and
    # intermittently exceed 5 minutes on "quick" tests. Revert once per-OS
    # timeouts (or the underlying flakiness) are resolved; tracked in
    # https://github.com/ROCm/rocm-libraries/issues/6864.
    quick: 1200
    standard: 3600
    comprehensive: 7200
    full: 28800
    ffm-quick: 7200  # 2 hours
