#
# miopen-provider external integration Test Categories Configuration.
#
# This file is applied to hipdnn_integration_tests when it is run against the
# miopen provider plugin. These patterns match hipdnn_integration_tests GTest
# names, not miopen_plugin_tests names.

_common_excludes: &common_excludes
  - "*DISABLED*"

test_categories:
  quick:
    description: "Fast external integration coverage: quick-tier bundle sweeps plus always-built C++ tests"
    test_patterns:
      # "quick_*" matches the bundle suites, whose names mirror the on-disk
      # tier directory (integration-test-bundles/quick/...); bundles are the CI
      # driver. "Smoke/*" (slash) matches the C++ parameterised suites. Most of
      # those are graph tests that no longer build by default — see
      # BUILD_CPP_GRAPH_TESTS in
      # dnn-providers/integration-tests/src/integration-tests/CMakeLists.txt —
      # but "Smoke/*" is not dead: the always-built non-graph tests
      # (Smoke/IntegrationConvFwdSerializeRoundTripFp32,
      # Smoke/IntegrationGpuResampleForward*) still register under it. It also
      # picks the graph tests back up on a -DBUILD_CPP_GRAPH_TESTS=ON branch.
      # GTest treats '/' and '_' as literal chars, so both patterns are needed.
      - "quick_*"
      - "Smoke/*"
    exclude: *common_excludes
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Standard external integration coverage: quick coverage plus standard-tier bundles"
    test_patterns:
      - "quick_*"
      - "standard_*"
      - "Smoke/*"
    exclude: *common_excludes
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete external integration coverage"
    test_patterns:
      - "*"
    exclude: *common_excludes
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier: one bundle case per operation for rapid signal"
    test_patterns:
      # One case per op, named exactly. These are sweep-case ids taken from
      # integration-test-bundles/quick/<Op>/Default/sweep.json (and the SDPA
      # single-graph bundle path); regenerating a sweep can rename them, in
      # which case this tier silently shrinks. Verify with:
      #   ctest -L ffm-quick -N
      - "quick_ConvolutionFwd_Default.1_16_16_16_bfp16_nchw_dil1x1_postpad0x0_prepad0x0"
      - "quick_BatchnormInference_Default.1_3_224_bfp16_ncl"
      - "quick_Pointwise_Default.2_4_8_8_fp16_nchw"
      - "quick_Reduction_Default.1_16_8_8_bfp16_nchw_modeadd"
      - "quick_RMSNorm_Default.2_16_8_8_bfp16_nchw_772637"
      - "quick_SdpaFwd_bhsd_bf16_hd128_nomask_batch_Small.Small"
    exclude: *common_excludes
    labels:
      - "ffm-quick"
      - "ffm-full"

# GPU-arch-specific exclusions. `"*"` means "this whole suite does not run on
# gfx110X Windows"; the shared parser emits the suite with CTest's DISABLED
# property rather than a gtest filter, so the binary is never launched.
#
# Rationale, inherited by analogy rather than directly: TheRock's legacy
# test_miopenprovider.py carved gfx110X Windows out with
#
#     # TODO(#3709): Re-enable gfx110X tests once issues are resolved
#     "gfx110X-all": {"windows": ["miopen_plugin_integration_tests"]},
#
# That entry names miopen_plugin_integration_tests, a different binary from
# the hipdnn_integration_tests this file governs. The sibling
# test_categories.yaml is the direct port of it (pattern "*Integration*",
# scoping the carve-out to the integration binary because its categories match
# both binaries). This file's categories match only hipdnn_integration_tests,
# so `"*"` is the whole target.
#
# ROCm/TheRock#3709 is a *timeout* on the Windows gfx110X runner, not a
# correctness failure, and it is still open. No failure list was ever recorded
# for hipdnn_integration_tests specifically on gfx110X, and this suite has not
# been observed running a case there, so the carve-out is retained rather than
# narrowed. Re-enabling needs real signal from a Windows gfx110X runner.
exclude_gpu:
  exclude_gpu_gfx110X_windows:
    test_patterns:
      - "*"
    labels:
      - "quick"
      - "standard"
      - "comprehensive"
      - "full"
      - "ffm-quick"
      - "ex_gpu_gfx110X"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    # Interim workaround: Windows runners show high runtime variance and
    # intermittently exceed 5 minutes on "quick" tests. Revert once per-OS
    # timeouts (or the underlying flakiness) are resolved; tracked in
    # https://github.com/ROCm/rocm-libraries/issues/6864.
    quick: 1200
    standard: 2700
    comprehensive: 25200
    full: 28800
    ffm-quick: 7200  # 2 hours
