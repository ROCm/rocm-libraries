rtol = 1e-4

# Conv dgrad numerical floor, calibrated on gfx90a and gfx942 from the conv-dgrad test
# plan run (docs/test-plans/convolution-bwd.md). The only dgrad oracle is the CPU
# reference, which sums in a different order, so the absolute error grows with the
# accumulation length A = K/G x (filter taps that reach one dx element). The defaults
# (fp32 8.5e-6, fp16 and bf16 2e-2) sit below that floor. Worst absolute error of the
# cases that failed at the defaults (gfx90a / gfx942):
#   A           fp32               fp16               bf16
#   <= 288      1.9e-5 / 1.2e-5    8.4e-2 / 2.2e-2    4.6e-2 / 9.4e-2
#   289-1152    5.1e-5 / 5.1e-5    1.6e-1 / 3.9e-2    1.3e-1 / 2.5e-1
#   1153-4608   2.3e-4 / 2.3e-4    2.9e-1 / 9.2e-2    2.5e-1 / 3.8e-1
#   > 4608      7.4e-4 / 7.1e-4    4.2e-1 / 4.2e-2    2.6e-1 / 4.4e-1
# gfx90a fp16 errors are the size of bf16 errors and three to ten times gfx942's, so the
# fp16 classes are set by gfx90a. Each class takes about 2x its observed maximum. A case
# takes the class of its plan item's largest A; L, M, H, X, A and R start at the second
# class. Later entries win.
[[tolerance_overrides]]
filters = ["*_ConvolutionBwd*.*_fp32_*"]
atol = 4e-5
rtol = 1e-4

