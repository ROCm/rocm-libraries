rtol = 1e-5

# X4 fp16 (2D, C 2048, 3x3: accumulation length 18,432). MIOpen's fp16 output varies
# from run to run at this length, by up to 0.17 against the GPU reference (one element
# of 12,544 above the default 0.1 in some runs). Interim class until the dynamic fp16
# tolerance replaces the fixed one (ALMIOPEN-3187).
[[tolerance_overrides]]
filters = ["*_ConvolutionFwd*.x4_*_fp16_*"]
atol = 0.2
rtol = 0.1

# Conv dgrad numerical floor, calibrated on gfx90a and gfx942 from the conv-dgrad test
# plan run (docs/test-plans/convolution-bwd.md). The dgrad oracle is the GPU reference
# (the CPU reference when it declines); both sum in a different order than MIOpen, so
# the absolute error grows with the accumulation length A = K/G x (filter taps that
# reach one dx element). The defaults (fp32 8.5e-6, fp16 and bf16 2e-2) sit below that
# floor. Worst absolute error against the GPU reference of the cases that failed at the
# defaults (gfx90a / gfx942); the CPU reference gave the same numbers within 20%:
#   A           fp32               fp16               bf16
#   <= 288      1.9e-5 / 1.1e-5    8.4e-2 / 2.2e-2    4.3e-2 / 7.8e-2
#   289-1152    5.3e-5 / 5.3e-5    1.6e-1 / 3.9e-2    1.2e-1 / 2.2e-1
#   1153-4608   2.3e-4 / 2.3e-4    2.9e-1 / 9.2e-2    2.5e-1 / 3.8e-1
#   > 4608      7.3e-4 / 7.0e-4    4.2e-1 / 3.9e-2    2.6e-1 / 3.8e-1
# gfx90a fp16 errors are the size of bf16 errors and three to ten times gfx942's, so the
# fp16 classes are set by gfx90a. Each class takes about 2x its observed maximum. A case
# takes the class of its plan item's largest A (the item is the lowercase prefix of the
# case id); L, M, H, X, A and R start at the second class. fp32 cases of the smallest
# class pass at the default and have no entry; the first fp16 and bf16 entries apply to
# every case of that type. Later entries win.
[[tolerance_overrides]]
filters = [
    "*_ConvolutionBwd*.l*_fp32_*",
    "*_ConvolutionBwd*.m*_fp32_*",
    "*_ConvolutionBwd*.h*_fp32_*",
    "*_ConvolutionBwd*.x*_fp32_*",
    "*_ConvolutionBwd*.a*_fp32_*",
    "*_ConvolutionBwd*.r*_fp32_*",
    "*_ConvolutionBwd*.s2_*_fp32_*",
    "*_ConvolutionBwd*.s3_*_fp32_*",
    "*_ConvolutionBwd*.s6_*_fp32_*",
    "*_ConvolutionBwd*.s7_*_fp32_*",
    "*_ConvolutionBwd*.s9_*_fp32_*",
    "*_ConvolutionBwd*.s15_*_fp32_*",
    "*_ConvolutionBwd*.s16c_*_fp32_*",
    "*_ConvolutionBwd*.s26_*_fp32_*",
    "*_ConvolutionBwd*.s30_*_fp32_*",
    "*_ConvolutionBwd*.s32_*_fp32_*",
    "*_ConvolutionBwd*.s38_*_fp32_*",
    "*_ConvolutionBwd*.s49_*_fp32_*",
    "*_ConvolutionBwd*.s67_*_fp32_*",
    "*_ConvolutionBwd*.s74_*_fp32_*",
]
atol = 1.25e-4
rtol = 1e-4

