# MatmulPointwise Variant3 bf16 swish — single-element ULP mismatch at
# magnitude ~2.0 (diff=3.125e-2, one bf16 ULP). Default atol=0.01 is
# tighter than bf16 precision allows at this magnitude.
[[tolerance_overrides]]
