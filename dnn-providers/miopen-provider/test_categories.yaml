#
# miopen-provider Test Categories Configuration
# Aligned with Test Filter Standardization (RFC0010).
#
# miopen-provider has two GTest binaries (miopen_plugin_tests and
# miopen_plugin_integration_tests) that share this YAML. CI can invoke the
# generated CTest file without a label filter, so each enabled category becomes
# a separate binary execution. Because the tiers are cumulative (see below),
# invoking multiple tiers in one run re-executes the lower-tier tests; select a
# single tier label to run exactly that tier's coverage.
# See https://github.com/ROCm/rocm-libraries/issues/8852 for background on the
# category execution model.
# Tier behaviour (cumulative — each tier is a superset of the ones below it):
#   - quick: run non-Full tests only.
#   - standard: quick coverage (quick tests). No distinct Standard* prefix
#     exists, so standard runs the same non-Full tests as quick.
#   - comprehensive: standard + quick coverage. No distinct Comprehensive*
#     prefix exists, so comprehensive runs the same non-Full tests as standard.
#   - full: all tests (non-Full + Full* parameterised expansions), excluding
#     only disabled tests.
#
# Unit tests in tests/ use INSTANTIATE_TEST_SUITE_P prefixes "AllCases" and
# bare TEST/TEST_F; integration tests in integration_tests/ use "Smoke" and
# "Full" prefixes. There are no Standard*/Comprehensive* prefixes, so the
# standard and comprehensive tiers reuse the quick (non-Full) pattern set and
# full is the union of every tier.
#
# These categories apply to miopen_plugin_tests and miopen_plugin_integration_tests.
# External hipdnn_integration_tests suites use test_categories_integration.yaml
# because they have different GTest naming conventions.
test_categories:
  quick:
    description: "Fast sanity checks (target: < 5 min) - excludes Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "quick"
      - "pre-commit"
      - "smoke"

  standard:
    description: "Pre-checkin validation (cumulative: runs quick coverage) - excludes Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "standard"
      - "pr"
      - "precheckin"

  comprehensive:
    description: "Nightly comprehensive validation (cumulative: runs standard + quick coverage) - excludes Full* parameterised expansions"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "comprehensive"
      - "nightly"
      - "extended"

  full:
    description: "Complete suite (cumulative: runs all tests, non-Full + Full*) - excludes only disabled tests"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
    labels:
      - "full"
      - "all"

  ffm-quick:
    description: "Fast-feedback mechanism (FFM) quick tier - currently mirrors the quick tier"
    test_patterns:
      - "*"
    exclude:
      - "*DISABLED*"
      - "Full*"
    labels:
      - "ffm-quick"
      - "ffm-full"

execution_settings:
  default_timeout: 300
  timeout_multiplier: 1
  category_timeouts:
    quick: 300            # 5 minutes
    standard: 2700        # 45 minutes
    comprehensive: 25200  # 7 hours
    full: 28800           # 8 hours
    ffm-quick: 7200       # 2 hours
