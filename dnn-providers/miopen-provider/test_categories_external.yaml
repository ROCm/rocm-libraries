#
# miopen-provider CTest Categories (RFC0010).
#
# miopen-provider's GTest binaries are categorised by the GTest-filtered
# categories in test_categories.yaml. This file labels the *pre-registered*
# (non-GTest) CTest tests that share this provider's check targets.
#
# These are:
#   - the generated <project>_test_name_validation meta-test (see
#     dnn-providers/cmake/Tests.cmake _create_test_name_validation_target_internal)
#   - the external integration lane's --benchmark-reference smoke, which runs a
#     few bundle tests with reference timing on and checks that a verified
#     measurement is reported (see BENCHMARK_REFERENCE_SMOKE_FILTER in
#     HipdnnIntegrationTestHelpers.cmake)
# Without an entry here a pre-registered test carries no labels and is never
# selected by `ctest -L <tier>`, so it silently drops out of every check target.
# Label them into the quick tier; the shared parser's tier cascade
# (quick -> quick, standard, comprehensive, full) then runs them in every
# cumulative check target, matching the pre-YAML behaviour where the validation
# test carried the quick label.
#
# The patterns are exact CTest test names, so they never match the
# external-integration-check target, which is categorised separately via
# test_categories_integration.yaml.
test_categories:
  quick:
    description: "Pre-registered CTest checks (test-name validation, reference-timing smoke)"
    test_patterns:
      - "miopen-provider_test_name_validation"
      - "miopen-provider-external-integration-check-benchmark-reference-smoke"
    labels:
      - "quick"
      - "pre-commit"
